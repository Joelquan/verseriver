<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>The Tabernacle</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#14110d; --panel:#201b14; --panel2:#2a2418;
    --gold:#C9A84C; --gold-dim:#7d6a30; --parch:#e8dcc0; --danger:#b0483a; --green:#7d8a50;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:var(--ink);color:var(--parch);font-family:'Cormorant Garamond',serif;overflow:hidden}
  #app{display:flex;flex-direction:column;height:100%;max-width:820px;margin:0 auto}
  header{padding:12px 16px 8px;text-align:center;border-bottom:1px solid var(--gold-dim)}
  header h1{font-family:'Cinzel',serif;font-size:16px;letter-spacing:.28em;color:var(--gold)}
  header p{font-size:14px;font-style:italic;opacity:.7;margin-top:2px}
  #hud{display:flex;justify-content:space-between;align-items:center;padding:8px 16px;background:var(--panel);border-bottom:1px solid #383021;font-size:14px}
  #hud .h{font-family:'Cinzel',serif;letter-spacing:.1em;font-size:12px;color:var(--gold)}
  #strikes span{display:inline-block;width:11px;height:11px;border:1px solid var(--gold-dim);border-radius:50%;margin-left:5px;vertical-align:middle}
  #strikes span.x{background:var(--danger);border-color:var(--danger)}
  #stage{position:relative;flex:1;display:flex;flex-direction:column;min-height:0;overflow-y:auto}
  #qwrap{padding:16px 20px 6px;text-align:center}
  #namecard{display:inline-block;min-width:230px;max-width:92%;background:var(--panel2);border:1px solid var(--gold);border-radius:4px;padding:14px 20px}
  #namecard .k{font-family:'Cinzel',serif;font-size:11px;letter-spacing:.22em;color:var(--gold);opacity:.85}
  #namecard .ic{margin:8px auto 2px;width:56px;height:56px}
  #namecard .ic svg{width:100%;height:100%;stroke:var(--gold);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  #namecard .n{font-size:22px;font-weight:600;margin-top:4px}
  #diff{display:inline-block;margin-top:8px;font-family:'Cinzel',serif;font-size:10px;letter-spacing:.14em;padding:2px 10px;border:1px solid var(--gold-dim);border-radius:10px;color:var(--gold);opacity:.8}
  #qtitle{font-size:16px;font-style:italic;opacity:.8;margin:12px 0 8px}
  #opts{padding:0 18px 20px;display:flex;flex-direction:column;gap:9px}
  .opt{background:var(--panel2);border:1px solid var(--gold-dim);border-radius:4px;padding:12px 16px;font-family:'Cormorant Garamond',serif;font-size:16.5px;line-height:1.3;color:var(--parch);text-align:left;cursor:pointer}
  .opt b{font-family:'Cinzel',serif;font-size:10px;letter-spacing:.1em;color:var(--gold);display:block;margin-bottom:2px;opacity:.85}
  .opt:active{border-color:var(--gold)}
  .opt.correct{border-color:var(--green);background:rgba(125,138,80,.18)}
  .opt.wrong{border-color:var(--danger);background:rgba(176,72,58,.18)}

  .screen{position:absolute;inset:0;background:rgba(16,13,10,.97);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:26px;z-index:30;overflow-y:auto}
  .screen h2{font-family:'Cinzel',serif;color:var(--gold);font-size:21px;letter-spacing:.14em;margin-bottom:10px}
  .screen p{font-size:18px;max-width:440px;line-height:1.4;margin-bottom:6px}
  .screen .verse{font-style:italic;color:var(--gold);margin:12px 0 4px;max-width:420px}
  .screen .ref{font-family:'Cinzel',serif;font-size:12px;letter-spacing:.16em;opacity:.75;margin-bottom:8px}
  .screen button{font-family:'Cinzel',serif;letter-spacing:.16em;font-size:14px;padding:11px 28px;margin-top:12px;background:none;border:1px solid var(--gold);color:var(--gold);border-radius:2px;cursor:pointer}
  .screen button:active{background:var(--gold);color:var(--ink)}
  .fail h2{color:var(--danger)}
  .small{font-size:13.5px !important;opacity:.6}

  .setuprow{margin:14px 0}
  .setuprow .lbl{font-family:'Cinzel',serif;font-size:11px;letter-spacing:.16em;color:var(--gold);margin-bottom:8px}
  .pillrow{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;max-width:440px}
  .pill{font-family:'Cinzel',serif;font-size:13px;letter-spacing:.04em;padding:8px 14px;border:1px solid var(--gold-dim);border-radius:16px;color:var(--parch);cursor:pointer;background:none}
  .pill.sel{border-color:var(--gold);background:rgba(201,168,76,.18);color:var(--gold)}
</style>
</head>
<body>
<div id="app">
  <header><h1>THE TABERNACLE</h1><p>Its vessels, its materials, its servants, its words.</p></header>
  <div id="hud">
    <div><span class="h">PROGRESS</span> <span id="placed">0 / 0</span></div>
    <div id="strikes"><span class="h">STRIKES</span><span></span><span></span><span></span></div>
  </div>
  <div id="stage">
    <div class="screen" id="setup"></div>
    <div id="qwrap" style="display:none">
      <div id="namecard">
        <div class="k" id="kicker">THE FURNISHING</div>
        <div class="ic" id="icon"></div>
        <div class="n" id="qname">—</div>
        <div id="diff">DIFFICULTY 1</div>
      </div>
      <div id="qtitle">In which chamber does it stand?</div>
    </div>
    <div id="opts"></div>
  </div>
</div>

<script>
"use strict";
const $=id=>document.getElementById(id);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const sample=(arr,n)=>shuffle(arr).slice(0,n);

const CHAMBERS=["Outer Court","Holy Place","Most Holy Place"];
const SERVANTS=["The Priests (Aaron's sons)","The High Priest Alone","The Levites (carried it only, and never served within)"];
const OPT_COUNT_BY_DIFF={1:3,2:4,3:5};

const ICONS={
 altar:`<svg viewBox="0 0 48 48"><rect x="10" y="20" width="28" height="16" rx="2"/><path d="M10 20l3-8h22l3 8"/><path d="M8 12l4 4M40 12l-4 4M8 8l3 3M40 8l-3 3"/></svg>`,
 laver:`<svg viewBox="0 0 48 48"><path d="M12 20a12 8 0 0 0 24 0"/><path d="M12 20v6a12 8 0 0 0 24 0v-6"/><path d="M24 34v6"/><path d="M16 40h16"/></svg>`,
 table:`<svg viewBox="0 0 48 48"><rect x="8" y="16" width="32" height="6" rx="1"/><path d="M12 22v14M36 22v14"/><circle cx="17" cy="12" r="2.4"/><circle cx="24" cy="10" r="2.4"/><circle cx="31" cy="12" r="2.4"/></svg>`,
 vessel:`<svg viewBox="0 0 48 48"><ellipse cx="18" cy="18" rx="6" ry="3"/><path d="M12 18v6a6 3 0 0 0 12 0v-6"/><rect x="30" y="14" width="4" height="16"/><ellipse cx="38" cy="16" rx="5" ry="2.5"/></svg>`,
 lamp:`<svg viewBox="0 0 48 48"><path d="M24 40V22"/><path d="M24 26q-10 0-14-11 11-1 14 11z"/><path d="M24 22q10-1 13-12-11 0-13 12z"/><ellipse cx="24" cy="12" rx="3.5" ry="4.5"/><ellipse cx="10" cy="16" rx="3" ry="3.8"/><ellipse cx="38" cy="16" rx="3" ry="3.8"/></svg>`,
 snuffer:`<svg viewBox="0 0 48 48"><path d="M14 14l10 10M34 14L24 24"/><path d="M12 12l4 4M32 12l4 4"/><rect x="18" y="26" width="12" height="8" rx="1.5"/></svg>`,
 incense:`<svg viewBox="0 0 48 48"><rect x="15" y="24" width="18" height="12" rx="2"/><path d="M15 24l2-6h14l2 6"/><path d="M20 12q2 4 0 6M24 10q2 5 0 8M28 12q2 4 0 6" opacity=".8"/></svg>`,
 ark:`<svg viewBox="0 0 48 48"><rect x="10" y="20" width="28" height="14" rx="1"/><path d="M10 20q14-8 28 0"/><path d="M14 20v-3M34 20v-3"/><path d="M8 34h32"/></svg>`,
 mercyseat:`<svg viewBox="0 0 48 48"><rect x="12" y="26" width="24" height="6" rx="1"/><path d="M14 26q4-12 10-12M34 26q-4-12-10-12"/><path d="M10 20q4-2 6 2M38 20q-4-2-6 2"/></svg>`,
 scroll:`<svg viewBox="0 0 48 48"><rect x="14" y="8" width="20" height="28" rx="2"/><path d="M14 14h20M14 20h20M14 26h14"/><circle cx="12" cy="8" r="3"/><circle cx="12" cy="36" r="3"/></svg>`,
 veil:`<svg viewBox="0 0 48 48"><path d="M8 8v32M40 8v32"/><path d="M8 8q8 6 8 16t-8 16"/><path d="M40 8q-8 6-8 16t8 16"/><path d="M16 22l6-3M32 22l-6-3" stroke-dasharray="2 3"/></svg>`,
 plank:`<svg viewBox="0 0 48 48"><rect x="16" y="6" width="16" height="36" rx="1"/><path d="M16 14h16M16 22h16M16 30h16"/></svg>`,
 ingot:`<svg viewBox="0 0 48 48"><path d="M10 18h28l-4 16H14z"/><path d="M10 18l4-6h20l4 6"/></svg>`,
 cloth:`<svg viewBox="0 0 48 48"><path d="M6 14q6-4 8 0t8 0 8 0 8 0 4-2v22q-4 2-8 0t-8 0-8 0-8 0-4 2z"/></svg>`,
 hide:`<svg viewBox="0 0 48 48"><path d="M24 6q10 2 12 12 4 2 4 8-3 6-9 5-1 6-7 9-6-3-7-9-6 1-9-5 0-6 4-8 2-10 12-12z"/></svg>`,
 gem:`<svg viewBox="0 0 48 48"><path d="M14 16h20l6 8-16 18-16-18z"/><path d="M14 16l10 8 10-8M18 24l6 18M30 24l-6 18"/></svg>`,
 jar:`<svg viewBox="0 0 48 48"><path d="M18 8h12v6l4 4v22a2 2 0 0 1-2 2H16a2 2 0 0 1-2-2V18l4-4z"/><path d="M18 8v-2h12v2"/></svg>`,
};

const FURNITURE=[
 {n:"The Altar of Burnt Offering",ic:"altar",d:1,
   chamber:"Outer Court", servant:"The Priests (Aaron's sons)",
   activity:"Daily burnt offerings and sin offerings were made here",
   verseText:"Thou shalt make an altar of shittim wood: the altar shall be foursquare.",
   ref:"Exodus 27:1"},
 {n:"The Bronze Laver",ic:"laver",d:2,
   chamber:"Outer Court", servant:"The Priests (Aaron's sons)",
   activity:"Hands and feet were washed here before ministering",
   verseText:"Thou shalt also make a laver of brass, and his foot also of brass, to wash withal.",
   ref:"Exodus 30:18"},
 {n:"The Table of Shewbread",ic:"table",d:2,
   chamber:"Holy Place", servant:"The Priests (Aaron's sons)",
   activity:"Twelve loaves were set out continually and renewed every Sabbath",
   verseText:"Thou shalt also make a table of shittim wood: two cubits shall be the length thereof.",
   ref:"Exodus 25:23"},
 {n:"The Dishes, Spoons & Bowls of the Table",ic:"vessel",d:3,
   chamber:"Holy Place", servant:"The Priests (Aaron's sons)",
   activity:"Used to serve the bread and to pour out drink offerings",
   verseText:"Thou shalt make the dishes thereof, and spoons thereof, and covers thereof, and bowls thereof, to cover withal.",
   ref:"Exodus 25:29"},
 {n:"The Golden Lampstand",ic:"lamp",d:1,
   chamber:"Holy Place", servant:"The Priests (Aaron's sons)",
   activity:"Lamps were trimmed and kept burning continually from evening to morning",
   verseText:"Thou shalt make a candlestick of pure gold: of beaten work shall it be made.",
   ref:"Exodus 25:31"},
 {n:"The Snuffers & Snuffdishes",ic:"snuffer",d:3,
   chamber:"Holy Place", servant:"The Priests (Aaron's sons)",
   activity:"Used of pure gold to trim the lamps of the lampstand",
   verseText:"And the tongs thereof, and the snuffdishes thereof, shall be of pure gold.",
   ref:"Exodus 25:38"},
 {n:"The Altar of Incense",ic:"incense",d:3,
   chamber:"Holy Place", servant:"The Priests (Aaron's sons)",
   activity:"Sweet incense was burned upon it every morning and every evening",
   verseText:"Thou shalt make an altar to burn incense upon: of shittim wood shalt thou make it.",
   ref:"Exodus 30:1"},
 {n:"The Ark of the Covenant",ic:"ark",d:1,
   chamber:"Most Holy Place", servant:"The High Priest Alone",
   activity:"Approached only once a year, on the Day of Atonement",
   verseText:"They shall make an ark of shittim wood: two cubits and a half shall be the length thereof.",
   ref:"Exodus 25:10"},
 {n:"The Mercy Seat",ic:"mercyseat",d:2,
   chamber:"Most Holy Place", servant:"The High Priest Alone",
   activity:"Blood was sprinkled here for the atonement of the people",
   verseText:"Thou shalt make a mercy seat of pure gold: two cubits and a half shall be the length thereof.",
   ref:"Exodus 25:17"},
 {n:"What the Ark Held Within",ic:"scroll",d:3,
   chamber:"Most Holy Place", servant:"The High Priest Alone",
   activity:"Held the tablets of the covenant, a golden pot of manna, and Aaron's rod that budded",
   verseText:"Wherein was the golden pot that had manna, and Aaron's rod that budded, and the tables of the covenant.",
   ref:"Hebrews 9:4"},
 {n:"The Veil",ic:"veil",d:3,
   chamber:"Most Holy Place", servant:"The High Priest Alone",
   activity:"Was torn in two, from top to bottom, at the death of Christ",
   verseText:"And, behold, the veil of the temple was rent in twain from the top to the bottom.",
   ref:"Matthew 27:51"},
];
FURNITURE.forEach(f=>f.type='furniture');

const MATERIALS=[
 {n:"Shittim (Acacia) Wood",ic:"plank",d:1,
   use:"The wood used to build the ark, the altars, the table, and the boards of the tabernacle itself",
   verseText:"They shall make an ark of shittim wood.",
   ref:"Exodus 25:10"},
 {n:"Gold",ic:"ingot",d:1,
   use:"Used to overlay the ark, the table, the lampstand, and the altar of incense",
   verseText:"Thou shalt overlay it with pure gold, within and without shalt thou overlay it.",
   ref:"Exodus 25:11"},
 {n:"Silver",ic:"ingot",d:2,
   use:"Used for the sockets that held the boards of the tabernacle upright",
   verseText:"Thou shalt make forty sockets of silver under the twenty boards.",
   ref:"Exodus 26:19"},
 {n:"Brass (Bronze)",ic:"ingot",d:2,
   use:"Used for the altar of burnt offering, the laver, and the sockets of the court",
   verseText:"Thou shalt overlay the altar with brass.",
   ref:"Exodus 27:2"},
 {n:"Fine Twined Linen (blue, purple & scarlet)",ic:"cloth",d:2,
   use:"Woven into the inner curtains of the tabernacle and into the veil",
   verseText:"Thou shalt make the tabernacle with ten curtains of fine twined linen, and blue, and purple, and scarlet.",
   ref:"Exodus 26:1"},
 {n:"Goats' Hair",ic:"cloth",d:3,
   use:"Woven into curtains to cover the tabernacle over the linen curtains",
   verseText:"Thou shalt make curtains of goats' hair to be a covering upon the tabernacle.",
   ref:"Exodus 26:7"},
 {n:"Rams' Skins Dyed Red",ic:"hide",d:3,
   use:"Used as a covering over the goats' hair curtains",
   verseText:"Thou shalt make a covering for the tent of rams' skins dyed red.",
   ref:"Exodus 26:14"},
 {n:"Badgers' Skins",ic:"hide",d:3,
   use:"Used as the outermost covering over the whole tabernacle",
   verseText:"And a covering above of badgers' skins.",
   ref:"Exodus 26:14"},
 {n:"Onyx Stones",ic:"gem",d:3,
   use:"Set in gold and engraved with the names of the tribes, worn on the high priest's shoulders",
   verseText:"Thou shalt take two onyx stones, and grave on them the names of the children of Israel.",
   ref:"Exodus 28:9"},
 {n:"Oil for the Light",ic:"jar",d:2,
   use:"Pure beaten olive oil, used to keep the lampstand burning continually",
   verseText:"Pure oil olive beaten for the light, to cause the lamp to burn always.",
   ref:"Exodus 27:20"},
 {n:"Spices for the Anointing Oil",ic:"jar",d:3,
   use:"Myrrh, cinnamon, calamus, and cassia, compounded into a holy anointing oil",
   verseText:"Take thou also unto thee principal spices, and thou shalt make it an oil of holy ointment.",
   ref:"Exodus 30:23"},
 {n:"Spices for the Incense",ic:"incense",d:3,
   use:"Stacte, onycha, galbanum, and frankincense, compounded for sweet incense",
   verseText:"Take unto thee sweet spices, a perfume, tempered together, pure and holy.",
   ref:"Exodus 30:34"},
];
MATERIALS.forEach(m=>m.type='material');

const ROSTER=[...FURNITURE,...MATERIALS];

let pool=[],deck=[],cur=null,idx=0,strikes=0,stage=0;
let chosenDiff='mix', chosenCount=5;
let chosenSet='all';

function poolFor(diff,set){
  let p=ROSTER;
  if(set==='furniture')p=FURNITURE;
  else if(set==='materials')p=MATERIALS;
  if(diff==='mix')return p;
  return p.filter(r=>r.d==Number(diff));
}
function setupHTML(){
  return `<h2>THE TABERNACLE</h2>
    <p>Furnishings and the materials that built them — twenty-three things in all. Place each rightly, then seal it with its word.</p>
    <div class="setuprow"><div class="lbl">WHAT TO STUDY</div><div class="pillrow" id="setrow"></div></div>
    <div class="setuprow"><div class="lbl">DIFFICULTY</div><div class="pillrow" id="diffrow"></div></div>
    <div class="setuprow"><div class="lbl">HOW MANY ITEMS</div><div class="pillrow" id="countrow"></div></div>
    <button id="startbtn">BEGIN</button>
    <p class="small">Three strikes and the sanctuary is veiled again. No names given away.</p>`;
}
function buildSetup(){
  const sr=$('setrow');sr.innerHTML='';
  [["all","Both"],["furniture","Furnishings"],["materials","Materials"]].forEach(([val,label])=>{
    const p=document.createElement('button');p.className='pill'+(val===chosenSet?' sel':'');p.textContent=label;
    p.onclick=()=>{chosenSet=val;buildSetup();};
    sr.appendChild(p);
  });
  const dr=$('diffrow');dr.innerHTML='';
  [["1","Difficulty 1"],["2","Difficulty 2"],["3","Difficulty 3"],["mix","Mixed"]].forEach(([val,label])=>{
    const p=document.createElement('button');p.className='pill'+(val===chosenDiff?' sel':'');p.textContent=label;
    p.onclick=()=>{chosenDiff=val;buildSetup();};
    dr.appendChild(p);
  });
  const cr=$('countrow');cr.innerHTML='';
  const maxAvail=poolFor(chosenDiff,chosenSet).length;
  if(chosenCount>maxAvail||chosenCount<1)chosenCount=maxAvail;
  const top=Math.max(5,Math.ceil(maxAvail/5)*5);
  for(let n=5;n<=top;n+=5){
    const val=Math.min(n,maxAvail);
    const p=document.createElement('button');p.className='pill'+(val===chosenCount?' sel':'');
    p.textContent=n>maxAvail?maxAvail+' (all)':n;
    p.onclick=()=>{chosenCount=val;buildSetup();};
    cr.appendChild(p);
    if(n>=maxAvail)break;
  }
}
function initSetupScreen(){
  const s=$('setup');s.className='screen';s.innerHTML=setupHTML();
  buildSetup();
  $('startbtn').onclick=beginGame;
}
function beginGame(){
  pool=poolFor(chosenDiff,chosenSet);
  const n=Math.min(chosenCount,pool.length);
  deck=sample(pool,n);idx=0;strikes=0;
  $('setup').style.display='none';
  $('qwrap').style.display='block';
  updateHUD();nextItem();
}
function updateHUD(){
  $('placed').textContent=idx+' / '+deck.length;
  const dots=$('strikes').querySelectorAll('span:not(.h)');
  dots.forEach((s,i)=>s.className=i<strikes?'x':'');
}
function nextItem(){
  if(idx>=deck.length){win();return;}
  cur=deck[idx];stage=0;
  $('kicker').textContent=cur.type==='furniture'?'THE FURNISHING':'THE MATERIAL';
  $('qname').textContent=cur.n;
  $('icon').innerHTML=ICONS[cur.ic]||'';
  $('diff').textContent='DIFFICULTY '+cur.d;
  if(cur.type==='furniture')askChamber(); else askUse();
}
function renderOpts(options,correctCheck,onPick){
  const wrap=$('opts');wrap.innerHTML='';
  options.forEach(opt=>{
    const b=document.createElement('button');b.className='opt';
    b.innerHTML=opt.html!==undefined?opt.html:opt.label;
    b.onclick=()=>{
      const ok=correctCheck(opt);
      b.classList.add(ok?'correct':'wrong');
      [...wrap.children].forEach(c=>c.disabled=true);
      setTimeout(()=>onPick(ok),550);
    };
    wrap.appendChild(b);
  });
}
function askChamber(){
  $('qtitle').textContent='In which chamber does it stand?';
  const options=shuffle(CHAMBERS).map(c=>({label:c,val:c}));
  renderOpts(options,opt=>opt.val===cur.chamber,ok=>{
    if(ok){stage=1;askServant();} else strike('That is not where it stood.');
  });
}
function askServant(){
  $('qtitle').textContent='Who ministered here?';
  const options=shuffle(SERVANTS).map(s=>({label:s,val:s}));
  renderOpts(options,opt=>opt.val===cur.servant,ok=>{
    if(ok){stage=2;askActivity();} else strike('That is not who served at this furnishing.');
  });
}
function askActivity(){
  $('qtitle').textContent='What took place here?';
  const nWrong=(OPT_COUNT_BY_DIFF[cur.d]||4)-1;
  const others=sample(FURNITURE.filter(r=>r.n!==cur.n && r.activity!==cur.activity),nWrong);
  const options=shuffle([{label:cur.activity,val:true},...others.map(o=>({label:o.activity,val:false}))]);
  renderOpts(options,opt=>opt.val===true,ok=>{
    if(ok){stage=3;askVerse();} else strike('That is not what took place here.');
  });
}
function askUse(){
  $('qtitle').textContent='What was it used for?';
  const nWrong=(OPT_COUNT_BY_DIFF[cur.d]||4)-1;
  const others=sample(MATERIALS.filter(r=>r.n!==cur.n && r.use!==cur.use),nWrong);
  const options=shuffle([{label:cur.use,val:true},...others.map(o=>({label:o.use,val:false}))]);
  renderOpts(options,opt=>opt.val===true,ok=>{
    if(ok){stage=1;askVerse();} else strike('That is not what it was used for.');
  });
}
function askVerse(){
  $('qtitle').textContent='Which word of scripture speaks of it?';
  const nWrong=(OPT_COUNT_BY_DIFF[cur.d]||4)-1;
  const others=sample(ROSTER.filter(r=>r.n!==cur.n && r.verseText!==cur.verseText),nWrong);
  const options=shuffle([{html:`<b>${cur.ref}</b>${cur.verseText}`,val:true},
    ...others.map(o=>({html:`<b>${o.ref}</b>${o.verseText}`,val:false}))]);
  renderOpts(options,opt=>opt.val===true,ok=>{
    if(ok){idx++;updateHUD();nextItem();} else strike('That word does not speak of this.');
  });
}
function strike(msg){
  strikes++;updateHUD();
  if(strikes>=3){fail(msg);}
  else{
    $('qtitle').textContent=msg+`  (${3-strikes} ${3-strikes===1?'strike':'strikes'} left — try again)`;
    setTimeout(()=>{
      if(cur.type==='furniture'){
        if(stage===0)askChamber(); else if(stage===1)askServant(); else if(stage===2)askActivity(); else askVerse();
      } else {
        if(stage===0)askUse(); else askVerse();
      }
    },650);
  }
}
function fail(msg){
  const s=$('setup');s.style.display='flex';s.className='screen fail';
  $('qwrap').style.display='none';$('opts').innerHTML='';
  s.innerHTML=`<h2>THE VEIL FALLS AGAIN</h2>
    <p>${msg}</p>
    <p class="small">Three strikes. The furnishings and materials will be drawn afresh.</p>
    <button id="againbtn">BEGIN AGAIN</button>`;
  $('againbtn').onclick=initSetupScreen;
}
function win(){
  const s=$('setup');s.style.display='flex';s.className='screen';
  $('qwrap').style.display='none';$('opts').innerHTML='';
  s.innerHTML=`<h2>A SANCTUARY MADE READY</h2>
    <p>${deck.length} things known rightly — their place, their purpose, and their word.</p>
    <p class="verse">"Let them make me a sanctuary; that I may dwell among them."</p>
    <p class="ref">EXODUS 25:8</p>
    <button id="againbtn">PLAY AGAIN</button>`;
  $('againbtn').onclick=initSetupScreen;
}
initSetupScreen();
</script>
</body>
</html>
