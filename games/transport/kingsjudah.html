<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Kings of Judah</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#14110d; --panel:#201b14; --panel2:#2a2418;
    --gold:#C9A84C; --gold-dim:#7d6a30; --parch:#e8dcc0; --danger:#b0483a; --green:#7d8a50;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:var(--ink);color:var(--parch);font-family:'Cormorant Garamond',serif;overflow:hidden}
  #app{display:flex;flex-direction:column;height:100%;max-width:820px;margin:0 auto}
  header{padding:12px 16px 8px;text-align:center;border-bottom:1px solid var(--gold-dim)}
  header h1{font-family:'Cinzel',serif;font-size:16px;letter-spacing:.28em;color:var(--gold)}
  header p{font-size:14px;font-style:italic;opacity:.7;margin-top:2px}
  #hud{display:flex;justify-content:space-between;align-items:center;padding:8px 16px;background:var(--panel);border-bottom:1px solid #383021;font-size:14px}
  #hud .h{font-family:'Cinzel',serif;letter-spacing:.1em;font-size:12px;color:var(--gold)}
  #strikes span{display:inline-block;width:11px;height:11px;border:1px solid var(--gold-dim);border-radius:50%;margin-left:5px;vertical-align:middle}
  #strikes span.x{background:var(--danger);border-color:var(--danger)}
  #stage{position:relative;flex:1;display:flex;flex-direction:column;min-height:0;overflow-y:auto}
  #qwrap{padding:18px 20px;text-align:center}
  #namecard{display:inline-block;min-width:230px;max-width:92%;background:var(--panel2);border:1px solid var(--gold);border-radius:4px;padding:16px 22px}
  #namecard .k{font-family:'Cinzel',serif;font-size:11px;letter-spacing:.24em;color:var(--gold);opacity:.85}
  #namecard .n{font-size:25px;font-weight:600;margin-top:5px}
  #diff{display:inline-block;margin-top:8px;font-family:'Cinzel',serif;font-size:10px;letter-spacing:.14em;padding:2px 10px;border:1px solid var(--gold-dim);border-radius:10px;color:var(--gold);opacity:.8}
  #qtitle{font-size:16px;font-style:italic;opacity:.8;margin:14px 0 8px}
  #opts{padding:0 18px 20px;display:flex;flex-direction:column;gap:9px}
  .opt{background:var(--panel2);border:1px solid var(--gold-dim);border-radius:4px;padding:12px 16px;font-family:'Cormorant Garamond',serif;font-size:16.5px;line-height:1.3;color:var(--parch);text-align:left;cursor:pointer}
  .opt b{font-family:'Cinzel',serif;font-size:10px;letter-spacing:.1em;color:var(--gold);display:block;margin-bottom:2px;opacity:.85}
  .opt:active{border-color:var(--gold)}
  .opt.correct{border-color:var(--green);background:rgba(125,138,80,.18)}
  .opt.wrong{border-color:var(--danger);background:rgba(176,72,58,.18)}

  .screen{position:absolute;inset:0;background:rgba(16,13,10,.97);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:26px;z-index:30;overflow-y:auto}
  .screen h2{font-family:'Cinzel',serif;color:var(--gold);font-size:20px;letter-spacing:.14em;margin-bottom:10px}
  .screen p{font-size:17px;max-width:460px;line-height:1.4;margin-bottom:6px}
  .screen .verse{font-style:italic;color:var(--gold);margin:12px 0 4px;max-width:420px}
  .screen .ref{font-family:'Cinzel',serif;font-size:12px;letter-spacing:.16em;opacity:.75;margin-bottom:8px}
  .screen button{font-family:'Cinzel',serif;letter-spacing:.16em;font-size:14px;padding:11px 28px;margin-top:12px;background:none;border:1px solid var(--gold);color:var(--gold);border-radius:2px;cursor:pointer}
  .screen button:active{background:var(--gold);color:var(--ink)}
  .fail h2{color:var(--danger)}
  .small{font-size:13px !important;opacity:.6}

  .setuprow{margin:12px 0}
  .setuprow .lbl{font-family:'Cinzel',serif;font-size:11px;letter-spacing:.16em;color:var(--gold);margin-bottom:8px}
  .pillrow{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:460px}
  .pill{font-family:'Cinzel',serif;font-size:12.5px;letter-spacing:.03em;padding:7px 12px;border:1px solid var(--gold-dim);border-radius:16px;color:var(--parch);cursor:pointer;background:none}
  .pill.sel{border-color:var(--gold);background:rgba(201,168,76,.18);color:var(--gold)}
</style>
</head>
<body>
<div id="app">
  <header><h1>KINGS OF JUDAH</h1><p>What the LORD said of each — good, evil, or a mixture of both.</p></header>
  <div id="hud">
    <div><span class="h">PROGRESS</span> <span id="placed">0 / 0</span></div>
    <div id="strikes"><span class="h">STRIKES</span><span></span><span></span><span></span></div>
  </div>
  <div id="stage">
    <div class="screen" id="setup"></div>
    <div id="qwrap" style="display:none">
      <div id="namecard">
        <div class="k">THE KING</div>
        <div class="n" id="qname">—</div>
        <div id="diff">DIFFICULTY 1</div>
      </div>
      <div id="qtitle">What did the LORD say of him?</div>
    </div>
    <div id="opts"></div>
  </div>
</div>

<script>
"use strict";
const $=id=>document.getElementById(id);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const sample=(arr,n)=>shuffle(arr).slice(0,n);
const OPT_COUNT_BY_DIFF={1:3,2:4,3:5};

const VERDICTS=["Did Right in the Sight of the LORD","Did Evil in the Sight of the LORD","Right at First, then Turned — Mixed"];

/* ---------- THE KINGS OF JUDAH — 1-2 Kings, 2 Chronicles (KJV) ---------- */
const ROSTER=[
 {n:"Rehoboam",d:1,verdict:1,
   deed:"Forsook the law of the LORD, allowing idolatry and shrine prostitution to spread through Judah",
   ref:"2 Chronicles 12:14",v:"He did evil, because he prepared not his heart to seek the LORD."},
 {n:"Abijah (Abijam)",d:3,verdict:1,
   deed:"Walked in his father's sins, though he called on the LORD for victory in battle against Jeroboam",
   ref:"1 Kings 15:3",v:"He walked in all the sins of his father... and his heart was not perfect with the LORD his God, as the heart of David his father."},
 {n:"Asa",d:2,verdict:0,
   deed:"Removed the idols his father had made and deposed his grandmother for her idolatry — yet in old age relied on Syria rather than the LORD",
   ref:"1 Kings 15:11",v:"Asa did that which was right in the eyes of the LORD, as did David his father."},
 {n:"Jehoshaphat",d:2,verdict:0,
   deed:"Sought the LORD and removed idolatry, yet allied by marriage with the wicked house of Ahab",
   ref:"1 Kings 22:43",v:"He walked in all the ways of Asa his father; he turned not aside from it, doing that which was right in the eyes of the LORD."},
 {n:"Jehoram (Joram)",d:3,verdict:1,
   deed:"Married into the house of Ahab, killed all his own brothers, and led Judah into idolatry",
   ref:"2 Kings 8:18",v:"He walked in the way of the kings of Israel, as did the house of Ahab: for the daughter of Ahab was his wife: and he did evil in the sight of the LORD."},
 {n:"Ahaziah",d:3,verdict:1,
   deed:"Allied with the wicked house of Ahab and was struck down among them by Jehu",
   ref:"2 Kings 8:27",v:"He walked in the way of the house of Ahab, and did evil in the sight of the LORD, as did the house of Ahab."},
 {n:"Athaliah",d:1,verdict:1,
   deed:"Seized the throne by destroying the royal seed of David, ruling six years as a usurper before being overthrown",
   ref:"2 Kings 11:1",v:"When Athaliah the mother of Ahaziah saw that her son was dead, she arose and destroyed all the seed royal."},
 {n:"Joash (Jehoash)",d:2,verdict:2,
   deed:"Repaired the temple under the priest Jehoiada's guidance, but after Jehoiada died, forsook the LORD and had the prophet Zechariah stoned",
   ref:"2 Kings 12:2",v:"Jehoash did that which was right in the sight of the LORD all his days wherein Jehoiada the priest instructed him."},
 {n:"Amaziah",d:3,verdict:2,
   deed:"Did right, but not wholeheartedly — the high places remained, and he later worshipped the gods of Edom after defeating them",
   ref:"2 Kings 14:3",v:"He did that which was right in the sight of the LORD, yet not like David his father... howbeit the high places were not taken away."},
 {n:"Uzziah (Azariah)",d:2,verdict:2,
   deed:"Prospered greatly and sought God, but in pride entered the temple to burn incense, a priest's role, and was struck with leprosy",
   ref:"2 Kings 15:3",v:"He did that which was right in the sight of the LORD, according to all that his father Amaziah had done."},
 {n:"Jotham",d:3,verdict:0,
   deed:"Did right and built the upper gate of the temple, though the people still sacrificed at the high places",
   ref:"2 Kings 15:34",v:"He did that which was right in the sight of the LORD: he did according to all that his father Uzziah had done."},
 {n:"Ahaz",d:1,verdict:1,
   deed:"Made his own son pass through the fire, sacrificed on the high places, and shut up the doors of the temple",
   ref:"2 Kings 16:2",v:"He did not that which was right in the sight of the LORD his God, like David his father."},
 {n:"Hezekiah",d:1,verdict:0,
   deed:"Removed the high places, broke in pieces the brazen serpent Moses had made, and trusted the LORD during Assyria's invasion",
   ref:"2 Kings 18:3",v:"He did that which was right in the sight of the LORD, according to all that David his father did."},
 {n:"Manasseh",d:1,verdict:1,
   deed:"Rebuilt the high places, made his son pass through fire, practiced witchcraft, and shed very much innocent blood — yet later humbled himself in captivity",
   ref:"2 Kings 21:2",v:"He did that which was evil in the sight of the LORD, after the abominations of the heathen."},
 {n:"Amon",d:3,verdict:1,
   deed:"Walked in all the idolatry of his father, but did not humble himself as his father eventually had",
   ref:"2 Kings 21:20",v:"He did that which was evil in the sight of the LORD, as his father Manasseh did."},
 {n:"Josiah",d:1,verdict:0,
   deed:"Repaired the temple, found the Book of the Law, tore down every high place and idol in the land, and kept the Passover as it had not been kept in generations",
   ref:"2 Kings 22:2",v:"He did that which was right in the sight of the LORD, and walked in all the way of David his father."},
 {n:"Jehoahaz",d:3,verdict:1,
   deed:"Reigned only three months before being deposed and carried off by the king of Egypt",
   ref:"2 Kings 23:32",v:"He did that which was evil in the sight of the LORD, according to all that his fathers had done."},
 {n:"Jehoiakim",d:2,verdict:1,
   deed:"Burned the scroll of the prophet's warning in the fire, piece by piece, as it was read to him",
   ref:"2 Kings 23:37",v:"He did that which was evil in the sight of the LORD, according to all that his fathers had done."},
 {n:"Jehoiachin",d:3,verdict:1,
   deed:"Reigned only three months before being carried captive to Babylon",
   ref:"2 Kings 24:9",v:"He did that which was evil in the sight of the LORD, according to all that his father had done."},
 {n:"Zedekiah",d:2,verdict:1,
   deed:"Rebelled against the king of Babylon and was the last king of Judah before the exile",
   ref:"2 Kings 24:19",v:"He did that which was evil in the sight of the LORD, according to all that Jehoiakim had done."},
];

let deck=[],cur=null,idx=0,strikes=0,stage=0;
let chosenDiff='mix', chosenCount=10;

function poolFor(diff){
  if(diff==='mix')return ROSTER;
  return ROSTER.filter(r=>r.d==Number(diff));
}
function setupHTML(){
  return `<h2>KINGS OF JUDAH</h2>
    <p>Twenty rulers of the southern kingdom, from Rehoboam to Zedekiah. What did the LORD say of each — and why?</p>
    <div class="setuprow"><div class="lbl">DIFFICULTY</div><div class="pillrow" id="diffrow"></div></div>
    <div class="setuprow"><div class="lbl">HOW MANY KINGS</div><div class="pillrow" id="countrow"></div></div>
    <button id="startbtn">BEGIN</button>
    <p class="small">Note: Athaliah was a usurping queen, not a descendant king — included here as the exception she was. Three strikes and the roll resets.</p>`;
}
function buildSetup(){
  const dr=$('diffrow');dr.innerHTML='';
  [["1","Difficulty 1"],["2","Difficulty 2"],["3","Difficulty 3"],["mix","Mixed"]].forEach(([val,label])=>{
    const p=document.createElement('button');p.className='pill'+(val===chosenDiff?' sel':'');p.textContent=label;
    p.onclick=()=>{chosenDiff=val;buildSetup();};
    dr.appendChild(p);
  });
  const cr=$('countrow');cr.innerHTML='';
  const maxAvail=poolFor(chosenDiff).length;
  if(chosenCount>maxAvail||chosenCount<1)chosenCount=maxAvail;
  for(let n=1;n<=maxAvail;n++){
    const p=document.createElement('button');p.className='pill'+(n===chosenCount?' sel':'');
    p.textContent=n;
    p.onclick=()=>{chosenCount=n;buildSetup();};
    cr.appendChild(p);
  }
}
function initSetupScreen(){
  const s=$('setup');s.className='screen';s.innerHTML=setupHTML();
  buildSetup();
  $('startbtn').onclick=beginGame;
}
function beginGame(){
  const pool=poolFor(chosenDiff);
  const n=Math.min(chosenCount,pool.length);
  deck=sample(pool,n);idx=0;strikes=0;
  $('setup').style.display='none';
  $('qwrap').style.display='block';
  updateHUD();nextItem();
}
function updateHUD(){
  $('placed').textContent=idx+' / '+deck.length;
  const dots=$('strikes').querySelectorAll('span:not(.h)');
  dots.forEach((s,i)=>s.className=i<strikes?'x':'');
}
function nextItem(){
  if(idx>=deck.length){win();return;}
  cur=deck[idx];stage=0;
  $('qname').textContent=cur.n;
  $('diff').textContent='DIFFICULTY '+cur.d;
  askVerdict();
}
function renderOpts(options,correctCheck,onPick){
  const wrap=$('opts');wrap.innerHTML='';
  options.forEach(opt=>{
    const b=document.createElement('button');b.className='opt';
    b.innerHTML=opt.html!==undefined?opt.html:opt.label;
    b.onclick=()=>{
      const ok=correctCheck(opt);
      b.classList.add(ok?'correct':'wrong');
      [...wrap.children].forEach(c=>c.disabled=true);
      setTimeout(()=>onPick(ok),550);
    };
    wrap.appendChild(b);
  });
}
function askVerdict(){
  $('qtitle').textContent='What did the LORD say of him?';
  const options=shuffle(VERDICTS.map((v,i)=>({label:v,val:i})));
  renderOpts(options,opt=>opt.val===cur.verdict,ok=>{
    if(ok){stage=1;askDeed();} else strike('That is not the verdict scripture gives him.');
  });
}
function askDeed(){
  $('qtitle').textContent='What is he specifically known for?';
  const nWrong=(OPT_COUNT_BY_DIFF[cur.d]||4)-1;
  const others=sample(ROSTER.filter(r=>r.n!==cur.n),nWrong);
  const options=shuffle([{label:cur.deed,val:true},...others.map(o=>({label:o.deed,val:false}))]);
  renderOpts(options,opt=>opt.val===true,ok=>{
    if(ok){stage=2;askVerse();} else strike('That deed does not belong to him.');
  });
}
function askVerse(){
  $('qtitle').textContent='Which word of scripture says this of him?';
  const nWrong=(OPT_COUNT_BY_DIFF[cur.d]||4)-1;
  const others=sample(ROSTER.filter(r=>r.n!==cur.n && r.v!==cur.v),nWrong);
  const options=shuffle([{html:`<b>${cur.ref}</b>${cur.v}`,val:true},
    ...others.map(o=>({html:`<b>${o.ref}</b>${o.v}`,val:false}))]);
  renderOpts(options,opt=>opt.val===true,ok=>{
    if(ok){idx++;updateHUD();nextItem();} else strike('That word speaks of a different king.');
  });
}
function strike(msg){
  strikes++;updateHUD();
  if(strikes>=3){fail(msg);}
  else{
    $('qtitle').textContent=msg+`  (${3-strikes} ${3-strikes===1?'strike':'strikes'} left — try again)`;
    setTimeout(()=>{ if(stage===0)askVerdict(); else if(stage===1)askDeed(); else askVerse(); },650);
  }
}
function fail(msg){
  const s=$('setup');s.style.display='flex';s.className='screen fail';
  $('qwrap').style.display='none';$('opts').innerHTML='';
  s.innerHTML=`<h2>THE KINGDOM FALLS AGAIN</h2>
    <p>${msg}</p>
    <p class="small">Three strikes. The kings will be drawn afresh.</p>
    <button id="againbtn">BEGIN AGAIN</button>`;
  $('againbtn').onclick=initSetupScreen;
}
function win(){
  const s=$('setup');s.style.display='flex';s.className='screen';
  $('qwrap').style.display='none';$('opts').innerHTML='';
  s.innerHTML=`<h2>THE LINE OF DAVID</h2>
    <p>${deck.length} kings known rightly — their verdict, their deeds, and the word spoken over them.</p>
    <p class="verse">"The throne of David, and of his kingdom, to order it, and to establish it with judgment and with justice from henceforth even for ever."</p>
    <p class="ref">ISAIAH 9:7</p>
    <button id="againbtn">PLAY AGAIN</button>`;
  $('againbtn').onclick=initSetupScreen;
}
initSetupScreen();
</script>
</body>
</html>
