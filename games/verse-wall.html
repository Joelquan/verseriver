1:15", "theme": "scripture"}, {"t": "The Lord is near to all who call upon Him, To all who call upon Him in truth.", "r": "Psalm 145:18", "theme": "scripture"}, {"t": "He will fulfill the desire of those who fear Him; He also will hear their cry and save them.", "r": "Psalm 145:19", "theme": "scripture"}, {"t": "\u201cIt shall come to pass That before they call, I will answer; And while they are still speaking, I will hear.", "r": "Isaiah 65:24", "theme": "scripture"}, {"t": "I will bring the one\u2013third through the fire, Will refine them as silver is refined, And test them as gold is tested. They will call on My name, And I will answer them. I will say, \u2018This is My people\u2019; And each one will say, \u2018The Lord is my God.\u2019 \u201d", "r": "Zechariah 13:9", "theme": "scripture"}, {"t": "Now this is the confidence that we have in Him, that if we ask anything according to His will, He hears us.", "r": "1 John 5:14", "theme": "scripture"}, {"t": "And if we know that He hears us, whatever we ask, we know that we have the petitions that we have asked of Him.", "r": "1 John 5:15", "theme": "scripture"}, {"t": "Then you will call upon Me and go and pray to Me, and I will listen to you.", "r": "Jeremiah 29:12", "theme": "scripture"}, {"t": "And whatever we ask we receive from Him, because we keep His commandments and do those things that are pleasing in His sight.", "r": "1 John 3:22", "theme": "scripture"}, {"t": "\u201cAs the Father \n    \n    loved Me, I also have loved you; abide in My love.", "r": "John 15:9", "theme": "scripture"}, {"t": "for the Father Himself loves you, because you have loved Me, and have believed that I came forth from God.", "r": "John 16:27", "theme": "scripture"}, {"t": "I in them, and You in Me; that they may be made perfect in one, and that the world may know that You have sent Me, and have loved them as You have loved Me.", "r": "John 17:23", "theme": "scripture"}, {"t": "Now hope does not disappoint, because the love of God has been poured out in our hearts by the Holy Spirit who was given to us.", "r": "Romans 5:5", "theme": "scripture"}, {"t": "But God demonstrates His own love toward us, in that while we were still sinners, Christ died for us.", "r": "Romans 5:8", "theme": "scripture"}, {"t": "Who shall separate us from the love of Christ? Shall tribulation, or distress, or persecution, or famine, or nakedness, or peril, or sword?", "r": "Romans 8:35", "theme": "scripture"}, {"t": "For I am persuaded that neither death nor life, nor angels nor principalities nor powers, nor things present nor things to come,", "r": "Romans 8:38", "theme": "scripture"}, {"t": "nor height nor depth, nor any other created thing, shall be able to separate us from the love of God which is in Christ Jesus our Lord.", "r": "Romans 8:39", "theme": "scripture"}, {"t": "But God, who is rich in mercy, because of His great love with which He loved us,", "r": "Ephesians 2:4", "theme": "scripture"}, {"t": "to know the love of Christ which passes knowledge; that you may be filled with all the fullness of God.", "r": "Ephesians 3:19", "theme": "scripture"}, {"t": "And walk in love, as Christ also has loved us and given Himself for us, an offering and a sacrifice to God for a sweet-smelling aroma.", "r": "Ephesians 5:2", "theme": "scripture"}, {"t": "Oh, give thanks to the Lord, for He is good! For His mercy endures forever.", "r": "Psalm 136:1", "theme": "scripture"}, {"t": "Since you were precious in My sight, You have been honored, And I have loved you; Therefore I will give men for you, And people for your life.", "r": "Isaiah 43:4", "theme": "scripture"}, {"t": "For the mountains shall depart And the hills be removed, But My kindness shall not depart from you, Nor shall My covenant of peace be removed,\u201d Says the Lord, who has mercy on you.", "r": "Isaiah 54:10", "theme": "scripture"}, {"t": "The Lord has appeared of old to me, saying: \u201cYes, I have loved you with an everlasting love; Therefore with lovingkindness I have drawn you.", "r": "Jeremiah 31:3", "theme": "scripture"}, {"t": "Behold what manner of love the Father has bestowed on us, that we should be called children of God! Therefore the world does not know us, because it did not know Him.", "r": "1 John 3:1", "theme": "scripture"}, {"t": "Indeed I will make those of the synagogue of Satan, who say they are Jews and are not, but lie\u2014indeed I will make them come and worship before your feet, and to know that I have loved you.", "r": "Revelation 3:9", "theme": "scripture"}, {"t": "Many waters cannot quench love, Nor can the floods drown it. If a man would give for love All the wealth of his house, It would be utterly despised. The Shulamite\u2019s Brothers", "r": "Song of Solomon 8:7", "theme": "scripture"}, {"t": "For I have known him, in order that he may command his children and his household after him, that they keep the way of the Lord, to do righteousness and justice, that the Lord may bring to Abraham what He has spoken to him.\u201d", "r": "Genesis 18:19", "theme": "scripture"}, {"t": "His descendants will be mighty on earth; The generation of the upright will be blessed.", "r": "Psalm 112:2", "theme": "scripture"}, {"t": "Your wife shall be like a fruitful vine In the very heart of your house, Your children like olive plants All around your table.", "r": "Psalm 128:3", "theme": "scripture"}, {"t": "The righteous man walks in his integrity; His children are blessed after him.", "r": "Proverbs 20:7", "theme": "scripture"}, {"t": "All your children shall be taught by the Lord, And great shall be the peace of your children.", "r": "Isaiah 54:13", "theme": "scripture"}, {"t": "For I will pour water on him who is thirsty, And floods on the dry ground; I will pour My Spirit on your descendants, And My blessing on your offspring;", "r": "Isaiah 44:3", "theme": "scripture"}, {"t": "But the mercy of the Lord is from everlasting to everlasting On those who fear Him, And His righteousness to children\u2019s children,", "r": "Psalm 103:17", "theme": "scripture"}, {"t": "In the fear of the Lord there is strong confidence, And His children will have a place of refuge.", "r": "Proverbs 14:26", "theme": "scripture"}, {"t": "And I will establish My covenant between Me and you and your descendants after you in their generations, for an everlasting covenant, to be God to you and your descendants after you.", "r": "Genesis 17:7", "theme": "scripture"}, {"t": "And the Lord your God will circumcise your heart and the heart of your descendants, to love the Lord your God with all your heart and with all your soul, that you may live.", "r": "Deuteronomy 30:6", "theme": "scripture"}, {"t": "Their descendants shall be known among the Gentiles, And their offspring among the people. All who see them shall acknowledge them, That they are the posterity whom the Lord has blessed.\u201d", "r": "Isaiah 61:9", "theme": "scripture"}, {"t": "then I will give them one heart and one way, that they may fear Me forever, for the good of them and their children after them.", "r": "Jeremiah 32:39", "theme": "scripture"}, {"t": "And he will turn The hearts of the fathers to the children, And the hearts of the children to their fathers, Lest I come and strike the earth with a curse.\u201d", "r": "Malachi 4:6", "theme": "scripture"}, {"t": "May the Lord give you increase more and more, You and your children.", "r": "Psalm 115:14", "theme": "scripture"}, {"t": "I will bless those who bless you, And I will curse him who curses you; And in you all the families of the earth shall be blessed.\u201d", "r": "Genesis 12:3", "theme": "scripture"}, {"t": "but showing mercy to thousands, to those who love Me and keep My commandments.", "r": "Exodus 20:6", "theme": "scripture"}, {"t": "The children of Your servants will continue, And their descendants will be established before You.\u201d", "r": "Psalm 102:28", "theme": "scripture"}, {"t": "Though they join forces, the wicked will not go unpunished; But the posterity of the righteous will be delivered.", "r": "Proverbs 11:21", "theme": "scripture"}, {"t": "Behold, how good and how pleasant it is For brethren to dwell together in unity!", "r": "Psalm 133:1", "theme": "scripture"}, {"t": "\u201cAs for Me,\u201d says the Lord, \u201cthis is My covenant with them: My Spirit who is upon you, and My words which I have put in your mouth, shall not depart from your mouth, nor from the mouth of your descendants, nor from the mouth of your descendants\u2019 descendants,\u201d says the Lord, \u201cfrom this time and forevermore.\u201d", "r": "Isaiah 59:21", "theme": "scripture"}, {"t": "and the peace of God, which surpasses all understanding, will guard your hearts and minds through Christ Jesus.", "r": "Philippians 4:7", "theme": "scripture"}, {"t": "I will both lie down in peace, and sleep; For You alone, O Lord, make me dwell in safety.", "r": "Psalm 4:8", "theme": "scripture"}, {"t": "When you lie down, you will not be afraid; Yes, you will lie down and your sleep will be sweet.", "r": "Proverbs 3:24", "theme": "scripture"}, {"t": "My people will dwell in a peaceful habitation, In secure dwellings, and in quiet resting places,", "r": "Isaiah 32:18", "theme": "scripture"}, {"t": "The Lord will give strength to His people; The Lord will bless His people with peace.", "r": "Psalm 29:11", "theme": "scripture"}, {"t": "Oh, that you had heeded My commandments! Then your peace would have been like a river, And your righteousness like the waves of the sea.", "r": "Isaiah 48:18", "theme": "scripture"}, {"t": "The Lord lift up His countenance upon you, And give you peace.\u201d \u2019", "r": "Numbers 6:26", "theme": "scripture"}, {"t": "These things I have spoken to you, that in Me you may have peace. In the world you will have tribulation; but be of good cheer, I have overcome the world.\u201d", "r": "John 16:33", "theme": "scripture"}, {"t": "Great peace have those who love Your law, And nothing causes them to stumble.", "r": "Psalm 119:165", "theme": "scripture"}, {"t": "For unto us a Child is born, Unto us a Son is given; And the government will be upon His shoulder. And His name will be called Wonderful, Counselor, Mighty God, Everlasting Father, Prince of Peace.", "r": "Isaiah 9:6", "theme": "scripture"}, {"t": "Therefore, having been justified by faith, we have peace with God through our Lord Jesus Christ,", "r": "Romans 5:1", "theme": "scripture"}, {"t": "I will hear what God the Lord will speak, For He will speak peace To His people and to His saints; But let them not turn back to folly.", "r": "Psalm 85:8", "theme": "scripture"}, {"t": "Now may the Lord of peace Himself give you peace always in every way. The Lord be with you all.", "r": "2 Thessalonians 3:16", "theme": "scripture"}, {"t": "Mark the blameless man, and observe the upright; For the future of that man is peace.", "r": "Psalm 37:37", "theme": "scripture"}, {"t": "He shall enter into peace; They shall rest in their beds, Each one walking in his uprightness.", "r": "Isaiah 57:2", "theme": "scripture"}, {"t": "When a man\u2019s ways please the Lord, He makes even his enemies to be at peace with him.", "r": "Proverbs 16:7", "theme": "scripture"}, {"t": "The work of righteousness will be peace, And the effect of righteousness, quietness and assurance forever.", "r": "Isaiah 32:17", "theme": "scripture"}, {"t": "For He Himself is our peace, who has made both one, and has broken down the middle wall of separation,", "r": "Ephesians 2:14", "theme": "scripture"}, {"t": "He shall cover you with His feathers, And under His wings you shall take refuge; His truth shall be your shield and buckler.", "r": "Psalm 91:4", "theme": "scripture"}, {"t": "The Lord shall preserve you from all evil; He shall preserve your soul.", "r": "Psalm 121:7", "theme": "scripture"}, {"t": "The Lord shall preserve your going out and your coming in From this time forth, and even forevermore.", "r": "Psalm 121:8", "theme": "scripture"}, {"t": "A thousand may fall at your side, And ten thousand at your right hand; But it shall not come near you.", "r": "Psalm 91:7", "theme": "scripture"}, {"t": "When you pass through the waters, I will be with you; And through the rivers, they shall not overflow you. When you walk through the fire, you shall not be burned, Nor shall the flame scorch you.", "r": "Isaiah 43:2", "theme": "scripture"}, {"t": "God is our refuge and strength, A very present help in trouble.", "r": "Psalm 46:1", "theme": "scripture"}, {"t": "What then shall we say to these things? If God is for us, who can be against us?", "r": "Romans 8:31", "theme": "scripture"}, {"t": "But You, O Lord, are a shield for me, My glory and the One who lifts up my head.", "r": "Psalm 3:3", "theme": "scripture"}, {"t": "The Lord is my rock and my fortress and my deliverer; My God, my strength, in whom I will trust; My shield and the horn of my salvation, my stronghold.", "r": "Psalm 18:2", "theme": "scripture"}, {"t": "You are my hiding place; You shall preserve me from trouble; You shall surround me with songs of deliverance. Selah", "r": "Psalm 32:7", "theme": "scripture"}, {"t": "He guards the paths of justice, And preserves the way of His saints.", "r": "Proverbs 2:8", "theme": "scripture"}, {"t": "As the mountains surround Jerusalem, So the Lord surrounds His people From this time forth and forever.", "r": "Psalm 125:2", "theme": "scripture"}, {"t": "For I,\u2019 says the Lord, \u2018will be a wall of fire all around her, and I will be the glory in her midst.\u2019 \u201d", "r": "Zechariah 2:5", "theme": "scripture"}, {"t": "for the Lord your God is He who goes with you, to fight for you against your enemies, to save you.\u2019", "r": "Deuteronomy 20:4", "theme": "scripture"}, {"t": "The Lord will open to you His good treasure, the heavens, to give the rain to your land in its season, and to bless all the work of your hand. You shall lend to many nations, but you shall not borrow.", "r": "Deuteronomy 28:12", "theme": "scripture"}, {"t": "And let the beauty of the Lord our God be upon us, And establish the work of our hands for us; Yes, establish the work of our hands.", "r": "Psalm 90:17", "theme": "scripture"}, {"t": "He who has a slack hand becomes poor, But the hand of the diligent makes rich.", "r": "Proverbs 10:4", "theme": "scripture"}, {"t": "In all labor there is profit, But idle chatter leads only to poverty.", "r": "Proverbs 14:23", "theme": "scripture"}, {"t": "Commit your works to the Lord, And your thoughts will be established.", "r": "Proverbs 16:3", "theme": "scripture"}, {"t": "knowing that from the Lord you will receive the reward of the inheritance; for you serve the Lord Christ.", "r": "Colossians 3:24", "theme": "scripture"}, {"t": "And his master saw that the Lord was with him and that the Lord made all he did to prosper in his hand.", "r": "Genesis 39:3", "theme": "scripture"}, {"t": "He shall be like a tree Planted by the rivers of water, That brings forth its fruit in its season, Whose leaf also shall not wither; And whatever he does shall prosper.", "r": "Psalm 1:3", "theme": "scripture"}, {"t": "He who tills his land will be satisfied with bread, But he who follows frivolity is devoid of understanding.", "r": "Proverbs 12:11", "theme": "scripture"}, {"t": "The hand of the diligent will rule, But the lazy man will be put to forced labor.", "r": "Proverbs 12:24", "theme": "scripture"}, {"t": "Wealth gained by dishonesty will be diminished, But he who gathers by labor will increase.", "r": "Proverbs 13:11", "theme": "scripture"}, {"t": "The plans of the diligent lead surely to plenty, But those of everyone who is hasty, surely to poverty.", "r": "Proverbs 21:5", "theme": "scripture"}, {"t": "Do you see a man who excels in his work? He will stand before kings; He will not stand before unknown men.", "r": "Proverbs 22:29", "theme": "scripture"}, {"t": "Therefore, my beloved brethren, be steadfast, immovable, always abounding in the work of the Lord, knowing that your labor is not in vain in the Lord.", "r": "1 Corinthians 15:58", "theme": "scripture"}, {"t": "When you eat the labor of your hands, You shall be happy, and it shall be well with you.", "r": "Psalm 128:2", "theme": "scripture"}, {"t": "They shall not build and another inhabit; They shall not plant and another eat; For as the days of a tree, so shall be the days of My people, And My elect shall long enjoy the work of their hands.", "r": "Isaiah 65:22", "theme": "scripture"}, {"t": "He who tills his land will have plenty of bread, But he who follows frivolity will have poverty enough!", "r": "Proverbs 28:19", "theme": "scripture"}, {"t": "and also that every man should eat and drink and enjoy the good of all his labor\u2014it is the gift of God.", "r": "Ecclesiastes 3:13", "theme": "scripture"}, {"t": "For the Scripture says, \u201cYou shall not muzzle an ox while it treads out the grain,\u201d and, \u201cThe laborer is worthy of his wages.\u201d", "r": "1 Timothy 5:18", "theme": "scripture"}, {"t": "\u2018For the seed shall be prosperous, The vine shall give its fruit, The ground shall give her increase, And the heavens shall give their dew\u2014 I will cause the remnant of this people To possess all these.", "r": "Zechariah 8:12", "theme": "scripture"}, {"t": "The Lord your God will make you abound in all the work of your hand, in the fruit of your body, in the increase of your livestock, and in the produce of your land for good. For the Lord will again rejoice over you for good as He rejoiced over your fathers,", "r": "Deuteronomy 30:9", "theme": "scripture"}, {"t": "And I have filled him with the Spirit of God, in wisdom, in understanding, in knowledge, and in all manner of workmanship,", "r": "Exodus 31:3", "theme": "scripture"}, {"t": "Of gold and silver and bronze and iron there is no limit. Arise and begin working, and the Lord be with you.\u201d", "r": "1 Chronicles 22:16", "theme": "scripture"}, {"t": "But you, be strong and do not let your hands be weak, for your work shall be rewarded!\u201d", "r": "2 Chronicles 15:7", "theme": "scripture"}, {"t": "Most assuredly, I say to you, he who believes in Me has everlasting life.", "r": "John 6:47", "theme": "scripture"}, {"t": "For assuredly, I say to you, whoever says to this mountain, \u2018Be removed and be cast into the sea,\u2019 and does not doubt in his heart, but believes that those things he says will be done, he will have whatever he says.", "r": "Mark 11:23", "theme": "scripture"}, {"t": "Therefore do not cast away your confidence, which has great reward.", "r": "Hebrews 10:35", "theme": "scripture"}, {"t": "So they rose early in the morning and went out into the Wilderness of Tekoa; and as they went out, Jehoshaphat stood and said, \u201cHear me, O Judah and you inhabitants of Jerusalem: Believe in the Lord your God, and you shall be established; believe His prophets, and you shall prosper.\u201d", "r": "2 Chronicles 20:20", "theme": "scripture"}, {"t": "Commit your way to the Lord, Trust also in Him, And He shall bring it to pass.", "r": "Psalm 37:5", "theme": "scripture"}, {"t": "Those who trust in the Lord Are like Mount Zion, Which cannot be moved, but abides forever.", "r": "Psalm 125:1", "theme": "scripture"}, {"t": "For all the promises of God in Him are Yes, and in Him Amen, to the glory of God through us.", "r": "2 Corinthians 1:20", "theme": "scripture"}, {"t": "\u201cGod is not a man, that He should lie, Nor a son of man, that He should repent. Has He said, and will He not do? Or has He spoken, and will He not make it good?", "r": "Numbers 23:19", "theme": "scripture"}, {"t": "He who did not spare His own Son, but delivered Him up for us all, how shall He not with Him also freely give us all things?", "r": "Romans 8:32", "theme": "scripture"}, {"t": "But the Scripture has confined all under sin, that the promise by faith in Jesus Christ might be given to those who believe.", "r": "Galatians 3:22", "theme": "scripture"}, {"t": "For whatever is born of God overcomes the world. And this is the victory that has overcome the world\u2014our faith.", "r": "1 John 5:4", "theme": "scripture"}, {"t": "Jesus said to him, \u201cThomas, because you have seen Me, you have believed. Blessed are those who have not seen and yet have believed.\u201d", "r": "John 20:29", "theme": "scripture"}, {"t": "For in it the righteousness of God is revealed from faith to faith; as it is written, \u201cThe just shall live by faith.\u201d", "r": "Romans 1:17", "theme": "scripture"}, {"t": "Now the just shall live by faith; But if anyone draws back, My soul has no pleasure in him.\u201d", "r": "Hebrews 10:38", "theme": "scripture"}, {"t": "For the Scripture says, \u201cWhoever believes on Him will not be put to shame.\u201d", "r": "Romans 10:11", "theme": "scripture"}, {"t": "And since we have the same spirit of faith, according to what is written, \u201cI believed and therefore I spoke,\u201d we also believe and therefore speak,", "r": "2 Corinthians 4:13", "theme": "scripture"}, {"t": "looking unto Jesus, the author and finisher of our faith, who for the joy that was set before Him endured the cross, despising the shame, and has sat down at the right hand of the throne of God.", "r": "Hebrews 12:2", "theme": "scripture"}, {"t": "\u201cSo you shall serve the Lord your God, and He will bless your bread and your water. And I will take sickness away from the midst of you.", "r": "Exodus 23:25", "theme": "scripture"}, {"t": "And the Lord will take away from you all sickness, and will afflict you with none of the terrible diseases of Egypt which you have known, but will lay them on all those who hate you.", "r": "Deuteronomy 7:15", "theme": "scripture"}, {"t": "\u201cReturn and tell Hezekiah the leader of My people, \u2018Thus says the Lord, the God of David your father: \u201cI have heard your prayer, I have seen your tears; surely I will heal you. On the third day you shall go up to the house of the Lord.", "r": "2 Kings 20:5", "theme": "scripture"}, {"t": "O Lord my God, I cried out to You, And You healed me.", "r": "Psalm 30:2", "theme": "scripture"}, {"t": "The Lord will strengthen him on his bed of illness; You will sustain him on his sickbed.", "r": "Psalm 41:3", "theme": "scripture"}, {"t": "Who forgives all your iniquities, Who heals all your diseases,", "r": "Psalm 103:3", "theme": "scripture"}, {"t": "He sent His word and healed them, And delivered them from their destructions.", "r": "Psalm 107:20", "theme": "scripture"}, {"t": "With long life I will satisfy him, And show him My salvation.\u201d", "r": "Psalm 91:16", "theme": "scripture"}, {"t": "It will be health to your flesh, And strength to your bones.", "r": "Proverbs 3:8", "theme": "scripture"}, {"t": "For they are life to those who find them, And health to all their flesh.", "r": "Proverbs 4:22", "theme": "scripture"}, {"t": "I have seen his ways, and will heal him; I will also lead him, And restore comforts to him And to his mourners.", "r": "Isaiah 57:18", "theme": "scripture"}, {"t": "Then your light shall break forth like the morning, Your healing shall spring forth speedily, And your righteousness shall go before you; The glory of the Lord shall be your rear guard.", "r": "Isaiah 58:8", "theme": "scripture"}, {"t": "For I will restore health to you And heal you of your wounds,\u2019 says the Lord, \u2018Because they called you an outcast saying: \u201cThis is Zion; No one seeks her.\u201d \u2019", "r": "Jeremiah 30:17", "theme": "scripture"}, {"t": "Behold, I will bring it health and healing; I will heal them and reveal to them the abundance of peace and truth.", "r": "Jeremiah 33:6", "theme": "scripture"}, {"t": "Come, and let us return to the Lord; For He has torn, but He will heal us; He has stricken, but He will bind us up.", "r": "Hosea 6:1", "theme": "scripture"}, {"t": "that it might be fulfilled which was spoken by Isaiah the prophet, saying: \u201cHe Himself took our infirmities And bore our sicknesses.\u201d", "r": "Matthew 8:17", "theme": "scripture"}, {"t": "how God anointed Jesus of Nazareth with the Holy Spirit and with power, who went about doing good and healing all who were oppressed by the devil, for God was with Him.", "r": "Acts 10:38", "theme": "scripture"}, {"t": "And the prayer of faith will save the sick, and the Lord will raise him up. And if he has committed sins, he will be forgiven.", "r": "James 5:15", "theme": "scripture"}, {"t": "who Himself bore our sins in His own body on the tree, that we, having died to sins, might live for righteousness\u2014by whose stripes you were healed.", "r": "1 Peter 2:24", "theme": "scripture"}, {"t": "And my God shall supply all your need according to His riches in glory by Christ Jesus.", "r": "Philippians 4:19", "theme": "scripture"}, {"t": "Bring all the tithes into the storehouse, That there may be food in My house, And try Me now in this,\u201d Says the Lord of hosts, \u201cIf I will not open for you the windows of heaven And pour out for you such blessing That there will not be room enough to receive it.", "r": "Malachi 3:10", "theme": "scripture"}, {"t": "Give, and it will be given to you: good measure, pressed down, shaken together, and running over will be put into your bosom. For with the same measure that you use, it will be measured back to you.\u201d", "r": "Luke 6:38", "theme": "scripture"}, {"t": "And God is able to make all grace abound toward you, that you, always having all sufficiency in all things, may have an abundance for every good work.", "r": "2 Corinthians 9:8", "theme": "scripture"}, {"t": "Now may He who supplies seed to the sower, and bread for food, supply and multiply the seed you have sown and increase the fruits of your righteousness,", "r": "2 Corinthians 9:10", "theme": "scripture"}, {"t": "\u201cAnd you shall remember the Lord your God, for it is He who gives you power to get wealth, that He may establish His covenant which He swore to your fathers, as it is this day.", "r": "Deuteronomy 8:18", "theme": "scripture"}, {"t": "\u201cThe Lord will command the blessing on you in your storehouses and in all to which you set your hand, and He will bless you in the land which the Lord your God is giving you.", "r": "Deuteronomy 28:8", "theme": "scripture"}, {"t": "And the Lord will grant you plenty of goods, in the fruit of your body, in the increase of your livestock, and in the produce of your ground, in the land of which the Lord swore to your fathers to give you.", "r": "Deuteronomy 28:11", "theme": "scripture"}, {"t": "I have been young, and now am old; Yet I have not seen the righteous forsaken, Nor his descendants begging bread.", "r": "Psalm 37:25", "theme": "scripture"}, {"t": "The young lions lack and suffer hunger; But those who seek the Lord shall not lack any good thing.", "r": "Psalm 34:10", "theme": "scripture"}, {"t": "For the Lord God is a sun and shield; The Lord will give grace and glory; No good thing will He withhold From those who walk uprightly.", "r": "Psalm 84:11", "theme": "scripture"}, {"t": "So your barns will be filled with plenty, And your vats will overflow with new wine.", "r": "Proverbs 3:10", "theme": "scripture"}, {"t": "The blessing of the Lord makes one rich, And He adds no sorrow with it.", "r": "Proverbs 10:22", "theme": "scripture"}, {"t": "The generous soul will be made rich, And he who waters will also be watered himself.", "r": "Proverbs 11:25", "theme": "scripture"}, {"t": "This Book of the Law shall not depart from your mouth, but you shall meditate in it day and night, that you may observe to do according to all that is written in it. For then you will make your way prosperous, and then you will have good success.", "r": "Joshua 1:8", "theme": "scripture"}, {"t": "Wealth and riches will be in his house, And his righteousness endures forever.", "r": "Psalm 112:3", "theme": "scripture"}, {"t": "If you are willing and obedient, You shall eat the good of the land;", "r": "Isaiah 1:19", "theme": "scripture"}, {"t": "You shall eat in plenty and be satisfied, And praise the name of the Lord your God, Who has dealt wondrously with you; And My people shall never be put to shame.", "r": "Joel 2:26", "theme": "scripture"}, {"t": "Is the seed still in the barn? As yet the vine, the fig tree, the pomegranate, and the olive tree have not yielded fruit. But from this day I will bless you.\u2019 \u201d", "r": "Haggai 2:19", "theme": "scripture"}, {"t": "Then Isaac sowed in that land, and reaped in the same year a hundredfold; and the Lord blessed him.", "r": "Genesis 26:12", "theme": "scripture"}, {"t": "then I will give you rain in its season, the land shall yield its produce, and the trees of the field shall yield their fruit.", "r": "Leviticus 26:4", "theme": "scripture"}, {"t": "They shall not be ashamed in the evil time, And in the days of famine they shall be satisfied.", "r": "Psalm 37:19", "theme": "scripture"}, {"t": "You visit the earth and water it, You greatly enrich it; The river of God is full of water; You provide their grain, For so You have prepared it.", "r": "Psalm 65:9", "theme": "scripture"}, {"t": "For the Lord gives wisdom; From His mouth come knowledge and understanding;", "r": "Proverbs 2:6", "theme": "scripture"}, {"t": "He stores up sound wisdom for the upright; He is a shield to those who walk uprightly;", "r": "Proverbs 2:7", "theme": "scripture"}, {"t": "I will instruct you and teach you in the way you should go; I will guide you with My eye.", "r": "Psalm 32:8", "theme": "scripture"}, {"t": "The humble He guides in justice, And the humble He teaches His way.", "r": "Psalm 25:9", "theme": "scripture"}, {"t": "Who is the man that fears the Lord? Him shall He teach in the way He chooses.", "r": "Psalm 25:12", "theme": "scripture"}, {"t": "Your ears shall hear a word behind you, saying, \u201cThis is the way, walk in it,\u201d Whenever you turn to the right hand Or whenever you turn to the left.", "r": "Isaiah 30:21", "theme": "scripture"}, {"t": "The Lord will guide you continually, And satisfy your soul in drought, And strengthen your bones; You shall be like a watered garden, And like a spring of water, whose waters do not fail.", "r": "Isaiah 58:11", "theme": "scripture"}, {"t": "However, when He, the Spirit of truth, has come, He will guide you into all truth; for He will not speak on His own authority, but whatever He hears He will speak; and He will tell you things to come.", "r": "John 16:13", "theme": "scripture"}, {"t": "But the anointing which you have received from Him abides in you, and you do not need that anyone teach you; but as the same anointing teaches you concerning all things, and is true, and is not a lie, and just as it has taught you, you will abide in Him.", "r": "1 John 2:27", "theme": "scripture"}, {"t": "For \u201cwho has known the mind of the Lord that he may instruct Him?\u201d But we have the mind of Christ.", "r": "1 Corinthians 2:16", "theme": "scripture"}, {"t": "But of Him you are in Christ Jesus, who became for us wisdom from God\u2014and righteousness and sanctification and redemption\u2014", "r": "1 Corinthians 1:30", "theme": "scripture"}, {"t": "in whom are hidden all the treasures of wisdom and knowledge.", "r": "Colossians 2:3", "theme": "scripture"}, {"t": "And He changes the times and the seasons; He removes kings and raises up kings; He gives wisdom to the wise And knowledge to those who have understanding.", "r": "Daniel 2:21", "theme": "scripture"}, {"t": "For God gives wisdom and knowledge and joy to a man who is good in His sight; but to the sinner He gives the work of gathering and collecting, that he may give to him who is good before God. This also is vanity and grasping for the wind.", "r": "Ecclesiastes 2:26", "theme": "scripture"}, {"t": "Turn at my rebuke; Surely I will pour out my spirit on you; I will make my words known to you.", "r": "Proverbs 1:23", "theme": "scripture"}, {"t": "The fear of the Lord is the beginning of wisdom; A good understanding have all those who do His commandments. His praise endures forever.", "r": "Psalm 111:10", "theme": "scripture"}, {"t": "He who walks with wise men will be wise, But the companion of fools will be destroyed.", "r": "Proverbs 13:20", "theme": "scripture"}, {"t": "Listen to counsel and receive instruction, That you may be wise in your latter days.", "r": "Proverbs 19:20", "theme": "scripture"}, {"t": "You will guide me with Your counsel, And afterward receive me to glory.", "r": "Psalm 73:24", "theme": "scripture"}, {"t": "And to man He said, \u2018Behold, the fear of the Lord, that is wisdom, And to depart from evil is understanding.\u2019 \u201d", "r": "Job 28:28", "theme": "scripture"}, {"t": "Happy is the man who finds wisdom, And the man who gains understanding;", "r": "Proverbs 3:13", "theme": "scripture"}, {"t": "Be strong and of good courage, for to this people you shall divide as an inheritance the land which I swore to their fathers to give them.", "r": "Joshua 1:6", "theme": "scripture"}, {"t": "Only be strong and very courageous, that you may observe to do according to all the law which Moses My servant commanded you; do not turn from it to the right hand or to the left, that you may prosper wherever you go.", "r": "Joshua 1:7", "theme": "scripture"}, {"t": "And David said to his son Solomon, \u201cBe strong and of good courage, and do it; do not fear nor be dismayed, for the Lord God\u2014my God\u2014will be with you. He will not leave you nor forsake you, until you have finished all the work for the service of the house of the Lord.", "r": "1 Chronicles 28:20", "theme": "scripture"}, {"t": "Then Moses called Joshua and said to him in the sight of all Israel, \u201cBe strong and of good courage, for you must go with this people to the land which the Lord has sworn to their fathers to give them, and you shall cause them to inherit it.", "r": "Deuteronomy 31:7", "theme": "scripture"}, {"t": "Wait on the Lord; Be of good courage, And He shall strengthen your heart; Wait, I say, on the Lord!", "r": "Psalm 27:14", "theme": "scripture"}, {"t": "Be of good courage, And He shall strengthen your heart, All you who hope in the Lord.", "r": "Psalm 31:24", "theme": "scripture"}, {"t": "But now, thus says the Lord, who created you, O Jacob, And He who formed you, O Israel: \u201cFear not, for I have redeemed you; I have called you by your name; You are Mine.", "r": "Isaiah 43:1", "theme": "scripture"}, {"t": "Watch, stand fast in the faith, be brave, be strong.", "r": "1 Corinthians 16:13", "theme": "scripture"}, {"t": "and not in any way terrified by your adversaries, which is to them a proof of perdition, but to you of salvation, and that from God.", "r": "Philippians 1:28", "theme": "scripture"}, {"t": "\u201cBe strong and courageous; do not be afraid nor dismayed before the king of Assyria, nor before all the multitude that is with him; for there are more with us than with him.", "r": "2 Chronicles 32:7", "theme": "scripture"}, {"t": "And he said, \u201cO man greatly beloved, fear not! Peace be to you; be strong, yes, be strong!\u201d So when he spoke to me I was strengthened, and said, \u201cLet my lord speak, for you have strengthened me.\u201d", "r": "Daniel 10:19", "theme": "scripture"}, {"t": "Yet now be strong, Zerubbabel,\u2019 says the Lord; \u2018and be strong, Joshua, son of Jehozadak, the high priest; and be strong, all you people of the land,\u2019 says the Lord, \u2018and work; for I am with you,\u2019 says the Lord of hosts.", "r": "Haggai 2:4", "theme": "scripture"}, {"t": "And it shall come to pass That just as you were a curse among the nations, O house of Judah and house of Israel, So I will save you, and you shall be a blessing. Do not fear, Let your hands be strong.\u2019", "r": "Zechariah 8:13", "theme": "scripture"}, {"t": "Then you will prosper, if you take care to fulfill the statutes and judgments with which the Lord charged Moses concerning Israel. Be strong and of good courage; do not fear nor be dismayed.", "r": "1 Chronicles 22:13", "theme": "scripture"}, {"t": "Whenever I am afraid, I will trust in You.", "r": "Psalm 56:3", "theme": "scripture"}, {"t": "In God (I will praise His word), In God I have put my trust; I will not fear. What can flesh do to me?", "r": "Psalm 56:4", "theme": "scripture"}, {"t": "Say to those who are fearful-hearted, \u201cBe strong, do not fear! Behold, your God will come with vengeance, With the recompense of God; He will come and save you.\u201d", "r": "Isaiah 35:4", "theme": "scripture"}, {"t": "But immediately Jesus spoke to them, saying, \u201cBe of good cheer! It is I; do not be afraid.\u201d", "r": "Matthew 14:27", "theme": "scripture"}, {"t": "Then He inaugurated Joshua the son of Nun, and said, \u201cBe strong and of good courage; for you shall bring the children of Israel into the land of which I swore to them, and I will be with you.\u201d", "r": "Deuteronomy 31:23", "theme": "scripture"}, {"t": "Arise, for this matter is your responsibility. We also are with you. Be of good courage, and do it.\u201d", "r": "Ezra 10:4", "theme": "scripture"}, {"t": "Therefore take heart, men, for I believe God that it will be just as it was told me.", "r": "Acts 27:25", "theme": "scripture"}, {"t": "He will not be afraid of evil tidings; His heart is steadfast, trusting in the Lord.", "r": "Psalm 112:7", "theme": "scripture"}, {"t": "\u201cListen to Me, you who know righteousness, You people in whose heart is My law: Do not fear the reproach of men, Nor be afraid of their insults.", "r": "Isaiah 51:7", "theme": "scripture"}, {"t": "Only do not rebel against the Lord, nor fear the people of the land, for they are our bread; their protection has departed from them, and the Lord is with us. Do not fear them.\u201d", "r": "Numbers 14:9", "theme": "scripture"}, {"t": "The righteous cry out, and the Lord hears, And delivers them out of all their troubles.", "r": "Psalm 34:17", "theme": "scripture"}, {"t": "And the Lord will deliver me from every evil work and preserve me for His heavenly kingdom. To Him be glory forever and ever. Amen!", "r": "2 Timothy 4:18", "theme": "scripture"}, {"t": "then the Lord knows how to deliver the godly out of temptations and to reserve the unjust under punishment for the day of judgment,", "r": "2 Peter 2:9", "theme": "scripture"}, {"t": "If that is the case, our God whom we serve is able to deliver us from the burning fiery furnace, and He will deliver us from your hand, O king.", "r": "Daniel 3:17", "theme": "scripture"}, {"t": "He delivers and rescues, And He works signs and wonders In heaven and on earth, Who has delivered Daniel from the power of the lions.", "r": "Daniel 6:27", "theme": "scripture"}, {"t": "He delivered me from my strong enemy, From those who hated me, For they were too strong for me.", "r": "Psalm 18:17", "theme": "scripture"}, {"t": "But I am poor and needy; Yet the Lord thinks upon me. You are my help and my deliverer; Do not delay, O my God.", "r": "Psalm 40:17", "theme": "scripture"}, {"t": "But I am poor and needy; Make haste to me, O God! You are my help and my deliverer; O Lord, do not delay.", "r": "Psalm 70:5", "theme": "scripture"}, {"t": "And he said: \u201cThe Lord is my rock and my fortress and my deliverer;", "r": "2 Samuel 22:2", "theme": "scripture"}, {"t": "\u201cI will deliver you from the hand of the wicked, And I will redeem you from the grip of the terrible.\u201d", "r": "Jeremiah 15:21", "theme": "scripture"}, {"t": "Even to your old age, I am He, And even to gray hairs I will carry you! I have made, and I will bear; Even I will carry, and will deliver you.", "r": "Isaiah 46:4", "theme": "scripture"}, {"t": "And it shall come to pass That whoever calls on the name of the Lord Shall be saved. For in Mount Zion and in Jerusalem there shall be deliverance, As the Lord has said, Among the remnant whom the Lord calls.", "r": "Joel 2:32", "theme": "scripture"}, {"t": "who gave Himself for our sins, that He might deliver us from this present evil age, according to the will of our God and Father,", "r": "Galatians 1:4", "theme": "scripture"}, {"t": "He has delivered us from the power of darkness and conveyed us into the kingdom of the Son of His love,", "r": "Colossians 1:13", "theme": "scripture"}, {"t": "and to wait for His Son from heaven, whom He raised from the dead, even Jesus who delivers us from the wrath to come.", "r": "1 Thessalonians 1:10", "theme": "scripture"}, {"t": "I thank God\u2014through Jesus Christ our Lord! So then, with the mind I myself serve the law of God, but with the flesh the law of sin.", "r": "Romans 7:25", "theme": "scripture"}, {"t": "who delivered us from so great a death, and does deliver us; in whom we trust that He will still deliver us,", "r": "2 Corinthians 1:10", "theme": "scripture"}, {"t": "and release those who through fear of death were all their lifetime subject to bondage.", "r": "Hebrews 2:15", "theme": "scripture"}, {"t": "Then they cried out to the Lord in their trouble, And He delivered them out of their distresses.", "r": "Psalm 107:6", "theme": "scripture"}, {"t": "And it will be for a sign and for a witness to the Lord of hosts in the land of Egypt; for they will cry to the Lord because of the oppressors, and He will send them a Savior and a Mighty One, and He will deliver them.", "r": "Isaiah 19:20", "theme": "scripture"}, {"t": "For I will surely deliver you, and you shall not fall by the sword; but your life shall be as a prize to you, because you have put your trust in Me,\u201d says the Lord.\u2019 \u201d", "r": "Jeremiah 39:18", "theme": "scripture"}, {"t": "I will deliver you and this city from the hand of the king of Assyria, and I will defend this city.\u201d \u2019", "r": "Isaiah 38:6", "theme": "scripture"}, {"t": "Then we departed from the river of Ahava on the twelfth day of the first month, to go to Jerusalem. And the hand of our God was upon us, and He delivered us from the hand of the enemy and from ambush along the road.", "r": "Ezra 8:31", "theme": "scripture"}, {"t": "For You, O Lord, will bless the righteous; With favor You will surround him as with a shield.", "r": "Psalm 5:12", "theme": "scripture"}, {"t": "For You are the glory of their strength, And in Your favor our horn is exalted.", "r": "Psalm 89:17", "theme": "scripture"}, {"t": "And so find favor and high esteem In the sight of God and man.", "r": "Proverbs 3:4", "theme": "scripture"}, {"t": "For whoever finds me finds life, And obtains favor from the Lord;", "r": "Proverbs 8:35", "theme": "scripture"}, {"t": "A good man obtains favor from the Lord, But a man of wicked intentions He will condemn.", "r": "Proverbs 12:2", "theme": "scripture"}, {"t": "In the light of the king\u2019s face is life, And his favor is like a cloud of the latter rain.", "r": "Proverbs 16:15", "theme": "scripture"}, {"t": "He who finds a wife finds a good thing, And obtains favor from the Lord.", "r": "Proverbs 18:22", "theme": "scripture"}, {"t": "Then the angel said to her, \u201cDo not be afraid, Mary, for you have found favor with God.", "r": "Luke 1:30", "theme": "scripture"}, {"t": "And Jesus increased in wisdom and stature, and in favor with God and men.", "r": "Luke 2:52", "theme": "scripture"}, {"t": "praising God and having favor with all the people. And the Lord added to the church daily those who were being saved.", "r": "Acts 2:47", "theme": "scripture"}, {"t": "And I will give this people favor in the sight of the Egyptians; and it shall be, when you go, that you shall not go empty-handed.", "r": "Exodus 3:21", "theme": "scripture"}, {"t": "You will arise and have mercy on Zion; For the time to favor her, Yes, the set time, has come.", "r": "Psalm 102:13", "theme": "scripture"}, {"t": "\u201cThe sons of foreigners shall build up your walls, And their kings shall minister to you; For in My wrath I struck you, But in My favor I have had mercy on you.", "r": "Isaiah 60:10", "theme": "scripture"}, {"t": "The Lord make His face shine upon you, And be gracious to you;", "r": "Numbers 6:25", "theme": "scripture"}, {"t": "Fools mock at sin, But among the upright there is favor.", "r": "Proverbs 14:9", "theme": "scripture"}, {"t": "And the child Samuel grew in stature, and in favor both with the Lord and men.", "r": "1 Samuel 2:26", "theme": "scripture"}, {"t": "The king loved Esther more than all the other women, and she obtained grace and favor in his sight more than all the virgins; so he set the royal crown upon her head and made her queen instead of Vashti.", "r": "Esther 2:17", "theme": "scripture"}, {"t": "Now God had brought Daniel into the favor and goodwill of the chief of the eunuchs.", "r": "Daniel 1:9", "theme": "scripture"}, {"t": "But the Lord was with Joseph and showed him mercy, and He gave him favor in the sight of the keeper of the prison.", "r": "Genesis 39:21", "theme": "scripture"}, {"t": "And the Lord had given the people favor in the sight of the Egyptians, so that they granted them what they requested. Thus they plundered the Egyptians.", "r": "Exodus 12:36", "theme": "scripture"}, {"t": "Remember me, O Lord, with the favor You have toward Your people. Oh, visit me with Your salvation,", "r": "Psalm 106:4", "theme": "scripture"}, {"t": "And of Naphtali he said: \u201cO Naphtali, satisfied with favor, And full of the blessing of the Lord, Possess the west and the south.\u201d", "r": "Deuteronomy 33:23", "theme": "scripture"}, {"t": "By this I know that You are well pleased with me, Because my enemy does not triumph over me.", "r": "Psalm 41:11", "theme": "scripture"}, {"t": "O Lord, I pray, please let Your ear be attentive to the prayer of Your servant, and to the prayer of Your servants who desire to fear Your name; and let Your servant prosper this day, I pray, and grant him mercy in the sight of this man.\u201d For I was the king\u2019s cupbearer.", "r": "Nehemiah 1:11", "theme": "scripture"}, {"t": "And the Lord gave the people favor in the sight of the Egyptians. Moreover the man Moses was very great in the land of Egypt, in the sight of Pharaoh\u2019s servants and in the sight of the people.", "r": "Exodus 11:3", "theme": "scripture"}, {"t": "\u201cCome now, and let us reason together,\u201d Says the Lord, \u201cThough your sins are like scarlet, They shall be as white as snow; Though they are red like crimson, They shall be as wool.", "r": "Isaiah 1:18", "theme": "scripture"}, {"t": "\u201cI, even I, am He who blots out your transgressions for My own sake; And I will not remember your sins.", "r": "Isaiah 43:25", "theme": "scripture"}, {"t": "I have blotted out, like a thick cloud, your transgressions, And like a cloud, your sins. Return to Me, for I have redeemed you.\u201d", "r": "Isaiah 44:22", "theme": "scripture"}, {"t": "Who is a God like You, Pardoning iniquity And passing over the transgression of the remnant of His heritage? He does not retain His anger forever, Because He delights in mercy.", "r": "Micah 7:18", "theme": "scripture"}, {"t": "He will again have compassion on us, And will subdue our iniquities. You will cast all our sins Into the depths of the sea.", "r": "Micah 7:19", "theme": "scripture"}, {"t": "Blessed is he whose transgression is forgiven, Whose sin is covered.", "r": "Psalm 32:1", "theme": "scripture"}, {"t": "I acknowledged my sin to You, And my iniquity I have not hidden. I said, \u201cI will confess my transgressions to the Lord,\u201d And You forgave the iniquity of my sin. Selah", "r": "Psalm 32:5", "theme": "scripture"}, {"t": "For You, Lord, are good, and ready to forgive, And abundant in mercy to all those who call upon You.", "r": "Psalm 86:5", "theme": "scripture"}, {"t": "As far as the east is from the west, So far has He removed our transgressions from us.", "r": "Psalm 103:12", "theme": "scripture"}, {"t": "But there is forgiveness with You, That You may be feared.", "r": "Psalm 130:4", "theme": "scripture"}, {"t": "To the Lord our God belong mercy and forgiveness, though we have rebelled against Him.", "r": "Daniel 9:9", "theme": "scripture"}, {"t": "\u201cFor if you forgive men their trespasses, your heavenly Father will also forgive you.", "r": "Matthew 6:14", "theme": "scripture"}, {"t": "\u201cAnd whenever you stand praying, \n    \n    if you have anything against anyone, forgive him, that your Father in heaven may also forgive you your trespasses.", "r": "Mark 11:25", "theme": "scripture"}, {"t": "\u201cJudge not, and you shall not be judged. Condemn not, and you shall not be condemned. \n    \n    Forgive, and you will be forgiven.", "r": "Luke 6:37", "theme": "scripture"}, {"t": "Therefore let it be known to you, brethren, that through this Man is preached to you the forgiveness of sins;", "r": "Acts 13:38", "theme": "scripture"}, {"t": "bearing with one another, and forgiving one another, if anyone has a complaint against another; even as Christ forgave you, so you also must do.", "r": "Colossians 3:13", "theme": "scripture"}, {"t": "in whom we have redemption through His blood, the forgiveness of sins.", "r": "Colossians 1:14", "theme": "scripture"}, {"t": "then He adds, \u201cTheir sins and their lawless deeds I will remember no more.\u201d", "r": "Hebrews 10:17", "theme": "scripture"}, {"t": "I write to you, little children, Because your sins are forgiven you for His name\u2019s sake.", "r": "1 John 2:12", "theme": "scripture"}, {"t": "No more shall every man teach his neighbor, and every man his brother, saying, \u2018Know the Lord,\u2019 for they all shall know Me, from the least of them to the greatest of them, says the Lord. For I will forgive their iniquity, and their sin I will remember no more.\u201d", "r": "Jeremiah 31:34", "theme": "scripture"}, {"t": "They refused to obey, And they were not mindful of Your wonders That You did among them. But they hardened their necks, And in their rebellion They appointed a leader To return to their bondage. But You are God, Ready to pardon, Gracious and merciful, Slow to anger, Abundant in kindness, And did not forsake them.", "r": "Nehemiah 9:17", "theme": "scripture"}, {"t": "Let the wicked forsake his way, And the unrighteous man his thoughts; Let him return to the Lord, And He will have mercy on him; And to our God, For He will abundantly pardon.", "r": "Isaiah 55:7", "theme": "scripture"}, {"t": "through whom also we have access by faith into this grace in which we stand, and rejoice in hope of the glory of God.", "r": "Romans 5:2", "theme": "scripture"}, {"t": "For if by the one man\u2019s offense death reigned through the one, much more those who receive abundance of grace and of the gift of righteousness will reign in life through the One, Jesus Christ.)", "r": "Romans 5:17", "theme": "scripture"}, {"t": "so that as sin reigned in death, even so grace might reign through righteousness to eternal life through Jesus Christ our Lord.", "r": "Romans 5:21", "theme": "scripture"}, {"t": "For sin shall not have dominion over you, for you are not under law but under grace.", "r": "Romans 6:14", "theme": "scripture"}, {"t": "And if by grace, then it is no longer of works; otherwise grace is no longer grace. But if it is of works, it is no longer grace; otherwise work is no longer work.", "r": "Romans 11:6", "theme": "scripture"}, {"t": "In Him we have redemption through His blood, the forgiveness of sins, according to the riches of His grace", "r": "Ephesians 1:7", "theme": "scripture"}, {"t": "even when we were dead in trespasses, made us alive together with Christ (by grace you have been saved),", "r": "Ephesians 2:5", "theme": "scripture"}, {"t": "that in the ages to come He might show the exceeding riches of His grace in His kindness toward us in Christ Jesus.", "r": "Ephesians 2:7", "theme": "scripture"}, {"t": "that having been justified by His grace we should become heirs according to the hope of eternal life.", "r": "Titus 3:7", "theme": "scripture"}, {"t": "but grow in the grace and knowledge of our Lord and Savior Jesus Christ. To Him be the glory both now and forever. Amen.", "r": "2 Peter 3:18", "theme": "scripture"}, {"t": "But He gives more grace. Therefore He says: \u201cGod resists the proud, But gives grace to the humble.\u201d", "r": "James 4:6", "theme": "scripture"}, {"t": "But by the grace of God I am what I am, and His grace toward me was not in vain; but I labored more abundantly than they all, yet not I, but the grace of God which was with me.", "r": "1 Corinthians 15:10", "theme": "scripture"}, {"t": "For you know the grace of our Lord Jesus Christ, that though He was rich, yet for your sakes He became poor, that you through His poverty might become rich.", "r": "2 Corinthians 8:9", "theme": "scripture"}, {"t": "\u201cSo now, brethren, I commend you to God and to the word of His grace, which is able to build you up and give you an inheritance among all those who are sanctified.", "r": "Acts 20:32", "theme": "scripture"}, {"t": "being justified freely by His grace through the redemption that is in Christ Jesus,", "r": "Romans 3:24", "theme": "scripture"}, {"t": "to the praise of the glory of His grace, by which He made us accepted in the Beloved.", "r": "Ephesians 1:6", "theme": "scripture"}, {"t": "And the grace of our Lord was exceedingly abundant, with faith and love which are in Christ Jesus.", "r": "1 Timothy 1:14", "theme": "scripture"}, {"t": "You therefore, my son, be strong in the grace that is in Christ Jesus.", "r": "2 Timothy 2:1", "theme": "scripture"}, {"t": "Therefore gird up the loins of your mind, be sober, and rest your hope fully upon the grace that is to be brought to you at the revelation of Jesus Christ;", "r": "1 Peter 1:13", "theme": "scripture"}, {"t": "Grace and peace be multiplied to you in the knowledge of God and of Jesus our Lord,", "r": "2 Peter 1:2", "theme": "scripture"}, {"t": "The grace of our Lord Jesus Christ be with you all. Amen.", "r": "Revelation 22:21", "theme": "scripture"}, {"t": "Oh, give thanks to the Lord, for He is good! For His mercy endures forever.", "r": "Psalm 107:1", "theme": "scripture"}, {"t": "Oh, give thanks to the Lord, for He is good! For His mercy endures forever.", "r": "Psalm 118:1", "theme": "scripture"}, {"t": "And whatever you do in word or deed, do all in the name of the Lord Jesus, giving thanks to God the Father through Him.", "r": "Colossians 3:17", "theme": "scripture"}, {"t": "giving thanks always for all things to God the Father in the name of our Lord Jesus Christ,", "r": "Ephesians 5:20", "theme": "scripture"}, {"t": "Let us come before His presence with thanksgiving; Let us shout joyfully to Him with psalms.", "r": "Psalm 95:2", "theme": "scripture"}, {"t": "I will praise the name of God with a song, And will magnify Him with thanksgiving.", "r": "Psalm 69:30", "theme": "scripture"}, {"t": "Offer to God thanksgiving, And pay your vows to the Most High.", "r": "Psalm 50:14", "theme": "scripture"}, {"t": "Thanks be to God for His indescribable gift!", "r": "2 Corinthians 9:15", "theme": "scripture"}, {"t": "\u201cNow therefore, our God, We thank You And praise Your glorious name.", "r": "1 Chronicles 29:13", "theme": "scripture"}, {"t": "To the end that my glory may sing praise to You and not be silent. O Lord my God, I will give thanks to You forever.", "r": "Psalm 30:12", "theme": "scripture"}, {"t": "It is good to give thanks to the Lord, And to sing praises to Your name, O Most High;", "r": "Psalm 92:1", "theme": "scripture"}, {"t": "Praise the Lord! Oh, give thanks to the Lord, for He is good! For His mercy endures forever.", "r": "Psalm 106:1", "theme": "scripture"}, {"t": "I will offer to You the sacrifice of thanksgiving, And will call upon the name of the Lord.", "r": "Psalm 116:17", "theme": "scripture"}, {"t": "Therefore by Him let us continually offer the sacrifice of praise to God, that is, the fruit of our lips, giving thanks to His name.", "r": "Hebrews 13:15", "theme": "scripture"}, {"t": "rooted and built up in Him and established in the faith, as you have been taught, abounding in it with thanksgiving.", "r": "Colossians 2:7", "theme": "scripture"}, {"t": "Continue earnestly in prayer, being vigilant in it with thanksgiving;", "r": "Colossians 4:2", "theme": "scripture"}, {"t": "I will praise You, O Lord, with my whole heart; I will tell of all Your marvelous works.", "r": "Psalm 9:1", "theme": "scripture"}, {"t": "Let them sacrifice the sacrifices of thanksgiving, And declare His works with rejoicing.", "r": "Psalm 107:22", "theme": "scripture"}, {"t": "Whoever offers praise glorifies Me; And to him who orders his conduct aright I will show the salvation of God.\u201d", "r": "Psalm 50:23", "theme": "scripture"}, {"t": "Therefore I will give thanks to You, O Lord, among the Gentiles, And sing praises to Your name.", "r": "2 Samuel 22:50", "theme": "scripture"}, {"t": "For this is God, Our God forever and ever; He will be our guide Even to death.", "r": "Psalm 48:14", "theme": "scripture"}, {"t": "He restores my soul; He leads me in the paths of righteousness For His name\u2019s sake.", "r": "Psalm 23:3", "theme": "scripture"}, {"t": "For You are my rock and my fortress; Therefore, for Your name\u2019s sake, Lead me and guide me.", "r": "Psalm 31:3", "theme": "scripture"}, {"t": "Oh, send out Your light and Your truth! Let them lead me; Let them bring me to Your holy hill And to Your tabernacle.", "r": "Psalm 43:3", "theme": "scripture"}, {"t": "From the end of the earth I will cry to You, When my heart is overwhelmed; Lead me to the rock that is higher than I.", "r": "Psalm 61:2", "theme": "scripture"}, {"t": "Even there Your hand shall lead me, And Your right hand shall hold me.", "r": "Psalm 139:10", "theme": "scripture"}, {"t": "I will bring the blind by a way they did not know; I will lead them in paths they have not known. I will make darkness light before them, And crooked places straight. These things I will do for them, And not forsake them.", "r": "Isaiah 42:16", "theme": "scripture"}, {"t": "Thus says the Lord, your Redeemer, The Holy One of Israel: \u201cI am the Lord your God, Who teaches you to profit, Who leads you by the way you should go.", "r": "Isaiah 48:17", "theme": "scripture"}, {"t": "They shall neither hunger nor thirst, Neither heat nor sun shall strike them; For He who has mercy on them will lead them, Even by the springs of water He will guide them.", "r": "Isaiah 49:10", "theme": "scripture"}, {"t": "And the Lord went before them by day in a pillar of cloud to lead the way, and by night in a pillar of fire to give them light, so as to go by day and night.", "r": "Exodus 13:21", "theme": "scripture"}, {"t": "who went in the way before you to search out a place for you to pitch your tents, to show you the way you should go, in the fire by night and in the cloud by day.", "r": "Deuteronomy 1:33", "theme": "scripture"}, {"t": "To him the doorkeeper opens, and the sheep hear his voice; and he calls his own sheep by name and leads them out.", "r": "John 10:3", "theme": "scripture"}, {"t": "And when he brings out his own sheep, he goes before them; and the sheep follow him, for they know his voice.", "r": "John 10:4", "theme": "scripture"}, {"t": "For as many as are led by the Spirit of God, these are sons of God.", "r": "Romans 8:14", "theme": "scripture"}, {"t": "The integrity of the upright will guide them, But the perversity of the unfaithful will destroy them.", "r": "Proverbs 11:3", "theme": "scripture"}, {"t": "He will feed His flock like a shepherd; He will gather the lambs with His arm, And carry them in His bosom, And gently lead those who are with young.", "r": "Isaiah 40:11", "theme": "scripture"}, {"t": "But He made His own people go forth like sheep, And guided them in the wilderness like a flock;", "r": "Psalm 78:52", "theme": "scripture"}, {"t": "Will you not from this time cry to Me, \u2018My Father, You are the guide of my youth?", "r": "Jeremiah 3:4", "theme": "scripture"}, {"t": "Moreover You led them by day with a cloudy pillar, And by night with a pillar of fire, To give them light on the road Which they should travel.", "r": "Nehemiah 9:12", "theme": "scripture"}, {"t": "But if you are led by the Spirit, you are not under the law.", "r": "Galatians 5:18", "theme": "scripture"}, {"t": "So he shepherded them according to the integrity of his heart, And guided them by the skillfulness of his hands.", "r": "Psalm 78:72", "theme": "scripture"}, {"t": "Lead me, O Lord, in Your righteousness because of my enemies; Make Your way straight before my face.", "r": "Psalm 5:8", "theme": "scripture"}, {"t": "Lead me in Your truth and teach me, For You are the God of my salvation; On You I wait all the day.", "r": "Psalm 25:5", "theme": "scripture"}, {"t": "Teach me Your way, O Lord, And lead me in a smooth path, because of my enemies.", "r": "Psalm 27:11", "theme": "scripture"}, {"t": "Why are you cast down, O my soul? And why are you disquieted within me? Hope in God; For I shall yet praise Him, The help of my countenance and my God.", "r": "Psalm 42:11", "theme": "scripture"}, {"t": "Why are you cast down, O my soul? And why are you disquieted within me? Hope in God; For I shall yet praise Him, The help of my countenance and my God.", "r": "Psalm 43:5", "theme": "scripture"}, {"t": "O Israel, hope in the Lord; For with the Lord there is mercy, And with Him is abundant redemption.", "r": "Psalm 130:7", "theme": "scripture"}, {"t": "The Lord takes pleasure in those who fear Him, In those who hope in His mercy.", "r": "Psalm 147:11", "theme": "scripture"}, {"t": "For surely there is a hereafter, And your hope will not be cut off.", "r": "Proverbs 23:18", "theme": "scripture"}, {"t": "\u201cThe Lord is my portion,\u201d says my soul, \u201cTherefore I hope in Him!\u201d", "r": "Lamentations 3:24", "theme": "scripture"}, {"t": "It is good that one should hope and wait quietly For the salvation of the Lord.", "r": "Lamentations 3:26", "theme": "scripture"}, {"t": "For we were saved in this hope, but hope that is seen is not hope; for why does one still hope for what he sees?", "r": "Romans 8:24", "theme": "scripture"}, {"t": "But if we hope for what we do not see, we eagerly wait for it with perseverance.", "r": "Romans 8:25", "theme": "scripture"}, {"t": "rejoicing in hope, patient in tribulation, continuing steadfastly in prayer;", "r": "Romans 12:12", "theme": "scripture"}, {"t": "To them God willed to make known what are the riches of the glory of this mystery among the Gentiles: which is Christ in you, the hope of glory.", "r": "Colossians 1:27", "theme": "scripture"}, {"t": "But let us who are of the day be sober, putting on the breastplate of faith and love, and as a helmet the hope of salvation.", "r": "1 Thessalonians 5:8", "theme": "scripture"}, {"t": "in hope of eternal life which God, who cannot lie, promised before time began,", "r": "Titus 1:2", "theme": "scripture"}, {"t": "looking for the blessed hope and glorious appearing of our great God and Savior Jesus Christ,", "r": "Titus 2:13", "theme": "scripture"}, {"t": "This hope we have as an anchor of the soul, both sure and steadfast, and which enters the Presence behind the veil,", "r": "Hebrews 6:19", "theme": "scripture"}, {"t": "Blessed be the God and Father of our Lord Jesus Christ, who according to His abundant mercy has begotten us again to a living hope through the resurrection of Jesus Christ from the dead,", "r": "1 Peter 1:3", "theme": "scripture"}, {"t": "Behold, the eye of the Lord is on those who fear Him, On those who hope in His mercy,", "r": "Psalm 33:18", "theme": "scripture"}, {"t": "Let Your mercy, O Lord, be upon us, Just as we hope in You.", "r": "Psalm 33:22", "theme": "scripture"}, {"t": "But I will hope continually, And will praise You yet more and more.", "r": "Psalm 71:14", "theme": "scripture"}, {"t": "Happy is he who has the God of Jacob for his help, Whose hope is in the Lord his God,", "r": "Psalm 146:5", "theme": "scripture"}, {"t": "\u201cBlessed is the man who trusts in the Lord, And whose hope is the Lord.", "r": "Jeremiah 17:7", "theme": "scripture"}, {"t": "You are my hiding place and my shield; I hope in Your word.", "r": "Psalm 119:114", "theme": "scripture"}, {"t": "And now abide faith, hope, love, these three; but the greatest of these is love.", "r": "1 Corinthians 13:13", "theme": "scripture"}, {"t": "Now may our Lord Jesus Christ Himself, and our God and Father, who has loved us and given us everlasting consolation and good hope by grace,", "r": "2 Thessalonians 2:16", "theme": "scripture"}, {"t": "Therefore be patient, brethren, until the coming of the Lord. See how the farmer waits for the precious fruit of the earth, waiting patiently for it until it receives the early and latter rain.", "r": "James 5:7", "theme": "scripture"}, {"t": "You also be patient. Establish your hearts, for the coming of the Lord is at hand.", "r": "James 5:8", "theme": "scripture"}, {"t": "My brethren, take the prophets, who spoke in the name of the Lord, as an example of suffering and patience.", "r": "James 5:10", "theme": "scripture"}, {"t": "knowing that the testing of your faith produces patience.", "r": "James 1:3", "theme": "scripture"}, {"t": "But let patience have its perfect work, that you may be perfect and complete, lacking nothing.", "r": "James 1:4", "theme": "scripture"}, {"t": "and perseverance, character; and character, hope.", "r": "Romans 5:4", "theme": "scripture"}, {"t": "For whatever things were written before were written for our learning, that we through the patience and comfort of the Scriptures might have hope.", "r": "Romans 15:4", "theme": "scripture"}, {"t": "Now may the God of patience and comfort grant you to be like-minded toward one another, according to Christ Jesus,", "r": "Romans 15:5", "theme": "scripture"}, {"t": "that you do not become sluggish, but imitate those who through faith and patience inherit the promises.", "r": "Hebrews 6:12", "theme": "scripture"}, {"t": "For you have need of endurance, so that after you have done the will of God, you may receive the promise:", "r": "Hebrews 10:36", "theme": "scripture"}, {"t": "But the ones that fell on the good ground are those who, having heard the word with a noble and good heart, keep it and bear fruit with patience.", "r": "Luke 8:15", "theme": "scripture"}, {"t": "By your patience possess your souls.", "r": "Luke 21:19", "theme": "scripture"}, {"t": "Because you have kept My command to persevere, I also will keep you from the hour of trial which shall come upon the whole world, to test those who dwell on the earth.", "r": "Revelation 3:10", "theme": "scripture"}, {"t": "If we endure, We shall also reign with Him. If we deny Him, He also will deny us.", "r": "2 Timothy 2:12", "theme": "scripture"}, {"t": "The end of a thing is better than its beginning; The patient in spirit is better than the proud in spirit.", "r": "Ecclesiastes 7:8", "theme": "scripture"}, {"t": "He who is slow to anger is better than the mighty, And he who rules his spirit than he who takes a city.", "r": "Proverbs 16:32", "theme": "scripture"}, {"t": "Rest in the Lord, and wait patiently for Him; Do not fret because of him who prospers in his way, Because of the man who brings wicked schemes to pass.", "r": "Psalm 37:7", "theme": "scripture"}, {"t": "I waited patiently for the Lord; And He inclined to me, And heard my cry.", "r": "Psalm 40:1", "theme": "scripture"}, {"t": "Therefore the Lord will wait, that He may be gracious to you; And therefore He will be exalted, that He may have mercy on you. For the Lord is a God of justice; Blessed are all those who wait for Him.", "r": "Isaiah 30:18", "theme": "scripture"}, {"t": "He who is slow to wrath has great understanding, But he who is impulsive exalts folly.", "r": "Proverbs 14:29", "theme": "scripture"}, {"t": "with all lowliness and gentleness, with longsuffering, bearing with one another in love,", "r": "Ephesians 4:2", "theme": "scripture"}, {"t": "\u201cSo I will restore to you the years that the swarming locust has eaten, The crawling locust, The consuming locust, And the chewing locust, My great army which I sent among you.", "r": "Joel 2:25", "theme": "scripture"}, {"t": "And they shall rebuild the old ruins, They shall raise up the former desolations, And they shall repair the ruined cities, The desolations of many generations.", "r": "Isaiah 61:4", "theme": "scripture"}, {"t": "Instead of your shame you shall have double honor, And instead of confusion they shall rejoice in their portion. Therefore in their land they shall possess double; Everlasting joy shall be theirs.", "r": "Isaiah 61:7", "theme": "scripture"}, {"t": "I will be found by you, says the Lord, and I will bring you back from your captivity; I will gather you from all the nations and from all the places where I have driven you, says the Lord, and I will bring you to the place from which I cause you to be carried away captive.", "r": "Jeremiah 29:14", "theme": "scripture"}, {"t": "For behold, the days are coming,\u2019 says the Lord, \u2018that I will bring back from captivity My people Israel and Judah,\u2019 says the Lord. \u2018And I will cause them to return to the land that I gave to their fathers, and they shall possess it.\u2019 \u201d", "r": "Jeremiah 30:3", "theme": "scripture"}, {"t": "Again I will build you, and you shall be rebuilt, O virgin of Israel! You shall again be adorned with your tambourines, And shall go forth in the dances of those who rejoice.", "r": "Jeremiah 31:4", "theme": "scripture"}, {"t": "And I will cause the captives of Judah and the captives of Israel to return, and will rebuild those places as at the first.", "r": "Jeremiah 33:7", "theme": "scripture"}, {"t": "I will put My Spirit in you, and you shall live, and I will place you in your own land. Then you shall know that I, the Lord, have spoken it and performed it,\u201d says the Lord.\u2019 \u201d", "r": "Ezekiel 37:14", "theme": "scripture"}, {"t": "I will bring back the captives of My people Israel; They shall build the waste cities and inhabit them; They shall plant vineyards and drink wine from them; They shall also make gardens and eat fruit from them.", "r": "Amos 9:14", "theme": "scripture"}, {"t": "At that time I will bring you back, Even at the time I gather you; For I will give you fame and praise Among all the peoples of the earth, When I return your captives before your eyes,\u201d Says the Lord.", "r": "Zephaniah 3:20", "theme": "scripture"}, {"t": "Return to the stronghold, You prisoners of hope. Even today I declare That I will restore double to you.", "r": "Zechariah 9:12", "theme": "scripture"}, {"t": "And the Lord restored Job\u2019s losses when he prayed for his friends. Indeed the Lord gave Job twice as much as he had before.", "r": "Job 42:10", "theme": "scripture"}, {"t": "Brethren, if a man is overtaken in any trespass, you who are spiritual restore such a one in a spirit of gentleness, considering yourself lest you also be tempted.", "r": "Galatians 6:1", "theme": "scripture"}, {"t": "Behold, I will do a new thing, Now it shall spring forth; Shall you not know it? I will even make a road in the wilderness And rivers in the desert.", "r": "Isaiah 43:19", "theme": "scripture"}, {"t": "whom heaven must receive until the times of restoration of all things, which God has spoken by the mouth of all His holy prophets since the world began.", "r": "Acts 3:21", "theme": "scripture"}, {"t": "that the Lord your God will bring you back from captivity, and have compassion on you, and gather you again from all the nations where the Lord your God has scattered you.", "r": "Deuteronomy 30:3", "theme": "scripture"}, {"t": "When the Lord brought back the captivity of Zion, We were like those who dream.", "r": "Psalm 126:1", "theme": "scripture"}, {"t": "Turn us back to You, O Lord, and we will be restored; Renew our days as of old,", "r": "Lamentations 5:21", "theme": "scripture"}, {"t": "Behold, I will gather them out of all countries where I have driven them in My anger, in My fury, and in great wrath; I will bring them back to this place, and I will cause them to dwell safely.", "r": "Jeremiah 32:37", "theme": "scripture"}, {"t": "Thus says the Lord: \u201cIn an acceptable time I have heard You, And in the day of salvation I have helped You; I will preserve You and give You As a covenant to the people, To restore the earth, To cause them to inherit the desolate heritages;", "r": "Isaiah 49:8", "theme": "scripture"}, {"t": "\u201cWhen I bring back their captives, the captives of Sodom and her daughters, and the captives of Samaria and her daughters, then I will also bring back the captives of your captivity among them,", "r": "Ezekiel 16:53", "theme": "scripture"}, {"t": "You, who have shown me great and severe troubles, Shall revive me again, And bring me up again from the depths of the earth.", "r": "Psalm 71:20", "theme": "scripture"}, {"t": "Finally, my brethren, be strong in the Lord and in the power of His might.", "r": "Ephesians 6:10", "theme": "scripture"}, {"t": "My flesh and my heart fail; But God is the strength of my heart and my portion forever.", "r": "Psalm 73:26", "theme": "scripture"}, {"t": "The Lord God is my strength; He will make my feet like deer\u2019s feet, And He will make me walk on my high hills. To the Chief Musician. With my stringed instruments.", "r": "Habakkuk 3:19", "theme": "scripture"}, {"t": "Seek the Lord and His strength; Seek His face evermore!", "r": "1 Chronicles 16:11", "theme": "scripture"}, {"t": "For the eyes of the Lord run to and fro throughout the whole earth, to show Himself strong on behalf of those whose heart is loyal to Him. In this you have done foolishly; therefore from now on you shall have wars.\u201d", "r": "2 Chronicles 16:9", "theme": "scripture"}, {"t": "The Lord is my strength and song, And He has become my salvation; He is my God, and I will praise Him; My father\u2019s God, and I will exalt Him.", "r": "Exodus 15:2", "theme": "scripture"}, {"t": "Your sandals shall be iron and bronze; As your days, so shall your strength be.", "r": "Deuteronomy 33:25", "theme": "scripture"}, {"t": "Behold, God is my salvation, I will trust and not be afraid; \u2018For Yah, the Lord, is my strength and song; He also has become my salvation.\u2019 \u201d", "r": "Isaiah 12:2", "theme": "scripture"}, {"t": "Trust in the Lord forever, For in YAH, the Lord, is everlasting strength.", "r": "Isaiah 26:4", "theme": "scripture"}, {"t": "For thus says the Lord God, the Holy One of Israel: \u201cIn returning and rest you shall be saved; In quietness and confidence shall be your strength.\u201d But you would not,", "r": "Isaiah 30:15", "theme": "scripture"}, {"t": "Those who do wickedly against the covenant he shall corrupt with flattery; but the people who know their God shall be strong, and carry out great exploits.", "r": "Daniel 11:32", "theme": "scripture"}, {"t": "Beat your plowshares into swords And your pruning hooks into spears; Let the weak say, \u2018I am strong.\u2019 \u201d", "r": "Joel 3:10", "theme": "scripture"}, {"t": "The Lord is my strength and song, And He has become my salvation.", "r": "Psalm 118:14", "theme": "scripture"}, {"t": "that He would grant you, according to the riches of His glory, to be strengthened with might through His Spirit in the inner man,", "r": "Ephesians 3:16", "theme": "scripture"}, {"t": "strengthened with all might, according to His glorious power, for all patience and longsuffering with joy;", "r": "Colossians 1:11", "theme": "scripture"}, {"t": "But the Lord stood with me and strengthened me, so that the message might be preached fully through me, and that all the Gentiles might hear. Also I was delivered out of the mouth of the lion.", "r": "2 Timothy 4:17", "theme": "scripture"}, {"t": "Strengthen the weak hands, And make firm the feeble knees.", "r": "Isaiah 35:3", "theme": "scripture"}, {"t": "In the day when I cried out, You answered me, And made me bold with strength in my soul.", "r": "Psalm 138:3", "theme": "scripture"}, {"t": "Both riches and honor come from You, And You reign over all. In Your hand is power and might; In Your hand it is to make great And to give strength to all.", "r": "1 Chronicles 29:12", "theme": "scripture"}, {"t": "It is God who arms me with strength, And makes my way perfect.", "r": "Psalm 18:32", "theme": "scripture"}, {"t": "Yet in all these things we are more than conquerors through Him who loved us.", "r": "Romans 8:37", "theme": "scripture"}, {"t": "But thanks be to God, who gives us the victory through our Lord Jesus Christ.", "r": "1 Corinthians 15:57", "theme": "scripture"}, {"t": "Now thanks be to God who always leads us in triumph in Christ, and through us diffuses the fragrance of His knowledge in every place.", "r": "2 Corinthians 2:14", "theme": "scripture"}, {"t": "And they overcame him by the blood of the Lamb and by the word of their testimony, and they did not love their lives to the death.", "r": "Revelation 12:11", "theme": "scripture"}, {"t": "To him who overcomes I will grant to sit with Me on My throne, as I also overcame and sat down with My Father on His throne.", "r": "Revelation 3:21", "theme": "scripture"}, {"t": "\u201cHe who has an ear, let him hear what the Spirit says to the churches. To him who overcomes I will give \n    \n    to eat from \n    \n    the tree of life, which is in the midst of the Paradise of God.\u201d \u2019", "r": "Revelation 2:7", "theme": "scripture"}, {"t": "You will not need to fight in this battle. Position yourselves, stand still and see the salvation of the Lord, who is with you, O Judah and Jerusalem!\u2019 Do not fear or be dismayed; tomorrow go out against them, for the Lord is with you.\u201d", "r": "2 Chronicles 20:17", "theme": "scripture"}, {"t": "Then all this assembly shall know that the Lord does not save with sword and spear; for the battle is the Lord\u2019s, and He will give you into our hands.\u201d", "r": "1 Samuel 17:47", "theme": "scripture"}, {"t": "Through God we will do valiantly, For it is He who shall tread down our enemies.", "r": "Psalm 60:12", "theme": "scripture"}, {"t": "The horse is prepared for the day of battle, But deliverance is of the Lord.", "r": "Proverbs 21:31", "theme": "scripture"}, {"t": "They will fight against you, But they shall not prevail against you. For I am with you,\u201d says the Lord, \u201cto deliver you.\u201d", "r": "Jeremiah 1:19", "theme": "scripture"}, {"t": "No temptation has overtaken you except such as is common to man; but God is faithful, who will not allow you to be tempted beyond what you are able, but with the temptation will also make the way of escape, that you may be able to bear it.", "r": "1 Corinthians 10:13", "theme": "scripture"}, {"t": "Therefore take up the whole armor of God, that you may be able to withstand in the evil day, and having done all, to stand.", "r": "Ephesians 6:13", "theme": "scripture"}, {"t": "I write to you, fathers, Because you have known Him who is from the beginning. I write to you, young men, Because you have overcome the wicked one. I write to you, little children, Because you have known the Father.", "r": "1 John 2:13", "theme": "scripture"}, {"t": "You must not fear them, for the Lord your God Himself fights for you.\u2019", "r": "Deuteronomy 3:22", "theme": "scripture"}, {"t": "Wherever you hear the sound of the trumpet, rally to us there. Our God will fight for us.\u201d", "r": "Nehemiah 4:20", "theme": "scripture"}, {"t": "Some trust in chariots, and some in horses; But we will remember the name of the Lord our God.", "r": "Psalm 20:7", "theme": "scripture"}, {"t": "The voice of rejoicing and salvation Is in the tents of the righteous; The right hand of the Lord does valiantly.", "r": "Psalm 118:15", "theme": "scripture"}, {"t": "Through God we will do valiantly, For it is He who shall tread down our enemies.", "r": "Psalm 108:13", "theme": "scripture"}, {"t": "They shall be like mighty men, Who tread down their enemies In the mire of the streets in the battle. They sh
