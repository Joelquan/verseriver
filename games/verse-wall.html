<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"/>
<title>Verse Wall</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Tenor+Sans&family=Josefin+Sans:wght@200;300;400&family=Cinzel:wght@400;600&family=Playfair+Display:ital,wght@0,500;1,400;1,500&family=Lora:ital,wght@0,400;1,400&family=Great+Vibes&family=Libre+Baskerville:ital,wght@0,400;1,400&display=swap');
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:#0d0d0d;}
body{font-family:'Tenor Sans',sans-serif;color:#f5e3b8;min-height:100vh;}

@keyframes wv-rise-in{from{opacity:0;transform:translateY(36px)}to{opacity:1;transform:translateY(0)}}
@keyframes wv-rise-out{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-36px)}}
@keyframes wv-fall-in{from{opacity:0;transform:translateY(-36px)}to{opacity:1;transform:translateY(0)}}
@keyframes wv-fall-out{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(36px)}}
@keyframes wv-fade-in{from{opacity:0}to{opacity:1}}
@keyframes wv-fade-out{from{opacity:1}to{opacity:0}}
@keyframes wv-flip-in{from{opacity:0;transform:perspective(520px) rotateX(72deg)}to{opacity:1;transform:perspective(520px) rotateX(0deg)}}
@keyframes wv-flip-out{from{opacity:1;transform:perspective(520px) rotateX(0deg)}to{opacity:0;transform:perspective(520px) rotateX(-72deg)}}
@keyframes wv-zoom-in{from{opacity:0;transform:scale(.84)}to{opacity:1;transform:scale(1)}}
@keyframes wv-zoom-out{from{opacity:1;transform:scale(1)}to{opacity:0;transform:scale(1.16)}}
@keyframes wv-slide-l-in{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:translateX(0)}}
@keyframes wv-slide-l-out{from{opacity:1;transform:translateX(0)}to{opacity:0;transform:translateX(-40px)}}
@keyframes wv-slide-r-in{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:translateX(0)}}
@keyframes wv-slide-r-out{from{opacity:1;transform:translateX(0)}to{opacity:0;transform:translateX(40px)}}
@keyframes wv-blur-in{from{opacity:0;filter:blur(12px)}to{opacity:1;filter:blur(0px)}}
@keyframes wv-blur-out{from{opacity:1;filter:blur(0px)}to{opacity:0;filter:blur(12px)}}

.wv-top{position:sticky;top:0;z-index:10;background:#0e0e0e;}
.wv-head{display:flex;align-items:center;justify-content:space-between;
 padding:14px 16px 10px;
 border-bottom:.5px solid rgba(201,147,58,.14);}
.wv-title{font-family:'Cinzel',serif;font-size:16px;font-weight:600;letter-spacing:4px;color:#f5e3b8;}
.wv-sub{font-family:'Cormorant Garamond',serif;font-size:12px;color:rgba(255,255,255,.38);margin-top:3px;}
.wv-still{flex-shrink:0;padding:8px 15px;border-radius:20px;border:.5px solid rgba(255,255,255,.14);
 background:rgba(255,255,255,.03);color:rgba(255,255,255,.55);font-size:10px;font-family:'Tenor Sans',sans-serif;
 letter-spacing:.6px;cursor:pointer;}
.wv-still.on{border-color:#c9933a;background:rgba(201,147,58,.14);color:#c9933a;}
.wv-menu{flex-shrink:0;width:38px;height:38px;border-radius:50%;border:.5px solid rgba(255,255,255,.14);
 background:rgba(255,255,255,.03);color:rgba(245,227,184,.85);font-size:16px;cursor:pointer;margin-right:11px;}
.wv-headmid{flex:1;min-width:0;}
.wv-scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .3s;z-index:40;}
.wv-viewbar{display:flex;justify-content:center;padding:8px 16px;
 border-bottom:.5px solid rgba(201,147,58,.14);}
.wv-viewtabs{display:flex;background:rgba(255,255,255,.05);border:.5px solid rgba(255,255,255,.12);border-radius:20px;padding:3px;}
.wv-viewtabs button{border:0;background:transparent;color:rgba(255,255,255,.55);font-family:'Tenor Sans',sans-serif;
 font-size:11px;letter-spacing:2.5px;text-transform:uppercase;padding:7px 26px;border-radius:16px;cursor:pointer;}
.wv-viewtabs button.on{background:rgba(201,147,58,.22);color:#e8c876;}
.wv-river{position:relative;overflow:hidden;display:none;max-width:640px;margin:0 auto;
 background:linear-gradient(180deg,#0d0d10 0%,#0b0b0e 50%,#0d0d10 100%);}
.rv-card{position:absolute !important;margin:0;box-sizing:border-box;touch-action:none;}
.rv-card .wv-body{box-sizing:border-box;}
.rv-card .wv-body{position:relative;inset:auto;}
.wv-scrim.open{opacity:1;pointer-events:auto;}
.wv-drawer{position:fixed;top:0;left:0;bottom:0;width:284px;max-width:84vw;background:#101013;
 border-right:.5px solid rgba(201,147,58,.25);z-index:41;transform:translateX(-105%);transition:transform .32s ease;
 overflow-y:auto;padding:20px 16px 34px;-webkit-overflow-scrolling:touch;}
.wv-drawer.open{transform:translateX(0);}
.wv-dr-title{font-family:'Cinzel',serif;font-size:15px;letter-spacing:3px;color:#f5e3b8;margin-bottom:14px;}
.wv-dr-modes{display:flex;flex-direction:column;gap:8px;margin-bottom:16px;}
.wv-dr-modes button{padding:11px 12px;border-radius:10px;border:.5px solid rgba(255,255,255,.12);
 background:rgba(255,255,255,.03);color:rgba(255,255,255,.75);font-family:'Tenor Sans',sans-serif;font-size:12px;
 letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;text-align:left;}
.wv-dr-modes button.on{border-color:#c9933a;background:rgba(201,147,58,.14);color:#e8c876;}
.wv-dr-sub{font-family:'Tenor Sans',sans-serif;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:rgba(255,255,255,.5);margin:4px 0 6px;}
.wv-dr-label{font-family:'Tenor Sans',sans-serif;font-size:10px;letter-spacing:2px;text-transform:uppercase;
 color:rgba(201,147,58,.7);margin:14px 0 8px;}
.wv-dr-books{display:flex;flex-wrap:wrap;gap:6px;}
.wv-chip{padding:7px 10px;border-radius:999px;border:.5px solid rgba(255,255,255,.12);
 background:rgba(255,255,255,.03);color:rgba(255,255,255,.65);font-size:11px;font-family:'Tenor Sans',sans-serif;cursor:pointer;}
.wv-chip span{opacity:.5;font-size:10px;margin-left:4px;}
.wv-chip.on{border-color:#c9933a;background:rgba(201,147,58,.16);color:#e8c876;}
.wv-chip.on span{opacity:.8;}
.wv-mosaic{position:relative;display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:124px;gap:8px;
 grid-auto-flow:dense;padding:12px;max-width:640px;margin:0 auto;}
.sz-s{grid-column:span 1;grid-row:span 1;}
.sz-t{grid-column:span 1;grid-row:span 2;}
.sz-w{grid-column:span 2;grid-row:span 1;}
.sz-l{grid-column:span 2;grid-row:span 2;}
.wv-card{position:relative;border-radius:14px;overflow:hidden;cursor:pointer;box-shadow:0 4px 18px rgba(0,0,0,.4);min-height:0;min-width:0;}
.wv-card{-webkit-touch-callout:none;user-select:none;-webkit-user-select:none;}
.wv-pin{position:absolute;top:5px;left:50%;width:10px;height:10px;border-radius:50%;opacity:0;z-index:3;pointer-events:none;
 transform:translateX(-50%) scale(.6);transition:opacity .3s,transform .3s;
 background:radial-gradient(circle at 35% 30%,#ffe9a8,#e8b84b 42%,#a5762a 72%,#6e4c12);
 box-shadow:0 1px 4px rgba(0,0,0,.55),inset 0 1px 1px rgba(255,255,255,.55),inset 0 -1px 2px rgba(60,35,5,.5);}
.wv-pin::before{content:"";position:absolute;left:50%;top:1.2px;width:1.6px;height:7.6px;margin-left:-.8px;border-radius:1px;
 background:linear-gradient(90deg,#6b4a12,#2e1f06);box-shadow:inset 0 1px 1px rgba(0,0,0,.6);}
.wv-pin::after{content:"";position:absolute;left:50%;top:2.7px;width:5px;height:1.6px;margin-left:-2.5px;border-radius:1px;
 background:linear-gradient(180deg,#6b4a12,#2e1f06);box-shadow:inset 0 1px 1px rgba(0,0,0,.6);}
.wv-card.pinned .wv-pin{opacity:.95;transform:translateX(-50%) scale(1);}
.wv-skinov{position:absolute;inset:0;pointer-events:none;}
.wv-grain{position:absolute;inset:0;opacity:.05;background-size:128px;pointer-events:none;}
.wv-topline{position:absolute;top:0;left:0;right:0;height:2px;opacity:.7;pointer-events:none;}
.wv-body{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;overflow:hidden;}
.wv-quote{font-family:'Cormorant Garamond',serif;line-height:1;margin-bottom:5px;opacity:.55;}
.wv-text{font-family:'Cormorant Garamond',serif;line-height:1.55;text-shadow:0 2px 12px rgba(0,0,0,.5);}
.wv-ref{margin-top:8px;font-size:9px;letter-spacing:1.6px;text-transform:uppercase;font-family:'Tenor Sans',sans-serif;}
.wv-overlay{position:fixed;inset:0;z-index:50;display:none;flex-direction:column;justify-content:center;padding:40px 30px;}
.wv-overlay.open{display:flex;}
.wv-ov-quote{font-family:'Cormorant Garamond',serif;font-size:64px;line-height:1;opacity:.4;margin-bottom:10px;}
.wv-ov-text{font-family:'Cormorant Garamond',serif;font-size:24px;line-height:1.7;text-shadow:0 2px 14px rgba(0,0,0,.55);}
.wv-ov-ref{margin-top:22px;font-size:12px;letter-spacing:2.5px;text-transform:uppercase;font-family:'Tenor Sans',sans-serif;}
.wv-ov-close{position:absolute;top:18px;right:18px;width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.4);
 border:.5px solid rgba(255,255,255,.16);color:rgba(255,255,255,.72);font-size:16px;cursor:pointer;}
.wv-ov-share{position:absolute;bottom:34px;left:50%;transform:translateX(-50%);padding:13px 34px;border-radius:999px;
 background:rgba(0,0,0,.45);border:1px solid rgba(201,147,58,.65);color:#e8c876;font-family:'Tenor Sans',sans-serif;
 font-size:13px;letter-spacing:2.5px;text-transform:uppercase;cursor:pointer;}
.wv-ov-share:active{transform:translateX(-50%) scale(.96);}
.wv-shareprev{position:fixed;inset:0;z-index:90;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.93);padding:22px;box-sizing:border-box;}
.wv-shareprev.open{display:flex;}
.wv-shareprev img{max-width:100%;max-height:72vh;border-radius:10px;box-shadow:0 8px 40px rgba(0,0,0,.6);}
.wv-shareprev p{color:#e8dcc0;margin:18px 6px 0;text-align:center;font-size:15px;line-height:1.55;}
.wv-shareprev button{margin-top:16px;padding:11px 34px;border-radius:999px;border:1px solid #c9933a;background:transparent;color:#c9933a;font-size:15px;}
</style>
</head>
<body>
<div class="wv-top">
<div class="wv-head">
  <button class="wv-menu" id="menuBtn">&#9776;</button>
  <div class="wv-headmid">
    <div class="wv-title">VERSE WALL</div>
    <div class="wv-sub" id="filterSub">Every verse keeps its own time. Some ascend, some descend.</div>
  </div>
  <button class="wv-still" id="stillBtn">&#10074;&#10074; Still</button>
</div>
<div class="wv-viewbar" id="viewbar">
  <div class="wv-viewtabs">

</div>
</div>
<div class="wv-mosaic" id="mosaic"></div>
<div class="wv-river" id="river"></div>

</aside>
<div class="wv-overlay" id="overlay">

  <div class="wv-ov-text" id="ovText"></div>

  <button id="sharePrevClose">Close</button>
</div>
<script>
"use strict";
const WALL_VERSES = [{"t": "Be still, and know that I am God; I will be exalted among the nations, I will be exalted in the earth!", "r": "Psalm 46:10", "theme": "peace"}, {"t": "Peace I leave with you, My peace I give to you; not as the world gives do I give to you. Let not your heart be troubled, neither let it be afraid.", "r": "John 14:27", "theme": "peace"}, {"t": "You will keep him in perfect peace, Whose mind is stayed on You, Because he trusts in You.", "r": "Isaiah 26:3", "theme": "peace"}, {"t": "The Lord is my shepherd; I shall not want.", "r": "Psalm 23:1", "theme": "peace"}, {"t": "casting all your care upon Him, for He cares for you.", "r": "1 Peter 5:7", "theme": "peace"}, {"t": "Now faith is the substance of things hoped for, the evidence of things not seen.", "r": "Hebrews 11:1", "theme": "faith"}, {"t": "Trust in the Lord with all your heart, And lean not on your own understanding;", "r": "Proverbs 3:5", "theme": "faith"}, {"t": "For we walk by faith, not by sight.", "r": "2 Corinthians 5:7", "theme": "faith"}, {"t": "But without faith it is impossible to please Him, for he who comes to God must believe that He is, and that He is a rewarder of those who diligently seek Him.", "r": "Hebrews 11:6", "theme": "faith"}, {"t": "So Jesus said to them, \u201cBecause of your unbelief; for assuredly, I say to you, if you have faith as a mustard seed, you will say to this mountain, \u2018Move from here to there,\u2019 and it will move; and nothing will be impossible for you.", "r": "Matthew 17:20", "theme": "faith"}, {"t": "I can do all things through Christ who strengthens me.", "r": "Philippians 4:13", "theme": "strength"}, {"t": "Then he said to them, \u201cGo your way, eat the fat, drink the sweet, and send portions to those for whom nothing is prepared; for this day is holy to our Lord. Do not sorrow, for the joy of the Lord is your strength.\u201d", "r": "Nehemiah 8:10", "theme": "strength"}, {"t": "Have I not commanded you? Be strong and of good courage; do not be afraid, nor be dismayed, for the Lord your God is with you wherever you go.\u201d", "r": "Joshua 1:9", "theme": "strength"}, {"t": "He gives power to the weak, And to those who have no might He increases strength.", "r": "Isaiah 40:29", "theme": "strength"}, {"t": "The Lord is my strength and my shield; My heart trusted in Him, and I am helped; Therefore my heart greatly rejoices, And with my song I will praise Him.", "r": "Psalm 28:7", "theme": "strength"}, {"t": "For God so loved the world that He gave His only begotten Son, that whoever believes in Him should not perish but have everlasting life.", "r": "John 3:16", "theme": "love"}, {"t": "Greater love has no one than this, than to lay down one\u2019s life for his friends.", "r": "John 15:13", "theme": "love"}, {"t": "Love suffers long and is kind; love does not envy; love does not parade itself, is not puffed up;", "r": "1 Corinthians 13:4", "theme": "love"}, {"t": "We love Him because He first loved us.", "r": "1 John 4:19", "theme": "love"}, {"t": "For I am persuaded that neither death nor life, nor angels nor principalities nor powers, nor things present nor things to come, nor height nor depth, nor any other created thing, shall be able to separate us from the love of God which is in Christ Jesus our Lord.", "r": "Romans 8:38-39", "theme": "love"}, {"t": "Your word is a lamp to my feet And a light to my path.", "r": "Psalm 119:105", "theme": "wisdom"}, {"t": "\u201cThe fear of the Lord is the beginning of wisdom, And the knowledge of the Holy One is understanding.", "r": "Proverbs 9:10", "theme": "wisdom"}, {"t": "If any of you lacks wisdom, let him ask of God, who gives to all liberally and without reproach, and it will be given to him.", "r": "James 1:5", "theme": "wisdom"}, {"t": "How much better to get wisdom than gold! And to get understanding is to be chosen rather than silver.", "r": "Proverbs 16:16", "theme": "wisdom"}, {"t": "Bless the Lord, O my soul; And all that is within me, bless His holy name!", "r": "Psalm 103:1", "theme": "praise"}, {"t": "I will bless the Lord at all times; His praise shall continually be in my mouth.", "r": "Psalm 34:1", "theme": "praise"}, {"t": "Let everything that has breath praise the Lord. Praise the Lord!", "r": "Psalm 150:6", "theme": "praise"}, {"t": "Enter into His gates with thanksgiving, And into His courts with praise. Be thankful to Him, and bless His name.", "r": "Psalm 100:4", "theme": "praise"}, {"t": "Oh, sing to the Lord a new song! Sing to the Lord, all the earth.", "r": "Psalm 96:1", "theme": "praise"}, {"t": "And He said to me, \u201cMy grace is sufficient for you, for My strength is made perfect in weakness.\u201d Therefore most gladly I will rather boast in my infirmities, that the power of Christ may rest upon me.", "r": "2 Corinthians 12:9", "theme": "grace"}, {"t": "For by grace you have been saved through faith, and that not of yourselves; it is the gift of God,", "r": "Ephesians 2:8", "theme": "grace"}, {"t": "Let us therefore come boldly to the throne of grace, that we may obtain mercy and find grace to help in time of need.", "r": "Hebrews 4:16", "theme": "grace"}, {"t": "Moreover the law entered that the offense might abound. But where sin abounded, grace abounded much more,", "r": "Romans 5:20", "theme": "grace"}, {"t": "\u201cAsk, and it will be given to you; seek, and you will find; knock, and it will be opened to you.", "r": "Matthew 7:7", "theme": "prayer"}, {"t": "Be anxious for nothing, but in everything by prayer and supplication, with thanksgiving, let your requests be made known to God;", "r": "Philippians 4:6", "theme": "prayer"}, {"t": "Confess your trespasses to one another, and pray for one another, that you may be healed. The effective, fervent prayer of a righteous man avails much.", "r": "James 5:16", "theme": "prayer"}, {"t": "\u2018Call to Me, and I will answer you, and show you great and mighty things, which you do not know.\u2019", "r": "Jeremiah 33:3", "theme": "prayer"}, {"t": "The Lord is my light and my salvation; Whom shall I fear? The Lord is the strength of my life; Of whom shall I be afraid?", "r": "Psalm 27:1", "theme": "hope"}, {"t": "For I know the thoughts that I think toward you, says the Lord, thoughts of peace and not of evil, to give you a future and a hope.", "r": "Jeremiah 29:11", "theme": "hope"}, {"t": "Now may the God of hope fill you with all joy and peace in believing, that you may abound in hope by the power of the Holy Spirit.", "r": "Romans 15:13", "theme": "hope"}, {"t": "But those who wait on the Lord Shall renew their strength; They shall mount up with wings like eagles, They shall run and not be weary, They shall walk and not faint.", "r": "Isaiah 40:31", "theme": "hope"}, {"t": "For His anger is but for a moment, His favor is for life; Weeping may endure for a night, But joy comes in the morning.", "r": "Psalm 30:5", "theme": "hope"}, {"t": "No weapon formed against you shall prosper, And every tongue which rises against you in judgment You shall condemn. This is the heritage of the servants of the Lord, And their righteousness is from Me,\u201d Says the Lord.", "r": "Isaiah 54:17", "theme": "warfare"}, {"t": "Put on the whole armor of God, that you may be able to stand against the wiles of the devil.", "r": "Ephesians 6:11", "theme": "warfare"}, {"t": "You are of God, little children, and have overcome them, because He who is in you is greater than he who is in the world.", "r": "1 John 4:4", "theme": "warfare"}, {"t": "Therefore submit to God. Resist the devil and he will flee from you.", "r": "James 4:7", "theme": "warfare"}, {"t": "But He was wounded for our transgressions, He was bruised for our iniquities; The chastisement for our peace was upon Him, And by His stripes we are healed.", "r": "Isaiah 53:5", "theme": "healing"}, {"t": "He heals the brokenhearted And binds up their wounds.", "r": "Psalm 147:3", "theme": "healing"}, {"t": "and said, \u201cIf you diligently heed the voice of the Lord your God and do what is right in His sight, give ear to His commandments and keep all His statutes, I will put none of the diseases on you which I have brought on the Egyptians. For I am the Lord who heals you.\u201d", "r": "Exodus 15:26", "theme": "healing"}, {"t": "Bless the Lord, O my soul, And forget not all His benefits: Who forgives all your iniquities, Who heals all your diseases,", "r": "Psalm 103:2-3", "theme": "healing"}, {"t": "For the wages of sin is death, but the gift of God is eternal life in Christ Jesus our Lord.", "r": "Romans 6:23", "theme": "salvation"}, {"t": "For \u201cwhoever calls on the name of the Lord shall be saved.\u201d", "r": "Romans 10:13", "theme": "salvation"}, {"t": "Jesus said to him, \u201cI am the way, the truth, and the life. No one comes to the Father except through Me.", "r": "John 14:6", "theme": "salvation"}, {"t": "because it is written, \u201cBe holy, for I am holy.\u201d", "r": "1 Peter 1:16", "theme": "holiness"}, {"t": "Create in me a clean heart, O God, And renew a steadfast spirit within me.", "r": "Psalm 51:10", "theme": "holiness"}, {"t": "Pursue peace with all people, and holiness, without which no one will see the Lord:", "r": "Hebrews 12:14", "theme": "holiness"}, {"t": "Blessed are the pure in heart, For \n    \n    they shall see God.", "r": "Matthew 5:8", "theme": "holiness"}, {"t": "Rejoice in the Lord always. Again I will say, rejoice!", "r": "Philippians 4:4", "theme": "joy"}, {"t": "The Lord your God in your midst, The Mighty One, will save; He will rejoice over you with gladness, He will quiet you with His love, He will rejoice over you with singing.\u201d", "r": "Zephaniah 3:17", "theme": "joy"}, {"t": "This is the day the Lord has made; We will rejoice and be glad in it.", "r": "Psalm 118:24", "theme": "joy"}, {"t": "You will show me the path of life; In Your presence is fullness of joy; At Your right hand are pleasures forevermore.", "r": "Psalm 16:11", "theme": "joy"}, {"t": "For whoever exalts himself will be humbled, and he who humbles himself will be exalted.\u201d", "r": "Luke 14:11", "theme": "humility"}, {"t": "Let nothing be done through selfish ambition or conceit, but in lowliness of mind let each esteem others better than himself.", "r": "Philippians 2:3", "theme": "humility"}, {"t": "He has shown you, O man, what is good; And what does the Lord require of you But to do justly, To love mercy, And to walk humbly with your God?", "r": "Micah 6:8", "theme": "humility"}, {"t": "Jesus said to her, \u201cI am the resurrection and the life. He who believes in Me, though he may die, he shall live.", "r": "John 11:25", "theme": "resurrection"}, {"t": "He is not here; for He is risen, as He said. Come, see the place where the Lord lay.", "r": "Matthew 28:6", "theme": "resurrection"}, {"t": "But now Christ is risen from the dead, and has become the firstfruits of those who have fallen asleep.", "r": "1 Corinthians 15:20", "theme": "resurrection"}, {"t": "\u201cA little while longer and the world will see Me no more, but \n    \n    you will see Me. \n    \n    Because I live, you will live also.", "r": "John 14:19", "theme": "resurrection"}, {"t": "For I will be merciful to their unrighteousness, and their sins and their lawless deeds I will remember no more.\u201d", "r": "Hebrews 8:12", "theme": "covenant"}, {"t": "\u201cTherefore know that the Lord your God, He is God, the faithful God who keeps covenant and mercy for a thousand generations with those who love Him and keep His commandments;", "r": "Deuteronomy 7:9", "theme": "covenant"}, {"t": "Through the Lord\u2019s mercies we are not consumed, Because His compassions fail not.", "r": "Lamentations 3:22", "theme": "covenant"}, {"t": "For He made Him who knew no sin to be sin for us, that we might become the righteousness of God in Him.", "r": "2 Corinthians 5:21", "theme": "righteousn"}, {"t": "But seek first the kingdom of God and His righteousness, and all these things shall be added to you.", "r": "Matthew 6:33", "theme": "righteousn"}, {"t": "Many are the afflictions of the righteous, But the Lord delivers him out of them all.", "r": "Psalm 34:19", "theme": "righteousn"}, {"t": "for the kingdom of God is not eating and drinking, but righteousness and peace and joy in the Holy Spirit.", "r": "Romans 14:17", "theme": "kingdom"}, {"t": "Your kingdom come. Your will be done On earth \n    \n    as it is in heaven.", "r": "Matthew 6:10", "theme": "kingdom"}, {"t": "And I will give you the keys of the kingdom of heaven, and whatever you bind on earth will be bound in heaven, and whatever you loose on earth will be loosed in heaven.\u201d", "r": "Matthew 16:19", "theme": "kingdom"}, {"t": "But the Helper, the Holy Spirit, whom the Father will send in My name, He will teach you all things, and bring to your remembrance all things that I said to you.", "r": "John 14:26", "theme": "holyspirit"}, {"t": "But the fruit of the Spirit is love, joy, peace, longsuffering, kindness, goodness, faithfulness,", "r": "Galatians 5:22", "theme": "holyspirit"}, {"t": "Do you not know that you are the temple of God and that the Spirit of God dwells in you?", "r": "1 Corinthians 3:16", "theme": "holyspirit"}, {"t": "Through the Lord\u2019s mercies we are not consumed, Because His compassions fail not. They are new every morning; Great is Your faithfulness.", "r": "Lamentations 3:22-23", "theme": "mercy"}, {"t": "Blessed are the merciful, For they shall obtain mercy.", "r": "Matthew 5:7", "theme": "mercy"}, {"t": "The Lord is merciful and gracious, Slow to anger, and abounding in mercy.", "r": "Psalm 103:8", "theme": "mercy"}, {"t": "for prophecy never came by the will of man, but holy men of God spoke as they were moved by the Holy Spirit.", "r": "2 Peter 1:21", "theme": "prophecy"}, {"t": "Surely the Lord God does nothing, Unless He reveals His secret to His servants the prophets.", "r": "Amos 3:7", "theme": "prophecy"}, {"t": "For I consider that the sufferings of this present time are not worthy to be compared with the glory which shall be revealed in us.", "r": "Romans 8:18", "theme": "suffering"}, {"t": "But may the God of all grace, who called us to His eternal glory by Christ Jesus, after you have suffered a while, perfect, establish, strengthen, and settle you.", "r": "1 Peter 5:10", "theme": "suffering"}, {"t": "And not only that, but we also glory in tribulations, knowing that tribulation produces perseverance;", "r": "Romans 5:3", "theme": "suffering"}, {"t": "God is Spirit, and those who worship Him must worship in spirit and truth.\u201d", "r": "John 4:24", "theme": "worship"}, {"t": "Oh come, let us worship and bow down; Let us kneel before the Lord our Maker.", "r": "Psalm 95:6", "theme": "worship"}, {"t": "Exalt the Lord our God, And worship at His holy hill; For the Lord our God is holy.", "r": "Psalm 99:9", "theme": "worship"}, {"t": "\u201cMoreover, \n    \n    when you fast, do not be like the hypocrites, with a sad countenance. For they disfigure their faces that they may appear to men to be fasting. Assuredly, I say to you, they have their reward.", "r": "Matthew 6:16", "theme": "fasting"}, {"t": "\u201cIs this not the fast that I have chosen: To loose the bonds of wickedness, To undo the heavy burdens, To let the oppressed go free, And that you break every yoke?", "r": "Isaiah 58:6", "theme": "fasting"}, {"t": "So He said to them, \u201cThis kind can come out by nothing but prayer and fasting.\u201d", "r": "Mark 9:29", "theme": "fasting"}, {"t": "And if it seems evil to you to serve the Lord, choose for yourselves this day whom you will serve, whether the gods which your fathers served that were on the other side of the River, or the gods of the Amorites, in whose land you dwell. But as for me and my house, we will serve the Lord.\u201d", "r": "Joshua 24:15", "theme": "family"}, {"t": "Behold, children are a heritage from the Lord, The fruit of the womb is a reward.", "r": "Psalm 127:3", "theme": "family"}, {"t": "\u201cHonor your father and your mother, that your days may be long upon the land which the Lord your God is giving you.", "r": "Exodus 20:12", "theme": "family"}, {"t": "And He said to them, \u201cGo into all the world and preach the gospel to every creature.", "r": "Mark 16:15", "theme": "nations"}, {"t": "For God so loved the world that He gave His only begotten Son, that whoever believes in Him should not perish but have everlasting life.", "r": "John 3:16", "theme": "nations"}, {"t": "Ask of Me, and I will give You The nations for Your inheritance, And the ends of the earth for Your possession.", "r": "Psalm 2:8", "theme": "nations"}, {"t": "For He shall give His angels charge over you, To keep you in all your ways.", "r": "Psalm 91:11", "theme": "angels"}, {"t": "Are they not all ministering spirits sent forth to minister for those who will inherit salvation?", "r": "Hebrews 1:14", "theme": "angels"}, {"t": "The angel of the Lord encamps all around those who fear Him, And delivers them.", "r": "Psalm 34:7", "theme": "angels"}, {"t": "In the beginning God created the heavens and the earth.", "r": "Genesis 1:1", "theme": "creation"}, {"t": "The heavens declare the glory of God; And the firmament shows His handiwork.", "r": "Psalm 19:1", "theme": "creation"}, {"t": "For by Him all things were created that are in heaven and that are on earth, visible and invisible, whether thrones or dominions or principalities or powers. All things were created through Him and for Him.", "r": "Colossians 1:16", "theme": "creation"}, {"t": "I am the Alpha and the Omega, the Beginning and the End, the First and the Last.\u201d", "r": "Revelation 22:13", "theme": "endtimes"}, {"t": "And God will wipe away every tear from their eyes; there shall be no more death, nor sorrow, nor crying. There shall be no more pain, for the former things have passed away.\u201d", "r": "Revelation 21:4", "theme": "endtimes"}, {"t": "Behold, I stand at the door and knock. If anyone hears My voice and opens the door, I will come in to him and dine with him, and he with Me.", "r": "Revelation 3:20", "theme": "endtimes"}, {"t": "Go therefore and make disciples of all the nations, baptizing them in the name of the Father and of the Son and of the Holy Spirit,", "r": "Matthew 28:19", "theme": "baptism"}, {"t": "Therefore we were buried with Him through baptism into death, that just as Christ was raised from the dead by the glory of the Father, even so we also should walk in newness of life.", "r": "Romans 6:4", "theme": "baptism"}, {"t": "Then Peter said to them, \u201cRepent, and let every one of you be baptized in the name of Jesus Christ for the remission of sins; and you shall receive the gift of the Holy Spirit.", "r": "Acts 2:38", "theme": "baptism"}, {"t": "And He took bread, gave thanks and broke it, and gave it to them, saying, \u201cThis is My body which is given for you; do this in remembrance of Me.\u201d", "r": "Luke 22:19", "theme": "communion"}, {"t": "The cup of blessing which we bless, is it not the communion of the blood of Christ? The bread which we break, is it not the communion of the body of Christ?", "r": "1 Corinthians 10:16", "theme": "communion"}, {"t": "He who eats My flesh and drinks My blood abides in Me, and I in him.", "r": "John 6:56", "theme": "communion"}, {"t": "In the beginning God created the heavens and the earth.", "r": "Genesis 1:1", "theme": "scripture"}, {"t": "Then God said, \u201cLet there be light\u201d; and there was light.", "r": "Genesis 1:3", "theme": "scripture"}, {"t": "So God created man in His own image; in the image of God He created him; male and female He created them.", "r": "Genesis 1:27", "theme": "scripture"}, {"t": "And the Lord God said, \u201cIt is not good that man should be alone; I will make him a helper comparable to him.\u201d", "r": "Genesis 2:18", "theme": "scripture"}, {"t": "And the Lord God formed man of the dust of the ground, and breathed into his nostrils the breath of life; and man became a living being.", "r": "Genesis 2:7", "theme": "scripture"}, {"t": "Then the Lord God called to Adam and said to him, \u201cWhere are you?\u201d", "r": "Genesis 3:9", "theme": "scripture"}, {"t": "And I will put enmity Between you and the woman, And between your seed and her Seed; He shall bruise your head, And you shall bruise His heel.\u201d", "r": "Genesis 3:15", "theme": "scripture"}, {"t": "Then the Lord said to Cain, \u201cWhere is Abel your brother?\u201d He said, \u201cI do not know. Am I my brother\u2019s keeper?\u201d", "r": "Genesis 4:9", "theme": "scripture"}, {"t": "But I will establish My covenant with you; and you shall go into the ark\u2014you, your sons, your wife, and your sons\u2019 wives with you.", "r": "Genesis 6:18", "theme": "scripture"}, {"t": "Now the Lord had said to Abram: \u201cGet out of your country, From your family And from your father\u2019s house, To a land that I will show you.", "r": "Genesis 12:1", "theme": "scripture"}, {"t": "And God said to Moses, \u201cI AM WHO I AM.\u201d And He said, \u201cThus you shall say to the children of Israel, \u2018I AM has sent me to you.\u2019 \u201d", "r": "Exodus 3:14", "theme": "scripture"}, {"t": "\u201cI am the Lord your God, who brought you out of the land of Egypt, out of the house of bondage.", "r": "Exodus 20:2", "theme": "scripture"}, {"t": "\u201cYou shall have no other gods before Me.", "r": "Exodus 20:3", "theme": "scripture"}, {"t": "\u201cRemember the Sabbath day, to keep it holy.", "r": "Exodus 20:8", "theme": "scripture"}, {"t": "\u201cHonor your father and your mother, that your days may be long upon the land which the Lord your God is giving you.", "r": "Exodus 20:12", "theme": "scripture"}, {"t": "and said, \u201cIf you diligently heed the voice of the Lord your God and do what is right in His sight, give ear to His commandments and keep all His statutes, I will put none of the diseases on you which I have brought on the Egyptians. For I am the Lord who heals you.\u201d", "r": "Exodus 15:26", "theme": "scripture"}, {"t": "The Lord will fight for you, and you shall hold your peace.\u201d", "r": "Exodus 14:14", "theme": "scripture"}, {"t": "The Lord is my shepherd; I shall not want.", "r": "Psalm 23:1", "theme": "scripture"}, {"t": "He makes me to lie down in green pastures; He leads me beside the still waters.", "r": "Psalm 23:2", "theme": "scripture"}, {"t": "Yea, though I walk through the valley of the shadow of death, I will fear no evil; For You are with me; Your rod and Your staff, they comfort me.", "r": "Psalm 23:4", "theme": "scripture"}, {"t": "The earth is the Lord\u2019s, and all its fullness, The world and those who dwell therein.", "r": "Psalm 24:1", "theme": "scripture"}, {"t": "Be still, and know that I am God; I will be exalted among the nations, I will be exalted in the earth!", "r": "Psalm 46:10", "theme": "scripture"}, {"t": "Create in me a clean heart, O God, And renew a steadfast spirit within me.", "r": "Psalm 51:10", "theme": "scripture"}, {"t": "The heavens declare the glory of God; And the firmament shows His handiwork.", "r": "Psalm 19:1", "theme": "scripture"}, {"t": "I will lift up my eyes to the hills\u2014 From whence comes my help?", "r": "Psalm 121:1", "theme": "scripture"}, {"t": "Your word is a lamp to my feet And a light to my path.", "r": "Psalm 119:105", "theme": "scripture"}, {"t": "Bless the Lord, O my soul; And all that is within me, bless His holy name!", "r": "Psalm 103:1", "theme": "scripture"}, {"t": "This is the day the Lord has made; We will rejoice and be glad in it.", "r": "Psalm 118:24", "theme": "scripture"}, {"t": "The Lord is my light and my salvation; Whom shall I fear? The Lord is the strength of my life; Of whom shall I be afraid?", "r": "Psalm 27:1", "theme": "scripture"}, {"t": "The fear of the Lord is the beginning of knowledge, But fools despise wisdom and instruction.", "r": "Proverbs 1:7", "theme": "scripture"}, {"t": "Trust in the Lord with all your heart, And lean not on your own understanding;", "r": "Proverbs 3:5", "theme": "scripture"}, {"t": "In all your ways acknowledge Him, And He shall direct your paths.", "r": "Proverbs 3:6", "theme": "scripture"}, {"t": "Keep your heart with all diligence, For out of it spring the issues of life.", "r": "Proverbs 4:23", "theme": "scripture"}, {"t": "A soft answer turns away wrath, But a harsh word stirs up anger.", "r": "Proverbs 15:1", "theme": "scripture"}, {"t": "Pride goes before destruction, And a haughty spirit before a fall.", "r": "Proverbs 16:18", "theme": "scripture"}, {"t": "The name of the Lord is a strong tower; The righteous run to it and are safe.", "r": "Proverbs 18:10", "theme": "scripture"}, {"t": "Train up a child in the way he should go, And when he is old he will not depart from it.", "r": "Proverbs 22:6", "theme": "scripture"}, {"t": "As iron sharpens iron, So a man sharpens the countenance of his friend.", "r": "Proverbs 27:17", "theme": "scripture"}, {"t": "But those who wait on the Lord Shall renew their strength; They shall mount up with wings like eagles, They shall run and not be weary, They shall walk and not faint.", "r": "Isaiah 40:31", "theme": "scripture"}, {"t": "Fear not, for I am with you; Be not dismayed, for I am your God. I will strengthen you, Yes, I will help you, I will uphold you with My righteous right hand.\u2019", "r": "Isaiah 41:10", "theme": "scripture"}, {"t": "For I, the Lord your God, will hold your right hand, Saying to you, \u2018Fear not, I will help you.\u2019", "r": "Isaiah 41:13", "theme": "scripture"}, {"t": "But He was wounded for our transgressions, He was bruised for our iniquities; The chastisement for our peace was upon Him, And by His stripes we are healed.", "r": "Isaiah 53:5", "theme": "scripture"}, {"t": "But He was wounded for our transgressions, He was bruised for our iniquities; The chastisement for our peace was upon Him, And by His stripes we are healed.", "r": "Isaiah 53:5", "theme": "scripture"}, {"t": "You will keep him in perfect peace, Whose mind is stayed on You, Because he trusts in You.", "r": "Isaiah 26:3", "theme": "scripture"}, {"t": "No weapon formed against you shall prosper, And every tongue which rises against you in judgment You shall condemn. This is the heritage of the servants of the Lord, And their righteousness is from Me,\u201d Says the Lord.", "r": "Isaiah 54:17", "theme": "scripture"}, {"t": "\u201cHo! Everyone who thirsts, Come to the waters; And you who have no money, Come, buy and eat. Yes, come, buy wine and milk Without money and without price.", "r": "Isaiah 55:1", "theme": "scripture"}, {"t": "\u201cThe Spirit of the Lord God is upon Me, Because the Lord has anointed Me To preach good tidings to the poor; He has sent Me to heal the brokenhearted, To proclaim liberty to the captives, And the opening of the prison to those who are bound;", "r": "Isaiah 61:1", "theme": "scripture"}, {"t": "For I know the thoughts that I think toward you, says the Lord, thoughts of peace and not of evil, to give you a future and a hope.", "r": "Jeremiah 29:11", "theme": "scripture"}, {"t": "And you will seek Me and find Me, when you search for Me with all your heart.", "r": "Jeremiah 29:13", "theme": "scripture"}, {"t": "\u2018Call to Me, and I will answer you, and show you great and mighty things, which you do not know.\u2019", "r": "Jeremiah 33:3", "theme": "scripture"}, {"t": "Is there no balm in Gilead, Is there no physician there? Why then is there no recovery For the health of the daughter of my people?", "r": "Jeremiah 8:22", "theme": "scripture"}, {"t": "\u201cThe heart is deceitful above all things, And desperately wicked; Who can know it?", "r": "Jeremiah 17:9", "theme": "scripture"}, {"t": "\u201cBlessed\n     are the poor in spirit, For theirs is the kingdom of heaven.", "r": "Matthew 5:3", "theme": "scripture"}, {"t": "Blessed are the pure in heart, For \n    \n    they shall see God.", "r": "Matthew 5:8", "theme": "scripture"}, {"t": "\u201cYou are the light of the world. A city that is set on a hill cannot be hidden.", "r": "Matthew 5:14", "theme": "scripture"}, {"t": "But seek first the kingdom of God and His righteousness, and all these things shall be added to you.", "r": "Matthew 6:33", "theme": "scripture"}, {"t": "\u201cAsk, and it will be given to you; seek, and you will find; knock, and it will be opened to you.", "r": "Matthew 7:7", "theme": "scripture"}, {"t": "Come to Me, all you who labor and are heavy laden, and I will give you rest.", "r": "Matthew 11:28", "theme": "scripture"}, {"t": "But Jesus looked at them and said to them, \u201cWith men this is impossible, but with God all things are possible.\u201d", "r": "Matthew 19:26", "theme": "scripture"}, {"t": "Go therefore and make disciples of all the nations, baptizing them in the name of the Father and of the Son and of the Holy Spirit,", "r": "Matthew 28:19", "theme": "scripture"}, {"t": "teaching them to observe all things that I have commanded you; and lo, I am with you always, even to the end of the age.\u201d Amen.", "r": "Matthew 28:20", "theme": "scripture"}, {"t": "In the beginning was the Word, and the Word was with God, and the Word was God.", "r": "John 1:1", "theme": "scripture"}, {"t": "And the Word became flesh and dwelt among us, and we beheld His glory, the glory as of the only begotten of the Father, full of grace and truth.", "r": "John 1:14", "theme": "scripture"}, {"t": "For God so loved the world that He gave His only begotten Son, that whoever believes in Him should not perish but have everlasting life.", "r": "John 3:16", "theme": "scripture"}, {"t": "God is Spirit, and those who worship Him must worship in spirit and truth.\u201d", "r": "John 4:24", "theme": "scripture"}, {"t": "And Jesus said to them, \u201cI am the bread of life. He who comes to Me shall never hunger, and he who believes in Me shall never thirst.", "r": "John 6:35", "theme": "scripture"}, {"t": "Then Jesus spoke to them again, saying, \u201cI am the light of the world. He who follows Me shall not walk in darkness, but have the light of life.\u201d", "r": "John 8:12", "theme": "scripture"}, {"t": "And you shall know the truth, and the truth shall make you free.\u201d", "r": "John 8:32", "theme": "scripture"}, {"t": "\u201cI am the good shepherd. The good shepherd gives His life for the sheep.", "r": "John 10:11", "theme": "scripture"}, {"t": "Jesus said to her, \u201cI am the resurrection and the life. He who believes in Me, though he may die, he shall live.", "r": "John 11:25", "theme": "scripture"}, {"t": "A new commandment I give to you, that you love one another; as I have loved you, that you also love one another.", "r": "John 13:34", "theme": "scripture"}, {"t": "Jesus said to him, \u201cI am the way, the truth, and the life. No one comes to the Father except through Me.", "r": "John 14:6", "theme": "scripture"}, {"t": "Peace I leave with you, My peace I give to you; not as the world gives do I give to you. Let not your heart be troubled, neither let it be afraid.", "r": "John 14:27", "theme": "scripture"}, {"t": "Greater love has no one than this, than to lay down one\u2019s life for his friends.", "r": "John 15:13", "theme": "scripture"}, {"t": "for all have sinned and fall short of the glory of God,", "r": "Romans 3:23", "theme": "scripture"}, {"t": "For the wages of sin is death, but the gift of God is eternal life in Christ Jesus our Lord.", "r": "Romans 6:23", "theme": "scripture"}, {"t": "There is therefore now no condemnation to those who are in Christ Jesus, who do not walk according to the flesh, but according to the Spirit.", "r": "Romans 8:1", "theme": "scripture"}, {"t": "And we know that all things work together for good to those who love God, to those who are the called according to His purpose.", "r": "Romans 8:28", "theme": "scripture"}, {"t": "For I am persuaded that neither death nor life, nor angels nor principalities nor powers, nor things present nor things to come, nor height nor depth, nor any other created thing, shall be able to separate us from the love of God which is in Christ Jesus our Lord.", "r": "Romans 8:38-39", "theme": "scripture"}, {"t": "that if you confess with your mouth the Lord Jesus and believe in your heart that God has raised Him from the dead, you will be saved.", "r": "Romans 10:9", "theme": "scripture"}, {"t": "For \u201cwhoever calls on the name of the Lord shall be saved.\u201d", "r": "Romans 10:13", "theme": "scripture"}, {"t": "And do not be conformed to this world, but be transformed by the renewing of your mind, that you may prove what is that good and acceptable and perfect will of God.", "r": "Romans 12:2", "theme": "scripture"}, {"t": "\u201cI am the Alpha and the Omega, the Beginning and the End,\u201d says the Lord, \u201cwho is and who was and who is to come, the Almighty.\u201d", "r": "Revelation 1:8", "theme": "scripture"}, {"t": "Behold, I stand at the door and knock. If anyone hears My voice and opens the door, I will come in to him and dine with him, and he with Me.", "r": "Revelation 3:20", "theme": "scripture"}, {"t": "The four living creatures, each having six wings, were full of eyes around and within. And they do not rest day or night, saying: \u201cHoly, holy, holy, Lord God Almighty, Who was and is and is to come!\u201d", "r": "Revelation 4:8", "theme": "scripture"}, {"t": "saying with a loud voice: \u201cWorthy is the Lamb who was slain To receive power and riches and wisdom, And strength and honor and glory and blessing!\u201d", "r": "Revelation 5:12", "theme": "scripture"}, {"t": "And God will wipe away every tear from their eyes; there shall be no more death, nor sorrow, nor crying. There shall be no more pain, for the former things have passed away.\u201d", "r": "Revelation 21:4", "theme": "scripture"}, {"t": "Then He who sat on the throne said, \u201cBehold, I make all things new.\u201d And He said to me, \u201cWrite, for these words are true and faithful.\u201d", "r": "Revelation 21:5", "theme": "scripture"}, {"t": "I am the Alpha and the Omega, the Beginning and the End, the First and the Last.\u201d", "r": "Revelation 22:13", "theme": "scripture"}, {"t": "He who testifies to these things says, \u201cSurely I am coming quickly.\u201d Amen. Even so, come, Lord Jesus!", "r": "Revelation 22:20", "theme": "scripture"}, {"t": "\u201cSpeak to all the congregation of the children of Israel, and say to them: \u2018You shall be holy, for I the Lord your God am holy.", "r": "Leviticus 19:2", "theme": "scripture"}, {"t": "You shall not take vengeance, nor bear any grudge against the children of your people, but you shall love your neighbor as yourself: I am the Lord.", "r": "Leviticus 19:18", "theme": "scripture"}, {"t": "\u201cThe Lord bless you and keep you;", "r": "Numbers 6:24", "theme": "scripture"}, {"t": "\u2018The Lord is longsuffering and abundant in mercy, forgiving iniquity and transgression; but He by no means clears the guilty, visiting the iniquity of the fathers on the children to the third and fourth generation.\u2019", "r": "Numbers 14:18", "theme": "scripture"}, {"t": "You shall love the Lord your God with all your heart, with all your soul, and with all your strength.", "r": "Deuteronomy 6:5", "theme": "scripture"}, {"t": "Be strong and of good courage, do not fear nor be afraid of them; for the Lord your God, He is the One who goes with you. He will not leave you nor forsake you.\u201d", "r": "Deuteronomy 31:6", "theme": "scripture"}, {"t": "And if it seems evil to you to serve the Lord, choose for yourselves this day whom you will serve, whether the gods which your fathers served that were on the other side of the River, or the gods of the Amorites, in whose land you dwell. But as for me and my house, we will serve the Lord.\u201d", "r": "Joshua 24:15", "theme": "scripture"}, {"t": "Have I not commanded you? Be strong and of good courage; do not be afraid, nor be dismayed, for the Lord your God is with you wherever you go.\u201d", "r": "Joshua 1:9", "theme": "scripture"}, {"t": "And the Angel of the Lord appeared to him, and said to him, \u201cThe Lord is with you, you mighty man of valor!\u201d", "r": "Judges 6:12", "theme": "scripture"}, {"t": "Nevertheless, the Lord raised up judges who delivered them out of the hand of those who plundered them.", "r": "Judges 2:16", "theme": "scripture"}, {"t": "But Ruth said: \u201cEntreat me not to leave you, Or to turn back from following after you; For wherever you go, I will go; And wherever you lodge, I will lodge; Your people shall be my people, And your God, my God.", "r": "Ruth 1:16", "theme": "scripture"}, {"t": "The Lord repay your work, and a full reward be given you by the Lord God of Israel, under whose wings you have come for refuge.\u201d", "r": "Ruth 2:12", "theme": "scripture"}, {"t": "But the Lord said to Samuel, \u201cDo not look at his appearance or at his physical stature, because I have refused him. For the Lord does not see as man sees; for man looks at the outward appearance, but the Lord looks at the heart.\u201d", "r": "1 Samuel 16:7", "theme": "scripture"}, {"t": "Therefore Eli said to Samuel, \u201cGo, lie down; and it shall be, if He calls you, that you must say, \u2018Speak, Lord, for Your servant hears.\u2019 \u201d So Samuel went and lay down in his place.", "r": "1 Samuel 3:9", "theme": "scripture"}, {"t": "And your house and your kingdom shall be established forever before you. Your throne shall be established forever.\u201d \u2019 \u201d", "r": "2 Samuel 7:16", "theme": "scripture"}, {"t": "\u201cThe beauty of Israel is slain on your high places! How the mighty have fallen!", "r": "2 Samuel 1:19", "theme": "scripture"}, {"t": "behold, I have done according to your words; see, I have given you a wise and understanding heart, so that there has not been anyone like you before you, nor shall any like you arise after you.", "r": "1 Kings 3:12", "theme": "scripture"}, {"t": "And the angel of the Lord came back the second time, and touched him, and said, \u201cArise and eat, because the journey is too great for you.\u201d", "r": "1 Kings 19:7", "theme": "scripture"}, {"t": "So he answered, \u201cDo not fear, for those who are with us are more than those who are with them.\u201d", "r": "2 Kings 6:16", "theme": "scripture"}, {"t": "So they said to him, \u201cA man came up to meet us, and said to us, \u2018Go, return to the king who sent you, and say to him, \u201cThus says the Lord: \u2018Is it because there is no God in Israel that you are sending to inquire of Baal-Zebub, the god of Ekron? Therefore you shall not come down from the bed to which you have gone up, but you shall surely die.\u2019 \u201d \u2019 \u201d", "r": "2 Kings 1:6", "theme": "scripture"}, {"t": "Oh, give thanks to the Lord! Call upon His name; Make known His deeds among the peoples!", "r": "1 Chronicles 16:8", "theme": "scripture"}, {"t": "Yours, O Lord, is the greatness, The power and the glory, The victory and the majesty; For all that is in heaven and in earth is Yours; Yours is the kingdom, O Lord, And You are exalted as head over all.", "r": "1 Chronicles 29:11", "theme": "scripture"}, {"t": "if My people who are called by My name will humble themselves, and pray and seek My face, and turn from their wicked ways, then I will hear from heaven, and will forgive their sin and heal their land.", "r": "2 Chronicles 7:14", "theme": "scripture"}, {"t": "And he said, \u201cListen, all you of Judah and you inhabitants of Jerusalem, and you, King Jehoshaphat! Thus says the Lord to you: \u2018Do not be afraid nor dismayed because of this great multitude, for the battle is not yours, but God\u2019s.", "r": "2 Chronicles 20:15", "theme": "scripture"}, {"t": "On the first day of the first month he began his journey from Babylon, and on the first day of the fifth month he came to Jerusalem, according to the good hand of his God upon him.", "r": "Ezra 7:9", "theme": "scripture"}, {"t": "And they kept the Feast of Unleavened Bread seven days with joy; for the Lord made them joyful, and turned the heart of the king of Assyria toward them, to strengthen their hands in the work of the house of God, the God of Israel.", "r": "Ezra 6:22", "theme": "scripture"}, {"t": "Then he said to them, \u201cGo your way, eat the fat, drink the sweet, and send portions to those for whom nothing is prepared; for this day is holy to our Lord. Do not sorrow, for the joy of the Lord is your strength.\u201d", "r": "Nehemiah 8:10", "theme": "scripture"}, {"t": "So I answered them, and said to them, \u201cThe God of heaven Himself will prosper us; therefore we His servants will arise and build, but you have no heritage or right or memorial in Jerusalem.\u201d", "r": "Nehemiah 2:20", "theme": "scripture"}, {"t": "For if you remain completely silent at this time, relief and deliverance will arise for the Jews from another place, but you and your father\u2019s house will perish. Yet who knows whether you have come to the kingdom for such a time as this?\u201d", "r": "Esther 4:14", "theme": "scripture"}, {"t": "\u201cGo, gather all the Jews who are present in Shushan, and fast for me; neither eat nor drink for three days, night or day. My maids and I will fast likewise. And so I will go to the king, which is against the law; and if I perish, I perish!\u201d", "r": "Esther 4:16", "theme": "scripture"}, {"t": "And he said: \u201cNaked I came from my mother\u2019s womb, And naked shall I return there. The Lord gave, and the Lord has taken away; Blessed be the name of the Lord.\u201d", "r": "Job 1:21", "theme": "scripture"}, {"t": "For I know that my Redeemer lives, And He shall stand at last on the earth;", "r": "Job 19:25", "theme": "scripture"}, {"t": "\u201cWhere were you when I laid the foundations of the earth? Tell Me, if you have understanding.", "r": "Job 38:4", "theme": "scripture"}, {"t": "Let us hear the conclusion of the whole matter: Fear God and keep His commandments, For this is man\u2019s all.", "r": "Ecclesiastes 12:13", "theme": "scripture"}, {"t": "To everything there is a season, A time for every purpose under heaven:", "r": "Ecclesiastes 3:1", "theme": "scripture"}, {"t": "I am my beloved\u2019s, And my beloved is mine. He feeds his flock among the lilies. The Beloved", "r": "Song of Solomon 6:3", "theme": "scripture"}, {"t": "Set me as a seal upon your heart, As a seal upon your arm; For love is as strong as death, Jealousy as cruel as the grave; Its flames are flames of fire, A most vehement flame.", "r": "Song of Solomon 8:6", "theme": "scripture"}, {"t": "Through the Lord\u2019s mercies we are not consumed, Because His compassions fail not.", "r": "Lamentations 3:22", "theme": "scripture"}, {"t": "The Lord is good to those who wait for Him, To the soul who seeks Him.", "r": "Lamentations 3:25", "theme": "scripture"}, {"t": "I will give you a new heart and put a new spirit within you; I will take the heart of stone out of your flesh and give you a heart of flesh.", "r": "Ezekiel 36:26", "theme": "scripture"}, {"t": "And He said to me, \u201cSon of man, can these bones live?\u201d So I answered, \u201cO Lord God, You know.\u201d", "r": "Ezekiel 37:3", "theme": "scripture"}, {"t": "My God sent His angel and shut the lions\u2019 mouths, so that they have not hurt me, because I was found innocent before Him; and also, O king, I have done no wrong before you.\u201d", "r": "Daniel 6:22", "theme": "scripture"}, {"t": "He reveals deep and secret things; He knows what is in the darkness, And light dwells with Him.", "r": "Daniel 2:22", "theme": "scripture"}, {"t": "\u201cI will heal their backsliding, I will love them freely, For My anger has turned away from him.", "r": "Hosea 14:4", "theme": "scripture"}, {"t": "For I desire mercy and not sacrifice, And the knowledge of God more than burnt offerings.", "r": "Hosea 6:6", "theme": "scripture"}, {"t": "\u201cAnd it shall come to pass afterward That I will pour out My Spirit on all flesh; Your sons and your daughters shall prophesy, Your old men shall dream dreams, Your young men shall see visions.", "r": "Joel 2:28", "theme": "scripture"}, {"t": "So rend your heart, and not your garments; Return to the Lord your God, For He is gracious and merciful, Slow to anger, and of great kindness; And He relents from doing harm.", "r": "Joel 2:13", "theme": "scripture"}, {"t": "But let justice run down like water, And righteousness like a mighty stream.", "r": "Amos 5:24", "theme": "scripture"}, {"t": "Surely the Lord God does nothing, Unless He reveals His secret to His servants the prophets.", "r": "Amos 3:7", "theme": "scripture"}, {"t": "\u201cFor the day of the Lord upon all the nations is near; As you have done, it shall be done to you; Your reprisal shall return upon your own head.", "r": "Obadiah 1:15", "theme": "scripture"}, {"t": "\u201cBut on Mount Zion there shall be deliverance, And there shall be holiness; The house of Jacob shall possess their possessions.", "r": "Obadiah 1:17", "theme": "scripture"}, {"t": "But I will sacrifice to You With the voice of thanksgiving; I will pay what I have vowed. Salvation is of the Lord.\u201d", "r": "Jonah 2:9", "theme": "scripture"}, {"t": "And should I not pity Nineveh, that great city, in which are more than one hundred and twenty thousand persons who cannot discern between their right hand and their left\u2014and much livestock?\u201d", "r": "Jonah 4:11", "theme": "scripture"}, {"t": "He has shown you, O man, what is good; And what does the Lord require of you But to do justly, To love mercy, And to walk humbly with your God?", "r": "Micah 6:8", "theme": "scripture"}, {"t": "Therefore I will look to the Lord; I will wait for the God of my salvation; My God will hear me.", "r": "Micah 7:7", "theme": "scripture"}, {"t": "The Lord is good, A stronghold in the day of trouble; And He knows those who trust in Him.", "r": "Nahum 1:7", "theme": "scripture"}, {"t": "The Lord is slow to anger and great in power, And will not at all acquit the wicked. The Lord has His way In the whirlwind and in the storm, And the clouds are the dust of His feet.", "r": "Nahum 1:3", "theme": "scripture"}, {"t": "\u201cBehold the proud, His soul is not upright in him; But the just shall live by his faith.", "r": "Habakkuk 2:4", "theme": "scripture"}, {"t": "Though the fig tree may not blossom, Nor fruit be on the vines; Though the labor of the olive may fail, And the fields yield no food; Though the flock may be cut off from the fold, And there be no herd in the stalls\u2014 Yet I will rejoice in the Lord, I will joy in the God of my salvation.", "r": "Habakkuk 3:17-18", "theme": "scripture"}, {"t": "The Lord your God in your midst, The Mighty One, will save; He will rejoice over you with gladness, He will quiet you with His love, He will rejoice over you with singing.\u201d", "r": "Zephaniah 3:17", "theme": "scripture"}, {"t": "Seek the Lord, all you meek of the earth, Who have upheld His justice. Seek righteousness, seek humility. It may be that you will be hidden In the day of the Lord\u2019s anger.", "r": "Zephaniah 2:3", "theme": "scripture"}, {"t": "Then Haggai, the Lord\u2019s messenger, spoke the Lord\u2019s message to the people, saying, \u201cI am with you, says the Lord.\u201d", "r": "Haggai 1:13", "theme": "scripture"}, {"t": "\u2018The glory of this latter temple shall be greater than the former,\u2019 says the Lord of hosts. \u2018And in this place I will give peace,\u2019 says the Lord of hosts.\u201d", "r": "Haggai 2:9", "theme": "scripture"}, {"t": "So he answered and said to me: \u201cThis is the word of the Lord to Zerubbabel: \u2018Not by might nor by power, but by My Spirit,\u2019 Says the Lord of hosts.", "r": "Zechariah 4:6", "theme": "scripture"}, {"t": "\u201cSing and rejoice, O daughter of Zion! For behold, I am coming and I will dwell in your midst,\u201d says the Lord.", "r": "Zechariah 2:10", "theme": "scripture"}, {"t": "\u201cI have loved you,\u201d says the Lord. \u201cYet you say, \u2018In what way have You loved us?\u2019 Was not Esau Jacob\u2019s brother?\u201d Says the Lord. \u201cYet Jacob I have loved;", "r": "Malachi 1:2", "theme": "scripture"}, {"t": "Yet from the days of your fathers You have gone away from My ordinances And have not kept them. Return to Me, and I will return to you,\u201d Says the Lord of hosts. \u201cBut you said, \u2018In what way shall we return?\u2019", "r": "Malachi 3:7", "theme": "scripture"}, {"t": "But to you who fear My name The Sun of Righteousness shall arise With healing in His wings; And you shall go out And grow fat like stall-fed calves.", "r": "Malachi 4:2", "theme": "scripture"}, {"t": "Jesus said to him, \u201cIf you can believe, all things are possible to him who believes.\u201d", "r": "Mark 9:23", "theme": "scripture"}, {"t": "And He said to them, \u201cGo into all the world and preach the gospel to every creature.", "r": "Mark 16:15", "theme": "scripture"}, {"t": "and saying, \u201cThe time is fulfilled, and the kingdom of God is at hand. Repent, and believe in the gospel.\u201d", "r": "Mark 1:15", "theme": "scripture"}, {"t": "For with God nothing will be impossible.\u201d", "r": "Luke 1:37", "theme": "scripture"}, {"t": "\u201cThe\n     Spirit of the Lord is upon Me, Because He has anointed Me To preach the gospel to the poor; He has sent Me to heal the brokenhearted, To proclaim liberty to the captives And recovery of sight to the blind, To\n     set at liberty those who are oppressed;", "r": "Luke 4:18", "theme": "scripture"}, {"t": "for the Son of Man has come to seek and to save that which was lost.\u201d", "r": "Luke 19:10", "theme": "scripture"}, {"t": "But you shall receive power when the Holy Spirit has come upon you; and you shall be witnesses to Me in Jerusalem, and in all Judea and Samaria, and to the end of the earth.\u201d", "r": "Acts 1:8", "theme": "scripture"}, {"t": "And they continued steadfastly in the apostles\u2019 doctrine and fellowship, in the breaking of bread, and in prayers.", "r": "Acts 2:42", "theme": "scripture"}, {"t": "So they said, \u201cBelieve on the Lord Jesus Christ, and you will be saved, you and your household.\u201d", "r": "Acts 16:31", "theme": "scripture"}, {"t": "Love suffers long and is kind; love does not envy; love does not parade itself, is not puffed up;", "r": "1 Corinthians 13:4", "theme": "scripture"}, {"t": "\u201cO Death, where is your sting? O Hades, where is your victory?\u201d", "r": "1 Corinthians 15:55", "theme": "scripture"}, {"t": "But as it is written: \u201cEye has not seen, nor ear heard, Nor have entered into the heart of man The things which God has prepared for those who love Him.\u201d", "r": "1 Corinthians 2:9", "theme": "scripture"}, {"t": "And He said to me, \u201cMy grace is sufficient for you, for My strength is made perfect in weakness.\u201d Therefore most gladly I will rather boast in my infirmities, that the power of Christ may rest upon me.", "r": "2 Corinthians 12:9", "theme": "scripture"}, {"t": "We are hard-pressed on every side, yet not crushed; we are perplexed, but not in despair;", "r": "2 Corinthians 4:8", "theme": "scripture"}, {"t": "Therefore, if anyone is in Christ, he is a new creation; old things have passed away; behold, all things have become new.", "r": "2 Corinthians 5:17", "theme": "scripture"}, {"t": "But the fruit of the Spirit is love, joy, peace, longsuffering, kindness, goodness, faithfulness,", "r": "Galatians 5:22", "theme": "scripture"}, {"t": "Stand fast therefore in the liberty by which Christ has made us free, and do not be entangled again with a yoke of bondage.", "r": "Galatians 5:1", "theme": "scripture"}, {"t": "I have been crucified with Christ; it is no longer I who live, but Christ lives in me; and the life which I now live in the flesh I live by faith in the Son of God, who loved me and gave Himself for me.", "r": "Galatians 2:20", "theme": "scripture"}, {"t": "For by grace you have been saved through faith, and that not of yourselves; it is the gift of God,", "r": "Ephesians 2:8", "theme": "scripture"}, {"t": "Put on the whole armor of God, that you may be able to stand against the wiles of the devil.", "r": "Ephesians 6:11", "theme": "scripture"}, {"t": "And be kind to one another, tenderhearted, forgiving one another, even as God in Christ forgave you.", "r": "Ephesians 4:32", "theme": "scripture"}, {"t": "I can do all things through Christ who strengthens me.", "r": "Philippians 4:13", "theme": "scripture"}, {"t": "Rejoice in the Lord always. Again I will say, rejoice!", "r": "Philippians 4:4", "theme": "scripture"}, {"t": "Finally, brethren, whatever things are true, whatever things are noble, whatever things are just, whatever things are pure, whatever things are lovely, whatever things are of good report, if there is any virtue and if there is anything praiseworthy\u2014meditate on these things.", "r": "Philippians 4:8", "theme": "scripture"}, {"t": "And let the peace of God rule in your hearts, to which also you were called in one body; and be thankful.", "r": "Colossians 3:15", "theme": "scripture"}, {"t": "Set your mind on things above, not on things on the earth.", "r": "Colossians 3:2", "theme": "scripture"}, {"t": "For by Him all things were created that are in heaven and that are on earth, visible and invisible, whether thrones or dominions or principalities or powers. All things were created through Him and for Him.", "r": "Colossians 1:16", "theme": "scripture"}, {"t": "in everything give thanks; for this is the will of God in Christ Jesus for you.", "r": "1 Thessalonians 5:18", "theme": "scripture"}, {"t": "Rejoice always, pray without ceasing,", "r": "1 Thessalonians 5:16-17", "theme": "scripture"}, {"t": "But the Lord is faithful, who will establish you and guard you from the evil one.", "r": "2 Thessalonians 3:3", "theme": "scripture"}, {"t": "Now may the Lord direct your hearts into the love of God and into the patience of Christ.", "r": "2 Thessalonians 3:5", "theme": "scripture"}, {"t": "Now godliness with contentment is great gain.", "r": "1 Timothy 6:6", "theme": "scripture"}, {"t": "Fight the good fight of faith, lay hold on eternal life, to which you were also called and have confessed the good confession in the presence of many witnesses.", "r": "1 Timothy 6:12", "theme": "scripture"}, {"t": "All Scripture is given by inspiration of God, and is profitable for doctrine, for reproof, for correction, for instruction in righteousness,", "r": "2 Timothy 3:16", "theme": "scripture"}, {"t": "I have fought the good fight, I have finished the race, I have kept the faith.", "r": "2 Timothy 4:7", "theme": "scripture"}, {"t": "For God has not given us a spirit of fear, but of power and of love and of a sound mind.", "r": "2 Timothy 1:7", "theme": "scripture"}, {"t": "For the grace of God that brings salvation has appeared to all men,", "r": "Titus 2:11", "theme": "scripture"}, {"t": "To the pure all things are pure, but to those who are defiled and unbelieving nothing is pure; but even their mind and conscience are defiled.", "r": "Titus 1:15", "theme": "scripture"}, {"t": "I thank my God, making mention of you always in my prayers,", "r": "Philemon 1:4", "theme": "scripture"}, {"t": "For we have great joy and consolation in your love, because the hearts of the saints have been refreshed by you, brother.", "r": "Philemon 1:7", "theme": "scripture"}, {"t": "Now faith is the substance of things hoped for, the evidence of things not seen.", "r": "Hebrews 11:1", "theme": "scripture"}, {"t": "Jesus Christ is the same yesterday, today, and forever.", "r": "Hebrews 13:8", "theme": "scripture"}, {"t": "Therefore we also, since we are surrounded by so great a cloud of witnesses, let us lay aside every weight, and the sin which so easily ensnares us, and let us run with endurance the race that is set before us,", "r": "Hebrews 12:1", "theme": "scripture"}, {"t": "If any of you lacks wisdom, let him ask of God, who gives to all liberally and without reproach, and it will be given to him.", "r": "James 1:5", "theme": "scripture"}, {"t": "For as the body without the spirit is dead, so faith without works is dead also.", "r": "James 2:26", "theme": "scripture"}, {"t": "Confess your trespasses to one another, and pray for one another, that you may be healed. The effective, fervent prayer of a righteous man avails much.", "r": "James 5:16", "theme": "scripture"}, {"t": "casting all your care upon Him, for He cares for you.", "r": "1 Peter 5:7", "theme": "scripture"}, {"t": "because it is written, \u201cBe holy, for I am holy.\u201d", "r": "1 Peter 1:16", "theme": "scripture"}, {"t": "But sanctify the Lord God in your hearts, and always be ready to give a defense to everyone who asks you a reason for the hope that is in you, with meekness and fear;", "r": "1 Peter 3:15", "theme": "scripture"}, {"t": "as His divine power has given to us all things that pertain to life and godliness, through the knowledge of Him who called us by glory and virtue,", "r": "2 Peter 1:3", "theme": "scripture"}, {"t": "The Lord is not slack concerning His promise, as some count slackness, but is longsuffering toward us, not willing that any should perish but that all should come to repentance.", "r": "2 Peter 3:9", "theme": "scripture"}, {"t": "And we have known and believed the love that God has for us. God is love, and he who abides in love abides in God, and God in him.", "r": "1 John 4:16", "theme": "scripture"}, {"t": "We love Him because He first loved us.", "r": "1 John 4:19", "theme": "scripture"}, {"t": "If we confess our sins, He is faithful and just to forgive us our sins and to cleanse us from all unrighteousness.", "r": "1 John 1:9", "theme": "scripture"}, {"t": "And now I plead with you, lady, not as though I wrote a new commandment to you, but that which we have had from the beginning: that we love one another.", "r": "2 John 1:5", "theme": "scripture"}, {"t": "Look to yourselves, that we do not lose those things we worked for, but that we may receive a full reward.", "r": "2 John 1:8", "theme": "scripture"}, {"t": "I have no greater joy than to hear that my children walk in truth.", "r": "3 John 1:4", "theme": "scripture"}, {"t": "Beloved, I pray that you may prosper in all things and be in health, just as your soul prospers.", "r": "3 John 1:2", "theme": "scripture"}, {"t": "keep yourselves in the love of God, looking for the mercy of our Lord Jesus Christ unto eternal life.", "r": "Jude 1:21", "theme": "scripture"}, {"t": "Now to Him who is able to keep you from stumbling, And to present you faultless Before the presence of His glory with exceeding joy,", "r": "Jude 1:24", "theme": "scripture"}, {"t": "And my soul shall be joyful in the Lord; It shall rejoice in His salvation.", "r": "Psalm 35:9", "theme": "scripture"}, {"t": "Then I will go to the altar of God, To God my exceeding joy; And on the harp I will praise You, O God, my God.", "r": "Psalm 43:4", "theme": "scripture"}, {"t": "But let all those rejoice who put their trust in You; Let them ever shout for joy, because You defend them; Let those also who love Your name Be joyful in You.", "r": "Psalm 5:11", "theme": "scripture"}, {"t": "Restore to me the joy of Your salvation, And uphold me by Your generous Spirit.", "r": "Psalm 51:12", "theme": "scripture"}, {"t": "Light is sown for the righteous, And gladness for the upright in heart.", "r": "Psalm 97:11", "theme": "scripture"}, {"t": "Those who sow in tears Shall reap in joy.", "r": "Psalm 126:5", "theme": "scripture"}, {"t": "The hope of the righteous will be gladness, But the expectation of the wicked will perish.", "r": "Proverbs 10:28", "theme": "scripture"}, {"t": "Honor and majesty are before Him; Strength and gladness are in His place.", "r": "1 Chronicles 16:27", "theme": "scripture"}, {"t": "Therefore with joy you will draw water From the wells of salvation.", "r": "Isaiah 12:3", "theme": "scripture"}, {"t": "And the ransomed of the Lord shall return, And come to Zion with singing, With everlasting joy on their heads. They shall obtain joy and gladness, And sorrow and sighing shall flee away.", "r": "Isaiah 35:10", "theme": "scripture"}, {"t": "So the ransomed of the Lord shall return, And come to Zion with singing, With everlasting joy on their heads. They shall obtain joy and gladness; Sorrow and sighing shall flee away.", "r": "Isaiah 51:11", "theme": "scripture"}, {"t": "\u201cFor you shall go out with joy, And be led out with peace; The mountains and the hills Shall break forth into singing before you, And all the trees of the field shall clap their hands.", "r": "Isaiah 55:12", "theme": "scripture"}, {"t": "To console those who mourn in Zion, To give them beauty for ashes, The oil of joy for mourning, The garment of praise for the spirit of heaviness; That they may be called trees of righteousness, The planting of the Lord, that He may be glorified.\u201d", "r": "Isaiah 61:3", "theme": "scripture"}, {"t": "\u201cThen shall the virgin rejoice in the dance, And the young men and the old, together; For I will turn their mourning to joy, Will comfort them, And make them rejoice rather than sorrow.", "r": "Jeremiah 31:13", "theme": "scripture"}, {"t": "Yet I will rejoice in the Lord, I will joy in the God of my salvation.", "r": "Habakkuk 3:18", "theme": "scripture"}, {"t": "I say to you that likewise there will be more joy in heaven over one sinner who repents than over ninety-nine just persons who need no repentance.", "r": "Luke 15:7", "theme": "scripture"}, {"t": "\u201cThese things I have spoken to you, that My joy may remain in you, and \n    \n    \n      that your joy may be full.", "r": "John 15:11", "theme": "scripture"}, {"t": "Until now you have asked nothing in My name. Ask, and you will receive, that your joy may be full.", "r": "John 16:24", "theme": "scripture"}, {"t": "But now I come to You, and these things I speak in the world, that they may have My joy fulfilled in themselves.", "r": "John 17:13", "theme": "scripture"}, {"t": "whom having not seen you love. Though now you do not see Him, yet believing, you rejoice with joy inexpressible and full of glory,", "r": "1 Peter 1:8", "theme": "scripture"}, {"t": "\u201cBefore I formed you in the womb I knew you; Before you were born I sanctified you; I ordained you a prophet to the nations.\u201d", "r": "Jeremiah 1:5", "theme": "scripture"}, {"t": "The Lord will perfect that which concerns me; Your mercy, O Lord, endures forever; Do not forsake the works of Your hands.", "r": "Psalm 138:8", "theme": "scripture"}, {"t": "I will cry out to God Most High, To God who performs all things for me.", "r": "Psalm 57:2", "theme": "scripture"}, {"t": "The steps of a good man are ordered by the Lord, And He delights in his way.", "r": "Psalm 37:23", "theme": "scripture"}, {"t": "Your eyes saw my substance, being yet unformed. And in Your book they all were written, The days fashioned for me, When as yet there were none of them.", "r": "Psalm 139:16", "theme": "scripture"}, {"t": "A man\u2019s heart plans his way, But the Lord directs his steps.", "r": "Proverbs 16:9", "theme": "scripture"}, {"t": "There are many plans in a man\u2019s heart, Nevertheless the Lord\u2019s counsel\u2014that will stand.", "r": "Proverbs 19:21", "theme": "scripture"}, {"t": "A man\u2019s steps are of the Lord; How then can a man understand his own way?", "r": "Proverbs 20:24", "theme": "scripture"}, {"t": "Declaring the end from the beginning, And from ancient times things that are not yet done, Saying, \u2018My counsel shall stand, And I will do all My pleasure,\u2019", "r": "Isaiah 46:10", "theme": "scripture"}, {"t": "\u201cListen, O coastlands, to Me, And take heed, you peoples from afar! The Lord has called Me from the womb; From the matrix of My mother He has made mention of My name.", "r": "Isaiah 49:1", "theme": "scripture"}, {"t": "You did not choose Me, but I chose you and appointed you that you should go and bear fruit, and that your fruit should remain, that whatever you ask the Father in My name He may give you.", "r": "John 15:16", "theme": "scripture"}, {"t": "Moreover whom He predestined, these He also called; whom He called, these He also justified; and whom He justified, these He also glorified.", "r": "Romans 8:30", "theme": "scripture"}, {"t": "In Him also we have obtained an inheritance, being predestined according to the purpose of Him who works all things according to the counsel of His will,", "r": "Ephesians 1:11", "theme": "scripture"}, {"t": "For we are His workmanship, created in Christ Jesus for good works, which God prepared beforehand that we should walk in them.", "r": "Ephesians 2:10", "theme": "scripture"}, {"t": "being confident of this very thing, that He who has begun a good work in you will complete it until the day of Jesus Christ;", "r": "Philippians 1:6", "theme": "scripture"}, {"t": "for it is God who works in you both to will and to do for His good pleasure.", "r": "Philippians 2:13", "theme": "scripture"}, {"t": "For this reason we also, since the day we heard it, do not cease to pray for you, and to ask that you may be filled with the knowledge of His will in all wisdom and spiritual understanding;", "r": "Colossians 1:9", "theme": "scripture"}, {"t": "who has saved us and called us with a holy calling, not according to our works, but according to His own purpose and grace which was given to us in Christ Jesus before time began,", "r": "2 Timothy 1:9", "theme": "scripture"}, {"t": "But when it pleased God, who separated me from my mother\u2019s womb and called me through His grace,", "r": "Galatians 1:15", "theme": "scripture"}, {"t": "make you complete in every good work to do His will, working in you what is well pleasing in His sight, through Jesus Christ, to whom be glory forever and ever. Amen.", "r": "Hebrews 13:21", "theme": "scripture"}, {"t": "\u201cFor David, after he had served his own generation by the will of God, fell asleep, was buried with his fathers, and saw corruption;", "r": "Acts 13:36", "theme": "scripture"}, {"t": "For everyone who asks receives, and he who seeks finds, and to him who knocks it will be opened.", "r": "Matthew 7:8", "theme": "scripture"}, {"t": "\u201cAgain I say to you that if two of you agree on earth concerning anything that they ask, \n    \n    it will be done for them by My Father in heaven.", "r": "Matthew 18:19", "theme": "scripture"}, {"t": "For where two or three are gathered together in My name, I am there in the midst of them.\u201d", "r": "Matthew 18:20", "theme": "scripture"}, {"t": "And whatever things you ask in prayer, believing, you will receive.\u201d", "r": "Matthew 21:22", "theme": "scripture"}, {"t": "Therefore I say to you, whatever things you ask when you pray, believe that you receive them, and you will have them.", "r": "Mark 11:24", "theme": "scripture"}, {"t": "\u201cSo I say to you, ask, and it will be given to you; \n    \n    seek, and you will find; knock, and it will be opened to you.", "r": "Luke 11:9", "theme": "scripture"}, {"t": "For everyone who asks receives, and he who seeks finds, and to him who knocks it will be opened.", "r": "Luke 11:10", "theme": "scripture"}, {"t": "And whatever you ask in My name, that I will do, that the Father may be glorified in the Son.", "r": "John 14:13", "theme": "scripture"}, {"t": "If you ask anything in My name, I will do it.", "r": "John 14:14", "theme": "scripture"}, {"t": "If you abide in Me, and My words abide in you, you will ask what you desire, and it shall be done for you.", "r": "John 15:7", "theme": "scripture"}, {"t": "\u201cAnd in that day you will ask Me nothing. \n    \n    Most assuredly, I say to you, whatever you ask the Father in My name He will give you.", "r": "John 16:23", "theme": "scripture"}, {"t": "Call upon Me in the day of trouble; I will deliver you, and you shall glorify Me.\u201d", "r": "Psalm 50:15", "theme": "scripture"}, {"t": "He shall call upon Me, and I will answer him; I will be with him in trouble; I will deliver him and honor him.", "r": "Psalm 9
