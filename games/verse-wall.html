all fight because the Lord is with them, And the riders on horses shall be put to shame.", "r": "Zechariah 10:5", "theme": "scripture"}, {"t": "I have written to you, fathers, Because you have known Him who is from the beginning. I have written to you, young men, Because you are strong, and the word of God abides in you, And you have overcome the wicked one.", "r": "1 John 2:14", "theme": "scripture"}, {"t": "He who overcomes shall inherit all things, and I will be his God and he shall be My son.", "r": "Revelation 21:7", "theme": "scripture"}, {"t": "Therefore a man shall leave his father and mother and be joined to his wife, and they shall become one flesh.", "r": "Genesis 2:24", "theme": "scripture"}, {"t": "To the woman He said: \u201cI will greatly multiply your sorrow and your conception; In pain you shall bring forth children; Your desire shall be for your husband, And he shall rule over you.\u201d", "r": "Genesis 3:16", "theme": "scripture"}, {"t": "There were giants on the earth in those days, and also afterward, when the sons of God came in to the daughters of men and they bore children to them. Those were the mighty men who were of old, men of renown.", "r": "Genesis 6:4", "theme": "scripture"}, {"t": "Now these are the names of the children of Israel who came to Egypt; each man and his household came with Jacob:", "r": "Exodus 1:1", "theme": "scripture"}, {"t": "Now the priest of Midian had seven daughters. And they came and drew water, and they filled the troughs to water their father\u2019s flock.", "r": "Exodus 2:16", "theme": "scripture"}, {"t": "Now Moses was tending the flock of Jethro his father-in-law, the priest of Midian. And he led the flock to the back of the desert, and came to Horeb, the mountain of God.", "r": "Exodus 3:1", "theme": "scripture"}, {"t": "\u201cSpeak to the children of Israel, and say to them: \u2018When any one of you brings an offering to the Lord, you shall bring your offering of the livestock\u2014of the herd and of the flock.", "r": "Leviticus 1:2", "theme": "scripture"}, {"t": "\u201cSpeak to the children of Israel, saying: \u2018If a person sins unintentionally against any of the commandments of the Lord in anything which ought not to be done, and does any of them,", "r": "Leviticus 4:2", "theme": "scripture"}, {"t": "\u201cIf a person sins and commits a trespass against the Lord by lying to his neighbor about what was delivered to him for safekeeping, or about a pledge, or about a robbery, or if he has extorted from his neighbor,", "r": "Leviticus 6:2", "theme": "scripture"}, {"t": "\u201cTake a census of all the congregation of the children of Israel, by their families, by their fathers\u2019 houses, according to the number of names, every male individually,", "r": "Numbers 1:2", "theme": "scripture"}, {"t": "\u201cEveryone of the children of Israel shall camp by his own standard, beside the emblems of his father\u2019s house; they shall camp some distance from the tabernacle of meeting.", "r": "Numbers 2:2", "theme": "scripture"}, {"t": "\u201cNumber the children of Levi by their fathers\u2019 houses, by their families; you shall number every male from a month old and above.\u201d", "r": "Numbers 3:15", "theme": "scripture"}, {"t": "See, I have set the land before you; go in and possess the land which the Lord swore to your fathers\u2014to Abraham, Isaac, and Jacob\u2014to give to them and their descendants after them.\u2019", "r": "Deuteronomy 1:8", "theme": "scripture"}, {"t": "just as the descendants of Esau who dwell in Seir and the Moabites who dwell in Ar did for me, until I cross the Jordan to the land which the Lord our God is giving us.\u2019", "r": "Deuteronomy 2:29", "theme": "scripture"}, {"t": "\u2018O Lord God, You have begun to show Your servant Your greatness and Your mighty hand, for what god is there in heaven or on earth who can do anything like Your works and Your mighty deeds?", "r": "Deuteronomy 3:24", "theme": "scripture"}, {"t": "\u201cMoses My servant is dead. Now therefore, arise, go over this Jordan, you and all this people, to the land which I am giving to them\u2014the children of Israel.", "r": "Joshua 1:2", "theme": "scripture"}, {"t": "Now therefore, I beg you, swear to me by the Lord, since I have shown you kindness, that you also will show kindness to my father\u2019s house, and give me a true token,", "r": "Joshua 2:12", "theme": "scripture"}, {"t": "At that time the Lord said to Joshua, \u201cMake flint knives for yourself, and circumcise the sons of Israel again the second time.\u201d", "r": "Joshua 5:2", "theme": "scripture"}, {"t": "Now after the death of Joshua it came to pass that the children of Israel asked the Lord, saying, \u201cWho shall be first to go up for us against the Canaanites to fight against them?\u201d", "r": "Judges 1:1", "theme": "scripture"}, {"t": "Therefore the Lord left those nations, without driving them out immediately; nor did He deliver them into the hand of Joshua.", "r": "Judges 2:23", "theme": "scripture"}, {"t": "(this was only so that the generations of the children of Israel might be taught to know war, at least those who had not formerly known it),", "r": "Judges 3:2", "theme": "scripture"}, {"t": "Now it came to pass, in the days when the judges ruled, that there was a famine in the land. And a certain man of Bethlehem, Judah, went to dwell in the country of Moab, he and his wife and his two sons.", "r": "Ruth 1:1", "theme": "scripture"}, {"t": "Moreover, Ruth the Moabitess, the widow of Mahlon, I have acquired as my wife, to perpetuate the name of the dead through his inheritance, that the name of the dead may not be cut off from among his brethren and from his position at the gate. You are witnesses this day.\u201d", "r": "Ruth 4:10", "theme": "scripture"}, {"t": "\u201cDo not consider your maidservant a wicked woman, for out of the abundance of my complaint and grief I have spoken until now.\u201d", "r": "1 Samuel 1:16", "theme": "scripture"}, {"t": "\u201cTalk no more so very proudly; Let no arrogance come from your mouth, For the Lord is the God of knowledge; And by Him actions are weighed.", "r": "1 Samuel 2:3", "theme": "scripture"}, {"t": "Woe to us! Who will deliver us from the hand of these mighty gods? These are the gods who struck the Egyptians with all the plagues in the wilderness.", "r": "1 Samuel 4:8", "theme": "scripture"}, {"t": "He said to me again, \u2018Please stand over me and kill me, for anguish has come upon me, but my life still remains in me.\u2019", "r": "2 Samuel 1:9", "theme": "scripture"}, {"t": "Now therefore, let your hands be strengthened, and be valiant; for your master Saul is dead, and also the house of Judah has anointed me king over them.\u201d", "r": "2 Samuel 2:7", "theme": "scripture"}, {"t": "Now there was a long war between the house of Saul and the house of David. But David grew stronger and stronger, and the house of Saul grew weaker and weaker.", "r": "2 Samuel 3:1", "theme": "scripture"}, {"t": "So Nathan spoke to Bathsheba the mother of Solomon, saying, \u201cHave you not heard that Adonijah the son of Haggith has become king, and David our lord does not know it?", "r": "1 Kings 1:11", "theme": "scripture"}, {"t": "\u201cI go the way of all the earth; be strong, therefore, and prove yourself a man.", "r": "1 Kings 2:2", "theme": "scripture"}, {"t": "Therefore give to Your servant an understanding heart to judge Your people, that I may discern between good and evil. For who is able to judge this great people of Yours?\u201d", "r": "1 Kings 3:9", "theme": "scripture"}, {"t": "Please, let us make a small upper room on the wall; and let us put a bed for him there, and a table and a chair and a lampstand; so it will be, whenever he comes to us, he can turn in there.\u201d", "r": "2 Kings 4:10", "theme": "scripture"}, {"t": "Now Naaman, commander of the army of the king of Syria, was a great and honorable man in the eyes of his master, because by him the Lord had given victory to Syria. He was also a mighty man of valor, but a leper.", "r": "2 Kings 5:1", "theme": "scripture"}, {"t": "Please, let us go to the Jordan, and let every man take a beam from there, and let us make there a place where we may dwell.\u201d So he answered, \u201cGo.\u201d", "r": "2 Kings 6:2", "theme": "scripture"}, {"t": "Now these were the kings who reigned in the land of Edom before a king reigned over the children of Israel: Bela the son of Beor, and the name of his city was Dinhabah.", "r": "1 Chronicles 1:43", "theme": "scripture"}, {"t": "Jerahmeel had another wife, whose name was Atarah; she was the mother of Onam.", "r": "1 Chronicles 2:26", "theme": "scripture"}, {"t": "the third, Absalom the son of Maacah, the daughter of Talmai, king of Geshur; the fourth, Adonijah the son of Haggith;", "r": "1 Chronicles 3:2", "theme": "scripture"}, {"t": "Now, O Lord God, let Your promise to David my father be established, for You have made me king over a people like the dust of the earth in multitude.", "r": "2 Chronicles 1:9", "theme": "scripture"}, {"t": "to prepare timber for me in abundance, for the temple which I am about to build shall be great and wonderful.", "r": "2 Chronicles 2:9", "theme": "scripture"}, {"t": "also the pots, the shovels, the forks\u2014and all their articles Huram his master craftsman made of burnished bronze for King Solomon for the house of the Lord.", "r": "2 Chronicles 4:16", "theme": "scripture"}, {"t": "the people of Pahath-Moab, of the people of Jeshua and Joab, two thousand eight hundred and twelve;", "r": "Ezra 2:6", "theme": "scripture"}, {"t": "Now when the adversaries of Judah and Benjamin heard that the descendants of the captivity were building the temple of the Lord God of Israel,", "r": "Ezra 4:1", "theme": "scripture"}, {"t": "Now these are Your servants and Your people, whom You have redeemed by Your great power, and by Your strong hand.", "r": "Nehemiah 1:10", "theme": "scripture"}, {"t": "After him Nehemiah the son of Azbuk, leader of half the district of Beth Zur, made repairs as far as the place in front of the tombs of David, to the man-made pool, and as far as the House of the Mighty.", "r": "Nehemiah 3:16", "theme": "scripture"}, {"t": "Nevertheless we made our prayer to our God, and because of them we set a watch against them day and night.", "r": "Nehemiah 4:9", "theme": "scripture"}, {"t": "Nevertheless Haman restrained himself and went home, and he sent and called for his friends and his wife Zeresh.", "r": "Esther 5:10", "theme": "scripture"}, {"t": "This was on the thirteenth day of the month of Adar. And on the fourteenth of the month they rested and made it a day of feasting and gladness.", "r": "Esther 9:17", "theme": "scripture"}, {"t": "Also, his possessions were seven thousand sheep, three thousand camels, five hundred yoke of oxen, five hundred female donkeys, and a very large household, so that this man was the greatest of all the people of the East.", "r": "Job 1:3", "theme": "scripture"}, {"t": "Because it did not shut up the doors of my mother\u2019s womb, Nor hide sorrow from my eyes.", "r": "Job 3:10", "theme": "scripture"}, {"t": "Your words have upheld him who was stumbling, And you have strengthened the feeble knees;", "r": "Job 4:4", "theme": "scripture"}, {"t": "Kiss the Son, lest He be angry, And you perish in the way, When His wrath is kindled but a little. Blessed are all those who put their trust in Him.", "r": "Psalm 2:12", "theme": "scripture"}, {"t": "Hear me when I call, O God of my righteousness! You have relieved me in my distress; Have mercy on me, and hear my prayer.", "r": "Psalm 4:1", "theme": "scripture"}, {"t": "Give heed to the voice of my cry, My King and my God, For to You I will pray.", "r": "Psalm 5:2", "theme": "scripture"}, {"t": "A wise man will hear and increase learning, And a man of understanding will attain wise counsel,", "r": "Proverbs 1:5", "theme": "scripture"}, {"t": "Yes, if you cry out for discernment, And lift up your voice for understanding,", "r": "Proverbs 2:3", "theme": "scripture"}, {"t": "The Lord by wisdom founded the earth; By understanding He established the heavens;", "r": "Proverbs 3:19", "theme": "scripture"}, {"t": "All things are full of labor; Man cannot express it. The eye is not satisfied with seeing, Nor the ear filled with hearing.", "r": "Ecclesiastes 1:8", "theme": "scripture"}, {"t": "The wise man\u2019s eyes are in his head, But the fool walks in darkness. Yet I myself perceived That the same event happens to them all.", "r": "Ecclesiastes 2:14", "theme": "scripture"}, {"t": "Because of the fragrance of your good ointments, Your name is ointment poured forth; Therefore the virgins love you.", "r": "Song of Solomon 1:3", "theme": "scripture"}, {"t": "I charge you, O daughters of Jerusalem, By the gazelles or by the does of the field, Do not stir up nor awaken love Until it pleases. The Shulamite", "r": "Song of Solomon 2:7", "theme": "scripture"}, {"t": "Hear, O heavens, and give ear, O earth! For the Lord has spoken: \u201cI have nourished and brought up children, And they have rebelled against Me;", "r": "Isaiah 1:2", "theme": "scripture"}, {"t": "For You have forsaken Your people, the house of Jacob, Because they are filled with eastern ways; They are soothsayers like the Philistines, And they are pleased with the children of foreigners.", "r": "Isaiah 2:6", "theme": "scripture"}, {"t": "In that day he will protest, saying, \u201cI cannot cure your ills, For in my house is neither food nor clothing; Do not make me a ruler of the people.\u201d", "r": "Isaiah 3:7", "theme": "scripture"}, {"t": "Do not be afraid of their faces, For I am with you to deliver you,\u201d says the Lord.", "r": "Jeremiah 1:8", "theme": "scripture"}, {"t": "\u201cGo and cry in the hearing of Jerusalem, saying, \u2018Thus says the Lord: \u201cI remember you, The kindness of your youth, The love of your betrothal, When you went after Me in the wilderness, In a land not sown.", "r": "Jeremiah 2:2", "theme": "scripture"}, {"t": "\u201cReturn, O backsliding children,\u201d says the Lord; \u201cfor I am married to you. I will take you, one from a city and two from a family, and I will bring you to Zion.", "r": "Jeremiah 3:14", "theme": "scripture"}, {"t": "She weeps bitterly in the night, Her tears are on her cheeks; Among all her lovers She has none to comfort her. All her friends have dealt treacherously with her; They have become her enemies.", "r": "Lamentations 1:2", "theme": "scripture"}, {"t": "How the Lord has covered the daughter of Zion With a cloud in His anger! He cast down from heaven to the earth The beauty of Israel, And did not remember His footstool In the day of His anger.", "r": "Lamentations 2:1", "theme": "scripture"}, {"t": "Behold, I have made your face strong against their faces, and your forehead strong against their foreheads.", "r": "Ezekiel 3:8", "theme": "scripture"}, {"t": "Therefore fathers shall eat their sons in your midst, and sons shall eat their fathers; and I will execute judgments among you, and all of you who remain I will scatter to all the winds.", "r": "Ezekiel 5:10", "theme": "scripture"}, {"t": "The time has come, The day draws near. \u2018Let not the buyer rejoice, Nor the seller mourn, For wrath is on their whole multitude.", "r": "Ezekiel 7:12", "theme": "scripture"}, {"t": "Now from among those of the sons of Judah were Daniel, Hananiah, Mishael, and Azariah.", "r": "Daniel 1:6", "theme": "scripture"}, {"t": "Daniel answered and said: \u201cBlessed be the name of God forever and ever, For wisdom and might are His.", "r": "Daniel 2:20", "theme": "scripture"}, {"t": "When the Lord began to speak by Hosea, the Lord said to Hosea: \u201cGo, take yourself a wife of harlotry And children of harlotry, For the land has committed great harlotry By departing from the Lord.\u201d", "r": "Hosea 1:2", "theme": "scripture"}, {"t": "\u201cBring charges against your mother, bring charges; For she is not My wife, nor am I her Husband! Let her put away her harlotries from her sight, And her adulteries from between her breasts;", "r": "Hosea 2:2", "theme": "scripture"}, {"t": "Afterward the children of Israel shall return and seek the Lord their God and David their king. They shall fear the Lord and His goodness in the latter days.", "r": "Hosea 3:5", "theme": "scripture"}, {"t": "Hear this, you elders, And give ear, all you inhabitants of the land! Has anything like this happened in your days, Or even in the days of your fathers?", "r": "Joel 1:2", "theme": "scripture"}, {"t": "With a noise like chariots Over mountaintops they leap, Like the noise of a flaming fire that devours the stubble, Like a strong people set in battle array.", "r": "Joel 2:5", "theme": "scripture"}, {"t": "Thus says the Lord: \u201cFor three transgressions of Gaza, and for four, I will not turn away its punishment, Because they took captive the whole captivity To deliver them up to Edom.", "r": "Amos 1:6", "theme": "scripture"}, {"t": "Therefore flight shall perish from the swift, The strong shall not strengthen his power, Nor shall the mighty deliver himself;", "r": "Amos 2:14", "theme": "scripture"}, {"t": "\u201cWill I not in that day,\u201d says the Lord, \u201cEven destroy the wise men from Edom, And understanding from the mountains of Esau?", "r": "Obadiah 1:8", "theme": "scripture"}, {"t": "You should not have stood at the crossroads To cut off those among them who escaped; Nor should you have delivered up those among them who remained In the day of distress.", "r": "Obadiah 1:14", "theme": "scripture"}, {"t": "O inhabitant of Lachish, Harness the chariot to the swift steeds (She was the beginning of sin to the daughter of Zion), For the transgressions of Israel were found in you.", "r": "Micah 1:13", "theme": "scripture"}, {"t": "The women of My people you cast out From their pleasant houses; From their children You have taken away My glory forever.", "r": "Micah 2:9", "theme": "scripture"}, {"t": "Behold, on the mountains The feet of him who brings good tidings, Who proclaims peace! O Judah, keep your appointed feasts, Perform your vows. For the wicked one shall no more pass through you; He is utterly cut off.", "r": "Nahum 1:15", "theme": "scripture"}, {"t": "He who scatters has come up before your face. Man the fort! Watch the road! Strengthen your flanks! Fortify your power mightily.", "r": "Nahum 2:1", "theme": "scripture"}, {"t": "\u201cLook among the nations and watch\u2014 Be utterly astounded! For I will work a work in your days Which you would not believe, though it were told you.", "r": "Habakkuk 1:5", "theme": "scripture"}, {"t": "\u201cWoe to him who covets evil gain for his house, That he may set his nest on high, That he may be delivered from the power of disaster!", "r": "Habakkuk 2:9", "theme": "scripture"}, {"t": "Be silent in the presence of the Lord God; For the day of the Lord is at hand, For the Lord has prepared a sacrifice; He has invited His guests.", "r": "Zephaniah 1:7", "theme": "scripture"}, {"t": "\u201cI have heard the reproach of Moab, And the insults of the people of Ammon, With which they have reproached My people, And made arrogant threats against their borders.", "r": "Zephaniah 2:8", "theme": "scripture"}, {"t": "I struck you with blight and mildew and hail in all the labors of your hands; yet you did not turn to Me,\u2019 says the Lord.", "r": "Haggai 2:17", "theme": "scripture"}, {"t": "\u201cAgain proclaim, saying, \u2018Thus says the Lord of hosts: \u201cMy cities shall again spread out through prosperity; The Lord will again comfort Zion, And will again choose Jerusalem.\u201d \u2019 \u201d", "r": "Zechariah 1:17", "theme": "scripture"}, {"t": "\u2018Who are you, O great mountain? Before Zerubbabel you shall become a plain! And he shall bring forth the capstone With shouts of \u201cGrace, grace to it!\u201d \u2019 \u201d", "r": "Zechariah 4:7", "theme": "scripture"}, {"t": "Yes, He shall build the temple of the Lord. He shall bear the glory, And shall sit and rule on His throne; So He shall be a priest on His throne, And the counsel of peace shall be between them both.\u201d \u2019", "r": "Zechariah 6:13", "theme": "scripture"}, {"t": "\u201cMy covenant was with him, one of life and peace, And I gave them to him that he might fear Me; So he feared Me And was reverent before My name.", "r": "Malachi 2:5", "theme": "scripture"}, {"t": "\u201cA son honors his father, And a servant his master. If then I am the Father, Where is My honor? And if I am a Master, Where is My reverence? Says the Lord of hosts To you priests who despise My name. Yet you say, \u2018In what way have we despised Your name?\u2019", "r": "Malachi 1:6", "theme": "scripture"}, {"t": "Now the birth of Jesus Christ was as follows: After His mother Mary was betrothed to Joseph, before they came together, she was found with child of the Holy Spirit.", "r": "Matthew 1:18", "theme": "scripture"}, {"t": "\u201cA voice was heard in Ramah, Lamentation, weeping, and great mourning, Rachel weeping for her children, Refusing to be comforted, Because they are no more.\u201d", "r": "Matthew 2:18", "theme": "scripture"}, {"t": "I indeed baptize you with water unto repentance, but He who is coming after me is mightier than I, whose sandals I am not worthy to carry. He will baptize you with the Holy Spirit and fire.", "r": "Matthew 3:11", "theme": "scripture"}, {"t": "Which is easier, to say to the paralytic, \u2018 Your sins are forgiven you,\u2019 or to say, \u2018Arise, take up your bed and walk\u2019?", "r": "Mark 2:9", "theme": "scripture"}, {"t": "No one can enter a strong man\u2019s house and plunder his goods, unless he first binds the strong man. And then he will plunder his house.", "r": "Mark 3:27", "theme": "scripture"}, {"t": "While He was still speaking, some came from the ruler of the synagogue\u2019s house who said, \u201cYour daughter is dead. Why trouble the Teacher any further?\u201d", "r": "Mark 5:35", "theme": "scripture"}, {"t": "just as those who from the beginning were eyewitnesses and ministers of the word delivered them to us,", "r": "Luke 1:2", "theme": "scripture"}, {"t": "Therefore bear fruits worthy of repentance, and do not begin to say to yourselves, \u2018We have Abraham as our father.\u2019 For I say to you that God is able to raise up children to Abraham from these stones.", "r": "Luke 3:8", "theme": "scripture"}, {"t": "When the sun was setting, all those who had any that were sick with various diseases brought them to Him; and He laid His hands on every one of them and healed them.", "r": "Luke 4:40", "theme": "scripture"}, {"t": "This man came for a witness, to bear witness of the Light, that all through him might believe.", "r": "John 1:7", "theme": "scripture"}, {"t": "This beginning of signs Jesus did in Cana of Galilee, and manifested His glory; and His disciples believed in Him.", "r": "John 2:11", "theme": "scripture"}, {"t": "Nicodemus said to Him, \u201cHow can a man be born when he is old? Can he enter a second time into his mother\u2019s womb and be born?\u201d", "r": "John 3:4", "theme": "scripture"}, {"t": "These all continued with one accord in prayer and supplication, with the women and Mary the mother of Jesus, and with His brothers.", "r": "Acts 1:14", "theme": "scripture"}, {"t": "Him, being delivered by the determined purpose and foreknowledge of God, you have taken by lawless hands, have crucified, and put to death;", "r": "Acts 2:23", "theme": "scripture"}, {"t": "Now Peter and John went up together to the temple at the hour of prayer, the ninth hour.", "r": "Acts 3:1", "theme": "scripture"}, {"t": "Through Him we have received grace and apostleship for obedience to the faith among all nations for His name,", "r": "Romans 1:5", "theme": "scripture"}, {"t": "eternal life to those who by patient continuance in doing good seek for glory, honor, and immortality;", "r": "Romans 2:7", "theme": "scripture"}, {"t": "Certainly not! Indeed, let God be true but every man a liar. As it is written: \u201cThat You may be justified in Your words, And may overcome when You are judged.\u201d", "r": "Romans 3:4", "theme": "scripture"}, {"t": "Grace to you and peace from God our Father and the Lord Jesus Christ.", "r": "1 Corinthians 1:3", "theme": "scripture"}, {"t": "However, we speak wisdom among those who are mature, yet not the wisdom of this age, nor of the rulers of this age, who are coming to nothing.", "r": "1 Corinthians 2:6", "theme": "scripture"}, {"t": "Who then is Paul, and who is Apollos, but ministers through whom you believed, as the Lord gave to each one?", "r": "1 Corinthians 3:5", "theme": "scripture"}, {"t": "Blessed be the God and Father of our Lord Jesus Christ, the Father of mercies and God of all comfort,", "r": "2 Corinthians 1:3", "theme": "scripture"}, {"t": "Now whom you forgive anything, I also forgive. For if indeed I have forgiven anything, I have forgiven that one for your sakes in the presence of Christ,", "r": "2 Corinthians 2:10", "theme": "scripture"}, {"t": "whose minds the god of this age has blinded, who do not believe, lest the light of the gospel of the glory of Christ, who is the image of God, should shine on them.", "r": "2 Corinthians 4:4", "theme": "scripture"}, {"t": "I marvel that you are turning away so soon from Him who called you in the grace of Christ, to a different gospel,", "r": "Galatians 1:6", "theme": "scripture"}, {"t": "to whom we did not yield submission even for an hour, that the truth of the gospel might continue with you.", "r": "Galatians 2:5", "theme": "scripture"}, {"t": "Paul, an apostle of Jesus Christ by the will of God, To the saints who are in Ephesus, and faithful in Christ Jesus:", "r": "Ephesians 1:1", "theme": "scripture"}, {"t": "in which you once walked according to the course of this world, according to the prince of the power of the air, the spirit who now works in the sons of disobedience,", "r": "Ephesians 2:2", "theme": "scripture"}, {"t": "Grace to you and peace from God our Father and the Lord Jesus Christ.", "r": "Philippians 1:2", "theme": "scripture"}, {"t": "fulfill my joy by being like-minded, having the same love, being of one accord, of one mind.", "r": "Philippians 2:2", "theme": "scripture"}, {"t": "To the saints and faithful brethren in Christ who are in Colosse: Grace to you and peace from God our Father and the Lord Jesus Christ.", "r": "Colossians 1:2", "theme": "scripture"}, {"t": "buried with Him in baptism, in which you also were raised with Him through faith in the working of God, who raised Him from the dead.", "r": "Colossians 2:12", "theme": "scripture"}, {"t": "Paul, Silvanus, and Timothy, To the church of the Thessalonians in God the Father and the Lord Jesus Christ: Grace to you and peace from God our Father and the Lord Jesus Christ.", "r": "1 Thessalonians 1:1", "theme": "scripture"}, {"t": "You are witnesses, and God also, how devoutly and justly and blamelessly we behaved ourselves among you who believe;", "r": "1 Thessalonians 2:10", "theme": "scripture"}, {"t": "Paul, Silvanus, and Timothy, To the church of the Thessalonians in God our Father and the Lord Jesus Christ:", "r": "2 Thessalonians 1:1", "theme": "scripture"}, {"t": "Finally, brethren, pray for us, that the word of the Lord may run swiftly and be glorified, just as it is with you,", "r": "2 Thessalonians 3:1", "theme": "scripture"}, {"t": "Paul, an apostle of Jesus Christ, by the commandment of God our Savior and the Lord Jesus Christ, our hope,", "r": "1 Timothy 1:1", "theme": "scripture"}, {"t": "Therefore I exhort first of all that supplications, prayers, intercessions, and giving of thanks be made for all men,", "r": "1 Timothy 2:1", "theme": "scripture"}, {"t": "To Timothy, a beloved son: Grace, mercy, and peace from God the Father and Christ Jesus our Lord.", "r": "2 Timothy 1:2", "theme": "scripture"}, {"t": "Therefore I endure all things for the sake of the elect, that they also may obtain the salvation which is in Christ Jesus with eternal glory.", "r": "2 Timothy 2:10", "theme": "scripture"}, {"t": "Paul, a bondservant of God and an apostle of Jesus Christ, according to the faith of God\u2019s elect and the acknowledgment of the truth which accords with godliness,", "r": "Titus 1:1", "theme": "scripture"}, {"t": "to be discreet, chaste, homemakers, good, obedient to their own husbands, that the word of God may not be blasphemed.", "r": "Titus 2:5", "theme": "scripture"}, {"t": "hearing of your love and faith which you have toward the Lord Jesus and toward all the saints,", "r": "Philemon 1:5", "theme": "scripture"}, {"t": "whom I wished to keep with me, that on your behalf he might minister to me in my chains for the gospel.", "r": "Philemon 1:13", "theme": "scripture"}, {"t": "You have loved righteousness and hated lawlessness; Therefore God, Your God, has anointed You With the oil of gladness more than Your companions.\u201d", "r": "Hebrews 1:9", "theme": "scripture"}, {"t": "how shall we escape if we neglect so great a salvation, which at the first began to be spoken by the Lord, and was confirmed to us by those who heard Him,", "r": "Hebrews 2:3", "theme": "scripture"}, {"t": "Blessed is the man who endures temptation; for when he has been approved, he will receive the crown of life which the Lord has promised to those who love Him.", "r": "James 1:12", "theme": "scripture"}, {"t": "My brethren, do not hold the faith of our Lord Jesus Christ, the Lord of glory, with partiality.", "r": "James 2:1", "theme": "scripture"}, {"t": "elect according to the foreknowledge of God the Father, in sanctification of the Spirit, for obedience and sprinkling of the blood of Jesus Christ: Grace to you and peace be multiplied.", "r": "1 Peter 1:2", "theme": "scripture"}, {"t": "Therefore it is also contained in the Scripture, \u201cBehold, I lay in Zion A chief cornerstone, elect, precious, And he who believes on Him will by no means be put to shame.\u201d", "r": "1 Peter 2:6", "theme": "scripture"}, {"t": "Simon Peter, a bondservant and apostle of Jesus Christ, To those who have obtained like precious faith with us by the righteousness of our God and Savior Jesus Christ:", "r": "2 Peter 1:1", "theme": "scripture"}, {"t": "whereas angels, who are greater in power and might, do not bring a reviling accusation against them before the Lord.", "r": "2 Peter 2:11", "theme": "scripture"}, {"t": "My little children, these things I write to you, so that you may not sin. And if anyone sins, we have an Advocate with the Father, Jesus Christ the righteous.", "r": "1 John 2:1", "theme": "scripture"}, {"t": "Beloved, now we are children of God; and it has not yet been revealed what we shall be, but we know that when He is revealed, we shall be like Him, for we shall see Him as He is.", "r": "1 John 3:2", "theme": "scripture"}, {"t": "The Elder, To the elect lady and her children, whom I love in truth, and not only I, but also all those who have known the truth,", "r": "2 John 1:1", "theme": "scripture"}, {"t": "Grace, mercy, and peace will be with you from God the Father and from the Lord Jesus Christ, the Son of the Father, in truth and love.", "r": "2 John 1:3", "theme": "scripture"}, {"t": "Beloved, you do faithfully whatever you do for the brethren and for strangers,", "r": "3 John 1:5", "theme": "scripture"}, {"t": "We therefore ought to receive such, that we may become fellow workers for the truth.", "r": "3 John 1:8", "theme": "scripture"}, {"t": "Jude, a bondservant of Jesus Christ, and brother of James, To those who are called, sanctified by God the Father, and preserved in Jesus Christ:", "r": "Jude 1:1", "theme": "scripture"}, {"t": "But I want to remind you, though you once knew this, that the Lord, having saved the people out of the land of Egypt, afterward destroyed those who did not believe.", "r": "Jude 1:5", "theme": "scripture"}, {"t": "John, to the seven churches which are in Asia: Grace to you and peace from Him who is and who was and who is to come, and from the seven Spirits who are before His throne,", "r": "Revelation 1:4", "theme": "scripture"}, {"t": "\u201cI know your works, your labor, your patience, and that you cannot bear those who are evil. And you have tested those who say they are apostles and are not, and have found them liars;", "r": "Revelation 2:2", "theme": "scripture"}, {"t": "Be watchful, and strengthen the things which remain, that are ready to die, for I have not found your works perfect before God.", "r": "Revelation 3:2", "theme": "scripture"}, {"t": "And he said: \u201cI cried out to the Lord because of my affliction, And He answered me. \u201cOut of the belly of Sheol I cried, And You heard my voice.", "r": "Jonah 2:2", "theme": "scripture"}, {"t": "\u201cWhen my soul fainted within me, I remembered the Lord; And my prayer went up to You, Into Your holy temple.", "r": "Jonah 2:7", "theme": "scripture"}, {"t": "Beloved, while I was very diligent to write to you concerning our common salvation, I found it necessary to write to you exhorting you to contend earnestly for the faith which was once for all delivered to the saints.", "r": "Jude 1:3", "theme": "scripture"}];

function bookOf(r){ const m = r.match(/^(.+?)\s+\d+:\d+/); return m ? m[1] : r; }

let filter = { mode: "all", books: [], subjects: [] };
try { const s = JSON.parse(localStorage.getItem("vw-filter")); if(s && s.mode){ if(!Array.isArray(s.books)) s.books = []; if(!Array.isArray(s.subjects)) s.subjects = []; filter = s; } } catch(e){}
function allowedIdx(){
  const out = [];
  WALL_VERSES.forEach((v, i) => {
    let ok = filter.mode === "all" ||
      (filter.mode === "ot" && !v.nt) ||
      (filter.mode === "nt" && v.nt) ||
      (filter.mode === "custom" && filter.books.indexOf(v.book) > -1);
    if(ok && filter.subjects.length) ok = filter.subjects.some(s => v.subjs.indexOf(s) > -1);
    if(ok) out.push(i);
  });
  return out.length ? out : WALL_VERSES.map((_, i) => i);
}
function buildPools(){
  const allow = allowedIdx();
  BUCKETS = { s: [], w: [], t: [], l: [] };
  allow.forEach(i => {
    const L = WALL_VERSES[i].t.length;
    (L <= 60 ? BUCKETS.s : L <= 95 ? BUCKETS.w : L <= 135 ? BUCKETS.t : BUCKETS.l).push(i);
  });
  ["s","w","t","l"].forEach(k => { if(!BUCKETS[k].length) BUCKETS[k] = allow.slice(); });
  const seen = new Set(); CHRIST_L = [];
  allow.forEach(i => {
    const v = WALL_VERSES[i];
    if(v.t.length >= 136 && v.t.length <= 235 && CHRIST_REFS.indexOf(v.r) > -1 && !seen.has(v.r)){ seen.add(v.r); CHRIST_L.push(i); }
  });
  if(!CHRIST_L.length) CHRIST_L = BUCKETS.l.slice();
}
function applyFilter(redeal){
  buildPools();
  try{ localStorage.setItem("vw-filter", JSON.stringify(filter)); }catch(e){}
  const allow = allowedIdx(), sub = document.getElementById("filterSub");
  const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
  const parts = [];
  if(filter.mode === "ot") parts.push("Old Testament");
  else if(filter.mode === "nt") parts.push("New Testament");
  else if(filter.mode === "custom") parts.push("Custom \u00B7 " + filter.books.length + " book" + (filter.books.length === 1 ? "" : "s"));
  if(filter.subjects.length) parts.push(filter.subjects.map(cap).join(", "));
  sub.textContent = parts.length ? parts.join(" \u00B7 ") + " \u00B7 " + allow.length + " verses"
    : "Every verse keeps its own time. Some ascend, some descend.";
  document.querySelectorAll("#drModes button").forEach(b => b.classList.toggle("on", b.dataset.mode === filter.mode));
  document.querySelectorAll("#drOt .wv-chip, #drNt .wv-chip").forEach(ch => {
    ch.classList.toggle("on", filter.mode === "custom" && ch._cat.books.every(b => filter.books.indexOf(b) > -1));
  });
  document.querySelectorAll("#drSubj .wv-chip").forEach(ch => {
    ch.classList.toggle("on", ch._cat.subjs.every(s => filter.subjects.indexOf(s) > -1));
  });
  if(redeal === false) return;
  if(view === "river"){ buildRiver(); startRiver(); return; }
  usedVerses.clear();
  cards.forEach(c => {
    if(c.pinned){ usedVerses.add(WALL_VERSES[c.vi].r); return; }
    clearTimeout(c.timer); c.timer = null;
    setVerse(c); c.phase = "enter"; play(c, "enter");
    c.timer = setTimeout(() => tick(c), Math.random() * 3000);
  });
}

function toggleSubjectCat(cat){
  const all = cat.subjs.every(s => filter.subjects.indexOf(s) > -1);
  if(all) filter.subjects = filter.subjects.filter(s => cat.subjs.indexOf(s) === -1);
  else cat.subjs.forEach(s => { if(filter.subjects.indexOf(s) === -1) filter.subjects.push(s); });
  applyFilter(true);
}
function toggleBookCat(cat){
  const all = cat.books.every(b => filter.books.indexOf(b) > -1);
  if(all) filter.books = filter.books.filter(b => cat.books.indexOf(b) === -1);
  else cat.books.forEach(b => { if(filter.books.indexOf(b) === -1) filter.books.push(b); });

}

  textEl.style.fontFamily = type.font;
  textEl.style.fontStyle = type.style;
  textEl.style.fontWeight = type.weight;
  textEl.style.letterSpacing = type.ls;
  const c = { cardEl, bodyEl, textEl, refEl, size, skin, type, vi: -1, river: true, held: false, timer: null };
  cardEl.addEventListener("click", () => { if(c.suppressClick){ c.suppressClick = false; return; } openVerse(c); });
  let swSX = 0, swSY = 0, swT = 0;
  cardEl.addEventListener("touchstart", e => {
    const t = e.touches[0]; swSX = t.clientX; swSY = t.clientY; swT = Date.now();
  }, { passive: true });
  cardEl.addEventListener("touchend", e => {
    const t = e.changedTouches[0];
    const dx = t.clientX - swSX, dy = t.clientY - swSY;
    if(Math.abs(dy) > 44 && Math.abs(dy) > Math.abs(dx) * 1.2 && Date.now() - swT < 1500){
      c.suppressClick = true;
      riverDirSwipe(c, dy);
    }
  });
  return c;
}
function placeRiverCard(c, lane){
  if(riverAxis === "y"){
    c.cardEl.style.left = lane.g.x + "px";
    c.cardEl.style.top = "0px";
    c.cardEl.style.transform = "translate3d(0," + c.rpos + "px,0)";
  } else {
    c.cardEl.style.top = (lane.g.rowY + (lane.g.rowH - c.cardEl.offsetHeight) / 2) + "px";
    c.cardEl.style.left = "0px";
    c.cardEl.style.transform = "translate3d(" + c.rpos + "px,0,0)";
  }
}
function pickRiverVerse(){
  const b = BUCKETS.s.concat(BUCKETS.w);
  const refOf = i => WALL_VERSES[i].r;
  let n = b[rand(0, b.length-1)], guard = 0;
  while(usedVerses.has(refOf(n)) && guard++ < 80) n = b[rand(0, b.length-1)];
  if(usedVerses.has(refOf(n))){
    const free = b.find(i => !usedVerses.has(refOf(i)));
    if(free !== undefined) n = free;
  }
  return n;
}
function riverSetVerse(c){
  if(c.vi >= 0) usedVerses.delete(WALL_VERSES[c.vi].r);
  c.vi = pickRiverVerse();
  usedVerses.add(WALL_VERSES[c.vi].r);
  const v = WALL_VERSES[c.vi];
  c.textEl.textContent = v.t;
  c.textEl.style.fontSize = (SIZE.s.fs + (c.type.bump || 0)) + "px";
  c.refEl.textContent = v.r;
  fitText(c);
}
/* swipe a river column: up = flow upward, down = flow downward */
function riverDirSwipe(c, dy){
  if(!c.lane) return;
  const nd = dy < 0 ? -1 : 1;
  if(c.lane.dir === nd) return;
  c.lane.dir = nd;
  spaceLane(c.lane);
  if(navigator.vibrate) try{ navigator.vibrate(8); }catch(e){}
}
function fillRiverLane(lane){
  const rv = document.getElementById("river");
  const travel = riverAxis === "y" ? riverH : riverW;
  let y, prevH = 0, guard = 0;
  while(guard++ < 14){
    const c = makeRiverCard("s", lane.g.w);
    riverSetVerse(c);
    rv.appendChild(c.cardEl);
    const hh = riverAxis === "y" ? c.cardEl.offsetHeight : c.cardEl.offsetWidth;
    if(y === undefined) y = lane.dir < 0 ? 8 : travel - hh - 8;
    else y = lane.dir < 0 ? y + prevH + RIVER_GAP : y - hh - RIVER_GAP;
    c.rpos = y; c.rh = hh;
    placeRiverCard(c, lane);
    c.lane = lane; lane.cards.push(c); riverCards.push(c);
    prevH = hh;
    if(lane.dir < 0 && y > travel + 80) break;
    if(lane.dir > 0 && y + hh < -80) break;
  }
  lane.cards.sort((a, b) => lane.dir < 0 ? a.rpos - b.rpos : b.rpos - a.rpos);
}
/* re-space one lane with fresh card heights; keeps gaps uniform, never overlapping */
function spaceLane(lane){
  if(!lane.cards.length) return;
  lane.cards.sort((a, b) => lane.dir < 0 ? a.rpos - b.rpos : b.rpos - a.rpos);
  lane.cards.forEach(c => {
    c.rh = riverAxis === "y" ? c.cardEl.offsetHeight : c.cardEl.offsetWidth;
  });
  let pos = lane.cards[0].rpos;
  lane.cards.forEach((c, i) => {
    if(i > 0){
      const p = lane.cards[i - 1];
      pos = lane.dir < 0 ? p.rpos + p.rh + RIVER_GAP : p.rpos - c.rh - RIVER_GAP;
    }
    c.rpos = pos;
  });
}
/* re-space all lanes (e.g. after webfonts arrive and text reflows) */
function relayoutRiver(){
  if(!riverLanes || !riverLanes.length) return;
  riverLanes.forEach(spaceLane);
}
function buildRiver(){
  stopRiver();
  const rv = document.getElementById("river");
  rv.innerHTML = "";
  riverLanes = []; riverCards = []; riverRocks = [];
  const headH = document.querySelector(".wv-head").offsetHeight;
  const barH = document.getElementById("viewbar").offsetHeight;
  riverW = rv.clientWidth || window.innerWidth;
  riverH = Math.max(320, window.innerHeight - headH - barH);
  rv.style.height = riverH + "px";
  const info = riverInfo();
  riverAxis = info.axis;
  const paceMul = [0.6, 1.0, 1.45];
  for(let i = paceMul.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); const t = paceMul[i]; paceMul[i] = paceMul[j]; paceMul[j] = t; }
  const W = riverW, H = riverH;
  for(let li = 0; li < 3; li++){
    const lane = { dir: info.dirs[li], cards: [], g: null, speed: RIVER_SPEED * paceMul[li] };
    if(riverAxis === "y"){
      const laneW = W / 3;
      lane.g = { x: li * laneW + 8, w: laneW - 16 };
    } else {
      const rowH = H / 3;
      lane.g = { rowY: li * rowH, rowH: rowH, w: Math.min(230, W * 0.58) };
    }
    fillRiverLane(lane);
    riverLanes.push(lane);
  }
}
function riverStep(dt, advance){
  const travel = riverAxis === "y" ? riverH : riverW;
  riverLanes.forEach(lane => {
    const mv = advance ? lane.dir * lane.speed * dt : 0;
    lane.cards.forEach(c => {
      c.rpos += mv;
      c.cardEl.style.transform = riverAxis === "y"
        ? "translate3d(0," + c.rpos + "px,0)"
        : "translate3d(" + c.rpos + "px,0,0)";
    });
    const f = lane.cards[0];
    if(!f) return;
    if(lane.dir < 0 ? f.rpos + f.rh < -6 : f.rpos > travel + 6){
      const c = lane.cards.shift();
      riverSetVerse(c);
      const hh = riverAxis === "y" ? c.cardEl.offsetHeight : c.cardEl.offsetWidth;
      const back = lane.cards[lane.cards.length - 1];
      c.rpos = lane.dir < 0 ? back.rpos + back.rh + RIVER_GAP : back.rpos - hh - RIVER_GAP;
      c.rh = hh;
      lane.cards.push(c);
      placeRiverCard(c, lane);
      spaceLane(lane);
    }
  });
}
function riverLoop(now){
  if(!riverOn) return;
  const dt = Math.min(0.06, (now - riverLast) / 1000 || 0);
  riverLast = now;
  riverStep(dt, !pausedAll);
  riverRaf = requestAnimationFrame(riverLoop);
}
function startRiver(){
  if(riverOn) return;
  riverOn = true; riverLast = performance.now();
  riverRaf = requestAnimationFrame(riverLoop);
}
function stopRiver(){
  riverOn = false;
  if(riverRaf) cancelAnimationFrame(riverRaf);
  riverRaf = 0;
  riverCards.forEach(c => { if(c.vi >= 0) usedVerses.delete(WALL_VERSES[c.vi].r); });
  riverCards = []; riverRocks = []; riverLanes = [];
}
function setView(v){
  if(view === v) return;
  view = v;
  document.querySelectorAll("#viewbar button").forEach(b => b.classList.toggle("on", b.dataset.view === v));
  const mosaic = document.getElementById("mosaic"), rv = document.getElementById("river");
  if(v === "river"){
    mosaic.style.display = "none";
    rv.style.display = "block";
    window.scrollTo(0, 0);
    buildRiver();
    startRiver();
  } else {
    stopRiver();
    rv.style.display = "none";
    rv.innerHTML = "";
    mosaic.style.display = "";
  }
}

/* keep the phone screen awake while the wall is in use; release after 3 idle minutes */
let wakeLock = null, idleTimer = null;
async function keepAwake(){
  try{
    if(!("wakeLock" in navigator)) return;
    if(!wakeLock) wakeLock = await navigator.wakeLock.request("screen");
    if(wakeLock) wakeLock.addEventListener("release", () => { wakeLock = null; });
  }catch(_){ /* unsupported or denied: carry on quietly */ }
}
function releaseWake(){
  try{ if(wakeLock) wakeLock.release(); }catch(_){}
  wakeLock = null;
}
function noteActivity(){
  if(document.visibilityState === "visible") keepAwake();
  if(idleTimer) clearTimeout(idleTimer);
  idleTimer = setTimeout(releaseWake, 180000);
}
["pointerdown","touchstart","wheel","keydown"].forEach(t =>
  window.addEventListener(t, noteActivity, { passive: true }));
document.addEventListener("visibilitychange", () => {
  if(document.visibilityState === "visible") noteActivity();
  else { if(idleTimer) clearTimeout(idleTimer); }
});
noteActivity();

renderDrawer();
applyFilter(false);
document.querySelectorAll("#viewbar button").forEach(b => b.addEventListener("click", () => setView(b.dataset.view)));
let rvResizeT = null;
window.addEventListener("resize", () => {
  if(rvResizeT) clearTimeout(rvResizeT);
  rvResizeT = setTimeout(() => { if(view === "river"){ buildRiver(); startRiver(); } }, 300);
});
document.getElementById("menuBtn").addEventListener("click", openDrawer);
document.getElementById("scrim").addEventListener("click", closeDrawer);
if(document.fonts && document.fonts.ready) document.fonts.ready.then(() => { cards.forEach(fitText); relayoutRiver(); });
window.__wall = { cards, tick, setVerse, fitText, verseRest,
  setRest(ms){ REST_MIN = 0; REST_MAX = ms; } };
</script>
