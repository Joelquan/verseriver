": "scripture"}, {"t": "The LORD hath appeared of old unto me, saying, Yea, I have loved thee with an everlasting love: therefore with lovingkindness have I drawn thee.", "r": "Jeremiah 31:3", "theme": "scripture"}, {"t": "Behold, what manner of love the Father hath bestowed upon us, that we should be called the sons of God: therefore the world knoweth us not, because it knew him not.", "r": "1 John 3:1", "theme": "scripture"}, {"t": "Behold, I will make them of the synagogue of Satan, which say they are Jews, and are not, but do lie; behold, I will make them to come and worship before thy feet, and to know that I have loved thee.", "r": "Revelation 3:9", "theme": "scripture"}, {"t": "Many waters cannot quench love, neither can the floods drown it: if a man would give all the substance of his house for love, it would utterly be contemned.", "r": "Song of Solomon 8:7", "theme": "scripture"}, {"t": "For I know him, that he will command his children and his household after him, and they shall keep the way of the LORD, to do justice and judgment; that the LORD may bring upon Abraham that which he hath spoken of him.", "r": "Genesis 18:19", "theme": "scripture"}, {"t": "His seed shall be mighty upon earth: the generation of the upright shall be blessed.", "r": "Psalm 112:2", "theme": "scripture"}, {"t": "Thy wife shall be as a fruitful vine by the sides of thine house: thy children like olive plants round about thy table.", "r": "Psalm 128:3", "theme": "scripture"}, {"t": "The just man walketh in his integrity: his children are blessed after him.", "r": "Proverbs 20:7", "theme": "scripture"}, {"t": "And all thy children shall be taught of the LORD; and great shall be the peace of thy children.", "r": "Isaiah 54:13", "theme": "scripture"}, {"t": "For I will pour water upon him that is thirsty, and floods upon the dry ground: I will pour my spirit upon thy seed, and my blessing upon thine offspring:", "r": "Isaiah 44:3", "theme": "scripture"}, {"t": "But the mercy of the LORD is from everlasting to everlasting upon them that fear him, and his righteousness unto children's children;", "r": "Psalm 103:17", "theme": "scripture"}, {"t": "In the fear of the LORD is strong confidence: and his children shall have a place of refuge.", "r": "Proverbs 14:26", "theme": "scripture"}, {"t": "And I will establish my covenant between me and thee and thy seed after thee in their generations for an everlasting covenant, to be a God unto thee, and to thy seed after thee.", "r": "Genesis 17:7", "theme": "scripture"}, {"t": "And the LORD thy God will circumcise thine heart, and the heart of thy seed, to love the LORD thy God with all thine heart, and with all thy soul, that thou mayest live.", "r": "Deuteronomy 30:6", "theme": "scripture"}, {"t": "And their seed shall be known among the Gentiles, and their offspring among the people: all that see them shall acknowledge them, that they are the seed which the LORD hath blessed.", "r": "Isaiah 61:9", "theme": "scripture"}, {"t": "And I will give them one heart, and one way, that they may fear me for ever, for the good of them, and of their children after them:", "r": "Jeremiah 32:39", "theme": "scripture"}, {"t": "And he shall turn the heart of the fathers to the children, and the heart of the children to their fathers, lest I come and smite the earth with a curse.", "r": "Malachi 4:6", "theme": "scripture"}, {"t": "The LORD shall increase you more and more, you and your children.", "r": "Psalm 115:14", "theme": "scripture"}, {"t": "And I will bless them that bless thee, and curse him that curseth thee: and in thee shall all families of the earth be blessed.", "r": "Genesis 12:3", "theme": "scripture"}, {"t": "And shewing mercy unto thousands of them that love me, and keep my commandments.", "r": "Exodus 20:6", "theme": "scripture"}, {"t": "The children of thy servants shall continue, and their seed shall be established before thee.", "r": "Psalm 102:28", "theme": "scripture"}, {"t": "Though hand join in hand, the wicked shall not be unpunished: but the seed of the righteous shall be delivered.", "r": "Proverbs 11:21", "theme": "scripture"}, {"t": "A Song of degrees of David. Behold, how good and how pleasant it is for brethren to dwell together in unity!", "r": "Psalm 133:1", "theme": "scripture"}, {"t": "As for me, this is my covenant with them, saith the LORD; My spirit that is upon thee, and my words which I have put in thy mouth, shall not depart out of thy mouth, nor out of the mouth of thy seed, nor out of the mouth of thy seed's seed, saith the LORD, from henceforth and for ever.", "r": "Isaiah 59:21", "theme": "scripture"}, {"t": "And the peace of God, which passeth all understanding, shall keep your hearts and minds through Christ Jesus.", "r": "Philippians 4:7", "theme": "scripture"}, {"t": "I will both lay me down in peace, and sleep: for thou, LORD, only makest me dwell in safety.", "r": "Psalm 4:8", "theme": "scripture"}, {"t": "When thou liest down, thou shalt not be afraid: yea, thou shalt lie down, and thy sleep shall be sweet.", "r": "Proverbs 3:24", "theme": "scripture"}, {"t": "And my people shall dwell in a peaceable habitation, and in sure dwellings, and in quiet resting places;", "r": "Isaiah 32:18", "theme": "scripture"}, {"t": "The LORD will give strength unto his people; the LORD will bless his people with peace.", "r": "Psalm 29:11", "theme": "scripture"}, {"t": "O that thou hadst hearkened to my commandments! then had thy peace been as a river, and thy righteousness as the waves of the sea:", "r": "Isaiah 48:18", "theme": "scripture"}, {"t": "The LORD lift up his countenance upon thee, and give thee peace.", "r": "Numbers 6:26", "theme": "scripture"}, {"t": "These things I have spoken unto you, that in me ye might have peace. In the world ye shall have tribulation: but be of good cheer; I have overcome the world.", "r": "John 16:33", "theme": "scripture"}, {"t": "Great peace have they which love thy law: and nothing shall offend them.", "r": "Psalm 119:165", "theme": "scripture"}, {"t": "For unto us a child is born, unto us a son is given: and the government shall be upon his shoulder: and his name shall be called Wonderful, Counsellor, The mighty God, The everlasting Father, The Prince of Peace.", "r": "Isaiah 9:6", "theme": "scripture"}, {"t": "Therefore being justified by faith, we have peace with God through our Lord Jesus Christ:", "r": "Romans 5:1", "theme": "scripture"}, {"t": "I will hear what God the LORD will speak: for he will speak peace unto his people, and to his saints: but let them not turn again to folly.", "r": "Psalm 85:8", "theme": "scripture"}, {"t": "Now the Lord of peace himself give you peace always by all means. The Lord be with you all.", "r": "2 Thessalonians 3:16", "theme": "scripture"}, {"t": "Mark the perfect man, and behold the upright: for the end of that man is peace.", "r": "Psalm 37:37", "theme": "scripture"}, {"t": "He shall enter into peace: they shall rest in their beds, each one walking in his uprightness.", "r": "Isaiah 57:2", "theme": "scripture"}, {"t": "When a man's ways please the LORD, he maketh even his enemies to be at peace with him.", "r": "Proverbs 16:7", "theme": "scripture"}, {"t": "And the work of righteousness shall be peace; and the effect of righteousness quietness and assurance for ever.", "r": "Isaiah 32:17", "theme": "scripture"}, {"t": "For he is our peace, who hath made both one, and hath broken down the middle wall of partition between us;", "r": "Ephesians 2:14", "theme": "scripture"}, {"t": "He shall cover thee with his feathers, and under his wings shalt thou trust: his truth shall be thy shield and buckler.", "r": "Psalm 91:4", "theme": "scripture"}, {"t": "The LORD shall preserve thee from all evil: he shall preserve thy soul.", "r": "Psalm 121:7", "theme": "scripture"}, {"t": "The LORD shall preserve thy going out and thy coming in from this time forth, and even for evermore.", "r": "Psalm 121:8", "theme": "scripture"}, {"t": "A thousand shall fall at thy side, and ten thousand at thy right hand; but it shall not come nigh thee.", "r": "Psalm 91:7", "theme": "scripture"}, {"t": "When thou passest through the waters, I will be with thee; and through the rivers, they shall not overflow thee: when thou walkest through the fire, thou shalt not be burned; neither shall the flame kindle upon thee.", "r": "Isaiah 43:2", "theme": "scripture"}, {"t": "To the chief Musician for the sons of Korah, A Song upon Alamoth. God is our refuge and strength, a very present help in trouble.", "r": "Psalm 46:1", "theme": "scripture"}, {"t": "What shall we then say to these things? If God be for us, who can be against us?", "r": "Romans 8:31", "theme": "scripture"}, {"t": "But thou, O LORD, art a shield for me; my glory, and the lifter up of mine head.", "r": "Psalm 3:3", "theme": "scripture"}, {"t": "The LORD is my rock, and my fortress, and my deliverer; my God, my strength, in whom I will trust; my buckler, and the horn of my salvation, and my high tower.", "r": "Psalm 18:2", "theme": "scripture"}, {"t": "Thou art my hiding place; thou shalt preserve me from trouble; thou shalt compass me about with songs of deliverance. Selah.", "r": "Psalm 32:7", "theme": "scripture"}, {"t": "He keepeth the paths of judgment, and preserveth the way of his saints.", "r": "Proverbs 2:8", "theme": "scripture"}, {"t": "As the mountains are round about Jerusalem, so the LORD is round about his people from henceforth even for ever.", "r": "Psalm 125:2", "theme": "scripture"}, {"t": "For I, saith the LORD, will be unto her a wall of fire round about, and will be the glory in the midst of her.", "r": "Zechariah 2:5", "theme": "scripture"}, {"t": "For the LORD your God is he that goeth with you, to fight for you against your enemies, to save you.", "r": "Deuteronomy 20:4", "theme": "scripture"}, {"t": "The LORD shall open unto thee his good treasure, the heaven to give the rain unto thy land in his season, and to bless all the work of thine hand: and thou shalt lend unto many nations, and thou shalt not borrow.", "r": "Deuteronomy 28:12", "theme": "scripture"}, {"t": "And let the beauty of the LORD our God be upon us: and establish thou the work of our hands upon us; yea, the work of our hands establish thou it.", "r": "Psalm 90:17", "theme": "scripture"}, {"t": "He becometh poor that dealeth with a slack hand: but the hand of the diligent maketh rich.", "r": "Proverbs 10:4", "theme": "scripture"}, {"t": "In all labour there is profit: but the talk of the lips tendeth only to penury.", "r": "Proverbs 14:23", "theme": "scripture"}, {"t": "Commit thy works unto the LORD, and thy thoughts shall be established.", "r": "Proverbs 16:3", "theme": "scripture"}, {"t": "Knowing that of the Lord ye shall receive the reward of the inheritance: for ye serve the Lord Christ.", "r": "Colossians 3:24", "theme": "scripture"}, {"t": "And his master saw that the LORD was with him, and that the LORD made all that he did to prosper in his hand.", "r": "Genesis 39:3", "theme": "scripture"}, {"t": "And he shall be like a tree planted by the rivers of water, that bringeth forth his fruit in his season; his leaf also shall not wither; and whatsoever he doeth shall prosper.", "r": "Psalm 1:3", "theme": "scripture"}, {"t": "He that tilleth his land shall be satisfied with bread: but he that followeth vain persons is void of understanding.", "r": "Proverbs 12:11", "theme": "scripture"}, {"t": "The hand of the diligent shall bear rule: but the slothful shall be under tribute.", "r": "Proverbs 12:24", "theme": "scripture"}, {"t": "Wealth gotten by vanity shall be diminished: but he that gathereth by labour shall increase.", "r": "Proverbs 13:11", "theme": "scripture"}, {"t": "The thoughts of the diligent tend only to plenteousness; but of every one that is hasty only to want.", "r": "Proverbs 21:5", "theme": "scripture"}, {"t": "Seest thou a man diligent in his business? he shall stand before kings; he shall not stand before mean men.", "r": "Proverbs 22:29", "theme": "scripture"}, {"t": "Therefore, my beloved brethren, be ye stedfast, unmoveable, always abounding in the work of the Lord, forasmuch as ye know that your labour is not in vain in the Lord.", "r": "1 Corinthians 15:58", "theme": "scripture"}, {"t": "For thou shalt eat the labour of thine hands: happy shalt thou be, and it shall be well with thee.", "r": "Psalm 128:2", "theme": "scripture"}, {"t": "They shall not build, and another inhabit; they shall not plant, and another eat: for as the days of a tree are the days of my people, and mine elect shall long enjoy the work of their hands.", "r": "Isaiah 65:22", "theme": "scripture"}, {"t": "He that tilleth his land shall have plenty of bread: but he that followeth after vain persons shall have poverty enough.", "r": "Proverbs 28:19", "theme": "scripture"}, {"t": "And also that every man should eat and drink, and enjoy the good of all his labour, it is the gift of God.", "r": "Ecclesiastes 3:13", "theme": "scripture"}, {"t": "For the scripture saith, Thou shalt not muzzle the ox that treadeth out the corn. And, The labourer is worthy of his reward.", "r": "1 Timothy 5:18", "theme": "scripture"}, {"t": "For the seed shall be prosperous; the vine shall give her fruit, and the ground shall give her increase, and the heavens shall give their dew; and I will cause the remnant of this people to possess all these things.", "r": "Zechariah 8:12", "theme": "scripture"}, {"t": "And the LORD thy God will make thee plenteous in every work of thine hand, in the fruit of thy body, and in the fruit of thy cattle, and in the fruit of thy land, for good: for the LORD will again rejoice over thee for good, as he rejoiced over thy fathers:", "r": "Deuteronomy 30:9", "theme": "scripture"}, {"t": "And I have filled him with the spirit of God, in wisdom, and in understanding, and in knowledge, and in all manner of workmanship,", "r": "Exodus 31:3", "theme": "scripture"}, {"t": "Of the gold, the silver, and the brass, and the iron, there is no number. Arise therefore, and be doing, and the LORD be with thee.", "r": "1 Chronicles 22:16", "theme": "scripture"}, {"t": "Be ye strong therefore, and let not your hands be weak: for your work shall be rewarded.", "r": "2 Chronicles 15:7", "theme": "scripture"}, {"t": "Verily, verily, I say unto you, He that believeth on me hath everlasting life.", "r": "John 6:47", "theme": "scripture"}, {"t": "For verily I say unto you, That whosoever shall say unto this mountain, Be thou removed, and be thou cast into the sea; and shall not doubt in his heart, but shall believe that those things which he saith shall come to pass; he shall have whatsoever he saith.", "r": "Mark 11:23", "theme": "scripture"}, {"t": "Cast not away therefore your confidence, which hath great recompence of reward.", "r": "Hebrews 10:35", "theme": "scripture"}, {"t": "And they rose early in the morning, and went forth into the wilderness of Tekoa: and as they went forth, Jehoshaphat stood and said, Hear me, O Judah, and ye inhabitants of Jerusalem; Believe in the LORD your God, so shall ye be established; believe his prophets, so shall ye prosper.", "r": "2 Chronicles 20:20", "theme": "scripture"}, {"t": "Commit thy way unto the LORD; trust also in him; and he shall bring it to pass.", "r": "Psalm 37:5", "theme": "scripture"}, {"t": "A Song of degrees. They that trust in the LORD shall be as mount Zion, which cannot be removed, but abideth for ever.", "r": "Psalm 125:1", "theme": "scripture"}, {"t": "For all the promises of God in him are yea, and in him Amen, unto the glory of God by us.", "r": "2 Corinthians 1:20", "theme": "scripture"}, {"t": "God is not a man, that he should lie; neither the son of man, that he should repent: hath he said, and shall he not do it? or hath he spoken, and shall he not make it good?", "r": "Numbers 23:19", "theme": "scripture"}, {"t": "He that spared not his own Son, but delivered him up for us all, how shall he not with him also freely give us all things?", "r": "Romans 8:32", "theme": "scripture"}, {"t": "But the scripture hath concluded all under sin, that the promise by faith of Jesus Christ might be given to them that believe.", "r": "Galatians 3:22", "theme": "scripture"}, {"t": "For whatsoever is born of God overcometh the world: and this is the victory that overcometh the world, even our faith.", "r": "1 John 5:4", "theme": "scripture"}, {"t": "Jesus saith unto him, Thomas, because thou hast seen me, thou hast believed: blessed are they that have not seen, and yet have believed.", "r": "John 20:29", "theme": "scripture"}, {"t": "For therein is the righteousness of God revealed from faith to faith: as it is written, The just shall live by faith.", "r": "Romans 1:17", "theme": "scripture"}, {"t": "Now the just shall live by faith: but if any man draw back, my soul shall have no pleasure in him.", "r": "Hebrews 10:38", "theme": "scripture"}, {"t": "For the scripture saith, Whosoever believeth on him shall not be ashamed.", "r": "Romans 10:11", "theme": "scripture"}, {"t": "We having the same spirit of faith, according as it is written, I believed, and therefore have I spoken; we also believe, and therefore speak;", "r": "2 Corinthians 4:13", "theme": "scripture"}, {"t": "Looking unto Jesus the author and finisher of our faith; who for the joy that was set before him endured the cross, despising the shame, and is set down at the right hand of the throne of God.", "r": "Hebrews 12:2", "theme": "scripture"}, {"t": "And ye shall serve the LORD your God, and he shall bless thy bread, and thy water; and I will take sickness away from the midst of thee.", "r": "Exodus 23:25", "theme": "scripture"}, {"t": "And the LORD will take away from thee all sickness, and will put none of the evil diseases of Egypt, which thou knowest, upon thee; but will lay them upon all them that hate thee.", "r": "Deuteronomy 7:15", "theme": "scripture"}, {"t": "Turn again, and tell Hezekiah the captain of my people, Thus saith the LORD, the God of David thy father, I have heard thy prayer, I have seen thy tears: behold, I will heal thee: on the third day thou shalt go up unto the house of the LORD.", "r": "2 Kings 20:5", "theme": "scripture"}, {"t": "O LORD my God, I cried unto thee, and thou hast healed me.", "r": "Psalm 30:2", "theme": "scripture"}, {"t": "The LORD will strengthen him upon the bed of languishing: thou wilt make all his bed in his sickness.", "r": "Psalm 41:3", "theme": "scripture"}, {"t": "Who forgiveth all thine iniquities; who healeth all thy diseases;", "r": "Psalm 103:3", "theme": "scripture"}, {"t": "He sent his word, and healed them, and delivered them from their destructions.", "r": "Psalm 107:20", "theme": "scripture"}, {"t": "With long life will I satisfy him, and shew him my salvation.", "r": "Psalm 91:16", "theme": "scripture"}, {"t": "It shall be health to thy navel, and marrow to thy bones.", "r": "Proverbs 3:8", "theme": "scripture"}, {"t": "For they are life unto those that find them, and health to all their flesh.", "r": "Proverbs 4:22", "theme": "scripture"}, {"t": "I have seen his ways, and will heal him: I will lead him also, and restore comforts unto him and to his mourners.", "r": "Isaiah 57:18", "theme": "scripture"}, {"t": "Then shall thy light break forth as the morning, and thine health shall spring forth speedily: and thy righteousness shall go before thee; the glory of the LORD shall be thy rereward.", "r": "Isaiah 58:8", "theme": "scripture"}, {"t": "For I will restore health unto thee, and I will heal thee of thy wounds, saith the LORD; because they called thee an Outcast, saying, This is Zion, whom no man seeketh after.", "r": "Jeremiah 30:17", "theme": "scripture"}, {"t": "Behold, I will bring it health and cure, and I will cure them, and will reveal unto them the abundance of peace and truth.", "r": "Jeremiah 33:6", "theme": "scripture"}, {"t": "Come, and let us return unto the LORD: for he hath torn, and he will heal us; he hath smitten, and he will bind us up.", "r": "Hosea 6:1", "theme": "scripture"}, {"t": "That it might be fulfilled which was spoken by Esaias the prophet, saying, Himself took our infirmities, and bare our sicknesses.", "r": "Matthew 8:17", "theme": "scripture"}, {"t": "How God anointed Jesus of Nazareth with the Holy Ghost and with power: who went about doing good, and healing all that were oppressed of the devil; for God was with him.", "r": "Acts 10:38", "theme": "scripture"}, {"t": "And the prayer of faith shall save the sick, and the Lord shall raise him up; and if he have committed sins, they shall be forgiven him.", "r": "James 5:15", "theme": "scripture"}, {"t": "Who his own self bare our sins in his own body on the tree, that we, being dead to sins, should live unto righteousness: by whose stripes ye were healed.", "r": "1 Peter 2:24", "theme": "scripture"}, {"t": "But my God shall supply all your need according to his riches in glory by Christ Jesus.", "r": "Philippians 4:19", "theme": "scripture"}, {"t": "Bring ye all the tithes into the storehouse, that there may be meat in mine house, and prove me now herewith, saith the LORD of hosts, if I will not open you the windows of heaven, and pour you out a blessing, that there shall not be room enough to receive it.", "r": "Malachi 3:10", "theme": "scripture"}, {"t": "Give, and it shall be given unto you; good measure, pressed down, and shaken together, and running over, shall men give into your bosom. For with the same measure that ye mete withal it shall be measured to you again.", "r": "Luke 6:38", "theme": "scripture"}, {"t": "And God is able to make all grace abound toward you; that ye, always having all sufficiency in all things, may abound to every good work:", "r": "2 Corinthians 9:8", "theme": "scripture"}, {"t": "Now he that ministereth seed to the sower both minister bread for your food, and multiply your seed sown, and increase the fruits of your righteousness;)", "r": "2 Corinthians 9:10", "theme": "scripture"}, {"t": "But thou shalt remember the LORD thy God: for it is he that giveth thee power to get wealth, that he may establish his covenant which he sware unto thy fathers, as it is this day.", "r": "Deuteronomy 8:18", "theme": "scripture"}, {"t": "The LORD shall command the blessing upon thee in thy storehouses, and in all that thou settest thine hand unto; and he shall bless thee in the land which the LORD thy God giveth thee.", "r": "Deuteronomy 28:8", "theme": "scripture"}, {"t": "And the LORD shall make thee plenteous in goods, in the fruit of thy body, and in the fruit of thy cattle, and in the fruit of thy ground, in the land which the LORD sware unto thy fathers to give thee.", "r": "Deuteronomy 28:11", "theme": "scripture"}, {"t": "I have been young, and now am old; yet have I not seen the righteous forsaken, nor his seed begging bread.", "r": "Psalm 37:25", "theme": "scripture"}, {"t": "The young lions do lack, and suffer hunger: but they that seek the LORD shall not want any good thing.", "r": "Psalm 34:10", "theme": "scripture"}, {"t": "For the LORD God is a sun and shield: the LORD will give grace and glory: no good thing will he withhold from them that walk uprightly.", "r": "Psalm 84:11", "theme": "scripture"}, {"t": "So shall thy barns be filled with plenty, and thy presses shall burst out with new wine.", "r": "Proverbs 3:10", "theme": "scripture"}, {"t": "The blessing of the LORD, it maketh rich, and he addeth no sorrow with it.", "r": "Proverbs 10:22", "theme": "scripture"}, {"t": "The liberal soul shall be made fat: and he that watereth shall be watered also himself.", "r": "Proverbs 11:25", "theme": "scripture"}, {"t": "This book of the law shall not depart out of thy mouth; but thou shalt meditate therein day and night, that thou mayest observe to do according to all that is written therein: for then thou shalt make thy way prosperous, and then thou shalt have good success.", "r": "Joshua 1:8", "theme": "scripture"}, {"t": "Wealth and riches shall be in his house: and his righteousness endureth for ever.", "r": "Psalm 112:3", "theme": "scripture"}, {"t": "If ye be willing and obedient, ye shall eat the good of the land:", "r": "Isaiah 1:19", "theme": "scripture"}, {"t": "And ye shall eat in plenty, and be satisfied, and praise the name of the LORD your God, that hath dealt wondrously with you: and my people shall never be ashamed.", "r": "Joel 2:26", "theme": "scripture"}, {"t": "Is the seed yet in the barn? yea, as yet the vine, and the fig tree, and the pomegranate, and the olive tree, hath not brought forth: from this day will I bless you.", "r": "Haggai 2:19", "theme": "scripture"}, {"t": "Then Isaac sowed in that land, and received in the same year an hundredfold: and the LORD blessed him.", "r": "Genesis 26:12", "theme": "scripture"}, {"t": "Then I will give you rain in due season, and the land shall yield her increase, and the trees of the field shall yield their fruit.", "r": "Leviticus 26:4", "theme": "scripture"}, {"t": "They shall not be ashamed in the evil time: and in the days of famine they shall be satisfied.", "r": "Psalm 37:19", "theme": "scripture"}, {"t": "Thou visitest the earth, and waterest it: thou greatly enrichest it with the river of God, which is full of water: thou preparest them corn, when thou hast so provided for it.", "r": "Psalm 65:9", "theme": "scripture"}, {"t": "For the LORD giveth wisdom: out of his mouth cometh knowledge and understanding.", "r": "Proverbs 2:6", "theme": "scripture"}, {"t": "He layeth up sound wisdom for the righteous: he is a buckler to them that walk uprightly.", "r": "Proverbs 2:7", "theme": "scripture"}, {"t": "I will instruct thee and teach thee in the way which thou shalt go: I will guide thee with mine eye.", "r": "Psalm 32:8", "theme": "scripture"}, {"t": "The meek will he guide in judgment: and the meek will he teach his way.", "r": "Psalm 25:9", "theme": "scripture"}, {"t": "What man is he that feareth the LORD? him shall he teach in the way that he shall choose.", "r": "Psalm 25:12", "theme": "scripture"}, {"t": "And thine ears shall hear a word behind thee, saying, This is the way, walk ye in it, when ye turn to the right hand, and when ye turn to the left.", "r": "Isaiah 30:21", "theme": "scripture"}, {"t": "And the LORD shall guide thee continually, and satisfy thy soul in drought, and make fat thy bones: and thou shalt be like a watered garden, and like a spring of water, whose waters fail not.", "r": "Isaiah 58:11", "theme": "scripture"}, {"t": "Howbeit when he, the Spirit of truth, is come, he will guide you into all truth: for he shall not speak of himself; but whatsoever he shall hear, that shall he speak: and he will shew you things to come.", "r": "John 16:13", "theme": "scripture"}, {"t": "But the anointing which ye have received of him abideth in you, and ye need not that any man teach you: but as the same anointing teacheth you of all things, and is truth, and is no lie, and even as it hath taught you, ye shall abide in him.", "r": "1 John 2:27", "theme": "scripture"}, {"t": "For who hath known the mind of the Lord, that he may instruct him? But we have the mind of Christ.", "r": "1 Corinthians 2:16", "theme": "scripture"}, {"t": "But of him are ye in Christ Jesus, who of God is made unto us wisdom, and righteousness, and sanctification, and redemption:", "r": "1 Corinthians 1:30", "theme": "scripture"}, {"t": "In whom are hid all the treasures of wisdom and knowledge.", "r": "Colossians 2:3", "theme": "scripture"}, {"t": "And he changeth the times and the seasons: he removeth kings, and setteth up kings: he giveth wisdom unto the wise, and knowledge to them that know understanding:", "r": "Daniel 2:21", "theme": "scripture"}, {"t": "For God giveth to a man that is good in his sight wisdom, and knowledge, and joy: but to the sinner he giveth travail, to gather and to heap up, that he may give to him that is good before God. This also is vanity and vexation of spirit.", "r": "Ecclesiastes 2:26", "theme": "scripture"}, {"t": "Turn you at my reproof: behold, I will pour out my spirit unto you, I will make known my words unto you.", "r": "Proverbs 1:23", "theme": "scripture"}, {"t": "The fear of the LORD is the beginning of wisdom: a good understanding have all they that do his commandments: his praise endureth for ever.", "r": "Psalm 111:10", "theme": "scripture"}, {"t": "He that walketh with wise men shall be wise: but a companion of fools shall be destroyed.", "r": "Proverbs 13:20", "theme": "scripture"}, {"t": "Hear counsel, and receive instruction, that thou mayest be wise in thy latter end.", "r": "Proverbs 19:20", "theme": "scripture"}, {"t": "Thou shalt guide me with thy counsel, and afterward receive me to glory.", "r": "Psalm 73:24", "theme": "scripture"}, {"t": "And unto man he said, Behold, the fear of the Lord, that is wisdom; and to depart from evil is understanding.", "r": "Job 28:28", "theme": "scripture"}, {"t": "Happy is the man that findeth wisdom, and the man that getteth understanding.", "r": "Proverbs 3:13", "theme": "scripture"}, {"t": "Be strong and of a good courage: for unto this people shalt thou divide for an inheritance the land, which I sware unto their fathers to give them.", "r": "Joshua 1:6", "theme": "scripture"}, {"t": "Only be thou strong and very courageous, that thou mayest observe to do according to all the law, which Moses my servant commanded thee: turn not from it to the right hand or to the left, that thou mayest prosper whithersoever thou goest.", "r": "Joshua 1:7", "theme": "scripture"}, {"t": "And David said to Solomon his son, Be strong and of good courage, and do it: fear not, nor be dismayed: for the LORD God, even my God, will be with thee; he will not fail thee, nor forsake thee, until thou hast finished all the work for the service of the house of the LORD.", "r": "1 Chronicles 28:20", "theme": "scripture"}, {"t": "And Moses called unto Joshua, and said unto him in the sight of all Israel, Be strong and of a good courage: for thou must go with this people unto the land which the LORD hath sworn unto their fathers to give them; and thou shalt cause them to inherit it.", "r": "Deuteronomy 31:7", "theme": "scripture"}, {"t": "Wait on the LORD: be of good courage, and he shall strengthen thine heart: wait, I say, on the LORD.", "r": "Psalm 27:14", "theme": "scripture"}, {"t": "Be of good courage, and he shall strengthen your heart, all ye that hope in the LORD.", "r": "Psalm 31:24", "theme": "scripture"}, {"t": "But now thus saith the LORD that created thee, O Jacob, and he that formed thee, O Israel, Fear not: for I have redeemed thee, I have called thee by thy name; thou art mine.", "r": "Isaiah 43:1", "theme": "scripture"}, {"t": "Watch ye, stand fast in the faith, quit you like men, be strong.", "r": "1 Corinthians 16:13", "theme": "scripture"}, {"t": "And in nothing terrified by your adversaries: which is to them an evident token of perdition, but to you of salvation, and that of God.", "r": "Philippians 1:28", "theme": "scripture"}, {"t": "Be strong and courageous, be not afraid nor dismayed for the king of Assyria, nor for all the multitude that is with him: for there be more with us than with him:", "r": "2 Chronicles 32:7", "theme": "scripture"}, {"t": "And said, O man greatly beloved, fear not: peace be unto thee, be strong, yea, be strong. And when he had spoken unto me, I was strengthened, and said, Let my lord speak; for thou hast strengthened me.", "r": "Daniel 10:19", "theme": "scripture"}, {"t": "Yet now be strong, O Zerubbabel, saith the LORD; and be strong, O Joshua, son of Josedech, the high priest; and be strong, all ye people of the land, saith the LORD, and work: for I am with you, saith the LORD of hosts:", "r": "Haggai 2:4", "theme": "scripture"}, {"t": "And it shall come to pass, that as ye were a curse among the heathen, O house of Judah, and house of Israel; so will I save you, and ye shall be a blessing: fear not, but let your hands be strong.", "r": "Zechariah 8:13", "theme": "scripture"}, {"t": "Then shalt thou prosper, if thou takest heed to fulfil the statutes and judgments which the LORD charged Moses with concerning Israel: be strong, and of good courage; dread not, nor be dismayed.", "r": "1 Chronicles 22:13", "theme": "scripture"}, {"t": "What time I am afraid, I will trust in thee.", "r": "Psalm 56:3", "theme": "scripture"}, {"t": "In God I will praise his word, in God I have put my trust; I will not fear what flesh can do unto me.", "r": "Psalm 56:4", "theme": "scripture"}, {"t": "Say to them that are of a fearful heart, Be strong, fear not: behold, your God will come with vengeance, even God with a recompence; he will come and save you.", "r": "Isaiah 35:4", "theme": "scripture"}, {"t": "But straightway Jesus spake unto them, saying, Be of good cheer; it is I; be not afraid.", "r": "Matthew 14:27", "theme": "scripture"}, {"t": "And he gave Joshua the son of Nun a charge, and said, Be strong and of a good courage: for thou shalt bring the children of Israel into the land which I sware unto them: and I will be with thee.", "r": "Deuteronomy 31:23", "theme": "scripture"}, {"t": "Arise; for this matter belongeth unto thee: we also will be with thee: be of good courage, and do it.", "r": "Ezra 10:4", "theme": "scripture"}, {"t": "Wherefore, sirs, be of good cheer: for I believe God, that it shall be even as it was told me.", "r": "Acts 27:25", "theme": "scripture"}, {"t": "He shall not be afraid of evil tidings: his heart is fixed, trusting in the LORD.", "r": "Psalm 112:7", "theme": "scripture"}, {"t": "Hearken unto me, ye that know righteousness, the people in whose heart is my law; fear ye not the reproach of men, neither be ye afraid of their revilings.", "r": "Isaiah 51:7", "theme": "scripture"}, {"t": "Only rebel not ye against the LORD, neither fear ye the people of the land; for they are bread for us: their defence is departed from them, and the LORD is with us: fear them not.", "r": "Numbers 14:9", "theme": "scripture"}, {"t": "The righteous cry, and the LORD heareth, and delivereth them out of all their troubles.", "r": "Psalm 34:17", "theme": "scripture"}, {"t": "And the Lord shall deliver me from every evil work, and will preserve me unto his heavenly kingdom: to whom be glory for ever and ever. Amen.", "r": "2 Timothy 4:18", "theme": "scripture"}, {"t": "The Lord knoweth how to deliver the godly out of temptations, and to reserve the unjust unto the day of judgment to be punished:", "r": "2 Peter 2:9", "theme": "scripture"}, {"t": "If it be so, our God whom we serve is able to deliver us from the burning fiery furnace, and he will deliver us out of thine hand, O king.", "r": "Daniel 3:17", "theme": "scripture"}, {"t": "He delivereth and rescueth, and he worketh signs and wonders in heaven and in earth, who hath delivered Daniel from the power of the lions.", "r": "Daniel 6:27", "theme": "scripture"}, {"t": "He delivered me from my strong enemy, and from them which hated me: for they were too strong for me.", "r": "Psalm 18:17", "theme": "scripture"}, {"t": "But I am poor and needy; yet the Lord thinketh upon me: thou art my help and my deliverer; make no tarrying, O my God.", "r": "Psalm 40:17", "theme": "scripture"}, {"t": "But I am poor and needy: make haste unto me, O God: thou art my help and my deliverer; O LORD, make no tarrying.", "r": "Psalm 70:5", "theme": "scripture"}, {"t": "And he said, The LORD is my rock, and my fortress, and my deliverer;", "r": "2 Samuel 22:2", "theme": "scripture"}, {"t": "And I will deliver thee out of the hand of the wicked, and I will redeem thee out of the hand of the terrible.", "r": "Jeremiah 15:21", "theme": "scripture"}, {"t": "And even to your old age I am he; and even to hoar hairs will I carry you: I have made, and I will bear; even I will carry, and will deliver you.", "r": "Isaiah 46:4", "theme": "scripture"}, {"t": "And it shall come to pass, that whosoever shall call on the name of the LORD shall be delivered: for in mount Zion and in Jerusalem shall be deliverance, as the LORD hath said, and in the remnant whom the LORD shall call.", "r": "Joel 2:32", "theme": "scripture"}, {"t": "Who gave himself for our sins, that he might deliver us from this present evil world, according to the will of God and our Father:", "r": "Galatians 1:4", "theme": "scripture"}, {"t": "Who hath delivered us from the power of darkness, and hath translated us into the kingdom of his dear Son:", "r": "Colossians 1:13", "theme": "scripture"}, {"t": "And to wait for his Son from heaven, whom he raised from the dead, even Jesus, which delivered us from the wrath to come.", "r": "1 Thessalonians 1:10", "theme": "scripture"}, {"t": "I thank God through Jesus Christ our Lord. So then with the mind I myself serve the law of God; but with the flesh the law of sin.", "r": "Romans 7:25", "theme": "scripture"}, {"t": "Who delivered us from so great a death, and doth deliver: in whom we trust that he will yet deliver us;", "r": "2 Corinthians 1:10", "theme": "scripture"}, {"t": "And deliver them who through fear of death were all their lifetime subject to bondage.", "r": "Hebrews 2:15", "theme": "scripture"}, {"t": "Then they cried unto the LORD in their trouble, and he delivered them out of their distresses.", "r": "Psalm 107:6", "theme": "scripture"}, {"t": "And it shall be for a sign and for a witness unto the LORD of hosts in the land of Egypt: for they shall cry unto the LORD because of the oppressors, and he shall send them a saviour, and a great one, and he shall deliver them.", "r": "Isaiah 19:20", "theme": "scripture"}, {"t": "For I will surely deliver thee, and thou shalt not fall by the sword, but thy life shall be for a prey unto thee: because thou hast put thy trust in me, saith the LORD.", "r": "Jeremiah 39:18", "theme": "scripture"}, {"t": "And I will deliver thee and this city out of the hand of the king of Assyria: and I will defend this city.", "r": "Isaiah 38:6", "theme": "scripture"}, {"t": "Then we departed from the river of Ahava on the twelfth day of the first month, to go unto Jerusalem: and the hand of our God was upon us, and he delivered us from the hand of the enemy, and of such as lay in wait by the way.", "r": "Ezra 8:31", "theme": "scripture"}, {"t": "For thou, LORD, wilt bless the righteous; with favour wilt thou compass him as with a shield.", "r": "Psalm 5:12", "theme": "scripture"}, {"t": "For thou art the glory of their strength: and in thy favour our horn shall be exalted.", "r": "Psalm 89:17", "theme": "scripture"}, {"t": "So shalt thou find favour and good understanding in the sight of God and man.", "r": "Proverbs 3:4", "theme": "scripture"}, {"t": "For whoso findeth me findeth life, and shall obtain favour of the LORD.", "r": "Proverbs 8:35", "theme": "scripture"}, {"t": "A good man obtaineth favour of the LORD: but a man of wicked devices will he condemn.", "r": "Proverbs 12:2", "theme": "scripture"}, {"t": "In the light of the king's countenance is life; and his favour is as a cloud of the latter rain.", "r": "Proverbs 16:15", "theme": "scripture"}, {"t": "Whoso findeth a wife findeth a good thing, and obtaineth favour of the LORD.", "r": "Proverbs 18:22", "theme": "scripture"}, {"t": "And the angel said unto her, Fear not, Mary: for thou hast found favour with God.", "r": "Luke 1:30", "theme": "scripture"}, {"t": "And Jesus increased in wisdom and stature, and in favour with God and man.", "r": "Luke 2:52", "theme": "scripture"}, {"t": "Praising God, and having favour with all the people. And the Lord added to the church daily such as should be saved.", "r": "Acts 2:47", "theme": "scripture"}, {"t": "And I will give this people favour in the sight of the Egyptians: and it shall come to pass, that, when ye go, ye shall not go empty:", "r": "Exodus 3:21", "theme": "scripture"}, {"t": "Thou shalt arise, and have mercy upon Zion: for the time to favour her, yea, the set time, is come.", "r": "Psalm 102:13", "theme": "scripture"}, {"t": "And the sons of strangers shall build up thy walls, and their kings shall minister unto thee: for in my wrath I smote thee, but in my favour have I had mercy on thee.", "r": "Isaiah 60:10", "theme": "scripture"}, {"t": "The LORD make his face shine upon thee, and be gracious unto thee:", "r": "Numbers 6:25", "theme": "scripture"}, {"t": "Fools make a mock at sin: but among the righteous there is favour.", "r": "Proverbs 14:9", "theme": "scripture"}, {"t": "And the child Samuel grew on, and was in favour both with the LORD, and also with men.", "r": "1 Samuel 2:26", "theme": "scripture"}, {"t": "And the king loved Esther above all the women, and she obtained grace and favour in his sight more than all the virgins; so that he set the royal crown upon her head, and made her queen instead of Vashti.", "r": "Esther 2:17", "theme": "scripture"}, {"t": "Now God had brought Daniel into favour and tender love with the prince of the eunuchs.", "r": "Daniel 1:9", "theme": "scripture"}, {"t": "But the LORD was with Joseph, and shewed him mercy, and gave him favour in the sight of the keeper of the prison.", "r": "Genesis 39:21", "theme": "scripture"}, {"t": "And the LORD gave the people favour in the sight of the Egyptians, so that they lent unto them such things as they required. And they spoiled the Egyptians.", "r": "Exodus 12:36", "theme": "scripture"}, {"t": "Remember me, O LORD, with the favour that thou bearest unto thy people: O visit me with thy salvation;", "r": "Psalm 106:4", "theme": "scripture"}, {"t": "And of Naphtali he said, O Naphtali, satisfied with favour, and full with the blessing of the LORD: possess thou the west and the south.", "r": "Deuteronomy 33:23", "theme": "scripture"}, {"t": "By this I know that thou favourest me, because mine enemy doth not triumph over me.", "r": "Psalm 41:11", "theme": "scripture"}, {"t": "O Lord, I beseech thee, let now thine ear be attentive to the prayer of thy servant, and to the prayer of thy servants, who desire to fear thy name: and prosper, I pray thee, thy servant this day, and grant him mercy in the sight of this man. For I was the king's cupbearer.", "r": "Nehemiah 1:11", "theme": "scripture"}, {"t": "And the LORD gave the people favour in the sight of the Egyptians. Moreover the man Moses was very great in the land of Egypt, in the sight of Pharaoh's servants, and in the sight of the people.", "r": "Exodus 11:3", "theme": "scripture"}, {"t": "Come now, and let us reason together, saith the LORD: though your sins be as scarlet, they shall be as white as snow; though they be red like crimson, they shall be as wool.", "r": "Isaiah 1:18", "theme": "scripture"}, {"t": "I, even I, am he that blotteth out thy transgressions for mine own sake, and will not remember thy sins.", "r": "Isaiah 43:25", "theme": "scripture"}, {"t": "I have blotted out, as a thick cloud, thy transgressions, and, as a cloud, thy sins: return unto me; for I have redeemed thee.", "r": "Isaiah 44:22", "theme": "scripture"}, {"t": "Who is a God like unto thee, that pardoneth iniquity, and passeth by the transgression of the remnant of his heritage? he retaineth not his anger for ever, because he delighteth in mercy.", "r": "Micah 7:18", "theme": "scripture"}, {"t": "He will turn again, he will have compassion upon us; he will subdue our iniquities; and thou wilt cast all their sins into the depths of the sea.", "r": "Micah 7:19", "theme": "scripture"}, {"t": "A Psalm of David, Maschil. Blessed is he whose transgression is forgiven, whose sin is covered.", "r": "Psalm 32:1", "theme": "scripture"}, {"t": "I acknowledged my sin unto thee, and mine iniquity have I not hid. I said, I will confess my transgressions unto the LORD; and thou forgavest the iniquity of my sin. Selah.", "r": "Psalm 32:5", "theme": "scripture"}, {"t": "For thou, Lord, art good, and ready to forgive; and plenteous in mercy unto all them that call upon thee.", "r": "Psalm 86:5", "theme": "scripture"}, {"t": "As far as the east is from the west, so far hath he removed our transgressions from us.", "r": "Psalm 103:12", "theme": "scripture"}, {"t": "But there is forgiveness with thee, that thou mayest be feared.", "r": "Psalm 130:4", "theme": "scripture"}, {"t": "To the Lord our God belong mercies and forgivenesses, though we have rebelled against him;", "r": "Daniel 9:9", "theme": "scripture"}, {"t": "For if ye forgive men their trespasses, your heavenly Father will also forgive you:", "r": "Matthew 6:14", "theme": "scripture"}, {"t": "And when ye stand praying, forgive, if ye have ought against any: that your Father also which is in heaven may forgive you your trespasses.", "r": "Mark 11:25", "theme": "scripture"}, {"t": "Judge not, and ye shall not be judged: condemn not, and ye shall not be condemned: forgive, and ye shall be forgiven:", "r": "Luke 6:37", "theme": "scripture"}, {"t": "Be it known unto you therefore, men and brethren, that through this man is preached unto you the forgiveness of sins:", "r": "Acts 13:38", "theme": "scripture"}, {"t": "Forbearing one another, and forgiving one another, if any man have a quarrel against any: even as Christ forgave you, so also do ye.", "r": "Colossians 3:13", "theme": "scripture"}, {"t": "In whom we have redemption through his blood, even the forgiveness of sins:", "r": "Colossians 1:14", "theme": "scripture"}, {"t": "And their sins and iniquities will I remember no more.", "r": "Hebrews 10:17", "theme": "scripture"}, {"t": "I write unto you, little children, because your sins are forgiven you for his name's sake.", "r": "1 John 2:12", "theme": "scripture"}, {"t": "And they shall teach no more every man his neighbour, and every man his brother, saying, Know the LORD: for they shall all know me, from the least of them unto the greatest of them, saith the LORD: for I will forgive their iniquity, and I will remember their sin no more.", "r": "Jeremiah 31:34", "theme": "scripture"}, {"t": "And refused to obey, neither were mindful of thy wonders that thou didst among them; but hardened their necks, and in their rebellion appointed a captain to return to their bondage: but thou art a God ready to pardon, gracious and merciful, slow to anger, and of great kindness, and forsookest them not.", "r": "Nehemiah 9:17", "theme": "scripture"}, {"t": "Let the wicked forsake his way, and the unrighteous man his thoughts: and let him return unto the LORD, and he will have mercy upon him; and to our God, for he will abundantly pardon.", "r": "Isaiah 55:7", "theme": "scripture"}, {"t": "By whom also we have access by faith into this grace wherein we stand, and rejoice in hope of the glory of God.", "r": "Romans 5:2", "theme": "scripture"}, {"t": "For if by one man's offence death reigned by one; much more they which receive abundance of grace and of the gift of righteousness shall reign in life by one, Jesus Christ.)", "r": "Romans 5:17", "theme": "scripture"}, {"t": "That as sin hath reigned unto death, even so might grace reign through righteousness unto eternal life by Jesus Christ our Lord.", "r": "Romans 5:21", "theme": "scripture"}, {"t": "For sin shall not have dominion over you: for ye are not under the law, but under grace.", "r": "Romans 6:14", "theme": "scripture"}, {"t": "And if by grace, then is it no more of works: otherwise grace is no more grace. But if it be of works, then is it no more grace: otherwise work is no more work.", "r": "Romans 11:6", "theme": "scripture"}, {"t": "In whom we have redemption through his blood, the forgiveness of sins, according to the riches of his grace;", "r": "Ephesians 1:7", "theme": "scripture"}, {"t": "Even when we were dead in sins, hath quickened us together with Christ, (by grace ye are saved;)", "r": "Ephesians 2:5", "theme": "scripture"}, {"t": "That in the ages to come he might shew the exceeding riches of his grace in his kindness toward us through Christ Jesus.", "r": "Ephesians 2:7", "theme": "scripture"}, {"t": "That being justified by his grace, we should be made heirs according to the hope of eternal life.", "r": "Titus 3:7", "theme": "scripture"}, {"t": "But grow in grace, and in the knowledge of our Lord and Saviour Jesus Christ. To him be glory both now and for ever. Amen.", "r": "2 Peter 3:18", "theme": "scripture"}, {"t": "But he giveth more grace. Wherefore he saith, God resisteth the proud, but giveth grace unto the humble.", "r": "James 4:6", "theme": "scripture"}, {"t": "But by the grace of God I am what I am: and his grace which was bestowed upon me was not in vain; but I laboured more abundantly than they all: yet not I, but the grace of God which was with me.", "r": "1 Corinthians 15:10", "theme": "scripture"}, {"t": "For ye know the grace of our Lord Jesus Christ, that, though he was rich, yet for your sakes he became poor, that ye through his poverty might be rich.", "r": "2 Corinthians 8:9", "theme": "scripture"}, {"t": "And now, brethren, I commend you to God, and to the word of his grace, which is able to build you up, and to give you an inheritance among all them which are sanctified.", "r": "Acts 20:32", "theme": "scripture"}, {"t": "Being justified freely by his grace through the redemption that is in Christ Jesus:", "r": "Romans 3:24", "theme": "scripture"}, {"t": "To the praise of the glory of his grace, wherein he hath made us accepted in the beloved.", "r": "Ephesians 1:6", "theme": "scripture"}, {"t": "And the grace of our Lord was exceeding abundant with faith and love which is in Christ Jesus.", "r": "1 Timothy 1:14", "theme": "scripture"}, {"t": "Thou therefore, my son, be strong in the grace that is in Christ Jesus.", "r": "2 Timothy 2:1", "theme": "scripture"}, {"t": "Wherefore gird up the loins of your mind, be sober, and hope to the end for the grace that is to be brought unto you at the revelation of Jesus Christ;", "r": "1 Peter 1:13", "theme": "scripture"}, {"t": "Grace and peace be multiplied unto you through the knowledge of God, and of Jesus our Lord,", "r": "2 Peter 1:2", "theme": "scripture"}, {"t": "The grace of our Lord Jesus Christ be with you all. Amen.", "r": "Revelation 22:21", "theme": "scripture"}, {"t": "O give thanks unto the LORD, for he is good: for his mercy endureth for ever.", "r": "Psalm 107:1", "theme": "scripture"}, {"t": "O give thanks unto the LORD; for he is good: because his mercy endureth for ever.", "r": "Psalm 118:1", "theme": "scripture"}, {"t": "And whatsoever ye do in word or deed, do all in the name of the Lord Jesus, giving thanks to God and the Father by him.", "r": "Colossians 3:17", "theme": "scripture"}, {"t": "Giving thanks always for all things unto God and the Father in the name of our Lord Jesus Christ;", "r": "Ephesians 5:20", "theme": "scripture"}, {"t": "Let us come before his presence with thanksgiving, and make a joyful noise unto him with psalms.", "r": "Psalm 95:2", "theme": "scripture"}, {"t": "I will praise the name of God with a song, and will magnify him with thanksgiving.", "r": "Psalm 69:30", "theme": "scripture"}, {"t": "Offer unto God thanksgiving; and pay thy vows unto the most High:", "r": "Psalm 50:14", "theme": "scripture"}, {"t": "Thanks be unto God for his unspeakable gift.", "r": "2 Corinthians 9:15", "theme": "scripture"}, {"t": "Now therefore, our God, we thank thee, and praise thy glorious name.", "r": "1 Chronicles 29:13", "theme": "scripture"}, {"t": "To the end that my glory may sing praise to thee, and not be silent. O LORD my God, I will give thanks unto thee for ever.", "r": "Psalm 30:12", "theme": "scripture"}, {"t": "A Psalm or Song for the sabbath day. It is a good thing to give thanks unto the LORD, and to sing praises unto thy name, O most High:", "r": "Psalm 92:1", "theme": "scripture"}, {"t": "Praise ye the LORD. O give thanks unto the LORD; for he is good: for his mercy endureth for ever.", "r": "Psalm 106:1", "theme": "scripture"}, {"t": "I will offer to thee the sacrifice of thanksgiving, and will call upon the name of the LORD.", "r": "Psalm 116:17", "theme": "scripture"}, {"t": "By him therefore let us offer the sacrifice of praise to God continually, that is, the fruit of our lips giving thanks to his name.", "r": "Hebrews 13:15", "theme": "scripture"}, {"t": "Rooted and built up in him, and stablished in the faith, as ye have been taught, abounding therein with thanksgiving.", "r": "Colossians 2:7", "theme": "scripture"}, {"t": "Continue in prayer, and watch in the same with thanksgiving;", "r": "Colossians 4:2", "theme": "scripture"}, {"t": "To the chief Musician upon Muthlabben, A Psalm of David. I will praise thee, O LORD, with my whole heart; I will shew forth all thy marvellous works.", "r": "Psalm 9:1", "theme": "scripture"}, {"t": "And let them sacrifice the sacrifices of thanksgiving, and declare his works with rejoicing.", "r": "Psalm 107:22", "theme": "scripture"}, {"t": "Whoso offereth praise glorifieth me: and to him that ordereth his conversation aright will I shew the salvation of God.", "r": "Psalm 50:23", "theme": "scripture"}, {"t": "Therefore I will give thanks unto thee, O LORD, among the heathen, and I will sing praises unto thy name.", "r": "2 Samuel 22:50", "theme": "scripture"}, {"t": "For this God is our God for ever and ever: he will be our guide even unto death.", "r": "Psalm 48:14", "theme": "scripture"}, {"t": "He restoreth my soul: he leadeth me in the paths of righteousness for his name's sake.", "r": "Psalm 23:3", "theme": "scripture"}, {"t": "For thou art my rock and my fortress; therefore for thy name's sake lead me, and guide me.", "r": "Psalm 31:3", "theme": "scripture"}, {"t": "O send out thy light and thy truth: let them lead me; let them bring me unto thy holy hill, and to thy tabernacles.", "r": "Psalm 43:3", "theme": "scripture"}, {"t": "From the end of the earth will I cry unto thee, when my heart is overwhelmed: lead me to the rock that is higher than I.", "r": "Psalm 61:2", "theme": "scripture"}, {"t": "Even there shall thy hand lead me, and thy right hand shall hold me.", "r": "Psalm 139:10", "theme": "scripture"}, {"t": "And I will bring the blind by a way that they knew not; I will lead them in paths that they have not known: I will make darkness light before them, and crooked things straight. These things will I do unto them, and not forsake them.", "r": "Isaiah 42:16", "theme": "scripture"}, {"t": "Thus saith the LORD, thy Redeemer, the Holy One of Israel; I am the LORD thy God which teacheth thee to profit, which leadeth thee by the way that thou shouldest go.", "r": "Isaiah 48:17", "theme": "scripture"}, {"t": "They shall not hunger nor thirst; neither shall the heat nor sun smite them: for he that hath mercy on them shall lead them, even by the springs of water shall he guide them.", "r": "Isaiah 49:10", "theme": "scripture"}, {"t": "And the LORD went before them by day in a pillar of a cloud, to lead them the way; and by night in a pillar of fire, to give them light; to go by day and night:", "r": "Exodus 13:21", "theme": "scripture"}, {"t": "Who went in the way before you, to search you out a place to pitch your tents in, in fire by night, to shew you by what way ye should go, and in a cloud by day.", "r": "Deuteronomy 1:33", "theme": "scripture"}, {"t": "To him the porter openeth; and the sheep hear his voice: and he calleth his own sheep by name, and leadeth them out.", "r": "John 10:3", "theme": "scripture"}, {"t": "And when he putteth forth his own sheep, he goeth before them, and the sheep follow him: for they know his voice.", "r": "John 10:4", "theme": "scripture"}, {"t": "For as many as are led by the Spirit of God, they are the sons of God.", "r": "Romans 8:14", "theme": "scripture"}, {"t": "The integrity of the upright shall guide them: but the perverseness of transgressors shall destroy them.", "r": "Proverbs 11:3", "theme": "scripture"}, {"t": "He shall feed his flock like a shepherd: he shall gather the lambs with his arm, and carry them in his bosom, and shall gently lead those that are with young.", "r": "Isaiah 40:11", "theme": "scripture"}, {"t": "But made his own people to go forth like sheep, and guided them in the wilderness like a flock.", "r": "Psalm 78:52", "theme": "scripture"}, {"t": "Wilt thou not from this time cry unto me, My father, thou art the guide of my youth?", "r": "Jeremiah 3:4", "theme": "scripture"}, {"t": "Moreover thou leddest them in the day by a cloudy pillar; and in the night by a pillar of fire, to give them light in the way wherein they should go.", "r": "Nehemiah 9:12", "theme": "scripture"}, {"t": "But if ye be led of the Spirit, ye are not under the law.", "r": "Galatians 5:18", "theme": "scripture"}, {"t": "So he fed them according to the integrity of his heart; and guided them by the skilfulness of his hands.", "r": "Psalm 78:72", "theme": "scripture"}, {"t": "Lead me, O LORD, in thy righteousness because of mine enemies; make thy way straight before my face.", "r": "Psalm 5:8", "theme": "scripture"}, {"t": "Lead me in thy truth, and teach me: for thou art the God of my salvation; on thee do I wait all the day.", "r": "Psalm 25:5", "theme": "scripture"}, {"t": "Teach me thy way, O LORD, and lead me in a plain path, because of mine enemies.", "r": "Psalm 27:11", "theme": "scripture"}, {"t": "Why art thou cast down, O my soul? and why art thou disquieted within me? hope thou in God: for I shall yet praise him, who is the health of my countenance, and my God.", "r": "Psalm 42:11", "theme": "scripture"}, {"t": "Why art thou cast down, O my soul? and why art thou disquieted within me? hope in God: for I shall yet praise him, who is the health of my countenance, and my God.", "r": "Psalm 43:5", "theme": "scripture"}, {"t": "Let Israel hope in the LORD: for with the LORD there is mercy, and with him is plenteous redemption.", "r": "Psalm 130:7", "theme": "scripture"}, {"t": "The LORD taketh pleasure in them that fear him, in those that hope in his mercy.", "r": "Psalm 147:11", "theme": "scripture"}, {"t": "For surely there is an end; and thine expectation shall not be cut off.", "r": "Proverbs 23:18", "theme": "scripture"}, {"t": "The LORD is my portion, saith my soul; therefore will I hope in him.", "r": "Lamentations 3:24", "theme": "scripture"}, {"t": "It is good that a man should both hope and quietly wait for the salvation of the LORD.", "r": "Lamentations 3:26", "theme": "scripture"}, {"t": "For we are saved by hope: but hope that is seen is not hope: for what a man seeth, why doth he yet hope for?", "r": "Romans 8:24", "theme": "scripture"}, {"t": "But if we hope for that we see not, then do we with patience wait for it.", "r": "Romans 8:25", "theme": "scripture"}, {"t": "Rejoicing in hope; patient in tribulation; continuing instant in prayer;", "r": "Romans 12:12", "theme": "scripture"}, {"t": "To whom God would make known what is the riches of the glory of this mystery among the Gentiles; which is Christ in you, the hope of glory:", "r": "Colossians 1:27", "theme": "scripture"}, {"t": "But let us, who are of the day, be sober, putting on the breastplate of faith and love; and for an helmet, the hope of salvation.", "r": "1 Thessalonians 5:8", "theme": "scripture"}, {"t": "In hope of eternal life, which God, that cannot lie, promised before the world began;", "r": "Titus 1:2", "theme": "scripture"}, {"t": "Looking for that blessed hope, and the glorious appearing of the great God and our Saviour Jesus Christ;", "r": "Titus 2:13", "theme": "scripture"}, {"t": "Which hope we have as an anchor of the soul, both sure and stedfast, and which entereth into that within the veil;", "r": "Hebrews 6:19", "theme": "scripture"}, {"t": "Blessed be the God and Father of our Lord Jesus Christ, which according to his abundant mercy hath begotten us again unto a lively hope by the resurrection of Jesus Christ from the dead,", "r": "1 Peter 1:3", "theme": "scripture"}, {"t": "Behold, the eye of the LORD is upon them that fear him, upon them that hope in his mercy;", "r": "Psalm 33:18", "theme": "scripture"}, {"t": "Let thy mercy, O LORD, be upon us, according as we hope in thee.", "r": "Psalm 33:22", "theme": "scripture"}, {"t": "But I will hope continually, and will yet praise thee more and more.", "r": "Psalm 71:14", "theme": "scripture"}, {"t": "Happy is he that hath the God of Jacob for his help, whose hope is in the LORD his God:", "r": "Psalm 146:5", "theme": "scripture"}, {"t": "Blessed is the man that trusteth in the LORD, and whose hope the LORD is.", "r": "Jeremiah 17:7", "theme": "scripture"}, {"t": "Thou art my hiding place and my shield: I hope in thy word.", "r": "Psalm 119:114", "theme": "scripture"}, {"t": "And now abideth faith, hope, charity, these three; but the greatest of these is charity.", "r": "1 Corinthians 13:13", "theme": "scripture"}, {"t": "Now our Lord Jesus Christ himself, and God, even our Father, which hath loved us, and hath given us everlasting consolation and good hope through grace,", "r": "2 Thessalonians 2:16", "theme": "scripture"}, {"t": "Be patient therefore, brethren, unto the coming of the Lord. Behold, the husbandman waiteth for the precious fruit of the earth, and hath long patience for it, until he receive the early and latter rain.", "r": "James 5:7", "theme": "scripture"}, {"t": "Be ye also patient; stablish your hearts: for the coming of the Lord draweth nigh.", "r": "James 5:8", "theme": "scripture"}, {"t": "Take, my brethren, the prophets, who have spoken in the name of the Lord, for an example of suffering affliction, and of patience.", "r": "James 5:10", "theme": "scripture"}, {"t": "Knowing this, that the trying of your faith worketh patience.", "r": "James 1:3", "theme": "scripture"}, {"t": "But let patience have her perfect work, that ye may be perfect and entire, wanting nothing.", "r": "James 1:4", "theme": "scripture"}, {"t": "And patience, experience; and experience, hope:", "r": "Romans 5:4", "theme": "scripture"}, {"t": "For whatsoever things were written aforetime were written for our learning, that we through patience and comfort of the scriptures might have hope.", "r": "Romans 15:4", "theme": "scripture"}, {"t": "Now the God of patience and consolation grant you to be likeminded one toward another according to Christ Jesus:", "r": "Romans 15:5", "theme": "scripture"}, {"t": "That ye be not slothful, but followers of them who through faith and patience inherit the promises.", "r": "Hebrews 6:12", "theme": "scripture"}, {"t": "For ye have need of patience, that, after ye have done the will of God, ye might receive the promise.", "r": "Hebrews 10:36", "theme": "scripture"}, {"t": "But that on the good ground are they, which in an honest and good heart, having heard the word, keep it, and bring forth fruit with patience.", "r": "Luke 8:15", "theme": "scripture"}, {"t": "In your patience possess ye your souls.", "r": "Luke 21:19", "theme": "scripture"}, {"t": "Because thou hast kept the word of my patience, I also will keep thee from the hour of temptation, which shall come upon all the world, to try them that dwell upon the earth.", "r": "Revelation 3:10", "theme": "scripture"}, {"t": "If we suffer, we shall also reign with him: if we deny him, he also will deny us:", "r": "2 Timothy 2:12", "theme": "scripture"}, {"t": "Better is the end of a thing than the beginning thereof: and the patient in spirit is better than the proud in spirit.", "r": "Ecclesiastes 7:8", "theme": "scripture"}, {"t": "He that is slow to anger is better than the mighty; and he that ruleth his spirit than he that taketh a city.", "r": "Proverbs 16:32", "theme": "scripture"}, {"t": "Rest in the LORD, and wait patiently for him: fret not thyself because of him who prospereth in his way, because of the man who bringeth wicked devices to pass.", "r": "Psalm 37:7", "theme": "scripture"}, {"t": "To the chief Musician, A Psalm of David. I waited patiently for the LORD; and he inclined unto me, and heard my cry.", "r": "Psalm 40:1", "theme": "scripture"}, {"t": "And therefore will the LORD wait, that he may be gracious unto you, and therefore will he be exalted, that he may have mercy upon you: for the LORD is a God of judgment: blessed are all they that wait for him.", "r": "Isaiah 30:18", "theme": "scripture"}, {"t": "He that is slow to wrath is of great understanding: but he that is hasty of spirit exalteth folly.", "r": "Proverbs 14:29", "theme": "scripture"}, {"t": "With all lowliness and meekness, with longsuffering, forbearing one another in love;", "r": "Ephesians 4:2", "theme": "scripture"}, {"t": "And I will restore to you the years that the locust hath eaten, the cankerworm, and the caterpiller, and the palmerworm, my great army which I sent among you.", "r": "Joel 2:25", "theme": "scripture"}, {"t": "And they shall build the old wastes, they shall raise up the former desolations, and they shall repair the waste cities, the desolations of many generations.", "r": "Isaiah 61:4", "theme": "scripture"}, {"t": "For your shame ye shall have double; and for confusion they shall rejoice in their portion: therefore in their land they shall possess the double: everlasting joy shall be unto them.", "r": "Isaiah 61:7", "theme": "scripture"}, {"t": "And I will be found of you, saith the LORD: and I will turn away your captivity, and I will gather you from all the nations, and from all the places whither I have driven you, saith the LORD; and I will bring you again into the place whence I caused you to be carried away captive.", "r": "Jeremiah 29:14", "theme": "scripture"}, {"t": "For, lo, the days come, saith the LORD, that I will bring again the captivity of my people Israel and Judah, saith the LORD: and I will cause them to return to the land that I gave to their fathers, and they shall possess it.", "r": "Jeremiah 30:3", "theme": "scripture"}, {"t": "Again I will build thee, and thou shalt be built, O virgin of Israel: thou shalt again be adorned with thy tabrets, and shalt go forth in the dances of them that make merry.", "r": "Jeremiah 31:4", "theme": "scripture"}, {"t": "And I will cause the captivity of Judah and the captivity of Israel to return, and will build them, as at the first.", "r": "Jeremiah 33:7", "theme": "scripture"}, {"t": "And shall put my spirit in you, and ye shall live, and I shall place you in your own land: then shall ye know that I the LORD have spoken it, and performed it, saith the LORD.", "r": "Ezekiel 37:14", "theme": "scripture"}, {"t": "And I will bring again the captivity of my people of Israel, and they shall build the waste cities, and inhabit them; and they shall plant vineyards, and drink the wine thereof; they shall also make gardens, and eat the fruit of them.", "r": "Amos 9:14", "theme": "scripture"}, {"t": "At that time will I bring you again, even in the time that I gather you: for I will make you a name and a praise among all people of the earth, when I turn back your captivity before your eyes, saith the LORD.", "r": "Zephaniah 3:20", "theme": "scripture"}, {"t": "Turn you to the strong hold, ye prisoners of hope: even to day do I declare that I will render double unto thee;", "r": "Zechariah 9:12", "theme": "scripture"}, {"t": "And the LORD turned the captivity of Job, when he prayed for his friends: also the LORD gave Job twice as much as he had before.", "r": "Job 42:10", "theme": "scripture"}, {"t": "Brethren, if a man be overtaken in a fault, ye which are spiritual, restore such an one in the spirit of meekness; considering thyself, lest thou also be tempted.", "r": "Galatians 6:1", "theme": "scripture"}, {"t": "Behold, I will do a new thing; now it shall spring forth; shall ye not know it? I will even make a way in the wilderness, and rivers in the desert.", "r": "Isaiah 43:19", "theme": "scripture"}, {"t": "Whom the heaven must receive until the times of restitution of all things, which God hath spoken by the mouth of all his holy prophets since the world began.", "r": "Acts 3:21", "theme": "scripture"}, {"t": "That then the LORD thy God will turn thy captivity, and have compassion upon thee, and will return and gather thee from all the nations, whither the LORD thy God hath scattered thee.", "r": "Deuteronomy 30:3", "theme": "scripture"}, {"t": "A Song of degrees. When the LORD turned again the captivity of Zion, we were like them that dream.", "r": "Psalm 126:1", "theme": "scripture"}, {"t": "Turn thou us unto thee, O LORD, and we shall be turned; renew our days as of old.", "r": "Lamentations 5:21", "theme": "scripture"}, {"t": "Behold, I will gather them out of all countries, whither I have driven them in mine anger, and in my fury, and in great wrath; and I will bring them again unto this place, and I will cause them to dwell safely:", "r": "Jeremiah 32:37", "theme": "scripture"}, {"t": "Thus saith the LORD, In an acceptable time have I heard thee, and in a day of salvation have I helped thee: and I will preserve thee, and give thee for a covenant of the people, to establish the earth, to cause to inherit the desolate heritages;", "r": "Isaiah 49:8", "theme": "scripture"}, {"t": "When I shall bring again their captivity, the captivity of Sodom and her daughters, and the captivity of Samaria and her daughters, then will I bring again the captivity of thy captives in the midst of them:", "r": "Ezekiel 16:53", "theme": "scripture"}, {"t": "Thou, which hast shewed me great and sore troubles, shalt quicken me again, and shalt bring me up again from the depths of the earth.", "r": "Psalm 71:20", "theme": "scripture"}, {"t": "Finally, my brethren, be strong in the Lord, and in the power of his might.", "r": "Ephesians 6:10", "theme": "scripture"}, {"t": "My flesh and my heart faileth: but God is the strength of my heart, and my portion for ever.", "r": "Psalm 73:26", "theme": "scripture"}, {"t": "The LORD God is my strength, and he will make my feet like hinds' feet, and he will make me to walk upon mine high places. To the chief singer on my stringed instruments.", "r": "Habakkuk 3:19", "theme": "scripture"}, {"t": "Seek the LORD and his strength, seek his face continually.", "r": "1 Chronicles 16:11", "theme": "scripture"}, {"t": "For the eyes of the LORD run to and fro throughout the whole earth, to shew himself strong in the behalf of them whose heart is perfect toward him. Herein thou hast done foolishly: therefore from henceforth thou shalt have wars.", "r": "2 Chronicles 16:9", "theme": "scripture"}, {"t": "The LORD is my strength and song, and he is become my salvation: he is my God, and I will prepare him an habitation; my father's God, and I will exalt him.", "r": "Exodus 15:2", "theme": "scripture"}, {"t": "Thy shoes shall be iron and brass; and as thy days, so shall thy strength be.", "r": "Deuteronomy 33:25", "theme": "scripture"}, {"t": "Behold, God is my salvation; I will trust, and not be afraid: for the LORD JEHOVAH is my strength and my song; he also is become my salvation.", "r": "Isaiah 12:2", "theme": "scripture"}, {"t": "Trust ye in the LORD for ever: for in the LORD JEHOVAH is everlasting strength:", "r": "Isaiah 26:4", "theme": "scripture"}, {"t": "For thus saith the Lord GOD, the Holy One of Israel; In returning and rest shall ye be saved; in quietness and in confidence shall be your strength: and ye would not.", "r": "Isaiah 30:15", "theme": "scripture"}, {"t": "And such as do wickedly against the covenant shall he corrupt by flatteries: but the people that do know their God shall be strong, and do exploits.", "r": "Daniel 11:32", "theme": "scripture"}, {"t": "Beat your plowshares into swords, and your pruninghooks into spears: let the weak say, I am strong.", "r": "Joel 3:10", "theme": "scripture"}, {"t": "The LORD is my strength and song, and is become my salvation.", "r": "Psalm 118:14", "theme": "scripture"}, {"t": "That he would grant you, according to the riches of his glory, to be strengthened with might by his Spirit in the inner man;", "r": "Ephesians 3:16", "theme": "scripture"}, {"t": "Strengthened with all might, according to his glorious power, unto all patience and longsuffering with joyfulness;", "r": "Colossians 1:11", "theme": "scripture"}, {"t": "Notwithstanding the Lord stood with me, and strengthened me; that by me the preaching might be fully known, and that all the Gentiles might hear: and I was delivered out of the mouth of the lion.", "r": "2 Timothy 4:17", "theme": "scripture"}, {"t": "Strengthen ye the weak hands, and confirm the feeble knees.", "r": "Isaiah 35:3", "theme": "scripture"}, {"t": "In the day when I cried thou answeredst me, and strengthenedst me with strength in my soul.", "r": "Psalm 138:3", "theme": "scripture"}, {"t": "Both riches and honour come of thee, and thou reignest over all; and in thine hand is power and might; and in thine hand it is to make great, and to give strength unto all.", "r": "1 Chronicles 29:12", "theme": "scripture"}, {"t": "It is God that girdeth me with strength, and maketh my way perfect.", "r": "Psalm 18:32", "theme": "scripture"}, {"t": "Nay, in all these things we are more than conquerors through him that loved us.", "r": "Romans 8:37", "theme": "scripture"}, {"t": "But thanks be to God, which giveth us the victory through our Lord Jesus Christ.", "r": "1 Corinthians 15:57", "theme": "scripture"}, {"t": "Now thanks be unto God, which always causeth us to triumph in Christ, and maketh manifest the savour of his knowledge by us in every place.", "r": "2 Corinthians 2:14", "theme": "scripture"}, {"t": "And they overcame him by the blood of the Lamb, and by the word of their testimony; and they loved not their lives unto the death.", "r": "Revelation 12:11", "theme": "scripture"}, {"t": "To him that overcometh will I grant to sit with me in my throne, even as I also overcame, and am set down with my Father in his throne.", "r": "Revelation 3:21", "theme": "scripture"}, {"t": "He that hath an ear, let him hear what the Spirit saith unto the churches; To him that overcometh will I give to eat of the tree of life, which is in the midst of the paradise of God.", "r": "Revelation 2:7", "theme": "scripture"}, {"t": "Ye shall not need to fight in this battle: set yourselves, stand ye still, and see the salvation of the LORD with you, O Judah and Jerusalem: fear not, nor be dismayed; to morrow go out against them: for the LORD will be with you.", "r": "2 Chronicles 20:17", "theme": "scripture"}, {"t": "And all this assembly shall know that the LORD saveth not with sword and spear: for the battle is the LORD'S, and he will give you into our hands.", "r": "1 Samuel 17:47", "theme": "scripture"}, {"t": "Through God we shall do valiantly: for he it is that shall tread down our enemies.", "r": "Psalm 60:12", "theme": "scripture"}, {"t": "The horse is prepared against the day of battle: but safety is of the LORD.", "r": "Proverbs 21:31", "theme": "scripture"}, {"t": "And they shall fight against thee; but they shall not prevail against thee; for I am with thee, saith the LORD, to deliver thee.", "r": "Jeremiah 1:19", "theme": "scripture"}, {"t": "There hath no temptation taken you but such as is common to man: but God is faithful, who will not suffer you to be tempted above that ye are able; but will with the temptation also make a way to escape, that ye may be able to bear it.", "r": "1 Corinthians 10:13", "theme": "scripture"}, {"t": "Wherefore take unto you the whole armour of God, that ye may be able to withstand in the evil day, and having done all, to stand.", "r": "Ephesians 6:13", "theme": "scripture"}, {"t": "I write unto you, fathers, because ye have known him that is from the beginning. I write unto you, young men, because ye have overcome the wicked one. I write unto you, little children, because ye have known the Father.", "r": "1 John 2:13", "theme": "scripture"}, {"t": "Ye shall not fear them: for the LORD your God he shall fight for you.", "r": "Deuteronomy 3:22", "theme": "scripture"}, {"t": "In what place therefore ye hear the sound of the trumpet, resort ye thither unto us: our God shall fight for us.", "r": "Nehemiah 4:20", "theme": "scripture"}, {"t": "Some trust in chariots, and some in horses: but we will remember the name of the LORD our God.", "r": "Psalm 20:7", "theme": "scripture"}, {"t": "The voice of rejoicing and salvation is in the tabernacles of the righteous: the right hand of the LORD doeth valiantly.", "r": "Psalm 118:15", "theme": "scripture"}, {"t": "Through God we shall do valiantly: for he it is that shall tread down our enemies.", "r": "Psalm 108:13", "theme": "scripture"}, {"t": "And they shall be as mighty men, which tread down their enemies in the mire of the streets in the battle: and they shall fight, because the LORD is with them, and the riders on horses shall be confounded.", "r": "Zechariah 10:5", "theme": "scripture"}, {"t": "I have written unto you, fathers, because ye have known him that is from the beginning. I have written unto you, young men, because ye are strong, and the word of God abideth in you, and ye have overcome the wicked one.", "r": "1 John 2:14", "theme": "scripture"}, {"t": "He that overcometh shall inherit all things; and I will be his God, and he shall be my son.", "r": "Revelation 21:7", "theme": "scripture"}, {"t": "Therefore shall a man leave his father and his mother, and shall cleave unto his wife: and they shall be one flesh.", "r": "Genesis 2:24", "theme": "scripture"}, {"t": "Unto the woman he said, I will greatly multiply thy sorrow and thy conception; in sorrow thou shalt bring forth children; and thy desire shall be to thy husband, and he shall rule over thee.", "r": "Genesis 3:16", "theme": "scripture"}, {"t": "There were giants in the earth in those days; and also after that, when the sons of God came in unto the daughters of men, and they bare children to them, the same became mighty men which were of old, men of renown.", "r": "Genesis 6:4", "theme": "scripture"}, {"t": "Now these are the names of the children of Israel, which came into Egypt; every man and his household came with Jacob.", "r": "Exodus 1:1", "theme": "scripture"}, {"t": "Now the priest of Midian had seven daughters: and they came and drew water, and filled the troughs to water their father's flock.", "r": "Exodus 2:16", "theme": "scripture"}, {"t": "Now Moses kept the flock of Jethro his father in law, the priest of Midian: and he led the flock to the backside of the desert, and came to the mountain of God, even to Horeb.", "r": "Exodus 3:1", "theme": "scripture"}, {"t": "Speak unto the children of Israel, and say unto them, If any man of you bring an offering unto the LORD, ye shall bring your offering of the cattle, even of the herd, and of the flock.", "r": "Leviticus 1:2", "theme": "scripture"}, {"t": "Speak unto the children of Israel, saying, If a soul shall sin through ignorance against any of the commandments of the LORD concerning things which ought not to be done, and shall do against any of them:", "r": "Leviticus 4:2", "theme": "scripture"}, {"t": "If a soul sin, and commit a trespass against the LORD, and lie unto his neighbour in that which was delivered him to keep, or in fellowship, or in a thing taken away by violence, or hath deceived his neighbour;", "r": "Leviticus 6:2", "theme": "scripture"}, {"t": "Take ye the sum of all the congregation of the children of Israel, after their families, by the house of their fathers, with the number of their names, every male by their polls;", "r": "Numbers 1:2", "theme": "scripture"}, {"t": "Every man of the children of Israel shall pitch by his own standard, with the ensign of their father's house: far off about the tabernacle of the congregation shall they pitch.", "r": "Numbers 2:2", "theme": "scripture"}, {"t": "Number the children of Levi after the house of their fathers, by their families: every male from a month old and upward shalt thou number them.", "r": "Numbers 3:15", "theme": "scripture"}, {"t": "Behold, I have set the land before you: go in and possess the land which the LORD sware unto your fathers, Abraham, Isaac, and Jacob, to
