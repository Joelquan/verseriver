give unto them and to their seed after them.", "r": "Deuteronomy 1:8", "theme": "scripture"}, {"t": "(As the children of Esau which dwell in Seir, and the Moabites which dwell in Ar, did unto me;) until I shall pass over Jordan into the land which the LORD our God giveth us.", "r": "Deuteronomy 2:29", "theme": "scripture"}, {"t": "O Lord GOD, thou hast begun to shew thy servant thy greatness, and thy mighty hand: for what God is there in heaven or in earth, that can do according to thy works, and according to thy might?", "r": "Deuteronomy 3:24", "theme": "scripture"}, {"t": "Moses my servant is dead; now therefore arise, go over this Jordan, thou, and all this people, unto the land which I do give to them, even to the children of Israel.", "r": "Joshua 1:2", "theme": "scripture"}, {"t": "Now therefore, I pray you, swear unto me by the LORD, since I have shewed you kindness, that ye will also shew kindness unto my father's house, and give me a true token:", "r": "Joshua 2:12", "theme": "scripture"}, {"t": "At that time the LORD said unto Joshua, Make thee sharp knives, and circumcise again the children of Israel the second time.", "r": "Joshua 5:2", "theme": "scripture"}, {"t": "Now after the death of Joshua it came to pass, that the children of Israel asked the LORD, saying, Who shall go up for us against the Canaanites first, to fight against them?", "r": "Judges 1:1", "theme": "scripture"}, {"t": "Therefore the LORD left those nations, without driving them out hastily; neither delivered he them into the hand of Joshua.", "r": "Judges 2:23", "theme": "scripture"}, {"t": "Only that the generations of the children of Israel might know, to teach them war, at the least such as before knew nothing thereof;", "r": "Judges 3:2", "theme": "scripture"}, {"t": "Now it came to pass in the days when the judges ruled, that there was a famine in the land. And a certain man of Bethlehemjudah went to sojourn in the country of Moab, he, and his wife, and his two sons.", "r": "Ruth 1:1", "theme": "scripture"}, {"t": "Moreover Ruth the Moabitess, the wife of Mahlon, have I purchased to be my wife, to raise up the name of the dead upon his inheritance, that the name of the dead be not cut off from among his brethren, and from the gate of his place: ye are witnesses this day.", "r": "Ruth 4:10", "theme": "scripture"}, {"t": "Count not thine handmaid for a daughter of Belial: for out of the abundance of my complaint and grief have I spoken hitherto.", "r": "1 Samuel 1:16", "theme": "scripture"}, {"t": "Talk no more so exceeding proudly; let not arrogancy come out of your mouth: for the LORD is a God of knowledge, and by him actions are weighed.", "r": "1 Samuel 2:3", "theme": "scripture"}, {"t": "Woe unto us! who shall deliver us out of the hand of these mighty Gods? these are the Gods that smote the Egyptians with all the plagues in the wilderness.", "r": "1 Samuel 4:8", "theme": "scripture"}, {"t": "He said unto me again, Stand, I pray thee, upon me, and slay me: for anguish is come upon me, because my life is yet whole in me.", "r": "2 Samuel 1:9", "theme": "scripture"}, {"t": "Therefore now let your hands be strengthened, and be ye valiant: for your master Saul is dead, and also the house of Judah have anointed me king over them.", "r": "2 Samuel 2:7", "theme": "scripture"}, {"t": "Now there was long war between the house of Saul and the house of David: but David waxed stronger and stronger, and the house of Saul waxed weaker and weaker.", "r": "2 Samuel 3:1", "theme": "scripture"}, {"t": "Wherefore Nathan spake unto Bathsheba the mother of Solomon, saying, Hast thou not heard that Adonijah the son of Haggith doth reign, and David our lord knoweth it not?", "r": "1 Kings 1:11", "theme": "scripture"}, {"t": "I go the way of all the earth: be thou strong therefore, and shew thyself a man;", "r": "1 Kings 2:2", "theme": "scripture"}, {"t": "Give therefore thy servant an understanding heart to judge thy people, that I may discern between good and bad: for who is able to judge this thy so great a people?", "r": "1 Kings 3:9", "theme": "scripture"}, {"t": "Let us make a little chamber, I pray thee, on the wall; and let us set for him there a bed, and a table, and a stool, and a candlestick: and it shall be, when he cometh to us, that he shall turn in thither.", "r": "2 Kings 4:10", "theme": "scripture"}, {"t": "Now Naaman, captain of the host of the king of Syria, was a great man with his master, and honourable, because by him the LORD had given deliverance unto Syria: he was also a mighty man in valour, but he was a leper.", "r": "2 Kings 5:1", "theme": "scripture"}, {"t": "Let us go, we pray thee, unto Jordan, and take thence every man a beam, and let us make us a place there, where we may dwell. And he answered, Go ye.", "r": "2 Kings 6:2", "theme": "scripture"}, {"t": "Now these are the kings that reigned in the land of Edom before any king reigned over the children of Israel; Bela the son of Beor: and the name of his city was Dinhabah.", "r": "1 Chronicles 1:43", "theme": "scripture"}, {"t": "Jerahmeel had also another wife, whose name was Atarah; she was the mother of Onam.", "r": "1 Chronicles 2:26", "theme": "scripture"}, {"t": "The third, Absalom the son of Maachah the daughter of Talmai king of Geshur: the fourth, Adonijah the son of Haggith:", "r": "1 Chronicles 3:2", "theme": "scripture"}, {"t": "Now, O LORD God, let thy promise unto David my father be established: for thou hast made me king over a people like the dust of the earth in multitude.", "r": "2 Chronicles 1:9", "theme": "scripture"}, {"t": "Even to prepare me timber in abundance: for the house which I am about to build shall be wonderful great.", "r": "2 Chronicles 2:9", "theme": "scripture"}, {"t": "The pots also, and the shovels, and the fleshhooks, and all their instruments, did Huram his father make to king Solomon for the house of the LORD of bright brass.", "r": "2 Chronicles 4:16", "theme": "scripture"}, {"t": "The children of Pahathmoab, of the children of Jeshua and Joab, two thousand eight hundred and twelve.", "r": "Ezra 2:6", "theme": "scripture"}, {"t": "Now when the adversaries of Judah and Benjamin heard that the children of the captivity builded the temple unto the LORD God of Israel;", "r": "Ezra 4:1", "theme": "scripture"}, {"t": "Now these are thy servants and thy people, whom thou hast redeemed by thy great power, and by thy strong hand.", "r": "Nehemiah 1:10", "theme": "scripture"}, {"t": "After him repaired Nehemiah the son of Azbuk, the ruler of the half part of Bethzur, unto the place over against the sepulchres of David, and to the pool that was made, and unto the house of the mighty.", "r": "Nehemiah 3:16", "theme": "scripture"}, {"t": "Nevertheless we made our prayer unto our God, and set a watch against them day and night, because of them.", "r": "Nehemiah 4:9", "theme": "scripture"}, {"t": "Nevertheless Haman refrained himself: and when he came home, he sent and called for his friends, and Zeresh his wife.", "r": "Esther 5:10", "theme": "scripture"}, {"t": "On the thirteenth day of the month Adar; and on the fourteenth day of the same rested they, and made it a day of feasting and gladness.", "r": "Esther 9:17", "theme": "scripture"}, {"t": "His substance also was seven thousand sheep, and three thousand camels, and five hundred yoke of oxen, and five hundred she asses, and a very great household; so that this man was the greatest of all the men of the east.", "r": "Job 1:3", "theme": "scripture"}, {"t": "Because it shut not up the doors of my mother's womb, nor hid sorrow from mine eyes.", "r": "Job 3:10", "theme": "scripture"}, {"t": "Thy words have upholden him that was falling, and thou hast strengthened the feeble knees.", "r": "Job 4:4", "theme": "scripture"}, {"t": "Kiss the Son, lest he be angry, and ye perish from the way, when his wrath is kindled but a little. Blessed are all they that put their trust in him.", "r": "Psalm 2:12", "theme": "scripture"}, {"t": "To the chief Musician on Neginoth, A Psalm of David. Hear me when I call, O God of my righteousness: thou hast enlarged me when I was in distress; have mercy upon me, and hear my prayer.", "r": "Psalm 4:1", "theme": "scripture"}, {"t": "Hearken unto the voice of my cry, my King, and my God: for unto thee will I pray.", "r": "Psalm 5:2", "theme": "scripture"}, {"t": "A wise man will hear, and will increase learning; and a man of understanding shall attain unto wise counsels:", "r": "Proverbs 1:5", "theme": "scripture"}, {"t": "Yea, if thou criest after knowledge, and liftest up thy voice for understanding;", "r": "Proverbs 2:3", "theme": "scripture"}, {"t": "The LORD by wisdom hath founded the earth; by understanding hath he established the heavens.", "r": "Proverbs 3:19", "theme": "scripture"}, {"t": "All things are full of labour; man cannot utter it: the eye is not satisfied with seeing, nor the ear filled with hearing.", "r": "Ecclesiastes 1:8", "theme": "scripture"}, {"t": "The wise man's eyes are in his head; but the fool walketh in darkness: and I myself perceived also that one event happeneth to them all.", "r": "Ecclesiastes 2:14", "theme": "scripture"}, {"t": "Because of the savour of thy good ointments thy name is as ointment poured forth, therefore do the virgins love thee.", "r": "Song of Solomon 1:3", "theme": "scripture"}, {"t": "I charge you, O ye daughters of Jerusalem, by the roes, and by the hinds of the field, that ye stir not up, nor awake my love, till he please.", "r": "Song of Solomon 2:7", "theme": "scripture"}, {"t": "Hear, O heavens, and give ear, O earth: for the LORD hath spoken, I have nourished and brought up children, and they have rebelled against me.", "r": "Isaiah 1:2", "theme": "scripture"}, {"t": "Therefore thou hast forsaken thy people the house of Jacob, because they be replenished from the east, and are soothsayers like the Philistines, and they please themselves in the children of strangers.", "r": "Isaiah 2:6", "theme": "scripture"}, {"t": "In that day shall he swear, saying, I will not be an healer; for in my house is neither bread nor clothing: make me not a ruler of the people.", "r": "Isaiah 3:7", "theme": "scripture"}, {"t": "Be not afraid of their faces: for I am with thee to deliver thee, saith the LORD.", "r": "Jeremiah 1:8", "theme": "scripture"}, {"t": "Go and cry in the ears of Jerusalem, saying, Thus saith the LORD; I remember thee, the kindness of thy youth, the love of thine espousals, when thou wentest after me in the wilderness, in a land that was not sown.", "r": "Jeremiah 2:2", "theme": "scripture"}, {"t": "Turn, O backsliding children, saith the LORD; for I am married unto you: and I will take you one of a city, and two of a family, and I will bring you to Zion:", "r": "Jeremiah 3:14", "theme": "scripture"}, {"t": "She weepeth sore in the night, and her tears are on her cheeks: among all her lovers she hath none to comfort her: all her friends have dealt treacherously with her, they are become her enemies.", "r": "Lamentations 1:2", "theme": "scripture"}, {"t": "How hath the Lord covered the daughter of Zion with a cloud in his anger, and cast down from heaven unto the earth the beauty of Israel, and remembered not his footstool in the day of his anger!", "r": "Lamentations 2:1", "theme": "scripture"}, {"t": "Behold, I have made thy face strong against their faces, and thy forehead strong against their foreheads.", "r": "Ezekiel 3:8", "theme": "scripture"}, {"t": "Therefore the fathers shall eat the sons in the midst of thee, and the sons shall eat their fathers; and I will execute judgments in thee, and the whole remnant of thee will I scatter into all the winds.", "r": "Ezekiel 5:10", "theme": "scripture"}, {"t": "The time is come, the day draweth near: let not the buyer rejoice, nor the seller mourn: for wrath is upon all the multitude thereof.", "r": "Ezekiel 7:12", "theme": "scripture"}, {"t": "Now among these were of the children of Judah, Daniel, Hananiah, Mishael, and Azariah:", "r": "Daniel 1:6", "theme": "scripture"}, {"t": "Daniel answered and said, Blessed be the name of God for ever and ever: for wisdom and might are his:", "r": "Daniel 2:20", "theme": "scripture"}, {"t": "The beginning of the word of the LORD by Hosea. And the LORD said to Hosea, Go, take unto thee a wife of whoredoms and children of whoredoms: for the land hath committed great whoredom, departing from the LORD.", "r": "Hosea 1:2", "theme": "scripture"}, {"t": "Plead with your mother, plead: for she is not my wife, neither am I her husband: let her therefore put away her whoredoms out of her sight, and her adulteries from between her breasts;", "r": "Hosea 2:2", "theme": "scripture"}, {"t": "Afterward shall the children of Israel return, and seek the LORD their God, and David their king; and shall fear the LORD and his goodness in the latter days.", "r": "Hosea 3:5", "theme": "scripture"}, {"t": "Hear this, ye old men, and give ear, all ye inhabitants of the land. Hath this been in your days, or even in the days of your fathers?", "r": "Joel 1:2", "theme": "scripture"}, {"t": "Like the noise of chariots on the tops of mountains shall they leap, like the noise of a flame of fire that devoureth the stubble, as a strong people set in battle array.", "r": "Joel 2:5", "theme": "scripture"}, {"t": "Thus saith the LORD; For three transgressions of Gaza, and for four, I will not turn away the punishment thereof; because they carried away captive the whole captivity, to deliver them up to Edom:", "r": "Amos 1:6", "theme": "scripture"}, {"t": "Therefore the flight shall perish from the swift, and the strong shall not strengthen his force, neither shall the mighty deliver himself:", "r": "Amos 2:14", "theme": "scripture"}, {"t": "Shall I not in that day, saith the LORD, even destroy the wise men out of Edom, and understanding out of the mount of Esau?", "r": "Obadiah 1:8", "theme": "scripture"}, {"t": "Neither shouldest thou have stood in the crossway, to cut off those of his that did escape; neither shouldest thou have delivered up those of his that did remain in the day of distress.", "r": "Obadiah 1:14", "theme": "scripture"}, {"t": "O thou inhabitant of Lachish, bind the chariot to the swift beast: she is the beginning of the sin to the daughter of Zion: for the transgressions of Israel were found in thee.", "r": "Micah 1:13", "theme": "scripture"}, {"t": "The women of my people have ye cast out from their pleasant houses; from their children have ye taken away my glory for ever.", "r": "Micah 2:9", "theme": "scripture"}, {"t": "Behold upon the mountains the feet of him that bringeth good tidings, that publisheth peace! O Judah, keep thy solemn feasts, perform thy vows: for the wicked shall no more pass through thee; he is utterly cut off.", "r": "Nahum 1:15", "theme": "scripture"}, {"t": "He that dasheth in pieces is come up before thy face: keep the munition, watch the way, make thy loins strong, fortify thy power mightily.", "r": "Nahum 2:1", "theme": "scripture"}, {"t": "Behold ye among the heathen, and regard, and wonder marvellously: for I will work a work in your days, which ye will not believe, though it be told you.", "r": "Habakkuk 1:5", "theme": "scripture"}, {"t": "Woe to him that coveteth an evil covetousness to his house, that he may set his nest on high, that he may be delivered from the power of evil!", "r": "Habakkuk 2:9", "theme": "scripture"}, {"t": "Hold thy peace at the presence of the Lord GOD: for the day of the LORD is at hand: for the LORD hath prepared a sacrifice, he hath bid his guests.", "r": "Zephaniah 1:7", "theme": "scripture"}, {"t": "I have heard the reproach of Moab, and the revilings of the children of Ammon, whereby they have reproached my people, and magnified themselves against their border.", "r": "Zephaniah 2:8", "theme": "scripture"}, {"t": "I smote you with blasting and with mildew and with hail in all the labours of your hands; yet ye turned not to me, saith the LORD.", "r": "Haggai 2:17", "theme": "scripture"}, {"t": "Cry yet, saying, Thus saith the LORD of hosts; My cities through prosperity shall yet be spread abroad; and the LORD shall yet comfort Zion, and shall yet choose Jerusalem.", "r": "Zechariah 1:17", "theme": "scripture"}, {"t": "Who art thou, O great mountain? before Zerubbabel thou shalt become a plain: and he shall bring forth the headstone thereof with shoutings, crying, Grace, grace unto it.", "r": "Zechariah 4:7", "theme": "scripture"}, {"t": "Even he shall build the temple of the LORD; and he shall bear the glory, and shall sit and rule upon his throne; and he shall be a priest upon his throne: and the counsel of peace shall be between them both.", "r": "Zechariah 6:13", "theme": "scripture"}, {"t": "My covenant was with him of life and peace; and I gave them to him for the fear wherewith he feared me, and was afraid before my name.", "r": "Malachi 2:5", "theme": "scripture"}, {"t": "A son honoureth his father, and a servant his master: if then I be a father, where is mine honour? and if I be a master, where is my fear? saith the LORD of hosts unto you, O priests, that despise my name. And ye say, Wherein have we despised thy name?", "r": "Malachi 1:6", "theme": "scripture"}, {"t": "Now the birth of Jesus Christ was on this wise: When as his mother Mary was espoused to Joseph, before they came together, she was found with child of the Holy Ghost.", "r": "Matthew 1:18", "theme": "scripture"}, {"t": "In Rama was there a voice heard, lamentation, and weeping, and great mourning, Rachel weeping for her children, and would not be comforted, because they are not.", "r": "Matthew 2:18", "theme": "scripture"}, {"t": "I indeed baptize you with water unto repentance: but he that cometh after me is mightier than I, whose shoes I am not worthy to bear: he shall baptize you with the Holy Ghost, and with fire:", "r": "Matthew 3:11", "theme": "scripture"}, {"t": "Whether is it easier to say to the sick of the palsy, Thy sins be forgiven thee; or to say, Arise, and take up thy bed, and walk?", "r": "Mark 2:9", "theme": "scripture"}, {"t": "No man can enter into a strong man's house, and spoil his goods, except he will first bind the strong man; and then he will spoil his house.", "r": "Mark 3:27", "theme": "scripture"}, {"t": "While he yet spake, there came from the ruler of the synagogue's house certain which said, Thy daughter is dead: why troublest thou the Master any further?", "r": "Mark 5:35", "theme": "scripture"}, {"t": "Even as they delivered them unto us, which from the beginning were eyewitnesses, and ministers of the word;", "r": "Luke 1:2", "theme": "scripture"}, {"t": "Bring forth therefore fruits worthy of repentance, and begin not to say within yourselves, We have Abraham to our father: for I say unto you, That God is able of these stones to raise up children unto Abraham.", "r": "Luke 3:8", "theme": "scripture"}, {"t": "Now when the sun was setting, all they that had any sick with divers diseases brought them unto him; and he laid his hands on every one of them, and healed them.", "r": "Luke 4:40", "theme": "scripture"}, {"t": "The same came for a witness, to bear witness of the Light, that all men through him might believe.", "r": "John 1:7", "theme": "scripture"}, {"t": "This beginning of miracles did Jesus in Cana of Galilee, and manifested forth his glory; and his disciples believed on him.", "r": "John 2:11", "theme": "scripture"}, {"t": "Nicodemus saith unto him, How can a man be born when he is old? can he enter the second time into his mother's womb, and be born?", "r": "John 3:4", "theme": "scripture"}, {"t": "These all continued with one accord in prayer and supplication, with the women, and Mary the mother of Jesus, and with his brethren.", "r": "Acts 1:14", "theme": "scripture"}, {"t": "Him, being delivered by the determinate counsel and foreknowledge of God, ye have taken, and by wicked hands have crucified and slain:", "r": "Acts 2:23", "theme": "scripture"}, {"t": "Now Peter and John went up together into the temple at the hour of prayer, being the ninth hour.", "r": "Acts 3:1", "theme": "scripture"}, {"t": "By whom we have received grace and apostleship, for obedience to the faith among all nations, for his name:", "r": "Romans 1:5", "theme": "scripture"}, {"t": "To them who by patient continuance in well doing seek for glory and honour and immortality, eternal life:", "r": "Romans 2:7", "theme": "scripture"}, {"t": "God forbid: yea, let God be true, but every man a liar; as it is written, That thou mightest be justified in thy sayings, and mightest overcome when thou art judged.", "r": "Romans 3:4", "theme": "scripture"}, {"t": "Grace be unto you, and peace, from God our Father, and from the Lord Jesus Christ.", "r": "1 Corinthians 1:3", "theme": "scripture"}, {"t": "Howbeit we speak wisdom among them that are perfect: yet not the wisdom of this world, nor of the princes of this world, that come to nought:", "r": "1 Corinthians 2:6", "theme": "scripture"}, {"t": "Who then is Paul, and who is Apollos, but ministers by whom ye believed, even as the Lord gave to every man?", "r": "1 Corinthians 3:5", "theme": "scripture"}, {"t": "Blessed be God, even the Father of our Lord Jesus Christ, the Father of mercies, and the God of all comfort;", "r": "2 Corinthians 1:3", "theme": "scripture"}, {"t": "To whom ye forgive any thing, I forgive also: for if I forgave any thing, to whom I forgave it, for your sakes forgave I it in the person of Christ;", "r": "2 Corinthians 2:10", "theme": "scripture"}, {"t": "In whom the god of this world hath blinded the minds of them which believe not, lest the light of the glorious gospel of Christ, who is the image of God, should shine unto them.", "r": "2 Corinthians 4:4", "theme": "scripture"}, {"t": "I marvel that ye are so soon removed from him that called you into the grace of Christ unto another gospel:", "r": "Galatians 1:6", "theme": "scripture"}, {"t": "To whom we gave place by subjection, no, not for an hour; that the truth of the gospel might continue with you.", "r": "Galatians 2:5", "theme": "scripture"}, {"t": "Paul, an apostle of Jesus Christ by the will of God, to the saints which are at Ephesus, and to the faithful in Christ Jesus:", "r": "Ephesians 1:1", "theme": "scripture"}, {"t": "Wherein in time past ye walked according to the course of this world, according to the prince of the power of the air, the spirit that now worketh in the children of disobedience:", "r": "Ephesians 2:2", "theme": "scripture"}, {"t": "Grace be unto you, and peace, from God our Father, and from the Lord Jesus Christ.", "r": "Philippians 1:2", "theme": "scripture"}, {"t": "Fulfil ye my joy, that ye be likeminded, having the same love, being of one accord, of one mind.", "r": "Philippians 2:2", "theme": "scripture"}, {"t": "To the saints and faithful brethren in Christ which are at Colosse: Grace be unto you, and peace, from God our Father and the Lord Jesus Christ.", "r": "Colossians 1:2", "theme": "scripture"}, {"t": "Buried with him in baptism, wherein also ye are risen with him through the faith of the operation of God, who hath raised him from the dead.", "r": "Colossians 2:12", "theme": "scripture"}, {"t": "Paul, and Silvanus, and Timotheus, unto the church of the Thessalonians which is in God the Father and in the Lord Jesus Christ: Grace be unto you, and peace, from God our Father, and the Lord Jesus Christ.", "r": "1 Thessalonians 1:1", "theme": "scripture"}, {"t": "Ye are witnesses, and God also, how holily and justly and unblameably we behaved ourselves among you that believe:", "r": "1 Thessalonians 2:10", "theme": "scripture"}, {"t": "Paul, and Silvanus, and Timotheus, unto the church of the Thessalonians in God our Father and the Lord Jesus Christ:", "r": "2 Thessalonians 1:1", "theme": "scripture"}, {"t": "Finally, brethren, pray for us, that the word of the Lord may have free course, and be glorified, even as it is with you:", "r": "2 Thessalonians 3:1", "theme": "scripture"}, {"t": "Paul, an apostle of Jesus Christ by the commandment of God our Saviour, and Lord Jesus Christ, which is our hope;", "r": "1 Timothy 1:1", "theme": "scripture"}, {"t": "I exhort therefore, that, first of all, supplications, prayers, intercessions, and giving of thanks, be made for all men;", "r": "1 Timothy 2:1", "theme": "scripture"}, {"t": "To Timothy, my dearly beloved son: Grace, mercy, and peace, from God the Father and Christ Jesus our Lord.", "r": "2 Timothy 1:2", "theme": "scripture"}, {"t": "Therefore I endure all things for the elect's sakes, that they may also obtain the salvation which is in Christ Jesus with eternal glory.", "r": "2 Timothy 2:10", "theme": "scripture"}, {"t": "Paul, a servant of God, and an apostle of Jesus Christ, according to the faith of God's elect, and the acknowledging of the truth which is after godliness;", "r": "Titus 1:1", "theme": "scripture"}, {"t": "To be discreet, chaste, keepers at home, good, obedient to their own husbands, that the word of God be not blasphemed.", "r": "Titus 2:5", "theme": "scripture"}, {"t": "Hearing of thy love and faith, which thou hast toward the Lord Jesus, and toward all saints;", "r": "Philemon 1:5", "theme": "scripture"}, {"t": "Whom I would have retained with me, that in thy stead he might have ministered unto me in the bonds of the gospel:", "r": "Philemon 1:13", "theme": "scripture"}, {"t": "Thou hast loved righteousness, and hated iniquity; therefore God, even thy God, hath anointed thee with the oil of gladness above thy fellows.", "r": "Hebrews 1:9", "theme": "scripture"}, {"t": "How shall we escape, if we neglect so great salvation; which at the first began to be spoken by the Lord, and was confirmed unto us by them that heard him;", "r": "Hebrews 2:3", "theme": "scripture"}, {"t": "Blessed is the man that endureth temptation: for when he is tried, he shall receive the crown of life, which the Lord hath promised to them that love him.", "r": "James 1:12", "theme": "scripture"}, {"t": "My brethren, have not the faith of our Lord Jesus Christ, the Lord of glory, with respect of persons.", "r": "James 2:1", "theme": "scripture"}, {"t": "Elect according to the foreknowledge of God the Father, through sanctification of the Spirit, unto obedience and sprinkling of the blood of Jesus Christ: Grace unto you, and peace, be multiplied.", "r": "1 Peter 1:2", "theme": "scripture"}, {"t": "Wherefore also it is contained in the scripture, Behold, I lay in Sion a chief corner stone, elect, precious: and he that believeth on him shall not be confounded.", "r": "1 Peter 2:6", "theme": "scripture"}, {"t": "Simon Peter, a servant and an apostle of Jesus Christ, to them that have obtained like precious faith with us through the righteousness of God and our Saviour Jesus Christ:", "r": "2 Peter 1:1", "theme": "scripture"}, {"t": "Whereas angels, which are greater in power and might, bring not railing accusation against them before the Lord.", "r": "2 Peter 2:11", "theme": "scripture"}, {"t": "My little children, these things write I unto you, that ye sin not. And if any man sin, we have an advocate with the Father, Jesus Christ the righteous:", "r": "1 John 2:1", "theme": "scripture"}, {"t": "Beloved, now are we the sons of God, and it doth not yet appear what we shall be: but we know that, when he shall appear, we shall be like him; for we shall see him as he is.", "r": "1 John 3:2", "theme": "scripture"}, {"t": "The elder unto the elect lady and her children, whom I love in the truth; and not I only, but also all they that have known the truth;", "r": "2 John 1:1", "theme": "scripture"}, {"t": "Grace be with you, mercy, and peace, from God the Father, and from the Lord Jesus Christ, the Son of the Father, in truth and love.", "r": "2 John 1:3", "theme": "scripture"}, {"t": "Beloved, thou doest faithfully whatsoever thou doest to the brethren, and to strangers;", "r": "3 John 1:5", "theme": "scripture"}, {"t": "We therefore ought to receive such, that we might be fellowhelpers to the truth.", "r": "3 John 1:8", "theme": "scripture"}, {"t": "Jude, the servant of Jesus Christ, and brother of James, to them that are sanctified by God the Father, and preserved in Jesus Christ, and called:", "r": "Jude 1:1", "theme": "scripture"}, {"t": "I will therefore put you in remembrance, though ye once knew this, how that the Lord, having saved the people out of the land of Egypt, afterward destroyed them that believed not.", "r": "Jude 1:5", "theme": "scripture"}, {"t": "John to the seven churches which are in Asia: Grace be unto you, and peace, from him which is, and which was, and which is to come; and from the seven Spirits which are before his throne;", "r": "Revelation 1:4", "theme": "scripture"}, {"t": "I know thy works, and thy labour, and thy patience, and how thou canst not bear them which are evil: and thou hast tried them which say they are apostles, and are not, and hast found them liars:", "r": "Revelation 2:2", "theme": "scripture"}, {"t": "Be watchful, and strengthen the things which remain, that are ready to die: for I have not found thy works perfect before God.", "r": "Revelation 3:2", "theme": "scripture"}, {"t": "And said, I cried by reason of mine affliction unto the LORD, and he heard me; out of the belly of hell cried I, and thou heardest my voice.", "r": "Jonah 2:2", "theme": "scripture"}, {"t": "When my soul fainted within me I remembered the LORD: and my prayer came in unto thee, into thine holy temple.", "r": "Jonah 2:7", "theme": "scripture"}, {"t": "Beloved, when I gave all diligence to write unto you of the common salvation, it was needful for me to write unto you, and exhort you that ye should earnestly contend for the faith which was once delivered unto the saints.", "r": "Jude 1:3", "theme": "scripture"}];

function bookOf(r){ const m = r.match(/^(.+?)\s+\d+:\d+/); return m ? m[1] : r; }
WALL_VERSES.forEach(v => { v.book = bookOf(v.r); v.nt = NT_BOOKS.has(v.book); v.subjs = SUBJ_MAP[v.r] || []; });
let filter = { mode: "all", books: [], subjects: [] };
try { const s = JSON.parse(localStorage.getItem("vw-filter")); if(s && s.mode){ if(!Array.isArray(s.books)) s.books = []; if(!Array.isArray(s.subjects)) s.subjects = []; filter = s; } } catch(e){}
function allowedIdx(){
  const out = [];
  WALL_VERSES.forEach((v, i) => {
    let ok = filter.mode === "all" ||
      (filter.mode === "ot" && !v.nt) ||
      (filter.mode === "nt" && v.nt) ||
      (filter.mode === "custom" && filter.books.indexOf(v.book) > -1);
    if(ok && filter.subjects.length) ok = filter.subjects.some(s => v.subjs.indexOf(s) > -1);
    if(ok) out.push(i);
  });
  return out.length ? out : WALL_VERSES.map((_, i) => i);
}
function buildPools(){
  const allow = allowedIdx();
  BUCKETS = { s: [], w: [], t: [], l: [] };
  allow.forEach(i => {
    const L = WALL_VERSES[i].t.length;
    (L <= 60 ? BUCKETS.s : L <= 95 ? BUCKETS.w : L <= 135 ? BUCKETS.t : BUCKETS.l).push(i);
  });
  ["s","w","t","l"].forEach(k => { if(!BUCKETS[k].length) BUCKETS[k] = allow.slice(); });
  const seen = new Set(); CHRIST_L = [];
  allow.forEach(i => {
    const v = WALL_VERSES[i];
    if(v.t.length >= 136 && v.t.length <= 235 && CHRIST_REFS.indexOf(v.r) > -1 && !seen.has(v.r)){ seen.add(v.r); CHRIST_L.push(i); }
  });
  if(!CHRIST_L.length) CHRIST_L = BUCKETS.l.slice();
}
function applyFilter(redeal){
  buildPools();
  try{ localStorage.setItem("vw-filter", JSON.stringify(filter)); }catch(e){}
  const allow = allowedIdx(), sub = document.getElementById("filterSub");
  const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
  const parts = [];
  if(filter.mode === "ot") parts.push("Old Testament");
  else if(filter.mode === "nt") parts.push("New Testament");
  else if(filter.mode === "custom") parts.push("Custom \u00B7 " + filter.books.length + " book" + (filter.books.length === 1 ? "" : "s"));
  if(filter.subjects.length) parts.push(filter.subjects.map(cap).join(", "));
  sub.textContent = parts.length ? parts.join(" \u00B7 ") + " \u00B7 " + allow.length + " verses"
    : "Every verse keeps its own time. Some ascend, some descend.";
  document.querySelectorAll("#drModes button").forEach(b => b.classList.toggle("on", b.dataset.mode === filter.mode));
  document.querySelectorAll(".wv-chip[data-book]").forEach(ch => ch.classList.toggle("on", filter.mode === "custom" && filter.books.indexOf(ch.dataset.book) > -1));
  document.querySelectorAll(".wv-chip[data-subj]").forEach(ch => ch.classList.toggle("on", filter.subjects.indexOf(ch.dataset.subj) > -1));
  if(redeal === false) return;
  if(view === "river"){ buildRiver(); startRiver(); return; }
  usedVerses.clear();
  cards.forEach(c => {
    if(c.pinned){ usedVerses.add(WALL_VERSES[c.vi].r); return; }
    clearTimeout(c.timer); c.timer = null;
    setVerse(c); c.phase = "enter"; play(c, "enter");
    c.timer = setTimeout(() => tick(c), Math.random() * 3000);
  });
}
function renderDrawer(){
  const counts = {};
  WALL_VERSES.forEach(v => { counts[v.book] = (counts[v.book] || 0) + 1; });
  const ot = document.getElementById("drOt"), nt = document.getElementById("drNt");
  BOOK_ORDER.forEach(book => {
    const b = document.createElement("button");
    b.className = "wv-chip"; b.dataset.book = book;
    b.innerHTML = book + " <span>" + (counts[book] || 0) + "</span>";
    b.addEventListener("click", () => toggleBook(book));
    (NT_BOOKS.has(book) ? nt : ot).appendChild(b);
  });
  document.querySelectorAll("#drModes button").forEach(b => b.addEventListener("click", () => {
    filter = { mode: b.dataset.mode, books: [], subjects: [] };
    applyFilter(true); closeDrawer();
  }));
  const sc = {}, sh = document.getElementById("drSubj");
  WALL_VERSES.forEach(v => v.subjs.forEach(s => { sc[s] = (sc[s] || 0) + 1; }));
  Object.keys(sc).sort((a, b) => sc[b] - sc[a]).forEach(s => {
    const c = document.createElement("button");
    c.className = "wv-chip"; c.dataset.subj = s;
    c.innerHTML = s.charAt(0).toUpperCase() + s.slice(1) + " <span>" + sc[s] + "</span>";
    c.addEventListener("click", () => toggleSubject(s));
    sh.appendChild(c);
  });
}
function toggleSubject(s){
  const i = filter.subjects.indexOf(s);
  if(i > -1) filter.subjects.splice(i, 1); else filter.subjects.push(s);
  applyFilter(true);
}
function toggleBook(book){
  const i = filter.books.indexOf(book);
  if(i > -1) filter.books.splice(i, 1); else filter.books.push(book);
  filter.mode = filter.books.length ? "custom" : "all";
  applyFilter(true);
}

  if(c.vi >= 0) usedVerses.delete(WALL_VERSES[c.vi].r);
  c.vi = pickRiverVerse();
  usedVerses.add(WALL_VERSES[c.vi].r);
  const v = WALL_VERSES[c.vi];
  c.textEl.textContent = v.t;
  c.textEl.style.fontSize = (SIZE.s.fs + (c.type.bump || 0)) + "px";
  c.refEl.textContent = v.r;
  fitText(c);
}
/* swipe a river column: up = flow upward, down = flow downward */
function riverDirSwipe(c, dy){
  if(!c.lane) return;
  const nd = dy < 0 ? -1 : 1;
  if(c.lane.dir === nd) return;
  c.lane.dir = nd;
  spaceLane(c.lane);
  if(navigator.vibrate) try{ navigator.vibrate(8); }catch(e){}
}
function fillRiverLane(lane){
  const rv = document.getElementById("river");
  const travel = riverAxis === "y" ? riverH : riverW;
  let y, prevH = 0, guard = 0;
  while(guard++ < 14){
    const c = makeRiverCard("s", lane.g.w);
    riverSetVerse(c);
    rv.appendChild(c.cardEl);
    const hh = riverAxis === "y" ? c.cardEl.offsetHeight : c.cardEl.offsetWidth;
    if(y === undefined) y = lane.dir < 0 ? 8 : travel - hh - 8;
    else y = lane.dir < 0 ? y + prevH + RIVER_GAP : y - hh - RIVER_GAP;
    c.rpos = y; c.rh = hh;
    placeRiverCard(c, lane);
    c.lane = lane; lane.cards.push(c); riverCards.push(c);
    prevH = hh;
    if(lane.dir < 0 && y > travel + 80) break;
    if(lane.dir > 0 && y + hh < -80) break;
  }
  lane.cards.sort((a, b) => lane.dir < 0 ? a.rpos - b.rpos : b.rpos - a.rpos);
}
/* re-space one lane with fresh card heights; keeps gaps uniform, never overlapping */
function spaceLane(lane){
  if(!lane.cards.length) return;
  lane.cards.sort((a, b) => lane.dir < 0 ? a.rpos - b.rpos : b.rpos - a.rpos);
  lane.cards.forEach(c => {
    c.rh = riverAxis === "y" ? c.cardEl.offsetHeight : c.cardEl.offsetWidth;
  });
  let pos = lane.cards[0].rpos;
  lane.cards.forEach((c, i) => {
    if(i > 0){
      const p = lane.cards[i - 1];
      pos = lane.dir < 0 ? p.rpos + p.rh + RIVER_GAP : p.rpos - c.rh - RIVER_GAP;
    }
    c.rpos = pos;
  });
}
/* re-space all lanes (e.g. after webfonts arrive and text reflows) */
function relayoutRiver(){
  if(!riverLanes || !riverLanes.length) return;
  riverLanes.forEach(spaceLane);
}
function buildRiver(){
  stopRiver();
  const rv = document.getElementById("river");
  rv.innerHTML = "";
  riverLanes = []; riverCards = []; riverRocks = [];
  const headH = document.querySelector(".wv-head").offsetHeight;
  const barH = document.getElementById("viewbar").offsetHeight;
  riverW = rv.clientWidth || window.innerWidth;
  riverH = Math.max(320, window.innerHeight - headH - barH);
  rv.style.height = riverH + "px";
  const info = riverInfo();
  riverAxis = info.axis;
  const paceMul = [0.6, 1.0, 1.45];
  for(let i = paceMul.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); const t = paceMul[i]; paceMul[i] = paceMul[j]; paceMul[j] = t; }
  const W = riverW, H = riverH;
  for(let li = 0; li < 3; li++){
    const lane = { dir: info.dirs[li], cards: [], g: null, speed: RIVER_SPEED * paceMul[li] };
    if(riverAxis === "y"){
      const laneW = W / 3;
      lane.g = { x: li * laneW + 8, w: laneW - 16 };
    } else {
      const rowH = H / 3;
      lane.g = { rowY: li * rowH, rowH: rowH, w: Math.min(230, W * 0.58) };
    }
    fillRiverLane(lane);
    riverLanes.push(lane);
  }
}
function riverStep(dt, advance){
  const travel = riverAxis === "y" ? riverH : riverW;
  riverLanes.forEach(lane => {
    const mv = advance ? lane.dir * lane.speed * dt : 0;
    lane.cards.forEach(c => {
      c.rpos += mv;
      c.cardEl.style.transform = riverAxis === "y"
        ? "translate3d(0," + c.rpos + "px,0)"
        : "translate3d(" + c.rpos + "px,0,0)";
    });
    const f = lane.cards[0];
    if(!f) return;
    if(lane.dir < 0 ? f.rpos + f.rh < -6 : f.rpos > travel + 6){
      const c = lane.cards.shift();
      riverSetVerse(c);
      const hh = riverAxis === "y" ? c.cardEl.offsetHeight : c.cardEl.offsetWidth;
      const back = lane.cards[lane.cards.length - 1];
      c.rpos = lane.dir < 0 ? back.rpos + back.rh + RIVER_GAP : back.rpos - hh - RIVER_GAP;
      c.rh = hh;
      lane.cards.push(c);
      placeRiverCard(c, lane);
      spaceLane(lane);
    }
  });
}
function riverLoop(now){
  if(!riverOn) return;
  const dt = Math.min(0.06, (now - riverLast) / 1000 || 0);
  riverLast = now;
  riverStep(dt, !pausedAll);
  riverRaf = requestAnimationFrame(riverLoop);
}
function startRiver(){
  if(riverOn) return;
  riverOn = true; riverLast = performance.now();
  riverRaf = requestAnimationFrame(riverLoop);
}
function stopRiver(){
  riverOn = false;
  if(riverRaf) cancelAnimationFrame(riverRaf);
  riverRaf = 0;
  riverCards.forEach(c => { if(c.vi >= 0) usedVerses.delete(WALL_VERSES[c.vi].r); });
  riverCards = []; riverRocks = []; riverLanes = [];
}
function setView(v){
  if(view === v) return;
  view = v;
  document.querySelectorAll("#viewbar button").forEach(b => b.classList.toggle("on", b.dataset.view === v));
  const mosaic = document.getElementById("mosaic"), rv = document.getElementById("river");
  if(v === "river"){
    mosaic.style.display = "none";
    rv.style.display = "block";
    window.scrollTo(0, 0);
    buildRiver();
    startRiver();
  } else {
    stopRiver();
    rv.style.display = "none";
    rv.innerHTML = "";
    mosaic.style.display = "";
  }
}

/* keep the phone screen awake while the wall is in use; release after 3 idle minutes */
let wakeLock = null, idleTimer = null;
async function keepAwake(){
  try{
    if(!("wakeLock" in navigator)) return;
    if(!wakeLock) wakeLock = await navigator.wakeLock.request("screen");
    if(wakeLock) wakeLock.addEventListener("release", () => { wakeLock = null; });
  }catch(_){ /* unsupported or denied: carry on quietly */ }
}
function releaseWake(){
  try{ if(wakeLock) wakeLock.release(); }catch(_){}
  wakeLock = null;
}
function noteActivity(){
  if(document.visibilityState === "visible") keepAwake();
  if(idleTimer) clearTimeout(idleTimer);
  idleTimer = setTimeout(releaseWake, 180000);
}
["pointerdown","touchstart","wheel","keydown"].forEach(t =>
  window.addEventListener(t, noteActivity, { passive: true }));
document.addEventListener("visibilitychange", () => {
  if(document.visibilityState === "visible") noteActivity();
  else { if(idleTimer) clearTimeout(idleTimer); }
});
noteActivity();

renderDrawer();
applyFilter(false);
document.querySelectorAll("#viewbar button").forEach(b => b.addEventListener("click", () => setView(b.dataset.view)));
let rvResizeT = null;
window.addEventListener("resize", () => {
  if(rvResizeT) clearTimeout(rvResizeT);
  rvResizeT = setTimeout(() => { if(view === "river"){ buildRiver(); startRiver(); } }, 300);
});
document.getElementById("menuBtn").addEventListener("click", openDrawer);
document.getElementById("scrim").addEventListener("click", closeDrawer);
if(document.fonts && document.fonts.ready) document.fonts.ready.then(() => { cards.forEach(fitText); relayoutRiver(); });
window.__wall = { cards, tick, setVerse, fitText, verseRest,
  setRest(ms){ REST_MIN = 0; REST_MAX = ms; } };
</script>
