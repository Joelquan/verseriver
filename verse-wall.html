<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"/>
<title>Verse Wall</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Tenor+Sans&family=Josefin+Sans:wght@200;300;400&family=Cinzel:wght@400;600&family=Playfair+Display:ital,wght@0,500;1,400;1,500&family=Lora:ital,wght@0,400;1,400&family=Great+Vibes&family=Libre+Baskerville:ital,wght@0,400;1,400&display=swap');
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:#0d0d0d;}
body{font-family:'Tenor Sans',sans-serif;color:#f5e3b8;min-height:100vh;}

@keyframes wv-rise-in{from{opacity:0;transform:translateY(36px)}to{opacity:1;transform:translateY(0)}}
@keyframes wv-rise-out{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-36px)}}
@keyframes wv-fall-in{from{opacity:0;transform:translateY(-36px)}to{opacity:1;transform:translateY(0)}}
@keyframes wv-fall-out{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(36px)}}
@keyframes wv-fade-in{from{opacity:0}to{opacity:1}}
@keyframes wv-fade-out{from{opacity:1}to{opacity:0}}
@keyframes wv-flip-in{from{opacity:0;transform:perspective(520px) rotateX(72deg)}to{opacity:1;transform:perspective(520px) rotateX(0deg)}}
@keyframes wv-flip-out{from{opacity:1;transform:perspective(520px) rotateX(0deg)}to{opacity:0;transform:perspective(520px) rotateX(-72deg)}}
@keyframes wv-zoom-in{from{opacity:0;transform:scale(.84)}to{opacity:1;transform:scale(1)}}
@keyframes wv-zoom-out{from{opacity:1;transform:scale(1)}to{opacity:0;transform:scale(1.16)}}
@keyframes wv-slide-l-in{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:translateX(0)}}
@keyframes wv-slide-l-out{from{opacity:1;transform:translateX(0)}to{opacity:0;transform:translateX(-40px)}}
@keyframes wv-slide-r-in{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:translateX(0)}}
@keyframes wv-slide-r-out{from{opacity:1;transform:translateX(0)}to{opacity:0;transform:translateX(40px)}}
@keyframes wv-blur-in{from{opacity:0;filter:blur(12px)}to{opacity:1;filter:blur(0px)}}
@keyframes wv-blur-out{from{opacity:1;filter:blur(0px)}to{opacity:0;filter:blur(12px)}}

.wv-top{position:sticky;top:0;z-index:10;background:#0e0e0e;}
.wv-head{display:flex;align-items:center;justify-content:space-between;
 padding:14px 16px 10px;
 border-bottom:.5px solid rgba(201,147,58,.14);}
.wv-title{font-family:'Cinzel',serif;font-size:16px;font-weight:600;letter-spacing:4px;color:#f5e3b8;}
.wv-sub{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:12px;color:rgba(255,255,255,.38);margin-top:3px;}
.wv-still{flex-shrink:0;padding:8px 15px;border-radius:20px;border:.5px solid rgba(255,255,255,.14);
 background:rgba(255,255,255,.03);color:rgba(255,255,255,.55);font-size:10px;font-family:'Tenor Sans',sans-serif;
 letter-spacing:.6px;cursor:pointer;}
.wv-still.on{border-color:#c9933a;background:rgba(201,147,58,.14);color:#c9933a;}
.wv-menu{flex-shrink:0;width:38px;height:38px;border-radius:50%;border:.5px solid rgba(255,255,255,.14);
 background:rgba(255,255,255,.03);color:rgba(245,227,184,.85);font-size:16px;cursor:pointer;margin-right:11px;}
.wv-headmid{flex:1;min-width:0;}
.wv-scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .3s;z-index:40;}
.wv-viewbar{display:flex;justify-content:center;padding:8px 16px;
 border-bottom:.5px solid rgba(201,147,58,.14);}
.wv-viewtabs{display:flex;background:rgba(255,255,255,.05);border:.5px solid rgba(255,255,255,.12);border-radius:20px;padding:3px;}
.wv-viewtabs button{border:0;background:transparent;color:rgba(255,255,255,.55);font-family:'Tenor Sans',sans-serif;
 font-size:11px;letter-spacing:2.5px;text-transform:uppercase;padding:7px 26px;border-radius:16px;cursor:pointer;}
.wv-viewtabs button.on{background:rgba(201,147,58,.22);color:#e8c876;}
.wv-river{position:relative;overflow:hidden;display:none;max-width:640px;margin:0 auto;
 background:linear-gradient(180deg,#0d0d10 0%,#0b0b0e 50%,#0d0d10 100%);}
.rv-card{position:absolute !important;margin:0;box-sizing:border-box;touch-action:none;}
.rv-card .wv-body{box-sizing:border-box;}
.rv-card .wv-body{position:relative;inset:auto;}
.wv-scrim.open{opacity:1;pointer-events:auto;}
.wv-drawer{position:fixed;top:0;left:0;bottom:0;width:284px;max-width:84vw;background:#101013;
 border-right:.5px solid rgba(201,147,58,.25);z-index:41;transform:translateX(-105%);transition:transform .32s ease;
 overflow-y:auto;padding:20px 16px 34px;-webkit-overflow-scrolling:touch;}
.wv-drawer.open{transform:translateX(0);}
.wv-dr-title{font-family:'Cinzel',serif;font-size:15px;letter-spacing:3px;color:#f5e3b8;margin-bottom:14px;}
.wv-dr-modes{display:flex;flex-direction:column;gap:8px;margin-bottom:16px;}
.wv-dr-modes button{padding:11px 12px;border-radius:10px;border:.5px solid rgba(255,255,255,.12);
 background:rgba(255,255,255,.03);color:rgba(255,255,255,.75);font-family:'Tenor Sans',sans-serif;font-size:12px;
 letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;text-align:left;}
.wv-dr-modes button.on{border-color:#c9933a;background:rgba(201,147,58,.14);color:#e8c876;}
.wv-dr-sub{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:13px;color:rgba(255,255,255,.45);margin:4px 0 6px;}
.wv-dr-label{font-family:'Tenor Sans',sans-serif;font-size:10px;letter-spacing:2px;text-transform:uppercase;
 color:rgba(201,147,58,.7);margin:14px 0 8px;}
.wv-dr-books{display:flex;flex-wrap:wrap;gap:6px;}
.wv-chip{padding:7px 10px;border-radius:999px;border:.5px solid rgba(255,255,255,.12);
 background:rgba(255,255,255,.03);color:rgba(255,255,255,.65);font-size:11px;font-family:'Tenor Sans',sans-serif;cursor:pointer;}
.wv-chip span{opacity:.5;font-size:10px;margin-left:4px;}
.wv-chip.on{border-color:#c9933a;background:rgba(201,147,58,.16);color:#e8c876;}
.wv-chip.on span{opacity:.8;}
.wv-mosaic{position:relative;display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:124px;gap:8px;
 grid-auto-flow:dense;padding:12px;max-width:640px;margin:0 auto;}
.sz-s{grid-column:span 1;grid-row:span 1;}
.sz-t{grid-column:span 1;grid-row:span 2;}
.sz-w{grid-column:span 2;grid-row:span 1;}
.sz-l{grid-column:span 2;grid-row:span 2;}
.wv-card{position:relative;border-radius:14px;overflow:hidden;cursor:pointer;box-shadow:0 4px 18px rgba(0,0,0,.4);min-height:0;min-width:0;}
.wv-card{-webkit-touch-callout:none;user-select:none;-webkit-user-select:none;}
.wv-pin{position:absolute;top:5px;left:50%;width:10px;height:10px;border-radius:50%;opacity:0;z-index:3;pointer-events:none;
 transform:translateX(-50%) scale(.6);transition:opacity .3s,transform .3s;
 background:radial-gradient(circle at 35% 30%,#ffe9a8,#e8b84b 42%,#a5762a 72%,#6e4c12);
 box-shadow:0 1px 4px rgba(0,0,0,.55),inset 0 1px 1px rgba(255,255,255,.55),inset 0 -1px 2px rgba(60,35,5,.5);}
.wv-pin::before{content:"";position:absolute;left:50%;top:1.2px;width:1.6px;height:7.6px;margin-left:-.8px;border-radius:1px;
 background:linear-gradient(90deg,#6b4a12,#2e1f06);box-shadow:inset 0 1px 1px rgba(0,0,0,.6);}
.wv-pin::after{content:"";position:absolute;left:50%;top:2.7px;width:5px;height:1.6px;margin-left:-2.5px;border-radius:1px;
 background:linear-gradient(180deg,#6b4a12,#2e1f06);box-shadow:inset 0 1px 1px rgba(0,0,0,.6);}
.wv-card.pinned .wv-pin{opacity:.95;transform:translateX(-50%) scale(1);}
.wv-skinov{position:absolute;inset:0;pointer-events:none;}
.wv-grain{position:absolute;inset:0;opacity:.05;background-size:128px;pointer-events:none;}
.wv-topline{position:absolute;top:0;left:0;right:0;height:2px;opacity:.7;pointer-events:none;}
.wv-body{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;overflow:hidden;}
.wv-quote{font-family:'Cormorant Garamond',serif;line-height:1;margin-bottom:5px;opacity:.55;}
.wv-text{font-family:'Cormorant Garamond',serif;font-style:italic;line-height:1.55;text-shadow:0 2px 12px rgba(0,0,0,.5);}
.wv-ref{margin-top:8px;font-size:9px;letter-spacing:1.6px;text-transform:uppercase;font-family:'Tenor Sans',sans-serif;}
.wv-overlay{position:fixed;inset:0;z-index:50;display:none;flex-direction:column;justify-content:center;padding:40px 30px;}
.wv-overlay.open{display:flex;}
.wv-ov-quote{font-family:'Cormorant Garamond',serif;font-size:64px;line-height:1;opacity:.4;margin-bottom:10px;}
.wv-ov-text{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:24px;line-height:1.7;text-shadow:0 2px 14px rgba(0,0,0,.55);}
.wv-ov-ref{margin-top:22px;font-size:12px;letter-spacing:2.5px;text-transform:uppercase;font-family:'Tenor Sans',sans-serif;}
.wv-ov-close{position:absolute;top:18px;right:18px;width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.4);
 border:.5px solid rgba(255,255,255,.16);color:rgba(255,255,255,.72);font-size:16px;cursor:pointer;}
.wv-ov-share{position:absolute;bottom:34px;left:50%;transform:translateX(-50%);padding:13px 34px;border-radius:999px;
 background:rgba(0,0,0,.45);border:1px solid rgba(201,147,58,.65);color:#e8c876;font-family:'Tenor Sans',sans-serif;
 font-size:13px;letter-spacing:2.5px;text-transform:uppercase;cursor:pointer;}
.wv-ov-share:active{transform:translateX(-50%) scale(.96);}
.wv-shareprev{position:fixed;inset:0;z-index:90;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.93);padding:22px;box-sizing:border-box;}
.wv-shareprev.open{display:flex;}
.wv-shareprev img{max-width:100%;max-height:72vh;border-radius:10px;box-shadow:0 8px 40px rgba(0,0,0,.6);}
.wv-shareprev p{color:#e8dcc0;margin:18px 6px 0;text-align:center;font-size:15px;line-height:1.55;}
.wv-shareprev button{margin-top:16px;padding:11px 34px;border-radius:999px;border:1px solid #c9933a;background:transparent;color:#c9933a;font-size:15px;}
</style>
</head>
<body>
<div class="wv-top">
<div class="wv-head">
  <button class="wv-menu" id="menuBtn">&#9776;</button>
  <div class="wv-headmid">
    <div class="wv-title">VERSE WALL</div>
    <div class="wv-sub" id="filterSub">Every verse keeps its own time. Some ascend, some descend.</div>
  </div>
  <button class="wv-still" id="stillBtn">&#10074;&#10074; Still</button>
</div>
<div class="wv-viewbar" id="viewbar">
  <div class="wv-viewtabs">
    <button data-view="mosaic" class="on">Mosaic</button>
    <button data-view="river">River</button>
  </div>
</div>
</div>
<div class="wv-mosaic" id="mosaic"></div>
<div class="wv-river" id="river"></div>
<div class="wv-scrim" id="scrim"></div>
<aside class="wv-drawer" id="drawer">
  <div class="wv-dr-title">SCRIPTURE</div>

    <button data-mode="all">All Scripture</button>
    <button data-mode="ot">Old Testament</button>
    <button data-mode="nt">New Testament</button>
  </div>
  <div class="wv-dr-sub">Subjects</div>
  <div class="wv-dr-books" id="drSubj"></div>
  <div class="wv-dr-sub">Custom &mdash; choose books</div>
  <div class="wv-dr-label">Old Testament</div>
  <div class="wv-dr-books" id="drOt"></div>
  <div class="wv-dr-label">New Testament</div>
  <div class="wv-dr-books" id="drNt"></div>
</aside>
<div class="wv-overlay" id="overlay">
  <button class="wv-ov-close" id="ovClose">&#10005;</button>
  <div class="wv-ov-quote" id="ovQuote">&ldquo;</div>
  <div class="wv-ov-text" id="ovText"></div>
  <div class="wv-ov-ref" id="ovRef"></div>
  <button class="wv-ov-share" id="ovShare">Share</button>
</div>
<div class="wv-shareprev" id="sharePrev">
  <img id="sharePrevImg" alt="Verse image">
  <p>Touch and hold the image, then choose Share or Save to Photos.</p>
  <button id="sharePrevClose">Close</button>
</div>

I commanded thee? Be strong and of a good courage; be not afraid, neither be thou dismayed: for the LORD thy God is with thee whithersoever thou goest.", "r": "Joshua 1:9", "theme": "strength"}, {"t": "He giveth power to the faint; and to them that have no might he increaseth strength.", "r": "Isaiah 40:29", "theme": "strength"}, {"t": "The LORD is my strength and my shield; my heart trusted in him, and I am helped: therefore my heart greatly rejoiceth; and with my song will I praise him.", "r": "Psalm 28:7", "theme": "strength"}, {"t": "For God so loved the world, that he gave his only begotten Son, that whosoever believeth in him should not perish, but have everlasting life.", "r": "John 3:16", "theme": "love"}, {"t": "Greater love hath no man than this, that a man lay down his life for his friends.", "r": "John 15:13", "theme": "love"}, {"t": "Charity suffereth long, and is kind; charity envieth not; charity vaunteth not itself, is not puffed up,", "r": "1 Corinthians 13:4", "theme": "love"}, {"t": "We love him, because he first loved us.", "r": "1 John 4:19", "theme": "love"}, {"t": "For I am persuaded, that neither death, nor life, nor angels, nor principalities, nor powers, nor things present, nor things to come, Nor height, nor depth, nor any other creature, shall be able to separate us from the love of God, which is in Christ Jesus our Lord.", "r": "Romans 8:38-39", "theme": "love"}, {"t": "NUN. Thy word is a lamp unto my feet, and a light unto my path.", "r": "Psalm 119:105", "theme": "wisdom"}, {"t": "The fear of the LORD is the beginning of wisdom: and the knowledge of the holy is understanding.", "r": "Proverbs 9:10", "theme": "wisdom"}, {"t": "If any of you lack wisdom, let him ask of God, that giveth to all men liberally, and upbraideth not; and it shall be given him.", "r": "James 1:5", "theme": "wisdom"}, {"t": "How much better is it to get wisdom than gold! and to get understanding rather to be chosen than silver!", "r": "Proverbs 16:16", "theme": "wisdom"}, {"t": "A Psalm of David. Bless the LORD, O my soul: and all that is within me, bless his holy name.", "r": "Psalm 103:1", "theme": "praise"}, {"t": "A Psalm of David, when he changed his behaviour before Abimelech; who drove him away, and he departed. I will bless the LORD at all times: his praise shall continually be in my mouth.", "r": "Psalm 34:1", "theme": "praise"}, {"t": "Let every thing that hath breath praise the LORD. Praise ye the LORD.", "r": "Psalm 150:6", "theme": "praise"}, {"t": "Enter into his gates with thanksgiving, and into his courts with praise: be thankful unto him, and bless his name.", "r": "Psalm 100:4", "theme": "praise"}, {"t": "O sing unto the LORD a new song: sing unto the LORD, all the earth.", "r": "Psalm 96:1", "theme": "praise"}, {"t": "And he said unto me, My grace is sufficient for thee: for my strength is made perfect in weakness. Most gladly therefore will I rather glory in my infirmities, that the power of Christ may rest upon me.", "r": "2 Corinthians 12:9", "theme": "grace"}, {"t": "For by grace are ye saved through faith; and that not of yourselves: it is the gift of God:", "r": "Ephesians 2:8", "theme": "grace"}, {"t": "Let us therefore come boldly unto the throne of grace, that we may obtain mercy, and find grace to help in time of need.", "r": "Hebrews 4:16", "theme": "grace"}, {"t": "Moreover the law entered, that the offence might abound. But where sin abounded, grace did much more abound:", "r": "Romans 5:20", "theme": "grace"}, {"t": "Ask, and it shall be given you; seek, and ye shall find; knock, and it shall be opened unto you:", "r": "Matthew 7:7", "theme": "prayer"}, {"t": "Be careful for nothing; but in every thing by prayer and supplication with thanksgiving let your requests be made known unto God.", "r": "Philippians 4:6", "theme": "prayer"}, {"t": "Confess your faults one to another, and pray one for another, that ye may be healed. The effectual fervent prayer of a righteous man availeth much.", "r": "James 5:16", "theme": "prayer"}, {"t": "Call unto me, and I will answer thee, and shew thee great and mighty things, which thou knowest not.", "r": "Jeremiah 33:3", "theme": "prayer"}, {"t": "A Psalm of David. The LORD is my light and my salvation; whom shall I fear? the LORD is the strength of my life; of whom shall I be afraid?", "r": "Psalm 27:1", "theme": "hope"}, {"t": "For I know the thoughts that I think toward you, saith the LORD, thoughts of peace, and not of evil, to give you an expected end.", "r": "Jeremiah 29:11", "theme": "hope"}, {"t": "Now the God of hope fill you with all joy and peace in believing, that ye may abound in hope, through the power of the Holy Ghost.", "r": "Romans 15:13", "theme": "hope"}, {"t": "But they that wait upon the LORD shall renew their strength; they shall mount up with wings as eagles; they shall run, and not be weary; and they shall walk, and not faint.", "r": "Isaiah 40:31", "theme": "hope"}, {"t": "For his anger endureth but a moment; in his favour is life: weeping may endure for a night, but joy cometh in the morning.", "r": "Psalm 30:5", "theme": "hope"}, {"t": "No weapon that is formed against thee shall prosper; and every tongue that shall rise against thee in judgment thou shalt condemn. This is the heritage of the servants of the LORD, and their righteousness is of me, saith the LORD.", "r": "Isaiah 54:17", "theme": "warfare"}, {"t": "Put on the whole armour of God, that ye may be able to stand against the wiles of the devil.", "r": "Ephesians 6:11", "theme": "warfare"}, {"t": "Ye are of God, little children, and have overcome them: because greater is he that is in you, than he that is in the world.", "r": "1 John 4:4", "theme": "warfare"}, {"t": "Submit yourselves therefore to God. Resist the devil, and he will flee from you.", "r": "James 4:7", "theme": "warfare"}, {"t": "But he was wounded for our transgressions, he was bruised for our iniquities: the chastisement of our peace was upon him; and with his stripes we are healed.", "r": "Isaiah 53:5", "theme": "healing"}, {"t": "He healeth the broken in heart, and bindeth up their wounds.", "r": "Psalm 147:3", "theme": "healing"}, {"t": "And said, If thou wilt diligently hearken to the voice of the LORD thy God, and wilt do that which is right in his sight, and wilt give ear to his commandments, and keep all his statutes, I will put none of these diseases upon thee, which I have brought upon the Egyptians: for I am the LORD that healeth thee.", "r": "Exodus 15:26", "theme": "healing"}, {"t": "Bless the LORD, O my soul, and forget not all his benefits: Who forgiveth all thine iniquities; who healeth all thy diseases;", "r": "Psalm 103:2-3", "theme": "healing"}, {"t": "For the wages of sin is death; but the gift of God is eternal life through Jesus Christ our Lord.", "r": "Romans 6:23", "theme": "salvation"}, {"t": "For whosoever shall call upon the name of the Lord shall be saved.", "r": "Romans 10:13", "theme": "salvation"}, {"t": "Jesus saith unto him, I am the way, the truth, and the life: no man cometh unto the Father, but by me.", "r": "John 14:6", "theme": "salvation"}, {"t": "Because it is written, Be ye holy; for I am holy.", "r": "1 Peter 1:16", "theme": "holiness"}, {"t": "Create in me a clean heart, O God; and renew a right spirit within me.", "r": "Psalm 51:10", "theme": "holiness"}, {"t": "Follow peace with all men, and holiness, without which no man shall see the Lord:", "r": "Hebrews 12:14", "theme": "holiness"}, {"t": "Blessed are the pure in heart: for they shall see God.", "r": "Matthew 5:8", "theme": "holiness"}, {"t": "Rejoice in the Lord alway: and again I say, Rejoice.", "r": "Philippians 4:4", "theme": "joy"}, {"t": "The LORD thy God in the midst of thee is mighty; he will save, he will rejoice over thee with joy; he will rest in his love, he will joy over thee with singing.", "r": "Zephaniah 3:17", "theme": "joy"}, {"t": "This is the day which the LORD hath made; we will rejoice and be glad in it.", "r": "Psalm 118:24", "theme": "joy"}, {"t": "Thou wilt shew me the path of life: in thy presence is fulness of joy; at thy right hand there are pleasures for evermore.", "r": "Psalm 16:11", "theme": "joy"}, {"t": "For whosoever exalteth himself shall be abased; and he that humbleth himself shall be exalted.", "r": "Luke 14:11", "theme": "humility"}, {"t": "Let nothing be done through strife or vainglory; but in lowliness of mind let each esteem other better than themselves.", "r": "Philippians 2:3", "theme": "humility"}, {"t": "He hath shewed thee, O man, what is good; and what doth the LORD require of thee, but to do justly, and to love mercy, and to walk humbly with thy God?", "r": "Micah 6:8", "theme": "humility"}, {"t": "Jesus said unto her, I am the resurrection, and the life: he that believeth in me, though he were dead, yet shall he live:", "r": "John 11:25", "theme": "resurrection"}, {"t": "He is not here: for he is risen, as he said. Come, see the place where the Lord lay.", "r": "Matthew 28:6", "theme": "resurrection"}, {"t": "But now is Christ risen from the dead, and become the firstfruits of them that slept.", "r": "1 Corinthians 15:20", "theme": "resurrection"}, {"t": "Yet a little while, and the world seeth me no more; but ye see me: because I live, ye shall live also.", "r": "John 14:19", "theme": "resurrection"}, {"t": "For I will be merciful to their unrighteousness, and their sins and their iniquities will I remember no more.", "r": "Hebrews 8:12", "theme": "covenant"}, {"t": "Know therefore that the LORD thy God, he is God, the faithful God, which keepeth covenant and mercy with them that love him and keep his commandments to a thousand generations;", "r": "Deuteronomy 7:9", "theme": "covenant"}, {"t": "It is of the LORD'S mercies that we are not consumed, because his compassions fail not.", "r": "Lamentations 3:22", "theme": "covenant"}, {"t": "For he hath made him to be sin for us, who knew no sin; that we might be made the righteousness of God in him.", "r": "2 Corinthians 5:21", "theme": "righteousn"}, {"t": "But seek ye first the kingdom of God, and his righteousness; and all these things shall be added unto you.", "r": "Matthew 6:33", "theme": "righteousn"}, {"t": "Many are the afflictions of the righteous: but the LORD delivereth him out of them all.", "r": "Psalm 34:19", "theme": "righteousn"}, {"t": "For the kingdom of God is not meat and drink; but righteousness, and peace, and joy in the Holy Ghost.", "r": "Romans 14:17", "theme": "kingdom"}, {"t": "Thy kingdom come. Thy will be done in earth, as it is in heaven.", "r": "Matthew 6:10", "theme": "kingdom"}, {"t": "And I will give unto thee the keys of the kingdom of heaven: and whatsoever thou shalt bind on earth shall be bound in heaven: and whatsoever thou shalt loose on earth shall be loosed in heaven.", "r": "Matthew 16:19", "theme": "kingdom"}, {"t": "But the Comforter, which is the Holy Ghost, whom the Father will send in my name, he shall teach you all things, and bring all things to your remembrance, whatsoever I have said unto you.", "r": "John 14:26", "theme": "holyspirit"}, {"t": "But the fruit of the Spirit is love, joy, peace, longsuffering, gentleness, goodness, faith,", "r": "Galatians 5:22", "theme": "holyspirit"}, {"t": "Know ye not that ye are the temple of God, and that the Spirit of God dwelleth in you?", "r": "1 Corinthians 3:16", "theme": "holyspirit"}, {"t": "It is of the LORD'S mercies that we are not consumed, because his compassions fail not. They are new every morning: great is thy faithfulness.", "r": "Lamentations 3:22-23", "theme": "mercy"}, {"t": "Blessed are the merciful: for they shall obtain mercy.", "r": "Matthew 5:7", "theme": "mercy"}, {"t": "The LORD is merciful and gracious, slow to anger, and plenteous in mercy.", "r": "Psalm 103:8", "theme": "mercy"}, {"t": "For the prophecy came not in old time by the will of man: but holy men of God spake as they were moved by the Holy Ghost.", "r": "2 Peter 1:21", "theme": "prophecy"}, {"t": "Surely the Lord GOD will do nothing, but he revealeth his secret unto his servants the prophets.", "r": "Amos 3:7", "theme": "prophecy"}, {"t": "For I reckon that the sufferings of this present time are not worthy to be compared with the glory which shall be revealed in us.", "r": "Romans 8:18", "theme": "suffering"}, {"t": "But the God of all grace, who hath called us unto his eternal glory by Christ Jesus, after that ye have suffered a while, make you perfect, stablish, strengthen, settle you.", "r": "1 Peter 5:10", "theme": "suffering"}, {"t": "And not only so, but we glory in tribulations also: knowing that tribulation worketh patience;", "r": "Romans 5:3", "theme": "suffering"}, {"t": "God is a Spirit: and they that worship him must worship him in spirit and in truth.", "r": "John 4:24", "theme": "worship"}, {"t": "O come, let us worship and bow down: let us kneel before the LORD our maker.", "r": "Psalm 95:6", "theme": "worship"}, {"t": "Exalt the LORD our God, and worship at his holy hill; for the LORD our God is holy.", "r": "Psalm 99:9", "theme": "worship"}, {"t": "Moreover when ye fast, be not, as the hypocrites, of a sad countenance: for they disfigure their faces, that they may appear unto men to fast. Verily I say unto you, They have their reward.", "r": "Matthew 6:16", "theme": "fasting"}, {"t": "Is not this the fast that I have chosen? to loose the bands of wickedness, to undo the heavy burdens, and to let the oppressed go free, and that ye break every yoke?", "r": "Isaiah 58:6", "theme": "fasting"}, {"t": "And he said unto them, This kind can come forth by nothing, but by prayer and fasting.", "r": "Mark 9:29", "theme": "fasting"}, {"t": "And if it seem evil unto you to serve the LORD, choose you this day whom ye will serve; whether the gods which your fathers served that were on the other side of the flood, or the gods of the Amorites, in whose land ye dwell: but as for me and my house, we will serve the LORD.", "r": "Joshua 24:15", "theme": "family"}, {"t": "Lo, children are an heritage of the LORD: and the fruit of the womb is his reward.", "r": "Psalm 127:3", "theme": "family"}, {"t": "Honour thy father and thy mother: that thy days may be long upon the land which the LORD thy God giveth thee.", "r": "Exodus 20:12", "theme": "family"}, {"t": "And he said unto them, Go ye into all the world, and preach the gospel to every creature.", "r": "Mark 16:15", "theme": "nations"}, {"t": "For God so loved the world, that he gave his only begotten Son, that whosoever believeth in him should not perish, but have everlasting life.", "r": "John 3:16", "theme": "nations"}, {"t": "Ask of me, and I shall give thee the heathen for thine inheritance, and the uttermost parts of the earth for thy possession.", "r": "Psalm 2:8", "theme": "nations"}, {"t": "For he shall give his angels charge over thee, to keep thee in all thy ways.", "r": "Psalm 91:11", "theme": "angels"}, {"t": "Are they not all ministering spirits, sent forth to minister for them who shall be heirs of salvation?", "r": "Hebrews 1:14", "theme": "angels"}, {"t": "The angel of the LORD encampeth round about them that fear him, and delivereth them.", "r": "Psalm 34:7", "theme": "angels"}, {"t": "In the beginning God created the heaven and the earth.", "r": "Genesis 1:1", "theme": "creation"}, {"t": "To the chief Musician, A Psalm of David. The heavens declare the glory of God; and the firmament sheweth his handywork.", "r": "Psalm 19:1", "theme": "creation"}, {"t": "For by him were all things created, that are in heaven, and that are in earth, visible and invisible, whether they be thrones, or dominions, or principalities, or powers: all things were created by him, and for him:", "r": "Colossians 1:16", "theme": "creation"}, {"t": "I am Alpha and Omega, the beginning and the end, the first and the last.", "r": "Revelation 22:13", "theme": "endtimes"}, {"t": "And God shall wipe away all tears from their eyes; and there shall be no more death, neither sorrow, nor crying, neither shall there be any more pain: for the former things are passed away.", "r": "Revelation 21:4", "theme": "endtimes"}, {"t": "Behold, I stand at the door, and knock: if any man hear my voice, and open the door, I will come in to him, and will sup with him, and he with me.", "r": "Revelation 3:20", "theme": "endtimes"}, {"t": "Go ye therefore, and teach all nations, baptizing them in the name of the Father, and of the Son, and of the Holy Ghost:", "r": "Matthew 28:19", "theme": "baptism"}, {"t": "Therefore we are buried with him by baptism into death: that like as Christ was raised up from the dead by the glory of the Father, even so we also should walk in newness of life.", "r": "Romans 6:4", "theme": "baptism"}, {"t": "Then Peter said unto them, Repent, and be baptized every one of you in the name of Jesus Christ for the remission of sins, and ye shall receive the gift of the Holy Ghost.", "r": "Acts 2:38", "theme": "baptism"}, {"t": "And he took bread, and gave thanks, and brake it, and gave unto them, saying, This is my body which is given for you: this do in remembrance of me.", "r": "Luke 22:19", "theme": "communion"}, {"t": "The cup of blessing which we bless, is it not the communion of the blood of Christ? The bread which we break, is it not the communion of the body of Christ?", "r": "1 Corinthians 10:16", "theme": "communion"}, {"t": "He that eateth my flesh, and drinketh my blood, dwelleth in me, and I in him.", "r": "John 6:56", "theme": "communion"}, {"t": "In the beginning God created the heaven and the earth.", "r": "Genesis 1:1", "theme": "scripture"}, {"t": "And God said, Let there be light: and there was light.", "r": "Genesis 1:3", "theme": "scripture"}, {"t": "So God created man in his own image, in the image of God created he him; male and female created he them.", "r": "Genesis 1:27", "theme": "scripture"}, {"t": "And the LORD God said, It is not good that the man should be alone; I will make him an help meet for him.", "r": "Genesis 2:18", "theme": "scripture"}, {"t": "And the LORD God formed man of the dust of the ground, and breathed into his nostrils the breath of life; and man became a living soul.", "r": "Genesis 2:7", "theme": "scripture"}, {"t": "And the LORD God called unto Adam, and said unto him, Where art thou?", "r": "Genesis 3:9", "theme": "scripture"}, {"t": "And I will put enmity between thee and the woman, and between thy seed and her seed; it shall bruise thy head, and thou shalt bruise his heel.", "r": "Genesis 3:15", "theme": "scripture"}, {"t": "And the LORD said unto Cain, Where is Abel thy brother? And he said, I know not: Am I my brother's keeper?", "r": "Genesis 4:9", "theme": "scripture"}, {"t": "But with thee will I establish my covenant; and thou shalt come into the ark, thou, and thy sons, and thy wife, and thy sons' wives with thee.", "r": "Genesis 6:18", "theme": "scripture"}, {"t": "Now the LORD had said unto Abram, Get thee out of thy country, and from thy kindred, and from thy father's house, unto a land that I will shew thee:", "r": "Genesis 12:1", "theme": "scripture"}, {"t": "And God said unto Moses, I AM THAT I AM: and he said, Thus shalt thou say unto the children of Israel, I AM hath sent me unto you.", "r": "Exodus 3:14", "theme": "scripture"}, {"t": "I am the LORD thy God, which have brought thee out of the land of Egypt, out of the house of bondage.", "r": "Exodus 20:2", "theme": "scripture"}, {"t": "Thou shalt have no other gods before me.", "r": "Exodus 20:3", "theme": "scripture"}, {"t": "Remember the sabbath day, to keep it holy.", "r": "Exodus 20:8", "theme": "scripture"}, {"t": "Honour thy father and thy mother: that thy days may be long upon the land which the LORD thy God giveth thee.", "r": "Exodus 20:12", "theme": "scripture"}, {"t": "And said, If thou wilt diligently hearken to the voice of the LORD thy God, and wilt do that which is right in his sight, and wilt give ear to his commandments, and keep all his statutes, I  afraid?", "r": "Psalm 27:1", "theme": "scripture"}, {"t": "The fear of the LORD is the beginning of knowledge: but fools despise wisdom and instruction.", "r": "Proverbs 1:7", "theme": "scripture"}, {"t": "Trust in the LORD with all thine heart; and lean not unto thine own understanding.", "r": "Proverbs 3:5", "theme": "scripture"}, {"t": "In all thy ways acknowledge him, and he shall direct thy paths.", "r": "Proverbs 3:6", "theme": "scripture"}, {"t": "Keep thy heart with all diligence; for out of it are the issues of life.", "r": "Proverbs 4:23", "theme": "scripture"}, {"t": "A soft answer turneth away wrath: but grievous words stir up anger.", "r": "Proverbs 15:1", "theme": "scripture"}, {"t": "Pride goeth before destruction, and an haughty spirit before a fall.", "r": "Proverbs 16:18", "theme": "scripture"}, {"t": "The name of the LORD is a strong tower: the righteous runneth into it, and is safe.", "r": "Proverbs 18:10", "theme": "scripture"}, {"t": "Train up a child in the way he should go: and when he is old, he will not depart from it.", "r": "Proverbs 22:6", "theme": "scripture"}, {"t": "Iron sharpeneth iron; so a man sharpeneth the countenance of his friend.", "r": "Proverbs 27:17", "theme": "scripture"}, {"t": "But they that wait upon the LORD shall renew their strength; they shall mount up with wings as eagles; they shall run, and not be weary; and they shall walk, and not faint.", "r": "Isaiah 40:31", "theme": "scripture"}, {"t": "Fear thou not; for I am with thee: be not dismayed; for I am thy God: I will strengthen thee; yea, I will help thee; yea, I will uphold thee with the right hand of my righteousness.", "r": "Isaiah 41:10", "theme": "scripture"}, {"t": "For I the LORD thy God will hold thy right hand, saying unto thee, Fear not; I will help thee.", "r": "Isaiah 41:13", "theme": "scripture"}, {"t": "But he was wounded for our transgressions, he was bruised for our iniquities: the chastisement of our peace was upon him; and with his stripes we are healed.", "r": "Isaiah 53:5", "theme": "scripture"}, {"t": "But he was wounded for our transgressions, he was bruised for our iniquities: the chastisement of our peace was upon him; and with his stripes we are healed.", "r": "Isaiah 53:5", "theme": "scripture"}, {"t": "Thou wilt keep him in perfect peace, whose mind is stayed on thee: because he trusteth in thee.", "r": "Isaiah 26:3", "theme": "scripture"}, {"t": "No weapon that is formed against thee shall prosper; and every tongue that shall rise against thee in judgment thou shalt condemn. This is the heritage of the servants of the LORD, and their righteousness is of me, saith the LORD.", "r": "Isaiah 54:17", "theme": "scripture"}, {"t": "Ho, every one that thirsteth, come ye to the waters, and he that hath no money; come ye, buy, and eat; yea, come, buy wine and milk without money and without price.", "r": "Isaiah 55:1", "theme": "scripture"}, {"t": "The Spirit of the Lord GOD is upon me; because the LORD hath anointed me to preach good tidings unto the meek; he hath sent me to bind up the brokenhearted, to proclaim liberty to the captives, and the opening of the prison to them that are bound;", "r": "Isaiah 61:1", "theme": "scripture"}, {"t": "For I know the thoughts that I think toward you, saith the LORD, thoughts of peace, and not of evil, to give you an expected end.", "r": "Jeremiah 29:11", "theme": "scripture"}, {"t": "And ye shall seek me, and find me, when ye shall search for me with all your heart.", "r": "Jeremiah 29:13", "theme": "scripture"}, {"t": "Call unto me, and I will answer thee, and shew thee great and mighty things, which thou knowest not.", "r": "Jeremiah 33:3", "theme": "scripture"}, {"t": "Is there no balm in Gilead; is there no physician there? why then is not the health of the daughter of my people recovered?", "r": "Jeremiah 8:22", "theme": "scripture"}, {"t": "The heart is deceitful above all things, and desperately wicked: who can know it?", "r": "Jeremiah 17:9", "theme": "scripture"}, {"t": "Blessed are the poor in spirit: for theirs is the kingdom of heaven.", "r": "Matthew 5:3", "theme": "scripture"}, {"t": "Blessed are the pure in heart: for they shall see God.", "r": "Matthew 5:8", "theme": "scripture"}, {"t": "Ye are the light of the world. A city that is set on an hill cannot be hid.", "r": "Matthew 5:14", "theme": "scripture"}, {"t": "But seek ye first the kingdom of God, and his righteousness; and all these things shall be added unto you.", "r": "Matthew 6:33", "theme": "scripture"}, {"t": "Ask, and it shall be given you; seek, and ye shall find; knock, and it shall be opened unto you:", "r": "Matthew 7:7", "theme": "scripture"}, {"t": "Come unto me, all ye that labour and are heavy laden, and I will give you rest.", "r": "Matthew 11:28", "theme": "scripture"}, {"t": "But Jesus beheld them, and said unto them, With men this is impossible; but with God all things are possible.", "r": "Matthew 19:26", "theme": "scripture"}, {"t": "Go ye therefore, and teach all nations, baptizing them in the name of the Father, and of the Son, and of the Holy Ghost:", "r": "Matthew 28:19", "theme": "scripture"}, {"t": "Teaching them to observe all things whatsoever I have commanded you: and, lo, I am with you alway, even unto the end of the world. Amen.", "r": "Matthew 28:20", "theme": "scripture"}, {"t": "In the beginning was the Word, and the Word was with God, and the Word was God.", "r": "John 1:1", "theme": "scripture"}, {"t": "And the Word was made flesh, and dwelt among us, (and we beheld his glory, the glory as of the only begotten of the Father,) full of grace and truth.", "r": "John 1:14", "theme": "scripture"}, {"t": "For God so loved the world, that he gave his only begotten Son, that whosoever believeth in him should not perish, but have everlasting life.", "r": "John 3:16", "theme": "scripture"}, {"t": "God is a Spirit: and they that worship him must worship him in spirit and in truth.", "r": "John 4:24", "theme": "scripture"}, {"t": "And Jesus said unto them, I am the bread of life: he that cometh to me shall never hunger; and he that believeth on me shall never thirst.", "r": "John 6:35", "theme": "scripture"}, {"t": "Then spake Jesus again unto them, saying, I am the light of the world: he that followeth me shall not walk in darkness, but shall have the light of life.", "r": "John 8:12", "theme": "scripture"}, {"t": "And ye shall know the truth, and the truth shall make you free.", "r": "John 8:32", "theme": "scripture"}, {"t": "I am the good shepherd: the good shepherd giveth his life for the sheep.", "r": "John 10:11", "theme": "scripture"}, {"t": "Jesus said unto her, I am the resurrection, and the life: he that believeth in me, though he were dead, yet shall he live:", "r": "John 11:25", "theme": "scripture"}, {"t": "A new commandment I give unto you, That ye love one another; as I have loved you, that ye also love one another.", "r": "John 13:34", "theme": "scripture"}, {"t": "Jesus saith unto him, I am the way, the truth, and the life: no man cometh unto the Father, but by me.", "r": "John 14:6", "theme": "scripture"}, {"t": "Peace I leave with you, my peace I give unto you: not as the world giveth, give I unto you. Let not your heart be troubled, neither let it be afraid.", "r": "John 14:27", "theme": "scripture"}, {"t": "Greater love hath no man than this, that a man lay down his life for his friends.", "r": "John 15:13", "theme": "scripture"}, {"t": "For all have sinned, and come short of the glory of God;", "r": "Romans 3:23", "theme": "scripture"}, {"t": "For the wages of sin is death; but the gift of God is eternal life through Jesus Christ our Lord.", "r": "Romans 6:23", "theme": "scripture"}, {"t": "There is therefore now no condemnation to them which are in Christ Jesus, who walk not after the flesh, but after the Spirit.", "r": "Romans 8:1", "theme": "scripture"}, {"t": "And we know that all things work together for good to them that love God, to them who are the called according to his purpose.", "r": "Romans 8:28", "theme": "scripture"}, {"t": "For I am persuaded, that neither death, nor life, nor angels, nor principalities, nor powers, nor things present, nor things to come, Nor height, nor depth, nor any other creature, shall be able to separate us from the love of God, which is in Christ Jesus our Lord.", "r": "Romans 8:38-39", "theme": "scripture"}, {"t": "That if thou shalt confess with thy mouth the Lord Jesus, and shalt believe in thine heart that God hath raised him from the dead, thou shalt be saved.", "r": "Romans 10:9", "theme": "scripture"}, {"t": "For whosoever shall call upon the name of the Lord shall be saved.", "r": "Romans 10:13", "theme": "scripture"}, {"t": "And be not conformed to this world: but be ye transformed by the renewing of your mind, that ye may prove what is that good, and acceptable, and perfect, will of God.", "r": "Romans 12:2", "theme": "scripture"}, {"t": "I am Alpha and Omega, the beginning and the ending, saith the Lord, which is, and which was, and which is to come, the Almighty.", "r": "Revelation 1:8", "theme": "scripture"}, {"t": "Behold, I stand at the door, and knock: if any man hear my voice, and open the door, I will come in to him, and will sup with him, and he with me.", "r": "Revelation 3:20", "theme": "scripture"}, {"t": "And the four beasts had each of them six wings about him; and they were full of eyes within: and they rest not day and night, saying, Holy, holy, holy, Lord God Almighty, which was, and is, and is to come.", "r": "Revelation 4:8", "theme": "scripture"}, {"t": "Saying with a loud voice, Worthy is the Lamb that was slain to receive power, and riches, and wisdom, and strength, and honour, and glory, and blessing.", "r": "Revelation 5:12", "theme": "scripture"}, {"t": "And God shall wipe away all tears from their eyes; and there shall be no more death, neither sorrow, nor crying, neither shall there be any more pain: for the former things are passed away.", "r": "Revelation 21:4", "theme": "scripture"}, {"t": "And he that sat upon the throne said, Behold, I make all things new. And he said unto me, Write: for these words are true and faithful.", "r": "Revelation 21:5", "theme": "scripture"}, {"t": "I am Alpha and Omega, the beginning and the end, the first and the last.", "r": "Revelation 22:13", "theme": "scripture"}, {"t": "He which testifieth these things saith, Surely I come quickly. Amen. Even so, come, Lord Jesus.", "r": "Revelation 22:20", "theme": "scripture"}, {"t": "Speak unto all the congregation of the children of Israel, and say unto them, Ye shall be holy: for I the LORD your God am holy.", "r": "Leviticus 19:2", "theme": "scripture"}, {"t": "Thou shalt not avenge, nor bear any grudge against the children of thy people, but thou shalt love thy neighbour as thyself: I am the LORD.", "r": "Leviticus 19:18", "theme": "scripture"}, {"t": "The LORD bless thee, and keep thee:", "r": "Numbers 6:24", "theme": "scripture"}, {"t": "The LORD is longsuffering, and of great mercy, forgiving iniquity and transgression, and by no means clearing the guilty, visiting the iniquity of the fathers upon the children unto the third and fourth generation.", "r": "Numbers 14:18", "theme": "scripture"}, {"t": "And thou shalt love the LORD thy God with all thine heart, and with all thy soul, and with all thy might.", "r": "Deuteronomy 6:5", "theme": "scripture"}, {"t": "Be strong and of a good courage, fear not, nor be afraid of them: for the LORD thy God, he it is that doth go with thee; he will not fail thee, nor forsake thee.", "r": "Deuteronomy 31:6", "theme": "scripture"}, {"t": "And if it seem evil unto you to serve the LORD, choose you this day whom ye will serve; whether the gods which your fathers served that were on the other side of the flood, or the gods of the Amorites, in whose land ye dwell: but as for me and my house, we will serve the LORD.", "r": "Joshua 24:15", "theme": "scripture"}, {"t": "Have not I commanded thee? Be strong and of a good courage; be not afraid, neither be thou dismayed: for the LORD thy God is with thee whithersoever thou goest.", "r": "Joshua 1:9", "theme": "scripture"}, {"t": "And the angel of the LORD appeared unto him, and said unto him, The LORD is with thee, thou mighty man of valour.", "r": "Judges 6:12", "theme": "scripture"}, {"t": "Nevertheless the LORD raised up judges, which delivered them out of the hand of those that spoiled them.", "r": "Judges 2:16", "theme": "scripture"}, {"t": "And Ruth said, Intreat me not to leave thee, or to return from following after thee: for whither thou goest, I will go; and where thou lodgest, I will lodge: thy people shall be my people, and thy God my God:", "r": "Ruth 1:16", "theme": "scripture"}, {"t": "The LORD recompense thy work, and a full reward be given thee of the LORD God of Israel, under whose wings thou art come to trust.", "r": "Ruth 2:12", "theme": "scripture"}, {"t": "But the LORD said unto Samuel, Look not on his countenance, or on the height of his stature; because I have refused him: for the LORD seeth not as man seeth; for man looketh on the outward appearance, but the LORD looketh on the heart.", "r": "1 Samuel 16:7", "theme": "scripture"}, {"t": "Therefore Eli said unto Samuel, Go, lie down: and it shall be, if he call thee, that thou shalt say, Speak, LORD; for thy servant heareth. So Samuel went and lay down in his place.", "r": "1 Samuel 3:9", "theme": "scripture"}, {"t": "And thine house and thy kingdom shall be established for ever before thee: thy throne shall be established for ever.", "r": "2 Samuel 7:16", "theme": "scripture"}, {"t": "The beauty of Israel is slain upon thy high places: how are the mighty fallen!", "r": "2 Samuel 1:19", "theme": "scripture"}, {"t": "Behold, I have done according to thy words: lo, I have given thee a wise and an understanding heart; so that there was none like thee before thee, neither after thee shall any arise like unto thee.", "r": "1 Kings 3:12", "theme": "scripture"}, {"t": "And the angel of the LORD came again the second time, and touched him, and said, Arise and eat; because the journey is too great for thee.", "r": "1 Kings 19:7", "theme": "scripture"}, {"t": "And he answered, Fear not: for they that be with us are more than they that be with them.", "r": "2 Kings 6:16", "theme": "scripture"}, {"t": "And they said unto him, There came a man up to meet us, and said unto us, Go, turn again unto the king that sent you, and say unto him, Thus saith the LORD, Is it not because there is not a God in Israel, that thou sendest to enquire of Baalzebub the god of Ekron? therefore thou shalt not come down from that bed on which thou art gone up, but shalt surely die.", "r": "2 Kings 1:6", "theme": "scripture"}, {"t": "Give thanks unto the LORD, call upon his name, make known his deeds among the people.", "r": "1 Chronicles 16:8", "theme": "scripture"}, {"t": "Thine, O LORD, is the greatness, and the power, and the glory, and the victory, and the majesty: for all that is in the heaven and in the earth is thine; thine is the kingdom, O LORD, and thou art exalted as head above all.", "r": "1 Chronicles 29:11", "theme": "scripture"}, {"t": "If my people, which are called by my name, shall humble themselves, and pray, and seek my face, and turn from their wicked ways; then will I hear from heaven, and will forgive their sin, and will heal their land.", "r": "2 Chronicles 7:14", "theme": "scripture"}, {"t": "And he said, Hearken ye, all Judah, and ye inhabitants of Jerusalem, and thou king Jehoshaphat, Thus saith the LORD unto you, Be not afraid nor dismayed by reason of this great multitude; for the battle is not yours, but God's.", "r": "2 Chronicles 20:15", "theme": "scripture"}, {"t": "For upon the first day of the first month began he to go up from Babylon, and on the first day of the fifth month came he to Jerusalem, according to the good hand of his God upon him.", "r": "Ezra 7:9", "theme": "scripture"}, {"t": "And kept the feast of unleavened bread seven days with joy: for the LORD had made them joyful, and turned the heart of the king of Assyria unto them, to strengthen their hands in the work of the house of God, the God of Israel.", "r": "Ezra 6:22", "theme": "scripture"}, {"t": "Then he said unto them, Go your way, eat the fat, and drink the sweet, and send portions unto them for whom nothing is prepared: for this day is holy unto our Lord: neither be ye sorry; for the joy of the LORD is your strength.", "r": "Nehemiah 8:10", "theme": "scripture"}, {"t": "Then answered I them, and said unto them, The God of heaven, he will prosper us; therefore we his servants will arise and build: but ye have no portion, nor right, nor memorial, in Jerusalem.", "r": "Nehemiah 2:20", "theme": "scripture"}, {"t": "For if thou altogether holdest thy peace at this time, then shall there enlargement and deliverance arise to the Jews from another place; but thou and thy father's house shall be destroyed: and who knoweth whether thou art come to the kingdom for such a time as this?", "r": "Esther 4:14", "theme": "scripture"}, {"t": "Go, gather together all the Jews that are present in Shushan, and fast ye for me, and neither eat nor drink three days, night or day: I also and my maidens will fast likewise; and so will I go in unto the king, which is not according to the law: and if I perish, I perish.", "r": "Esther 4:16", "theme": "scripture"}, {"t": "And said, Naked came I out of my mother's womb, and naked shall I return thither: the LORD gave, and the LORD hath taken away; blessed be the name of the LORD.", "r": "Job 1:21", "theme": "scripture"}, {"t": "For I know that my redeemer liveth, and that he shall stand at the latter day upon the earth:", "r": "Job 19:25", "theme": "scripture"}, {"t": "Where wast thou when I laid the foundations of the earth? declare, if thou hast understanding.", "r": "Job 38:4", "theme": "scripture"}, {"t": "Let us hear the conclusion of the whole matter: Fear God, and keep his commandments: for this is the whole duty of man.", "r": "Ecclesiastes 12:13", "theme": "scripture"}, {"t": "To every thing there is a season, and a time to every purpose under the heaven:", "r": "Ecclesiastes 3:1", "theme": "scripture"}, {"t": "I am my beloved's, and my beloved is mine: he feedeth among the lilies.", "r": "Song of Solomon 6:3", "theme": "scripture"}, {"t": "Set me as a seal upon thine heart, as a seal upon thine arm: for love is strong as death; jealousy is cruel as the grave: the coals thereof are coals of fire, which hath a most vehement flame.", "r": "Song of Solomon 8:6", "theme": "scripture"}, {"t": "It is of the LORD'S mercies that we are not consumed, because his compassions fail not.", "r": "Lamentations 3:22", "theme": "scripture"}, {"t": "The LORD is good unto them that wait for him, to the soul that seeketh him.", "r": "Lamentations 3:25", "theme": "scripture"}, {"t": "A new heart also will I give you, and a new spirit will I put within you: and I will take away the stony heart out of your flesh, and I will give you an heart of flesh.", "r": "Ezekiel 36:26", "theme": "scripture"}, {"t": "And he said unto me, Son of man, can these bones live? And I answered, O Lord GOD, thou knowest.", "r": "Ezekiel 37:3", "theme": "scripture"}, {"t": "My God hath sent his angel, and hath shut the lions' mouths, that they have not hurt me: forasmuch as before him innocency was found in me; and also before thee, O king, have I done no hurt.", "r": "Daniel 6:22", "theme": "scripture"}, {"t": "He revealeth the deep and secret things: he knoweth what is in the darkness, and the light dwelleth with him.", "r": "Daniel 2:22", "theme": "scripture"}, {"t": "I will heal their backsliding, I will love them freely: for mine anger is turned away from him.", "r": "Hosea 14:4", "theme": "scripture"}, {"t": "For I desired mercy, and not sacrifice; and the knowledge of God more than burnt offerings.", "r": "Hosea 6:6", "theme": "scripture"}, {"t": "And it shall come to pass afterward, that I will pour out my spirit upon all flesh; and your sons and your daughters shall prophesy, your old men shall dream dreams, your young men shall see visions:", "r": "Joel 2:28", "theme": "scripture"}, {"t": "And rend your heart, and not your garments, and turn unto the LORD your God: for he is gracious and merciful, slow to anger, and of great kindness, and repenteth him of the evil.", "r": "Joel 2:13", "theme": "scripture"}, {"t": "But let judgment run down as waters, and righteousness as a mighty stream.", "r": "Amos 5:24", "theme": "scripture"}, {"t": "Surely the Lord GOD will do nothing, but he revealeth his secret unto his servants the prophets.", "r": "Amos 3:7", "theme": "scripture"}, {"t": "For the day of the LORD is near upon all the heathen: as thou hast done, it shall be done unto thee: thy reward shall return upon thine own head.", "r": "Obadiah 1:15", "theme": "scripture"}, {"t": "But upon mount Zion shall be deliverance, and there shall be holiness; and the house of Jacob shall possess their possessions.", "r": "Obadiah 1:17", "theme": "scripture"}, {"t": "But I will sacrifice unto thee with the voice of thanksgiving; I will pay that that I have vowed. Salvation is of the LORD.", "r": "Jonah 2:9", "theme": "scripture"}, {"t": "And should not I spare Nineveh, that great city, wherein are more than sixscore thousand persons that cannot discern between their right hand and their left hand; and also much cattle?", "r": "Jonah 4:11", "theme": "scripture"}, {"t": "He hath shewed thee, O man, what is good; and what doth the LORD require of thee, but to do justly, and to love mercy, and to walk humbly with thy God?", "r": "Micah 6:8", "theme": "scripture"}, {"t": "Therefore I will look unto the LORD; I will wait for the God of my salvation: my God will hear me.", "r": "Micah 7:7", "theme": "scripture"}, {"t": "The LORD is good, a strong hold in the day of trouble; and he knoweth them that trust in him.", "r": "Nahum 1:7", "theme": "scripture"}, {"t": "The LORD is slow to anger, and great in power, and will not at all acquit the wicked: the LORD hath his way in the whirlwind and in the storm, and the clouds are the dust of his feet.", "r": "Nahum 1:3", "theme": "scripture"}, {"t": "Behold, his soul which is lifted up is not upright in him: but the just shall live by his faith.", "r": "Habakkuk 2:4", "theme": "scripture"}, {"t": "Although the fig tree shall not blossom, neither shall fruit be in the vines; the labour of the olive shall fail, and the fields shall yield no meat; the flock shall be cut off from the fold, and there shall be no herd in the stalls: Yet I will rejoice in the LORD, I will joy in the God of my salvation.", "r": "Habakkuk 3:17-18", "theme": "scripture"}, {"t": "The LORD thy God in the midst of thee is mighty; he will save, he will rejoice over thee with joy; he will rest in his love, he will joy over thee with singing.", "r": "Zephaniah 3:17", "theme": "scripture"}, {"t": "Seek ye the LORD, all ye meek of the earth, which have wrought his judgment; seek righteousness, seek meekness: it may be ye shall be hid in the day of the LORD'S anger.", "r": "Zephaniah 2:3", "theme": "scripture"}, {"t": "Then spake Haggai the LORD'S messenger in the LORD'S message unto the people, saying, I am with you, saith the LORD.", "r": "Haggai 1:13", "theme": "scripture"}, {"t": "The glory of this latter house shall be greater than of the former, saith the LORD of hosts: and in this place will I give peace, saith the LORD of hosts.", "r": "Haggai 2:9", "theme": "scripture"}, {"t": "Then he answered and spake unto me, saying, This is the word of the LORD unto Zerubbabel, saying, Not by might, nor by power, but by my spirit, saith the LORD of hosts.", "r": "Zechariah 4:6", "theme": "scripture"}, {"t": "Sing and rejoice, O daughter of Zion: for, lo, I come, and I will dwell in the midst of thee, saith the LORD.", "r": "Zechariah 2:10", "theme": "scripture"}, {"t": "I have loved you, saith the LORD. Yet ye say, Wherein hast thou loved us? Was not Esau Jacob's brother? saith the LORD: yet I loved Jacob,", "r": "Malachi 1:2", "theme": "scripture"}, {"t": "Even from the days of your fathers ye are gone away from mine ordinances, and have not kept them. Return unto me, and I will return unto you, saith the LORD of hosts. But ye said, Wherein shall we return?", "r": "Malachi 3:7", "theme": "scripture"}, {"t": "But unto you that fear my name shall the Sun of righteousness arise with healing in his wings; and ye shall go forth, and grow up as calves of the stall.", "r": "Malachi 4:2", "theme": "scripture"}, {"t": "Jesus said unto him, If thou canst believe, all things are possible to him that believeth.", "r": "Mark 9:23", "theme": "scripture"}, {"t": "And he said unto them, Go ye into all the world, and preach the gospel to every creature.", "r": "Mark 16:15", "theme": "scripture"}, {"t": "And saying, The time is fulfilled, and the kingdom of God is at hand: repent ye, and believe the gospel.", "r": "Mark 1:15", "theme": "scripture"}, {"t": "For with God nothing shall be impossible.", "r": "Luke 1:37", "theme": "scripture"}, {"t": "The Spirit of the Lord is upon me, because he hath anointed me to preach the gospel to the poor; he hath sent me to heal the brokenhearted, to preach deliverance to the captives, and recovering of sight to the blind, to set at liberty them that are bruised,", "r": "Luke 4:18", "theme": "scripture"}, {"t": "For the Son of man is come to seek and to save that which was lost.", "r": "Luke 19:10", "theme": "scripture"}, {"t": "But ye shall receive power, after that the Holy Ghost is come upon you: and ye shall be witnesses unto me both in Jerusalem, and in all Judaea, and in Samaria, and unto the uttermost part of the earth.", "r": "Acts 1:8", "theme": "scripture"}, {"t": "And they continued stedfastly in the apostles' doctrine and fellowship, and in breaking of bread, and in prayers.", "r": "Acts 2:42", "theme": "scripture"}, {"t": "And they said, Believe on the Lord Jesus Christ, and thou shalt be saved, and thy house.", "r": "Acts 16:31", "theme": "scripture"}, {"t": "Charity suffereth long, and is kind; charity envieth not; charity vaunteth not itself, is not puffed up,", "r": "1 Corinthians 13:4", "theme": "scripture"}, {"t": "O death, where is thy sting? O grave, where is thy victory?", "r": "1 Corinthians 15:55", "theme": "scripture"}, {"t": "But as it is written, Eye hath not seen, nor ear heard, neither have entered into the heart of man, the things which God hath prepared for them that love him.", "r": "1 Corinthians 2:9", "theme": "scripture"}, {"t": "And he said unto me, My grace is sufficient for thee: for my strength is made perfect in weakness. Most gladly therefore will I rather glory in my infirmities, that the power of Christ may rest upon me.", "r": "2 Corinthians 12:9", "theme": "scripture"}, {"t": "We are troubled on every side, yet not distressed; we are perplexed, but not in despair;", "r": "2 Corinthians 4:8", "theme": "scripture"}, {"t": "Therefore if any man be in Christ, he is a new creature: old things are passed away; behold, all things are become new.", "r": "2 Corinthians 5:17", "theme": "scripture"}, {"t": "But the fruit of the Spirit is love, joy, peace, longsuffering, gentleness, goodness, faith,", "r": "Galatians 5:22", "theme": "scripture"}, {"t": "Stand fast therefore in the liberty wherewith Christ hath made us free, and be not entangled again with the yoke of bondage.", "r": "Galatians 5:1", "theme": "scripture"}, {"t": "I am crucified with Christ: nevertheless I live; yet not I, but Christ liveth in me: and the life which I now live in the flesh I live by the faith of the Son of God, who loved me, and gave himself for me.", "r": "Galatians 2:20", "theme": "scripture"}, {"t": "For by grace are ye saved through faith; and that not of yourselves: it is the gift of God:", "r": "Ephesians 2:8", "theme": "scripture"}, {"t": "Put on the whole armour of God, that ye may be able to stand against the wiles of the devil.", "r": "Ephesians 6:11", "theme": "scripture"}, {"t": "And be ye kind one to another, tenderhearted, forgiving one another, even as God for Christ's sake hath forgiven you.", "r": "Ephesians 4:32", "theme": "scripture"}, {"t": "I can do all things through Christ which strengtheneth me.", "r": "Philippians 4:13", "theme": "scripture"}, {"t": "Rejoice in the Lord alway: and again I say, Rejoice.", "r": "Philippians 4:4", "theme": "scripture"}, {"t": "Finally, brethren, whatsoever things are true, whatsoever things are honest, whatsoever things are just, whatsoever things are pure, whatsoever things are lovely, whatsoever things are of good report; if there be any virtue, and if there be any praise, think on these things.", "r": "Philippians 4:8", "theme": "scripture"}, {"t": "And let the peace of God rule in your hearts, to the which also ye are called in one body; and be ye thankful.", "r": "Colossians 3:15", "theme": "scripture"}, {"t": "Set your affection on things above, not on things on the earth.", "r": "Colossians 3:2", "theme": "scripture"}, {"t": "For by him were all things created, that are in heaven, and that are in earth, visible and invisible, whether they be thrones, or dominions, or principalities, or powers: all things were created by him, and for him:", "r": "Colossians 1:16", "theme": "scripture"}, {"t": "In every thing give thanks: for this is the will of God in Christ Jesus concerning you.", "r": "1 Thessalonians 5:18", "theme": "scripture"}, {"t": "Rejoice evermore. Pray without ceasing.", "r": "1 Thessalonians 5:16-17", "theme": "scripture"}, {"t": "But the Lord is faithful, who shall stablish you, and keep you from evil.", "r": "2 Thessalonians 3:3", "theme": "scripture"}, {"t": "And the Lord direct your hearts into the love of God, and into the patient waiting for Christ.", "r": "2 Thessalonians 3:5", "theme": "scripture"}, {"t": "But godliness with contentment is great gain.", "r": "1 Timothy 6:6", "theme": "scripture"}, {"t": "Fight the good fight of faith, lay hold on eternal life, whereunto thou art also called, and hast professed a good profession before many witnesses.", "r": "1 Timothy 6:12", "theme": "scripture"}, {"t": "All scripture is given by inspiration of God, and is profitable for doctrine, for reproof, for correction, for instruction in righteousness:", "r": "2 Timothy 3:16", "theme": "scripture"}, {"t": "I have fought a good fight, I have finished my course, I have kept the faith:", "r": "2 Timothy 4:7", "theme": "scripture"}, {"t": "For God hath not given us the spirit of fear; but of power, and of love, and of a sound mind.", "r": "2 Timothy 1:7", "theme": "scripture"}, {"t": "For the grace of God that bringeth salvation hath appeared to all men,", "r": "Titus 2:11", "theme": "scripture"}, {"t": "Unto the pure all things are pure: but unto them that are defiled and unbelieving is nothing pure; but even their mind and conscience is defiled.", "r": "Titus 1:15", "theme": "scripture"}, {"t": "I thank my God, making mention of thee always in my prayers,", "r": "Philemon 1:4", "theme": "scripture"}, {"t": "For we have great joy and consolation in thy love, because the bowels of the saints are refreshed by thee, brother.", "r": "Philemon 1:7", "theme": "scripture"}, {"t": "Now faith is the substance of things hoped for, the evidence of things not seen.", "r": "Hebrews 11:1", "theme": "scripture"}, {"t": "Jesus Christ the same yesterday, and to day, and for ever.", "r": "Hebrews 13:8", "theme": "scripture"}, {"t": "Wherefore seeing we also are compassed about with so great a cloud of witnesses, let us lay aside every weight, and the sin which doth so easily beset us, and let us run with patience the race that is set before us,", "r": "Hebrews 12:1", "theme": "scripture"}, {"t": "If any of you lack wisdom, let him ask of God, that giveth to all men liberally, and upbraideth not; and it shall be given him.", "r": "James 1:5", "theme": "scripture"}, {"t": "For as the body without the spirit is dead, so faith without works is dead also.", "r": "James 2:26", "theme": "scripture"}, {"t": "Confess your faults one to another, and pray one for another, that ye may be healed. The effectual fervent prayer of a righteous man availeth much.", "r": "James 5:16", "theme": "scripture"}, {"t": "Casting all your care upon him; for he careth for you.", "r": "1 Peter 5:7", "theme": "scripture"}, {"t": "Because it is written, Be ye holy; for I am holy.", "r": "1 Peter 1:16", "theme": "scripture"}, {"t": "But sanctify the Lord God in your hearts: and be ready always to give an answer to every man that asketh you a reason of the hope that is in you with meekness and fear:", "r": "1 Peter 3:15", "theme": "scripture"}, {"t": "According as his divine power hath given unto us all things that pertain unto life and godliness, through the knowledge of him that hath called us to glory and virtue:", "r": "2 Peter 1:3", "theme": "scripture"}, {"t": "The Lord is not slack concerning his promise, as some men count slackness; but is longsuffering to us-ward, not willing that any should perish, but that all should come to repentance.", "r": "2 Peter 3:9", "theme": "scripture"}, {"t": "And we have known and believed the love that God hath to us. God is love; and he that dwelleth in love dwelleth in God, and God in him.", "r": "1 John 4:16", "theme": "scripture"}, {"t": "We love him, because he first loved us.", "r": "1 John 4:19", "theme": "scripture"}, {"t": "If we confess our sins, he is faithful and just to forgive us our sins, and to cleanse us from all unrighteousness.", "r": "1 John 1:9", "theme": "scripture"}, {"t": "And now I beseech thee, lady, not as though I wrote a new commandment unto thee, but that which we had from the beginning, that we love one another.", "r": "2 John 1:5", "theme": "scripture"}, {"t": "Look to yourselves, that we lose not those things which we have wrought, but that we receive a full reward.", "r": "2 John 1:8", "theme": "scripture"}, {"t": "I have no greater joy than to hear that my children walk in truth.", "r": "3 John 1:4", "theme": "scripture"}, {"t": "Beloved, I wish above all things that thou mayest prosper and be in health, even as thy soul prospereth.", "r": "3 John 1:2", "theme": "scripture"}, {"t": "Keep yourselves in the love of God, looking for the mercy of our Lord Jesus Christ unto eternal life.", "r": "Jude 1:21", "theme": "scripture"}, {"t": "Now unto him that is able to keep you from falling, and to present you faultless before the presence of his glory with exceeding joy,", "r": "Jude 1:24", "theme": "scripture"}, {"t": "And my soul shall be joyful in the LORD: it shall rejoice in his salvation.", "r": "Psalm 35:9", "theme": "scripture"}, {"t": "Then will I go unto the altar of God, unto God my exceeding joy: yea, upon the harp will I praise thee, O God my God.", "r": "Psalm 43:4", "theme": "scripture"}, {"t": "But let all those that put their trust in thee rejoice: let them ever shout for joy, because thou defendest them: let them also that love thy name be joyful in thee.", "r": "Psalm 5:11", "theme": "scripture"}, {"t": "Restore unto me the joy of thy salvation; and uphold me with thy free spirit.", "r": "Psalm 51:12", "theme": "scripture"}, {"t": "Light is sown for the righteous, and gladness for the upright in heart.", "r": "Psalm 97:11", "theme": "scripture"}, {"t": "They that sow in tears shall reap in joy.", "r": "Psalm 126:5", "theme": "scripture"}, {"t": "The hope of the righteous shall be gladness: but the expectation of the wicked shall perish.", "r": "Proverbs 10:28", "theme": "scripture"}, {"t": "Glory and honour are in his presence; strength and gladness are in his place.", "r": "1 Chronicles 16:27", "theme": "scripture"}, {"t": "Therefore with joy shall ye draw water out of the wells of salvation.", "r": "Isaiah 12:3", "theme": "scripture"}, {"t": "And the ransomed of the LORD shall return, and come to Zion with songs and everlasting joy upon their heads: they shall obtain joy and gladness, and sorrow and sighing shall flee away.", "r": "Isaiah 35:10", "theme": "scripture"}, {"t": "Therefore the redeemed of the LORD shall return, and come with singing unto Zion; and everlasting joy shall be upon their head: they shall obtain gladness and joy; and sorrow and mourning shall flee away.", "r": "Isaiah 51:11", "theme": "scripture"}, {"t": "For ye shall go out with joy, and be led forth with peace: the mountains and the hills shall break forth before you into singing, and all the trees of the field shall clap their hands.", "r": "Isaiah 55:12", "theme": "scripture"}, {"t": "To appoint unto them that mourn in Zion, to give unto them beauty for ashes, the oil of joy for mourning, the garment of praise for the spirit of heaviness; that they might be called trees of righteousness, the planting of the LORD, that he might be glorified.", "r": "Isaiah 61:3", "theme": "scripture"}, {"t": "Then shall the virgin rejoice in the dance, both young men and old together: for I will turn their mourning into joy, and will comfort them, and make them rejoice from their sorrow.", "r": "Jeremiah 31:13", "theme": "scripture"}, {"t": "Yet I will rejoice in the LORD, I will joy in the God of my salvation.", "r": "Habakkuk 3:18", "theme": "scripture"}, {"t": "I say unto you, that likewise joy shall be in heaven over one sinner that repenteth, more than over ninety and nine just persons, which need no repentance.", "r": "Luke 15:7", "theme": "scripture"}, {"t": "These things have I spoken unto you, that my joy might remain in you, and that your joy might be full.", "r": "John 15:11", "theme": "scripture"}, {"t": "Hitherto have ye asked nothing in my name: ask, and ye shall receive, that your joy may be full.", "r": "John 16:24", "theme": "scripture"}, {"t": "And now come I to thee; and these things I speak in the world, that they might have my joy fulfilled in themselves.", "r": "John 17:13", "theme": "scripture"}, {"t": "Whom having not seen, ye love; in whom, though now ye see him not, yet believing, ye rejoice with joy unspeakable and full of glory:", "r": "1 Peter 1:8", "theme": "scripture"}, {"t": "Before I formed thee in the belly I knew thee; and before thou camest forth out of the womb I sanctified thee, and I ordained thee a prophet unto the nations.", "r": "Jeremiah 1:5", "theme": "scripture"}, {"t": "The LORD will perfect that which concerneth me: thy mercy, O LORD, endureth for ever: forsake not the works of thine own hands.", "r": "Psalm 138:8", "theme": "scripture"}, {"t": "I will cry unto God most high; unto God that performeth all things for me.", "r": "Psalm 57:2", "theme": "scripture"}, {"t": "The steps of a good man are ordered by the LORD: and he delighteth in his way.", "r": "Psalm 37:23", "theme": "scripture"}, {"t": "Thine eyes did see my substance, yet being unperfect; and in thy book all my members were written, which in continuance were fashioned, when as yet there was none of them.", "r": "Psalm 139:16", "theme": "scripture"}, {"t": "A man's heart deviseth his way: but the LORD directeth his steps.", "r": "Proverbs 16:9", "theme": "scripture"}, {"t": "There are many devices in a man's heart; nevertheless the counsel of the LORD, that shall stand.", "r": "Proverbs 19:21", "theme": "scripture"}, {"t": "Man's goings are of the LORD; how can a man then understand his own way?", "r": "Proverbs 20:24", "theme": "scripture"}, {"t": "Declaring the end from the beginning, and from ancient times the things that are not yet done, saying, My counsel shall stand, and I will do all my pleasure:", "r": "Isaiah 46:10", "theme": "scripture"}, {"t": "Listen, O isles, unto me; and hearken, ye people, from far; The LORD hath called me from the womb; from the bowels of my mother hath he made mention of my name.", "r": "Isaiah 49:1", "theme": "scripture"}, {"t": "Ye have not chosen me, but I have chosen you, and ordained you, that ye should go and bring forth fruit, and that your fruit should remain: that whatsoever ye shall ask of the Father in my name, he may give it you.", "r": "John 15:16", "theme": "scripture"}, {"t": "Moreover whom he did predestinate, them he also called: and whom he called, them he also justified: and whom he justified, them he also glorified.", "r": "Romans 8:30", "theme": "scripture"}, {"t": "In whom also we have obtained an inheritance, being predestinated according to the purpose of him who worketh all things after the counsel of his own will:", "r": "Ephesians 1:11", "theme": "scripture"}, {"t": "For we are his workmanship, created in Christ Jesus unto good works, which God hath before ordained that we should walk in them.", "r": "Ephesians 2:10", "theme": "scripture"}, {"t": "Being confident of this very thing, that he which hath begun a good work in you will perform it until the day of Jesus Christ:", "r": "Philippians 1:6", "theme": "scripture"}, {"t": "For it is God which worketh in you both to will and to do of his good pleasure.", "r": "Philippians 2:13", "theme": "scripture"}, {"t": "For this cause we also, since the day we heard it, do not cease to pray for you, and to desire that ye might be filled with the knowledge of his will in all wisdom and spiritual understanding;", "r": "Colossians 1:9", "theme": "scripture"}, {"t": "Who hath saved us, and called us with an holy calling, not according to our works, but according to his own purpose and grace, which was given us in Christ Jesus before the world began,", "r": "2 Timothy 1:9", "theme": "scripture"}, {"t": "But when it pleased God, who separated me from my mother's womb, and called me by his grace,", "r": "Galatians 1:15", "theme": "scripture"}, {"t": "Make you perfect in every good work to do his will, working in you that which is wellpleasing in his sight, through Jesus Christ; to whom be glory for ever and ever. Amen.", "r": "Hebrews 13:21", "theme": "scripture"}, {"t": "For David, after he had served his own generation by the will of God, fell on sleep, and was laid unto his fathers, and saw corruption:", "r": "Acts 13:36", "theme": "scripture"}, {"t": "For every one that asketh receiveth; and he that seeketh findeth; and to him that knocketh it shall be opened.", "r": "Matthew 7:8", "theme": "scripture"}, {"t": "Again I say unto you, That if two of you shall agree on earth as touching any thing that they shall ask, it shall be done for them of my Father which is in heaven.", "r": "Matthew 18:19", "theme": "scripture"}, {"t": "For where two or three are gathered together in my name, there am I in the midst of them.", "r": "Matthew 18:20", "theme": "scripture"}, {"t": "And all things, whatsoever ye shall ask in prayer, believing, ye shall receive.", "r": "Matthew 21:22", "theme": "scripture"}, {"t": "Therefore I say unto you, What things soever ye desire, when ye pray, believe that ye receive them, and ye shall have them.", "r": "Mark 11:24", "theme": "scripture"}, {"t": "And I say unto you, Ask, and it shall be given you; seek, and ye shall find; knock, and it shall be opened unto you.", "r": "Luke 11:9", "theme": "scripture"}, {"t": "For every one that asketh receiveth; and he that seeketh findeth; and to him that knocketh it shall be opened.", "r": "Luke 11:10", "theme": "scripture"}, {"t": "And whatsoever ye shall ask in my name, that will I do, that the Father may be glorified in the Son.", "r": "John 14:13", "theme": "scripture"}, {"t": "If ye shall ask any thing in my name, I will do it.", "r": "John 14:14", "theme": "scripture"}, {"t": "If ye abide in me, and my words abide in you, ye shall ask what ye will, and it shall be done unto you.", "r": "John 15:7", "theme": "scripture"}, {"t": "And in that day ye shall ask me nothing. Verily, verily, I say unto you, Whatsoever ye shall ask the Father in my name, he will give it you.", "r": "John 16:23", "theme": "scripture"}, {"t": "And call upon me in the day of trouble: I will deliver thee, and thou shalt glorify me.", "r": "Psalm 50:15", "theme": "scripture"}, {"t": "He shall call upon me, and I will answer him: I will be with him in trouble; I will deliver him, and honour him.", "r": "Psalm 91:15", "theme": "scripture"}, {"t": "The LORD is nigh unto all them that call upon him, to all that call upon him in truth.", "r": "Psalm 145:18", "theme": "scripture"}, {"t": "He will fulfil the desire of them that fear him: he also will hear their cry, and will save them.", "r": "Psalm 145:19", "theme": "scripture"}, {"t": "And it shall come to pass, that before they call, I will answer; and while they are yet speaking, I will hear.", "r": "Isaiah 65:24", "theme": "scripture"}, {"t": "And I will bring the third part through the fire, and will refine them as silver is refined, and will try them as gold is tried: they shall call on my name, and I will hear them: I will say, It is my people: and they shall say, The LORD is my God.", "r": "Zechariah 13:9", "theme": "scripture"}, {"t": "And this is the confidence that we have in him, that, if we ask any thing according to his will, he heareth us:", "r": "1 John 5:14", "theme": "scripture"}, {"t": "And if we know that he hear us, whatsoever we ask, we know that we have the petitions that we desired of him.", "r": "1 John 5:15", "theme": "scripture"}, {"t": "Then shall ye call upon me, and ye shall go and pray unto me, and I will hearken unto you.", "r": "Jeremiah 29:12", "theme": "scripture"}, {"t": "And whatsoever we ask, we receive of him, because we keep his commandments, and do those things that are pleasing in his sight.", "r": "1 John 3:22", "theme": "scripture"}, {"t": "As the Father hath loved me, so have I loved you: continue ye in my love.", "r": "John 15:9", "theme": "scripture"}, {"t": "For the Father himself loveth you, because ye have loved me, and have believed that I came out from God.", "r": "John 16:27", "theme": "scripture"}, {"t": "I in them, and thou in me, that they may be made perfect in one; and that the world may know that thou hast sent me, and hast loved them, as thou hast loved me.", "r": "John 17:23", "theme": "scripture"}, {"t": "And hope maketh not ashamed; because the love of God is shed abroad in our hearts by the Holy Ghost which is given unto us.", "r": "Romans 5:5", "theme": "scripture"}, {"t": "But God commendeth his love toward us, in that, while we were yet sinners, Christ died for us.", "r": "Romans 5:8", "theme": "scripture"}, {"t": "Who shall separate us from the love of Christ? shall tribulation, or distress, or persecution, or famine, or nakedness, or peril, or sword?", "r": "Romans 8:35", "theme": "scripture"}, {"t": "For I am persuaded, that neither death, nor life, nor angels, nor principalities, nor powers, nor things present, nor things to come,", "r": "Romans 8:38", "theme": "scripture"}, {"t": "Nor height, nor depth, nor any other creature, shall be able to separate us from the love of God, which is in Christ Jesus our Lord.", "r": "Romans 8:39", "theme": "scripture"}, {"t": "But God, who is rich in mercy, for his great love wherewith he loved us,", "r": "Ephesians 2:4", "theme": "scripture"}, {"t": "And to know the love of Christ, which passeth knowledge, that ye might be filled with all the fulness of God.", "r": "Ephesians 3:19", "theme": "scripture"}, {"t": "And walk in love, as Christ also hath loved us, and hath given himself for us an offering and a sacrifice to God for a sweetsmelling savour.", "r": "Ephesians 5:2", "theme": "scripture"}, {"t": "O give thanks unto the LORD; for he is good: for his mercy endureth for ever.", "r": "Psalm 136:1", "theme": "scripture"}, {"t": "Since thou wast precious in my sight, thou hast been honourable, and I have loved thee: therefore will I give men for thee, and people for thy life.", "r": "Isaiah 43:4", "theme": "scripture"}, {"t": "For the mountains shall depart, and the hills be removed; but my kindness shall not depart from thee, neither shall the covenant of my peace be removed, saith the LORD that hath mercy on thee.", "r": "Isaiah 54:10", "theme
