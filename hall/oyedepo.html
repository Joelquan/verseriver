l Is", "In the business teaching of Success Buttons chapter five, Oyedepo uses deliberately small numbers to make a permanent point about wisdom and scale. A man whose capital is tiny cannot, on the strength of faith and power, enter a trade whose entry cost dwarfs his capital, because nobody will even notice his goods, and prayer will not repair the arithmetic. Likewise, a man whose total output is smaller than the rent of the shop he wants will go bankrupt in that shop, and fasting will not change figures that wisdom could have read in advance. The counsel that follows is the constructive half of the lesson: apply yourself based on what you have, believe God from your actual level, manage yourself wisely for increase, and start where you are, small as it may be. Greater heights are not denied. They are sequenced. Capital improves, capacity grows, and the vision that could not be started at full size can be entered at honest size and grown. This protects faith from presumption. Faith, in this book, is not a device for ignoring scale. It is confidence in God operating inside wise application, and Oyedepo insists that many things believers call spiritual warfare are simply the predictable results of starting at the wrong size. Wisdom is profitable to direct precisely because it directs beginnings as well as ambitions.", "I start at the honest size my capital and capacity allow, manage it wisely for increase, and I grow toward the full vision in sequence."], ["Discipline and Hard Work: Right Thing, Right Time, Right Rate", "Success Buttons closes its verified lessons with the place of discipline and hard work alongside wisdom. The distinction drawn is useful: wisdom is knowing what to do in a specific situation, while discipline is the ability to bring yourself, or train yourself, to actually do it. A disciplined person is described as doing the right thing at the right time and at the rate it should be done, which adds timing and pace to mere correctness. Many failures are right things done late, or right things done at half rate until the season closed. Discipline therefore trains the body and the mind to be subject to the direction of the Spirit through the Word, so that knowledge is not betrayed by appetite, mood or delay. Hard work stands beside it as the training ground of success. Oyedepo uses sportsmen as the picture: the more they train, the better they perform, and no area of life exempts a man from that law. Laziness and idleness are named as the requirement for failure, which is to say failure has a recipe as reliable as the recipe for success. Put together, the three form the closing charge of the book: wisdom decides, discipline executes on schedule, and hard work builds the strength that execution requires, and the combination is expected to produce an explosion of good in a life that practises all three.", "I train myself to do the right thing at the right time and at the right rate, and I work hard like an athlete in training."]]}, {"title": "In Pursuit of Vision: Securing, Proving and Running With What God Showed You", "intro": "These teachings draw on In Pursuit of Vision and on the verified contents of its companion volume Understanding Vision, published by Dominion Publishing House. Bishop David Oyedepo treats vision as a divine insight into the plan of God that must be secured carefully, proved by the Word alone, guarded from false tests, and then pursued at cost until it becomes a ministry and a reality.", "cards": [["Vision Is Not a Dream or a Trance", "Understanding Vision opens by clearing away a confusion Oyedepo considered dangerous: in the church of his day, virtually every dream of the night was being mistaken for a vision, and self styled prophets were using vision as bait to trap the unwary. Against that background he defines the subject soberly. Vision means to see, and in this context to see ahead: an insight into the plan of God for a nation, a group or an individual. It is not ecstasy, not a trance performance and not a shadow to chase from one prophet to another. The stakes are set by the ancient warning that where there is no vision the people perish, a word the book explains as being stripped of honour and dignity rather than simply dying. Vision is therefore presented as the pathway to honour and dignity, the asset that lets a man know where he is going and what to do to get there. That knowledge generates the confidence the book describes at length: visionaries run with set faces and fixed eyes because their end is clear from their beginning. The first service of the teaching is protection. A believer who can tell a vision from a dream stops auctioning his destiny to every night experience and every visiting voice, and starts seeking the one thing actually promised to carry him: a clear insight into the plan of God.", "I refuse to call every dream a vision, and I seek a clear insight into the plan of God as the pathway to honour in my life."], ["Your Particular Function Is Your Vision", "Understanding Vision defines vision through the picture of a body. Every believer, the book teaches, has a peculiar plan and a particular function assigned before he was born, the way every member of a body has its own work. A discovery of that function is what is called vision, and carrying out that divine assignment is what is called ministry. Ministry, in this frame, is not limited to the pulpit. Joseph was sent to preserve lives in Egypt, Gideon was called to deliver a nation rather than to preach, and Abraham was established as an institution through whom families would be blessed. Occupying your assigned position is ministry, whatever the position is. Oyedepo also insists that no calling is of low status. Every part of a king body shares the honour of the king, and every function in the body of Christ, faithfully located and performed, culminates in glory. This corrects the comparison that ruins many believers: envying the visible functions while despising the particular one actually assigned. The book ties the future of the believer to this discovery. A man never becomes a star, in its language, until he operates within the scope of the plan of God for his life, and he cannot operate in a scope he has never bothered to locate.", "I locate my particular function in the body and occupy it without envy, because my assigned position is my ministry and my road to glory."], ["Vision Ends Struggle and Gives Stability", "Understanding Vision lists the importance of vision in practical terms, and the first benefit named is that vision puts an end to a life of struggle. The reasoning is direct: God enables a man to perform in the area He has assigned him, so the man working inside his assignment often makes progress with a seeming ease that the same man could never find outside it. Struggle, in this diagnosis, is frequently a location problem rather than a capacity problem. The gifted man in the wrong field labours like a fish on land, sincere, exhausted and convinced that life is hard by design. Vision gives stability for the same reason. A man who knows where he is heading has a goal, walks with purposeful strides instead of beating the air, and is not blown about by every wind of doctrine or every successful looking distraction. His attitude and his actions change because his reference point is fixed. Oyedepo illustrates the end time army of God as men on horses, each marching in his own path without thrusting against another, faces set toward a specific mission. The picture is corporate but the lesson is personal: stability is not a temperament some people are born with. It is the natural condition of a person who has discovered where he is going and has stopped auditioning for other people assignments.", "I work inside the area God assigned me and keep my face set on it, because vision ends my struggle and gives my life stability."], ["Vision Is From God, Ambition Is From Earth", "Understanding Vision draws its sharpest line between vision and ambition. Every true vision comes from God. Ambition is man made. Vision is from above; ambition has its origin on earth, born of a drive to do better than others and fed largely by envy and by hunger for power and self recognition. The book is severe about where ambition leads when it rules a man: it can justify pulling others down, and in its extreme historical form it produced a dictator whose earthly ambition made no evil too great in pursuit of ruling the world. Against that it sets a man with a heavenly vision who gave everything to put smiles on the faces of war orphans, looking to God alone and never needing to steal, defraud or beg to sustain the work. The contrast is the test. Vision and ambition can look similar in their early energy, because both produce driven men. They differ in source, in method and in fruit. Vision can wait for God, serve people and refuse crooked means, because its author is heaven. Ambition cannot wait, cannot serve without calculating, and cannot refuse a shortcut, because its only author is the self. Oyedepo adds that the source of a vision speaks loudest at the end: if it is God, good fruit is made manifest in time.", "I test my drive by its source, its methods and its fruit, and I refuse ambition dressed as vision wherever I find it in myself."], ["Secure a Vision: Realise, Seek and Watch", "Understanding Vision teaches that a genuine vision comes from God, but man has a part to play in securing it. The part is broken into steps a believer can actually practise. First, realise your need to know your vision: a man who feels no need will not seek, and a man who will not seek should not expect to find. Second, see the willingness of God to reveal His plan: the seeker is not trying to extract a secret from a reluctant God, but receiving from a Father who ordains plans and delights to make them known to His own. Third, seek God in prayer, the deliberate asking and waiting in which vision is normally delivered. Fourth, be watchful, because spiritual truths often arrive as tiny seeds that can be ignored if a man is not watchful: a sentence in a sermon, a verse that will not leave the heart, a burden that keeps returning. Many visions were not refused. They were missed, arriving smaller than the seeker expected and leaving while he waited for something more dramatic. The steps together describe a posture: hungry, prayerful and alert. Oyedepo treats that posture as the normal way destinies are located, which means vision is neither a lottery for the lucky nor a performance by the dramatic. It is secured, in order, by people who do their part.", "I do my part to secure my vision: I admit my need, I seek God in prayer, and I stay watchful for the small seeds He sends."], ["Prove a Vision by the Word Alone", "Understanding Vision gives tools for proving a vision, and the first tool is named as the only authentic one: the word of God. When a believer receives what he believes is a vision, he is to illuminate his spirit in the Word for backing before he steps out, gaining a double assurance that it is from God, because God will only back what He says. This protects the believer in both directions. A genuine vision will find its foundation in Scripture, in principle and in promise, and can be pursued with a settled conscience. A false impression, carried honestly into the light of the Word, quietly loses its authority before it can spend the believer money, years or reputation. The proving is not a search for a verse that can be stretched to fit a desire. It is an examination of whether the whole counsel of God stands behind the direction. Oyedepo treats this as non negotiable because the cost of an unproved vision is paid in real life: in relocations, resignations, marriages and ministries launched on a feeling. The Word is also the safest examiner because it cannot be flattered. People can be persuaded to approve what they sense you want to hear. The text simply says what it says, to the excited and to the calm alike, which is why the book sends every vision there first.", "I carry every vision into the light of the Word for backing before I step out, because God only backs what He has said."], ["Identify the Voice and Ascertain the Content", "Two further proving tools in Understanding Vision concern the details of what was received. The believer is to identify the personality behind the voice, and to ascertain the content of the vision, being inquisitive about it and asking God everything up to the minutest detail. Identification comes first because not every spiritual sounding voice is the voice of God, and the character of the speaker is evidence: the God who speaks in peace, in holiness and in agreement with His Word is distinguishable from the voice that flatters sin, breeds confusion or contradicts Scripture. Ascertaining the content follows, because a genuine sender is not offended by questions. Oyedepo encourages the believer to interrogate his own vision the way a careful man interrogates a contract: what exactly is the assignment, where does it apply, when does it begin, what are its limits, and what is not part of it. Vagueness is treated as a warning sign. Men launch on a general impression and then improvise the details in the flesh, blaming God later for specifics He never gave. A proved vision, by contrast, can be written down, examined, prayed over and shared with counsellors because its content has been ascertained rather than assumed. Detail is not a lack of faith. In this teaching, detail is the respect faith pays to the seriousness of what it is about to build.", "I identify the personality behind every voice I hear and I ask God for the content of my vision down to the smallest detail."], ["Guard Against Fleeces and the Confirmation of People", "Understanding Vision names two things to guard against while proving a vision: fleeces and people confirmation. A fleece, in this warning, is the habit of setting up signs and conditions for God to perform before the believer will move, a practice the book treats as a trap rather than a tool, because it substitutes negotiated signals for the solid backing of the Word and the witness of peace. People confirmation is the second trap: running from person to person collecting approvals, until the loudest or the latest opinion quietly becomes the real authority over the vision. Oyedepo directs the believer to look to God alone, trusting that He will verify His own vision for the one He gave it to. This is not a ban on counsel, which his wider teaching honours. It is a ban on outsourcing the verdict. Counsellors can advise, warn and instruct, but the confirmation of a vision is a transaction between God and the receiver, and it loses its strength when it is crowdsourced. The danger of people confirmation is subtle: a vision approved by everyone may simply be a vision edited by everyone, trimmed of everything that made it heavenly. The book leaves the receiver standing where he belongs, alone enough with God to know what he heard, and settled enough to proceed when people change their minds, as people reliably do.", "I look to God alone to verify my vision, taking counsel as advice but refusing to let fleeces or the approval of people carry the verdict."], ["Peace, the Acid Test of a Genuine Vision", "Understanding Vision names an acid test for a genuine vision: peace. The test is drawn from the promise that God will speak peace to His people, and Oyedepo uses it as a final internal examination after the Word has backed the vision and its content has been ascertained. A direction from God, however demanding, carries a settled peace at its centre: not excitement, not relief at having an impressive story, but a quiet assurance that survives prayer, scrutiny and time. A direction that produces persistent inner turmoil, dread or a pressured haste that cannot wait for confirmation is treated as suspect, however attractive it looks. The acid test metaphor is exact. Acid does not negotiate with a metal. It reveals what the metal is. Peace does the same for a vision, exposing the difference between the calm weight of a God given assignment and the restless energy of ambition, fear or suggestion. Oyedepo is careful, though: peace is a test, not a substitute for the other tests. A peaceful feeling about something the Word forbids is not a vision, and a demanding vision can disturb a man comfort while still carrying peace about its source. The test is applied last and together with the Word, which is why it works. Examined by Scripture and settled in peace, a vision can be run with for decades.", "I apply the acid test of peace to every direction I receive, and I only run with what is backed by the Word and settled in my spirit."], ["Spiritual Sensitivity Is a Birthright", "Understanding Vision teaches that the believer who will matter in this end time is the one who is led by the Holy Spirit, and it makes a claim that changes the pursuit of guidance entirely: hearing the voice of God is not a gift for a few but a birthright of the believer. A birthright is not earned, begged for or awarded to the impressive. It belongs to a son by virtue of birth, and it is exercised, lost or neglected by the son himself. Spiritual sensitivity, in this teaching, is therefore a capacity every believer already has and is responsible to develop, the way an heir is responsible for an estate he did not create. The man who says God never speaks to him is, in this frame, usually a man whose sensitivity has been dulled by noise, haste and disobedience, not a man excluded from the family conversation. That is hopeful and rebuking at once. Hopeful, because no believer needs to wait for a special endowment before he can be led. Rebuking, because dullness now has an owner. Oyedepo connects sensitivity directly to usefulness: the led believer moves at the right time, into the right place, with the right word, while the insensitive believer, however gifted, keeps arriving late to his own life with excellent explanations.", "I treat hearing God as my birthright as a son, and I take responsibility for developing my spiritual sensitivity instead of calling myself excluded."], ["Quietness, Worship and Meekness", "Understanding Vision names the practical conditions in which spiritual sensitivity grows: quietness, worship and meekness. Quietness is to be practised on the inside and on the outside, a deliberate stilling of the environment and of the inner noise, because a voice as gentle as the leading of the Spirit is rarely heard over a life at full volume. Worship follows, with psalms and hymns named as good instruments of worship, because worship tunes the heart to the frequency of heaven: a man cannot spend real time honouring God and remain as deaf as a man who spends that time only demanding from God. Meekness completes the three, defined as coming to God on the platform of nothingness, devoid of so called knowledge, ready to be taught rather than ready to argue. The combination is a small rule of life. Quietness removes the competition. Worship sets the direction of the heart. Meekness removes the resistance. Oyedepo is describing how ordinary believers, in kitchens and in studies rather than only in retreats, become people who can be trusted with direction: they make room, they honour God, and they arrive empty enough to be filled. Sensitivity, it turns out, is less a talent to admire in others than a set of conditions anyone can practise before breakfast.", "I practise quietness inside and outside, I worship with psalms and hymns, and I come to God in meekness ready to be taught."], ["Planning Is Part of Pursuing", "Understanding Vision gives planning a named place in the life of a vision, anchoring it in the picture of a house established by understanding and filled with knowledge. Oyedepo treats planning as a spiritual act rather than a secular addition to faith. A vision received from God deserves the dignity of a plan: stages, costs, people, timing and resources considered honestly before they are needed desperately. The man who refuses to plan is not trusting God more than the planner. He is usually asking God to fund his disorder, and then calling the predictable collapse a mystery. In the wider argument of the vision books, planning is also how a large vision becomes runnable. Written plainly and broken into order, a vision that would frighten a man as a whole can be pursued by him in parts, and other people can read it and run with it because the running order exists. This is where the famous instruction to write the vision plainly does its work in practice. Paper forces honesty. A plan on paper exposes the missing money, the missing skill and the missing year, while there is still time to acquire all three in faith. Oyedepo own record of institutions built from fields is presented across his teaching as the long fruit of this habit: vision supplied the picture, and planning, honoured as part of the pursuit, supplied the road.", "I honour planning as part of my pursuit, writing the vision plainly and breaking it into stages, costs and timing while faith supplies the road."], ["The Appointed Time Is Not the Call Time", "Understanding Vision insists on a time element in every vision from God, and warns that the time God calls a man is not necessarily the time for him to step out. Timing, in this teaching, is determined by God alone, and stepping out early is not faith but presumption wearing faith clothing. Two long apprenticeships carry the argument. John the Baptist knew his mission before he was born, yet he remained in the deserts until the day of his showing to Israel, growing strong in spirit in obscurity. Jesus knew His mission and still waited thirty years, carrying out ordinary work, before launching out after baptism. If those two waited for an appointed time, the book reasons, no modern believer is exempt from the discipline. The waiting is not wasted. It is where the man is grown to the size of the vision, where character, skill and spiritual weight are built in private for a work that will be examined in public. Premature launching harms twice: it exposes an unready man, and it can discredit a genuine vision that was only ever guilty of being early. Oyedepo counsel is to get the appointed time from the same God who gave the vision, and to walk in it, neither lagging in fear once it arrives nor sprinting in ambition before it does.", "I wait for the appointed time of my vision as John and Jesus waited, growing in private until God Himself says the day of showing has come."], ["The Appointed Place Can Be a Place, a Person or a Mission", "Alongside the appointed time, Understanding Vision teaches an appointed place. The whole earth belongs to God, the book grants, but God has an appointed place for each man, and that place can take forms a seeker may not expect: it may be a geographical place, it may be a person to serve or to learn from, or it may be a mission to attach to, and each one constitutes a location in the plan of God. This widens the search for direction in a useful way. A believer asking only for a city may miss a man. A believer asking only for a platform may miss a season of serving inside someone else assignment, which was his appointed place for that decade. Location in this teaching is about alignment, not scenery: the place where the grace on a life works, where doors are prepared, and where the vision can be nourished rather than merely displayed. It also explains why copying another man location fails. His place was appointed for his assignment, and the same soil that grows him may starve a visitor with a different seed. Oyedepo sends the believer back to God with a better question than where is success happening. The better question is where have You appointed me, in place, in person or in mission, for this season of the vision.", "I ask God for my appointed place in its true form, whether a location, a person to serve, or a mission to join for this season."], ["Pursuit Turns a Vision Into a Ministry", "The pursuit chapter carried in Pillars of Destiny and at the heart of In Pursuit of Vision states the law without decoration: a vision received must be pursued, otherwise the man ends a failure no matter how grand the vision was. A vision that is not pursued will follow its owner to the grave. Vision without pursuit is mere wishes, and the book borrows the physics of rest to explain it: nothing happens to a situation, a desire or a vision that a man does nothing about, because every object stays at rest until a force is applied. Action is the word. No action, no accomplishment, and actors, in this blunt vocabulary, are winners. Oyedepo also removes the favourite excuses. No reason is to be strong enough to stop the pursuit, and he sets the sluggard who would not plough because of the cold, and begged in harvest with nothing, as the permanent warning against weather based obedience. Pursuit will disrupt comfort, require sacrifice and risk, and demand leaving the known for the unknown, which is precisely why so many genuine visions are admired and so few are accomplished. Understanding Vision adds the definition that completes the thought: a vision does not become a ministry until it is pursued. The pursuit is the ministry. Everything before it is preparation, however beautiful.", "I pursue my vision with applied force, accepting sacrifice and the unknown, because a vision only becomes a ministry when it is pursued."], ["For Every Vision There Is a Provision", "Understanding Vision closes its argument with the assurance that for every vision there is a provision: God will not reveal a plan without the resources to match it. The reasoning goes further and turns inward. A man who has received a vision from the Lord has, within himself, much of what it takes to accomplish it, because the gift God placed in him is part of the provision. What makes a gift a gift of God, the book stresses, is neither the strength nor the smartness of the man. It is God. This protects the visionary from two paralysing comparisons: waiting to become someone else before he starts, and concluding that his small gift disqualifies a large assignment. The provision doctrine also disciplines the starting of things. In Pursuit of Vision is remembered, in accounts of Oyedepo teaching, for his honesty about beginning things God never told him to begin and suffering through them: channels created without instruction must be fended for out of the owner pocket, because God prospers what He commands. Provision is therefore attached to instruction, not to enthusiasm. The believer is left with a workable confidence. If God gave the vision, the resources exist, beginning with the gift already in his hand, and his task is pursuit in the appointed place and time, not anxiety about a supply heaven has already assigned.", "I trust that the vision God gave me carries its provision, beginning with the gift already in my hand, and I only build what He has commanded."]]}, {"cards": [["A World With No Limits", "Oyedepo opens The Unlimited Power of Faith by presenting faith as a spiritual force that opens humanity to a world of unlimited possibilities. In his framing, faith is a world of no limits, because the God it connects a person to has no limits. The natural world runs on visible limits: money runs out, bodies weaken, experts close cases, and time expires. Faith refuses to treat those limits as the final boundary of a life. It introduces a higher order of possibility, drawn from heaven, into ordinary circumstances on earth. This is why he calls faith the very substance of Christianity rather than one topic inside it. Everything else in the Kingdom is accessed through this door. A believer who is weak here will be weak everywhere, because his connection to every other provision runs through believing. A believer who grows here finds doors opening that effort alone could not force. The teaching also carries a warning. A world of no limits is not a world of no responsibility. The same faith that removes limits demands engagement, obedience, and growth. Limits fall for the person who will believe and act, not for the person who only admires the idea of believing.", "I live as a citizen of a world with no limits, and I refuse to let visible limits set the boundary of my life."], ["Faith Powers the Vision You Carry", "In the introduction to The Unlimited Power of Faith, Oyedepo separates three things that many people confuse. Vision defines the mission, the destination, and the purpose of a life. Dedication sets the pace at which a person moves toward that destination. But faith is what powers the whole journey from one phase of the assignment to the next. An assignment without faith, he warns, is heading for a crash, because it takes the hand of God to deliver a mandate to its fullest, and faith is the link between the called person and the Caller. When faith is out of place, there is no connection, and the calling itself becomes a burden instead of a joy. Ministry without faith remains barren, however sincere the worker. This explains why two people can carry similar visions and produce very different results. The difference is rarely the size of the picture. It is the quality and strength of the faith employed to drive it. Results in the pursuit of a heavenly vision are, in his teaching, a function of the faith at work in the person carrying it. So the first investment in any vision is not publicity or money. It is faith, built until the vision has an engine.", "I build my faith first, because I know my vision will only travel as far as the faith powering it."], ["Faith Generates Proofs", "Oyedepo teaches that the essence of faith is the generation of proofs. When faith is at work, a life begins to command evidence: at home, at work, in journeys, in children, and in family. Things that had been stagnated begin to enjoy motion. He points to the catalogue of Hebrews chapter eleven, where every good report recorded was generated by faith and nothing else. The elders obtained a good report by it, which means faith is the master key to a world of good reports. This gives the believer a simple test for his own believing. Faith that produces nothing over time should not be defended; it should be examined. Real faith leaves evidence behind it the way a real fire leaves heat. The proofs are not produced to impress people, though people will see them. They are the natural signature of a connection with God that is actually flowing. Where the connection is genuine, virtue flows, and where virtue flows, results follow. He is careful to describe the faith he means: Bible based, Word provoked, and Word fired. Sentimental optimism generates wishes. This kind of faith generates proofs, and the proofs in turn strengthen the faith of everyone watching.", "I expect my faith to generate proofs, and I examine my believing honestly whenever no evidence is following it."], ["The Foolishness of Faith Wins", "The first chapter of The Unlimited Power of Faith is devoted to what Oyedepo calls the foolishness of faith. Many instructions of Scripture do not look rational to the natural mind. Giving away what you have is presented as the road to increase. Thanking God before anything changes is presented as the road to answers. Filling water pots is presented as the road to wine. He argues that inside these seemingly irrational demands lies the power of God that delivers results to the believer and decorates destinies. The natural man calls it foolishness because he judges by arithmetic and appearance. The believer learns to judge by the integrity of the One who gave the instruction. The pattern he draws from case after case is consistent: people who were not ashamed to obey an instruction that looked foolish were not put to shame by the outcome. Their mockers often became their seekers. The lesson is not that reason is an enemy. It is that reason is not the highest court. When God has spoken, the instruction carries its own wisdom, and obedience is the reasonable response even when the step looks unreasonable. Faith, in this chapter, is the winning ticket in the race of life precisely because it acts before it can explain.", "I obey instructions from God even when they look foolish to natural reasoning, because I trust the wisdom inside them."], ["Scattering That Increases", "Within the foolishness of faith, Oyedepo lingers on one paradox of Scripture: a person can scatter and yet increase, while another withholds what he should release and drifts toward poverty. Natural arithmetic says that five minus three leaves two, and it cannot imagine any other outcome. The covenant arithmetic of the Kingdom works by a different law, the law of seed and harvest. What is released in obedience is not lost; it is planted, and planted things return multiplied after their kind. What is clutched in fear is not protected; it is kept out of the only process that could have multiplied it. This teaching is not an excuse for carelessness or for giving without wisdom. It is aimed at the fear that calls hoarding prudence. The believer is taught to see his resources the way a farmer sees seed corn. Eating all of it feels safe for one meal and guarantees an empty field in the next season. Sowing some of it feels like loss for a day and builds the harvests of coming years. Faith, here, is the courage to release what God directs you to release, in the measure He directs, trusting the law He built into His Kingdom more than the fear in your chest.", "I release what God directs me to release, trusting the law of seed and harvest more than the fear of loss."], ["The Instruction That Looks Wrong", "Oyedepo gathers several Bible scenes around one lesson: the instruction that looks wrong is often the doorway to the miracle. Servants at a wedding were told to fill water pots when wine was the need, and then to serve that water to the chairman of the feast. A man born blind was sent to wash in a pool with clay on his eyes, looking worse than when he came. A leprous commander was told to wash seven times in a muddy river when he expected a dramatic ceremony. In each case the instruction offended logic, pride, or dignity, and in each case obedience to it produced what logic could not. He draws the principle plainly: whatever God tells you to do, do it, and do not celebrate merely coming close to the point He named. Near obedience is still disobedience in effect, because the virtue is attached to the exact instruction. The servants filled the pots to the brim. The blind man went to the named pool. The commander finally washed the stated number of times. Faith is not shown by discussing the instruction, improving it, or substituting a grander one. It is shown by carrying it out as given, and letting the result argue for you.", "I carry out the exact instruction God gives me, even when it offends my logic or my pride, and I let the result speak."], ["Faith Is a Spiritual Force, Not a Mental One", "In the chapter asking what faith is, Oyedepo insists that faith is not a psychological force and not a philosophical one. It is a spiritual force, a spiritual virtue that operates within the spirit of a man and not merely in his head. A person believes with the heart, and that location matters for everything that follows. Mental agreement can recite correct doctrine while producing nothing, because the head can be persuaded by an argument today and unpersuaded by a stronger argument tomorrow. Faith seated in the spirit is different. It is a living force drawn from the living Word, and it silences opposition instead of debating with it endlessly. This is why positive thinking, however useful as a habit, is not a substitute for faith. Thinking manages the mind. Faith engages the spirit, connects it to God, and draws virtue from that connection. It also explains why faith cannot be copied from the surface of another person. You can imitate their words with your head in an afternoon. Their faith lives in their spirit, built by their own history with the Word, and yours must be built the same way. The school of faith is therefore a school of the spirit first.", "I build faith in my spirit through the Word, and I stop mistaking mental agreement for real believing."], ["The Spiritual Chemistry of Faith", "Oyedepo uses a striking picture for how faith works: he calls it a spiritual chemistry. Every time faith is at work, a spiritual connection is established, and that connection provokes a flow of virtue from God into the situation. His example is the woman who touched the garment of Jesus in a pressing crowd. Many people touched Him physically that day and nothing was recorded. One person touched Him with faith, and virtue flowed out of Him into her body, and the flow of blood that had defeated physicians for years stopped immediately. The touch was the same; the connection was different. Faith was the conductor. This picture teaches the believer where to focus. The issue is not how loudly you can reach for God but whether a real connection has been made between your spirit and His power. Where that connection exists, virtue flows to destroy the enemy work and to release what belongs to you. Where it does not exist, religious activity can be busy and still powerless. Practically, he teaches people to come to a definite point of faith on a definite issue, the way that woman came with one clear expectation, because a defined connection draws a defined flow.", "I press past religious activity into a real connection of faith, because I know virtue flows where faith truly connects."], ["Faith, a Living Force From the Living Word", "Faith, in Oyedepo teaching, is a living force drawn from the living Word to produce living proofs. It is not a dead doctrine stored in a notebook, and it is not merely believing that God can do something at some time. It moves a person to do something now to prove that he believes. That movement is the sign of life in it. The woman in his central example did not stay at home agreeing that Jesus could heal. She pressed through a crowd, spent her strength, and reached for the connection, and a living proof came out of it: her affliction stopped on the spot. Dead faith stays seated and calls its stillness patience. Living faith may wait on God for direction, but once direction comes it acts, and its acting commits God to perform. He also draws the two sided effect of this force. Faith is the way to move God in your favour, and it is the way to stop the adversary from stopping you. The same shield that quenches fiery darts is the same faith that obtains promises. A believer therefore guards this force the way he guards his physical heart, because everything in his Christian life is pumped by it.", "I keep my faith alive by acting on the Word, knowing that living faith moves me and produces living proofs."], ["Labouring in the Word to Build Faith", "One of the most repeated sentences in The Unlimited Power of Faith is that faith is no cheap talk; faith is hard work. Oyedepo teaches that a person does not wish for faith but works at faith, labouring in the Word of God the way a worker labours at a trade. Faith draws from a Word bank, a reservoir built inside a person by settled study. When a challenge arrives, faith can only draw what has been deposited. An empty reservoir explains many collapses that people blame on the size of the battle. He describes his own deposits in concrete terms: days of labour in the Word to enter the faith for one area of life, then days more for another area, because faith for one subject does not automatically cover every subject. Diligence is the price of increase. Faith does not increase in the life of the idle; it increases in the life of the diligent, and without spiritual diligence a person remains spiritually poor however loudly he confesses. The encouragement inside the demand is that this labour is open to anyone. No special background is required to sit with the Word, hear it, and keep hearing it until faith rises.", "I labour in the Word diligently and deposit it daily, so my faith has something to draw from in every battle."], ["A Great Profession, Not a Mere Confession", "Oyedepo draws a line that runs through the whole book: faith is no mere confession; faith is a great profession. Confessing, in his distinction, is all about speaking. Professing is all about manifesting, demonstrating, and practising the skill that has been acquired. A profession requires definite skills, and skills require training, exercise, and growth. Nobody is rated in a profession by how well he talks about it. He is rated by what he can actually do when the work is in front of him. Applied to faith, this corrects a common error. People settled for declaring that what they confess they possess, and then kept confessing without possessing, because the practising half of faith was missing. The practice of faith plus the confession of faith is what results in possession. A man can confess prosperity for years and remain outside its covenant practice of working, giving, and honesty, and his confession alone will not carry him in. In the same way, repentance, obedience, and action are the profession that gives confession its credibility. The counsel is to grow in the profession on purpose: stay in the school of faith, exercise your senses by use, and let your rating rise.", "I practise what I confess until my faith is a skilled profession, not a slogan I repeat without results."]], "intro": "This part goes deeper into The Unlimited Power of Faith, the book in which Oyedepo calls faith the most potent force in the universe and the capital his ministry draws on. It stays with the opening chapters, where he defines faith before he applies it, so the reader learns what faith is, what it is not, and why it must be built rather than assumed.", "title": "The Unlimited Power of Faith: What Faith Is"}, {"cards": [["Rest, the Evidence That Faith Has Arrived", "Oyedepo names one eternal evidence of faith: rest. Since a believer does not know the exact day an expectation will arrive, anxiety would be natural if faith were absent, and that is precisely the point. Rest is how a person can prove to himself whether he has actually arrived at faith on an issue or is only hoping loudly. The Hebrew youths entered a furnace without panic. Daniel entered a den of lions without a struggle recorded. In his own teaching he describes hearing a Word about his family before he was married, and then refusing years later to treat a contrary report as a crisis, because he had already entered rest in that area. Rest is not carelessness and it is not denial. It is the settled state of a person who has laboured in the Word until the promise became more real than the threat. He also warns that preparation belongs before the battle. You build strength against the day of adversity; you do not begin preparing on the war front. The practical fruit is sleep, steadiness, and the end of frantic checking. A person in rest has stopped digging up the seed to see whether it is growing.", "I labour in the Word until I enter rest on each issue, and I treat my rest as the evidence that faith has arrived."], ["One Currency in Every Nation", "Among the values of faith, Oyedepo lists one that comforts people who feel disadvantaged by birthplace or background: faith is a universal currency. It carries the same purchasing power in every nation of the earth, because it draws on the omnipotence and the integrity of God rather than on any local system. The same Lord is rich to all who call on Him, so the currency does not devalue when it crosses a border and it does not inflate away across generations. He tells of a visitor asking how everything at his ministry headquarters is paid for, and his one word answer was faith. The explanation followed: the results faith delivers in one place are the same order of results it delivers anywhere a believer operates it. This kills two errors. The first is the belief that your location has disqualified you. The second is the habit of envying believers elsewhere, as if God issued them a stronger currency. What differs between people is not the currency but the level of faith each person is operating, and levels can grow. Faith is also presented as an appreciating asset, the most enduring investment in the Kingdom, which makes building it a rational long term decision.", "I operate my faith confidently where I am, knowing it holds the same value in my nation as anywhere on earth."], ["Strength Borrowed From God", "Oyedepo calls faith a spiritual energizer. His example is Sarah, who through faith received strength to conceive when she was far past the natural age for it, because she judged the One who promised to be faithful. The strength did not come from her body, her diet, or her circumstances. It entered her through believing, and it accomplished in her what natural standards had ruled impossible. He generalises the pattern: exploits demand strength, and faith is the energy source of the believer for doing exploits. A tired, empty person facing a large assignment does not first need a smaller assignment. He needs the energy that faith supplies, drawn from God Himself. This is also why he compares faith to the heart. If the biological heart fails, the body dies, however healthy the other organs look. If the spiritual heart fails, the spirit of a man dies, however busy his religious life appears. Guarding, protecting, building, and nourishing faith is therefore not an advanced topic. It is basic survival and basic power at once. The believer who feels too weak for what God has asked should not wait to feel strong before believing. In this teaching, believing is how the strength arrives.", "I draw strength from God through faith for what exceeds my natural strength, instead of waiting to feel strong first."], ["Conventional Faith, Supernatural Faith", "In the chapter contrasting conventional and supernatural faith, Oyedepo distinguishes two operations. Conventional faith is the product of the Word of faith: it comes by hearing, it confesses what it has heard, and it produces regular results. Supernatural faith goes further. It is a speaking faith, carried by the Spirit of faith, in which God speaks to a person and the person makes bold declarations based on what God has said, and then has what he says. While conventional faith confesses, supernatural faith professes, demonstrating as well as declaring. He is plain that some things will not come by the regular operation alone. Certain results require the violence and authority of the supernatural dimension. This is presented as the security of a vision: when supernatural faith is absent, a great vision can quietly die of delay and opposition. The contrast is not meant to despise the conventional level, which is the foundation and the school. It is meant to stop a believer from settling there when his assignment demands more. Growth in faith is therefore directional: from principles learned, to confidence built, to a Spirit carried operation in which a person is in command of situations instead of merely coping with them.", "I grow past regular believing into supernatural faith, because I know my assignment needs more than coping."], ["The Violence of Faith", "Oyedepo teaches that the Kingdom is taken by a determined force, and he applies that picture to faith itself. Some inheritances do not arrive for people who only believe politely. They arrive for people whose faith has a holy violence in it: a refusal to be turned away, a willingness to press through crowds, decrees, and delays without surrendering the promise. This violence is never directed at people. It is directed at resistance, at resignation, and at every settled negative verdict standing between a believer and what the Word has assigned him. He pictures supernatural faith as the kind that puts a person in total control in the middle of conflicts, quenching the darts thrown at him instead of merely surviving them. A person operating this way does not practise how to speak in a crisis. The faith inside him answers on the spot, because it was built before the crisis came. The teaching rebukes a passive posture that calls every surrender humility. There is a kind of waiting that is faith, and there is a kind of folding that is unbelief wearing religious clothes, and violent faith knows the difference. Where the Word has spoken clearly, this faith contends until the physical facts agree.", "I contend with determined faith for what the Word assigns me, and I refuse to surrender it to resistance or delay."], ["Faith Comes in Degrees", "A whole chapter of The Unlimited Power of Faith is given to the degrees of faith. Oyedepo asks why the faith of one person produces and the faith of another does not, and he answers that Bible faith is in degrees. Scripture speaks of little faith, of great faith, and of a supernatural dimension, and the difference between them is not the sincerity of the people. The difference is insight. Little insight produces little faith. Great insight produces great faith. Supernatural insight produces supernatural faith. They deliver according to their degrees the way different strengths of current deliver different amounts of power. This framing removes both pride and despair. The person with small results is not condemned; he is located. His faith is at a degree, and degrees can rise as his insight into the Word deepens. The person with large results is not a favourite of heaven; he has simply seen more, and what he has seen compels a stronger believing. It also means a believer should stop comparing his degree with another person and start attending to the real variable, which is his own revelation of the Word on the matter at hand. Faith grows by upgrades in seeing.", "I raise my degree of faith by deepening my insight into the Word, instead of comparing my results with anyone else."], ["Seeing It Makes Believing Natural", "In his teaching on the degrees of faith, Oyedepo calls revelation the greatest asset in the school of faith. His reasoning is simple: only what you see ever truly becomes yours, because whatever you see, you automatically believe. A person in his right mind does not struggle to believe what he is looking at. Struggle belongs to the territory of hearsay. When the Word moves a matter from information into revelation, when a person sees his own name, as it were, inside a promise, doubt loses its argument without a debate. He adds the sequence that follows. What you see, you believe. What you believe, you say, boldly and without rehearsal, because no threat can easily silence a person about what he has seen. And what you say in that settled way is what you come to have. This is why the enemy works at blinding minds. A blinded mind can hear the same verse for years and answer that it cannot see it, and what a person cannot believe he cannot become. The pastoral response is prayer for open eyes and patient meditation, asking God to show you the things written concerning you in the Book, the way Jesus found the place where it was written of Him.", "I pray for open eyes and meditate until I see myself in the promise, because what I truly see I naturally believe."], ["The Spirit of Faith Speaks the Unspeakable", "Oyedepo describes the Spirit of faith as the prompting of the Holy Spirit that stirs up the faith in a person when a challenge comes. It is not premeditated. As opposition arises, the manifestation is triggered, like a force that was loaded in advance and fires on time. Its first mark is speech. Faith under this Spirit speaks the unspeakable: it talks against fire as if talking against air, declares a building finished while the deadline still looks impossible, and answers a death report with the language of life. The three Hebrew youths are his standing example, speaking calm defiance before a furnace and coming out without even the smell of fire on their clothes. Such speech is not bravado, and it is not denial of the facts in view. It is speech drawn from a higher fact, the promise of God, delivered with the confidence of someone who has already settled the outcome in his spirit. He notes that people who carry this Spirit do not practise their lines for a crisis. The words rise because the well is full. The practical pursuit is therefore not learning dramatic phrases. It is staying so full of the Word and the Spirit that, when the moment comes, your mouth reports your faith instead of your fear.", "I stay full of the Word and the Spirit, so that in any crisis my mouth speaks faith instead of fear."], ["The Spirit of Faith Dares and Conquers", "Beyond speech, Oyedepo lists what the Spirit of faith does in action. It dares the undareable, energizing spirit, soul, and body so that a person can face what others flee from, the way Daniel faced a den of lions without harm. It conquers the unconquerable, the way Moses confronted a nation and a sea at an advanced age and watched both give way. And it achieves the unachievable, the way an army reduced to three hundred men overran a host that should have swallowed it. His summary is that faith is the master key to a world of strange achievements, results that cannot be explained by the resources visible at the start. He applies the pattern to his own history without embarrassment, describing a move from a city into a forest associated with witchcraft, with no vehicles and no visible support, after which the work simply grew and never stopped. The point of such telling is not biography. It is permission. If faith explains those outcomes, then the same faith, at work in an ordinary believer, explains outcomes beyond his visible resources too. The size of the starting point is not the deciding factor in this economy. The presence of working faith is.", "I dare, confront, and attempt what God assigns me, trusting faith to achieve results beyond my visible resources."], ["Word of Faith, Gift of Faith, Spirit of Faith", "Oyedepo sets out three levels in the school of faith. The Word of faith teaches you the principles. The gift of faith helps you understand the Word of faith, giving explosive spiritual understanding of what you have been taught. The Spirit of faith drives the principles into productivity, so that what a person knows begins to happen in his life without constant pushing. The difference shows in endurance. Principles alone cannot carry a man through a twenty five year wait for a promise; when the delay stretches, principles crash, and only a Spirit carried faith stays standing and stable in the storm. He pictures many believers as pushers, straining to move their lives the way a man pushes a car without fuel, while a few have become riders, carried by the Spirit that makes the Word work. His own account follows the levels in order: years of reading and hearing the Word of faith, then the gift coming alive as understanding, then a distinct impartation of the Spirit of faith after which struggle gave way to riding. The levels are not ranks for boasting. They are a map for hunger, showing a believer exactly what to crave next when his knowledge has outgrown his results.", "I refuse to stop at principles, and I crave the Spirit of faith that drives what I know into productivity."], ["Faith Delivers in Phases", "A reason many people lose their miracles, in Oyedepo teaching, is that they do not know faith delivers in a process. He uses the picture of a seed cast into the ground. The earth brings forth first the blade, then the ear, then the full corn in the ear, and only when the fruit is ripe does the farmer put in the sickle. The Word of God received into a life behaves the same way. It is a seed sown, and it grows in stages that are mostly invisible at first. The Spirit of faith is what a person needs in the waiting process, to believe that what he received is alive and growing while it is still inside the earth and nothing has germinated above the surface. He tells of believing for prosperity when the visible income of his work was very small, yet knowing the seed was sown and would flourish stage by stage if it was nurtured. The danger he names is abortion in the process: a person receives something real from God, meets a frightening sign, panics, speaks against his own expectation, and loses in fear what he conceived in faith. Patience here is not passivity. It is guarding the seed through every phase until harvest.", "I guard what I have received from God through every hidden phase, and I refuse to abort in panic what I conceived in faith."]], "intro": "This part follows the middle chapters of The Unlimited Power of Faith, where Oyedepo teaches that faith operates in degrees, that insight sets those degrees, and that beyond the principles of faith there is a Spirit of faith that must be received. It closes with his chapter on the nature of faith itself.", "title": "The Unlimited Power of Faith: Degrees, Spirit and Nature"}, {"cards": [["Three Dimensional Faith", "Oyedepo teaches a three dimensional faith: faith in God, faith in His Word, and faith in His prophets. The three are presented as one structure rather than three separate options. Faith in God without His Word has no content to stand on. Faith in the Word is anchored because the Word is the documented will of the God who is believed. And faith in His prophets honours the human channels God has chosen for delivering His Word and His instructions to people in their generation. A person who claims the first two while despising the third often finds himself refusing the very voice through which the Word he needs is being delivered. The three dimensions together, he says, guarantee mastery over the challenges of life, because the believer is connected to God personally, to His written counsel permanently, and to His present messengers practically. The teaching also protects against imbalance in the other direction. A prophet is believed as a carrier of the Word, not as a replacement for God or for Scripture. Each dimension checks and completes the others. Where all three stand, faith has a Father to trust, a constitution to cite, and a voice to heed, and that combination is difficult for any circumstance to withstand for long.", "I hold faith in God, faith in His Word, and faith in His messengers together, and I let none of the three stand alone."], ["The Heart Is the Base of Operations", "In the chapter on the operational base of faith, Oyedepo locates faith precisely: it operates in the inner man, the spirit of the new creation. A person believes with the heart, and does not doubt in his heart, so the state of the inner man determines the dimension of faith that person can carry. He uses the picture of a heavy shield. A shield can only be carried by a person strong enough to lift it, and the shield of faith is carried by the spirit. A weak, starved spirit cannot wield the weapons of this warfare, however correct the doctrine around it sounds. This reframes many defeats. The problem is often not the weapon and not the enemy. It is the condition of the carrier. Israel in his example was armed and organised yet could not approach one giant, while a young man with a robust spirit and a simple sling settled the matter in a day. The practical conclusion is that building the inner man is not a side interest for especially spiritual people. It is the main preparation for every battle a believer expects to win. Conquest begins with strength in the inner man, and victory is only ever the outward report of an inward condition.", "I treat the strength of my inner man as my main preparation, because my faith can only operate at the level my spirit can carry."], ["Building the Muscles of the Spirit", "Oyedepo develops the operational base into a training programme. Spiritual muscles are built the same way physical muscles are built: by quality nutrition and quality exercise. The nutrition is the Word of God in its forms, which he lists as water that washes, milk that nourishes the young, meat for the mature, strong meat for those of full age, and even wine that stirs a person into bold speech. The exercise is the use of faith itself, acting on what has been fed, because senses are trained by reason of use. A wrestler was not born with his build; he built it to match his goal, and no believer should expect a spiritual build he has never trained for. Keeping the heart is the daily discipline at the centre of it: attending to the Word, keeping it before the eyes and in the midst of the heart, because out of the heart flow the issues of life. A merry, Word fed heart becomes medicine to the whole person, while a broken and neglected spirit dries the bones. He leaves no excuse standing. There is one Spirit, one faith, and one God for everyone, and the only variable a person truly controls is his own build up.", "I feed on the Word in all its forms and exercise my faith by use, building spiritual muscle on purpose every day."], ["Victory, Healing and Wonders Are Its Products", "In the chapter on faith products, Oyedepo names three fundamental things to expect when faith is put to work: all round victory, all manner of healings, and all conceivable signs and wonders. Victory means faith delivers a person from curses, harassment, and defeat, seating him above the field where those things operate instead of under it. Healing means faith delivers the body, as virtue from a healing Scripture flows into the person who releases faith on it, the way a lame man rose when an apostle perceived he had faith to be healed. Signs and wonders mean faith puts a person in command of outcomes that make observers ask how it happened, in a business, a career, or a trade, flourishing where others wither. The three products belong together. A believer is not asked to choose between being protected, being whole, and being a wonder to his world. His practical instruction for a confrontation is to go to the storehouse of the Word and take the specific instrument of faith that the specific issue requires, because results are according to faith and according to insight. Faith, in this chapter, is not vague optimism about everything. It is a stocked arsenal, used deliberately.", "I expect victory, healing, and wonders as the normal products of my faith, and I take the specific Word each issue requires."], ["Drop Every Human Alternative", "Within the products of faith, Oyedepo names what he calls the greatest enemy of faith: human alternatives. God can bring people your way, and He does, but He will not stand a person making any man his defence or his source. The moment expectation is divided between God and a human channel, the divine hand withdraws, because God will not share His glory with any man. He illustrates it with the two eyes. A person cannot make one eye look up and the other look down at the same time, and every time a believer looks elsewhere for his real hope, he is no longer looking to God, whatever his lips are saying in prayer. His own ministry practice follows the teaching: no known sponsor anywhere since its inception, because expectation was placed on God alone, and God accepted full responsibility for the assignment He had given. The counsel is not to refuse help, despise people, or break relationships. It is to refuse slavery to any of them as your source. People may be channels. They must never become the fountain. A single eye, fixed on God as the only source of hope and expectation, is presented as the posture heaven answers.", "I make God my only source and drop every human alternative, receiving people as channels but never as my fountain."], ["Willing, Able and Ready", "The covenant platform for a winning faith, in Oyedepo teaching, rests on three settled convictions about God. God is willing: the question of His will was answered when a leper asked whether He was willing to make him clean and was told plainly that He was, and His stated priority is that His people prosper and be in health. God is able: the One who raised a man four days dead, fed thousands from a small lunch, and furnished a table in a wilderness for forty years does not meet a case that exceeds His capacity. God is ready: He is the I AM, not stronger, kinder, or readier tomorrow than He is today, and He always causes His people to triumph now, not eventually. With those three standing, the only remaining variable is the faith of the person, because nothing commits God to make good His promise like faith. Until a person believes, God is not committed in that case, however willing, able, and ready He is. The platform turns prayer from persuasion into positioning. You are not convincing a reluctant God. You are taking your stand on what He has already declared about Himself, and committing Him by believing.", "I stand on the platform that God is willing, able, and ready, and I commit Him to perform by my believing."], ["Patience, a Proof of Authentic Faith", "When Oyedepo lists the proofs of authentic faith, patience comes first. The one who believes, Scripture says, shall not make haste, and the record agrees. Noah built toward a flood for about a hundred years between the warning and the water. Abraham waited twenty five years between the promise and the son, and after he had patiently endured, he obtained the promise. Patience, in this teaching, is not waiting with anxiety, checking the calendar, and announcing that if it were going to happen it would have happened by now. That restless waiting is named as its opposite. Patience is stability while waiting: holding the same confession, keeping the same obedience, and refusing to dig up in doubt what was planted in faith. It matters because most of what people call faith is tested by time rather than by opposition. The adversary can often afford simply to wait for a believer to talk himself out of his own expectation. Faith joined with patience cannot be waited into surrender. The pairing also honours the God of the promise, who appointed not only the outcome but its season. A believer who has this proof can be recognised easily: delay has not changed his language, his giving, or his praise.", "I join patience to my faith and stay stable in confession and obedience, however long the promise takes to land."], ["Dedication That Does Not Bow", "The second proof of authentic faith is dedication: an undying commitment to God that is not driven by things. Oyedepo is blunt that God is a Father, not a business partner or a heavenly banker, and authentic faith treats Him accordingly. Its test case is the three youths before a furnace, who declared that their God was able to deliver them and would deliver them, and that even if the outcome differed from their hope, they would still not bow to another god. That is dedication: what God does or does not do on a given day does not move the person, because his root is in God, who is the same in all circumstances. Daniel showed the same proof when a decree made his prayer life a capital offence and he prayed anyway, and was delivered because he believed in his God. Abraham showed it when dedication prevailed over the hardest test of his life and carried generations after him into blessing. The contrast drawn is with a fair weather faith that is up today and down tomorrow, which Oyedepo calls a faith sickness needing treatment. A dedicated person is recognisable by sameness: fire, delay, and loss do not renegotiate his loyalty.", "I stay dedicated to God in every circumstance, loyal to Him for who He is and not only for what He gives."], ["Joy and Peace That Prove Believing", "Two more proofs of authentic faith are joy and peace. Joy, in this teaching, is the believer rejoicing with a joy that cannot be fully spoken, because faith rejoices in the realities of the unseen, and there is no limit to the unseen. Where faith is genuinely present, depression finds no easy lodging, because the person is celebrating a reality larger than the one troubling him. A city that received the Word in his example was marked by great joy, and he treats that as the expected atmosphere wherever faith is preached and believed. Peace is the companion proof. God fills the believer with joy and peace in believing, and the one who has entered into rest has ceased from his own frantic works, the way God ceased from His. Anxiety ends and curiosity about how and when is terminated. He testifies to sleeping soundly under the weight of an enormous assignment, working long hours and sleeping comprehensively in the hours available, because peace guards the schedule that anxiety would destroy. These proofs are diagnostic gifts. A believer does not have to guess whether his faith is authentic. He can check his atmosphere: persistent joylessness and sleepless anxiety are information, pointing him back to the Word until believing produces its climate again.", "I check my atmosphere as a proof of faith, and I return to the Word until joy and peace govern me again."], ["The Good Fight of Faith", "Oyedepo teaches that entering a promised land always involves a fight, and that the fight is the good fight of faith. The paradox he draws from Scripture is that God can give a people a land and in the same sentence command them to begin to possess it and contend in battle for it. The gift is real, and the opposition is real, and the second fact does not cancel the first. Prophecies likewise do not fulfil themselves while a person watches; they are warred into fulfilment with the very words that were spoken. He insists that life is a battlefield and not a playground, and that a person must become warfare conscious to enjoy welfare. The weapon of the fight is faith itself. The same faith that stops the opposition also gains access to the possession: it quenches the darts, addresses the mountain without doubting, and believes in prayer that it receives. Underneath the fighting stands power. Conquest is a function of power displayed, and faith is the channel that converts the Word of God into power, causing opposition to bow and destiny to be released. The pastoral pressure is against opting out. The fight is on whether a person enlists or not, and the unready simply become casualties of a war they refused to recognise.", "I fight the good fight of faith for my inheritance, knowing it is given to me and still must be possessed by contending."], ["Faith, Hope and Love, the Trinity of Triumph", "The closing movement of The Unlimited Power of Faith gathers faith, hope, and love together and calls them the trinity of triumph, three forces that operate in unison. Hope prepares the way for faith; it is the breeding ground in which the Spirit of faith is raised. A hopeless person is a helpless person, because faith can only give substance to things that are hoped for, and where hope stops, faith has nothing left to work on. Redemption restores a lively hope, an expectation kept alive by the resurrection, so that no case is closed until the person himself closes it. His example is a mother whose miracle son died at noon and who answered every enquiry on her urgent journey with the confession that it was well, riding on hope until faith could operate and the child was restored. Love completes the three. In Abraham, hope said he and the lad would return, faith said God would provide, and love carried the knife up the mountain without withholding, and the three together brought him into sworn blessing. The Word is the stage setter for the whole operation: knowledge of the truth generates real hope, hope invites faith, and faith turns what is available into what is obtainable.", "I keep my hope lively and my love unwithholding, so that my faith always has something to give substance to."], ["Take Responsibility for Your Faith", "The final chapter of The Unlimited Power of Faith is about connecting with the Spirit of faith, and it begins with responsibility. Christianity, Oyedepo says, is about accepting spiritual responsibilities; a person who refuses or ignores responsibility becomes a liability, and a person who stops responding becomes dead weight. Faith that tries to make God absolutely responsible for every event in a life is named as irresponsible faith. In truth, faith makes the believer primarily responsible for the happenings of his own life, because God waits for a person to believe before He confirms supernatural possibilities in the circumstances of that person. What a person believes determines what God performs for him. Connecting with the Spirit of faith happens through carriers of it, because God has placed human agents on the path of every destiny to impart what they carry, and there are no self made men in the Kingdom; every great story is a product of divine connectivity. The Spirit itself is transferable, passing from one life to another the way it passed between earlier generations of believers, but it is received by craving and contending, not by casual admiration. Principles alone can frustrate a person. The Spirit drives the principles into production, moving a man from pushing his life to riding in it.", "I take primary responsibility for my faith, and I connect hungrily with carriers of the Spirit of faith until it rests on me."]], "intro": "This part covers the closing chapters of The Unlimited Power of Faith: the three dimensions of faith, the heart as its operational base, its three products, the covenant platform it stands on, the proofs by which authentic faith is recognised, the good fight, and the partnership of faith with hope and love.", "title": "The Unlimited Power of Faith: Operating and Proving It"}, {"cards": [["What the Anointing Actually Is", "Understanding the Anointing opens with a definition that governs the whole book. The anointing is the empowering of the Spirit of God for supernatural accomplishments. It is the Holy Spirit at work in a man, producing extraordinary results, and it is the device of God for equipping men to do exploits. His scriptural portrait is of an unction that binds up the brokenhearted, sets captives free, opens prison doors, comforts those who mourn, and exchanges ashes for beauty and heaviness for praise. Even disappointment is converted, in his phrase in paraphrase, into supernatural appointment, because everything begins to work in favour of the anointed person. The example he returns to is Jesus, who was the Messiah from birth yet lived thirty years without a public identity of note, until the Spirit descended on Him at His baptism and He returned in the power of the Spirit, with fame spreading through the region. The lesson is that identity alone does not produce exploits. A person can carry a calling, a title, and a sincere heart, and still lack the equipment that makes any of it happen. The anointing is that equipment, and seeking it is therefore not vanity. It is a man asking for the means to do what he was sent to do.", "I seek the anointing as the equipment for my assignment, knowing my calling alone does not produce exploits without it."], ["The Holy Spirit, Chief Executive on Earth", "Oyedepo teaches that the anointing cannot be understood until the Holy Spirit is known as a Person. He calls the Spirit the third Person of the Trinity and the Chief Executive of the divine programme on earth, in charge of the affairs of God here, and the motivator, energizer, and operator behind every revealed plan of God. Nothing of consequence in the Kingdom moves without His involvement. At creation, darkness lay unchallenged on the earth until the Spirit moved on the face of the waters and the commands of the Father took effect. At the birth of the Church, frightened men hid behind locked doors until the Spirit came on them, and then one sermon from one of them added thousands in a day, and authorities could no longer handle people they had recently intimidated. Even prayer changes character when He moves in a person, gaining the attention of heaven in a way routine words do not. This Person centred teaching protects the anointing from becoming a technique. Oil, in this frame, is not a substance to collect or a feeling to chase. It is the activity of a divine Person who must be known, hosted, and obeyed. Grow in acquaintance with Him, and the question of power begins to answer itself.", "I cultivate a personal acquaintance with the Holy Spirit as the Chief Executive of God on earth, and I let Him operate in me."], ["The Well Level of the Spirit", "In Understanding the Anointing, Oyedepo sets out levels of the operation of the Holy Spirit in a believer, pictured as water. The first is the well. At the new birth, the Spirit comes to dwell in a person, like water given to a thirsty woman at a well: a well of water inside, springing up into everlasting life. This is a real and saving experience. No one can even confess Jesus as Lord except by the Holy Spirit, so the well level is the foundation of the entire Christian life. But a well has limits that his later teaching exposes. A well is a contained supply. It serves the person who draws from it, and in a dry season, without rain, a well can run low or dry up entirely. A believer living only at this level may be genuinely saved and genuinely sincere, yet find his spiritual life rising and falling with seasons and circumstances. The teaching is not given to despise the well but to locate it. It is the beginning of the journey, the level of personal salvation and inward springing, and heaven intends more water than a well can hold. Recognising the level you are at is the first step toward desiring the levels above it.", "I thank God for the well of the Spirit in me at the new birth, and I refuse to pretend it is the highest level He offers."], ["The River Level of the Spirit", "The second level is the river, received at the baptism in the Holy Spirit by those who already believe. Oyedepo uses the picture of rivers of living water flowing out of the belly of the believer. A river differs from a well in direction and in reach. A well is drawn from; a river flows out. At this level the Spirit is no longer only sustaining the believer inwardly; He is flowing through him toward other people, in witness, in prayer, and in service. A river also carries more than a well can: it can irrigate fields, sustain communities, and bear weight that a well was never designed for. This is why he treats the baptism of the Spirit as the entrance into a life of outward usefulness rather than a private trophy. Yet the river is not the final picture either. A river depends on rain. Without the constant fall of rain, a river can shrink toward a stream, and in severe dryness even a strong river is reduced. The volume of water in a river determines the functions it can serve, and that volume is maintained from above. The river level is therefore both a promotion and a pointer: more than the well, and still dependent on the rain that the next level describes.", "I receive the river level of the Spirit and let Him flow out of me toward others, not only sustain me within."], ["The Rain Level of the Spirit", "The third level is the rain, and this, in Oyedepo teaching, is the level of the anointing itself. Scripture speaks of asking the Lord for rain in the time of the latter rain, and he reads that rain as the power of God falling from above in showers. Rain is the life wire of both the well and the river. It determines their welfare, and it is the only way either of them is filled up and kept full. The anointing, then, is not a one time event to be remembered but a continual falling to be asked for and lived under. As the volume of water in a river determines what the river can be used for, so the level of the anointing in a person determines the weight he can carry, the people he can serve, and the breakthroug
