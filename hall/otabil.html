aul's declaration that grace is sufficient, invites the believer to let grace do in the weak place what pride never could. Grace accepts the truth, receives God's help, and allows strength to be credited to God without embarrassment. That freedom changes the emotional climate of growth. A person under grace can admit a mistake quickly, learn publicly, rest without guilt, and try again without performing for approval. Pride needs an audience and a flawless record. Grace needs only God's presence and a willing heart. In daily life, letting grace work may mean declining to prove yourself in every room, accepting help from people God sends, and measuring a day by faithfulness rather than by image. It may also mean forgiving yourself for a slow pace while you keep walking. Otabil's turning pattern cannot be powered by pride, because pride will always hide or inflate the very weakness that must be surrendered. Grace carries the turning, and the person who receives it finds a quieter, stronger way to live.", "I let grace carry what my pride cannot fix, and I accept help without needing to prove myself."], ["Testimony Grows Out of Weakness", "A testimony is rarely born in the place where a person was naturally impressive. It grows where God met someone in a real weakness and turned it toward strength, so that others can look at the story and take courage for their own weak places. Otabil's premise points naturally in this direction. The weakness that is surrendered, worked through, and sustained by grace becomes evidence that God helps ordinary people, not only the gifted and the confident. Such a testimony must stay honest. It does not exaggerate the past or the present, and it gives God the credit that self promotion would steal. Its power lies in its truthfulness: I was weak here, grace met me here, and this is what changed. In daily life, testimony grows quietly before it is ever spoken publicly. It grows in the months of steady prayer, small obedience, and repeated effort that no one applauds. Later, a parent shares it with a discouraged child, a believer shares it with a friend, or a worker shares it with someone ready to quit. Otabil's teaching on turning liabilities into assets suggests that even a painful chapter can become useful to others. Nothing surrendered to God is wasted, and a turned weakness often becomes the most credible message a person carries.", "I trust that my surrendered weakness can become an honest testimony that gives others courage."], ["Stop Comparing Weakness With Others' Strength", "Few habits keep weakness painful like comparison. A person measures his weakest area against another person's strongest area and calls the result a fair judgment on his life. Otabil's turning premise cannot grow in that soil, because comparison produces either envy or despair, and neither one builds anything. Paul's pattern in 2 Corinthians 12 is personal: grace was sufficient for him, in his affliction, for his assignment. Another person's strength was never the standard. Each believer has a starting point, a calling, and a pace of growth, and the value of the dot in his own hand grows by intentional effort, not by staring at someone else's larger page. In daily life, stopping comparison changes how social media is read, how colleagues are regarded, and how family members with different gifts are treated. Admiration can remain, because another's strength can inspire learning, but the measuring stick is surrendered. The believer returns to his own work: naming his weakness, receiving grace, adding value steadily, and finishing his own course faithfully. Otabil's teaching direction protects that focus. A life is not built by winning a comparison. It is built by turning what God has placed in your hands, and that work deserves full, undistracted attention.", "I put down the measuring stick, and I give my full attention to turning what God placed in my hands."], ["Finish Stronger Than You Started", "The hope at the end of Otabil's premise is a finish that looks different from the start. A person who began aware of a limiting weakness, who named it honestly, received grace in it, refused to hide, and built small strength steadily, does not end the journey as the same person who began it. He finishes stronger, and his strength has a quality that natural talent alone rarely produces: humility, endurance, gratitude, and a proven knowledge of God's sufficiency. Finishing stronger does not always mean the weakness vanished completely. Paul still spoke of the place where grace was needed, yet he finished his course as a strong witness. Strength, in this pattern, is measured by faithfulness, fruit, and the ability to help others from what you have lived. In daily life, that finish is prepared in ordinary choices repeated over time, the prayer kept, the practice done, the comparison refused, the lesson taken. Families and churches are strengthened by such people, because their lives demonstrate that a weak start is not a prophecy. Otabil's eBook premise leaves the believer with work to do and hope to hold: cooperate with grace, add value from where you are, and keep walking until the story itself testifies that you finished stronger than you started.", "I keep walking with grace and steady effort, determined to finish stronger than I started."]]}, {"cards": [["Offences Will Come", "Otabil teaches that offence is not a strange event in a believer's life but an expected one. Jesus said in Luke 17 that offences will come, and daily life confirms it. People speak carelessly, break promises, overlook us or treat us unfairly, sometimes without even knowing what they have done. The danger begins when a person is surprised by offence and unprepared for it. A prepared heart does not deny the hurt, but it refuses to let one painful moment define the whole season. Dr. Otabil points people back to a steady posture: expect human weakness, hold truth firmly, and keep the heart soft before God. When offence comes, the first question is not why people are like this, but how the heart will respond. Will it close, harden and rehearse the injury, or will it bring the pain honestly to God? A person who expects offence is less likely to be destroyed by it. He can name what happened, learn what is true in it, release what is false, and continue walking in love. Today, decide in advance that no offence will have the final word over your character, your peace or your obedience to God in this season.", "I expect offences without fearing them, and I decide in advance to keep my heart soft before God."], ["Do Not Carry What Offended You", "Otabil teaches that the offence itself is an event, but carrying it is a choice that continues long after the event has passed. A person can replay a harsh word for months, retell the story to everyone who will listen, and allow one meeting or one message to colour every later relationship. The weight grows heavier each time it is rehearsed. Dr. Otabil urges believers to set the load down. That begins with honesty: naming what happened without exaggerating it, and admitting how deeply it hurt. It continues with prayer, bringing the pain to God instead of nursing it in secret. It also means refusing to collect evidence against people, as if the heart were preparing a case that will never bring healing. Some matters need a calm conversation, and some need wise counsel, but none need to be carried as a permanent burden inside. When a memory returns, the person can answer it with a settled decision rather than a fresh wound. The heart was made to carry the purposes of God, not a growing store of injuries. Today, identify one offence you have been carrying, place it before God in prayer, and leave it there.", "I set down the offence I have been rehearsing, and I refuse to carry it into another day."], ["Forgive and Free Your Own Heart", "Otabil teaches that forgiveness is often presented as a gift to the offender, but it is also freedom for the person who was hurt. To forgive is to release the claim to revenge and to stop demanding that the past be repaid before life can move forward. It does not pretend the wrong was right, and it does not require foolish trust where trust has been broken. It is a decision of the will, made before God, to let Him be judge. Dr. Otabil reminds believers that an unforgiving heart stays tied to the very person it resents. Every reminder reopens the account, and peace is postponed again and again. Forgiveness breaks that tie. Feelings may settle slowly after the decision, and that is normal; the decision leads, and the heart follows in time. A forgiving person can still set wise boundaries and still tell the truth about what happened. What changes is the ownership of the pain. It no longer rules the inner life. Today, name the person and the wrong plainly before God, speak forgiveness as an act of obedience, and ask Him to heal what the decision alone cannot mend in your heart.", "I forgive the person who hurt me, and I trust God to heal my heart as I obey Him."], ["Answer Offence With Understanding", "Otabil teaches that understanding can cool an offence before it hardens into a settled grudge. Not every sharp word carries the meaning we first assign to it. People speak from pressure, ignorance, fear or their own unresolved pain, and sometimes they simply communicate badly. Dr. Otabil encourages believers to pause before concluding the worst. A pause creates room to ask a question, to hear the full story, and to separate a clumsy action from a malicious intention. Understanding does not excuse wrong behaviour, and it does not silence honest concerns. It simply insists that judgment be fair and complete. In homes, churches and workplaces, many conflicts shrink once each side truly hears the other. A gentle question can do what an angry accusation cannot: it opens a door instead of building a wall. The person who seeks understanding also protects himself, because suspicion is exhausting and often inaccurate. Wisdom listens first, weighs carefully, and responds to what is real rather than to what was assumed. Today, where an offence still feels fresh, choose one honest question before one final conclusion. Listen to the answer fully, and let understanding guide your next step toward peace and truth.", "I pause and seek understanding before I settle on the worst meaning of what was done to me."], ["Guard Your Heart From Bitterness", "Otabil teaches that bitterness is what offence becomes when it is left alone in the dark. Hebrews 12 warns believers to watch carefully, lest a root of bitterness spring up and trouble them, and defile many around them. A root grows quietly underground. In the same way, resentment can grow beneath polite smiles, shaping thoughts, tone and choices long before others notice it. Dr. Otabil calls believers to guard the heart early, while the hurt is still a seed and not yet a root. Guarding means examining the heart honestly in prayer, noticing when a name or a memory begins to poison the mood, and dealing with it quickly. It also means watching speech, because bitter words reveal a bitter store inside and spread the trouble outward to family, friends and fellow believers. The guarded heart is not a cold heart. It feels pain, but it refuses to let pain ferment into contempt. Grace is the medicine: receiving grace from God makes it possible to extend grace to people. Today, search your heart for any root forming beneath the surface, confess it plainly, and uproot it through forgiveness, prayer and truth.", "I guard my heart early, and I uproot bitterness before it can grow and spread through my life."], ["Do Not Let Offence Stop Your Assignment", "Otabil teaches that one of the quiet costs of offence is delay. A person called by God can spend months thinking about who left, who lied or who failed to appreciate the work, while the assignment itself sits untouched. Energy meant for building is spent on brooding, and a season meant for fruitfulness is given to a wound. Dr. Otabil urges believers to protect their assignment by refusing that exchange. The people who offended you are not the ones who called you, and they should not be the ones who stop you. Returning to the work is not denial; it is discipline. Prayer heals the heart, wise counsel steadies the mind, and then the hands return to the task God entrusted. Sometimes the next faithful step is small: one lesson prepared, one visit made, one page written, one duty completed well. Small steps break the sense of being stuck and remind the heart why it began. Offence will always offer a reason to pause indefinitely. Purpose gives a stronger reason to continue. Today, name the assignment God has given you in this season, take the next concrete step toward it, and let obedience, not injury, set your pace.", "I return to the assignment God gave me, and I take the next faithful step today without delay."], ["Make Peace Where You Can", "Otabil teaches that a free heart does not only release offences inwardly; where it is possible, it also moves toward peace outwardly. Some relationships can be restored with a humble conversation, an apology for our own part, or a clear and kind word that clears the air. Dr. Otabil encourages believers to take the initiative rather than waiting for the other person to move first. Pride often keeps both sides waiting while the distance grows. Making peace requires courage and honesty. It means listening without interrupting, speaking truth without cruelty, and accepting that the other person may not respond as hoped. Peace making has limits: a person cannot force agreement, and reconciliation needs truth and safety, not pretence. Where full restoration is not possible, a believer can still refuse hatred, speak no slander, and leave the door of the heart unbarred before God. The effort itself matters, because it proves the offence no longer commands the life. Many families and churches carry years of silence that one brave, gentle conversation could begin to heal. Today, if God brings one person to mind, pray first, then take one humble step toward peace, and trust Him with the outcome.", "I take the first humble step toward peace where I can, and I trust God with the outcome."], ["Learn Without Becoming Cynical", "Otabil teaches that every offence carries information, but it should never be allowed to carry the heart into cynicism. Cynicism expects the worst from everyone, trusts no one, and calls its suspicion wisdom. It may feel protective, yet it slowly closes a person to friendship, to teamwork and even to the new things God wants to do. Dr. Otabil points to a better response: learn precisely, without generalising bitterly. A disappointment can teach better boundaries, clearer agreements, wiser timing and more careful listening. Those are valuable lessons. What must be refused is the leap from one person failed me to all people will fail me. That leap is not wisdom; it is a wound making rules for the future. A learning heart stays tender and discerning at the same time. It keeps records of lessons, not of grudges. It can enter the next relationship clean, neither naive nor hardened, carrying experience without carrying suspicion. God can redeem even painful episodes by the maturity they produce in a yielded heart. Today, write down the true lesson from a past offence, thank God for the growth, and deliberately release the cynical conclusion that tried to attach itself to it.", "I learn the true lesson from disappointment, and I refuse to let cynicism rule my view of people."], ["Still Love People After Disappointment", "Otabil teaches that the real test of a mature heart is whether it can still love people after people have disappointed it. Love in Scripture is not a feeling reserved for those who behave well; it is a settled commitment to seek the good of others and to reflect the character of God. Dr. Otabil encourages believers not to withdraw love as a punishment and not to let past hurts turn them cold toward everyone new. This love is wise, not blind. It may love from a healthy distance where trust must be rebuilt, and it may say no where yes would enable harm. But it does not curse, mock or quietly wish people ill. It keeps praying for those who are difficult, keeps serving where God has placed it, and keeps the capacity to rejoice with others intact. A heart that stops loving becomes smaller than the life God intended for it. Each act of kindness after disappointment is a declaration that the offence did not win. Love keeps the future open, because the next assignment may come through the very kind of people the past tried to make you avoid. Today, do one deliberate act of love that your disappointment would have prevented.", "I choose to keep loving people wisely after disappointment, and I show it with one deliberate act today."], ["The Offended Heart Needs Healing First", "Otabil teaches that an offended heart should seek healing before it seeks verdicts. Pain distorts hearing: a neutral comment sounds like an attack, a delay feels like rejection, and advice is heard as criticism. When the wound is still raw, even good counsel can be misread. Dr. Otabil therefore directs believers first to the presence of God, where the heart can be honest without being judged for its tears. In prayer, a person can say exactly what hurt, what it awakened from the past, and what fear now sits underneath it. Healing also grows through time, through the truth of Scripture applied gently, and through trusted voices who listen before they correct. A healed heart does not forget the event; it remembers without bleeding. Only then can decisions be made cleanly: whether to confront, to reconcile, to set a boundary or simply to move on. Acting from an open wound usually multiplies damage, while acting from a healed heart protects everyone involved. God is patient with this process and does not shame the hurting. Today, before you explain, confront or decide, bring your heart to God for healing, and let His comfort settle you first in His presence.", "I bring my wounded heart to God for healing first, before I judge, confront or decide anything."], ["Refuse to Pass the Offence On", "Otabil teaches that offence longs to travel. The hurt person tells another, who tells another, until people who were never present carry anger about an event they never witnessed. Whole families, teams and congregations can be divided by second hand offence, and Hebrews 12 warns that bitterness defiles many, not only the one who holds it. Dr. Otabil calls believers to stop the chain at their own heart. That means refusing to recruit supporters, refusing to retell the story for sympathy, and refusing to poison new people against someone because of an old wound. There is a right place for counsel and a right place for accountability, handled with the right people in the right spirit. Gossip is none of those. A mature believer can say, that matter is between God, that person and me, and I will not spread it. Protecting another person's reputation, even the reputation of someone who wronged you, is a strong sign that the heart is truly free. Children, colleagues and younger believers are watching how offence is handled, and they will imitate it. Today, close the door on one retelling you were tempted to repeat, and let the offence end with you.", "I stop the chain of offence at my own heart, and I refuse to pass it to anyone else."], ["Move Forward Unoffended", "Otabil teaches that the goal of handling offence is not merely surviving an injury but moving forward with an unoffended heart. Freedom shows itself in ordinary ways: you can hear a name without tightening inside, enter a room without scanning it for threats, and begin new work without dragging old conversations behind you. Dr. Otabil encourages believers to treat forward movement as a daily practice. Keep forgiving when memories resurface, keep the heart guarded through prayer, and keep attention fixed on what God is building next rather than on what people did last. An unoffended life is not a careless life; boundaries remain, lessons remain, and wisdom remains. What leaves is the inner captivity. The future God intends cannot be entered while the heart is still negotiating with the past every morning. There will be fresh offences ahead, because people remain people, but a trained heart deals with them quickly and travels light. That lightness is a witness in itself, showing family, church and colleagues that grace is stronger than grievance. Today, take one forward step you have postponed because of an old hurt, and take it as a free person, with a clean heart and clear eyes.", "I move forward as a free person, travelling light and refusing to let old hurts set my direction."]], "intro": "Offences come to every person, even to those who love God and mean well. In this part Otabil teaches the heart to stay free when it is wounded, misunderstood or treated unfairly. The call is simple and demanding: do not carry what hurt you, forgive quickly, guard against bitterness, and keep your God given assignment moving forward.", "title": "Handling Offences: A Heart That Stays Free"}, {"cards": [["A Goal Gives the Future an Address", "Otabil teaches that a goal gives the future an address. Without a goal, tomorrow is a vague hope that drifts wherever circumstances push it. A person may pray about the future, talk about the future and admire the future of others, yet never state plainly what he is actually aiming at. Dr. Otabil encourages believers to define the future they believe God is leading them toward, in clear and honest terms. A defined goal gathers scattered energy. It tells time where to go, tells money what to serve, and tells daily choices what they are for. It also exposes excuses, because once the destination is named, it becomes obvious which habits lead there and which lead away. This is the future orientation Otabil commends: today designs tomorrow, so the picture of tomorrow must be clear enough to design by. A goal is not a demand made on God; it is a stewardship of vision, held with humility and pursued with faith. Vague wishes produce vague effort, but a clear address produces directed steps. Today, state one goal for this season in a single clear sentence, pray over it honestly, and let that sentence begin to organise your choices from this morning onward.", "I name my goal in one clear sentence, and I let it organise my choices starting today."], ["Write the Goal Down", "Otabil teaches that a goal kept only in the mind is easily edited by mood. On strong days it grows large, on tired days it shrinks, and after a setback it may quietly disappear. Writing the goal down gives it a fixed form outside the feelings of the moment. Dr. Otabil commends the simple discipline of putting the goal on paper, where it can be seen, read again and prayed over with focus. A written goal can also be shared with a trusted person, which adds healthy accountability. The page becomes a small witness: this is what was decided when the mind was clear and the heart was settled before God. Writing forces honesty too. Words on paper reveal whether the goal is truly specific or still a pleasant general wish. A person can then refine it, date it, and place it where it will be encountered daily, on a desk, in a notebook or near the place of prayer. What is written is remembered, and what is remembered can be pursued deliberately instead of occasionally. Today, write your main goal exactly as you intend to pursue it, place the writing where you will see it every day, and read it aloud in prayer.", "I write my goal down clearly, and I place it where I will see and pray over it daily."], ["Break the Big Goal Into Steps", "Otabil teaches that a big goal is reached through small, ordered steps, never through one giant leap of enthusiasm. A large aim can intimidate a person into doing nothing, because the distance between today and the finish looks overwhelming. Breaking the goal into steps turns that distance into a path. Dr. Otabil encourages believers to ask a practical question: what is the first step, and what follows it? Each step should be small enough to begin now and clear enough to recognise when it is done. Steps also reveal needs early: a skill to learn, a person to consult, a cost to prepare for, a habit to build. Seen this way, planning is not a delay of faith but an expression of it, counting the cost before building. A stepped plan calms the mind because the whole future no longer has to be carried at once; only the next step does. Progress then becomes visible, and visible progress strengthens the will to continue. Many goals die not from impossibility but from shapelessness. Today, take your written goal and divide it into its first five steps, put them in order, and begin the first one before this day ends.", "I break my big goal into ordered steps, and I begin the first step before today ends."], ["Goals Must Survive Ordinary Days", "Otabil teaches that a goal is truly tested on ordinary days, not on inspired ones. Anyone can work toward a goal after a stirring message, a new year or a burst of motivation. The real question is what happens on a plain Tuesday, when the body is tired, the results are slow and nobody is watching or applauding. Dr. Otabil commends a steady rhythm of small faithful actions that do not depend on mood. A page written, a lesson studied, a call made, a small amount saved: these unglamorous acts are how futures are actually built. This is the heart of his teaching that today designs tomorrow. Ordinary todays are the building material of every remarkable tomorrow. A person who only moves when he feels inspired hands his future over to his feelings, and feelings change with sleep, weather and circumstance. A person with a rhythm keeps moving through all of it, slowly at times, but never fully stopped. Faithfulness on ordinary days also builds self trust, because each kept commitment proves the goal is real. Today, choose the smallest daily action that serves your goal, attach it to a fixed time, and do it today at that time without negotiation.", "I attach one small action to a fixed time, and I do it on ordinary days without negotiating with my mood."], ["Review, Adjust and Keep Going", "Otabil teaches that a goal must be reviewed honestly if it is to be reached. Review is the moment a person stops assuming progress and measures it: what has been done, what has been missed, and what the results are actually saying. Dr. Otabil encourages believers to treat review as a normal part of pursuit, not as an admission of failure. Some steps will need adjusting because circumstances changed, the first estimate was wrong, or a better route has become clear. Adjusting a method is wisdom; abandoning the goal at the first difficulty is not. A good review also separates the goal from the plan. The goal may remain exactly right while the plan needs new timing, new help or new order. Without review, a person can be busy for months while drifting quietly off course. With review, small corrections happen early, while they are still cheap. Set a regular rhythm for it, weekly or monthly, and come to it with honesty and prayer rather than shame. God is not threatened by your questions about the route. Today, review your current goal plainly, write one adjustment the evidence calls for, and continue with renewed clarity and courage to keep going.", "I review my progress honestly, make the adjustment the evidence calls for, and keep going with courage."], ["Pursue the Goal, Not Just the Feeling", "Otabil teaches that many people pursue the feeling of a goal rather than the goal itself. They enjoy talking about it, imagining the celebration and collecting encouragement, but the actual work is postponed again and again. The feeling gives a reward without the cost, and so the future stays a pleasant story instead of becoming a lived reality. Dr. Otabil calls believers to honest pursuit: effort directed at the thing itself, measured by steps completed rather than by excitement felt. Pursuit looks unspectacular from outside. It is preparation done early, practice done repeatedly, and difficult conversations held on time. It also means refusing to announce progress that has not happened. A pursuing person asks a sharper question each day: what did I actually do today that moved this goal forward? That question, answered truthfully, protects against self deception. Feelings are not enemies; they often return as a gift once real progress begins. But they make poor leaders. Faith, discipline and steady action must lead, and feeling can follow behind. The future Otabil describes is negotiated for by present action, not by present emotion. Today, replace one conversation about your goal with one concrete action toward it.", "I pursue the goal itself with concrete action today, not just the good feeling of having one."], ["Finish What You Set", "Otabil teaches that setting a goal and getting a goal are two different things, and the honour lies in the finishing. Many lives are littered with strong beginnings: courses started, savings opened, projects launched with energy and then left at the hardest middle stretch. Dr. Otabil encourages believers to build the identity of a finisher. Finishing usually requires a final push through boredom, resistance and the temptation of a newer, more exciting aim. The last stretch rarely feels glorious, which is exactly why so many stop just before the fruit appears. A finisher returns to the original written goal and remembers why it mattered, who it serves, and what was promised before God. He also learns to close small goals completely, because each finished task trains the will for larger ones. Completion brings a quiet confidence that cannot be bought or borrowed: the knowledge that your word to yourself can be trusted. An unfinished goal teaches the opposite lesson every time it is seen. God Himself is portrayed in Scripture as the One who begins and completes, and His children grow into that likeness by finishing faithfully. Today, choose one unfinished goal worth completing, set its final steps in order, and work until it is done.", "I finish what I set, starting with one unfinished goal whose final steps I put in order today."]], "intro": "A future does not arrive by wishing. Otabil teaches that a goal gives tomorrow a clear address, and that setting a goal is only the beginning. The goal must be written, broken into steps, pursued on ordinary days, reviewed with honesty, and finished. In this part, present action becomes the way a person negotiates for the future God has shown.", "title": "Goal Setting and Goal Getting"}, {"cards": [["Choose a Partner With Your Purpose in View", "Otabil teaches that the choice of a life partner should be made with purpose in view. Marriage joins not only two people but two directions, and a partner who cannot walk with your God given purpose will eventually pull against it, however strong the attraction may be. Dr. Otabil encourages believers to first know what their own life is for. A person who is unclear about his calling is easily carried by whoever is available, impressive or urgent in the moment. Clarity about purpose brings clarity about fit: the values that must be shared, the work that must be understood, and the kind of home that must be built. This is not cold calculation. It is the wisdom of counting what a lifetime together will actually require. Purpose also protects against pressure, whether the pressure comes from age, family expectations or the fear of being left behind. A destiny decision deserves better grounds than panic. The right question is not only, do I love this person, but also, can we build the life God has shown me together? When purpose leads, affection finds its proper place: honoured, but not in charge. Today, write down your purpose plainly, and measure every serious relationship decision against it in prayer.", "I keep my God given purpose in view, and I measure this life decision against it in prayer."], ["Look Beyond Feelings to Character", "Otabil teaches that feelings are a real part of choosing a partner, but they are an unreliable foundation on their own. Feelings rise and fall with seasons, health, success and stress. Character is what remains when feelings change, and character is what a marriage will actually live with every day. Dr. Otabil encourages believers to watch for the steady evidence of who a person truly is: honesty in small matters, kindness under pressure, humility when corrected, faithfulness in ordinary duties, and self control when desires are denied. These things are seen over time and in unguarded moments, not in best behaviour during courtship. A charming person with weak character will bring charming beginnings and painful patterns. A person of proven character may be quieter at first, yet brings the safety a lifetime requires. Scripture consistently honours the inner life above outward appearance, and wisdom follows the same order. This teaching protects the heart from being led by intensity alone. Strong feelings should start careful observation, not replace it. Today, if you are considering a partner, list the character you have actually observed over time, separate it from what you merely feel, and weigh the difference honestly before God in prayer.", "I look beyond my feelings to observed character, and I weigh the difference honestly before God."], ["Shared Faith, Shared Direction", "Otabil teaches that a lasting partnership needs shared faith, because faith is not a private hobby but the centre from which a whole life is directed. Two people may agree on taste, humour and ambition, yet pull in different directions at the deepest level if one life is surrendered to God and the other is not. Dr. Otabil encourages believers to look for agreement where it matters most: trust in Christ, submission to Scripture, prayer, integrity and the purpose of a home. Shared faith gives a marriage a common language for forgiveness, a common authority for hard decisions, and a common hope in suffering. Without it, every crisis becomes a negotiation between two different worlds. Shared direction matters alongside shared belief. It is possible to hold the same creed and still be heading toward very different lives, so honest conversation about calling, work, family and service is essential. Agreement at the centre does not remove all differences of personality or background; it gives those differences a foundation strong enough to hold them. Today, if you are weighing a relationship, discuss faith and direction openly and specifically, and listen carefully to whether your deepest commitments truly agree or merely sound similar on the surface.", "I seek shared faith and shared direction, and I discuss both openly before I give my heart fully."], ["Marriage Is a Covenant, Not a Trial", "Otabil teaches that marriage is a covenant, not a trial arrangement to be tested and discarded if it becomes difficult. A covenant is a solemn commitment made before God, in which two people bind themselves to faithfulness for a lifetime, through seasons of plenty and seasons of strain. Dr. Otabil encourages those choosing a partner to approach the decision with that weight in mind. A person who enters marriage keeping an exit in view will struggle to give the full trust covenant love requires. Understanding marriage as covenant also changes how a partner is chosen. The question becomes, is this someone I can keep covenant with when feelings fluctuate, when we disagree, when life costs more than we expected? That question leads to sobriety, prayer and honest counsel before the wedding, which is exactly where such questions belong. Covenant is not a trap; it is the secure frame inside which love can grow deep roots and children can grow in safety. God designed it as a picture of His own faithfulness to His people. Today, settle the nature of marriage in your own heart first: a covenant to be honoured for life, and let that settled conviction shape how carefully and prayerfully you choose.", "I honour marriage as a lifelong covenant, and I let that conviction make my choosing careful and prayerful."], ["Take Time to Know the Person", "Otabil teaches that wisdom takes time to know a person before making a promise of a lifetime. Rushed decisions are usually driven by pressure, loneliness or intense feeling, and none of these can see clearly. Dr. Otabil encourages believers to let time do its revealing work. Over time, people show how they handle disappointment, money, correction, family, work and waiting. Seasons expose what a few impressive meetings can hide. Time also allows counsel to be heard: parents, pastors and trusted friends often notice what a captivated heart overlooks, and their concerns deserve a fair hearing rather than a defensive reaction. Taking time is not endless delay or fear of commitment. It is the deliberate pace of someone who understands the size of the decision. During that time, observation should stay honest and boundaries should stay clear, so that purity and judgment are both protected. A relationship that is right will not be destroyed by wise patience; it will be strengthened and confirmed by it. What is built slowly and truthfully stands better than what is rushed. Today, if a decision feels urgent for no godly reason, slow it down deliberately, pray, seek counsel, and watch the person character across ordinary days.", "I take unhurried time to truly know a person, seeking counsel and watching character across ordinary days."], ["Build a Marriage That Lasts", "Otabil teaches that a wedding begins a marriage, but only daily building makes it last. His writing on lasting marriage, alongside his teaching on choosing well, points to the same truth: what is chosen wisely must then be tended faithfully. Dr. Otabil encourages couples to understand that love is maintained by practice, through honest communication, forgiveness offered quickly, respect guarded carefully and purpose pursued together. Lasting marriages are not found; they are built, one kept promise and one repaired quarrel at a time. His own marriage to Joy Otabil, begun in 1986, stands behind this teaching as a lived example of partnership over decades, in life and in ministry together. Building also means expecting seasons. Affection will have winters as well as summers, and covenant love works through both rather than panicking at the first cold spell. Couples who last learn to return to each other in humility, to keep short accounts, and to protect the friendship inside the marriage. Choosing the right person and becoming the right person are lifelong companions. Today, whether you are single or married, commit to the builder mindset: tend what God joins with daily faithfulness, quick forgiveness and honest words, starting with one act of care today.", "I commit to building a marriage that lasts through daily faithfulness, quick forgiveness and honest words."], ["Two Lives, One Godly Direction", "Otabil teaches that marriage joins two complete lives into one shared, godly direction. Neither person disappears into the other, and neither simply continues a separate life under one roof. Two histories, gifts and callings are brought together and aimed, deliberately, at the purposes of God. Dr. Otabil encourages couples to see this unity as something worked out in practice: praying together, deciding together, handling money with one mind, and serving God and people as a team. His own partnership with Joy Otabil illustrates this, seen in the way she stood as his sounding board through the writing of Buy the Future, a partner in the work itself and not an observer of it. One direction does not erase difference. It gives difference a shared destination, so that strengths are combined rather than competed with. Where direction is truly one, disagreements become problems to solve together instead of battles to win against each other. This is the maturity Otabil commends to those choosing a partner: look for someone you can genuinely become one team with before God. Today, if you are preparing for marriage, talk together about the direction of the life you would build, and agree on the God you will both follow first.", "I aim my life in one godly direction with my partner, following God first and building together as one team."]], "intro": "Choosing a life partner shapes a whole future, so Otabil treats the choice as a matter of wisdom, not pressure or feeling alone. This part looks at purpose, character, shared faith and covenant, and at taking time to truly know a person. It also points beyond the wedding day to the lasting marriage two people build together under God.", "title": "Choosing a Life Partner: Marriage by Wisdom"}]}];
const doorsEl = document.getElementById('doors');
const overlay = document.getElementById('overlay');
const scroller = document.getElementById('scroller');
const hud = document.getElementById('hud');
const counter = document.getElementById('counter');
let current = null;

DATA.forEach((t, i) => {
  const total = t.sections.reduce((n, s) => n + s.cards.length, 0);
  t.total = total;
  const b = document.createElement('button');
  b.className = 'doorCard';
  b.innerHTML = `<div class="photo" style="background-image:url('${t.photo}');background-position:${t.pos}"></div><div class="shade"></div><div class="body"><div class="doorNum">Door ${i + 1}</div><div class="doorName">THINK LIKE ${t.name}</div><p class="essence">${t.essence} ${total} teachings.</p><span class="enter">Enter</span></div>`;
  b.addEventListener('click', () => openTeacher(i));
  doorsEl.appendChild(b);
});
const empty = document.createElement('div');
empty.className = 'doorCard empty';
empty.innerHTML = `<div class="frame"><div class="doorNum">Door ${DATA.length + 1}</div><div class="doorName">THIS DOOR AWAITS ITS TEACHER</div><p class="essence">Space is kept at the door. Name the next teacher, and this space is his.</p></div>`;
doorsEl.appendChild(empty);

function openTeacher(i) {
  const t = DATA[i];
  current = t;
  scroller.innerHTML = '';
  const screens = [];
  const door = document.createElement('section');
  door.className = 'screen doorScreen';
  door.style.backgroundImage = `url('${t.photo}')`;
  door.style.backgroundPosition = t.pos;
  door.innerHTML = `<div class="shade"></div><div class="doorContent"><div class="kicker">Door ${i + 1} &middot; The Hall of Teachers</div><h1>THINK LIKE<br>${t.name}</h1><p class="dsub">A condensation of his teaching on ${t.sub}, taken in one screen at a time, until his way of thinking becomes yours.</p><button class="bigBtn" id="enterBtn">Enter</button><br><button class="hallBtn" id="backBtn1">&#8249; All Doors &middot; The Hall of Teachers</button></div>`;
  scroller.appendChild(door); screens.push({el: door, type: 'door'});
  let flat = 0;
  t.sections.forEach((sec, si) => {
    const intro = document.createElement('section');
    intro.className = 'screen intro';
    intro.innerHTML = `<div class="partNum">Part ${si + 1} of ${t.sections.length}</div><h2>${sec.title}</h2><p>${sec.intro}</p><div class="count">${sec.cards.length} teachings</div><div class="hint">Scroll</div>`;
    scroller.appendChild(intro); screens.push({el: intro, type: 'intro'});
    sec.cards.forEach((c, ci) => {
      flat++;
      const myFlat = flat;
      const card = document.createElement('section');
      card.className = 'screen card';
      card.innerHTML = `<div class="secLabel">${sec.title} &middot; ${ci + 1} of ${sec.cards.length}</div><h3>${c[0]}</h3><p class="body">${c[1]}</p><div class="into"><div class="lbl">Into Me</div><p>${c[2]}</p></div>`;
      scroller.appendChild(card); screens.push({el: card, type: 'card', n: myFlat});
    });
  });
  const end = document.createElement('section');
  end.className = 'screen endCard';
  end.innerHTML = `<div class="kicker">End &middot; ${t.total} Teachings</div><h2>THINK LIKE ${t.name}</h2><p>You have taken in the condensation. Now go and think like ${t.short}: ${t.end}</p><button class="bigBtn" id="againBtn">Begin Again</button><br><button class="hallBtn" id="backBtn2">&#8249; All Doors &middot; The Hall of Teachers</button><div class="hint">Door ${i + 1} &middot; The Hall of Teachers</div>`;
  scroller.appendChild(end); screens.push({el: end, type: 'end'});
  t._screens = screens;
  overlay.classList.add('open');
  document.body.style.overflow = 'hidden';
  scroller.scrollTop = 0;
  hud.style.display = 'none';
  document.getElementById('enterBtn').addEventListener('click', () => { screens[1].el.scrollIntoView({behavior: 'smooth'}); });
  document.getElementById('againBtn').addEventListener('click', () => { screens[1].el.scrollIntoView({behavior: 'smooth'}); });
  document.getElementById('backBtn1').addEventListener('click', closeTeacher);
  document.getElementById('backBtn2').addEventListener('click', closeTeacher);
  const io = new IntersectionObserver((es) => {
    es.forEach(e => {
      if (!e.isIntersecting) return;
      const s = screens.find(x => x.el === e.target);
      if (!s) return;
      if (s.type === 'card') { hud.style.display = 'flex'; counter.textContent = s.n + ' / ' + t.total; }
      else if (s.type === 'door') { hud.style.display = 'none'; }
      else { hud.style.display = 'flex'; counter.textContent = s.type === 'end' ? t.total + ' / ' + t.total : ''; }
    });
  }, {root: scroller, threshold: .55});
  screens.forEach(s => io.observe(s.el));
  t._io = io;
}
function closeTeacher() { location.href = 'index.html'; }
document.getElementById('hallBtnTop').addEventListener('click', closeTeacher);
document.getElementById('topBtn').addEventListener('click', () => {
  if (!current || !current._screens) return;
  const s = [...current._screens].reverse().find(x => x.type === 'intro' || x.type === 'card');
  if (s) s.el.scrollIntoView({behavior: 'smooth'});
});
openTeacher(0);
</script>
</body>
</html>
