  :root{--ink:#C1E8FF;--dim:#7DA0CA;--soft:#5483B3;--deep:#021024;--mid:#052659;--gold:#C9A44C}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{background:linear-gradient(180deg,#021024 0%,#052659 55%,#021024 100%);color:var(--ink);font-family:"Cormorant Garamond",Georgia,serif;min-height:100dvh}
  .wrap{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 42px) 20px 54px}
  .kicker{font-family:Cinzel,serif;letter-spacing:.32em;font-size:11px;color:var(--gold);text-transform:uppercase;text-align:center}
  h1{font-family:Cinzel,serif;font-weight:700;font-size:34px;line-height:1.18;color:#fff;text-align:center;margin:14px 0 12px}
  .sub{text-align:center;font-size:20px;line-height:1.5;color:var(--ink);max-width:40ch;margin:0 auto 36px}
  .doorCard{position:relative;border-radius:18px;overflow:hidden;margin-bottom:26px;border:1px solid rgba(125,160,202,.35);background:#052659;text-align:left;width:100%;display:block;cursor:pointer;padding:0;font-family:inherit}
  .doorCard .photo{height:380px;background-size:cover}
  .doorCard .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(2,16,36,.05) 34%,rgba(2,16,36,.86) 74%,rgba(2,16,36,.97) 100%)}
  .doorCard .body{position:absolute;left:0;right:0;bottom:0;padding:22px 24px 24px}
  .doorNum{font-family:Cinzel,serif;font-size:11px;letter-spacing:.3em;color:var(--gold);text-transform:uppercase;margin-bottom:8px}
  .doorName{font-family:Cinzel,serif;font-size:26px;font-weight:700;color:#fff;line-height:1.2}
  .essence{font-size:19px;line-height:1.45;color:var(--ink);margin-top:8px;max-width:38ch}
  .enter{display:inline-block;margin-top:16px;font-family:Cinzel,serif;letter-spacing:.18em;font-size:13px;color:#021024;background:var(--ink);border-radius:999px;padding:13px 30px;text-transform:uppercase}
  .doorCard.empty{background:linear-gradient(170deg,#052659,#021024);border:1.5px dashed rgba(201,164,76,.55);cursor:default}
  .doorCard.empty .frame{min-height:300px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:26px}
  .doorCard.empty .doorName{color:var(--dim);font-size:22px}
  .doorCard.empty .essence{color:var(--soft)}
  .foot{text-align:center;font-style:italic;font-size:18px;color:var(--dim);margin-top:8px}
  /* teacher overlay */
  #overlay{position:fixed;inset:0;background:var(--deep);display:none;z-index:50}
  #overlay.open{display:block}
  #scroller{height:100%;overflow-y:auto;scroll-snap-type:y proximity;-webkit-overflow-scrolling:touch}
  .screen{min-height:100%;scroll-snap-align:start;position:relative;display:flex;flex-direction:column;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 64px) 26px calc(env(safe-area-inset-bottom,0px) + 40px);max-width:640px;margin:0 auto;width:100%}

<script>
const DATA = [{"slug": "rohn", "name": "JIM ROHN", "short": "Rohn", "essence": "Personal development, discipline and the seasons of life.", "sub": "discipline, philosophy and the seasons of life", "pos": "78% 20%", "end": "keep working on yourself, respect the seasons, and let discipline compound.", "photo": "photos/rohn.jpg", "sections": [{"title": "The Mind of Rohn", "intro": "At 25, Jim Rohn was in debt with a young family, blaming everything outside himself, until his mentor Earl Shoaff showed him the problem was his own thinking. These ten convictions rebuilt his life. Take them in first.", "cards": [["Philosophy Is the Set of the Sail", "The same winds blow on every life. Rain falls on one town and on the next, prices rise for one family and for another, and difficulty visits people who did nothing to invite it. Rohn taught that circumstances explain very little because they are so widely shared. What separates lives is the set of the sail, and the sail is personal philosophy. Philosophy means the way a person thinks about work, money, failure, other people, and himself. That thinking quietly decides how he responds when the wind turns against him. One person reads a setback as proof that effort is useless and drifts. Another reads the same setback as information and trims his sail. The wind did not make the difference. The thinking did. This is why upgrading philosophy comes before upgrading results. A person cannot sail toward a better life while holding beliefs that point him toward complaint and surrender. Consider a worker who loses hours at his job. With a weak philosophy he waits and worries. With a stronger one he asks what skill he can build and what value he can offer next. The situation is identical. The direction is not.", "I cannot change the wind. I can set my sail, and I do it on purpose."], ["For Things to Change, You Have to Change", "Most people wait for conditions to improve before they improve themselves. They wait for a better job, a kinder manager, more money, or an easier season, as if life changes first and the person follows after. Rohn reversed that order. He taught that if you keep being who you are, you keep getting what you have, because results grow out of the person who produces them. A change in income without a change in thinking rarely lasts. A change in opportunity without a change in discipline is soon wasted. The person must change first, in philosophy, in habits, in standards, and in the small choices made each day. That change does not need to be dramatic at the start. Direction can change in a single day even though the destination takes much longer. A man in debt cannot erase the debt overnight, but he can stop the spending, start the record keeping, and begin learning on that same day. From the outside almost nothing looks different yet. Inside, everything has turned. Circumstances then begin to follow, slowly and unevenly, because a different person is now meeting them. Waiting keeps the old life in place. Changing starts the new one.", "I stop waiting for my life to change. I change, and it follows."], ["Success Is Attracted, Not Pursued", "Rohn taught that success is not mainly something a person chases down by running faster after it. Success is attracted. It moves toward the person who has become valuable, disciplined, skilled, and trustworthy. That idea changes where the effort goes. Instead of asking only how to get more, a person asks how to become more. He works on his knowledge, his reliability, his attitude, and his ability to serve other people well. As those qualities grow, opportunities that once passed him by begin to stop. Employers trust him with more. Customers return to him. People recommend his name in rooms he has never entered. None of that was seized by force. It was drawn by character and competence built over time. The contrast is the person who pursues success while neglecting himself. He wants the title without the discipline and the income without the value, so every gain feels strained and temporary. Consider a young worker who decides to become punctual, prepared, and easy to work with. Months later she is offered responsibility others never see. The opportunity looks sudden, but it was attracted by who she had quietly become.", "I work on becoming the kind of person success is attracted to."], ["The Failure Formula", "Failure rarely arrives as one large dramatic event. Rohn described it as a few errors in judgment repeated every day. The errors look small. A person skips the reading, delays the difficult conversation, spends a little more than he planned, or lets one more day pass without exercise. Each single act seems harmless because the cost does not appear at once. The danger is repetition and compounding. What is repeated daily becomes a direction, and a direction faithfully followed reaches its destination. The bill arrives later in damaged health, strained relationships, empty savings, or lost self respect. By then the person often blames one recent event, when the real cause was a long chain of small neglects. This teaching is hopeful as well as sobering, because small errors can be hunted down while they are still small. A family that reviews its spending each week can correct a leak before it becomes debt. A student who notices a daily habit of delay can replace it with a short fixed study time. The work is not to fear every mistake. The work is to examine repeated judgments honestly and change them before time multiplies them.", "I hunt down my small daily errors before they compound."], ["The Success Formula", "Success works by the same law as failure, only in the opposite direction. Rohn called it a few simple disciplines practiced every day. The disciplines are rarely impressive on any single day. Reading for a short time, saving a small amount, keeping a promise, preparing for tomorrow, and doing the hard task first can all look ordinary. Their power comes from repetition. Practiced daily, they compound into knowledge, reserves, trust, and confidence that no single burst of effort could produce. This is why success should not be treated as an event to wait for. It is an accumulation to build. The person who practices only when motivation is high stays at the mercy of his feelings. The person who keeps the discipline on plain days builds a life that keeps moving even when feelings change. Consider someone who writes a few lines in a journal each evening and reviews the day honestly. After a year he owns a record of lessons that memory alone would have lost. Nothing dramatic happened on most evenings. Everything important happened across them. The teaching asks for simplicity, consistency, and patience, trusting that daily disciplines always outproduce occasional intensity.", "I practice a few simple disciplines every day, without drama."], ["Work Harder on Yourself Than on Your Job", "A job deserves honest effort, but Rohn placed a higher project above it. Working hard on a job can make a living, because a job pays for the value of the work performed in those hours. Working hard on yourself can change the whole level of a life, because the self goes everywhere the person goes. Skills learned stay after a job ends. Judgment improves every decision. Discipline strengthens work, family life, money, and health at the same time. That is why he called the self the highest yielding project a person owns. The contrast is a person who gives all his energy to tasks and none to growth. He may become very busy and still remain the same, so his results stay near the same level year after year. Growth requires deliberate investment, such as reading after work, learning from a mentor, reviewing mistakes, and practicing a skill when no one is assigning it. A warehouse worker who studies in the evening and learns to solve problems others avoid becomes more valuable in every setting. His improved self cannot be taken away by a schedule change. Build the job performance, Rohn would say, but build the person even more.", "I invest more effort in my own growth than in any task."], ["Paid for Value, Not for Time", "The marketplace pays for value. That was Rohn's plain answer to the question of income. It does not pay because a person needs more, wants more, or has worked for a long time. Need is real, and time matters, but payment follows the value delivered to others. A person who can solve larger problems, serve more people, or do necessary work with greater skill gives the marketplace a reason to pay more. This teaching removes both entitlement and helplessness. Income is not fixed forever, because value can be increased. It also sets the honest order. First become more valuable, then earnings have room to rise. Chasing higher pay while refusing to grow creates constant frustration, because the claim runs ahead of the contribution. Consider two workers doing similar jobs. One only completes what is assigned and complains about the wage. The other learns the wider process, prevents errors, trains new staff, and makes customers feel well served. Over time the second worker becomes harder to replace and easier to promote. The difference is value made visible in daily work. Keep increasing knowledge, skill, reliability, and service, and income has a sound basis for growth.", "I bring value to the marketplace, and I keep increasing it."], ["Become Is Worth More Than Get", "Rohn measured a goal mainly by what it makes of the person who reaches it. The object gained matters, but it is the smaller part. Money can be spent, a position can change, and a possession can wear out. The discipline, courage, patience, and skill built while pursuing a worthy goal remain part of the person. For that reason he urged people to choose goals for their building power, not only for their reward. A goal that requires no growth may entertain for a while but it adds little strength. A goal that demands learning, consistency, and better judgment changes the person long before the finish line arrives. Consider a person who sets out to become debt free. The final payment is valuable, yet the deeper gain is the self control, record keeping, and honesty about money developed along the way. Those qualities then protect every future income. Or consider a shy person who works toward speaking clearly in public. Even the preparation builds confidence that spreads into work and family life. Ask of every major goal what kind of person its pursuit will require. If the answer is a stronger and wiser person, the goal is worth keeping.", "I choose goals by who they will make me become."], ["Self Education Makes the Fortune", "Formal education has its place. Schooling and training can qualify a person for work and give him the foundation for a living. Rohn never treated that as the end of learning. He taught that the education a person gives himself after formal schooling is what builds an exceptional life. Self education is deliberate. It means reading books that stretch the mind, learning from mentors, listening carefully, reflecting on experience, and studying subjects that school never assigned. No teacher checks the homework, so discipline must replace supervision. The person decides what to learn and keeps learning because his future depends on it. The contrast is clear. One person stops learning when the certificate is earned and slowly falls behind a changing world. Another keeps building knowledge year after year and becomes steadily more capable and valuable. Consider an adult who reads each evening about money, health, communication, and his own field. In five years his judgment is unrecognizable compared with the person who watched only entertainment in those same hours. Both had evenings. Only one used them as education. School may finish and the diploma may hang on the wall, but the education that changes a life must never finish.", "My schooling may be finished; my education never is."], ["The Two Pains", "Every person meets one of two pains. The first is the pain of discipline, felt in small daily acts such as rising on time, keeping a budget, finishing the task, and telling the truth when an excuse would be easier. The second is the pain of regret, felt later when a person sees what neglect has cost and knows the chance to act has passed. Rohn compared their weights. Discipline weighs ounces, because its discomfort is small and brief. Regret weighs tons, because it can sit on a life for years. No one escapes pain altogether, so wisdom lies in choosing which pain to accept. Discipline is chosen early and on purpose, while regret arrives uninvited after delay. Consider saving money. Setting aside a portion of each paycheck may pinch a little each month. Facing an emergency with nothing saved brings a far heavier weight of fear and shame. The same pattern holds for health, study, and relationships. A short honest conversation can be uncomfortable today, while years of silence can damage a family. The teaching is not harsh. It is merciful, because it shows that the lighter pain is available now, before the heavier one must be carried.", "I choose the ounces of discipline over the tons of regret."]]}, {"title": "The Five Major Pieces to the Life Puzzle", "intro": "From his book of that name: a successful life is a puzzle of five pieces that work together. Neglect one, and the picture stays incomplete.", "cards": [["Philosophy", "Philosophy is how a person thinks, and Rohn placed it first because everything else is built on it. Philosophy includes the beliefs a person holds about work, money, responsibility, other people, and what is possible for his own life. Those beliefs act as judgments made in advance. Long before a decision appears, philosophy has already narrowed what a person will consider and what he will dismiss. That is why two people can face the same facts and reach opposite conclusions. Their information matches, but their thinking does not. Upgrading philosophy is therefore the first work of change. It begins by examining ideas that were absorbed without testing, from childhood, from a workplace, from friends, or from years of disappointment. Some of them protect the person. Others quietly limit him. A worker who believes that learning ends with school will never build a library. A person who believes that all failure is final will never try again with better judgment. Consider someone who replaces blame with responsibility as a settled belief. He starts asking what he can adjust, and his whole life begins to move. Nothing outside changed first. His foundation did, and the building followed.", "I examine and upgrade my philosophy first."], ["Attitude", "Attitude is how a person feels and responds, and Rohn counted it as a separate piece because good thinking alone is not enough. A person may know what is right and still poison his effort with resentment about the past, fear about the future, contempt for others, or contempt for himself. Attitude colors every room he enters. It decides whether a setback becomes material for learning or fuel for complaint. It also shapes how other people experience him, which affects trust, teamwork, and opportunity. A well managed attitude does not pretend that hard things are pleasant. It refuses to let hard things rule the whole inner life. It faces the past honestly, learns its lesson, and stops paying for it every day. It meets the future with preparation rather than dread. Consider a worker passed over for a promotion. Bitterness makes him withdraw and prove the decision right. A steadier attitude makes him ask what skill was missing and build it. The event is the same. The response builds different futures. Attitude is an asset when it is managed on purpose, through reflection, gratitude, honest self talk, and good company. Left neglected, it quietly taxes everything philosophy tries to build.", "I manage my attitude like an asset, because it is one."], ["Activity", "Activity is what a person actually does, and it is the piece where philosophy and attitude either become real or remain talk. A person can hold sound beliefs and feel strongly motivated, yet nothing changes until those inner states become disciplined action. Activity means the calls made, the pages read, the money saved, the work finished, and the promises kept on ordinary days. It is the bridge between intention and outcome. Rohn stressed discipline inside activity because inspiration is unreliable. Feelings rise and fall, but a settled routine carries a person through both. Small actions repeated faithfully matter more than grand plans announced once. Consider a person who wants better health. Agreeing that health matters costs nothing. Walking each day, preparing better food, and sleeping on schedule are activity, and only activity changes the body. The same holds for a family budget, a business idea, or a course of study. Each becomes real at the point of doing. Activity also reveals the truth about the other pieces. If the action is consistently wrong, the philosophy behind it needs examination. If the action keeps stopping, the attitude behind it needs work. In the end, a life is judged by what its days actually contain.", "My philosophy shows up in what I actually do today."], ["Results", "Results are what a person measures, and Rohn treated them as honest feedback rather than as a source of pride or shame. Results are produced by philosophy, attitude, and activity working together over time. Income, health, savings, relationships, and skills all carry information about the pieces that produced them. Checking results often and honestly allows small corrections before large damage is done. A monthly review of spending can reveal a leak while it is still manageable. A check on health can expose a habit long before it becomes a crisis. The opposite habit is avoidance. A person who refuses to look at results protects his feelings for a while and loses the guidance results provide. He then repeats the same philosophy and activity and wonders why the outcome stays the same. Results should not be checked with panic or with excuses. They should be read the way a farmer reads a field, as a report on what was planted and tended. Consider a student whose test scores stay low. The scores are not his identity, but they are telling the truth about his study method. When he believes them and adjusts, results begin to change. Measurement is how a serious person stays in contact with reality.", "I look at my results without flinching; they tell me the truth."], ["Lifestyle", "Lifestyle is the kind of life a person builds, and Rohn insisted it means far more than the amount a person accumulates. Two people can earn similar incomes and live very differently. One turns money into pressure, display, and constant hurry. The other designs simple pleasures, time with family, good food shared well, and work that leaves room to breathe. Lifestyle is an art, and like any art it can be practiced and improved at the present level instead of postponed until some final success arrives. That point matters because many people delay all enjoyment until wealth comes, then discover they never learned how to live well at any level. Rohn taught people to practice now. A family with modest means can still keep a beautiful table, take a thoughtful walk, celebrate a small win, and treat guests with warmth. Those choices cost more attention than money. At the same time, lifestyle is the final piece, not the first. It grows honestly out of sound philosophy, a managed attitude, disciplined activity, and checked results. Built in that order, living well is neither pretence nor accident. It becomes the visible quality of a life that was designed on purpose.", "I practice living well now, at my present level, while I pursue more."]]}, {"title": "The Seasons of Life", "intro": "Life runs in seasons, like farming, and what is done in one season decides what can be gathered in another. The book gives the four seasons; here they are with the law underneath them.", "cards": [["Winter: Learn to Handle It", "Winter always comes. Rohn used the farming year to describe the hard seasons of a life, and he named their kinds plainly: economic winters when money tightens, physical winters when health fails, and personal winters when loss or disappointment settles in. No amount of wishing removes winter from the calendar. The person who expects life to stay in permanent summer is crushed by the first cold season, while the person who accepts winter as part of the pattern can prepare for it and learn inside it. The use of winter is growth. In winter a person can get stronger by enduring without surrendering, wiser by studying what went wrong, and better by building reserves and habits that comfort never required. Winter is also the season for honest reflection and quiet preparation, because spring always follows. Consider a worker whose hours are cut. Panic spends the little that remains and learns nothing. A steadier response cuts expenses, uses the free hours to gain a skill, and keeps applying for better work. The winter is still cold, but it becomes a training ground instead of a grave. Handle winter well, and a person meets spring ready rather than ruined.", "I use my winters to get stronger, wiser and better."], ["Spring: Take Advantage of It", "Spring follows winter as reliably as day follows night, and in Rohn's teaching spring means opportunity. It is the sowing season, the time to till the ground, plant the seed, learn the skill, make the application, and start the work. Spring is powerful, but it is also short. The window for planting does not stay open all year, and a person cannot recover a missed spring by working harder in the fall. That urgency is the heart of the teaching. Many people waste spring waiting to feel ready. They study the weather, compare themselves with other farmers, and promise to begin when confidence arrives. Meanwhile the season moves on and the field stays empty. Readiness usually grows after planting begins, not before it. Consider a young person offered a chance to learn a trade or join a class. The opportunity may look small and the timing imperfect, yet spring rewards those who sow while the ground is open. Plant more than one seed, because not every seed grows. Learn more than one skill, write the application, start the savings, and have the conversation now. When spring comes, the wise person is found in the field, not watching it pass.", "When my spring comes, I sow. I do not watch it pass."], ["Summer: Nourish and Protect", "Summer is the long season between planting and harvest, and its work is to nourish and protect what is growing. Seed planted in spring does not guard itself. Every garden draws pests and weeds, and Rohn applied that fact to every good value in a life. A family needs protection from busyness that crowds out affection. Work needs protection from carelessness that ruins a good reputation. Ideas need protection from voices that mock every serious effort. Health needs protection from habits that slowly undo it. Summer work is often unglamorous. It means watering on schedule, pulling small weeds before they spread, and staying attentive when the excitement of planting has faded. Many harvests are lost not because nothing was planted but because nothing was defended through the middle months. Consider a student who starts a course with energy in spring. By summer the lessons grow harder and distractions multiply. The student who keeps a steady routine and removes what competes with study protects the coming result. Or consider a small savings plan attacked by constant small spending. Guarding it is summer work. What is valued must be tended while it grows, all summer long, without apology for the vigilance.", "I protect what is growing in my life, all summer long."], ["Fall: Reap Without Complaint or Apology", "Fall is the harvest, the season when results can no longer be argued with. The field shows exactly what was sown in spring and protected in summer. Rohn taught two responses for this season, and both require maturity. If the crop is full, receive it without apology. Some people feel guilty about doing well, as if success must be excused. Honest work honestly rewarded needs no apology, only gratitude and good stewardship. If the field is empty, accept it without complaint. Blaming the soil, the weather, or other farmers does not fill a single basket, and complaint steals the lesson the empty field is offering. The harvest is feedback. A full one confirms the disciplines that produced it. An empty one exposes the planting or protecting that was skipped, and that knowledge becomes seed for the next cycle. Consider a worker whose year ends with little saved. Complaint says the pay was too low and stops there. Responsibility asks what was spent, what was never set aside, and what must change when the next spring opens. The past crop cannot be replanted, but the next one can. Fall therefore belongs to honest people, grateful in plenty and teachable in lack.", "I take full responsibility for my harvest, full or empty."], ["The Law of Sowing and Reaping", "Underneath the seasons stands a law: what a person plants, he gathers. Rohn called it the law of sowing and reaping, and he stressed that it works whether a person believes it or not. Plant neglect in study and the harvest is ignorance. Plant care in relationships and the harvest is trust. Plant small amounts of money consistently and the harvest is a growing reserve. The kind of seed decides the kind of crop, and repeated sowing decides its size. Nature adds a promise to the law, and the promise is multiplication. A farmer does not receive only the single seed he buried. He receives a plant carrying many seeds, provided he planted in the first place. That condition is the sobering part. Multiplication works on what was sown, and it cannot work on an empty field. Good intentions are not seed. Plans discussed but never acted on are not seed. Seed is the actual book read, the actual amount saved, the actual kindness done, and the actual work finished. Consider a person who encourages one colleague each week and shares what he learns. Over years he gathers a network of trust far larger than any single act. Plant generously and consistently, because time multiplies whatever is truly planted.", "I plant generously, because the harvest multiplies the seed."], ["Defeat: The Best Beginning", "Rohn ended the seasons teaching with defeat, and he called an honestly faced defeat the best beginning. That sounds strange until the mechanism is seen. Comfort rarely forces a person to examine his philosophy. Success can even hide weak thinking for a while. Defeat breaks the cover. It shows that the old beliefs, habits, and excuses cannot carry the life a person wants, and it creates the urgency that polite advice never produced. Many turning points begin exactly there, at the moment a person stops defending the old way and starts asking what must change in him. Defeat becomes a beginning only when it is faced honestly. Denial wastes it. Blame wastes it. Shame alone wastes it, because shame attacks the person instead of correcting the pattern. The useful response is examination. What did I believe? What did I neglect? What will I do differently when the next season opens? Consider a business failure that teaches a man to keep records, control debt, and study his market. The failure cost him much, but the lessons rebuilt him stronger than comfort ever had. A defeat surrendered to honesty can do what years of ease could not. It can start a new philosophy, and a new philosophy can start a new life.", "My defeats are beginnings, if I let them teach me."]]}, {"title": "7 Strategies for Wealth and Happiness", "intro": "His book's premise: wealth and happiness are not rivals. They spring from the same source, and both are built by strategy, not by luck. The seven strategies, in the publisher's order.", "cards": [["Unleash the Power of Goals", "Goals give direction to effort, and Rohn taught that they must be clear and written to carry real power. A vague wish drifts with mood, but a written goal can be reviewed, measured, and pursued on an ordinary Tuesday. Writing forces a person to decide what he actually wants, in specific terms, instead of hiding inside general hopes for a better life. Yet Rohn insisted the deepest reason for a goal is not the thing it buys. A goal earns its keep by the person it compels the goal setter to become. Reaching for a serious goal requires discipline where there was drift, courage where there was hesitation, and skill where there was guesswork. Those inner changes outlast the goal itself. Consider a person who sets a written goal to save a definite amount in a year. The savings matter, but so do the habits formed along the way: tracking spending, refusing impulse purchases, and keeping a promise to himself month after month. Even if the final number falls slightly short, he is no longer the same person with money. Treat goals as growth assignments written in plain language. Let them be specific enough to guide action and large enough to require becoming more.", "I write my goals down, and I let them stretch me."], ["Seek Knowledge", "Knowledge is gathered, not stumbled into, and Rohn named two sources that every serious person should work. The first is your own life. Experience teaches, but only the person who examines it receives the lesson. A mistake reviewed becomes wisdom, while a mistake merely suffered tends to repeat itself. The second source is the lives of others. Books carry the distilled experience of people a reader will never meet. Mentors shorten the road by naming dangers they have already survived. Careful observation of both success and failure adds further instruction without requiring every tuition fee to be paid personally. The key is application. Knowledge that stays as information changes nothing, and Rohn treated unused learning as another form of neglect. Each idea gathered should be tested in action, reflected on, and kept where it can be found again, such as in a journal. Consider a worker who reads about negotiation before asking for a raise, then reviews afterward what worked. He has combined study, action, and reflection into progress. Or consider a parent who learns from an older couple whose family stayed close. Their experience becomes guidance without the parent repeating their early errors. Seek knowledge deliberately from both sources, and put it to work quickly.", "I study my own life and the lives of others, on purpose."], ["Learn the Miracle of Personal Development", "At the center of Rohn's system stands personal development, the miracle of learning to change yourself. He returned to one comparison again and again: what you become matters more than what you get. A prize can be lost and a position can end, but the person built in the process remains. Income and opportunity also tend to grow as the person grows, because a more skilled, disciplined, and trustworthy person can carry more responsibility and create more value. This is why he called learning to change the miracle. It is available to anyone willing to work on his own philosophy, habits, and abilities, yet it transforms everything it touches. The contrast is the person who demands a changed life while protecting every old pattern. He wants new results from an unchanged self, and the contradiction defeats him. Personal development takes the opposite road. It asks what must be read, practiced, released, and built in me so that better results become natural. Consider a supervisor who works on patience and clear communication. Her team steadies, her reputation grows, and doors open that force could never have opened. She did not merely chase advancement. She became the kind of person advancement fits. Make yourself the project, and growth becomes the strategy underneath every other strategy.", "I am the project. My growth is the strategy."], ["Control Your Finances", "Whether a person ends rich or poor depends less on the size of his income than on the use he makes of it. Rohn saw people earn large amounts and keep nothing, because no plan governed what arrived, and he saw people of modest income build security through steady allocation and restraint. Control therefore means giving money assignments before emotion spends it. A definite plan decides in advance what portion supports living, what portion is given, what portion is saved, and what portion is put to work. Without that decision made ahead of time, every purchase argues its own case and usually wins. Financial independence is the direction of this strategy. It does not arrive by accident or by one lucky increase in pay. It grows as a discipline, paycheck by paycheck, as resources are directed instead of scattered. Consider two households with the same income. One spends first and saves whatever survives, which is usually nothing. The other saves and gives from the top, then lives within the remainder. After ten years their positions differ greatly, though their earnings never did. The difference was control. Treat money as something to be directed by a written plan, reviewed regularly, and adjusted honestly as life changes.", "I control my money by a plan, not by mood."], ["Master Time", "Time holds a value that money cannot match. Money spent can be earned again, but a day spent is gone permanently, and no effort can manufacture another one. Rohn therefore taught people to master time by designing days and weeks on paper before those days begin. Planning is not about filling every minute. It is about deciding what matters most while the mind is calm, so that urgency and other people's demands do not decide instead. A day left undesigned will still fill up, usually with whatever shouts loudest or feels easiest. A day designed in advance gives the important work a place before the trivial work takes one. Consider a worker who spends a few minutes each evening listing the next day's main tasks in order. He starts the morning knowing his first job, instead of losing the best hour to messages and drift. Over a year, those recovered hours become books read, skills learned, and projects finished. The opposite person lets each day run him, always busy and rarely advancing. Rohn's choice is plain. Either you run the day, or the day runs you. Treat days as expensive, because they are, and spend them where your goals say they matter.", "I run my day, or my day runs me. I choose the first."], ["Surround Yourself with Winners", "Association works quietly. Rohn described it as a silent, gradual, and powerful influence, which is exactly why it escapes notice. No single conversation remakes a person, but hundreds of hours among the same voices shape his standards, his vocabulary, his spending, his humour, and his sense of what is normal. Spend your time with people who keep their word, work diligently, and speak about building, and those standards begin to feel natural. Spend it with people who mock effort and excuse every failure, and ambition itself starts to feel embarrassing. The strategy is deliberate choice. A person cannot control every encounter at work or in family life, but he can choose where his discretionary hours go and whose counsel he seeks when decisions matter. He can join the class, attend the meeting, invite the mentor, and place himself where better habits are ordinary. Consider a young man who begins eating lunch with colleagues who study for qualifications instead of colleagues who only complain. Within months his evenings change, because his sense of normal has changed. Nothing was forced on him. Proximity did the teaching. Surround yourself with winners in character and discipline, and let their standard pull your own life upward a little every week.", "I choose my company like it shapes my future, because it does."], ["Learn the Art of Living Well", "Living well is an art, and Rohn taught that it should be practiced now rather than postponed until riches arrive. The art has two sides held together. Be happy with what you have, and keep pursuing what you want. Gratitude without ambition can settle into passivity, while ambition without gratitude becomes a restless life that never enjoys a single arrival. Held together, they produce a person who works hard toward the future and still eats today's meal with pleasure. Living well does not require wealth. It requires attention and taste, the decision to do small things well: a meal shared without hurry, a modest celebration done properly, good conversation, rest taken without guilt, and kindness shown in ordinary moments. A family can practice these at any income level. Consider parents who mark a small achievement with a simple, deliberate evening at home rather than waiting for a large success to justify joy. The children learn that life is to be lived along the way, not only at the destination. Wealth may later enlarge the setting, but it cannot supply the art to someone who never practiced it. Learn to live well at the present level, and pursue more without despising what is already in your hands.", "I enjoy what I have while I pursue what I want."]]}, {"title": "The Five Abilities", "intro": "From The Art of Exceptional Living: five abilities of a person who gets the most out of life. The book calls life a university; these are how you attend it.", "cards": [["Absorb", "To absorb means getting from the day rather than merely getting through it. Many people survive their days, counting hours until work ends, the week ends, or the difficulty passes. Rohn urged a different posture, that of a serious student inside what he called the university of life. A student absorbs. He takes in not only words and knowledge but also atmosphere and experience, noticing what a place, a person, and even a failure are teaching. Absorption requires attention. It means listening fully in a conversation instead of rehearsing a reply, watching how a skilled person handles pressure, and asking what a hard day revealed about patience or preparation. The material is everywhere, but only the attentive collect it. Consider a junior worker assigned a dull task beside an experienced colleague. One worker endures the hour and leaves empty. The other watches how the colleague organises tools, checks work, and speaks to customers, and leaves with methods worth years of trial and error. Their days looked identical from outside. Their absorption made them different. Practice this ability by ending each day with one honest question about what the day offered. Over time, ordinary days become a rich education that careless people walk past without seeing.", "I get from every day, not just through it."], ["Respond", "To respond means letting life touch you emotionally instead of sealing yourself against it. Rohn taught that sad things should be allowed to make a person sad and happy things should be allowed to make him happy. That sounds simple, yet many people protect themselves by going numb. They hear good news and barely smile, or they witness loss and rush past it without feeling its weight. Numbness may feel safe, but it flattens judgment as well as joy, because emotions carry information about what matters. He added that emotions, like the intellect, need educating. Responding does not mean being ruled by every feeling or displaying every feeling without restraint. It means letting feelings register honestly, then shaping their expression with maturity. Grief can become compassion. Anger at injustice can become resolve to act rightly. Joy can become gratitude instead of arrogance. Consider a father who truly celebrates his child's small victory instead of glancing at his phone. The child feels seen, and the father himself stays alive to the moments that make family life rich. Or consider a friend who sits with another person's sorrow without hurrying to fix it. That shared feeling becomes strength. Stay human while you grow, and let an educated heart inform your choices.", "I let life touch me; I stay human while I grow."], ["Reflect", "Reflection is the discipline of running the past again so that it can be invested in the future. Experience alone does not automatically become wisdom. An unexamined day is spent and gone, but a reflected day pays twice, once in the living and once in the lesson. Rohn gave reflection a practical rhythm instead of leaving it vague. Take a few minutes at the end of the day to review what happened and what it taught. Take a few hours at the end of the week for a wider look. Give half a day at the end of the month, and a weekend at the end of the year, to consider direction, results, and the person you are becoming. Each larger review catches patterns that a single day cannot show. Consider a worker who notices in a weekly review that every late morning follows a late night. One small adjustment to the evening improves the whole following week, a gain no single day of effort could have produced. Reflection also protects gratitude, because reviewing the past makes progress visible that daily pressure hides. Keep a journal for these reviews so lessons are recorded rather than trusted to memory. What reflection uncovers, the future gets to use.", "I reflect on schedule: daily, weekly, monthly, yearly."], ["Act", "To act means setting up disciplines while intent and inspiration are still strong. Rohn warned of a pattern every person recognises: intention weakens with delay. A person hears a good idea, feels fully persuaded, and promises to begin later. Days pass, the feeling cools, objections grow louder, and the idea joins the pile of things he once meant to do. Acting early breaks that pattern. While resolve is warm, decide the specific discipline, set the time, prepare the tools, and take the first step, however small. A first step turns a wish into a direction and creates momentum that motivation alone rarely sustains. He also taught that every discipline affects the rest of life, and so does every neglect. Keeping a promise about exercise strengthens the confidence used at work. Ignoring a small financial duty weakens the self trust needed everywhere else. Nothing stays contained. Consider someone inspired to study each morning. If she sets the alarm, places the book ready, and begins the next morning, the discipline starts building her. If she waits for a perfect start date, the intent fades. Act while intent is hot, and let action, not feeling, carry the intention forward.", "I act while my intent is hot, not after it cools."], ["Share", "To share means passing good ideas and real experience on to others instead of keeping every gain private. Teaching completes learning, because a person who must explain an idea clearly discovers what he only half understood. Sharing also multiplies value. A lesson that cost you years can save another person the same years, and a word given at the right moment can redirect a life in ways the giver never sees. Rohn added a further reason that is easy to miss: human capacity expands as it pours out. A person who gives knowledge away makes room to receive more, the way a container emptied in service can be filled again. Hoarding, by contrast, shrinks a life around its own store. Sharing need not be grand. It can be a book lent with a recommendation, a mistake described honestly to a younger worker, or an encouragement spoken today rather than saved for a special occasion. Consider a tradesman who trains an apprentice generously instead of guarding his methods. His own mastery deepens, his reputation grows, and his skill outlives his working years in another person's hands. What you share does not leave you poorer. It establishes your learning, widens your influence, and prepares you to receive the next lesson.", "I pour out what I learn, and I make room for more."]]}, {"title": "The 70/10/10/10 Rule", "intro": "His allocation plan for after tax income, on the road to financial independence: living from the income of your own resources. Start with the first income, however small. The amounts matter less than the discipline.", "cards": [["70: Live On It", "Seventy percent is the portion of after tax income assigned to living. It covers necessities such as housing, food, transport, and clothing, together with the lifestyle spending that makes daily life enjoyable. Rohn's discipline is the ceiling. Life is lived inside the seventy rather than beyond it, and that single boundary protects the rest of the plan. Without a ceiling, expenses expand quietly until they consume everything, a pattern that works at every income level. A raise then changes nothing except the size of the spending, and the person feels as pressed at a higher income as at a lower one. Living inside a fixed portion forces honest choices. It asks which expenses truly serve the household and which only imitate the lives of others. It also creates peace, because the other portions for giving, enterprise, and saving are no longer competing with every purchase. Consider a family that treats the seventy as firm for a year. They may cook more, delay a larger car, and plan pleasures deliberately, yet they end the year with savings growing and no new debt. Their income did not rise. Their structure did. Whatever the income is, assign living its share, hold the line kindly but firmly, and let the remaining thirty do its long term work.", "I live inside my seventy, whatever my income is."], ["10: Give It", "Ten percent of after tax income is assigned to giving, directed to charity and to helping others. The position of this portion in the plan matters as much as its size. Giving is built in from the start, taken from the top of the income, rather than treated as whatever might remain after every other appetite has been fed. Anyone who waits for leftovers discovers that leftovers rarely appear. Rohn taught giving as a discipline for households at every level, beginning with the first income however small, because the habit formed on small amounts is the habit that survives large ones. A person who cannot give a small portion faithfully will not suddenly become generous when the numbers grow. Giving also shapes the giver. It loosens the grip of money, keeps success connected to other people, and reminds a household that income is a trust as well as a tool. Consider a worker with modest pay who sets aside a small, fixed amount each month. Over a year that amount helps a neighbour in crisis, supports a cause he believes in, and quietly changes his own relationship with money from fear toward stewardship. Start where you are. Give the ten deliberately, cheerfully, and consistently, and let generosity become part of the financial structure rather than an occasional impulse.", "I give my ten from the top, not from the leftovers."], ["10: Active Capital", "Active capital is the ten percent put to work for profit. This portion goes into enterprise: buying and fixing, making and selling, or investing where the money participates in creating value. Rohn separated this from saving on purpose. Saving protects and accumulates, while active capital learns to produce. It is money sent out to work for its owner, and like any worker it needs direction, patience, and honest evaluation. The amounts begin small for most people, and that is expected. A modest sum used carefully teaches lessons that large sums would make expensive: how to judge an opportunity, how to price, how to wait, and how to accept a small loss without panic. Skill grows alongside capital. Consider a worker who sets aside this portion until it can buy simple equipment, then earns extra income offering a service on weekends. The first returns may be minor, but the direction has changed. Part of his living now comes from assets and effort he built, not only from hours he sold. Mistakes belong to this education, provided they stay within the portion assigned and never touch money needed for living or reserves. Put ten percent to work steadily, study each result, and let money gradually become a servant that helps carry the future.", "I put ten percent to work, buying and building value."], ["10: Passive Capital", "Passive capital is the ten percent assigned to steady saving. Its first job is protection. Saved money builds a reserve that stands between a household and the emergencies that visit every life: a broken car, a medical bill, a gap between jobs. Without a reserve, each emergency becomes debt, and debt then consumes future income. With a reserve, the same emergency becomes an expense that can be handled with dignity and calm. Over time this portion does a second job. Steady saving accumulates into future investment capital, giving a person the ability to act when a genuine opportunity appears instead of watching it pass for lack of funds. The habit matters more than the amount at the start. Saving a small portion from every paycheck, in every season, builds both the reserve and the saver. Consider a young worker who saves ten percent automatically before spending begins. In the first months the balance looks unimpressive and easy to dismiss. After several years the same habit has produced real security and real choices. That is the quiet arithmetic of this portion: unremarkable deposits, faithfully repeated, becoming peace of mind. Save before spending, keep the reserve separate, and let consistency do what occasional large efforts cannot.", "I save ten percent steadily, in every season."], ["Financial Independence", "Financial independence is the goal toward which the whole allocation plan walks. Rohn defined it plainly: being able to live from the income produced by your own personal resources. At that point a person works by choice rather than by compulsion, because his resources carry his living. Most people picture independence as a distant destination reached by a sudden change, such as a large promotion or a lucky break. Rohn treated it as a direction travelled by allocation. Every paycheck either moves a household slightly toward independence or slightly away from it, depending on whether money was directed by plan or scattered by impulse. That makes independence a present tense discipline long before it becomes a final condition. Giving, saving, and putting capital to work are not decorations on the plan. They are the very steps of the road. Consider a household that follows the allocation for years without drama. Reserves grow, debts shrink, and income producing assets slowly appear. No single month looked remarkable, yet the family is plainly freer than it was. The person still far from the destination should not be discouraged by the distance. Direction matters first. Walk toward independence with every paycheck, and time becomes an ally instead of an expense.", "I walk toward financial independence with every paycheck."]]}, {"title": "Associations: Who Is Around You", "intro": "You tend to become the average of the five people you spend the most time with: attitudes, habits, income, conversation, all drift toward the circle. So examine the circle with three questions, and answer with one of three responses.", "cards": [["Question One: Who Is Around Me?", "The first question of association is simple: who is around me? It asks for an honest inventory of the people whose voices fill your days. Most people never take this inventory. Their circle formed by accident, through a workplace, a neighbourhood, old habits, or whoever happened to be nearby when life was busy. Yet influence does not require permission. The people a person eats with, works beside, and relaxes among are shaping his expectations whether he examines them or not. Naming the circle is therefore the necessary first step toward choosing it. The inventory should be honest rather than harsh. List the people who take most of your time and attention, including voices carried through a phone or a screen, because repeated voices count even without physical presence. Notice whose opinions you quote, whose habits you copy, and whose approval you seek without thinking. Consider a man who realises his closest daily influence is a group chat filled with complaint and mockery of anyone trying to improve. He had never chosen that influence. It had simply accumulated around him, hour by hour. Seeing it clearly does not yet change it, but nothing changes before it is seen. Look carefully, name the people shaping you, and let honesty replace the comfort of not asking.", "I can name the people shaping me, because I have looked."], ["Question Two: What Are They Doing to Me?", "The second question looks beneath the surface of the circle: what are they doing to me? Association works gradually, so its effects hide inside what feels normal. A person should trace the influence concretely. What has the circle done to his reading, replacing study with entertainment or the reverse? What has it done to his spending, his standards of honesty, his language, his health habits, and the size of his ambitions? Each answer reveals a direction. Influence rarely announces itself. It arrives as laughter at a serious goal, as the repeated suggestion that effort is pointless, or as quiet admiration for discipline that makes discipline easier to practice. Consider a woman who joins colleagues who save part of every paycheck and discuss their progress. Within a year her own savings exist for the first time, not because anyone lectured her, but because saving had become the normal behaviour around her. The opposite drift is just as real and just as quiet. A person surrounded by lateness becomes late. A person surrounded by excuses learns to manufacture them. Tracing the effect is not an exercise in blaming friends. It is an audit of forces acting on your future, done so those forces can be judged rather than merely obeyed.", "I trace what my circle is quietly making of me."], ["Question Three: Is That Acceptable?", "The third question brings the audit to a verdict: given where you intend to go, is this influence acceptable? The first two questions gather facts. This one measures those facts against a destination. Influence that is harmless for one ambition may be ruinous for another. A circle content with drifting cannot carry a person who intends to build a business, raise a strong family, or master a demanding skill. Comfort is the wrong standard for the judgment, because the most damaging influences often feel the most comfortable. They ask nothing, challenge nothing, and laugh at nothing except effort. Rohn's point is that a person must judge his influences by his destination, not by how easy they feel today. If the answer is no, something must change, and the change has two forms. A person can adjust the dosage, spending less time where the influence flows strongest, or in serious cases he can change the company itself. Consider a student serious about qualifying who realises his evening circle treats study as a joke. He does not need hatred or drama. He needs a decision measured against his goal. Ask the question plainly, answer it honestly, and let your intended future, not present comfort, deliver the verdict.", "I judge my influences by my destination, not by comfort."], ["Response One: Disassociate", "The strongest response to a damaging circle is disassociation: withdrawing from people who are clearly destructive to your future. Rohn reserved this response for serious cases, where the influence is not merely unhelpful but actively pulling a person toward ruin, such as companions who press him into addiction, dishonesty, or contempt for his own family and ambitions. In such company, loyalty is often used as an argument for staying. The harder truth is that some associations cost more than loneliness. A season of being alone while rebuilding is cheaper than years spent recovering from damage that company caused. Disassociation does not require cruelty, speeches, or public condemnation. A person can withdraw quietly, decline the invitations, stop visiting the places, and let the distance grow while he builds a new pattern of life. Consider a young man whose closest friends treat theft and drunkenness as entertainment. Every plan for a better life dies in that company by the weekend. Walking away feels like losing everything, until he counts what staying was costing him. His future was the price. Protect it. Some doors must close completely so that a life can open elsewhere, and closing them is an act of self respect rather than pride.", "I walk away from what is destroying my future."], ["Response Two: Limit", "Not every unhelpful relationship must end. Rohn's second response is limitation: with people of neutral or mixed influence, limit the time. Some relatives, old friends, and colleagues are genuinely kind yet carry habits that work against your direction, such as chronic negativity, careless spending, or an appetite for gossip that consumes every gathering. Cutting such people off entirely may be unnecessary and unkind. Giving them unlimited access, however, allows their influence to set your normal. Limitation finds the proper size for the relationship. Shorten the visit. Choose the setting carefully. Meet for a meal instead of a whole weekend, enjoy the genuine good in the person, and leave before the drift begins. Time is the currency of influence, so reducing time reduces influence without severing affection. Consider a worker who loves his brother but knows their long evenings together always end in spending he regrets. He begins meeting him for breakfast instead, keeps the bond, and removes the pattern that harmed him. Nothing about the love changed. The dosage did. This response requires honesty and tact in equal measure, but it protects many good relationships that total separation would destroy. Limit what does not help you grow, without hatred, and invest the recovered hours where they build your future.", "I limit what does not help me grow, without hatred."], ["Response Three: Expand", "The third response is the hopeful one: expand your association with people of substance and accomplishment. Limitation and disassociation remove harm, but removal alone leaves empty hours that old patterns will happily refill. Expansion fills those hours deliberately with better influence. Seek people whose standards pull you upward by proximity: the disciplined colleague, the wise older couple, the skilled tradesman who takes pride in his work, the friend who reads and builds and keeps his word. Their company recalibrates what feels normal. Effort looks ordinary around them. Excellence looks attainable instead of arrogant. Getting near such people takes initiative. Join the class or group where they gather. Ask a thoughtful question and listen well. Offer help, be reliable, and become someone worth their time, because strong association is mutual. Consider a young parent who begins spending regular time with an older family known for patience and good order. Without a single formal lesson, the younger household absorbs rhythms of speech, discipline, and hospitality that books alone had not produced. That is proximity teaching. Expand on purpose and keep expanding as you grow, since each new level of life requires examples who live beyond it. Spend more time with people who make you better, and let their standard become your atmosphere.", "I expand my time with people who make me better."]]}, {"title": "His Goal Setting Method", "intro": "Rohn's workshop method, in his order of working. The heart of it: the real value of a goal is what it makes of the person who pursues it.", "cards": [["List Fifty or More", "The method begins with a long list. Rohn directed his students to take a focused sitting, away from interruption, and write down at least fifty things they want to do, be, have, and see across the next one to ten years. The size of the list matters. A short list shows only the obvious wishes that daily pressure allows, while fifty items force the imagination past the urgent and into the life a person actually wants. Dream first and judge later. During the listing, cost, likelihood, and other people's opinions are set aside, because early judgment strangles wishes before they can reveal what truly matters to the writer. Some items will be large, such as building a business or mastering a field. Others will be small and joyful, such as a trip, a skill, or a room of one's own for study. All belong on the page at this stage. Consider a parent who begins reluctantly and then finds, somewhere past the twentieth item, the goal that genuinely moves her: returning to study. That discovery was buried under routine until the list dug it out. Keep the list long, write without censoring, and remember that a person cannot aim at goals he has never allowed himself to name.", "I keep a long list, and I dream it before I judge it."], ["Mark Each: 1, 3, 5 or 10 Years", "Once the long list exists, each goal receives a time frame: one year, three years, five years, or ten years. This step turns a wish collection into a working map, because timing reveals balance. Rohn warned his students to check that balance honestly. A list crowded with one year goals and almost nothing beyond them shows a person who is not thinking far enough ahead. Short goals keep life moving, but long goals give life direction and pull a person through slow seasons. A ten year goal also changes present behaviour, because the person who sees far tends to plant early. The marking is an estimate, not a prophecy. Some goals will arrive sooner and others later, and the list is a living document rather than a contract carved in stone. As goals are achieved, celebrate them properly. Celebration is part of the method, not vanity, because acknowledged progress strengthens the confidence to attempt the next goal. Then keep adding new items so the list never empties. Consider a worker whose list holds four ten year goals for the first time. He begins saving and studying differently that same month, not from panic, but because a distant picture has started organising his present. Let your list look years ahead, and review its balance whenever you review your direction.", "My list looks years ahead, not just months."], ["Check the Three Kinds", "A healthy goal list carries three kinds of goals, and Rohn named them plainly. Economic goals concern income, profits, savings, and the road toward financial independence. Things goals concern material wants, large and small, from necessary equipment to a home or a vehicle or an experience that costs money. Personal development goals concern the person himself: skills to master, character to build, habits to replace, and knowledge to gain. Checking a list against these three kinds exposes its gaps. Many people discover their list is almost entirely things, which means it describes shopping rather than a life. Things are legitimate, but they cannot carry a person by themselves, because possessions give no strength for the next challenge. Economic goals without development goals are also unstable, since money tends to follow the level of the person managing it. Development goals are the roots of the other two kinds. Consider a man whose list shows no learning goals at all. Adding study, health, and character goals does not shrink his ambitions. It gives them a foundation that can support them. Review your own list by kind. If one category is missing, the imbalance will eventually show in results. Cover money, things, and becoming, and let each kind strengthen the others.", "My goals cover money, things, and the person I am becoming."], ["Choose the Four Majors", "From each time frame on the list, choose the four most important goals. Those selected goals are the majors, and everything else becomes a minor, to be treated accordingly. This step is where goal setting becomes strategy. A person who treats fifty goals as equally urgent will scatter his effort until none of them receives enough to succeed. Majors concentrate force. They tell a person where his best hours, his learning, and his money should go first, and they give him permission to let minor goals wait without guilt. Four per time frame keeps the load serious but humanly possible across the one, three, five, and ten year horizons. Choosing majors also forces honesty about values. When two attractive goals compete, the one a person selects reveals what he truly wants his life to become. Consider a student who names qualification, debt freedom, health, and a stronger family life as her current majors. Invitations and purchases can now be judged quickly against those four, and most daily confusion disappears. Her minor goals are not abandoned. They are simply kept in their place, neither stealing focus nor demanding equal resources. Know your majors for each season of life, name them clearly, and let everything else find its proper rank beneath them.", "I know my four majors for each season of my life."], ["Describe in Detail, and Write the Why", "For each major goal, write two things in full: a detailed description and the reasons behind it. The description must move past a label into specifics. Not a better income, but the amount, the source, and the date aimed for. Not a stronger body, but the weight, the strength, or the daily capacity intended. Detail makes a goal visible to the mind and measurable in progress. Then write the why, and write it honestly. Rohn called reasons the fuel of the whole method. Clear and strong reasons produce strong effort, because a person works hardest when he knows exactly whom the work serves and what it protects. Vague reasons produce half hearted effort that collapses at the first difficulty. Reasons can include family, freedom, duty, gratitude, and the kind of person one intends to become. Consider a father pursuing a qualification. On paper the goal is an examination. His written reasons name his children's security and the example his persistence will set at home. On the hard evenings, those sentences carry him back to the desk. Write the description so the target cannot hide, and write the reasons so they can pull you through resistance. Review both whenever effort weakens.", "My majors carry written reasons strong enough to pull me."], ["Work Short Range Goals Daily", "Long goals need daily companions. Alongside the major goals for the coming years, Rohn taught his students to set short range goals for today, this week, and this month: small, definite wins he called confidence builders. Their size is their virtue. A long goal can feel distant for years, and a person waiting only for its arrival may lose heart in the middle. Short range goals give the mind regular evidence that effort works and promises can be kept. Confidence built on kept promises is not empty motivation. It is a record. Each finished task tells the person that his word to himself can be trusted, and that trust carries him into larger attempts. The pattern also creates momentum. One completed step makes the next step easier to begin, and days begin to link together into a visible chain of progress. Consider a man working toward a qualification three years away. Today's goal is one chapter studied well. This week's goal is a practice test completed and reviewed. Neither feels heroic, yet both are the long goal arriving in daily form. Choose short range goals definite enough to finish and honest enough to matter. Stack small wins daily and weekly, review them with satisfaction, and let their accumulated confidence carry the ambitions that take years.", "I stack small wins daily; they carry my big goals."], ["Keep Them in the Journal", "Goals belong in the journal, written down and kept where they can be reviewed regularly. Rohn treated the act of writing itself as significant: putting a goal on paper is the sign that a person is serious, because it moves the goal out of passing thought and into a commitment that can be revisited and measured. Memory is a poor keeper of commitments. It edits them when they become inconvenient and forgets them when life grows loud. A journal does neither. It holds the original words, the reasons written beside them, and the record of progress made since. Review then becomes a working session rather than a vague feeling. A person can see which majors advanced, which stalled, and what the next honest step should be. Goal setting, in this teaching, is a continuing process and not a one time event. Achieved goals are marked and celebrated. New goals are added as vision grows. Time frames are adjusted as life teaches better estimates. Consider a woman who reviews her journal at the end of each month. She is never surprised by her own direction, because she meets it on paper twelve times a year. Keep your goals written, kept, and reviewed, and let the journal turn intention into an ongoing conversation with your future.", "My goals are written, kept, and reviewed."]]}, {"title": "The Serious Student: Reading and the Journal", "intro": "How Rohn gathered wisdom for forty years: deliberate reading, a real library, and a journal he would not trust his memory to replace.", "cards": [["Study What You Wish to Become", "Whatever a person wants to achieve must become a subject of deliberate study. Rohn's point cuts against a common habit: wanting the result of a field without studying the field. A person wants financial strength but never studies money, wants a strong family but never learns from those who built one, or wants skill in his work while giving his learning no schedule at all. Deliberate study closes that gap. It means choosing what must be learned, finding sound material and sound teachers, and returning to the subject regularly until knowledge becomes judgment. Wisdom, in his teaching, is gathered from two stores. The first is your own experience, examined honestly rather than merely endured. The second is the experience of others, carried through reading, listening, and observing people who have travelled the road ahead of you. Using both stores shortens the journey and lowers its cost, because not every lesson must be purchased with personal failure. Consider a new manager who studies leadership weekly and reviews her own meetings in a journal. Within a year her judgment outgrows that of colleagues with longer service but no study habit. The difference was not talent. It was attention organised into learning. Study deliberately what you intend to become, and let the study continue as long as the intention does.", "I study deliberately what I intend to become."], ["Read Every Day", "Reading every day is one of the simplest disciplines Rohn ever gave, and he attached a large promise to it. Even thirty minutes a day of challenging material, sustained over a few years, can transform a life. The arithmetic is quiet but powerful. Half an hour daily becomes many books a year, and those books carry ideas about money, health, character, history, and human behaviour that rearrange a reader's decisions one by one. The condition is the kind of material. He warned against reading only what is easy. Entertainment has its place, but entertainment does not grow a person, any more than dessert alone builds a body. Challenging reading asks the mind to stretch, to meet unfamiliar ideas, and to argue, absorb, and apply. A serious reader chooses books the way a serious eater chooses food, with the future in mind. Consider a worker with a long commute who gives thirty minutes of it to a substantial book instead of idle scrolling. In three years he has finished dozens of books and quietly become the person colleagues ask for perspective. No dramatic event occurred. A daily half hour compounded. Protect the time, choose material that stretches you, and treat missed reading as a real loss rather than a small one.", "I read something challenging every day, even briefly."], ["Build a Balanced Library", "Rohn taught his students to build a balanced personal library, not a random pile of books. His recommended spread joined wisdom with practice. History shows how societies and people rise and fall across long stretches of time. Philosophy sharpens the thinking by which a person judges everything else. Biographies put whole lives on display, with their decisions and consequences visible from beginning to end. Novels train the imagination and deepen understanding of human nature. Alongside these belong practical subjects such as accounting and law, enough for a person to understand his own affairs, read his own documents, and defend his ideals with something stronger than opinion. Balance matters because a one sided library produces a one sided mind. All inspiration and no practical knowledge leaves a person sincere and vulnerable. All technique and no wisdom leaves him efficient and hollow. Building such a library takes years and should. Each shelf added reflects a stage of growth and a subject taken seriously. Consider a young family that begins with a few biographies and a basic book on money, then adds history and works of faith and character over time. The shelves become a map of their becoming. Build slowly, buy the best you can, reread the strongest works, and let your library stand as evidence of a mind under deliberate construction.", "My library is balanced: wisdom and practice, shelf by shelf."], ["Do Not Trust Your Memory", "Do not trust your memory with anything valuable. That was Rohn's practical rule, learned from his own early losses. Before he kept a journal, he wrote ideas on envelopes, placemats, and scattered scraps of paper, and those scattered notes got lost, taking their value with them. Memory adds its own unreliability. A striking idea feels unforgettable in the moment it arrives, yet a week of work and family life can erase its wording and most of its force. The journal solves both problems. It is the appointed place where ideas are organised and kept: lessons from books, observations from the day, solutions to problems, and the goals a person intends to pursue. Writing also improves the idea itself, because putting a thought into sentences exposes its gaps and forces it into usable shape. The discipline is simple. Carry the journal, and when something valuable appears, write it down the same day. Date it, keep it findable, and review it so the record becomes learning rather than storage. Consider a worker who captures one good idea from a conversation instead of trusting recall. Months later that single note redirects a project and repays years of journal keeping. Treat valuable thoughts as valuables. Valuables are recorded, kept in one place, and guarded, never left scattered wherever they happened to fall.", "I write down what is valuable, the day I meet it."], ["The Costly Blank Book", "Rohn bought expensive blank journals on purpose, and his reason reveals how seriously he took the student's life. The price of the book pressed him to find material valuable enough to fill it. A cheap notebook invites careless scribble, but a costly blank book issues a challenge every time it is opened: is what you are about to write worthy of these pages? That challenge turned him into a hunter of good material. He listened more carefully in conversations, read with a pen in hand, and reviewed his days for anything worth keeping, because the book demanded content of weight. The journal, for him, was one of the clearest signs of a serious student: a student of his own life, his own future, and his own destiny. Anyone can attend events and forget them. The student records, organises, and returns to what he gathered. You need not copy the expense to copy the principle. Choose a journal you respect, keep it in one place, and refuse to waste it on nothing. Consider a young person who begins recording one lesson a day in a book she values. The habit c
