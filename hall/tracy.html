ute runs through making someone else happy, because the feeling you create in another person returns to you as your own mood and self esteem. Tracy presents this as a law because it holds so consistently, and The Power of Self Confidence places it at the start of personal power for a reason. So much of confidence is relational: we feel strong among people we believe value us, and that value is usually the harvest of value we first gave. Practise indirection deliberately for a week. In each conversation, aim to leave the other person feeling more respected, more believed in and more interesting than when the conversation began. Watch what returns. Indirect effort is slow looking and fast working, all at once.", "I earn interest, respect and happiness indirectly, by first giving them sincerely to other people."], ["Guard Your Suggestive Environment", "The inner game chapter of The Power of Self Confidence gives suggestion a central place: your mind accepts repeated suggestions, from people, media and your own mouth, and builds them into belief. Control your suggestive environment is therefore a confidence discipline, not a matter of taste. Notice who gets to speak into your life daily. A steady companion of mockery and contempt will suggest that effort is naive. A steady diet of alarm will suggest that the world is ending and nothing you do matters. A workplace that treats dishonesty as cleverness suggests that integrity is for the slow. None of these suggestions arrives as an argument you can debate. They arrive as atmosphere, and atmosphere settles into assumption. Guarding the environment means choosing your inputs with the seriousness of a person who knows he is being programmed either way. Spend more time with people whose conduct you would be glad to copy. Read and listen to material that treats growth as possible and responsibility as normal. Limit the sources that profit from your fear or your outrage. You cannot seal the world out entirely, and Tracy does not ask you to. He asks you to make the dominant suggestions in your life the ones you would have chosen for yourself, on purpose, in writing, in advance.", "I choose the people, voices and material that surround me, because their suggestions are becoming my beliefs."], ["Rehearse the Outcome in Your Mind", "Mental rehearsal and visualisation form a practical block in the inner game chapter of The Power of Self Confidence, alongside written affirmations and improved mental pictures. The method is to picture yourself performing well in a coming situation, clearly, vividly and repeatedly, seeing the end of the movie as you want it to be and then your own competent part in it. Athletes and performers use this because the mind treats a vivid rehearsal partly as experience, so the real event feels like a return rather than an ambush. Tracy applies it to ordinary confidence: the interview, the difficult conversation, the presentation, the examination, the first day in a new role. Rehearse the version where you are calm, prepared and truthful, including your recovery if one moment goes wrong, because a rehearsed recovery removes the fear that one slip ruins everything. Pair the pictures with written affirmations that state the quality you are building in present and personal words, and review both in the quiet moments of the day. This is not a substitute for preparation. It is preparation for the performer, while study and practice prepare the performance. Arrive having already succeeded in your mind a dozen times, and your body will have less persuading to do.", "I rehearse my important moments in vivid pictures before they happen, and I arrive feeling like I have been there before."], ["Positive Knowing Beats Positive Thinking", "Chapter seven of The Power of Self Confidence draws a line Tracy considers decisive: positive knowing versus positive thinking. Positive thinking hopes that things will work out and tries to feel good in advance of evidence. Positive knowing is built differently. It grows from analysed experience, from remembering what you have actually handled, learned and survived, until your confidence rests on a record rather than on a mood. This is why he urges reflection after experience, asking what you did right and what you would do differently, so that each event is converted into usable self knowledge instead of being merely endured and forgotten. A person with positive knowing can be quiet in a crisis, because his assurance does not need to shout. He knows his skills, he knows his limits, and he knows the rate at which he learns, which is knowledge in the proper sense. Build this asset deliberately. Keep a record of problems solved, promises kept and skills gained, especially the entries your memory tries to discount. Review it before hard assignments. Over time the record becomes an argument your fear cannot easily answer, because it is not an affirmation. It is evidence. Think positively by all means, but aim higher: know, from your own examined history, what you can do.", "I build positive knowing from my real record of problems solved and promises kept, and I review that record before hard work."]]}, {"title": "The Power of Self Confidence: Mastery, Strengths and Adversity", "intro": "From the mastery, strengths and adversity chapters of The Power of Self Confidence: expanding your envelope, finding flow, capitalising on strengths, and meeting failure and crisis without losing yourself.", "cards": [["Expand the Edge of Your Envelope", "Achieving competence in The Power of Self Confidence is pictured as an envelope with an edge. Inside the envelope is everything you can already do comfortably. At the edge is the zone where your ability is tested and stretched. Beyond it, for now, are performances you cannot yet sustain. Growth happens by working deliberately at that edge, where the task is hard enough to demand learning and not so hard that it only produces panic. Tracy counsel is to expand your envelope in stages. Take on work slightly beyond your proven level, prepare for it more thoroughly than comfort would require, and let each success redraw the boundary a little further out. The story pattern he uses of a late beginning artist, Grandma Moses, carries the same point into years rather than tasks: the envelope of a life can keep expanding long after others assume it has set. This teaching protects you from two errors. The first is staying so deep inside the envelope that years pass without growth, which feels safe and quietly becomes regret. The second is leaping so far beyond the edge that failure teaches nothing except fear. Work at the edge, recover, consolidate, and work at the new edge. Confidence is the feeling of a boundary you have personally moved, and it cannot be borrowed from comfort.", "I work regularly at the edge of my ability, in stages I can sustain, and I let each success expand my envelope."], ["Find the Work Where You Enter Flow", "The Power of Self Confidence connects peak performance with the flow experience, the state in which you are fully absorbed in work that matches your growing skill, time seems to pass unnoticed, and you perform near your best without forcing every moment. Tracy uses flow as a signpost for finding your true place. The activities that produce it are rarely accidents. They sit where your interests, your talents and your values overlap, and they deserve investigation when you are choosing work or reshaping a role. His related counsel to follow your heart is practical rather than romantic. Pay attention to the work you return to willingly, the problems you think about in spare moments, and the tasks after which you feel enlarged rather than merely tired. Those are clues about where your best contribution lives. Design toward them where you can. Not every hour of a good job produces flow, and necessary drudgery belongs in every life. But a career built entirely against your nature will tax your confidence daily, because you are always performing as someone else. Move, by degrees and by experiments, toward the work that absorbs you. Competence grows fastest there, excellence becomes enjoyable there, and confidence stops being an act because the work itself keeps proving you right.", "I notice the work that absorbs me completely, and I move my career by degrees toward that true place."], ["Maximise Your Return on Energy", "Return on energy is the measure Tracy returns to in both the mastery and the strengths chapters of The Power of Self Confidence. Time is fixed for everyone, but energy is the resource that actually varies, and the same hour can return very different results depending on the state you bring to it and the task you spend it on. Maximising return on energy means placing your most demanding and valuable work in your strongest hours, protecting sleep, food and movement as production assets rather than rewards, and noticing which activities drain you out of proportion to their worth. Some tasks cost little energy and return much. Others consume a whole evening of recovery for a result nobody needed. The second kind should be reduced, delegated, redesigned or done at a cheaper hour. This measure also governs people and environments. Certain company leaves you charged and clear. Certain company leaves you strangely exhausted, and the bill arrives whether you acknowledge it or not. Track your energy for a week as honestly as you would track money: when it rises, when it falls, and what was happening just before each change. Then rebuild the week around the evidence. A life arranged for return on energy produces more, and feels better producing it, than a life arranged only around the clock.", "I track where my energy rises and falls, and I give my strongest hours to my highest return work."], ["Small Efforts Accumulate Into Great Results", "The Law of Accumulation, taught in the mastery chapter of The Power of Self Confidence and across Tracy work on money and knowledge, says that everything great and worthwhile is an accumulation of hundreds, sometimes thousands, of small efforts and sacrifices that nobody sees or applauds. An expert is a beginner who accumulated learning without long interruptions. A fortune is countless small amounts saved and protected. A reputation is ordinary honesties stacked over years until the stack becomes a name. The law cuts in both directions, which is why Tracy joins it to the warning that everything counts. Small neglects accumulate too: the unread pages, the skipped practice, the small sums leaked daily, the courtesies omitted. Nothing is neutral for long, because time keeps adding whatever you feed it. This makes the law a source of hope for people who feel behind. You do not need a dramatic rescue. You need a daily deposit in the right account, knowledge, savings, health or character, kept up until momentum begins helping you, because accumulation grows easier as the pile becomes visible and starts to encourage its owner. Judge your days by deposits rather than by drama. A day with one honest deposit in each main account is a successful day, whatever it felt like, and ten years of such days are almost unstoppable.", "I make a small deposit every day in knowledge, savings, health and character, and I trust accumulation to do its work."], ["You Are a Bundle of Resources", "Capitalising on your strengths in The Power of Self Confidence begins with a description worth keeping: you are a bundle of resources. Inside one person sit talents, skills, experiences, interests, contacts, energy and ideas, most of them never inventoried and many of them used far below their capacity. Tracy exercise is to assess the bundle honestly. List your current skills and capabilities, the roles you have filled, the problems you have solved and the subjects you understand from the inside, including the ones gained in hard seasons that felt useless at the time. Then ask people who know your work for their input, because others often see a strength you have dismissed as ordinary precisely because it comes easily to you. The inventory changes career thinking. Instead of asking only what job you can get, you begin asking what combination of your resources could be valuable, perhaps in a field you have not considered, or assembled in a way your present role never uses. Untapped resources also expose waste. A strong skill left idle while you struggle to survive on a weak one is a poor arrangement of the bundle, and rearranging it is often the fastest improvement available. You are carrying more equipment for your future than your discouragement has told you. Count it, in writing, and count it carefully.", "I inventory my skills, experience and interests in writing, and I rearrange my work to use the strongest of them."], ["Run Your Life as President of You, Inc.", "You are the president of You, Inc. is the governing image in the strengths chapter of The Power of Self Confidence. Tracy asks you to see your life and career as a company of one that you own and direct, whatever your present job title says. A president is responsible for strategy, for investment in the assets, for choosing markets, and for the quality of what the company produces. Your main asset is yourself: your knowledge, skill, energy and reputation. Presidents do not wait for headquarters to develop their assets, and this image removes the waiting room from personal growth. Invest in yourself as a first charge on your income and time, through learning, health and tools that raise your capacity, because no employer will ever care about the long term value of You, Inc. as much as its owner must. The image also sharpens differentiation. A company must know what it offers that others do not, and so must you: the combination of strengths, experience and character that makes your work distinct and worth choosing. Review your company regularly. What is it selling, to whom, at what quality, and what must it learn or stop doing to be worth more next year? You will have employers, clients and partners across a lifetime. You will only ever have one president. Act like it.", "I run my life as president of my own company, I invest in my main asset first, and I review my direction every year."], ["Let Your Weaknesses Point the Way", "The strengths chapter of The Power of Self Confidence treats weaknesses with unusual usefulness. Weaknesses are good indicators, Tracy argues, because they point away from work you are unsuited for and toward the strengths where your contribution actually lives. A persistent weakness is often not a call to grind for years at being adequate. It may be data about design: you are a bundle of resources arranged, in that area, against your own nature. His distinctions help the judgement. Some weaknesses are situational, appearing only in the wrong role, and vanish when the setting changes. Some can be compensated for, by a system, a partner, a tool or a colleague whose strength covers your gap while yours covers theirs. A few sit directly on the road to your goals and must be improved to a workable level, without being allowed to consume the years that belong to your excellence. The error is to organise a life around hiding or fixing every weakness while your strengths wait unemployed. Be honest with yourself, which is itself one of his chapter counsels. Name the weakness plainly, decide which kind it is, and act accordingly: compensate, relocate, or train to sufficiency. Then return your best hours to your area of excellence, because that is where confidence and reward are both manufactured.", "I name my weaknesses honestly, I compensate for them or work around them, and I give my best hours to my strengths."], ["Ask for Your Limiting Step", "Chapter seven of The Power of Self Confidence opens with an exercise Tracy calls one of the most valuable a person can use on any goal: ask what your limiting step is. The limiting step is the one factor that determines the speed at which you reach the goal, or whether you reach it at all. Every process has one. Widen every other part of the road and traffic still moves at the pace of its narrowest point. Your ability to identify that step, he says, is one of the best demonstrations of intelligence, and your capacity to remove it is one of the best demonstrations of competence. In many lives the limiting step turns out to be the level of self confidence itself, because it decides how much you attempt, how long you persist and how large a goal you permit yourself to set. More attempts mean more successes by the law of averages, which is why he uses the picture of a company that simply drilled more wells and found more oil than rivals who drilled fewer. Apply the question area by area. What single constraint, removed, would most change your income, your health, your learning or your family life? Work there first, even when easier improvements elsewhere are begging for attention. Effort spent off the limiting step feels productive and changes little. Effort spent on it changes everything downstream.", "I ask what my limiting step is on each major goal, and I put my first effort into removing that one constraint."], ["Double Your Rate of Failure and Learn From Each One", "Triumphing over adversity in The Power of Self Confidence contains a counsel that sounds backwards until it is understood: double your rate of failure. Failure, in Tracy framing, is not the opposite of success but one of its main roads, because success is a numbers game in which attempts govern outcomes. The person who tries, learns and tries again at twice the rate collects twice the education and eventually twice the wins, while the person protecting a perfect record mostly collects safety. The concept of failure itself needs correcting, he argues. An attempt that did not produce the intended result has produced information, a tested method, a clearer market, a stronger skill, which the next attempt spends. Thomas Edison and the great inventors are his standing examples of people who treated each miss as an elimination rather than a verdict. Learning from every failure is the discipline that makes the rate safe to raise. After a setback, extract the lesson in writing while it is fresh, decide the adjustment, and return to action before discouragement hardens into identity. Never consider the possibility of failure as a final outcome, his chapter insists, while considering every actual failure as tuition. The goal was never to fail. The goal is to attempt at a volume and learn at a speed that make eventual success a matter of arithmetic.", "I increase my attempts, I extract a written lesson from every failure, and I return to action before discouragement settles."], ["Anticipate the Crisis Before It Arrives", "Crisis anticipation is the forward looking half of the adversity chapter in The Power of Self Confidence. Tracy teaches advance thinking and planning: regularly ask what could go wrong in your work, your money, your health and your plans, and decide in calm what you would do if it did. This is not worry, which rehearses fear without producing a response. Anticipation produces responses, reserves and alternatives while your head is clear, so that a crisis finds a person with a plan rather than a person beginning to think under fire. His supporting habits are practical. Spread the risk so that one failure cannot take everything with it. Keep the reality habit, seeing a deteriorating situation as it is early, while it is still cheap to correct. Become intensely solution oriented when trouble comes, spending your words on what can be done next rather than on how unfair the arrival was. Underneath all of it sits his challenge and response view of life: your future is determined less by what happens than by how you respond, and response can be prepared. Set aside a regular hour to think ahead about the two or three reversals that would hurt most. Write the first three actions for each. The paper may never be used. The calm of having written it will be used every day.", "I think ahead about what could go wrong, I write my first responses in calm, and I spread my risks before trouble arrives."]]}, {"title": "Reinvention: The Seven Rs and a New Start", "intro": "From Reinvention, subtitled How to Make the Rest of Your Life the Best of Your Life: his seven thinking skills for change, the Seven Rs, plus the continuous offensive, the changing answers, and knowing what you are worth.", "cards": [["Reevaluate When Life Signals a Mismatch", "Reevaluating is the first of the Seven Rs in Reinvention: taking a time out to reexamine all the details of your life in the light of how things actually are today. Tracy gives the signals that say the time has come. Stress, resistance, frustration, disappointment or repeated difficulty in an area are not only problems in themselves. They are messages that something in that area no longer fits, and they grow louder when they are ignored. Chronic irritability or unhappiness with your work or personal situation belongs on the same list. He grounds the practice in the Reality Principle, seeing the world as it is, not as you wish it would be, and in the meeting question he admires: what is the reality? Strong people, in his account, are more concerned with what is right than with who is right, and they confront the facts of a situation rather than hoping the facts will tire and leave. Reevaluating is scheduled, not left to crisis. At least once a year, stand back from every major area, work, money, health, relationships and direction, and ask whether what you are doing still deserves to be continued on its present terms. The answer will usually be yes in most areas, which is reassuring, and honestly no in one or two, which is where your next reinvention is waiting.", "I step back at least once a year to reevaluate every area of my life, and I face the reality I find there."], ["Rethink by Getting the Facts", "Rethinking, the second of the Seven Rs, begins from a simple observation: the quality of your thinking is largely determined by the quantity and quality of information you have to think with. Most poor decisions in a transition are not failures of intelligence. They are failures of information, made quickly, on feelings and rumours, at exactly the moment when facts were most needed. Tracy counsel, following the business leader he quotes on getting the facts, is to ask as many questions as you possibly can about the person, the problem or the situation before deciding. What exactly has happened? How did it happen, and when? Who is involved? What is likely to follow from this situation, and what can be done immediately to address it or reduce its cost? Questions have a second benefit he values: they keep the mind calm and clear. A person asking precise questions is thinking, and a thinking person panics less than a person rehearsing fears. Writing is the companion discipline. Write down every detail of the situation on paper, because something clarifying happens between the head and the hand, and the right course of action often becomes visible on the page once all the facts are finally standing still in one place. Get the facts first. Decisions made after rethinking rarely need to be unmade.", "I get the facts and write every detail down before I decide, and I let questions keep my mind calm and clear."], ["Reorganize for Smooth Functioning", "Reorganizing, the third of the Seven Rs, asks whether the way your life and work are arranged still produces smooth functioning in the world as it now is. Every arrangement was once a solution to an earlier situation. People change, markets change, families change, and an arrangement kept past its season turns from a help into friction, a daily tax of small inefficiencies, duplicated effort and work done in the wrong order by the wrong hands. Tracy urges a continual, unsentimental review of processes, routines and activities, at work and at home, with a readiness to organise them again around present reality. In times of transition people reorganise on a large scale, moving home, changing the shape of a business, or rebuilding a week from nothing. More often the gains are modest and immediate: a workspace rearranged so the main tools are within reach, a routine moved to the hour where it actually happens, a responsibility given whole to one person instead of fragments scattered across five. Judge every arrangement by its fruit, smoothness and efficiency in service of your real priorities, not by how long it has existed. Longevity is not a virtue in a system. Reorganise regularly, in small ways before you are forced to reorganise in large ones, and let each new arrangement be designed for the life you have now.", "I review how my work and days are arranged, and I reorganise them for smooth functioning in my life as it is now."], ["Restructure Resources Toward Your Highest Priorities", "Restructuring, the fourth of the Seven Rs, is the economics of reinvention. There is never enough time, money, energy or attention for everything you want to be, have and do, so resources must be moved, deliberately, away from lower value areas and toward higher value ones. Businesses do this by shifting their best people and money toward their greatest opportunities. A person restructures the same way: more of the week, the budget and the strength go to the small share of activities that produce most of the income, growth, happiness and satisfaction, and less goes to the rest, however familiar the rest has become. Tracy states the personal version plainly. Restructure toward the top activities that account for most of your results at work, and you free time and energy for family and personal life as a gain, not as a theft from your career. The discipline is in the moving, because every lower value area has a defender, usually habit, sometimes another person, occasionally your own guilt. Decide the priorities in writing first, in calm. Then move resources in that order, and protect the new arrangement long enough for its results to defend it. Restructuring is not doing everything harder. It is funding what matters with what no longer does.", "I move my time, money and energy away from low value areas and toward my highest priorities, in writing and on purpose."], ["Reengineer by Removing Steps", "Reengineering, the fifth of the Seven Rs, aims at simplification: continually looking for ways to reduce the complexity and the number of steps in any process in your work or life. Every process grows barnacles over time. A report gains a reader nobody remembers choosing, a task gains an approval that once solved a problem long gone, a simple job passes through so many hands that most of its cost is waiting. Tracy tools are concrete. Delegate low value tasks to people who can do them well at a lower cost than your own hour, or outsource whole pieces of work to specialists for whom that work is central, because a specialist usually does it cheaper and better than you doing it as a sideline. Consolidate where fragmentation is the cost, gathering scattered pieces of one job under a single owner so nothing is lost between hands. And use the sharpest tool of all, elimination: some activities were once important and are now, beside your present priorities, of little or no value at all, and the bravest reengineering is to stop doing them entirely. Walk one regular process from end to end on paper. Count its steps and challenge each one to justify its existence. Keep only the steps that earn their place, and give the recovered hours to your future.", "I walk my regular processes step by step, I delegate, consolidate or eliminate what earns nothing, and I keep my life simple."], ["Reinvent From a Clean Sheet", "Reinventing, the sixth of the Seven Rs and the heart of the book, is an exercise in imagination with a hard edge: draw a line under your past and ask what you would do if you were starting over today, in this area, with a clean slate. Tracy sharpens it with pictures. If your business disappeared overnight and you had to start again, what would you start up immediately, and what would you never start again? If your job or industry vanished entirely, what work would you choose now, where would you do it, and what new skills would you choose to build? If you could reinvent your life completely, how would it differ from the life you are actually living this week? The exercise matters because sunk cost is a silent ruler. We protect old choices because we made them, long after we would refuse to make them fresh. The clean sheet removes that protection for an hour, and in that hour the truth about your present arrangement becomes audible. You will not act on everything the exercise reveals, and some of it will be impossible this year. Act on what you can. The distance between the clean sheet life and the current one is your reinvention agenda, written in your own hand, and even one item crossed off it each season is a life being remade on purpose.", "I imagine starting each area of my life from a clean sheet, and I turn the gap I see into my reinvention agenda."], ["Regain Control After a Setback", "Regaining control, the seventh of the Seven Rs, is for the moment a major change or setback hits and you feel like a small boat in a squall, pitched between fight and flight, riding an emotional roller coaster you did not choose. Tracy borrows the stages psychologists describe for grief and shows how they appear after losses at work and in life: first denial, then anger, then blame, then a slide into guilt and self pity. His warning is practical. A person in denial, anger or blame cannot think calmly or move forward. Those states lock the feet in place, and no reinvention begins until they are passed through. The turning point he names is the fifth move, accepting responsibility, not for causing everything that happened, but for your situation now and for your response to it. Control returns with that acceptance, and positive emotion returns with control, in that order. The words he recommends repeating are deliberately plain and personal, a declaration that you are responsible, because it is hard to keep blaming and raging while your own mouth is saying it. Expect the stages rather than being shamed by them. Move through them as quickly as honesty allows, refuse to build a home in any of them, and let responsibility be the door back to command of yourself.", "I move through denial, anger and blame after a setback without living in them, and I regain control by accepting responsibility for my response."], ["Keep on the Continuous Offensive", "In the preface to Reinvention, Tracy gives the operating rule he learned across his own repeated reinventions, in labouring work, sales, management, real estate and importing: go onto the continuous offensive. Get a good idea of where you want to go, and take action. Try, try again, and try once more. Never give up, and keep moving forward. The phrase matters because reinvention rarely proceeds in a straight line. Courses that looked right become dead ends, setbacks and temporary failures arrive on schedule, and something better often appears in a different direction than the one you were marching in. A person waiting for certainty before moving never starts, and a person who stops at the first dead end never arrives. The offensive is continuous, not frantic. It means that at any given time you are trying something, learning from the result, and adjusting, rather than sitting in review of your situation while the situation hardens. Tracy own pattern at each stage was the same: decide the next step with a blank sheet, read and study the new field, interview people and ask questions, then plunge in and let experience teach the rest. Momentum is a teacher that analysis alone cannot hire. Stay on the offensive in a modest, daily way, especially when the plan has just failed, because movement is what the next opportunity can find.", "I stay on the continuous offensive, I try and try again after dead ends, and I keep moving forward while I learn."], ["Your Answers Have Changed", "Reinvention opens with a story about an examination given twice to the same class, where the defence is that the answers have changed. Tracy uses it as the picture of modern life. Knowledge moves, markets move, your family and your work move, and answers that were correct two years ago can be quietly wrong today, while the questions look exactly the same. What was your biggest problem or goal a year ago? Many people cannot say, because the ground has already shifted under it. His researchers summary in the introduction has lasted for decades precisely because it is always becoming true again: there will be more change, more competition and more opportunity in the coming year than in the last, but the opportunities will be different from the ones you are currently organised to catch. This is why reinvention is a recurring practice and not a single event for one desperate season. A person in transition is not a failed person. In a fast moving world, almost everyone is in transition in some area almost all the time. Build the habit of reexamining your standing answers: about your skills, your customers, your health, your money and your direction. Where the world has moved, move your answer. Loyalty to an outdated answer is not faithfulness. It is how good people get stranded in a world that offered them a new road.", "I reexamine my standing answers as the world changes, and I update them before an old answer strands me."], ["Know What You Are Worth in the Market", "What are you worth? is the title question of a full chapter in Reinvention, and the publisher description of the book lists the skills it teaches: calculate your true market value, determine your own salary range, and dramatically improve your earning ability. Tracy treats worth as something investigated rather than felt. Your value in the market is set by the results your skills and experience can produce for an employer or a customer, measured against the other people who could be hired to produce them. That measurement can be researched: what the role pays in your area, what the top performers in it earn, and which additional skills move a person from the middle of the range to the top of it. Feelings run in both wrong directions here. Some people undervalue years of competence because familiarity makes it look ordinary. Others overvalue effort and loyalty, which the market respects but does not, by itself, pay for. The research serves reinvention directly. If the gap between your worth and your pay is real, it becomes a plan: negotiate from evidence, move to where the value is recognised, or build the skill that closes the gap between your present range and the next one. Know the number, know what moves the number, and stop letting either modesty or fantasy do your negotiating.", "I research my true market value, I know my salary range, and I build the skills that move me to the top of it."], ["Get the Job You Really Want", "How to get the job you want, in any economy, is the practical centre of Reinvention, and the book interactive exercises cover deciding on the job you really want, setting clear goals for the search, writing resumes that get results, and taking control of your career instead of waiting for it to be rescued. Tracy account of the search, in his interviews on the book, adds two working truths. First, most good jobs are not advertised, so finding them takes investigative work: research organisations you would genuinely like to serve, learn what problems they are trying to solve, and approach them with your value in view rather than waiting for a posting to invite you. Second, the proactive minority who treat finding work as work itself, with study, preparation and daily action, consistently outrun the reactive majority who send applications and wait. Preparation for the conversation matters as much as the paper. A candidate who has researched the organisation, understood its customers, and rehearsed a clear account of the results he can produce arrives as a solution rather than as a request. Decide the job precisely, aim your search at named organisations, do the unadvertised work of investigation, and present the future you can build for them. That is taking control of a career in the only place control exists: in your own conduct.", "I decide the job I really want, I investigate named organisations before they advertise, and I present the results I can produce for them."]]}, {"title": "Speak and Charm: Communication That Builds People", "intro": "From Speak to Win, with The Power of Charm on listening and attention: speaking and communication taught as personal growth, preparing, mastering fear, using the voice and the room, and listening so that people feel valued.", "cards": [["Prepare a Talk the Way You Plan a Journey", "Planning and preparation made simple is the second chapter of Speak to Win, and Tracy treats preparation as the speakers main source of power. A talk is a journey you are taking other people on. Decide where they are starting, where you intend them to finish, and the few clear steps that will carry them there, before you choose a single story or slide. Most weak talks are not weak performances. They are weak plans, too much material, no single point, and no order that a listener can follow. His preparation habits are working habits. Know your audience and what they care about before you shape the message. Reduce the talk to one central idea that everything else serves. Arrange the parts so each one makes the next one necessary. Rehearse the whole talk aloud, more than once, because a talk exists in time and in the mouth, not on the page where silent reading forgives every clumsy sentence. Preparation also decides confidence, as the next card in this part shows: a speaker who has done this work walks in carrying evidence that he is ready. Do the planning on paper, early enough for the plan to improve. The audience will never see your preparation directly. They will feel it in every minute, as clarity, as respect for their time, and as a speaker who knows exactly where he is going.", "I plan every talk on paper around one central idea, and I rehearse it aloud until the journey is clear."], ["Eliminate the Fear of Speaking by Mental Mastery", "Self confidence and mental mastery, eliminating the fear of public speaking, is the third chapter of Speak to Win, because Tracy knows the fear of speaking stops more personal growth than any lack of technique. The fear is usually a picture before it is an event: the mind replays embarrassment, judgement and failure in advance, and the body obeys the rehearsal as if it were real. Mental mastery reverses the rehearsal. Use the substitution and visualisation taught elsewhere in this scroll on this specific stage. Picture the room in detail and yourself handling it calmly, including the recovery from a stumble, until the scene loses its threat. Prepare so thoroughly that your mind has real evidence to stand on, because fear grows in the gaps preparation leaves. Then change the meaning of the audiences faces. Listeners are not judges assembled against you. They are people who came hoping you would do well, because your success is their good hour. Experience completes what pictures begin. Speak in small rooms first, volunteer for the short item, and let each survived occasion argue with the fear in a voice it cannot dismiss, the voice of your own record. Fear of speaking is not a life sentence. It is an untrained area, and training, applied patiently, retires it.", "I rehearse success in my mind, I prepare until I have evidence, and I speak in small rooms until fear retires."], ["Start Strong With Any Audience", "Start strong with any audience is the fourth chapter of Speak to Win, built on the fact that the opening minutes of a talk decide how the rest of it will be received. An audience forms its judgement early: whether this speaker is prepared, whether this hour will be worth it, and whether it is safe to give him attention. A weak opening spends the talk buying back trust that a strong opening would have owned from the start. Starting strong is mostly decisions made in advance. Open with something that belongs to this audience and this subject, a question they are already living with, a problem stated so exactly that they recognise their own week in it, or the destination of the talk promised plainly, rather than with apologies, throat clearing or a slow account of yourself. Tracy platform teaching values the audiences time as a form of respect, and the opening is where that respect is proved. Your body must agree with your words. Arrive settled, look at real people rather than at the room in general, and let the first sentences be short, clear and fully memorised in structure if not in wording, because fluency at the start steadies the speaker as much as the listeners. Begin like a person who knows the journey is good. Attention given early compounds for the whole talk.", "I open my talks with the audience real concern, stated plainly, and I make my first minutes clear and settled."], ["Use Your Voice With Power and Calm", "Vocal mastery is the eighth chapter of Speak to Win, because the voice is the instrument every idea must travel through, and most speakers have never once trained theirs. Tracy techniques are practical. Slow down, because nervous speakers rush, and a rushed voice tells the audience the speaker wants to escape. Speak a little louder and from deeper in the body than conversation requires, so the back of the room receives the same talk as the front. Vary your pace and emphasis, since a voice that treats every sentence as equal soon makes every sentence sound unimportant, however good the content is. Use pauses as punctuation with courage. A pause before an important point gathers attention, and a pause after it lets the point land, while a speaker who fills every silence teaches listeners that nothing he says needs a moment to settle. Record yourself and listen honestly, the way an athlete watches film. You will hear habits you never suspected, speed, filler sounds, a falling ending that turns statements into questions. Train one improvement at a time, in ordinary conversation as much as on a platform, until the better voice is simply your voice. People will call the result presence. It is mostly an instrument, practised.", "I slow my voice, I speak with depth and variation, and I use pauses to let my important points land."], ["Control the Space Where You Speak", "Controlling your space is the tenth chapter of Speak to Win, and its lesson is that everything counts in the room where you speak. The seating, the light, the sound, the temperature, the sight lines, the equipment and your own position all speak to the audience before you do, and they either support your message or tax it for the whole session. Tracy counsel is to take responsibility rather than trust assurances. Arrive early enough to inspect the room as it will actually be used. Test the microphone and the slides yourself. Arrange the chairs so people can see you and each other without strain. Remove the distractions you can remove, and position yourself where you command the space instead of apologising from a corner of it. The same principle governs small rooms and family tables. A speaker who has settled the space can give full attention to people, while a speaker fighting the room spends the talk divided. There is a personal growth lesson inside the logistics. People who take charge of their environment, respectfully and without fuss, are taken more seriously in it, because competence shows in details before it shows in arguments. Wherever you must speak, arrive as the person responsible for that room working well. The audience will relax into hands they can feel are capable.", "I arrive early, I test and arrange the space where I speak, and I take responsibility for the room working well."], ["End So People Remember and Act", "End with a bang is the closing platform chapter of Speak to Win, because the end of a talk is what the audience carries out of the door. Listeners remember the last clear thing they heard with a weight out of proportion to its length, so a talk that fades into thanks and shuffling wastes the strongest position in the whole structure. Tracy method is to design the ending before the talk is delivered, not to improvise it when energy runs out. Return to the central idea and state it at its strongest and simplest. Tell the audience exactly what to do with it, in one action they can begin today, because a talk that produces no action has entertained at best. Then stop, cleanly, while the point is still standing, rather than circling for a second ending that dilutes the first. The discipline applies far beyond platforms. A meeting, a lesson, a family conversation and a piece of advice all land better when the final words summarise the heart of the matter and name the next step. Practise endings as a life habit. In your own speaking, review how your talks and conversations usually finish, and you will find the pattern of your influence. Finish on purpose, briefly and with warmth, and people will remember both what you said and that you respected them enough to land it.", "I design my endings in advance, I state my central idea at its strongest, and I close with one clear action."], ["Listen Attentively Without Interrupting", "The magic of listening is a whole chapter of The Power of Charm, and its first key is the hardest to fake: listen attentively, without interrupting, as if nothing in the world matters more at that moment than what the other person is saying. Tracy practical instruction is total. When someone at home or at work wants to talk, stop the other activities, turn from the screen, set the paper down, and give your complete attention in silence while they finish. The effect on the speaker is not merely polite. Being listened to with rapt attention raises a persons self esteem, releases a sense of wellbeing, and builds trust in the listener at a level argument never reaches, because you have proved their words are worth your most expensive possession, your attention. The discipline is harder than it sounds. Interruption feels helpful from inside, finishing a sentence, supplying a fact, hurrying to the advice, and every interruption quietly reports that your thought mattered more than theirs. Let silence do the work instead. A finished speaker, fully heard, often solves his own problem aloud and credits you with wisdom you never had to speak. In families this habit changes the temperature of a house. Make listening your first response, especially to the people closest to you, whose words familiarity tempts you to half hear.", "I stop what I am doing, I listen in complete silence without interrupting, and I let the speaker finish fully."], ["Pause, Clarify and Play It Back", "The remaining keys to effective listening, taught in The Power of Charm and repeated in Million Dollar Habits, turn attentive silence into understanding. First, pause before you reply, for several seconds, even when your answer is ready. The pause proves you are weighing what was said rather than reloading while the other person spoke, and it often invites the speaker to add the deeper thing that only comes after a first account is safely out. Second, question for clarification. Ask how the person means a key word or statement, exactly, because people regularly use the same words for different experiences, and most misunderstandings are two people nodding at one word while picturing two realities. A clarifying question is not a challenge. It is respect for accuracy, and speakers feel honoured by being understood precisely. Third, paraphrase what you heard back in your own words and let the speaker confirm or correct it. Playing it back catches errors while they are cheap, and it gives the speaker the rare experience of hearing his own meaning returned to him intact. Together these keys make listening an active skill rather than a polite wait. Practise them in one conversation today. You will be told, in substance, that you are unusually easy to talk to, which in Tracy teaching is simply charm with its sleeves rolled up.", "I pause before replying, I ask how a person means it exactly, and I play back what I heard in my own words."], ["Speak Slowly and Let Silence Work", "Two chapters of The Power of Charm stand together: the art of speaking slowly, and the eloquence of silence, with a warning between them that excessive fillers are charm killers. Speaking slowly is not speaking weakly. A measured pace gives your words weight, gives the listener time to receive them, and gives you time to choose the next sentence instead of chasing it. Fast speech often signals anxiety, and anxiety in a speaker produces anxiety in a room, while calm pacing quietly transfers calm. Silence is the companion skill. The person who can pause without embarrassment, who does not rush to fill every gap with sound, appears thoughtful and in command of himself, and his words are weighed more carefully because he visibly weighs them first. Fillers are the enemy of both skills, the repeated sounds and stock phrases that leak into every gap when a speaker fears silence. They dilute authority a drop at a time. The cure is not monitoring every syllable in dread. It is practising the pause as a replacement, in ordinary conversation, until a clean silence feels as natural as a filler once did. Record a short piece of your own speech and count honestly. Then speak the same piece at four fifths of the speed, with real pauses, and hear what your listeners have been waiting for.", "I speak at a measured pace, I replace filler sounds with clean pauses, and I let silence give my words weight."], ["Be Careful With Advice and Quick to Praise", "The Power of Charm pairs two counsels that belong in every relationship: be careful with advice, and be quick to praise. Advice is the most offered and least requested gift in human conversation. People generally know their situation in more detail than the adviser does, they resist being managed, and unsolicited advice often lands as criticism wearing a helpful coat. Tracy counsel is to let patient listening do the work first, to advise mainly when you are genuinely asked, and then to offer your view as an offering the person remains free to refuse. Praise runs in exactly the opposite direction. It cannot be given too promptly when it is honest. Be quick to praise and quick to smile and laugh with people, his chapters urge, because praise noticed late loses its warmth, while praise given at the moment teaches the person, and everyone watching, what excellence looks like around you. Together the pair reverses most peoples instincts, which are to advise quickly and praise rarely, after checking whether praise is fully deserved. Reverse yours deliberately. Slow the advice down until invitation or necessity calls for it. Speed the praise up until it arrives in the same hour as the good act. Your conversations will become safer, your influence will grow quieter and stronger, and people will begin asking for the advice you once had to press on them.", "I hold my advice until it is asked for, and I give honest praise promptly, in the same hour as the good act."]]}]}];
const doorsEl = document.getElementById('doors');
const overlay = document.getElementById('overlay');
const scroller = document.getElementById('scroller');
const hud = document.getElementById('hud');
const counter = document.getElementById('counter');
let current = null;

DATA.forEach((t, i) => {
  const total = t.sections.reduce((n, s) => n + s.cards.length, 0);
  t.total = total;
  const b = document.createElement('button');
  b.className = 'doorCard';
  b.innerHTML = `<div class="photo" style="background-image:url('${t.photo}');background-position:${t.pos}"></div><div class="shade"></div><div class="body"><div class="doorNum">Door ${i + 1}</div><div class="doorName">THINK LIKE ${t.name}</div><p class="essence">${t.essence} ${total} teachings.</p><span class="enter">Enter</span></div>`;
  b.addEventListener('click', () => openTeacher(i));
  doorsEl.appendChild(b);
});
const empty = document.createElement('div');
empty.className = 'doorCard empty';
empty.innerHTML = `<div class="frame"><div class="doorNum">Door ${DATA.length + 1}</div><div class="doorName">THIS DOOR AWAITS ITS TEACHER</div><p class="essence">Space is kept at the door. Name the next teacher, and this space is his.</p></div>`;
doorsEl.appendChild(empty);

function openTeacher(i) {
  const t = DATA[i];
  current = t;
  scroller.innerHTML = '';
  const screens = [];
  const door = document.createElement('section');
  door.className = 'screen doorScreen';
  door.style.backgroundImage = `url('${t.photo}')`;
  door.style.backgroundPosition = t.pos;
  door.innerHTML = `<div class="shade"></div><div class="doorContent"><div class="kicker">Door ${i + 1} &middot; The Hall of Teachers</div><h1>THINK LIKE<br>${t.name}</h1><p class="dsub">A condensation of his teaching on ${t.sub}, taken in one screen at a time, until his way of thinking becomes yours.</p><button class="bigBtn" id="enterBtn">Enter</button><br><button class="hallBtn" id="backBtn1">&#8249; All Doors &middot; The Hall of Teachers</button></div>`;
  scroller.appendChild(door); screens.push({el: door, type: 'door'});
  let flat = 0;
  t.sections.forEach((sec, si) => {
    const intro = document.createElement('section');
    intro.className = 'screen intro';
    intro.innerHTML = `<div class="partNum">Part ${si + 1} of ${t.sections.length}</div><h2>${sec.title}</h2><p>${sec.intro}</p><div class="count">${sec.cards.length} teachings</div><div class="hint">Scroll</div>`;
    scroller.appendChild(intro); screens.push({el: intro, type: 'intro'});
    sec.cards.forEach((c, ci) => {
      flat++;
      const myFlat = flat;
      const card = document.createElement('section');
      card.className = 'screen card';
      card.innerHTML = `<div class="secLabel">${sec.title} &middot; ${ci + 1} of ${sec.cards.length}</div><h3>${c[0]}</h3><p class="body">${c[1]}</p><div class="into"><div class="lbl">Into Me</div><p>${c[2]}</p></div>`;
      scroller.appendChild(card); screens.push({el: card, type: 'card', n: myFlat});
    });
  });
  const end = document.createElement('section');
  end.className = 'screen endCard';
  end.innerHTML = `<div class="kicker">End &middot; ${t.total} Teachings</div><h2>THINK LIKE ${t.name}</h2><p>You have taken in the condensation. Now go and think like ${t.short}: ${t.end}</p><button class="bigBtn" id="againBtn">Begin Again</button><br><button class="hallBtn" id="backBtn2">&#8249; All Doors &middot; The Hall of Teachers</button><div class="hint">Door ${i + 1} &middot; The Hall of Teachers</div>`;
  scroller.appendChild(end); screens.push({el: end, type: 'end'});
  t._screens = screens;
  overlay.classList.add('open');
  document.body.style.overflow = 'hidden';
  scroller.scrollTop = 0;
  hud.style.display = 'none';
  document.getElementById('enterBtn').addEventListener('click', () => { screens[1].el.scrollIntoView({behavior: 'smooth'}); });
  document.getElementById('againBtn').addEventListener('click', () => { screens[1].el.scrollIntoView({behavior: 'smooth'}); });
  document.getElementById('backBtn1').addEventListener('click', closeTeacher);
  document.getElementById('backBtn2').addEventListener('click', closeTeacher);
  const io = new IntersectionObserver((es) => {
    es.forEach(e => {
      if (!e.isIntersecting) return;
      const s = screens.find(x => x.el === e.target);
      if (!s) return;
      if (s.type === 'card') { hud.style.display = 'flex'; counter.textContent = s.n + ' / ' + t.total; }
      else if (s.type === 'door') { hud.style.display = 'none'; }
      else { hud.style.display = 'flex'; counter.textContent = s.type === 'end' ? t.total + ' / ' + t.total : ''; }
    });
  }, {root: scroller, threshold: .55});
  screens.forEach(s => io.observe(s.el));
  t._io = io;
}
function closeTeacher() { location.href = 'index.html'; }
document.getElementById('hallBtnTop').addEventListener('click', closeTeacher);
document.getElementById('topBtn').addEventListener('click', () => {
  if (!current || !current._screens) return;
  const s = [...current._screens].reverse().find(x => x.type === 'intro' || x.type === 'card');
  if (s) s.el.scrollIntoView({behavior: 'smooth'});
});
openTeacher(0);
</script>
</body>
</html>
