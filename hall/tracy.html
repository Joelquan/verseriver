t from kept commitments and undivided attention far more than from grand occasions. A person who puts people first also becomes easier to help, to promote and to follow, because others sense that their interests are safe in his hands. Achievement pursued at the expense of every relationship eventually presents its bill. Achievement pursued with people first tends to gather allies instead of debts.", "I put people first in my daily choices, and I prove it with attention and kept promises."], ["Make the People Around You Feel Important", "A practical way to put people first, taught across the relationship material in Change Your Thinking, is to make the people you deal with feel important, sincerely and specifically. Every person carries a deep need to be valued, and the one who learns to meet that need honestly becomes welcome in rooms where talent alone is merely tolerated. The methods are ordinary and repeatable. Give full attention when someone speaks, without interrupting or finishing their sentences. Accept people as they are rather than auditing them aloud for faults. Appreciate what they do, promptly and by name, instead of saving all recognition for rare formal moments. Approve of people by speaking well of them, especially in their absence, and admire honestly the qualities and possessions they are proud of. None of this is flattery, which is insincere and quickly detected. It is attention directed outward, and attention is one of the rarest gifts in a distracted world. The effects accumulate quietly. People relax around you, tell you the truth sooner, cooperate more willingly and remember how you made them feel long after they forget what you said. A reputation of that kind is not a soft extra on a serious career. In a world built on cooperation, it is load bearing.", "I make the people around me feel important with sincere attention, appreciation and words that honour them."], ["Live a Great Life From the Inside Out", "The final principle of Change Your Thinking, Live a Great Life, gathers the book into a single direction. A great life is built from the inside out, beginning with character. Living in truth with yourself, acting with integrity when no advantage follows, and having the courage to do what is right in small matters before great matters test you, these form the ground on which every outer achievement must stand. Peace of mind occupies the highest place in this account of the good life, and peace of mind is presented as the natural result of a life lived in alignment with your own highest values. When your actions and your values disagree, the mind registers the disagreement as unease, however successful you appear. When they agree, a settled confidence becomes available that success alone never supplied. This closing chapter therefore sends you back to the beginning of the book with a deeper understanding. Change your thinking was never only a technique for getting more. It is a way of becoming the kind of person for whom a great life is the natural consequence, in work, in family, in health and in quiet. Judge every goal by whether its achievement will let you live more truthfully, and let that judgement have the final vote.", "I live from the inside out, keeping my actions true to my highest values, and I protect my peace of mind."]]}, {"title": "Flight Plan: Choose, Prepare and Take Off", "intro": "Flight Plan retells the whole journey of achievement as a long flight. A plane is off course most of the way, yet it arrives because its destination is locked in, its plan is filed, and its corrections never stop. These teachings cover the chapters before and at takeoff.", "cards": [["Expect to Be Off Course Most of the Way", "The founding observation of Flight Plan is that an aircraft on a long journey is off course almost all of the time, blown by crosswinds, turbulence and weather, and yet it lands at its destination on schedule. It arrives not because the journey was smooth but because the destination was locked in and corrections were made continually from takeoff to landing. Tracy applies the picture to a life without softening it. You will be off course most of the way toward any significant goal. Plans will meet conditions the planner could not see, progress will run in two steps forward and one step back, and detours will be required that nobody would have chosen. None of this is evidence that the goal is wrong or that you are failing. It is the normal texture of a long flight, and expecting it in advance changes how you receive it. A person who expects a straight line interprets every deviation as disaster and wastes strength on shock and self blame. A person who expects deviation treats it as routine information and spends the same strength on correction. Build that expectation into your plans from the start. The question of a serious journey is never whether you will be blown off course. It is whether your destination is fixed and your corrections are faithful.", "I expect to be off course most of the way, and I judge my journey by my corrections rather than by my deviations."], ["Lock Onto One Clear Destination", "The first chapter of Flight Plan asks you to choose your destination with the precision a pilot requires, because everything else in the book depends on it. A destination in this sense is not a general direction of improvement. It is a specific and measurable goal, in a specific area of life, that you have committed to reach, and its clarity is what allows a plan, a schedule and honest progress checks to exist at all. Choosing it requires knowing who you are and what you truly want in each area, work the earlier books in this scroll also demand, and then having the resolve to select one destination at a time for your main effort. A plane cannot fly toward three cities at once, and a person dividing his best energy among competing destinations usually arrives at none of them on schedule. Locking on also settles the mind. Once the destination is chosen, daily decisions gain a test. Does this move me toward it or away from it. That single test, applied hundreds of times, is worth more than occasional heroic effort. Write the destination where you will see it daily, state it in measurable terms, and treat the choosing of it as a serious act, because in this system choosing is not the prelude to the journey. It is the journey deciding where it will go.", "I lock onto one clear and measurable destination at a time, and I test my daily decisions against it."], ["Develop Options Before You Need Them", "Review Your Flight Options opens with a rule Tracy ranks among the most important he ever learned. You are only as free as your well developed options. A person with one route to a goal is at the mercy of that route. If it fails, he is stranded, and the stress he feels in difficulty is often nothing more than the absence of alternatives. Successful people develop options continually, before trouble forces the search. They think through other ways to reach the same destination, other people who could help, other methods, timings and arrangements, so that a setback finds them choosing among prepared alternatives instead of improvising in panic. Options are developed by a simple habit of listing. For any serious goal, write down every route you can think of, even imperfect ones, and keep the list alive as you learn. Seven ways to improve your fitness, seven ways to find customers, seven ways to fund a project. The list itself calms the mind, because a stocked mind does not catastrophise. It selects. There is also a deeper freedom at work. A person with options can refuse bad terms, walk away from a poor bargain and wait for a better opening, while a person without options must accept whatever is offered. Build alternatives while times are calm, and difficulty will meet a prepared mind.", "I develop several options for every important goal before I need them, and I keep my alternatives alive."], ["Think Through the Worst Case Calmly", "Closely joined to the rule of options, Flight Plan teaches that prepared people think through the worst that could reasonably happen before it happens, and decide in advance how they would respond. This is not pessimism and it is not inviting misfortune by dwelling on it. It is rehearsal, and rehearsal is what allows calm in the actual event. When a setback arrives unconsidered, the mind must do two jobs at once, absorb the shock and invent a response, and both are done badly under that load. When the same setback has been considered in a quiet hour, the response already exists, and your strength goes into executing it and comforting the people around you. Work through the worst cases for your main goal in writing. If the funding fails, if the key person leaves, if the deadline moves, if the first attempt is rejected, what exactly will you do, in what order, with what resources. Some rehearsed disasters will also reveal cheap preventions available now, and you will take those preventions, which is the quiet dividend of the exercise. The aim is a mind that difficulty cannot surprise into paralysis. Surprises will still come, but they will arrive as variations on themes you have already faced in imagination, and a faced theme is halfway handled.", "I think through the worst cases for my main goal in advance, and I decide my responses while I am calm."], ["File a Written Flight Plan Before You Start", "Flight Plan gives its name to a discipline borrowed directly from aviation. No pilot departs on a long journey on intention alone. A plan is prepared and filed before takeoff, stating the destination, the route, the timing and the stages of the journey, and that written plan then guides every later decision and correction. Tracy directs the same order for any major goal. Before you begin, write the plan in detail. The steps in sequence, the resources each step requires, the people involved, the dates for each stage and the measures by which you will know a stage is complete. Writing before acting exposes gaps while they are still cheap to fix. A missing permission, an underestimated cost or a step that depends on another step unfinished will show itself on paper in an evening, whereas the same gap discovered mid journey costs weeks and morale. The plan also protects the journey from daily mood. On a flat or frightening day you do not need to reinvent your direction. You consult the plan, take the next scheduled step, and let the document carry the clarity that your feelings temporarily cannot. Review and revise the plan at set intervals, because new information deserves respect. But let revision be a deliberate act at a desk, not a drift that happens unnoticed in the air.", "I file a written flight plan for every major goal before I start, and I let the plan guide me on flat days."], ["Prepare People, Money and Skills Before Launch", "Prepare for Your Journey, in Flight Plan, insists that the quality of a launch is decided largely before it happens. Pilots check fuel, weather, equipment and crew before a wheel turns. A serious goal deserves the same respect, and preparation in this sense is specific. Gather the knowledge the journey will require and begin the learning early, while mistakes are inexpensive. Assemble the resources, the money, the tools, the time in your schedule, in advance or in firm arrangement. Line up the people whose help, advice or permission the journey needs, and tell them plainly what you are undertaking and what you hope for from them. Preparation also includes the honest removal of obstacles you can already see. Debts that will strangle the second month, commitments that will consume the launch weeks, and habits that predictably undo early progress are cheaper to handle at the gate than at altitude. Many launches fail and are blamed on difficulty that was in fact visible from the start and simply unaddressed. None of this delays the journey pointlessly, because preparation done well shortens the journey it precedes. You are not waiting for perfect conditions, which never announce themselves. You are making sure that when you commit your energy, it is spent on the flight itself and not on discovering, one by one, the things a prepared person carries aboard.", "I prepare my knowledge, resources and people before I launch, and I remove the obstacles I can already see."], ["Leave Your Comfort Zone to Take Off", "Flight Plan states plainly that reaching a new destination requires moving out of your comfort zone and into what it calls your discomfort zone, and that this movement is not an occasional price but the standing condition of growth. The comfort zone is the range of activity within which you feel competent and unchallenged, and it is maintained, in part, by the deeper mind, which works to keep behaviour inside familiar limits. Every new destination lies outside those limits by definition, so discomfort at the start of a journey is not a warning sign. It is a location marker, confirming that you have actually left familiar ground. The practical response is to plan for discomfort instead of being ambushed by it. Expect the first attempts at the new skill, the new market or the new standard to feel clumsy, and schedule them anyway, in doses large enough to stretch you and small enough to survive. Discomfort tolerated repeatedly loses its authority, because the zone itself expands. What felt daring in the first month feels ordinary by the fourth, and the frontier moves outward to new ground. A person who waits to feel comfortable before beginning a significant journey will wait permanently, because comfort is the reward at the end of the stretch, not the permission slip at the start of it.", "I leave my comfort zone on purpose, and I treat early discomfort as proof that I am actually travelling."], ["Take Off at Full Throttle", "Take Off at Full Throttle teaches that a launch is not the place for half measures. An aircraft needs full power to leave the ground, and a major goal needs the same concentrated commitment in its opening phase, because early momentum is what carries the project through the resistance that every beginning meets. Half hearted launches fail in a particular and dishonest way. They never generate enough energy to test whether the idea could have worked, so the person is left with neither success nor a clean lesson, only a suspicion that more commitment might have changed the result. Full throttle does not mean recklessness. The plan has been filed and the preparation done in the earlier chapters, precisely so that commitment can be total when the moment comes. It means throwing your best energy, your clearest hours and your full attention into the start. It means beginning before conditions feel perfect, because a plane that waits on the runway for a windless day never leaves, and it means refusing to keep one foot in the old life as insurance once the decision to depart has been made. Beginnings also teach quickly when they are whole hearted, because real feedback only arrives at real speed. Give the launch your full power for a defined opening season, then judge the journey by evidence rather than by the memory of a timid start.", "I launch my major goals at full throttle, with my best energy and full attention in the opening season."]]}, {"title": "Flight Plan: Turbulence, Corrections and Arrival", "intro": "The second half of Flight Plan is about staying airborne: expecting turbulence, solving problems in the air, correcting course continually, learning faster, refusing shortcuts, mastering fear, and remembering at the end that success is not an accident. These teachings close the book and this set of additions.", "cards": [["Plan for Turbulence Before It Arrives", "Plan for Turbulence treats setbacks not as a possibility to be hoped against but as weather to be planned for, as certainly as a pilot plans for storms on a long route. Problems, delays, disappointments and outright failures are part of the price of any significant journey, and the person who has priced them in advance meets them standing, while the person who expected smoothness meets the same events as betrayal. Planning for turbulence is concrete work. Hold reserves of time and money against the schedule instead of planning every stage at its most optimistic length. Think through scenarios, the plausible difficulties this particular journey tends to produce, and sketch your response to each while you are rested and clear. Build relationships and arrangements you can call on when conditions worsen, because help recruited in a crisis costs more and arrives later than help cultivated in calm. The deeper benefit is psychological. A setback that was named in your plan cannot easily be used by discouragement as proof that the whole journey was a mistake. It is a known feature of the route, arriving roughly on expectation, and the plan already contains your next move. Smooth journeys teach little and are remembered less. The turbulent ones, handled well, produce the experienced and steady person the destination actually requires you to become.", "I plan for turbulence with reserves and rehearsed responses, and I refuse to call expected setbacks a failure of the journey."], ["Expect Headwinds and Keep Flying", "Flight Plan uses the winds of a journey to describe the changing conditions around any goal. A tailwind speeds a plane beyond its own power, while a headwind slows it and burns more fuel, and neither wind asks permission or announces its schedule. The pilot answer to a headwind is not complaint and not surrender. It is adjustment, more power applied, the destination held, and patience with a slower rate of progress for as long as the wind lasts. Lives and careers run in the same weather. Seasons arrive in which everything you do produces outsized results with little effort, and seasons in which the same effort produces half as much, through no change in your worth or your method. Misreading the second season is expensive. People abandon sound plans in a headwind, concluding that the plan was wrong, when the evidence only showed that the weather was. They also misread the first season, concluding that they are brilliant, and are then unprepared when conditions normalise. Keep a steadier account. Judge your method across a full cycle of weather, keep flying through the slow season at adjusted expectations, and use the fast seasons to build reserves and distance rather than to relax. Arrival belongs to those still airborne when the wind changes, and the wind always changes.", "I keep flying through headwind seasons at honest expectations, and I use tailwind seasons to build reserves."], ["Call It a Situation and Look for the Solution", "The problem solving material in Flight Plan pays attention to language, because the words you use for a difficulty steer the mind that must solve it. Speaking constantly of problems trains the mind toward weight and blame. Tracy counsels describing difficulties as situations and challenges, and turning at once to the language of solutions, what can be done, by whom, and how soon. This is not cosmetic optimism. It is a working instruction to the mind, which searches for whatever it is asked about and largely ignores the rest. Asked about problems, it produces refined descriptions of problems. Asked about solutions, it produces options, and options are the raw material of every recovery. The habit pairs with a refusal to spend the meeting of a difficulty on assigning fault. Fault may matter later, for learning and for fairness, but in the first hour it competes with the response for the same energy, and the response is urgent while the verdict is not. Practise the sequence until it becomes reflex. Name the situation plainly and without drama. State what a good outcome would look like. Generate possible actions, solitary or with others, and put the best first action into motion the same day. A person known for this reflex becomes valuable out of proportion to his other abilities, because groups in difficulty do not primarily need more analysis of the storm. They need someone already looking for the way through it.", "I call difficulties situations, and I turn my first energy to solutions and a same day action."], ["Ask Better Questions When Trouble Comes", "Closely connected with its language of solutions, Flight Plan treats questioning as the steering wheel of problem solving. When trouble arrives, the quality of the questions you ask decides whether your mind works for you or against you, because the mind answers the questions it is given with complete loyalty. Accusing questions produce defence and fog. Why does this always happen to me, and who is responsible, return emotion dressed as information. Working questions return usable fact. What exactly has happened, separated from what I fear has happened. What do I actually know, and what am I assuming. What is still within my control here. What has worked before in a situation like this, and who has solved this kind of difficulty well and could be asked. Write the questions and the answers during serious trouble rather than conducting the inquiry in your head, where anxiety edits the record. Paper holds the facts steady while feelings move. Review the written answers before deciding, because the first emotional account of a setback is rarely the most accurate one, and decisions made from it tend to need expensive correction. Pilots in difficulty work a checklist instead of trusting a racing mind. A written set of honest questions is the same instrument, carried by a person instead of a plane.", "I answer trouble with written questions about facts, control and past solutions, before I decide anything."], ["Correct Your Course in Small Steps Often", "Make Continual Course Corrections is the operational heart of Flight Plan, and its method is small and frequent adjustment rather than rare and dramatic change. A pilot does not wait until the plane is far off course to act, because distance makes correction expensive. He reads the instruments continually and adjusts in small amounts, so the journey stays within a narrow band around the intended line. Apply the same rhythm to a goal. Build feedback into the journey from the start, in the form of the measures and reviews this scroll has already described, and read them on schedule rather than when anxiety demands. When the reading shows drift, correct at once and modestly. Change the method, the pace, the order or the support, and then keep flying while the correction proves itself. Small early corrections preserve both resources and morale, because each one is cheap and each success at correcting builds trust in the whole system. The person who corrects continually also accumulates a priceless education, since every adjustment teaches something specific about the route, the vehicle and himself. Refusing to correct is the only real failure mode the book recognises, because a plane that stops correcting does not stay where it is. It drifts with every wind, and drift, given enough time, guarantees arrival somewhere you never chose.", "I read my progress on schedule and correct my course in small steps often, before drift becomes distance."], ["Learn Faster From Every Mistake", "Accelerate Your Learning and Progress argues that the speed of a journey is governed less by talent than by the rate at which the traveller converts experience into instruction. Two people can pass through the same year of effort and emerge with very different educations, because one extracted the lessons and the other merely endured the events. The accelerating learner treats every result, good and bad, as feedback with a message in it. He asks what this outcome teaches about the method, the market, the people involved and himself, and he writes the answers down before they fade, because unrecorded lessons are usually repaid for later at full price. He also borrows speed from other travellers. Mentors, books, courses and honest peers compress years of trial into hours of instruction, and seeking them is not weakness but efficiency, the deliberate use of altitude gained by others. The chapter joins this learning to a fast track habit of concentrating on the activities that produce the greatest progress, so that learning is aimed where it will pay soonest. Progress compounds for such a person. Each corrected mistake raises the quality of all future attempts, and each borrowed lesson removes a detour he will now never take. Over a long journey, learning speed is the difference that quietly becomes every other difference.", "I extract and record the lesson from every result, and I borrow speed from mentors, books and honest peers."], ["Refuse Shortcuts and Mirages", "Avoid Shortcuts and Other Mirages warns that the most dangerous offers on a long journey are the ones that promise arrival without the flight. Something for nothing appeals powerfully to a tired traveller, because it speaks to his fatigue rather than to his judgement, and Flight Plan treats the desire for it as the thing to be mastered, not indulged. Shortcuts in real life follow a pattern. They skip the stage where competence, capital or character was supposed to be built, and the skipped stage is always collected later, usually at the worst available moment and at a higher price. The person who avoids learning the skill meets the gap in front of an audience. The business that avoids building reserves meets the gap in a bad season. Mirages also waste the one resource that cannot be recovered, which is time spent travelling toward water that was never there. The test for any attractive shortcut is simple and severe. Ask what stage of the real journey it claims to make unnecessary, and whether arrivals you respect were permitted to skip that stage. Almost always the stage is the journey, disguised. Stay with the honest route, at the pace your preparation allows, and let the mirage hunters pass. Most of them will be seen again, starting over, on the same road you never left.", "I refuse shortcuts that skip the building of skill, capital or character, and I stay on the honest route."], ["Be Straightforward and Keep Your Word on the Journey", "The shortcuts chapter of Flight Plan is also concerned with the traveller, and it sets straightforwardness among the qualities that keep a person on the real route. Being straightforward means dealing honestly and openly, saying what you mean, admitting what you do not know, and refusing the small deceits and exaggerations that seem to offer a faster passage. Each small deceit is itself a shortcut, an attempt to gain by appearance what has not been gained in fact, and it charges the same interest as the larger kind. It must be remembered, defended and eventually paid for, usually in trust, which is the currency every long journey runs on. People extend real help, real credit and real opportunity to those whose word has proved reliable in small matters over a long time. They quietly withdraw all three from those whose accounts of themselves keep needing correction. The straightforward traveller also travels lighter in his own mind. He has one story to keep, the true one, and his energy goes into the work instead of into the maintenance of impressions. Admit errors early, state intentions plainly, promise carefully and deliver what was promised, and your reputation becomes a form of progress that compounds like learning does. In a world of mirages, a person known for straight dealing is not merely admired. He is sought out.", "I deal straightforwardly on my journey, I admit errors early, and I deliver exactly what I promised."], ["Master Fear by Moving Toward It", "Master Your Fears rests on the hopeful claim that fears are learned and can therefore be unlearned, chiefly by the method that built confidence everywhere else in this scroll, which is prepared and repeated action. The fears that block journeys are most often the fear of failure and the fear of criticism or rejection, and both grow in the dark of avoidance. Every avoided attempt leaves the feared thing untested, so the imagination keeps its exaggerated version unchallenged for another season. Moving toward the fear, in doses you can survive and learn from, replaces imagination with information. The presentation given badly teaches more than the presentation avoided for a year, because it returns facts about what actually happens, how people actually respond, and how quickly you recover. Recovery time is the discovery that breaks most fears. The dreaded outcome, when it comes, is usually bearable and brief, while the dread of it was neither. Tracy counsels acting with courage as a habit rather than waiting for fear to depart first, because in this area action precedes feeling with unusual reliability. Do the feared thing in a small form, note the result honestly, and repeat at a slightly larger scale. Confidence is not the absence of fear at the start. It is the accumulated evidence, gathered by your own feet, that fear was a poor prophet about your life.", "I master my fears by moving toward them in prepared and growing doses, and I trust the evidence my actions gather."], ["Success Is Not an Accident", "Flight Plan closes with its conclusion stated as a title. Success Is Not an Accident. A plane does not arrive by luck, and a life does not arrive by luck either, however much fortune may speed or slow particular stages. Arrival is the predictable result of a destination chosen clearly, a plan written and filed, a launch made with full commitment, and corrections applied faithfully through every kind of weather until the destination is reached. This closing claim gathers the whole of this scroll into one sentence of encouragement. Nothing in the system requires rare talent, unusual birth or mysterious favour. Every element is a practise available to an ordinary person willing to repeat it, which is why the same principles keep reappearing across all three books in these additions, stated as goals, as thinking and as flight. The claim also removes the last hiding place of discouragement, which is the suspicion that successful people possess a secret withheld from you. They possess habits, held for longer, through worse weather, with better records of the lessons. Choose the destination. Write the plan. Prepare honestly, launch fully, correct continually, refuse the mirages, and persist in the corrections until you arrive. The sky, in this teaching, is not reserved for the gifted. It is open to the faithful, and faithfulness, practised daily, is a decision renewed every morning you choose to fly again.", "I treat success as the predictable result of a clear destination, a written plan and faithful corrections, and I fly again today."]]}, {"title": "Million Dollar Habits: How a New Habit Is Built", "intro": "From Million Dollar Habits: almost everything you think, feel, do and achieve is the result of habit, and habits are learned. This part follows his method for building a new habit on purpose, one step at a time.", "cards": [["Almost Everything You Do Is Habit", "Million Dollar Habits opens with a striking claim: about ninety five percent of everything you think, feel, do and achieve is the result of habit. From childhood onward you develop conditioned responses that let you act automatically, without fresh thought, in almost every situation. That is why two people of similar ability can live such different lives. One has built habits of planning, saving, learning and finishing, so good results arrive almost as a side effect of an ordinary day. The other has built habits of delay, spending, drifting and quitting, so poor results arrive just as reliably, also without much conscious choice in the moment. Tracy calls the first kind success habits and treats them as the real explanation behind most achievement. The hopeful side of this teaching is that automatic behaviour can be examined. Once you see that a large share of your day runs on habit rather than on fate or talent, you stop asking only how to try harder inside the same patterns. You begin asking which patterns are running, where each one came from, and what it produces week after week. That audit is the doorway to change, because what runs automatically can be retrained deliberately, and a retrained habit will then work for you while you sleep on it.", "I audit the habits that run my ordinary day, and I keep the ones that carry me toward the life I want."], ["Every Habit Was Learned", "A central comfort in Million Dollar Habits is that all habits are learned. You were not born with your present way of rising, working, eating, speaking or handling money. Each pattern was picked up through repetition, example and response, and anything learned in that way can be unlearned or replaced in the same way. This removes the excuse that a person is simply made a certain way and must stay that way for life. It also removes the shame that often attaches to a bad habit. A bad habit is not proof of a bad person. It is proof of a pattern that was practised, often without anyone choosing it carefully, until it became easy. The way out is practice in the opposite direction, chosen carefully this time. Tracy links this learning to complete personal control: because habits are learned, you are not trapped by the ones you have. You can decide which habits a successful person in your field would need, study how those habits look in daily behaviour, and begin installing them one by one. The process is rarely dramatic. It is learning, and learning feels ordinary while it is happening, even though its results over years are anything but ordinary.", "I treat every unwanted habit as learned behaviour, and I replace it by learning a better one on purpose."], ["A Cue, a Response and a Consequence", "In the chapter Becoming a Person of Value, Tracy explains habit formation through a simple pattern that psychologists describe: a stimulus or cue appears, you respond with a behaviour, and a consequence follows. Repeated often enough, the response becomes automatic whenever the cue appears. The bell and food experiment with dogs is his picture of conditioning, but the same shape shows up in human life. A phone lights up and a hand reaches before thought arrives. A hard task appears and avoidance follows at once. A payday arrives and spending begins without a plan. Seeing the three parts matters because each part is a place to intervene. You can change the cue by changing what sits in front of you. You can rehearse a different response until it feels available in the moment. You can attach a better consequence so the new response is rewarded rather than punished. People who try to change by willpower alone usually fight only the middle part while leaving cue and consequence untouched. Tracy approach is more practical. Redesign the pattern itself. Put the book where the phone was. Make the first step tiny and visible. Let the reward arrive quickly. A habit built as a pattern can also be rebuilt as a pattern.", "I look for the cue, the response and the consequence in my habits, and I redesign the pattern instead of only fighting myself."], ["Decide the New Habit Completely", "The first of the seven steps to a new habit in Million Dollar Habits is to make a decision, and to make it complete. You decide to act in a specific way all of the time, not only when the day is easy or the mood is right. A partial decision leaves a negotiation open, and the negotiation will be held again every morning at the exact moment when you are weakest. A complete decision closes the argument in advance. The behaviour is settled; only the doing remains. Tracy is careful to make the decision specific. Rising early is vague. Rising at a stated hour, on stated days, to do a stated first activity, is a decision the day can obey. Saving money is vague. Saving a stated share of every payment into a separate account is a decision a bank can obey. Specificity is what turns intention into instruction. There is also an emotional side to deciding completely. When a person commits without reserve, energy that was spent debating becomes available for action. Doubt does not vanish, but it loses its vote. Choose one habit that would help you most right now, state it in clear behaviour, and decide on it fully. The remaining six steps exist to protect that decision until it no longer needs protecting.", "I decide on one new habit in specific behaviour, and I close the argument in advance by deciding completely."], ["Allow No Exceptions While It Forms", "The second step to a new habit is strict while the habit is young: never allow an exception during the formative stage. Tracy compares a forming habit to a thread that strengthens with each repetition and breaks easily at first. Every exception tells the old pattern that the door is still open, and the old pattern is patient. It only needs occasional victories to survive. No exceptions does not mean harshness toward yourself for the rest of life. It means protecting the early weeks, when the new behaviour is still a guest in your life rather than a resident. During that window, circumstances will offer reasonable sounding reasons to skip just once. The reason is often true and still not helpful, because the cost of the skip is not one day. The cost is a weaker pattern and a harder restart. Mature habits can survive an occasional disruption. Young habits usually cannot, so the wise person is stricter early and freer later. If a lapse does happen, the answer is not self contempt. The answer is to return at the very next opportunity, with the rule restored and no drama added. The thread can be retied quickly when you refuse to turn one exception into a season of them.", "I allow no exceptions while a new habit is forming, and I return at once if I ever miss."], ["Tell Others About the Habit You Are Building", "The third step is to tell others about the new habit you are developing. A private intention is easy to revise in silence, because nobody else knows when the standard quietly moves. A spoken commitment changes the social reality around the habit. People now expect the new behaviour from you, some will ask about it, and your own desire to be consistent with your word becomes an ally instead of a critic. Tracy treats this as practical psychology rather than boasting. Announce the behaviour, not a grand identity. Tell a friend that you will rise at a set hour and study before work. Tell your family that you are saving a set share of each payment and will not spend from that account. The right listeners add gentle pressure at the moments when private resolve is thin. Choose those listeners with care. Share with people who respect effort and will notice your progress, not with people who mock every attempt to improve. Their response becomes part of the environment in which the habit either strengthens or starves. Accountability also gives your successes witnesses. Each report of a kept week confirms the new pattern in your own mind, because you hear yourself described, truthfully, as a person who is actually doing this now.", "I tell trusted people about the habit I am building, and I let my spoken word strengthen my follow through."], ["Picture and Affirm the Person With the Habit", "Steps four and five of the habit method work together: visualise yourself performing the new behaviour, and create an affirmation that states it in positive, present and personal words, then repeat that affirmation with feeling. The picture gives the mind a rehearsal. You see yourself rising calmly, opening the book, starting the task at once, or passing the shop without entering, and the scene begins to feel familiar rather than foreign. Familiar behaviour is easier to perform when the real moment arrives. The affirmation gives the rehearsal a voice. Spoken to yourself in the first person, it instructs the mind in the direction of the new habit rather than arguing with the old one. Tracy ties this to how habits are born in the first place: repeated thoughts and responses, charged with emotion, settle into automatic patterns. Deliberate pictures and words use that same road in a chosen direction. Keep the practice brief and regular. A minute of clear picturing before sleep, and the affirmation repeated while you prepare for the day, will do more than an occasional heroic session. What you are building is not a mood. It is a sense of normality around the new behaviour, so that doing it begins to feel like you.", "I picture myself living my new habit and I affirm it in present words until the behaviour feels like me."], ["Persist Until the New Way Feels Automatic", "The sixth step is to resolve to persist in the new behaviour until it becomes automatic. Tracy notes that the time a habit takes to form varies widely. A habit touched by a strong emotional experience can set almost at once, while a habit of medium complexity, such as rising earlier, planning ahead or exercising daily, may take about three weeks of steady practice, and a deep pattern can take longer. The number matters less than the direction of effort. Early repetitions feel forced because you are carrying the behaviour by decision. Later repetitions feel lighter because the pattern begins carrying you. The test of arrival is a quiet one. You start to feel uncomfortable when you do not do the thing you decided to do. The run, the study period, the saving transfer or the planned start now feels normal, and skipping it feels like the exception. Until that point, persistence is the whole strategy. Motivation will rise and fall, and neither state is a reliable guide. The calendar is a better guide: did the behaviour happen today, as decided? Keep the chain unbroken, keep the behaviour at its agreed size, and let repetition do the heavy work that enthusiasm cannot do for long.", "I persist in my new behaviour every day until doing it feels automatic and skipping it feels strange."], ["Reward the Behaviour You Want Repeated", "The seventh step is the most pleasant one: give yourself a reward of some kind each time you practise the new behaviour. Tracy explains that a reward reaffirms and reinforces the behaviour, because you begin to associate pleasure with the action at a level below deliberate thought. The pattern that formed your old habits, cue, response and consequence, is now working in your favour, since the consequence is one you chose on purpose. The reward does not need to be large or expensive, and it must not undo the habit itself. A person building a saving habit is not rewarded by spending the savings. A person building an exercise habit is not rewarded by abandoning the food plan. Choose rewards that celebrate the behaviour while pointing the same way: a quiet hour with a favourite book, a walk in a loved place, a small mark of progress kept where you can see it grow. Timing matters. Let the reward follow the behaviour promptly, especially in the early weeks, so the connection is clear. Over time the behaviour develops rewards of its own, in energy, money, skill and self respect, and the deliberate reward can fade. Until then, use reward honestly. You are training a pattern, and patterns grow toward what is rewarded.", "I reward myself promptly each time I practise my new habit, and I choose rewards that point the same way."], ["Build One Habit at a Time and Be Patient", "Million Dollar Habits warns against trying to develop too many new habits at once, and urges you to take it easy on yourself while you change. You have spent your whole life becoming the person you are today. Expecting to rebuild every pattern in a month is not ambition. It is a way of arranging a discouraging collapse that leaves all the old habits intact. The wiser approach is selection. Ask which single habit, if you built it now, would help you most in your work, your money, your health or your peace. Write that habit down, attach a clear picture and affirmation to it, and focus your change effort there until the behaviour is firmly established. Then choose the next one. Tracy suggests making new habit development a regular part of life, always working on one helpful habit, so that improvement becomes a steady rhythm rather than a yearly emergency. Patience here is not softness. It is strategy. A person who builds one solid habit each month has rebuilt a life in a few years, while the person who attacks twelve habits each January usually keeps none of them. Go slowly enough to succeed, and let success itself supply the confidence for the next change.", "I build one habit at a time, I am patient with the process, and I let each success prepare the next one."]]}, {"title": "Million Dollar Habits: Money and Work Habits", "intro": "From the money and career chapters of Million Dollar Habits: saving before spending, using Wedge Theory on future increases, choosing to be rich rather than look rich, and the work habits that get a person paid more and promoted faster.", "cards": [["Save First, Then Live on the Rest", "The first habit of people who become millionaires, in Million Dollar Habits, is the habit of saving money, and Tracy is practical about how a beginner starts. If saving a large share feels impossible because debts and daily costs already take everything, begin with one percent of your income. Put that small amount into a separate account you refuse to touch, and learn to live on the remaining ninety nine percent. As the habit settles, raise the share step by step. The amount at the start matters less than the order. Most people save what is left after spending, and nothing is ever left. Savers reverse the order: the saving is taken first, as a payment to their future, and spending must fit inside what remains. Something also changes in the mind. Watching an account grow, even slowly, begins to attach pleasure to accumulation and discomfort to careless spending, which is the emotional reversal every saver needs. Tracy treats financial independence as an accumulation built from many small, unglamorous decisions rather than one brilliant stroke. Start where you honestly are, even at one percent, protect the account from raids, and increase the share whenever income rises or a debt disappears. The habit is the fortune in its early form.", "I save a share of my income first, I start with what I can, and I raise the share as I grow."], ["Use Wedge Theory on Every Increase", "Wedge Theory, as taught in Million Dollar Habits, is a way to grow savings without first shrinking your present life. Whenever your income increases, through a raise, a bonus or a better job, save half of that increase and only allow your spending to rise by the other half. A wedge is driven between what you earn and what you spend, and the wedge widens with every increase. The method works with human nature instead of against it. Cutting back a standard of living you already enjoy feels like loss, and most people resist it until the plan collapses. Saving money you have not yet learned to spend feels far easier, because nothing familiar is being taken away. Over several increases the effect is large. Income has risen, life has improved somewhat, and yet a serious savings habit has appeared almost painlessly, together with the investing habit that follows it. Wedge Theory also guards against the trap where expenses rise to match every rise in income, leaving a better paid person exactly as trapped as before. Decide the rule before the next increase arrives, while no emotion is attached to money you do not yet have. When the increase comes, move the saved half at once, before new spending invents a claim on it.", "I save half of every future increase in my income, and I move it before new spending can claim it."], ["Choose to Be Rich Rather Than Look Rich", "Million Dollar Habits sets two paths side by side in a simple contrast: look rich or be rich. Looking rich is purchased display, the car, clothes and objects bought early and on credit to signal a success that has not yet been built. Being rich is quieter. It is money saved, invested and left alone to grow, often in a life that looks ordinary from the street. The problem with display is not taste. It is order. Money spent proving success cannot also become the capital that produces success, and debt taken on for appearance charges interest on the proof. Many people who look wealthy are one missed payment away from crisis, while many actual millionaires were unremarkable neighbours who saved steadily for decades. Tracy urges the reader to think like a millionaire before becoming one, which mainly means valuing accumulation over applause. Ask of a large purchase what it truly is: a useful tool, a genuine joy you can afford, or a costume bought to be seen. Costumes are the most expensive clothes a person ever wears. Choose the slower dignity of real reserves. A growing account may impress nobody at a gathering, but it will stand beside you in every emergency and opportunity for the rest of your life.", "I choose real savings over expensive display, and I let my wealth grow quietly instead of performing it."], ["Get Rich Slowly and Keep It", "Get rich slowly is the honest pace Tracy sets in Million Dollar Habits, against every scheme that promises wealth at speed. Slow wealth is built from earning, saving, investing carefully and repeating the cycle for years, and its slowness is part of its safety. Money that arrives slowly is usually understood by the person who built it, because each stage taught a lesson about work, risk and patience. Money that arrives suddenly, without those lessons, often leaves just as suddenly. The slow road also uses time as an ingredient rather than an enemy. Small amounts, added regularly and allowed to compound, become sums that a single dramatic effort could never have produced. This is why the saver who begins early with modest amounts can finish ahead of the spender who begins late with large ones. Tracy pursuit of happiness point belongs here too: the goal of money is a free and peaceful life, not an anxious race that never ends. Slow builders can enjoy the road, because their security rises a little every month and their options widen with it. Refuse the pressure to look successful by Friday. Set the saving and learning habits in place, keep them through ordinary years, and let time do the heavy lifting it does for everyone who stays.", "I build wealth slowly through steady saving and learning, and I let time and patience keep what I build."], ["Volunteer First and Finish Fast", "Among the habits that get you paid more and promoted faster, Million Dollar Habits gives a plain one: take initiative and get the job done fast. When an important task appears, the person who volunteers for it, starts at once and finishes quickly becomes visible in a way that quiet competence alone rarely achieves. Managers remember the people who relieve their worries. A volunteer who delivers early does exactly that, and trust accumulates around that person task by task. Speed here is not carelessness. It is a reputation for urgency on the things that matter, built by starting immediately, removing obstacles without drama, and reporting completion while others are still preparing to begin. Tracy pairs initiative with completion, because volunteering and then drifting is worse than never volunteering at all. Take the task only when you intend to carry it through, then protect it from delay as if your name were printed on it, because in the minds of others it is. Over a career this habit compounds. The reliable finisher is offered the larger task, the better team and the wider responsibility, and promotion begins to look less like luck and more like accounting. Be the person whose hand rises first and whose finished work arrives first.", "I volunteer for important work, I start at once, and I finish fast enough that people trust me with more."], ["Be a Team Player People Can Count On", "Be a good team player is one of the career habits in Million Dollar Habits, and it is more demanding than simply being pleasant. A team player subordinates personal credit to the result the group must produce, helps colleagues succeed in their parts, and can be counted on when the work turns difficult. Teams remember who disappeared during pressure and who steadied the room. Tracy places this habit among those that bring faster pay and promotion for a practical reason. Almost all significant work is now done by groups, so the person who makes groups work better is worth more to every employer and partner. Being a team player also changes how others speak about you when you are absent, and those conversations decide many opportunities long before any formal review. There are disciplines inside it. Keep your commitments to colleagues as carefully as your commitments to a manager. Share information early rather than hoarding it as power. Credit others in public and raise problems in private. Accept an unglamorous piece of the work when the team needs it done. None of this requires you to surrender your ambition. It directs your ambition through usefulness, which is the most durable route to being wanted on every important team.", "I make my teams work better, I keep my word to colleagues, and I share credit in public."], ["Be on Time Every Time", "Be on time every time appears in the personal effectiveness chapter of Million Dollar Habits, small enough to overlook and strong enough to shape a reputation. Punctuality is a visible promise kept. Arriving when you said you would tells people, before any work begins, that your word organises your behaviour. Arriving late tells the opposite story, and it taxes everyone who waited by stealing minutes they cannot recover. Tracy treats time habits as character habits, because the person who is careless with appointment times is usually careless with deadlines, preparation and other peoples priorities as well. The habit is built by planning backward rather than hoping forward. Decide when you must arrive, allow for the journey as it actually is, add margin for the ordinary surprises of a day, and treat the aimed arrival as ten minutes early rather than exactly on the mark. Prepare the materials the night before so the morning holds no searches. When lateness becomes truly unavoidable, warn people as early as you can and take responsibility without a story. That honesty protects trust even when the clock does not. Keep this standard for small meetings as faithfully as for large ones. A life in which every arrival keeps its promise becomes known, quietly, as a life that can be trusted with larger promises.", "I plan backward, I arrive early, and I keep my time promises as carefully as my money promises."]]}, {"title": "Million Dollar Habits: People, Health and Character", "intro": "From the closing chapters of Million Dollar Habits on getting along well with others, health and well being, and character and leadership: habits of relationships, of the body, and of the inner life.", "cards": [["Make Other People Feel Important", "The relationship chapter of Million Dollar Habits begins with a simple limit: you can only give away something you have. A person who feels small inside tends to make others feel small, while a person with genuine self esteem can afford to raise the esteem of everyone in the room. From that base, Tracy aim in every interaction is to make the other person feel important, because the desire to feel important is one of the deepest drives in human nature. People remember how you made them feel long after they forget what you said. They seek out the company where their value was recognised, and they quietly avoid the company where they were diminished, corrected or ignored. Making others feel important is not flattery and it is not a technique for extracting favours. It shows in undivided attention, in remembering what matters to them, in thanking specifically rather than generally, and in refusing to criticise, condemn or complain about them to others. There is a return built into it, which Tracy gladly names: as you raise the self esteem of others, your own tends to rise with theirs. A person cannot spend a day genuinely honouring the worth of other people and end it believing human beings, including himself, are worth very little.", "I go through my day making other people feel important, and I let their rising esteem lift my own."], ["Practise the Five As With People", "Brian Tracy summarises the behaviours that make people feel wonderful about themselves as five As: Acceptance, Appreciation, Approval, Admiration and Attention. Acceptance means receiving a person without judgement, with a smile and a settled welcome that says they are fine as they are. Appreciation is expressed thanks for anything a person does, large or small, said promptly and by name where you can. Approval is praise for an accomplishment or a quality, given immediately and specifically, because people repeat what is approved. Admiration is the honest compliment on a trait, a possession or an achievement that the person is proud of. Attention is listening with your whole presence, which the speaking part of this scroll treats in its own right. Together the five As form a daily practice rather than a special event. None of them costs money. All of them cost the self absorption that would rather talk than notice. Tracy official teaching adds that the more important you make people feel in your presence, the more charming they will judge you to be, and the more they will welcome you and open doors for you. Practise one A deliberately in each conversation today, and watch how the quality of your relationships begins to change around ordinary moments.", "I practise acceptance, appreciation, approval, admiration and attention with the people in my life every day."], ["Forgive and Let Go Completely", "Forgive and let go is the counsel Million Dollar Habits gives for the injuries every life collects. Holding a grievance feels like justice, but it functions like a weight carried by the injured person alone. The one who wronged you may be sleeping peacefully while your own mind rehearses the offence at breakfast, at work and in the night. Tracy treats forgiveness as a decision you make for your own freedom, not as a verdict that the wrong was small or that trust must be restored. You can forgive a debt and still choose distance. You can release the anger and still learn the lesson the event taught you. What you cannot do is carry the resentment and also travel light toward your goals, because resentment rents the very mental space your future needs. The practice is usually gradual. Decide first that you will forgive, then refuse to feed the story when it returns, then replace rehearsal of the offence with work on something you value. Over time the emotional charge drains, and what remains is information without poison. Some people need a spoken conversation. Many need only the inner release, repeated until it holds. Either way, the beneficiary is clear. Forgiveness is the gift you give yourself with the other persons name on the occasion.", "I forgive people who have wronged me, I let the grievance go, and I keep my mind free for my future."], ["Keep Work and Home in Honest Balance", "In its relationship chapter, Million Dollar Habits pairs deciding what is truly important with maintaining balance between life and work. Balance in Tracy teaching is not an equal split of hours, which life rarely permits. It is the discipline of ensuring that the areas you call most important are not permanently starved by the area that shouts loudest. Work can expand into every evening if it is allowed to, because work always has one more demand. Family, health, friendship and inner peace rarely shout. They decline quietly, and their decline is noticed late. Honest balance therefore begins on paper. Name the areas that matter most, then look at where your last month of hours and attention actually went. The gap between the two lists is the real subject, and it is corrected by scheduling rather than by guilt. Put the important people and practices into the calendar first, protect a small number of non negotiable times each week, and let work organise itself around those anchors instead of the reverse. Balance also needs review, because seasons change. A demanding project may rightly take more for a while, provided the tilt is chosen, temporary and explained to the people it affects. What destroys a life is not a busy season. It is a busy season that never ends and was never decided.", "I name what matters most, I schedule it first, and I review my balance before a busy season becomes my life."], ["Eat for Energy and Health", "The health chapter of Million Dollar Habits begins with a decision: choose to be healthy and fit, and then eat the right foods as a daily habit rather than as an occasional diet. Tracy treats food as fuel for performance as much as medicine for the body. The person who eats poorly is not only risking illness later. He is taxing his clarity, mood and stamina today, in the hours when his goals need him at his best. The habit approach matters more than any single menu. Diets are events with an end date, after which the old pattern returns. Habits are patterns installed once and then carried by routine: regular meals built on simple, nourishing food, plenty of water, and far less of the sugar, salt and heavy processing that leave a person sluggish. Planning carries much of it. Food chosen in advance, in a calm moment, is almost always better than food chosen in a hurry by hunger and advertising. Tracy connects health to every other ambition in the book, because energy is the currency all goals are paid in. Eat in a way that leaves you clear and ready an hour later, not only satisfied for ten minutes, and let the repetition of that choice become one of your million dollar habits.", "I choose food that leaves me clear and energetic, and I plan my eating before hunger chooses for me."], ["Exercise Until Fitness Is Normal", "Get lots of exercise is the second health habit in Million Dollar Habits, placed there because a success teaching that ignores the body eventually bills the body for the omission. Exercise in Tracy framing is not a punishment for eating or a preparation for an event. It is a standing practice that keeps energy high, mood steady, sleep deep and confidence visible in the way a person carries himself. The habit method from earlier in the book applies exactly. Decide on a form of movement you can actually sustain, walking, cycling, swimming, training with weights, or a mixture you enjoy. Allow no exceptions while it forms. Keep the sessions at a size your life can hold on its worst week, not only on its best. Reward the practice and let fitness accumulate, because the Law of Accumulation works in the body as surely as in a bank account. Small sessions, repeated faithfully, rebuild strength and stamina that once seemed lost. Many people wait to feel energetic before they exercise, and wait forever. The order in a healthy life usually runs the other way: movement first, energy as the result. Treat exercise as an appointment with the person you are becoming, and keep it with the same seriousness you give to work that pays you.", "I exercise on a regular schedule I can sustain, and I let movement produce the energy I used to wait for."], ["Small Daily Health Choices Count", "Scattered through the health chapter of Million Dollar Habits are small, almost homely instructions: practise excellent dental hygiene, practise moderation in all things, belt yourself in, and keep yourself clean as a whistle in your habits and surroundings. Tracy includes them because health is rarely destroyed by one dramatic decision. It is eroded, or protected, by dozens of tiny choices repeated for years. Moderation is the governing idea. Enough food, enough rest, enough sun, enough work, enough pleasure, with the wisdom to stop at enough, protects a person from the excesses that quietly undo each of those goods. The seat belt and the toothbrush belong in the same teaching because they share a shape: a few seconds of care, taken every single time, guarding against a loss that would cost months or years. People skip them precisely because each single omission seems harmless, and that is how all protective habits die. Reverse the logic in your favour. Let the smallness of a good act be the reason it is never skipped, rather than the excuse for skipping it. Brush, fasten, wash, pause, stop at enough. A long and vigorous life is usually the sum of such unnoticed faithfulness, and its absence is usually the sum of unnoticed neglect.", "I protect my health with small choices made every time, and I stop at enough in food, rest and pleasure."], ["Take Solitude Every Day", "Practise solitude daily is one of the inner habits in the health and well being chapter of Million Dollar Habits, and Tracy treats it as seriously as food or exercise. Solitude here is not loneliness and it is not escape. It is a deliberate period of quiet, away from input and demands, in which you sit with your own thoughts, review your life, and listen to what your mind has been trying to say under the noise. He connects the practice with setting peace of mind as your most important goal, because peace is difficult to keep in a life that never stops to notice where it went. In solitude, problems often shrink to their true size, and the next step in a tangled matter frequently becomes obvious without being forced. Regular quiet also builds a relationship with yourself that constant entertainment is designed to avoid. Begin modestly. A short period each day, without a phone, without a screen, perhaps on a walk or in a chair with a notebook nearby, is enough to start. Let thoughts arrive in their own order. Write down what surfaces that deserves action, and let the rest pass. People who practise solitude return to their families and work calmer and clearer, because they have already met, in quiet, the person everyone else will meet all day.", "I take a period of quiet solitude every day, and I let my mind settle before I return to people and work."], ["Tell the Truth as a Character Habit", "Tell the truth stands near the centre of the character chapter of Million Dollar Habits, under the larger call to develop your own character on purpose. Tracy treats truthfulness as a habit rather than a trait, which means it is built by repetitions and weakened by exceptions, exactly like the other habits in the book. Every small evasion trains the tongue to bend under pressure. Every plain truth, told when a lie would have been easier, trains it to hold. The cost of dishonesty is larger than the risk of being caught. A person who shades the truth must remember which version each listener received, carry the low anxiety of exposure, and watch his own self respect quietly adjust downward. Tracy links character to self esteem throughout his teaching: it is hard to like yourself while keeping a private record of deceits. Truth telling also simplifies relationships, because people learn that your word needs no discount. In negotiation, in family life and in friendship, that reputation is a form of wealth. Practise it in small currencies first: accurate reports, honest mistakes admitted early, promises made only when you intend to perform them. Character is what remains consistent when no one would know, and truth is usually where it is tested first.", "I tell the truth in small things and large, and I admit my mistakes early instead of covering them."], ["Practise Gratitude and Loyalty", "Two character habits close the list in Million Dollar Habits: an attitude of gratitude, and loyalty as an essential quality, held together by believing in something greater than yourself. Gratitude is a way of counting. The grateful person rehearses what has been received, from people, from work and from life itself, and that rehearsal changes the emotional weather in which every other habit must be practised. Complaint trains the eye to hunt for lack. Gratitude trains it to hunt for provision, and a person who can see provision can endure a hard season without becoming hard. Loyalty is gratitude given a spine. It means standing by your people, your organisation and your commitments when fashion or advantage suggests drifting away, and refusing to speak against those you belong to when they are absent. Tracy treats loyalty as essential because trust collapses without it: nobody builds a long life with a person whose allegiance is always for sale. Believing in something greater gives both habits a home. A person who serves a purpose beyond his own comfort has a reason to be thankful in difficulty and loyal under pressure. Practise the pair daily. Name your gifts out loud, and be found, reliably, on the side of your own people.", "I count my blessings out loud each day, and I stay loyal to my people and my commitments under pressure."]]}, {"title": "The Power of Self Confidence: Values, Laws and the Inner Game", "intro": "From The Power of Self Confidence: confidence rests on clarified values, on mental laws such as substitution and indirect effort, and on governing the suggestions your mind receives each day.", "cards": [["Determine Your Values in Writing", "The foundation chapter of The Power of Self Confidence begins not with technique but with values: determine your values, in writing, before you try to build confidence on top of them. Tracy reason is that confidence flows from living consistently with what you believe matters most, and collapses when your behaviour keeps voting against your own convictions. A person cannot respect himself for long while betraying, daily, the things he says he honours. Values clarification is therefore a written exercise. Name the qualities and commitments that matter most to you: honesty, family, faith, excellence, freedom, service, peace, or your own set in your own words. Then test each one against your calendar and your spending, because those two records tell the truth about operative values more reliably than intentions do. Writing matters because vague values cannot guide a hard moment. When a value is written and owned, it becomes a standard you can consult before a decision instead of a regret you consult after one. Tracy also notes that values are nonnegotiable in a healthy life: they are not adjusted to suit each audience or opportunity. Start the confidence work at this depth. A clear set of values gives the self a definite shape, and definite shapes are what confidence is confidence in.", "I write down my true values, I test them against my calendar, and I refuse to trade them for opportunity."], ["Order Your Values When You Must Choose", "Clarifying values is only half the exercise in The Power of Self Confidence. You must also organise them, because the order of values forces you to choose. Two good values will regularly compete for the same hour, the same money or the same yes. Health and work compete. Family and ambition compete. Honesty and kindness can appear to compete in a painful conversation. Without an order decided in calm, the loudest pressure decides in the moment, and the person ends the day having honoured whichever value shouted, not whichever value ranked. Tracy asks the reader to arrange values in priority order and to accept what that arrangement reveals. If family stands above career, some career offers must decline even when they glitter. If integrity stands above approval, some rooms will go quiet when you speak. The ranking does not remove the pain of choice. It removes the confusion, and confusion is what drains confidence fastest. There is relief in a decided order. When the conflict arrives, the question is no longer who you are. That was settled at the desk. The question is only how to carry out, graciously and firmly, what your order already decided. Review the order as life changes, in writing, in calm, and never in the middle of a temptation to reverse it for convenience.", "I rank my values in writing while I am calm, and I let that order decide when good values compete."], ["Your Values Show Only in Your Actions", "Your values are only expressed in your actions is one of the plainest sentences in the logic of The Power of Self Confidence, even paraphrased here. A value held only as an opinion costs nothing and proves nothing. It becomes real at the point of behaviour: in the honest answer that risks a sale, the evening kept for family during a busy season, the excellence maintained on work nobody will inspect. Tracy uses this test to protect the reader from self deception. It is easy to feel like a person of courage, generosity or discipline while the record shows avoidance, keeping and delay. The record is the biography. Other people read it accurately even when we prefer our intentions. The hopeful side is that action is also the repair. You do not need to feel like a new person before behaving like one. A single action in line with your values begins to restore the self respect that confidence is built from, and repeated actions rebuild it fully. Audit yourself kindly and concretely. Choose one value that your recent actions have not expressed, and find the next ordinary opportunity to express it in behaviour small enough to do today. Confidence grows fastest where claim and conduct meet, and it withers wherever the two are allowed to live apart.", "I judge my values by my actions, and I express one neglected value in a concrete act today."], ["Set Peace of Mind as Your Highest Principle", "Set peace of mind as your highest principle is the organising counsel in the foundation chapter of The Power of Self Confidence, and Million Dollar Habits repeats it as a goal for the inner life. Tracy treats peace of mind as the highest human good and the natural state from which good decisions, good relationships and good work flow. Anxiety is not only unpleasant. It distorts judgement, shortens temper and makes small obstacles look like verdicts. Making peace the highest principle gives you a test for choices that money and applause cannot pass on their own. Ask of a commitment, a purchase, a quarrel or an ambition what it will do to your peace. Some worthy work disturbs peace for a season and is worth it. Much disturbance, however, is bought carelessly: obligations accepted to please, arguments continued to win, news and noise consumed until the mind never rests. Guarding peace means declining some of those purchases. It also means building the conditions peace grows in: a clear conscience, finished apologies, ordered surroundings, solitude, and work that agrees with your values. Measure a day by more than its output. A day that produces results and keeps your peace has succeeded twice. A day that produces results by spending your peace has charged you more than the results may be worth.", "I test my choices by their effect on my peace of mind, and I build the conditions in which peace grows."], ["Act As If the Confident Person Is Already You", "The Act As If Principle, with its companion Law of Reversibility, is Tracy method for growing a quality before you fully feel it. The Law of Reversibility says that feelings and actions run in both directions: if you feel confident you act boldly, and if you act boldly, repeatedly, the feeling of confidence begins to follow the behaviour. Act as if asks you to use the second direction on purpose. Walk, speak, prepare and decide as the confident person you are becoming would, not as a performance for others, but as training for yourself. This is not pretending that skills exist which do not. It is refusing to let a lagging feeling veto the very behaviour that would create evidence for a better feeling. The shy person who greets people warmly for a month gathers real experiences of welcome, and those experiences argue with the old self image more persuasively than any lecture. Choose one arena, a meeting, a classroom, a family gathering, and rehearse the conduct of confidence there: eye contact, a clear voice, a posture of ease, questions asked without apology. Feelings are slow students, but they do learn. Feed them behaviour they cannot ignore, and they will eventually report that you have changed.", "I act as the confident person I am becoming would act, and I let my feelings learn from my behaviour."], ["Expect Resistance and Grow Through It", "The Principle of Resistance in The Power of Self Confidence warns that growth meets pushback, from inside and outside, and that the pushback is information rather than a stop sign. When you raise a standard, the old habits resist because they are being retired. People around you may also resist, because your change alters a pattern they had learned to rely on, even a pattern that was harming you both. Tracy point is to expect this in advance so it does not ambush your resolve. A new discipline feels awkward before it feels strong, the way a muscle trembles under a load it is not yet used to carrying. The trembling is not proof the load is wrong. It is proof the muscle is working at its edge, which is where strength is built. Developing inner strength, the phrase his chapter uses, is mostly this: continuing the chosen behaviour while resistance makes its case for the old life, and discovering that the case gets weaker each week you outlast it. Plan for resistance the way a traveller plans for weather. Decide your response to the first hard day, the first mocking comment and the first failure before they arrive. Resistance expected is resistance halved, because surprise was half its power.", "I expect resistance when I grow, I plan my response in advance, and I outlast the pushback week by week."], ["Substitute a Strong Thought for a Weak One", "The Law of Substitution is one of the most usable mental laws in The Power of Self Confidence: your conscious mind can hold only one thought at a time, so a negative thought can be displaced by deliberately substituting a positive one in its place. The law matters because arguing with a fear often keeps your attention on the fear. Substitution changes the subject of the mind entirely. When worry begins rehearsing failure, you replace the scene, on purpose, with a clear picture of the outcome you want and the next step toward it, and you hold that picture until the emotional charge moves. This is not denial of a problem. The problem will be handled in planning and action, in their proper hours. Substitution governs the other hours, when the problem is not being solved but only being suffered, and suffering it early and often adds nothing to its solution. Build the replacement in advance. Know which thought, picture or line of truth you will install when anxiety arrives, the way a pilot knows the procedure before the engine note changes. People who wait to invent a response inside the emergency usually default to the old rehearsal. Practise substitution on small worries until the movement is quick, and the large worries will meet a trained mind instead of an open field.", "I replace a fearful thought at once with a clear picture of what I want and my next step toward it."], ["Take the Indirect Road With People", "The Law of Indirect Effort teaches that in relationships you get almost everything you want more easily by approaching it indirectly than directly. If you want to impress people, talking about your own qualities usually makes you feel foolish and leaves them unmoved, while being genuinely impressed by them, by who they are and what they have done, makes them regard you with warmth. If you want people interested in you, become interested in them first. If you want respect, give respect. If you want to be happy, the most durable ro
