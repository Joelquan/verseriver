  :root{--ink:#C1E8FF;--dim:#7DA0CA;--soft:#5483B3;--deep:#021024;--mid:#052659;--gold:#C9A44C}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{background:linear-gradient(180deg,#021024 0%,#052659 55%,#021024 100%);color:var(--ink);font-family:"Cormorant Garamond",Georgia,serif;min-height:100dvh}
  .wrap{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 42px) 20px 54px}
  .kicker{font-family:Cinzel,serif;letter-spacing:.32em;font-size:11px;color:var(--gold);text-transform:uppercase;text-align:center}
  h1{font-family:Cinzel,serif;font-weight:700;font-size:34px;line-height:1.18;color:#fff;text-align:center;margin:14px 0 12px}
  .sub{text-align:center;font-size:20px;line-height:1.5;color:var(--ink);max-width:40ch;margin:0 auto 36px}
  .doorCard{position:relative;border-radius:18px;overflow:hidden;margin-bottom:26px;border:1px solid rgba(125,160,202,.35);background:#052659;text-align:left;width:100%;display:block;cursor:pointer;padding:0;font-family:inherit}
  .doorCard .photo{height:380px;background-size:cover}
  .doorCard .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(2,16,36,.05) 34%,rgba(2,16,36,.86) 74%,rgba(2,16,36,.97) 100%)}
  .doorCard .body{position:absolute;left:0;right:0;bottom:0;padding:22px 24px 24px}
  .doorNum{font-family:Cinzel,serif;font-size:11px;letter-spacing:.3em;color:var(--gold);text-transform:uppercase;margin-bottom:8px}
  .doorName{font-family:Cinzel,serif;font-size:26px;font-weight:700;color:#fff;line-height:1.2}
  .essence{font-size:19px;line-height:1.45;color:var(--ink);margin-top:8px;max-width:38ch}
  .enter{display:inline-block;margin-top:16px;font-family:Cinzel,serif;letter-spacing:.18em;font-size:13px;color:#021024;background:var(--ink);border-radius:999px;padding:13px 30px;text-transform:uppercase}
  .doorCard.empty{background:linear-gradient(170deg,#052659,#021024);border:1.5px dashed rgba(201,164,76,.55);cursor:default}
  .doorCard.empty .frame{min-height:300px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:26px}
  .doorCard.empty .doorName{color:var(--dim);font-size:22px}
  .doorCard.empty .essence{color:var(--soft)}
  .foot{text-align:center;font-style:italic;font-size:18px;color:var(--dim);margin-top:8px}
  /* teacher overlay */
  #overlay{position:fixed;inset:0;background:var(--deep);display:none;z-index:50}
  #overlay.open{display:block}
  #scroller{height:100%;overflow-y:auto;scroll-snap-type:y proximity;-webkit-overflow-scrolling:touch}
  .screen{min-height:100%;scroll-snap-align:start;position:relative;display:flex;flex-direction:column;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 64px) 26px calc(env(safe-area-inset-bottom,0px) + 40px);max-width:640px;margin:0 auto;width:100%}

<script>
const DATA = [{"slug": "tracy", "name": "BRIAN TRACY", "short": "Tracy", "essence": "Goals, focus and self discipline: eat that frog.", "sub": "goals, focus and self discipline", "pos": "center 10%", "end": "set the goal in writing, eat the frog first, and never stop learning.", "photo": "photos/tracy.jpg", "sections": [{"title": "The Mind of Tracy", "intro": "Brian Tracy left school without graduating, worked labouring jobs, and in his twenties began asking why some people succeed while others do not. A lifetime of study became one conviction: your thoughts run your life. These come first.", "cards": [["You Become What You Think About Most", "The thoughts you return to again and again quietly steer your choices, your habits and your direction, until your outer life begins to match the picture you carry inside. This happens because attention acts like a filter. What you dwell on is what you notice, and what you notice is what you act on, often without realising how much your thinking has already chosen for you. If your mind dwells on problems, you find more problems, because every setback looks like proof and every delay looks like a dead end. If it dwells on goals, you begin to notice people, ideas and chances that fit those goals, because the same world now presents itself in a different order. Consider a worker who spends each morning rehearsing how unfair his job is. He walks in braced for offence, hears criticism in ordinary comments, and gives his poorest effort to people he has already condemned. Another worker in the same place thinks each morning about the skill he is building and the future it opens. He hears the same comments as information, asks better questions, and leaves with more than he brought. The workplace did not change between them. The dominant thought did, and over months that difference becomes a different life.", "I guard my dominant thoughts, because I am becoming whatever I think about most of the time."], ["Change Your Thinking, Change Your Life", "Nothing in your past has to decide your future, because the starting point of every change is a change in how you think. A past failure can teach a lesson, but it becomes a limit only when you keep thinking about yourself in the same old way and expecting the same old result. When you replace a limiting thought with a truer and stronger one, and act on it daily, your results begin to shift in the same direction. The replacement has to be worked, not merely wished for. You think the new thought on purpose, you speak in line with it, and you take the small actions that give it evidence to stand on. The contrast is plain in ordinary life. A student who failed one examination and decides she is simply poor at the subject stops preparing properly, and her thinking proves itself right. The same student, deciding instead that her method was poor and her ability is trainable, changes how she studies, asks for help earlier, and reviews a little each day. Her grades move because her thinking moved first. Your past explains where you have been. It does not have to vote on where you are going, unless you keep handing it your thoughts.", "I start every change in my life by changing the thoughts I allow to lead me."], ["The Law of Control", "You feel calm, positive and strong to the degree that you feel your own hands are on the steering wheel of your life, and you feel stressed and negative to the degree that you feel pushed around by people and events. This is the Law of Control, and it works from the inside out. Two people can face the same pressure and live in it very differently, because one is watching for what he can decide and do, while the other is watching only what is being done to him. Taking charge begins in the mind, with the decision that you, and not circumstances, will direct your thoughts and responses. It simply refuses to surrender the part that is yours: your interpretation, your next step, and the state of mind you carry into both. Imagine a driver held in heavy traffic on the way to an important appointment. He cannot move the cars ahead, but he can call ahead, rearrange the next hour, and use the waiting time to prepare instead of raging at the wheel. The delay is real either way. The driver who takes control of his response arrives steadier, thinks clearer, and wastes far less of himself on what he never controlled.", "I take control of my thoughts and my responses, and I refuse to hand my peace to circumstances."], ["Your Self Concept Is Your Master Program", "Deep down, you hold a bundle of beliefs about yourself and about what is possible for you, and this inner program sets the level at which you perform in every area. You rarely rise above it for long, because you always end up acting in line with what you believe about yourself, so real change means upgrading the program itself. A brief burst of effort can carry you above your self concept for a short season, the way a sudden push can move a heavy object. But when the push stops, behaviour drifts back to what feels normal and familiar, because the program underneath was never changed. One believes he is the kind of person who finishes, follows through, and learns quickly, so he practises without being watched. The other believes people like him always fall behind, so he hesitates, hides his questions, and quits at the first embarrassment. For example, a new supervisor who quietly believes she is not a leader will avoid hard conversations, soften every decision, and then read the confusion around her as proof. Upgrade what she believes about herself, and the same duties become training ground instead of threat. Performance follows the program, so the program is worth serious work.", "I work on what I believe about myself, because my performance follows my self concept."], ["Clarify Your Self Ideal", "The first part of your self concept is the picture of the person you most want to become: your values, your character and the qualities you admire in others. The clearer that picture becomes, the more it pulls your daily behaviour upward, because you start making the choices that person would make. A vague wish to be a better person gives you nothing to measure a Tuesday afternoon against. A clear self ideal does. You know what honesty looks like in a small transaction, what patience looks like in a hard conversation, and what diligence looks like when nobody will check the work. The picture works like a standard you carry into rooms before anyone else speaks. The contrast shows itself in temptation. A man with no clear picture of himself takes the shortcut because the moment is all he sees. A man who has settled that he is becoming a person of integrity feels the cost of that shortcut immediately, because it disagrees with the person in the picture. Picture a young parent who admires calm, truthful people and decides to become one. She is not performing for an audience. She is practising, choice by choice, the person she has already decided to be.", "I keep a clear picture of the person I am becoming, and I let that picture guide my choices today."], ["Like Yourself More", "Tracy treats self esteem, meaning how much you genuinely like and respect yourself, as the core of a healthy self concept and the root of confidence. People who like themselves set bigger goals, persist longer and treat others better, while constant self criticism drains the energy that achievement requires. This is not flattery and it is not pretending that faults do not exist. It is a settled respect for your own worth that lets you face a fault honestly without turning the fault into your identity. A person who dislikes himself hears correction as condemnation, so he either defends everything or gives up on everything. A person who likes himself can hear the same correction as useful information, adjust, and keep moving with his strength intact. The difference appears in simple settings. Think of someone learning a trade who makes a clumsy mistake in front of others. If his inner voice is contemptuous, he spends the rest of the day replaying the shame instead of studying the skill. If his inner voice is respectful, he notes what went wrong, asks how it is done properly, and tries again while the lesson is fresh. Confidence grows in that second kind of company, and you keep that company with yourself all day long, so the tone of it matters greatly.", "I speak to myself with respect, and I build the quiet confidence that comes from liking who I am becoming."], ["No Limits Except the Ones You Accept", "Most of the limits on your life are not real walls; they are beliefs you picked up from failure, criticism or habit and never questioned again. When you test a supposed limit with learning and action, you usually discover it was far softer than it looked, and your true potential is far larger than you have been using. A limit deserves respect when it has been tested honestly. Many accepted limits have never been tested at all. They were spoken by a tired teacher, absorbed after one embarrassment, or repeated so often inside the family that they began to sound like facts of nature. Tracy's counsel is to examine them one by one and ask what evidence actually holds them up. Some will stand. Many will not. Picture an adult who says he cannot learn numbers because he was poor at mathematics as a boy. He has avoided every task involving figures for years, so his skill stayed exactly where his belief left it. Given patient instruction, a few worked examples, and regular practice with household accounts, he finds he can learn perfectly well. Nothing about his mind changed overnight. What changed was that an old verdict was finally brought into the open and tested, and honest testing is how soft limits are separated from real ones.", "I question every limit I have accepted about myself, and I test it with action instead of fear."], ["Learn From Experts", "Everything you need to know to succeed in your field has already been learned, often the hard way, by people who went before you. Studying the best people, reading their books and following their proven steps can save you years of slow and painful trial and error. This is a humble approach, and that is part of its strength. The beginner who insists on inventing everything himself pays full price for lessons that were already bought by someone else's mistakes. The learner who studies first still has to do his own work, but he starts further down the road, with a map drawn by people who have actually travelled it. Their steps also show you the order in which things are learned, which matters as much as the steps themselves. Consider someone opening a small repair business. Alone, he might spend two years discovering how to price work, keep records, and handle unhappy customers. Studying an experienced owner in the same trade, he can adopt sound pricing, simple records, and a fair way of settling complaints from the first month. He will still meet problems of his own, but they will be new problems at a higher level, not the old beginner's problems repeated at full cost year after year.", "I find the people who have already done what I want to do, and I learn their ways before I invent my own."], ["Feed Your Mind Deliberately", "Your mind becomes like the material you feed it each day, the same way your body becomes like the food you eat. No one expects strength from a diet of rubbish, yet many people expect confidence and clarity from a daily diet of complaint, alarm and idle distraction. Tracy teaches reprogramming the self concept by picturing your goals as already real, speaking positive words to yourself, taking in teaching that builds you, and spending time with positive people. Each of these is a form of feeding. The picture gives your mind a destination. The words set the tone in which you address yourself. The teaching supplies ideas stronger than your present habits. The company either confirms your direction or quietly pulls you back toward the level you are trying to leave. Take an ordinary evening as an example. One person spends it absorbing grievance and mockery until he goes to bed irritated and small in his thinking. Another spends part of the same evening reading sound teaching, reviewing his goals, and talking with a friend who takes growth seriously. You are feeding yours today either deliberately or by default, and deliberate feeding is the only kind you can direct toward the life you want.", "I feed my mind with pictures, words, teaching and people that build the life I want."], ["The Worst Use of Time", "One of the poorest uses of your hours is becoming excellent at something that did not need doing at all. Before you climb any ladder, check that it is leaning against the right building: decide first whether the task matters, and only then decide how well and how fast to do it. A person can polish a useless report until it shines, organise a cupboard nobody uses, or master a process the work has already outgrown, and every hour of excellence spent there is an hour stolen from something that would have counted. The waste is hard to see because the work itself feels productive. The hands are busy, the result is neat, and the day fills up. The honest question comes earlier and feels slower: does this need doing, by me, at this standard, at all? Suppose a small shop owner spends each morning perfecting the arrangement of a display that customers barely notice, while quotations that would bring in real orders sit unanswered. Improving the display is not wrong in itself. It is simply the wrong first work. Put worth before workmanship in every decision, and your growing skill will be spent where it can actually build your life instead of decorating its edges.", "I ask whether a thing is worth doing before I ask how to do it well."]]}, {"title": "The Law of Cause and Effect", "intro": "The iron law at the centre of his success teaching: everything happens for a reason, and success is an effect with findable causes. From Maximum Achievement, with its companion mental laws.", "cards": [["Everything Happens for a Reason", "We live in an orderly world where effects do not appear by accident; behind every result in your life there is a specific cause, or a chain of causes. This is good news, because once you find the cause of a result you want, you can repeat it, and once you find the cause of a result you hate, you can remove it. Calling a result luck ends the investigation before it starts. Tracy's law returns both to your hands. You trace the result backwards, honestly and without blame, until you find the actions, habits and decisions that produced it. Those causes can then be strengthened or replaced. Consider a household that is always short of money before the month ends. Blaming prices alone feels true but changes nothing. Tracing the causes may reveal small unrecorded purchases, no agreed limit on eating out, and bills left until they attract charges. Each cause is ordinary, and each can be addressed in an ordinary way. The same tracing works in the other direction. A worker trusted with larger duties can look back and find the causes: steady preparation, promises kept, and problems reported early. Found causes are repeatable causes, and repeatable causes are how a life gets rebuilt on purpose.", "I stop calling my results luck, and I start hunting for their causes."], ["Thoughts Are Causes, Conditions Are Effects", "The deepest causes of your life are not events but thoughts, because your thoughts set your feelings, your feelings drive your actions, and your actions produce your conditions. Change the thought at the root and, given time and consistency, the fruit of your life changes with it. This chain explains why working only on conditions so often disappoints. You can rearrange the outside of a life for a season, but if the thoughts producing the old feelings and actions remain untouched, the old conditions quietly grow back. It also explains why a genuine change of thinking can look slow at first. The root changes before the fruit can, and fruit takes a season to form. Patience here is not passivity. It is continuing the new actions long enough for conditions to catch up with their new cause. Imagine two neighbours who both lose work on the same day. One thinks the loss proves he has nothing to offer, feels ashamed, avoids people, and applies for nothing for weeks. The other thinks the loss is serious but separate from his worth, feels urgency rather than shame, tells people he is available, and applies daily. Same event, different thought at the root, and within months the conditions around them are no longer the same conditions at all.", "I treat my thoughts as causes and I plant them carefully, knowing conditions will follow."], ["You Reap What You Sow", "The old sowing and reaping pattern runs through work, money, health and relationships: what you put in, faithfully and over time, is what comes back to you, multiplied. You cannot sow neglect and harvest excellence, and you cannot sow steady, honest effort and end with nothing. The pattern is patient, which is why people misread it. Seed does not become harvest the same afternoon, so the sower is tempted to conclude that sowing does not work and to stop just before the growth would have shown. Others sow in bursts, working hard for one week and coasting for three, then wonder why the field looks thin. The law rewards faithful input over time, the kind that continues when the early excitement has gone. Think of a friendship as a field. Occasional grand gestures cannot substitute for regular honesty, kept promises and small kindnesses offered when nothing is being celebrated. Neglected for months, the friendship thins, however fond the memories are. Tended steadily, it deepens in a way no single gesture could manufacture. Work and money obey the same order. Daily effort, honest dealing and skill practised in season look unspectacular from close up. Multiplied across a year, they become the harvest that others, seeing only the end, mistakenly call talent or good fortune.", "I sow daily effort, honesty and kindness, and I trust the harvest to follow the seed."], ["Success Leaves Clues", "If you study what consistently successful people in your field actually do, and then do the same things in the same order, you will in time get similar results, because results follow causes rather than personalities. The key word is actually. Study what successful people do in their ordinary weeks, not what they say in celebration or what observers imagine about them. Look for the repeatable causes: how they prepare, how they use their mornings, how they treat customers, how they recover from a poor result. Then copy those causes faithfully before you try to improve on them. Originality has its place, but it belongs after the proven pattern is working in your hands. A young baker offers a clear picture. She could spend years experimenting blindly with recipes, timing and pricing. Instead she studies the baker in her town whose shop is always busy, learns his preparation rhythm, his way of costing ingredients, and his habit of asking customers what they wished he sold. Practising the same causes, her own shop steadies and grows. She has not copied his personality or stolen his work. She has done what Tracy teaches: find the causes behind a result you respect, and sow them in your own field.", "I copy the proven actions of successful people until their causes produce results in my own life."], ["The Law of Correspondence", "Your outer world tends to mirror your inner world: your income, your relationships and your peace tend to match the beliefs, expectations and pictures you carry inside. Working only on the outside is slow; change the inside first and the outside begins to correspond. This law does not say the outside is imaginary. Rent is real, other people are real, and circumstances press hard. It says the inside is where your response to all of that is formed, and your repeated responses are what gradually shape the conditions you live in. A person who inwardly expects rejection carries himself defensively, hears offers as traps, and declines chances before they can develop. His outer world then confirms the picture he brought to it. Another person, inwardly settled and expectant of good faith, asks plainly, trusts carefully but openly, and builds the kind of relationships the first person insists do not exist. Consider your workspace as a small example. A desk buried under weeks of postponed decisions usually corresponds to a mind avoiding those same decisions. Clearing the desk helps, but the lasting change comes when the inner avoidance is faced and a habit of deciding is built. Then the desk stays clear, because the inside it mirrors has changed. Start within, and let the outside follow its new pattern.", "I change my inner world first, and I watch my outer world begin to match it."], ["The Law of Belief", "Whatever you believe deeply, with real feeling, tends to become your reality, because belief filters what you notice, what you attempt and how long you persist. Limiting beliefs shrink a life just as surely as empowering beliefs expand one, so your beliefs deserve the same careful attention as your money. A belief is not a passing opinion. If you believe customers will never pay a fair price, you will not prepare a confident offer, you will apologise while presenting it, and you will stop pursuing the very people who might have paid gladly. The belief manufactures its own evidence. If you believe your ability can grow with training, the same setback is read differently, as information about method rather than a verdict on worth, and you persist long enough for skill to compound. For example, a man who believes he is too old to learn a computer system avoids every lesson and falls further behind each year. His workmate, no younger, believes the system can be learned in stages, books the training, and practises one task at a time. Within months their realities have genuinely parted. Examine your beliefs as you would examine accounts, keeping what is true and freeing, and replacing what merely keeps you small.", "I examine my beliefs, keep the ones that set me free, and replace the ones that keep me small."], ["The Law of Expectations", "You tend to get not what you merely wish for, but what you confidently expect, because expectation shapes your attitude, your body language and your effort, and other people respond to it. Expecting to do well is not pride; it is a practical habit that turns your own behaviour into a self fulfilling pattern. A wish is passive. It hopes the world will arrange itself kindly. Expectation prepares. The person who expects to handle an interview well studies the organisation, rehearses his answers, arrives rested, and speaks like someone who belongs in the conversation. The interviewer responds to that preparation and composure, and the expected outcome becomes more likely for entirely practical reasons. The opposite pattern is just as practical. Someone who expects to fail prepares carelessly, arrives tense, interprets neutral faces as rejection, and gives up on questions he could have answered. Picture a shopkeeper opening a new location. If she expects the neighbourhood to support good service, she stocks carefully, trains her staff well, and greets early customers with energy that brings them back with friends. Expectation never replaces work. It directs work, sustains work, and shows on your face while you do it. Expect good outcomes, prepare as though they matter, and let your actions rise steadily to meet what you expect.", "I expect good outcomes and prepare for them, and I let my actions rise to meet my expectations."]]}, {"title": "Goals", "intro": "From Goals!: achievement begins as a written target with a deadline. His seven step method, the major definite purpose, and the daily habit of rewriting ten goals in the present tense.", "cards": [["Decide Exactly What You Want", "The first step of the method is to decide, in detail, exactly what you want in each important area of your life, rather than drifting with vague wishes. Clarity is the starting point of all achievement, because you cannot hit a target you have never defined. Vague wishes feel safe because they can never be missed, but that safety is exactly their weakness. An exact decision is different. It names the outcome in plain terms, area by area: work, money, health, family, learning and the rest of the life you actually live. Detail also exposes conflict early. Once wants are written exactly, you can see which ones support each other and which ones compete for the same hours, and you can choose deliberately instead of discovering the conflict through exhaustion. Imagine someone who says he wants to get ahead at work. That phrase could mean a promotion, a different trade, higher pay or his own business, and each requires different steps. The moment he decides exactly, perhaps a supervisor's role within his present company, the path firms up: skills to gain, people to learn from, results to produce. Decision turns drifting into direction, and direction is what effort needs before it can become achievement.", "I decide exactly what I want in each area of my life, and I refuse to settle for vague wishes."], ["Write It Down", "A goal that stays only in your head remains a wish, but writing it down gives it shape and weight and forces you to choose what you truly mean. The simple movement from thinking to writing is where a fantasy becomes a commitment your mind begins to take seriously. In your head, a goal can stay comfortably blurred. You can imagine success without deciding amounts, dates or standards, and the picture never argues back. On paper, the blur ends. That discomfort is useful, because it shows you exactly what still needs deciding. Writing also gives the goal a life outside your mood. Feelings rise and fall through a week, but the written goal remains on the page, unchanged, ready to be reviewed when enthusiasm is low. Many people keep a notebook for this reason, returning to the same pages each morning. Consider a man who has thought for years about saving for a house. The thought has produced nothing but mild guilt. The evening he writes the goal properly, with the amount and the monthly saving it requires, he sees both the size of the task and its possibility. His first deposit follows within the week, because the written goal finally told him what to do.", "I write my goals down in clear and specific words, because unwritten goals drift away."], ["Set a Deadline", "Give each goal a date by which it is to be reached, and break a large goal into smaller parts, each with its own date. A deadline creates healthy pressure, gives your mind a finish line to aim at, and turns someday into a plan; if you miss it, set a new date and keep going. Someday is where goals go to sleep. It asks nothing of today, so today gives it nothing, and the goal remains exactly as far away next year as it is now. A date changes the relationship. Each stage gets its own date, so progress becomes visible while there is still time to correct it. The pressure involved is meant to be healthy, a clear pull toward action rather than panic. Picture a student aiming to complete a course. Without dates, she studies when she feels like it and discovers the size of the remaining work near the end. With the course broken into dated parts, she knows this month's portion, this week's portion and tonight's portion, and a missed evening is a small correctable matter instead of a crisis. Missing a deadline is information, not a verdict. Reset the date honestly, learn what the miss revealed, and keep going.", "I put a deadline on every goal, and I let the date pull me into action."], ["List Everything You Must Do", "Next, write down everything you can think of that you will have to do to reach the goal: skills to learn, people to meet, obstacles to remove and steps to take. Keep adding to the list as new items come to mind, until the path from here to the goal is fully visible on paper. Listing breaks the weight into pieces. Each piece is small enough to judge, cost and schedule, and some pieces turn out to be far easier than the imagination had made them. The list should be generous at first. Write the obvious steps and the awkward ones, the purchases, the phone calls, the permissions, the training, and the obstacles you would rather not name. An obstacle written down becomes a problem to solve. An obstacle left unspoken stays a fog that slows everything. For example, someone planning to start a part time business might list registering the name, pricing the service, finding the first customers, setting aside working hours, and learning simple bookkeeping. None of those items is the whole business, and that is the point. Seen whole, the goal intimidated him for a year. Seen as a list, it becomes a sequence of ordinary actions, each waiting for its turn.", "I list everything my goal will require of me, so the whole path stands in front of me."], ["Organise the List Into a Plan", "Take your list and arrange it twice: by sequence, what must come first, second and third, and by priority, what matters most and what matters least. A list organised this way becomes a real plan, a step by step track you can simply follow instead of improvising every day. Sequence respects reality. Priority respects value. Among the steps that could be done now, some carry the goal forward far more than others, and those deserve the earliest and freshest hours. Together the two arrangements answer the two questions that stall most people each morning: what comes next, and what matters most. Improvising those answers daily consumes the very energy the work needs. Consider a family preparing to move house. The unorganised list mixes packing, giving notice, booking transport and changing addresses into one anxious pile. Arranged by sequence, notice comes before the final packing, and transport is booked before boxes are sealed. Arranged by priority, the documents and essentials are secured before decorative items are wrapped. The move is still work, but it is work on rails. That is what a plan gives any goal: the relief of following an order you have already thought through, instead of deciding everything again under pressure.", "I organise my list by sequence and by priority, and I work the plan in order."], ["Take Action Immediately", "Once the plan exists, act on it at once, even with one small step. Momentum matters more than perfection at the start, and a modest plan carried out with energy will beat a brilliant plan that never leaves the page. Waiting for the perfect moment is one of the quietest ways a plan dies. Conditions rarely announce themselves as ideal, and confidence does not usually arrive before action. It arrives because of action, once you have evidence that you are a person who begins. Its size matters less than its timing, because a step taken today keeps the plan in the world of facts, while a step postponed until tomorrow trains you in postponement. Imagine two people with the same sound plan to improve their qualifications. One waits for a quieter month that never comes and rereads the plan with growing guilt. The other enrols the same evening, badly timed and slightly nervous, and rearranges life around the commitment she has actually made. A year later the difference between them is not intelligence or planning skill. It is that one plan was acted on at once and gathered momentum, feedback and allies, while the other remained an excellent document about a future that never started.", "I take the first step on my plan today, because action turns a plan into a result."], ["Do Something Every Day", "The final step is to do at least one thing every single day that moves you toward your major goal, with no days off and no exceptions. Daily movement builds momentum, keeps the goal alive in your mind, and quietly compounds into large results over a year. The daily action does not have to be large. A day of movement keeps the goal warm in your thinking overnight, so you notice relevant ideas, people and openings that a cooled goal would never have brought to your attention. Daily action also protects you from the all or nothing trap. People who work in occasional bursts must restart from cold each time, spending their best energy on beginning again. The daily worker is always already moving, so even a modest day adds distance. Consider someone learning a language for work. Twenty focused minutes every day, reviewing words at breakfast and listening on the journey, will carry him further in a year than a heroic monthly session followed by weeks of nothing. Multiply that pattern across a qualification, a savings goal or a business being built in the evenings. Small daily steps look unimpressive in any single week. Compounded without a break, they become the results other people call sudden.", "I do something every day that moves me toward my main goal, and I never miss a day."], ["Choose Your Major Definite Purpose", "Among all your goals there is usually one that matters above the rest, the goal whose achievement would help every other area of your life at the same time. Goals! calls you to name that one goal clearly, make it your central focus, and let lesser goals wait their turn behind it. This is not a call to neglect the rest of life. It is a recognition that energy is limited and that some achievements unlock others. Choosing it requires honesty about leverage rather than excitement about novelty. The loudest goal is not always the central one, and the most enjoyable goal is not always the one your life is waiting for. Picture a man whose central problem is an unfinished qualification. It limits his work, his income and his confidence, and it shadows his family plans. Many smaller goals compete for his evenings, each pleasant in itself. Naming the qualification as his major definite purpose does not delete the others. It sequences them. His best hours go to study first, and the smaller goals take what remains, in their proper place. When the qualification falls, the whole row of waiting goals moves at once, which is exactly the mark of a rightly chosen purpose.", "I name my one major goal, and I give it the first claim on my time and energy."], ["Rewrite Your Goals Every Morning", "Tracy teaches a daily discipline: keep a notebook, and each morning rewrite your ten most important goals from memory, in the present tense, in positive words, and in the first person, as though they were already true. Every part of the method does work. Writing from memory forces the goals to live in you, not just in the notebook, because what you cannot recall has not yet become truly yours. The present tense presents the goal to your mind as a direction already taken rather than a distant hope. Positive words state what you are moving toward instead of rehearsing what you fear. The first person makes it personal and owned, nobody else's assignment. Ten goals keep the exercise balanced across the areas of a whole life, not narrowed to money alone. Imagine the first mornings of this practice. The list comes out ragged, some goals embarrassingly vague, one or two forgotten entirely. By the third week the wording steadies, a goal that was borrowed from other people's expectations quietly disappears, and the genuine ones return daily with clearer shape. Nothing magical has happened. A mind given the same clear instructions every morning simply begins organising its days around them, and organisation, repeated, becomes achievement.", "I rewrite my ten goals from memory every morning, in the present tense, as if they are already mine."]]}, {"title": "Eat That Frog", "intro": "From his best known book: if the first thing you do each day is your hardest and most important task, the whole day bends the right way. His 21 ways, condensed to their working core.", "cards": [["Eat Your Frog First", "Your frog is your biggest, hardest and most important task, the one you are most likely to delay and the one that would do you the most good if finished. If you tackle that task first each morning, the rest of the day already feels lighter, because the worst is behind you and momentum is with you. The frog is rarely mysterious. Leaving it does not make the day easier. It taxes every other hour, because part of your attention stays behind, rehearsing excuses and dreading the moment still to come. Eating it first reverses the tax. The hard thing is done while your energy is highest, and every smaller task afterwards feels smaller by comparison. Consider an office worker who must tell a client that a delivery will be late. The call takes ten minutes, but avoided, it shadows two days, spoils her concentration on other work, and grows more frightening with each hour of delay. Made first, the call is uncomfortable and finished by nine, the client can plan around the truth, and she works the rest of the day unburdened. That is the whole practice: identify the frog honestly each morning, and eat it before the day talks you out of it.", "I start my day with my biggest and most important task, before anything smaller gets my best hours."], ["Set the Table", "Before you can choose your frog, you must be clear about what you want in each area of your life and what steps will get you there. Sitting down and deciding this on paper, before the day begins, is what separates people who merely react from people who direct their own work. Setting the table means laying everything out where you can see it: the goal, the steps, the order and the cost, all decided in the calm before activity starts. Without that clarity, every urgent demand looks equally important, and the day gets allocated by whoever shouts loudest or whatever arrives first. With it, you can recognise your frog at sight, because you already know what your work is for. Reaction is not laziness. Direction feels different. The directed person may work fewer frantic hours, but each hour points at a chosen outcome, and the day adds up to something by evening. Picture a tradesman before a job. The reactive one loads the van with whatever is near the door and makes three trips back for forgotten tools. The one who set the table checked the job, listed the materials and loaded once. Do the deciding on paper first, and the doing becomes strangely simpler.", "I get clear about what I want before I begin, and I put it on paper."], ["Plan Every Day in Advance", "Make your list for tomorrow tonight, and think on paper rather than trying to hold the day in your head. A few minutes of planning saves far more minutes in execution, and while you sleep your mind quietly works on the list you have written. The evening list works for practical reasons. In the morning you wake to decisions already made, so your freshest energy goes into doing instead of deliberating. Items forgotten are rare, because they were captured while the day that revealed them was still in memory. Thinking on paper beats thinking in circles. A day held in the head must be rehearsed constantly to survive, and every rehearsal costs attention that the tasks themselves needed. On paper, the day can be arranged, weighed and corrected once, then simply followed. Imagine a nurse finishing a demanding shift. Ten minutes listing tomorrow's duties, calls and errands before bed feels like extra work. The next day repays it repeatedly: no return trips, no missed calls, no midday scramble to remember what mattered. Ten planned minutes regularly save an hour of friction, and they return something better than time. They return the calm of a day that was chosen rather than stumbled into.", "I plan tomorrow before today ends, and I work from a written list."], ["Apply the 80/20 Rule to Everything", "In most work, a small share of your activities, about a fifth, produces the great bulk of your results, while the rest produces very little. The rule is uncomfortable because it refuses to honour busyness. A full diary can still be a poor diary if the full hours are the wrong hours. Tracy's counsel is to audit your activities by their fruit, not by how long they have been in your routine or how satisfying they feel. Some long standing tasks produce almost nothing. Some brief ones, done consistently, produce most of your income, reputation or progress. Think of a salesperson whose week divides between preparing proposals, visiting customers, and reorganising files that are already orderly. The visits and proposals bring nearly all the revenue. The filing brings a feeling of control and almost no result. Applying the rule does not mean the files are never touched. It means they are touched last, briefly, and never with the morning energy that belongs to customers. Find your vital fifth by watching results honestly for a few weeks. Then defend it. The trivial many will always volunteer to fill your day, and only deliberate choice keeps them from crowding out the few activities your success actually depends on.", "I find the few activities that produce most of my results, and I feed them my best time."], ["Consider the Consequences", "The mark of a strong thinker is weighing what will follow, long term, from doing or not doing a task. Tasks with serious long term consequences are your true priorities, however quiet they seem today, while tasks with no lasting consequences can wait, however loudly they shout. Urgency is a poor measure of importance. A ringing phone is urgent and usually trivial, while the qualification that would change your income for twenty years makes no noise at all and can be postponed daily without any immediate penalty. Considering consequences means asking, before you allocate an hour, what this hour builds or costs across months and years. It also means asking the question in reverse: what happens if this is never done? Some tasks, left undone, quietly close doors. Others, left undone, are simply never missed. Picture a manager choosing between clearing a backlog of minor messages and preparing the training that would make her whole team faster. The messages feel pressing and give quick satisfaction as they disappear. The training pays for years. Strong thinkers feel the pull of the immediate and choose by the consequence instead, putting first what the future will thank them for, and letting loud, weightless tasks wait their proper turn.", "I judge every task by its long term consequences, and I put those first."], ["Practise Creative Procrastination", "Since you cannot do everything, you must deliberately postpone, delegate or drop the tasks of low value in order to protect time for the few that truly count. Everyone already practises procrastination. The only question is whether it is practised blindly or creatively. Blind procrastination delays the important and difficult tasks while filling the day with easy ones, and it produces guilt along with poor results. Creative procrastination reverses the order. You look at your list with clear eyes, identify the low value tasks honestly, and decide in advance that they will wait, go to someone else, or go entirely. The guilt disappears, because the delay is now a decision rather than a failure. Consider a father building a business in the evenings. He cannot attend every meeting, answer every message instantly, and maintain every commitment he is offered. Deliberately postponing the committee work that adds little, and letting some requests go unanswered until the weekend, protects the hours his main work needs. He is not doing less that matters. He is doing more of it, by refusing to pretend that everything matters equally. Time is protected by what you decline as much as by what you schedule, so decline on purpose.", "I deliberately delay low value tasks so my best hours stay free for what counts."], ["Use the ABCDE Method Continually", "Before starting, mark every item on your list: A for must do, with serious consequences if left undone; B for should do, with mild consequences; C for nice to do, with no real consequences; D for delegate to someone else; and E for eliminate altogether. Then never touch a B while an A remains, and work your A items in order, starting with the biggest. The method works because it forces the consequence question before work begins, while you are still calm enough to answer it honestly. Without labels, the list is flat, and flat lists get worked by mood, by ease or by whoever asks most recently. With labels, the day has a spine. Your A items are few, usually, and they are the frogs: the tasks where delay costs something real. C items are comfort work. D items free your hours for work only you can do. E items are the honest confession that some tasks should never be done at all. Picture a morning list of twelve items marked this way. Two are A, and the larger A is a proposal due today. Discipline here is mostly refusing the small daily temptation to warm up on easy tasks while the consequential ones wait.", "I label my tasks A to E by their consequences, and I never start a B while an A is waiting."], ["Focus on Key Result Areas", "Every job has a handful of result areas where you absolutely must perform well for the job to be done at all, and weakness in any one of them can hold back your whole career. Identify your own key result areas honestly, grade yourself in each, and strengthen the weakest first. Key result areas are not everything you do. A teacher's areas include explaining clearly and assessing fairly. A shop manager's include stock, staff and customers. Outside these areas, excellence is decoration. Inside them, weakness is a ceiling, because the job cannot be called well done while one of its essential results is failing. Grading yourself honestly is the hard part. Most people grade by effort or intention, and rate themselves kindly. Grade by results instead, area by area, and the weakest one usually identifies itself plainly. That weakest area deserves your learning first, because raising it raises the value of all your stronger areas with it. Imagine a skilled craftsman who is excellent with his hands but poor at returning calls and keeping appointments. Work he would have won goes elsewhere, and his craft never gets the chance to speak. His key result area is not more craft. It is reliability, and strengthening it unlocks everything he already does well.", "I know the results my work is truly judged by, and I strengthen my weakest area first."], ["Apply the Law of Three", "Of everything you do at work, only about three main tasks account for the great majority, around ninety percent, of the value you contribute. Find those three, in your job and in each project, and pour your time into them before anything else claims your day. The Law of Three is a focusing instrument. It assumes your list contains many legitimate tasks competing for the same hours, and it asks which three, done excellently and consistently, would make most of the others almost incidental. Those three differ by role. For one person they are producing the work itself, serving the customers who pay for it, and developing the skill that keeps it excellent. For another they are planning, supervising and solving the problems only she can solve. The test is contribution, not activity. Consider a project with twenty open items. Three of them, agreeing the design, securing the main material and finishing the central build, carry nearly all the value. The remaining items are real but minor, and they will still be there, manageable, after the three are moving. People who find their three early stop spreading themselves across twenty fronts. They concentrate force where the value lives, and their results grow faster than their hours.", "I identify my three highest value tasks, and I do them first and most."], ["The Law of Forced Efficiency", "There is never enough time to do everything on your list, but there is always enough time to do the most important thing, and that fact forces a healthy discipline. The pretence is expensive. It keeps every task half alive, spreads guilt evenly across the whole list, and lets the most important work wait politely behind a crowd of smaller claims. Forced efficiency names the real situation: time is limited, the list is not, and choice is therefore not optional. The only freedom available is choosing deliberately instead of letting the day choose for you. Once that is accepted, the question of the day becomes clean and answerable: what is the most valuable use of my time right now? Asked regularly, that question cuts through clutter better than any system. Suppose a worker has four hours and nine tasks. Pretending all nine will fit produces rushing, shallow work and a late finish on the one task that mattered. Accepting the limit, she completes the two tasks of real consequence properly, delegates one, and consciously postpones the rest without guilt. Nothing about her hours changed. What changed was the honesty with which they were spent, and that honesty is the discipline this law is really teaching.", "I accept that I cannot do everything, and I make sure the most important thing always gets done."], ["Prepare Thoroughly Before You Begin", "Gather everything you will need, information, tools, materials and a clear workspace, before you start the task. Thorough preparation removes the small stops and searches that break concentration, so once you begin you can keep moving until the work is finished. Concentration is fragile at the start of a task. Each interruption to hunt for a document, charge a device or find a tool gives the mind an excuse to wander, and many tasks are abandoned at exactly these small fences rather than at any real difficulty. Preparation clears the fences in advance. You lay out the files in order, check the tools, put water within reach, clear the surface, and silence what can wait. Then starting becomes a single clean movement instead of a negotiation repeated six times. Knowledge work obeys the same law. Imagine writing a report. Prepared properly, the figures, notes and previous examples sit beside you, and two focused hours produce the draft. Unprepared, the same two hours leak away in searches, messages and trips across the room, and the report is still a fragment at the end. Preparation looks like delay to impatient people. It is the opposite. It is the part of the work that makes the rest of the work fast.", "I lay out everything I need before I start, so nothing interrupts me once I am moving."], ["Take It One Step at a Time", "Even the largest and most complicated job is finished the same way a long row of barrels is crossed, one at a time. Break the work into single steps, take the first one, then the next, and the size of the whole stops frightening you because your eyes are only on the step in front of you. Think of a traveller crossing by markers placed across a desert. He never has to contemplate the whole desert at once. He only has to reach the next marker, rest, and look for the one after it. Large work intimidates in exactly the way the whole desert intimidates: seen entire, it exceeds what the mind believes it can hold, so the mind avoids starting at all. Divided into steps, the same work becomes a series of tasks each small enough to begin without argument. Finishing one step also does quiet psychological work. It proves the project can move, and it shows you the next step more clearly than planning from a distance ever could. Consider someone facing a house renovation with forty interlocking jobs. Overwhelmed as a whole, it becomes manageable as a sequence: clear the room, repair the wall, then paint. One step, honestly taken, then the next. That is how big things have always been finished.", "I break big work into single steps, and I take them one at a time without stopping."], ["Slice, Dice and Single Handle", "Cut a large task into small slices, or gather its pieces into one large protected block of time, and then handle that one task from start to finish without wandering to others. Working on a single task through to completion, with a real sense of urgency, finishes it far faster than touching many tasks lightly. Slicing and single handling are partners. Slicing makes a task small enough to start, because a thin first slice, one section, one page, one call, asks little courage. Single handling then keeps you with the task once started, refusing the habit of opening five jobs and advancing none. Protected time is what makes single handling possible in a real day. You set a block, close the door on interruptions as far as your duties allow, and let the task have the whole block. Urgency within the block is deliberate: you work as though the deadline were close, because pace prevents the drift that fills unguarded hours. Picture a writer with a long document to finish. Sliced, it is one section this morning. Single handled, the phone stays off and no messages are opened until the section is done. By lunch she holds finished work instead of five beginnings, and finished work is what builds a reputation and a life.", "I cut big tasks into slices, protect a block of time, and finish one task fully before touching the next."]]}, {"title": "Maximum Achievement and Self Discipline", "intro": "From No Excuses!: self discipline is the master key that makes every other principle work. Responsibility, delayed gratification, and paying the price in advance.", "cards": [["Self Discipline Is the Master Key", "Self discipline is the ability to make yourself do what you know you should do, when you should do it, whether you feel like it or not, and Tracy treats it as the quality that makes all other qualities useful. Talent and knowledge stay dormant without it; with it, an ordinary person can outrun a gifted one. Feelings are weather. They change by the hour, and a life steered by them changes direction just as often. Self discipline installs a steadier authority: the decision you made when you were thinking clearly outranks the mood you happen to be in when the work comes due. That is why Tracy calls it the master key. Goals need it to survive their second week. Skills need it to be practised past the clumsy stage. Health, savings and family commitments all need it in their ordinary, unglamorous moments. Consider two equally capable people starting the same course of study. The gifted one studies when enthusiasm visits and stops when it leaves, which it reliably does. By the examination, the comparison is no longer close. Nothing mysterious happened. One person had a key that opened every door he approached, and the other kept waiting to feel like turning his.", "I build self discipline daily, because it is the key that unlocks every other strength I have."], ["Take Full Responsibility", "The turning point in a life comes when a person stops blaming and starts accepting complete responsibility for where they are and what happens next. Responsibility and self control grow together: the more you own your choices, the more power you feel over your future. Blame feels accurate because it usually contains some truth. Other people do fail us, conditions are genuinely unfair at times, and the past did real damage. But blame as a residence is a trap, because it locates the power to change your life in the hands of the very people and events you cannot control. Responsibility takes the same facts and asks a different question: given all of this, what is mine to do now? That question restores movement. The responsible person does not pretend the obstacle is his fault. He simply refuses to make the obstacle his excuse, and he treats his response as his own property in every circumstance. Imagine an employee passed over for promotion. Blame settles on the manager and hardens into resentment that poisons the next year of work. Responsibility asks what skills, visibility or results were missing, and sets about building them, here or elsewhere. Accept responsibility fully, and the future comes back into your own hands.", "I accept full responsibility for my life, my results and my next move, with no exceptions."], ["No Blame, No Excuses, No Complaining", "Blame, excuses and complaining feel like relief, but they hand your power to whatever you are blaming and keep you exactly where you are. The relief these habits offer is real but brief, and it is bought at a high price. A complaint discharges the tension that might have powered a solution. An excuse settles the discomfort of a missed standard without raising the standard or the effort. Blame lets you leave the scene of a problem feeling innocent and unchanged. Repeated daily, the three habits build a character that explains life instead of directing it. Replacing them is practical work, not positive decoration. When the complaint forms, you ask what you will do about the matter. When the excuse forms, you state the plain fact and the next step. The replacement will feel less satisfying at first, because action is less comfortable than commentary. It pays better by the week. Picture a team where a delivery fails. One member spends the meeting establishing whose fault it was, and leaves with clean hands and the same failing process. Another spends it deciding what changes tomorrow, and leaves with the problem smaller. Both felt the same frustration. Only one of them spent it on something that could help.", "I refuse blame, excuses and complaining, and I answer every problem with a decision and an action."], ["Delay Gratification", "The ability to wait for a greater reward later, instead of grabbing a smaller pleasure now, sits underneath saving, studying, health and every long achievement. Each act of patient waiting strengthens the same muscle, and that muscle quietly decides how far a person rises. Almost every worthwhile outcome is priced in delayed rewards. The qualification pays after the terms of study. The savings pay after the months of deposits. The healthy body pays after the repeated ordinary choices that nobody applauds. Delayed gratification is not misery or denial for its own sake. It is an exchange made with open eyes, present pleasure weighed honestly against a larger future good, and the future chosen on purpose. Like any muscle, it strengthens with use and weakens with indulgence, so small waits train you for large ones. Consider a worker deciding between spending a bonus and funding the course that would raise his income for years. The spending delights for a weekend. The course, delayed and unglamorous, keeps paying long after the weekend is forgotten. He will face that same choice, in different clothing, hundreds of times. Tracy's point is that the habit he builds in the small versions decides what he does in the large ones, and therefore decides his altitude.", "I gladly trade small pleasures now for greater rewards later."], ["Think Long Term", "Successful people habitually think far ahead, asking how today's choices will look in five or ten years, while struggling people think mostly about immediate comfort. Long term thinking improves every short term decision, because it gives today's sacrifices a clear and worthy reason. The time horizon you think in quietly governs everything beneath it. A person thinking in hours asks what is easiest now. A person thinking in years asks what this builds, what it costs later, and whether the person he will be in a decade would thank him for it. Both may work equally hard today. Their todays are simply aimed at different futures. Long term thinking also changes how setbacks are read. A difficulty inside a ten year plan is weather on a journey. The same difficulty inside a day sized plan feels like the whole story ending. Perspective is a practical asset, not a philosophy. Imagine two workers offered overtime money. One, thinking short term, spends each extra payment as it arrives and is in the same position after five years of extra hours. The hours were identical. The horizon was not, and the horizon is a habit of thought that can be practised deliberately, one decision at a time.", "I judge today’s choices by where they will put me in ten years."], ["Pay the Price in Advance", "There is a price attached to every worthwhile goal, and it must be paid in full and in advance, in effort, time and discipline, before the reward arrives. People who look for results first and payment later stay disappointed; the order of the universe is work first, harvest second. This teaching removes a common misunderstanding. Many people are willing to pay the price of a goal once success looks certain, the way a customer pays after receiving goods. Achievement does not trade on those terms. You pay on the evidence of the pattern, trusting that causes produce effects, and the payment itself is what separates serious people from interested people. Interest attends when convenient. Commitment pays in advance, in full, including the unglamorous instalments. Consider a farmer and a dreamer standing over the same field. The dreamer waits to feel certain of a harvest before troubling with seed. The farmer ploughs, plants and tends through a season in which the field gives him nothing back but work. Autumn answers them differently, and the difference was decided in spring. Whatever your field is, ask its price honestly, count it without bargaining, and pay it ahead of the reward. That order cannot be renegotiated, but it can be trusted.", "I pay the full price for my goals gladly and in advance, and I do not ask for the harvest before the work."], ["Discipline Builds Character", "Every time you do the right thing when it is hard, you are not only finishing a task, you are building the kind of person others can trust and you can respect. Character is not a gift you are born with; it is a structure you raise, one kept decision at a time. This reframes discipline completely. The point of keeping your word on a difficult morning is not only the work that gets done. It is the evidence you lay down, before your own eyes, about who you are. Self respect is built from exactly that evidence and from nothing else. A person cannot think himself into self respect while his recent actions argue the opposite. Each kept decision is a brick. Other people read the same structure. Trust is rarely given for talent or charm for long. It settles where a pattern of kept decisions has made it safe to settle. Imagine a small business owner who could quietly cut a corner on a job no customer would ever inspect. Doing it properly costs an hour nobody will know about. He pays the hour, not because the corner matters most, but because he does. That is character, and discipline is how it gets built.", "I keep my decisions especially when they are hard, because each one builds my character."], ["Discipline at Work: Work All the Time You Work", "In his chapter on self discipline and work, Tracy urges a simple standard: when you are at work, actually work, beginning with your most important tasks and refusing the friendly distractions that eat a day. Building a reputation as the person who gets the important things done is itself a career strategy. The friendly distractions are the dangerous ones because they arrive disguised as collegiality: the extended chat, the unnecessary meeting drift, the news and messages checked between every task. Working all the time you work reverses the pattern. The important tasks get the first and best attention. Conversation and diversion still have their place, at breaks and at lunch, but they stop feeding on working hours. The reputation that follows is worth understanding. Employers and customers promote and return to the person whose name is attached to finished, important work. That reputation compounds like interest, bringing better assignments and better pay, which bring better opportunities still. Picture two colleagues of equal ability. One is pleasant, available for every conversation, and known for being busy. The other is equally pleasant at break time and unreachable mid task, and known for delivering what matters. Over five years their careers separate, not through talent, but through where the working hours actually went.", "I work all the time I am at work, starting with what matters most, and I let my results build my reputation."], ["Persist and Show Courage", "Two chapters of No Excuses join persistence and courage together, because most goals are lost not to inability but to quitting, and most fears shrink only when faced. Courage here is a habit: do the feared thing in small, repeated acts, refuse to give up at the first resistance, and your confidence grows with every stand you take. The joining of the two qualities is important. Persistence without courage becomes merely enduring a life you are afraid to change. Courage without persistence becomes a single brave gesture that fades by next month. Fear rarely leaves before action. It leaves through action, because each faced fear gives your mind fresh evidence about your own capability, and evidence is what confidence is made of. Avoidance gives the opposite evidence and compounds just as reliably. Consider someone afraid of speaking in meetings. The large version, addressing the whole company, is beyond her today. The small version is one prepared sentence in a team meeting this week. Spoken, survived and repeated, the small acts widen what she can do until the larger room is only a bigger version of a familiar act. Persist in that pattern and refuse the first resistance as a verdict, and courage stops being a personality trait. It becomes your trained response.", "I face what I fear in small steady acts, and I persist until the work is finished."]]}, {"title": "Time and Focus", "intro": "From Focal Point: find the one point where your effort multiplies, simplify everything around it, and let small daily improvements compound into a different life.", "cards": [["Find Your Focal Point", "At any moment there is usually one thing you could focus on that would move a part of your life forward more than anything else you could do. Scattered effort feels generous and busy, but it divides a limited supply of attention into portions too small to move anything heavy. A focal point gathers the same attention into one place, the way focused light carries force that diffuse light never will. The one thing differs by area. In your work it might be the single project everything else waits on. In your health it might be sleep. In your family it might be one relationship needing unhurried time. The discipline is in the returning, because distractions will pull you off the point daily and sometimes hourly. Picture a gardener with one watering can and twenty beds. Spraying a little over all twenty leaves every bed thirsty. Watering the neediest beds deeply, in rotation, actually brings plants through the dry season. Your attention is that can. Each morning, ask where its full weight would do the most good today, aim it there first, and keep aiming it back each time the day scatters you. That repeated return, more than any single effort, is what a focal point means in practice.", "I find the one most important thing in front of me, and I give it my full focus."], ["Simplify Your Life on Purpose", "The first movement of the Focal Point Process is simplification: steadily removing the clutter of low value tasks, commitments and distractions that crowd out a clear life. A simpler life is not an emptier one; it is a life where what remains is what actually matters. Clutter in a schedule behaves like clutter in a room. Everything retained must be stored, maintained, remembered and stepped around, so even worthless commitments charge rent in attention. Most clutter was not chosen in any serious sense. Simplification audits the accumulation honestly. Each item is asked what it contributes, and the ones with poor answers are removed, delegated, shortened or allowed to end. What remains gets more room to breathe and more of your best energy. Imagine a desk and a diary cleared in the same week. Half the objects leave the desk, and the three surviving ones are the tools of real work. Three standing commitments leave the diary, and the surviving ones finally get preparation and presence instead of apology and haste. Nothing of value was lost in either clearing. Space was found where value had been suffocating, and that is why Tracy begins the whole process here. Before you multiply your effort, stop spending it on what should not be carried at all.", "I simplify my work and my days, removing what adds little so what matters gets more."], ["Practise Zero Based Thinking", "Regularly hold each activity, commitment and expense up to one honest question: knowing what you now know, would you start this again today if you were not already doing it? This is zero based thinking, and its power is that it separates the past from the decision. Money and time already spent are gone whether you continue or not, so they deserve no vote. The only honest comparison is between continuing from today and starting something better from today. People resist the question because a no answer admits an earlier error. Tracy's point is that refusing to admit it does not undo the error. It finances it, month after month, with fresh time and fresh money. Applied gently and regularly, the question keeps a life current. Products a business still sells from habit, meetings that outlived their purpose, courses of spending nobody would choose afresh, all surface quickly under it. Consider a shop owner reviewing a product line that barely sells and consumes shelf space, ordering time and temper. Knowing what he now knows, he would never stock it today. That answer settles the matter: sell through, step out, and give the space to what customers actually want. The past purchase was tuition. Continuing it would just be paying the fee twice.", "I ask of everything I do whether I would start it again today, and I act on the answer."], ["Leverage What Others Have Built", "Focal Point teaches leverage as the second movement: using other people's knowledge, energy, ideas, contacts and even their successes and failures, instead of paying full price in your own time for every lesson. One good idea borrowed at the right moment can be worth years of your own labour. A mentor's single correction can remove a fault you would have practised for a decade. A colleague's contact can open a door you would have knocked on for a year. Another person's failure, studied honestly, is a lesson delivered to you at no cost in your own losses. None of this is using people. Done fairly, leverage blesses both sides, because knowledge shared is not knowledge lost, and Tracy's teaching sits inside honest exchange: learn openly, credit properly, and contribute your own hard won lessons back. Imagine a young manager struggling with a scheduling problem that eats her Fridays. A veteran manager solved the same problem years ago and shows her the pattern in twenty minutes. She has just bought back weeks of Fridays with one humble conversation. The proud route, inventing everything alone, would have cost the same Fridays and taught the same lesson. Leverage is simply refusing to pay twice for what the world has already learned.", "I borrow the knowledge, ideas and hard won lessons of others, and I let them multiply my own effort."], ["Accelerate and Multiply Through People", "The remaining movements of the Focal Point Process are acceleration, finding ways to reach your goals faster by concentrating on what gives the greatest return, and multiplication, building a team of people whose strengths complement yours. You move further and faster when the right people are rowing with you than you ever will alone. Acceleration is not hurry. Hurry spreads effort thinner and produces haste and error. Acceleration concentrates effort on the highest return activities and removes the delays around them, so the same energy produces a result sooner. Multiplication then extends what one person can carry. A team chosen for complementary strengths covers your weaknesses, challenges your blind spots and keeps working in areas where you personally have no hours left. The two movements belong together. Speed without people quickly reaches the limit of one pair of hands. People without focus multiply confusion instead of results. Picture a skilled builder whose business is himself, his tools and an endless queue. Every job waits for his personal attention, so good customers drift away. The same business now completes more work, sooner, with less strain on its owner. He did not discover extra hours in the day. He accelerated what mattered and multiplied himself through the right people.", "I concentrate on my highest return work, and I build a team whose strengths multiply mine."], ["The 1,000 Percent Formula", "If you improve your performance by only a tenth of one percent each working day, that tiny gain compounds to roughly a quarter more each year, and to about ten times better over a decade. Great change rarely arrives in one leap; it arrives as small daily improvements that nobody can stop because nobody notices them happening. The formula is encouraging precisely because the daily demand is so small. A tenth of one percent asks for almost nothing: one slightly better preparation, one cleaner system, one small fault corrected and never repeated. Anyone can manage today's instalment, which means anyone can stay on the path, and staying on the path is the entire secret. Compounding does the heavy lifting that willpower cannot. The reverse also compounds, which is the sober side of the same law: small daily neglects accumulate into large decline with the same quiet reliability. Imagine a typist adding a few correct words a minute each month, or a saver improving his deposit habit by a fraction at a time. Neither transformation photographs well at any single moment. Photographed across ten years, both are unrecognisable. Tracy's counsel is to stop waiting for the leap and start collecting the fraction, daily, because fractions faithfully collected become the leap.", "I improve a little every single day, and I trust small gains to compound into a transformed life."], ["The Law of Increasing Returns", "The more of your time you invest in the few activities that bring you the highest value, the better and more efficient you become at those very activities, so each hour begins to return more than the last. Focus does not just add results; it multiplies the return on every future hour. The scattered worker not only produces less today; he also prevents the deepening of skill that would have made his future hours worth more. Practice concentrated in one valuable activity builds speed, judgement and pattern recognition. You begin to see the shortcut that is honest, anticipate the problem before it arrives, and finish in an hour what once took three. The return on your time has genuinely increased, not because the clock changed, but because you did. The implication for choosing work is direct. Picture a writer who protects her mornings for writing alone. In the first year the pages come slowly. By the third year the same morning hours produce twice the finished work at higher quality, because thousands of focused repetitions have sharpened every part of the craft. That rising return then funds everything else in her working life. Invest where value and growth meet, and time itself becomes your ally.", "I pour my hours into my highest value activities, knowing each hour there returns more than the one before."], ["Do More of What Pays the Most", "Focal Point aims at doubling what your time earns you, and the honest path is value, not mere busyness: id
