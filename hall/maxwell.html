thout announcement, until generosity becomes a habit of thought and not only of behavior. Maxwell presents unselfish thinking as deeply fulfilling, because a life spent thinking about others escapes the smallness of a life spent monitoring only itself. Leaders who think unselfishly are trusted with more, because people sense that being led by them will not cost them their own good.", "I will train my mind to consider others first in every plan, and I will look for ways to add value without announcement."], ["Bottom Line Thinking", "Bottom line thinking means staying focused on the intended result so that effort produces maximum return instead of impressive activity. Maxwell closes the eleven skills here because thinking that never reaches outcomes is only entertainment. The bottom line thinker begins by defining what success actually is in a matter, the real outcome that all the work exists to produce, and then measures plans and progress against that definition. This protects against a common failure, winning at activities that do not matter while losing at the result that does. Maxwell notes that the bottom line differs by arena. In business it may be profit, in ministry people changed, in family the health of relationships, and confusing those measures corrupts decisions. Clarity about the bottom line also gives courage to stop doing good things that do not serve the result, which is often harder than stopping obviously wasteful things. Bottom line thinking works with the other ten skills rather than replacing them. Big picture, creativity, strategy, and shared thinking all become sharper when everyone knows the outcome they are thinking toward. A leader who thinks this way can explain simply why the team does what it does, and simple explanations under pressure are worth a great deal.", "I will define the real result before I work, measure my effort against it, and stop good activities that do not serve it."]]}, {"title": "Leadershift", "intro": "In Leadershift, Maxwell teaches that every advance in leadership requires a shift in how a person thinks, acts, and leads. He names eleven essential changes, from the Focus Shift to the calling shift, that a leader must embrace to keep growing in a changing world.", "cards": [["Soloist to Conductor", "The Focus Shift in Leadershift moves a leader from soloist to conductor. A soloist depends on personal talent, doing the important work personally and measuring worth by individual performance. Maxwell teaches that this works at a small scale and fails at a large one, because significant accomplishments always depend on the actions of many people. A conductor does less of the playing and far more of the drawing out, coordinating the strengths of others so that the whole produces what no single performer could. This shift changes what a leader values. The soloist wants to be the star of the work. The conductor wants the work itself to shine, and finds satisfaction in the success of people he has positioned, prepared, and released. It also changes how time is spent, away from personal production and toward planning, developing, and aligning others. Many talented people stall here, because conducting feels less visible than performing and the applause is shared. Maxwell insists the shift is unavoidable for anyone whose dream is bigger than his own two hands. The leader who will not make it becomes the ceiling of his own organization, surrounded by capable people who were never truly led, only watched.", "I will stop measuring myself by my own performance and start drawing out the coordinated strengths of my whole team."], ["Goals to Growth", "The Personal Development Shift in Leadershift moves a leader from goals to growth. Maxwell does not dismiss goals, which give direction and deadlines, but he teaches that a life organized only around achieving goals eventually empties, because each finish line must be replaced by another or motivation dies. Growth is different. Growth is about becoming, and becoming has no finish line. The leader who shifts to growth values who he is turning into above what he is checking off, and treats goals as servants of that larger process. Maxwell observes that goals help a person do better while growth helps a person become better, and becoming better eventually improves everything the person does. This shift also changes failure. A missed goal is only a loss to the goal driven mind, but to the growth mind it is material, carrying lessons that make the next season stronger. Practically, the shift means building daily growth habits, reading, reflecting, being mentored, attempting new things, that continue whether or not a campaign is running. Leaders who keep growing stay useful in changing conditions, because their capacity is still expanding while the merely goal driven leader defends achievements from a season that has already passed.", "I will value who I am becoming above what I am checking off, and I will keep my daily growth habits running in every season."], ["Perks to Price", "The Cost Shift in Leadershift moves a leader from perks to price. Maxwell begins by observing that many people want leadership for the wrong reasons, the title, the office, the income, the deference of others. Such leaders think first about what leadership will give them. The shift is to think first about what leadership will cost, and to pay that price willingly and repeatedly. Maxwell teaches that everything worthwhile sits on the far side of a price, and leadership price is paid in sacrifice, self discipline, unpopular decisions, and responsibility carried when things go wrong. A leader focused on perks will protect comfort and slowly lose the respect of followers, who always learn eventually whether the leader serves them or uses them. A leader focused on price gains a different authority, the moral weight of someone visibly paying more than he collects. This shift must be renewed, because the temptation to enjoy position while avoiding its cost returns at every level of success. Maxwell presents the price not as misery but as the honest exchange for influence that matters. Leaders who embrace the cost early travel further, because they are never surprised or embittered when leadership asks something of them again.", "I will think first about the price leadership asks of me and pay it willingly, instead of counting what leadership gives me."], ["Pleasing People to Challenging People", "The Relational Shift in Leadershift moves a leader from pleasing people to challenging people. Maxwell teaches that a leader who needs to be liked will eventually be controlled by the people he leads, softening truth, avoiding hard conversations, and trading the good of the team for personal comfort. Pleasing feels kind in the moment and is often unkind in the outcome, because people are left unchallenged in the very habits that limit them. Challenging people, rightly done, is an act of belief. It says that you see more in a person than their present performance and you respect them too much to leave them where they are. Maxwell is careful that challenge must ride on relationship and genuine care, delivered for the person good and the mission good, never to display power. He also notes that you cannot lead people if you need them, since need makes honesty too expensive. Leaders who make this shift lose some easy popularity and gain something better, followers who grow, trust that survives disagreement, and a culture where standards are real. The people who matter most usually thank the challenger later, once the growth he demanded has become strength they now own.", "I will care for people enough to challenge them toward their best, instead of pleasing them into staying small."], ["Maintaining to Creating", "The Abundance Shift in Leadershift moves a leader from maintaining to creating. Maintaining is the mindset of protecting what exists, holding position, avoiding loss, and keeping the machinery of yesterday running. Maxwell teaches that maintenance feels responsible and quietly leads to decline, because the world a leader maintains in is itself moving, so standing still is falling behind at the speed of change. Creating is the opposite posture. The creator assumes there is more, more possibility, more resource, more future than the present arrangement shows, and works to bring new value into being. This is why Maxwell calls it the Abundance Shift. Scarcity thinking maintains and hoards. Abundance thinking creates and releases. Making the shift requires leaving comfort zones regularly, attempting things without guaranteed outcomes, and tolerating the messiness of beginnings instead of the tidiness of routines. It also requires energy management, since creating costs more than maintaining and must be fueled on purpose. Leaders who keep creating stay alive inside their own work, and their teams feel it. People rarely give their best merely to preserve something. They give their best to build something, and a creating leader always has something worth building in front of them.", "I will leave the safety of maintaining and put my energy into creating new value, trusting that there is more ahead."], ["Ladder Climbing to Ladder Building", "The Reproduction Shift in Leadershift moves a leader from ladder climbing to ladder building. Ladder climbing is the familiar ambition to rise personally, position by position, proving competence and collecting success. Maxwell does not condemn the climb, since a leader must first succeed personally to have anything to give. He teaches that maturity arrives when the leader turns around on the ladder and starts building ladders for others, helping people find their own path up instead of guarding his. Ladder builders measure success by how many people rise because of them. They mentor deliberately, share what the climb taught them, open doors, and sometimes lend their own credibility so a developing leader can take a step that would otherwise be refused. This shift cures the loneliness and suspicion of pure climbing, because a builder is surrounded by grateful climbers rather than rivals. It also multiplies impact beyond one career. A climber legacy ends at his own highest rung. A builder legacy continues in every ladder still standing after he is gone. Maxwell presents this as central to real leadership, since the reproduction of leaders is the highest form of the work and the clearest sign that a leader has stopped leading only for himself.", "I will turn around on my own ladder and build ladders for others, measuring success by how many people rise because of me."], ["Directing to Connecting", "The Communication Shift in Leadershift moves a leader from directing to connecting. Directing is leadership by instruction, standing above people, announcing decisions, and expecting compliance. Maxwell teaches that directing may move tasks but rarely moves hearts, and in a changing world it increasingly fails even at tasks, because people give their best thinking only to leaders they feel connected with. Connecting leaders come alongside. They listen before they speak, ask questions before they give answers, and adapt their communication to the person in front of them instead of delivering one style to everyone. This shift changes the leader posture from authority to partnership without surrendering responsibility. The connecting leader still decides and still answers for outcomes, but he leads from within the relationship rather than from above it. Maxwell connects this shift with the wider theme of his connecting teaching, that influence travels across relational bridges and stalls where no bridge exists. Practically, it means slowing down enough to know people, explaining the why behind decisions, and inviting honest response before the decision hardens. Teams led this way bring problems earlier, offer ideas freely, and follow through difficulty with loyalty that no instruction, however clear, could ever command on its own.", "I will lead from beside my people, listening and asking before I direct, so my influence travels across real connection."], ["Team Uniformity to Team Diversity", "The Improvement Shift in Leadershift moves a leader from team uniformity to team diversity. Maxwell observes that insecure leaders gather people who think, act, and agree like themselves, because similarity feels comfortable and produces quick agreement. The cost is blindness. A uniform team shares the leader strengths and also his weaknesses, sees the same opportunities and misses the same dangers. Diversity in Maxwell teaching means welcoming different gifts, backgrounds, temperaments, and viewpoints onto the team and actually using the difference instead of merely displaying it. This makes leadership harder in the short run, since diverse people question more, process differently, and require a leader secure enough to be challenged without feeling threatened. It makes the team far stronger in the long run, because problems are examined from many sides and solutions improve under honest friction. Maxwell ties this shift to improvement deliberately. A team cannot improve past the limits of a single viewpoint, so widening the viewpoints widens the possible improvement. The leader role changes as well, from recruiting copies to orchestrating differences, drawing out what each distinct member sees that the others cannot. Leaders who make this shift trade the comfort of agreement for the power of completeness.", "I will welcome people who think differently from me onto my team and use their difference to make our work complete."], ["Positional Authority to Moral Authority", "The Influence Shift in Leadershift moves a leader from positional authority to moral authority. Positional authority comes with a title and lasts only as long as the title does. It can compel attendance and compliance, but it cannot compel trust, loyalty, or sacrifice. Moral authority is different. It is earned through consistent character, competence, courage, and care over time, until people follow because of who the leader is and not because of where he sits. Maxwell teaches that moral authority is the highest form of influence available to a leader, and the most durable, since it survives changes of position and even follows a leader into new settings. Building it is slow and losing it is fast, because a single serious compromise can spend in a day what years accumulated. Leaders who rely on position alone feel the ground weaken whenever circumstances shift. Leaders with moral authority can ask hard things of people and be trusted in the asking, because their record answers suspicion before it forms. This shift therefore changes daily priorities. Protecting character becomes strategic, not merely private, since the leader example is the foundation his influence actually stands on in every room.", "I will build moral authority through consistent character over time, so people follow who I am and not only where I sit."], ["Trained Leaders to Transformational Leaders", "This Leadershift moves a leader from developing trained leaders to developing transformational leaders. Maxwell distinguishes training, which transfers skill and knowledge, from transformation, which changes the person inwardly so that new thinking, values, and identity produce new behavior naturally. A trained leader can perform the tasks of leadership. A transformational leader changes environments, because transformed people transform the rooms, teams, and cultures they enter. Maxwell teaches that organizations do not change until people change, so a leader who only trains skills will keep repairing the same culture forever. Developing transformational leaders requires deeper investment, mentoring character and worldview over time, modeling the change personally, and creating experiences that expose and reshape what a developing leader believes. It also requires patience, since transformation is slower than training and cannot be scheduled like a course. The reward is leaders who do not merely reproduce techniques but reproduce life, carrying change into places the original leader will never go. Maxwell presents this as the difference between leaders who maintain improvement and leaders who start movements. In a world needing more than management, the leader who learns to develop transformed people holds the greater and rarer gift, and his influence keeps working long after instruction is forgotten.", "I will invest in transforming people inwardly, not only training their skills, so they change every room they enter."], ["Career to Calling", "The final Leadershift moves a leader from career to calling. A career is about advancement, what a person does for position, income, and recognition, and it ends at retirement or whenever the rewards stop justifying the effort. A calling is larger. Maxwell describes it as the work a person was made for, where gifts, passion, and purpose meet so deeply that the work would still matter if nobody promoted it and nobody applauded it. Leaders who make this shift gain unusual endurance, because their reason for continuing does not depend on circumstances staying favorable. They also gain clarity, since calling acts as a filter for opportunities, welcoming what fits the purpose and declining what merely flatters the ambition. Maxwell teaches that calling is discovered over time, often through the very work once treated as a career, as a person notices where lasting significance keeps appearing. This shift also lifts leadership above self interest permanently. A career leader asks what the work gives him. A called leader asks what the work gives through him, and that question sustains sacrifice without bitterness. Maxwell closes the eleven shifts here, at the deepest change of all, the change of why a leader leads.", "I will treat my work as a calling and not only a career, and I will let purpose filter every opportunity offered to me."]]}, {"title": "The 360 Degree Leader: Leading Up and Across", "intro": "In The 360 Degree Leader, Maxwell teaches that most leadership happens from the middle, and that a leader in the middle can influence in every direction. These are the nine principles his workbook lists for leading up and the seven for leading across.", "cards": [["Lead Up: Lead Yourself Exceptionally Well", "The first lead up principle in The 360 Degree Leader is to lead yourself exceptionally well. Maxwell teaches that no one can lead up credibly while his own work, emotions, and habits are unmanaged, because the leader above is watching the life before hearing the advice. Self leadership means managing your energy, your time, your thinking, and your reactions so consistently that your reliability becomes your introduction in every room. Maxwell makes a searching point. If you would not follow yourself, you cannot honestly expect anyone else to, and the person in the middle who leads himself well gains influence that position never gave him. This principle comes first among the lead up principles deliberately. Every other form of upward influence, lightening the leader load, speaking into decisions, becoming indispensable, is discounted when the leader sees disorder in the person offering it. It is also the one area fully within the middle leader control, whatever the quality of the leadership above him. A person caught under weak leadership can still lead himself with excellence, and that excellence often becomes the very thing that eventually changes his position. Influence upward begins with a life that is evidently well led at home, in private, and under pressure.", "I will lead myself exceptionally well in my habits, emotions, and work before I expect anyone above me to follow my influence."], ["Lead Up: Lighten Your Leader Load", "The second lead up principle is to lighten the load of the leader above you. Maxwell teaches that leaders carry pressures invisible to most of the people under them, decisions, consequences, and responsibility that follow them home. A 360 Degree Leader looks for ways to lift part of that weight instead of adding to it, anticipating needs, handling problems at his own level, and bringing finished work rather than fresh burdens. This is not flattery or self promotion. It is service aimed at the person whose success determines the health of the whole organization. Maxwell notes that lightening the load builds a kind of trust no self advancement can purchase, because the leader learns that this person makes his life easier and his leadership stronger. Over time such a person is invited closer, consulted earlier, and given more, not because he campaigned for it but because he proved useful in the places where the load is heaviest. The principle also corrects a common middle leader attitude, treating the boss only as the source of obstacles and decisions to criticize. The leader in the middle who asks what weight he can carry today changes his standing, his influence, and often his leader actual capacity to lead well.", "I will look for weight I can carry for the leader above me today instead of adding fresh burdens to the load."], ["Lead Up: Do What Others Will Not", "The third lead up principle is to be willing to do what others will not. Maxwell observes that every organization has necessary work that is unglamorous, difficult, or risky, and most people quietly arrange to avoid it. The 360 Degree Leader volunteers for it, not from desperation to be noticed but from an understanding that willingness separates people faster than talent does. Difficult assignments teach more than comfortable ones, expose the volunteer to parts of the work others never learn, and build a reputation for courage that leaders remember when important opportunities open. Maxwell is careful that this willingness should be genuine service and not a performance, since leaders can tell the difference between a person building an image and a person building the organization. There is also wisdom in the principle for the volunteer himself. The tasks others refuse often carry hidden value, relationships, knowledge, and proof of character that cannot be gained from the tasks everyone wants. Over a career, the person who repeatedly steps toward the hard thing becomes the person trusted with the significant thing. Influence upward follows demonstrated willingness, because a leader promotes the person he has already seen standing where others would not stand.", "I will volunteer for the hard and unglamorous work others avoid, and I will do it as service and not as performance."], ["Lead Up: More Than Manage, Lead", "The fourth lead up principle is to do more than manage, and to lead. Maxwell draws a clear line in The 360 Degree Leader between management and leadership. Management works with processes, systems, and things, keeping them ordered and efficient. Leadership works with people, moving them toward change and growth. A person in the middle who only manages may keep his area tidy and still exert little influence, because organizations do not follow processes. They follow people who give direction, take initiative, and think beyond their job description. Leading from the middle means thinking like a leader about the whole, offering ideas, solving problems that are not formally yours, and accepting responsibility for outcomes instead of hiding behind instructions. Maxwell warns that this requires judgment, since leading upward and outward must respect real authority and never become rebellion in disguise. Done well, it marks a person as more than an administrator of assigned work. The leader above begins to rely on such a person for perspective, not only for reports. This principle also prepares the middle leader for greater responsibility, because leading before being given the title is the strongest evidence that the title, when it comes, will be used well.", "I will think and act like a leader about the whole work, not only manage the processes assigned to me."], ["Lead Up: Invest in Relational Chemistry", "The fifth lead up principle is to invest in relational chemistry with the leader above you. Maxwell teaches that influence upward is never purely technical, because leaders receive ideas through the filter of relationship. A middle leader may be competent and still fail to influence a boss with whom he has no relational connection, simply because trust and understanding were never built. Investing in chemistry means learning how your leader thinks, what he values, how he prefers to receive information, and what pressures shape his decisions, then adapting your approach to the person instead of demanding he adapt to you. Maxwell is clear that this is not manipulation or pretending agreement where none exists. It is the honest work of building a working relationship strong enough to carry disagreement without breaking. Chemistry also means being loyal in the leader absence, refusing to win favor with others by criticizing him, and giving him the benefit of honest conversation directly rather than through rumor. Over time, a leader who trusts the relationship begins to ask for the thinking behind the door he previously kept closed. Influence grows in that asking, and it was purchased by patient relational investment made when nothing immediate was being gained from it.", "I will invest in a trusting relationship with my leader, learn how he thinks, and stay loyal in his absence."], ["Lead Up: Be Prepared Every Time", "The sixth lead up principle is to be prepared every time you take the time of the leader above you. Maxwell teaches that a leader time is among the scarcest resources in any organization, and the middle leader who wastes it with vague concerns, unresearched questions, and problems without options teaches his leader to avoid giving him more of it. Preparation means doing the homework before the meeting, knowing the facts, anticipating the questions, and arriving with recommendations instead of only complications. Maxwell offers a demanding picture of the standard, suggesting that the preparation behind a request for a leader time should far outweigh the meeting itself. That ratio communicates respect more loudly than any compliment. Prepared people also earn larger hearings over time, because the leader learns that minutes spent with them produce decisions rather than more confusion. The principle applies beyond meetings. Every report, request, and interruption either builds or spends credibility. A 360 Degree Leader therefore guards his leader attention as something entrusted to him, spends it carefully, and makes it profitable whenever he uses it. Influence upward is rationed by trust, and few things build trust with a busy leader faster than consistently arriving ready.", "I will do deep homework before I take my leader time, and I will arrive with facts and recommendations instead of complications."], ["Lead Up: Know When to Push and Back Off", "The seventh lead up principle is to know when to push and when to back off. Maxwell teaches that influencing upward requires both courage and timing, and that either one without the other fails. Some middle leaders never push, swallowing every concern until their influence becomes harmless and their conscience becomes heavy. Others push constantly, on every issue, at every moment, until the leader stops hearing them even when the matter is serious. Wisdom is learning the difference between the issue that must be pressed and the preference that must be released. Maxwell counsels reading the leader state, the pressure of the moment, and the weight of the matter, and choosing the ground worth standing on carefully, because a leader credibility is spent each time he insists and replenished each time he shows restraint. When a matter touches integrity or the survival of the mission, push, respectfully and clearly, and accept the cost. When it touches style, timing, or personal preference, back off and support the decision once made, because a team cannot move with a middle leader who keeps refighting settled questions. Timing turns good input into influence instead of irritation, and this discernment is a mark of maturity.", "I will press hard only on matters of integrity and mission, and I will release preferences gracefully once decisions are made."], ["Lead Up: Become a Go To Player", "The eighth lead up principle is to become a go to player. Maxwell borrows the picture from sport, where in the decisive moment a team looks for the player who has proven he can be trusted with the outcome. In an organization, the go to player is the person the leader turns to when the assignment is urgent, sensitive, or unusually important, because his record says he will deliver without drama. Becoming that player is not an event. It is the accumulation of preparation, willingness, reliability, and results across many ordinary assignments handled well when nobody important was watching. Maxwell notes that go to players also make their leaders look good, solving the problem in a way that strengthens the whole team rather than advertising themselves. That combination of competence and loyalty is rare, and rarity creates influence. The leader begins to bring the go to player into earlier conversations, larger responsibilities, and more honest information, because trust seeks the person who has earned it. A person in the middle who wants influence upward should therefore study this principle carefully. Influence is rarely granted to the person who demands it. It gathers around the person who has repeatedly been the answer in the moments that mattered most.", "I will build a record of delivering on important assignments without drama until I become a person my leader turns to first."], ["Lead Up: Be Better Tomorrow Than You Are Today", "The ninth lead up principle is to be better tomorrow than you are today. Maxwell closes the lead up section with growth, teaching that upward influence is not a fixed possession but a living thing that expands or contracts with the person growth. A middle leader who stops improving slowly loses relevance, because the organization, the problems, and even the leader above him keep changing. Growth keeps influence current. Maxwell urges the person in the middle to pursue development deliberately, learning from books, mentors, experience, and reflection, and to let the leader above see the growth in better thinking and stronger results rather than in announced ambition. This principle also carries hope for people under poor leadership. A person cannot always change his leader, but he can always change himself, and changing himself changes what he brings into every interaction above him. Over time, steady growth rearranges relationships. The growing person is consulted more, trusted more, and prepared when opportunity finally opens. Maxwell treats this as the long game of leading up. Titles may be delayed and recognition may be slow, but a person who is visibly better each season becomes difficult to overlook and impossible to keep at the same level forever.", "I will pursue growth deliberately every season so that I am better tomorrow than I am today in thinking and in results."], ["Lead Across: Complete the Leadership Loop", "The first lead across principle is to understand, practice, and complete the leadership loop. Maxwell describes leading peers as a cycle that begins with genuine care for fellow leaders, moves through learning about them and valuing them, and comes full circle as that investment returns influence. The loop is completed, in his teaching, when a peer you have invested in begins to help you in return, not because a debt was demanded but because a real relationship was built. Most people try to start the loop at the wrong end, asking peers for support, cooperation, or credit before any care has been shown. Then they are surprised when the circle never closes. Maxwell insists the order matters. Care first, learn about the person, affirm their worth, help them succeed, and only then does influence across become natural. Completing the loop takes time with people at your own level, who have no obligation to you and can simply decline your influence if the relationship is empty. That is what makes peer influence such an honest test of leadership. No title helps you here. Only value given and trust earned move a peer, and the loop, once completed, becomes a working alliance that strengthens the whole organization.", "I will care for my peers first, learn about them, and help them succeed before I ever ask for their support."], ["Lead Across: Completing Before Competing", "The second lead across principle is to put completing fellow leaders ahead of competing with them. Maxwell identifies competition among peers as one of the quiet poisons of organizational life, where leaders at the same level guard territory, hoard information, and measure themselves against each other instead of against the mission. His alternative is completing, looking for what a fellow leader lacks that you can supply, sharing credit and resources, and treating their success as part of your own. Completing requires security, because a person unsure of his own value experiences every peer achievement as a personal loss. Maxwell teaches that leaders who complete each other all rise, since the organization gains the combined strength of the team rather than the divided strength of rivals. It also changes the daily atmosphere. Meetings become places where ideas are built instead of defended, and help moves quickly because nobody fears that assisting a peer will cost them standing. A 360 Degree Leader makes this choice deliberately and repeatedly, especially when the system rewards rivalry. Over time, completing leaders become the center of informal influence among their peers, because everyone knows that working with them makes a person stronger rather than smaller. That reputation is influence no chart can grant.", "I will complete my fellow leaders by sharing what I have, instead of competing with them for standing."], ["Lead Across: Be a Friend", "The third lead across principle is simply to be a friend. Maxwell teaches that peer leadership rests on friendship more than people admit, because colleagues grant influence to those they like, trust, and believe are genuinely for them. Being a friend to fellow leaders means listening to them as people and not only as roles, remembering their lives outside the work, standing with them in difficulty, and speaking well of them when they are absent. It also means honesty inside the safety of friendship, telling a peer the truth about a blind spot precisely because you are his friend and not his rival. Maxwell notes that friendship at work must be offered without keeping a ledger. A person who is friendly only when he needs something is soon recognized and quietly discounted by everyone. Genuine friendship also survives disagreement, which makes it valuable in leadership, since peers who are friends can argue about a decision in the morning and work together in the afternoon without suspicion. The principle sounds soft beside strategy and results, yet Maxwell places it at the heart of leading across deliberately. Organizations run on relationships, and the middle leader rich in real friendships is rich in the only currency peers accept.", "I will be a genuine friend to my peers, loyal in their absence and honest with them in love."], ["Lead Across: Avoid Office Politics", "The fourth lead across principle is to avoid office politics. Maxwell describes politics as the maneuvering people use to gain position by currying favor, trading gossip, and positioning themselves with the powerful rather than serving the mission. He teaches that political behavior may win a short season and always costs the thing a 360 Degree Leader needs most among peers, trust. Fellow leaders watch how a person gains ground. If they see advancement built on flattery upward and undermining sideways, they withdraw real confidence no matter how pleasant the political person appears. Avoiding politics means doing honest work, letting results speak, refusing to trade in rumor, and declining alliances whose price is someone else unfair treatment. It also means being the same person in every company, since the political habit of adjusting the message to the audience eventually exposes itself. Maxwell acknowledges that politics exists in every organization and ignoring its existence is naive. His counsel is not blindness but refusal, knowing how the game works while declining to play it at the expense of integrity. Peers eventually distinguish the straight person from the maneuvering one, and when hard moments come, they follow the person whose hands they know are clean.", "I will refuse gossip, flattery, and maneuvering, and I will let honest work and clean hands earn my standing with peers."], ["Lead Across: Expand Your Circle", "The fifth lead across principle is to expand your circle of acquaintances. Maxwell teaches that influence across an organization cannot grow inside a closed circle of familiar people who think and work like you. The middle leader must deliberately build relationships beyond his own department, level, and comfort, meeting people whose worlds are different and learning what the organization looks like from where they stand. Expanding the circle is not collecting contacts for advantage. It is widening understanding, because every new genuine acquaintance teaches the leader something about needs, pressures, and gifts elsewhere in the body. It also widens usefulness. A leader connected across the whole organization can solve problems that require cooperation between areas, because the relationships needed already exist before the crisis demands them. Maxwell notes that this requires initiative with people who may seem unlike you, and humility to be a learner in rooms where you hold no expertise. Over time the expanded circle becomes an informal network of trust through which information, help, and goodwill travel quickly. Leaders in the middle with narrow circles lead small no matter their talent. Leaders with wide circles exert a quiet influence everywhere, because everywhere they go, someone knows them and trusts them.", "I will deliberately build relationships beyond my own area until trust connects me across the whole organization."], ["Lead Across: Let the Best Idea Win", "The sixth lead across principle is to let the best idea win. Maxwell teaches that peer leadership dies wherever ego decides outcomes, because leaders who must win every argument train their peers to stop offering ideas at all. Letting the best idea win means evaluating proposals by their merit rather than their author, supporting a fellow leader idea fully when it is stronger than your own, and receiving the same grace without suspicion when yours is chosen. This requires the security already described in completing rather than competing, carried into the meeting room where it is most severely tested. Maxwell observes that organizations suffer quietly when good ideas lose to powerful personalities, since the loss repeats in every decision and people eventually bring only safe suggestions. A leader known for honoring the best idea, whoever brought it, becomes a magnet for good thinking, because people learn that honesty is safe and quality is rewarded around him. His own ideas also improve, sharpened by a culture where challenge is normal and not personal. The principle costs pride in small moments and buys excellence in large ones. A 360 Degree Leader would rather be part of a winning team than the author of a losing plan, and peers follow that kind of person gladly.", "I will judge ideas by their merit and support the best one fully, even when it is not mine."], ["Lead Across: Do Not Pretend to Be Perfect", "The seventh lead across principle is to avoid pretending you are perfect. Maxwell, in the workbook wording, warns the middle leader not to pretend perfection before peers, because peers work beside you closely enough to know the pretense is false, and falsehood destroys the trust that peer influence stands on. Pretending also blocks help. A leader who admits no weakness receives no assistance, no honest warning, and no grace when failure comes, since he has taught everyone that he neither needs nor welcomes the truth. Maxwell counsels the opposite posture, honest about mistakes, open about limitations, and willing to ask fellow leaders for what they do better. That vulnerability, rightly practiced, is not weakness. It is the doorway to the completing and friendship that the earlier lead across principles describe, since people complete those who admit the gap and befriend those who are real. Peers also relax around an honest leader, and relaxed people communicate earlier and more truthfully, which improves every decision the team makes. The pretending leader spends enormous energy protecting an image. The honest leader spends that same energy on the work and the people, and over time the difference shows in both results and relationships across the whole organization.", "I will admit my mistakes and limitations honestly to my peers instead of protecting an image nobody believes."]]}]}];
const doorsEl = document.getElementById('doors');
const overlay = document.getElementById('overlay');
const scroller = document.getElementById('scroller');
const hud = document.getElementById('hud');
const counter = document.getElementById('counter');
let current = null;

DATA.forEach((t, i) => {
  const total = t.sections.reduce((n, s) => n + s.cards.length, 0);
  t.total = total;
  const b = document.createElement('button');
  b.className = 'doorCard';
  b.innerHTML = `<div class="photo" style="background-image:url('${t.photo}');background-position:${t.pos}"></div><div class="shade"></div><div class="body"><div class="doorNum">Door ${i + 1}</div><div class="doorName">THINK LIKE ${t.name}</div><p class="essence">${t.essence} ${total} teachings.</p><span class="enter">Enter</span></div>`;
  b.addEventListener('click', () => openTeacher(i));
  doorsEl.appendChild(b);
});
const empty = document.createElement('div');
empty.className = 'doorCard empty';
empty.innerHTML = `<div class="frame"><div class="doorNum">Door ${DATA.length + 1}</div><div class="doorName">THIS DOOR AWAITS ITS TEACHER</div><p class="essence">Space is kept at the door. Name the next teacher, and this space is his.</p></div>`;
doorsEl.appendChild(empty);

function openTeacher(i) {
  const t = DATA[i];
  current = t;
  scroller.innerHTML = '';
  const screens = [];
  const door = document.createElement('section');
  door.className = 'screen doorScreen';
  door.style.backgroundImage = `url('${t.photo}')`;
  door.style.backgroundPosition = t.pos;
  door.innerHTML = `<div class="shade"></div><div class="doorContent"><div class="kicker">Door ${i + 1} &middot; The Hall of Teachers</div><h1>THINK LIKE<br>${t.name}</h1><p class="dsub">A condensation of his teaching on ${t.sub}, taken in one screen at a time, until his way of thinking becomes yours.</p><button class="bigBtn" id="enterBtn">Enter</button><br><button class="hallBtn" id="backBtn1">&#8249; All Doors &middot; The Hall of Teachers</button></div>`;
  scroller.appendChild(door); screens.push({el: door, type: 'door'});
  let flat = 0;
  t.sections.forEach((sec, si) => {
    const intro = document.createElement('section');
    intro.className = 'screen intro';
    intro.innerHTML = `<div class="partNum">Part ${si + 1} of ${t.sections.length}</div><h2>${sec.title}</h2><p>${sec.intro}</p><div class="count">${sec.cards.length} teachings</div><div class="hint">Scroll</div>`;
    scroller.appendChild(intro); screens.push({el: intro, type: 'intro'});
    sec.cards.forEach((c, ci) => {
      flat++;
      const myFlat = flat;
      const card = document.createElement('section');
      card.className = 'screen card';
      card.innerHTML = `<div class="secLabel">${sec.title} &middot; ${ci + 1} of ${sec.cards.length}</div><h3>${c[0]}</h3><p class="body">${c[1]}</p><div class="into"><div class="lbl">Into Me</div><p>${c[2]}</p></div>`;
      scroller.appendChild(card); screens.push({el: card, type: 'card', n: myFlat});
    });
  });
  const end = document.createElement('section');
  end.className = 'screen endCard';
  end.innerHTML = `<div class="kicker">End &middot; ${t.total} Teachings</div><h2>THINK LIKE ${t.name}</h2><p>You have taken in the condensation. Now go and think like ${t.short}: ${t.end}</p><button class="bigBtn" id="againBtn">Begin Again</button><br><button class="hallBtn" id="backBtn2">&#8249; All Doors &middot; The Hall of Teachers</button><div class="hint">Door ${i + 1} &middot; The Hall of Teachers</div>`;
  scroller.appendChild(end); screens.push({el: end, type: 'end'});
  t._screens = screens;
  overlay.classList.add('open');
  document.body.style.overflow = 'hidden';
  scroller.scrollTop = 0;
  hud.style.display = 'none';
  document.getElementById('enterBtn').addEventListener('click', () => { screens[1].el.scrollIntoView({behavior: 'smooth'}); });
  document.getElementById('againBtn').addEventListener('click', () => { screens[1].el.scrollIntoView({behavior: 'smooth'}); });
  document.getElementById('backBtn1').addEventListener('click', closeTeacher);
  document.getElementById('backBtn2').addEventListener('click', closeTeacher);
  const io = new IntersectionObserver((es) => {
    es.forEach(e => {
      if (!e.isIntersecting) return;
      const s = screens.find(x => x.el === e.target);
      if (!s) return;
      if (s.type === 'card') { hud.style.display = 'flex'; counter.textContent = s.n + ' / ' + t.total; }
      else if (s.type === 'door') { hud.style.display = 'none'; }
      else { hud.style.display = 'flex'; counter.textContent = s.type === 'end' ? t.total + ' / ' + t.total : ''; }
    });
  }, {root: scroller, threshold: .55});
  screens.forEach(s => io.observe(s.el));
  t._io = io;
}
function closeTeacher() { location.href = 'index.html'; }
document.getElementById('hallBtnTop').addEventListener('click', closeTeacher);
document.getElementById('topBtn').addEventListener('click', () => {
  if (!current || !current._screens) return;
  const s = [...current._screens].reverse().find(x => x.type === 'intro' || x.type === 'card');
  if (s) s.el.scrollIntoView({behavior: 'smooth'});
});
openTeacher(0);
</script>

<style>
.listenBtn{display:inline-block;margin:14px 0 4px;padding:9px 22px;border:1px solid #c9a227;
background:rgba(0,0,0,.25);color:#e8c766;font-family:Cinzel,serif;font-size:13px;
letter-spacing:.18em;text-transform:uppercase;cursor:pointer;border-radius:999px}
.listenBtn.playing{background:#c9a227;color:#14100a}
</style>
<script id="hallAudioLayer">
(function(){
  var BASE = 'https://audio.readchrist.com/hall/maxwell/';
  var player = new Audio();
  var currentBtn = null;
  function resetBtn(){ if(currentBtn){ currentBtn.textContent = '\u25B6 Listen'; currentBtn.classList.remove('playing'); currentBtn = null; } }
  player.addEventListener('ended', resetBtn);
  function wire(){
    var cards = document.querySelectorAll('section');
    var n = 0;
    cards.forEach(function(sec){
      if (!sec.querySelector('.secLabel')) return;
      n += 1;
      if (sec.querySelector('.listenBtn')) return;
      var num = ('00' + n).slice(-3);
      var b = document.createElement('button');
      b.className = 'listenBtn';
      b.textContent = '\u25B6 Listen';
      b.addEventListener('click', function(){
        var url = BASE + num + '.mp3';
        if (currentBtn === b && !player.paused) { player.pause(); resetBtn(); return; }
        resetBtn();
        player.src = url;
        player.play();
        currentBtn = b;
        b.textContent = '\u275A\u275A Pause';
        b.classList.add('playing');
      });
      sec.appendChild(b);
    });
  }
  var tries = 0;
  var iv = setInterval(function(){
    wire();
    tries += 1;
    var done = document.querySelectorAll('.listenBtn').length >= 200;
    if (done || tries > 40) clearInterval(iv);
  }, 500);
})();
</script>
