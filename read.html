 was valued and sold, yet He gave Himself for me.", "I declare: I am bought with a price; I belong to Christ."], "prayer": "Lord Jesus, You were priced and sold for my sake. I give myself wholly to You today. Amen.", "theme_flag": "theme-based: Murray, Nee, Sparks"}, {"day": 127, "ref": "Zechariah 11:13", "book": "Zechariah", "chapter": 11, "verse": 13, "text": "And the LORD said unto me, Cast it unto the potter: a goodly price that I was prised at of them. And I took the thirty pieces of silver, and cast them to the potter in the house of the LORD.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Verses 12 and 13 relate the price at which the nation estimated their King and their Saviour. The fulfilment of this is known to all. The prophet here performs the thing prophetically, marking that so it was to be according to the counsels of God. We see also that Christ appears here as Jehovah Himself. The connection between verses 6 and 9 brings out the same truth. The thoughts of Jehovah with respect to that which He will do find their accomplishment in the Person of Jesus. The union between Judah and Israel, of which Christ should be the bond, is also deferred.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "The Cross of Christ does not make God love us; it is the outcome and measure of His love to us. He loves all His children, the clumsiest, the dullest, the worst of His children. His love lies at the back of everything, and we must get upon that as the solid foundation of our religious life, not growing up into that, but growing up out of it. We must begin there or our beginning will come to nothing. Do take hold of this mightily. We must go out of ourselves for any hope, or any strength, or any confidence. And what hope, what strength, what confidence may be ours now that we begin here, your Father which is in heaven!", "source": "With Christ in the School of Prayer, Sixth Lesson"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Upon announcing that He would be betrayed and die on the cross, He was again troubled in spirit. John 13:21.", "source": "The Spiritual Man, Calvary's Judgment"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "We can say that God's purpose is that there shall come a time when He has a vessel in which and through which His glory shines forth to this universe.", "source": "The School of Christ"}], "declarations": ["I declare: Christ is Jehovah Himself, and all God's counsels stand sure.", "I declare: I am a vessel for God's glory, shaped by His hand."], "prayer": "Lord Jesus, You are Jehovah my God. Shape me as the Potter shapes the clay today. Amen.", "theme_flag": "theme-based: Murray, Nee, Sparks"}, {"day": 128, "ref": "Zechariah 12:10", "book": "Zechariah", "chapter": 12, "verse": 10, "text": "And I will pour upon the house of David, and upon the inhabitants of Jerusalem, the spirit of grace and of supplications: and they shall look upon me whom they have pierced, and they shall mourn for him, as one mourneth for his only son, and shall be in bitterness for him, as one that is in bitterness for his firstborn.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Judah, guilty yet beloved Judah, is delivered — that is to say, the remnant, to whom the affliction of Israel had been a burden; but the question of her conduct towards her God still remained. Nevertheless the grace shewn in her deliverance had wrought upon her heart. The law we know was written in it, but much more. To be loved by a God against whom one has so deeply revolted melts the heart. Grace then goes farther, and presents to the people the Messiah whom they had pierced. The Rejected One is the Jehovah that delivers them.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "It will be noticed that the chapters are comparatively short; but every one of them has a considerable number of Biblical references. Let no reader be content to read what is written here without turning up and examining the texts marked. This practice, if persistently carried out, cannot fail to yield much recompense. There are just as many chapters in the book as Sabbaths in the year. What an additional blessing it would bring, if the members of a family who have had access to the book during the week, were to hear a chapter read aloud every Sabbath evening, and were encouraged to quote the texts in each that my have struck them most.", "source": "The New Life"}, {"name": "Watchman Nee", "short": "Nee", "comment": "The prophet Zechariah called attention to him whom they have pierced. Zech. 12:10.", "source": "The Spiritual Man, Calvary's Judgment"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Then in virtue of His precious Blood which is sprinkled all the way from the altar right through to the Most Holy Place, in virtue of that precious Blood there is a way of life.", "source": "The School of Christ"}], "declarations": ["I declare: I look on Him whom they pierced, and I receive His grace.", "I declare: The pierced Messiah is my Jehovah who delivers me."], "prayer": "Lord Jesus, pierced for me, I look to You today. Pour out Your Spirit of grace on me. Amen.", "theme_flag": "theme-based: Sparks"}, {"day": 129, "ref": "Zechariah 13:7", "book": "Zechariah", "chapter": 13, "verse": 7, "text": "¶ Awake, O sword, against my shepherd, and against the man that is my fellow, saith the LORD of hosts: smite the shepherd, and the sheep shall be scattered: and I will turn mine hand upon the little ones.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "The result of this rejection of Christ, the centre of the history of eternity, of man's connection with God, and the revelation of both — for this event is here considered in connection with the history of Israel — is the scattering of the sheep who had been gathered around the true Shepherd. Nevertheless God stretches out His hand over the little ones. The result for Judah, when the current of their history shall be resumed in the last days, is that two-thirds shall be cut off in all the land (compare Ezek.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "All that is said in Rom. vi. and Col. iii. of our being dead to sin in Christ, and alive to God, in 2 Cor. iv. of bearing about in the body the dying of Jesus that His life may be manifested in us, in Gal. ii. and vi. of our being crucified with Christ, being crucified to the world, in Phil. iii. of our being made conformable to His death, points to this — the inward spirit and disposition of self- sacrifice is born within us by His Spirit, is breathed in us every day where there is true communion with Him. The blessing of Christ's death as atonement is only surpassed because it is only fulfilled in that of His death as fellowship.", "source": "The Holiest of All, Faith, The Sense for the Unseen"}, {"name": "Watchman Nee", "short": "Nee", "comment": "He cried out, My God, my God, why hast thou forsaken me? Matt. 27:46. His spirit was split asunder from God.", "source": "The Spiritual Man, Calvary's Judgment"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "They were intended to break His union with the Father and get Him out into a realm where He could be smitten.", "source": "The Battle for Life"}], "declarations": ["I declare: The Shepherd was smitten for me, and I am gathered to Him.", "I declare: I am crucified with Christ, and I live by His life."], "prayer": "Lord Jesus, smitten Shepherd, I thank You for bearing the sword for me. Hold me close today. Amen.", "theme_flag": "theme-based: Murray, Nee, Sparks"}, {"day": 130, "ref": "Malachi 3:1", "book": "Malachi", "chapter": 3, "verse": 1, "text": "Behold, I will send my messenger, and he shall prepare the way before me: and the Lord, whom ye seek, shall suddenly come to his temple, even the messenger of the covenant, whom ye delight in: behold, he shall come, saith the LORD of hosts.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Here again we find the Lord's* first coming connected with the full result of the second. John the Baptist is announced as His messenger to prepare the way before Him; and then, the Angel of the covenant, whom they so earnestly desired, should come; but it would be in judgment, to purge the people and take away all their dross. Then should their offering in Jerusalem be acceptable to Jehovah, an offering in righteousness. But all the evil-doers should be judged; for God was unchangeable, both in righteousness and grace. It was this which, after all, secured the existence of Israel, happen what might.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Truly to know Jesus at the right hand of God would be the healing of their diseases, the restoration to the joy and the strength of a life in accordance with their heavenly calling. The Church of our days is suffering from the same cause, and needs the same cure. It is so much easier to appropriate the work of Christ on earth than that in heaven. It is so much easier to take in the doctrine of a Substitute and an atonement, of repentance and pardon, than of a High Priest bringing us into God's presence, and keeping us in loving communion with Him.", "source": "The Holiest of All, The Son, The Glory of His Work"}, {"name": "Watchman Nee", "short": "Nee", "comment": "The messenger delivers his message out of his spirit, and the hearer receives God's Word with his.", "source": "The Spiritual Man (2)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "In speaking, the messenger can see by the faces before him where repetition or reemphasis or fuller elucidation is called for.", "source": "The School of Christ"}], "declarations": ["I declare: The Lord whom I seek comes to His temple; I prepare the way for Him.", "I declare: Christ my Forerunner has opened the way into God's presence."], "prayer": "Lord Jesus, come to Your temple today. Prepare my heart to receive You. Amen.", "theme_flag": "theme-based: Murray, Nee, Sparks"}, {"day": 131, "ref": "Malachi 3:10", "book": "Malachi", "chapter": 3, "verse": 10, "text": "Bring ye all the tithes into the storehouse, that there may be meat in mine house, and prove me now herewith, saith the LORD of hosts, if I will not open you the windows of heaven, and pour you out a blessing, that there shall not be room enough to receive it.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Here again we find the Lord's* first coming connected with the full result of the second. John the Baptist is announced as His messenger to prepare the way before Him; and then, the Angel of the covenant, whom they so earnestly desired, should come; but it would be in judgment, to purge the people and take away all their dross. Then should their offering in Jerusalem be acceptable to Jehovah, an offering in righteousness. But all the evil-doers should be judged; for God was unchangeable, both in righteousness and grace. It was this which, after all, secured the existence of Israel, happen what might.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Let your faith receive and hold fast the answer as given: it shall turn out according to your faith. (Ps. 145:9; Isa. 30:19; Jer. 33:3; Mal. 3:10; Matt. 9:29; 15:28; 1 John 3:22; 5:14,15) Beloved young Christians, if there is one thing about which you must be conscientious, it is this: secret converse with God. Your life is hid with Christ in God. Every day must you in prayer ask from above, and by faith receive in prayer what you need for that day. Every day must personal intercourse with the Father and the Lord Jesus be renewed and strengthened.", "source": "The New Life, Prayer"}, {"name": "Watchman Nee", "short": "Nee", "comment": "The Lord Jesus was laying down one thing as a basis of all service: that you pour out all you have, your very self, unto Him.", "source": "The Normal Christian Life"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "The last Adam, a life-giving spirit. 1 Cor. 15:45.", "source": "In Christ"}], "declarations": ["I declare: I bring my whole self to God, and He opens heaven over me.", "I declare: I prove God's goodness today, and He pours out blessing."], "prayer": "Lord Jesus, I return to You with all I have. Pour out Your blessing on me today. Amen.", "theme_flag": "theme-based: Nee, Sparks"}, {"day": 132, "ref": "Malachi 4:2", "book": "Malachi", "chapter": 4, "verse": 2, "text": "¶ But unto you that fear my name shall the Sun of righteousness arise with healing in his wings; and ye shall go forth, and grow up as calves of the stall.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "In their affliction they spake often one to another of these things;* and Jehovah hearkened and heard and wrote it down in His book. And they shall be His in the day when He maketh up His jewels. After this they should discern between the righteous and the wicked, between those that served God and those that served Him not. For the day was coming which should burn as an oven, and the proud and the wicked should be as stubble. But to those that feared the name of Jehovah, the Sun of Righteousness should rise.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "The joyful light of the morning awakens the birds to their song and gladdens the watchers who in the darkness have longed for the day. It is the light of God's countenance that gives the Christian his gladness: in fellowship with his Lord, he can, and always will, be happy: the love of the Father shines like the sun upon His children. (Ex. 10:23; 2 Sam. 23:4; Ps. 36:10; Isa. 60:1,20; 1 John 1:5; 4:16) When darkness comes over the soul, it is always through one of two things, through sin or through unbelief. Sin is darkness, and makes dark. And unbelief also makes dark, for it turns us from Him, who alone is the light.", "source": "The New Life, Light And Joyfulness"}, {"name": "Watchman Nee", "short": "Nee", "comment": "We are told that in the future kingdom the Lord Jesus is to be the sun of righteousness with healing in its wings. Mal. 4:2.", "source": "The Spiritual Man (3)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "In him was life; and the life was the light of men. John 1:4.", "source": "The School of Christ"}], "declarations": ["I declare: The Sun of Righteousness has risen on me with healing in His wings.", "I declare: I walk in the light of Christ, and darkness cannot hold me."], "prayer": "Lord Jesus, Sun of Righteousness, rise on me today. Heal me and fill me with Your light. Amen.", "theme_flag": "theme-based: Murray, Sparks"}, {"day": 133, "ref": "Matthew 1:21", "book": "Matthew", "chapter": 1, "verse": 21, "text": "And she shall bring forth a son, and thou shalt call his name JESUS: for he shall save his people from their sins.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Born of a woman, bom under the law, heir to all the rights of David according to the flesh, also the Son of God, Jehovah the Saviour, God with His people: who could comprehend or fathom the mystery of His nature in whom all these things were combined ? His life in fact, as we shall see, displays the obedience of the perfect man, the perfections and the power of God. The titles which w^e have just named, and which w^e read in chapter i. 20-23, are connected with His glory in the midst of Israel — that is to say, the heir of David, Jesus the Saviour of His people, and Emmanuel.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Let us receive the thought deep into our hearts: it is for God to take away our sins from us. The better we apprehend this, the more blessed shall our life be. All do not receive this. They seek chiefly to be freed from the consequences of sin, from fear and darkness, and the punishment that sin brings. (Gen. 27:34; Isa. 58:5,6; John 6:26; Jas. 4:3) Just on this account they do not come to the true rest of salvation. They do not understand that to save is to free from sin. Let us hold it fast. Jesus saves through taking away sin. Then we shall learn two things.", "source": "The New Life"}, {"name": "Watchman Nee", "short": "Nee", "comment": "The name of God's Son is Jesus which means he will save his people from their sins. Matt. 1:21.", "source": "The Spiritual Man (1)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "The power of the saints becomes greater through their growth in grace and in the knowledge of our Lord and Saviour, Jesus Christ.", "source": "The Battle for Life"}], "declarations": ["I declare: Jesus saves me from my sins; His name is my salvation.", "I declare: I grow in the grace and knowledge of my Lord and Saviour today."], "prayer": "Lord Jesus, my Saviour, thank You for saving me from my sins. I trust Your name today. Amen.", "theme_flag": "theme-based: Sparks"}, {"day": 134, "ref": "Matthew 1:23", "book": "Matthew", "chapter": 1, "verse": 23, "text": "Behold, a virgin shall be with child, and shall bring forth a son, and they shall call his name Emmanuel, which being interpreted is, God with us.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Born of a woman, bom under the law, heir to all the rights of David according to the flesh, also the Son of God, Jehovah the Saviour, God with His people: who could comprehend or fathom the mystery of His nature in whom all these things were combined ? His life in fact, as we shall see, displays the obedience of the perfect man, the perfections and the power of God. The titles which w^e have just named, and which w^e read in chapter i. 20-23, are connected with His glory in the midst of Israel — that is to say, the heir of David, Jesus the Saviour of His people, and Emmanuel.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "GOD'S GIFT OF HIS SON For God so loved the world, that He have His only-begotten Son, that whosoever believeth on Him should not perish, but have eternal life.' -- John 3:16 Thanks be to God for His unspeakable gift.' -- 2 Cor. 9:15 Thus dear did God hold the world. How dear? That He gave His only-begotten Son for every one in the world who will trust in Him. And how did He give? He gave Him, in His birth as man, in order to be for ever one with us. He gave Him, in His death on the cross as Surety, in order to take our sin and curse upon Himself.", "source": "The New Life, God's Gift Of His Son"}, {"name": "Watchman Nee", "short": "Nee", "comment": "We all have the same Christ dwelling within, but revelation of some new need will lead us spontaneously to trust Him to live out His life in us in that particular.", "source": "The Normal Christian Life"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Lo, I am with you always, even unto the consummation of the age.", "source": "In Christ"}], "declarations": ["I declare: Emmanuel, God with us, is with me today and always.", "I declare: Christ dwells in me, and I am never alone."], "prayer": "Lord Jesus, Emmanuel, I thank You that You are with me. Live Your life through me today. Amen.", "theme_flag": "theme-based: Murray, Nee, Sparks"}, {"day": 135, "ref": "Matthew 4:4", "book": "Matthew", "chapter": 4, "verse": 4, "text": "But he answered and said, It is written, Man shall not live by bread alone, but by every word that proceedeth out of the mouth of God.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "The enemy tempts Him first by proposing to Him to satisfy His bodily need, and, instead of waiting on God, to employ according to His own will and on His own behalf the power with which He was endowed. But, if Israel was fed in the wilderness with manna from God, the Son of God, however great His power, would act in accordance with what Israel should have learnt by that means, namely, that \" man doth not live by bread only, but by every word that proceedeth out of the mouth of God.\" The Man, the obedient Jew, the Son of God, waited for this word, and would do nothing without it.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "The heavenly life must have heavenly food; nothing less than Jesus Himself is the bread of life: He that eateth Me shall live by Me.' (Ps. 42:3; Matt. 4:4; John 6:51) This heavenly food, Jesus, is brought near to us in two of the means of grace, the word and the Lord's Supper. The word comes to present Jesus to us from the side of the intellectual life, by our thoughts. The Lord's Supper comes in like manner to present Jesus to us from the side of the emotional life, by the physical senses. Man has a double nature: he has spirit and body.", "source": "The New Life, The Lord's Supper"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Man shall not live by bread alone, but by every word that proceeds from the mouth of God. Matt. 4:4.", "source": "The Spiritual Man (3)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Jesus therefore said to those Jews that had believed him, If ye abide in my word, then are ye truly my disciples, and ye shall know the truth, and the truth shall make you free.", "source": "The School of Christ"}], "declarations": ["I declare: I live by every word from the mouth of God, not by bread alone.", "I declare: Jesus is my bread of life; I feed on Him today."], "prayer": "Lord Jesus, my bread of life, feed me with Your word today. I live by You. Amen.", "theme_flag": "theme-based: Sparks"}, {"day": 136, "ref": "Matthew 5:3", "book": "Matthew", "chapter": 5, "verse": 3, "text": "Blessed are the poor in spirit: for theirs is the kingdom of heaven.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "He was identified with heaven as a man sealed with the Holy Ghost on earth. He was thus the continual expression of the spirit, of the reality, of heaven. There was not yet the exercise of the judicial power which would uphold this character in the face of all that opposed it. It was its manifestation in patience, notwithstanding the opposition of all around Him and the inability of His disciples to understand Him. Thus in the sermon on the Mount we find the description of that which was suitable to the kingdom of heaven, and even the assurance of reward in heaven for those who should suffer on earth for His sake.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "The poor, who have nothing in themselves, to them the kingdom comes. The meek, who seek nothing in themselves, theirs the earth shall be. The blessings of heaven and earth are for the lowly. For the heavenly and the earthly life, humility is the secret of blessing. 2. _'Learn of Me; for I am meek and lowly of heart, and ye shall find rest for your souls.'_ Jesus offers Himself as Teacher. He tells what the spirit both is, which we shall find Him as Teacher, and which we can learn and receive from Him. Meekness and lowliness the one thing He offers us; in it we shall find perfect rest of soul. Humility is to be a salvation.", "source": "Humility, Humility in the Teaching of Jesus"}, {"name": "Watchman Nee", "short": "Nee", "comment": "The poor in spirit views himself as possessing nothing.", "source": "The Spiritual Man, A Lowly Spirit"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Nicodemus, you have nothing to give, you must be born again; I cannot take you at the point at which you come to Me!", "source": "The School of Christ"}], "declarations": ["I declare: I am poor in spirit, and the kingdom of heaven is mine.", "I declare: Having nothing in myself, I receive everything in Christ."], "prayer": "Lord Jesus, I come to You empty today. Fill me with Your kingdom. Amen.", "theme_flag": "theme-based: Sparks"}, {"day": 137, "ref": "Matthew 5:8", "book": "Matthew", "chapter": 5, "verse": 8, "text": "Blessed are the pure in heart: for they shall see God.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "There was not yet the exercise of the judicial power which would uphold this character in the face of all that opposed it. It was its manifestation in patience, notwithstanding the opposition of all around Him and the inability of His disciples to understand Him. Thus in the sermon on the Mount we find the description of that which was suitable to the kingdom of heaven, and even the assurance of reward in heaven for those who should suffer on earth for His sake. This description, as we have seen, is essentially the character of Christ Himself.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "(Lev. 8:13; 14:7,8; Num. 19:12, 31:23,24; 2 Sam. 22:21,25; 2 Chron. 5:10; Neh. 13:30; 28:21,25; Ps. 21:4; Mal. 3:3) Consequently with us also cleansing is the inner revelation of the power of God whereby we are liberated from unrighteousness, from the pollution and the working of sin. Through cleansing we obtain the blessing of a pure heart; a heart in which the Spirit can complete His operations with a view to sanctifying us, and revealing God within us. (Ps 51:12; 73:1; Matt. 5:8; 1 Tim 1:5; 2 Tim. 2:22; 1 Pet. 1:22) Cleansing is through the blood.", "source": "The New Life"}, {"name": "Watchman Nee", "short": "Nee", "comment": "We do not rely upon the soul to execute God's will, rather we perform His will from the soul, that is, with our whole heart.", "source": "The Spiritual Man, The Soul under the Spirit's Control"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "We may think our desire is a perfectly pure and right one, and it may be utterly false; and so with our will, just the same.", "source": "The School of Christ"}], "declarations": ["I declare: In Christ I have a pure heart, and I shall see God.", "I declare: I serve God with my whole heart today."], "prayer": "Lord Jesus, purify my heart today. I want to see God and do His will fully. Amen.", "theme_flag": "theme-based: Nee, Sparks"}, {"day": 138, "ref": "Matthew 5:14", "book": "Matthew", "chapter": 5, "verse": 14, "text": "Ye are the light of the world. A city that is set on an hill cannot be hid.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Tlie same arc found in Daniel \"^di. : onty, remark, it is the times and lawB which are delivered into the beast's hands, not the saints. presses that which ah^ady professed to have received light from God — that which was in relationship with Him by virtue of the light — having assumed a definite shape before Him. The disciples of Christ w^ere the preservative principle in the earth. They were the light of the ivorld, which did not possess that light. This was their position, whether they would or no. It was the purpose of God that they should be the light of the world.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "But seek Jesus, follow Jesus, believe in Jesus, and gladness shall be added to you. Not seeing, but believing, rejoice with joy unspeakable and full of glory.' Lord Jesus, Thou are the Light of the world, the Effulgence of the unapproachable light, in whom we see the light of God. From Thy countenance radiates upon us the illumination of the knowledge of the love and glory of God. And thou art ours, our light and our salvation. O teach us to believe more firmly that with Thee we can never walk in the darkness. Let gladness in Thee be the proof that Thou art all to us, and our strength to do all that Thou wouldst have us do. Amen.", "source": "The New Life, Light And Joyfulness"}, {"name": "Watchman Nee", "short": "Nee", "comment": "The more he communes the brighter the heavenly light shines.", "source": "The Spiritual Man, When Christians Become affectionately attached to"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "I am the light of the world: he that followeth me shall not walk in the darkness, but shall have the light of life. John 8:12.", "source": "The School of Christ"}], "declarations": ["I declare: I am the light of the world in Christ, and I shine today.", "I declare: The light of Christ in me drives out all darkness."], "prayer": "Lord Jesus, Light of the world, shine through me today. Let Your light be seen in my life. Amen.", "theme_flag": "theme-based: Murray, Nee, Sparks"}, {"day": 139, "ref": "Matthew 5:16", "book": "Matthew", "chapter": 5, "verse": 16, "text": "Let your light so shine before men, that they may see your good works, and glorify your Father which is in heaven.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Tlie same arc found in Daniel \"^di. : onty, remark, it is the times and lawB which are delivered into the beast's hands, not the saints. presses that which ah^ady professed to have received light from God — that which was in relationship with Him by virtue of the light — having assumed a definite shape before Him. The disciples of Christ w^ere the preservative principle in the earth. They were the light of the ivorld, which did not possess that light. This was their position, whether they would or no. It was the purpose of God that they should be the light of the world. A candle is not lighted in order to be hidden.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Let any one simply and honestly begin to study the Sermon on the Mount and take it as his guide in life, and he will find, notwithstanding weakness and failure, an ever-growing liberty to claim the fulfilment of its promises in regard to prayer. In the names of father and child he has the pledge that his petitions will be granted. This is the one chief thought on which Jesus dwells here, and which He would have all His scholars take in. He would have us see that the secret of effectual prayer is: to have the heart filled with the Father-love of God.", "source": "With Christ in the School of Prayer, Sixth Lesson"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Light has one law: It shines wherever it is admitted. That is the only requirement.", "source": "The Normal Christian Life"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "As the light burns, it is a constant declaration of victory, and that, a victory over death, which would seek to smother the flame.", "source": "The Battle for Life"}], "declarations": ["I declare: I let my light shine before men, and my Father is glorified.", "I declare: My good works point the world to God today."], "prayer": "Lord Jesus, let Your light burn bright in me today. May all I do bring glory to the Father. Amen.", "theme_flag": "theme-based: Darby, Murray, Nee, Sparks"}, {"day": 140, "ref": "Matthew 6:9", "book": "Matthew", "chapter": 6, "verse": 9, "text": "After this manner therefore pray ye: Our Father which art in heaven, Hallowed be thy name.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "(Vers. 24-29.) There is another principle that characterises this discourse, and that is the introduction of the Father's name. Jesus puts His disciples in connection with His Father, as their Father. He reveals to them the Father's name, in order that they may be in relation with Him, and that they may act in accordance with that which He is. This discourse gives the principles of the kingdom, but supposes the rejection of the King, and the position into which this would bring those that Avere His ; who consequently must look for a heavenly reward.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "In condescension to our weakness, our heavenly Teacher has given us the very words we are to take with us as we draw near to our Father. We have in them a form of prayer in which there breathe the freshness and fulness of the Eternal Life. So simple that the child can lisp it, so divinely rich that it comprehends all that God can give. A form of prayer that becomes the model and inspiration for all other prayer, and yet always draws us back to itself as the deepest utterance of our souls before our God.", "source": "With Christ in the School of Prayer"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Christians have a basic right while living on earth today, the right to receive answers to prayers.", "source": "Messages for Building Up New Believers (1)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Do you want to know Him as Father? The Lord Jesus carried in His heart a great longing for the glory He once had with the Father.", "source": "The Alpha and the Omega"}], "declarations": ["I declare: My Father in heaven hears me when I pray.", "I declare: I come to my Father with confidence and reverence."], "prayer": "Lord Jesus, teach me to pray as You taught Your disciples. Let me know the Father as You know Him, and draw near with a true heart.", "theme_flag": "theme-based: Sparks"}, {"day": 141, "ref": "Matthew 6:21", "book": "Matthew", "chapter": 6, "verse": 21, "text": "For where your treasure is, there will your heart be also.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "The Lord ever speaks and acts as the obedient man, moved and guided by the Holy Ghost ; but we see in the most striking manner, in this Gospel, who it is that acts thus. And it is this which gives its true moral character to the kingdom of heaven. John the Baptist might announce it as a change of dispensation, but his ministry was earthly. Christ might equally announce this same change (and the change was all-important) ; but in Him there was more than this. He was from heaven, the Lord who came from heaven. In speaking of the kingdom of heaven. He spoke out of the deep and divine abundance of His heart.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "The answer to each prayer must come in the closer union and the deeper abiding in Him ; in Him, the unspeakable gift, all other gifts ara treasured up, the gift of wisdom and knowledge too. How often have you longed for wisdom and spiritual understanding that you might know God better, whom to know is life eternal! Abide in Jesus: your life in Him will lead you to that fellowship with God in which the only true know- ledge of God is to be had. His love, His power, His infinite glory will, as you abide in Jesus, be so revealed as it hath not entered into the heart of man to conceive.", "source": "Abide in Christ"}, {"name": "Watchman Nee", "short": "Nee", "comment": "The heart always follows the treasure. We cannot change this.", "source": "Messages for Building Up New Believers (3)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "In Christ are all the treasures of wisdom and knowledge hidden.", "source": "On Knowing the Lord"}], "declarations": ["I declare: My heart follows my treasure, and my treasure is Christ.", "I declare: I lay up treasure in heaven where nothing can corrupt."], "prayer": "Lord Jesus, You are my treasure. Turn my heart fully toward You, and let nothing on earth rival Your place in me.", "theme_flag": "theme-based: Murray, Sparks"}, {"day": 142, "ref": "Matthew 6:33", "book": "Matthew", "chapter": 6, "verse": 33, "text": "But seek ye first the kingdom of God, and his righteousness; and all these things shall be added unto you.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "In these the exigencies of the law and what Christ required are contrasted. that they might enter into the kingdom ; not however merely enter, many would seek to do that, but according to those principles which made it difficult for man, according to God — the strait gate ; and then, the means of discerning those who would seek to deceive them, as well as the watchfulness needed that they might not be deceived. (Vers. 13-23.) Real and practical obedience to His sayings, the true wisdom of those that hear His words. (Vers. 24-29.) There is another principle that characterises this discourse, and that is the introduction of the Father's name.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "As he looks at the Cross, and Christ suffering there, the Righteous One for the unrighteous, he sees in that atoning death the only but sufficient founda- tion for his faith in God’s pardoning mercy. The substitution, and the curse-bearing, and the atone- ment of Christ dying in the stead of sinners, are what give him peace. And as he understands how the righteousness which Christ brings becomes his very own, and how, in the strength of that, he is counted righteous before God, he feels that he has what he needs to restore him to God’s favour: ‘ Being justified by faith, we have peace with God.’", "source": "Abide in Christ"}, {"name": "Watchman Nee", "short": "Nee", "comment": "The present spiritual condition of the believers enables them to reign in the future.", "source": "Study on Matthew"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Have you got a heart for the Kingdom of God? Really, is this a heart matter?", "source": "That They May Be One, Even As We Are One Vol. I"}], "declarations": ["I declare: I seek first the kingdom of God and His righteousness.", "I declare: All I need is added unto me as I seek Him first."], "prayer": "Lord Jesus, be my first pursuit. Teach me to seek Your kingdom above all else, trusting You for every need.", "theme_flag": "theme-based: Murray, Sparks"}, {"day": 143, "ref": "Matthew 7:7", "book": "Matthew", "chapter": 7, "verse": 7, "text": "¶ Ask, and it shall be given you; seek, and ye shall find; knock, and it shall be opened unto you:", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "He appoints His disciples to meet Him there, and there they find Him and recognise Him ; and it is there, in this former scene of the labours of Christ, according to Isaiah viii., ix., that they receive their commission from Him. Hence we have not the ascension of Christ at all in this Gospel, but all power is given unto Him in heaven and in earth, and accordingly the commission given to His disciples extends to all nations (Gentiles). To them they were to proclaim His rights, and make disciples of them. It was not however the name of the Lord only, nor in connection with His throne at Jerusalem.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Ask and it shall be given,\" Jesus says. However true and valuable the reflection may be, that God, foreseeing and foreordaining all things, has also foreseen and foreordained our prayers as links in the chain of events, of cause and effect, as a real power, yet we feel convinced that this is not the light in which the mind can find peace in this great subject, nor do we think that here is the attractive power to draw us in prayer. We feel rather that such a reflection diverts the attention from the Object whence comes the impulse, life, and strength of prayer.", "source": "With Christ in the School of Prayer"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Prayer is not only for spiritual cultivation but even more for receiving answers from God.", "source": "Messages for Building Up New Believers (1)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Our prayer life has got to be on a heavenly basis.", "source": "Daily Open Windows"}], "declarations": ["I declare: I ask and it shall be given me.", "I declare: I seek and I find, I knock and the door is opened."], "prayer": "Lord Jesus, You bid me ask. Give me boldness to come, and faith to receive what I ask according to Your will.", "theme_flag": "theme-based: Sparks"}, {"day": 144, "ref": "Matthew 9:13", "book": "Matthew", "chapter": 9, "verse": 13, "text": "But go ye and learn what that meaneth, I will have mercy, and not sacrifice: for I am not come to call the righteous, but sinners to repentance.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "He still sees that the harvest is plenteous and the labourers few. That is to say, He still sees every door open to address the people and He passes over the wickedness of the Pharisees. Let us sum up what we find in the chapter, the grace developed in Israel. First, grace healing and forgiving as in Psalm ciii. Then grace come to call sinners, not the righteous ; the bridegroom was there, nor could grace in power be put in Jewish and Pharisaic vessels ; it w^as new even in respect of John Baptist. He comes in reality to give life to the dead, not to heal, but whoever then touched Him by faith — for there were such were healed in the way.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "In due time, the special gift may come; but we want first and now, the power of the Holy Ghost working something far mightier and more effectual in us than any such gift. We should seek, therefore, not only a baptism of power, but a baptism of holiness; we should seek that the inner nature be sanctified by the indwelling of Jesus, and then other power will come as needed. There is a third question: --Suppose some one says to me: --\"I have given myself up to be filled with the Spirit, and I do not feel that there is any difference in my condition; there is no change of experience that I can speak of. What must I then think?", "source": "The Deeper Christian Life"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Christ came to earth to bear the judgment of our sins and suffer their consequences in order that we may be forgiven.", "source": "The Normal Christian Faith"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "We may speak and act wrongly, but for every Christian there is a refuge, a mercy seat.", "source": "Open Windows, Jul 5 (The On-High Calling)"}], "declarations": ["I declare: Christ came to call sinners, not the righteous.", "I declare: I receive His mercy, and I show mercy."], "prayer": "Lord Jesus, You came for sinners like me. Let Your mercy flow through me to others who need it.", "theme_flag": "theme-based: Murray, Sparks"}, {"day": 145, "ref": "Matthew 10:32", "book": "Matthew", "chapter": 10, "verse": 32, "text": "Whosoever therefore shall confess me before men, him will I confess also before my Father which is in heaven.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "But Christ was to be more precious than father or mother, and even than a man's own life. He who would save his life at the expense of his testimony to Christ should lose it ; he who would lose it for the sake of Christ should gain it. He also who should receive this testimony, in the person of the disciples, received Christ, and, in Christ, Him that sent Him. God, therefore, being thus acknowledged in the person of His witnesses on earth, would bestow, on whoever received the latter, a reward according to the testimony rendered.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "In the disciple who bears much fruit, the Father is glorified. Before men and angels, proof is given of the glory of God's grace and power; God's glory shines out through him. This is what Peter means when he writes: \"He that ministers, let him minister as of the ability that God giveth, that God in all things may be glorified through Jesus Christ.\" As a man works and serves in a power which comes from God alone, God gets all the glory. When we confess that the ability came from God alone, he that does the work, and they who see it, equally glorify God. It was God who did it. Men judge by the fruit of a garden of what the gardener is.", "source": "The True Vine"}, {"name": "Watchman Nee", "short": "Nee", "comment": "As true Christians, they have life in Christ, and they have a testimony before men.", "source": "Sit, Walk, Stand"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "By that inflammation and ache the Holy Spirit is giving a positive witness against this thing.", "source": "The Cup and The Fire"}], "declarations": ["I declare: I confess Christ before men without shame.", "I declare: He will confess me before His Father in heaven."], "prayer": "Lord Jesus, give me courage to own You openly. Let my life confess You before all men.", "theme_flag": "theme-based: Murray, Nee, Sparks"}, {"day": 146, "ref": "Matthew 11:28", "book": "Matthew", "chapter": 11, "verse": 28, "text": "¶ Come unto me, all ye that labour and are heavy laden, and I will give you rest.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Whom does He call ? What does He bestow on those who come ? Only source of blessing and revealer of the Father, He calls all those who are weary and heavy laden. Perhaps they did not know the spring of all misery, namely, separation from God, sin. He knew, and He alone could heal them. If it was the sense of sin which burdened them, so much the better. Every way the world no longer satisfied their hearts ; they were miserable, and therefore the objects of the heart of Jesus. Moreover He would give them rest; He does not here explain by what means ; He simply announces the fact.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "And yet you have had to complain of disappoint- ment: as time went on, your expectations were not realized, The blessings you once enjoyed were lost ; the love and joy of your first Ineeting with your Saviour, instead of deepening, have become faint and fesble. And often you have wondered what the reason could be, that with such a Saviour, so mighty ABIDE IN CHRIST: and so loving, your experience of salvation should not have been a fuller one, The answer is very simple, You wandered from Him. The blessings He bestows are all connected with His ‘Come to ME, and are only to be enjoyed in close fellowship with Himself.", "source": "Abide in Christ"}, {"name": "Watchman Nee", "short": "Nee", "comment": "The Lord Jesus asks us not to work but to come and rest.", "source": "Notes on Scriptural Messages (1)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Jesus has appropriated the Sabbath to Himself. It is no longer a day of the week, it is a Divine Person.", "source": "Discipleship in the School of Christ"}], "declarations": ["I declare: I come to Christ, and He gives me rest.", "I declare: My heavy burdens are lifted by Him."], "prayer": "Lord Jesus, I am weary and heavy laden. I come to You now, and receive Your rest for my soul.", "theme_flag": null}, {"day": 147, "ref": "Matthew 11:29", "book": "Matthew", "chapter": 11, "verse": 29, "text": "Take my yoke upon you, and learn of me; for I am meek and lowly in heart: and ye shall find rest unto your souls.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Christ, in the consciousness of His rejection, in the deep sorrow caused by the unbelief of the cities in which He had wrought so many miracles, had just manifested the most entire submission to His Father, and had found therein perfect rest to His soul. To this He calls all that heard Him, all that felt the need of rest to their own souls. \" Take my yoke upon you, and learn of me,\" that is to say, the yoke of entire submission to His Father's will, learning of Him how to meet the troubles of life ; for He was \" meek and lowly in heart,\" content to be in the lowest place at the will of His God. In fact nothing can overthrow one who is there.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Look at the commencement of His ministry. In the Beatitudes with which the Sermon on the Mount opens, He speaks: _'Blessed are the poor in spirit; for theirs is the kingdom of heaven. Blessed are the meek; for they shall inherit the earth.'_ The very first words of His proclamation of the kingdom of heaven reveal the open gate through which alone we enter. The poor, who have nothing in themselves, to them the kingdom comes. The meek, who seek nothing in themselves, theirs the earth shall be. The blessings of heaven and earth are for the lowly. For the heavenly and the earthly life, humility is the secret of blessing.", "source": "Humility"}, {"name": "Watchman Nee", "short": "Nee", "comment": "If we would be like our Lord who accepts all kinds of restriction without any struggling, we would have rest.", "source": "Notes on Scriptural Messages (1)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "The impulsive, hot, fiery Moses has to become the quiet, patient, meek Moses.", "source": "The Cross and the Way of Life"}], "declarations": ["I declare: I take His yoke upon me and learn of Him.", "I declare: He is meek and lowly in heart, and I find rest."], "prayer": "Lord Jesus, meek and lowly in heart, teach me Your gentleness. Let me learn of You and find rest unto my soul.", "theme_flag": "theme-based: Sparks"}, {"day": 148, "ref": "Matthew 11:30", "book": "Matthew", "chapter": 11, "verse": 30, "text": "For my yoke is easy, and my burden is light.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Christ, in the consciousness of His rejection, in the deep sorrow caused by the unbelief of the cities in which He had wrought so many miracles, had just manifested the most entire submission to His Father, and had found therein perfect rest to His soul. To this He calls all that heard Him, all that felt the need of rest to their own souls. \" Take my yoke upon you, and learn of me,\" that is to say, the yoke of entire submission to His Father's will, learning of Him how to meet the troubles of life ; for He was \" meek and lowly in heart,\" content to be in the lowest place at the will of His God. In fact nothing can overthrow one who is there.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "God gives us Christ, and in Him hid the treasures of wisdom and knowledge. O let us be content to possess Christ, to dwell in Him, to make Him our life, and only in a deeper searching into Him, to search and find the knowledge we desire. Such knowledge is life indeed. Therefore, believer, abide in Jesus as your wisdom, and expect from Him most confidently whatever teaching you may need for a life to the glory of the Father. In all that concerns your spiritual life, abide in Jesus as your wisdom.", "source": "Abide in Christ"}, {"name": "Watchman Nee", "short": "Nee", "comment": "He knows how to apportion His yoke; He knows our strength. We can be at rest.", "source": "Notes on Scriptural Messages (1)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Remember that you are in the Land; you are in Christ; you have Him as your Rest.", "source": "The Essential Newness of the New Creation"}], "declarations": ["I declare: His yoke is easy and His burden is light.", "I declare: I walk with Him in perfect rest."], "prayer": "Lord Jesus, Your yoke is easy. I lay down my striving and walk with You in lightness of heart.", "theme_flag": "theme-based: Murray, Sparks"}, {"day": 149, "ref": "Matthew 16:24", "book": "Matthew", "chapter": 16, "verse": 24, "text": "¶ Then said Jesus unto his disciples, If any man will come after me, let him deny himself, and take up his cross, and follow me.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "But the Lord, in faithfulness, rejects Peter in this matter, and teaches His disciples that the only path, the appointed and necessary path, is the cross ; if any one would follow Him, that is the path He took. Moreover what would it profit a man to save his life and lose all — to gain the world and lose his soul ? For this was the question,* and not now the outward glory of the kingdom. * In the EiDistle of Peter we continually find these same thoughts — the words, \"living hope,\" \"living stone \" — applied to Christ, and afterwards to Christians.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "When Christ had spoken to him about His sufferings, and said: \"Get thee behind me, Satan,\" He followed it up by saying: \"If any man will come after me, let him deny himself, and take up his cross, and follow me\" (Matt. 16:24). No man can follow Him unless he do that. Self must be utterly denied. What does that mean? When Peter denied Christ, we read that he said three times: \"I do not know the man\"; in other words: \"I have nothing to do with Him; He and I are no friends; I deny having any connection with Him.\" Christ told Peter that he must deny self. Self must be ignored, and its every claim rejected.", "source": "Absolute Surrender"}, {"name": "Watchman Nee", "short": "Nee", "comment": "He must be willing to be conformed to the Lord's death.", "source": "The Christian Life and Warfare"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "As for me, may I never boast about anything except the cross of our Lord Jesus Christ.", "source": "Daily Open Windows"}], "declarations": ["I declare: I deny myself, take up my cross, and follow Him.", "I declare: I lose my life for His sake and find it."], "prayer": "Lord Jesus, I choose the path of the cross. Let self be denied, and let me follow You wholly.", "theme_flag": "theme-based: Sparks"}, {"day": 150, "ref": "Matthew 18:20", "book": "Matthew", "chapter": 18, "verse": 20, "text": "For where two or three are gathered together in my name, there am I in the midst of them.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Jewish body are sent out from Galilee as an accepted body to the world to evangelise the Gentiles, and He declares He will be with them to the end of the age. So here He is in the midst of two or three gathered to His name. The church here is not the body by the baptism of the Holy Ghost ; it is not the house where the Holy Ghost dwells on earth ; but where the two or three meet to His name, there Christ is. Now I do not doubt that all good from life on, and the word of life, comes from the Spirit, but this is another thing, and the assembly here is not the body, nor the house, through the coming down of the Holy Ghost.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "He longs to reveal His power and glory as God, His saving love, more abundantly. He seeks intercessors in larger number, in greater power, to prepare the way of the Lord. He seeks them. Where could He seek them but in His Church? And how does He expect to find them? He intrusted to His Church the task of telling of their Lord's need, the task of encouraging and training, and preparing them for His holy service. And He ever comes again, seeking fruit, seeking intercessors. In His Word He has spoken of the \"widows indeed, who trust in God, and continue in supplication night and day.\"", "source": "The Ministry of Intercession"}, {"name": "Watchman Nee", "short": "Nee", "comment": "The basic requirement for brothers and sisters to pray together is to be in one accord.", "source": "Messages for Building Up New Believers (1)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "The thing that God is doing in this dispensation is the formation of a spiritual and heavenly Israel.", "source": "The On-High Calling, Vol. I and Vol. II"}], "declarations": ["I declare: Where two or three gather in His name, He is there.", "I declare: I meet Him in the midst of His people."], "prayer": "Lord Jesus, You are in our midst. Meet us as we gather in Your name, and make Your presence known.", "theme_flag": "theme-based: Murray, Sparks"}, {"day": 151, "ref": "Matthew 19:14", "book": "Matthew", "chapter": 19, "verse": 14, "text": "But Jesus said, Suffer little children, and forbid them not, to come unto me: for of such is the kingdom of heaven.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "All is intrinsic and eternal in its nature, for God is revealed already. Christ judges everything that has a bad effect on the heart, and acts upon its selfishness, and thus separates it from God. \"Sell that thou hast,\" says He, \"and follow me.\" Alas ! the young man could not renounce his possessions, his ease, himself. \"Hardly,\" says Jesus, \"shall a rich man enter into the kingdom.\" This was manifest : it was the kingdom of God, of heaven ; self and the world had no place in it. The disciples, who did not understand that there is no good in man, were astonished that one so favoured and well disposed should be still far from salvation.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "God gives us Christ, and in Him hid the treasures of wisdom and knowledge. O let us be content to possess Christ, to dwell in Him, to make Him our life, and only in a deeper searching into Him, to search and find the knowledge we desire. Such knowledge is life indeed. Therefore, believer, abide in Jesus as your wisdom, and expect from Him most confidently whatever teaching you may need for a life to the glory of the Father. In all that concerns your spiritual life, abide in Jesus as your wisdom.", "source": "Abide in Christ"}, {"name": "Watchman Nee", "short": "Nee", "comment": "The Son of God had become sin and had borne the judgment.", "source": "The Gospel of God (1)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "God stands by His children and only works with them on the basis of an inward relationship.", "source": "Open Windows, Mar 14 (Christ Our All)"}], "declarations": ["I declare: Of such is the kingdom of heaven.", "I declare: I come to Him with childlike faith."], "prayer": "Lord Jesus, receive me as a little child. Give me a simple, trusting heart toward You.", "theme_flag": "theme-based: Murray, Sparks"}, {"day": 152, "ref": "Matthew 22:37", "book": "Matthew", "chapter": 22, "verse": 37, "text": "Jesus said unto him, Thou shalt love the Lord thy God with all thy heart, and with all thy soul, and with all thy mind.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Chapter xxiii. clearly shews how far the disciples are viewed in connection with the nation, inasmuch as they were Jews, although the Lord judges the leaders, who beguiled the people and dishonoured God by their hypocrisy. He speaks to the multitude and to His disciples, saying, \" The scribes and the Pharisees sit in Moses' seat.\" Being thus expositors of the law, they were to be obeyed in all that they said according to that law, although their own conduct was but hypocrisy. That which is important here is the position of the disciples ; it is in fact the same as that of Jesus.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "And therefore I say to every reader who has taken the vow of full obedience--and dare we count ourselves true Christians if we have not done so?--place yourself at once and wholly at Christ's disposal. As binding, as is the first great command on all God's people, Thou shalt love the Lord thy God, with all thy heart,' is this the last great command too-- The gospel to every creature.' Ere you know what your work may be, ere you feel any special desire or call or fitness for any work,--if you are willing to accept the command, place yourself at His disposal. It is His as Master to train and fit and guide and use you.", "source": "The School of Obedience"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Christ did away with sin through His death and nullified death through His resurrection.", "source": "CW Q21, 'Concerning resurrection and salvation'"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Three things will last forever, faith, hope, and love, and the greatest of these is love.", "source": "Open Windows, Jan 17 (The Increase of God)"}], "declarations": ["I declare: I love the Lord my God with all my heart.", "I declare: I love Him with all my soul and all my mind."], "prayer": "Lord Jesus, You are worthy of all my love. Fill my heart, soul, and mind with love for You.", "theme_flag": "theme-based: Murray, Sparks"}, {"day": 153, "ref": "Matthew 24:35", "book": "Matthew", "chapter": 24, "verse": 35, "text": "Heaven and earth shall pass away, but my words shall not pass away.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "He will appear doubtless as the lightning with regard to the apostasy, which will be as a dead body in His sight. But when He shall come solemnly to take His earthly place in glory, that will not pass av7ay like lightning. He shall sit upon the throne of His glory, and all nations shall be gathered before Him on His throne of judgment, and they shall be judged according to their treatment of the messengers of the kingdom, who had gone out to preach it unto them. These messengers are the brethren (ver. 40) ; those who had received them are the sheep ; those who had neglected their message are the goats.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "In meditating, therefore, upon these utterances of Christ, containing as they do the very essence of His teaching, the very concentration of His love, let us, at the outset, put away all tendency to doubt. Let us not allow ourselves so much as to question whether such erring disciples as we are can be enabled to attain the holiness to which we are called through a close and intimate union with our Lord. If there be any impossibility, any falling short of the proposed blessedness, it will arise from the lack of earnest desire on our part.", "source": "Abide in Christ"}, {"name": "Watchman Nee", "short": "Nee", "comment": "The word of the Lord endures longer than heaven and earth.", "source": "Study on Matthew"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "That is what the Word of God does. The words are the statements; the voice is the meaning.", "source": "Features of Zion"}], "declarations": ["I declare: His words shall never pass away.", "I declare: I build my life on His eternal word."], "prayer": "Lord Jesus, Your word endures forever. Let it be the foundation of my life, unshaken and sure.", "theme_flag": "theme-based: Murray, Sparks"}, {"day": 154, "ref": "Matthew 25:40", "book": "Matthew", "chapter": 25, "verse": 40, "text": "And the King shall answer and say unto them, Verily I say unto you, Inasmuch as ye have done it unto one of the least of these my brethren, ye have done it unto me.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Now such was His affection for His faithful servants, so highly did He value them, that He judged those to whom the testimony was sent according to the manner in which they had received these messeno^ers, whether well or ill, as thouo-h it had been done to Himself. What an encouragement for His witnesses during that time of trouble, tried as their faith should be in service ! At the same time it was justice morally to those who were judged; for they had rejected the testimony by whomsoever it was rendered. We have also the result of their conduct, both the one and the other.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Christ's power to save, and save completely, depends on His unceasing intercession. The apostles withdrawing themselves from other work to give themselves continually to prayer was followed by the number of the disciples multiplying exceedingly. As we, in our day, give ourselves to intercession, we shall have more and mightier conversions. Let us plead for this. Christ is exalted to give repentance. The Church exists with the Divine purpose and promise of having conversions. Let us not be ashamed to confess our sin and feebleness, and cry to God for more conversions in Christian and heathen lands, of those too whom you know and love.", "source": "The Ministry of Intercession"}, {"name": "Watchman Nee", "short": "Nee", "comment": "The evil ones are punished solely on the ground that they did not treat the Christians well.", "source": "Study on Matthew"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "In this very moment in Christ we can touch our brethren six or seven thousand miles away.", "source": "Discipleship in the School of Christ"}], "declarations": ["I declare: What I do unto the least, I do unto Him.", "I declare: I serve Christ in serving others."], "prayer": "Lord Jesus, open my eyes to see You in the least of these. Let me serve You by serving them.", "theme_flag": "theme-based: Murray, Sparks"}, {"day": 155, "ref": "Matthew 28:18", "book": "Matthew", "chapter": 28, "verse": 18, "text": "And Jesus came and spake unto them, saying, All power is given unto me in heaven and in earth.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Hence we have not the ascension of Christ at all in this Gospel, but all power is given unto Him in heaven and in earth, and accordingly the commission given to His disciples extends to all nations (Gentiles). To them they were to proclaim His rights, and make disciples of them. It was not however the name of the Lord only, nor in connection with His throne at Jerusalem. Lord of heaven and earth, His disciples were to proclaim Him throuo'hout all nations, foundinaj their doctrine on the confession of the Father, of the Son, and of the Holy Ghost. They vv^ere to teach, not the law, but the precepts of Jesus.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Omnipotence was now entrusted to the man Christ Jesus, that from henceforth through the channels of human nature it might put forth its mighty energies. Hence He connected with this revelation of what He was to receive, the promise of the share that His disciples would have in it: When I am ascended, ye shall receive power from on high (Luke xxiv. 49; Acts i.8). It is in the power of the omnipotent Saviour that the believer must find his strength for life and for work. It was thus with the disciples. During ten days they worshipped and waited at the footstool of His throne.", "source": "Abide in Christ"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Only those who have received the power of the Holy Spirit and the power of resurrection can testify for the Lord.", "source": "Conferences, Messages, and Fellowship (2): Conference in Amoy, October 1936"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "He is there at God's right hand. I would to God that this could come home to you by the Spirit.", "source": "Four Greatnesses of Divine Revelation"}], "declarations": ["I declare: All power is given unto Him in heaven and in earth.", "I declare: I go in His authority."], "prayer": "Lord Jesus, all power is Yours. Send me forth in Your authority to the nations.", "theme_flag": "theme-based: Sparks"}, {"day": 156, "ref": "Matthew 28:19", "book": "Matthew", "chapter": 28, "verse": 19, "text": "¶ Go ye therefore, and teach all nations, baptizing them in the name of the Father, and of the Son, and of the Holy Ghost:", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Hence we have not the ascension of Christ at all in this Gospel, but all power is given unto Him in heaven and in earth, and accordingly the commission given to His disciples extends to all nations (Gentiles). To them they were to proclaim His rights, and make disciples of them. It was not however the name of the Lord only, nor in connection with His throne at Jerusalem. Lord of heaven and earth, His disciples were to proclaim Him throuo'hout all nations, foundinaj their doctrine on the confession of the Father, of the Son, and of the Holy Ghost. They vv^ere to teach, not the law, but the precepts of Jesus.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Let me try in this first chapter to prepare the way for the study of what obedience is, by showing you where to go in God's Word to find the mind of God concerning it. 1. TAKE SCRIPTURE AS A WHOLE. We begin with Paradise. In Gen. 2:16, we read: And the Lord God commanded the man, saying.' And later (3:11), Hast thou eaten of the tree, whereof I commanded thee that thou shouldest not eat?' Note how obedience to the command is the one virtue of Paradise, the one condition of man's abiding there, the one thing his Creator asks of him. Nothing is said of faith, or humility, or love: obedience includes all.", "source": "The School of Obedience"}, {"name": "Watchman Nee", "short": "Nee", "comment": "According to the Bible, there is only one requirement for being saved: to believe.", "source": "CW Q43, 'Concerning the requirements for salvation'"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Therefore, as you go, disciple people in all nations.", "source": "Four Greatnesses of Divine Revelation"}], "declarations": ["I declare: I go and make disciples of all nations.", "I declare: I teach them to observe all He commanded."], "prayer": "Lord Jesus, make me Your witness. Use me to bring others into Your kingdom.", "theme_flag": "theme-based: Murray, Sparks"}, {"day": 157, "ref": "Matthew 28:20", "book": "Matthew", "chapter": 28, "verse": 20, "text": "Teaching them to observe all things whatsoever I have commanded you: and, lo, I am with you alway, even unto the end of the world. Amen.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "He would be with them, with the disciples who thus confessed Him, unto the end of the age. It is this which connects all that will be accomplished until Christ sits upon the great white throne, with the testimony that He Himself rendered on the earth in the midst of Israel. It is the testimony of the kingdom, and of its Head, once rejected by a people that knew Him not. It links the testimony to the nations with a remnant in Israel owning Jesus as Messiah but now risen from the dead, as He had said, but not to a Christ known as ascended on high.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "He counts on His disciples to undertake and carry out the work. As He stands at the foot of the throne, ready to ascend and reign, He tells them, All authority hath been given unto Me in heaven and on earth,' and points them at once to all the world,' to the uttermost parts of the earth,' as the object of His and their desire and efforts. As the King on the throne, He Himself will be their helper: I am with you alway.' They are to be the advance guard of His conquering hosts even to the end of the world. He Himself will carry on the war.", "source": "The School of Obedience"}, {"name": "Watchman Nee", "short": "Nee", "comment": "He lives always to intercede for us.", "source": "The Christian (2): Meditations on Revelation"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "He is there at God's right hand. I would to God that this could come home to you by the Spirit, for what differences it would make.", "source": "Four Greatnesses of Divine Revelation"}], "declarations": ["I declare: He is with me alway, even unto the end.", "I declare: I never walk alone."], "prayer": "Lord Jesus, You are with me always. Let me live in the consciousness of Your abiding presence.", "theme_flag": "theme-based: Murray, Sparks"}, {"day": 158, "ref": "Mark 8:34", "book": "Mark", "chapter": 8, "verse": 34, "text": "¶ And when he had called the people unto him with his disciples also, he said unto them, Whosoever will come after me, let him deny himself, and take up his cross, and follow me.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "The Lord calls the people and His disciples, and explains distinctly to them that if they would follow Him, they must take part with Him, and bear their cross. For thus, in losing their life, they would save it, and the soul was worth all beside. Moreover, if any one was ashamed of Jesus and of His words, the Son of man would be ashamed of him, when He should come in the glory of His Father with the holy angels. For glory belonged to Him, whatever might be His humiliation. He then sets this before His chief disciples, in order to strengthen their faith.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "When Christ had spoken to him about His sufferings, and said: \"Get thee behind me, Satan,\" He followed it up by saying: \"If any man will come after me, let him deny himself, and take up his cross, and follow me\" (Matt. 16:24). No man can follow Him unless he do that. Self must be utterly denied. What does that mean? When Peter denied Christ, we read that he said three times: \"I do not know the man\"; in other words: \"I have nothing to do with Him; He and I are no friends; I deny having any connection with Him.\" Christ told Peter that he must deny self. Self must be ignored, and its every claim rejected.", "source": "Absolute Surrender"}, {"name": "Watchman Nee", "short": "Nee", "comment": "He must be fully willing in his heart to accept the result of all the working of the cross.", "source": "The Christian Life and Warfare"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "It is Christ in that fullness, which is more than our salvation, more than our initial salvation.", "source": "God's Supreme Interest in Man"}], "declarations": ["I declare: I deny myself and take up my cross.", "I declare: I follow Him, whatever the cost."], "prayer": "Lord Jesus, I will follow You. Give me grace to deny self daily and walk in Your steps.", "theme_flag": "theme-based: Murray, Sparks"}, {"day": 159, "ref": "Mark 9:23", "book": "Mark", "chapter": 9, "verse": 23, "text": "Jesus said unto him, If thou canst believe, all things are possible to him that believeth.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "IX. of the remnant — faith that required support on account of the unbelief under which it was buried. Israel was in no better condition than the poor child. But power was present, capable of all things. That was not the difficulty. Is there faith to profit by it ? was the question. \" If thou canst,\" said the afflicted father to Jesus. \" If thou canst \" (replied the Lord) applies to thy faith ; \" if thou canst believe, all things are possible.\" The poor father, true of heart, confesses his own state with grief, and seeks, in the goodness of Christ, help for his failure. Thus the position of Israel was plainly shewn forth.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "\"If thou canst believe, all things are possible to him that believeth\" (Mark 9:23). And his heart was afraid, and he cried out: \"Lord, I believe, help thou mine unbelief\" (Mark 9:24). That was a faith that triumphed over the Devil, and the evil spirit was cast out. And if you come and say: \"Lord, I yield myself in absolute surrender to my God,\" even though it be with a trembling heart and with the consciousness: \"I do not feel the power, I do not feel the determination, I do not feel the assurance,\" it will succeed. Be not afraid, but come just as you are, and even in the midst of your trembling the power of the Holy Spirit will work.", "source": "Absolute Surrender"}, {"name": "Watchman Nee", "short": "Nee", "comment": "In sickness, the question is not whether I can or cannot but whether you believe or not.", "source": "The Spiritual Man (3)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "No, we are coming to a living Person; we believe that He is!", "source": "Daily Open Windows"}], "declarations": ["I declare: All things are possible to him that believeth.", "I declare: I believe, Lord, help my unbelief."], "prayer": "Lord Jesus, increase my faith. Let all things be possible as I believe in You.", "theme_flag": "theme-based: Nee, Sparks"}, {"day": 160, "ref": "Mark 10:27", "book": "Mark", "chapter": 10, "verse": 27, "text": "And Jesus looking upon them saith, With men it is impossible, but not with God: for with God all things are possible.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Advantages were but hindrances. That which is death to the flesh must be gone through : we must have divine righteousness, and enter in spirit (hereafter in fact) into another world, in order to follow Him and to be with Him — to \"win Christ.\" Solemn lesson ! In result, God alone is good, and — sin having come in — it is impossible, if He be manifested, that man can be in relationship with God ; but with Him all is possible. The cross is the only path to God. Christ leads to it, and we must follow Him in this path, which is that of eternal life.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "But the things that are impossible with men are possible with God. If the Lord Himself will keep the soul night and day, yea, will watch and water it every moment, then surely the un- interrupted communion with Jesus becomes a blessed possibility to those who can trust God: to mean and to do what He says. Then surely the abiding of the branch of the vine day and night, summer and winter, in a never-ceasing life-fellow- ship, is nothing less than the simple but certain promise of your abiding in your Lord. In one sense, it is true, there is no believer who does not always abide in Jesus; without this there could not be true life.", "source": "Abide in Christ"}, {"name": "Watchman Nee", "short": "Nee", "comment": "When we give up the case, then God will take it up.", "source": "The Normal Christian Life"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "There are two ways of viewing the impossible. Everything depends upon where you put the impossibility, on the thing or on God.", "source": "Daily Open Windows"}], "declarations": ["I declare: With men it is impossible, but with God all things are possible.", "I declare: I trust not in man but in God."], "prayer": "Lord Jesus, what I cannot do, You can. I rest in Your almighty power to do the impossible.", "theme_flag": "theme-based: Murray, Nee"}, {"day": 161, "ref": "Mark 10:45", "book": "Mark", "chapter": 10, "verse": 45, "text": "For even the Son of man came not to be ministered unto, but to minister, and to give his life a ransom for many.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "The cross is the only path to God. Christ leads to it, and we must follow Him in this path, which is that of eternal life. A child-like spirit enters into it by grace ; the spirit of service and of selfrenunciation walks in it. Christ walked in it, giving His life a ransom for many. This part of the Lord's instruction ends here. Lowliness of service is the place into which Christ brings us ; in such He had walked. This chapter is worthy of all the attention which the Christian through grace can devote to it. It speaks of the ground man can stand upon, how far God owns what is natural, and the disciples' path down here.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "God’s way is ever first to give us, even though it be but as a seed, the thing itself, the life and the power, and then the knowledge. Man secks the knowledge first, and often, alas! never gets beyond it. God gives us Christ, and in Him hid the treasures of wisdom and knowledge. O let us be content to possess Christ, to dwell in Him, to make Him our life, and only in a deeper searching into Him, to search and find the knowledge we desire. Such knowledge is life indeed. Therefore, believer, abide in Jesus as your wisdom,
