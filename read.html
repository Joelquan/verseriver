 in Christ, I am strong.", "source": "quoted at christianquotes.info"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "If you only know Me, things will happen. I am going to bear this fruit through you by way of union and fellowship.", "source": "Open Windows"}], "declarations": ["I declare: I abide in Christ the vine and I bear much fruit.", "I declare: Apart from Jesus I can do nothing, but in Him I am fruitful."], "prayer": "Lord Jesus, help me to abide in You today. Bear Your fruit through my life. Amen.", "theme_flag": null}, {"day": 200, "ref": "John 15:13", "book": "John", "chapter": 15, "verse": 13, "text": "Greater love hath no man than this, that a man lay down his life for his friends.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "It is the joy He had down here, just as He left us His own peace, and will give us His own glory. t He does not say \"loveth me,\" hut \"hath loved me ;\" that is, He does not speak merely of the eternal love of the Father loved them in this same way ; but He had also been a companion, a servant, in this love. Thus the discipleswere to love one another with a love that rose above all the weaknesses of others, and which was at the same time brotherly, and caused the one who felt it to be the servant of his brother. It went so far as to lay down life itself for one's friends. Now, to Jesus, he who obeyed Him was His friend.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "\"Greater love hath no man than this, that a man give his life for his friends.\" The life is the most precious thing a man has; the life is all he is; the life is himself. This is the highest measure of love: when a man gives his life, he hold nothing back, he gives all he has and is. It is this our Lord Jesus wants to make clear to us concerning His mystery of the Vine; with all He has He has placed Himself at our disposal. He wants us to count Him our very own; He wants to be wholly our possession, that we may be wholly His possession.", "source": "True Vine: Christ's Friendship"}, {"name": "Watchman Nee", "short": "Nee", "comment": "The nature of God's love is unchangeable.", "source": "quoted at m.timelesslife.info"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "It is indeed a very wonderful and beautiful thing that the Son of God called such as we are, His friends.", "source": "Ye Are My Friends"}], "declarations": ["I declare: Jesus laid down His life for me, His friend.", "I declare: I am loved by Christ with the greatest love."], "prayer": "Lord Jesus, thank You for laying down Your life for me. Teach me to love as You love. Amen.", "theme_flag": null}, {"day": 201, "ref": "John 16:33", "book": "John", "chapter": 16, "verse": 33, "text": "These things I have spoken unto you, that in me ye might have peace. In the world ye shall have tribulation: but be of good cheer; I have overcome the world.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "They fancied themselves quite in the light ; but they had apprehended nothing that raised them above the effect of Christ's rejection, which the belief that He came from the Father and was going to the Father would have done. Jesus therefore declares to them, that His death would scatter them, and that they would forsake Him. His Father would be with Him ; He should not be alone. Nevertheless He had explained all these things to them, in order that they should have peace in Him. In the world that rejected Him they should have tribulation ; but He had overcome the world, they might be of good cheer.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "We have offered up ourselves to God. We are not of the world, even as Thou art not of the world. Lord, let our mind be enlightened by the renewing of the Holy Ghost, that we may rightly see what the spirit of this world is. And let it be seen in us that we are not of this world, but are conformed to Jesus. Amen. 1. Worldly pleasures. Is dancing sin? What harm is there in playing billiards? Why may a Christian not go to the play? One has sometimes wished that there were in the Scriptures a distinct law to forbid such things. God has intentionally not given this. If there were such a law, it would make men only externally pious.", "source": "The New Life"}, {"name": "Watchman Nee", "short": "Nee", "comment": "The key to victory is always our faith relationship with the victorious Son.", "source": "Lights in the World"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "May the Lord give us the faith which is the victory which overcomes!", "source": "The Victory That Overcomes"}], "declarations": ["I declare: In Christ I have peace though the world gives tribulation.", "I declare: Jesus has overcome the world and I overcome in Him."], "prayer": "Lord Jesus, You have overcome the world. Give me Your peace in the midst of trouble today. Amen.", "theme_flag": "theme-based: Sparks"}, {"day": 202, "ref": "John 17:3", "book": "John", "chapter": 17, "verse": 3, "text": "And this is life eternal, that they might know thee the only true God, and Jesus Christ, whom thou hast sent.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "The hour was come to glorify the Son, in order that from the glory He might glorify the Father. This is, speaking generally, the new position. His career here was finished, and He had to ascend on high. Two things were connected with this — power over all flesh, and the gift of eternal life to as many as the Father had given Him. \" The head of every man is Christ.\" Those whom the Father had given Him receive eternal life from Him who has gone up on high. Eternal life was the knowledge of the Father, the only true God, and of Jesus Christ, whom He had sent.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "And now if you ask me what is to be the great blessing to be sought, my answer is this: Not only should we think about Jesus Himself and speak about Him and believe in Him, but we should come to the point that the disciples in the text arrived at, \"and they knew Him.\" Everything is to be found in that. If I read that story of the disciples on the way to Emmaus, I get from it four stages in the Christian life. Just think! How did they begin the morning that day? With _Hearts sad and troubled_, because they thought Jesus was dead. They did not know that He was alive, and that is the state of very many Christians.", "source": "Jesus Himself"}, {"name": "Watchman Nee", "short": "Nee", "comment": "God's word gives us eternal life through faith in Christ Jesus.", "source": "The Better Covenant"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Everything related to human destiny is bound up with the knowledge of Christ.", "source": "Fundamental Questions of the Christian Life"}], "declarations": ["I declare: I know the only true God and Jesus Christ whom He sent.", "I declare: Eternal life is knowing Christ personally."], "prayer": "Lord Jesus, I want to know You more. Reveal Yourself to me today. Amen.", "theme_flag": null}, {"day": 203, "ref": "John 19:30", "book": "John", "chapter": 19, "verse": 30, "text": "When Jesus therefore had received the vinegar, he said, It is finished: and he bowed his head, and gave up the ghost.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "He knows that now there is not one detail left of all that was to be accomplished. He bows His head, and Himself gives up His spirit.", "source": "Darby's Synopsis, John, chapter 19 section"}, {"name": "Andrew Murray", "short": "Murray", "comment": "With that word He uttered the truth of the gospel of our redemption, that all that was needed for man's salvation had been accomplished on the cross.", "source": "Andrew Murray, The Secret of the Cross, Day 15 (stauros.org.za)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "He has done everything on the Cross for our forgiveness and He will do everything in us for our deliverance. In both cases He is the doer.", "source": "Watchman Nee, The Normal Christian Life, ch. 13 (ccel.org)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "The work is finished, completed.", "source": "T. Austin-Sparks, The On-High Calling, Vol. 1, ch. 5, The Changed Position of the Companions (austin-sparks.net/english/books/000970.html)"}], "declarations": ["I declare: It is finished. Jesus completed the work of my salvation.", "I declare: I rest in the finished work of Christ on the cross."], "prayer": "Lord Jesus, thank You for finishing the work. I rest in what You accomplished for me. Amen.", "theme_flag": null}, {"day": 204, "ref": "Acts 3:19", "book": "Acts", "chapter": 3, "verse": 19, "text": "¶ Repent ye therefore, and be converted, that your sins may be blotted out, when the times of refreshing shall come from the presence of the Lord;", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "He preaches repentance to the Jews as a nation, declaring that, on their repentance, Jesus, who had ascended up to heaven, would return; and the fulfilment of all the blessings spoken of by the prophets should take place.", "source": "Darby's Synopsis, Acts, chapter 3 section"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Without repentance no real faith, without faith no true repentance.", "source": "Andrew Murray, Why Do You Not Believe?, ch. 7 (swartzentrover.com)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Repentance ... means a change of mind!", "source": "Watchman Nee, quoted at booksminority.net"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "God has given His people respite periods from struggle or opposition, and graciously continues to do so.", "source": "T. Austin-Sparks, The Times of Restitution, Towards the Mark, Vol. 15, No. 4 (Austin-Sparks.Net/mags/ttm15-4.html)"}], "declarations": ["I declare: I repent and am converted, and my sins are blotted out.", "I declare: Times of refreshing come from the presence of the Lord."], "prayer": "Lord Jesus, I repent today. Blot out my sins and refresh my soul with Your presence. Amen.", "theme_flag": null}, {"day": 205, "ref": "Acts 4:12", "book": "Acts", "chapter": 4, "verse": 12, "text": "Neither is there salvation in any other: for there is none other name under heaven given among men, whereby we must be saved.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Peter, full of the Holy Ghost, declares—announcing it to all Israel, and with the utmost readiness and entire boldness—that it was by Jesus, whom they had crucified, and whom God had raised from the dead. Thus the question between God and the rulers of Israel was very formally stated, and that by the Spirit of God. Jesus was the stone rejected by them, the builders, which had become the head of the corner. Salvation could nowhere else be found. No carefulness not to offend, with regard to the adversaries and the rulers ; with the people, as such, ignorant and misled, everything to win them.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "The body is part of our being; even the body has been saved by Christ, therefore it is in our body that our Father wills to manifest the power of i-edemptdon, and to let men see that Jesus lives. Oh, let us believe in the name of Jesus! Was it not in the name of Je.sus that perfect health was given to the im- potent man? And were not these words : \"Thy faith hath saved Ihee,\" pronounced when the body was healed? Let us seek- then to obtain divine healing. Wherever the Spirit acts with power, there He works divine healings.", "source": "Divine Healing"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Hence, the name equals authority. Where the name is, there is authority.", "source": "The Prayer Ministry of the Church"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Salvation is in the name of Jesus.", "source": "The Glory of the Name"}], "declarations": ["I declare: There is salvation in no other name but Jesus.", "I declare: I am saved by calling on the name of the Lord Jesus."], "prayer": "Lord Jesus, there is no other name. I call on You and I am saved. Amen.", "theme_flag": null}, {"day": 206, "ref": "Acts 10:43", "book": "Acts", "chapter": 10, "verse": 43, "text": "To him give all the prophets witness, that through his name whosoever believeth in him shall receive remission of sins.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "They only shewed that in every nation he who feared God was acceptable to Him—in a word, that the favour of God was not limited to the Jews, and that there was no need of becoming a Jew in order to share the salvation that is in Christ. The oneness of the body united to its Head in heaven was not brought out by this event; but it prepared the way for the promulgation of that truth, since in fact the Gentile was admitted on earth without becoming a Jew. The thing was done on earth individually, although the doctrine itself was not taught. Repentance unto life eternal was granted to the Gentiles as such.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Not only is wrath turned away from us, but the fulness of love now rests upon us. I will love them freely, for Mine anger is turned away from him.' Forgiveness is access to all the love of God. On this account, forgiveness is also introduction to all the other blessings of redemption. Live in the full assurance of forgiveness, and let the Spirit fill your heart with the certitude and the blessedness of it, and you shall have great confidence in expecting all from God. Learn from the word of God, through the Spirit, to know God aright, and to trust Him as the ever-forgiving God. That is His name and His glory.", "source": "The New Life"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Because the Lord Jesus died on the Cross, I have received the forgiveness of sins.", "source": "quoted at"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "The initial need and appeal of the unsaved sinner is to the Blood of the Lord Jesus. 'Without the shedding of blood there is no remission'.", "source": "The Blood, the Cross and the Name of the Lord Jesus"}], "declarations": ["I declare: Through faith in Jesus I receive forgiveness of sins.", "I declare: All the prophets witness that Christ saves."], "prayer": "Lord Jesus, thank You for forgiveness through Your name. I believe in You. Amen.", "theme_flag": null}, {"day": 207, "ref": "Acts 16:31", "book": "Acts", "chapter": 16, "verse": 31, "text": "And they said, Believe on the Lord Jesus Christ, and thou shalt be saved, and thy house.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Paul and Silas sing, instead of quietly sleeping; the doors burst suddenly open; and the gaoler himself is converted, and his family.", "source": "Darby's Synopsis, Acts, chapter 16 section"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Reader, it is given by grace to believe in Jesus.", "source": "Andrew Murray, Why Do You Not Believe?, ch. 31 (swartzentrover.com)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "In saving the world, therefore, He does not try to alter man's flesh; He instead gives man a new life in order to help put it to death.", "source": "Watchman Nee, quoted at biblereasons.com"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Oh, we Christians must believe our beliefs! We must take hold, with both hands, of the things which are of our Christian faith.", "source": "T. Austin-Sparks, The On-High Calling, Vol. 1, ch. 5, The Changed Position of the Companions (austin-sparks.net/english/books/000970.html)"}], "declarations": ["I declare: I believe on the Lord Jesus Christ and I am saved.", "I declare: My household and I are saved by faith in Christ."], "prayer": "Lord Jesus, I believe on You. Save me and my household today. Amen.", "theme_flag": "theme-based: Nee, Sparks"}, {"day": 208, "ref": "Acts 20:35", "book": "Acts", "chapter": 20, "verse": 35, "text": "I have shewed you all things, how that so labouring ye ought to support the weak, and to remember the words of the Lord Jesus, how he said, It is more blessed to give than to receive.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "That the hand of God was in it for the good of the assembly, and in conducting His beloved servant for his own good in the end, is beyond all doubt. We have only to search out how far the will and the mind of Paul came in, as means which God used to bring about the result He intended, whether for the assembly or for His servant, or for the Jews. These thoughts are of the deepest interest, and require humble examination of that which God has set before us to instruct us on this point in the history which the Spirit Himself has given us of these things.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "He said, \"It is more blessed to give than to receive.\" What a Godlike privilege and blessedness to have the power of relieving the needy and making glad the heart of the poor by gold or silver! What a blessed religion that makes the money we give away a source of greater pleasure than that which we spend on ourselves! The latter is mostly spent on what is temporal and carnal, that spent in the work of love has eternal value, and brings double happiness, to ourselves and others. Think of the church and its work in this world; of missions at home and abroad, and the thousand agencies for winning men from sin to God and Holiness.", "source": "Money"}, {"name": "Watchman Nee", "short": "Nee", "comment": "We should keep our money moving and active and not allow it to become like the stagnant water of the Dead Sea.", "source": "Conferences, Messages, and Fellowship (3): A Message Given in Shanghai, 1938"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "It is very happy, very blessed, to be in a position to give; and God is in that position.", "source": "The Gospel of the Glory"}], "declarations": ["I declare: It is more blessed to give than to receive.", "I declare: I follow the example of Jesus who gave Himself."], "prayer": "Lord Jesus, teach me to give as You gave. Make me a blessing to others today. Amen.", "theme_flag": "theme-based: Darby"}, {"day": 209, "ref": "Romans 1:16", "book": "Romans", "chapter": 1, "verse": 16, "text": "For I am not ashamed of the gospel of Christ: for it is the power of God unto salvation to every one that believeth; to the Jew first, and also to the Greek.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "The way in which the apostle claims the whole field of the Gentiles as his own, and in which ho was prevented by God from going to Rome until he arrived there at the end of his career (and then only as a prisoner), is worthy of all attention. However it might be, he was ready, and that because of the value of the gospel—a point which leads him to state both the value and the character of this gospel. For, he says, he was not ashamed of it. It was the power of God to salvation. Observe here the way in which the apostle presents everything as coming from God.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "In Christ the Holiness of God appeared in a human life: in Christ's example, in His mind and Spirit, we have the Holiness of the Invisible One translated into the forms of human life and conduct. To be Christlike is to be Godlike; to be Christlike is to be holy as God is holy. The call equally reveals the _power_ of Holiness. 'There is none holy but the Lord;' there is no Holiness but what He has, or rather what He is, and gives. Holiness is not something we do or attain: it is the communication of the Divine life, the inbreathing of the Divine nature, the power of the Divine Presence resting on us.", "source": "Holy in Christ: The Gospel the Power of God"}, {"name": "Watchman Nee", "short": "Nee", "comment": "The Gospel is the power of God for salvation to everyone who believes.", "source": "quoted at"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "This gospel of salvation is an immense thing.", "source": "The Gospel of the Glory"}], "declarations": ["I declare: I am not ashamed of the gospel of Christ.", "I declare: The gospel is the power of God unto my salvation."], "prayer": "Lord Jesus, make me bold with the gospel. Let Your power work through me today. Amen.", "theme_flag": "theme-based: Sparks"}, {"day": 210, "ref": "Romans 3:23", "book": "Romans", "chapter": 3, "verse": 23, "text": "For all have sinned, and come short of the glory of God;", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "For there was no difference: all had sinned, and outside the glory of God, deprived of that glory, were justified freely by His grace, through the redemption that is in Christ Jesus.", "source": "Darby's Synopsis, Romans, chapter 3 section"}, {"name": "Andrew Murray", "short": "Murray", "comment": "It is only sin that renders Christ intelligible.", "source": "Andrew Murray, quoted by Shane Idleman (westsidechristianfellowship.org)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "God's purpose for man was glory, but sin thwarted that purpose by causing man to miss God's glory.", "source": "Watchman Nee, The Normal Christian Life (via cfbcfamily.org)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "When the law came, the great fact, the universal fact that man is utterly impotent in the presence of the requirements of a holy God is made all too apparent.", "source": "T. Austin-Sparks, We Beheld His Glory, Vol. 1, ch. 5, Walking in the Power of God (Austin-Sparks.Net/english/books/001509.html)"}], "declarations": ["I declare: All have sinned, but Christ restores me to God's glory.", "I declare: I come short, but Jesus lifts me up."], "prayer": "Lord Jesus, I have sinned and fallen short. Restore me to Your glory today. Amen.", "theme_flag": "theme-based: Sparks"}, {"day": 211, "ref": "Romans 5:1", "book": "Romans", "chapter": 5, "verse": 1, "text": "Therefore being justified by faith, we have peace with God through our Lord Jesus Christ:", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "That Christ has put away my sins, and that God has loved me, is a matter of simple faith through grace. That I am dead is apt to find itself contradicted in my heart. The process of chapter vii. must be gone through, and the condemnation of sin in the flesh seen in Christ’s sacrifice for sin, and I alive by Him judging sin as a distinct thing (an enemy I have to deal with, not I), in order to have solid peace. It is not all that Christ has put away our sins. I live by Him risen, and am linked with this husband, and He being my THE HOOKS OF TOE BIlil.E. life—the true “ I ” in mo, I can say that I have died because He has.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "As he looks at the Cross, and Christ suffering there, the Righteous One for the unrighteous, he sees in that atoning death the only but sufficient founda- tion for his faith in God’s pardoning mercy. The substitution, and the curse-bearing, and the atone- ment of Christ dying in the stead of sinners, are what give him peace. And as he understands how the righteousness which Christ brings becomes his very own, and how, in the strength of that, he is counted righteous before God, he feels that he has what he needs to restore him to God’s favour: ‘ Being justified by faith, we have peace with God.’", "source": "Abide in Christ"}, {"name": "Watchman Nee", "short": "Nee", "comment": "This means that, now that I have forgiveness of sins, God will no longer be a cause of dread and trouble to me.", "source": "The Normal Christian Life"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Faith brings us into the position of being justified with God.", "source": "The Grace of God in Christ Jesus"}], "declarations": ["I declare: Being justified by faith, I have peace with God.", "I declare: Through Jesus I am at peace with the Father."], "prayer": "Lord Jesus, thank You for justifying me by faith. Fill me with Your peace today. Amen.", "theme_flag": null}, {"day": 212, "ref": "Romans 5:8", "book": "Romans", "chapter": 5, "verse": 8, "text": "But God commendeth his love toward us, in that, while we were yet sinners, Christ died for us.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "God has displayed the love that was peculiar to Himself, in that, when there was no motive for Him in us, when we were nothing but sinners, Christ died for us!", "source": "Darby's Synopsis, Romans, chapter 5 section"}, {"name": "Andrew Murray", "short": "Murray", "comment": "God is ready to assume full responsibility for the life wholly yielded to Him.", "source": "Andrew Murray, quoted at dirtybiblecleanheart.com"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Love flows from the denial of the self life.", "source": "Watchman Nee, quoted at preach-the-gospel.com"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "You see the mighty, all-embracing love of Christ.", "source": "T. Austin-Sparks, The Government of Love (sermonindex.net)"}], "declarations": ["I declare: God commendeth His love toward me in Christ's death.", "I declare: While I was yet a sinner, Jesus died for me."], "prayer": "Lord Jesus, thank You for loving me when I was a sinner. Your love amazes me. Amen.", "theme_flag": "theme-based: Murray, Nee, Sparks"}, {"day": 213, "ref": "Romans 6:23", "book": "Romans", "chapter": 6, "verse": 23, "text": "For the wages of sin is death; but the gift of God is eternal life through Jesus Christ our Lord.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "For the wages of sin was death, the gift of God was eternal life through Jesus Christ our Lord.", "source": "Darby's Synopsis, Romans, chapter 6 section"}, {"name": "Andrew Murray", "short": "Murray", "comment": "The redeeming work of Christ and the righteousness He won for us, equally with the work of the Spirit in us and the power of the new life He brings.", "source": "Andrew Murray, on grace, quoted at therichesofhisgrace.substack.com"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Salvation is given freely.", "source": "Watchman Nee, The Gospel of God (via bibleread.online)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "We receive the free gift by faith's acceptance of what He did in order that we might have the life.", "source": "T. Austin-Sparks, The Battle for Life, ch. 3, The Cross in Relation to the Issue of Life (www.bibleportal.com/sermon/T-Austin-Sparks/the-cross-in-relation-to-the-issue-of-life)"}], "declarations": ["I declare: The gift of God is eternal life through Jesus Christ.", "I declare: I receive God's free gift of life today."], "prayer": "Lord Jesus, thank You for the gift of eternal life. I receive it with gratitude. Amen.", "theme_flag": "theme-based: Murray, Sparks"}, {"day": 214, "ref": "Romans 8:1", "book": "Romans", "chapter": 8, "verse": 1, "text": "There is therefore now no condemnation to them which are in Christ Jesus, who walk not after the flesh, but after the Spirit.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "There is therefore now no condemnation to those which are in Christ Jesus: the new position entirely beyond the reach of everything to which the judgment of God applied.", "source": "Darby's Synopsis, Romans, chapter 8 section"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Abiding in Him is a living union in which man is nothing and Christ is all in all.", "source": "Andrew Murray, quoted at maxsolbrekken.com"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Since we have been terminated on Christ's cross once, we have been judged already, and now there is no condemnation to those who are in Christ.", "source": "Watchman Nee, CW Set 2 Vol. 42, ch.13 (bibleread.online)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "The Acceptance is in Christ. The Redemption is in Christ.", "source": "T. Austin-Sparks, Daily Open Windows (via goodreads.com)"}], "declarations": ["I declare: There is no condemnation to me, for I am in Christ Jesus.", "I declare: I walk after the Spirit and I am free."], "prayer": "Lord Jesus, thank You for removing all condemnation. Help me walk in the Spirit today. Amen.", "theme_flag": "theme-based: Murray, Sparks"}, {"day": 215, "ref": "Romans 8:28", "book": "Romans", "chapter": 8, "verse": 28, "text": "And we know that all things work together for good to them that love God, to them who are the called according to his purpose.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "We know that everything works together under God's own hand for our greatest good. God orders all things in favour of those who are called according to His purpose.", "source": "Darby's Synopsis, Romans, chapter 8 section"}, {"name": "Andrew Murray", "short": "Murray", "comment": "As we get into the mind and plan of God, our faith will grow, and its power will be manifest in ourselves and those for whom we are believing.", "source": "Andrew Murray, quoted at biblestudytools.com"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Loving God will make an unsatisfactory environment a profitable one.", "source": "Watchman Nee, CWWN Vol.18, ch.12 (via livingtohim.com)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "In order to be maintained in strength it is essential that we know that we are in the purpose of God.", "source": "T. Austin-Sparks, Open Windows - A Divine Purpose (via bibleportal.com)"}], "declarations": ["I declare: All things work together for good because I love God.", "I declare: I am called according to God's purpose."], "prayer": "Lord Jesus, work all things for my good today. I trust Your purpose for my life. Amen.", "theme_flag": null}, {"day": 216, "ref": "Romans 8:31", "book": "Romans", "chapter": 8, "verse": 31, "text": "What shall we then say to these things? If God be for us, who can be against us?", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "The result of all for the soul is, that God is for us. Sweet and glorious conclusion, which gives the heart a peace that is ineffable.", "source": "Darby's Synopsis, Romans, chapter 8 section"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Nothing can overcome the all-surpassing love of our beloved Bridegroom for us. We can rest secure in the assurance of His unconditional and unconquerable love.", "source": "Andrew Murray, Teach Me To Pray, Feb. 14 reading (via swordnotes.com)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Our rest lies in looking to the Lord, not to ourselves.", "source": "Watchman Nee, quoted at preach-the-gospel.com"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "He foreknew you; He called you; He predestined you to become like His Son; He justified you; He glorified you.", "source": "T. Austin-Sparks, Following The Lamb (3), Towards the Mark, Vol. 2, No. 4 (Austin-Sparks.Net/mags/ttm02-4.html)"}], "declarations": ["I declare: If God be for me, who can be against me.", "I declare: God is for me in Christ Jesus."], "prayer": "Lord Jesus, when God is for me, none can stand against me. Strengthen my faith today. Amen.", "theme_flag": "theme-based: Nee"}, {"day": 217, "ref": "Romans 8:37", "book": "Romans", "chapter": 8, "verse": 37, "text": "Nay, in all these things we are more than conquerors through him that loved us.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "He has been there; it is the proof of His love. Difficulties ? We are more than conquerors: they are the immediate occasion of the display of His love and faithfulness making us feel where our portion is, what our strength is. Trial does but assure the heart, which knows His love, that nothing can separate us from the love of God which is in Jesus. Everything else is the creature, and cannot separate us from the love of God—a love of God, which has entered also into this misery of the creature, and gained the victory for us over all. Tims the deliverance, and liberty, and security of the saints by grace and power are fully brought out.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "“Thanks be unto God, who always causeth us to triumph in Christ.” “We are more than conquerors through Him that loved us.” We have spoken of the sin of prayerlessness, and the means of deliverance, and how to be kept free from it. What has been said on these points is all included in that expression of Christ: “T am come that they might have life, and that they might have it more abundantly.” It is - of the utmost importance for us so to understand this more abundant life, that we may clearly see that for a true life of prayer nothing less is necessary than that we should walk in an ever increasing experience of that overflowing life.", "source": "The Prayer Life"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Satan is an absolutely conquered foe to the soul who knows.", "source": "More Than Conquerors"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Well, let us sit down in the armchair of His love and be at rest, and then get to work.", "source": "Abounding in Love"}], "declarations": ["I declare: In all things I am more than a conqueror through Christ.", "I declare: Jesus loved me and I overcome by His love."], "prayer": "Lord Jesus, make me more than a conqueror today. Let Your love strengthen me. Amen.", "theme_flag": null}, {"day": 218, "ref": "Romans 10:9", "book": "Romans", "chapter": 10, "verse": 9, "text": "That if thou shalt confess with thy mouth the Lord Jesus, and shalt believe in thine heart that God hath raised him from the dead, thou shalt be saved.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "If any one confessed with his mouth the Lord Jesus, and believed in his heart that God had raised Him from the dead, he should be saved. Precious, simple, and positive assertion!", "source": "Darby's Synopsis, Romans, chapter 10 section"}, {"name": "Andrew Murray", "short": "Murray", "comment": "She did not yet believe everything, but what she believed that she spoke out before the Lord.", "source": "Andrew Murray, Why Do You Not Believe?, ch. 5 (swartzentrover.com)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Not by feeling but by faith do the spiritual live.", "source": "Watchman Nee, quoted at preach-the-gospel.com"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Therefore salvation is in the name of the Lord Jesus.", "source": "T. Austin-Sparks, The Glory of the Name (austin-sparks.net)"}], "declarations": ["I declare: I confess with my mouth the Lord Jesus and I am saved.", "I declare: I believe in my heart that God raised Jesus from the dead."], "prayer": "Lord Jesus, I confess You as Lord. I believe God raised You from the dead. Amen.", "theme_flag": "theme-based: Murray, Nee"}, {"day": 219, "ref": "Romans 10:13", "book": "Romans", "chapter": 10, "verse": 13, "text": "For whosoever shall call upon the name of the Lord shall be saved.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "There is no difference, for the same Lord over all is rich unto all; for every one who calls upon His name shall be saved.", "source": "Darby's Synopsis, Romans, chapter 10 section"}, {"name": "Andrew Murray", "short": "Murray", "comment": "We have more than once seen that God's listening to our voice depends upon our listening to His voice.", "source": "Andrew Murray, quoted at freebaptistchurch.org"}, {"name": "Watchman Nee", "short": "Nee", "comment": "a cry to God from the heart is sufficient.", "source": "Watchman Nee, What Shall This Man Do? (via contendingforthefaith.org)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "It cannot be received in any other way than by calling upon His name.", "source": "T. Austin-Sparks, The Glory of the Name (austin-sparks.net)"}], "declarations": ["I declare: Whosoever shall call upon the name of the Lord shall be saved.", "I declare: I call on Jesus and I am saved."], "prayer": "Lord Jesus, I call upon Your name. Save me today. Amen.", "theme_flag": "theme-based: Murray"}, {"day": 220, "ref": "Romans 11:36", "book": "Romans", "chapter": 11, "verse": 36, "text": "For of him, and through him, and to him, are all things: to whom be glory for ever. Amen.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "All is grace: yet God is ever faithful, and that in spite of man's unfaithfulness. Both the one and the other have to attribute it to the pure mercy of God.", "source": "Darby's Synopsis, Romans, chapter 11 section"}, {"name": "Andrew Murray", "short": "Murray", "comment": "The highest glory of the creature is in being only a vessel, to receive and enjoy and show forth the glory of God.", "source": "Andrew Murray, quoted at woven-life.com"}, {"name": "Watchman Nee", "short": "Nee", "comment": "All is because of Him; nothing is because of me.", "source": "Watchman Nee, quoted at bibleminute.co"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "That everything throughout, at all times, shall express and be subservient to His Son.", "source": "T. Austin-Sparks, The Unchangeable Ground Of Christ, Open Windows (bibleportal.com/devotional/open-windows/the-unchangeable-ground-of-christ-1029)"}], "declarations": ["I declare: Of Him, and through Him, and to Him are all things.", "I declare: To Jesus be glory forever. Amen."], "prayer": "Lord Jesus, all things are from You and for You. To You be glory forever. Amen.", "theme_flag": "theme-based: Darby, Murray"}, {"day": 221, "ref": "Romans 12:1", "book": "Romans", "chapter": 12, "verse": 1, "text": "I beseech you therefore, brethren, by the mercies of God, that ye present your bodies a living sacrifice, holy, acceptable unto God, which is your reasonable service.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Otherwise it is the position of man in his individual responsibility before God, and this met by grace, and then the delivered man, that is set before us in the Epistle to the Romans. The directions given by the apostle extend to the Christian's relationship with the authorities under which he is placed. He recognises them as accomplishing the service of God, and as armed with authority from Him, so that resisting them would be resisting that which God had established. Conscience therefore, and not merely force, constrained the Christian to obey.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "\"O God, I accept Thy demands. I am thine and all that I have. Absolute surrender is what my soul yields to Thee by divine grace.\" You may not have such strong and clear feelings of deliverances as you would desire to have, but humble yourselves in His sight, and acknowledge that you have grieved the Holy Spirit by your self-will, self-confidence, and self-effort. Bow humbly before him in the confession of that, and ask him to break the heart and to bring you into the dust before Him. Then, as you bow before Him, just accept God's teaching that in your flesh \"there dwelleth no good thing\" (Rom.", "source": "Absolute Surrender"}, {"name": "Watchman Nee", "short": "Nee", "comment": "God wants everything whole; He does not want a half offering. He cannot accept anything less than utter consecration.", "source": "General Messages (1)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "These words bring us to a very definite and precise application of this principle of inwardness.", "source": "The Fact of Inwardness"}], "declarations": ["I declare: I present my body a living sacrifice to God.", "I declare: My reasonable service is to live wholly for Christ."], "prayer": "Lord Jesus, I present myself to You today. Use my life for Your glory. Amen.", "theme_flag": null}, {"day": 222, "ref": "Romans 12:2", "book": "Romans", "chapter": 12, "verse": 2, "text": "And be not conformed to this world: but be ye transformed by the renewing of your mind, that ye may prove what is that good, and acceptable, and perfect, will of God.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "This was for man personally. As to his outward relationships, he was not to be conformed to the world. Neither was this to be an outside mechanical nonconformity, but the result of being renewed in mind, so as to seek for and discern the will of God, good and acceptable and perfect (the life being thus transformed). This connects itself with the end of chapter vi. It is not those sitting in heavenly places, imitators of God as dear children, but men on earth set free by the delivering power of redemption and grace, yielding themselves up to God to do His will. Tire exhortation follows the character we have seen to be that of the epistle.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "The third word, perfect, tells us that we may not rest content with what we already know and do of God's will ; this is only a beginning ; we must press on to stand perfect in all the will of God. To know and accept the will of God as good, is the first step, is good. To know it in our personal relationship to Him as well-pleasing, is better. To know the perfect will of God is best of all, the true aim of the full Christian life. So we can prove and know for ourselves, so we can prove to men, what is the good, and acceptable, and perfect will of God. So we yield our bodies an acceptable sacrifice.", "source": "Thy Will Be Done"}, {"name": "Watchman Nee", "short": "Nee", "comment": "The God Who can change a sinner into a Christian by giving him His life can equally transform the fleshly Christian into a spiritual one by giving him His life more abundantly.", "source": "quoted at"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "There you have the reversing of an order.", "source": "The Fact of Inwardness"}], "declarations": ["I declare: I am transformed by the renewing of my mind.", "I declare: I prove the good and perfect will of God."], "prayer": "Lord Jesus, renew my mind today. Transform me to know Your will. Amen.", "theme_flag": null}, {"day": 223, "ref": "Romans 12:9", "book": "Romans", "chapter": 12, "verse": 9, "text": "Let love be without dissimulation. Abhor that which is evil; cleave to that which is good.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "To leave nothing owing to any one, be it of whatever character it might, excepting love, a debt which never can be liquidated.", "source": "Darby's Synopsis, Romans, chapter 12 section"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Let a man be what he will; you are to love him.", "source": "Andrew Murray, quoted at peopleofthelivinggod.org"}, {"name": "Watchman Nee", "short": "Nee", "comment": "One gains by losing self for others and not by hoarding for oneself.", "source": "Watchman Nee, quoted at preach-the-gospel.com"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "It is going to be the fellowship of unfeigned love, that is, transparent love, the unfeigned love of the brethren (1 Pet. 1:22).", "source": "T. Austin-Sparks, The Building of the New Jerusalem (www.austin-sparks.net/pdf/The Building of the New Jerusalem - T. Austin-Sparks.pdf)"}], "declarations": ["I declare: My love is without dissimulation, sincere and true.", "I declare: I abhor evil and cling to what is good."], "prayer": "Lord Jesus, fill me with sincere love. Help me to hate evil and hold to good. Amen.", "theme_flag": "theme-based: Darby, Murray, Nee, Sparks"}, {"day": 224, "ref": "Romans 12:12", "book": "Romans", "chapter": 12, "verse": 12, "text": "Rejoicing in hope; patient in tribulation; continuing instant in prayer;", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "The christian walk was characterised by devotedness and obedience. It was a life subjected to the will of another, namely, to the will of God.", "source": "Darby's Synopsis, Romans, chapter 12 section"}, {"name": "Andrew Murray", "short": "Murray", "comment": "One of the greatest drawbacks to the life of prayer is the fact that the answer does not come as speedily as we expect.", "source": "Andrew Murray, Persevering Prayer (bibleportal.com)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Our prayers lay the track down which God's power can come.", "source": "Watchman Nee, quoted at lancasterbaptist.org"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Our prayer times give us the great opportunity of getting right into line with the will of God on all matters.", "source": "T. Austin-Sparks, Worshipful Prayer, Open Windows (www.bibleportal.com/devotional/open-windows/worshipful-prayer-1009)"}], "declarations": ["I declare: I rejoice in hope and am patient in tribulation.", "I declare: I continue instant in prayer."], "prayer": "Lord Jesus, give me joy in hope and patience in trouble. Teach me to pray without ceasing. Amen.", "theme_flag": "theme-based: Darby, Nee, Sparks"}, {"day": 225, "ref": "Romans 14:17", "book": "Romans", "chapter": 14, "verse": 17, "text": "For the kingdom of God is not meat and drink; but righteousness, and peace, and joy in the Holy Ghost.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "The task which the Holy Ghost accomplished in this epistle, was the presentation of the soul individually before God according to the divine thoughts. Nevertheless this connects itself immediately with the position of the body; and the doctrine respecting the body, the assembly, cannot be separated from it. Now the apostle informs us distinctly, that the mystery, the assembly, and the gathering together in one of all things under Christ, had been entirely unknown: God had been silent on that subject in the times which were defined by the word ages, the assembly not forming a part of that course of events, and of the ways of God on earth.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "That is the religion God has prepared for us; that is the religion we can claim; not only righteousness, not only peace, but the joy of the Holy Ghost. That is the Kingdom of God. What is this joy? First of all, it is the joy of the presence of Jesus. We are often inclined to speak most of two other things, the power for sanctification, and the power for service. But I find there is a thing more important than either of those two, and that is that the Holy Ghost came from Heaven to be the abiding presence of Christ in His disciples, in the Church, and in the heart of every believer.", "source": "The Master's Indwelling"}, {"name": "Watchman Nee", "short": "Nee", "comment": "The kingdom of God is about these spiritual things: righteousness, peace, and joy. And all these are in the Holy Spirit.", "source": "The Normal Christian Faith"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Christianity is Christ. Christ is Christianity.", "source": "Daily Open Windows"}], "declarations": ["I declare: The kingdom of God is righteousness, peace, and joy.", "I declare: I live in the Holy Spirit's righteousness and peace."], "prayer": "Lord Jesus, let Your kingdom rule in my heart with righteousness, peace, and joy. Amen.", "theme_flag": "theme-based: Darby, Sparks"}, {"day": 226, "ref": "Romans 15:13", "book": "Romans", "chapter": 15, "verse": 13, "text": "Now the God of hope fill you with all joy and peace in believing, that ye may abound in hope, through the power of the Holy Ghost.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "The task which the Holy Ghost accomplished in this epistle, was the presentation of the soul individually before God according to the divine thoughts. Nevertheless this connects itself immediately with the position of the body; and the doctrine respecting the body, the assembly, cannot be separated from it. Now the apostle informs us distinctly, that the mystery, the assembly, and the gathering together in one of all things under Christ, had been entirely unknown: God had been silent on that subject in the times which were defined by the word ages, the assembly not forming a part of that course of events, and of the ways of God on earth.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "They are learning, and long to learn better, and that all may learn, that in all work for souls intercession must take the first place, and that those who in it have received from heaven, in the power of the Holy Ghost, what they are to communicate to others, will be best able to do the Lord's work. _God seeks intercessors._--Though God had His appointed servants in Israel, watchmen set by Himself to cry to Him day and night and give Him no rest, He often had to wonder and complain that there was no intercessor, none to stir himself up to take hold of His strength.", "source": "The Ministry of Intercession: Concerted Prayer"}, {"name": "Watchman Nee", "short": "Nee", "comment": "It is one lived by believing God under any circumstance.", "source": "quoted at"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "A living hope by the resurrection of Jesus Christ from the dead.", "source": "A Living Hope"}], "declarations": ["I declare: The God of hope fills me with joy and peace.", "I declare: I abound in hope by the power of the Holy Spirit."], "prayer": "Lord Jesus, fill me with joy and peace today. Let me overflow with hope. Amen.", "theme_flag": "theme-based: Nee, Sparks"}, {"day": 227, "ref": "1 Corinthians 2:2", "book": "1 Corinthians", "chapter": 2, "verse": 2, "text": "For I determined not to know any thing among you, save Jesus Christ, and him crucified.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "He would know nothing but Christ, and Christ in His humiliation and abasement. Thus their faith rested, not on the fair words of man, but on the power of God.", "source": "Darby's Synopsis, 1 Corinthians, chapter 2 section"}, {"name": "Andrew Murray", "short": "Murray", "comment": "His whole ministry and manner of life bore the mark of Christ's likeness, crucified through weakness, yet living by the power of God.", "source": "Andrew Murray, Day 21: Jesus Christ and Him Crucified (worthychristianbooks.com)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Christianity begins not with a big DO, but with a big DONE. We rest in Christ's finished work.", "source": "Watchman Nee, quoted at thf.org.ng"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "In many ways the explanation of Christ being the power of God consists in the fact that He is Christ crucified.", "source": "T. Austin-Sparks, Christ the Power of God (via bibleportal.com)"}], "declarations": ["I declare: I know nothing but Jesus Christ and Him crucified.", "I declare: The cross is my wisdom and my power."], "prayer": "Lord Jesus, keep me focused on the cross. Let Christ crucified be my all. Amen.", "theme_flag": "theme-based: Nee"}, {"day": 228, "ref": "1 Corinthians 2:9", "book": "1 Corinthians", "chapter": 2, "verse": 9, "text": "But as it is written, Eye hath not seen, nor ear heard, neither have entered into the heart of man, the things which God hath prepared for them that love him.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "We labour although there are difficulties, with entire confidence, knowing what will be the infallible result. The path may be beset by the enemy; the end will be the fruit of the counsels and the power of our God, exercised on our behalf according to that which we have seen in Jesus, who is the Head and the manifestation of the glory which His own shall enjoy. To sum up what has been said, we see the two things in Christ: first, power over all things, death included; He raises up even the wicked: and secondly, the association of His own with Himself.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "God is light. God is a sun. Paul says: “God hath shined in our hearts to give the light.” What light? “The light of the glory of God, in the face of Jesus Christ.” Just as the sun shines its beautiful, life-giving light on and into our earth, so God shines into our hearts the light of His glory, of His iove, in Christ His Son. Our heart is meant to have that light fill- ing and gladdening it all the day. It can have it because God is our sun, and it is written, “Thy sun shall no more go down forever.” God’s love shines on us without ceasing. But can we indeed enjoy it all the day? We can. And how can we? Let nature give us the answer.", "source": "Waiting on God, Day 23"}, {"name": "Watchman Nee", "short": "Nee", "comment": "From the evening I was saved, I began to live a new life, for the life of the eternal God had entered into me.", "source": "quoted at"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "The heavens are opened and we see more and more, and ever more, of what it is to which we are called.", "source": "Daily Open Windows"}], "declarations": ["I declare: God has prepared things for me that eye has not seen.", "I declare: The Spirit reveals God's blessings to me."], "prayer": "Lord Jesus, open my eyes to what You have prepared. Reveal it by Your Spirit. Amen.", "theme_flag": "theme-based: Nee"}, {"day": 229, "ref": "1 Corinthians 6:20", "book": "1 Corinthians", "chapter": 6, "verse": 20, "text": "For ye are bought with a price: therefore glorify God in your body, and in your spirit, which are God’s.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "We are not our own, but were bought with a price, the blood of Christ offered for us. Therefore we ought to glorify God in our bodies, which are His. Our true liberty is to belong to God.", "source": "Darby's Synopsis, 1 Corinthians, chapter 6 section"}, {"name": "Andrew Murray", "short": "Murray", "comment": "We belong to Him who purchased our freedom with His blood.", "source": "Andrew Murray, The Power of the Blood (via goodreads.com)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "How many of us can say, God, I belong to You. I am Your slave?", "source": "Watchman Nee, CW Set1 Vol.17 ch.3 (bibleread.online)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "You belong to the Lord, not to yourself, or to anyone else. That is the meaning of sanctification: Set apart, made wholly unto God.", "source": "T. Austin-Sparks, The Significance of the Person and Ministry of the Apostle Peter (bibleportal.com/sermon/T-Austin-Sparks/the-significance-of-the-person-and-ministry-of-the-apostle-peter)"}], "declarations": ["I declare: I am bought with a price and I glorify God.", "I declare: My body and spirit belong to Jesus."], "prayer": "Lord Jesus, I am Yours. You bought me. Help me glorify You in my body today. Amen.", "theme_flag": null}, {"day": 230, "ref": "1 Corinthians 10:13", "book": "1 Corinthians", "chapter": 10, "verse": 13, "text": "There hath no temptation taken you but such as is common to man: but God is faithful, who will not suffer you to be tempted above that ye are able; but will with the temptation also make a way to escape, that ye may be able to bear it.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "The things themselves happened to Israel; they were written for our instruction who find ourselves at the close of God's dispensations. That which shall follow will be the judgment of God, when these examples will no longer serve for the life of faith. Two principles are next established which also have great practical importance: “ Let him that thinketh he standeth take heed lest he fall.” This is our responsibility. On the other side we have the faithfulness of God. He does not permit us to be tempted beyond our strength, but provides a way of escape in order that we may not stumble.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "* Faith adheres simply to what God says. The unbelief that would see shall not see; the faith that will not see, but has enough in God, shall see the glory of God. (2 Chron. 7:2; Ps. 2713; Isa. 7:9; Matt. 14:30,31; Luke 5:5) The man who seeks for feeling, and mourns about it, shall not find it; the man who cares not for it shall have it overflowing. Whosoever would save his life shall lose it, and whosoever shall lose his life for my sake shall find it.' Faith in the word becomes later on sealed with true feeling by the Holy Spirit.", "source": "The New Life"}, {"name": "Watchman Nee", "short": "Nee", "comment": "We should remember that God is faithful. If God can fail, then we can fail. But if He is faithful, we should trust Him and should not fail.", "source": "The Christian Life and Warfare"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "That is not getting away from it, that is getting on top of it.", "source": "Suffering and Glory"}], "declarations": ["I declare: God is faithful and will make a way of escape.", "I declare: I can bear temptation through Christ's strength."], "prayer": "Lord Jesus, You are faithful. Make a way for me through every temptation. Amen.", "theme_flag": "theme-based: Murray"}, {"day": 231, "ref": "1 Corinthians 13:4", "book": "1 Corinthians", "chapter": 13, "verse": 4, "text": "Charity suffereth long, and is kind; charity envieth not; charity vaunteth not itself, is not puffed up,", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Apostles and prophets were the foundation, and in that sense they were, when the foundation was laid, no longer in exercise. Nevertheless there was something more excellent than all gifts. They were the manifestations of the power of God and of the mysteries of His wisdom; love, that of His nature itself. They might speak with all tongues; they might have prophecy, the knowledge of mysteries, the faith which can remove mountains; they might give all their possessions to feed the poor, and their bodies to he tortured: if they had not love, it was nothing.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Jesus is the gift of this love, to bring love to you, to transplant you into that life of godlike love. Live in that faith, and you shall not complain that you have no power to love: the love of the Spirit shall be your power and your life. Beloved Saviour, I discern more clearly that the whole of the new life is a life in love. Thou Thyself art the Son of God's love, the gift of His love, come to introduce us into His love, and give us a dwelling there. And the Holy Spirit is given to shed abroad the love of God in our hearts, to open a spring out of which shall stream love to Thee, and to the brethren, and to all mankind.", "source": "The New Life"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Love always hopes for others' good.", "source": "Notes on Scriptural Messages (1)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Oh, God give us more love, as His servants, to bear and forbear, to suffer long, and never to despair.", "source": "In His Letter to the Corinthians"}], "declarations": ["I declare: Love suffers long and is kind.", "I declare: I love with the patient love of Christ."], "prayer": "Lord Jesus, teach me to love as You love. Make me patient and kind today. Amen.", "theme_flag": "theme-based: Sparks"}, {"day": 232, "ref": "1 Corinthians 13:7", "book": "1 Corinthians", "chapter": 13, "verse": 7, "text": "Beareth all things, believeth all things, hopeth all things, endureth all things.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Communications from God; the means by which they are made; knowledge, as attained here below, according to which we apprehend the truth in part only, although the whole truth is revealed to us (for we apprehend it in detail, so that we have never the whole at once, the XIII. character of our knowledge being to lay hold of different truths singly); all that is characterised by being in part—passes away. Love will not pass away. A child leams; he rejoices too in things that amuse him; when he becomes a man, he requires things in accordance with his intelligence as a man. It was thus with tongues and the edification of the assembly.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "(Matt. 5:44,45; Gal 2:20; 1 Thess. 3:12,13; 5:24; Phil. 4:13; 1 Pet. 1:22) Brotherly love has its measure and rule in the love of Jesus. This is my commandment, that ye love one another, as I have loved you.' (Luke 22:26,27; John 13:14,15,34; Col. 2:13) The eternal life that works in us is the life of Jesus; it knows no other law than what we see in Him; it works with power in us what it wrought in Him. Jesus Himself lives in us and loves in and through us: we must believe in the power of this love in us, and in that faith love as He loved. O, do believe that this is true salvation, to love even as Jesus loves.", "source": "The New Life \"Love\" (on 1 Cor 13:4-7)."}, {"name": "Watchman Nee", "short": "Nee", "comment": "Love always hopes for others' good. Love always has trust in the good aspects of others.", "source": "\"Redeeming the Time,\""}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Love 'believeth all things': it takes a large heart to do that, does it not? It is never ready to believe an unfavourable report, but always ready to believe that there may be something that can be set off against it.", "source": "AWAT (1959)"}], "declarations": ["I declare: the love of Christ in me bears all things and never gives up.", "I declare: I believe the best, I hope in all things, and I endure to the end."], "prayer": "Lord Jesus, fill my heart with Your unfailing love. Teach me to bear, to believe, to hope, and to endure as You do. Amen.", "theme_flag": null}, {"day": 233, "ref": "1 Corinthians 13:8", "book": "1 Corinthians", "chapter": 13, "verse": 8, "text": "Charity never faileth: but whether there be prophecies, they shall fail; whether there be tongues, they shall cease; whether there be knowledge, it shall vanish away.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "It was thus with tongues and the edification of the assembly. The time however was coming when they should know even as they were known, not by communications of truths to a capacity that apprehended the truth in its different parts, but they should understand it as a whole in itsunity. Now love subsists already; there are faith and hope also. Not only shall these pass away, but even now, here below, that which is of the nature of God is more excellent than that which is connected with the capacity of human nature, even though enlightened by God, and having for its object the revealed glory of God.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Live in that faith, and you shall not complain that you have no power to love: the love of the Spirit shall be your power and your life. Beloved Saviour, I discern more clearly that the whole of the new life is a life in love. Thou Thyself art the Son of God's love, the gift of His love, come to introduce us into His love, and give us a dwelling there. And the Holy Spirit is given to shed abroad the love of God in our hearts, to open a spring out of which shall stream love to Thee, and to the brethren, and to all mankind. Lord, here am I, one redeemed by love, to love for it, and in its might to love all. Amen.", "source": "The New Life \"Love\""}, {"name": "Watchman Nee", "short": "Nee", "comment": "If we replace the phrase the fruit of the Spirit with the word love, we will see that 1 Corinthians 13 is actually speaking of the things of the Spirit.", "source": "pg 53, page_053"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Love, love triumphant, in the presence of the most terribly provoking contradictions, denials. 'Love never faileth.'", "source": "The Excellency of the Knowledge of Christ"}], "declarations": ["I declare: Your love never fails, and it lives in me.", "I declare: prophecies may cease and knowledge may vanish, but Your love in me remains."], "prayer": "Lord Jesus, thank You that Your love never fails. Let that unfailing love flow through me to everyone I meet. Amen.", "theme_flag": "theme-based: Nee"}, {"day": 234, "ref": "1 Corinthians 13:13", "book": "1 Corinthians", "chapter": 13, "verse": 13, "text": "And now abideth faith, hope, charity, these three; but the greatest of these is charity.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "The time however was coming when they should know even as they were known, not by communications of truths to a capacity that apprehended the truth in its different parts, but they should understand it as a whole in itsunity. Now love subsists already; there are faith and hope also. Not only shall these pass away, but even now, here below, that which is of the nature of God is more excellent than that which is connected with the capacity of human nature, even though enlightened by God, and having for its object the revealed glory of God.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Lord, here am I, one redeemed by love, to love for it, and in its might to love all. Amen. 1. Those who reject the word of God sometimes say that it is of no moment what we believe, if we but have love, and so they are for making love the one condition of salvation. In their zeal against this view, the orthodox party have sometimes presented faith in justification, as if love were not of so much importance. This is likely to be very dangerous. God is love. His Son is the gift, the bringer, of His love to us. The Spirit sheds abroad the love of God in the heart. The New Life is a life in love. Love is the greatest thing.", "source": "The New Life \"Love\" , on 1 Cor 13:13"}, {"name": "Watchman Nee", "short": "Nee", "comment": "The first item of the fruit of the Spirit is love. Without love other items, such as joy, peace, and endurance, are nothing.", "source": "pg 53, page_053"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Love is the real spirituality, that is spirituality. Love is the most difficult and the greatest of all gifts.", "source": "\"The Increase of God\""}], "declarations": ["I declare: faith, hope, and love abide in me, and love is the greatest.", "I declare: I walk in love, the greatest gift of all."], "prayer": "Lord Jesus, grow faith and hope in me, and let love be greatest in my life. Amen.", "theme_flag": "theme-based: Nee"}, {"day": 235, "ref": "1 Corinthians 15:3", "book": "1 Corinthians", "chapter": 15, "verse": 3, "text": "For I delivered unto you first of all that which I also received, how that Christ died for our sins according to the scriptures;", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "The apostle therefore reserved this question for the end of his epistle, and he enters into it thoroughly. First, he reminds them of that which he had preached among them as the gospel, that Christ died for our sins according to the scriptures* and was raised again according to the scriptures. This then was the means of their salvation, if they continued in it, unless they had believed in vain. Here at least was a very solid' foundation for his argument: their salvation (unless all that they had believed was but a profitless fable) depended on the fact of the resurrection, and was bound up with it.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Christ died for us as enemies, when we were disobedient. He took us up into His love; now that we are in Him, His Word is: \"Obey and abide; ye, even as I.\" Let us give ourselves to a willing and loving obedience. He will keep us abiding in His love. Ye, even as I. O my blessed Vine, who makest the branch in everything partake of Thy life and likeness, in this too I am to be like Thee: as Thy life in the Father's love through obedience, so mine in Thy love! Saviour, help me, that obedience may indeed be the link between Thee and me.", "source": "The True Vine \"Ye, Even as I\""}, {"name": "Watchman Nee", "short": "Nee", "comment": "The Lord Jesus has borne them on the Cross for us as our Substitute and has thereby obtained for us forgiveness.", "source": "The Normal Christian Life"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Christ died for our sins according to the Scriptures. It means that it was according to the fixed, eternal will of God.", "source": "\"The Spirit of Faith\""}], "declarations": ["I declare: Christ died for my sins according to the Scriptures.", "I declare: I am forgiven and cleansed by His death for me."], "prayer": "Lord Jesus, thank You for dying for my sins. I receive Your forgiveness with a grateful heart. Amen.", "theme_flag": "theme-based: Murray"}, {"day": 236, "ref": "1 Corinthians 15:20", "book": "1 Corinthians", "chapter": 15, "verse": 20, "text": "But now is Christ risen from the dead, and become the firstfruits of them that slept.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Had He not gained the victory, we should always have remained in prison. He had power Himself to resume life, but the great principle is the same; it is not only a resurrection of the dead, but those who are alive according to God arise as the objects of His favour, and by the exercise of that power which wills to have them for Himself and with Himself—Christ, the firstfruits ; those who are Christ's, at His coming. We are associated with Christ in resurrection. We come out like Him, not only from death, but from the dead. We mark, too, here how Christ and His people are inseparably identified. If they do not rise, He is not risen.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Believe that as surely as thou hast part in Christ, thou hast His Spirit too. Believe that He will do His work with power, if only thou dost not hinder Him. Believe that He is working, even when thou canst not dis- cern it. Believe that He will work mightily if thou dost ask this from the Father. J¢ is impossible to live the life of full abiding without being full of the Holy Spirit; believe that the fulness of the Spirit is indeed thy daily portion. Be sure and take time in prayer to dwell at the footstool of the throne of God and the Lamb, whence flows the river of the water of life.", "source": "Abide in Christ \"The Glorified One\""}, {"name": "Watchman Nee", "short": "Nee", "comment": "Praise the Lord! His resurrection enters into me, imparting to me a new life.", "source": "NCL"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "It is the first to show the new life. A very poor type of Christ, the Firstfruits of them that are asleep, awakened; breaking the slumber of death.", "source": "\"Spiritual Death and His Risen Life\""}], "declarations": ["I declare: Christ is risen from the dead, the firstfruits of all who sleep.", "I declare: because He lives, I shall live also."], "prayer": "Lord Jesus, You are risen and I share Your resurrection life. Thank You for the hope of glory. Amen.", "theme_flag": "theme-based: Nee"}, {"day": 237, "ref": "1 Corinthians 15:57", "book": "1 Corinthians", "chapter": 15, "verse": 57, "text": "But thanks be to God, which giveth us the victory through our Lord Jesus Christ.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Death has lost its sting, the grave its victory. All is changed by the grace which, at the end, will bring in this triumph. But meantime, by revealing to us the favour of God who bestows it, and the accomplishment of the redemption which is its basis, it has completely changed the character of death. Death, to the believer who must pass through it, is only leaving that which is mortal; it no longer bears the terror of God’s judgment, nor that of the power of Satan. Christ has gone into it and borne it and taken it away totally and for ever. Nor that only,—He has taken its source away. It was sin which sharpened and envenomed that sting.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "The blessings flowing from abiding in Christ as our redemption, are great, The soul is delivered from all fear of death, There was a time when even the Saviour feared death. But now no longer. He has triumphed over death; even His body has entered into the glory. The believer who abides in Christ as His full redemption, realizes even now his spiritual victory over death. It becomes to him the servant that removes the last rags of the old carnal vesture, ere he be clothed upon with the new body of glory. It carries the body to the grave, to lie there as the seed whence the new body will arise the worthy companion of the glorified spirit.", "source": "Abide in Christ \"As Your Redemption\""}, {"name": "Watchman Nee", "short": "Nee", "comment": "Our victory lies in hiding in Christ, and in counting in simple trust upon His Holy Spirit to overcome in us our fleshly lusts with His own new desires.", "source": "NCL"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "He, by dying, destroyed death for ever for all who put their faith in Him. Over death He conquered by His resurrection.", "source": "\"Victory\""}], "declarations": ["I declare: thanks be to God, He gives me the victory through my Lord Jesus Christ.", "I declare: I am more than a conqueror in Christ."], "prayer": "Lord Jesus, thank You for the victory You won for me. I walk in triumph today. Amen.", "theme_flag": "theme-based: Nee"}, {"day": 238, "ref": "1 Corinthians 15:58", "book": "1 Corinthians", "chapter": 15, "verse": 58, "text": "Therefore, my beloved brethren, be ye stedfast, unmoveable, always abounding in the work of the Lord, forasmuch as ye know that your labour is not in vain in the Lord.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Secondly, persons associated with the apostle in his work, and acting at his desire, and (in the case of Timothy) one pointed out by prophecy. Thirdly, an entirely independent labourer, partly instructed by others (see Acts xvii. 26), but acting where he saw fit, according to the Lord and to the gift he had received. Fourthly, one who gives himself to the service of the saints, as well as others who helped the apostle and laboured. Paul exhorts the faithful to submit themselves to such, and to all those who helped in the work and laboured. He would also have them acknowledge those who refreshed his heart by their service of devotedness.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "If it had not been for his faith in God, his heart had fainted. But in the confident assurance in God which faith gives, he urges himself and us to remember one thing above all—to wait upon God. “Wait on the Lord: be strong, and let your heart take courage: yea, wait thou on the Lord.” One of the chief needs in our waiting upon God, one of the deepest secrets of its blessedness and blessing, is a quiet, confident persuasion that it is not in vain; courage to believe that God will hear and help; we are STRONG AND OF Goop CouRAGE 45 waiting on a God who never could disappoint His people. “Be strong and of good courage.”", "source": "Waiting on God, Day 8 \"Strong and of Good Courage\""}, {"name": "Watchman Nee", "short": "Nee", "comment": "When you fight to get the victory, then you have lost the battle at the very outset. You are trying to fight into victory, and in doing so are relinquishing to the enemy the very ground that is yours.", "source": "Sit, Walk, Stand"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Because of this universal triumph of the One for whom you labour, 'Be steadfast, immovable, always abounding... inasmuch as you know that your labour is not in vain in the Lord.'", "source": "\"Victory\""}], "declarations": ["I declare: I am steadfast and unmoveable, always abounding in the work of the Lord.", "I declare: my labour in the Lord is never in vain."], "prayer": "Lord Jesus, keep me steadfast and faithful in Your work. I know my labour for You is never wasted. Amen.", "theme_flag": "theme-based: Darby, theme-based: Murray, theme-based: Nee"}, {"day": 239, "ref": "2 Corinthians 1:3", "book": "2 Corinthians", "chapter": 1, "verse": 3, "text": "Blessed be God, even the Father of our Lord Jesus Christ, the Father of mercies, and the God of all comfort;", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "\"Blessed be God, even the Father of our Lord Jesus Christ, the Father of mercies,and the God of all comfort, who comforteth us in all our tribulation, that we may be able to comfort them which are in any trouble, by the comfort wherewith we ourselves are comforted of God. For as the sufferings of Christ abound in us, so our consolation also aboundeth by Christ. And whether we be afflicted, it is for your consolation and salvation, which is effectual in the enduring of the same sufferings which we also suffer; or whether we be comforted it is for your consolation and salvation.”", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Our one duty is to be strong in the Lord, and in the power of His might. Let our faith cultivate large and clear apprehensions of the exceeding greatness of God’s power in them that believe, even that power of the risen and exalted Christ by which He triumphed over every enemy (Eph. i. 19-21), Let our faith consent to God’s wonderful and most blessed arrangement : nothing but feebleness in us as our own, all the power in Christ, and yet within our reach as surely as if it were in us. Let our faith daily go out of self and its life into the life of Christ, placing our whole being at His disposal for Him to work in us.", "source": "Abide in Christ \"In Affliction and Trial\""}, {"name": "Watchman Nee", "short": "Nee", "comment": "A person such as Paul is one who can comfort other people because no difficulty can touch him.", "source": "(\"The Cross and the Wine Mingled with Gall\"), pg 34"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Has it ever been a person who has never known the need of comfort himself? No, it is the one who, having been in the depths, and having been at the point of extremity, has discovered the comforts of God.", "source": "Spiritual Ministry"}], "declarations": ["I declare: my God is the Father of mercies and the God of all comfort.", "I declare: His comfort fills me, and I comfort others."], "prayer": "Lord Jesus, thank You for comforting me in every trouble. Make me a comforter to others as You have comforted me. Amen.", "theme_flag": "theme-based: Murray, theme-based: Nee"}, {"day": 240, "ref": "2 Corinthians 3:17", "book": "2 Corinthians", "chapter": 3, "verse": 17, "text": "Now the Lord is that Spirit: and where the Spirit of the Lord is, there is liberty.", "witnesses": [{"name": "John Nelson Darby", "short": "Da
