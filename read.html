us said unto him, Thou shalt love the Lord thy God with all thy heart, and with all thy soul, and with all thy mind.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "The lawyers ask a question, which gives the Lord occasion to extract from the whole law that which, in the sight of God, is its essence, presenting thus its perfection, and that which forms the happiness of those that walk in it. Grace alone rises higher.", "source": "Darby's Synopsis, Matthew 22"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Thou shalt love the Lord thy God, with all thy heart. Place yourself at once and wholly at Christ's disposal. Let the Master know that He can have you wholly.", "source": "The School of Obedience"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Christ did away with sin through His death and nullified death through His resurrection.", "source": "CW Vol.20 Q21 'Concerning resurrection and salvation'"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Three things will last forever, faith, hope, and love, and the greatest of these is love.", "source": "Open Windows, Jan 17 (The Increase of God)"}], "declarations": ["I declare: I love the Lord my God with all my heart.", "I declare: I love Him with all my soul and all my mind."], "prayer": "Lord Jesus, You are worthy of all my love. Fill my heart, soul, and mind with love for You.", "theme_flag": "theme-based: Murray, Sparks"}, {"day": 153, "ref": "Matthew 24:35", "book": "Matthew", "chapter": 24, "verse": 35, "text": "Heaven and earth shall pass away, but my words shall not pass away.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "When He shall come solemnly to take His earthly place in glory, that will not pass away like lightning. He shall sit upon the throne of His glory, and all nations shall be gathered before Him.", "source": "Darby's Synopsis, Matthew 24-25"}, {"name": "Andrew Murray", "short": "Murray", "comment": "His words are meant to be a living, an eternal, precious reality. How can there be any profit in reading of the blessed results of union with our Lord, if we believe that union to be practically beyond our reach.", "source": "Abide in Christ"}, {"name": "Watchman Nee", "short": "Nee", "comment": "The word of the Lord endures longer than heaven and earth.", "source": "CW Vol.15 ch.25"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "That is what the Word of God does. The words are the statements; the voice is the meaning.", "source": "Open Windows, Feb 2 (Features Of Zion, Ch.4)"}], "declarations": ["I declare: His words shall never pass away.", "I declare: I build my life on His eternal word."], "prayer": "Lord Jesus, Your word endures forever. Let it be the foundation of my life, unshaken and sure.", "theme_flag": "theme-based: Murray, Sparks"}, {"day": 154, "ref": "Matthew 25:40", "book": "Matthew", "chapter": 25, "verse": 40, "text": "And the King shall answer and say unto them, Verily I say unto you, Inasmuch as ye have done it unto one of the least of these my brethren, ye have done it unto me.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Such was His affection for His faithful servants, so highly did He value them, that He judged those to whom the testimony was sent according to the manner in which they had received these messengers, whether well or ill, as though it had been done to Himself.", "source": "Darby's Synopsis, Matthew 25"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Christ's power to save, and save completely, depends on His unceasing intercession. Let us plead for the salvation of sinners.", "source": "The Ministry of Intercession"}, {"name": "Watchman Nee", "short": "Nee", "comment": "The evil ones are punished solely on the ground that they did not treat the Christians well.", "source": "CW Vol.15 ch.27"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "In this very moment in Christ we can touch our brethren six or seven thousand miles away.", "source": "Open Windows, Feb 23 (Discipleship In The School Of Christ, Ch.4)"}], "declarations": ["I declare: What I do unto the least, I do unto Him.", "I declare: I serve Christ in serving others."], "prayer": "Lord Jesus, open my eyes to see You in the least of these. Let me serve You by serving them.", "theme_flag": "theme-based: Murray, Sparks"}, {"day": 155, "ref": "Matthew 28:18", "book": "Matthew", "chapter": 28, "verse": 18, "text": "And Jesus came and spake unto them, saying, All power is given unto me in heaven and in earth.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "All power is given unto Him in heaven and in earth, and accordingly the commission given to His disciples extends to all nations. To them they were to proclaim His rights, and make disciples of them.", "source": "Darby's Synopsis, Matthew 28"}, {"name": "Andrew Murray", "short": "Murray", "comment": "The Christian wants to conquer his weakness and to be freed from it: God wants us to rest and even rejoice in it. Christ teaches His servant to say, I take pleasure in infirmities.", "source": "Abide in Christ"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Only those who have received the power of the Holy Spirit and the power of resurrection can testify for the Lord.", "source": "CW Vol.42 ch.37"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "He is there at God's right hand. I would to God that this could come home to you by the Spirit.", "source": "Open Windows, Dec 20 (Four Greatnesses of Divine Revelation, Ch.6)"}], "declarations": ["I declare: All power is given unto Him in heaven and in earth.", "I declare: I go in His authority."], "prayer": "Lord Jesus, all power is Yours. Send me forth in Your authority to the nations.", "theme_flag": "theme-based: Sparks"}, {"day": 156, "ref": "Matthew 28:19", "book": "Matthew", "chapter": 28, "verse": 19, "text": "¶ Go ye therefore, and teach all nations, baptizing them in the name of the Father, and of the Son, and of the Holy Ghost:", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Lord of heaven and earth, His disciples were to proclaim Him throughout all nations, founding their doctrine on the confession of the Father, of the Son, and of the Holy Ghost. They were to teach, not the law, but the precepts of Jesus.", "source": "Darby's Synopsis, Matthew 28"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Place yourself at once and wholly at Christ's disposal. Enroll yourself at once with Him as a volunteer for His service.", "source": "The School of Obedience"}, {"name": "Watchman Nee", "short": "Nee", "comment": "According to the Bible, there is only one requirement for being saved: to believe.", "source": "CW Vol.20 Q43 'Concerning the requirements for salvation'"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Therefore, as you go, disciple people in all nations.", "source": "Open Windows, Dec 20 (Four Greatnesses of Divine Revelation)"}], "declarations": ["I declare: I go and make disciples of all nations.", "I declare: I teach them to observe all He commanded."], "prayer": "Lord Jesus, make me Your witness. Use me to bring others into Your kingdom.", "theme_flag": "theme-based: Murray, Sparks"}, {"day": 157, "ref": "Matthew 28:20", "book": "Matthew", "chapter": 28, "verse": 20, "text": "Teaching them to observe all things whatsoever I have commanded you: and, lo, I am with you alway, even unto the end of the world. Amen.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "He would be with them, with the disciples who thus confessed Him, unto the end of the age. It is this which connects all that will be accomplished until Christ sits upon the great white throne with the testimony that He Himself rendered on the earth.", "source": "Darby's Synopsis, Matthew 28"}, {"name": "Andrew Murray", "short": "Murray", "comment": "All these words breathe nothing less than the spirit of world conquest. The heart of Christ was set on claiming His rightful dominion over the world He had redeemed. He counts on His disciples to undertake and carry out the work.", "source": "The School of Obedience"}, {"name": "Watchman Nee", "short": "Nee", "comment": "He lives always to intercede for us.", "source": "CW Vol.04 ch.1 'Meditations on Revelation'"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "He is there at God's right hand. I would to God that this could come home to you by the Spirit, for what differences it would make.", "source": "Open Windows, Dec 20 (Four Greatnesses of Divine Revelation, Ch.6)"}], "declarations": ["I declare: He is with me alway, even unto the end.", "I declare: I never walk alone."], "prayer": "Lord Jesus, You are with me always. Let me live in the consciousness of Your abiding presence.", "theme_flag": "theme-based: Murray, Sparks"}, {"day": 158, "ref": "Mark 8:34", "book": "Mark", "chapter": 8, "verse": 34, "text": "¶ And when he had called the people unto him with his disciples also, he said unto them, Whosoever will come after me, let him deny himself, and take up his cross, and follow me.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "For the cross comprises in itself all the glory of God. Man prefers the glory of man, and thus Satan governs him.", "source": "Darby's Synopsis, Mark 8"}, {"name": "Andrew Murray", "short": "Murray", "comment": "No man can follow Him unless he do that. Self must be utterly denied. When Peter denied Christ, he said three times: I do not know the man.", "source": "Absolute Surrender"}, {"name": "Watchman Nee", "short": "Nee", "comment": "He must be fully willing in his heart to accept the result of all the working of the cross.", "source": "CW Vol.01 ch.7 'The soul-life'"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "It is Christ in that fullness, which is more than our salvation, more than our initial salvation.", "source": "Open Windows, Jun 15 (God's Supreme Interest in Man, Ch.3)"}], "declarations": ["I declare: I deny myself and take up my cross.", "I declare: I follow Him, whatever the cost."], "prayer": "Lord Jesus, I will follow You. Give me grace to deny self daily and walk in Your steps.", "theme_flag": "theme-based: Murray, Sparks"}, {"day": 159, "ref": "Mark 9:23", "book": "Mark", "chapter": 9, "verse": 23, "text": "Jesus said unto him, If thou canst believe, all things are possible to him that believeth.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "The almighty power is present, it only needs faith to profit by it. If the heart turns to Jesus, it can bring its unbelief to Him as well as all the rest. There is love and power in Him for every kind of weakness.", "source": "Darby's Synopsis, Mark 9"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Remember there was once a man to whom Christ had said: If thou canst believe, all things are possible to him that believeth. And his heart was afraid, and he cried out.", "source": "Absolute Surrender"}, {"name": "Watchman Nee", "short": "Nee", "comment": "In sickness, the question is not whether I can or cannot but whether you believe or not.", "source": "The Spiritual Man ('God as the Life of the Body')"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "No, we are coming to a living Person; we believe that He is!", "source": "Open Windows, Jan 12 (The Living God)"}], "declarations": ["I declare: All things are possible to him that believeth.", "I declare: I believe, Lord, help my unbelief."], "prayer": "Lord Jesus, increase my faith. Let all things be possible as I believe in You.", "theme_flag": "theme-based: Nee, Sparks"}, {"day": 160, "ref": "Mark 10:27", "book": "Mark", "chapter": 10, "verse": 27, "text": "And Jesus looking upon them saith, With men it is impossible, but not with God: for with God all things are possible.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "God alone is good, and, sin having come in, it is impossible, if He be manifested, that man can be in relationship with God; but with Him all is possible. The cross is the only path to God.", "source": "Darby's Synopsis, Mark 10"}, {"name": "Andrew Murray", "short": "Murray", "comment": "But the things that are impossible with men are possible with God. If the Lord Himself will keep the soul, a life of unbroken fellowship with the Son of God is attainable.", "source": "Abide in Christ"}, {"name": "Watchman Nee", "short": "Nee", "comment": "When we give up the case, then God will take it up.", "source": "The Normal Christian Life ('Our End Is God's Beginning')"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "There are two ways of viewing the impossible. Everything depends upon where you put the impossibility, on the thing or on God.", "source": "Open Windows, Jul 16 (The Problem of the Stone)"}], "declarations": ["I declare: With men it is impossible, but with God all things are possible.", "I declare: I trust not in man but in God."], "prayer": "Lord Jesus, what I cannot do, You can. I rest in Your almighty power to do the impossible.", "theme_flag": "theme-based: Murray, Nee"}, {"day": 161, "ref": "Mark 10:45", "book": "Mark", "chapter": 10, "verse": 45, "text": "For even the Son of man came not to be ministered unto, but to minister, and to give his life a ransom for many.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Christ walked in it, giving His life a ransom for many. Lowliness of service is the place into which Christ brings us; in such He had walked.", "source": "Darby's Synopsis, Mark 10"}, {"name": "Andrew Murray", "short": "Murray", "comment": "The word redemption refers to our complete and final deliverance from all its consequences, when the Redeemer's work shall become fully manifest. This is the blessed end to which Christ and life in Him is to lead.", "source": "Abide in Christ"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Our sins had first to be dealt with, and this was effected by the precious blood of Christ.", "source": "The Normal Christian Life"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "It is Christ in that fullness. The door is essential, but it is what it leads to that justifies going in.", "source": "Open Windows, Jun 15 (God's Supreme Interest in Man, Ch.3)"}], "declarations": ["I declare: He came not to be served, but to serve.", "I declare: I follow His example of service."], "prayer": "Lord Jesus, You gave Your life a ransom for many. Teach me to serve as You served.", "theme_flag": "theme-based: Murray, Nee, Sparks"}, {"day": 162, "ref": "Mark 11:24", "book": "Mark", "chapter": 11, "verse": 24, "text": "Therefore I say unto you, What things soever ye desire, when ye pray, believe that ye receive them, and ye shall have them.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "He assures His disciples that whatsoever they asked in faith should be accomplished; but that they must act in grace, if they would enjoy this privilege.", "source": "Darby's Synopsis, Mark 11"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Here we have a summary of the teaching of our Lord Jesus on prayer. The more heartily we enter into the mind of our blessed Lord, the more surely will His words be as living seeds.", "source": "The Ministry of Intercession"}, {"name": "Watchman Nee", "short": "Nee", "comment": "God's will reaches only as far as our prayers have reached.", "source": "CW Vol.11 ch.9 'The prayer that cooperates with God'"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Ask the Lord to give you spiritual understanding.", "source": "Open Windows, Dec 9 (That They May All Be One, Meeting 6)"}], "declarations": ["I declare: What I desire in prayer, believing, I receive.", "I declare: I pray with faith, and I have."], "prayer": "Lord Jesus, teach me to pray believing. Let me receive what I ask in faith.", "theme_flag": "theme-based: Sparks"}, {"day": 163, "ref": "Mark 13:31", "book": "Mark", "chapter": 13, "verse": 31, "text": "Heaven and earth shall pass away: but my words shall not pass away.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Everything should be shaken after that time, and the Son of man should come. Power should take the place of testimony, and the Son of man should gather together His elect from all parts of the earth.", "source": "Darby's Synopsis, Mark 13"}, {"name": "Andrew Murray", "short": "Murray", "comment": "His words are meant to be a living, an eternal, precious reality. We may reasonably expect their accomplishment.", "source": "Abide in Christ"}, {"name": "Watchman Nee", "short": "Nee", "comment": "God's Word leads His people into a realm more profound than one of mere sensation; it brings them into the realm of the eternal spirit.", "source": "The Spiritual Man ('The Dividing of Spirit and Soul')"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "That is what the Word of God does. It brings heaven down here.", "source": "Open Windows, Feb 2 (Features Of Zion, Ch.4)"}], "declarations": ["I declare: His words shall not pass away.", "I declare: I stand on His unchanging word."], "prayer": "Lord Jesus, Your word is settled forever. I anchor my soul to its eternal truth.", "theme_flag": "theme-based: Murray, Nee, Sparks"}, {"day": 164, "ref": "Mark 16:15", "book": "Mark", "chapter": 16, "verse": 15, "text": "And he said unto them, Go ye into all the world, and preach the gospel to every creature.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "He tells them to go into all the world and preach the gospel to every creature. It is no longer specifically the gospel of the kingdom. The message is sent to the whole world.", "source": "Darby's Synopsis, Mark 16"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Go ye therefore and make disciples of all the nations. Go ye into all the world and preach the gospel to every creature. As Thou didst send Me into the world, even so send I them.", "source": "The School of Obedience"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Only the blood of the Lord Jesus enables us to draw near to God.", "source": "CW Vol.19 ch.1 'The blood and a worship that draws near to God'"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "The gospel I preached is not something that man made up.", "source": "Open Windows, Dec 24 (The Risen Lord and Things Which Cannot Be Shaken)"}], "declarations": ["I declare: I go into all the world and preach the gospel.", "I declare: The gospel is for every creature."], "prayer": "Lord Jesus, the world needs Your gospel. Send me, and give me boldness to proclaim it.", "theme_flag": "theme-based: Murray, Sparks"}, {"day": 165, "ref": "Luke 1:37", "book": "Luke", "chapter": 1, "verse": 37, "text": "For with God nothing shall be impossible.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "It should be established according to the counsels of God which are unchangeable, and His power which never fails.", "source": "Darby's Synopsis, Luke 1"}, {"name": "Andrew Murray", "short": "Murray", "comment": "But the things that are impossible with men are possible with God. While we remember our weakness, we forget His all-sufficient power.", "source": "Abide in Christ"}, {"name": "Watchman Nee", "short": "Nee", "comment": "We had tasted the authority of the name that is above every name, the name that has power in heaven and earth and hell.", "source": "Sit, Walk, Stand ('The God of Elijah')"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "If Christ is present, which means nothing else than that God is present, anything is possible at any moment.", "source": "Open Windows, May 7 (Knowing God in Christ, Ch.9)"}], "declarations": ["I declare: With God nothing shall be impossible.", "I declare: I believe God for the impossible."], "prayer": "Lord Jesus, nothing is too hard for You. I bring my impossibilities to You in faith.", "theme_flag": "theme-based: Murray, Nee"}, {"day": 166, "ref": "Luke 2:11", "book": "Luke", "chapter": 2, "verse": 11, "text": "For unto you is born this day in the city of David a Saviour, which is Christ the Lord.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Unto you is born this day in the city of David a Saviour, which is Christ the Lord. This was proclaiming good tidings to them and to all the people.", "source": "Darby's Synopsis, Luke 2"}, {"name": "Andrew Murray", "short": "Murray", "comment": "We possess a Saviour whose love and power are infinite. Look stedfastly unto Jesus, the author and finisher of faith, whose omnipotence embraces both heaven and earth.", "source": "Abide in Christ"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Our God sent His Son to the earth and sowed Him as a seed.", "source": "CW Vol.37 ch.21 'The seed of God'"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "He voluntarily lived in a state of absolute dependence on Him. He refused to have anything in Himself.", "source": "Open Windows, Dec 25 (Christ Our All, Ch.4)"}], "declarations": ["I declare: Unto us a Saviour is born, Christ the Lord.", "I declare: I rejoice in His coming."], "prayer": "Lord Jesus, my Saviour, born in Bethlehem. I worship You who came to save me.", "theme_flag": "theme-based: Murray, Sparks"}, {"day": 167, "ref": "Luke 2:14", "book": "Luke", "chapter": 2, "verse": 14, "text": "Glory to God in the highest, and on earth peace, good will toward men.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "But if sin had placed Him there, grace had placed Him there. Grace superabounds. The thought of Jesus excludes all that could oppress the heart.", "source": "Darby's Synopsis, Luke 2"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Jesus Christ came to restore peace on earth, and peace in the soul. Where everything is as God would have it, in harmony with His will, there alone can peace reign.", "source": "Abide in Christ"}, {"name": "Watchman Nee", "short": "Nee", "comment": "The Lord Jesus has 'made peace through the blood of His cross'.", "source": "CW Vol.06 ch.1"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Make every effort to keep the unity of the Spirit through the bond of peace.", "source": "Open Windows, Feb 19 (The Testimony of the Christ, Ch.7)"}], "declarations": ["I declare: Glory to God in the highest.", "I declare: Peace on earth, good will toward men."], "prayer": "Lord Jesus, glory to God for Your coming. Let Your peace fill my heart and my home.", "theme_flag": "theme-based: Murray, Sparks"}, {"day": 168, "ref": "Luke 4:18", "book": "Luke", "chapter": 4, "verse": 18, "text": "The Spirit of the Lord is upon me, because he hath anointed me to preach the gospel to the poor; he hath sent me to heal the brokenhearted, to preach deliverance to the captives, and recovering of sight to the blind, to set at liberty them that are bruised,", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "He presents Himself in this character: The Spirit of Jehovah is upon me, because he hath anointed me to preach the gospel to the poor. He sets Himself to accomplish the work which God His Father committed to Him in this world, and that as man, by the power of the Holy Ghost.", "source": "Darby's Synopsis, Luke 4"}, {"name": "Andrew Murray", "short": "Murray", "comment": "The Spirit of the Lord is upon me, because He anointed me to preach good tidings to the poor. He hath sent me to proclaim release to the captives.", "source": "The Spirit of Christ"}, {"name": "Watchman Nee", "short": "Nee", "comment": "We who are mere nonentities can have the same Spirit resting upon us.", "source": "The Normal Christian Life ('The Holy Spirit')"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "If it is true that you and I have been anointed of the Holy Spirit, our presence in this world ought to register something positive for God.", "source": "Open Windows, Jun 28 (The Holy Spirit as the Spirit of Anointing)"}], "declarations": ["I declare: The Spirit of the Lord is upon me.", "I declare: He anoints me to preach the gospel."], "prayer": "Lord Jesus, anointed One, anoint me with Your Spirit. Let me preach good tidings to the poor.", "theme_flag": "theme-based: Murray, Nee"}, {"day": 169, "ref": "Luke 6:31", "book": "Luke", "chapter": 6, "verse": 31, "text": "And as ye would that men should do to you, do ye also to them likewise.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Coming around Christ to hear Him was not the question, but that He should be so precious to their hearts that they would put aside every obstacle and practically obey Him.", "source": "Darby's Synopsis, Luke 6"}, {"name": "Andrew Murray", "short": "Murray", "comment": "I will do His will. It had pleased God to bring my mind into such a state, that I was willing to carry out into my life whatever I should find in the Scriptures.", "source": "With Christ in the School of Prayer"}, {"name": "Watchman Nee", "short": "Nee", "comment": "God has come down to earth personally and borne our sins.", "source": "CW Vol.28 ch.6 'The work of Christ - redemption'"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "In God's purpose there is no room for personal interests. We have to deny ourselves.", "source": "Open Windows, Feb 5 (Christ Our All, Ch.10)"}], "declarations": ["I declare: I do unto others as I would have them do unto me.", "I declare: I walk in love toward all."], "prayer": "Lord Jesus, teach me Your golden rule. Let me treat others with the love You show me.", "theme_flag": "theme-based: Murray, Sparks"}, {"day": 170, "ref": "Luke 6:38", "book": "Luke", "chapter": 6, "verse": 38, "text": "Give, and it shall be given unto you; good measure, pressed down, and shaken together, and running over, shall men give into your bosom. For with the same measure that ye mete withal it shall be measured to you again.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Christ was the manifestation of God in grace to men.", "source": "Darby's Synopsis, Luke 6"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Ask, and it shall be given you; seek, and ye shall find; knock, and it shall be opened unto you. For every one that asketh receiveth.", "source": "With Christ in the School of Prayer"}, {"name": "Watchman Nee", "short": "Nee", "comment": "The secret to receiving is giving.", "source": "CW Vol.06 ch.8"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "His object is that they should know Him. This is the all-governing end of all His dealings with us.", "source": "Open Windows, Apr 25 (On Knowing The Lord)"}], "declarations": ["I declare: I give, and it shall be given unto me.", "I declare: I sow generously and reap abundantly."], "prayer": "Lord Jesus, You give good measure, pressed down and running over. Make me a cheerful giver.", "theme_flag": "theme-based: Murray, Sparks"}, {"day": 171, "ref": "Luke 9:23", "book": "Luke", "chapter": 9, "verse": 23, "text": "¶ And he said to them all, If any man will come after me, let him deny himself, and take up his cross daily, and follow me.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "It should be through suffering, suffering that, as to human trials, His disciples were to share by following Him. But in losing their life for Him, they would gain it.", "source": "Darby's Synopsis, Luke 9"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Let a man deny himself, and take up his cross. The life and the power of self must be denied, instead of waiting in dependence on the Holy Spirit for Him to work.", "source": "The Spirit of Christ"}, {"name": "Watchman Nee", "short": "Nee", "comment": "If the Lord received death while on the earth, even more, should not we also?", "source": "CW Vol.16 ch.2 'The seven churches' (Smyrna)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "A truly crucified people are never in danger of the world. The world has no place with a crucified man or woman.", "source": "Open Windows, Jan 11 (The Altar Governs Everything)"}], "declarations": ["I declare: I take up my cross daily and follow Him.", "I declare: I deny myself every day."], "prayer": "Lord Jesus, daily I take up my cross. Give me strength for today's denial and today's following.", "theme_flag": "theme-based: Murray"}, {"day": 172, "ref": "Luke 10:27", "book": "Luke", "chapter": 10, "verse": 27, "text": "And he answering said, Thou shalt love the Lord thy God with all thy heart, and with all thy soul, and with all thy strength, and with all thy mind; and thy neighbour as thyself.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "For love, unchilled by sin, saw the need through the outward opposition. The Lord of the harvest alone could send forth true labourers.", "source": "Darby's Synopsis, Luke 10"}, {"name": "Andrew Murray", "short": "Murray", "comment": "We miss the compassion of Jesus, which gave rise to this request for prayer. To love their neighbours as themselves, to live entirely for God's glory in their fellow men, is the Father's first desire.", "source": "With Christ in the School of Prayer"}, {"name": "Watchman Nee", "short": "Nee", "comment": "The Lord demands our love to Him.", "source": "CW Vol.16 ch.2 'The seven churches' (Ephesus)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "The Father loves the Son and shows Him everything He is doing.", "source": "Open Windows, Mar 14 (Christ Our All, Ch.9)"}], "declarations": ["I declare: I love God with all my heart, soul, strength, and mind.", "I declare: I love my neighbour as myself."], "prayer": "Lord Jesus, fill me with love for God and for others. Let love be the mark of my life.", "theme_flag": "theme-based: Murray, Sparks"}, {"day": 173, "ref": "Luke 11:9", "book": "Luke", "chapter": 11, "verse": 9, "text": "And I say unto you, Ask, and it shall be given you; seek, and ye shall find; knock, and it shall be opened unto you.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "The Lord dwells on perseverance, that petitions should not be those of a heart indifferent to the result. He assures them that their prayers should not be in vain.", "source": "Darby's Synopsis, Luke 11"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Persevering prayer appears to be the school in which the soul is strengthened for the boldness of faith. To others, triumphant thanksgiving appears the only proper expression of the assurance of faith.", "source": "With Christ in the School of Prayer"}, {"name": "Watchman Nee", "short": "Nee", "comment": "We know that God answers prayers.", "source": "CW Vol.27 ch.1 'The search for God'"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Our prayer life has got to be on a heavenly basis. The Lord would have prayer touching things heavenly.", "source": "Open Windows, Sep 21 (The Altar of Incense)"}], "declarations": ["I declare: I ask and receive, I seek and find.", "I declare: I knock and it is opened unto me."], "prayer": "Lord Jesus, You invite me to ask. I come boldly, seeking and knocking, believing I shall receive.", "theme_flag": null}, {"day": 174, "ref": "Luke 12:32", "book": "Luke", "chapter": 12, "verse": 32, "text": "Fear not, little flock; for it is your Father’s good pleasure to give you the kingdom.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "It was the Father's good pleasure to give them the kingdom. Strangers and pilgrims here, their treasure was to be in heaven; and thus their heart would be there also.", "source": "Darby's Synopsis, Luke 12"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Each believing intercessor has his own immediate circle for whom he first prays. It is of great consequence that intercession should be personal, pointed, and definite.", "source": "With Christ in the School of Prayer"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Thank the Father, for He has accepted us and has given us the eternal life!", "source": "CW Vol.06 ch.1"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "It is true that we may have a tremendous amount of knowledge, and yet coming into Christ has got to learn the ABC in spiritual things.", "source": "Open Windows, Nov 3 (Foundations, Ch.4)"}], "declarations": ["I declare: Fear not, little flock.", "I declare: It is the Father's good pleasure to give me the kingdom."], "prayer": "Lord Jesus, I fear not. My Father delights to give me the kingdom.", "theme_flag": "theme-based: Murray, Sparks"}, {"day": 175, "ref": "Luke 15:7", "book": "Luke", "chapter": 15, "verse": 7, "text": "I say unto you, that likewise joy shall be in heaven over one sinner that repenteth, more than over ninety and nine just persons, which need no repentance.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "The shepherd seeks until he finds, because he has an interest in the matter. He takes the whole charge, happy to recover his sheep. This is the mind of heaven.", "source": "Darby's Synopsis, Luke 15"}, {"name": "Andrew Murray", "short": "Murray", "comment": "It is to you who have heard and hearkened to the call, Come unto me, that this new invitation comes, Abide in me. You experienced that His word was truth; all His promises He fulfilled.", "source": "Abide in Christ"}, {"name": "Watchman Nee", "short": "Nee", "comment": "The most joyful thing in a Christian's life is to have fellowship with the Lord.", "source": "CW Vol.04 ch.1"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "I am the good shepherd. Here is the great I AM saying what He is.", "source": "Open Windows, Mar 10 (Features Of Zion, Ch.4)"}], "declarations": ["I declare: There is joy in heaven over one sinner that repents.", "I declare: I was lost and am found."], "prayer": "Lord Jesus, Good Shepherd, You sought me. Let heaven rejoice over every sinner who returns.", "theme_flag": "theme-based: Murray, Nee, Sparks"}, {"day": 176, "ref": "Luke 19:10", "book": "Luke", "chapter": 19, "verse": 10, "text": "For the Son of man is come to seek and to save that which was lost.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "It did not bar the way to that salvation which was come to save the lost. He brought salvation, whoever might be heir to it.", "source": "Darby's Synopsis, Luke 19"}, {"name": "Andrew Murray", "short": "Murray", "comment": "God seeks intercessors. He longs to reveal His power and glory as God, His saving love, more abundantly. He seeks them in His Church.", "source": "The Ministry of Intercession"}, {"name": "Watchman Nee", "short": "Nee", "comment": "From Genesis to Revelation, we can see that God has always been seeking man.", "source": "CW Vol.37 ch.28 'God needing man'"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Christ is all that we need for a life which is glorifying to Him. It is what Christ is.", "source": "Open Windows, Jan 2 (The Essential Newness of the New Creation, Ch.4)"}], "declarations": ["I declare: The Son of man came to seek and save the lost.", "I declare: I was lost, and He found me."], "prayer": "Lord Jesus, Seeker of the lost, thank You for finding me. Use me to seek others.", "theme_flag": "theme-based: Murray, Sparks"}, {"day": 177, "ref": "Luke 24:26", "book": "Luke", "chapter": 24, "verse": 26, "text": "Ought not Christ to have suffered these things, and to enter into his glory?", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "There are two distinct parts in the sufferings of Christ. That which He suffered to accomplish expiation for sin, when actually bearing our sins, made sin for us, drinking the cup which the will of His Father had given Him to drink.", "source": "Darby's Synopsis, Luke 24"}, {"name": "Andrew Murray", "short": "Murray", "comment": "It is a deep spiritual mystery only reached in the way Christ reached His glory, through conformity to His sufferings and the fellowship of His cross.", "source": "The Spirit of Christ"}, {"name": "Watchman Nee", "short": "Nee", "comment": "He is most eager to forgive us; He 'runs' to forgive us.", "source": "CW Vol.19 ch.10 'Forgiveness and confession'"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "We are going to have a path of suffering if we are in fellowship with the Lord Jesus.", "source": "Open Windows, Oct 10 (Suffering and Glory)"}], "declarations": ["I declare: Christ suffered and entered into His glory.", "I declare: I share His sufferings and His glory."], "prayer": "Lord Jesus, You suffered before You entered glory. Teach me that the cross comes before the crown.", "theme_flag": "theme-based: Murray"}, {"day": 178, "ref": "Luke 24:27", "book": "Luke", "chapter": 24, "verse": 27, "text": "And beginning at Moses and all the prophets, he expounded unto them in all the scriptures the things concerning himself.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "He opens their understanding, that they might understand the scriptures. Thus it must needs have been, for so hath God said in his word.", "source": "Darby's Synopsis, Luke 24"}, {"name": "Andrew Murray", "short": "Murray", "comment": "From the commencement of His public life to its close He lived by the Word of God. It is written was the sword of the Spirit with which He conquered Satan.", "source": "The School of Obedience"}, {"name": "Watchman Nee", "short": "Nee", "comment": "The resurrection of Christ is the beginning of everything in the new creation.", "source": "CW Vol.42 ch.46"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "That is what the Word of God does. It brings heaven down here.", "source": "Open Windows, Feb 2 (Features Of Zion, Ch.4)"}], "declarations": ["I declare: He expounds the scriptures concerning Himself.", "I declare: I see Christ in all the scriptures."], "prayer": "Lord Jesus, open the scriptures to me. Show me Yourself in Moses and all the prophets.", "theme_flag": "theme-based: Murray, Sparks"}, {"day": 179, "ref": "John 1:1", "book": "John", "chapter": 1, "verse": 1, "text": "In the beginning was the Word, and the Word was with God, and the Word was God.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "How the Spirit passes from the divine and eternal nature of the Word who was before all things, to the manifestation, in this world, of the Word made flesh in the Person of Jesus.", "source": "Darby's Synopsis, John 1"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Teach me in all my intercourse with Thy word to deny the flesh and the fleshly mind, to wait in deep humility and faith for the inward working of the Spirit to quicken the word.", "source": "The Spirit of Christ"}, {"name": "Watchman Nee", "short": "Nee", "comment": "They should allow the word of God to penetrate deep within them.", "source": "CW Vol.01 ch.7 'The soul-life'"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Here is the great I AM saying what He is. And then you notice how frequently He links with us.", "source": "Open Windows, Mar 10 (Features Of Zion, Ch.4)"}], "declarations": ["I declare: In the beginning was the Word.", "I declare: The Word was with God, and the Word was God."], "prayer": "Lord Jesus, eternal Word, I worship You who was before all things.", "theme_flag": "theme-based: Sparks"}, {"day": 180, "ref": "John 1:14", "book": "John", "chapter": 1, "verse": 14, "text": "And the Word was made flesh, and dwelt among us, (and we beheld his glory, the glory as of the only begotten of the Father,) full of grace and truth.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "The Word was made flesh, and dwelt among us in the fulness of grace and truth. This is the great fact, the source of all blessing to us.", "source": "Darby's Synopsis, John 1"}, {"name": "Andrew Murray", "short": "Murray", "comment": "His glory is the perfection and power of His Divine will. When God glorified Christ, He passed as man into the life of God, who is a spirit.", "source": "The Spirit of Christ"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Only the One who is the highest can condescend to be the lowest.", "source": "CW Vol.06 ch.14"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "He refused to have anything in Himself. Everything He needed He drew from heaven.", "source": "Open Windows, Dec 25 (Christ Our All, Ch.4)"}], "declarations": ["I declare: The Word was made flesh and dwelt among us.", "I declare: I beheld His glory, full of grace and truth."], "prayer": "Lord Jesus, God manifest in flesh, I marvel that You dwelt among us.", "theme_flag": "theme-based: Sparks"}, {"day": 181, "ref": "John 1:29", "book": "John", "chapter": 1, "verse": 29, "text": "¶ The next day John seeth Jesus coming unto him, and saith, Behold the Lamb of God, which taketh away the sin of the world.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "He is the Lamb of God, one whom God alone could furnish, and was for God, and according to His mind, who takes away the sin of the world.", "source": "Darby's Synopsis, John 1"}, {"name": "Andrew Murray", "short": "Murray", "comment": "The Lord Jesus Christ came down from Heaven as the Son of God's love. He lived a life of love here upon earth, in compassion over the poor and miserable.", "source": "Absolute Surrender"}, {"name": "Watchman Nee", "short": "Nee", "comment": "The Lord propitiated our sin so that we could be saved through His blood.", "source": "CW Vol.18 ch.18 'The other aspect of the trespass offering'"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "It is quite safe to trust yourself to a crucified man or woman.", "source": "Open Windows, Jan 11 (The Altar Governs Everything)"}], "declarations": ["I declare: Behold the Lamb of God.", "I declare: He takes away the sin of the world."], "prayer": "Lord Jesus, Lamb of God, thank You for taking away my sin.", "theme_flag": "theme-based: Murray, Sparks"}, {"day": 182, "ref": "John 3:3", "book": "John", "chapter": 3, "verse": 3, "text": "Jesus answered and said unto him, Verily, verily, I say unto thee, Except a man be born again, he cannot see the kingdom of God.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Man needed to be renewed in the source of his nature, without which he could not see the kingdom. To see it, a man must be born again.", "source": "Darby's Synopsis, John 3"}, {"name": "Andrew Murray", "short": "Murray", "comment": "For as many as are led by the Spirit of God, they are the sons of God. If by the Spirit ye make to die the deeds of the body, ye shall live.", "source": "The Spirit of Christ"}, {"name": "Watchman Nee", "short": "Nee", "comment": "A man receives life by believing that He is the Christ and the Son of God.", "source": "CW Vol.11 ch.10 'God's center'"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "We are coming to a living Person; we believe that He is!", "source": "Open Windows, Jan 12 (The Living God)"}], "declarations": ["I declare: I am born again.", "I declare: I see the kingdom of God."], "prayer": "Lord Jesus, by Your Spirit I am born anew. Let me live as a child of the kingdom.", "theme_flag": "theme-based: Murray, Sparks"}, {"day": 183, "ref": "John 3:16", "book": "John", "chapter": 3, "verse": 16, "text": "¶ For God so loved the world, that he gave his only begotten Son, that whosoever believeth in him should not perish, but have everlasting life.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "God had so loved the world that He had given His only begotten Son, that whosoever believes in Him should have everlasting life.", "source": "Darby's Synopsis, John 3"}, {"name": "Andrew Murray", "short": "Murray", "comment": "The Lord Jesus Christ came down from Heaven as the Son of God's love. God so loved the world that He gave His only begotten Son.", "source": "Absolute Surrender"}, {"name": "Watchman Nee", "short": "Nee", "comment": "God created man and redeemed him for Christ.", "source": "CW Vol.11 ch.10 'God's center'"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Do you want to know Him as Father? The Lord Jesus carried in His heart a great longing.", "source": "Open Windows, Feb 9 (The Alpha and the Omega)"}], "declarations": ["I declare: God so loved the world.", "I declare: I believe in Him and have everlasting life."], "prayer": "Lord Jesus, Son of God's love, I believe in You. Thank You for everlasting life.", "theme_flag": "theme-based: Sparks"}, {"day": 184, "ref": "John 3:17", "book": "John", "chapter": 3, "verse": 17, "text": "For God sent not his Son into the world to condemn the world; but that the world through him might be saved.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Christ, lifted up from the earth, draws all men to Him. On the cross we see the ineffable gift of the Son of God.", "source": "Darby's Synopsis, John 3"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Ye shall receive power when the Holy Ghost is come upon you; and ye shall be my witnesses, both in Jerusalem and unto the uttermost parts of the earth.", "source": "The Spirit of Christ"}, {"name": "Watchman Nee", "short": "Nee", "comment": "God sent His Son to die for us and laid all our sins on Him.", "source": "CW Vol.18 ch.15 'The salvation of the adulterous woman'"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Christ is all that we need. It is what Christ is, what we have in the new creation.", "source": "Open Windows, Jan 2 (The Essential Newness of the New Creation, Ch.4)"}], "declarations": ["I declare: God sent His Son not to condemn, but to save.", "I declare: Through Him I am saved."], "prayer": "Lord Jesus, my Saviour, not my condemner. I rest in Your salvation.", "theme_flag": "theme-based: Murray, Sparks"}, {"day": 185, "ref": "John 4:14", "book": "John", "chapter": 4, "verse": 14, "text": "But whosoever drinketh of the water that I shall give him shall never thirst; but the water that I shall give him shall be in him a well of water springing up into everlasting life.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "The floodgates of grace are lifted up by the misery which that grace waters. He makes manifest that which God is in grace; and the God of grace was there.", "source": "Darby's Synopsis, John 4"}, {"name": "Andrew Murray", "short": "Murray", "comment": "The interchange of giving up and taking in is a life process, and may not cease for a moment. No sooner does the believer begin to rejoice in what he has, than the inflow of new grace is retarded.", "source": "Abide in Christ"}, {"name": "Watchman Nee", "short": "Nee", "comment": "If you would have asked, He would have given you living water.", "source": "CW Vol.18 ch.15 'The salvation of the adulterous woman'"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Remember that you are in the Land; you are in Christ; you have Him as your Rest.", "source": "Open Windows, Jan 2 (The Essential Newness of the New Creation, Ch.4)"}], "declarations": ["I declare: I drink of His living water and never thirst.", "I declare: His well springs up into everlasting life."], "prayer": "Lord Jesus, give me this living water. Let it spring up in me unto everlasting life.", "theme_flag": "theme-based: Murray, Sparks"}, {"day": 186, "ref": "John 5:24", "book": "John", "chapter": 5, "verse": 24, "text": "Verily, verily, I say unto you, He that heareth my word, and believeth on him that sent me, hath everlasting life, and shall not come into condemnation; but is passed from death unto life.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "He that hears His word, and believes Him who sent Him, has everlasting life, such is the quickening power of His word, and shall not come into judgment. He is passed from death into life. Simple and wonderful testimony!", "source": "Darby's Synopsis, John, chapter 5 section"}, {"name": "Andrew Murray", "short": "Murray", "comment": "How glorious, then, is the blessing which every one receives that believes in the Lord Jesus. He also receives from God out of heaven an entirely new life. He is born anew, born of God: he has passed from death into life.", "source": "Andrew Murray, The New Life (whatsaiththescripture.com)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Since this life is God's and cannot die, it follows that everyone born anew into possessing this life is said to have eternal life.", "source": "Watchman Nee, quoted at biblereasons.com"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "That deliverance is found to be mainly along the line of grace, brought into experience by reason of a vital relationship with the Lord Jesus.", "source": "T. Austin-Sparks, We Beheld His Glory, Vol. 1, ch. 5, Walking in the Power of God (Austin-Sparks.Net/english/books/001509.html)"}], "declarations": ["I declare: I hear the word of Christ and I have eternal life.", "I declare: I have passed from death unto life in Jesus."], "prayer": "Lord Jesus, I hear Your word today and I believe. Thank You for eternal life and for bringing me from death into life. Amen.", "theme_flag": null}, {"day": 187, "ref": "John 6:35", "book": "John", "chapter": 6, "verse": 35, "text": "And Jesus said unto them, I am the bread of life: he that cometh to me shall never hunger; and he that believeth on me shall never thirst.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "He is the object set before faith; He is to be fed upon. Life is found in Him; he that eats Him shall live by Him, and shall never hunger.", "source": "Darby's Synopsis, John, chapter 6 section"}, {"name": "Andrew Murray", "short": "Murray", "comment": "The one great work for the soul, who truly longs to live entirely and only by Christ, is to eat Him, daily to feed on Him, to make Him his own.", "source": "Andrew Murray, quoted in Worthy Christian Books, Andrew Murray archives"}, {"name": "Watchman Nee", "short": "Nee", "comment": "He is the bread of life. He is also the thirst-quenching water.", "source": "Watchman Nee, The Normal Christian Faith, ch.5 (ministrysamples.org)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "I am hungry, spiritually starved; He is Bread, and I need never hunger.", "source": "T. Austin-Sparks, Open Windows: The Shalls of Christ (austin-sparks.net)"}], "declarations": ["I declare: Jesus is the bread of life and I shall never hunger.", "I declare: Christ satisfies my soul completely."], "prayer": "Lord Jesus, You are the bread of life. Feed my soul today and satisfy my deepest hunger. Amen.", "theme_flag": null}, {"day": 188, "ref": "John 6:37", "book": "John", "chapter": 6, "verse": 37, "text": "All that the Father giveth me shall come to me; and him that cometh to me I will in no wise cast out.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Be it who it might, He would in no wise cast them out. Whomsoever the Father brought Him He would receive for life eternal.", "source": "Darby's Synopsis, John, chapter 6 section"}, {"name": "Andrew Murray", "short": "Murray", "comment": "The rest is in Christ, and not something He gives apart from Himself, and so it is only in having Him that the rest can really be kept and enjoyed.", "source": "Andrew Murray, Writings of Andrew Murray, Vol. 1 (sermonindex.net)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "He will never cast out those who come to Him.", "source": "The Collected Works of Watchman Nee, Set 1, Vol. 06: The Christian (4), ch. 10"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "You, then, are a perfect gift from the Father to the Son.", "source": "T. Austin-Sparks, Following The Lamb (3), Towards the Mark, Vol. 2, No. 4 (Austin-Sparks.Net/mags/ttm02-4.html)"}], "declarations": ["I declare: I come to Jesus and He will never cast me out.", "I declare: The Father has given me to Christ and I am secure."], "prayer": "Lord Jesus, I come to You today. Thank You for receiving me and never casting me out. Amen.", "theme_flag": "theme-based: Darby, Murray"}, {"day": 189, "ref": "John 6:47", "book": "John", "chapter": 6, "verse": 47, "text": "Verily, verily, I say unto you, He that believeth on me hath everlasting life.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "He that believed in Him was already in possession of eternal life, for He was the bread come down from heaven, that a man might eat thereof and not die.", "source": "Darby's Synopsis, John, chapter 6 section"}, {"name": "Andrew Murray", "short": "Murray", "comment": "This new life is nothing less than eternal life.", "source": "Andrew Murray, The New Life (wnlnetwork.com)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "If you accept the Lord Jesus as the sin offering, you do not have to hope to be saved because you have eternal life already.", "source": "The Collected Works of Watchman Nee, Set 1, Vol. 06: The Christian (4), ch. 10"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Life triumphant over death is something which we have completely when we first receive the Lord Jesus.", "source": "T. Austin-Sparks, We Beheld His Glory, Vol. 1, ch. 6, Life Triumphant Over Death (www.austin-sparks.net/m/Books-001510.html)"}], "declarations": ["I declare: I believe on Jesus and I have everlasting life.", "I declare: My faith in Christ gives me life eternal."], "prayer": "Lord Jesus, I believe on You. Thank You for the gift of everlasting life. Amen.", "theme_flag": null}, {"day": 190, "ref": "John 7:38", "book": "John", "chapter": 7, "verse": 38, "text": "He that believeth on me, as the scripture hath said, out of his belly shall flow rivers of living water.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Not only should his thirst be quenched, but from the inner man of his soul should flow forth streams of living water.", "source": "Darby's Synopsis, John, chapter 7 section"}, {"name": "Andrew Murray", "short": "Murray", "comment": "We have received Him to stream into us, to stream through us, and to stream forth from us in rivers of blessing.", "source": "Andrew Murray, The Spirit of Christ, Fifth Day (biblestudytools.com)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "They will not flow out of only special Christian or the apostles Paul, Peter, or John, but out of all those who believe, out of ordinary men like us.", "source": "Watchman Nee, The Overcoming Life (via emanna.com)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "It is not only what is in the believer, but what is going out from him to others.", "source": "T. Austin-Sparks, Divine Life - Life in Christ (austin-sparks.net)"}], "declarations": ["I declare: I believe on Jesus and rivers of living water flow from me.", "I declare: The Holy Spirit flows through my life to others."], "prayer": "Lord Jesus, let the rivers of living water flow from me today. Fill me with Your Spirit. Amen.", "theme_flag": null}, {"day": 191, "ref": "John 8:12", "book": "John", "chapter": 8, "verse": 12, "text": "¶ Then spake Jesus again unto them, saying, I am the light of the world: he that followeth me shall not walk in darkness, but shall have the light of life.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "It was the Life itself which was there in His Person, and that life was the light of men. Whoso followed Him should have the light of life.", "source": "Darby's Synopsis, John, chapter 8 section"}, {"name": "Andrew Murray", "short": "Murray", "comment": "The life is the light of man; it is in revealing to us, and making us behold the glory of God in His own face, that Christ makes us partakers of eternal life.", "source": "Andrew Murray, Abide in Christ, Day 7 (swartzentrover.com)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "he plainly says that we are the world's light, whether we bring our illumination out into places where men can see it, or hide it away from them.", "source": "Watchman Nee, Lights in the World (articles.ochristian.com)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "He will answer, \"I am the light of the world.\" When you have come to see Me, to know Me truly, in a heart way, you have illumination.", "source": "T. Austin-Sparks, Knowing God in Christ (austin-sparks.net)"}], "declarations": ["I declare: Jesus is the light of the world and I walk in His light.", "I declare: I follow Christ and I shall not walk in darkness."], "prayer": "Lord Jesus, You are the light of the world. Shine in my life and guide my steps today. Amen.", "theme_flag": null}, {"day": 192, "ref": "John 8:58", "book": "John", "chapter": 8, "verse": 58, "text": "Jesus said unto them, Verily, verily, I say unto you, Before Abraham was, I am.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "He announces positively that He is the One who calls Himself I am, the supreme name of God, that He is God Himself. What a thought, that God Himself has been here!", "source": "Darby's Synopsis, John, chapter 8 section"}, {"name": "Andrew Murray", "short": "Murray", "comment": "The only reason that you ever have to look back to a yesterday that was better than today, was that you did not know, or that you failed to trust, this Jesus, who was waiting to make each day a new revelation and a larger experience of the grace of yesterday.", "source": "Andrew Murray, quoted in H.B. Charles Jr. sermon outline (hbcharlesjr.com)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "In Christianity Christ is everything. What He gives is His very own Self.", "source": "Watchman Nee, The Joyful Heart, Jan 4 (via everand.com)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Before Abraham was I am, that as to past eternity, before times eternal.", "source": "T. Austin-Sparks, Sovereign Head (austin-sparks.com)"}], "declarations": ["I declare: Jesus is the great I AM, before Abraham and forever.", "I declare: Christ is eternal and I worship Him."], "prayer": "Lord Jesus, You are the I AM. Before Abraham was, You are. I worship You as the eternal God. Amen.", "theme_flag": "theme-based: Murray"}, {"day": 193, "ref": "John 10:10", "book": "John", "chapter": 10, "verse": 10, "text": "The thief cometh not, but for to steal, and to kill, and to destroy: I am come that they might have life, and that they might have it more abundantly.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Christ is come that they might have life, and that abundantly; that is, according to the power of this life in Jesus, the Son of God.", "source": "Darby's Synopsis, John, chapter 10 section"}, {"name": "Andrew Murray", "short": "Murray", "comment": "A man may have life, and yet, through lack of nourishment, or through illness, there may be no abundance of life or power.", "source": "Andrew Murray, The Prayer Life, ch. 4 (swartzentrover.com)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "This more abundant life suffices additionally for every requirement of our body.", "source": "Watchman Nee, The Spiritual Man, Vol. III, Part 10, ch.3 (churchinmarlboro.org)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "It is His will that there should be the full provision of Life unto the full end, because the purpose is such an abundant purpose.", "source": "T. Austin-Sparks, All Things in Christ, ch. 9, The Heavenly Man and Eternal Life (www.austin-sparks.net/english/books/002775.html)"}], "declarations": ["I declare: Jesus came to give me life more abundantly.", "I declare: I receive the abundant life of Christ today."], "prayer": "Lord Jesus, thank You for coming to give me abundant life. Fill me with Your life today. Amen.", "theme_flag": null}, {"day": 194, "ref": "John 10:11", "book": "John", "chapter": 10, "verse": 11, "text": "I am the good shepherd: the good shepherd giveth his life for the sheep.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "He was the good Shepherd who thus gave His life for the sheep. Others would think of themselves, He of His sheep.", "source": "Darby's Synopsis, John, chapter 10 section"}, {"name": "Andrew Murray", "short": "Murray", "comment": "His humility is our salvation.", "source": "Andrew Murray, quoted at dailypulse.substack.com"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Christianity is not any one thing which Christ gives to me; Christianity is Christ giving Himself to me.", "source": "Watchman Nee, quoted at thegoodland.io"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "This was the quintessence, the very essential nature of that sacrificial love in Him, which caused the Father to delight in Him.", "source": "T. Austin-Sparks, The Cross, and the Unity of Vision and Ministry in the Church (austin-sparks.net)"}], "declarations": ["I declare: I am one of Christ's sheep and I hear His voice.", "I declare: Jesus knows me and I follow Him."], "prayer": "Lord Jesus, I am Your sheep. Help me to hear Your voice clearly and follow You closely. Amen.", "theme_flag": "theme-based: Murray"}, {"day": 195, "ref": "John 10:28", "book": "John", "chapter": 10, "verse": 28, "text": "And I give unto them eternal life; and they shall never perish, neither shall any man pluck them out of my hand.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "They hear His voice; He knows them; they follow Him; He gives them eternal life; they shall never perish. The Father had given us to Jesus, and He is greater than all who would seek to pluck us out of His hand.", "source": "Darby's Synopsis, John, chapter 10 section"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Every branch grafted by Him in the True Vine shall never be plucked out of His hand.", "source": "Andrew Murray, Writings of Andrew Murray, Vol. 1 (sermonindex.net)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "The Bible shows us that the duration of God's salvation is eternal; it is not temporal.", "source": "Watchman Nee, The Gospel of God (2), ch. 1 'Salvation Being Eternal' (bibleread.online)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "This life is eternity of life.", "source": "T. Austin-Sparks, The Necessity for New Birth (Austin-Sparks.net/english/002060.html)"}], "declarations": ["I declare: Jesus gives me eternal life and I shall never perish.", "I declare: No one can snatch me out of Christ's hand."], "prayer": "Lord Jesus, thank You for eternal life. I am secure in Your hand and no one can take me from You. Amen.", "theme_flag": "theme-based: Nee"}, {"day": 196, "ref": "John 11:25", "book": "John", "chapter": 11, "verse": 25, "text": "Jesus said unto her, I am the resurrection, and the life: he that believeth in me, though he were dead, yet shall he live:", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Christ has overcome death; the power for this was in His Person. Death is annihilated by it, for in life death is no more.", "source": "Darby's Synopsis, John, chapter 11 section"}, {"name": "Andrew Murray", "short": "Murray", "comment": "A dead Christ I must do everything for; a living Christ does everything for me.", "source": "Andrew Murray, Jesus Himself"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Our old history ends with the cross; our new history begins with the resurrection.", "source": "Watchman Nee, quoted at greetingcardpoet.com"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "To be a Christian is to have Him as LIFE resident in your spirit, mighty, triumphant, able to resist the powers of death.", "source": "T. Austin-Sparks, The Sentence of Death (austin-sparks.net)"}], "declarations": ["I declare: I am crucified with Christ and I live by His life.", "I declare: Christ lives in me and I live by faith in Him."], "prayer": "Lord Jesus, I am crucified with You. Live Your life through me today. Amen.", "theme_flag": null}, {"day": 197, "ref": "John 14:6", "book": "John", "chapter": 14, "verse": 6, "text": "Jesus saith unto him, I am the way, the truth, and the life: no man cometh unto the Father, but by me.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "He was, then, Himself the way. He was the truth itself, in the revelation of God and of the soul's relationship to Him. He was the life, in which God and the truth could thus be known.", "source": "Darby's Synopsis, John, chapter 14 section"}, {"name": "Andrew Murray", "short": "Murray", "comment": "May not a single moment of my life be spent outside the light, love and joy of God's presence and not a moment without the entire surrender of myself as a vessel for Him to fill full of His Spirit and His love.", "source": "Andrew Murray, quoted at charispsallo.me"}, {"name": "Watchman Nee", "short": "Nee", "comment": "He says He is the way, He does not say He will guide us to walk in the way.", "source": "Watchman Nee, quoted at thegoodland.io"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "If you will trust Me, I will see that you get where I would have you. I AM the way.", "source": "T. Austin-Sparks, How Know We the Way? (austin-sparks.net)"}], "declarations": ["I declare: Jesus is the way, the truth, and the life.", "I declare: I come to the Father through Christ alone."], "prayer": "Lord Jesus, You are the way. Lead me to the Father today. I trust in You alone. Amen.", "theme_flag": "theme-based: Murray"}, {"day": 198, "ref": "John 14:27", "book": "John", "chapter": 14, "verse": 27, "text": "Peace I leave with you, my peace I give unto you: not as the world giveth, give I unto you. Let not your heart be troubled, neither let it be afraid.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "The Lord, in the midst of this world, left peace to His disciples, giving them His own peace. He gave them the peace which He Himself had with the Father.", "source": "Darby's Synopsis, John, chapter 14 section"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Perpetual quietness of heart is to have no trouble. It is never to be fretted or vexed, irritable or sore; to wonder at nothing that is done to me, to feel nothing done against me.", "source": "Andrew Murray, quoted at stmark.com.au"}, {"name": "Watchman Nee", "short": "Nee", "comment": "It is not just a question of peace but of \"My peace.\"", "source": "Watchman Nee, A Table in the Wilderness, Feb. 7"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "What you can stand up to in the world if you have the peace of God in your heart!", "source": "T. Austin-Sparks, The Second Man - The Last Adam (austin-sparks.net)"}], "declarations": ["I declare: Jesus gives me His peace, not as the world gives.", "I declare: My heart is not troubled because Christ is with me."], "prayer": "Lord Jesus, give me Your peace today. Calm my heart and let me rest in You. Amen.", "theme_flag": "theme-based: Murray"}, {"day": 199, "ref": "John 15:5", "book": "John", "chapter": 15, "verse": 5, "text": "I am the vine, ye are the branches: He that abideth in me, and I in him, the same bringeth forth much fruit: for without me ye can do nothing.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Jesus was the source of all their strength. They were to abide in Him. Dependence and obedience are the two great principles of practical life here below.", "source": "Darby's Synopsis, John, chapter 15 section"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Abiding in Me is indispensable, for, you know it, of yourselves you can do nothing to maintain or act out the heavenly life.", "source": "Andrew Murray, True Vine: You Can Do Nothing (ccel.org)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Outside of Christ, I am weak; in Christ, I am strong.", "source": "Watchman Nee, quoted at christianquotes.info"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "If you only know Me, things will happen. I am going to bear this fruit through you by way of union and fellowship.", "source": "T. Austin-Sparks, Open Windows (via bibleportal.com)"}], "declarations": ["I declare: I abide in Christ the vine and I bear much fruit.", "I declare: Apart from Jesus I can do nothing, but in Him I am fruitful."], "prayer": "Lord Jesus, help me to abide in You today. Bear Your fruit through my life. Amen.", "theme_flag": null}, {"day": 200, "ref": "John 15:13", "book": "John", "chapter": 15, "verse": 13, "text": "Greater love hath no man than this, that a man lay down his life for his friends.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "It went so far as to lay down life itself for one's friends.", "source": "Darby's Synopsis, John, chapter 15 section"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Greater love hath no man than this, that a man give his life for his friends. The life is the most precious thing a man has; the life is all he is; the life is himself.", "source": "Andrew Murray, True Vine: Christ's Friendship (ccel.org)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "The nature of God's love is unchangeable.", "source": "Watchman Nee, quoted at m.timelesslife.info"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "It is indeed a very wonderful and beautiful thing that the Son of God called such as we are, His friends.", "source": "T. Austin-Sparks, Ye Are My Friends (austin-sparks.net)"}], "declarations": ["I declare: Jesus laid down His life for me, His friend.", "I declare: I am loved by Christ with the greatest love."], "prayer": "Lord Jesus, thank You for laying down Your life for me. Teach me to love as You love. Amen.", "theme_flag": null}, {"day": 201, "ref": "John 16:33", "book": "John", "chapter": 16, "verse": 33, "text": "These things I have spoken unto you, that in me ye might have peace. In the world ye shall have tribulation: but be of good cheer; I have overcome the world.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "In the world that rejected Him they should have tribulation; but He had overcome the world, they might be of good cheer.", "source": "Darby's Synopsis, John, chapter 16 section"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Pray, do believe that Jesus has obtained for you the power to overcome the world, with its deep hidden seductions to living for ourselves. Believe in Him as Victor: and you also have the victory.", "source": "Andrew Murray, The New Life"}, {"name": "Watchman Nee", "short": "Nee", "comment": "The key to victory is always our faith relationship with the victorious Son.", "source": "Watchman Nee, Lights in the World (articles.ochristian.com)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "May the Lord give us the faith which is the victory which overcomes!", "source": "T. Austin-Sparks, The Victory that Overcomes (austin-sparks.net)"}], "declarations": ["I declare: In Christ I have peace though the world gives tribulation.", "I declare: Jesus has overcome the world and I overcome in Him."], "prayer": "Lord Jesus, You have overcome the world. Give me Your peace in the midst of trouble today. Amen.", "theme_flag": "theme-based: Sparks"}, {"day": 202, "ref": "John 17:3", "book": "John", "chapter": 17, "verse": 3, "text": "And this is life eternal, that they might know thee the only true God, and Jesus Christ, whom thou hast sent.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Eternal life was the knowledge of the Father, the only true God, and of Jesus Christ, whom He had sent. True knowledge here was the communication, in life, of communion with God Himself fully known as the Father and the Son.", "source": "Darby's Synopsis, John, chapter 17 section"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Not only should we think about Jesus Himself and speak about Him and believe in Him, but we should come to the point that the disciples arrived at: \"and they knew Him.\" Everything is to be found in that.", "source": "Andrew Murray, Jesus Himself (gutenberg.org)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "God's word gives us eternal life through faith in Christ Jesus.", "source": "Watchman Nee, The Better Covenant (via homes.lhc.gov.uk)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Everything related to human destiny is bound up with the knowledge of Christ.", "source": "T. Austin-Sparks, Fundamental Questions of the Christian Life (austin-sparks.net)"}], "declarations": ["I declare: I know the only true God and Jesus Christ whom He sent.", "I declare: Eternal life is knowing Christ personally."], "prayer": "Lord Jesus, I want to know You more. Reveal Yourself to me today. Amen.", "theme_flag": null}, {"day": 203, "ref": "John 19:30", "book": "John", "chapter": 19, "verse": 30, "text": "When Jesus therefore had received the vinegar, he said, It is finished: and he bowed his head, and gave up the ghost.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "He knows that now there is not one detail left of all that was to be accomplished. He bows His head, and Himself gives up His spirit.", "source": "Darby's Synopsis, John, chapter 19 section"}, {"name": "Andrew Murray", "short": "Murray", "comment": "With that word He uttered the truth of the gospel of our redemption, that all that was needed for man's salvation had been accomplished on the cross.", "source": "Andrew Murray, The Secret of the Cross, Day 15 (stauros.org.za)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "He has done everything on the Cross for our forgiveness and He will do everything in us for our deliverance. In both cases He is the doer.", "source": "Watchman Nee, The Normal Christian Life, ch. 13 (ccel.org)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "The work is finished, completed.", "source": "T. Austin-Sparks, The On-High Calling, Vol. 1, ch. 5, The Changed Position of the Companions (austin-sparks.net/english/books/000970.html)"}], "declarations": ["I declare: It is finished. Jesus completed the work of my salvation.", "I declare: I rest in the finished work of Christ on the cross."], "prayer": "Lord Jesus, thank You for finishing the work. I rest in what You accomplished for me. Amen.", "theme_flag": null}, {"day": 204, "ref": "Acts 3:19", "book": "Acts", "chapter": 3, "verse": 19, "text": "¶ Repent ye therefore, and be converted, that your sins may be blotted out, when the times of refreshing shall come from the presence of the Lord;", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "He preaches repentance to the Jews as a nation, declaring that, on their repentance, Jesus, who had ascended up to heaven, would return; and the fulfilment of all the blessings spoken of by the prophets should take place.", "source": "Darby's Synopsis, Acts, chapter 3 section"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Without repentance no real faith, without faith no true repentance.", "source": "Andrew Murray, Why Do You Not Believe?, ch. 7 (swartzentrover.com)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Repentance ... means a change of mind!", "source": "Watchman Nee, quoted at booksminority.net"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "God has given His people respite periods from struggle or opposition, and graciously continues to do so.", "source": "T. Austin-Sparks, The Times of Restitution, Towards the Mark, Vol. 15, No. 4 (Austin-Sparks.Net/mags/ttm15-4.html)"}], "declarations": ["I declare: I repent and am converted, and my sins are blotted out.", "I declare: Times of refreshing come from the presence of the Lord."], "prayer": "Lord Jesus, I repent today. Blot out my sins and refresh my soul with Your presence. Amen.", "theme_flag": null}, {"day": 205, "ref": "Acts 4:12", "book": "Acts", "chapter": 4, "verse": 12, "text": "Neither is there salvation in any other: for there is none other name under heaven given among men, whereby we must be saved.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Jesus was the stone rejected by them, the builders, which had become the head of the corner. Salvation could nowhere else be found.", "source": "Darby's Synopsis, Acts, chapter 4 section"}, {"name": "Andrew Murray", "short": "Murray", "comment": "This statement of Peter's declares to us that the name of Jesus both heals and saves.", "source": "Andrew Murray, Divine Healing, ch. 4 (raptureready.com)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Hence, the name equals authority. Where the name is, there is authority.", "source": "Watchman Nee, The Prayer Ministry of the Church (via emanna.com)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Salvation is in the name of Jesus.", "source": "T. Austin-Sparks, The Glory of the Name (austin-sparks.net)"}], "declarations": ["I declare: There is salvation in no other name but Jesus.", "I declare: I am saved by calling on the name of the Lord Jesus."], "prayer": "Lord Jesus, there is no other name. I call on You and I am saved. Amen.", "theme_flag": null}, {"day": 206, "ref": "Acts 10:43", "book": "Acts", "chapter": 10, "verse": 43, "text": "To him give all the prophets witness, that through his name whosoever believeth in him shall receive remission of sins.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "They only shewed that in every nation he who feared God was acceptable to Him; in a word, that the favour of God was not limited to the Jews, and that there was no need of becoming a Jew in order to share the salvation that is in Christ.", "source": "Darby's Synopsis, Acts, chapter 10 section"}, {"name": "Andrew Murray", "short": "Murray", "comment": "God does not forgive by halves. The love of God is so great, and the atonement in the blood of Jesus so complete and powerful, that God always forgives completely.", "source": "Andrew Murray, The New Life (whatsaiththescripture.com)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Because the Lord Jesus died on the Cross, I have received the forgiveness of sins.", "source": "Watchman Nee, quoted at christians911.com"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "The initial need and appeal of the unsaved sinner is to the Blood of the Lord Jesus. 'Without the shedding of blood there is no remission'.", "source": "T. Austin-Sparks, The Blood, the Cross and the Name of the Lord Jesus (www.austin-sparks.net/english/001469.html; quote text verified via the articles.ochristian.com transcription)"}], "declarations": ["I declare: Through faith in Jesus I receive forgiveness of sins.", "I declare: All the prophets witness that Christ saves."], "prayer": "Lord Jesus, thank You for forgiveness through Your name. I believe in You. Amen.", "theme_flag": null}, {"day": 207, "ref": "Acts 16:31", "book": "Acts", "chapter": 16, "verse": 31, "text": "And they said, Believe on the Lord Jesus Christ, and thou shalt be saved, and thy house.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Paul and Silas sing, instead of quietly sleeping; the doors burst suddenly open; and the gaoler himself is converted, and h
