<script>
var DEVOTIONALS = [{"book": "Revelation", "chapter": 3, "day": 1, "declarations": ["I declare: I hear the voice of Christ knocking at the door of my heart today.", "I declare: my door is open. Jesus comes in and sups with me."], "prayer": "Lord Jesus, You stand at my door and knock. Today I open to You. Come in and sup with me. Make Your home in my heart, and let me never shut You out again. Amen.", "ref": "Revelation 3:20", "text": "Behold, I stand at the door, and knock: if any man hear my voice, and open the door, I will come in to him, and will sup with him, and he with me.", "theme_flag": null, "verse": 20, "witnesses": [{"comment": "However, as long as the assembly subsists, Christ continues to deal in grace, stands at the door and knocks presses reception of Himself in the closest way on the conscience. If any one, still in what He was going to spue out, heard His voice and opened, He would give him admission to be with Him, and a part in the kingdom.", "name": "John Nelson Darby", "short": "Darby", "source": "Darby's Synopsis, Revelation, Laodicea section"}, {"comment": "In order to observe the Supper with the soul, He stands at the door and knocks. Wonderful condescension! In order to hold a feast in my heart, Jesus stands at the door and knocks.", "name": "Andrew Murray", "short": "Murray", "source": "The Lord's Table, Part 1, Chapter 3"}, {"comment": "He knocks at the door instead of breaking it. To those who do not want Him, He rather stands at the door and waits.", "name": "Watchman Nee", "short": "Nee", "source": "The Collected Works of Watchman Nee, Set 1, Vol. 05: The Christian (3), pg 72"}, {"comment": "The Lord is constantly coming to His people. He comes to them every time that there is a living Word from Him.", "name": "T. Austin-Sparks", "short": "Sparks", "source": "The Responsibility of Hearing the Word of the Lord (austin-sparks.net)"}]}, {"day": 2, "ref": "Genesis 3:15", "book": "Genesis", "chapter": 3, "verse": 15, "text": "And I will put enmity between thee and the woman, and between thy seed and her seed; it shall bruise thy head, and thou shalt bruise his heel.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "In judging the serpent, we have the promise made to the second Adam, the victorious Man. It is the Seed of the woman who bruises the serpent's head.", "source": "Darby's Synopsis, Genesis 3 (stempublishing)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "For thousands of years there had been a mighty conflict for the possession of mankind, between the Old Serpent, who led man astray, and the seed of the woman. But behold, Jesus is risen from the dead: an apparent victory proved to be the terrible downfall of the prince of darkness.", "source": "The Power of the Blood of Jesus, ch.9: Victory Through the Blood"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Christ is our Advocate, but we, the accused, side with the accuser.", "source": "The Normal Christian Life, 'Overcoming the Accuser'"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "There was nothing neutral about the Lord Jesus Christ.", "source": "The Holy Spirit as the Spirit of Anointing (austin-sparks.net)"}], "declarations": ["I declare: Jesus Christ, the Seed of the woman, has crushed the serpent's head, and I stand in His victory.", "I declare: There is enmity between me and the serpent, and I belong to Christ who bruised him."], "prayer": "Lord Jesus, You are the promised Seed who crushed the serpent's head. I thank You that the victory is already won. Keep me standing in Your triumph today. Amen.", "theme_flag": "theme-based: Nee"}, {"day": 3, "ref": "Genesis 12:3", "book": "Genesis", "chapter": 12, "verse": 3, "text": "And I will bless them that bless thee, and curse him that curseth thee: and in thee shall all families of the earth be blessed.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "The promises are given to him, whether of a numerous posterity, or of the blessing of all the families on the earth in him. He was the seed of promise.", "source": "Darby's Synopsis, Genesis 12"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Israel prays for blessing, that God may be known among all nations.", "source": "The Ministry of Intercession, 'His own elect, that cry to Him day and night' (ccel.org)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "There is absolutely no return regarding grace.", "source": "The Collected Works of Watchman Nee, Set 2 Vol.29: The Gospel of God (2), ch.1 (bibleread.online)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "a great multitude which no man can number out of every tribe and kindred and tongue", "source": "The Cross and the Way of Life, ch.4 'The Cross in Abraham's Life' (austin-sparks.net)"}], "declarations": ["I declare: In Christ, the Seed of Abraham, every family of the earth is blessed, and I am blessed in Him.", "I declare: I carry the blessing of Abraham, and God's blessing flows through me to others."], "prayer": "Lord Jesus, You are the Seed in whom all nations are blessed. Let Your blessing rest on me and flow through me to my family and all I meet. Amen.", "theme_flag": "theme-based: Sparks"}, {"day": 4, "ref": "Genesis 14:18", "book": "Genesis", "chapter": 14, "verse": 18, "text": "And Melchizedek king of Salem brought forth bread and wine: and he was the priest of the most high God.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "The kingly Priest, King of righteousness, and King of peace; that is, Christ, millennial King of the world, blessing victorious Abram.", "source": "Darby's Synopsis, Genesis 13-14"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Glorious food: wonderful heavenly bread: what a heavenly life it imparts to us. It is to bring His own eternal life near to us, that God has given His Son as the food of the soul.", "source": "The Lord's Table, Part 3, ch.1"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Inasmuch as Abraham is lesser than Melchizedek, Levi too is of less account than Melchizedek.", "source": "The Spiritual Man, 'Calvary's Judgment'"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Do you know that the very name 'Christ' means 'Anointed'?", "source": "The Holy Spirit as the Spirit of Anointing (austin-sparks.net)"}], "declarations": ["I declare: Jesus is my High Priest after the order of Melchizedek, King of righteousness and King of peace.", "I declare: Christ feeds me with the bread and wine of His own body and blood, and I am refreshed."], "prayer": "Lord Jesus, my Melchizedek, King of righteousness and King of peace, feed me today with Yourself. Let Your peace rule my heart. Amen.", "theme_flag": "theme-based: Nee"}, {"day": 5, "ref": "Genesis 22:18", "book": "Genesis", "chapter": 22, "verse": 18, "text": "And in thy seed shall all the nations of the earth be blessed; because thou hast obeyed my voice.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "The heir of the promise is sacrificed and raised again in figure, and the promise is confirmed to the seed. This is the confirmation to the one seed, that is Christ.", "source": "Darby's Synopsis, Genesis 22-24"}, {"name": "Andrew Murray", "short": "Murray", "comment": "For verily not of angels doth He take hold, but He taketh hold of the seed of Abraham.", "source": "The Holiest of All (swartzentrover.com)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "God's plan is to gain man.", "source": "The Glorious Church, ch.1 (bibleread.online)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "It is God and everything, or it is nothing.", "source": "The Cross and the Way of Life, ch.4 'A Supreme Test' (austin-sparks.net)"}], "declarations": ["I declare: In Christ, the obedient Seed, all nations are blessed, and His blessing covers me.", "I declare: Like Abraham, I obey God's voice, and blessing follows my obedience."], "prayer": "Lord Jesus, You are the Seed through whom every nation is blessed. Teach me the obedience of Abraham, that blessing may flow through my life. Amen.", "theme_flag": "theme-based: Nee, Sparks"}, {"day": 6, "ref": "Genesis 49:10", "book": "Genesis", "chapter": 49, "verse": 10, "text": "The sceptre shall not depart from Judah, nor a lawgiver from between his feet, until Shiloh come; and unto him shall the gathering of the people be.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "He remains till Shiloh come, to whom the gathering of the peoples belongs.", "source": "Darby's Synopsis, Genesis 48-50"}, {"name": "Andrew Murray", "short": "Murray", "comment": "The words point forward to that wonderful history of redemption which is not yet finished, and to the glorious future in eternity whither it is leading. There is no salvation but God's salvation.", "source": "Waiting on God, ch.2: The Keynote of Life"}, {"name": "Watchman Nee", "short": "Nee", "comment": "God's purpose is for man to rule.", "source": "The Glorious Church, ch.1 'Psalm 8' (bibleread.online)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "The Gathering into One is in Christ.", "source": "In Christ, 'Chapter 1 - The All-Inclusive In' (austin-sparks.net)"}], "declarations": ["I declare: Shiloh has come, and the sceptre rests in the hands of Jesus forever.", "I declare: To Christ the peoples gather, and I gather to Him with joy."], "prayer": "Lord Jesus, Shiloh, the One to whom the gathering of the peoples belongs, I gather to You today. Rule over my life with Your righteous sceptre. Amen.", "theme_flag": "theme-based: Nee"}, {"day": 7, "ref": "Exodus 12:46", "book": "Exodus", "chapter": 12, "verse": 46, "text": "In one house shall it be eaten; thou shalt not carry forth ought of the flesh abroad out of the house; neither shall ye break a bone thereof.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "In the passover was the bitter herbs of judgment of sin in ourselves, and feeding on the slain Lamb, with loins girded and shoes on our feet, to leave the place of sin.", "source": "Darby's Synopsis, Exodus, chapters 5-13"}, {"name": "Andrew Murray", "short": "Murray", "comment": "He gives the greatest and the best He can bestow: yea, all that it is possible for Him to give, the broken body which He first offered to the Father as a sacrifice for sin.", "source": "The Lord's Table, Part 2, ch.1"}, {"name": "Watchman Nee", "short": "Nee", "comment": "He has come to bear our sins.", "source": "The Collected Works of Watchman Nee, Set 2 Vol.28: The Gospel of God (1), ch.2 'God's love, grace, and mercy' (bibleread.online)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Here is God preserving the life.", "source": "The Battle for Life, '8. Levitical Law of Life' (austin-sparks.net)"}], "declarations": ["I declare: Christ my Passover is sacrificed for me, and not a bone of Him was broken.", "I declare: I feed on the slain Lamb, and I will not carry His flesh outside the house of faith."], "prayer": "Lord Jesus, my Passover Lamb, I thank You that none of Your bones were broken. Feed me with Yourself and keep me in the house of Your people. Amen.", "theme_flag": "theme-based: Nee, Sparks"}, {"day": 8, "ref": "Exodus 15:2", "book": "Exodus", "chapter": 15, "verse": 2, "text": "The LORD is my strength and song, and he is become my salvation: he is my God, and I will prepare him an habitation; my father’s God, and I will exalt him.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "They sing the song of triumph. God has led them by His power to His holy habitation. The heart's desire is that He should dwell with us.", "source": "Darby's Synopsis, Exodus 15"}, {"name": "Andrew Murray", "short": "Murray", "comment": "There is nothing can help a man to bear and endure so much as joy. Begin to believe with your whole heart, 'The joy of the Holy Ghost is my portion.'", "source": "The Master's Indwelling, ch.10: Joy in the Holy Ghost"}, {"name": "Watchman Nee", "short": "Nee", "comment": "In some unaccountable way the Lord was with me, and His love triumphed.", "source": "Sit, Walk, Stand, 'The Perfection of the Father'"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "We see fullness, victory, everything that speaks of life at the end.", "source": "The Battle for Life, '6. Job' (austin-sparks.net)"}], "declarations": ["I declare: The LORD is my strength and my song; He is become my salvation.", "I declare: I will sing to the Lord, for He has triumphed gloriously in my life."], "prayer": "Lord Jesus, You are my strength and my song. Put a new song in my mouth today and let my life sing of Your salvation. Amen.", "theme_flag": "theme-based: Murray, Nee, Sparks"}, {"day": 9, "ref": "Leviticus 19:18", "book": "Leviticus", "chapter": 19, "verse": 18, "text": "¶ Thou shalt not avenge, nor bear any grudge against the children of thy people, but thou shalt love thy neighbour as thyself: I am the LORD.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "They were to be holy, for Jehovah was holy... It is here we find the precept to love our neighbour as ourselves.", "source": "Darby's Synopsis, Leviticus 19-20"}, {"name": "Andrew Murray", "short": "Murray", "comment": "The fruit of the Spirit that He brought from heaven out of the heart of the crucified Christ, and that He gives in our heart, is first and foremost, love.", "source": "Absolute Surrender, ch.2 (ccel.org)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "God is too great.", "source": "The Collected Works of Watchman Nee, Set 2 Vol.29: The Gospel of God (2), ch.1 (bibleread.online)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "You will not say to him things that you will say to your loved one.", "source": "The Cross and the Way of Life, ch.4 'Abraham the Friend of God' (austin-sparks.net)"}], "declarations": ["I declare: I will not avenge or bear a grudge; I love my neighbour as myself.", "I declare: The love of Christ in me overcomes every offence and every grudge."], "prayer": "Lord Jesus, teach me to love my neighbour as myself. Take away every grudge from my heart and fill me with Your love. Amen.", "theme_flag": "theme-based: Nee, Sparks"}, {"day": 10, "ref": "Numbers 6:24", "book": "Numbers", "chapter": 6, "verse": 24, "text": "The LORD bless thee, and keep thee:", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "God ends by putting His blessing and His name on the people. The blessing places them under the keeping, the grace, and in the peace of Jehovah.", "source": "Darby's Synopsis, Numbers 6"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Oh, it is because the blessing is so great that our little hearts cannot rise to apprehend it; it is as if we cannot believe that Christ, the Almighty One, will in very deed teach and keep us all the day.", "source": "Abide in Christ, 'And ye shall find Rest to your Souls' (ccel.org)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Reckoning and faith are here practically the same thing.", "source": "The Normal Christian Life, 'The Reckoning of Faith'"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "The Spiritual Blessings are in Christ.", "source": "In Christ, 'Chapter 1 - The All-Inclusive In' (austin-sparks.net)"}], "declarations": ["I declare: The LORD blesses me and keeps me today.", "I declare: I am kept by the blessing of God; no evil can snatch me from His hand."], "prayer": "Lord Jesus, bless me and keep me. Let Your blessing rest on my house and keep us in all our ways. Amen.", "theme_flag": "theme-based: Nee"}, {"day": 11, "ref": "Numbers 6:25", "book": "Numbers", "chapter": 6, "verse": 25, "text": "The LORD make his face shine upon thee, and be gracious unto thee:", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "In making His face to shine upon them, He caused them to enjoy His grace.", "source": "Darby's Synopsis, Numbers 6"}, {"name": "Andrew Murray", "short": "Murray", "comment": "It is God Almighty, God the Faithful and Gracious One, who has undertaken to stablish me in Christ Jesus.", "source": "Abide in Christ, 'God Himself will stablish you in Him' (ccel.org)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "God wants the earth to move heaven.", "source": "The Prayer Ministry of the Church, ch.1 (bibleread.online)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "That is how He proves that He is the good Shepherd.", "source": "Written Not With Ink, ch.9 'The Good Shepherd' (austin-sparks.net)"}], "declarations": ["I declare: The LORD makes His face shine upon me, and He is gracious to me.", "I declare: I walk in the light of God's shining face, and His grace surrounds me."], "prayer": "Lord Jesus, shine Your face upon me and be gracious to me. Let Your favour go before me in all I do today. Amen.", "theme_flag": "theme-based: Nee, Sparks"}, {"day": 12, "ref": "Numbers 6:26", "book": "Numbers", "chapter": 6, "verse": 26, "text": "The LORD lift up his countenance upon thee, and give thee peace.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "In lifting up His countenance upon them, He gave them the assurance of peace.", "source": "Darby's Synopsis, Numbers 6"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Weary soul, since so many years driven to and fro like the panting hart, come and learn this day the lesson that there is a spot where safety and victory, where peace and rest, are always sure, and that that spot is always open to thee, the heart of Jesus.", "source": "Abide in Christ, 'And ye shall find Rest to your Souls' (ccel.org)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "He did not have to do anything.", "source": "The God of Abraham, Isaac, and Jacob, ch.7 (bibleread.online)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Abide in Christ and there is rest, there is peace, there is deliverance.", "source": "The School of Christ, 'Living by the Truth' (austin-sparks.net)"}], "declarations": ["I declare: The LORD lifts up His countenance upon me and gives me peace.", "I declare: I receive the peace of God today, and my heart is at rest."], "prayer": "Lord Jesus, lift up Your countenance upon me and give me peace. Quiet my heart and let Your peace rule in my home. Amen.", "theme_flag": "theme-based: Nee"}, {"day": 13, "ref": "Numbers 24:17", "book": "Numbers", "chapter": 24, "verse": 17, "text": "I shall see him, but not now: I shall behold him, but not nigh: there shall come a Star out of Jacob, and a Sceptre shall rise out of Israel, and shall smite the corners of Moab, and destroy all the children of Sheth.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "In the fourth place is the coming of Christ, the Star of Jacob, who crowns the glory of the people.", "source": "Darby's Synopsis, Numbers 24 (biblehub)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "And the sceptre of uprightness is the sceptre of Thy kingdom.", "source": "The Holiest of All (swartzentrover.com)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Abraham is a standard for us.", "source": "The God of Abraham, Isaac, and Jacob, ch.7 (bibleread.online)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Christ is all the glory, 'the Lamb is all the glory in Immanuel's land'.", "source": "The School of Christ, 'The Governing Law - The Glory of God' (austin-sparks.net)"}], "declarations": ["I declare: The Star out of Jacob has risen; Jesus Christ shines over my life.", "I declare: The Sceptre has risen out of Israel, and Christ reigns forever."], "prayer": "Lord Jesus, Star out of Jacob, shine in my darkness. Reign over my life with Your righteous sceptre. Amen.", "theme_flag": "theme-based: Nee, Sparks"}, {"day": 14, "ref": "Deuteronomy 6:5", "book": "Deuteronomy", "chapter": 6, "verse": 5, "text": "And thou shalt love the LORD thy God with all thine heart, and with all thy soul, and with all thy might.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "He engages them to love God with all their heart, and exhorts them to remember His words in every way, and to keep them.", "source": "Darby's Synopsis, Deuteronomy 6 (biblehub)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "The love is there, but we may remain ignorant of it, unless we begin in the faith that we have the power to obey the command, and to love God and man with our whole heart.", "source": "The Spirit of Christ, 'The Spirit of Love' (ccel.org)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "He never expects repayment; He only gives.", "source": "The Collected Works of Watchman Nee, Set 2 Vol.29: The Gospel of God (2), ch.1 (bibleread.online)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "There ought to be nothing neutral about any Christian.", "source": "The Holy Spirit as the Spirit of Anointing (austin-sparks.net)"}], "declarations": ["I declare: I love the LORD my God with all my heart, all my soul, and all my might.", "I declare: My whole heart belongs to God; there is no rival in my love."], "prayer": "Lord Jesus, teach me to love You with all my heart, soul, and might. Take the whole of me and let nothing divide my love. Amen.", "theme_flag": "theme-based: Nee, Sparks"}, {"day": 15, "ref": "Deuteronomy 18:15", "book": "Deuteronomy", "chapter": 18, "verse": 15, "text": "¶ The LORD thy God will raise up unto thee a Prophet from the midst of thee, of thy brethren, like unto me; unto him ye shall hearken;", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Jehovah would raise up a prophet like unto Moses, unto whom the people should hearken. Christ is the true and only answer.", "source": "Darby's Synopsis, Deuteronomy 18 (biblehub)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Prayer is not monologue but dialogue; God's voice in response to mine in its most essential part. Listening to God's voice is the secret of the assurance that He will listen to mine.", "source": "With Christ in the School of Prayer, ch.22"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Christ is God's Word.", "source": "The Ministry of God's Word, ch.8 'Christ as God's Word' (bibleread.online)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Take my yoke upon you, and learn of me. (Matt. 11:29)", "source": "The School of Christ, 'Chapter 1 - The Foundation of Spiritual Education' (austin-sparks.net)"}], "declarations": ["I declare: God has raised up Christ, the Prophet like Moses, and I hearken to Him.", "I declare: I hear the voice of Jesus above every other voice."], "prayer": "Lord Jesus, true Prophet of God, speak to me today. Open my ears to hear Your words and my heart to obey them. Amen.", "theme_flag": "theme-based: Nee, Sparks"}, {"day": 16, "ref": "Deuteronomy 18:18", "book": "Deuteronomy", "chapter": 18, "verse": 18, "text": "I will raise them up a Prophet from among their brethren, like unto thee, and will put my words in his mouth; and he shall speak unto them all that I shall command him.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Christ is the true and only answer. Jehovah would put His words in the mouth of the Prophet like Moses, and He speaks only what He is commanded.", "source": "Darby's Synopsis, Deuteronomy 18 (biblehub)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "His words abiding are the equivalent of Himself abiding. In a man's words he reveals himself.", "source": "With Christ in the School of Prayer, ch.22"}, {"name": "Watchman Nee", "short": "Nee", "comment": "We serve men with Christ.", "source": "The Ministry of God's Word, ch.8 'Christ as God's Word' (bibleread.online)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Thank God for the Holy Spirit!", "source": "The Holy Spirit as the Spirit of Anointing (austin-sparks.net)"}], "declarations": ["I declare: God has put His words in the mouth of Christ, and I receive them.", "I declare: Jesus speaks only what the Father commands, and His words are life to me."], "prayer": "Lord Jesus, in whom the Father has put His words, speak Your word into my life. Let Your words abide in me and shape all I say and do. Amen.", "theme_flag": "theme-based: Nee, Sparks"}, {"day": 17, "ref": "Deuteronomy 31:6", "book": "Deuteronomy", "chapter": 31, "verse": 6, "text": "Be strong and of a good courage, fear not, nor be afraid of them: for the LORD thy God, he it is that doth go with thee; he will not fail thee, nor forsake thee.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "The promise of never being left nor forsaken is maintained in all its force. This is what may be reckoned upon in the Lord's service.", "source": "Darby's Synopsis, Joshua 1 (biblehub)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "There may come more than one hour in which thou art ready to yield to despair; but be of good courage.", "source": "Abide in Christ, 'Every Moment' (ccel.org)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "God is forever the God who is.", "source": "The Collected Works of Watchman Nee, Set 2 Vol.36: Central Messages, ch.9 'Christ is the I am' (bibleread.online)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "He is always the same, absolutely reliable, positive, definite, sure, for He is the God of the 'Amen'.", "source": "God of the Amen (austin-sparks.net)"}], "declarations": ["I declare: I am strong and of good courage, for the LORD my God goes with me.", "I declare: God will never fail me nor forsake me; I do not fear."], "prayer": "Lord Jesus, You have promised never to leave me nor forsake me. Make me strong and courageous today, for You go with me. Amen.", "theme_flag": "theme-based: Nee"}, {"day": 18, "ref": "Joshua 1:9", "book": "Joshua", "chapter": 1, "verse": 9, "text": "Have not I commanded thee? Be strong and of a good courage; be not afraid, neither be thou dismayed: for the LORD thy God is with thee whithersoever thou goest.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "With this full encouragement, he who walks by the Spirit is called upon to be strong and of a good courage. For Jehovah thy God is with thee whithersoever thou goest.", "source": "Darby's Synopsis, Joshua 1 (biblehub)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Be of good courage, only believe; fear not to take the irrevocable step, and to say that thou hast once for ever given up self to the death for which it has been crucified in Christ.", "source": "Abide in Christ, 'And not in Self' (ccel.org)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "He is seated on the throne, so we are carried through in His strength.", "source": "Sit, Walk, Stand, 'Walk'"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "He will not let you down.", "source": "God of the Amen (austin-sparks.net)"}], "declarations": ["I declare: I am strong and of good courage; I am not afraid, for the LORD my God is with me.", "I declare: Wherever I go, the presence of God goes with me."], "prayer": "Lord Jesus, You command me to be strong and courageous. Drive out my fear and fill me with the boldness of Your presence. Amen.", "theme_flag": "theme-based: Nee, Sparks"}, {"day": 19, "ref": "1 Samuel 16:7", "book": "1 Samuel", "chapter": 16, "verse": 7, "text": "But the LORD said unto Samuel, Look not on his countenance, or on the height of his stature; because I have refused him: for the Lord seeth not as man seeth; for man looketh on the outward appearance, but the LORD looketh on the heart.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "All glorying in the flesh and its birthright are here set aside; and the youngest, despised and forgotten of all, who kept the sheep, is chosen of God; for Jehovah seeth not as man seeth.", "source": "Darby's Synopsis, 1 Samuel 16 (biblehub)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Just as we judge of a man's physical character, his size and strength and age and habits, by his outward appearance, so the heart gives the real, inward man his character; and 'the hidden man of the heart' is what God looks to.", "source": "The Holiest of All (swartzentrover.com)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "You must never doubt God's feeling toward you simply because you have failed or sinned.", "source": "The Collected Works of Watchman Nee, Set 2 Vol.28: The Gospel of God (1), ch.2 'God's love, grace, and mercy' (bibleread.online)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "In eternity past we were chosen and elected together in Christ.", "source": "In Christ, 'Chapter 1 - The All-Inclusive In' (austin-sparks.net)"}], "declarations": ["I declare: God looks on my heart, not on my outward appearance, and He has chosen me.", "I declare: I do not judge by outward appearance; I see people as God sees them."], "prayer": "Lord Jesus, You look on the heart. Search my heart and make it clean before You. Teach me to value what You value. Amen.", "theme_flag": "theme-based: Nee, Sparks"}, {"day": 20, "ref": "2 Samuel 7:12", "book": "2 Samuel", "chapter": 7, "verse": 12, "text": "¶ And when thy days be fulfilled, and thou shalt sleep with thy fathers, I will set up thy seed after thee, which shall proceed out of thy bowels, and I will establish his kingdom.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "David was more than a type; he was truly the stock of that family from which Christ Himself should spring.", "source": "Darby's Synopsis, 2 Samuel 7 (biblehub)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "I will pour My Spirit upon thy seed, and My blessing upon thy offspring. (Isa. 44:3)", "source": "The Ministry of Intercession, 'Stir up the gift of God which is in thee' (ccel.org)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "The Lord Jesus is that man, and that man is now enthroned! Hallelujah!", "source": "The Glorious Church, ch.1 'Hebrews 2' (bibleread.online)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "our presence in this world ought to register something positive for God.", "source": "The Holy Spirit as the Spirit of Anointing (austin-sparks.net)"}], "declarations": ["I declare: God has set up the Seed of David, Jesus Christ, and He reigns forever.", "I declare: I belong to the house that God is building; I am part of Christ's eternal kingdom."], "prayer": "Lord Jesus, Seed of David, establish Your kingdom in my life. Build Your house in me and let Your reign never end. Amen.", "theme_flag": "theme-based: Nee, Sparks"}, {"day": 21, "ref": "2 Samuel 7:13", "book": "2 Samuel", "chapter": 7, "verse": 13, "text": "He shall build an house for my name, and I will stablish the throne of his kingdom for ever.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "The work of building the temple belonged to the Prince of Peace. His son shall be the Son of God, shall build the house; the throne of his Son shall be established for ever.", "source": "Darby's Synopsis, 2 Samuel 7 (biblehub)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "For every house is builded by some one; but he that built all things is God. (Heb. 3:4)", "source": "The Holiest of All (swartzentrover.com)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "God gives us our position of rest.", "source": "Sit, Walk, Stand, 'Sit'"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "God raised Him from the dead", "source": "Spiritual Death and His Risen Life (austin-sparks.net)"}], "declarations": ["I declare: Christ builds the house of God, and the throne of His kingdom is established forever.", "I declare: I am a living stone in the house that Christ is building."], "prayer": "Lord Jesus, Builder of God's house, build me into Your temple. Let Your throne be established in my heart forever. Amen.", "theme_flag": "theme-based: Nee, Sparks"}, {"day": 22, "ref": "2 Samuel 22:31", "book": "2 Samuel", "chapter": 22, "verse": 31, "text": "As for God, his way is perfect; the word of the LORD is tried: he is a buckler to all them that trust in him.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "He celebrates all that God had been for him, all that he had found Him to be in his necessities and dangers. All this is given in a song, the expression of which will only be fully accomplished in Christ Himself.", "source": "Darby's Synopsis, 2 Samuel 22 (biblehub)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "You read the Psalms, and you think of the wonderful thoughts in many of the expressions that David uses; as, for instance, when he speaks about God being our God, our Fortress, our Refuge, our strong Tower, our Strength and our Salvation.", "source": "Absolute Surrender, 'Kept by the Power of God' (ccel.org)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "The word that the Lord speaks to us is spirit and life.", "source": "The Ministry of God's Word, ch.8 'Christ as God's Word' (bibleread.online)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Jesus as Lord, to be that in human lives.", "source": "Men Whose Eyes Have Seen the King, ch.8 (austin-sparks.net)"}], "declarations": ["I declare: God's way is perfect, and He is my buckler; I trust in Him.", "I declare: The word of the LORD is tried, and I take refuge behind my Shield."], "prayer": "Lord Jesus, my Buckler, I trust in You. Your way is perfect; hide me behind Your shield today. Amen.", "theme_flag": "theme-based: Nee, Sparks"}, {"day": 23, "ref": "1 Chronicles 16:11", "book": "1 Chronicles", "chapter": 16, "verse": 11, "text": "Seek the LORD and his strength, seek his face continually.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Faith, apprehending the counsels and the work of God, could see in the establishment of the ark in Zion the progress of God's power and intervention towards the peaceful and glorious reign of the Son of David.", "source": "Darby's Synopsis, 1 Chronicles 16 (biblehub)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "The living God, cotemporary and not merely eternal, the living, merciful, holy One, God manifesting Himself to the soul, God saying, 'Seek my face;' this is the magnet that draws us, this alone can open heart and lips.", "source": "The Prayer Life, 'Prayer in Harmony with the Being of God' (swartzentrover.com)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "We need God's revelation before we can know the Lord.", "source": "The Ministry of God's Word, ch.8 'Christ as God's Word' (bibleread.online)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "The God with whom we have to do is a living God!", "source": "The Living God (austin-sparks.net)"}], "declarations": ["I declare: I seek the LORD and His strength; I seek His face continually.", "I declare: My strength is renewed as I seek the face of God."], "prayer": "Lord Jesus, I seek Your face today. Let me find strength in Your presence and never cease seeking You. Amen.", "theme_flag": "theme-based: Darby, Nee, Sparks"}, {"day": 24, "ref": "1 Chronicles 16:34", "book": "1 Chronicles", "chapter": 16, "verse": 34, "text": "O give thanks unto the LORD; for he is good; for his mercy endureth for ever.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "'His mercy endureth for ever,' declaring that in spite of all the faults, all the sins, and all the unfaithfulness of Israel, Jehovah's mercy has stood firm.", "source": "Darby's Synopsis, 1 Chronicles 16 (biblehub)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Sink down before Him in humility, meekness, patience, and surrender to His goodness and mercy.", "source": "The Deeper Christian Life, 'Daily Fellowship with God' (swartzentrover.com)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "God Himself is unchangeable.", "source": "The Collected Works of Watchman Nee, Set 2 Vol.36: Central Messages, ch.9 'Christ is the I am' (bibleread.online)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "To know Him as the living God is life eternal.", "source": "The Living God (austin-sparks.net)"}], "declarations": ["I declare: The LORD is good, and His mercy endures forever over me.", "I declare: No failure of mine can outlast the mercy of God."], "prayer": "Lord Jesus, I thank You that Your mercy endures forever. When I fail, Your mercy meets me again and lifts me up. Amen.", "theme_flag": "theme-based: Nee, Sparks"}, {"day": 25, "ref": "2 Chronicles 7:14", "book": "2 Chronicles", "chapter": 7, "verse": 14, "text": "If my people, which are called by my name, shall humble themselves, and pray, and seek my face, and turn from their wicked ways; then will I hear from heaven, and will forgive their sin, and will heal their land.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "If there was chastening and the people humbled themselves, there was respite: the eyes and the heart of Jehovah should be there perpetually.", "source": "Darby's Synopsis, 2 Chronicles 7 (biblehub)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "The blessings of heaven and earth are for the lowly. For the heavenly and the earthly life, humility is the secret of blessing.", "source": "Humility, ch.4: Humility in the Teaching of Jesus"}, {"name": "Watchman Nee", "short": "Nee", "comment": "The earth controls heaven.", "source": "The Prayer Ministry of the Church, ch.1 (bibleread.online)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "But more than that, He is the rewarder of them that diligently seek.", "source": "The Living God (austin-sparks.net)"}], "declarations": ["I declare: I humble myself and pray and seek God's face; He hears me and heals my land.", "I declare: When I turn from my wicked ways, God forgives and restores."], "prayer": "Lord Jesus, I humble myself before You and seek Your face. Forgive my sins and heal my land, my home, and my heart. Amen.", "theme_flag": "theme-based: Nee"}, {"day": 26, "ref": "2 Chronicles 20:17", "book": "2 Chronicles", "chapter": 20, "verse": 17, "text": "Ye shall not need to fight in this battle: set yourselves, stand ye still, and see the salvation of the LORD with you, O Judah and Jerusalem: fear not, nor be dismayed; to morrow go out against them: for the LORD will be with you.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "The battle is not yours, but God's. He encourages the people by singing the praises of God before the blessing came, singing in faith that His mercy endureth for ever.", "source": "Darby's Synopsis, 2 Chronicles 20 (biblehub)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "God says, 'Be still, and know that I am God.' As we cease from self and our soul becomes still to God, God will arise and show Himself.", "source": "Waiting on God, ch.26: In Holy Expectancy"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Prayer is a work.", "source": "The Prayer Ministry of the Church, ch.1 (bibleread.online)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "The real battle is in the realm of man's spiritual relationship with God.", "source": "The Battle for Life, '6. Job' (austin-sparks.net)"}], "declarations": ["I declare: The battle is not mine but God's; I stand still and see His salvation.", "I declare: I do not fight in my own strength; the LORD fights for me."], "prayer": "Lord Jesus, the battle I face is Yours, not mine. Teach me to stand still in faith and watch You win the victory. Amen.", "theme_flag": "theme-based: Nee, Sparks"}, {"day": 27, "ref": "Nehemiah 8:10", "book": "Nehemiah", "chapter": 8, "verse": 10, "text": "Then he said unto them, Go your way, eat the fat, and drink the sweet, and send portions unto them for whom nothing is prepared: for this day is holy unto our Lord: neither be ye sorry; for the joy of the LORD is your strength.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Nehemiah and Ezra bade them rejoice, for the day was holy. Since God was restoring His people, it became them to rejoice and give thanks.", "source": "Darby's Synopsis, Nehemiah 8 (biblehub)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "We know that the Lord Jesus Himself for the joy that was set before Him endured the cross. Come to-day and believe the joy of the Holy Ghost is meant for you.", "source": "The Master's Indwelling, ch.10: Joy in the Holy Ghost"}, {"name": "Watchman Nee", "short": "Nee", "comment": "When the earth works, God works.", "source": "The Prayer Ministry of the Church, ch.1 (bibleread.online)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "He is reigning.", "source": "Men Whose Eyes Have Seen the King, ch.8 (austin-sparks.net)"}], "declarations": ["I declare: The joy of the LORD is my strength today.", "I declare: I will not mourn; the holy joy of God fills my heart."], "prayer": "Lord Jesus, fill me with Your joy, for Your joy is my strength. Let gladness rise in me and strengthen me for the day. Amen.", "theme_flag": "theme-based: Nee, Sparks"}, {"day": 28, "ref": "Esther 4:14", "book": "Esther", "chapter": 4, "verse": 14, "text": "For if thou altogether holdest thy peace at this time, then shall there enlargement and deliverance arise to the Jews from another place; but thou and thy father’s house shall be destroyed: and who knoweth whether thou art come to the kingdom for such a time as this?", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "God holds the reins by His providence; He watches over the accomplishment of His purposes and over everything necessary to their fulfilment; and He cares for His people, whatever may be their condition or the power of their enemies.", "source": "Darby's Synopsis, Esther (biblehub)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "As Man, as Mediator, He has access to the counsels of Deity, to the secrets of Providence, in your interest, and on your behalf.", "source": "Abide in Christ, 'As your Wisdom' (ccel.org)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "God wants to use man to deal with His enemy", "source": "The Glorious Church, ch.1 'God's plan and God's rest' (bibleread.online)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "God cannot ultimately be cheated of His purpose; He is the God of the 'Amen'.", "source": "God of the Amen (austin-sparks.net)"}], "declarations": ["I declare: God raises up deliverance in His time, and I am placed in His kingdom for such a time as this.", "I declare: I will not hold my peace when God calls me to act."], "prayer": "Lord Jesus, You have brought me to the kingdom for such a time as this. Give me courage to speak and act when You call. Amen.", "theme_flag": "theme-based: Nee"}, {"day": 29, "ref": "Esther 4:16", "book": "Esther", "chapter": 4, "verse": 16, "text": "Go, gather together all the Jews that are present in Shushan, and fast ye for me, and neither eat nor drink three days, night or day: I also and my maidens will fast likewise; and so will I go in unto the king, which is not according to the law: and if I perish, I perish.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "How the hidden hand of God prepares and directs everything, and how those who seek His will may rely upon Him at all times and under all circumstances, even when deliverance appears impossible.", "source": "Darby's Synopsis, Esther (biblehub)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "There were a number of men ministering to the Lord and fasting, and the Holy Spirit came and spoke to them.", "source": "Absolute Surrender, 'Separated unto the Holy Ghost' (swartzentrover.com)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Once a Christian is saved, there is no possibility for him to perish.", "source": "The Collected Works of Watchman Nee, Set 2 Vol.29: The Gospel of God (2), ch.1 (bibleread.online)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "It will be a crucified church that lives and grows.", "source": "The Cross and the Way of Life, ch.4 (austin-sparks.net)"}], "declarations": ["I declare: I humble myself with fasting and prayer, and God hears.", "I declare: Like Esther, I go in to the King with boldness, for He holds out His sceptre to me."], "prayer": "Lord Jesus, my King, I come to You in prayer and fasting. Hear my cry and grant me favour before You. Amen.", "theme_flag": "theme-based: Nee, Sparks"}, {"day": 30, "ref": "Job 19:25", "book": "Job", "chapter": 19, "verse": 25, "text": "For I know that my redeemer liveth, and that he shall stand at the latter day upon the earth:", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "We see in Job a heart which, although rebellious, depends upon God, and would rejoice to find Him.", "source": "Darby's Synopsis, Job (biblehub)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "The word redemption, though sometimes applied to our deliverance from the guilt of sin, here refers to our complete and final deliverance from all its consequences, when the Redeemer's work shall become fully manifest, even to the redemption of the body itself.", "source": "Abide in Christ, 'As your Redemption' (swartzentrover.com)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "God is the God of life, and He lives forever.", "source": "The Collected Works of Watchman Nee, Set 2 Vol.36: Central Messages, ch.9 'Christ is the I am' (bibleread.online)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Because He lives we live.", "source": "Spiritual Death and His Risen Life (austin-sparks.net)"}], "declarations": ["I declare: I know that my Redeemer lives, and He shall stand at the latter day upon the earth.", "I declare: My Redeemer is alive today, and He pleads my cause."], "prayer": "Lord Jesus, my living Redeemer, I know You live. Stand for me today and let me feel the power of Your living presence. Amen.", "theme_flag": "theme-based: Darby, Nee"}, {"day": 31, "ref": "Job 19:26", "book": "Job", "chapter": 19, "verse": 26, "text": "And though after my skin worms destroy this body, yet in my flesh shall I see God:", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Could he once come near Him, he would find Him all that it had declared Him to be. A heart which complains bitterly of God, but which knows that He is all it had declared Him to be.", "source": "Darby's Synopsis, Job (biblehub)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "The resurrection of the body is no longer a barren doctrine, but a living expectation, and even of incipient experience, because the Spirit of Him that raised Jesus from the dead, dwells in the body as the pledge that even our mortal bodies shall be quickened.", "source": "Abide in Christ, 'As your Redemption' (swartzentrover.com)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Without holiness no one can see the Lord (Heb.12.14).", "source": "The Spiritual Man, 'A Holy Spirit'"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Job is brought to great straits, but the life link is never broken, and the end is life triumphant.", "source": "The Battle for Life, '6. Job' (austin-sparks.net)"}], "declarations": ["I declare: In my flesh I shall see God; my eyes shall behold Him.", "I declare: Death is not the end for me; I shall see my Redeemer face to face."], "prayer": "Lord Jesus, I long to see You. Keep my hope fixed on the day I shall behold You face to face. Amen.", "theme_flag": "theme-based: Darby, Nee, Sparks"}, {"day": 32, "ref": "Job 23:10", "book": "Job", "chapter": 23, "verse": 10, "text": "But he knoweth the way that I take: when he hath tried me, I shall come forth as gold.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "His faith must be developed by trial in which God is felt to be all.", "source": "Darby's Synopsis, 1 Samuel 16 (biblehub)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Abide in Christ: in the fiery oven, one like the Son of man will be seen as never before; the purging away of the dross and the refining of the gold will be accomplished, and Christ's own likeness reflected in thee.", "source": "Abide in Christ, 'In Affliction and Trial' (swartzentrover.com)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "When mercy extends itself, we are saved.", "source": "The Collected Works of Watchman Nee, Set 2 Vol.28: The Gospel of God (1), ch.2 'God's love, grace, and mercy' (bibleread.online)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Christ lives, all is possible.", "source": "Spiritual Death and His Risen Life (austin-sparks.net)"}], "declarations": ["I declare: God knows the way I take; when He has tried me, I shall come forth as gold.", "I declare: My trials are refining me, and I will shine brighter through them."], "prayer": "Lord Jesus, You know the way I take. Refine me in the fire of trial until I come forth as gold. Amen.", "theme_flag": "theme-based: Darby, Nee, Sparks"}, {"day": 33, "ref": "Psalms 2:7", "book": "Psalms", "chapter": 2, "verse": 7, "text": "I will declare the decree: the LORD hath said unto me, Thou art my Son; this day have I begotten thee.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "This King, who is He? Jehovah has said to Him, 'Thou art my Son: this day have I begotten thee.' Thus we have Christ born into the earth, owned Son of God by Jehovah.", "source": "Darby's Synopsis, Psalm 2 (biblehub)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "The Father hath given the Son to have life in Himself. Christ received it as His own life, just as God has His life in Himself.", "source": "The Master's Indwelling, ch.6: Christ Our Life"}, {"name": "Watchman Nee", "short": "Nee", "comment": "God loves His only begotten Son.", "source": "The Collected Works of Watchman Nee, Set 2 Vol.28: The Gospel of God (1), ch.2 'God's love, grace, and mercy' (bibleread.online)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "The Son of man who is in heaven (John 3:13).", "source": "In Christ, 'Some Significant Prepositions' (austin-sparks.net)"}], "declarations": ["I declare: Jesus Christ is the Son of God, begotten of the Father.", "I declare: Because He is the Son, I am a son of God through faith in Him."], "prayer": "Lord Jesus, Son of God, I worship You. Thank You for making me a child of God through Your Sonship. Amen.", "theme_flag": "theme-based: Nee, Sparks"}, {"day": 34, "ref": "Psalms 2:12", "book": "Psalms", "chapter": 2, "verse": 12, "text": "Kiss the Son, lest he be angry, and ye perish from the way, when his wrath is kindled but a little. Blessed are all they that put their trust in him.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "The psalm invites the kings and judges to submission and humbly owning the Son, lest they perish if His wrath be kindled but a little. He is Himself to be trusted; and who can claim this but Jehovah?", "source": "Darby's Synopsis, Psalm 2 (biblehub)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "I must have Christ within as the power to trust. Such confidence have we toward God, through Christ: through Christ living in and enabling us to trust God as He trusted Him.", "source": "The Master's Indwelling, ch.6: Christ Our Life"}, {"name": "Watchman Nee", "short": "Nee", "comment": "God is well able to deal with our sins.", "source": "The Normal Christian Life, 'Overcoming the Accuser'"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "We can count on Him.", "source": "God of the Amen (austin-sparks.net)"}], "declarations": ["I declare: I kiss the Son; I bow to Jesus Christ as Lord.", "I declare: Blessed am I, for I put my trust in Him."], "prayer": "Lord Jesus, I kiss the Son and put my trust in You. Keep me from perishing and bless me as I trust in You. Amen.", "theme_flag": "theme-based: Nee"}, {"day": 35, "ref": "Psalms 8:4", "book": "Psalms", "chapter": 8, "verse": 4, "text": "What is man, that thou art mindful of him? and the son of man, that thou visitest him?", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Creation makes man so little in himself. What is he when we consider this vast and shining universe? But glance at Christ, and you see all its glories grow dim before the excellency of Him under whose feet all is put.", "source": "Darby's Synopsis, Psalm 8 (biblehub)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "The Psalm does not speak directly of the Messiah, but of man and his destiny. But it is applied most justly to the Messiah, because in Him the Psalm and man find the fulfilment of what is promised.", "source": "The Holiest of All (swartzentrover.com)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "How God values man! Even He Himself became a man!", "source": "The Glorious Church, ch.1 'God's purpose in creating man' (bibleread.online)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "God's intention to have a Man and His kind in dominion, reigning in glory.", "source": "Men Whose Eyes Have Seen the King, ch.8 (austin-sparks.net)"}], "declarations": ["I declare: Though I am small, God is mindful of me and visits me.", "I declare: In Christ, man finds his true worth and destiny."], "prayer": "Lord Jesus, what am I that You are mindful of me? Thank You for visiting me and crowning my life with Your care. Amen.", "theme_flag": "theme-based: Nee"}, {"day": 36, "ref": "Psalms 8:6", "book": "Psalms", "chapter": 8, "verse": 6, "text": "Thou madest him to have dominion over the works of thy hands; thou hast put all things under his feet:", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "He is set over all the works of His hand; none are excepted. He only is excepted who put all things under Him.", "source": "Darby's Synopsis, Psalm 8 (biblehub)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "The Divine promise given to faith is: 'Sin shall not have dominion over you.'", "source": "Abide in Christ, 'That you may not sin' (ccel.org)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Will He gain a vessel in us?", "source": "The God of Abraham, Isaac, and Jacob, ch.7 (bibleread.online)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "He is Lord of all", "source": "Men Whose Eyes Have Seen the King, ch.8 (austin-sparks.net)"}], "declarations": ["I declare: In Christ, man is restored to dominion over the works of God's hands.", "I declare: All things are put under the feet of Jesus, and I reign with Him."], "prayer": "Lord Jesus, to whom all things are subjected, teach me to rule my life under Your lordship. Amen.", "theme_flag": "theme-based: Nee"}, {"day": 37, "ref": "Psalms 16:10", "book": "Psalms", "chapter": 16, "verse": 10, "text": "For thou wilt not leave my soul in hell; neither wilt thou suffer thine Holy One to see corruption.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Jehovah, whom He trusted, would not leave His soul in Hades, nor suffer His Holy One to see corruption. Jehovah would show Him the path of life through, but beyond, death.", "source": "Darby's Synopsis, Psalm 16 (biblehub)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Hear what the New Testament speaks of it: 'That like as Christ was raised from the dead by the glory of the Father, so we also should walk in newness of life.' It is the Risen One who says to us, Rise and walk: He gives the power of the resurrection life.", "source": "The Ministry of Intercession, 'Wilt Thou be made Whole?' (ccel.org)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Resurrection is God's new starting point.", "source": "The Normal Christian Life, 'Two Creations'"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "He, risen, is our life, even in the midst of death.", "source": "Spiritual Death and His Risen Life (austin-sparks.net)"}], "declarations": ["I declare: God did not leave Christ's soul in hell, and He will not leave mine.", "I declare: Jesus rose without seeing corruption, and His resurrection is my hope."], "prayer": "Lord Jesus, risen Holy One, I thank You that death could not hold You. Raise my hope and keep me in the power of Your resurrection. Amen.", "theme_flag": "theme-based: Nee"}, {"day": 38, "ref": "Psalms 22:1", "book": "Psalms", "chapter": 22, "verse": 1, "text": "To the chief Musician upon Aijeleth Shahar, A Psalm of David. My God, my God, why hast thou forsaken me? why art thou so far from helping me, and from the words of my roaring?", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Here the sufferings of Christ have another and deeper character. Here was a suffering out of the reach of promise: the Righteous One forsaken of God.", "source": "Darby's Synopsis, Psalm 22 (biblehub)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "In the temptation in the wilderness, and on every opportunity that presented itself, till he cried out on the cross in death, 'My God, my God, why hast thou forsaken me?' (Matt. 27:46).", "source": "The Prayer Life, ch.11 (swartzentrover.com)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "The love of God is manifested in the death of Christ.", "source": "The Collected Works of Watchman Nee, Set 2 Vol.28: The Gospel of God (1), ch.2 'God's love, grace, and mercy' (bibleread.online)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "It is the hub of the wheel.", "source": "The Centrality and Universality of the Cross, ch.1 (austin-sparks.net)"}], "declarations": ["I declare: Christ was forsaken for me, so I will never be forsaken.", "I declare: In my darkest hour, God hears me, for Jesus cried in my place."], "prayer": "Lord Jesus, You were forsaken on the cross for me. When I feel forsaken, remind me that You will never leave me. Amen.", "theme_flag": "theme-based: Nee, Sparks"}, {"day": 39, "ref": "Psalms 22:16", "book": "Psalms", "chapter": 22, "verse": 16, "text": "For dogs have compassed me: the assembly of the wicked have inclosed me: they pierced my hands and my feet.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Christ had suffered from man, from men alike heartless and violent: dogs had compassed Him, fat bulls of Bashan closed Him in.", "source": "Darby's Synopsis, Psalm 22 (biblehub)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Gaze, gaze on the Divine form, the eternal glory, the heavenly beauty, the tenderly pleading gentleness of the crucified love, as it stretches out its pierced hands and says, 'Oh, wilt thou not abide with me?'", "source": "Abide in Christ, 'And in His Love' (ccel.org)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "'With Christ' - crucified, quickened, raised, set in the heavenlies.", "source": "Sit, Walk, Stand, 'The Range of His Finished Work'"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "You are not forgotten.", "source": "The Living God (austin-sparks.net)"}], "declarations": ["I declare: His hands and feet were pierced for my transgressions.", "I declare: By His wounds I am healed; the pierced Christ is my Saviour."], "prayer": "Lord Jesus, pierced for me, I thank You for Your wounds. Let the power of Your pierced hands and feet heal and save me today. Amen.", "theme_flag": "theme-based: Nee, Sparks"}, {"day": 40, "ref": "Psalms 22:18", "book": "Psalms", "chapter": 22, "verse": 18, "text": "They part my garments among them, and cast lots upon my vesture.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "A stream of grace flows out for the remnant, then for Israel, for the world, for the generation to come, all from the sure and divinely perfect work of atonement in the death of Christ.", "source": "Darby's Synopsis, Psalm 22 (biblehub)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "He seeks ever to wear this robe of righteousness in the ever renewed faith in this glorious gift of righteousness which has been bestowed upon him.", "source": "Abide in Christ, 'As your Righteousness' (ccel.org)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Who can fathom the physical sufferings of the Lord Jesus on the cross?", "source": "The Spiritual Man, 'Calvary's Judgment'"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "You never get outside the range of the Cross.", "source": "The Centrality and Universality of the Cross, ch.1 (austin-sparks.net)"}], "declarations": ["I declare: They parted His garments, but they could not part me from His love.", "I declare: Christ was stripped for me, that I might be clothed in His righteousness."], "prayer": "Lord Jesus, who was stripped and shamed for me, clothe me in Your righteousness. Let me never forget the price You paid. Amen.", "theme_flag": "theme-based: Darby, Nee, Sparks"}, {"day": 41, "ref": "Psalms 23:1", "book": "Psalms", "chapter": 23, "verse": 1, "text": "A Psalm of David. The LORD is my shepherd; I shall not want.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "The comfort of Psalm 23 is not in what Jehovah gives, but in Himself. For us Christ is the Shepherd.", "source": "Darby's Synopsis, Psalm 23 (biblehub)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Our daily life, our conversation, our very countenance, must testify that we have found life abundantly in our Good Shepherd.", "source": "The Spirit of Christ, Note O (ccel.org)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "once we have been saved before God, we are eternally saved.", "source": "The Collected Works of Watchman Nee, Set 2 Vol.29: The Gospel of God (2), ch.1 (bibleread.online)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "What a great Shepherd He is, to exercise so great power for us!", "source": "Written Not With Ink, ch.9 'The Good Shepherd' (austin-sparks.net)"}], "declarations": ["I declare: The LORD is my Shepherd; I shall not want.", "I declare: My Shepherd provides all I need; I lack nothing."], "prayer": "Lord Jesus, my Shepherd, lead me and feed me today. I shall not want, for You care for me. Amen.", "theme_flag": "theme-based: Nee"}, {"day": 42, "ref": "Psalms 23:4", "book": "Psalms", "chapter": 23, "verse": 4, "text": "Yea, though I walk through the valley of the shadow of death, I will fear no evil: for thou art with me; thy rod and thy staff they comfort me.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Not only sorrow and evil had come in with sin, but death too. Then He comes and leads me through it and comforts me.", "source": "Darby's Synopsis, Psalm 23 (biblehub)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "He will make the valley of Achor, of trouble and shame, of sin confessed and cast out, a door of hope.", "source": "The Ministry of Intercession, 'Restraining Prayer: is it Sin?' (ccel.org)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "He is the God who now is.", "source": "The Collected Works of Watchman Nee, Set 2 Vol.36: Central Messages, ch.9 'Christ is the I am' (bibleread.online)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Because I live, ye shall live also.", "source": "Written Not With Ink, ch.9 'The Good Shepherd' (austin-sparks.net)"}], "declarations": ["I declare: Though I walk through the valley of the shadow of death, I fear no evil, for He is with me.", "I declare: His rod and His staff comfort me in every dark place."], "prayer": "Lord Jesus, walk with me through every valley. When shadows fall, let me feel Your rod and staff comforting me. Amen.", "theme_flag": "theme-based: Nee, Sparks"}, {"day": 43, "ref": "Psalms 27:1", "book": "Psalms", "chapter": 27, "verse": 1, "text": "A Psalm of David. The LORD is my light and my salvation; whom shall I fear? the LORD is the strength of my life; of whom shall I be afraid?", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "The first part is the confidence of the believer, and that absolutely, whatever enemies there were. Enemies without or oppressors within, a host and war arising, awake no fear: Jehovah is the light and salvation of the soul.", "source": "Darby's Synopsis, Psalm 27 (biblehub)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Thee, who art my Wisdom, my Light, my Leader, I take as my Prophet.", "source": "The New Life, ch.6 'God's Gift of His Son' (swartzentrover.com)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "As light dispels darkness, so truth destroys lies.", "source": "The Spiritual Man, 'Lies Denied'"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "He is not only the good Shepherd who has died for us, He is also the great Shepherd who lives for us.", "source": "Written Not With Ink, ch.9 'The Good Shepherd' (austin-sparks.net)"}], "declarations": ["I declare: The LORD is my light and my salvation; I will not fear.", "I declare: The LORD is the strength of my life; no one can make me afraid."], "prayer": "Lord Jesus, my Light and my Salvation, drive out my fears. Shine in my darkness and be the strength of my life. Amen.", "theme_flag": "theme-based: Nee, Sparks"}, {"day": 44, "ref": "Psalms 34:8", "book": "Psalms", "chapter": 34, "verse": 8, "text": "O taste and see that the LORD is good: blessed is the man that trusteth in him.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "It is the fullest encouragement to the humble righteous. Christ is the great example of this.", "source": "Darby's Synopsis, Psalm 34 (biblehub)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "The man who uses the Lord's Supper aright is distinguished by this: he has partaken of the Bread of Life. He has really received Jesus Christ into his innermost being.", "source": "The Lord's Table, Part 3, ch.1"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Everything he had was from his father.", "source": "The God of Abraham, Isaac, and Jacob, ch.7 (bibleread.online)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Is God in Christ revealing Himself to you in ever greater wonder and fullness?", "source": "The School of Christ, 'How We Get the Light of Life' (austin-sparks.net)"}], "declarations": ["I declare: I have tasted and seen that the LORD is good.", "I declare: Blessed am I, for I trust in Him."], "prayer": "Lord Jesus, You are good. Let me taste Your goodness afresh today and trust You with all my heart. Amen.", "theme_flag": "theme-based: Nee, Sparks"}, {"day": 45, "ref": "Psalms 40:7", "book": "Psalms", "chapter": 40, "verse": 7, "text": "Then said I, Lo, I come: in the volume of the book it is written of me,", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "'Lo, I come' is the word of the Son's free offering of Himself to accomplish the whole will of God in His work here below.", "source": "Darby's Synopsis, Psalm 40 (biblehub)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "He who entered it with His 'Lo, I come to do Thy will, O God,' ever confessed to men, 'I seek not My own will, but the will of Him that sent Me.'", "source": "The School of Obedience (swartzentrover.com)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "This book, the Bible, reveals God's Son; it reveals Christ.", "source": "The Ministry of God's Word, ch.8 'Christ as God's Word' (bibleread.online)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "The resurrection of the Lord Jesus has got to become to His own a daily reality.", "source": "Spiritual Death and His Risen Life (austin-sparks.net)"}], "declarations": ["I declare: Like my Lord, I say, Lo, I come, to do Your will.", "I declare: The whole Book is written of Christ, and I find Him on every page."], "prayer": "Lord Jesus, who said 'Lo, I come,' I come to You today. Write Your will on my heart as it is written in the Book. Amen.", "theme_flag": "theme-based: Nee, Sparks"}, {"day": 46, "ref": "Psalms 40:8", "book": "Psalms", "chapter": 40, "verse": 8, "text": "I delight to do thy will, O my God: yea, thy law is within my heart.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "His work was to obey; but He in perfect free voluntariness offers Himself for it in the delight of willingly undertaken obedience.", "source": "Darby's Synopsis, Psalm 40 (biblehub)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "The will of God is the power that rules the whole moral as well as the natural world. How could there be fellowship with Him without delight in His will?", "source": "Abide in Christ, 'Obeying His Commandments' (ccel.org)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "This harmony in will is a great glory to God!", "source": "The Prayer Ministry of the Church, ch.1 (bibleread.online)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "All our blessing is bound up with Himself.", "source": "The Living God (austin-sparks.net)"}], "declarations": ["I declare: I delight to do Your will, O my God; Your law is within my heart.", "I declare: Obedience is my joy, for Christ delighted to obey the Father."], "prayer": "Lord Jesus, who delighted to do the Father's will, put that same delight in me. Let Your law live within my heart. Amen.", "theme_flag": "theme-based: Sparks"}, {"day": 47, "ref": "Psalms 45:6", "book": "Psalms", "chapter": 45, "verse": 6, "text": "Thy throne, O God, is for ever and ever: the sceptre of thy kingdom is a right sceptre.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "It introduces Messiah. He had already proved that He loved righteousness and hated iniquity and was fit to govern. He is saluted as God. Messiah is God.", "source": "Darby's Synopsis, Psalm 45 (biblehub)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "He dwells on the throne and in the bosom of the Father: the deliverance from what He had to suffer from sin is complete and eternal.", "source": "Abide in Christ, 'As your Redemption' (ccel.org)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "From eternity to eternity, our God is God.", "source": "The Collected Works of Watchman Nee, Set 2 Vol.36: Central Messages, ch.9 'Christ is the I am' (bibleread.online)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "He is reigning, and must continue to reign, until He has put all His enemies under His feet.", "source": "Men Whose Eyes Have Seen the King, ch.8 (austin-sparks.net)"}], "declarations": ["I declare: The throne of Christ is forever and ever; His kingdom has no end.", "I declare: The sceptre of His kingdom is righteousness, and I live under His righteous rule."], "prayer": "Lord Jesus, whose throne is forever, reign over my life. Let Your righteous sceptre order all my ways. Amen.", "theme_flag": "theme-based: Nee"}, {"day": 48, "ref": "Psalms 46:10", "book": "Psalms", "chapter": 46, "verse": 10, "text": "Be still, and know that I am God: I will be exalted among the heathen, I will be exalted in the earth.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "The place of faith is to be still and wait on Him and know that He is God.", "source": "J.N. Darby, Synopsis of the Books of the Bible, Psalms 46 (sacred-texts.com)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Be still, and know that I am God. It is God who will arise and show Himself as God.", "source": "Andrew Murray, Waiting on God, Day 26 (ccel.org)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Our rest lies in looking to the Lord, not to ourselves. We rest on the finished work of the Lord Jesus Christ.", "source": "Watchman Nee, The Spiritual Man (goodreads.com/author/quotes/12878.Watchman_Nee)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "They believed God, they trusted the Lord, and lived in a positive trust in God.", "source": "T. Austin-Sparks, 'By Faith...' (austin-sparks.net/english/001750.html)"}], "declarations": ["I declare: Christ is my God, and I am still before Him.", "I declare: He will be exalted in my life, and I will see it."], "prayer": "Lord Jesus, teach me to be still and know that You are God. Quiet my striving heart and let me rest in Your finished work. I trust You to be exalted in my life and in all the earth.", "theme_flag": "theme-based: Sparks"}, {"day": 49, "ref": "Psalms 68:18", "book": "Psalms", "chapter": 68, "verse": 18, "text": "Thou hast ascended on high, thou hast led captivity captive: thou hast received gifts for men; yea, for the rebellious also, that the LORD God might dwell among them.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Thou hast ascended on high, having led captivity captive; He received gifts for men, that the LORD God might dwell among them.", "source": "J.N. Darby, Synopsis of the Books of the Bible, Psalms 68 (sacred-texts.com)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Jesus, the Son of Man, was to be glorified when His human nature was admitted to the full participation of the power and glory in which God dwells.", "source": "Andrew Murray, The Spirit of Christ, Day 11: The Spirit Glorifying Christ (biblestudytools.com)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "The Lord not only resurrected, but He also ascended, becoming the Head of the new mankind.", "source": "Watchman Nee, Collected Works, Set 1, Vol. 18: Notes on Scriptural Messages (2), ch. 1 (bibleread.online)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Christ enthroned means redemption from the authority of darkness: He led His captivity captive.", "source": "T. Austin-Sparks, Horizoned by Christ, ch. 2 (austin-sparks.net/english/books/001882.html)"}], "declarations": ["I declare: Christ has ascended on high, and He leads every captivity captive.", "I declare: The ascended Lord dwells among us and gives gifts to men."], "prayer": "Lord Jesus, You ascended on high and led captivity captive. I receive the gifts You give, and I rejoice that You dwell among us. Be glorified in my life today.", "theme_flag": null}, {"day": 50, "ref": "Psalms 69:21", "book": "Psalms", "chapter": 69, "verse": 21, "text": "They gave me also gall for my meat; and in my thirst they gave me vinegar to drink.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "In verse 21 the prophecy was literally fulfilled in Christ, when in His thirst they gave Him vinegar to drink.", "source": "J.N. Darby, Synopsis of the Books of the Bible, Psalms 69 (sacred-texts.com)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Christ also suffered for us, leaving us an example, that ye should follow His steps.", "source": "Andrew Murray, Like Christ, ch. 4: Our Head (bible.prayerrequest.com)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "On the cross, In my thirst they gave me vinegar to drink was fulfilled. Yet He refused the wine mixed with myrrh; He chose to drink the cup given Him by God.", "source": "Watchman Nee, Collected Works, Set 1, Vol. 12: The Spiritual Man (1), ch. 5 (bibleread.online)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Jesus had not to go to the Cross to get His own glory, but to get ours.", "source": "T. Austin-Sparks, The Centrality and Universality of the Cross, ch. 1 (austin-sparks.net/m/Books-000739.html)"}], "declarations": ["I declare: Christ tasted the bitter gall for me, and He did not turn back.", "I declare: I receive the cup of His suffering as my healing."], "prayer": "Lord Jesus, they gave You gall and vinegar in Your thirst, yet You drank the cup the Father gave. Thank You for suffering in my place. I will follow Your steps.", "theme_flag": "theme-based: Murray, theme-based: Sparks"}, {"day": 51, "ref": "Psalms 80:17", "book": "Psalms", "chapter": 80, "verse": 17, "text": "Let thy hand be upon the man of thy right hand, upon the son of man whom thou madest strong for thyself.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Let Thy hand be upon the man of Thy right hand; it is power laid upon the Son of man, made strong for God Himself.", "source": "J.N. Darby, Synopsis of the Books of the Bible, Psalms 80 (sacred-texts.com)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "We see Jesus crowned with glory and honour.", "source": "Andrew Murray, The Spirit of Christ, Day 11 (biblestudytools.com)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "In Christ Jesus you are victor in the field.", "source": "Watchman Nee, Sit, Walk, Stand (goodreads.com/author/quotes/12878.Watchman_Nee)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "His enthronement is the enthronement of victory in battle.", "source": "T. Austin-Sparks, Horizoned by Christ, ch. 2 (austin-sparks.net/english/books/001882.html)"}], "declarations": ["I declare: God's hand is upon Christ, the Man at His right hand.", "I declare: I stand in the victory of the Son of Man made strong."], "prayer": "Lord Jesus, You are the Man of God's right hand, crowned with glory and honour. Let Your strength be my strength today. I rest in Your victory.", "theme_flag": "theme-based: Nee"}, {"day": 52, "ref": "Psalms 89:27", "book": "Psalms", "chapter": 89, "verse": 27, "text": "Also I will make him my firstborn, higher than the
