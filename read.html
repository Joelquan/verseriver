 I be afraid?", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "The first part is the confidence of the believer, and that absolutely, whatever enemies there were. Enemies without or oppressors within, a host and war arising, awake no fear: Jehovah is the light and salvation of the soul.", "source": "Darby's Synopsis, Psalm 27 (biblehub)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Thee, who art my Wisdom, my Light, my Leader, I take as my Prophet.", "source": "The New Life, ch.6 'God's Gift of His Son' (swartzentrover.com)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "As light dispels darkness, so truth destroys lies.", "source": "The Spiritual Man, 'Lies Denied'"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "He is not only the good Shepherd who has died for us, He is also the great Shepherd who lives for us.", "source": "Written Not With Ink, ch.9 'The Good Shepherd' (austin-sparks.net)"}], "declarations": ["I declare: The LORD is my light and my salvation; I will not fear.", "I declare: The LORD is the strength of my life; no one can make me afraid."], "prayer": "Lord Jesus, my Light and my Salvation, drive out my fears. Shine in my darkness and be the strength of my life. Amen.", "theme_flag": "theme-based: Nee, Sparks"}, {"day": 44, "ref": "Psalms 34:8", "book": "Psalms", "chapter": 34, "verse": 8, "text": "O taste and see that the LORD is good: blessed is the man that trusteth in him.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "It is the fullest encouragement to the humble righteous. Christ is the great example of this.", "source": "Darby's Synopsis, Psalm 34 (biblehub)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "The man who uses the Lord's Supper aright is distinguished by this: he has partaken of the Bread of Life. He has really received Jesus Christ into his innermost being.", "source": "The Lord's Table, Part 3, ch.1"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Everything he had was from his father.", "source": "The God of Abraham, Isaac, and Jacob, ch.7 (bibleread.online)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Is God in Christ revealing Himself to you in ever greater wonder and fullness?", "source": "The School of Christ, 'How We Get the Light of Life' (austin-sparks.net)"}], "declarations": ["I declare: I have tasted and seen that the LORD is good.", "I declare: Blessed am I, for I trust in Him."], "prayer": "Lord Jesus, You are good. Let me taste Your goodness afresh today and trust You with all my heart. Amen.", "theme_flag": "theme-based: Nee, Sparks"}, {"day": 45, "ref": "Psalms 40:7", "book": "Psalms", "chapter": 40, "verse": 7, "text": "Then said I, Lo, I come: in the volume of the book it is written of me,", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "'Lo, I come' is the word of the Son's free offering of Himself to accomplish the whole will of God in His work here below.", "source": "Darby's Synopsis, Psalm 40 (biblehub)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "He who entered it with His 'Lo, I come to do Thy will, O God,' ever confessed to men, 'I seek not My own will, but the will of Him that sent Me.'", "source": "The School of Obedience (swartzentrover.com)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "This book, the Bible, reveals God's Son; it reveals Christ.", "source": "The Ministry of God's Word, ch.8 'Christ as God's Word' (bibleread.online)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "The resurrection of the Lord Jesus has got to become to His own a daily reality.", "source": "Spiritual Death and His Risen Life (austin-sparks.net)"}], "declarations": ["I declare: Like my Lord, I say, Lo, I come, to do Your will.", "I declare: The whole Book is written of Christ, and I find Him on every page."], "prayer": "Lord Jesus, who said 'Lo, I come,' I come to You today. Write Your will on my heart as it is written in the Book. Amen.", "theme_flag": "theme-based: Nee, Sparks"}, {"day": 46, "ref": "Psalms 40:8", "book": "Psalms", "chapter": 40, "verse": 8, "text": "I delight to do thy will, O my God: yea, thy law is within my heart.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "His work was to obey; but He in perfect free voluntariness offers Himself for it in the delight of willingly undertaken obedience.", "source": "Darby's Synopsis, Psalm 40 (biblehub)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "The will of God is the power that rules the whole moral as well as the natural world. How could there be fellowship with Him without delight in His will?", "source": "Abide in Christ, 'Obeying His Commandments' (ccel.org)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "This harmony in will is a great glory to God!", "source": "The Prayer Ministry of the Church, ch.1 (bibleread.online)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "All our blessing is bound up with Himself.", "source": "The Living God (austin-sparks.net)"}], "declarations": ["I declare: I delight to do Your will, O my God; Your law is within my heart.", "I declare: Obedience is my joy, for Christ delighted to obey the Father."], "prayer": "Lord Jesus, who delighted to do the Father's will, put that same delight in me. Let Your law live within my heart. Amen.", "theme_flag": "theme-based: Sparks"}, {"day": 47, "ref": "Psalms 45:6", "book": "Psalms", "chapter": 45, "verse": 6, "text": "Thy throne, O God, is for ever and ever: the sceptre of thy kingdom is a right sceptre.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "It introduces Messiah. He had already proved that He loved righteousness and hated iniquity and was fit to govern. He is saluted as God. Messiah is God.", "source": "Darby's Synopsis, Psalm 45 (biblehub)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "He dwells on the throne and in the bosom of the Father: the deliverance from what He had to suffer from sin is complete and eternal.", "source": "Abide in Christ, 'As your Redemption' (ccel.org)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "From eternity to eternity, our God is God.", "source": "The Collected Works of Watchman Nee, Set 2 Vol.36: Central Messages, ch.9 'Christ is the I am' (bibleread.online)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "He is reigning, and must continue to reign, until He has put all His enemies under His feet.", "source": "Men Whose Eyes Have Seen the King, ch.8 (austin-sparks.net)"}], "declarations": ["I declare: The throne of Christ is forever and ever; His kingdom has no end.", "I declare: The sceptre of His kingdom is righteousness, and I live under His righteous rule."], "prayer": "Lord Jesus, whose throne is forever, reign over my life. Let Your righteous sceptre order all my ways. Amen.", "theme_flag": "theme-based: Nee"}, {"day": 48, "ref": "Psalms 46:10", "book": "Psalms", "chapter": 46, "verse": 10, "text": "Be still, and know that I am God: I will be exalted among the heathen, I will be exalted in the earth.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "The place of faith is to be still and wait on Him and know that He is God.", "source": "J.N. Darby, Synopsis of the Books of the Bible, Psalms 46 (sacred-texts.com)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Be still, and know that I am God. It is God who will arise and show Himself as God.", "source": "Andrew Murray, Waiting on God, Day 26 (ccel.org)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Our rest lies in looking to the Lord, not to ourselves. We rest on the finished work of the Lord Jesus Christ.", "source": "Watchman Nee, The Spiritual Man (goodreads.com/author/quotes/12878.Watchman_Nee)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "They believed God, they trusted the Lord, and lived in a positive trust in God.", "source": "T. Austin-Sparks, 'By Faith...' (austin-sparks.net/english/001750.html)"}], "declarations": ["I declare: Christ is my God, and I am still before Him.", "I declare: He will be exalted in my life, and I will see it."], "prayer": "Lord Jesus, teach me to be still and know that You are God. Quiet my striving heart and let me rest in Your finished work. I trust You to be exalted in my life and in all the earth.", "theme_flag": "theme-based: Sparks"}, {"day": 49, "ref": "Psalms 68:18", "book": "Psalms", "chapter": 68, "verse": 18, "text": "Thou hast ascended on high, thou hast led captivity captive: thou hast received gifts for men; yea, for the rebellious also, that the LORD God might dwell among them.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Thou hast ascended on high, having led captivity captive; He received gifts for men, that the LORD God might dwell among them.", "source": "J.N. Darby, Synopsis of the Books of the Bible, Psalms 68 (sacred-texts.com)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Jesus, the Son of Man, was to be glorified when His human nature was admitted to the full participation of the power and glory in which God dwells.", "source": "Andrew Murray, The Spirit of Christ, Day 11: The Spirit Glorifying Christ (biblestudytools.com)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "The Lord not only resurrected, but He also ascended, becoming the Head of the new mankind.", "source": "Watchman Nee, Collected Works, Set 1, Vol. 18: Notes on Scriptural Messages (2), ch. 1 (bibleread.online)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Christ enthroned means redemption from the authority of darkness: He led His captivity captive.", "source": "T. Austin-Sparks, Horizoned by Christ, ch. 2 (austin-sparks.net/english/books/001882.html)"}], "declarations": ["I declare: Christ has ascended on high, and He leads every captivity captive.", "I declare: The ascended Lord dwells among us and gives gifts to men."], "prayer": "Lord Jesus, You ascended on high and led captivity captive. I receive the gifts You give, and I rejoice that You dwell among us. Be glorified in my life today.", "theme_flag": null}, {"day": 50, "ref": "Psalms 69:21", "book": "Psalms", "chapter": 69, "verse": 21, "text": "They gave me also gall for my meat; and in my thirst they gave me vinegar to drink.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "In verse 21 the prophecy was literally fulfilled in Christ, when in His thirst they gave Him vinegar to drink.", "source": "J.N. Darby, Synopsis of the Books of the Bible, Psalms 69 (sacred-texts.com)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Christ also suffered for us, leaving us an example, that ye should follow His steps.", "source": "Andrew Murray, Like Christ, ch. 4: Our Head (bible.prayerrequest.com)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "On the cross, In my thirst they gave me vinegar to drink was fulfilled. Yet He refused the wine mixed with myrrh; He chose to drink the cup given Him by God.", "source": "Watchman Nee, Collected Works, Set 1, Vol. 12: The Spiritual Man (1), ch. 5 (bibleread.online)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Jesus had not to go to the Cross to get His own glory, but to get ours.", "source": "T. Austin-Sparks, The Centrality and Universality of the Cross, ch. 1 (austin-sparks.net/m/Books-000739.html)"}], "declarations": ["I declare: Christ tasted the bitter gall for me, and He did not turn back.", "I declare: I receive the cup of His suffering as my healing."], "prayer": "Lord Jesus, they gave You gall and vinegar in Your thirst, yet You drank the cup the Father gave. Thank You for suffering in my place. I will follow Your steps.", "theme_flag": "theme-based: Murray, theme-based: Sparks"}, {"day": 51, "ref": "Psalms 80:17", "book": "Psalms", "chapter": 80, "verse": 17, "text": "Let thy hand be upon the man of thy right hand, upon the son of man whom thou madest strong for thyself.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Let Thy hand be upon the man of Thy right hand; it is power laid upon the Son of man, made strong for God Himself.", "source": "J.N. Darby, Synopsis of the Books of the Bible, Psalms 80 (sacred-texts.com)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "We see Jesus crowned with glory and honour.", "source": "Andrew Murray, The Spirit of Christ, Day 11 (biblestudytools.com)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "In Christ Jesus you are victor in the field.", "source": "Watchman Nee, Sit, Walk, Stand (goodreads.com/author/quotes/12878.Watchman_Nee)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "His enthronement is the enthronement of victory in battle.", "source": "T. Austin-Sparks, Horizoned by Christ, ch. 2 (austin-sparks.net/english/books/001882.html)"}], "declarations": ["I declare: God's hand is upon Christ, the Man at His right hand.", "I declare: I stand in the victory of the Son of Man made strong."], "prayer": "Lord Jesus, You are the Man of God's right hand, crowned with glory and honour. Let Your strength be my strength today. I rest in Your victory.", "theme_flag": "theme-based: Nee"}, {"day": 52, "ref": "Psalms 89:27", "book": "Psalms", "chapter": 89, "verse": 27, "text": "Also I will make him my firstborn, higher than the kings of the earth.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "I will make Him My firstborn, higher than the kings of the earth; the Christ is set above all rule.", "source": "J.N. Darby, Synopsis of the Books of the Bible, Psalms 89 (theme-based; sacred-texts.com)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Christ is the second Adam, the Head of a new race.", "source": "Andrew Murray, Like Christ, ch. 4: Our Head (bible.prayerrequest.com)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "It is a fact that Christ is victorious and forever victorious.", "source": "Watchman Nee, The Glorious Church (goodreads.com/author/quotes/12878.Watchman_Nee)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "That in all things he might have the pre-eminence.", "source": "T. Austin-Sparks, The Centrality and Supremacy of the Lord Jesus Christ, ch. 1 (austin-sparks.net/m/Books-000729.html)"}], "declarations": ["I declare: Christ is God's Firstborn, higher than all kings.", "I declare: I belong to the victorious Christ who reigns forever."], "prayer": "Lord Jesus, You are the Firstborn, higher than the kings of the earth. I bow to Your pre-eminence in all things. Reign in my heart today.", "theme_flag": "theme-based: Darby, theme-based: Murray, theme-based: Nee"}, {"day": 53, "ref": "Psalms 91:1", "book": "Psalms", "chapter": 91, "verse": 1, "text": "He that dwelleth in the secret place of the most High shall abide under the shadow of the Almighty.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "He that dwelleth in the secret place of the Most High shall abide under the shadow of the Almighty; here is perfect, almighty protection.", "source": "J.N. Darby, Synopsis of the Books of the Bible, Psalms 91 (sacred-texts.com)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Come and be still under the shadow of the true Vine, and rest under it from the heat of the day.", "source": "Andrew Murray, The True Vine: The Vine (ccel.org)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "In Psalm 91, we find that those who dwell in the secret place of the Most High will abide in the shadow of the Almighty. The Lord will deliver these ones from many perils.", "source": "Watchman Nee, Collected Works, Set 2, Vol. 37: General Messages (1), ch. 3 (bibleread.online)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "What is the thing for which Christ stands preeminently in the whole revelation of Scripture? The answer is union with God.", "source": "T. Austin-Sparks, The Centrality and Universality of the Cross, ch. 1 (austin-sparks.net/m/Books-000739.html)"}], "declarations": ["I declare: I dwell in the secret place of the Most High.", "I declare: I abide under the shadow of the Almighty, safe and sheltered."], "prayer": "Lord Jesus, You are my secret place and my shadow. I come and rest under Your covering today. Deliver me from every peril, for I dwell in You.", "theme_flag": "theme-based: Sparks"}, {"day": 54, "ref": "Psalms 110:1", "book": "Psalms", "chapter": 110, "verse": 1, "text": "A Psalm of David. The LORD said unto my Lord, Sit thou at my right hand, until I make thine enemies thy footstool.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "The LORD said unto my Lord, Sit Thou at My right hand; He is called to sit at the right hand of Jehovah.", "source": "J.N. Darby, Synopsis of the Books of the Bible, Psalms 110 (sacred-texts.com)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "In exalting Him above all rule and power and dominion, the Father hath put all things in subjection under His feet.", "source": "Andrew Murray, The Spirit of Christ, Day 11 (biblestudytools.com)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Only those who sit can stand.", "source": "Watchman Nee, Sit, Walk, Stand (goodreads.com/author/quotes/12878.Watchman_Nee)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Christ risen, ascended, and reigning was the Horizon.", "source": "T. Austin-Sparks, Horizoned by Christ, ch. 2 (austin-sparks.net/english/books/001882.html)"}], "declarations": ["I declare: Christ sits at God's right hand, and every enemy is His footstool.", "I declare: I sit with Him in the heavenly places, far above all."], "prayer": "Lord Jesus, You sit at the Father's right hand, exalted above all. I take my seat with You by faith. Let Your reign govern my life today.", "theme_flag": "theme-based: Nee"}, {"day": 55, "ref": "Psalms 110:4", "book": "Psalms", "chapter": 110, "verse": 4, "text": "The LORD hath sworn, and will not repent, Thou art a priest for ever after the order of Melchizedek.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Thou art a priest for ever after the order of Melchizedek; He is a priest upon His throne.", "source": "J.N. Darby, Synopsis of the Books of the Bible, Psalms 110 (sacred-texts.com)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Our blessed King-Priest, our Melchizedek, ever liveth to apply to us all the blessed fruits of His atonement.", "source": "Andrew Murray, The Holiest of All, on Hebrews 7 (goodreads.com/book/show/131003071)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "The Lord is our Mediator, our Defender. The Lord speaks for us.", "source": "Watchman Nee, The Glorious Church (goodreads.com/author/quotes/12878.Watchman_Nee)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "As Priest in heaven, a priest upon His throne, He makes intercession prevailingly because of His own perfection.", "source": "T. Austin-Sparks, Horizoned by Christ, ch. 2 (austin-sparks.net/english/books/001882.html)"}], "declarations": ["I declare: Christ is my Priest forever after the order of Melchizedek.", "I declare: His intercession prevails for me because He is perfect."], "prayer": "Lord Jesus, my great King-Priest, You ever live to make intercession for me. Speak for me before the Father today. I rest in Your perfect priesthood.", "theme_flag": "theme-based: Nee"}, {"day": 56, "ref": "Psalms 118:22", "book": "Psalms", "chapter": 118, "verse": 22, "text": "The stone which the builders refused is become the head stone of the corner.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "The stone which the builders refused is become the head stone of the corner; this is the Lord's doing.", "source": "J.N. Darby, Synopsis of the Books of the Bible, Psalms 118 (sacred-texts.com)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "He was nothing, that God might be all. In Him the rejected Stone becomes the Head of the corner.", "source": "Andrew Murray, Humility, ch. 3 (worthychristianbooks.com)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "He who is able to accept everything gladly from the Lord, and completely disregard self, is he who lives for Him.", "source": "Watchman Nee (goodreads.com/author/quotes/12878.Watchman_Nee)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Christ has triumphed through His cross, in His resurrection, and is in the throne of His Father.", "source": "T. Austin-Sparks, God's Inheritance of Glory in Sons, ch. 3 (austin-sparks.com/english/books/006288.html)"}], "declarations": ["I declare: The Stone the builders refused is now the Head of the corner.", "I declare: I build my life on Christ, the precious foundation."], "prayer": "Lord Jesus, rejected by men but chosen by God, You are the Head of the corner. I build on You alone. Let my life rise true on this foundation.", "theme_flag": "theme-based: Murray, theme-based: Nee"}, {"day": 57, "ref": "Psalms 118:26", "book": "Psalms", "chapter": 118, "verse": 26, "text": "Blessed be he that cometh in the name of the LORD: we have blessed you out of the house of the LORD.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Blessed be He that cometh in the name of the LORD; we have blessed you out of the house of the LORD.", "source": "J.N. Darby, Synopsis of the Books of the Bible, Psalms 118 (sacred-texts.com)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "He is the glorified One, who from the throne gives His Spirit to make His presence real and true.", "source": "Andrew Murray, The True Vine: The Vine (ccel.org)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Jesus opened up God's heart to men.", "source": "Watchman Nee, God is Willing (goodreads.com/author/quotes/12878.Watchman_Nee)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "The Incarnation is intended to set forth the union between God and man, and man and God.", "source": "T. Austin-Sparks, The Centrality and Universality of the Cross, ch. 1 (austin-sparks.net/m/Books-000739.html)"}], "declarations": ["I declare: Blessed is Christ who comes in the name of the LORD.", "I declare: I welcome Him and bless His coming into my life."], "prayer": "Lord Jesus, blessed are You who came in the name of the Lord. You opened God's heart to me. I welcome You afresh today; come and dwell in my heart.", "theme_flag": "theme-based: Murray, theme-based: Nee, theme-based: Sparks"}, {"day": 58, "ref": "Proverbs 3:5", "book": "Proverbs", "chapter": 3, "verse": 5, "text": "¶ Trust in the LORD with all thine heart; and lean not unto thine own understanding.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "The Book of Proverbs gives us the application of that wisdom which created the heavens and the earth to the details of life in this world of confusion and evil. This thought brings out the immensity of grace unfolded here. God deigns to apply His wisdom to the circumstances of our practical life, and to shew us, with His own intelligence, the consequences of all the ways in which man may walk. For it is often in the way of knowledge, not of precept, that the statements made in the Book of Proverbs are presented.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "The understand- ing deals with conceptions and images of di- vine things, but it cannot reach the real life of the soul. Hence the command: “Trust in the Lord with all thine heart, and lean not upon thine own understanding.” It is with the heart man believes, and comes into touch with God. It is in the heart God has given His Spirit, to be there to us the presence and the power of God working in us. In all our religion it is the heart that must trust and love and worship and obey. My mind is utterly impotent in creating or maintaining the spirtual life within me. The heart must wait on God for Him to work it in me.", "source": "Waiting on God, Day 9"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Our faith is not to be in God plus man but in God alone.", "source": "The Table in the Wilderness"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "We have to make over to the Lord's account things which may have been mistakes or failures, and trust Him with these and go on.", "source": "'By Faith...'"}], "declarations": ["I declare: I trust in the LORD with all my heart.", "I declare: I lean not on my own understanding, for He is my wisdom."], "prayer": "Lord Jesus, I trust You with all my heart. I refuse to lean on my own understanding. Be my wisdom and my guide in every decision today.", "theme_flag": "theme-based: Darby"}, {"day": 59, "ref": "Proverbs 3:6", "book": "Proverbs", "chapter": 3, "verse": 6, "text": "In all thy ways acknowledge him, and he shall direct thy paths.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "The Book of Proverbs gives us the application of that wisdom which created the heavens and the earth to the details of life in this world of confusion and evil. This thought brings out the immensity of grace unfolded here. God deigns to apply His wisdom to the circumstances of our practical life, and to shew us, with His own intelligence, the consequences of all the ways in which man may walk. For it is often in the way of knowledge, not of precept, that the statements made in the Book of Proverbs are presented.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "There is now, as there was then, as there has been at all times, a remnant that seek after God with their whole heart. But if we look at Christendom as a whole, at the state of the Church of Christ, there is infinite cause for beseeching God to rend the Heavens and come down. Nothing but a special interposition of almighty power will avail. I fear we have no right conception of what the so-called Christian world is in the sight of God. Unless God comes down “as when the melting fire burneth . . . to make known his name to his adversaries,” our labors are comparatively fruitless.", "source": "Waiting on God, Day 15"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Man's failure is not due to his weakness, but to his not accepting God's strength.", "source": "A Living Sacrifice"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "What the Lord wants is a heart perfect toward Him; not that we did our work perfectly but that we trusted the Lord.", "source": "'By Faith...'"}], "declarations": ["I declare: I acknowledge Christ in all my ways.", "I declare: He directs my paths and makes them straight."], "prayer": "Lord Jesus, I acknowledge You in all my ways. Direct my paths and guide my thoughts and actions. I trust Your counsel above my own.", "theme_flag": "theme-based: Darby, theme-based: Nee"}, {"day": 60, "ref": "Proverbs 8:22", "book": "Proverbs", "chapter": 8, "verse": 22, "text": "The LORD possessed me in the beginning of his way, before his works of old.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "The Book of Proverbs gives us the application of that wisdom which created the heavens and the earth to the details of life in this world of confusion and evil. This thought brings out the immensity of grace unfolded here. God deigns to apply His wisdom to the circumstances of our practical life, and to shew us, with His own intelligence, the consequences of all the ways in which man may walk. For it is often in the way of knowledge, not of precept, that the statements made in the Book of Proverbs are presented.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "I am the true Vine.--The vine is the living Lord, who Himself speaks, and gives, and works all that He has for us. If you would know the meaning and power of that word, do not think to find it by thought or study; these may help to show you what you must get from Him to awaken desire and hope and prayer, but they cannot show you the Vine. Jesus alone can reveal Himself. He gives His Holy Spirit to open the eyes to gaze upon Himself, to open the heart to receive Himself. He must Himself speak the word to you and me.", "source": "The True Vine: The Vine"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Our power is not the strength to do things; rather, it is a Person.", "source": "Christ the Sum of All Spiritual Things"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Wherever you read the word Wisdom, put Christ in the place of Wisdom and you have transformed the book.", "source": "The Centrality and Supremacy of the Lord Jesus Christ"}], "declarations": ["I declare: Christ is my Wisdom, possessed by God from the beginning.", "I declare: I receive Him as my power and my life."], "prayer": "Lord Jesus, You are the Wisdom of God, possessed before all works. Open my eyes to see You and my heart to receive You. Be my wisdom today.", "theme_flag": "theme-based: Darby, theme-based: Murray, theme-based: Nee"}, {"day": 61, "ref": "Proverbs 8:30", "book": "Proverbs", "chapter": 8, "verse": 30, "text": "Then I was by him, as one brought up with him: and I was daily his delight, rejoicing always before him;", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "It is a great blessing to be provided for in the labyrinth of this world, in which a false step may lead to such bitter consequences, with a book that sets forth the path of prudence and of life; and that in connection with a wisdom which comes from God. Heavenly wisdom exercised in, and applied to, this world It is well to remember that the Book of Proverbs treats of this world, and of God's government, according to which man reaps that which he has sown. This is always true, whatever may be the sovereign grace that bestows on us things beyond and infinitely above this world.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "How many eyes have gazed on and admired a great vine with its beautiful fruit. Come and gaze on the heavenly Vine till your eye turns from all else to admire Him. How many, in a sunny clime, sit and rest under the shadow of a vine. Come and be still under the shadow of the true Vine, and rest under it from the heat of the day. What countless numbers rejoice in the fruit of the vine! Come, and take, and eat of the heavenly fruit of the true Vine, and let your soul say: \"I sat under His shadow with great delight, and His fruit was sweet to my taste.\" I am the true Vine.--This is a heavenly mystery.", "source": "The True Vine: The Vine"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Actually, only God can satisfy a Christian's heart; man cannot.", "source": "The Spiritual Man"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Everything hangs upon an inward revelation of Jesus Christ.", "source": "The Centrality and Supremacy of the Lord Jesus Christ"}], "declarations": ["I declare: Christ is the Father's delight, and He is mine.", "I declare: I sit under His shadow with great delight."], "prayer": "Lord Jesus, You were daily the Father's delight. Make me Your delight too. I sit under Your shadow and taste Your sweetness today.", "theme_flag": "theme-based: Darby, theme-based: Nee, theme-based: Sparks"}, {"day": 62, "ref": "Proverbs 16:3", "book": "Proverbs", "chapter": 16, "verse": 3, "text": "Commit thy works unto the LORD, and thy thoughts shall be established.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "The Book of Proverbs gives us the application of that wisdom which created the heavens and the earth to the details of life in this world of confusion and evil. This thought brings out the immensity of grace unfolded here. God deigns to apply His wisdom to the circumstances of our practical life, and to shew us, with His own intelligence, the consequences of all the ways in which man may walk. For it is often in the way of knowledge, not of precept, that the statements made in the Book of Proverbs are presented.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "All the stores of provisions or clothing or ammunition have not arrived; without these it dare not proceed. It is not otherwise in the Christian life: day by day, at every step, we need our supplies from above. And there is nothing so needful as to cultivate that spirit of dependence on God and of confidence in Him, which refuses to go on without the needed supply of grace and strength. If the question be asked, whether this be anything different from what we do when we pray, the answer is that there may be much praying with but very little waiting on God.", "source": "Waiting on God, Day 25"}, {"name": "Watchman Nee", "short": "Nee", "comment": "The all-important rule is not to 'try,' but to 'trust,' not to depend upon our own strength, but upon His.", "source": "Sit, Walk, Stand"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "The only way of life and deliverance from such a paralysis is a deliberate faith in God.", "source": "'By Faith...'"}], "declarations": ["I declare: I commit my works unto the LORD.", "I declare: My thoughts are established as I rest in Him."], "prayer": "Lord Jesus, I commit my works to You today. I will not try in my own strength but trust in Yours. Establish my thoughts as I rest quietly in You.", "theme_flag": "theme-based: Darby, theme-based: Sparks"}, {"day": 63, "ref": "Proverbs 30:4", "book": "Proverbs", "chapter": 30, "verse": 4, "text": "Who hath ascended up into heaven, or descended? who hath gathered the wind in his fists? who hath bound the waters in a garment? who hath established all the ends of the earth? what is his name, and what is his son’s name, if thou canst tell?", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "The Book of Proverbs gives us the application of that wisdom which created the heavens and the earth to the details of life in this world of confusion and evil. This thought brings out the immensity of grace unfolded here. God deigns to apply His wisdom to the circumstances of our practical life, and to shew us, with His own intelligence, the consequences of all the ways in which man may walk. For it is often in the way of knowledge, not of precept, that the statements made in the Book of Proverbs are presented.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "All things, what- soever the Father hath, are mine ; therefore, said I, that He taketh of mine, and shall declare it unto you.' *A11 things that are mine are Thine, and Thine are mine ; and I am glorified in them.' In exalting Him above all rule and power and dominion, the Father hath put all things in subjec- tion under His feet : He gave unto Him the Name which is above every name, that in the Name of Jesus every knee should bow. The Kingdom and the Power and the Glory are ever one : Unto Him that sitteth on the Throne, and to the Lamb in the midst of the Throne, be the Glory and the Dominion for ever.", "source": "The Spirit of Christ, Day 11"}, {"name": "Watchman Nee", "short": "Nee", "comment": "God had to personally come to this world and become a man. This man is Jesus, the Christ, whom we know.", "source": "Watchman Nee (goodreads.com/author/quotes/12878.Watchman_Nee)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "This is the climax of the cycle from emptying to filling, from humbling to glorifying.", "source": "Horizoned by Christ"}], "declarations": ["I declare: Christ descended and ascended; His Name is above every name.", "I declare: I know His Name: Jesus the Christ."], "prayer": "Lord Jesus, You descended to us and ascended far above all. Your Name is above every name. I bow to You today and confess You as Lord.", "theme_flag": "theme-based: Darby, theme-based: Nee, theme-based: Sparks"}, {"day": 64, "ref": "Ecclesiastes 3:1", "book": "Ecclesiastes", "chapter": 3, "verse": 1, "text": "To every thing there is a season, and a time to every purpose under the heaven:", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "What profit has been to him? There is a time for all things, and man must do each in its season, and enjoy that which God gives on his way. But God is the same in all His works, that men should fear before Him. He knows that God will judge the righteous and the wicked; but, as far as man's knowledge extends, he dies as the beast dies, and who can tell what becomes of him afterwards? There is no question here of the revelation of the world to come, but only of the conclusions drawn from experience of what takes place in this world. The knowledge of God teaches that there is a judgment; to man all is darkness beyond the present life.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "The very prayer shows how we fear lest it might be. Let us listen to God’s answer, until every fear is banished, and we send back to Heaven the words God speaks, Yea, Lord, we believe what Thou sayest: “All they that wait for me shall not be ashamed.” “Blessed are all they that wait for him.” The context of each of these two passages points us to times when God’s Church was in great straits, and to human eye there were no possibilities of deliverance. But God interposes with His word of promise, and pledges His almighty power for the deliverance of His people.", "source": "Waiting on God, Day 11"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Good is not always God's will, but God's will is always good.", "source": "Watchman Nee (goodreads.com/author/quotes/12878.Watchman_Nee)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "God, the Father, had horizoned everything by His Son.", "source": "Horizoned by Christ"}], "declarations": ["I declare: There is a season for everything, and God makes it beautiful.", "I declare: I wait patiently for His good time."], "prayer": "Lord Jesus, You order every season by Your wisdom. Teach me to wait patiently for Your good time. I trust that Your will is always good.", "theme_flag": "theme-based: Darby, theme-based: Nee, theme-based: Sparks"}, {"day": 65, "ref": "Ecclesiastes 12:13", "book": "Ecclesiastes", "chapter": 12, "verse": 13, "text": "¶ Let us hear the conclusion of the whole matter: Fear God, and keep his commandments: for this is the whole duty of man.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Nevertheless the wisdom of the upright, and the folly of the fool, have each its own consequences, and, after all, God judges. To sum up the whole, God must be remembered, and that before weakness and old age overtake us. For the manifest conclusion of all that has been said is \"Fear God and keep his commandments, for this is the whole of man.\" Submission and obedience to God the principle of all true wisdom The chief subject, then, of this Book is the folly of all man's efforts in seeking happiness here below, and that the wisdom which judges all this only renders man still more unhappy.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Waiting under the cloud of trial, that breaks in showers of bless- ing, is as needful. Be assured that if God waits longer than you could wish, it is only to make the blessing doubly precious. God waited four thousand years, till the fullness of time, ere He sent His Son; our times are in His hands; He will avenge His elect speedily; He will make haste for our help, and not delay one hour too long. The other answer points to what has been said before. The giver is more than the gift; God is more than the blessing; and our being kept waiting on Him is the only way for our learning to find our life and joy in Himself.", "source": "Waiting on God, Day 10"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Any action which lacks in obedience is a fall, and any act of disobedience is rebellion.", "source": "Spiritual Authority"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Looking to Christ crucified as the Author and Perfecter of salvation, they discover that He is more than a man.", "source": "The Centrality and Universality of the Cross"}], "declarations": ["I declare: I fear God and keep His commandments.", "I declare: Christ is my perfect Example and my strength to obey."], "prayer": "Lord Jesus, I fear Your glorious name and desire to keep Your commandments. You are more than a man; You are my Lord. Teach me obedience today.", "theme_flag": "theme-based: Darby, theme-based: Sparks"}, {"day": 66, "ref": "Song of Solomon 2:1", "book": "Song of Solomon", "chapter": 2, "verse": 1, "text": "I am the rose of Sharon, and the lily of the valleys.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "\"Oh that thou wert as my brother! when I should find thee without I would kiss thee!\" Nevertheless, the Spirit of God desiring to assure the heart of the remnant of the Saviour's love, we see that the expression of the heart's desire to possess its Beloved does not cease until it has gained its object. The heart assures itself according to the operation of the Spirit of prophecy; for in fact Christ is for the remnant, and the remnant is for Him. The whole is based on this. But the heart needs to be reassured, as in a similar case we observe in other passages.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "How many eyes have gazed on and admired a great vine with its beautiful fruit. Come and gaze on the heavenly Vine till your eye turns from all else to admire Him. How many, in a sunny clime, sit and rest under the shadow of a vine. Come and be still under the shadow of the true Vine, and rest under it from the heat of the day. What countless numbers rejoice in the fruit of the vine! Come, and take, and eat of the heavenly fruit of the true Vine, and let your soul say: \"I sat under His shadow with great delight, and His fruit was sweet to my taste.\"", "source": "The True Vine: The Vine"}, {"name": "Watchman Nee", "short": "Nee", "comment": "The idea of waste only comes into our Christianity when we underestimate the worth of our Lord.", "source": "The Normal Christian Life"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Oh, the depths, the fullness, of Christ!", "source": "Daily Open Windows"}], "declarations": ["I declare: Christ is the Rose of Sharon, beautiful in lowliness.", "I declare: I gaze on Him till my eyes turn from all else."], "prayer": "Lord Jesus, my Rose of Sharon, how beautiful You are in Your lowliness. I turn my eyes from all else to admire You. Fill me with Your fullness today.", "theme_flag": "theme-based: Darby, theme-based: Nee, theme-based: Sparks"}, {"day": 67, "ref": "Song of Solomon 5:16", "book": "Song of Solomon", "chapter": 5, "verse": 16, "text": "His mouth is most sweet: yea, he is altogether lovely. This is my beloved, and this is my friend, O daughters of Jerusalem.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "\"Oh that thou wert as my brother! when I should find thee without I would kiss thee!\" Nevertheless, the Spirit of God desiring to assure the heart of the remnant of the Saviour's love, we see that the expression of the heart's desire to possess its Beloved does not cease until it has gained its object. The heart assures itself according to the operation of the Spirit of prophecy; for in fact Christ is for the remnant, and the remnant is for Him. The whole is based on this. But the heart needs to be reassured, as in a similar case we observe in other passages.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Our abode, the home of our soul, is to be the love of Christ. We are to live our life there, to be at home there all the day: this is what Christ means our life to be, and really can make it. Our continuous abiding in the Vine is to be an abiding in His love. You have probably heard or read of what is called the higher, or the deeper life, of the richer or the fuller life, of the life abundant. And you possibly know that some have told of a wonderful change, by which their life of continual failure and stumbling had been changed into a very blessed experience of being kept and strengthened and made exceeding glad.", "source": "The True Vine: Abide in My Love"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Many of us only know the preciousness of the Lord's work, but not the preciousness of the Lord Himself. We only know the grace we have received, but not the loveliness of the Lord.", "source": "Notes on Scriptural Messages (2)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "It is Christ, the beauties of Christ, the preciousness of Christ to the Father which is the foundation.", "source": "Features of Zion"}], "declarations": ["I declare: Christ is altogether lovely, my Beloved and my Friend.", "I declare: I make my home in His love all the day."], "prayer": "Lord Jesus, my Beloved and my Friend, You are altogether lovely. I want to know not just Your work but Your Person. I make my home in Your love today.", "theme_flag": "theme-based: Darby"}, {"day": 68, "ref": "Song of Solomon 8:7", "book": "Song of Solomon", "chapter": 8, "verse": 7, "text": "Many waters cannot quench love, neither can the floods drown it: if a man would give all the substance of his house for love, it would utterly be contemned.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "\"Oh that thou wert as my brother! when I should find thee without I would kiss thee!\" Nevertheless, the Spirit of God desiring to assure the heart of the remnant of the Saviour's love, we see that the expression of the heart's desire to possess its Beloved does not cease until it has gained its object. The heart assures itself according to the operation of the Spirit of prophecy; for in fact Christ is for the remnant, and the remnant is for Him. The whole is based on this. But the heart needs to be reassured, as in a similar case we observe in other passages.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "In His love He begat the Son, that He might give all to Him. In His love He brought forth creatures that He might make them partakers of His blessedness. Christ is the Son of God's love, the bearer, the revealer, the communicator of that love. His life and death were all love. Love is His life, and the life He gives. He only lives to love, to live out His life of love in us, to give Himself in all who will receive Him. The very first thought of the true Vine is love--living only to impart His life to the branches.", "source": "The True Vine: Love One Another"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Love does not know the meaning of 'difficulty.' The most wonderful thing in the world is that the presence of love makes everything easy.", "source": "Notes on Scriptural Messages (2)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "He became broken in order that He might unite.", "source": "Vocational Fellowship"}], "declarations": ["I declare: Christ's love for me cannot be quenched.", "I declare: Many waters cannot drown His love; it is everlasting."], "prayer": "Lord Jesus, Your love is unquenchable. Many waters cannot quench it. Thank You for loving me with an everlasting love. Let Your love flow through me today.", "theme_flag": "theme-based: Darby, theme-based: Sparks"}, {"day": 69, "ref": "Isaiah 7:14", "book": "Isaiah", "chapter": 7, "verse": 14, "text": "Therefore the Lord himself shall give you a sign; Behold, a virgin shall conceive, and bear a son, and shall call his name Immanuel.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Behold, a virgin shall conceive, and bear a son, and shall call His name Immanuel; the gift of the virgin's Son, God with us.", "source": "J.N. Darby, Synopsis of the Books of the Bible, Isaiah 7 (sacred-texts.com)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "He is man, one with us.", "source": "Andrew Murray, The True Vine: The Vine (ccel.org)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "The Lord Jesus came and took on human nature in order to bear the judgment for human nature.", "source": "Watchman Nee, Collected Works, Set 1, Vol. 12: The Spiritual Man (1), ch. 5 (bibleread.online)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Here we have very God joining Himself with very man.", "source": "T. Austin-Sparks, The Centrality and Universality of the Cross, ch. 1 (austin-sparks.net/m/Books-000739.html)"}], "declarations": ["I declare: Immanuel, God with us, has come in the flesh.", "I declare: Christ took my human nature to bear my judgment."], "prayer": "Lord Jesus, my Immanuel, You came and took on human nature for me. God with us, what a wonder. I receive You afresh today.", "theme_flag": "theme-based: Nee"}, {"day": 70, "ref": "Isaiah 9:6", "book": "Isaiah", "chapter": 9, "verse": 6, "text": "For unto us a child is born, unto us a son is given: and the government shall be upon his shoulder: and his name shall be called Wonderful, Counsellor, The mighty God, The everlasting Father, The Prince of Peace.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Unto us a child is born, unto us a Son is given; here is all the brightness of the glory of the divine Person of the Messiah.", "source": "J.N. Darby, Synopsis of the Books of the Bible, Isaiah 9 (sacred-texts.com)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "He who speaks is God, in His infinite power able to enter into us.", "source": "Andrew Murray, The True Vine: The Vine (ccel.org)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "God's way of salvation is in Christ, not in your own self. If you live in Christ, you have everything.", "source": "Watchman Nee, The Secret of Christian Living (goodreads.com/author/quotes/12878.Watchman_Nee)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "He is the Wisdom of God, the Eternal Logos.", "source": "T. Austin-Sparks, The Centrality and Supremacy of the Lord Jesus Christ, ch. 1 (austin-sparks.net/m/Books-000729.html)"}], "declarations": ["I declare: Unto us a Son is given, the mighty God.", "I declare: In Christ I have everything I need."], "prayer": "Lord Jesus, my Wonderful Counsellor, my mighty God, my Prince of Peace. Unto us You were given. I live in You today, and in You I have everything.", "theme_flag": "theme-based: Murray, theme-based: Nee, theme-based: Sparks"}, {"day": 71, "ref": "Isaiah 9:7", "book": "Isaiah", "chapter": 9, "verse": 7, "text": "Of the increase of his government and peace there shall be no end, upon the throne of David, and upon his kingdom, to order it, and to establish it with judgment and with justice from henceforth even for ever. The zeal of the LORD of hosts will perform this.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Of the increase of His government there shall be no end; the divine Person of the Messiah reigns forever in peace.", "source": "J.N. Darby, Synopsis of the Books of the Bible, Isaiah 9 (sacred-texts.com)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "The Kingdom and the Power and the Glory are ever one: Unto Him that sitteth on the Throne, and to the Lamb in the midst of the Throne, be the Glory and the Dominion for ever.", "source": "Andrew Murray, The Spirit of Christ, Day 11 (biblestudytools.com)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "It is a fact that the kingdom of heaven will come; it is a fact that the Lord is King.", "source": "Watchman Nee, The Glorious Church (goodreads.com/author/quotes/12878.Watchman_Nee)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "The message of the gospel to the nations is the message of the Crown Rights of God's Son. He is Lord of all.", "source": "T. Austin-Sparks, Vocational Fellowship, ch. 4 (austin-sparks.net/english/books/004362.html)"}], "declarations": ["I declare: Christ's government and peace shall have no end.", "I declare: He is Lord of all, and His kingdom comes."], "prayer": "Lord Jesus, my King, of Your government there shall be no end. I bow to Your crown rights over my life. Come, Lord, and reign in me today.", "theme_flag": null}, {"day": 72, "ref": "Isaiah 11:1", "book": "Isaiah", "chapter": 11, "verse": 1, "text": "And there shall come forth a rod out of the stem of Jesse, and a Branch shall grow out of his roots:", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "A rod out of the stem of Jesse, and a Branch shall grow out of his roots; here is the Messiah and His reign.", "source": "J.N. Darby, Synopsis of the Books of the Bible, Isaiah 11 (sacred-texts.com)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "If you would know Jesus, study the vine.", "source": "Andrew Murray, The True Vine: The Vine (ccel.org)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "As long as you are in Christ, what you are in yourself does not count.", "source": "Watchman Nee, The Secret of Christian Living (goodreads.com/author/quotes/12878.Watchman_Nee)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "For you therefore that believe is the preciousness.", "source": "T. Austin-Sparks, Features of Zion, ch. 4 (austin-sparks.net/m/Books-002135.html)"}], "declarations": ["I declare: Christ is the Branch from Jesse, beautiful and glorious.", "I declare: In Him, what I am in myself does not count."], "prayer": "Lord Jesus, my Branch from Jesse, how precious You are to all who believe. I am in You, and that is enough. Grow Your life in me today.", "theme_flag": "theme-based: Murray, theme-based: Nee, theme-based: Sparks"}, {"day": 73, "ref": "Isaiah 11:10", "book": "Isaiah", "chapter": 11, "verse": 10, "text": "¶ And in that day there shall be a root of Jesse, which shall stand for an ensign of the people; to it shall the Gentiles seek: and his rest shall be glorious.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "A root of Jesse shall stand for an ensign of the people; here is the Messiah and His reign drawing the nations.", "source": "J.N. Darby, Synopsis of the Books of the Bible, Isaiah 11 (sacred-texts.com)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Our continuous abiding in the Vine is to be an abiding in His love.", "source": "Andrew Murray, The True Vine: Abide in My Love (ccel.org)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Do we impress people with ourselves, or with the Lord? Do we draw people to our teaching, or to the Lord?", "source": "Watchman Nee, The Release of the Spirit (goodreads.com/author/quotes/12878.Watchman_Nee)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Christ makes these things far more than abstractions, He makes them personal.", "source": "T. Austin-Sparks, The Centrality and Universality of the Cross, ch. 1 (austin-sparks.net/m/Books-000739.html)"}], "declarations": ["I declare: Christ stands as an ensign, and the Gentiles seek Him.", "I declare: I draw men not to myself, but to the Lord."], "prayer": "Lord Jesus, my Ensign, to You the nations seek. Make me a pointer to You, not to myself. Draw many to Yourself through my life today.", "theme_flag": "theme-based: Murray, theme-based: Nee, theme-based: Sparks"}, {"day": 74, "ref": "Isaiah 40:3", "book": "Isaiah", "chapter": 40, "verse": 3, "text": "¶ The voice of him that crieth in the wilderness, Prepare ye the way of the LORD, make straight in the desert a highway for our God.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "The voice of him that crieth in the wilderness; the herald proclaims the coming of Jehovah.", "source": "J.N. Darby, Synopsis of the Books of the Bible, Isaiah 40 (sacred-texts.com)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Bow down and be still, worship and wait, until the divine Word enters your heart.", "source": "Andrew Murray, The True Vine: The Vine (ccel.org)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "The way of salvation for us was not in God making us good but in His saving us out of Adam and putting us in Christ.", "source": "Watchman Nee, The Messenger of the Cross (goodreads.com/author/quotes/12878.Watchman_Nee)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "The Cross is the way to the glory. The glory will justify the Cross.", "source": "T. Austin-Sparks, Horizoned by Christ, ch. 2 (austin-sparks.net/english/books/001882.html)"}], "declarations": ["I declare: Prepare the way of the LORD; He is coming.", "I declare: I make straight a highway for my God in my heart."], "prayer": "Lord Jesus, I prepare the way for You in my heart. I bow down, I worship, I wait. Come and enter in; make Your highway straight in me today.", "theme_flag": "theme-based: Murray, theme-based: Nee, theme-based: Sparks"}, {"day": 75, "ref": "Isaiah 40:11", "book": "Isaiah", "chapter": 40, "verse": 11, "text": "He shall feed his flock like a shepherd: he shall gather the lambs with his arm, and carry them in his bosom, and shall gently lead those that are with young.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "He shall feed His flock like a shepherd; here is the Saviour, whose tender care is described in a touching manner.", "source": "J.N. Darby, Synopsis of the Books of the Bible, Isaiah 40 (sacred-texts.com)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "He is all love. He loves to give. He gives love.", "source": "Andrew Murray, The True Vine: Love One Another (ccel.org)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "It is the Lamb who shepherds; it is Jesus Christ, the Son of God, who feeds the lambs.", "source": "Watchman Nee, Collected Works, Set 2, Vol. 37: General Messages (1), ch. 3 (bibleread.online)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "When Israel is lost another Shepherd comes and has another flock.", "source": "T. Austin-Sparks, The Mission, the Meaning and the Message of Jesus Christ, ch. 3 (austin-sparks.net/m/Books-000946.html)"}], "declarations": ["I declare: Christ my Shepherd feeds me and carries me.", "I declare: He gathers me in His arms and gently leads me."], "prayer": "Lord Jesus, my good Shepherd, feed me today. Gather me with Your arm and carry me in Your bosom. I am Your lamb; lead me gently.", "theme_flag": "theme-based: Murray, theme-based: Sparks"}, {"day": 76, "ref": "Isaiah 42:1", "book": "Isaiah", "chapter": 42, "verse": 1, "text": "Behold my servant, whom I uphold; mine elect, in whom my soul delighteth; I have put my spirit upon him: he shall bring forth judgment to the Gentiles.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Behold My Servant, Mine elect, in whom My soul delighteth; a Servant of God, His elect; He shall not fail nor be discouraged.", "source": "J.N. Darby, Synopsis of the Books of the Bible, Isaiah 42 (sacred-texts.com)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "He was the Servant of God, and the servant of men.", "source": "Andrew Murray, Humility, ch. 3 (worthychristianbooks.com)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Those whom the Lord uses are the ones who know the Lord's cup and the Lord's baptism.", "source": "Watchman Nee, Spiritual Authority (goodreads.com/author/quotes/12878.Watchman_Nee)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "There was no self in Him.", "source": "T. Austin-Sparks, The Centrality and Universality of the Cross, ch. 1 (austin-sparks.net/m/Books-000739.html)"}], "declarations": ["I declare: Christ is God's Servant, upheld and delighted in.", "I declare: I follow the Servant who had no self in Him."], "prayer": "Lord Jesus, God's elect Servant, You did not fail nor were discouraged. Teach me to serve as You served, with no self in me. I delight to follow You.", "theme_flag": "theme-based: Murray, theme-based: Nee, theme-based: Sparks"}, {"day": 77, "ref": "Isaiah 49:6", "book": "Isaiah", "chapter": 49, "verse": 6, "text": "And he said, It is a light thing that thou shouldest be my servant to raise up the tribes of Jacob, and to restore the preserved of Israel: I will also give thee for a light to the Gentiles, that thou mayest be my salvation unto the end of the earth.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "I will give Thee for a light to the Gentiles; He shall be the salvation of Jehovah unto the ends of the earth.", "source": "J.N. Darby, Synopsis of the Books of the Bible, Isaiah 49 (sacred-texts.com)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "They all point to Him, and preach Him, and reveal Him.", "source": "Andrew Murray, The True Vine: The Vine (ccel.org)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "God has made Jesus Christ the light of the Gentiles.", "source": "Watchman Nee, Collected Works, Set 2, Vol. 37: General Messages (1), ch. 3 (bibleread.online)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "The history of God's specific movements is the bringing back to the primal fullness with which He filled His Son.", "source": "T. Austin-Sparks (deeperchristianquotes.com/author/dcq-taustinsparks/)"}], "declarations": ["I declare: Christ is the light to the Gentiles.", "I declare: He is God's salvation to the ends of the earth."], "prayer": "Lord Jesus, Light to the Gentiles, shine through me today. You are God's salvation to the ends of the earth. Use me to point men to You.", "theme_flag": "theme-based: Murray, theme-based: Sparks"}, {"day": 78, "ref": "Isaiah 50:6", "book": "Isaiah", "chapter": 50, "verse": 6, "text": "I gave my back to the smiters, and my cheeks to them that plucked off the hair: I hid not my face from shame and spitting.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "I gave My back to the smiters; He comes as man in humiliation. Given up to shame, God justifies Him.", "source": "J.N. Darby, Synopsis of the Books of the Bible, Isaiah 50 (sacred-texts.com)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "He surrendered Himself to whatever men around might say of Him, or do to Him.", "source": "Andrew Murray, Humility, ch. 3 (worthychristianbooks.com)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Our spirit is released according to the degree of our brokenness.", "source": "Watchman Nee, The Release of the Spirit (goodreads.com/author/quotes/12878.Watchman_Nee)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "The pure ground of utter selflessness was maintained at greatest cost and through most fiery trial.", "source": "T. Austin-Sparks, The Centrality and Universality of the Cross, ch. 1 (austin-sparks.net/m/Books-000739.html)"}], "declarations": ["I declare: Christ gave His back to the smiters for me.", "I declare: I follow the selfless One who bore shame."], "prayer": "Lord Jesus, You gave Your back to the smiters and hid not Your face from shame. You were selfless to the uttermost. Teach me Your meekness today.", "theme_flag": "theme-based: Murray, theme-based: Nee"}, {"day": 79, "ref": "Isaiah 53:1", "book": "Isaiah", "chapter": 53, "verse": 1, "text": "Who hath believed our report? and to whom is the arm of the LORD revealed?", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Who hath believed our report? The arm of the LORD is revealed in the rejected Servant.", "source": "J.N. Darby, Synopsis of the Books of the Bible, Isaiah 53 (sacred-texts.com)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "The hidden spiritual mystery of the Vine in His divine omnipotence and nearness they do not know, because they have not waited on God's Spirit to reveal it to them.", "source": "Andrew Murray, The True Vine (ccel.org)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Every true spiritual experience means that we have discovered a certain fact in Christ and have entered into that.", "source": "Watchman Nee, The Normal Christian Life (goodreads.com/author/quotes/12878.Watchman_Nee)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "It will be the Cross which discloses Who Jesus is.", "source": "T. Austin-Sparks, The Centrality and Universality of the Cross, ch. 1 (austin-sparks.net/m/Books-000739.html)"}], "declarations": ["I declare: I believe the report of Christ crucified.", "I declare: The Cross discloses who Jesus is to me."], "prayer": "Lord Jesus, I believe the report. Reveal Yourself to me by Your Spirit. Let the Cross disclose who You are to my heart today.", "theme_flag": "theme-based: Murray, theme-based: Nee"}, {"day": 80, "ref": "Isaiah 53:2", "book": "Isaiah", "chapter": 53, "verse": 2, "text": "For he shall grow up before him as a tender plant, and as a root out of a dry ground: he hath no form nor comeliness; and when we shall see him, there is no beauty that we should desire him.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "A tender plant, a root out of dry ground; no form nor comeliness, yet the Holy One of God.", "source": "J.N. Darby, Synopsis of the Books of the Bible, Isaiah 53 (theme-based)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Without form or comeliness He enters in, and, when thought and feeling fail, the Holy Spirit glorifies Him to the faith that sees not.", "source": "Andrew Murray, The Spirit of Christ, Day 11 (biblestudytools.com)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "I must first have the sense of God's possession of me before I can have the sense of His presence with me.", "source": "Watchman Nee, The Normal Christian Life (goodreads.com/author/quotes/12878.Watchman_Nee)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "The Person of our Lord cannot really be known and understood apart from the Cross.", "source": "T. Austin-Sparks, The Centrality and Universality of the Cross, ch. 1 (austin-sparks.net/m/Books-000739.html)"}], "declarations": ["I declare: Christ had no beauty that men should desire Him, yet He is my God.", "I declare: I know Him not by outward form but by the Spirit."], "prayer": "Lord Jesus, You came as a tender plant with no comeliness, yet You are my God. Open my eyes to see Your true beauty. I receive You by faith, not by sight.", "theme_flag": "theme-based: Darby, theme-based: Nee, theme-based: Sparks"}, {"day": 81, "ref": "Isaiah 53:3", "book": "Isaiah", "chapter": 53, "verse": 3, "text": "He is despised and rejected of men; a man of sorrows, and acquainted with grief: and we hid as it were our faces from him; he was despised, and we esteemed him not.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "He is despised and rejected of men; a man of sorrows, and acquainted with grief.", "source": "J.N. Darby, Synopsis of the Books of the Bible, Isaiah 53 (sacred-texts.com)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "He never asserted His power to vindicate Himself.", "source": "Andrew Murray, Humility, ch. 3 (worthychristianbooks.com)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Nevertheless, He endured the cross, despising the shame.", "source": "Watchman Nee, Collected Works, Set 1, Vol. 12: The Spiritual Man (1), ch. 5 (bibleread.online)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "In the days of His earthly life His disciples and the people wanted a Crossless Christ.", "source": "T. Austin-Sparks, The Centrality and Universality of the Cross, ch. 1 (austin-sparks.net/m/Books-000739.html)"}], "declarations": ["I declare: Christ was despised and rejected, yet He did not vindicate Himself.", "I declare: I esteem Him who was not esteemed."], "prayer": "Lord Jesus, Man of Sorrows, despised and rejected, You never vindicated Yourself. I esteem You above all. Teach me Your humility today.", "theme_flag": "theme-based: Murray, theme-based: Nee, theme-based: Sparks"}, {"day": 82, "ref": "Isaiah 53:4", "book": "Isaiah", "chapter": 53, "verse": 4, "text": "¶ Surely he hath borne our griefs, and carried our sorrows: yet we did esteem him stricken, smitten of God, and afflicted.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Surely He hath borne our griefs, and carried our sorrows; yet we did esteem Him stricken of God.", "source": "J.N. Darby, Synopsis of the Books of the Bible, Isaiah 53 (sacred-texts.com)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Standing in the place of me a guilty sinner, Thou hast borne my sins in Thy body on the cross.", "source": "Andrew Murray, Like Christ, ch. 4: Our Head (bible.prayerrequest.com)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Because He bore the curse and the shame of the cross, all who believe in Him no longer need to bear the curse and the shame.", "source": "Watchman Nee, Collected Works, Set 1, Vol. 12: The Spiritual Man (1), ch. 5 (bibleread.online)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "For one terrible, eternal hour Christ was separated from, lost union with, His God.", "source": "T. Austin-Sparks, The Centrality and Universality of the Cross, ch. 1 (austin-sparks.net/m/Books-000739.html)"}], "declarations": ["I declare: Christ bore my griefs and carried my sorrows.", "I declare: I no longer bear the curse, for He bore it."], "prayer": "Lord Jesus, You bore my griefs and carried my sorrows. You were separated from God that I might be brought near. Thank You for bearing it all.", "theme_flag": "theme-based: Nee, theme-based: Sparks"}, {"day": 83, "ref": "Isaiah 53:5", "book": "Isaiah", "chapter": 53, "verse": 5, "text": "But he was wounded for our transgressions, he was bruised for our iniquities: the chastisement of our peace was upon him; and with his stripes we are healed.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "He was wounded for our transgressions, He was bruised for our iniquities; by His stripes we are healed.", "source": "J.N. Darby, Synopsis of the Books of the Bible, Isaiah 53 (sacred-texts.com)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "As Surety, Christ suffered and died in our stead. He bore our sin, and broke at once its curse and power.", "source": "Andrew Murray, Like Christ, ch. 4: Our Head (bible.prayerrequest.com)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "I know that the blood has satisfied Thee; so the blood is enough for me, and it is my only plea.", "source": "Watchman Nee, The Normal Christian Life (goodreads.com/author/quotes/12878.Watchman_Nee)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "He Who knew no sin had to be made sin in our room.", "source": "T. Austin-Sparks, The Centrality and Universality of the Cross, ch. 1 (austin-sparks.net/m/Books-000739.html)"}], "declarations": ["I declare: By His stripes I am healed.", "I declare: His blood is my only plea."], "prayer": "Lord Jesus, wounded for my transgressions, bruised for my iniquities, by Your stripes I am healed. Your blood is enough for me. I plead it today.", "theme_flag": "theme-based: Nee"}, {"day": 84, "ref": "Isaiah 53:6", "book": "Isaiah", "chapter": 53, "verse": 6, "text": "All we like sheep have gone astray; we have turned every one to his own way; and the LORD hath laid on him the iniquity of us all.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "All we like sheep have gone astray; we have turned every one to his own way, and the LORD hath laid on Him the iniquity of us all.", "source": "J.N. Darby, Synopsis of the Books of the Bible, Isaiah 53 (theme-based)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Who His own self bare our sins in His own body on the tree.", "source": "Andrew Murray, Like Christ, ch. 4: Our Head (citing 1 Pet. 2:24; bible.prayerrequest.com)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Man's way is to try to suppress sin by seeking to overcome it; God's way is to remove the sinner.", "source": "Watchman Nee, The Normal Christian Life (goodreads.com/author/quotes/12878.Watchman_Nee)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Thus in the Cross all the cause and nature of separation from God was destroyed.", "source": "T. Austin-Sparks, The Centrality and Universality of the Cross, ch. 1 (austin-sparks.net/m/Books-000739.html)"}], "declarations": ["I declare: I had gone astray, but the LORD laid my iniquity on Christ.", "I declare: In the Cross, my separation from God is destroyed."], "prayer": "Lord Jesus, I had turned to my own way, but the Father laid my iniquity on You. Thank You for bearing it on the tree. I return to You, my Shepherd.", "theme_flag": "theme-based: Darby, theme-based: Nee, theme-based: Sparks"}, {"day": 85, "ref": "Isaiah 53:7", "book": "Isaiah", "chapter": 53, "verse": 7, "text": "He was oppressed, and he was afflicted, yet he opened not his mouth: he is brought as a lamb to the slaughter, and as a sheep before her shearers is dumb, so he openeth not his mouth.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "He was oppressed, yet He opened not His mouth; as a lamb to the slaughter, in meek silence He submits.", "source": "J.N. Darby, Synopsis of the Books of the Bible, Isaiah 53 (theme-based)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "A life yielded to God to work in.", "source": "Andrew Murray, Humility, ch. 3 (worthychristianbooks.com)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "We dare not speak except in conscious and continual dependence on Him.", "source": "Watchman Nee, Sit, Walk, Stand (goodreads.com/author/quotes/12878.Watchman_Nee)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "The marvel, He opened not His mouth. He opened not His mouth! Not a word!", "source": "T. Austin-Sparks, Vocational Fellowship, ch. 4 (austin-sparks.net/english/books/004362.html)"}], "declarations": ["I declare: Christ opened not His mouth; He was silent as a lamb.", "I declare: I yield my life to God and speak only in dependence on Him."], "prayer": "Lord Jesus, silent Lamb, You opened not Your mouth. Teach me when to speak and when to be silent. I yield my life to God today.", "theme_flag": "theme-based: Darby, theme-based: Murray, theme-based: Nee"}, {"day": 86, "ref": "Isaiah 53:8", "book": "Isaiah", "chapter": 53, "verse": 8, "text": "He was taken from prison and from judgment: and who shall declare his generation? for he was cut off out of the land of the living: for the transgression of my people was he stricken.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "He was taken from prison and from judgment; cut off out of the land of the living for the transgression of His people.", "source": "J.N. Darby, Synopsis of the Books of the Bible, Isaiah 53 (theme-based)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Greater love hath no man than this, that a man lay down His life for His friends.", "source": "Andrew Murray, The True Vine (citing John 15:13; ccel.org)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "God dares to put His greatest ambassadors in chains.", "source": "Watchman Nee, The Normal Christian Life (goodreads.com/author/quotes/12878.Watchman_Nee)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "He overcame and destroyed the causes, the ground, the strength and the originator of death.", "source": "T. Austin-Sparks, The Centrality and Universality of the Cross, ch. 1 (austin-sparks.net/m/Books-000739.html)"}], "declarations": ["I declare: Christ was cut off for my transgression.", "I declare: He destroyed death and its power forever."], "prayer": "Lord Jesus, You were taken from judgment and cut off for me. Greater love has no man. You destroyed death itself. I live because You died.", "theme_flag": "theme-based: Darby, theme-based: Murray, theme-based: Nee, theme-based: Sparks"}, {"day": 87, "ref": "Isaiah 53:9", "book": "Isaiah", "chapter": 53, "verse": 9, "text": "And he made his grave with the wicked, and with the rich in his death; because he had done no violence, neither was any deceit in his mouth.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "He made His grave with the wicked, and with the rich in His death; the Holy One numbered with transgressors.", "source": "J.N. Darby, Synopsis of the Books of the Bible, Isaiah 53 (theme-based)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "He gave Himself to death; He lost Himself, that we might find life in Him.", "source": "Andrew Murray, The True Vine (ccel.org)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Our old history ends with the Cross; our new history begins with the resurrection.", "source": "Watchman Nee, The Normal Christian Life (goodreads.com/author/quotes/12878.Watchman_Nee)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "He tasted death, awful death.", "source": "T. Austin-Sparks, The Centrality and Universality of the Cross, ch. 1 (austin-sparks.net/m/Books-000739.html)"}], "declarations": ["I declare: Christ made His grave with the wicked, yet He was sinless.", "I declare: My old history ends at His Cross; my new begins in His resurrection."], "prayer": "Lord Jesus, You tasted death for me and made Your grave with the wicked. My old life ended at Your Cross. I rise with You into new life today.", "theme_flag": "theme-based: Darby, theme-based: Murray, theme-based: Nee, theme-based: Sparks"}, {"day": 88, "ref": "Isaiah 53:10", "book": "Isaiah", "chapter": 53, "verse": 10, "text": "¶ Yet it pleased the LORD to bruise him; he hath put him to grief: when thou shalt make his soul an offering for sin, he shall see his seed, he shall prolong his days, and the pleasure of the LORD shall prosper in his hand.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "It pleased the LORD to bruise Him; His soul shall be made an offering for sin, and He shall see His seed.", "source": "J.N. Darby, Synopsis of the Books of the Bible, Isaiah 53 (sacred-texts.com)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "He is the crucified One, who won a perfect righteousness and a divine life for us through His death.", "source": "Andrew Murray, The True Vine: The Vine (ccel.org)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Isaiah 53:10 through 12 says three times that He gave up His soul and poured out His soul unto death.", "source": "Watchman Nee, Collected Works, Set 1, Vol. 12: The Spiritual Man (1), ch. 5 (bibleread.online)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "He became sin, that He might destroy sin.", "source": "T. Austin-Sparks, Vocational Fellowship, ch. 4 (austin-sparks.net/english/books/004362.html)"}], "declarations": ["I declare: Christ's soul was made an offering for my sin.", "I declare: He shall see His seed and be satisfied."], "prayer": "Lord Jesus, it pleased the Father to bruise You, and You gave Your soul as an offering for my sin. You became sin to destroy sin. I receive Your perfect righteousness today.", "theme_flag": "theme-based: Murray"}, {"day": 89, "ref": "Isaiah 53:11", "book": "Isaiah", "chapter": 53, "verse": 11, "text": "He shall see of the travail of his soul, and shall be satisfied: by his knowledge shall my righteous servant justify many; for
