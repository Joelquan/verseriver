 he shall bear their iniquities.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "He shall see of the travail of His soul, and shall be satisfied; by His knowledge shall My righteous Servant justify many.", "source": "J.N. Darby, Synopsis of the Books of the Bible, Isaiah 53 (sacred-texts.com)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "These things have I spoken unto you, that My joy may be in you, and that your joy may be fulfilled.", "source": "Andrew Murray, The True Vine: Joy (citing John 15:11; ccel.org)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "She is doing this for Me. Real satisfaction is brought to the heart of God only when we are really, as people would think, wasting ourselves upon him.", "source": "Watchman Nee, The Normal Christian Life (goodreads.com/author/quotes/12878.Watchman_Nee)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "In Christ God has His perfect satisfaction, and has therefore committed Himself to Him.", "source": "T. Austin-Sparks, The Centrality and Universality of the Cross, ch. 1 (austin-sparks.net/m/Books-000739.html)"}], "declarations": ["I declare: Christ sees the travail of His soul and is satisfied.", "I declare: By His knowledge I am justified."], "prayer": "Lord Jesus, You see the travail of Your soul and are satisfied. By Your knowledge I am justified. Fill me with Your joy today, that my joy may be full.", "theme_flag": "theme-based: Murray, theme-based: Nee"}, {"day": 90, "ref": "Isaiah 53:12", "book": "Isaiah", "chapter": 53, "verse": 12, "text": "Therefore will I divide him a portion with the great, and he shall divide the spoil with the strong; because he hath poured out his soul unto death: and he was numbered with the transgressors; and he bare the sin of many, and made intercession for the transgressors.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "He poured out His soul unto death, and was numbered with the transgressors; therefore will I divide Him a portion with the great.", "source": "J.N. Darby, Synopsis of the Books of the Bible, Isaiah 53 (theme-based)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "As surely as He conquered sin and its curse for me, will He conquer it in its power in me.", "source": "Andrew Murray, Like Christ, ch. 4: Our Head (bible.prayerrequest.com)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "He crushed the serpent's head and dealt with the rebellious Satan and all his works on the cross.", "source": "Watchman Nee, The Present Testimony (4), ch. 11 'The Nature of Christ's Victory and the Church' (bibleread.online)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "He became defeated in order that He might triumph. He became dead in order that He might destroy death for ever.", "source": "T. Austin-Sparks, Vocational Fellowship, ch. 4 (austin-sparks.net/english/books/004362.html)"}], "declarations": ["I declare: Christ divides the spoil; He triumphed through defeat.", "I declare: In Him I am victor in the field."], "prayer": "Lord Jesus, You were numbered with transgressors, yet You triumphed and divide the spoil. In You I am victor. I stand in Your triumph today.", "theme_flag": "theme-based: Darby, theme-based: Murray, theme-based: Nee"}, {"day": 91, "ref": "Isaiah 59:20", "book": "Isaiah", "chapter": 59, "verse": 20, "text": "¶ And the Redeemer shall come to Zion, and unto them that turn from transgression in Jacob, saith the LORD.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "The Redeemer shall come to Zion, and unto them that turn from transgression.", "source": "J.N. Darby, Synopsis of the Books of the Bible, Isaiah 59 (sacred-texts.com)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Our Head suffered as a Surety, that in union with us He might bear sin for us.", "source": "Andrew Murray, Like Christ, ch. 4: Our Head (bible.prayerrequest.com)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "He who has ascended the cross and refuses to drink the vinegar mingled with gall is the one who knows the Lord.", "source": "Watchman Nee, The Release of the Spirit (goodreads.com/author/quotes/12878.Watchman_Nee)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "There is no situation so hopeless as to make it impossible for the glory of God to break in.", "source": "T. Austin-Sparks (deeperchristianquotes.com/author/dcq-taustinsparks/)"}], "declarations": ["I declare: The Redeemer has come to Zion.", "I declare: He turns me from transgression by His glory."], "prayer": "Lord Jesus, my Redeemer, You came to Zion for those who turn from sin. I turn to You today. Break into my hopeless places with Your glory.", "theme_flag": "theme-based: Murray, theme-based: Nee, theme-based: Sparks"}, {"day": 92, "ref": "Isaiah 61:1", "book": "Isaiah", "chapter": 61, "verse": 1, "text": "The Spirit of the Lord GOD is upon me; because the LORD hath anointed me to preach good tidings unto the meek; he hath sent me to bind up the brokenhearted, to proclaim liberty to the captives, and the opening of the prison to them that are bound;", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "The Spirit of the Lord GOD is upon Me; here chapter 61 exhibits Him in the full grace of His Person, anointed to preach.", "source": "J.N. Darby, Synopsis of the Books of the Bible, Isaiah 61 (sacred-texts.com)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "He makes Christ glorious to us and in us, and through us in them who have eyes to see.", "source": "Andrew Murray, The Spirit of Christ, Day 11 (biblestudytools.com)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "The Spirit is both a builder and a dweller. He cannot dwell where he has not built.", "source": "Watchman Nee, The Spiritual Man (goodreads.com/author/quotes/12878.Watchman_Nee)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "The mark of a life governed by the Holy Spirit is that such a life is continually and ever more and more occupied with Christ.", "source": "T. Austin-Sparks (deeperchristianquotes.com/author/dcq-taustinsparks/)"}], "declarations": ["I declare: The Spirit of the Lord is upon Christ, anointed to preach.", "I declare: I am occupied with Christ by the Holy Spirit."], "prayer": "Lord Jesus, anointed by the Spirit to preach good tidings, make Yourself glorious in me today. Let my life be continually occupied with You.", "theme_flag": "theme-based: Nee"}, {"day": 93, "ref": "Isaiah 61:2", "book": "Isaiah", "chapter": 61, "verse": 2, "text": "To proclaim the acceptable year of the LORD, and the day of vengeance of our God; to comfort all that mourn;", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "To proclaim the acceptable year of the LORD; the Lord stopped in the midst of verse 2, for the day of vengeance was not yet.", "source": "J.N. Darby, Synopsis of the Books of the Bible, Isaiah 61 (sacred-texts.com)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "He comes down as the Spirit of Glory, and reveals the glory of Christ in us by dwelling and working in us.", "source": "Andrew Murray, The Spirit of Christ, Day 11 (biblestudytools.com)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "His hand and His word not only comforted John but also gave strength.", "source": "Watchman Nee, Come, Lord Jesus (goodreads.com/author/quotes/12878.Watchman_Nee)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "By revelation of the Holy Spirit He was pleased to make known the mystery.", "source": "T. Austin-Sparks, The Centrality and Supremacy of the Lord Jesus Christ, ch. 1 (austin-sparks.net/m/Books-000729.html)"}], "declarations": ["I declare: Christ proclaims the acceptable year of the LORD.", "I declare: The Spirit reveals His glory in me."], "prayer": "Lord Jesus, You proclaim the acceptable year of the Lord. This is the day of grace. Reveal Your glory in me by Your Spirit today. Comfort and strengthen me.", "theme_flag": "theme-based: Nee, theme-based: Sparks"}, {"day": 94, "ref": "Jeremiah 23:5", "book": "Jeremiah", "chapter": 23, "verse": 5, "text": "¶ Behold, the days come, saith the LORD, that I will raise unto David a righteous Branch, and a King shall reign and prosper, and shall execute judgment and justice in the earth.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "The judgment of Zedekiah had been pronounced (Jer. 21); and after having declared, as we have seen, that the door was always open to repentance, and that blessing always attended a godly walk (Jer. 21:12; Jer. 22:1-5), judgment is again pronounced, and a sentence from God upon the different kings. Finally (Jer. 23) the expression of Jehovah's indignation against these evil pastors gives rise to the declaration that He will raise up a Shepherd after His own heart, namely, the true Son of David, the Messiah. The just indignation and the judgment of God are expressed in the strongest terms.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "His Son. Righteousness and peace are mentioned together both in the Old Testament and in the New as characteristic blessings of the kingdom of Christ. Righteousness as the only foundation of peace : peace as its sure and blessed result. The kingdom of God is righteousness and peace, and, as the sure fruit of these, joy in the Holy Ghost Melchizedek was priest and king — a thing unknown in all the history of Israel. What was always kept asunder in God's people had, by the divine forethought, been united in Him who had been made like unto the Son of God. It is the glory of Christ as the Priest-King that our Epistle is specially to unfold.", "source": "The Holiest of All, Melchizedek Made Like Unto the Son of God"}, {"name": "Watchman Nee", "short": "Nee", "comment": "May our Lord Jesus soon return to reign. Amen.", "source": "The Spiritual Man (1)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Nathanael answered him, TEACHER, thou art the Son of God, thou art King of Israel.", "source": "The School of Christ"}], "declarations": ["I declare: Jesus Christ is my righteous King, and He reigns over my life today.", "I declare: The true Son of David shepherds me, and I follow Him."], "prayer": "Lord Jesus, You are the righteous Branch and my King. Rule in my heart today and lead me as Your sheep. Amen.", "theme_flag": "theme-based: Murray, Nee, Sparks"}, {"day": 95, "ref": "Jeremiah 23:6", "book": "Jeremiah", "chapter": 23, "verse": 6, "text": "In his days Judah shall be saved, and Israel shall dwell safely: and this is his name whereby he shall be called, THE LORD OUR RIGHTEOUSNESS.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Judah shall be saved and Jerusalem shall dwell safely. Her name shall be \"Jehovah our Righteousness.\" David shall never want a man to sit upon the throne of the house of Israel (not merely Judah), nor the tribe of Levi a priest. The Lord's covenant with the heavens and the earth shall fail, before this covenant with David shall be broken. However deeply sunk in despair the people might be, the Lord would never cast off Jacob, or His servant David, but would cause their captivity to return and would have mercy on them.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "V. mary.) ‘ AUL, unto the Church of God which is at Corinth, to them that are sanctified in Christ Jesus, called to be saints; ’—thus the chapter opens in which we are taught that Christ is our sanctifica- tion. In the Old Testament, believers were called the righteous; in the New Testament they are called saints, the holy ones, sanctified in Christ Jesus. Holy is higher than righteous. Holy in God has reference to His inmost being; righteous, to His dealings with His creatures. In man, righteousness is but a stepping-stone to holiness. It is in this he can approach most near to the perfection of God (comp.", "source": "Abide in Christ, As Your Righteousness"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Similarly the obedience of one man, Christ, becomes the righteousness of many.", "source": "The Spiritual Man, Calvary's Judgment"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Christ is our Righteousness. 1 Cor. 1:30; Eph. 4:24; Phil. 3:9.", "source": "In Christ"}], "declarations": ["I declare: The LORD is my righteousness, and I stand accepted in Christ.", "I declare: I am clothed in the righteousness of Jesus today."], "prayer": "Lord Jesus, You are Jehovah my Righteousness. I rest in what You have done for me, not in my own works. Amen.", "theme_flag": "theme-based: Darby, Murray, Nee, Sparks"}, {"day": 96, "ref": "Jeremiah 29:11", "book": "Jeremiah", "chapter": 29, "verse": 11, "text": "For I know the thoughts that I think toward you, saith the LORD, thoughts of peace, and not of evil, to give you an expected end.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "On the other hand the prophet comforts those who, by the judgment of God, were subjected to the yoke which He had imposed upon them. The Jews in Babylon should dwell in peace, quietly seeking the welfare of the city in which they were captives. The time of deliverance should come. The spirit of rebellion should be punished. Finally, having insisted on the people's submission to the judgment, God reveals His own thoughts of grace. This submission was necessary, because of Israel's sin; for God must maintain His own character, and not identify Himself with the ways of a rebellious people.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "“In quietness and in confidence shall be your strength.” Such words reveal to us the close connection between quiet- ness and faith, and show us what a deep need there is of quietness, as an element of true waiting upon God. If we are to have our whole heart turned toward God, we must have it turned away from the creature, from all that occupies and interests, whether of joy or sorrow. God is a being of such infinite greatness and glory, and our nature has become so estranged from Him, that it needs our whole heart and desires set upon Him, even in some little meas- ure to know and receive Him.", "source": "Waiting on God, Day 25"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Such a hope separates him from earthly matters while joining him to the heavenly.", "source": "The Spiritual Man, A Spirit of Rapture"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "The hope of eternal life which God, who cannot lie, promised before times eternal. Titus 1:2.", "source": "The Battle for Life"}], "declarations": ["I declare: God thinks thoughts of peace toward me, and my future is secure in Christ.", "I declare: I have a living hope, and I will not fear what tomorrow brings."], "prayer": "Lord Jesus, I trust Your good plans for my life. Fill my heart with Your peace and Your hope today. Amen.", "theme_flag": "theme-based: Murray, Nee, Sparks"}, {"day": 97, "ref": "Jeremiah 33:3", "book": "Jeremiah", "chapter": 33, "verse": 3, "text": "Call unto me, and I will answer thee, and shew thee great and mighty things, which thou knowest not.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Judah shall be saved and Jerusalem shall dwell safely. Her name shall be \"Jehovah our Righteousness.\" David shall never want a man to sit upon the throne of the house of Israel (not merely Judah), nor the tribe of Levi a priest. The Lord's covenant with the heavens and the earth shall fail, before this covenant with David shall be broken. However deeply sunk in despair the people might be, the Lord would never cast off Jacob, or His servant David, but would cause their captivity to return and would have mercy on them.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Although you are cold, dark, sinful; although it is doubtful whether you can pray at all; come, because the Father is there, and there looks upon you. Set yourself beneath the light of his eye. Believe in His tender fatherly love, and out of this faith prayer will be born. (Matt. 6:8; 7:11) Count certainly upon an answer: that is the third point in the word of Jesus. Your Father will recompense you openly.' There is nothing about which the Lord Jesus has spoken so positively as the certainty of an answer to prayer. Pray, review the promises.", "source": "The New Life, Prayer"}, {"name": "Watchman Nee", "short": "Nee", "comment": "The more you want an answer to prayer from God, the more you desire to be clear with Him.", "source": "Sit, Walk, Stand"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Jesus answered and said unto him, Before Philip called thee, when thou wast under the fig tree, I saw thee.", "source": "The School of Christ"}], "declarations": ["I declare: When I call on the Lord, He answers me and shows me great things.", "I declare: My God never casts me off; He hears my cry."], "prayer": "Lord Jesus, I call on You today. Answer me and show me the great and mighty things You have prepared. Amen.", "theme_flag": "theme-based: Darby, Nee, Sparks"}, {"day": 98, "ref": "Jeremiah 33:15", "book": "Jeremiah", "chapter": 33, "verse": 15, "text": "¶ In those days, and at that time, will I cause the Branch of righteousness to grow up unto David; and he shall execute judgment and righteousness in the land.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Jeremiah 33 repeats with ample and rich abundance the testimony to these blessings, and dwells particularly on the presence of the Messiah; it announces that the branch of righteousness shall grow up unto David, executing judgment and righteousness in the land. Judah shall be saved and Jerusalem shall dwell safely. Her name shall be \"Jehovah our Righteousness.\" David shall never want a man to sit upon the throne of the house of Israel (not merely Judah), nor the tribe of Levi a priest. The Lord's covenant with the heavens and the earth shall fail, before this covenant with David shall be broken.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Jesus says: \"My Father is the husbandman.\" He was \"the vine of God's planting.\" All He was and did, He owed to the Father; in all He only sought the Father's will and glory. He had become man to show us what a creature ought to be to its Creator. He took our place, and the spirit of His life before the Father was ever what He seeks to make ours: \"Of him, and through him, and to him are all things.\" He became the true Vine, that we might be true branches. Both in regard to Christ and ourselves the words teach us the two lessons of absolute dependence and perfect confidence.", "source": "The True Vine"}, {"name": "Watchman Nee", "short": "Nee", "comment": "He is the vine and we the branches.", "source": "The Spiritual Man (3)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "What is true of the Vine must be true of the branches.", "source": "In Christ"}], "declarations": ["I declare: Jesus is the righteous Branch, and I am joined to Him by faith.", "I declare: I depend on Christ completely, and His life flows through me."], "prayer": "Lord Jesus, righteous Branch of David, grow Your life in me today. Keep me abiding in You. Amen.", "theme_flag": "theme-based: Murray, Nee, Sparks"}, {"day": 99, "ref": "Lamentations 3:22", "book": "Lamentations", "chapter": 3, "verse": 22, "text": "¶ It is of the LORD’s mercies that we are not consumed, because his compassions fail not.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "The prophet speaks as having borne in his own heart the deep grief of that which Jehovah had brought upon Jerusalem; but feeling it as one who knew God to be his God, so that he could experience what it was to be the object of the wrath of God. He suffered with Jerusalem, and he suffered for Jerusalem. But the truth of this relation with Jehovah, while making him feel the affliction more deeply, sustained him also (v. 22). He begins to feel that, after all, it is better to have to do with Jehovah, although, in another point of view, this made it all the more painful.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "As a saint, let God's love overwhelm you, and bow you still lower down. Sink down before Him in humility, meekness, patience, and surrender to His goodness and mercy. He will exalt you. Oh! Take time, to get very low before God. 4. Then accept and value your place in Christ Jesus. God delights in nothing but His beloved Son, and can be satisfied with nothing else in those who draw nigh to Him. Enter deep into God's holy presence in the boldness which the blood gives, and in the assurance that in Christ you are most well pleasing. In Christ you are within the veil. You have access into the very heart and love of the Father.", "source": "The Deeper Christian Life"}, {"name": "Watchman Nee", "short": "Nee", "comment": "I beseech you therefore, brethren, by the mercies of God, to present your bodies a living sacrifice.", "source": "The Normal Christian Life"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "The graciousness of Divine love, compassion, tenderness, considerateness, humility, etc., are the glory of God.", "source": "In Christ"}], "declarations": ["I declare: The mercies of the Lord never fail me; they hold me up every day.", "I declare: I am not consumed, because His compassion sustains me."], "prayer": "Lord Jesus, I thank You for Your unfailing mercies. Sustain me today by Your compassion. Amen.", "theme_flag": "theme-based: Murray, Nee, Sparks"}, {"day": 100, "ref": "Lamentations 3:23", "book": "Lamentations", "chapter": 3, "verse": 23, "text": "They are new every morning: great is thy faithfulness.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "He does not afflict willingly, but from necessity. Why complain of the chastening of sin? It were better to turn unto Jehovah.* He encourages Israel to do so, and while remembering the affliction of his weeping people, faith is in exercise until Jehovah shall interpose. It is well that an affliction like this should be felt; the only harm is when it is allowed to weaken confidence in the Lord. {* We have here a principle of the deepest interest, and most instructive. I will follow it out with a little more detail. The principles are in the text.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "ERE IS NONE good but God.” “His good- es is in the heavens.” “Oh how great is thy goodness, which thou hast laid up for them that fear thee!” “O taste and see that the Lord is good!” And here is now the true way of entering into and rejoicing in this goodness of God—waiting upon Him. The Lord is good —even His children often do not know it, for they wait not in quietness for Him to reveal it. But to those who persevere in waiting, whose souls do wait, it will come true. One might think that it is just those who have to wait who might doubt it. But this is only when they do not wait, but grow impatient.", "source": "Waiting on God, Day 24, To Know His Goodness"}, {"name": "Watchman Nee", "short": "Nee", "comment": "He requires us to bear Him witness fearlessly, to suffer pain and shame for Him valiantly, to accept loss of all things with courage, and to rely on the Lord's love, wisdom, power and faithfulness with confidence.", "source": "The Spiritual Man, A Spirit of Power"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "These things saith the Amen, the faithful and true witness. Rev. 3:14.", "source": "The School of Christ"}], "declarations": ["I declare: Great is the faithfulness of my God; His mercies are new every morning.", "I declare: I rely on the Lord's faithfulness with full confidence today."], "prayer": "Lord Jesus, faithful and true Witness, I praise You for Your mercies renewed this morning. Keep me trusting You. Amen.", "theme_flag": "theme-based: Murray, Nee, Sparks"}, {"day": 101, "ref": "Ezekiel 34:23", "book": "Ezekiel", "chapter": 34, "verse": 23, "text": "And I will set up one shepherd over them, and he shall feed them, even my servant David; he shall feed them, and he shall be their shepherd.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "He would raise up the true and only shepherd, David (that is, the well-beloved Messiah).", "source": "J. N. Darby, Synopsis of the Books of the Bible, Ezekiel chapter 34 (stempublishing.com)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "He saw the multitude, and was moved with compassion on them, because they were scattered abroad, as sheep having no shepherd.", "source": "Andrew Murray, With Christ in the School of Prayer, Seventh Lesson"}, {"name": "Watchman Nee", "short": "Nee", "comment": "The good shepherd lays down his life for the sheep. John 10:11, 15, 17.", "source": "Watchman Nee, The Spiritual Man, chapter: The Soul Life"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Jesus saith unto him, I am the way, and the truth, and the life. John 14:6.", "source": "T. Austin-Sparks, The School of Christ, Chapter 2, Learning the Truth"}], "declarations": ["I declare: Jesus is my one Shepherd, and I am safe under His care.", "I declare: My Shepherd laid down His life for me; I will follow Him."], "prayer": "Lord Jesus, my Shepherd, lead me today. I trust Your care over my life. Amen.", "theme_flag": "theme-based: Murray, Nee, Sparks"}, {"day": 102, "ref": "Ezekiel 36:26", "book": "Ezekiel", "chapter": 36, "verse": 26, "text": "A new heart also will I give you, and a new spirit will I put within you: and I will take away the stony heart out of your flesh, and I will give you an heart of flesh.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Cleansing them from all their filthiness; taking away the hardness of their hearts, giving them His Spirit.", "source": "J. N. Darby, Synopsis of the Books of the Bible, Ezekiel chapter 36 (stempublishing.com)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "In the new covenant God's first promise is, I will write My law in the heart: a new heart will I give thee.", "source": "Andrew Murray, The Holiest of All, Chapter 55, Jesus, The Surety of A Better Covenant"}, {"name": "Watchman Nee", "short": "Nee", "comment": "A new heart also will I give you, and a new spirit will I put within you. Ezek. 36:26.", "source": "Watchman Nee, The Normal Christian Life, chapter: The Believer's Access to God"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "By our new birth from above we become partakers of the life of God.", "source": "T. Austin-Sparks, In Christ, Chapter 3, In the Likeness of His Resurrection"}], "declarations": ["I declare: God has given me a new heart, and His Spirit lives in me.", "I declare: I am cleansed and made new in Christ today."], "prayer": "Lord Jesus, thank You for my new heart. Fill me afresh with Your Spirit today. Amen.", "theme_flag": "theme-based: Sparks"}, {"day": 103, "ref": "Daniel 3:25", "book": "Daniel", "chapter": 3, "verse": 25, "text": "He answered and said, Lo, I see four men loose, walking in the midst of the fire, and they have no hurt; and the form of the fourth is like the Son of God.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "But this is only to manifest more brightly the power and the faithfulness of God, who comes, even into the midst of the fire, to prove the interest He takes in the fidelity of His servants.", "source": "J. N. Darby, Synopsis of the Books of the Bible, Daniel chapter 3 (stempublishing.com)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "God hath spoken in His Son! The living Jesus, come forth from the fiery furnace of God's holiness, from the burning glow of everlasting love, He Himself is the living Word.", "source": "Andrew Murray, The Holiest of All, Chapter 1, The Son In Whom God Hath Spoken"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Shadrach, Meshech and Abednego suffered no harm in the fiery furnace. Dan. 3:16-27.", "source": "Watchman Nee, The Spiritual Man, chapter: Overcoming Death"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Our faith will not take the strain of the requirements of a deep experience of trial and adversity, but if we live by the faith of the Son of God, the issue will be different.", "source": "T. Austin-Sparks, In Christ, chapter: Christ to be Expressed Through Believers"}], "declarations": ["I declare: Jesus stands with me in the fire, and I will not be burned.", "I declare: I live by the faith of the Son of God in every trial."], "prayer": "Lord Jesus, be with me in every fiery trial today. I trust You to bring me through unharmed. Amen.", "theme_flag": "theme-based: Murray, Sparks"}, {"day": 104, "ref": "Daniel 7:13", "book": "Daniel", "chapter": 7, "verse": 13, "text": "I saw in the night visions, and, behold, one like the Son of man came with the clouds of heaven, and came to the Ancient of days, and they brought him near before him.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "One like the Son of man is brought to the Ancient of days, and receives the kingdom and universal dominion, the rule of Jehovah entrusted to man in the Person of Christ.", "source": "J. N. Darby, Synopsis of the Books of the Bible, Daniel chapter 7 (stempublishing.com)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "But when we remember that Jesus became Man, that He might taste death for all men, and that He, a Man upon the throne, now lives as our Surety, our Redeemer, and our Head, it is enough if we see Him crowned with glory and honour.", "source": "Andrew Murray, The Holiest of All, Chapter 12, We See Jesus Crowned With Glory and Honour"}, {"name": "Watchman Nee", "short": "Nee", "comment": "As Son of man He had a will, but He did not do it; He came to do the will of the Father.", "source": "Watchman Nee, The Normal Christian Life, chapter: The Basis of All True Ministry"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "The Son of man who is in heaven. John 3:13.", "source": "T. Austin-Sparks, In Christ, Chapter 4, Ascension and Glory"}], "declarations": ["I declare: Jesus the Son of man reigns, and His kingdom has no end.", "I declare: I submit to Christ my Head, and I do the Father's will."], "prayer": "Lord Jesus, Son of man crowned with glory, I bow to You today. Rule over my life. Amen.", "theme_flag": "theme-based: Murray, Nee, Sparks"}, {"day": 105, "ref": "Daniel 7:14", "book": "Daniel", "chapter": 7, "verse": 14, "text": "And there was given him dominion, and glory, and a kingdom, that all people, nations, and languages, should serve him: his dominion is an everlasting dominion, which shall not pass away, and his kingdom that which shall not be destroyed.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "The earthly people established in the kingdom under the heavens. This was the dominion of the God of heaven which should not pass away.", "source": "J. N. Darby, Synopsis of the Books of the Bible, Daniel chapter 7 (stempublishing.com)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "God is on the throne and Christ in Him: the throne and the kingdom are Christ's too. For ever and ever. Christ is the King eternal. His dominion is an everlasting dominion.", "source": "Andrew Murray, The Holiest of All, Chapter 7, The Son Himself God"}, {"name": "Watchman Nee", "short": "Nee", "comment": "We now seek first the kingdom of God and His righteousness because we believe God will supply our daily need.", "source": "Watchman Nee, The Spiritual Man, chapter: The Soul under the Spirit's Control"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "He came to redeem it, to secure the judicial right to sovereignty in it, and to initiate, continue, and complete the restoration of it to His own dominion.", "source": "T. Austin-Sparks, In Christ, chapter: Christ to be Expressed Through Believers"}], "declarations": ["I declare: The dominion of Christ is everlasting; it will never pass away.", "I declare: I seek first the kingdom of God, and He supplies all I need."], "prayer": "Lord Jesus, eternal King, I put Your kingdom first today. Establish Your rule in my life. Amen.", "theme_flag": "theme-based: Murray, Nee, Sparks"}, {"day": 106, "ref": "Daniel 9:25", "book": "Daniel", "chapter": 9, "verse": 25, "text": "Know therefore and understand, that from the going forth of the commandment to restore and to build Jerusalem unto the Messiah the Prince shall be seven weeks, and threescore and two weeks: the street shall be built again, and the wall, even in troublous times.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "The time should come, decreed of God, to finish the transgression, to make an end of sin, and to put it away; to pardon iniquity and bring in everlasting righteousness.", "source": "J. N. Darby, Synopsis of the Books of the Bible, Daniel chapter 9 (stempublishing.com)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Believer, abide in Christ as your redemption. Let this be the crown of your Christian life.", "source": "Andrew Murray, Abide in Christ, Chapter 10, As Your Redemption"}, {"name": "Watchman Nee", "short": "Nee", "comment": "As we stand steadfastly on the ground of what Christ is, we find all that is true of Him becoming experimentally true in us.", "source": "Watchman Nee, The Normal Christian Life, chapter: Abiding in Him"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Nothing can be added to that, nor can it be shared in its vicarious and redeeming efficacy.", "source": "T. Austin-Sparks, In Christ, Chapter 2, In the Likeness of His Death"}], "declarations": ["I declare: In Christ my transgression is finished and my sin is put away.", "I declare: I abide in Christ my redemption, and I am complete in Him."], "prayer": "Lord Jesus, my Redeemer, I stand on all that You are. Make Your redemption real in me today. Amen.", "theme_flag": "theme-based: Murray, Nee, Sparks"}, {"day": 107, "ref": "Daniel 9:26", "book": "Daniel", "chapter": 9, "verse": 26, "text": "And after threescore and two weeks shall Messiah be cut off, but not for himself: and the people of the prince that shall come shall destroy the city and the sanctuary; and the end thereof shall be with a flood, and unto the end of the war desolations are determined.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "After sixty-nine altogether, the Messiah should be cut off, and should have nothing. He to whom the kingdom and the glory belonged, instead of receiving them, should be cut off and have nothing.", "source": "J. N. Darby, Synopsis of the Books of the Bible, Daniel chapter 9 (stempublishing.com)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "The death of Christ hath wrought with mighty power in heaven and earth and hell. It has satisfied, and delighted God; it has conquered death and sin and hell; it has redeemed and delivered mankind.", "source": "Andrew Murray, The Holiest of All, Chapter 13, Jesus Tasting Death For Every Man"}, {"name": "Watchman Nee", "short": "Nee", "comment": "He knew there was an appointed hour for the Messiah to be cut off; He could not die in advance of God's appointed moment nor could He die at any other place than at Golgotha.", "source": "Watchman Nee, The Spiritual Man, chapter: Death after our Work is Finished"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "The matter which we now have before us is the relationship of the Cross to the manifesting of life.", "source": "T. Austin-Sparks, The Battle for Life, Chapter 3, The Cross in Relation to the Issue of Life"}], "declarations": ["I declare: The Messiah was cut off for me, and by His death I have life.", "I declare: The Cross has conquered sin and death on my behalf."], "prayer": "Lord Jesus, You were cut off that I might live. I thank You for Your finished work today. Amen.", "theme_flag": "theme-based: Murray, Sparks"}, {"day": 108, "ref": "Hosea 6:3", "book": "Hosea", "chapter": 6, "verse": 3, "text": "Then shall we know, if we follow on to know the LORD: his going forth is prepared as the morning; and he shall come unto us as the rain, as the latter and former rain unto the earth.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "The prophet's entreaty to return to Jehovah: His readiness to meet His people Hosea 6 calls forth a touching address from the prophet, in which he entreats the people to return to Jehovah. Faith has always this resource, because it sees the hand of God, its God, in the chastisement, and can appeal to the mercy of a well-known God. In verse 4 the Spirit expresses the lovingkindness of God towards His rebellious children, and His readiness to meet the smallest movement in their heart towards good.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "When He comforts, it is that He may turn the bleeding heart to Himself to receive the blessing in fellowship with Him; when He refuses comfort, His object is still the same, It is in making us partakers of His holiness that true comfort comes. The Holy Spirit is the Comforter, not only because He can Suggest comforting thoughts of God’s love, but far more because He makes ug holy, and brings us into close union with Christ and with God. He teaches us to abide in Christ; and because God is found there, the truest comfort will come there too.", "source": "Abide in Christ, Day 7"}, {"name": "Watchman Nee", "short": "Nee", "comment": "An awareness of need, drawing them out and on to know the Lord. This is what I feel to be the heart of everything.", "source": "The Normal Christian Life"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "That I may know him, and the power of his resurrection. Phil. 3:10.", "source": "In Christ"}], "declarations": ["I declare: I press on to know the Lord, and He will come to me as surely as the morning.", "I declare: My heart is drawn to know Christ more today."], "prayer": "Lord Jesus, I want to know You. Draw me closer and reveal Yourself to me today. Amen.", "theme_flag": "theme-based: Murray, Nee, Sparks"}, {"day": 109, "ref": "Hosea 11:1", "book": "Hosea", "chapter": 11, "verse": 1, "text": "When Israel was a child, then I loved him, and called my son out of Egypt.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Nothing can be finer than this intermingling of the moral necessity for judgment, the just indignation of God at such sin, pleading to induce Israel to forsake their evil ways and seek Jehovah, who would assuredly have compassion; then God's recurrence to the eternal counsels of His own grace, to secure unto the people whom He loved that of which their iniquity deprived them; and, at the same time, the touching remembrance of former relationship with His beloved people. What condescension, and what grace, on the part of their God!", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Let there be the deep confession of our inability to bring God the worship that is pleasing to Him; the childlike teachableness that waits on Him to instruct us; the simple faith that yields itself to the breathing of the Spirit. Above all, let us hold fast the blessed truth--we shall find that the Lord has more to say to us about it--that the knowledge of the Fatherhood of God, the revelation of His infinite Fatherliness in our hearts, the faith in the infinite love that gives us His Son and His Spirit to make us children, is indeed the secret of prayer in spirit and truth. This is the new and living way Christ opened up for us.", "source": "With Christ in the School of Prayer, Fifth Lesson"}, {"name": "Watchman Nee", "short": "Nee", "comment": "The Lord Jesus saves people from sins and sicknesses that they may know the love of the Father.", "source": "The Spiritual Man (3)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "This is my beloved Son in whom I am well pleased. Conformed to the image of his Son.", "source": "The School of Christ"}], "declarations": ["I declare: God loves me with an everlasting love, and He will never forsake me.", "I declare: I am called out as God's beloved child in Christ."], "prayer": "Lord Jesus, thank You for the Father's love that called me out. Let me rest in that love today. Amen.", "theme_flag": "theme-based: Murray, Nee, Sparks"}, {"day": 110, "ref": "Joel 2:13", "book": "Joel", "chapter": 2, "verse": 13, "text": "And rend your heart, and not your garments, and turn unto the LORD your God: for he is gracious and merciful, slow to anger, and of great kindness, and repenteth him of the evil.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Verses 12-14 give us the prophet's testimony, calling them to repentance, in view of the chastisements that were hanging over the people. In verse 15 the trumpet is sounded on God's part to gather the people together, according to Numbers 10:7, to plead with Him that He would turn away His wrath, to address themselves to Him, as One whose judgments were necessarily directed by Himself. Oh! how good it is to have to do with God, and to see Him in the judgment, although He is a consuming fire. It was thus David judged when he had numbered the people.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "(Isa. 4:4; Zech. 12:10,11; Matt. 3:11,12) To the anxious soul who complains that he does not feel his sin deeply enough, we must often say that there is no limit as to how deep his repentance must be. He must come daily just as he is; the deepest conviction often times comes after conversion. To the young convert we have simply to say: let the Spirit who is in you convince you always of sin. Sin, which formerly you knew but by name, He will make you hate. Sin, which you had not seen in the hidden depths of your heart, He will make you know, and with shame confess.", "source": "The New Life, The Holy Ghost"}, {"name": "Watchman Nee", "short": "Nee", "comment": "May God be gracious to us that we may put no confidence in the flesh.", "source": "The Spiritual Man, Words of Exhortation"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Let us ask our hearts at once, Is this true in our case?", "source": "The School of Christ"}], "declarations": ["I declare: I rend my heart before God, and He receives me with mercy.", "I declare: God is gracious and merciful to me; I turn to Him fully."], "prayer": "Lord Jesus, I bring You my whole heart today. You are gracious and merciful; receive me. Amen.", "theme_flag": "theme-based: Murray, Nee, Sparks"}, {"day": 111, "ref": "Joel 2:28", "book": "Joel", "chapter": 2, "verse": 28, "text": "¶ And it shall come to pass afterward, that I will pour out my spirit upon all flesh; and your sons and your daughters shall prophesy, your old men shall dream dreams, your young men shall see visions:", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "But this was not all. This was temporal blessing — the re-establishment of Israel in the blessing of former days, on the ground of grace, which would prevent their losing it. But there was a new thing to be bestowed upon them. God would pour out His Spirit upon all flesh. The young men and the old men of the people should have visions and dreams: even on the servants and the handmaidens should this rain from heaven descend. Verse 30* resumes the subject in another aspect, and does not follow in direct succession.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "And now, the lesson Jesus teaches us today in His school is this: That the Father is just longing to give Him to us if we will but ask in the childlike dependence on what He says: If ye know to give good gifts unto your children, HOW MUCH MORE shall your heavenly Father give the Holy Spirit to them that ask Him.' In the words of God's promise, I will pour out my Spirit abundantly;' and of His command, Be ye filled with the Spirit' we have the measure of what God is ready to give, and what we may obtain. As God's children, we have already received the Spirit.", "source": "With Christ in the School of Prayer, Lesson: How much more the Holy Spirit"}, {"name": "Watchman Nee", "short": "Nee", "comment": "As soon as we see the Lord Jesus on the throne, we know the Holy Spirit has been poured out upon us.", "source": "The Normal Christian Life"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "He breathed on them, and saith unto them, Receive ye the Holy Spirit. John 20:22.", "source": "In Christ"}], "declarations": ["I declare: The Holy Spirit is poured out on me, and I am filled.", "I declare: I receive the Spirit's fullness for life and witness today."], "prayer": "Lord Jesus, pour out Your Spirit on me afresh today. Fill me to overflow. Amen.", "theme_flag": "theme-based: Nee, Sparks"}, {"day": 112, "ref": "Joel 2:32", "book": "Joel", "chapter": 2, "verse": 32, "text": "And it shall come to pass, that whosoever shall call on the name of the LORD shall be delivered: for in mount Zion and in Jerusalem shall be deliverance, as the LORD hath said, and in the remnant whom the LORD shall call.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "The Holy Spirit should be abundantly poured out; the most simple and the most humble should partake of it. But, in the second place,* before the coming of the great day of Jehovah He would send marvellous signs, and whosoever should call on His name should be saved. It would be the returning in heart to Jehovah which He would own; for in that dreadful day of the wrath of God there should be deliverance in Zion, and in Jerusalem His chosen city. It is He who intervenes in judgment; He would remember mercy: there should be a remnant called by His grace.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Observe how He uses words which mean almost the same thing, and each time repeats the promise so distinctly: Ye shall receive, ye shall find, it shall be opened unto you;' and then gives as ground for such assurance the law of the kingdom: He that asketh, receiveth; he that seeketh, findeth; to him that knocketh, it shall be opened.' We cannot but feel how in this sixfold repetition He wants to impress deep on our minds this one truth, that we may and must most confidently expect an answer to our prayer.", "source": "With Christ in the School of Prayer, Fifth Lesson, Ask, and it shall be given you"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Hitherto have ye asked nothing in my name: ask, and ye shall receive, that your joy may be made full.", "source": "Sit, Walk, Stand"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "I am come a light into the world, that whosoever believeth on me may not abide in the darkness. John 12:46.", "source": "The School of Christ"}], "declarations": ["I declare: Whoever calls on the name of the Lord shall be saved, and I have called.", "I declare: I ask in Jesus' name, and I receive with full joy."], "prayer": "Lord Jesus, I call on Your name today. Save, deliver, and answer me. Amen.", "theme_flag": "theme-based: Murray, Nee, Sparks"}, {"day": 113, "ref": "Amos 5:24", "book": "Amos", "chapter": 5, "verse": 24, "text": "But let judgment run down as waters, and righteousness as a mighty stream.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "The wise man kept silence, for it was an evil day. Nevertheless the Spirit calls to repentance. It might be that Jehovah would have compassion on the affliction of Joseph. Yet there were those in the midst of all this iniquity who professed to desire the day of Jehovah. The prophet tells them that it should be a day of terror and of judgment, of darkness and not of light. They should fall from one disaster into another. Jehovah took no pleasure in their offerings and sacrifices; He could not bear with their solemn feasts; He desired judgment and righteousness.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "He is the Spirit of judgment and of burning,' by whom God purifies His people. (Isa. 4:4; Zech. 12:10,11; Matt. 3:11,12) To the anxious soul who complains that he does not feel his sin deeply enough, we must often say that there is no limit as to how deep his repentance must be. He must come daily just as he is; the deepest conviction often times comes after conversion. To the young convert we have simply to say: let the Spirit who is in you convince you always of sin. Sin, which formerly you knew but by name, He will make you hate. Sin, which you had not seen in the hidden depths of your heart, He will make you know, and with shame confess.", "source": "The New Life, Righteousness"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Neither does the flesh profit the spiritual life nor can it fulfill the righteousness of God.", "source": "The Spiritual Man (1)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "The new man, created in righteousness and holiness of truth. Eph. 4:24.", "source": "In Christ"}], "declarations": ["I declare: In Christ I am made righteous, and I walk in righteousness today.", "I declare: Right standing with God produces right living in me."], "prayer": "Lord Jesus, make me righteous as You are righteous. Let justice and righteousness flow through my life. Amen.", "theme_flag": "theme-based: Nee, Sparks"}, {"day": 114, "ref": "Obadiah 1:21", "book": "Obadiah", "chapter": 1, "verse": 21, "text": "And saviours shall come up on mount Zion to judge the mount of Esau; and the kingdom shall be the LORD’s.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "The effect of God's call to repentance, of His unchangeable faithfulness and unwearying love: deliverance upon Mount Zion He closes the prophecy of Obadiah with the testimony of the effect of His call to repentance, of His unchangeable faithfulness to His promises and unwearying love. Power and might against those formidable enemies should be given to Israel, who should in peace possess the territory which their enemies had invaded. Deliverance should be on Mount Zion; from thence Mount Esau should be judged, and the kingdom should be Jehovah's.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "It is not enough for us to know that God is a Father: He would have us take time to come under the full impression of what that name implies. We must take the best earthly father we know; we must think of the tenderness and love with which he regards the request of his child, the love and joy with which he grants every reasonable desire; we must then, as we think in adoring worship of the infinite Love and Fatherliness of God, consider with how much more tenderness and joy He sees us come to Him, and gives us what we ask aright.", "source": "With Christ in the School of Prayer, Sixth Lesson"}, {"name": "Watchman Nee", "short": "Nee", "comment": "The kingdom of this world is not the kingdom of God. God had His heart set upon a world system, a universe of His creating, which should be headed up in Christ His Son. Col. 1:16-17.", "source": "The Normal Christian Life"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "We shall see later that this is related to the inclusive dominion in the universe of the race in Christ, and also to the dethronement of the lord of death. Heb. 2:5-15.", "source": "In Christ"}], "declarations": ["I declare: The kingdom shall be the Lord's, and Christ heads up all things.", "I declare: I belong to the kingdom of God, not of this world."], "prayer": "Lord Jesus, establish Your kingdom in my life today. I seek Your rule above all. Amen.", "theme_flag": "theme-based: Murray, Nee, Sparks"}, {"day": 115, "ref": "Jonah 2:9", "book": "Jonah", "chapter": 2, "verse": 9, "text": "But I will sacrifice unto thee with the voice of thanksgiving; I will pay that that I have vowed. Salvation is of the LORD.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Christ, in His infinite grace, came down into this place, being rejected because He was faithful. We most distinctly see the spirit of the remnant of Israel in Jonah's prayer. Verses 7-9 of chapter 2 prove it most clearly. In fact the remnant of Israel, although upright by grace, are but flesh; the testimony is committed to them, and they fail. The flesh being without strength, sentence of death must pass on all that is of man. He is but vanity; and if he goes down into death, who can raise him up? Who can make a dead man the witness of God?", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "We do it as we allow the powers of the coming world to possess us, and to lift us up into a life in the heavenly places, to enlarge our hearts and our views, to anticipate, even here, the things which have neve: entered into the heart of man to conceive. Believer, abide in Christ as thy redemption. Let this be the crown of thy Christian life. Seek it not first or only, apart from the knowledge of Christ in His other relations. But seek it truly as that to which they are meant to lead thee up. Abide in Christ as thy redemption. Nothing will fit thee for this but faithfulness in the previous steps of the Christian life.", "source": "Abide in Christ, As Your Redemption"}, {"name": "Watchman Nee", "short": "Nee", "comment": "And then we shall daily experience the salvation of the Lord.", "source": "The Spiritual Man, A Broken Spirit"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "That is the essence of a life governed by the Holy Spirit, and it is that which will deliver us from death, from stagnation, from coming to a standstill.", "source": "The School of Christ"}], "declarations": ["I declare: Salvation is of the LORD, and I receive His deliverance today.", "I declare: I will sacrifice with the voice of thanksgiving to my God."], "prayer": "Lord Jesus, my salvation is from You alone. I thank You and I trust You to deliver me. Amen.", "theme_flag": "theme-based: Murray, Nee, Sparks"}, {"day": 116, "ref": "Micah 5:2", "book": "Micah", "chapter": 5, "verse": 2, "text": "But thou, Beth-lehem Ephratah, though thou be little among the thousands of Judah, yet out of thee shall he come forth unto me that is to be ruler in Israel; whose goings forth have been from of old, from everlasting.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "The birthplace of Christ predicted: the eternal glory of His person Verse 2 describes Him in a striking manner. It was on this verse that the scribes and chief priests rested, when they certified Herod that Christ should be born in Bethlehem. It represents Him as being born at Bethlehem, and at the same time as eternal, and as the true Ruler in Israel. The second verse is in parenthesis. It declares the birthplace, whence He that should rule over Israel for Jehovah should go forth; and, at the same time, it reveals the eternal glory of His Person.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "God's great work is to restore that life. In the Old Testament He showed this in a case like that of Isaac, by proving that the new race He was going to prepare must have a life from Himself, a life born of one as good as dead. Isaac's life was to be in a special sense a God- given life. In the New Testament He showed it by the miracu lous birth of Jesus Christ : God's mighty power revealing the divine life in the babe of Bethlehem. What God would teach us is : the new life must come from God ; His mighty power must alone and directly work it, or all is vain. It is for this our faith must trust Him.", "source": "The Holiest of All, Sarah, Faith in the Faithfulness of God"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Our union with the race as the last Adam began historically at Bethlehem and ended at the cross and the tomb.", "source": "The Normal Christian Life"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "He Who was born out from God shows what is the necessity for and the nature of being born of the Spirit if the will of God is to be done on the earth as it is done in the heavens.", "source": "In Christ"}], "declarations": ["I declare: Jesus, born at Bethlehem, is the eternal Ruler of my life.", "I declare: The divine life revealed in Christ now lives in me."], "prayer": "Lord Jesus, eternal Ruler born at Bethlehem, I worship You. Rule in my heart today. Amen.", "theme_flag": "theme-based: Murray, Nee, Sparks"}, {"day": 117, "ref": "Micah 6:8", "book": "Micah", "chapter": 6, "verse": 8, "text": "He hath shewed thee, O man, what is good; and what doth the LORD require of thee, but to do justly, and to love mercy, and to walk humbly with thy God?", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "In a touching appeal to their heart and conscience He asks what they could have against Him. He had redeemed them from Egypt, had led them by the hands of Moses, Aaron, and Miriam; He had refused to hearken to Balak and Balaam, who had done their utmost to curse Israel. If they would but consider, they would know His faithfulness. After this He lays before them, in detail, the universal wickedness that reigned among them, contrasting their ceremonies with practical righteousness: therefore also the judgment must surely fall upon them (v. 13-16).", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Even so now present your members as servants to righteousness unto sanctification.' -- Rom. 6:13,18,19 The word of Micah teaches us that the fruit of the salvation of God is seen chiefly in three things. The new life must be characterized, in my relation to God and His will, by righteousness and doing right; in my relation to my neighbour, by love and beneficence; in relation to myself, by humility and lowliness. For the present, we meditate on righteousness. Scripture teaches us that no man is righteous before God, or has any righteousness that can stand before God; (Ps. 14:3; 143:2; Rom.", "source": "The New Life, Righteousness"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Oh, we need to be sincere and humble, and to open ourselves before God!", "source": "The Normal Christian Life"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Find the man who is kept humble in this way, and yet triumphant in a way which is not explained on a natural ground, and you will find the man who is a giant in spirit.", "source": "The Battle for Life"}], "declarations": ["I declare: I walk humbly with my God, doing justly and loving mercy.", "I declare: My life shows the fruit of God's salvation today."], "prayer": "Lord Jesus, teach me to walk humbly with You. Make my life just, merciful, and lowly. Amen.", "theme_flag": "theme-based: Nee, Sparks"}, {"day": 118, "ref": "Nahum 1:7", "book": "Nahum", "chapter": 1, "verse": 7, "text": "The LORD is good, a strong hold in the day of trouble; and he knoweth them that trust in him.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "But this is not all: His indignation is not vague and devastating without distinction when He gives it free course. He is good; He is a stronghold in the day of trouble. When the evil and the judgment overflow — the evil which is a judgment, and the judgment before which nothing that it reaches can stand — He is Himself the sure refuge of all that trust in Him: He Himself knows all that do so. As for the glory of the enemy, it shall be destroyed, blotted out, brought to nothing. Reckless in the midst of their pleasures, drunken and suspecting nothing, they shall be devoured as stubble fully dry.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "QUIETLY 125 us, and the little season of silent worship will bring a peace and a rest that give a blessing not only in prayer, but all the day. “It is good that a man should . . . quietly wait for the salvation of the Lord.” Yes, it is good. The quietness is the confession of our impotence. It will not be done with all our willing and running, with all our thinking and praying, we must receive it from God. It is the confession of our trust that our God will in His time come to our help—the quiet resting in Him alone. It is the confession of our desire to sink into our nothingness, and to let Him work and reveal Himself.", "source": "Waiting on God, Day 24, To Know His Goodness"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Then life once again shall flow, stronger than before, breaking through every stronghold of the enemy.", "source": "The Spiritual Man (2)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "So for all the future of His work He prayed that His disciples might abide in Him.", "source": "In Christ"}], "declarations": ["I declare: The Lord is my stronghold in the day of trouble.", "I declare: God is good to me, and I am safe as I wait on Him."], "prayer": "Lord Jesus, my refuge and stronghold, I hide in You today. You are good to those who trust You. Amen.", "theme_flag": "theme-based: Murray, Nee, Sparks"}, {"day": 119, "ref": "Habakkuk 2:4", "book": "Habakkuk", "chapter": 2, "verse": 4, "text": "Behold, his soul which is lifted up is not upright in him: but the just shall live by his faith.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Pride judged: the portion of the just — to live by faith and trust Jehovah God had judged the spirit of pride, whose effects had overwhelmed the heart of the prophet. The oppressor was not upright, but the portion of the just was to live by faith, and by faith he should live. A deliverance for the people, which did not, so to say, require this faith, might have been preferred. But God would have the heart thus exercised. The righteous must pass through it and learn to trust in Jehovah, to count on Him in all circumstances, to learn what He is in Himself (come what may).", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "(Rom. 1:17; Gal. 3:11; Heb. 10:38) But that word is oftentimes very imperfectly understood, as if it ran: Man shall on his conversion be justified by faith. The word includes this, but signifies much more. It says that the righteous shall live by faith: the whole life of the righteous, from moment to moment, shall be by faith. (Rom. 5:17,21; 6:11; 8:2; Gal. 2:20; 1 John 5:11,12) We all know how sharp is the opposition which God in His word presents betwixt the grace that comes by faith and the law that works -- demands.", "source": "The New Life, The Life of Faith"}, {"name": "Watchman Nee", "short": "Nee", "comment": "We live by faith and not by joy.", "source": "The Spiritual Man (2)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "We receive the benefit of it as a gift by faith and are justified.", "source": "In Christ"}], "declarations": ["I declare: The just shall live by faith, and I live by faith today.", "I declare: I walk by faith in Christ, not by what I feel."], "prayer": "Lord Jesus, I choose to live by faith today. Strengthen my trust in You moment by moment. Amen.", "theme_flag": "theme-based: Nee, Sparks"}, {"day": 120, "ref": "Habakkuk 3:18", "book": "Habakkuk", "chapter": 3, "verse": 18, "text": "Yet I will rejoice in the LORD, I will joy in the God of my salvation.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "He concludes his prophecy with the blessed result of all these precious lessons, namely, the expression of perfect confidence in Jehovah. He would rejoice and be glad in Him, if all the blessing should fail. Jehovah Himself was his strength, his trust, and his support, and He would set him on the high places of His blessing, giving him, as it were, hinds' feet to ascend there by His favour. There is nothing finer than this development of the thoughts of the Spirit of God, the sorrows and anxieties produced by Him, the answer of God to give understanding and strengthen faith, in order that the heart may be in full communion with Himself.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Therefore, soul, only believe. Do not seek gladness; in that case you will not find it, because you are seeking feeling. But seek Jesus, follow Jesus, believe in Jesus, and gladness shall be added to you. Not seeing, but believing, rejoice with joy unspeakable and full of glory.' Lord Jesus, Thou are the Light of the world, the Effulgence of the unapproachable light, in whom we see the light of God. From Thy countenance radiates upon us the illumination of the knowledge of the love and glory of God. And thou art ours, our light and our salvation. O teach us to believe more firmly that with Thee we can never walk in the darkness.", "source": "The New Life, Light And Joyfulness"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Nothing can save the situation except to rejoice in the Lord, rejoice in what God is and how He is our Savior.", "source": "The Spiritual Man, A Cool Spirit"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "We are looking for it, and we are hastening unto it, and we shall hail it with joy. The cry is in our hearts: Even so, come, Lord Jesus.", "source": "The Battle for Life"}], "declarations": ["I declare: I rejoice in the Lord always, even when blessings fail.", "I declare: My joy is in Christ, and no circumstance can take it."], "prayer": "Lord Jesus, I rejoice in You today. You are my joy and my salvation, whatever I face. Amen.", "theme_flag": "theme-based: Murray, Nee, Sparks"}, {"day": 121, "ref": "Zephaniah 3:14", "book": "Zephaniah", "chapter": 3, "verse": 14, "text": "¶ Sing, O daughter of Zion; shout, O Israel; be glad and rejoice with all the heart, O daughter of Jerusalem.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "The events spoken of in Daniel, the New Testament prophecies, and, in part, Zechariah, are omitted by those of the prophets who have for their subject the proper relations of the earthly people with God in Zion; and the judgment of Jerusalem and the Jews is connected in their prophecies with that of the nations — the judgment of the latter being involved in that of the people, who no longer rendered any testimony to Jehovah, but caused His name to be blasphemed. This judgment commenced, in regard to the Jews, with Nebuchadnezzar himself.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "The God of the Lord Jesus, the Father of glory give unto us the spirit of wisdom and of revelation in the knowledge of Jesus, that we may know what is the exceeding greatness of His power to usward who believe. Amen. 1. So long as the Christian thinks of the service of God or of sanctification as something that is hard and difficult, he will make no progress in it. He must see that this very thing is for him impossible. Then he will cease still endeavouring to do something; he will surrender himself that Christ may work all in him.", "source": "The New Life, Power And Weakness"}, {"name": "Watchman Nee", "short": "Nee", "comment": "The note of hallelujah must never be in short supply in the spirit of the believer.", "source": "The Spiritual Man, A Cool Spirit"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "It comes with the power of a revelation, and for a while we rejoice in its light, talk about nothing else, and find that it works.", "source": "In Christ"}], "declarations": ["I declare: I sing and rejoice, for my God has taken away my judgments.", "I declare: Hallelujah fills my spirit today; I will praise the Lord."], "prayer": "Lord Jesus, I sing to You with joy today. You have removed my shame and I rejoice in You. Amen.", "theme_flag": "theme-based: Murray, Nee, Sparks"}, {"day": 122, "ref": "Zephaniah 3:17", "book": "Zephaniah", "chapter": 3, "verse": 17, "text": "The LORD thy God in the midst of thee is mighty; he will save, he will rejoice over thee with joy; he will rest in his love, he will joy over thee with singing.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Isaiah and Micah, as well as Hosea and Amos (although the latter two less directly), are occupied with the revelation of the Son of David, the Deliverer and Defender of His people in Jerusalem. Hezekiah, raised up after the miserable reign of Ahaz gave occasion for these revelations, which taught the faithful (while unveiling the iniquity and the real condition of the people), that they must look forward and rest only in God's thoughts, who had raised up this pious king for the temporary restoration of His people, and who would grant them a complete and eternal deliverance by the true Emmanuel.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "God delights in nothing but His beloved Son, and can be satisfied with nothing else in those who draw nigh to Him. Enter deep into God's holy presence in the boldness which the blood gives, and in the assurance that in Christ you are most well pleasing. In Christ you are within the veil. You have access into the very heart and love of the Father. This is the great object of fellowship with God, that I may have more of God in my life, and that God may see Christ formed in me. Be silent before God and let Him bless you.", "source": "The Deeper Christian Life"}, {"name": "Watchman Nee", "short": "Nee", "comment": "He takes no pleasure in transforming us into automata; rather does He delight in having us cooperate with Him.", "source": "The Spiritual Man, Something to Guard against in Spiritual Warfare"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "It pleased God to reveal his Son in me. Gal. 1:16.", "source": "The School of Christ"}], "declarations": ["I declare: The LORD my God is mighty in my midst, and He rejoices over me.", "I declare: I am God's delight, and He rests in His love for me."], "prayer": "Lord Jesus, mighty in my midst, I rest in Your delight over me today. Quiet me with Your love. Amen.", "theme_flag": "theme-based: Murray, Nee, Sparks"}, {"day": 123, "ref": "Haggai 2:7", "book": "Haggai", "chapter": 2, "verse": 7, "text": "And I will shake all nations, and the desire of all nations shall come: and I will fill this house with glory, saith the LORD of hosts.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "But now, the heavens and the earth, the sea — authority on high, and all that was organised below, all established order, and all that floated unorganised in the world — and all the nations, should be shaken; and the object of desire to all nations should come; and the house which they were now rebuilding with so much trouble, which was so contemptible in comparison with its former glory, should be filled with glory by the Lord. The true glory of the house The expression which I have rendered by \"the object of desire shall come\" is very difficult to translate.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "The answer to each prayer must come in the closer union and the deeper abiding in Him ; in Him, the unspeakable gift, all other gifts ara treasured up, the gift of wisdom and knowledge too. How often have you longed for wisdom and spiritual understanding that you might know God better, whom to know is life eternal! Abide in Jesus: your life in Him will lead you to that fellowship with God in which the only true know- ledge of God is to be had. His love, His power, His infinite glory will, as you abide in Jesus, be so revealed as it hath not entered into the heart of man to conceive.", "source": "Abide in Christ, Day 7"}, {"name": "Watchman Nee", "short": "Nee", "comment": "God's desire is for sons who shall be joint-heirs with Christ in glory.", "source": "The Normal Christian Life"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "He is quietly, without sound of axe or hammer, putting His elect stones into a spiritual temple, a heavenly house.", "source": "In Christ"}], "declarations": ["I declare: Christ, the desire of all nations, has come, and He fills my life with glory.", "I declare: I am a living stone in God's house, built for His glory."], "prayer": "Lord Jesus, desire of the nations, fill Your house with glory today. Build my life into Your temple. Amen.", "theme_flag": "theme-based: Murray, Nee, Sparks"}, {"day": 124, "ref": "Zechariah 2:10", "book": "Zechariah", "chapter": 2, "verse": 10, "text": "¶ Sing and rejoice, O daughter of Zion: for, lo, I come, and I will dwell in the midst of thee, saith the LORD.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "The daughter of Zion should sing with joy, for Jehovah would dwell in the midst of her. Many nations should come and join themselves to Jehovah in that day, and should be His people; and He would dwell in the midst of Israel. And then the word of prophecy (the accomplishment of which had been so long suspended that it appeared like a dream of the night) should be justified to Israel by its entire fulfilment. Jehovah should inherit Judah as His portion in the holy land, and should again choose Jerusalem. Solemn period!", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Brother, sigh not at what is in very deed the highest token of the Father’s love, that He has called us to be like Christ in our love, just as He was like the Father in His love. Understand that He who gave the command in such close connection with His teaching about the Vine and the abiding in Him, gave us in that the assurance that we have only to abide in Him to be able to love like Him. Accept the command as a new motive td a more full abiding in Christ. Regard the abiding in Him more than ever as an abiding in His love; rooted and grounded daily in a love that passeth know: ledge, you receive of its fulness, and learn to love.", "source": "Abide in Christ"}, {"name": "Watchman Nee", "short": "Nee", "comment": "The Spirit of the enthroned Lord flows into the spirit of the believer, who is on the earth yet not of the world.", "source": "The Spiritual Man, (4) Sinking of the Spirit"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "This is a deliberate course taken by God with us.", "source": "In Christ"}], "declarations": ["I declare: The Lord dwells in the midst of me, and I sing with joy.", "I declare: Christ abides in me, and His love fills my heart."], "prayer": "Lord Jesus, dwell in the midst of my life today. I rejoice that You are with me. Amen.", "theme_flag": "theme-based: Murray, Nee, Sparks"}, {"day": 125, "ref": "Zechariah 9:9", "book": "Zechariah", "chapter": 9, "verse": 9, "text": "¶ Rejoice greatly, O daughter of Zion; shout, O daughter of Jerusalem: behold, thy King cometh unto thee: he is just, and having salvation; lowly, and riding upon an ass, and upon a colt the foal of an ass.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "The King of Zion comes unto her. He is just, and brings in Himself power and salvation. This is the general idea, that which Zion needed, and which shall be accomplished in the last days. The Holy Ghost adds to this the personal character of the Lord, the spirit in which He presented Himself to Israel — lowly and riding upon an ass. We all know the fulfilment of this at His first coming. The effect of Messiah's presence The Messiah Himself having been thus presented, the definitive effect of His presence is announced in that which follows, as the continuation of verse 8, remembering who has been introduced.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "The sons of Zebedee had asked Jesus to sit on His right and left, the highest place in the kingdom. Jesus said it was not His to give, but the Father's, who would give it to those for whom it was prepared. They must not look or ask for it. Their thought must be of the cup and the baptism of humiliation. And then He added, _'Whosoever will be chief among you, let him be your servant. Even as the Son of Man came to serve.'_ Humility, as it is the mark of Christ the heavenly, will be the one standard of glory in heaven: the lowliest is the nearest to God. The primacy in the Church is promised to the humblest. 5.", "source": "Humility, Humility in the Teaching of Jesus"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Take my yoke upon you, and learn from me; for I am gentle and lowly in heart, and you will find rest for your souls. Matt. 11:29.", "source": "The Spiritual Man, God's Aim"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "This does not mean that He emptied Himself of Deity, but of its rights for the time being.", "source": "The School of Christ"}], "declarations": ["I declare: My King comes to me, just and lowly, bringing salvation.", "I declare: I learn from Christ the meek and lowly, and I find rest."], "prayer": "Lord Jesus, lowly King, I welcome You today. Teach me Your meekness and give me rest. Amen.", "theme_flag": "theme-based: Murray, Nee, Sparks"}, {"day": 126, "ref": "Zechariah 11:12", "book": "Zechariah", "chapter": 11, "verse": 12, "text": "And I said unto them, If ye think good, give me my price; and if not, forbear. So they weighed for my price thirty pieces of silver.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Verses 12 and 13 relate the price at which the nation estimated their King and their Saviour. The fulfilment of this is known to all. The prophet here performs the thing prophetically, marking that so it was to be according to the counsels of God. We see also that Christ appears here as Jehovah Himself. The connection between verses 6 and 9 brings out the same truth. The thoughts of Jehovah with respect to that which He will do find their accomplishment in the Person of Jesus. The union between Judah and Israel, of which Christ should be the bond, is also deferred.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "The desire to give a fitting answer to these questions has given rise to many excellent manuals. In connection with every time of revival, especially, new books for this circle of readers always make their appearance. As Mr. Murray indicates in the Preface, it was in the midst of such a happy period that the following chapters were written. The volume came under my notice whilst I was recently traveling in Holland. A brief inspection showed me that it was one of the most simple, comprehensive, and suggestive of its class.", "source": "The New Life"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Jesus poured out His soul to death and committed His spirit, in which was God's life, back into the hands of God.", "source": "The Spiritual Man, The Dividing of Spirit and Soul"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Then we follow Him on into the garden and to the Cross.", "source": "The Battle for Life"}], "declarations": ["I declare: My Saviour
