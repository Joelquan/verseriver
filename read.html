n Christ.", "I declare: I am saved by the grace of God in Jesus."], "prayer": "Lord Jesus, grace of God, You have appeared bringing salvation. Teach me to live soberly and godly as I wait for You. Amen.", "theme_flag": "theme-based: Murray, theme-based: Nee"}, {"day": 307, "ref": "Titus 2:13", "book": "Titus", "chapter": 2, "verse": 13, "text": "Looking for that blessed hope, and the glorious appearing of the great God and our Saviour Jesus Christ;", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Looking for that blessed hope, and the glorious appearing of the great God and our Saviour Jesus Christ. The Christian waits for Christ Himself.", "source": "Darby's Synopsis, Titus 2"}, {"name": "Andrew Murray", "short": "Murray", "comment": "The blessed hope and the appearing of the glory of our great God and Savior Jesus Christ, is one of the great bonds of union among believers.", "source": "Waiting on God, Day 28"}, {"name": "Watchman Nee", "short": "Nee", "comment": "A person who wholly follows the Lord is one who believes that the promises of God are trustworthy, that He is with His people, and that they are well able to overcome.", "source": "Watchman Nee"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "May the Lord fill us with new joy in the very contemplation of His near coming, to complete all that which He has begun.", "source": "T. Austin-Sparks, The Octave of Redemption, ch.8 - https://Austin-Sparks.Net/english/books/001616.html"}], "declarations": ["I declare: I look for that blessed hope, the glorious appearing of my great God and Saviour Jesus Christ.", "I declare: Christ's return is my hope and expectation."], "prayer": "Lord Jesus, my blessed hope, I look for Your glorious appearing. Keep my heart expectant and my life pure. Amen.", "theme_flag": "theme-based: Nee"}, {"day": 308, "ref": "Titus 3:5", "book": "Titus", "chapter": 3, "verse": 5, "text": "Not by works of righteousness which we have done, but according to his mercy he saved us, by the washing of regeneration, and renewing of the Holy Ghost;", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Not by works of righteousness which we have done, but according to His mercy He saved us. Salvation is wholly of God in Christ.", "source": "Darby's Synopsis, Titus 3"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Renewal is here the activity of the Spirit, who makes us new. Not by works, but according to His mercy He saved us.", "source": "The New Life, ch. 42"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Christianity begins not with a big DO, but with a big DONE.", "source": "Sit, Walk, Stand"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "We are founded upon the grace of God in Jesus Christ, not upon merit or worthiness or goodness in ourselves.", "source": "T. Austin-Sparks, Features of Zion, ch.3 - https://Austin-Sparks.Net/english/books/002134.html"}], "declarations": ["I declare: not by works of righteousness which I have done, but according to His mercy He saved me.", "I declare: my salvation is by mercy, not by merit, through Christ."], "prayer": "Lord Jesus, not by my works but by Your mercy You saved me. Keep me humble and grateful for Your washing and renewing. Amen.", "theme_flag": "theme-based: Sparks"}, {"day": 309, "ref": "Philemon 1:25", "book": "Philemon", "chapter": 1, "verse": 25, "text": "The grace of our Lord Jesus Christ be with your spirit. Amen.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "The grace of our Lord Jesus Christ be with your spirit. All blessing flows from Christ, and His grace attends the believer to the end.", "source": "Darby's Synopsis, Philemon"}, {"name": "Andrew Murray", "short": "Murray", "comment": "That He gave His Son to us, for us, in us. The grace of our Lord Jesus Christ abides with our spirit.", "source": "The New Life, ch. 6"}, {"name": "Watchman Nee", "short": "Nee", "comment": "The grace of the Lord in our spirit is our help at any time.", "source": "Collected Works of Watchman Nee, Set 1 Vol.13, The Spiritual Man (2), ch.11 - https://bibleread.online/all-books-by-Watchman-Nee-and-Witness-Lee/book-collected-works-of-watchman-nee-the-set-1-vol-13-the-spiritual-man-2-Watchman-Nee-read-online/11/"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Growing in grace and in the knowledge of our Lord and Saviour Jesus Christ is in the realm of our spirits.", "source": "T. Austin-Sparks, He That is Joined to the Lord is One Spirit - https://www.austin-sparks.net/english/004782.html"}], "declarations": ["I declare: the grace of our Lord Jesus Christ is with my spirit.", "I declare: I live under the grace of Christ today."], "prayer": "Lord Jesus, let Your grace be with my spirit. Go with me through this day, and let Your favor rest on me. Amen.", "theme_flag": "theme-based: Murray, theme-based: Nee, theme-based: Sparks"}, {"day": 310, "ref": "Hebrews 1:1", "book": "Hebrews", "chapter": 1, "verse": 1, "text": "God, who at sundry times and in divers manners spake in time past unto the fathers by the prophets,", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "God hath in these last days spoken unto us by His Son. Christ is God's final and perfect word to man.", "source": "Darby's Synopsis, Hebrews 1"}, {"name": "Andrew Murray", "short": "Murray", "comment": "God hath spoken unto us by His Son. In Christ, God has given His full and final revelation; we need no other word.", "source": "The Holiest of All, on Hebrews 1"}, {"name": "Watchman Nee", "short": "Nee", "comment": "We believe that the Bible is God's revelation to us. In other words, it is His spoken word to us.", "source": "Watchman Nee, The Normal Christian Faith, ch. 6 'Christ Versus Doctrines' (bibleread.online)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Therefore, God's last word is in His Son.", "source": "T. Austin-Sparks, Companions of Christ and the Heavenly Calling, ch.14 - https://Austin-Sparks.Net/english/books/004537.html"}], "declarations": ["I declare: God has spoken to me by His Son in these last days.", "I declare: I hear God's final word in Jesus Christ."], "prayer": "Lord Jesus, God's final Word, speak to me today. I turn from all other voices to hear You alone. Amen.", "theme_flag": "theme-based: Nee"}, {"day": 311, "ref": "Hebrews 1:2", "book": "Hebrews", "chapter": 1, "verse": 2, "text": "Hath in these last days spoken unto us by his Son, whom he hath appointed heir of all things, by whom also he made the worlds;", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Whom He hath appointed heir of all things, by whom also He made the worlds. The Son is both Creator and Heir of all.", "source": "Darby's Synopsis, Hebrews 1"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Whom He hath appointed heir of all things. Christ is the Heir; all things are His, and we are joint-heirs with Him.", "source": "The Holiest of All, on Hebrews 1"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Isaac alone was the heir of the inheritance and promises.", "source": "Collected Works of Watchman Nee, Set 1 Vol.20, Questions on the Gospel, ch.40 - https://bibleread.online/all-books-by-Watchman-Nee-and-Witness-Lee/book-collected-works-of-watchman-nee-the-set-1-vol-20-questions-on-the-gospel-Watchman-Nee-read-online/40/"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "This Son, whom we know as our Saviour and Lord, was God's agent in the creation of the worlds.", "source": "T. Austin-Sparks, Companions of Christ and the Heavenly Calling, ch.14 - https://Austin-Sparks.Net/english/books/004537.html"}], "declarations": ["I declare: Christ is the Heir of all things, by whom God made the worlds.", "I declare: I am a joint-heir with Christ."], "prayer": "Lord Jesus, Heir of all things, Maker of the worlds, I worship You. Make me a faithful steward of my inheritance in You. Amen.", "theme_flag": "theme-based: Nee"}, {"day": 312, "ref": "Hebrews 1:3", "book": "Hebrews", "chapter": 1, "verse": 3, "text": "Who being the brightness of his glory, and the express image of his person, and upholding all things by the word of his power, when he had by himself purged our sins, sat down on the right hand of the Majesty on high;", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Who being the brightness of His glory, and the express image of His person, and upholding all things by the word of His power. Christ is the perfect revelation of God.", "source": "Darby's Synopsis, Hebrews 1"}, {"name": "Andrew Murray", "short": "Murray", "comment": "The brightness of His glory, and the express image of His person. In Christ we see God exactly as He is.", "source": "The Holiest of All, on Hebrews 1"}, {"name": "Watchman Nee", "short": "Nee", "comment": "They are trying to look within, to differentiate, to discriminate, to analyze, and in doing so are bringing themselves into deeper darkness. Look to Christ instead.", "source": "The Normal Christian Life"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Jesus Christ is the personal embodiment and expression of the glory of God.", "source": "T. Austin-Sparks, The Ministry of the Church, ch.5 - https://austin-sparks.net/english/books/006322.html"}], "declarations": ["I declare: Christ is the brightness of God's glory and the express image of His person.", "I declare: in Christ I see God exactly."], "prayer": "Lord Jesus, brightness of God's glory, express image of His person, reveal the Father to me. Uphold me by Your powerful word. Amen.", "theme_flag": "theme-based: Nee"}, {"day": 313, "ref": "Hebrews 1:8", "book": "Hebrews", "chapter": 1, "verse": 8, "text": "But unto the Son he saith, Thy throne, O God, is for ever and ever: a sceptre of righteousness is the sceptre of thy kingdom.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "But unto the Son He saith, Thy throne, O God, is for ever and ever. The Father Himself addresses the Son as God.", "source": "Darby's Synopsis, Hebrews 1"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Thy throne, O God, is for ever and ever. The Son reigns as God; His kingdom shall never end.", "source": "The Holiest of All, on Hebrews 1"}, {"name": "Watchman Nee", "short": "Nee", "comment": "God's works issue from God's throne; God's throne is established upon authority.", "source": "Collected Works of Watchman Nee, Set 3 Vol.47, Authority and Submission, ch.14 - https://bibleread.online/all-books-by-Watchman-Nee-and-Witness-Lee/book-collected-works-of-watchman-nee-the-set-3-vol-47-the-orthodoxy-of-the-church-amp-authority-and-submission-Watchman-Nee-read-online/14/"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "A glorious throne set on high from the beginning. Of the Son, He saith, Thy throne, O God, is for ever and ever!", "source": "T. Austin-Sparks, Vocational Fellowship, ch.4 - https://www.austin-sparks.net/english/books/004362.html"}], "declarations": ["I declare: Thy throne, O God, is for ever and ever; Christ reigns eternally.", "I declare: I serve the King whose kingdom never ends."], "prayer": "Lord Jesus, Your throne is for ever and ever. Reign in my heart as You reign in heaven; establish Your righteousness in me. Amen.", "theme_flag": "theme-based: Nee"}, {"day": 314, "ref": "Hebrews 2:18", "book": "Hebrews", "chapter": 2, "verse": 18, "text": "For in that he himself hath suffered being tempted, he is able to succour them that are tempted.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "For in that He Himself hath suffered being tempted, He is able to succour them that are tempted. Christ's own suffering fits Him to help the suffering.", "source": "Darby's Synopsis, Hebrews 2"}, {"name": "Andrew Murray", "short": "Murray", "comment": "He Himself hath suffered being tempted. Our High Priest knows temptation by experience, and is able to help the tempted.", "source": "The Holiest of All, on Hebrews 2"}, {"name": "Watchman Nee", "short": "Nee", "comment": "God must bring us to a point where, through a deep and dark experience, our natural power is touched and fundamentally weakened, so that we no longer dare trust ourselves.", "source": "The Normal Christian Life"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "He has been the way of the winepress and we have received the benefit. Having suffered, He is able to succour the tempted.", "source": "The On-High Calling, vol. 2 (austin-sparks.net)"}], "declarations": ["I declare: Christ suffered being tempted, and He is able to help me when I am tempted.", "I declare: I run to Christ for help in every temptation."], "prayer": "Lord Jesus, You suffered being tempted, and You know how to help me. Succour me in my temptation today; I lean on You. Amen.", "theme_flag": "theme-based: Nee"}, {"day": 315, "ref": "Hebrews 4:12", "book": "Hebrews", "chapter": 4, "verse": 12, "text": "For the word of God is quick, and powerful, and sharper than any twoedged sword, piercing even to the dividing asunder of soul and spirit, and of the joints and marrow, and is a discerner of the thoughts and intents of the heart.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "For the word of God is quick, and powerful, and sharper than any twoedged sword. It discerns the thoughts and intents of the heart.", "source": "Darby's Synopsis, Hebrews 4"}, {"name": "Andrew Murray", "short": "Murray", "comment": "The word of God is quick and powerful. It pierces to the dividing of soul and spirit, discerning the heart.", "source": "The Holiest of All, on Hebrews 4"}, {"name": "Watchman Nee", "short": "Nee", "comment": "What we must do is lie on the altar. It is our High Priest's job to apply the sharp knife to us to divide our soul from our spirit.", "source": "Sermon: The Word of God, on Hebrews 4:12"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "The word of God divides between soul and spirit.", "source": "T. Austin-Sparks, The Most Difficult Thing in the World - https://www.austin-sparks.net/english/001254.html"}], "declarations": ["I declare: the word of God is living and powerful, discerning my heart.", "I declare: I submit to the searching word of Christ."], "prayer": "Lord Jesus, living Word of God, pierce my heart with Your truth. Divide what is of You from what is of me. Amen.", "theme_flag": null}, {"day": 316, "ref": "Hebrews 4:14", "book": "Hebrews", "chapter": 4, "verse": 14, "text": "Seeing then that we have a great high priest, that is passed into the heavens, Jesus the Son of God, let us hold fast our profession.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Seeing then that we have a great high priest, that is passed into the heavens, Jesus the Son of God, let us hold fast our profession.", "source": "Darby's Synopsis, Hebrews 4"}, {"name": "Andrew Murray", "short": "Murray", "comment": "We have a great high priest, that is passed into the heavens, Jesus the Son of God. Our Priest is in heaven itself, representing us before God.", "source": "The Holiest of All, on Hebrews 4"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Now, through the cross of the Lord Jesus we can enter the Holy of Holies any time.", "source": "Collected Works of Watchman Nee, Set 1 Vol.6, The Christian (4), ch.11 - https://bibleread.online/all-books-by-Watchman-Nee-and-Witness-Lee/book-collected-works-of-watchman-nee-the-set-1-vol-06-the-christian-4-Watchman-Nee-read-online/11/"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "He has passed through the heavens as High Priest. Then all His priestly work is perfect, all that He has done in mediation is fulfilled to the last stage.", "source": "That Which Was From The Beginning, ch. 2 (austin-sparks.net/english/books/002954.html)"}], "declarations": ["I declare: I have a great High Priest, Jesus the Son of God, passed into the heavens.", "I declare: I hold fast my confession of Christ."], "prayer": "Lord Jesus, my great High Priest in heaven, I hold fast my confession of You. Represent me before the Father today. Amen.", "theme_flag": "theme-based: Nee"}, {"day": 317, "ref": "Hebrews 4:15", "book": "Hebrews", "chapter": 4, "verse": 15, "text": "For we have not an high priest which cannot be touched with the feeling of our infirmities; but was in all points tempted like as we are, yet without sin.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "For we have not an high priest which cannot be touched with the feeling of our infirmities; but was in all points tempted like as we are, yet without sin.", "source": "Darby's Synopsis, Hebrews 4"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Touched with the feeling of our infirmities. He knows our weakness, having been tempted as we are, yet without sin.", "source": "The Holiest of All, on Hebrews 4"}, {"name": "Watchman Nee", "short": "Nee", "comment": "He feels with you. He is always sympathetic toward your infirmities, never to the sins you commit, but always to the sufferings of your body and distresses of your soul.", "source": "Sermon: God's Sympathy for Our Weakness"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "We have not a high priest that cannot be touched with the feeling of our infirmities; but one that hath been in all points tempted like as we are.", "source": "The On-High Calling, vol. 2 (austin-sparks.net)"}], "declarations": ["I declare: my High Priest is touched with the feeling of my infirmities.", "I declare: Christ understands my weakness and helps me."], "prayer": "Lord Jesus, touched with my infirmities, tempted as I am yet without sin, have mercy on me. You understand; help me. Amen.", "theme_flag": null}, {"day": 318, "ref": "Hebrews 4:16", "book": "Hebrews", "chapter": 4, "verse": 16, "text": "Let us therefore come boldly unto the throne of grace, that we may obtain mercy, and find grace to help in time of need.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Let us therefore come boldly unto the throne of grace, that we may obtain mercy, and find grace to help in time of need.", "source": "Darby's Synopsis, Hebrews 4"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Let us therefore come boldly unto the throne of grace. Because Jesus is there, the throne is grace, and we may come with confidence.", "source": "The Holiest of All, on Hebrews 4"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Brothers, if God brings us to the point of seeing that everything in God's work depends upon His blessing, it will bring about a basic change in our labor for God.", "source": "Devotions by Watchman Nee"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "We have the right, we have access, we have an open way.", "source": "T. Austin-Sparks, All Righteousness Fulfilled - https://austin-Sparks.net/english/006050.html"}], "declarations": ["I declare: I come boldly to the throne of grace to obtain mercy.", "I declare: I find grace to help in time of need through Christ."], "prayer": "Lord Jesus, I come boldly to Your throne of grace. Give me mercy and grace to help in my time of need. Amen.", "theme_flag": "theme-based: Nee"}, {"day": 319, "ref": "Hebrews 6:19", "book": "Hebrews", "chapter": 6, "verse": 19, "text": "Which hope we have as an anchor of the soul, both sure and stedfast, and which entereth into that within the veil;", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Which hope we have as an anchor of the soul, both sure and stedfast, and which entereth into that within the veil.", "source": "Darby's Synopsis, Hebrews 6"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Which hope we have as an anchor of the soul, both sure and stedfast. Our hope in Christ holds firm within the veil.", "source": "The Holiest of All, on Hebrews 6"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Faith comes from casting our anchor in the Lord Jesus.", "source": "Collected Works of Watchman Nee, Set 1 Vol.10, The Present Testimony (3), ch.16 - https://bibleread.online/all-books-by-Watchman-Nee-and-Witness-Lee/book-collected-works-of-watchman-nee-the-set-1-vol-10-the-present-testimony-3-Watchman-Nee-read-online/16/"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Hope is grounded and anchored outside of time.", "source": "T. Austin-Sparks, The Gospel According to Paul, ch.1 - https://mail.austin-sparks.net/english/books/001667.html"}], "declarations": ["I declare: my hope in Christ is an anchor of the soul, sure and steadfast.", "I declare: I am held firm by hope in Christ."], "prayer": "Lord Jesus, my anchor within the veil, hold me sure and steadfast. When storms rise, keep my soul fastened to You. Amen.", "theme_flag": "theme-based: Nee, theme-based: Sparks"}, {"day": 320, "ref": "Hebrews 7:25", "book": "Hebrews", "chapter": 7, "verse": 25, "text": "Wherefore he is able also to save them to the uttermost that come unto God by him, seeing he ever liveth to make intercession for them.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Wherefore He is able also to save them to the uttermost that come unto God by Him, seeing He ever liveth to make intercession for them.", "source": "Darby's Synopsis, Hebrews 7"}, {"name": "Andrew Murray", "short": "Murray", "comment": "He ever liveth to make intercession. Christ's unceasing prayer for us secures our complete salvation.", "source": "The Holiest of All, on Hebrews 7"}, {"name": "Watchman Nee", "short": "Nee", "comment": "He will forever be the Son of Man to save us to the uttermost.", "source": "Collected Works of Watchman Nee, Set 1 Vol.4, The Christian (2), ch.1 - https://bibleread.online/all-books-by-Watchman-Nee-and-Witness-Lee/book-collected-works-of-watchman-nee-the-set-1-vol-04-the-christian-2-Watchman-Nee-read-online/1/"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "He is now in heaven: our High Priest, our Advocate on high with God. He ever lives to make intercession for us.", "source": "T. Austin-Sparks, The Salvation of God in Christ - https://Austin-Sparks.Net/english/006506.html"}], "declarations": ["I declare: Christ ever lives to make intercession for me, and saves to the uttermost.", "I declare: I am completely saved by the living Christ."], "prayer": "Lord Jesus, ever living to intercede for me, save me to the uttermost. Pray for me today as I come to God by You. Amen.", "theme_flag": null}, {"day": 321, "ref": "Hebrews 9:28", "book": "Hebrews", "chapter": 9, "verse": 28, "text": "So Christ was once offered to bear the sins of many; and unto them that look for him shall he appear the second time without sin unto salvation.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "So Christ was once offered to bear the sins of many; and unto them that look for Him shall He appear the second time without sin unto salvation.", "source": "Darby's Synopsis, Hebrews 9"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Christ was once offered to bear the sins of many. His one sacrifice perfects forever; we look for His return.", "source": "The Holiest of All, on Hebrews 9"}, {"name": "Watchman Nee", "short": "Nee", "comment": "This indicates that the work of redemption was finished.", "source": "Collected Works of Watchman Nee, Set 1 Vol.20, Questions on the Gospel, ch.27 - https://bibleread.online/all-books-by-Watchman-Nee-and-Witness-Lee/book-questions-on-the-gospel-Watchman-Nee-read-online/27/"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "The last glorious part of our salvation is that Jesus is coming again, and in His coming our salvation will be consummated.", "source": "T. Austin-Sparks, The Salvation of God in Christ - https://Austin-Sparks.Net/english/006506.html"}], "declarations": ["I declare: Christ was once offered to bear my sins, and He will appear again unto salvation.", "I declare: I look for Christ's return with hope."], "prayer": "Lord Jesus, once offered to bear my sins, come again unto my salvation. I look for You with longing heart. Amen.", "theme_flag": "theme-based: Nee"}, {"day": 322, "ref": "Hebrews 10:25", "book": "Hebrews", "chapter": 10, "verse": 25, "text": "Not forsaking the assembling of ourselves together, as the manner of some is; but exhorting one another: and so much the more, as ye see the day approaching.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Not forsaking the assembling of ourselves together, as the manner of some is; but exhorting one another: and so much the more, as ye see the day approaching.", "source": "Darby's Synopsis, Hebrews 10"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Not forsaking the assembling of ourselves together. As the day approaches, believers draw nearer to Christ and to one another.", "source": "The Holiest of All, on Hebrews 10"}, {"name": "Watchman Nee", "short": "Nee", "comment": "If possible, all the brothers and sisters should attend this meeting.", "source": "Collected Works of Watchman Nee, Set 3 Vol.48, Messages for Building Up New Believers (1), ch.14 - https://bibleread.online/all-books-by-Watchman-Nee-and-Witness-Lee/book-collected-works-of-watchman-nee-the-set-3-vol-48-messages-for-building-up-new-believers-1-Watchman-Nee-read-online/14/"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "There is always something more of the Lord in relatedness than in isolation.", "source": "T. Austin-Sparks, The Stewardship of the Mystery, Vol.1, ch.12 - https://www.austin-sparks.net/english/books/001389.html"}], "declarations": ["I declare: I will not forsake assembling with believers, as I see the day approaching.", "I declare: I gather with God's people in light of Christ's coming."], "prayer": "Lord Jesus, as I see Your day approaching, draw me to Your people. Keep me from forsaking fellowship; knit us together in You. Amen.", "theme_flag": "theme-based: Sparks"}, {"day": 323, "ref": "Hebrews 11:1", "book": "Hebrews", "chapter": 11, "verse": 1, "text": "Now faith is the substance of things hoped for, the evidence of things not seen.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Now faith is the substance of things hoped for, the evidence of things not seen. Faith lays hold on Christ and unseen realities.", "source": "Darby's Synopsis, Hebrews 11"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Now faith is the substance of things hoped for. Faith sees the unseen Christ and lays hold on Him.", "source": "The Holiest of All, on Hebrews 11"}, {"name": "Watchman Nee", "short": "Nee", "comment": "The reason for so many defeats in the spiritual realm is because this sector of the soul has not been dealt with drastically. Faith requires the cross.", "source": "The Spiritual Man"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Faith is always an active and a positive principle.", "source": "T. Austin-Sparks, Believing What We Have Heard - https://Austin-Sparks.Net/english/004983.html"}], "declarations": ["I declare: faith is the substance of things hoped for, the evidence of things not seen.", "I declare: I walk by faith in Christ, not by sight."], "prayer": "Lord Jesus, object of my faith, substance of my hope, give me eyes to see the unseen. I believe; help my unbelief. Amen.", "theme_flag": "theme-based: Nee"}, {"day": 324, "ref": "Hebrews 12:1", "book": "Hebrews", "chapter": 12, "verse": 1, "text": "Wherefore seeing we also are compassed about with so great a cloud of witnesses, let us lay aside every weight, and the sin which doth so easily beset us, and let us run with patience the race that is set before us,", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Surrounded with a cloud of witnesses like these of chapter 11, who all declared the advantages of a life of faith in promises still unfulfilled, they ought to feel themselves impelled to follow their steps, running with patience the race set before them, and above all looking away from every difficulty to Jesus, who had run the whole career of faith, sustained by the joy that was set before Him.", "source": "Darby's Synopsis, Hebrews chapter 12 section (local file: /home/hatch/workspace/darby-commentary/text/)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Day by day our desire and our will to live wholly for God must be reaffirmed. Day by day we must wait on God afresh, to receive grace with all our heart and all our strength; with undivided purpose and in the boldness of faith, still to run in the race for God.", "source": "The Holiest of All, CXII \"Let Us Run with Patience the Race\" (biblestudytools.com)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Anything that hinders us from running fast or advancing forward is a weight.", "source": "Collected Works of Watchman Nee, Set 1, Vol. 17: Notes on Scriptural Messages (1), ch 25 (bibleread.online)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "There is a goal; there is a prize. We have been called with high purpose.", "source": "\"Looking Unto Jesus\", A Witness and A Testimony, Jul-Aug 1954 (austin-sparks.net/english/000635.html)"}], "declarations": ["I declare: I lay aside every weight and run my race with patience, looking to Jesus.", "I declare: Christ ran the whole course of faith before me, and I follow in His steps."], "prayer": "Lord Jesus, You ran the race set before You, despising the shame for the joy ahead. Teach me to lay aside every weight and run with patience. I look away from every difficulty to You alone. Amen.", "theme_flag": null}, {"day": 325, "ref": "Hebrews 12:2", "book": "Hebrews", "chapter": 12, "verse": 2, "text": "Looking unto Jesus the author and finisher of our faith; who for the joy that was set before him endured the cross, despising the shame, and is set down at the right hand of the throne of God.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "This passage presents the Lord, not as He who bestows faith, but as He who has Himself run the whole career of faith. His love for us, His obedience to His Father, surmounted all.", "source": "Darby's Synopsis, Hebrews chapter 12 section (local file: /home/hatch/workspace/darby-commentary/text/)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Looking unto Jesus, the Leader and Perfecter of our faith. He leads in the way of faith, He walked in it Himself, He opened it for us, He draws and helps us in it.", "source": "The Holiest of All, CXIII \"Looking Unto Jesus\" (biblestudytools.com)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "We should not look at anything else but should look only at Jesus. Only when we look unto Jesus can we run straight.", "source": "Collected Works of Watchman Nee, Set 1, Vol. 17: Notes on Scriptural Messages (1), ch 25 (bibleread.online)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "\"Looking unto Jesus.\" More correctly that would be stated \"looking off unto Jesus.\"", "source": "\"Looking Unto Jesus\", A Witness and A Testimony, Jul-Aug 1954 (austin-sparks.net/english/000635.html)"}], "declarations": ["I declare: I look off unto Jesus, the Author and Finisher of my faith.", "I declare: Christ endured the cross for the joy set before Him, and I draw strength from His example."], "prayer": "Lord Jesus, You are the Author and Finisher of my faith. I look off from everything else and fix my eyes on You. Perfect what You have begun in me. Amen.", "theme_flag": null}, {"day": 326, "ref": "Hebrews 13:8", "book": "Hebrews", "chapter": 13, "verse": 8, "text": "Jesus Christ the same yesterday, and to day, and for ever.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Moreover Christ never changed; He was the same yesterday, today, and for ever.", "source": "Darby's Synopsis, Hebrews chapter 13 section (local file: /home/hatch/workspace/darby-commentary/text/)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "As our faith sees and seizes hold upon this, and rests upon Him as the same for ever, it will participate in His unchangeableness; like Him it will know no change, but always be the same.", "source": "The Holiest of All, CXXIV \"Jesus Christ, the Same for Ever\" (biblestudytools.com)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "They forget, however, that Jesus Christ is the same yesterday and today, yes, even forever (Heb. 13:8).", "source": "Collected Works of Watchman Nee, Set 1, Vol. 14: The Spiritual Man (3), ch 9 (bibleread.online)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "We may have a thousand moods in as many hours, but He never changes, He is always the same.", "source": "\"All Things in Christ\", ch 8 (austin-sparks.net/english/books/002774.html)"}], "declarations": ["I declare: Jesus Christ is the same yesterday, today, and forever.", "I declare: I rest in His unchangeableness; my faith participates in His stability."], "prayer": "Lord Jesus, You never change. In a world of shifting moods and circumstances, You are always the same. Anchor my heart in Your faithfulness. Amen.", "theme_flag": null}, {"day": 327, "ref": "James 1:5", "book": "James", "chapter": 1, "verse": 5, "text": "If any of you lack wisdom, let him ask of God, that giveth to all men liberally, and upbraideth not; and it shall be given him.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "But in fact we often lack wisdom to know what we ought to do. He gives to all liberally; only we must count upon His faithfulness and upon an answer to our prayers.", "source": "Darby's Synopsis, James chapter 1 section (local file)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "they will feel urged with due fervour and faith to plead the promise: 'If any man lack wisdom, let him ask of God, who giveth to all liberally; and it shall be given him.'", "source": "Andrew Murray, The Children for Christ, Note A (biblestudytools.com/classics/murray-children-christ/note-a.html)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "It is the outcome of His sufferings, the name of His exaltation and glory; and today it is in that 'name which is above every name' that we gather and that we ask of God.", "source": "Watchman Nee, Sit, Walk, Stand, “In His Name”"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "The basic word out of those read, for our present purpose, is Matthew 11:29 - 'Take my yoke upon you, and learn of me.' Learn of me.", "source": "T. Austin-Sparks, The School of Christ, ch 1 (austin-sparks.net/english/books/001033.html)"}], "declarations": ["I declare: Christ is my wisdom, and I ask of God who gives liberally.", "I declare: I receive wisdom from above for every decision I face."], "prayer": "Lord Jesus, You are my wisdom. I ask You for wisdom today, believing that You give liberally and without reproach. Teach me Your ways. Amen.", "theme_flag": "theme-based: Sparks, theme-based: Nee"}, {"day": 328, "ref": "James 1:17", "book": "James", "chapter": 1, "verse": 17, "text": "Every good gift and every perfect gift is from above, and cometh down from the Father of lights, with whom is no variableness, neither shadow of turning.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "All good and perfect gifts come from God, and He never changes, He does nothing but good. The Father of lights, that which is darkness does not come from Him.", "source": "Darby's Synopsis, James chapter 1 section (local file)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "'Every good gift and every perfect gift is from above, and cometh from the Father of lights,' the gift of a perfect heart too.", "source": "Andrew Murray, Be Perfect, Day 5 'O Lord, Give a Perfect Heart' (biblestudytools.com/classics/murray-be-perfect/o-lord-give-a-perfect-heart.html)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "God is so wealthy that His chief delight is to give.", "source": "Watchman Nee, Sit, Walk, Stand, “God the Giver”"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "You are come to the love of God, which is unchanging and immovable. Stability is a characteristic of Divine love.", "source": "T. Austin-Sparks, The Holy City, New Jerusalem, ch 5 (austin-sparks.net/m/Books-000875.html)"}], "declarations": ["I declare: Every good gift in my life comes from my Father above.", "I declare: God never changes; His goodness toward me is constant."], "prayer": "Lord Jesus, thank You for every good gift that comes from the Father of lights. You never change, and Your goodness never fails. I receive from Your hand today. Amen.", "theme_flag": "theme-based: Sparks, theme-based: Nee"}, {"day": 329, "ref": "James 4:7", "book": "James", "chapter": 4, "verse": 7, "text": "Submit yourselves therefore to God. Resist the devil, and he will flee from you.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "There is counteracting power, if one is content to be little and humble, to be as nothing in the world. The grace and favour of God are with such an one; for He resists the proud and gives grace to the humble.", "source": "Darby's Synopsis, James chapter 4 section (local file: /home/hatch/workspace/darby-commentary/text/)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Humility toward men will be the only sufficient proof that our humility before God is real.", "source": "Humility: The Beauty of Holiness (via cotnaz.org)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Only when we submit ourselves under God's chastening can we resist the devil. On the one hand, we need to submit to God. On the other hand, we need to exercise our will daily to resist the devil.", "source": "Collected Works of Watchman Nee, Set 1, Vol. 20: Questions on the Gospel, pg 65 (bibleread.online)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "we have learned how to 'resist' effectually.", "source": "T. Austin-Sparks, \"The Cross and the Deliverance of the Mind\" (sermonindex.net)"}], "declarations": ["I declare: I submit myself to God and resist the devil, and he flees from me.", "I declare: In humility I am little before God, and His grace gives me power to resist."], "prayer": "Lord Jesus, teach me the humility that submits fully to God. As I bow low before You, give me strength to resist the devil. I stand in Your victory. Amen.", "theme_flag": "theme-based: Sparks"}, {"day": 330, "ref": "James 4:8", "book": "James", "chapter": 4, "verse": 8, "text": "Draw nigh to God, and he will draw nigh to you. Cleanse your hands, ye sinners; and purify your hearts, ye double minded.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "His heart is thus free to draw nigh to God, according to His holy nature on behalf of others.", "source": "Darby's Synopsis, James chapter 5 section (local file)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Then, prayer is a true 'drawing near' to God, an exercise of inner fellowship with Him.", "source": "Andrew Murray, The Power of the Blood of Jesus, ch 7 'Dwelling in the Holiest Through the Blood' (articles.ochristian.com/article1827.shtml)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "In order to receive God's light, we have to draw near to God. We must be one who is near God, and one who draws nigh to Him, because only God is light.", "source": "Watchman Nee, Words of Ministry, Collected Works vol. 41 (emanna.com)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "it represents God's thought that man should, on certain conditions, on a certain basis of faith, obedience, and fellowship with Him, of walking in the light as He is in the light.", "source": "T. Austin-Sparks, 'This is the Message...' (austin-sparks.net/m/Books-003746.html)"}], "declarations": ["I declare: As I draw nigh to God, He draws nigh to me.", "I declare: My heart is purified as I walk in fellowship with Christ."], "prayer": "Lord Jesus, I draw near to You today. Cleanse my hands and purify my heart. Let me walk in the light as You are in the light. Amen.", "theme_flag": "theme-based: Sparks"}, {"day": 331, "ref": "1 Peter 1:3", "book": "1 Peter", "chapter": 1, "verse": 3, "text": "Blessed be the God and Father of our Lord Jesus Christ, which according to his abundant mercy hath begotten us again unto a lively hope by the resurrection of Jesus Christ from the dead,", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "He hath begotten us again unto a living hope by the resurrection of Jesus Christ from the dead. Our hope is living because Christ is risen.", "source": "Darby's Synopsis, 1 Peter chapter 1 section (local file)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "He is born anew, born of God: he has passed from death into life.", "source": "Andrew Murray, The New Life, ch I 'The New Life' (via wnlnetwork.com PDF)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "The cross of Christ cuts off like a knife everything of the old creation, while His resurrection brings us into a new beginning.", "source": "Watchman Nee, The Present Testimony (4), ch. 11 'God Intending the Church to Live Out the Victory of Christ' (bibleread.online)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Everything went for him with the death of the Lord Jesus. In the resurrection of the Lord Jesus he got everything back in a new form, on a larger scale.", "source": "T. Austin-Sparks, The Letters of Peter, ch 1 'A Living Hope by the Resurrection' (austin-sparks.net PDF)"}], "declarations": ["I declare: I am begotten again unto a living hope by the resurrection of Jesus Christ.", "I declare: My hope is alive because Christ is risen from the dead."], "prayer": "Lord Jesus, thank You for the living hope I have in Your resurrection. You have begotten me again by Your abundant mercy. My hope is anchored in You. Amen.", "theme_flag": "theme-based: Nee"}, {"day": 332, "ref": "1 Peter 1:19", "book": "1 Peter", "chapter": 1, "verse": 19, "text": "But with the precious blood of Christ, as of a lamb without blemish and without spot:", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "If we are redeemed by the precious blood of the Lamb without spot, we are born of the incorruptible seed of the word of God, which lives and abides for ever.", "source": "Darby's Synopsis, 1 Peter chapter 1 section (local file: /home/hatch/workspace/darby-commentary/text/)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "By such words the Holy Spirit teaches us that the blood is the central power of our entire redemption. Nothing but the blood of Jesus, shed in His death for sin, can cover sin on God's side or remove it on ours.", "source": "The Power of the Blood of Jesus, ch 1 (articles.ochristian.com/article355.shtml)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "If I want to understand the value of the Blood I must accept God's valuation of it, and if I do not know something of the value set upon the Blood by God I shall never know what its value is for me.", "source": "The Normal Christian Life, ch 1 \"The Blood of Christ\" (via holdingtotruth.com)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "The Lord Jesus had an incorruptible nature and life, and that meant that there was something there which conquered death.", "source": "T. Austin-Sparks, \"The Supreme Importance of the Incorruptible,\" ch 1 (austin-sparks.net/english/books/001335.html)"}], "declarations": ["I declare: I am redeemed by the precious blood of Christ, as of a lamb without blemish.", "I declare: His incorruptible life conquered death, and I share in His victory."], "prayer": "Lord Jesus, Your precious blood redeemed me from empty ways. You are the Lamb without spot, and Your life in me is incorruptible. Thank You for the price You paid. Amen.", "theme_flag": null}, {"day": 333, "ref": "1 Peter 2:9", "book": "1 Peter", "chapter": 2, "verse": 9, "text": "But ye are a chosen generation, a royal priesthood, an holy nation, a peculiar people; that ye should shew forth the praises of him who hath called you out of darkness into his marvellous light:", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "'Ye are,' he says, 'a chosen generation, a royal priesthood, a purchased people.' These are almost the words of Exodus 19.", "source": "Darby's Synopsis, 1 Peter chapter 2 section (local file)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "We are a royal priesthood, a priestly people.", "source": "Andrew Murray, The School of Obedience, ch 6 'The Morning Watch' (ccel.org/ccel/murray/obedience.vi.html)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "May we receive more grace to be the priests to serve God and the kings to carry out God's will on the earth.", "source": "Watchman Nee, The Collected Works Set 1, Vol. 04: The Christian (2), ch 1 (bibleread.online)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "The priesthood is no longer the Jewish priesthood. It is our priesthood, it is a spiritual matter.", "source": "T. Austin-Sparks, The Letters of Peter, ch 1 (austin-sparks.net PDF)"}], "declarations": ["I declare: I am part of a royal priesthood, chosen to show forth His praises.", "I declare: Christ has called me out of darkness into His marvellous light."], "prayer": "Lord Jesus, thank You for making me part of Your royal priesthood. Help me to show forth Your praises today, living as one called out of darkness into Your marvellous light. Amen.", "theme_flag": "theme-based: Sparks"}, {"day": 334, "ref": "1 Peter 2:21", "book": "1 Peter", "chapter": 2, "verse": 21, "text": "For even hereunto were ye called: because Christ also suffered for us, leaving us an example, that ye should follow his steps:", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Christ suffered for us, leaving us an example that we should follow His steps. We are called to suffer as He suffered.", "source": "Darby's Synopsis, 1 Peter chapter 2 section (local file)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Because our union to Him sets in operation within us a heavenly life with all its powers, therefore the claim may be made in downright earnest that we should live as Christ did.", "source": "Andrew Murray, Like Christ, ch 4 'Like Christ: Our Head' (via bible.prayerrequest.com)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "A fleshly person considers the Lord's cross as a fearsome pathway, but those who love the Lord take the cross and their glory.", "source": "Watchman Nee, The Collected Works Set 1, Vol. 04: The Christian (2), ch 1 (bibleread.online)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "And it is as such that He is first of all brought to us: the One who has gone that way, the One who has proved Himself in that ordeal, the One who has been steadfast at all costs.", "source": "T. Austin-Sparks, 'Jesus Christ, The Faithful Witness...' (austin-sparks.net/english/006323.html)"}], "declarations": ["I declare: Christ suffered for me, leaving me an example to follow His steps.", "I declare: I follow Christ in His sufferings, steadfast at all costs."], "prayer": "Lord Jesus, You suffered for me and left me an example. Help me to follow in Your steps, enduring as You endured. Make me steadfast. Amen.", "theme_flag": "theme-based: Nee, theme-based: Sparks"}, {"day": 335, "ref": "1 Peter 2:24", "book": "1 Peter", "chapter": 2, "verse": 24, "text": "Who his own self bare our sins in his own body on the tree, that we, being dead to sins, should live unto righteousness: by whose stripes ye were healed.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "He bore our sins in His own body on the tree, that we being dead to sins should live unto righteousness. By His stripes we are healed.", "source": "Darby's Synopsis, 1 Peter chapter 2 section (local file)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Jesus came to deliver men from sin and sickness that He might make known the love of the Father.", "source": "Andrew Murray, Divine Healing (via booksamillion.com)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Whosoever receives the blood of Jesus Christ for the covering of sins is undoubtedly saved already. This salvation is absolutely complete and eternal.", "source": "Watchman Nee, The Collected Works Set 1, Vol. 02: The Word of the Cross, ch 10 (bibleread.online)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Why, ever and always through the Word of God in both Testaments, it is the symbol of incorruption; incorruptible life is perfect life. It is the blood as of a lamb without spot and without blemish.", "source": "T. Austin-Sparks, 'Jesus Christ, The Faithful Witness...' (austin-sparks.net/english/006323.html)"}], "declarations": ["I declare: Christ bore my sins in His own body on the tree.", "I declare: By His stripes I am healed; I live unto righteousness."], "prayer": "Lord Jesus, thank You for bearing my sins in Your own body on the tree. By Your stripes I am healed. Help me to live unto righteousness today. Amen.", "theme_flag": "theme-based: Sparks"}, {"day": 336, "ref": "1 Peter 3:18", "book": "1 Peter", "chapter": 3, "verse": 18, "text": "For Christ also hath once suffered for sins, the just for the unjust, that he might bring us to God, being put to death in the flesh, but quickened by the Spirit:", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Christ has suffered for sins once for all; let that suffice; let us suffer only for righteousness. To suffer for sin was His task; He accomplished it, and that for ever; put to death, as to His life in the flesh, but quickened according to the power of the divine Spirit.", "source": "Darby's Synopsis (public domain; local text), 1 Peter ch. 3"}, {"name": "Andrew Murray", "short": "Murray", "comment": "His bearing the cross, and entering into God's Holy Presence, was the opening up of a way in which we too could draw near.", "source": "Andrew Murray, The Cross of Christ, 'The Cross the Way to God' (library.timelesstruths.org)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Since humanity must be judged, the Son of God , even the man Jesus Christ , suffered in his spirit, soul and body on the cross for the sins of the world.", "source": "Watchman Nee, The Spiritual Man, “Calvary’s Judgment”"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Now Jesus says that of Himself: 'I am the Alpha and the Omega.' 'No one cometh unto the Father, but by Me,' said the Son (John 14:6).", "source": "T. Austin-Sparks, 'The Alpha and The Omega' (austin-sparks.net/english/000659.html)"}], "declarations": ["I declare: Christ suffered for sins, the just for the unjust, to bring me to God.", "I declare: Through Christ I have access to the Father."], "prayer": "Lord Jesus, thank You for suffering for my sins, the just for the unjust. You have brought me to God. I draw near through You today. Amen.", "theme_flag": "theme-based: Sparks"}, {"day": 337, "ref": "1 Peter 5:7", "book": "1 Peter", "chapter": 5, "verse": 7, "text": "Casting all your care upon him; for he careth for you.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "He knew what was needful. He who loved them would exalt them at the right time. He cared for them: they were to rest on Him, commit all their cares to Him.", "source": "Darby's Synopsis (public domain; local text), 1 Peter ch. 5"}, {"name": "Andrew Murray", "short": "Murray", "comment": "It is possible to cast all our care on him daily, and to enjoy deep peace in doing it.", "source": "Andrew Murray, The Prayer Life, ch 8 'Obedience: The Victorious Life' (via bible.prayerrequest.com)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "If we do not send all the anxieties to God to let Him bear them, all the anxieties of this world will crush us to death.", "source": "Watchman Nee, The Collected Works, Set 1 Vol. 18: Notes on Scriptural Messages (2), ch. 4"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Well, let us sit down in the armchair of His love and be at rest, and then get to work. You cannot work unless you have a background rest, and rest does not spring firstly from truth.", "source": "T. Austin-Sparks, 'Abounding in Love' (austin-sparks.net/english/001722.html)"}], "declarations": ["I declare: I cast all my care upon Christ, for He cares for me.", "I declare: I rest in His love and work from that rest."], "prayer": "Lord Jesus, I cast all my cares upon You today, for You care for me. Let me rest in Your love and work from that place of rest. Amen.", "theme_flag": "theme-based: Sparks"}, {"day": 338, "ref": "2 Peter 1:3", "book": "2 Peter", "chapter": 1, "verse": 3, "text": "According as his divine power hath given unto us all things that pertain unto life and godliness, through the knowledge of him that hath called us to glory and virtue:", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "This divine power has given to us all that pertains to life and godliness. How precious it is to know that faith can use this divine power, realised in the life of the soul, directing it towards glory as its end!", "source": "Darby's Synopsis (public domain; local text), 2 Peter ch. 1"}, {"name": "Andrew Murray", "short": "Murray", "comment": "What He claims or demands, He works Himself by that same power. All He gives, He gives with power.", "source": "Andrew Murray, 'As Your Strength' (bibleportal.com sermon)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "God will not give me humility or patience or holiness or love as separate gifts of His grace. He has given only one gift to meet all our need: His Son Christ Jesus.", "source": "Watchman Nee, The Normal Christian Life, ch. 14 'Christ Our Life' (ccel.org/ccel/nee/normal/normal.xiv.ii.html)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "'has granted unto us all things that pertain unto life and godliness', 'precious and exceeding great promises'. All that inheritance is because of God's faithfulness to those who put faith in Him.", "source": "T. Austin-Sparks, The Letters of Peter, ch 7 'God's Responsibility and Ours' (austin-sparks.net PDF)"}], "declarations": ["I declare: His divine power has given me all things for life and godliness.", "I declare: I have everything I need through knowing Christ."], "prayer": "Lord Jesus, thank You that Your divine power has given me all things that pertain to life and godliness. Help me to know You more today. Amen.", "theme_flag": "theme-based: Nee"}, {"day": 339, "ref": "2 Peter 3:9", "book": "2 Peter", "chapter": 3, "verse": 9, "text": "The Lord is not slack concerning his promise, as some men count slackness; but is longsuffering to us-ward, not willing that any should perish, but that all should come to repentance.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "It is not that the Lord is slack concerning the promise of His return, but that He is still exercising grace, not wishing any to perish, but that all should come to repentance.", "source": "Darby's Synopsis (public domain; local text), 2 Peter ch. 3"}, {"name": "Andrew Murray", "short": "Murray", "comment": "it counts that the long-suffering of the Lord is salvation, waiting and hasting unto the coming of its Lord to fulfil His promise.", "source": "Andrew Murray, With Christ in the School of Prayer, Lesson 16 'Speedily, though bearing long' (ccel.org/ccel/murray/prayer.XVI.html)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "He is not willing to see any perish. He desires that all men be saved.", "source": "Watchman Nee, The Collected Works, Set 1 Vol. 06: The Christian (4), ch. 1 (bibleread.online)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Now Jesus was saying: 'That is the love of God for man, for sinful man, for man who has gone away from God. God's heart just longs to have that man back again.'", "source": "T. Austin-Sparks, The Holy City, New Jerusalem, ch 5 (austin-sparks.net/m/Books-000875.html)"}], "declarations": ["I declare: The Lord is not slack concerning His promise; He is longsuffering toward me.", "I declare: God's heart longs for all to come to repentance."], "prayer": "Lord Jesus, thank You for Your longsuffering toward me. You are not willing that any should perish. Help me to share Your heart for the lost. Amen.", "theme_flag": "theme-based: Murray, theme-based: Sparks, theme-based: Nee"}, {"day": 340, "ref": "1 John 1:7", "book": "1 John", "chapter": 1, "verse": 7, "text": "But if we walk in the light, as he is in the light, we have fellowship one with another, and the blood of Jesus Christ his Son cleanseth us from all sin.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "But we can say that the blood of Jesus Christ cleanses us perfectly from all sin.", "source": "Darby's Synopsis, 1 John chapter 1 section (local file: /home/hatch/workspace/darby-commentary/text/)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "God's countenance beams with pleasure and approval as the penitent sinner draws near to Him, and He invites him to intimate fellowship.", "source": "The Power of the Blood of Jesus (via goodreads.com/author/quotes/13326.Andrew_Murray)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "The blood of Jesus his Son cleanses us from every sin.", "source": "The Normal Christian Life, ch 1 \"The Blood of Christ\" (bibleportal.com/sermon/Watchman-Nee/the-blood-of-christ)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "As we do so the blood of Jesus Christ His Son cleanseth [Greek: keeps on cleansing] us from all sin.", "source": "T. Austin-Sparks, \"The Throne in Heaven\" (bibleportal.com/sermon/T-Austin-Sparks/the-throne-in-heaven)"}], "declarations": ["I declare: As I walk in the light, the blood of Jesus Christ cleanses me from all sin.", "I declare: I have fellowship with God, and His righteousness meets me as a friend."], "prayer": "Lord Jesus, I walk in Your light. Your blood keeps cleansing me from all sin. Draw me into deeper fellowship with You. Amen.", "theme_flag": null}, {"day": 341, "ref": "1 John 1:9", "book": "1 John", "chapter": 1, "verse": 9, "text": "If we confess our sins, he is faithful and just to forgive us our sins, and to cleanse us from all unrighteousness.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "If, on the other hand, we have even committed sin and all, being judged according to the light, is confessed, He is faithful and just to forgive us, and to cleanse us from all iniquity.", "source": "Darby's Synopsis, 1 John chapter 1 section (local file)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Too often the confession of sin is superficial, and often it is quite neglected. Few Christians realize how necessary it is to be in earnest about the matter, or feel that an honest confession of sin gives power to live the life of victory over sin.", "source": "Andrew Murray, 'Confession of Sin' (sermonindex.net/pdf-text/txt/a/andrew-murray--confession-of-sin.txt)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "In case we fail, we must examine ourselves, confess our sin, and resort to the cleansing of the precious blood.", "source": "Watchman Nee, The Spiritual Man, “Words of Exhortation”"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "He was showing that there is no religious system, there are no religious observances, which can make sin other than it is or get rid of it.", "source": "T. Austin-Sparks, 'Jesus Christ, The Faithful Witness...' (austin-sparks.net/english/006323.html)"}], "declarations": ["I declare: If I confess my sins, He is faithful and just to forgive me.", "I declare: The blood of Jesus cleanses me from all unrighteousness."], "prayer": "Lord Jesus, I confess my sins to You today. Thank You that You are faithful and just to forgive me and cleanse me from all unrighteousness. Amen.", "theme_flag": "theme-based: Sparks"}, {"day": 342, "ref": "1 John 2:1", "book": "1 John", "chapter": 2, "verse": 1, "text": "My little children, these things write I unto you, that ye sin not. And if any man sin, we have an advocate with the Father, Jesus Christ the righteous:", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "We have an Advocate with the Father, One who carries on our cause for us on high. When communion is interrupted, when we have sinned, Christ intercedes for us.", "source": "Darby's Synopsis, 1 John chapter 2 section (local file)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Christ teaches us to pray not only by example, instruction, command, and promises but also by showing us that He is our ever-living intercessor.", "source": "Andrew Murray (attributed; bibleportal.com)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Through the Lord Jesus’ death and by His becoming the propitiation for our sins, He has become our Advocate with the Father.", "source": "Watchman Nee, The Collected Works, Set 3 Vol. 49: Messages for Building Up New Believers (2), ch. 21"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "It is all a matter of righteousness, the righteousness of God, but that righteousness is by faith.", "source": "T. Austin-Sparks, 'Jesus Christ, The Faithful Witness...' (austin-sparks.net/english/006323.html)"}], "declarations": ["I declare: I have an Advocate with the Father, Jesus Christ the righteous.", "I declare: Christ ever lives to intercede for me."], "prayer": "Lord Jesus, thank You for being my Advocate with the Father. When I sin, You intercede for me. I rest in Your righteousness today. Amen.", "theme_flag": "theme-based: Murray, theme-based: Sparks"}, {"day": 343, "ref": "1 John 3:1", "book": "1 John", "chapter": 3, "verse": 1, "text": "Behold, what manner of love the Father hath bestowed upon us, that we should be called the sons of God: therefore the world knoweth us not, because it knew him not.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "What a love is that which the Father has bestowed on us, that we should be called children! We are children of God: this is our present sure and known position; we are born of God.", "source": "Darby's Synopsis, 1 John chapter 3 section (local file)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "What is given must be received, otherwise it does not profit. If the first great deed of God's love is the gift of His Son, the first work of man must be to receive this Son.", "source": "Andrew Murray, The New Life, ch VIII 'Children of God' (via yumpu mirror)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "For men to become the sons of God is the special kindness of God.", "source": "Watchman Nee, The Collected Works Set 1, Vol. 02: The Word of the Cross, ch 7 (bibleread.online)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "'hath made us accepted in the beloved' (Eph. 1:6. A.V.). 'Us in the beloved'; God giving Himself to us in the same way as He gave Himself to His Son.", "source": "T. Austin-Sparks, His Great Love, ch 2 'God's Beloved' (austin-sparks.com/english/books/001269.html)"}], "declarations": ["I declare: Behold what manner of love the Father has bestowed on me, that I should be called a child of God.", "I declare: I am a child of God; this is my present sure position."], "prayer": "Father, thank You for the great love You have bestowed on me. I am Your child, born of You. Help me to live as Your beloved today. Amen.", "theme_flag": "theme-based: Sparks"}, {"day": 344, "ref": "1 John 3:16", "book": "1 John", "chapter": 3, "verse": 16, "text": "Hereby perceive we the love of God, because he laid down his life for us: and we ought to lay down our lives for the brethren.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "We know love by this, that He laid down His life for us; we ought to lay down ours for the brethren.", "source": "Darby's Synopsis, 1 John chapter 3 section (local file)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Love is not an attribute, but the very essence of His nature, the center around which all His glorious attributes revolve. Love needs an object to give itself away to, in whom it can lose itself, with whom it can make itself one.", "source": "Andrew Murray, Abide in Christ (via lacedwithgrace.com)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "The real loving of the Lord and loving of the brothers comes from not loving the self.", "source": "Watchman Nee, The Collected Works Set 1, Vol. 12: The Spiritual Man (1), ch 15 (bibleread.online)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "It is not our nature to lay down our lives. Remember that that very phrase about laying down the life can equally well be translated 'we ought to lay down our souls for the brethren' (1 John 3:16).", "source": "T. Austin-Sparks, Followers of the Lamb, ch 3 'The Pathway of the Lamb' (austin-sparks.net/m/Books-000807.html)"}], "declarations": ["I declare: I know love because Christ laid down His life for me.", "I declare: I lay down my life for the brethren in love."], "prayer": "Lord Jesus, thank You for laying down Your life for me. Teach me to love the brethren as You have loved me, laying down my life for them. Amen.", "theme_flag": null}, {"day": 345, "ref": "1 John 4:8", "book": "1 John", "chapter": 4, "verse": 8, "text": "He that loveth not knoweth not God; for God is love.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "He who loves not does not know God. We must possess the nature that loves in order to know what love is. He then who does not love does not know God, for God is love.", "source": "Darby's Synopsis, 1 John chapter 4 section (local file)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Unless he loves, he does not know God. Only love can know God.", "source": "Andrew Murray, The Inner Life, Day 12 (bible.com reading plan)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Who is love? God. Who has loved us? God. What is love? God sending His Son as a propitiation.", "source": "Watchman Nee, The Collected Works Set 1, Vol. 07: The Christian (5), ch 28 (bibleread.online)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "In the Bible gold is always the symbol of the Divine nature, and the supreme thing in that nature is love. It is this same John who says: 'God is love' (1 John 4:8), and everything that is of God is measured according to the standard of Divine love.", "source": "T. Austin-Sparks, The Holy City, New Jerusalem, ch 5 'The Love of God' (austin-sparks.net/m/Books-000875.html)"}], "declarations": ["I declare: God is love, and I know Him because I love.", "I declare: Everything in my life is measured by the standard of divine love."], "prayer": "Lord Jesus, You are love itself. Teach me to love as You love, that I may truly know God. Let Your love flow through me today. Amen.", "theme_flag": null}, {"day": 346, "ref": "1 John 4:9", "book": "1 John", "chapter": 4, "verse": 9, "text": "In this was manifested the love of God toward us, because that God sent his only begotten Son into the world, that we might live through him.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "God, he has said, is love; and this love has been manifested towards us in that He has given His only Son, that we might live through Him.", "source": "Darby's Synopsis, 1 John chapter 4 section (local file)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "The characteristic of love is that it does not seek its own. Love finds its happiness in giving to others; it sacrifices itself entirely for others.", "source": "Andrew Murray, Daily in His Presence (goodreads.com/author/quotes/13326.Andrew_Murray)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Where is love manifested? In His sending of His Son into the world that we might have life and live through Him.", "source": "Watchman Nee, The Collected Works Set 1, Vol. 07: The Christian (5), ch 28 (bibleread.online)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "that eternal, mighty, mysterious love of God became fully embodied in the person of His Son.", "source": "T. Austin-Sparks, His Great Love, ch 1 (austin-sparks.net/m/Books-001268.html)"}], "declarations": ["I declare: God's love is manifested in sending His Son that I might live through Him.", "I declare: I live through Christ who was sent for me."], "prayer": "Father, thank You for manifesting Your love by sending Your only Son. I live through Him today. Let Your love be perfected in me. Amen.", "theme_flag": "theme-based: Sparks"}, {"day": 347, "ref": "1 John 4:19", "book": "1 John", "chapter": 4, "verse": 19, "text": "We love him, because he first loved us.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "We cannot know and enjoy love to us without loving. We love God because He first loved us.", "source": "Darby's Synopsis, 1 John chapter 4 section (local file, note [21])"}, {"name": "Andrew Murray", "short": "Murray", "comment": "'As the Father hath loved me, so I have loved you!' What He says of it must give force to His invitation.", "source": "Andrew Murray, Abide in Christ, Day 22 'And In His Love' (articles.ochristian.com/article1759.shtml)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "He loves first, and then we can love. Before He has loved, we cannot love.", "source": "Watchman Nee, The Collected Works, Set 2 Vol. 28: The Gospel of God (1), ch. 14 (bibleread.online)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "'We love, because he first loved us.' That is the whole of John's argument in that letter.", "source": "T. Austin-Sparks, His Great Love, ch 2 'God's Beloved' (austin-sparks.com/english/books/001269.html)"}], "declarations": ["I declare: I love Him because He first loved me.", "I declare: My love for God is a response to His great love for me."], "prayer": "Lord Jesus, thank You for loving me first. Because You loved me, I can love You in return. Let my love for You grow today. Amen.", "theme_flag": "theme-based: Murray, theme-based: Nee"}, {"day": 348, "ref": "2 John 1:3", "book": "2 John", "chapter": 1, "verse": 3, "text": "Grace be with you, mercy, and peace, from God the Father, and from the Lord Jesus Christ, the Son of the Father, in truth and love.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "The apostle loved this elect lady, 'in the truth;' as did also all those who had known the truth, and that for the truth's sake. He wished her blessing in truth and in love.", "source": "Darby's Synopsis (public domain; local text), 2 John"}, {"name": "Andrew Murray", "short": "Murray", "comment": "No, wandering one; as it was Jesus who drew you when He spake 'Come,' so it is Jesus who keeps you when He says 'Abide.' The grace to come and the grace to abide are alike from Him alone.", "source": "Andrew Murray, Abide in Christ (via goodreads.com)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Praise God, He is the Lawgiver on the Throne, and He is the Lawkeeper in my heart. He who gave the Law, Himself keeps it.", "source": "Watchman Nee, The Normal Christian Life, ch. 13 'Our End Is God's Beginning' (ccel.org/ccel/nee/normal/normal.xiii.iv.html)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "our very existence in relation to God is a love existence, a love relationship.", "source": "T. Austin-Sparks, His Great Love, ch 2 (austin-sparks.com/english/books/001269.html)"}], "declarations": ["I declare: Grace, mercy, and peace are mine from God the Father and the Lord Jesus Christ.", "I declare: I live in truth and love, kept by His grace."], "prayer": "Lord Jesus, thank You for grace, mercy, and peace from the Father and from You. Keep me in truth and love today. Amen.", "theme_flag": "theme-based: Murray, theme-based: Sparks, theme-based: Nee"}, {"day": 349, "ref": "3 John 1:11", "book": "3 John", "chapter": 1, "verse": 11, "text": "Beloved, follow not that which is evil, but that which is good. He that doeth good is of God: but he that doeth evil hath not seen God.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "It is their duty to do good. 'He that doeth good is of God.'", "source": "Darby's Synopsis (public domain; local text), 3 John"}, {"name": "Andrew Murray", "short": "Murray", "comment": "The sense of helplessness, and the abiding to which it compels, leads to true fruitfulness and diligence in good works.", "source": "Andrew Murray, The True Vine, ch 13 'You Can Do Nothing' (ccel.org/ccel/murray/true_vine/true_vine.xv.html)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "However, after we are saved, the Lord will give us a new life, which will spontaneously do good.", "source": "Watchman Nee, The Collected Works, Set 1 Vol. 06: The Christian (4), ch. 7 (bibleread.online)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Get the internal troubles settled, then you can get on with the work.", "source": "T. Austin-Sparks, The Cross and the City of God, ch 3 (austin-sparks.net/english/books/002923.html)"}], "declarations": ["I declare: I follow that which is good, for he that doeth good is of God.", "I declare: My good works flow from abiding in Christ."], "prayer": "Lord Jesus, help me to follow that which is good today. Let my works show that I am Yours. Settle my heart that I may do Your work. Amen.", "theme_flag": "theme-based: Murray, theme-based: Sparks, theme-based: Nee"}, {"day": 350, "ref": "Jude 1:24", "book": "Jude", "chapter": 1, "verse": 24, "text": "Now unto him that is able to keep you from falling, and to present you faultless before the presence of his glory with exceeding joy,", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Unto Him, he says, who is able to keep us from falling, and to present us unspotted before the presence of His glory with exceeding joy.", "source": "Darby's Synopsis (public domain; local text), Jude"}, {"name": "Andrew Murray", "short": "Murray", "comment": "This word of God through James describes what man is, even the Christian, when he is not kept by grace. It reminds us to put away all confidence in ourselves.", "source": "Andrew Murray, The New Life, ch 18 'Stumblings' (via github.com/patrickmcgrath29/thegoodland)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Jude 24 says that God is the One who is able to guard us from stumbling.", "source": "Watchman Nee, The Collected Works, Set 2 Vol. 41: Conferences, Messages, and Fellowship (1), ch. 19"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "All these passages and many others teach us that this work of establishing is a working principle. Today the Lord's people need establishing, for on every hand there is going on a great falling away because of the pressure of the enemy.", "source": "T. Austin-Sparks, The Cross and the City of God, ch 3 'Strength, Stability, Light, Sovereignty' (austin-sparks.net/english/books/002923.html)"}], "declarations": ["I declare: Christ is able to keep me from falling.", "I declare: He will present me faultless before His glory with exceeding joy."], "prayer": "Lord Jesus, thank You that You are able to keep me from falling. Present me faultless before Your glory. I trust in Your keeping power today. Amen.", "theme_flag": null}, {"day": 351, "ref": "Jude 1:25", "book": "Jude", "chapter": 1, "verse": 25, "text": "To the only wise God our Saviour, be glory and majesty, dominion and power, both now and ever. Amen.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "To Him who can accomplish this, preserving us from every kind of fall, our epistle ascribes all glory and dominion throughout all ages.", "source": "Darby's Synopsis (public domain; local text), Jude"}, {"name": "Andrew Murray", "short": "Murray", "comment": "THAT the Father may be glorified in the Son: it is to this end that Jesus on His throne in glory will do all we ask in His Name.", "source": "Andrew Murray, With Christ in the School of Prayer, Lesson 20 'That the Father may be glorified' (ccel.org/ccel/murray/prayer.XX.html)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "All we have to do is praise and rejoice.", "source": "Watchman Nee, The Collected Works, Set 2 Vol. 41: Conferences, Messages, and Fellowship (1), ch. 19"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "The throne is central, and is the manifestation of the might of God in weakness. The 'Little Lamb' in the midst of the throne is greater than all the might of hell and sin.", "source": "T. Austin-Sparks, The Cross and the City of God, ch 3 (austin-sparks.net/english/books/002923.html)"}], "declarations": ["I declare: To the only wise God my Saviour be glory and majesty, dominion and power.", "I declare: Christ on the throne is greater than all the might of hell and sin."], "prayer": "Lord Jesus, to You be glory and majesty, dominion and power, both now and ever. You reign on the throne, greater than all. Amen.", "theme_flag": "theme-based: Murray, theme-based: Sparks, theme-based: Nee"}, {"day": 352, "ref": "Revelation 1:5", "book": "Revelation", "chapter": 1, "verse": 5, "text": "And from Jesus Christ, who is the faithful witness, and the first begotten of the dead, and the prince of the kings of the earth. Unto him that loved us, and washed us from our sins in his own blood,", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "He has made us kings and priests to God and His Father: to Him be glory! He loved us, has cleansed us, and given us a place with Himself.", "source": "Darby's Synopsis (public domain; local text), Revelation ch. 1"}, {"name": "Andrew Murray", "short": "Murray", "comment": "His blood is the sign, the measure, yes, the impartation of His love.", "source": "Andrew Murray, The Power of the Blood of Jesus, ch 10 'Heavenly Joy Through the Blood' (swartzentrover.com)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "The blood of His Son is still continually cleansing us.", "source": "Watchman Nee, The Collected Works, Set 1 Vol. 06: The Christian (4), ch. 11"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "The faithful Martyr, the One Who gave His life for His testimony, Who was faithful unto death in His witness.", "source": "T. Austin-Sparks, 'Jesus Christ, The Faithful Witness...' (austin-sparks.net/english/006323.html)"}], "declarations": ["I declare: Jesus Christ is the faithful witness who loved me and washed me from my sins.", "I declare: His blood is the proof and measure of His love for me."], "prayer": "Lord Jesus, faithful witness, thank You for loving me and washing me from my sins in Your own blood. I trust in Your faithful testimony today. Amen.", "theme_flag": null}, {"day": 353, "ref": "Revelation 1:8", "book": "Revelation", "chapter": 1, "verse": 8, "text": "I am Alpha and Omega, the beginning and the ending, saith the Lord, which is, and which was, and which is to come, the Almighty.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "He is God, the first and the last, Alpha and Omega; the complete circle of position from John's day to the end.", "source": "Darby's Synopsis (public domain; local text), Revelation ch. 1"}, {"name": "Andrew
