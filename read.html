and expect from Him most confidently whatever teaching you may need for a life to the glory of the Father.", "source": "Abide in Christ"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Our sins had first to be dealt with, and this was effected by the precious blood of Christ.", "source": "The Normal Christian Life"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "It is Christ in that fullness. The door is essential, but it is what it leads to that justifies going in.", "source": "God's Supreme Interest in Man"}], "declarations": ["I declare: He came not to be served, but to serve.", "I declare: I follow His example of service."], "prayer": "Lord Jesus, You gave Your life a ransom for many. Teach me to serve as You served.", "theme_flag": "theme-based: Murray, Nee, Sparks"}, {"day": 162, "ref": "Mark 11:24", "book": "Mark", "chapter": 11, "verse": 24, "text": "Therefore I say unto you, What things soever ye desire, when ye pray, believe that ye receive them, and ye shall have them.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "The Lord makes them feel also what it is that, in the eyes of God, gives true value to the offerings that were brought to the temple. In chapter xiii. the Lord takes up much more the service of the apostles in the circumstances that would surround them, than the development of the dispensations and the ways of God with respect to the kingdom — a point of view more presented in Matthew, who treats of this subject. It will be observed, that the disciples' question takes only a general view of the subject which pre-occupied them. They ask when the judgment upon the temple and all these things shall be fulfilled.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "It may help to give definiteness to our thought, if we each take a definite request in regard to which we would fain learn to pray believingly. Or, perhaps better still, we might all unite and take the one thing that has been occupying our attention. We have been speaking of failure in prayer; why should we not take as the object of desire and supplication the \"grace of supplication,\" and say, I want to ask and receive in faith the power to pray just as, and as much as, my God expects of me? Let us meditate on our Lord's words, in the confidence that He will teach us how to pray for this blessing. 1.", "source": "The Ministry of Intercession"}, {"name": "Watchman Nee", "short": "Nee", "comment": "God's will reaches only as far as our prayers have reached.", "source": "The Present Testimony (4)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Ask the Lord to give you spiritual understanding.", "source": "That They May Be One, Even As We Are One Vol. I"}], "declarations": ["I declare: What I desire in prayer, believing, I receive.", "I declare: I pray with faith, and I have."], "prayer": "Lord Jesus, teach me to pray believing. Let me receive what I ask in faith.", "theme_flag": "theme-based: Sparks"}, {"day": 163, "ref": "Mark 13:31", "book": "Mark", "chapter": 13, "verse": 31, "text": "Heaven and earth shall pass away: but my words shall not pass away.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "They ask when the judgment upon the temple and all these things shall be fulfilled. And from verses 9-13, although some circumstances found in Matthew xxiv. are included, the passage relates even more to that which is said in Matthew x. It speaks of the service which the disciples would accomplish in the midst of Israel, and in testimony against persecuting authorities, the gospel being preached in all nations before the end came. They were, as preachers, to fill the place which Jesus had occupied among the people, only that the testimony was to extend much farther.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "In meditating, therefore, upon these utterances of Christ, containing as they do the very essence of His teaching, the very concentration of His love, let us, at the outset, put away all tendency to doubt. Let us not allow ourselves so much as to question whether such erring disciples as we are can be enabled to attain the holiness to which we are called through a close and intimate union with our Lord. If there be any impossibility, any falling short of the proposed blessedness, it will arise from the lack of earnest desire on our part.", "source": "Abide in Christ"}, {"name": "Watchman Nee", "short": "Nee", "comment": "God's Word leads His people into a realm more profound than one of mere sensation; it brings them into the realm of the eternal spirit.", "source": "The Spiritual Man ('The Dividing of Spirit and Soul')"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "That is what the Word of God does. It brings heaven down here.", "source": "Features of Zion"}], "declarations": ["I declare: His words shall not pass away.", "I declare: I stand on His unchanging word."], "prayer": "Lord Jesus, Your word is settled forever. I anchor my soul to its eternal truth.", "theme_flag": "theme-based: Murray, Nee, Sparks"}, {"day": 164, "ref": "Mark 16:15", "book": "Mark", "chapter": 16, "verse": 15, "text": "And he said unto them, Go ye into all the world, and preach the gospel to every creature.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "He tells them to go into all the world and preach the gospel to every creature. It is no longer specifically the gospel of the kingdom. Whosoever throughout the world believed and joined Christ by baptism should be saved ; he who believed not should be condemned. It was a question of salvation or condemnation — the believer saved, lie who refused the message condemned. Moreover, if anyone was convinced of the truth but refused to unite with the disciples confessing the Lord, his case would be so much the worse. Therefore it is said, \" he who believeth and is baptised.\"", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "They accepted the command and passed it on to those who through them believed on His name. And within a generation, simple men, whose names we do not even know, had preached the gospel in Antioch and Rome and the regions beyond. The command was passed on, and taken up into the heart and life, as meant for all ages, as MEANT FOR EVERY DISCIPLE. The command is for us, too, for each one of us. There is in the Church of Christ no privileged clan to which alone belongs the honor, nor any servile clan on which alone rests the duty, of carrying the gospel to every creature.", "source": "The School of Obedience"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Only the blood of the Lord Jesus enables us to draw near to God.", "source": "Notes on Scriptural Messages (3)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "The gospel I preached is not something that man made up.", "source": "Open Windows, Dec 24 (The Risen Lord and Things Which Cannot Be Shaken)"}], "declarations": ["I declare: I go into all the world and preach the gospel.", "I declare: The gospel is for every creature."], "prayer": "Lord Jesus, the world needs Your gospel. Send me, and give me boldness to proclaim it.", "theme_flag": "theme-based: Murray, Sparks"}, {"day": 165, "ref": "Luke 1:37", "book": "Luke", "chapter": 1, "verse": 37, "text": "For with God nothing shall be impossible.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Until He delivered up the kingdom to God the Father, He should exercise a royalty that nothing could dispute ; which He would deliver up (all things being fultilled) to God, but the royal glory of which should never be tarnished in His hands. Such should be the child l)orn — truly, though miraculously, born as man. To those who could understand His name it was Jehovah the Saviour. He should be King over the house of Jacob accordmg to a power that should never decay and never fail, until blended with the eternal power of God as God.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "God gives us Christ, and in Him hid the treasures of wisdom and knowledge. O let us be content to possess Christ, to dwell in Him, to make Him our life, and only in a deeper searching into Him, to search and find the knowledge we desire. Such knowledge is life indeed. Therefore, believer, abide in Jesus as your wisdom, and expect from Him most confidently whatever teaching you may need for a life to the glory of the Father. In all that concerns your spiritual life, abide in Jesus as your wisdom.", "source": "Abide in Christ"}, {"name": "Watchman Nee", "short": "Nee", "comment": "We had tasted the authority of the name that is above every name, the name that has power in heaven and earth and hell.", "source": "Sit, Walk, Stand"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "If Christ is present, which means nothing else than that God is present, anything is possible at any moment.", "source": "Knowing God in Christ"}], "declarations": ["I declare: With God nothing shall be impossible.", "I declare: I believe God for the impossible."], "prayer": "Lord Jesus, nothing is too hard for You. I bring my impossibilities to You in faith.", "theme_flag": "theme-based: Murray, Nee"}, {"day": 166, "ref": "Luke 2:11", "book": "Luke", "chapter": 2, "verse": 11, "text": "For unto you is born this day in the city of David a Saviour, which is Christ the Lord.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Two things here present themselves. The angel who comes to the shepherds of Judea announces to them the fulfilment of the promises of God to Israel. The choir of angels celebrate in their heavenly chorus of praise all the real import of this wondrous event. \" Unto you,\" says the heavenly messenger who visits the poor shepherds, \"is born this day in the city of David a Saviour, which is Christ the Lord.\" This was proclaiming good tidings to them and to all the people.* But in the birth of the Son of man, God manifest in the flesh, the accomplishment of the incarnation had far deeper importance than this.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "God gives us Christ, and in Him hid the treasures of wisdom and knowledge. O let us be content to possess Christ, to dwell in Him, to make Him our life, and only in a deeper searching into Him, to search and find the knowledge we desire. Such knowledge is life indeed. Therefore, believer, abide in Jesus as your wisdom, and expect from Him most confidently whatever teaching you may need for a life to the glory of the Father. In all that concerns your spiritual life, abide in Jesus as your wisdom.", "source": "Abide in Christ"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Our God sent His Son to the earth and sowed Him as a seed.", "source": "General Messages (1)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "He voluntarily lived in a state of absolute dependence on Him. He refused to have anything in Himself.", "source": "Open Windows, Dec 25 (Christ Our All)"}], "declarations": ["I declare: Unto us a Saviour is born, Christ the Lord.", "I declare: I rejoice in His coming."], "prayer": "Lord Jesus, my Saviour, born in Bethlehem. I worship You who came to save me.", "theme_flag": "theme-based: Murray, Sparks"}, {"day": 167, "ref": "Luke 2:14", "book": "Luke", "chapter": 2, "verse": 14, "text": "Glory to God in the highest, and on earth peace, good will toward men.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "What a purely divine thought, that God has become man ! What supremacy of good over evil ! What wisdom in drawing nigh to the heart II. of man and the heart of man back to Him ! What fitness in addressing man ! What maintenance of the holiness of God ! What nearness to the heart of man, what participation in his wants, what experience of his condition ! But beyond all, God above the evil in grace, and in that grace visiting this defiled world to make Himself known as He had never yet been known ! The second effect of the presence of Him who manifested God on the earth is, that peace should be there.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "There can be no real prosperity or progress in a nation, a home, or a soul, unless there be peace. As not even a machine can do its work unless it be in rest, secured on a good foundation, quietness and assurance are indispensable to our moral and spiritual well-being, Sin had disturbed all our re lations; we were out of harmony with ourselves, with men, and with God. The first requirement of a, salvation that should really bring blessedness to us was peace, And peace can only come with right. Where everything is as God would have it, in God’s order and in harmony with His will, there alone can peace reign.", "source": "Abide in Christ"}, {"name": "Watchman Nee", "short": "Nee", "comment": "The Lord Jesus has 'made peace through the blood of His cross'.", "source": "CW"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Make every effort to keep the unity of the Spirit through the bond of peace.", "source": "The Testimony of the Christ"}], "declarations": ["I declare: Glory to God in the highest.", "I declare: Peace on earth, good will toward men."], "prayer": "Lord Jesus, glory to God for Your coming. Let Your peace fill my heart and my home.", "theme_flag": "theme-based: Murray, Sparks"}, {"day": 168, "ref": "Luke 4:18", "book": "Luke", "chapter": 4, "verse": 18, "text": "The Spirit of the Lord is upon me, because he hath anointed me to preach the gospel to the poor; he hath sent me to heal the brokenhearted, to preach deliverance to the captives, and recovering of sight to the blind, to set at liberty them that are bruised,", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "He returns, in the power of the Spirit, into Galilee,* and His fame spreads through all the region round about. He presents Himself in this character : \" The Spirit of Jehovah is upon me, because he hath anointed me to preach the gospel to the poor ; he hath sent me to heal the broken-hearted, .... to preach the acceptable year of Jehovah.\" Here He stops. That which follows in the prophet, respecting the deliverance of Israel by the judgment which avenges them of their enemies, is omitted by the Lord. Now Jesus does not announce promises, but their fulfilment in grace by His own presence.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "He is still the Spirit of God striving with man, and seeking his deliverance. Wherever He is not hindered by ignorance or selfishness. He looks out from the heart as His temple for the work He has to do on the world around, and makes it willing and bold to do that work; to testify against sin, and for Jesus the Saviour from sin. He does this very specially as being the Spirit of the crucified and exalted Christ. For what purpose was it that Ke, received the Spirit without measure ? ' The Spirit of the Lord is upon me, because He anointed me to preach good tidings to the poor. He hath sent me to proclaim release to the captives.'", "source": "The Spirit of Christ"}, {"name": "Watchman Nee", "short": "Nee", "comment": "We who are mere nonentities can have the same Spirit resting upon us.", "source": "The Normal Christian Life"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "If it is true that you and I have been anointed of the Holy Spirit, our presence in this world ought to register something positive for God.", "source": "Open Windows, Jun 28 (The Holy Spirit as the Spirit of Anointing)"}], "declarations": ["I declare: The Spirit of the Lord is upon me.", "I declare: He anoints me to preach the gospel."], "prayer": "Lord Jesus, anointed One, anoint me with Your Spirit. Let me preach good tidings to the poor.", "theme_flag": "theme-based: Murray, Nee"}, {"day": 169, "ref": "Luke 6:31", "book": "Luke", "chapter": 6, "verse": 31, "text": "And as ye would that men should do to you, do ye also to them likewise.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "The way to attain it, and to see clearly in the midst of evil, is to put evil away from oneself. Afterwards, in general, its oiun fruit characterised every tree. Coming around Christ to hear Him was not the question, but that He should be so precious to their hearts that they would put aside every obstacle and practically obey Him. Let us sum up these things which we have been considering. He acts in a power which dispels evil, because He finds it there, and He is good ; and God alone is good. He reaches the conscience, and calls souls to Himself.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "It had pleased God, in His abundant mercy, to bring my mind into such a state, that I was willing to carry out into my life whatever I should find in the Scriptures. I could say, \"I will do His will,\" and it was on that account, I believe, that I saw which \"doctrine is of God.\"--And I would observe here, by the way, that the passage to which I have just alluded (John vii. 17) has been a most remarkable comment to me on many doctrines and precepts of our most holy faith. For instance: \"Resist not evil; but whosoever shall smite thee on thy right cheek, turn to him the other also.", "source": "With Christ in the School of Prayer"}, {"name": "Watchman Nee", "short": "Nee", "comment": "God has come down to earth personally and borne our sins.", "source": "The Gospel of God (1)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "In God's purpose there is no room for personal interests. We have to deny ourselves.", "source": "Open Windows, Feb 5 (Christ Our All)"}], "declarations": ["I declare: I do unto others as I would have them do unto me.", "I declare: I walk in love toward all."], "prayer": "Lord Jesus, teach me Your golden rule. Let me treat others with the love You show me.", "theme_flag": "theme-based: Murray, Sparks"}, {"day": 170, "ref": "Luke 6:38", "book": "Luke", "chapter": 6, "verse": 38, "text": "Give, and it shall be given unto you; good measure, pressed down, and shaken together, and running over, shall men give into your bosom. For with the same measure that ye mete withal it shall be measured to you again.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Marvellous fact ! Moreover the power of God present in grace did not allow misery to exist, because it was the day of grace. But this was setting aside Judaism. That was the obligation of man to God, Christ was the manifestation of God in grace to men.* Availing Himself of the rights of supreme goodness, and displaying a power that authorised His pretension to assert those rights, He heals, in full synagogue, the * This is an important point. A part in the rest of God is the distinctive privilege of saints — of God's people.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "The first time He had spoken of the Father who is to be found in secret, and rewards openly, and had given us the pattern prayer (Matt. vi. 5-15). Here He wants to teach us what in all Scripture is considered the chief thing in prayer: the assurance that prayer will be heard and answered. Observe how He uses words which mean almost the same thing, and each time repeats the promise so distinctly: Ye shall receive, ye shall find, it shall be opened unto you;' and then gives as ground for such assurance the law of the kingdom: He that asketh, receiveth; he that seeketh, findeth; to him that knocketh, it shall be opened.'", "source": "With Christ in the School of Prayer"}, {"name": "Watchman Nee", "short": "Nee", "comment": "The secret to receiving is giving.", "source": "The Christian (4): Spiritual Teachings"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "His object is that they should know Him. This is the all-governing end of all His dealings with us.", "source": "On Knowing the Lord"}], "declarations": ["I declare: I give, and it shall be given unto me.", "I declare: I sow generously and reap abundantly."], "prayer": "Lord Jesus, You give good measure, pressed down and running over. Make me a cheerful giver.", "theme_flag": "theme-based: Murray, Sparks"}, {"day": 171, "ref": "Luke 9:23", "book": "Luke", "chapter": 9, "verse": 23, "text": "¶ And he said to them all, If any man will come after me, let him deny himself, and take up his cross daily, and follow me.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "He will have the disciples do it. Nevertheless the power that performs it is all His own. The disciples see nothing beyond that which their eyes can estimate. But, if He who feeds them is Jehovah, He ever takes His place Himself in the dependence of the nature He had assumed. He retires with His disciples, and there, afar from the world. He prays. And, as in the two remarkable cases* of the descent of the Holy Ghost * Observe also here, that it is not only in the case of acts of power, or in that of testimony to the glory of His Person in answer to His prayer, that these prayers are offered.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "These thoughts suggest the great need of the Christian life. Jesus said, ' If any man will come after me, let him deny himself, and follow me.' Many a one follows Jesus without denying himself. And there is nothing that more needs denying than our own wisdom, the energy of the fleshly mind, as it exerts itself in the things of God. Let us learn that in all our intercourse with God, in His word or prayer, in every act of worship, the first step ought to be a solemn act of abnega- tion, in which we deny our power to understand God's word, or to speak our words to Him, without the special Divine leading of the Holy Spirit.", "source": "The Spirit of Christ"}, {"name": "Watchman Nee", "short": "Nee", "comment": "If the Lord received death while on the earth, even more, should not we also?", "source": "Study on Revelation"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "A truly crucified people are never in danger of the world. The world has no place with a crucified man or woman.", "source": "Daily Open Windows"}], "declarations": ["I declare: I take up my cross daily and follow Him.", "I declare: I deny myself every day."], "prayer": "Lord Jesus, daily I take up my cross. Give me strength for today's denial and today's following.", "theme_flag": "theme-based: Murray"}, {"day": 172, "ref": "Luke 10:27", "book": "Luke", "chapter": 10, "verse": 27, "text": "And he answering said, Thou shalt love the Lord thy God with all thy heart, and with all thy soul, and with all thy strength, and with all thy mind; and thy neighbour as thyself.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "In Gethsemane we have the Lord's conflict brought out more fully in Luke than anywhere ; but on the cross we have His superiority to the sufferings He was in. There is no expression of them : He is above them. It is not, as in John, the divine side of the picture. There in Gethsemane we have no agony, but when He names Hmiself, they go backward and fall to the ground. On the cross, no \" My God, my God, why hast thou forsaken me ?\" but He delivers up Plis own spirit to God. This is not so in Luke. In Gethsemane we have the Man of sorrows, a man feeling in all its depths what was before Him, and looking to His Father.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "The one is: We miss the compassion of Jesus, which gave rise to this request for prayer. When believers learn that to love their neighbours as themselves, that to live entirely for God's glory in their fellow-men, is the Father's first commandment to His redeemed ones, they will accept of the perishing ones as the charge entrusted to them by their Lord. And, accepting them not only as a field of labour, but as the objects of loving care and interest, it will not be long before compassion towards the hopelessly perishing will touch their heart, and the cry ascend with an earnestness till then unknown: Lord! send labourers.", "source": "With Christ in the School of Prayer"}, {"name": "Watchman Nee", "short": "Nee", "comment": "The Lord demands our love to Him.", "source": "Study on Revelation"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "The Father loves the Son and shows Him everything He is doing.", "source": "Open Windows, Mar 14 (Christ Our All)"}], "declarations": ["I declare: I love God with all my heart, soul, strength, and mind.", "I declare: I love my neighbour as myself."], "prayer": "Lord Jesus, fill me with love for God and for others. Let love be the mark of my life.", "theme_flag": "theme-based: Murray, Sparks"}, {"day": 173, "ref": "Luke 11:9", "book": "Luke", "chapter": 11, "verse": 9, "text": "And I say unto you, Ask, and it shall be given you; seek, and ye shall find; knock, and it shall be opened unto you.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Chapter xii. puts the disciples into this place of testimony by the power of the Holy Ghost, and with the world opposed to them, after the Lord's departure. It is the word and the Holy Ghost, instead of the Messiah on the earth. They were neither to fear opposition, nor to trust in themselves, but to fear God and trust to His help ; and the Holy Ghost would teach them what to say. All things should be revealed. God reaches the soul: man can only touch the body. Here that which goes beyond present promises, the connection of the soul with God, is put forward. It is coming out from Judaism to be before God.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "But I speedily discovered that the gates of heaven were not fully opened to me. Often I was inclined to retire in despair. But the sight of the sick ones, who could find help nowhere, gave me no rest. I thought of the word of the Lord: \"Ask, and it shall be given you\" (Luke xi. 9, 10). And farther, I thought that if the Church and her ministers had, through unbelief, sloth, and disobedience lost what was needed for overcoming of the power of Satan, it was just for such times of leanness and famine that the Lord had spoken the parable of the friend at midnight and his three loaves.", "source": "With Christ in the School of Prayer"}, {"name": "Watchman Nee", "short": "Nee", "comment": "We know that God answers prayers.", "source": "The Normal Christian Faith"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Our prayer life has got to be on a heavenly basis. The Lord would have prayer touching things heavenly.", "source": "Daily Open Windows"}], "declarations": ["I declare: I ask and receive, I seek and find.", "I declare: I knock and it is opened unto me."], "prayer": "Lord Jesus, You invite me to ask. I come boldly, seeking and knocking, believing I shall receive.", "theme_flag": null}, {"day": 174, "ref": "Luke 12:32", "book": "Luke", "chapter": 12, "verse": 32, "text": "Fear not, little flock; for it is your Father’s good pleasure to give you the kingdom.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "It was the Father's good pleasure to give them the kingdom. Strangers and pilgrims here, their treasure was to be in heaven ; and thus their heart would be there also.* Besides this, they were to wait for the Lord. Three things were to influence their souls : the Father would give them the kingdom, their heart's treasure in heaven, and the expectation of the Lord's return. Until the Lord should come, they were required to watch — to have their lamps burning; their whole position should manifest the effect of the continual expectation of the Lord — should express this expectation.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "He prays for its being one in Christ, as a witness to the world that Christ, who hath wrought such a wonder as to make love triumph over selfishness and separation, is indeed the Son of God sent from heaven. Every believer ought to pray much that the unity of the Church, not in external organizations, but in spirit and in truth, may be made manifest. So much for the matter of the prayer. Now for its mode. Jesus says, FATHER! I WILL.' On the ground of His right as Son, and the Father's promise to Him, and His finished work, He might do so. The Father had said to Him, Ask of me, and I will give Thee.'", "source": "With Christ in the School of Prayer"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Thank the Father, for He has accepted us and has given us the eternal life!", "source": "CW"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "It is true that we may have a tremendous amount of knowledge, and yet coming into Christ has got to learn the ABC in spiritual things.", "source": "Foundations"}], "declarations": ["I declare: Fear not, little flock.", "I declare: It is the Father's good pleasure to give me the kingdom."], "prayer": "Lord Jesus, I fear not. My Father delights to give me the kingdom.", "theme_flag": "theme-based: Murray, Sparks"}, {"day": 175, "ref": "Luke 15:7", "book": "Luke", "chapter": 15, "verse": 7, "text": "I say unto you, that likewise joy shall be in heaven over one sinner that repenteth, more than over ninety and nine just persons, which need no repentance.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "The shepherd seeks (and the woman also) until he finds, because he has an interest in the matter. The sheep, wearied with its wanderings, has not to take one step in returning. The shepherd lays it on his shoulders and carries it home. He takes the whole charge, happy to recover his sheep. This is the mind of heaven, whatever the heart of man on earth may be. It is the work of Christ, the Good Shepherd. The woman sets before us the pains which God takes in His love; so that it is more the work of the Spirit, which is represented by that of the woman. The light is brought — she sweeps XV. the house until she finds' the piece she had lost.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "God gives us Christ, and in Him hid the treasures of wisdom and knowledge. O let us be content to possess Christ, to dwell in Him, to make Him our life, and only in a deeper searching into Him, to search and find the knowledge we desire. Such knowledge is life indeed. Therefore, believer, abide in Jesus as your wisdom, and expect from Him most confidently whatever teaching you may need for a life to the glory of the Father. In all that concerns your spiritual life, abide in Jesus as your wisdom.", "source": "Abide in Christ"}, {"name": "Watchman Nee", "short": "Nee", "comment": "The most joyful thing in a Christian's life is to have fellowship with the Lord.", "source": "The Christian (2): Meditations on Revelation"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "I am the good shepherd. Here is the great I AM saying what He is.", "source": "Features of Zion"}], "declarations": ["I declare: There is joy in heaven over one sinner that repents.", "I declare: I was lost and am found."], "prayer": "Lord Jesus, Good Shepherd, You sought me. Let heaven rejoice over every sinner who returns.", "theme_flag": "theme-based: Murray, Nee, Sparks"}, {"day": 176, "ref": "Luke 19:10", "book": "Luke", "chapter": 19, "verse": 10, "text": "For the Son of man is come to seek and to save that which was lost.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "It will be remarked that the genealogy of Christ is * I do not speak here of the union of the church with Christ in heaven, but His taking His place with the remnant, who come to God through grace, led by the efficacy of His word, and by the power of the Spirit. This is the reason I apprehend that we find all the people baptised, and then Jesus comes and is associated with them. here traced, not to Abraham and David, that He should be the heir of the promises after the flesh, but to Adam ; in order to exhibit the true Son of God a man on earth, where the first Adam lost his title, such as it was.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "As Christ seeks the lost sheep until He find it, Gods seeks intercessors. (Note F.) _God seeks intercessors._--He will not, He cannot, take the work out of the hands of His Church. And so He comes, calling and pleading in many ways. Now by a man whom He raises up to live a life of faith in His service, and to prove how actually and abundantly He answers prayer. Then by the story of a church which makes prayer for souls its starting-point, and bears testimony to God's faithfulness. Sometimes in a mission which proves how special prayer can meet special need, and bring down the power of the Spirit.", "source": "The Ministry of Intercession"}, {"name": "Watchman Nee", "short": "Nee", "comment": "From Genesis to Revelation, we can see that God has always been seeking man.", "source": "General Messages (1)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Christ is all that we need for a life which is glorifying to Him. It is what Christ is.", "source": "The Essential Newness of the New Creation"}], "declarations": ["I declare: The Son of man came to seek and save the lost.", "I declare: I was lost, and He found me."], "prayer": "Lord Jesus, Seeker of the lost, thank You for finding me. Use me to seek others.", "theme_flag": "theme-based: Murray, Sparks"}, {"day": 177, "ref": "Luke 24:26", "book": "Luke", "chapter": 24, "verse": 26, "text": "Ought not Christ to have suffered these things, and to enter into his glory?", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "To drink it is but perfect obedience, instead of being the power of Satan. But it must be drunk in reality ; and upon the cross Jesus, the Saviour of our souls, enters into the second phase of His sufferings. He goes under death as the judgment of God, the separation of the soul from the light of His countenance. All that a soul which enjoyed nothing except communion with God could sutler iri being deprived of it, the Lord suffered according to the perfect measure of the communion which was interrupted. Yet He gave glory to God — \"But thou art holy, O thou that inhabitest the praises of Israel.\"", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "The thought of the Lord of Glory being glorified within us by the Spirit of Glory looks very simple when once understood. And yet it is a deep spiritual mystery only reached in the way Christ reached His glory — through conformity to His sufferings and the fellowship of His cross. Each new impartation out of the glory must be according to the riches of God's glory and the mighty strengthening of His Holy Spirit— a most real and direct act of God's ineffable grace continuing and increasing to the soul the gift of His love.", "source": "The Spirit of Christ"}, {"name": "Watchman Nee", "short": "Nee", "comment": "He is most eager to forgive us; He 'runs' to forgive us.", "source": "Notes on Scriptural Messages (3)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "We are going to have a path of suffering if we are in fellowship with the Lord Jesus.", "source": "Open Windows, Oct 10 (Suffering and Glory)"}], "declarations": ["I declare: Christ suffered and entered into His glory.", "I declare: I share His sufferings and His glory."], "prayer": "Lord Jesus, You suffered before You entered glory. Teach me that the cross comes before the crown.", "theme_flag": "theme-based: Murray"}, {"day": 178, "ref": "Luke 24:27", "book": "Luke", "chapter": 24, "verse": 27, "text": "And beginning at Moses and all the prophets, he expounded unto them in all the scriptures the things concerning himself.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "They were to preach repentance and remission of sins to all nations, beginning at Jerusalem. The Jew, a child of wrath, even as others, must come in on the same ground. The testimony had a higher source, although it was said \" to the Jew first.\" But, secondly, something more therefore was needed for the accomplishment of this mission, that is, power. They were to tarry at Jerusalem until they were endued with power from on high. Jesus would send the Holy Ghost whom He had promised, of whom the prophets also had spoken. been before ! Handle nie and see that it is I myself.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "From the commencement of His public life to its close He lived by the Word of God. It is written' was the sword of the Spirit with which He conquered Satan. The Spirit of the Lord God is upon Me': this word of Scripture was the consciousness with which He opened His preaching of the gospel. That the Scripture might be fulfilled' was the light in which He accepted all suffering, and even gave Himself to the death. After the resurrection He expounded to the disciples in all the Scriptures the things concerning Himself.' In Scripture He had found God's plan and path for Him marked out. He gave Himself to fulfill it.", "source": "The School of Obedience"}, {"name": "Watchman Nee", "short": "Nee", "comment": "The resurrection of Christ is the beginning of everything in the new creation.", "source": "Conferences, Messages, and Fellowship (2): Conference in Amoy, October 1936"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "That is what the Word of God does. It brings heaven down here.", "source": "Features of Zion"}], "declarations": ["I declare: He expounds the scriptures concerning Himself.", "I declare: I see Christ in all the scriptures."], "prayer": "Lord Jesus, open the scriptures to me. Show me Yourself in Moses and all the prophets.", "theme_flag": "theme-based: Murray, Sparks"}, {"day": 179, "ref": "John 1:1", "book": "John", "chapter": 1, "verse": 1, "text": "In the beginning was the Word, and the Word was with God, and the Word was God.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "The Spirit pursues this subject, giving us details, historically, of the latter part. We may remark here — and the point is of importance— how the Spirit passes from the divine and eternal nature of the Word who was before all things, to the manifestation, in this world, of the Word made flesh in the Person of Jesus. All the ways of God, the dispensations, His government of the world, are passed over in silence. In beholding Jesus on the earth we are in immediate connection with Him as existing before the world was. Only He is introduced by John, and that which is found in the world is recognised as created.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Forgive me, my God, that I have so much sought to apprehend Thy words, which are Spirit and Life, in the power of human thought and the fleshly mind. I have been so slow to learn that the flesh profiteth nothing. I do desire to learn it now. r O my Father ! give me the Spirit of wisdom, grant me the mighty workings of the Spirit, that I may know how deeply spiritual each word of Tliine is, and how spiritual things can only be spiritually discerned. Teach me in all my intercourse with Thy word to deny the flesh and the fleshly mind, to wait in deep humility and faith for the inward working of the Spirit to quicken the word.", "source": "The Spirit of Christ"}, {"name": "Watchman Nee", "short": "Nee", "comment": "They should allow the word of God to penetrate deep within them.", "source": "The Christian Life and Warfare"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Here is the great I AM saying what He is. And then you notice how frequently He links with us.", "source": "Features of Zion"}], "declarations": ["I declare: In the beginning was the Word.", "I declare: The Word was with God, and the Word was God."], "prayer": "Lord Jesus, eternal Word, I worship You who was before all things.", "theme_flag": "theme-based: Sparks"}, {"day": 180, "ref": "John 1:14", "book": "John", "chapter": 1, "verse": 14, "text": "And the Word was made flesh, and dwelt among us, (and we beheld his glory, the glory as of the only begotten of the Father,) full of grace and truth.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Th& Word, who was with God and who was God, was made flesh ; and He who was beheld on the earth had the glory of an only Son with the Father. Two things are the result. Grace (what greater grace ? It is love itself that is revealed, and towards sinners) and truth, that are not declared, but come, in Jesus Christ. The true relation of all things with God is shewn, and their departure from it. This is the '■- It is indeed the source of all blessing ; but the condition of man was such, that without His death no one would have had any part in the blessing.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "But it is only the soul wholly yielded to the teaching of the Holy Spirit who thus knows ' the Lord of Glory.' The thought of the Lord of Glory being glorified within us by the Spirit of Glory looks very simple when once understood. And yet it is a deep spiritual mystery only reached in the way Christ reached His glory — through conformity to His sufferings and the fellowship of His cross. Each new impartation out of the glory must be according to the riches of God's glory and the mighty strengthening of His Holy Spirit— a most real and direct act of God's ineffable grace continuing and increasing to the soul the gift of His love.", "source": "The Spirit of Christ"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Only the One who is the highest can condescend to be the lowest.", "source": "The Christian (4): Spiritual Teachings"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "He refused to have anything in Himself. Everything He needed He drew from heaven.", "source": "Open Windows, Dec 25 (Christ Our All)"}], "declarations": ["I declare: The Word was made flesh and dwelt among us.", "I declare: I beheld His glory, full of grace and truth."], "prayer": "Lord Jesus, God manifest in flesh, I marvel that You dwelt among us.", "theme_flag": "theme-based: Sparks"}, {"day": 181, "ref": "John 1:29", "book": "John", "chapter": 1, "verse": 29, "text": "¶ The next day John seeth Jesus coming unto him, and saith, Behold the Lamb of God, which taketh away the sin of the world.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "John baptised indeed unto repentance ; but there was already One, unknown, among them, who, coming after him, was yet his superior, whose shoe's latchet he Avas not worthy to unloose. We have next the direct testimony of John, when he sees Jesus coming to him. He points Him out, not as the Messiah, but according to the whole extent of His work as enjoyed by us in the everlasting salvation He has accomplished, and the full result of the glorious work by which it was accomplished. He is the Lamb of God, one whom God alone could furnish, and was for God, and according to His mind, who takes away the sin (not the sins) of the world.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "The Lord Jesus Christ came down from Heaven as the Son of God's love. \"God so loved the world that He gave His only begotten Son\" (John 3:16). God's Son came to show what love is, and He lived a life of love here upon earth in fellowship with His disciples, in compassion over the poor and miserable, in love even to His enemies, and He died the death of love. And when He went to Heaven, whom did He send down? The Spirit of love, to come and banish selfishness and envy and pride, and bring the love of God into the hearts of men. \"The fruit of the Spirit is love.\" And what was the preparation for the promise of the Holy Spirit?", "source": "Absolute Surrender"}, {"name": "Watchman Nee", "short": "Nee", "comment": "The Lord propitiated our sin so that we could be saved through His blood.", "source": "Notes on Scriptural Messages (2)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "It is quite safe to trust yourself to a crucified man or woman.", "source": "Daily Open Windows"}], "declarations": ["I declare: Behold the Lamb of God.", "I declare: He takes away the sin of the world."], "prayer": "Lord Jesus, Lamb of God, thank You for taking away my sin.", "theme_flag": "theme-based: Murray, Sparks"}, {"day": 182, "ref": "John 3:3", "book": "John", "chapter": 3, "verse": 3, "text": "Jesus answered and said unto him, Verily, verily, I say unto thee, Except a man be born again, he cannot see the kingdom of God.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "He sanctifies the assembly by cleansing it through the washing of water by the word. \" Ye are clean through the word which I have spoken unto you.\" It is therefore the mighty word of God which, since man must be born again in the principle and source of his moral being, judges, as being death, all that is of the flesh.* But there is in fact the communication of a new life ; that which is born of the Spirit is spirit, is not flesh, has its nature from the Spirit. It is not the Spirit that would be an incarnation ; but this new life is spirit. It partakes of the nature of its origin. Without this, man cannot enter into the kingdom.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "THE LEADING OF THE SPIRIT. 187 for His temple. It is as the Indwelling Spirit, filling, sanctifying, and ruling the heart and life, that He enlightens and leads.^ In the study of what the leading of the Spirit means, it is of the first importance to grasp this thought in all its bearings. It is only the spiritual mind can discern spiritual things, can receive the leadings of the Spirit. The mind must grow spiritual to become capable of spiritual guidance. Paul said to the Corinthians, that because, though born again, they were still carnal, as babes in Christ, he had not been able to teach them spiritual truth.", "source": "The Spirit of Christ"}, {"name": "Watchman Nee", "short": "Nee", "comment": "A man receives life by believing that He is the Christ and the Son of God.", "source": "CW, 'God's center'"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "We are coming to a living Person; we believe that He is!", "source": "Daily Open Windows"}], "declarations": ["I declare: I am born again.", "I declare: I see the kingdom of God."], "prayer": "Lord Jesus, by Your Spirit I am born anew. Let me live as a child of the kingdom.", "theme_flag": "theme-based: Murray, Sparks"}, {"day": 183, "ref": "John 3:16", "book": "John", "chapter": 3, "verse": 16, "text": "¶ For God so loved the world, that he gave his only begotten Son, that whosoever believeth in him should not perish, but have everlasting life.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Christ, lifted up from the earth, draws all men to Him. But if (owing to man's state of alienation and guilt) it needed that the Son of man should be lifted up from the earth, in order that whosoever believes in Him should have everlastinglife, there was another aspect of this same glorious fact ; God had so loved the world that He had given His only-begotten Son, that whosoever believes in Him should have everlasting life. On the cross we see the necessity morally of the death of the Son of man ; we see the ineffable gift of the Son of God. These two truths unite in the common object of the gift of eternal life to all believers.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "The Lord Jesus Christ came down from Heaven as the Son of God's love. \"God so loved the world that He gave His only begotten Son\" (John 3:16). God's Son came to show what love is, and He lived a life of love here upon earth in fellowship with His disciples, in compassion over the poor and miserable, in love even to His enemies, and He died the death of love. And when He went to Heaven, whom did He send down? The Spirit of love, to come and banish selfishness and envy and pride, and bring the love of God into the hearts of men. \"The fruit of the Spirit is love.\" And what was the preparation for the promise of the Holy Spirit?", "source": "Absolute Surrender"}, {"name": "Watchman Nee", "short": "Nee", "comment": "God created man and redeemed him for Christ.", "source": "CW, 'God's center'"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Do you want to know Him as Father? The Lord Jesus carried in His heart a great longing.", "source": "The Alpha and the Omega"}], "declarations": ["I declare: God so loved the world.", "I declare: I believe in Him and have everlasting life."], "prayer": "Lord Jesus, Son of God's love, I believe in You. Thank You for everlasting life.", "theme_flag": "theme-based: Sparks"}, {"day": 184, "ref": "John 3:17", "book": "John", "chapter": 3, "verse": 17, "text": "For God sent not his Son into the world to condemn the world; but that the world through him might be saved.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "For God sent His Son into the ivorld, not to condemn it, but to save it. But salvation is by faith ; and he who believes in the coming of the Son, puttingall things now to the test, is not condemned (his state is decided thereby) ; he who believes not is condemned already, he has not believed in the only-begotten Son of God, he has manifested his condition. And this is the thing that God lays to their charge. Light is come into the world, and they have loved. darkness because their w^orks were evil. Could there be a more just subject of condemnation ?", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "And on the last night he had spoken of the Spirit dwelling in them, witnessing with them, having come to them to convince the world. All these thoughts of what this coming of the Holy Spirit would be was connected in their mind with the work they would have to do and the power for it. When our Lord gathered up all His teaching in the promise, ' Ye shall receive the power of the Holy Ghost coming upon you, and shall be my witnesses,' it must have been to them the simple summing up of what thej^ 136 THE SPIRIT OF CHRIST.", "source": "The Spirit of Christ"}, {"name": "Watchman Nee", "short": "Nee", "comment": "God sent His Son to die for us and laid all our sins on Him.", "source": "Notes on Scriptural Messages (2)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Christ is all that we need. It is what Christ is, what we have in the new creation.", "source": "The Essential Newness of the New Creation"}], "declarations": ["I declare: God sent His Son not to condemn, but to save.", "I declare: Through Him I am saved."], "prayer": "Lord Jesus, my Saviour, not my condemner. I rest in Your salvation.", "theme_flag": "theme-based: Murray, Sparks"}, {"day": 185, "ref": "John 4:14", "book": "John", "chapter": 4, "verse": 14, "text": "But whosoever drinketh of the water that I shall give him shall never thirst; but the water that I shall give him shall be in him a well of water springing up into everlasting life.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Such i& the heavenly fruit of the mission of Christ, wherever He is received.* His heart lays it open (it was revealing Himself), pours it out into the heart of one who was its object ; consoling itself for the unbelief of the Jews (rejecting the end of promise) by presenting the true consolation of grace to the misery that needed it. This is the true comfort of love, which is pained when unable to act. The floodgates of grace are lifted up by the misery which that grace waters. He makes manifest that which God is in grace ; and the God of grace was there.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "God’s way is ever first to give us, even though it be but as a seed, the thing itself, the life and the power, and then the knowledge. Man secks the knowledge first, and often, alas! never gets beyond it. God gives us Christ, and in Him hid the treasures of wisdom and knowledge. O let us be content to possess Christ, to dwell in Him, to make Him our life, and only in a deeper searching into Him, to search and find the knowledge we desire. Such knowledge is life indeed. Therefore, believer, abide in Jesus as your wisdom, and expect from Him most confidently whatever teaching you may need for a life to the glory of the Father.", "source": "Abide in Christ"}, {"name": "Watchman Nee", "short": "Nee", "comment": "If you would have asked, He would have given you living water.", "source": "Notes on Scriptural Messages (2)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Remember that you are in the Land; you are in Christ; you have Him as your Rest.", "source": "The Essential Newness of the New Creation"}], "declarations": ["I declare: I drink of His living water and never thirst.", "I declare: His well springs up into everlasting life."], "prayer": "Lord Jesus, give me this living water. Let it spring up in me unto everlasting life.", "theme_flag": "theme-based: Murray, Sparks"}, {"day": 186, "ref": "John 5:24", "book": "John", "chapter": 5, "verse": 24, "text": "Verily, verily, I say unto you, He that heareth my word, and believeth on him that sent me, hath everlasting life, and shall not come into condemnation; but is passed from death unto life.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "The Lord (praised be His name !) replies, he that hears His word, and believes Him who sent Him (believes the Father by hearing Christ), has everlasting life (such is the quickening power of His word), and shall not come into judgment. He is passed from death into life. Simple and wonderful testimony !* The judgment will glorify the Lord in the case of those who have despised Him here. The possession of eternal life, that they may not come into judgment, is the portion of those who believe. The Lord then points out two distinct periods, in which the power that the Father committed to Him as having come down to the earth, is to be exercised.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Read it the second time to see if it is really in accordance with God's word: take some, if not all, of the texts that are adduced on each point, and ponder them in order to come under the full force of what God has said on the point. Let your God, through His word, teach you what you must think and believe concerning Him and His will. Read it then the third time to find out the corresponding places, not in the Bible, but in your own life, in order to know if your life has been in harmony with the New Life, and to direct your life for the future entirely according to God's word.", "source": "The New Life"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Since this life is God's and cannot die, it follows that everyone born anew into possessing this life is said to have eternal life.", "source": "quoted at"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "That deliverance is found to be mainly along the line of grace, brought into experience by reason of a vital relationship with the Lord Jesus.", "source": "We Beheld His Glory - Volume 1"}], "declarations": ["I declare: I hear the word of Christ and I have eternal life.", "I declare: I have passed from death unto life in Jesus."], "prayer": "Lord Jesus, I hear Your word today and I believe. Thank You for eternal life and for bringing me from death into life. Amen.", "theme_flag": null}, {"day": 187, "ref": "John 6:35", "book": "John", "chapter": 6, "verse": 35, "text": "And Jesus said unto them, I am the bread of life: he that cometh to me shall never hunger; and he that believeth on me shall never thirst.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "He is the object set before faith; He is to be fed upon. Life is found in Him; he that eats Him shall live by Him, and shall never hunger.", "source": "Darby's Synopsis, John, chapter 6 section"}, {"name": "Andrew Murray", "short": "Murray", "comment": "The one great work for the soul, who truly longs to live entirely and only by Christ, is to eat Him, daily to feed on Him, to make Him his own.", "source": "Andrew Murray, quoted in Worthy Christian Books, Andrew Murray archives"}, {"name": "Watchman Nee", "short": "Nee", "comment": "He is the bread of life. He is also the thirst-quenching water.", "source": "Watchman Nee, The Normal Christian Faith, ch.5 (ministrysamples.org)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "I am hungry, spiritually starved; He is Bread, and I need never hunger.", "source": "T. Austin-Sparks, Open Windows: The Shalls of Christ (austin-sparks.net)"}], "declarations": ["I declare: Jesus is the bread of life and I shall never hunger.", "I declare: Christ satisfies my soul completely."], "prayer": "Lord Jesus, You are the bread of life. Feed my soul today and satisfy my deepest hunger. Amen.", "theme_flag": null}, {"day": 188, "ref": "John 6:37", "book": "John", "chapter": 6, "verse": 37, "text": "All that the Father giveth me shall come to me; and him that cometh to me I will in no wise cast out.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Be it who it might, He would in no wise cast them out. Whomsoever the Father brought Him He would receive for life eternal.", "source": "Darby's Synopsis, John, chapter 6 section"}, {"name": "Andrew Murray", "short": "Murray", "comment": "The rest is in Christ, and not something He gives apart from Himself, and so it is only in having Him that the rest can really be kept and enjoyed.", "source": "Andrew Murray, Writings of Andrew Murray, Vol. 1 (sermonindex.net)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "He will never cast out those who come to Him.", "source": "The Collected Works of Watchman Nee, Set 1, Vol. 06: The Christian (4), ch. 10"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "You, then, are a perfect gift from the Father to the Son.", "source": "T. Austin-Sparks, Following The Lamb (3), Towards the Mark, Vol. 2, No. 4 (Austin-Sparks.Net/mags/ttm02-4.html)"}], "declarations": ["I declare: I come to Jesus and He will never cast me out.", "I declare: The Father has given me to Christ and I am secure."], "prayer": "Lord Jesus, I come to You today. Thank You for receiving me and never casting me out. Amen.", "theme_flag": "theme-based: Darby, Murray"}, {"day": 189, "ref": "John 6:47", "book": "John", "chapter": 6, "verse": 47, "text": "Verily, verily, I say unto you, He that believeth on me hath everlasting life.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Life is found in Him ; he that eats Him shall live by Him, and shall never hunger. But the multitude did not believe in Him; in fact, the mass of Israel, as such, were not in question. Those that the Father gave Him should come unto Him. He was there the passive object, so to say, of faith. It is no longer to whom He will, but to receive those whom the Father brouo-ht Him. Therefore, be it who it might, He would in no wise cast them out: enemy, scoffer. Gentile, they would not come if the Father had not sent them. The Messiah was there to do His Father's will, and whomsoever the Father brought Him He would receive for life eternal.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "What hinders this power and the reception of the new spiritual life is chiefly two things. The one is ignorance of its nature, its laws and workings. Man, even the Christian, has of himself not the least conception of the new life that comes from God: it surpasses all his thoughts. His own perverted thoughts of the way to serve and to please God, namely, by what he does and is, are so deeply rooted in him, that, although he thinks that he understands and receives God's word, he yet thinks humanly and carnally on Divine things. (Jos. 3:4; Matt.", "source": "The New Life"}, {"name": "Watchman Nee", "short": "Nee", "comment": "If you accept the Lord Jesus as the sin offering, you do not have to hope to be saved because you have eternal life already.", "source": "The Christian (4): Spiritual Teachings"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Life triumphant over death is something which we have completely when we first receive the Lord Jesus.", "source": "We Beheld His Glory - Volume 1"}], "declarations": ["I declare: I believe on Jesus and I have everlasting life.", "I declare: My faith in Christ gives me life eternal."], "prayer": "Lord Jesus, I believe on You. Thank You for the gift of everlasting life. Amen.", "theme_flag": null}, {"day": 190, "ref": "John 7:38", "book": "John", "chapter": 7, "verse": 38, "text": "He that believeth on me, as the scripture hath said, out of his belly shall flow rivers of living water.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Not only should his thirst be quenched, but from the inner man of his soul should flow forth streams of living water. So that coming to Him by faith to satisfy the need of their soul, not only should the Holy Ghost be in them a well of water springing up into everlasting life, but living water should also flow forth from them in abundance to refresh all those wha thirsted. Observe here, that Israel drank water in the Avilderness before they could keep the feast of taber* The harvest is discriminating judgment, there are tares and wheat.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Just as in Jesus the perfect union of God and man had been effected and finally completed when He sat down upon the throne, and He so entered on a new stage of existence, a glory hitherto unknown, so too, now, a new era has commenced in the life and the work of the Spirit. He can now come down to witness of the perfect union of the Divine and the human, and in becoming our life, to make us partakers of it. TJiere is noiv the Spirit of the glorified Jesus : He hath poured Him forth ; we have received Him to stream into us, to stream through us, and to stream forth from us in rivers of blessino-.", "source": "The Spirit of Christ, Fifth Day"}, {"name": "Watchman Nee", "short": "Nee", "comment": "They will not flow out of only special Christian or the apostles Paul, Peter, or John, but out of all those who believe, out of ordinary men like us.", "source": "The Overcoming Life"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "It is not only what is in the believer, but what is going out from him to others.", "source": "Divine Life - Life in Christ"}], "declarations": ["I declare: I believe on Jesus and rivers of living water flow from me.", "I declare: The Holy Spirit flows through my life to others."], "prayer": "Lord Jesus, let the rivers of living water flow from me today. Fill me with Your Spirit. Amen.", "theme_flag": null}, {"day": 191, "ref": "John 8:12", "book": "John", "chapter": 8, "verse": 12, "text": "¶ Then spake Jesus again unto them, saying, I am the light of the world: he that followeth me shall not walk in darkness, but shall have the light of life.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "It was not a law that made demands, and condemned ; or that promised life on obedience to its precepts. It was the Life itself which was there in His Person, and that life was the light of men, convincing them, and, perhaps, judging them ; but it was as light. Thus Jesus says here — in contrast with the law, brought by those who could not stand before the light — \" I am the light of the world \" (not merely of the Jews). For in this Gospel we have what Christ is essentially in His Person, whether as God, the Son come from the Father, or Son of man — not what God was in special dealings with the Jews.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Just as at the creation the light was first called into existence, that in it all God’s other works might have their life and beauty, 80 in our text wisdom is mentioned first as the treasury in which are to be found the three precious gifts that follow. ‘The life is the light of man; it is in revealing to us, and making us behold the glory of God in His own face, that’ Christ makes us partakers of eternal life. It was by the tree of knowledge that sin came; it is through the know- ledge that Christ gives that salvation comes, He is made of God unto us wisdom. Jn Him are hid all the treasures of wisdom and knowledge.", "source": "Abide in Christ, Day 7"}, {"name": "Watchman Nee", "short": "Nee", "comment": "he plainly says that we are the world's light, whether we bring our illumination out into places where men can see it, or hide it away from them.", "source": "Lights in the World"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "He will answer, \"I am the light of the world.\" When you have come to see Me, to know Me truly, in a heart way, you have illumination.", "source": "Knowing God in Christ"}], "declarations": ["I declare: Jesus is the light of the world and I walk in His light.", "I declare: I follow Christ and I shall not walk in darkness."], "prayer": "Lord Jesus, You are the light of the world. Shine in my life and guide my steps today. Amen.", "theme_flag": null}, {"day": 192, "ref": "John 8:58", "book": "John", "chapter": 8, "verse": 58, "text": "Jesus said unto them, Verily, verily, I say unto you, Before Abraham was, I am.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "He announces positively that He is the One who calls Himself I am, the supreme name of God, that He is God Himself. What a thought, that God Himself has been here!", "source": "Darby's Synopsis, John, chapter 8 section"}, {"name": "Andrew Murray", "short": "Murray", "comment": "The only reason that you ever have to look back to a yesterday that was better than today, was that you did not know, or that you failed to trust, this Jesus, who was waiting to make each day a new revelation and a larger experience of the grace of yesterday.", "source": "Andrew Murray, quoted in H.B. Charles Jr. sermon outline (hbcharlesjr.com)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "In Christianity Christ is everything. What He gives is His very own Self.", "source": "Watchman Nee, The Joyful Heart, Jan 4 (via everand.com)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Before Abraham was I am, that as to past eternity, before times eternal.", "source": "T. Austin-Sparks, Sovereign Head (austin-sparks.com)"}], "declarations": ["I declare: Jesus is the great I AM, before Abraham and forever.", "I declare: Christ is eternal and I worship Him."], "prayer": "Lord Jesus, You are the I AM. Before Abraham was, You are. I worship You as the eternal God. Amen.", "theme_flag": "theme-based: Murray"}, {"day": 193, "ref": "John 10:10", "book": "John", "chapter": 10, "verse": 10, "text": "The thief cometh not, but for to steal, and to kill, and to destroy: I am come that they might have life, and that they might have it more abundantly.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "The sheep of Christ are free : their safety is in the persoiial care of the Shepherd; and in this liberty they feed in the good and fat pastures which His love supplies. In a word, it is no longer Judaism; it is salvation, and liberty, and food. The thief comes to make his profit on the sheep by killing them. Christ is come that they might have life, and that abundantly ; that is, according to the power of this life in Jesus, the Son of God, who would soon have this life (whose power was in His Person) in resurrection beyond death.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "O° Lord spoke this word concerning the more abundant life when He said that He had come to give His life for His sheep: “I am _ come that they might have life, and that they might have it more abundantly” (John 10: ro). A man may have life, and yet, through lack of nourishment, or through illness, there may be no abundance of life or power. This was the distinction between the Old Testament and the New. In the former there was indeed life, under the Law, but not the abundance of grace of the New Testament.", "source": "The Prayer Life"}, {"name": "Watchman Nee", "short": "Nee", "comment": "This more abundant life suffices additionally for every requirement of our body.", "source": "The Spiritual Man (3)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "It is His will that there should be the full provision of Life unto the full end, because the purpose is such an abundant purpose.", "source": "All Things in Christ"}], "declarations": ["I declare: Jesus came to give me life more abundantly.", "I declare: I receive the abundant life of Christ today."], "prayer": "Lord Jesus, thank You for coming to give me abundant life. Fill me with Your life today. Amen.", "theme_flag": null}, {"day": 194, "ref": "John 10:11", "book": "John", "chapter": 10, "verse": 11, "text": "I am the good shepherd: the good shepherd giveth his life for the sheep.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "He was the good Shepherd who thus gave His life for the sheep. Others would think of themselves, He of His sheep.", "source": "Darby's Synopsis, John, chapter 10 section"}, {"name": "Andrew Murray", "short": "Murray", "comment": "His humility is our salvation.", "source": "Andrew Murray, quoted at dailypulse.substack.com"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Christianity is not any one thing which Christ gives to me; Christianity is Christ giving Himself to me.", "source": "Watchman Nee, quoted at thegoodland.io"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "This was the quintessence, the very essential nature of that sacrificial love in Him, which caused the Father to delight in Him.", "source": "T. Austin-Sparks, The Cross, and the Unity of Vision and Ministry in the Church (austin-sparks.net)"}], "declarations": ["I declare: I am one of Christ's sheep and I hear His voice.", "I declare: Jesus knows me and I follow Him."], "prayer": "Lord Jesus, I am Your sheep. Help me to hear Your voice clearly and follow You closely. Amen.", "theme_flag": "theme-based: Murray"}, {"day": 195, "ref": "John 10:28", "book": "John", "chapter": 10, "verse": 28, "text": "And I give unto them eternal life; and they shall never perish, neither shall any man pluck them out of my hand.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "They hear His voice; He knows them; they follow Him; He gives them eternal life; they shall never perish. The Father had given us to Jesus, and He is greater than all who would seek to pluck us out of His hand.", "source": "Darby's Synopsis, John, chapter 10 section"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Every branch grafted by Him in the True Vine shall never be plucked out of His hand.", "source": "Andrew Murray, Writings of Andrew Murray, Vol. 1 (sermonindex.net)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "The Bible shows us that the duration of God's salvation is eternal; it is not temporal.", "source": "Watchman Nee, The Gospel of God (2), ch. 1 'Salvation Being Eternal' (bibleread.online)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "This life is eternity of life.", "source": "T. Austin-Sparks, The Necessity for New Birth (Austin-Sparks.net/english/002060.html)"}], "declarations": ["I declare: Jesus gives me eternal life and I shall never perish.", "I declare: No one can snatch me out of Christ's hand."], "prayer": "Lord Jesus, thank You for eternal life. I am secure in Your hand and no one can take me from You. Amen.", "theme_flag": "theme-based: Nee"}, {"day": 196, "ref": "John 11:25", "book": "John", "chapter": 11, "verse": 25, "text": "Jesus said unto her, I am the resurrection, and the life: he that believeth in me, though he were dead, yet shall he live:", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Have any died before He exercises it ? They shall live — death cannot subsist before Him. All the effect of sin upon man is completely destroyed by resurrection, viewed as the power of life in Christ. This refers of course to the saints, to whom life is communicated. The same divine power is, of course, exercised as to the wicked ; but it is not the communication of life from Christ, nor being raised with Him, as is evident.* Christ exercised this power in obedience and in dependence on His Father, because He was man, walking before God to do His will ; but He is the resurrection and the life.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "A dead Christ, I must do everything for; a living Christ does everything for me. The disciples began the morning with a sad heart. I fancy very possibly they spent a sleepless night. Oh! the terrible disappointment! They had hoped that Christ would be the Deliverer of Israel, and they had seen Him die an accursed death. On the morning of that first day of the week, they rose with sad hearts--the bitter sadness cannot be expressed. That is just the life of many Christians. They try to believe in Jesus and to trust Him, and to hope in Him, but there is no joy. Why? Because they do not know that there is a living Christ to reveal Himself.", "source": "Jesus Himself"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Our old history ends with the cross; our new history begins with the resurrection.", "source": "quoted at"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "To be a Christian is to have Him as LIFE resident in your spirit, mighty, triumphant, able to resist the powers of death.", "source": "The Sentence of Death"}], "declarations": ["I declare: I am crucified with Christ and I live by His life.", "I declare: Christ lives in me and I live by faith in Him."], "prayer": "Lord Jesus, I am crucified with You. Live Your life through me today. Amen.", "theme_flag": null}, {"day": 197, "ref": "John 14:6", "book": "John", "chapter": 14, "verse": 6, "text": "Jesus saith unto him, I am the way, the truth, and the life: no man cometh unto the Father, but by me.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "He was, then, Himself the way. He was the truth itself, in the revelation of God and of the soul's relationship to Him. He was the life, in which God and the truth could thus be known.", "source": "Darby's Synopsis, John, chapter 14 section"}, {"name": "Andrew Murray", "short": "Murray", "comment": "May not a single moment of my life be spent outside the light, love and joy of God's presence and not a moment without the entire surrender of myself as a vessel for Him to fill full of His Spirit and His love.", "source": "Andrew Murray, quoted at charispsallo.me"}, {"name": "Watchman Nee", "short": "Nee", "comment": "He says He is the way, He does not say He will guide us to walk in the way.", "source": "Watchman Nee, quoted at thegoodland.io"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "If you will trust Me, I will see that you get where I would have you. I AM the way.", "source": "T. Austin-Sparks, How Know We the Way? (austin-sparks.net)"}], "declarations": ["I declare: Jesus is the way, the truth, and the life.", "I declare: I come to the Father through Christ alone."], "prayer": "Lord Jesus, You are the way. Lead me to the Father today. I trust in You alone. Amen.", "theme_flag": "theme-based: Murray"}, {"day": 198, "ref": "John 14:27", "book": "John", "chapter": 14, "verse": 27, "text": "Peace I leave with you, my peace I give unto you: not as the world giveth, give I unto you. Let not your heart be troubled, neither let it be afraid.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "The Lord, in the midst of this world, left peace to His disciples, giving them His own peace. He gave them the peace which He Himself had with the Father.", "source": "Darby's Synopsis, John, chapter 14 section"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Perpetual quietness of heart is to have no trouble. It is never to be fretted or vexed, irritable or sore; to wonder at nothing that is done to me, to feel nothing done against me.", "source": "Andrew Murray, quoted at stmark.com.au"}, {"name": "Watchman Nee", "short": "Nee", "comment": "It is not just a question of peace but of \"My peace.\"", "source": "Watchman Nee, A Table in the Wilderness, Feb. 7"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "What you can stand up to in the world if you have the peace of God in your heart!", "source": "T. Austin-Sparks, The Second Man - The Last Adam (austin-sparks.net)"}], "declarations": ["I declare: Jesus gives me His peace, not as the world gives.", "I declare: My heart is not troubled because Christ is with me."], "prayer": "Lord Jesus, give me Your peace today. Calm my heart and let me rest in You. Amen.", "theme_flag": "theme-based: Murray"}, {"day": 199, "ref": "John 15:5", "book": "John", "chapter": 15, "verse": 5, "text": "I am the vine, ye are the branches: He that abideth in me, and I in him, the same bringeth forth much fruit: for without me ye can do nothing.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Led by Peter, several of the apostles go a fishing. The Lord meets them in the same circumstances as those in which He found them at the beginning, and reveals Himself to them in the same manner. John at once understands that it is the Lord. Peter, with his usual energy, casts himself into the sea to reach Him. Observe here, that we find ourselves again upon the ground of the historic Gospels — that is to say, that the miracle of the draught of fishes identifies itself with the work of Christ on earth, and is in the sphere of His former association with His disciples. It is Galilee, not Bethany.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "He means it literally. To everyone who wants to live the true disciple life, to bring forth fruit and glorify God, the message comes: You can do nothing. What had been said: \"He that abideth in me, and I in him, the same beareth much fruit,\" is here enforced by the simplest and strongest of arguments: \"Abiding in Me is indispensable, for, you know it, of yourselves you can do nothing to maintain or act out the heavenly life.\" A deep conviction of the truth of this word lies at the very root of a strong spiritual life. As little as I created myself, as little as I could raise a man from the dead, can I give myself the divine life.", "source": "True Vine: You Can Do Nothing"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Outside of Christ, I am weak;
