kings of the earth.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "I will make Him My firstborn, higher than the kings of the earth; the Christ is set above all rule.", "source": "J.N. Darby, Synopsis of the Books of the Bible, Psalms 89 (theme-based; sacred-texts.com)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Christ is the second Adam, the Head of a new race.", "source": "Andrew Murray, Like Christ, ch. 4: Our Head (bible.prayerrequest.com)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "It is a fact that Christ is victorious and forever victorious.", "source": "Watchman Nee, The Glorious Church (goodreads.com/author/quotes/12878.Watchman_Nee)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "That in all things he might have the pre-eminence.", "source": "T. Austin-Sparks, The Centrality and Supremacy of the Lord Jesus Christ, ch. 1 (austin-sparks.net/m/Books-000729.html)"}], "declarations": ["I declare: Christ is God's Firstborn, higher than all kings.", "I declare: I belong to the victorious Christ who reigns forever."], "prayer": "Lord Jesus, You are the Firstborn, higher than the kings of the earth. I bow to Your pre-eminence in all things. Reign in my heart today.", "theme_flag": "theme-based: Darby, theme-based: Murray, theme-based: Nee"}, {"day": 53, "ref": "Psalms 91:1", "book": "Psalms", "chapter": 91, "verse": 1, "text": "He that dwelleth in the secret place of the most High shall abide under the shadow of the Almighty.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "He that dwelleth in the secret place of the Most High shall abide under the shadow of the Almighty; here is perfect, almighty protection.", "source": "J.N. Darby, Synopsis of the Books of the Bible, Psalms 91 (sacred-texts.com)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Come and be still under the shadow of the true Vine, and rest under it from the heat of the day.", "source": "Andrew Murray, The True Vine: The Vine (ccel.org)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "In Psalm 91, we find that those who dwell in the secret place of the Most High will abide in the shadow of the Almighty. The Lord will deliver these ones from many perils.", "source": "Watchman Nee, Collected Works, Set 2, Vol. 37: General Messages (1), ch. 3 (bibleread.online)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "What is the thing for which Christ stands preeminently in the whole revelation of Scripture? The answer is union with God.", "source": "T. Austin-Sparks, The Centrality and Universality of the Cross, ch. 1 (austin-sparks.net/m/Books-000739.html)"}], "declarations": ["I declare: I dwell in the secret place of the Most High.", "I declare: I abide under the shadow of the Almighty, safe and sheltered."], "prayer": "Lord Jesus, You are my secret place and my shadow. I come and rest under Your covering today. Deliver me from every peril, for I dwell in You.", "theme_flag": "theme-based: Sparks"}, {"day": 54, "ref": "Psalms 110:1", "book": "Psalms", "chapter": 110, "verse": 1, "text": "A Psalm of David. The LORD said unto my Lord, Sit thou at my right hand, until I make thine enemies thy footstool.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "The LORD said unto my Lord, Sit Thou at My right hand; He is called to sit at the right hand of Jehovah.", "source": "J.N. Darby, Synopsis of the Books of the Bible, Psalms 110 (sacred-texts.com)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "In exalting Him above all rule and power and dominion, the Father hath put all things in subjection under His feet.", "source": "Andrew Murray, The Spirit of Christ, Day 11 (biblestudytools.com)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Only those who sit can stand.", "source": "Watchman Nee, Sit, Walk, Stand (goodreads.com/author/quotes/12878.Watchman_Nee)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Christ risen, ascended, and reigning was the Horizon.", "source": "T. Austin-Sparks, Horizoned by Christ, ch. 2 (austin-sparks.net/english/books/001882.html)"}], "declarations": ["I declare: Christ sits at God's right hand, and every enemy is His footstool.", "I declare: I sit with Him in the heavenly places, far above all."], "prayer": "Lord Jesus, You sit at the Father's right hand, exalted above all. I take my seat with You by faith. Let Your reign govern my life today.", "theme_flag": "theme-based: Nee"}, {"day": 55, "ref": "Psalms 110:4", "book": "Psalms", "chapter": 110, "verse": 4, "text": "The LORD hath sworn, and will not repent, Thou art a priest for ever after the order of Melchizedek.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Thou art a priest for ever after the order of Melchizedek; He is a priest upon His throne.", "source": "J.N. Darby, Synopsis of the Books of the Bible, Psalms 110 (sacred-texts.com)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Our blessed King-Priest, our Melchizedek, ever liveth to apply to us all the blessed fruits of His atonement.", "source": "Andrew Murray, The Holiest of All, on Hebrews 7 (goodreads.com/book/show/131003071)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "The Lord is our Mediator, our Defender. The Lord speaks for us.", "source": "Watchman Nee, The Glorious Church (goodreads.com/author/quotes/12878.Watchman_Nee)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "As Priest in heaven, a priest upon His throne, He makes intercession prevailingly because of His own perfection.", "source": "T. Austin-Sparks, Horizoned by Christ, ch. 2 (austin-sparks.net/english/books/001882.html)"}], "declarations": ["I declare: Christ is my Priest forever after the order of Melchizedek.", "I declare: His intercession prevails for me because He is perfect."], "prayer": "Lord Jesus, my great King-Priest, You ever live to make intercession for me. Speak for me before the Father today. I rest in Your perfect priesthood.", "theme_flag": "theme-based: Nee"}, {"day": 56, "ref": "Psalms 118:22", "book": "Psalms", "chapter": 118, "verse": 22, "text": "The stone which the builders refused is become the head stone of the corner.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "The stone which the builders refused is become the head stone of the corner; this is the Lord's doing.", "source": "J.N. Darby, Synopsis of the Books of the Bible, Psalms 118 (sacred-texts.com)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "He was nothing, that God might be all. In Him the rejected Stone becomes the Head of the corner.", "source": "Andrew Murray, Humility, ch. 3 (worthychristianbooks.com)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "He who is able to accept everything gladly from the Lord, and completely disregard self, is he who lives for Him.", "source": "Watchman Nee (goodreads.com/author/quotes/12878.Watchman_Nee)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Christ has triumphed through His cross, in His resurrection, and is in the throne of His Father.", "source": "T. Austin-Sparks, God's Inheritance of Glory in Sons, ch. 3 (austin-sparks.com/english/books/006288.html)"}], "declarations": ["I declare: The Stone the builders refused is now the Head of the corner.", "I declare: I build my life on Christ, the precious foundation."], "prayer": "Lord Jesus, rejected by men but chosen by God, You are the Head of the corner. I build on You alone. Let my life rise true on this foundation.", "theme_flag": "theme-based: Murray, theme-based: Nee"}, {"day": 57, "ref": "Psalms 118:26", "book": "Psalms", "chapter": 118, "verse": 26, "text": "Blessed be he that cometh in the name of the LORD: we have blessed you out of the house of the LORD.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Blessed be He that cometh in the name of the LORD; we have blessed you out of the house of the LORD.", "source": "J.N. Darby, Synopsis of the Books of the Bible, Psalms 118 (sacred-texts.com)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "He is the glorified One, who from the throne gives His Spirit to make His presence real and true.", "source": "Andrew Murray, The True Vine: The Vine (ccel.org)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Jesus opened up God's heart to men.", "source": "Watchman Nee, God is Willing (goodreads.com/author/quotes/12878.Watchman_Nee)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "The Incarnation is intended to set forth the union between God and man, and man and God.", "source": "T. Austin-Sparks, The Centrality and Universality of the Cross, ch. 1 (austin-sparks.net/m/Books-000739.html)"}], "declarations": ["I declare: Blessed is Christ who comes in the name of the LORD.", "I declare: I welcome Him and bless His coming into my life."], "prayer": "Lord Jesus, blessed are You who came in the name of the Lord. You opened God's heart to me. I welcome You afresh today; come and dwell in my heart.", "theme_flag": "theme-based: Murray, theme-based: Nee, theme-based: Sparks"}, {"day": 58, "ref": "Proverbs 3:5", "book": "Proverbs", "chapter": 3, "verse": 5, "text": "¶ Trust in the LORD with all thine heart; and lean not unto thine own understanding.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Trust in the LORD with all thine heart; faith leans not on its own understanding, but wholly on Him.", "source": "J.N. Darby, Synopsis of the Books of the Bible, Proverbs 3 (theme-based)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "It is with the heart man believes. It is the heart that must trust and love and worship and obey.", "source": "Andrew Murray, Waiting on God, Day 9 (ccel.org)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Our faith is not to be in God plus man but in God alone.", "source": "Watchman Nee, The Table in the Wilderness (goodreads.com/author/quotes/12878.Watchman_Nee)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "We have to make over to the Lord's account things which may have been mistakes or failures, and trust Him with these and go on.", "source": "T. Austin-Sparks, 'By Faith...' (austin-sparks.net/english/001750.html)"}], "declarations": ["I declare: I trust in the LORD with all my heart.", "I declare: I lean not on my own understanding, for He is my wisdom."], "prayer": "Lord Jesus, I trust You with all my heart. I refuse to lean on my own understanding. Be my wisdom and my guide in every decision today.", "theme_flag": "theme-based: Darby"}, {"day": 59, "ref": "Proverbs 3:6", "book": "Proverbs", "chapter": 3, "verse": 6, "text": "In all thy ways acknowledge him, and he shall direct thy paths.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "In all thy ways acknowledge Him, and He shall direct thy paths; the Lord guides the obedient.", "source": "J.N. Darby, Synopsis of the Books of the Bible, Proverbs 3 (theme-based)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Waiting for His counsel, as the only guide of our thoughts and actions.", "source": "Andrew Murray, Waiting on God, Day 15 (ccel.org)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Man's failure is not due to his weakness, but to his not accepting God's strength.", "source": "Watchman Nee, A Living Sacrifice (goodreads.com/author/quotes/12878.Watchman_Nee)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "What the Lord wants is a heart perfect toward Him; not that we did our work perfectly but that we trusted the Lord.", "source": "T. Austin-Sparks, 'By Faith...' (austin-sparks.net/english/001750.html)"}], "declarations": ["I declare: I acknowledge Christ in all my ways.", "I declare: He directs my paths and makes them straight."], "prayer": "Lord Jesus, I acknowledge You in all my ways. Direct my paths and guide my thoughts and actions. I trust Your counsel above my own.", "theme_flag": "theme-based: Darby, theme-based: Nee"}, {"day": 60, "ref": "Proverbs 8:22", "book": "Proverbs", "chapter": 8, "verse": 22, "text": "The LORD possessed me in the beginning of his way, before his works of old.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "The LORD possessed Me in the beginning of His way; Christ is the Wisdom of God, before His works of old.", "source": "J.N. Darby, Synopsis of the Books of the Bible, Proverbs 8 (theme-based)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Jesus alone can reveal Himself. He gives His Holy Spirit to open the eyes to gaze upon Himself, to open the heart to receive Himself.", "source": "Andrew Murray, The True Vine: The Vine (ccel.org)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Our power is not the strength to do things; rather, it is a Person.", "source": "Watchman Nee, Christ the Sum of All Spiritual Things (goodreads.com/author/quotes/12878.Watchman_Nee)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Wherever you read the word Wisdom, put Christ in the place of Wisdom and you have transformed the book.", "source": "T. Austin-Sparks, The Centrality and Supremacy of the Lord Jesus Christ, ch. 1 (austin-sparks.net/m/Books-000729.html)"}], "declarations": ["I declare: Christ is my Wisdom, possessed by God from the beginning.", "I declare: I receive Him as my power and my life."], "prayer": "Lord Jesus, You are the Wisdom of God, possessed before all works. Open my eyes to see You and my heart to receive You. Be my wisdom today.", "theme_flag": "theme-based: Darby, theme-based: Murray, theme-based: Nee"}, {"day": 61, "ref": "Proverbs 8:30", "book": "Proverbs", "chapter": 8, "verse": 30, "text": "Then I was by him, as one brought up with him: and I was daily his delight, rejoicing always before him;", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "I was daily His delight, rejoicing always before Him; the Son in the Father's bosom, His eternal joy.", "source": "J.N. Darby, Synopsis of the Books of the Bible, Proverbs 8 (theme-based)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "I sat under His shadow with great delight, and His fruit was sweet to my taste.", "source": "Andrew Murray, The True Vine: The Vine (citing Song 2:3; ccel.org)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Actually, only God can satisfy a Christian's heart; man cannot.", "source": "Watchman Nee, The Spiritual Man (goodreads.com/author/quotes/12878.Watchman_Nee)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Everything hangs upon an inward revelation of Jesus Christ.", "source": "T. Austin-Sparks, The Centrality and Supremacy of the Lord Jesus Christ, ch. 1 (austin-sparks.net/m/Books-000729.html)"}], "declarations": ["I declare: Christ is the Father's delight, and He is mine.", "I declare: I sit under His shadow with great delight."], "prayer": "Lord Jesus, You were daily the Father's delight. Make me Your delight too. I sit under Your shadow and taste Your sweetness today.", "theme_flag": "theme-based: Darby, theme-based: Nee, theme-based: Sparks"}, {"day": 62, "ref": "Proverbs 16:3", "book": "Proverbs", "chapter": 16, "verse": 3, "text": "Commit thy works unto the LORD, and thy thoughts shall be established.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Commit thy works unto the LORD, and thy thoughts shall be established; He orders all for the obedient.", "source": "J.N. Darby, Synopsis of the Books of the Bible, Proverbs 16 (theme-based)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Commit thy works unto the LORD: it is the quiet resting in Him alone.", "source": "Andrew Murray, Waiting on God, Day 25 (ccel.org)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "The all-important rule is not to 'try,' but to 'trust,' not to depend upon our own strength, but upon His.", "source": "Watchman Nee, Sit, Walk, Stand (goodreads.com/author/quotes/12878.Watchman_Nee)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "The only way of life and deliverance from such a paralysis is a deliberate faith in God.", "source": "T. Austin-Sparks, 'By Faith...' (austin-sparks.net/english/001750.html)"}], "declarations": ["I declare: I commit my works unto the LORD.", "I declare: My thoughts are established as I rest in Him."], "prayer": "Lord Jesus, I commit my works to You today. I will not try in my own strength but trust in Yours. Establish my thoughts as I rest quietly in You.", "theme_flag": "theme-based: Darby, theme-based: Sparks"}, {"day": 63, "ref": "Proverbs 30:4", "book": "Proverbs", "chapter": 30, "verse": 4, "text": "Who hath ascended up into heaven, or descended? who hath gathered the wind in his fists? who hath bound the waters in a garment? who hath established all the ends of the earth? what is his name, and what is his son’s name, if thou canst tell?", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Who hath ascended up into heaven, or descended? It is Christ, who descended first, then ascended far above all.", "source": "J.N. Darby, Synopsis of the Books of the Bible, Proverbs 30 (theme-based)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "He gave unto Him the Name which is above every name, that in the Name of Jesus every knee should bow.", "source": "Andrew Murray, The Spirit of Christ, Day 11 (biblestudytools.com)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "God had to personally come to this world and become a man. This man is Jesus, the Christ, whom we know.", "source": "Watchman Nee (goodreads.com/author/quotes/12878.Watchman_Nee)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "This is the climax of the cycle from emptying to filling, from humbling to glorifying.", "source": "T. Austin-Sparks, Horizoned by Christ, ch. 2 (austin-sparks.net/english/books/001882.html)"}], "declarations": ["I declare: Christ descended and ascended; His Name is above every name.", "I declare: I know His Name: Jesus the Christ."], "prayer": "Lord Jesus, You descended to us and ascended far above all. Your Name is above every name. I bow to You today and confess You as Lord.", "theme_flag": "theme-based: Darby, theme-based: Nee, theme-based: Sparks"}, {"day": 64, "ref": "Ecclesiastes 3:1", "book": "Ecclesiastes", "chapter": 3, "verse": 1, "text": "To every thing there is a season, and a time to every purpose under the heaven:", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "To every thing there is a season; God hath made every thing beautiful in His time.", "source": "J.N. Darby, Synopsis of the Books of the Bible, Ecclesiastes 3 (theme-based)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "To every thing there is a season: in patience to await His good time and mercy.", "source": "Andrew Murray, Waiting on God, Day 11 (ccel.org)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Good is not always God's will, but God's will is always good.", "source": "Watchman Nee (goodreads.com/author/quotes/12878.Watchman_Nee)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "God, the Father, had horizoned everything by His Son.", "source": "T. Austin-Sparks, Horizoned by Christ, ch. 2 (austin-sparks.net/english/books/001882.html)"}], "declarations": ["I declare: There is a season for everything, and God makes it beautiful.", "I declare: I wait patiently for His good time."], "prayer": "Lord Jesus, You order every season by Your wisdom. Teach me to wait patiently for Your good time. I trust that Your will is always good.", "theme_flag": "theme-based: Darby, theme-based: Nee, theme-based: Sparks"}, {"day": 65, "ref": "Ecclesiastes 12:13", "book": "Ecclesiastes", "chapter": 12, "verse": 13, "text": "¶ Let us hear the conclusion of the whole matter: Fear God, and keep his commandments: for this is the whole duty of man.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Fear God, and keep His commandments; Christ is the perfect Keeper of the whole duty of man.", "source": "J.N. Darby, Synopsis of the Books of the Bible, Ecclesiastes 12 (theme-based)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Let us hear the conclusion of the whole matter: to fear the glorious and fearful name, and keep His commandments.", "source": "Andrew Murray, Waiting on God, Day 10 (ccel.org)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Any action which lacks in obedience is a fall, and any act of disobedience is rebellion.", "source": "Watchman Nee, Spiritual Authority (goodreads.com/author/quotes/12878.Watchman_Nee)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Looking to Christ crucified as the Author and Perfecter of salvation, they discover that He is more than a man.", "source": "T. Austin-Sparks, The Centrality and Universality of the Cross, ch. 1 (austin-sparks.net/m/Books-000739.html)"}], "declarations": ["I declare: I fear God and keep His commandments.", "I declare: Christ is my perfect Example and my strength to obey."], "prayer": "Lord Jesus, I fear Your glorious name and desire to keep Your commandments. You are more than a man; You are my Lord. Teach me obedience today.", "theme_flag": "theme-based: Darby, theme-based: Sparks"}, {"day": 66, "ref": "Song of Solomon 2:1", "book": "Song of Solomon", "chapter": 2, "verse": 1, "text": "I am the rose of Sharon, and the lily of the valleys.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "I am the rose of Sharon, and the lily of the valleys; Christ in His lowly beauty among men.", "source": "J.N. Darby, Synopsis of the Books of the Bible, Song of Solomon 2 (theme-based)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Come and gaze on the heavenly Vine till your eye turns from all else to admire Him.", "source": "Andrew Murray, The True Vine: The Vine (ccel.org)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "The idea of waste only comes into our Christianity when we underestimate the worth of our Lord.", "source": "Watchman Nee, The Normal Christian Life (goodreads.com/author/quotes/12878.Watchman_Nee)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Oh, the depths, the fullness, of Christ!", "source": "T. Austin-Sparks (deeperchristianquotes.com/author/dcq-taustinsparks/)"}], "declarations": ["I declare: Christ is the Rose of Sharon, beautiful in lowliness.", "I declare: I gaze on Him till my eyes turn from all else."], "prayer": "Lord Jesus, my Rose of Sharon, how beautiful You are in Your lowliness. I turn my eyes from all else to admire You. Fill me with Your fullness today.", "theme_flag": "theme-based: Darby, theme-based: Nee, theme-based: Sparks"}, {"day": 67, "ref": "Song of Solomon 5:16", "book": "Song of Solomon", "chapter": 5, "verse": 16, "text": "His mouth is most sweet: yea, he is altogether lovely. This is my beloved, and this is my friend, O daughters of Jerusalem.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "He is altogether lovely; this is my Beloved, and this is my Friend.", "source": "J.N. Darby, Synopsis of the Books of the Bible, Song of Solomon 5 (theme-based)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Our abode, the home of our soul, is to be the love of Christ. We are to live our life there, to be at home there all the day.", "source": "Andrew Murray, The True Vine: Abide in My Love (ccel.org)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Many of us only know the preciousness of the Lord's work, but not the preciousness of the Lord Himself. We only know the grace we have received, but not the loveliness of the Lord.", "source": "Watchman Nee, Collected Works, Set 1, Vol. 18: Notes on Scriptural Messages (2), ch. 1 (bibleread.online)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "It is Christ, the beauties of Christ, the preciousness of Christ to the Father which is the foundation.", "source": "T. Austin-Sparks, Features of Zion, ch. 4 (austin-sparks.net/m/Books-002135.html)"}], "declarations": ["I declare: Christ is altogether lovely, my Beloved and my Friend.", "I declare: I make my home in His love all the day."], "prayer": "Lord Jesus, my Beloved and my Friend, You are altogether lovely. I want to know not just Your work but Your Person. I make my home in Your love today.", "theme_flag": "theme-based: Darby"}, {"day": 68, "ref": "Song of Solomon 8:7", "book": "Song of Solomon", "chapter": 8, "verse": 7, "text": "Many waters cannot quench love, neither can the floods drown it: if a man would give all the substance of his house for love, it would utterly be contemned.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Many waters cannot quench love; the love of Christ is unquenchable, stronger than death itself.", "source": "J.N. Darby, Synopsis of the Books of the Bible, Song of Solomon 8 (theme-based)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Christ is the Son of God's love, the bearer, the revealer, the communicator of that love. His life and death were all love.", "source": "Andrew Murray, The True Vine: Love One Another (ccel.org)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Love does not know the meaning of 'difficulty.' The most wonderful thing in the world is that the presence of love makes everything easy.", "source": "Watchman Nee, Collected Works, Set 1, Vol. 18: Notes on Scriptural Messages (2), ch. 1 (bibleread.online)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "He became broken in order that He might unite.", "source": "T. Austin-Sparks, Vocational Fellowship, ch. 4 (austin-sparks.net/english/books/004362.html)"}], "declarations": ["I declare: Christ's love for me cannot be quenched.", "I declare: Many waters cannot drown His love; it is everlasting."], "prayer": "Lord Jesus, Your love is unquenchable. Many waters cannot quench it. Thank You for loving me with an everlasting love. Let Your love flow through me today.", "theme_flag": "theme-based: Darby, theme-based: Sparks"}, {"day": 69, "ref": "Isaiah 7:14", "book": "Isaiah", "chapter": 7, "verse": 14, "text": "Therefore the Lord himself shall give you a sign; Behold, a virgin shall conceive, and bear a son, and shall call his name Immanuel.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Behold, a virgin shall conceive, and bear a son, and shall call His name Immanuel; the gift of the virgin's Son, God with us.", "source": "J.N. Darby, Synopsis of the Books of the Bible, Isaiah 7 (sacred-texts.com)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "He is man, one with us.", "source": "Andrew Murray, The True Vine: The Vine (ccel.org)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "The Lord Jesus came and took on human nature in order to bear the judgment for human nature.", "source": "Watchman Nee, Collected Works, Set 1, Vol. 12: The Spiritual Man (1), ch. 5 (bibleread.online)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Here we have very God joining Himself with very man.", "source": "T. Austin-Sparks, The Centrality and Universality of the Cross, ch. 1 (austin-sparks.net/m/Books-000739.html)"}], "declarations": ["I declare: Immanuel, God with us, has come in the flesh.", "I declare: Christ took my human nature to bear my judgment."], "prayer": "Lord Jesus, my Immanuel, You came and took on human nature for me. God with us, what a wonder. I receive You afresh today.", "theme_flag": "theme-based: Nee"}, {"day": 70, "ref": "Isaiah 9:6", "book": "Isaiah", "chapter": 9, "verse": 6, "text": "For unto us a child is born, unto us a son is given: and the government shall be upon his shoulder: and his name shall be called Wonderful, Counsellor, The mighty God, The everlasting Father, The Prince of Peace.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Unto us a child is born, unto us a Son is given; here is all the brightness of the glory of the divine Person of the Messiah.", "source": "J.N. Darby, Synopsis of the Books of the Bible, Isaiah 9 (sacred-texts.com)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "He who speaks is God, in His infinite power able to enter into us.", "source": "Andrew Murray, The True Vine: The Vine (ccel.org)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "God's way of salvation is in Christ, not in your own self. If you live in Christ, you have everything.", "source": "Watchman Nee, The Secret of Christian Living (goodreads.com/author/quotes/12878.Watchman_Nee)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "He is the Wisdom of God, the Eternal Logos.", "source": "T. Austin-Sparks, The Centrality and Supremacy of the Lord Jesus Christ, ch. 1 (austin-sparks.net/m/Books-000729.html)"}], "declarations": ["I declare: Unto us a Son is given, the mighty God.", "I declare: In Christ I have everything I need."], "prayer": "Lord Jesus, my Wonderful Counsellor, my mighty God, my Prince of Peace. Unto us You were given. I live in You today, and in You I have everything.", "theme_flag": "theme-based: Murray, theme-based: Nee, theme-based: Sparks"}, {"day": 71, "ref": "Isaiah 9:7", "book": "Isaiah", "chapter": 9, "verse": 7, "text": "Of the increase of his government and peace there shall be no end, upon the throne of David, and upon his kingdom, to order it, and to establish it with judgment and with justice from henceforth even for ever. The zeal of the LORD of hosts will perform this.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Of the increase of His government there shall be no end; the divine Person of the Messiah reigns forever in peace.", "source": "J.N. Darby, Synopsis of the Books of the Bible, Isaiah 9 (sacred-texts.com)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "The Kingdom and the Power and the Glory are ever one: Unto Him that sitteth on the Throne, and to the Lamb in the midst of the Throne, be the Glory and the Dominion for ever.", "source": "Andrew Murray, The Spirit of Christ, Day 11 (biblestudytools.com)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "It is a fact that the kingdom of heaven will come; it is a fact that the Lord is King.", "source": "Watchman Nee, The Glorious Church (goodreads.com/author/quotes/12878.Watchman_Nee)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "The message of the gospel to the nations is the message of the Crown Rights of God's Son. He is Lord of all.", "source": "T. Austin-Sparks, Vocational Fellowship, ch. 4 (austin-sparks.net/english/books/004362.html)"}], "declarations": ["I declare: Christ's government and peace shall have no end.", "I declare: He is Lord of all, and His kingdom comes."], "prayer": "Lord Jesus, my King, of Your government there shall be no end. I bow to Your crown rights over my life. Come, Lord, and reign in me today.", "theme_flag": null}, {"day": 72, "ref": "Isaiah 11:1", "book": "Isaiah", "chapter": 11, "verse": 1, "text": "And there shall come forth a rod out of the stem of Jesse, and a Branch shall grow out of his roots:", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "A rod out of the stem of Jesse, and a Branch shall grow out of his roots; here is the Messiah and His reign.", "source": "J.N. Darby, Synopsis of the Books of the Bible, Isaiah 11 (sacred-texts.com)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "If you would know Jesus, study the vine.", "source": "Andrew Murray, The True Vine: The Vine (ccel.org)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "As long as you are in Christ, what you are in yourself does not count.", "source": "Watchman Nee, The Secret of Christian Living (goodreads.com/author/quotes/12878.Watchman_Nee)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "For you therefore that believe is the preciousness.", "source": "T. Austin-Sparks, Features of Zion, ch. 4 (austin-sparks.net/m/Books-002135.html)"}], "declarations": ["I declare: Christ is the Branch from Jesse, beautiful and glorious.", "I declare: In Him, what I am in myself does not count."], "prayer": "Lord Jesus, my Branch from Jesse, how precious You are to all who believe. I am in You, and that is enough. Grow Your life in me today.", "theme_flag": "theme-based: Murray, theme-based: Nee, theme-based: Sparks"}, {"day": 73, "ref": "Isaiah 11:10", "book": "Isaiah", "chapter": 11, "verse": 10, "text": "¶ And in that day there shall be a root of Jesse, which shall stand for an ensign of the people; to it shall the Gentiles seek: and his rest shall be glorious.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "A root of Jesse shall stand for an ensign of the people; here is the Messiah and His reign drawing the nations.", "source": "J.N. Darby, Synopsis of the Books of the Bible, Isaiah 11 (sacred-texts.com)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Our continuous abiding in the Vine is to be an abiding in His love.", "source": "Andrew Murray, The True Vine: Abide in My Love (ccel.org)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Do we impress people with ourselves, or with the Lord? Do we draw people to our teaching, or to the Lord?", "source": "Watchman Nee, The Release of the Spirit (goodreads.com/author/quotes/12878.Watchman_Nee)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Christ makes these things far more than abstractions, He makes them personal.", "source": "T. Austin-Sparks, The Centrality and Universality of the Cross, ch. 1 (austin-sparks.net/m/Books-000739.html)"}], "declarations": ["I declare: Christ stands as an ensign, and the Gentiles seek Him.", "I declare: I draw men not to myself, but to the Lord."], "prayer": "Lord Jesus, my Ensign, to You the nations seek. Make me a pointer to You, not to myself. Draw many to Yourself through my life today.", "theme_flag": "theme-based: Murray, theme-based: Nee, theme-based: Sparks"}, {"day": 74, "ref": "Isaiah 40:3", "book": "Isaiah", "chapter": 40, "verse": 3, "text": "¶ The voice of him that crieth in the wilderness, Prepare ye the way of the LORD, make straight in the desert a highway for our God.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "The voice of him that crieth in the wilderness; the herald proclaims the coming of Jehovah.", "source": "J.N. Darby, Synopsis of the Books of the Bible, Isaiah 40 (sacred-texts.com)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Bow down and be still, worship and wait, until the divine Word enters your heart.", "source": "Andrew Murray, The True Vine: The Vine (ccel.org)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "The way of salvation for us was not in God making us good but in His saving us out of Adam and putting us in Christ.", "source": "Watchman Nee, The Messenger of the Cross (goodreads.com/author/quotes/12878.Watchman_Nee)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "The Cross is the way to the glory. The glory will justify the Cross.", "source": "T. Austin-Sparks, Horizoned by Christ, ch. 2 (austin-sparks.net/english/books/001882.html)"}], "declarations": ["I declare: Prepare the way of the LORD; He is coming.", "I declare: I make straight a highway for my God in my heart."], "prayer": "Lord Jesus, I prepare the way for You in my heart. I bow down, I worship, I wait. Come and enter in; make Your highway straight in me today.", "theme_flag": "theme-based: Murray, theme-based: Nee, theme-based: Sparks"}, {"day": 75, "ref": "Isaiah 40:11", "book": "Isaiah", "chapter": 40, "verse": 11, "text": "He shall feed his flock like a shepherd: he shall gather the lambs with his arm, and carry them in his bosom, and shall gently lead those that are with young.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "He shall feed His flock like a shepherd; here is the Saviour, whose tender care is described in a touching manner.", "source": "J.N. Darby, Synopsis of the Books of the Bible, Isaiah 40 (sacred-texts.com)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "He is all love. He loves to give. He gives love.", "source": "Andrew Murray, The True Vine: Love One Another (ccel.org)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "It is the Lamb who shepherds; it is Jesus Christ, the Son of God, who feeds the lambs.", "source": "Watchman Nee, Collected Works, Set 2, Vol. 37: General Messages (1), ch. 3 (bibleread.online)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "When Israel is lost another Shepherd comes and has another flock.", "source": "T. Austin-Sparks, The Mission, the Meaning and the Message of Jesus Christ, ch. 3 (austin-sparks.net/m/Books-000946.html)"}], "declarations": ["I declare: Christ my Shepherd feeds me and carries me.", "I declare: He gathers me in His arms and gently leads me."], "prayer": "Lord Jesus, my good Shepherd, feed me today. Gather me with Your arm and carry me in Your bosom. I am Your lamb; lead me gently.", "theme_flag": "theme-based: Murray, theme-based: Sparks"}, {"day": 76, "ref": "Isaiah 42:1", "book": "Isaiah", "chapter": 42, "verse": 1, "text": "Behold my servant, whom I uphold; mine elect, in whom my soul delighteth; I have put my spirit upon him: he shall bring forth judgment to the Gentiles.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Behold My Servant, Mine elect, in whom My soul delighteth; a Servant of God, His elect; He shall not fail nor be discouraged.", "source": "J.N. Darby, Synopsis of the Books of the Bible, Isaiah 42 (sacred-texts.com)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "He was the Servant of God, and the servant of men.", "source": "Andrew Murray, Humility, ch. 3 (worthychristianbooks.com)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Those whom the Lord uses are the ones who know the Lord's cup and the Lord's baptism.", "source": "Watchman Nee, Spiritual Authority (goodreads.com/author/quotes/12878.Watchman_Nee)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "There was no self in Him.", "source": "T. Austin-Sparks, The Centrality and Universality of the Cross, ch. 1 (austin-sparks.net/m/Books-000739.html)"}], "declarations": ["I declare: Christ is God's Servant, upheld and delighted in.", "I declare: I follow the Servant who had no self in Him."], "prayer": "Lord Jesus, God's elect Servant, You did not fail nor were discouraged. Teach me to serve as You served, with no self in me. I delight to follow You.", "theme_flag": "theme-based: Murray, theme-based: Nee, theme-based: Sparks"}, {"day": 77, "ref": "Isaiah 49:6", "book": "Isaiah", "chapter": 49, "verse": 6, "text": "And he said, It is a light thing that thou shouldest be my servant to raise up the tribes of Jacob, and to restore the preserved of Israel: I will also give thee for a light to the Gentiles, that thou mayest be my salvation unto the end of the earth.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "I will give Thee for a light to the Gentiles; He shall be the salvation of Jehovah unto the ends of the earth.", "source": "J.N. Darby, Synopsis of the Books of the Bible, Isaiah 49 (sacred-texts.com)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "They all point to Him, and preach Him, and reveal Him.", "source": "Andrew Murray, The True Vine: The Vine (ccel.org)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "God has made Jesus Christ the light of the Gentiles.", "source": "Watchman Nee, Collected Works, Set 2, Vol. 37: General Messages (1), ch. 3 (bibleread.online)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "The history of God's specific movements is the bringing back to the primal fullness with which He filled His Son.", "source": "T. Austin-Sparks (deeperchristianquotes.com/author/dcq-taustinsparks/)"}], "declarations": ["I declare: Christ is the light to the Gentiles.", "I declare: He is God's salvation to the ends of the earth."], "prayer": "Lord Jesus, Light to the Gentiles, shine through me today. You are God's salvation to the ends of the earth. Use me to point men to You.", "theme_flag": "theme-based: Murray, theme-based: Sparks"}, {"day": 78, "ref": "Isaiah 50:6", "book": "Isaiah", "chapter": 50, "verse": 6, "text": "I gave my back to the smiters, and my cheeks to them that plucked off the hair: I hid not my face from shame and spitting.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "I gave My back to the smiters; He comes as man in humiliation. Given up to shame, God justifies Him.", "source": "J.N. Darby, Synopsis of the Books of the Bible, Isaiah 50 (sacred-texts.com)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "He surrendered Himself to whatever men around might say of Him, or do to Him.", "source": "Andrew Murray, Humility, ch. 3 (worthychristianbooks.com)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Our spirit is released according to the degree of our brokenness.", "source": "Watchman Nee, The Release of the Spirit (goodreads.com/author/quotes/12878.Watchman_Nee)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "The pure ground of utter selflessness was maintained at greatest cost and through most fiery trial.", "source": "T. Austin-Sparks, The Centrality and Universality of the Cross, ch. 1 (austin-sparks.net/m/Books-000739.html)"}], "declarations": ["I declare: Christ gave His back to the smiters for me.", "I declare: I follow the selfless One who bore shame."], "prayer": "Lord Jesus, You gave Your back to the smiters and hid not Your face from shame. You were selfless to the uttermost. Teach me Your meekness today.", "theme_flag": "theme-based: Murray, theme-based: Nee"}, {"day": 79, "ref": "Isaiah 53:1", "book": "Isaiah", "chapter": 53, "verse": 1, "text": "Who hath believed our report? and to whom is the arm of the LORD revealed?", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Who hath believed our report? The arm of the LORD is revealed in the rejected Servant.", "source": "J.N. Darby, Synopsis of the Books of the Bible, Isaiah 53 (sacred-texts.com)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "The hidden spiritual mystery of the Vine in His divine omnipotence and nearness they do not know, because they have not waited on God's Spirit to reveal it to them.", "source": "Andrew Murray, The True Vine (ccel.org)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Every true spiritual experience means that we have discovered a certain fact in Christ and have entered into that.", "source": "Watchman Nee, The Normal Christian Life (goodreads.com/author/quotes/12878.Watchman_Nee)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "It will be the Cross which discloses Who Jesus is.", "source": "T. Austin-Sparks, The Centrality and Universality of the Cross, ch. 1 (austin-sparks.net/m/Books-000739.html)"}], "declarations": ["I declare: I believe the report of Christ crucified.", "I declare: The Cross discloses who Jesus is to me."], "prayer": "Lord Jesus, I believe the report. Reveal Yourself to me by Your Spirit. Let the Cross disclose who You are to my heart today.", "theme_flag": "theme-based: Murray, theme-based: Nee"}, {"day": 80, "ref": "Isaiah 53:2", "book": "Isaiah", "chapter": 53, "verse": 2, "text": "For he shall grow up before him as a tender plant, and as a root out of a dry ground: he hath no form nor comeliness; and when we shall see him, there is no beauty that we should desire him.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "A tender plant, a root out of dry ground; no form nor comeliness, yet the Holy One of God.", "source": "J.N. Darby, Synopsis of the Books of the Bible, Isaiah 53 (theme-based)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Without form or comeliness He enters in, and, when thought and feeling fail, the Holy Spirit glorifies Him to the faith that sees not.", "source": "Andrew Murray, The Spirit of Christ, Day 11 (biblestudytools.com)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "I must first have the sense of God's possession of me before I can have the sense of His presence with me.", "source": "Watchman Nee, The Normal Christian Life (goodreads.com/author/quotes/12878.Watchman_Nee)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "The Person of our Lord cannot really be known and understood apart from the Cross.", "source": "T. Austin-Sparks, The Centrality and Universality of the Cross, ch. 1 (austin-sparks.net/m/Books-000739.html)"}], "declarations": ["I declare: Christ had no beauty that men should desire Him, yet He is my God.", "I declare: I know Him not by outward form but by the Spirit."], "prayer": "Lord Jesus, You came as a tender plant with no comeliness, yet You are my God. Open my eyes to see Your true beauty. I receive You by faith, not by sight.", "theme_flag": "theme-based: Darby, theme-based: Nee, theme-based: Sparks"}, {"day": 81, "ref": "Isaiah 53:3", "book": "Isaiah", "chapter": 53, "verse": 3, "text": "He is despised and rejected of men; a man of sorrows, and acquainted with grief: and we hid as it were our faces from him; he was despised, and we esteemed him not.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "He is despised and rejected of men; a man of sorrows, and acquainted with grief.", "source": "J.N. Darby, Synopsis of the Books of the Bible, Isaiah 53 (sacred-texts.com)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "He never asserted His power to vindicate Himself.", "source": "Andrew Murray, Humility, ch. 3 (worthychristianbooks.com)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Nevertheless, He endured the cross, despising the shame.", "source": "Watchman Nee, Collected Works, Set 1, Vol. 12: The Spiritual Man (1), ch. 5 (bibleread.online)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "In the days of His earthly life His disciples and the people wanted a Crossless Christ.", "source": "T. Austin-Sparks, The Centrality and Universality of the Cross, ch. 1 (austin-sparks.net/m/Books-000739.html)"}], "declarations": ["I declare: Christ was despised and rejected, yet He did not vindicate Himself.", "I declare: I esteem Him who was not esteemed."], "prayer": "Lord Jesus, Man of Sorrows, despised and rejected, You never vindicated Yourself. I esteem You above all. Teach me Your humility today.", "theme_flag": "theme-based: Murray, theme-based: Nee, theme-based: Sparks"}, {"day": 82, "ref": "Isaiah 53:4", "book": "Isaiah", "chapter": 53, "verse": 4, "text": "¶ Surely he hath borne our griefs, and carried our sorrows: yet we did esteem him stricken, smitten of God, and afflicted.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Surely He hath borne our griefs, and carried our sorrows; yet we did esteem Him stricken of God.", "source": "J.N. Darby, Synopsis of the Books of the Bible, Isaiah 53 (sacred-texts.com)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Standing in the place of me a guilty sinner, Thou hast borne my sins in Thy body on the cross.", "source": "Andrew Murray, Like Christ, ch. 4: Our Head (bible.prayerrequest.com)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Because He bore the curse and the shame of the cross, all who believe in Him no longer need to bear the curse and the shame.", "source": "Watchman Nee, Collected Works, Set 1, Vol. 12: The Spiritual Man (1), ch. 5 (bibleread.online)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "For one terrible, eternal hour Christ was separated from, lost union with, His God.", "source": "T. Austin-Sparks, The Centrality and Universality of the Cross, ch. 1 (austin-sparks.net/m/Books-000739.html)"}], "declarations": ["I declare: Christ bore my griefs and carried my sorrows.", "I declare: I no longer bear the curse, for He bore it."], "prayer": "Lord Jesus, You bore my griefs and carried my sorrows. You were separated from God that I might be brought near. Thank You for bearing it all.", "theme_flag": "theme-based: Nee, theme-based: Sparks"}, {"day": 83, "ref": "Isaiah 53:5", "book": "Isaiah", "chapter": 53, "verse": 5, "text": "But he was wounded for our transgressions, he was bruised for our iniquities: the chastisement of our peace was upon him; and with his stripes we are healed.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "He was wounded for our transgressions, He was bruised for our iniquities; by His stripes we are healed.", "source": "J.N. Darby, Synopsis of the Books of the Bible, Isaiah 53 (sacred-texts.com)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "As Surety, Christ suffered and died in our stead. He bore our sin, and broke at once its curse and power.", "source": "Andrew Murray, Like Christ, ch. 4: Our Head (bible.prayerrequest.com)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "I know that the blood has satisfied Thee; so the blood is enough for me, and it is my only plea.", "source": "Watchman Nee, The Normal Christian Life (goodreads.com/author/quotes/12878.Watchman_Nee)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "He Who knew no sin had to be made sin in our room.", "source": "T. Austin-Sparks, The Centrality and Universality of the Cross, ch. 1 (austin-sparks.net/m/Books-000739.html)"}], "declarations": ["I declare: By His stripes I am healed.", "I declare: His blood is my only plea."], "prayer": "Lord Jesus, wounded for my transgressions, bruised for my iniquities, by Your stripes I am healed. Your blood is enough for me. I plead it today.", "theme_flag": "theme-based: Nee"}, {"day": 84, "ref": "Isaiah 53:6", "book": "Isaiah", "chapter": 53, "verse": 6, "text": "All we like sheep have gone astray; we have turned every one to his own way; and the LORD hath laid on him the iniquity of us all.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "All we like sheep have gone astray; we have turned every one to his own way, and the LORD hath laid on Him the iniquity of us all.", "source": "J.N. Darby, Synopsis of the Books of the Bible, Isaiah 53 (theme-based)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Who His own self bare our sins in His own body on the tree.", "source": "Andrew Murray, Like Christ, ch. 4: Our Head (citing 1 Pet. 2:24; bible.prayerrequest.com)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Man's way is to try to suppress sin by seeking to overcome it; God's way is to remove the sinner.", "source": "Watchman Nee, The Normal Christian Life (goodreads.com/author/quotes/12878.Watchman_Nee)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Thus in the Cross all the cause and nature of separation from God was destroyed.", "source": "T. Austin-Sparks, The Centrality and Universality of the Cross, ch. 1 (austin-sparks.net/m/Books-000739.html)"}], "declarations": ["I declare: I had gone astray, but the LORD laid my iniquity on Christ.", "I declare: In the Cross, my separation from God is destroyed."], "prayer": "Lord Jesus, I had turned to my own way, but the Father laid my iniquity on You. Thank You for bearing it on the tree. I return to You, my Shepherd.", "theme_flag": "theme-based: Darby, theme-based: Nee, theme-based: Sparks"}, {"day": 85, "ref": "Isaiah 53:7", "book": "Isaiah", "chapter": 53, "verse": 7, "text": "He was oppressed, and he was afflicted, yet he opened not his mouth: he is brought as a lamb to the slaughter, and as a sheep before her shearers is dumb, so he openeth not his mouth.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "He was oppressed, yet He opened not His mouth; as a lamb to the slaughter, in meek silence He submits.", "source": "J.N. Darby, Synopsis of the Books of the Bible, Isaiah 53 (theme-based)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "A life yielded to God to work in.", "source": "Andrew Murray, Humility, ch. 3 (worthychristianbooks.com)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "We dare not speak except in conscious and continual dependence on Him.", "source": "Watchman Nee, Sit, Walk, Stand (goodreads.com/author/quotes/12878.Watchman_Nee)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "The marvel, He opened not His mouth. He opened not His mouth! Not a word!", "source": "T. Austin-Sparks, Vocational Fellowship, ch. 4 (austin-sparks.net/english/books/004362.html)"}], "declarations": ["I declare: Christ opened not His mouth; He was silent as a lamb.", "I declare: I yield my life to God and speak only in dependence on Him."], "prayer": "Lord Jesus, silent Lamb, You opened not Your mouth. Teach me when to speak and when to be silent. I yield my life to God today.", "theme_flag": "theme-based: Darby, theme-based: Murray, theme-based: Nee"}, {"day": 86, "ref": "Isaiah 53:8", "book": "Isaiah", "chapter": 53, "verse": 8, "text": "He was taken from prison and from judgment: and who shall declare his generation? for he was cut off out of the land of the living: for the transgression of my people was he stricken.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "He was taken from prison and from judgment; cut off out of the land of the living for the transgression of His people.", "source": "J.N. Darby, Synopsis of the Books of the Bible, Isaiah 53 (theme-based)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Greater love hath no man than this, that a man lay down His life for His friends.", "source": "Andrew Murray, The True Vine (citing John 15:13; ccel.org)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "God dares to put His greatest ambassadors in chains.", "source": "Watchman Nee, The Normal Christian Life (goodreads.com/author/quotes/12878.Watchman_Nee)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "He overcame and destroyed the causes, the ground, the strength and the originator of death.", "source": "T. Austin-Sparks, The Centrality and Universality of the Cross, ch. 1 (austin-sparks.net/m/Books-000739.html)"}], "declarations": ["I declare: Christ was cut off for my transgression.", "I declare: He destroyed death and its power forever."], "prayer": "Lord Jesus, You were taken from judgment and cut off for me. Greater love has no man. You destroyed death itself. I live because You died.", "theme_flag": "theme-based: Darby, theme-based: Murray, theme-based: Nee, theme-based: Sparks"}, {"day": 87, "ref": "Isaiah 53:9", "book": "Isaiah", "chapter": 53, "verse": 9, "text": "And he made his grave with the wicked, and with the rich in his death; because he had done no violence, neither was any deceit in his mouth.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "He made His grave with the wicked, and with the rich in His death; the Holy One numbered with transgressors.", "source": "J.N. Darby, Synopsis of the Books of the Bible, Isaiah 53 (theme-based)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "He gave Himself to death; He lost Himself, that we might find life in Him.", "source": "Andrew Murray, The True Vine (ccel.org)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Our old history ends with the Cross; our new history begins with the resurrection.", "source": "Watchman Nee, The Normal Christian Life (goodreads.com/author/quotes/12878.Watchman_Nee)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "He tasted death, awful death.", "source": "T. Austin-Sparks, The Centrality and Universality of the Cross, ch. 1 (austin-sparks.net/m/Books-000739.html)"}], "declarations": ["I declare: Christ made His grave with the wicked, yet He was sinless.", "I declare: My old history ends at His Cross; my new begins in His resurrection."], "prayer": "Lord Jesus, You tasted death for me and made Your grave with the wicked. My old life ended at Your Cross. I rise with You into new life today.", "theme_flag": "theme-based: Darby, theme-based: Murray, theme-based: Nee, theme-based: Sparks"}, {"day": 88, "ref": "Isaiah 53:10", "book": "Isaiah", "chapter": 53, "verse": 10, "text": "¶ Yet it pleased the LORD to bruise him; he hath put him to grief: when thou shalt make his soul an offering for sin, he shall see his seed, he shall prolong his days, and the pleasure of the LORD shall prosper in his hand.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "It pleased the LORD to bruise Him; His soul shall be made an offering for sin, and He shall see His seed.", "source": "J.N. Darby, Synopsis of the Books of the Bible, Isaiah 53 (sacred-texts.com)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "He is the crucified One, who won a perfect righteousness and a divine life for us through His death.", "source": "Andrew Murray, The True Vine: The Vine (ccel.org)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Isaiah 53:10 through 12 says three times that He gave up His soul and poured out His soul unto death.", "source": "Watchman Nee, Collected Works, Set 1, Vol. 12: The Spiritual Man (1), ch. 5 (bibleread.online)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "He became sin, that He might destroy sin.", "source": "T. Austin-Sparks, Vocational Fellowship, ch. 4 (austin-sparks.net/english/books/004362.html)"}], "declarations": ["I declare: Christ's soul was made an offering for my sin.", "I declare: He shall see His seed and be satisfied."], "prayer": "Lord Jesus, it pleased the Father to bruise You, and You gave Your soul as an offering for my sin. You became sin to destroy sin. I receive Your perfect righteousness today.", "theme_flag": "theme-based: Murray"}, {"day": 89, "ref": "Isaiah 53:11", "book": "Isaiah", "chapter": 53, "verse": 11, "text": "He shall see of the travail of his soul, and shall be satisfied: by his knowledge shall my righteous servant justify many; for he shall bear their iniquities.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "He shall see of the travail of His soul, and shall be satisfied; by His knowledge shall My righteous Servant justify many.", "source": "J.N. Darby, Synopsis of the Books of the Bible, Isaiah 53 (sacred-texts.com)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "These things have I spoken unto you, that My joy may be in you, and that your joy may be fulfilled.", "source": "Andrew Murray, The True Vine: Joy (citing John 15:11; ccel.org)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "She is doing this for Me. Real satisfaction is brought to the heart of God only when we are really, as people would think, wasting ourselves upon him.", "source": "Watchman Nee, The Normal Christian Life (goodreads.com/author/quotes/12878.Watchman_Nee)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "In Christ God has His perfect satisfaction, and has therefore committed Himself to Him.", "source": "T. Austin-Sparks, The Centrality and Universality of the Cross, ch. 1 (austin-sparks.net/m/Books-000739.html)"}], "declarations": ["I declare: Christ sees the travail of His soul and is satisfied.", "I declare: By His knowledge I am justified."], "prayer": "Lord Jesus, You see the travail of Your soul and are satisfied. By Your knowledge I am justified. Fill me with Your joy today, that my joy may be full.", "theme_flag": "theme-based: Murray, theme-based: Nee"}, {"day": 90, "ref": "Isaiah 53:12", "book": "Isaiah", "chapter": 53, "verse": 12, "text": "Therefore will I divide him a portion with the great, and he shall divide the spoil with the strong; because he hath poured out his soul unto death: and he was numbered with the transgressors; and he bare the sin of many, and made intercession for the transgressors.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "He poured out His soul unto death, and was numbered with the transgressors; therefore will I divide Him a portion with the great.", "source": "J.N. Darby, Synopsis of the Books of the Bible, Isaiah 53 (theme-based)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "As surely as He conquered sin and its curse for me, will He conquer it in its power in me.", "source": "Andrew Murray, Like Christ, ch. 4: Our Head (bible.prayerrequest.com)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "He crushed the serpent's head and dealt with the rebellious Satan and all his works on the cross.", "source": "Watchman Nee, The Present Testimony (4), ch. 11 'The Nature of Christ's Victory and the Church' (bibleread.online)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "He became defeated in order that He might triumph. He became dead in order that He might destroy death for ever.", "source": "T. Austin-Sparks, Vocational Fellowship, ch. 4 (austin-sparks.net/english/books/004362.html)"}], "declarations": ["I declare: Christ divides the spoil; He triumphed through defeat.", "I declare: In Him I am victor in the field."], "prayer": "Lord Jesus, You were numbered with transgressors, yet You triumphed and divide the spoil. In You I am victor. I stand in Your triumph today.", "theme_flag": "theme-based: Darby, theme-based: Murray, theme-based: Nee"}, {"day": 91, "ref": "Isaiah 59:20", "book": "Isaiah", "chapter": 59, "verse": 20, "text": "¶ And the Redeemer shall come to Zion, and unto them that turn from transgression in Jacob, saith the LORD.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "The Redeemer shall come to Zion, and unto them that turn from transgression.", "source": "J.N. Darby, Synopsis of the Books of the Bible, Isaiah 59 (sacred-texts.com)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Our Head suffered as a Surety, that in union with us He might bear sin for us.", "source": "Andrew Murray, Like Christ, ch. 4: Our Head (bible.prayerrequest.com)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "He who has ascended the cross and refuses to drink the vinegar mingled with gall is the one who knows the Lord.", "source": "Watchman Nee, The Release of the Spirit (goodreads.com/author/quotes/12878.Watchman_Nee)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "There is no situation so hopeless as to make it impossible for the glory of God to break in.", "source": "T. Austin-Sparks (deeperchristianquotes.com/author/dcq-taustinsparks/)"}], "declarations": ["I declare: The Redeemer has come to Zion.", "I declare: He turns me from transgression by His glory."], "prayer": "Lord Jesus, my Redeemer, You came to Zion for those who turn from sin. I turn to You today. Break into my hopeless places with Your glory.", "theme_flag": "theme-based: Murray, theme-based: Nee, theme-based: Sparks"}, {"day": 92, "ref": "Isaiah 61:1", "book": "Isaiah", "chapter": 61, "verse": 1, "text": "The Spirit of the Lord GOD is upon me; because the LORD hath anointed me to preach good tidings unto the meek; he hath sent me to bind up the brokenhearted, to proclaim liberty to the captives, and the opening of the prison to them that are bound;", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "The Spirit of the Lord GOD is upon Me; here chapter 61 exhibits Him in the full grace of His Person, anointed to preach.", "source": "J.N. Darby, Synopsis of the Books of the Bible, Isaiah 61 (sacred-texts.com)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "He makes Christ glorious to us and in us, and through us in them who have eyes to see.", "source": "Andrew Murray, The Spirit of Christ, Day 11 (biblestudytools.com)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "The Spirit is both a builder and a dweller. He cannot dwell where he has not built.", "source": "Watchman Nee, The Spiritual Man (goodreads.com/author/quotes/12878.Watchman_Nee)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "The mark of a life governed by the Holy Spirit is that such a life is continually and ever more and more occupied with Christ.", "source": "T. Austin-Sparks (deeperchristianquotes.com/author/dcq-taustinsparks/)"}], "declarations": ["I declare: The Spirit of the Lord is upon Christ, anointed to preach.", "I declare: I am occupied with Christ by the Holy Spirit."], "prayer": "Lord Jesus, anointed by the Spirit to preach good tidings, make Yourself glorious in me today. Let my life be continually occupied with You.", "theme_flag": "theme-based: Nee"}, {"day": 93, "ref": "Isaiah 61:2", "book": "Isaiah", "chapter": 61, "verse": 2, "text": "To proclaim the acceptable year of the LORD, and the day of vengeance of our God; to comfort all that mourn;", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "To proclaim the acceptable year of the LORD; the Lord stopped in the midst of verse 2, for the day of vengeance was not yet.", "source": "J.N. Darby, Synopsis of the Books of the Bible, Isaiah 61 (sacred-texts.com)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "He comes down as the Spirit of Glory, and reveals the glory of Christ in us by dwelling and working in us.", "source": "Andrew Murray, The Spirit of Christ, Day 11 (biblestudytools.com)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "His hand and His word not only comforted John but also gave strength.", "source": "Watchman Nee, Come, Lord Jesus (goodreads.com/author/quotes/12878.Watchman_Nee)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "By revelation of the Holy Spirit He was pleased to make known the mystery.", "source": "T. Austin-Sparks, The Centrality and Supremacy of the Lord Jesus Christ, ch. 1 (austin-sparks.net/m/Books-000729.html)"}], "declarations": ["I declare: Christ proclaims the acceptable year of the LORD.", "I declare: The Spirit reveals His glory in me."], "prayer": "Lord Jesus, You proclaim the acceptable year of the Lord. This is the day of grace. Reveal Your glory in me by Your Spirit today. Comfort and strengthen me.", "theme_flag": "theme-based: Nee, theme-based: Sparks"}, {"day": 94, "ref": "Jeremiah 23:5", "book": "Jeremiah", "chapter": 23, "verse": 5, "text": "¶ Behold, the days come, saith the LORD, that I will raise unto David a righteous Branch, and a King shall reign and prosper, and shall execute judgment and justice in the earth.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Finally (Jer. 23) the expression of Jehovah's indignation against these evil pastors gives rise to the declaration that He will raise up a Shepherd after His own heart, namely, the true Son of David, the Messiah.", "source": "J. N. Darby, Synopsis of the Books of the Bible, Jeremiah chapters 21-23 (stempublishing.com)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "His name signifies King of righteousness. He is also called, from the city where he reigned, Salem, meaning Peace, the King of peace.", "source": "Andrew Murray, The Holiest of All, Chapter 50, Melchizedek Made Like Unto the Son of God"}, {"name": "Watchman Nee", "short": "Nee", "comment": "May our Lord Jesus soon return to reign. Amen.", "source": "Watchman Nee, The Spiritual Man, Preface"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Nathanael answered him, TEACHER, thou art the Son of God, thou art King of Israel.", "source": "T. Austin-Sparks, The School of Christ, Chapter 1, The Breaking of the Self-Life"}], "declarations": ["I declare: Jesus Christ is my righteous King, and He reigns over my life today.", "I declare: The true Son of David shepherds me, and I follow Him."], "prayer": "Lord Jesus, You are the righteous Branch and my King. Rule in my heart today and lead me as Your sheep. Amen.", "theme_flag": "theme-based: Murray, Nee, Sparks"}, {"day": 95, "ref": "Jeremiah 23:6", "book": "Jeremiah", "chapter": 23, "verse": 6, "text": "In his days Judah shall be saved, and Israel shall dwell safely: and this is his name whereby he shall be called, THE LORD OUR RIGHTEOUSNESS.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Her name shall be 'Jehovah our Righteousness.'", "source": "J. N. Darby, Synopsis of the Books of the Bible, Jeremiah chapter 33 (stempublishing.com)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Of God are ye in Christ Jesus, who was made unto us wisdom from God, both righteousness and sanctification, and redemption.", "source": "Andrew Murray, Abide in Christ, Chapter 8, As Your Righteousness"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Similarly the obedience of one man, Christ, becomes the righteousness of many.", "source": "Watchman Nee, The Spiritual Man, chapter: Calvary's Judgment"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Christ is our Righteousness. 1 Cor. 1:30; Eph. 4:24; Phil. 3:9.", "source": "T. Austin-Sparks, In Christ, Chapter 1, Christ to be Expressed Through Believers"}], "declarations": ["I declare: The LORD is my righteousness, and I stand accepted in Christ.", "I declare: I am clothed in the righteousness of Jesus today."], "prayer": "Lord Jesus, You are Jehovah my Righteousness. I rest in what You have done for me, not in my own works. Amen.", "theme_flag": "theme-based: Darby, Murray, Nee, Sparks"}, {"day": 96, "ref": "Jeremiah 29:11", "book": "Jeremiah", "chapter": 29, "verse": 11, "text": "For I know the thoughts that I think toward you, saith the LORD, thoughts of peace, and not of evil, to give you an expected end.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Having insisted on the people's submission to the judgment, God reveals His own thoughts of grace.", "source": "J. N. Darby, Synopsis of the Books of the Bible, Jeremiah chapter 29 (stempublishing.com)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "It is good that a man should both hope and quietly wait for the salvation of the LORD.", "source": "Andrew Murray, Waiting on God, Day 25"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Such a hope separates him from earthly matters while joining him to the heavenly.", "source": "Watchman Nee, The Spiritual Man, chapter: A Spirit of Rapture"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "The hope of eternal life which God, who cannot lie, promised before times eternal. Titus 1:2.", "source": "T. Austin-Sparks, The Battle for Life, chapter: The Lord's Jealousy Over Life"}], "declarations": ["I declare: God thinks thoughts of peace toward me, and my future is secure in Christ.", "I declare: I have a living hope, and I will not fear what tomorrow brings."], "prayer": "Lord Jesus, I trust Your good plans for my life. Fill my heart with Your peace and Your hope today. Amen.", "theme_flag": "theme-based: Murray, Nee, Sparks"}, {"day": 97, "ref": "Jeremiah 33:3", "book": "Jeremiah", "chapter": 33, "verse": 3, "text": "Call unto me, and I will answer thee, and shew thee great and mighty things, which thou knowest not.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "However deeply sunk in despair the people might be, the Lord would never cast off Jacob, or His servant David, but would cause their captivity to return and would have mercy on them.", "source": "J. N. Darby, Synopsis of the Books of the Bible, Jeremiah chapter 33 (stempublishing.com)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "There is nothing about which the Lord Jesus has spoken so positively as the certainty of an answer to prayer.", "source": "Andrew Murray, The New Life, chapter XXXIV, Prayer"}, {"name": "Watchman Nee", "short": "Nee", "comment": "The more you want an answer to prayer from God, the more you desire to be clear with Him.", "source": "Watchman Nee, Sit, Walk, Stand, chapter: The God of Elijah"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Jesus answered and said unto him, Before Philip called thee, when thou wast under the fig tree, I saw thee.", "source": "T. Austin-Sparks, The School of Christ, Chapter 1, The Breaking of the Self-Life"}], "declarations": ["I declare: When I call on the Lord, He answers me and shows me great things.", "I declare: My God never casts me off; He hears my cry."], "prayer": "Lord Jesus, I call on You today. Answer me and show me the great and mighty things You have prepared. Amen.", "theme_flag": "theme-based: Darby, Nee, Sparks"}, {"day": 98, "ref": "Jeremiah 33:15", "book": "Jeremiah", "chapter": 33, "verse": 15, "text": "¶ In those days, and at that time, will I cause the Branch of righteousness to grow up unto David; and he shall execute judgment and righteousness in the land.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "It announces that the branch of righteousness shall grow up unto David, executing judgment and righteousness in the land.", "source": "J. N. Darby, Synopsis of the Books of the Bible, Jeremiah chapter 33 (stempublishing.com)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "He became the true Vine, that we might be true branches. Both in regard to Christ and ourselves the words teach us the two lessons of absolute dependence and perfect confidence.", "source": "Andrew Murray, The True Vine, Chapter 2"}, {"name": "Watchman Nee", "short": "Nee", "comment": "He is the vine and we the branches.", "source": "Watchman Nee, The Spiritual Man, chapter: God as the Life of the Body"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "What is true of the Vine must be true of the branches.", "source": "T. Austin-Sparks, In Christ, Chapter 3, In the Likeness of His Resurrection"}], "declarations": ["I declare: Jesus is the righteous Branch, and I am joined to Him by faith.", "I declare: I depend on Christ completely, and His life flows through me."], "prayer": "Lord Jesus, righteous Branch of David, grow Your life in me today. Keep me abiding in You. Amen.", "theme_flag": "theme-based: Murray, Nee, Sparks"}, {"day": 99, "ref": "Lamentations 3:22", "book": "Lamentations", "chapter": 3, "verse": 22, "text": "¶ It is of the LORD’s mercies that we are not consumed, because his compassions fail not.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "But the truth of this relation with Jehovah, while making him feel the affliction more deeply, sustained him also (v. 22).", "source": "J. N. Darby, Synopsis of the Books of the Bible, Lamentations chapter 3 (stempublishing.com)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Sink down before Him in humility, meekness, patience, and surrender to His goodness and mercy.", "source": "Andrew Murray, The Deeper Christian Life, chapter 1"}, {"name": "Watchman Nee", "short": "Nee", "comment": "I beseech you therefore, brethren, by the mercies of God, to present your bodies a living sacrifice.", "source": "Watchman Nee, The Normal Christian Life, chapter: One Living Sacrifice"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "The graciousness of Divine love, compassion, tenderness, considerateness, humility, etc., are the glory of God.", "source": "T. Austin-Sparks, In Christ, Chapter 4, Ascension and Glory"}], "declarations": ["I declare: The mercies of the Lord never fail me; they hold me up every day.", "I declare: I am not consumed, because His compassion sustains me."], "prayer": "Lord Jesus, I thank You for Your unfailing mercies. Sustain me today by Your compassion. Amen.", "theme_flag": "theme-based: Murray, Nee, Sparks"}, {"day": 100, "ref": "Lamentations 3:23", "book": "Lamentations", "chapter": 3, "verse": 23, "text": "They are new every morning: great is thy faithfulness.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "He feels and speaks from the place of affliction, but his soul is humbled in him when personally thus in intercourse with Jehovah, and so has hope.", "source": "J. N. Darby, Synopsis of the Books of the Bible, Lamentations chapter 3 (stempublishing.com)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "The Lord is good, even His children often do not know it, for they do not wait in quietness for Him to reveal it. But, to those who persevere in waiting, whose souls do wait, it will come true.", "source": "Andrew Murray, Waiting on God, Day 24, To Know His Goodness"}, {"name": "Watchman Nee", "short": "Nee", "comment": "He requires us to bear Him witness fearlessly, to suffer pain and shame for Him valiantly, to accept loss of all things with courage, and to rely on the Lord's love, wisdom, power and faithfulness with confidence.", "source": "Watchman Nee, The Spiritual Man, chapter: A Spirit of Power"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "These things saith the Amen, the faithful and true witness. Rev. 3:14.", "source": "T. Austin-Sparks, The School of Christ, Chapter 2, Learning the Truth"}], "declarations": ["I declare: Great is the faithfulness of my God; His mercies are new every morning.", "I declare: I rely on the Lord's faithfulness with full confidence today."], "prayer": "Lord Jesus, faithful and true Witness, I praise You for Your mercies renewed this morning. Keep me trusting You. Amen.", "theme_flag": "theme-based: Murray, Nee, Sparks"}, {"day": 101, "ref": "Ezekiel 34:23", "book": "Ezekiel", "chapter": 34, "verse": 23, "text": "And I will set up one shepherd over them, and he shall feed them, even my servant David; he shall feed them, and he shall be their shepherd.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "He would raise up the true and only shepherd, David (that is, the well-beloved Messiah).", "source": "J. N. Darby, Synopsis of the Books of the Bible, Ezekiel chapter 34 (stempublishing.com)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "He saw the multitude, and was moved with compassion on them, because they were scattered abroad, as sheep having no shepherd.", "source": "Andrew Murray, With Christ in the School of Prayer, Seventh Lesson"}, {"name": "Watchman Nee", "short": "Nee", "comment": "The good shepherd lays down his life for the sheep. John 10:11, 15, 17.", "source": "Watchman Nee, The Spiritual Man, chapter: The Soul Life"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Jesus saith unto him, I am the way, and the truth, and the life. John 14:6.", "source": "T. Austin-Sparks, The School of Christ, Chapter 2, Learning the Truth"}], "declarations": ["I declare: Jesus is my one Shepherd, and I am safe under His care.", "I declare: My Shepherd laid down His life for me; I will follow Him."], "prayer": "Lord Jesus, my Shepherd, lead me today. I trust Your care over my life. Amen.", "theme_flag": "theme-based: Murray, Nee, Sparks"}, {"day": 102, "ref": "Ezekiel 36:26", "book": "Ezekiel", "chapter": 36, "verse": 26, "text": "A new heart also will I give you, and a new spirit will I put within you: and I will take away the stony heart out of your flesh, and I will give you an heart of flesh.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Cleansing them from all their filthiness; taking away the hardness of their hearts, giving them His Spirit.", "source": "J. N. Darby, Synopsis of the Books of the Bible, Ezekiel chapter 36 (stempublishing.com)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "In the new covenant God's first promise is, I will write My law in the heart: a new heart will I give thee.", "source": "Andrew Murray, The Holiest of All, Chapter 55, Jesus, The Surety of A Better Covenant"}, {"name": "Watchman Nee",
