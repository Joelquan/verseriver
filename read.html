y", "comment": "You have thus received the new life from God. You are now as new-born infants: He would teach you in this word what is necessary that you may grow and wax strong. The first point is: you must know that you are God's children. Hear how distinctly Peter says this to those just converted: (1 Pet. 1:23; 2:2,10,25) You have been born again,' you are new-born infants,' you are now converted,' you are now the people of God.' A Christian, however young and weak he is, must know that he is God's child. Then only can he have the courage to believe that he shall make progress, and the boldness to use the food of the children provided in the word.", "source": "The New Life"}, {"name": "Watchman Nee", "short": "Nee", "comment": "It does not matter what your personal deficiency, God has always one sufficient answer, His Son Jesus Christ, and he is the answer to every need.", "source": "The Normal Christian Life"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Three things in that paragraph: the gift of grace; the goal of grace; the method of grace.", "source": "The Grace of God"}], "declarations": ["I declare: the grace of God that brings salvation has appeared to all men in Christ.", "I declare: I am saved by the grace of God in Jesus."], "prayer": "Lord Jesus, grace of God, You have appeared bringing salvation. Teach me to live soberly and godly as I wait for You. Amen.", "theme_flag": "theme-based: Murray, theme-based: Nee"}, {"day": 307, "ref": "Titus 2:13", "book": "Titus", "chapter": 2, "verse": 13, "text": "Looking for that blessed hope, and the glorious appearing of the great God and our Saviour Jesus Christ;", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "But our future also is enlightened by grace. It teaches us to wait for the blessed hope, and the appearing of the glory of our great God and Saviour Jesus Christ. Grace has appeared. It teaches us how to walk here below, and to expect the appearing of the glory in the person of Jesus Christ Himself. And our hope is well founded. Christ is justly precious to us. We can have full confidence of heart in thinking of His appearing in glory, as well as the most powerful motive, for a life devoted to His glory.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Be of good courage, and he shall strengther your heart, all ye that wait on the Lord.” Blessed Father, we humbly beseech Thee, let none that wait on Thee be ashamed; no, not one. Some are weary, and the time of waiting appears long. And some are feeble, and scarcely know how to wait. And some are so entangled in the effort of their prayers and their work, they think that they can find no time to wait continually. Father, teach us all how to wait! Teach us to think of each other, and pray for each other. Teach us to think of Thee, the God of all waiting ones. Father, let none that wait on Thee be ashamed! For Jesus’ sake. Amen.", "source": "Waiting on God, Day 28"}, {"name": "Watchman Nee", "short": "Nee", "comment": "A person who wholly follows the Lord is one who believes that the promises of God are trustworthy, that He is with His people, and that they are well able to overcome.", "source": "Watchman Nee"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "May the Lord fill us with new joy in the very contemplation of His near coming, to complete all that which He has begun.", "source": "The Octave of Redemption"}], "declarations": ["I declare: I look for that blessed hope, the glorious appearing of my great God and Saviour Jesus Christ.", "I declare: Christ's return is my hope and expectation."], "prayer": "Lord Jesus, my blessed hope, I look for Your glorious appearing. Keep my heart expectant and my life pure. Amen.", "theme_flag": "theme-based: Nee"}, {"day": 308, "ref": "Titus 3:5", "book": "Titus", "chapter": 3, "verse": 5, "text": "Not by works of righteousness which we have done, but according to his mercy he saved us, by the washing of regeneration, and renewing of the Holy Ghost;", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "It has been a question, When does this renewal tak place? Is it at the commencement, or is it after regeneration* of which the apostle speaks? I thin the apostle speaks of it according to the character of work ; and adds “shed on us” (that which character ® radvyyevecta, the word here used, is not simply being born a (avayevdwv). It is used, besides this passage, only in the Matthew xix. for the millennium. the grace of this present period) to shew that there is an additional truth, namely, that the Holy Ghost, as “shed on us,” continues in order to maintain by His power the enjoyment of the relationship into which He has brought us.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "And all this rich blessing which lies in baptism is received by faith. He that believeth, and is baptized, shall be saved.' Baptism was not only a confession on man's part of the faith that he who would be a disciple already had, but equally on God's part a seal for the confirmation of faith, a covenant token in which the whole treasury of grace lay open, to be enjoyed throughout life. As often as a baptized believer sees a baptism administered, or reflects upon it, it is to be to him an encouragement to press by an over-growing faith into the full life of salvation that the Three-One desires to work in him.", "source": "The New Life"}, {"name": "Watchman Nee", "short": "Nee", "comment": "For Christianity begins not with a big do, but with a big done.", "source": "Sit, Walk, Stand"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "We are founded upon the grace of God in Jesus Christ, not upon merit or worthiness or goodness in ourselves.", "source": "Features of Zion"}], "declarations": ["I declare: Not by works of righteousness which I have done, but according to His mercy He saved me.", "I declare: My salvation is by mercy, not by merit, through Christ."], "prayer": "Lord Jesus, not by my works but by Your mercy You saved me. Keep me humble and grateful for Your washing and renewing. Amen.", "theme_flag": "theme-based: Nee, theme-based: Sparks"}, {"day": 309, "ref": "Philemon 1:25", "book": "Philemon", "chapter": 1, "verse": 25, "text": "The grace of our Lord Jesus Christ be with your spirit. Amen.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "If it be so, the he speaks thus of Onesimus to the Christians se is another proof of his loving care for this © onvert, He lays him thus upon the hearts of the stle to the Ephesians there are no saipiadiess same Tychicus is its bearer. Timothy is joined Paul in the address of the Epistle to the Colossians, ell as in this to Philemon. It was not so in the seems to me, from the way in which the apostle speaks, e even thought Onesimus would be an instrument of God Church, useful in the Lord’s service. He would have rehim to minister to himself in the bonds of the gospel ; but ts his connection with Philemon.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Consider that He is your life, with all that He has. Believe that He gives His humility to you. The word: Do it to the Lord Jesus,' means, Be clothed with the Lord Jesus.' Be clothed with humility, in order that you may be clothed with Jesus. It is Christ in you that shall fill you with humility. Blessed Lord Jesus, there never was any one amongst the children of men so high, so holy, so glorious as Thou. And never was there any one who was so lowly and ready to deny himself as the servant of all. O Lord, when shall we learn that lowliness is the grace by which man can be most closely conformed to the divine glory? O teach me this. Amen. 1.", "source": "The New Life"}, {"name": "Watchman Nee", "short": "Nee", "comment": "The grace of the Lord in our spirit is our help at any time.", "source": "The Spiritual Man (2)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Growing in grace and in the knowledge of our Lord and Saviour Jesus Christ is in the realm of our spirits.", "source": "He That is Joined to the Lord is One Spirit"}], "declarations": ["I declare: the grace of our Lord Jesus Christ is with my spirit.", "I declare: I live under the grace of Christ today."], "prayer": "Lord Jesus, let Your grace be with my spirit. Go with me through this day, and let Your favor rest on me. Amen.", "theme_flag": "theme-based: Murray, theme-based: Nee, theme-based: Sparks"}, {"day": 310, "ref": "Hebrews 1:1", "book": "Hebrews", "chapter": 1, "verse": 1, "text": "God, who at sundry times and in divers manners spake in time past unto the fathers by the prophets,", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "The epistle then does not desire to establish again the true but elementary doctrines which belonged to the times when Christ was not manifested, but to go forward to the full revelation of His glory and position according to the counsels of God revealed in the word. The Holy Ghost would not go back again to these former things, because new things had been brought in in connection with the heavenly glory of the Messiah, namely, Christianity characterised by the power of the Holy Ghosfc. But if any one who had been brought under that power, who had known it, should afterwards abandon it, he could not be renewed again to repentance.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "But, taught by the Holy Spirit, our writer sees how all redemption is wrought only through the Son, and how, there fore, the building up of Zion and the appearing in His glory (ver. 1 6), the looking down from the sanctuary and the loosing those who are appointed unto death (ver. 20), all points to the Son as Redeemer. And then what follows is true of Him too. It is : \" Thou hast laid the foundations of the earth, and the heavens are the work of Thy hands : they shall perish, but Thou shalt endure.\" God is the Almighty and everlasting : these are the attributes of Him to whom our salvation is entrusted. Listen, believer!", "source": "The Holiest of All, on Hebrews 1"}, {"name": "Watchman Nee", "short": "Nee", "comment": "We believe that the Bible is God's revelation to us. In other words, it is His spoken word to us.", "source": "The Normal Christian Faith"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Therefore, God's last word is in His Son.", "source": "Companions of Christ and the Heavenly Calling"}], "declarations": ["I declare: God has spoken to me by His Son in these last days.", "I declare: I hear God's final word in Jesus Christ."], "prayer": "Lord Jesus, God's final Word, speak to me today. I turn from all other voices to hear You alone. Amen.", "theme_flag": "theme-based: Nee"}, {"day": 311, "ref": "Hebrews 1:2", "book": "Hebrews", "chapter": 1, "verse": 2, "text": "Hath in these last days spoken unto us by his Son, whom he hath appointed heir of all things, by whom also he made the worlds;", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "We have a High Priest who has passed through the heavens — as Aaron through the successive parts of the tabernacle — Jesus, the Son of David. He has, in all things, been tempted like ourselves, sin apart; so that He can sympathise with our infirmities. The word brings to light the intents of the heart, judges the will, and all that has not God for its * The connection between the word addressed to man an God Himself is very remarkable here. object and its source. Then, as far as weakness is concerned, we have His sympathy. Christ of course had no evil desires : He was tempted in every way, apart from sin. Sin had no part in it at all.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "He that sets his heart upon the living God will find the living God take possession and fill the heart. It is this that makes it of such infinite consequence that we should not only have a general idea of the Christ through whom God speaks to us, but should know Him aright and have our heart filled with all that God has revealed of Him. Our knowledge of Him will be the food of our faith, and as our faith is will be our experience of His saving power, and of the fellowship with God to which He leads. Let us listen to what we are taught of the Son in whom God speaks to us. Whom He appointed Heir of all things.", "source": "The Holiest of All, on Hebrews 1"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Isaac alone was the heir of the inheritance and promises.", "source": "Questions on the Gospel"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "This Son, whom we know as our Saviour and Lord, was God's agent in the creation of the worlds.", "source": "Companions of Christ and the Heavenly Calling"}], "declarations": ["I declare: Christ is the Heir of all things, by whom God made the worlds.", "I declare: I am a joint-heir with Christ."], "prayer": "Lord Jesus, Heir of all things, Maker of the worlds, I worship You. Make me a faithful steward of my inheritance in You. Amen.", "theme_flag": "theme-based: Nee"}, {"day": 312, "ref": "Hebrews 1:3", "book": "Hebrews", "chapter": 1, "verse": 3, "text": "Who being the brightness of his glory, and the express image of his person, and upholding all things by the word of his power, when he had by himself purged our sins, sat down on the right hand of the Majesty on high;", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "He is then the Creator. God is revealed in His Person. He sustains all things by His word, which has thus a divine power. But this is not all (for we are still speaking of the Christ) ; there is another part of His glory, divine indeed, yet manifested in human nature. He who was all this which we have just seen, when He had by Himself (accomplishing His own glory,* and for His glory) wrought the purification of our sins, seated Himself at the right hand of the Majesty on high. Here is in full the personal glory of Christ. He is in fact the Creator, the revelation of God, the upholder of all things by His word. He is the Redeemer.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Who, when he had made purification1 of sins, sat down on the right hand of the Majesty on high. THE description of the glory of Christ's person is followed by that of the work of this Son in whom God speaks to us. God's words are deeds. It is in what Christ is and works that God speaks to us. In His divinity and incarnation we see what God has given us. In His life and death and ascension we see how the gift of God enters and acts in all our human life, how complete our salvation is, and what God now asks of us. All Christ's work is God's word to us. That work consists in two parts : the one on earth, the other in heaven.", "source": "The Holiest of All, on Hebrews 1"}, {"name": "Watchman Nee", "short": "Nee", "comment": "They are trying to look within, to differentiate, to discriminate, to analyze, and in doing so are bringing themselves into deeper darkness. Look to Christ instead.", "source": "The Normal Christian Life"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Jesus Christ is the personal embodiment and expression of the glory of God.", "source": "The Ministry of the Church"}], "declarations": ["I declare: Christ is the brightness of God's glory and the express image of His person.", "I declare: in Christ I see God exactly."], "prayer": "Lord Jesus, brightness of God's glory, express image of His person, reveal the Father to me. Uphold me by Your powerful word. Amen.", "theme_flag": "theme-based: Nee"}, {"day": 313, "ref": "Hebrews 1:8", "book": "Hebrews", "chapter": 1, "verse": 8, "text": "But unto the Son he saith, Thy throne, O God, is for ever and ever: a sceptre of righteousness is the sceptre of thy kingdom.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "God tells us what He is. Of the angels He says, \" He maketh his angels spirits, and his ministers a flame of fire.\" He does not make His Son anything: He recognises that which He is, saying, \"Thy throne, O God, is for ever and ever.\" The Messiah may have an earthly throne (which also is not taken from Him, but which ceases by His taking possession of an eternal throne), but He has a throne which is for ever and ever. The sceptre of His throne, as Messiah, is a sceptre of righteousness. Also He has, when here below personally loved righteousness and hated iniquity: therefore God has anointed Him with the oil of gladness above His fellows.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Thy throne, 0 God, is for ever and ever. As God, Christ is King : the throne of heaven belongs to Him. When an earthly father has begotten a son, they may be separated from each other by great distance, both in place and character, and know each other no more. In the divine Being it is not so. The Father and the Son are inseparable, one in life and love ; all that the Father is and has, the Son is and has too. The Father is ever in the Son, and the Son in the Father. God is on the throne and Christ in Him : the throne and the kingdom are Christ's too. For ever and ever. Christ is the King eternal. His dominion is an everlasting dominion.", "source": "The Holiest of All, on Hebrews 1"}, {"name": "Watchman Nee", "short": "Nee", "comment": "God's works issue from God's throne; God's throne is established upon authority.", "source": "Authority and Submission"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "A glorious throne set on high from the beginning. Of the Son, He saith, Thy throne, O God, is for ever and ever!", "source": "Vocational Fellowship"}], "declarations": ["I declare: Thy throne, O God, is for ever and ever; Christ reigns eternally.", "I declare: I serve the King whose kingdom never ends."], "prayer": "Lord Jesus, Your throne is for ever and ever. Reign in my heart as You reign in heaven; establish Your righteousness in me. Amen.", "theme_flag": "theme-based: Nee"}, {"day": 314, "ref": "Hebrews 2:18", "book": "Hebrews", "chapter": 2, "verse": 18, "text": "For in that he himself hath suffered being tempted, he is able to succour them that are tempted.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "As man, all things are put in subjection under Him; nevertheless, before being glorified, He took part in all the sufferings and in all the temptations to which the saints, whose nature He had assumed, are subjected. With this glory His priesthood is connected : He is able to succour them that are tempted, in that He Himself hath suffered being tempted. Thus He is the Apostle and the High Priest of the \" called \" people. To this twofold glory is joined an accessory glory : He is Head, as Son, over God's house, possessing this authority as the One who created all things, even as Moses had authority as a servant in the house of God on earth.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "WE know how much the Epistle has already said of the true humanity and sympathy of the Lord Jesus. In chap. ii. we read : It became God to perfect Him through suffering ; Since the children are sharers of flesh and blood, He also in like manner partook of the same. It behoved Him in all things to be made like unto His brethren. In that He Him self hath suffered, being tempted, He is able to succour them that are tempted. And in chap. iv. we have just heard, We have not a high priest who is not able to sympathise with our weaknesses, but one who hath in all things been tempted like as we are.", "source": "The Holiest of All, on Hebrews 2"}, {"name": "Watchman Nee", "short": "Nee", "comment": "God must bring us to a point where, through a deep and dark experience, our natural power is touched and fundamentally weakened, so that we no longer dare trust ourselves.", "source": "The Normal Christian Life"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "He has been the way of the winepress and we have received the benefit. Having suffered, He is able to succour the tempted.", "source": "The On-High Calling, Vol. I and Vol. II"}], "declarations": ["I declare: Christ suffered being tempted, and He is able to help me when I am tempted.", "I declare: I run to Christ for help in every temptation."], "prayer": "Lord Jesus, You suffered being tempted, and You know how to help me. Succour me in my temptation today; I lean on You. Amen.", "theme_flag": "theme-based: Nee"}, {"day": 315, "ref": "Hebrews 4:12", "book": "Hebrews", "chapter": 4, "verse": 12, "text": "For the word of God is quick, and powerful, and sharper than any twoedged sword, piercing even to the dividing asunder of soul and spirit, and of the joints and marrow, and is a discerner of the thoughts and intents of the heart.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "But he alludes to the covenant (already known to the Jews as declared before of God) which gave the authority of the scriptures to this testimony, that God remembered no more the sins of His people who are sanctified and admitted into His favour, and which, at the same time, presented these two thoughts: first, that this complete pardon did not exist under the first covenant: and, second, that the door is left open for the blessing of the nation when the new covenant shall be formally established. Another practical consequence is drawn : sins being remitted, there is no more oblation for sin.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "For the word of God is living, and active, and sharper than any two-edged sword, and piercing even to the dividing asunder of soul and spirit, of both joints and marrow, and quick to discern the thoughts and intents of the heart. 13. And there is no creature that is not manifest in his sight: but all things are naked and laid open before the eyes of him with whom we have to do. THEY have been earnest words with which the writer has been warning the Hebrews against unbelief and disobedience, harden ing the heart and departing from God, and coming short of the promised rest.", "source": "The Holiest of All, on Hebrews 4"}, {"name": "Watchman Nee", "short": "Nee", "comment": "What we must do is lie on the altar. It is our High Priest's job to apply the sharp knife to us to divide our soul from our spirit.", "source": "Sermon: The Word of God, on Hebrews 4:12"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "The word of God divides between soul and spirit.", "source": "The Most Difficult Thing in the World"}], "declarations": ["I declare: the word of God is living and powerful, discerning my heart.", "I declare: I submit to the searching word of Christ."], "prayer": "Lord Jesus, living Word of God, pierce my heart with Your truth. Divide what is of You from what is of me. Amen.", "theme_flag": null}, {"day": 316, "ref": "Hebrews 4:14", "book": "Hebrews", "chapter": 4, "verse": 14, "text": "Seeing then that we have a great high priest, that is passed into the heavens, Jesus the Son of God, let us hold fast our profession.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "If then we are sanctified — set apart to God — by this offering according to the will of God Himself, we are also made perfect for God by the same offering, as presented to Him in the Person of Jesus. We have seen that this position has its origin in the will, the good- will of God (a will which combines the grace and the purpose of God), and that it has its foundation and present certainty in the accomplishment of the work of Christ, the perfection of which is demonstrated by the session at the right hand of God of Him who accomplished it.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "The name Jesus speaks of His humanity, and of His work as a Saviour from sin. This is the first work of the priest — the cleansing, the putting away of sin. The name Son of God speaks of His divinity, and His power as High Priest, really to bring us to God, into the very life and fellowship of the Holy One. It is in His Son God speaks to us ; it is to the perfect fellowship and blessedness of the ever-blessed One that our great High Priest that is passed through the heavens can, and does indeed, bring us. Having, therefore, a great High Priest, let us hold fast our confession! He is (iii. i) the Apostle and High Priest of our confession.", "source": "The Holiest of All, on Hebrews 4"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Now, through the cross of the Lord Jesus we can enter the Holy of Holies any time.", "source": "The Christian (4): Spiritual Teachings"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "He has passed through the heavens as High Priest. Then all His priestly work is perfect, all that He has done in mediation is fulfilled to the last stage.", "source": "That Which Was From The Beginning"}], "declarations": ["I declare: I have a great High Priest, Jesus the Son of God, passed into the heavens.", "I declare: I hold fast my confession of Christ."], "prayer": "Lord Jesus, my great High Priest in heaven, I hold fast my confession of You. Represent me before the Father today. Amen.", "theme_flag": "theme-based: Nee"}, {"day": 317, "ref": "Hebrews 4:15", "book": "Hebrews", "chapter": 4, "verse": 15, "text": "For we have not an high priest which cannot be touched with the feeling of our infirmities; but was in all points tempted like as we are, yet without sin.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Secondly, Christ was not to offer Himself often, as the high priest went in every year with the blood of others. For He offered up Himself. Hence, if all that was available in the sacrifice was not brought to perfection by a single offering once made, He must have suffered often since the foundation of the world.* This remark leads to the clear and simple declaration of the ways of God on this point a declaration of priceless value. God allowed ages to pass (the different distinct periods in which man lias in divers ways been put to the test, and in which lie has had time to shew what he is) without ye,i accomplishing His work of grace.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "But the truth has a far deeper meaning and application, It has special reference to the temptation which meets the soul in the desire to live wholly for God. Jesus suffered, being tempted : it was the temptation to refuse the Father's will that caused His deepest suffering. As the believer, who seeks in all things to do the will of God, understands this, the truth of the sympathising High Priest becomes doubly precious. What is the ordinary experience of those who set them selves with their whole heart to live for God ? It happens very often that it is only then they begin to find out how sinful they are.", "source": "The Holiest of All, on Hebrews 4"}, {"name": "Watchman Nee", "short": "Nee", "comment": "He feels with you. He is always sympathetic toward your infirmities, never to the sins you commit, but always to the sufferings of your body and distresses of your soul.", "source": "Sermon: God's Sympathy for Our Weakness"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "We have not a high priest that cannot be touched with the feeling of our infirmities; but one that hath been in all points tempted like as we are.", "source": "The On-High Calling, Vol. I and Vol. II"}], "declarations": ["I declare: my High Priest is touched with the feeling of my infirmities.", "I declare: Christ understands my weakness and helps me."], "prayer": "Lord Jesus, touched with my infirmities, tempted as I am yet without sin, have mercy on me. You understand; help me. Amen.", "theme_flag": null}, {"day": 318, "ref": "Hebrews 4:16", "book": "Hebrews", "chapter": 4, "verse": 16, "text": "Let us therefore come boldly unto the throne of grace, that we may obtain mercy, and find grace to help in time of need.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "I have said preserved, because this is the subject of the epistle;* but it must be added, that these relationships are established on this ground by divine revelations, which communicate the will of God and the conditions under which He is pleased to connect Himself with His people. We should also remark, that in the Epistle to the * It will be found, I think, that in Hebrews the exercise of the heavenly priesthood is not applied to the case of a fall into sin. It is for mercy and grace to help in time of need. Its subject is access to God, having the High Priest on high; and this we always have.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "IV.— 16. Let us therefore draw near with boldness unto the throne of grace that we may receive mercy, and may find grace to help us in time of need.1 IN the first two chapters the true divinity and the real humanity of our Saviour were set before us, as the very foundation of our faith and life. In the two verses we have just been considering these two truths are applied to the priesthood of Christ. Having a great High Priest who hath passed through the heavens ; having an High Priest who is able to sympathise ; let us draw near. The one work of the High Priest is to bring us near to God.", "source": "The Holiest of All, on Hebrews 4"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Brothers, if God brings us to the point of seeing that everything in God's work depends upon His blessing, it will bring about a basic change in our labor for God.", "source": "Devotions by Watchman Nee"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "We have the right, we have access, we have an open way.", "source": "All Righteousness Fulfilled"}], "declarations": ["I declare: I come boldly to the throne of grace to obtain mercy.", "I declare: I find grace to help in time of need through Christ."], "prayer": "Lord Jesus, I come boldly to Your throne of grace. Give me mercy and grace to help in my time of need. Amen.", "theme_flag": "theme-based: Nee"}, {"day": 319, "ref": "Hebrews 6:19", "book": "Hebrews", "chapter": 6, "verse": 19, "text": "Which hope we have as an anchor of the soul, both sure and stedfast, and which entereth into that within the veil;", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "The apostle then sets before us the instrument which God employs to judge the unbelief and all the workings of the heart which tend, as we have seen, to lead the believer into departure from the position of faith, and to hide God from him by inducing him to satisfy his flesh and to seek for rest in the wilderness To the believer who is upright in heart this judgment is of great value, as that which enables him to discern all that has a tendency to hinder his progress or make him slacken his steps.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Them that draw near unto God through Him. In ver. 19 we saw that to enable us to draw nigh to God is the better hope the gospel brings — the one aim of Christ's priesthood. Here we have it again. One reason why so many have no conception of Christ as able to save completely is simply that they have never understood fully what salvation is. The following chapters will open it up to us — and may God's Spirit truly open it ! — that to come to God through Christ, to draw nigh to God means nothing less than an entering into the Holiest of All, and dwelling there all the day, spending our life there, abiding there con tinually.", "source": "The Holiest of All, on Hebrews 6"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Faith comes from casting our anchor in the Lord Jesus.", "source": "The Present Testimony"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Hope is grounded and anchored outside of time.", "source": "The Gospel According to Paul"}], "declarations": ["I declare: my hope in Christ is an anchor of the soul, sure and steadfast.", "I declare: I am held firm by hope in Christ."], "prayer": "Lord Jesus, my anchor within the veil, hold me sure and steadfast. When storms rise, keep my soul fastened to You. Amen.", "theme_flag": "theme-based: Nee, theme-based: Sparks"}, {"day": 320, "ref": "Hebrews 7:25", "book": "Hebrews", "chapter": 7, "verse": 25, "text": "Wherefore he is able also to save them to the uttermost that come unto God by him, seeing he ever liveth to make intercession for them.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Thus He saves completely, and to the end, those that come unto God by Him, seeing that He ever lives to intercede for them. Accordingly \" such a high priest became us.\" Glorious thought ! Called to be in the presence of God, to be in relationship with Him in the heavenly glory, to draw near to Him on high, where nothing that defiles can enter, we needed a High Priest in the place to which access was given us (as the Jews in the earthly temple), and such a One as the glory and purity of heaven required. What a demonstration that we belong to heaven, and of the exalted nature of our relationship with God !", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Wherefore also he is able to save to the uttermost1 them that draw near unto God through hi™, seeing he ever liveth to make intercession for them. IN the order of Aaron there was a continual succession of priests, one dying and another taking his place. That charac terised the whole system ; it bore the mark of change and weakness and death. It could not effect anything that was really abiding and permanent, much less anything that was eternal. The whole inner life of the worshipper was what the system was, subject to change and decay. But He, because He abideth for ever, hath His priesthood unchangeable.", "source": "The Holiest of All, on Hebrews 7"}, {"name": "Watchman Nee", "short": "Nee", "comment": "He will forever be the Son of Man to save us to the uttermost.", "source": "The Christian (2): Meditations on Revelation"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "He is now in heaven: our High Priest, our Advocate on high with God. He ever lives to make intercession for us.", "source": "The Salvation of God in Christ"}], "declarations": ["I declare: Christ ever lives to make intercession for me, and saves to the uttermost.", "I declare: I am completely saved by the living Christ."], "prayer": "Lord Jesus, ever living to intercede for me, save me to the uttermost. Pray for me today as I come to God by You. Amen.", "theme_flag": null}, {"day": 321, "ref": "Hebrews 9:28", "book": "Hebrews", "chapter": 9, "verse": 28, "text": "So Christ was once offered to bear the sins of many; and unto them that look for him shall he appear the second time without sin unto salvation.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Moreover, this result is announced to the believer to those who are looking for the Lord's return. Death and judgment are the lot of men as children of Adam. Christ has been offered once to bear the sins of many ; and \" unto them that look for him shall he appear the second time without sin unto salvation,\" not to judgment. For them, as to their standing before God, sin is even now put away : as Christ is, so are they ; their own sins are all blotted out. Christ appeared the first time in order to be made sin for us, and to bear our sins ; they were laid upon Him on the cross.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "As it is appointed unto men once to die, and after this the judgment— with death, life is finished and complete, and ripe for judgment ; after that comes the full revelation of what that death was — so Christ also, having been once offered to bear the sins of many, shall appear a second time — in the full manifestation of what that death accomplished — without sin, to them that wait for Him, unto salvation. 824 abe Dolieet of What is done once is done for ever : all it waits for is the ever lasting manifestation of what is already perfect and complete.", "source": "The Holiest of All, on Hebrews 9"}, {"name": "Watchman Nee", "short": "Nee", "comment": "This indicates that the work of redemption was finished.", "source": "Questions on the Gospel"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "The last glorious part of our salvation is that Jesus is coming again, and in His coming our salvation will be consummated.", "source": "The Salvation of God in Christ"}], "declarations": ["I declare: Christ was once offered to bear my sins, and He will appear again unto salvation.", "I declare: I look for Christ's return with hope."], "prayer": "Lord Jesus, once offered to bear my sins, come again unto my salvation. I look for You with longing heart. Amen.", "theme_flag": "theme-based: Nee"}, {"day": 322, "ref": "Hebrews 10:25", "book": "Hebrews", "chapter": 10, "verse": 25, "text": "Not forsaking the assembling of ourselves together, as the manner of some is; but exhorting one another: and so much the more, as ye see the day approaching.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "God will remember their sins no more; and they will be washed in the clean water of the word. The second exhortation is to persevere in the profession of the hope without wavering. He who made the promises is faithful. Not only should we have this confidence in God for X. ourselves, but we are also to consider one another for mutual encouragement ; and, at the same time, not to fail in the public and common profession of faith, pretending to maintain it, while avoiding the open identification of oneself with the Lord's people in the difficulties connected with the profession of this faith before the world.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Not forsaking the assembling of ourselves together, as the custom of some is. If we would rightly apprehend the import of this word let us not forget the link to its context. Our section has been teaching us what life in the Holiest is to be. As those who have drawn near to God we are to draw near to our fellow-men. Meeting God is a thing of infinite blessedness and peace and power. Meeting our fellow-men is often accompanied with so much of weakness, distraction, and failure that some have thought it indeed better to forsake the assembling together.", "source": "The Holiest of All, on Hebrews 10"}, {"name": "Watchman Nee", "short": "Nee", "comment": "If possible, all the brothers and sisters should attend this meeting.", "source": "Messages for Building Up New Believers (1)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "There is always something more of the Lord in relatedness than in isolation.", "source": "The Stewardship of the Mystery - Volume 1"}], "declarations": ["I declare: I will not forsake assembling with believers, as I see the day approaching.", "I declare: I gather with God's people in light of Christ's coming."], "prayer": "Lord Jesus, as I see Your day approaching, draw me to Your people. Keep me from forsaking fellowship; knit us together in You. Amen.", "theme_flag": "theme-based: Sparks"}, {"day": 323, "ref": "Hebrews 11:1", "book": "Hebrews", "chapter": 11, "verse": 1, "text": "Now faith is the substance of things hoped for, the evidence of things not seen.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "The former things of Judaism must be, and were, left behind by that into which he had entered. Christians could not deal with souls by them ; and, as for the new things, he had given them up. All God's means had been employed for him and had produced nothing. Such a one — of his own will — crucified for himself the Son of God. Associated with the people who had done so, he had acknowledged the sin which his people had committed, and owned Jesus to be the Messiah. But now he committed the crime,* knowingly and of his own will. The judgment, the resurrection of the dead, repentance from dead works, had been taught.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "It is only when the eternal realities draw near and exercise their power that faith becomes and is the substance of things hoped for, the foundation which they lay in the soul, the proof or conviction of things unseen, the convincing power with which they give evidence and proof of their own super natural existence.1 Faith as a dormant faculty is the capacity for receiving this communication ; faith as an active power is what it is in virtue of the overshadowing of the Invisible. The Invisible takes the initiative and wakens faith; faith receives the impression and seeks for ever fuller union with it.", "source": "The Holiest of All, on Hebrews 11"}, {"name": "Watchman Nee", "short": "Nee", "comment": "The reason for so many defeats in the spiritual realm is because this sector of the soul has not been dealt with drastically. Faith requires the cross.", "source": "The Spiritual Man"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Faith is always an active and a positive principle.", "source": "Believing What We Have Heard"}], "declarations": ["I declare: faith is the substance of things hoped for, the evidence of things not seen.", "I declare: I walk by faith in Christ, not by sight."], "prayer": "Lord Jesus, object of my faith, substance of my hope, give me eyes to see the unseen. I believe; help my unbelief. Amen.", "theme_flag": "theme-based: Nee"}, {"day": 324, "ref": "Hebrews 12:1", "book": "Hebrews", "chapter": 12, "verse": 1, "text": "Wherefore seeing we also are compassed about with so great a cloud of witnesses, let us lay aside every weight, and the sin which doth so easily beset us, and let us run with patience the race that is set before us,", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "What is felt to be a weight is easily east off. Everything is judged of by its bearing on the object we aim at. If I run in a race and all my thought is the prize, a bag of gold is readily ca.st away. It is a weight. But we must look to Jesus. Only in Him can we cast off every hindrance easily and without reservation.- We cannot combat sin by the flesh. But there is another class of trials that come from without : they are not to be cast off, they must be borne. Christ, as we have seen, went through them. We have not like Him resisted even to the shedding of our blood rather than fail in faithfulness and obedience.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Under the inspiring influence of the cloud of witnesses, to lay aside every weight and sin, to enter and begin the race is not enough — we must run with patience. Day by day, our separation from the world and sin, our giving up of every weight and every sin, must be renewed. Day by day our desire and our will to live wholly for God must be reaffirmed. Day by day we must wait on God afresh, to receive grace with all our heart and all our strength ; with undivided purpose and in the boldness of faith, still to run in the race for God. There fore let us also run the race with patience. 1.", "source": "The Holiest of All, \"Let Us Run with Patience the Race\""}, {"name": "Watchman Nee", "short": "Nee", "comment": "Anything that hinders us from running fast or advancing forward is a weight.", "source": "Notes on Scriptural Messages (1)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "There is a goal; there is a prize. We have been called with high purpose.", "source": "\"Looking Unto Jesus\", A Witness and A Testimony, Jul-Aug 1954"}], "declarations": ["I declare: I lay aside every weight and run my race with patience, looking to Jesus.", "I declare: Christ ran the whole course of faith before me, and I follow in His steps."], "prayer": "Lord Jesus, You ran the race set before You, despising the shame for the joy ahead. Teach me to lay aside every weight and run with patience. I look away from every difficulty to You alone. Amen.", "theme_flag": null}, {"day": 325, "ref": "Hebrews 12:2", "book": "Hebrews", "chapter": 12, "verse": 2, "text": "Looking unto Jesus the author and finisher of our faith; who for the joy that was set before him endured the cross, despising the shame, and is set down at the right hand of the throne of God.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "The joy and the rewards that * It is not insensibility to them, but, when they are felt to be there, looking from them to Christ. This If the secret of faith. \"Be careful for nothing\" need not have been said, if nothing had been there calculated to awaken care. Abraham considered not his body now dead. are set before us are never the motives of the walk of faith — we know this well with regard to Christ, but it is not the less true in our own case — they are the encouragement of those who walk in it.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Let us run with, patience the race that is set before us, looking unto Jesus the author1 and perfecter of our faith, who for the joy that was set before Him endured the cross, despising shame, and hath sat down at the right hand of the throne of God. THE practical and the contemplative Christian life are often spoken of as if they were at variance. Here we see them in their perfect harmony. Let us run — there we have intense exertion, claiming body and soul; looking to Jesus— there we have the inner life of the spirit, a heart always fixed on Jesus in faith and worship, drawing inspiration and strength from His example and His love.", "source": "The Holiest of All, \"Looking Unto Jesus\""}, {"name": "Watchman Nee", "short": "Nee", "comment": "We should not look at anything else but should look only at Jesus. Only when we look unto Jesus can we run straight.", "source": "Notes on Scriptural Messages (1)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "\"Looking unto Jesus.\" More correctly that would be stated \"looking off unto Jesus.\"", "source": "\"Looking Unto Jesus\", A Witness and A Testimony, Jul-Aug 1954"}], "declarations": ["I declare: I look off unto Jesus, the Author and Finisher of my faith.", "I declare: Christ endured the cross for the joy set before Him, and I draw strength from His example."], "prayer": "Lord Jesus, You are the Author and Finisher of my faith. I look off from everything else and fix my eyes on You. Perfect what You have begun in me. Amen.", "theme_flag": null}, {"day": 326, "ref": "Hebrews 13:8", "book": "Hebrews", "chapter": 13, "verse": 8, "text": "Jesus Christ the same yesterday, and to day, and for ever.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "He desires a better country, and attaches himself to God more immediately and entirely. He has no desire to return into his own country ; he seeks a country. Such is the Christian. In offering up Isaac there was that absolute confidence in God which, at His command, can renounce even God's own promises as possessed after the flesh, sure that God would restore them through the exercise of His power, overcoming death and every obstacle. It is thus that Christ renounced His rights as Messiah, and went even into death, committing Himself to the will of God and trusting in Him ; and received everything in resurrection.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "As our faith sees and seizes hold upon this, and rests upon Him as the same for ever, it will participate in His unchangeableness ; like Him it will know no change, but always be the same. Throughout the Epistle we have now so often seen that the great defect in Christians is that there is no steadfast, certain progress, no holding fast firm to the end, — they abide not con tinually. As with Israel in the old covenant — they continued not in it. And the great difference of the new covenant, the wonderful perfection of Christ's redemption and eternal priest hood is to be, that now there is to be an end to backsliding.", "source": "The Holiest of All, \"Jesus Christ, the Same for Ever\""}, {"name": "Watchman Nee", "short": "Nee", "comment": "They forget, however, that Jesus Christ is the same yesterday and today, yes, even forever (Heb. 13:8).", "source": "The Spiritual Man (3)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "We may have a thousand moods in as many hours, but He never changes, He is always the same.", "source": "All Things in Christ"}], "declarations": ["I declare: Jesus Christ is the same yesterday, today, and forever.", "I declare: I rest in His unchangeableness; my faith participates in His stability."], "prayer": "Lord Jesus, You never change. In a world of shifting moods and circumstances, You are always the same. Anchor my heart in Your faithfulness. Amen.", "theme_flag": null}, {"day": 327, "ref": "James 1:5", "book": "James", "chapter": 1, "verse": 5, "text": "If any of you lack wisdom, let him ask of God, that giveth to all men liberally, and upbraideth not; and it shall be given him.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "The believer may suffer; but he patiently waits on the Lord. This Christ did; it was His perfection. He waited for the will of God, and never did His own will; thus obedience was perfect, man thoroughly tested. But, in fact, we often lack wisdom to know what we ought to do. Here, it says, the resource is evident ; we are to ask wisdom from God. He gives to all liberally: only we must count upon His faithfulness and upon an answer to our prayers, Otherwise the heart is double; there is dependence elsewhere than in God; our desires have another object.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Let them meditate carefully and prayerfully on what. it implies: they will find that it is a work that cannot be performed without careful thought and earnest purpose. It is only as reflection opens up to them the infinite significance of the holy work of moulding, of really forming and giving shape to, an immortal spirit, that they will feel urged with due fervour and faith to plead the promise: ‘If any man lack wisdom, let him ask of God, who giveth to all liberally ; and it shall be given him.’ 1. Training 1s more than teaching. Teaching v makes a child know and understand what he is .", "source": "The Children for Christ, Note A"}, {"name": "Watchman Nee", "short": "Nee", "comment": "It is the outcome of His sufferings, the name of His exaltation and glory; and today it is in that 'name which is above every name' that we gather and that we ask of God.", "source": "Sit, Walk, Stand"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "The basic word out of those read, for our present purpose, is Matthew 11:29 - 'Take my yoke upon you, and learn of me.' Learn of me.", "source": "The School of Christ"}], "declarations": ["I declare: Christ is my wisdom, and I ask of God who gives liberally.", "I declare: I receive wisdom from above for every decision I face."], "prayer": "Lord Jesus, You are my wisdom. I ask You for wisdom today, believing that You give liberally and without reproach. Teach me Your ways. Amen.", "theme_flag": "theme-based: Sparks, theme-based: Nee"}, {"day": 328, "ref": "James 1:17", "book": "James", "chapter": 1, "verse": 17, "text": "Every good gift and every perfect gift is from above, and cometh down from the Father of lights, with whom is no variableness, neither shadow of turning.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "All good and perfect gifts come from God, and He never changes, He does nothing but good. The Father of lights, that which is darkness does not come from Him.", "source": "Darby's Synopsis, James chapter 1 section (local file)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "'Every good gift and every perfect gift is from above, and cometh from the Father of lights,' the gift of a perfect heart too.", "source": "Andrew Murray, Be Perfect, Day 5 'O Lord, Give a Perfect Heart' (biblestudytools.com/classics/murray-be-perfect/o-lord-give-a-perfect-heart.html)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "God is so wealthy that His chief delight is to give.", "source": "Watchman Nee, Sit, Walk, Stand, “God the Giver”"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "You are come to the love of God, which is unchanging and immovable. Stability is a characteristic of Divine love.", "source": "T. Austin-Sparks, The Holy City, New Jerusalem, ch 5 (austin-sparks.net/m/Books-000875.html)"}], "declarations": ["I declare: Every good gift in my life comes from my Father above.", "I declare: God never changes; His goodness toward me is constant."], "prayer": "Lord Jesus, thank You for every good gift that comes from the Father of lights. You never change, and Your goodness never fails. I receive from Your hand today. Amen.", "theme_flag": "theme-based: Sparks, theme-based: Nee"}, {"day": 329, "ref": "James 4:7", "book": "James", "chapter": 4, "verse": 7, "text": "Submit yourselves therefore to God. Resist the devil, and he will flee from you.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "But he has : will, and therefore the law is bondage -to ‘him, a condemnation and death. Now God having begott by the word of truth, the nature that we have, as th born of God, possesses tastes and desires accordi that word, it is of that very word, The word in its perfection develops this nature, forms it, enlightens: we have said; but the nature itself has its liberty ix lowing it. Thus it was with Christ: if His liberty con have been taken away (which spiritually was impossib it would have been by preventing Him from doing a he will of God His Father.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "WHAT a solemn thought, that our love to God will be measured by our everyday intercourse with men and the love it displays; and that our love to God will be found to be a delusion, except was its truth is proved in standing the test of daily life with our fellowmen. It is even so with our humility. It is easy to think we humble ourselves before God: humility towards men will be the only sufficient proof that our humility before God is real; that humility has taken up its abode in us; and become our very nature; that we actually, like Christ, have made ourselves of no reputation.", "source": "Humility: The Beauty of Holiness"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Only when we submit ourselves under God's chastening can we resist the devil. On the one hand, we need to submit to God. On the other hand, we need to exercise our will daily to resist the devil.", "source": "Questions on the Gospel"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "we have learned how to 'resist' effectually.", "source": "\"The Cross and the Deliverance of the Mind\""}], "declarations": ["I declare: I submit myself to God and resist the devil, and he flees from me.", "I declare: In humility I am little before God, and His grace gives me power to resist."], "prayer": "Lord Jesus, teach me the humility that submits fully to God. As I bow low before You, give me strength to resist the devil. I stand in Your victory. Amen.", "theme_flag": "theme-based: Sparks"}, {"day": 330, "ref": "James 4:8", "book": "James", "chapter": 4, "verse": 8, "text": "Draw nigh to God, and he will draw nigh to you. Cleanse your hands, ye sinners; and purify your hearts, ye double minded.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "His heart is thus free to draw nigh to God, according to His holy nature on behalf of others.", "source": "Darby's Synopsis, James chapter 5 section (local file)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Then, prayer is a true 'drawing near' to God, an exercise of inner fellowship with Him.", "source": "Andrew Murray, The Power of the Blood of Jesus, ch 7 'Dwelling in the Holiest Through the Blood' (articles.ochristian.com/article1827.shtml)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "In order to receive God's light, we have to draw near to God. We must be one who is near God, and one who draws nigh to Him, because only God is light.", "source": "Watchman Nee, Words of Ministry, Collected Works vol. 41 (emanna.com)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "it represents God's thought that man should, on certain conditions, on a certain basis of faith, obedience, and fellowship with Him, of walking in the light as He is in the light.", "source": "T. Austin-Sparks, 'This is the Message...' (austin-sparks.net/m/Books-003746.html)"}], "declarations": ["I declare: As I draw nigh to God, He draws nigh to me.", "I declare: My heart is purified as I walk in fellowship with Christ."], "prayer": "Lord Jesus, I draw near to You today. Cleanse my hands and purify my heart. Let me walk in the light as You are in the light. Amen.", "theme_flag": "theme-based: Sparks"}, {"day": 331, "ref": "1 Peter 1:3", "book": "1 Peter", "chapter": 1, "verse": 3, "text": "Blessed be the God and Father of our Lord Jesus Christ, which according to his abundant mercy hath begotten us again unto a lively hope by the resurrection of Jesus Christ from the dead,", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "That then which the apostle presents is a participation in the glory of Christ when He shall be revealed; that salvation, of which the prophets had spoken, which was to be revealed in the last days. But meantime God had begotten again the believing Jews toa living hope by the resurrection of Jesus Christ from among the dead ; and, by means of His sufferings, had made them comprehend that even now, while waiting for the revelation of the glory, realizing it in the person of Jesus, they enjoyed a salvation of the soul before which the deliverances of Israel faded away, and might be forgotten.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Christ is our life.\" -- Col. 3:3,4 \"We declare unto you the life, the eternal life, which was with the Father, and was manifested unto us. God gave unto us eternal life; and this life is in His Son. He that hath the Son hath the life.\" -- 1 John 1:2; 5:11-12 How glorious, then, is the blessing which every one receives that believes in the Lord Jesus. Not only does there come a change in his disposition and manner of life; he also receives from God out of heaven an entirely new life. He is born anew, born of God: he has passed from death into life.", "source": "The New Life, ch I, 'The New Life'"}, {"name": "Watchman Nee", "short": "Nee", "comment": "The cross of Christ cuts off like a knife everything of the old creation, while His resurrection brings us into a new beginning.", "source": "The Present Testimony (4)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Everything went for him with the death of the Lord Jesus. In the resurrection of the Lord Jesus he got everything back in a new form, on a larger scale.", "source": "The Letters of Peter"}], "declarations": ["I declare: I am begotten again unto a living hope by the resurrection of Jesus Christ.", "I declare: My hope is alive because Christ is risen from the dead."], "prayer": "Lord Jesus, thank You for the living hope I have in Your resurrection. You have begotten me again by Your abundant mercy. My hope is anchored in You. Amen.", "theme_flag": "theme-based: Nee"}, {"day": 332, "ref": "1 Peter 1:19", "book": "1 Peter", "chapter": 1, "verse": 19, "text": "But with the precious blood of Christ, as of a lamb without blemish and without spot:", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "If we are redeemed by the precious blood of the Lamb without spot, we are born of the incorruptible seed of the word of God, which lives and abides for ever.", "source": "Darby's Synopsis, 1 Peter chapter 1 section (local file: /home/hatch/workspace/darby-commentary/text/)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "By such words the Holy Spirit teaches us that the blood is the central power of our entire redemption. Nothing but the blood of Jesus, shed in His death for sin, can cover sin on God's side or remove it on ours.", "source": "The Power of the Blood of Jesus, ch 1 (articles.ochristian.com/article355.shtml)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "If I want to understand the value of the Blood I must accept God's valuation of it, and if I do not know something of the value set upon the Blood by God I shall never know what its value is for me.", "source": "The Normal Christian Life, ch 1 \"The Blood of Christ\" (via holdingtotruth.com)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "The Lord Jesus had an incorruptible nature and life, and that meant that there was something there which conquered death.", "source": "T. Austin-Sparks, \"The Supreme Importance of the Incorruptible,\" ch 1 (austin-sparks.net/english/books/001335.html)"}], "declarations": ["I declare: I am redeemed by the precious blood of Christ, as of a lamb without blemish.", "I declare: His incorruptible life conquered death, and I share in His victory."], "prayer": "Lord Jesus, Your precious blood redeemed me from empty ways. You are the Lamb without spot, and Your life in me is incorruptible. Thank You for the price You paid. Amen.", "theme_flag": null}, {"day": 333, "ref": "1 Peter 2:9", "book": "1 Peter", "chapter": 2, "verse": 9, "text": "But ye are a chosen generation, a royal priesthood, an holy nation, a peculiar people; that ye should shew forth the praises of him who hath called you out of darkness into his marvellous light:", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Ss The second priesthood of which the apostle speaks is to shew forth the virtues of Him who has called us out of darkness into His marvellous light, Its description is + - taken, as we have seen, from Exodus xix. It is a chosen ¥ a a holy nation, a a royal priesthood. I only Y ter of a royal priesthood. Priests, among the Jews, drew near to God. God had formed the people for Himself: they were to shew forth all His virtues, His praises. _ Christ will do this perfectly in the day of His glory. The Christian is called to do it now in this world. He is to reproduce Christ in this world. It is the second part of his life.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "The chief object for which God chose Abraham and Israel and us was to make us a blessing to the world. We are a royal priesthood--a priestly people. As long as prayer is only a means of personal improvement and happiness, we cannot know its full power. Let intercession be a real longing for the souls of those around us, a real bearing of the burden of their sin and need, a real pleading for the extension of God's kingdom, real labor in prayer for definite purposes to be realized--let such intercession be what the morning watch is consecrated to, and see what new interest and attraction it will have. Intercession! Oh to realize what it means!", "source": "The School of Obedience, 'The Morning Watch'"}, {"name": "Watchman Nee", "short": "Nee", "comment": "May we receive more grace to be the priests to serve God and the kings to carry out God's will on the earth.", "source": "The Christian (2): Meditations on Revelation"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "The priesthood is no longer the Jewish priesthood. It is our priesthood, it is a spiritual matter.", "source": "The Letters of Peter"}], "declarations": ["I declare: I am part of a royal priesthood, chosen to show forth His praises.", "I declare: Christ has called me out of darkness into His marvellous light."], "prayer": "Lord Jesus, thank You for making me part of Your royal priesthood. Help me to show forth Your praises today, living as one called out of darkness into Your marvellous light. Amen.", "theme_flag": "theme-based: Sparks"}, {"day": 334, "ref": "1 Peter 2:21", "book": "1 Peter", "chapter": 2, "verse": 21, "text": "For even hereunto were ye called: because Christ also suffered for us, leaving us an example, that ye should follow his steps:", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Now the prophets had announced the grace of God which was to be accomplished for believers, and which even now imparts to the soul the enjoyment of that salvation; and they had searched into their own prophecies, which they had received by inspiration from God, seeking to understand what time, and what manner of time, the Spirit indicated, when He testified beforehand of the sufferings of Christ, and the glories that should follow. For the Spirit spoke of them both by the prophets, and signified consequently more than a temporal deliverance in Israel; for the Messiah was to suffer.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Christ is also our Example too. In one sense His work is unique ; in another we have to follow Him in it ; we must do as He did, live and suffer like Him. ' Christ suffered for us, leaving us an Example that we should follow in His footsteps.' His suffering as my Surety calls me to a suffering like His as my Example. But is this reasonable ? In His suffering as Surety He had the power of the Divine nature, and how can I be expected in the weakness of the flesh to suffer as He did ? Is there not an impassable gulf between these two things which Peter unites so closely, the suffering as Surety and the suffering as Example ?", "source": "Like Christ, 'Like Christ: Our Head'"}, {"name": "Watchman Nee", "short": "Nee", "comment": "A fleshly person considers the Lord's cross as a fearsome pathway, but those who love the Lord take the cross and their glory.", "source": "The Christian (2): Meditations on Revelation"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "And it is as such that He is first of all brought to us: the One who has gone that way, the One who has proved Himself in that ordeal, the One who has been steadfast at all costs.", "source": "'Jesus Christ, The Faithful Witness...'"}], "declarations": ["I declare: Christ suffered for me, leaving me an example to follow His steps.", "I declare: I follow Christ in His sufferings, steadfast at all costs."], "prayer": "Lord Jesus, You suffered for me and left me an example. Help me to follow in Your steps, enduring as You endured. Make me steadfast. Amen.", "theme_flag": "theme-based: Nee, theme-based: Sparks"}, {"day": 335, "ref": "1 Peter 2:24", "book": "1 Peter", "chapter": 2, "verse": 24, "text": "Who his own self bare our sins in his own body on the tree, that we, being dead to sins, should live unto righteousness: by whose stripes ye were healed.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Now the prophets had announced the grace of God which was to be accomplished for believers, and which even now imparts to the soul the enjoyment of that salvation; and they had searched into their own prophecies, which they had received by inspiration from God, seeking to understand what time, and what manner of time, the Spirit indicated, when He testified beforehand of the sufferings of Christ, and the glories that should follow. For the Spirit spoke of them both by the prophets, and signified consequently more than a temporal deliverance in Israel; for the Messiah was to suffer.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Jesus came to deliver men from sin and sickness that He might make known the love of the Father. In His actions, in His teaching of the disciples, in the work of the Apostles, pardon and heal- ing are always to be found together. Either the one or the other may doubtless appear more in relief, according to the DIVINE HEALING. development, or the faith of those to whom they spoke. Sometimes it was healing which prepared the way for the acceptance of forgiveness, sometimes it was forgiveness which preceded the heal- ing, which, coming afterwards, became a soal -to it.", "source": "Divine Healing"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Whosoever receives the blood of Jesus Christ for the covering of sins is undoubtedly saved already. This salvation is absolutely complete and eternal.", "source": "The Word of the Cross"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Why, ever and always through the Word of God in both Testaments, it is the symbol of incorruption; incorruptible life is perfect life. It is the blood as of a lamb without spot and without blemish.", "source": "'Jesus Christ, The Faithful Witness...'"}], "declarations": ["I declare: Christ bore my sins in His own body on the tree.", "I declare: By His stripes I am healed; I live unto righteousness."], "prayer": "Lord Jesus, thank You for bearing my sins in Your own body on the tree. By Your stripes I am healed. Help me to live unto righteousness today. Amen.", "theme_flag": "theme-based: Sparks"}, {"day": 336, "ref": "1 Peter 3:18", "book": "1 Peter", "chapter": 3, "verse": 18, "text": "For Christ also hath once suffered for sins, the just for the unjust, that he might bring us to God, being put to death in the flesh, but quickened by the Spirit:", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "It may be that God may see it good that we should suffer. If so, it is better that we should suffer for well doing than for evil doing. The apostle gives a touching ul. motive for this: Christ has suffered for sin once for all; let that suffice ; let us suffer only for righteousness. To. > suffer for sin was His task: He accomplished it, and that for ever. Put to death, as to His life i in the ieee ‘ The passage that follows has occasioned difficulties to : the readers of scripture; but it appears to me simple, if we perceive the object of the Spirit of God.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Christ also suffered far sins once, the righteous for the unrighteous, that He might bring us to God. — 1 Peter Hi. IS. The Cross speaks of Sin : it was only as admitting to the full, and bearing the evil of sin, as hatred against God, that man could come to God. The Cross speaks of Curse : God's Judgment against sin ; as long as man did not accept and approve that judgment as righteou:;, there could be no thought of his being restored to God's presence. The Cross speaks of Suffering r it is only as, in suffering, the will of God is accepted, and everything given up to it, that there could be union with God.", "source": "The Cross of Christ, 'The Cross the Way to God'"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Since humanity must be judged, the Son of God , even the man Jesus Christ , suffered in his spirit, soul and body on the cross for the sins of the world.", "source": "The Spiritual Man, “Calvary’s Judgment”"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Now Jesus says that of Himself: 'I am the Alpha and the Omega.' 'No one cometh unto the Father, but by Me,' said the Son (John 14:6).", "source": "The Alpha and the Omega"}], "declarations": ["I declare: Christ suffered for sins, the just for the unjust, to bring me to God.", "I declare: Through Christ I have access to the Father."], "prayer": "Lord Jesus, thank You for suffering for my sins, the just for the unjust. You have brought me to God. I draw near through You today. Amen.", "theme_flag": "theme-based: Sparks"}, {"day": 337, "ref": "1 Peter 5:7", "book": "1 Peter", "chapter": 5, "verse": 7, "text": "Casting all your care upon him; for he careth for you.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "All were to be clothed with humility: for God resists the proud, and gives grace to the humble. These are still the principles of His government. Under His hand they were therefore to humble themselves; they should be exalted in due time. This was to commit themselves to God. He Ve knew what was needful. He who loved them would exalt them at the right time. He cared for them; they were to rest on Him, commit all their cares to Him. On the other hand they were to be sober and vigilant, because the adversary sought to devour them.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "The light shone into his heart. He who had always been counted a tender Christian came into touch now with a new experience of what Christ is willing to do for one who gives himself entirely to Him. Listen to what he says on the text: “I can do all things through Christ who strengtheneth me.” “I dare to say that it is possible for those who really are willing to reckon on the power of the Lord, for keeping and victory, to lead a life in which His promises are taken as they stand, and are found to be true. It is possible to cast all our care on Him daily, and to enjoy deep peace in doing it.", "source": "The Prayer Life, 'Obedience: The Victorious Life'"}, {"name": "Watchman Nee", "short": "Nee", "comment": "If we do not send all the anxieties to God to let Him bear them, all the anxieties of this world will crush us to death.", "source": "Notes on Scriptural Messages (2)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Well, let us sit down in the armchair of His love and be at rest, and then get to work. You cannot work unless you have a background rest, and rest does not spring firstly from truth.", "source": "'Abounding in Love'"}], "declarations": ["I declare: I cast all my care upon Christ, for He cares for me.", "I declare: I rest in His love and work from that rest."], "prayer": "Lord Jesus, I cast all my cares upon You today, for You care for me. Let me rest in Your love and work from that place of rest. Amen.", "theme_flag": "theme-based: Sparks"}, {"day": 338, "ref": "2 Peter 1:3", "book": "2 Peter", "chapter": 1, "verse": 3, "text": "According as his divine power hath given unto us all things that pertain unto life and godliness, through the knowledge of him that hath called us to glory and virtue:", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "This divine power has given to us all that pertains to life and godliness. How precious it is to know that faith can use this divine power, realised in the life of the soul, directing it towards glory as its end!", "source": "Darby's Synopsis (public domain; local text), 2 Peter ch. 1"}, {"name": "Andrew Murray", "short": "Murray", "comment": "What He claims or demands, He works Himself by that same power. All He gives, He gives with power.", "source": "Andrew Murray, 'As Your Strength' (bibleportal.com sermon)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "God will not give me humility or patience or holiness or love as separate gifts of His grace. He has given only one gift to meet all our need: His Son Christ Jesus.", "source": "Watchman Nee, The Normal Christian Life, ch. 14 'Christ Our Life' (ccel.org/ccel/nee/normal/normal.xiv.ii.html)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "'has granted unto us all things that pertain unto life and godliness', 'precious and exceeding great promises'. All that inheritance is because of God's faithfulness to those who put faith in Him.", "source": "T. Austin-Sparks, The Letters of Peter, ch 7 'God's Responsibility and Ours' (austin-sparks.net PDF)"}], "declarations": ["I declare: His divine power has given me all things for life and godliness.", "I declare: I have everything I need through knowing Christ."], "prayer": "Lord Jesus, thank You that Your divine power has given me all things that pertain to life and godliness. Help me to know You more today. Amen.", "theme_flag": "theme-based: Nee"}, {"day": 339, "ref": "2 Peter 3:9", "book": "2 Peter", "chapter": 3, "verse": 9, "text": "The Lord is not slack concerning his promise, as some men count slackness; but is longsuffering to us-ward, not willing that any should perish, but that all should come to repentance.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "To the eye of man it is indeed true that there is none. But these unbelievers are wilfully ignorant of the fact that the world has been already judged once; that the waters, out of which by the mighty word of God the earth came, had for the moment swallowed it up again, all perishing except those whom God preserved in the ark. And, by the same word, the present heavens and earth are reserved for the day of judgment, and perdition of ungodly men. It is not that the Lord is slack concerning the promise of His return, but that He is still exercising grace, not wishing any to perish, but that all should come to repen- : tance.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "It knows for certain that not a single believing prayer can fail of its effect in heaven, but has its influence, and is treasured up to work out an answer in due time to him who persevereth to the end. It knows that it has to do not with human thoughts or possibilities, but with the word of the living God. And so even as Abraham through so many years in hope believed against hope,' and then through faith and patience inherited the promise,' it counts that the long-suffering of the Lord is salvation, waiting and hasting unto the coming of its Lord to fulfil His promise.", "source": "With Christ in the School of Prayer, Lesson 16, 'Speedily, though bearing long'"}, {"name": "Watchman Nee", "short": "Nee", "comment": "He is not willing to see any perish. He desires that all men be saved.", "source": "The Christian (4): Gospel Messages"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Now Jesus was saying: 'That is the love of God for man, for sinful man, for man who has gone away from God. God's heart just longs to have that man back again.'", "source": "The Holy City, New Jerusalem"}], "declarations": ["I declare: The Lord is not slack concerning His promise; He is longsuffering toward me.", "I declare: God's heart longs for all to come to repentance."], "prayer": "Lord Jesus, thank You for Your longsuffering toward me. You are not willing that any should perish. Help me to share Your heart for the lost. Amen.", "theme_flag": "theme-based: Murray, theme-based: Sparks, theme-based: Nee"}, {"day": 340, "ref": "1 John 1:7", "book": "1 John", "chapter": 1, "verse": 7, "text": "But if we walk in the light, as he is in the light, we have fellowship one with another, and the blood of Jesus Christ his Son cleanseth us from all sin.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "But we can say that the blood of Jesus Christ cleanses us perfectly from all sin.", "source": "Darby's Synopsis, 1 John chapter 1 section (local file: /home/hatch/workspace/darby-commentary/text/)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "God's
