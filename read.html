Murray", "short": "Murray", "comment": "God the Father is not only the Mighty One, the Holy One, but the Loving, Tender, Longing One.", "source": "Andrew Murray, With Christ in the School of Prayer (via bibleportal.com excerpt)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "The Lord’s name is Alpha and Omega. Alpha refers to the beginning, whereas Omega refers to the end.", "source": "Watchman Nee, The Collected Works, Set 2 Vol. 41: Conferences, Messages, and Fellowship (1), ch. 19"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "When Jesus says: 'I am Alpha and Omega', He is saying: 'I am all you need.'", "source": "T. Austin-Sparks, 'The Alpha and The Omega' (austin-sparks.net/english/000659.html)"}], "declarations": ["I declare: Christ is the Alpha and Omega, the Almighty who is to come.", "I declare: Jesus is all I need, from beginning to end."], "prayer": "Lord Jesus, You are the Alpha and Omega, the Almighty. You are all I need. I trust in You from the beginning to the end. Amen.", "theme_flag": "theme-based: Murray"}, {"day": 354, "ref": "Revelation 1:17", "book": "Revelation", "chapter": 1, "verse": 17, "text": "And when I saw him, I fell at his feet as dead. And he laid his right hand upon me, saying unto me, Fear not; I am the first and the last:", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "John (as ever in prophetic vision of Jehovah, for it is not the Spirit of adoption here) falls at His feet as one dead. So Daniel; so in spirit Isaiah (chap. 6); but His power sustains the saint, does not destroy him. He lays His right hand on John himself, declares Himself the first and the last, Jehovah Himself, but withal the same that died in love and has complete power over death and hades; the deliverer from it, not the subjecter to it.", "source": "Darby's Synopsis (public domain; local text), Revelation ch. 1"}, {"name": "Andrew Murray", "short": "Murray", "comment": "It is perfect love, it is to be in this world even as He is, that casts out fear, and gives us boldness in the day of judgment.", "source": "Andrew Murray, Be Perfect, Day 31 'Perfect Love: Casting Out Fear' (biblestudytools.com/classics/murray-be-perfect/perfect-love-casting-out-fear.html)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Oh, how loving this is! Although He is in glory, His love has not diminished.", "source": "Watchman Nee, The Collected Works, Set 1 Vol. 16: Study on Revelation, ch. 2"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "That phrase and designation, 'The first and the last, the beginning and the end', is the thing that will govern our meditation for a little while.", "source": "T. Austin-Sparks, The Throne of God and of the Lamb, ch 1 'Jesus Christ, the First and the Last' (austin-sparks.net/m/Books-006087.html)"}], "declarations": ["I declare: I fear not, for Christ is the first and the last.", "I declare: His perfect love casts out all fear from my heart."], "prayer": "Lord Jesus, when I fall at Your feet, You lay Your right hand on me and say, Fear not. Let Your perfect love cast out my fear today. Amen.", "theme_flag": "theme-based: Murray"}, {"day": 355, "ref": "Revelation 1:18", "book": "Revelation", "chapter": 1, "verse": 18, "text": "I am he that liveth, and was dead; and, behold, I am alive for evermore, Amen; and have the keys of hell and of death.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "He has risen out of death and hades, and has the keys , full power over them , divine power or support; and He who died and rose again, and lives forever even as man, does so, not simply in the power of divine life in man, but of victory over all that man was subject to by sin and infirmity.", "source": "Darby's Synopsis (public domain; local text), Revelation ch. 1"}, {"name": "Andrew Murray", "short": "Murray", "comment": "A dead Christ I must do everything for; a living Christ does everything for me.", "source": "Andrew Murray, Jesus Himself (via logos sermon)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "We should know that Christ has resurrected and that His resurrection remains until today.", "source": "Watchman Nee, The Collected Works, Set 1 Vol. 06: The Christian (4), ch. 11"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "The Lord Jesus here presents Himself as 'the Living One', Who was dead, and is alive again - alive for evermore (Rev. 1:18).", "source": "T. Austin-Sparks, 'The Alpha and The Omega' (austin-sparks.net/english/000659.html)"}], "declarations": ["I declare: Christ is the Living One who was dead and is alive for evermore.", "I declare: A living Christ does everything for me."], "prayer": "Lord Jesus, You are the Living One, alive for evermore. You hold the keys of death. I trust in Your living power today. Amen.", "theme_flag": "theme-based: Murray"}, {"day": 356, "ref": "Revelation 2:10", "book": "Revelation", "chapter": 2, "verse": 10, "text": "Fear none of those things which thou shalt suffer: behold, the devil shall cast some of you into prison, that ye may be tried; and ye shall have tribulation ten days: be thou faithful unto death, and I will give thee a crown of life.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Let the saints only be faithful to the extreme point of his power; all beyond was beyond him, was Christ's; and the faithful one would receive from Him the crown of life.", "source": "Darby's Synopsis (public domain; local text), Revelation ch. 2"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Christ in us as our life and our strength. That is the crown of all.", "source": "Andrew Murray, 'Christ Our Life' (via simplykatherine.com)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "As to our attitude, we must be faithful even unto death; as to time, we must be faithful until death.", "source": "Watchman Nee, The Collected Works, Set 3 Vol. 47: The Orthodoxy of the Church, ch. 6 (bibleread.online)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "What is meant by 'crown' is the sealing of a course in triumph, with honour, with exaltation, the crown being the symbol both of victory and victorious honour.", "source": "T. Austin-Sparks, 'Crowning in Relation to an Ordeal' (austin-sparks.net/m/000647.html)"}], "declarations": ["I declare: I will be faithful unto death, and Christ will give me a crown of life.", "I declare: Christ in me is my life and strength, the crown of all."], "prayer": "Lord Jesus, help me to be faithful unto death. I fear none of the things I may suffer, for You will give me the crown of life. Amen.", "theme_flag": "theme-based: Murray, theme-based: Nee"}, {"day": 357, "ref": "Revelation 3:21", "book": "Revelation", "chapter": 3, "verse": 21, "text": "To him that overcometh will I grant to sit with me in my throne, even as I also overcame, and am set down with my Father in his throne.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "To him that overcometh will I grant to sit with Me in My throne, even as I also overcame.", "source": "Darby's Synopsis, Revelation chapter 3 section (local file)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "All the glorious promises which each of these Epistles contain, down to the last one, with its 'Open the door and I will come in'; 'He that overcometh shall sit with Me on My throne,' are dependent on that one word, Repent!", "source": "Andrew Murray, The Ministry of Intercession, 'The Coming Revival' (biblestudytools.com/classics/murray-ministry-intercession/the-coming-revival.html)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "If there are those who will be the overcomers, God's purpose is attained and He is satisfied.", "source": "Watchman Nee, The Glorious Church, ch 4 (bibleread.online)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Overcomers are just those among the Lord's people who are living in the good of His resurrection.", "source": "T. Austin-Sparks, The Throne of God and of the Lamb, ch 1 (austin-sparks.net/m/Books-006087.html)"}], "declarations": ["I declare: I am an overcomer, and Christ grants me to sit with Him in His throne.", "I declare: I live in the good of His resurrection today."], "prayer": "Lord Jesus, thank You for overcoming and granting me a place with You on Your throne. Make me an overcomer who lives in Your resurrection power. Amen.", "theme_flag": "theme-based: Sparks"}, {"day": 358, "ref": "Revelation 5:5", "book": "Revelation", "chapter": 5, "verse": 5, "text": "And one of the elders saith unto me, Weep not: behold, the Lion of the tribe of Juda, the Root of David, hath prevailed to open the book, and to loose the seven seals thereof.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "The elders explained to the prophet who mourned that the ways of God should be shut up, that the mighty One of Judah, the true source of all promises to David, had prevailed to open it and loose the seals.", "source": "Darby's Synopsis (public domain; local text), Revelation ch. 5"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Through death he has destroyed him that had the power of death, that is the devil.", "source": "Andrew Murray, The Power of the Blood of Jesus, ch 9 'Victory Through the Blood' (articles.ochristian.com/article1829.shtml)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "He warred against Satan in order to gain the victory.", "source": "Watchman Nee, Sit, Walk, Stand, “Stand”"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "It is the Lamb, the Lamb has overcome. Worthy is the Lamb! Why? Because of righteousness.", "source": "T. Austin-Sparks, 'Jesus Christ, The Faithful Witness...' (austin-sparks.net/english/006323.html)"}], "declarations": ["I declare: The Lion of the tribe of Juda has prevailed for me.", "I declare: The Lamb has overcome; worthy is the Lamb."], "prayer": "Lord Jesus, Lion of Judah and Lamb who was slain, You have prevailed. Through Your death You destroyed the devil. I worship You today. Amen.", "theme_flag": "theme-based: Murray, theme-based: Nee"}, {"day": 359, "ref": "Revelation 5:12", "book": "Revelation", "chapter": 5, "verse": 12, "text": "Saying with a loud voice, Worthy is the Lamb that was slain to receive power, and riches, and wisdom, and strength, and honour, and glory, and blessing.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "What seemed His dishonour and rejection on earth was the ground of His worthiness to take the book. He who at all suffering and cost to Himself had glorified all that God was, was able and worthy to unfold what made it good in the way of government.", "source": "Darby's Synopsis (public domain; local text), Revelation ch. 5"}, {"name": "Andrew Murray", "short": "Murray", "comment": "It is as the slain Lamb, that the Lord Jesus is in the midst of the throne, as a Lamb whose blood had been shed. As such, He is the object of the worship of the redeemed.", "source": "Andrew Murray, The Power of the Blood of Jesus, ch 10 (swartzentrover.com)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "At that time we will also praise the Lord forever because of His cross.", "source": "Watchman Nee, The Collected Works, Set 1 Vol. 06: The Christian (4), ch. 11"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "God created, the Lamb redeemed. God gets His place and rights by reason of the blood of the Lamb.", "source": "T. Austin-Sparks, 'The Throne of God and of the Lamb' (austin-sparks.net/m/Books-006087.html)"}], "declarations": ["I declare: Worthy is the Lamb that was slain to receive all power and glory.", "I declare: I worship the Lamb in the midst of the throne."], "prayer": "Lord Jesus, worthy are You, the Lamb that was slain. Receive power and riches and wisdom and strength and honour and glory and blessing. I worship You. Amen.", "theme_flag": null}, {"day": 360, "ref": "Revelation 7:17", "book": "Revelation", "chapter": 7, "verse": 17, "text": "For the Lamb which is in the midst of the throne shall feed them, and shall lead them unto living fountains of waters: and God shall wipe away all tears from their eyes.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "The Lamb, as known in this transitional time, but exalted in the throne, would feed them and lead them to living fountains of water. They would be fed, refreshed, and perfectly cared for by the Lamb's grace whom they had followed.", "source": "Darby's Synopsis (public domain; local text), Revelation ch. 7"}, {"name": "Andrew Murray", "short": "Murray", "comment": "We ask not only to drink of the living water, we want the fountain.", "source": "Andrew Murray, Jesus Himself (gutenberg.org/files/26003/26003-h/26003-h.htm)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "God leads us to His presence, and the Lamb shepherds us.", "source": "Watchman Nee, The Collected Works, Set 2 Vol. 37: General Messages (1), ch. 3"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "'The Lord is my Shepherd just like that; He is my Shepherd. All that I would do for my natural sheep, He will do for His spiritual sheep.'", "source": "T. Austin-Sparks, 'Written Not With Ink', ch 9 'The Good Shepherd' (austin-sparks.net/m/Books-003728.html)"}], "declarations": ["I declare: The Lamb in the midst of the throne feeds me and leads me to living waters.", "I declare: The Lord is my Shepherd; I shall not want."], "prayer": "Lord Jesus, my Shepherd, feed me and lead me unto living fountains of waters. Wipe away my tears. I follow You today. Amen.", "theme_flag": "theme-based: Murray, theme-based: Sparks"}, {"day": 361, "ref": "Revelation 19:16", "book": "Revelation", "chapter": 19, "verse": 16, "text": "And he hath on his vesture and on his thigh a name written, KING OF KINGS, AND LORD OF LORDS.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "He is publicly, officially, and intrinsically King of kings, and Lord of lords.", "source": "Darby's Synopsis (public domain; local text), Revelation ch. 19"}, {"name": "Andrew Murray", "short": "Murray", "comment": "The Father who in His own time will reveal His Son from heaven, is the God who, as we wait on Him, prepares us for the revelation of His Son.", "source": "Andrew Murray, Waiting on God, Day 28 'For the Coming of His Son' (ccel.org/ccel/murray/waiting/waiting.xxxi.html)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Our Lord is the King of kings, and we are these kings.", "source": "Watchman Nee, The Collected Works, Set 1 Vol. 16: Study on Revelation, ch. 11"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "virtually and ultimately, all this has got to reckon with Him.", "source": "T. Austin-Sparks, 'Jesus Christ, The Faithful Witness...' (austin-sparks.net/english/006323.html)"}], "declarations": ["I declare: Christ is KING OF KINGS AND LORD OF LORDS.", "I declare: All things must reckon with Him who reigns."], "prayer": "Lord Jesus, King of kings and Lord of lords, I bow before You. All things must reckon with You. Reign in my life today. Amen.", "theme_flag": "theme-based: Murray"}, {"day": 362, "ref": "Revelation 21:4", "book": "Revelation", "chapter": 21, "verse": 4, "text": "And God shall wipe away all tears from their eyes; and there shall be no more death, neither sorrow, nor crying, neither shall there be any more pain: for the former things are passed away.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "No sorrow or crying more. These are God's people, and God is with them Himself, but withal His tabernacle is with them.", "source": "Darby's Synopsis (public domain; local text), Revelation ch. 21"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Our heart is meant to have that light filling and gladdening it all the day. It can have it, because God is our sun, and it is written, 'Thy sun shall no more go down for ever.'", "source": "Andrew Murray, Waiting on God, Day 16 'For His Light in the Heart' (biblestudytools.com/classics/murray-waiting-god/sixteenth-day.html)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Therefore, when these things are wiped away, there will no longer be any trace of sin.", "source": "Watchman Nee, The Collected Works, Set 1 Vol. 16: Study on Revelation, ch. 11"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "It is the whole question of Life gaining the mastery, triumphing, overcoming through the blood of the Lamb and issuing in this glorious thing at the end - Life everywhere and death no more.", "source": "T. Austin-Sparks, The Throne of God and of the Lamb, ch 1 (austin-sparks.net/m/Books-006087.html)"}], "declarations": ["I declare: There shall be no more death, for Life has gained the mastery through the Lamb.", "I declare: God wipes away my tears; sorrow and pain are passing away."], "prayer": "Lord Jesus, thank You that death is defeated and Life reigns. Wipe away my tears. Let Your life fill my heart today. Amen.", "theme_flag": "theme-based: Murray, theme-based: Sparks"}, {"day": 363, "ref": "Revelation 22:12", "book": "Revelation", "chapter": 22, "verse": 12, "text": "And, behold, I come quickly; and my reward is with me, to give every man according as his work shall be.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "And Christ would quickly come, and every man receive as his work was.", "source": "Darby's Synopsis (public domain; local text), Revelation ch. 22"}, {"name": "Andrew Murray", "short": "Murray", "comment": "The present life and the coming glory are inseparably connected.", "source": "Andrew Murray, Waiting on God, Day 28 'For the Coming of His Son' (ccel.org/ccel/murray/waiting/waiting.xxxi.html)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "The reward will be given according to man’s deeds.", "source": "Watchman Nee, The Collected Works, Set 1 Vol. 16: Study on Revelation, ch. 12"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "It is the battle of righteousness fought through, the course of righteousness completed, the deposit of righteousness preserved intact, and God crowns that at the end; He gives the seal and the mark of approval, the crown of righteousness.", "source": "T. Austin-Sparks, 'Crowning in Relation to an Ordeal' (austin-sparks.net/m/000647.html)"}], "declarations": ["I declare: Christ comes quickly, and His reward is with Him.", "I declare: I run the race of righteousness, and God will crown me at the end."], "prayer": "Lord Jesus, You come quickly with Your reward. Help me to be faithful, that I may receive the crown of righteousness. Come, Lord Jesus. Amen.", "theme_flag": "theme-based: Sparks"}, {"day": 364, "ref": "Revelation 22:13", "book": "Revelation", "chapter": 22, "verse": 13, "text": "I am Alpha and Omega, the beginning and the end, the first and the last.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Finally, Christ announces Himself, having taken up the word in Person in verse 12, as Alpha and Omega, the beginning and the end , God before and after all; and filling duration.", "source": "Darby's Synopsis (public domain; local text), Revelation ch. 22"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Hast thou not known, hast thou not heard, that the Everlasting One, the Lord, the Creator of the ends of the earth, fainteth not, neither is weary?", "source": "Andrew Murray, Waiting on God, Day 21 'The Almighty One' (ccel.org/ccel/murray/waiting/waiting.xxiv.html)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "He is the beginning of everything and the end to everything.", "source": "Watchman Nee, The Collected Works, Set 2 Vol. 41: Conferences, Messages, and Fellowship (1), ch. 19"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "No situation can arise that exhausts Me: in Me all the fullness dwells. I am Alpha and Omega.", "source": "T. Austin-Sparks, 'The Alpha and The Omega' (austin-sparks.net/english/000659.html)"}], "declarations": ["I declare: Christ is the Alpha and Omega, the Everlasting One who never faints.", "I declare: In Him all fullness dwells; no situation exhausts Him."], "prayer": "Lord Jesus, You are the Alpha and Omega, the Everlasting One. In You all fullness dwells. I trust in Your unfailing strength today. Amen.", "theme_flag": "theme-based: Murray"}, {"day": 365, "ref": "Revelation 22:20", "book": "Revelation", "chapter": 22, "verse": 20, "text": "He which testifieth these things saith, Surely I come quickly. Amen. Even so, come, Lord Jesus.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "He which testifieth these things saith, Surely I come quickly. Amen. Even so, come, Lord Jesus.", "source": "Darby's Synopsis, Revelation chapter 22 section (local file)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Let us wait, long for, and love the appearing of our Lord and heavenly Bridegroom.", "source": "Andrew Murray, Waiting on God, Day 28 (via sermonindex.net excerpt)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "The very last prayer in the Bible is 'Come, Lord Jesus!' This prayer will eventually be answered one day.", "source": "Watchman Nee, The Collected Works Set 1, Vol. 16: Study on Revelation, ch 12 (bibleread.online)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "We can talk about the Lord's coming when we can say our love aboundeth, overfloweth.", "source": "T. Austin-Sparks, 'Abounding in Love' (austin-sparks.net/english/001722.html)"}], "declarations": ["I declare: Surely Christ comes quickly; even so, come, Lord Jesus.", "I declare: I wait for, long for, and love the appearing of my Lord."], "prayer": "Lord Jesus, surely You come quickly. Even so, come. Let my love abound and overflow as I wait for You. Amen.", "theme_flag": "theme-based: Sparks"}];
var INIT = {day: 1};
try {
  var q = new URLSearchParams(location.search).get("day");
  if (q) { var n = parseInt(q, 10); if (n >= 1 && n <= 365) INIT.day = n; }
  else {
    var now = new Date(), start = new Date(now.getFullYear(), 0, 0);
    INIT.day = Math.min(365, Math.floor((now - start) / 864e5));
  }
} catch (e) {}
function pad(n){ return (n < 10 ? "00" : n < 100 ? "0" : "") + n; }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function initials(name){
  var p = name.replace(/^T\. /,"").split(" ");
  return (p[0][0] + (p[1] ? p[1][0] : "")).toUpperCase();
}
function render(day){
  var d = DEVOTIONALS[day - 1];
  document.getElementById("topTitle").textContent = "DAY " + day + " OF 365";
  document.getElementById("dayline").textContent = "DAY " + day;
  document.getElementById("dimg").src = "read-images/day-" + pad(day) + ".webp";
  document.getElementById("verse").textContent = "\u201C" + d.text + "\u201D";
  document.getElementById("vref").textContent = d.ref + " (KJV)";
  var ch = "";
  d.witnesses.forEach(function(w){
    ch += '<div class="cmt"><div class="ava">' + esc(initials(w.short === "Sparks" ? "Austin Sparks" : w.name)) + '</div>'
      + '<div class="bub"><div class="nm">' + esc(w.name) + '</div><div class="tx">' + esc(w.comment) + '</div>'
      + '<div class="src">' + esc(w.source) + '</div></div></div>';
  });
  document.getElementById("comments").innerHTML = ch;
  var dh = "";
  d.declarations.forEach(function(x){
    dh += '<div class="decl">' + esc(x).replace(/^I declare:/, "<b>I declare:</b>") + '</div>';
  });
  document.getElementById("decls").innerHTML = dh;
  document.getElementById("prayer").textContent = d.prayer;
  var g = document.querySelectorAll("#grid button");
  for (var i = 0; i < g.length; i++) g[i].classList.toggle("cur", i === day - 1);
  try { history.replaceState(null, "", "?day=" + day); } catch (e) {}
  window.scrollTo(0, 0);
  cur = day;
}
var cur = INIT.day;
(function(){
  var g = document.getElementById("grid"), h = "";
  for (var i = 1; i <= 365; i++) h += '<button data-d="' + i + '">' + i + '</button>';
  g.innerHTML = h;
  g.addEventListener("click", function(e){
    var b = e.target.closest("button"); if (b) render(parseInt(b.getAttribute("data-d"), 10));
  });
})();
document.getElementById("prevBtn").addEventListener("click", function(){ render(cur <= 1 ? 365 : cur - 1); });
document.getElementById("nextBtn").addEventListener("click", function(){ render(cur >= 365 ? 1 : cur + 1); });
render(cur);
</script>
