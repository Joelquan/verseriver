is family.", "source": "Darby's Synopsis, Acts, chapter 16 section"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Reader, it is given by grace to believe in Jesus.", "source": "Andrew Murray, Why Do You Not Believe?, ch. 31 (swartzentrover.com)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "In saving the world, therefore, He does not try to alter man's flesh; He instead gives man a new life in order to help put it to death.", "source": "Watchman Nee, quoted at biblereasons.com"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Oh, we Christians must believe our beliefs! We must take hold, with both hands, of the things which are of our Christian faith.", "source": "T. Austin-Sparks, The On-High Calling, Vol. 1, ch. 5, The Changed Position of the Companions (austin-sparks.net/english/books/000970.html)"}], "declarations": ["I declare: I believe on the Lord Jesus Christ and I am saved.", "I declare: My household and I are saved by faith in Christ."], "prayer": "Lord Jesus, I believe on You. Save me and my household today. Amen.", "theme_flag": "theme-based: Nee, Sparks"}, {"day": 208, "ref": "Acts 20:35", "book": "Acts", "chapter": 20, "verse": 35, "text": "I have shewed you all things, how that so labouring ye ought to support the weak, and to remember the words of the Lord Jesus, how he said, It is more blessed to give than to receive.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "He had done this, not with the pride of a teacher, but with the humility and the perseverance of love.", "source": "Darby's Synopsis, Acts, chapter 20 section"}, {"name": "Andrew Murray", "short": "Murray", "comment": "What a God-like privilege and blessedness to have the power of relieving the needy and making glad the heart of the poor.", "source": "Andrew Murray, Money, ch. 1 (gutenberg.org)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "We should keep our money moving and active and not allow it to become like the stagnant water of the Dead Sea.", "source": "Watchman Nee, CW Set 2 Vol. 43 (via net.churchincalgary.org)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "It is very happy, very blessed, to be in a position to give; and God is in that position.", "source": "T. Austin-Sparks, The Character of the Gospel (bibleportal.com/sermon/T-Austin-Sparks/the-character-of-the-gospel)"}], "declarations": ["I declare: It is more blessed to give than to receive.", "I declare: I follow the example of Jesus who gave Himself."], "prayer": "Lord Jesus, teach me to give as You gave. Make me a blessing to others today. Amen.", "theme_flag": "theme-based: Darby"}, {"day": 209, "ref": "Romans 1:16", "book": "Romans", "chapter": 1, "verse": 16, "text": "For I am not ashamed of the gospel of Christ: for it is the power of God unto salvation to every one that believeth; to the Jew first, and also to the Greek.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "For, he says, he was not ashamed of it. It was the power of God to salvation.", "source": "Darby's Synopsis, Romans, chapter 1 section"}, {"name": "Andrew Murray", "short": "Murray", "comment": "with superb confidence, not in himself, but in his message.", "source": "Andrew Murray, Holy in Christ: The Gospel the Power of God (biblehub.com)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "The Gospel is the power of God for salvation to everyone who believes.", "source": "Watchman Nee, quoted at burningforsuccess.com"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "This gospel of salvation is an immense thing.", "source": "T. Austin-Sparks, The Character of the Gospel (bibleportal.com/sermon/T-Austin-Sparks/the-character-of-the-gospel)"}], "declarations": ["I declare: I am not ashamed of the gospel of Christ.", "I declare: The gospel is the power of God unto my salvation."], "prayer": "Lord Jesus, make me bold with the gospel. Let Your power work through me today. Amen.", "theme_flag": "theme-based: Sparks"}, {"day": 210, "ref": "Romans 3:23", "book": "Romans", "chapter": 3, "verse": 23, "text": "For all have sinned, and come short of the glory of God;", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "For there was no difference: all had sinned, and outside the glory of God, deprived of that glory, were justified freely by His grace, through the redemption that is in Christ Jesus.", "source": "Darby's Synopsis, Romans, chapter 3 section"}, {"name": "Andrew Murray", "short": "Murray", "comment": "It is only sin that renders Christ intelligible.", "source": "Andrew Murray, quoted by Shane Idleman (westsidechristianfellowship.org)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "God's purpose for man was glory, but sin thwarted that purpose by causing man to miss God's glory.", "source": "Watchman Nee, The Normal Christian Life (via cfbcfamily.org)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "When the law came, the great fact, the universal fact that man is utterly impotent in the presence of the requirements of a holy God is made all too apparent.", "source": "T. Austin-Sparks, We Beheld His Glory, Vol. 1, ch. 5, Walking in the Power of God (Austin-Sparks.Net/english/books/001509.html)"}], "declarations": ["I declare: All have sinned, but Christ restores me to God's glory.", "I declare: I come short, but Jesus lifts me up."], "prayer": "Lord Jesus, I have sinned and fallen short. Restore me to Your glory today. Amen.", "theme_flag": "theme-based: Sparks"}, {"day": 211, "ref": "Romans 5:1", "book": "Romans", "chapter": 5, "verse": 1, "text": "Therefore being justified by faith, we have peace with God through our Lord Jesus Christ:", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Thus, being justified by faith, we have peace with God. All my sins are blotted out, annulled, by the work of Christ. Grace characterises my present relationship with God.", "source": "Darby's Synopsis, Romans, chapter 5 section"}, {"name": "Andrew Murray", "short": "Murray", "comment": "The substitution, and the curse-bearing, and the atonement of Christ dying in the stead of sinners, are what give him peace.", "source": "Andrew Murray, Abide in Christ, ch. 8 (swartzentrover.com)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "This means that, now that I have forgiveness of sins, God will no longer be a cause of dread and trouble to me.", "source": "Watchman Nee, The Normal Christian Life (ccel.org)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Faith brings us into the position of being justified with God.", "source": "T. Austin-Sparks, The Grace of God in Christ Jesus (austin-sparks.net)"}], "declarations": ["I declare: Being justified by faith, I have peace with God.", "I declare: Through Jesus I am at peace with the Father."], "prayer": "Lord Jesus, thank You for justifying me by faith. Fill me with Your peace today. Amen.", "theme_flag": null}, {"day": 212, "ref": "Romans 5:8", "book": "Romans", "chapter": 5, "verse": 8, "text": "But God commendeth his love toward us, in that, while we were yet sinners, Christ died for us.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "God has displayed the love that was peculiar to Himself, in that, when there was no motive for Him in us, when we were nothing but sinners, Christ died for us!", "source": "Darby's Synopsis, Romans, chapter 5 section"}, {"name": "Andrew Murray", "short": "Murray", "comment": "God is ready to assume full responsibility for the life wholly yielded to Him.", "source": "Andrew Murray, quoted at dirtybiblecleanheart.com"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Love flows from the denial of the self life.", "source": "Watchman Nee, quoted at preach-the-gospel.com"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "You see the mighty, all-embracing love of Christ.", "source": "T. Austin-Sparks, The Government of Love (sermonindex.net)"}], "declarations": ["I declare: God commendeth His love toward me in Christ's death.", "I declare: While I was yet a sinner, Jesus died for me."], "prayer": "Lord Jesus, thank You for loving me when I was a sinner. Your love amazes me. Amen.", "theme_flag": "theme-based: Murray, Nee, Sparks"}, {"day": 213, "ref": "Romans 6:23", "book": "Romans", "chapter": 6, "verse": 23, "text": "For the wages of sin is death; but the gift of God is eternal life through Jesus Christ our Lord.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "For the wages of sin was death, the gift of God was eternal life through Jesus Christ our Lord.", "source": "Darby's Synopsis, Romans, chapter 6 section"}, {"name": "Andrew Murray", "short": "Murray", "comment": "The redeeming work of Christ and the righteousness He won for us, equally with the work of the Spirit in us and the power of the new life He brings.", "source": "Andrew Murray, on grace, quoted at therichesofhisgrace.substack.com"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Salvation is given freely.", "source": "Watchman Nee, The Gospel of God (via bibleread.online)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "We receive the free gift by faith's acceptance of what He did in order that we might have the life.", "source": "T. Austin-Sparks, The Battle for Life, ch. 3, The Cross in Relation to the Issue of Life (www.bibleportal.com/sermon/T-Austin-Sparks/the-cross-in-relation-to-the-issue-of-life)"}], "declarations": ["I declare: The gift of God is eternal life through Jesus Christ.", "I declare: I receive God's free gift of life today."], "prayer": "Lord Jesus, thank You for the gift of eternal life. I receive it with gratitude. Amen.", "theme_flag": "theme-based: Murray, Sparks"}, {"day": 214, "ref": "Romans 8:1", "book": "Romans", "chapter": 8, "verse": 1, "text": "There is therefore now no condemnation to them which are in Christ Jesus, who walk not after the flesh, but after the Spirit.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "There is therefore now no condemnation to those which are in Christ Jesus: the new position entirely beyond the reach of everything to which the judgment of God applied.", "source": "Darby's Synopsis, Romans, chapter 8 section"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Abiding in Him is a living union in which man is nothing and Christ is all in all.", "source": "Andrew Murray, quoted at maxsolbrekken.com"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Since we have been terminated on Christ's cross once, we have been judged already, and now there is no condemnation to those who are in Christ.", "source": "Watchman Nee, CW Set 2 Vol. 42, ch.13 (bibleread.online)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "The Acceptance is in Christ. The Redemption is in Christ.", "source": "T. Austin-Sparks, Daily Open Windows (via goodreads.com)"}], "declarations": ["I declare: There is no condemnation to me, for I am in Christ Jesus.", "I declare: I walk after the Spirit and I am free."], "prayer": "Lord Jesus, thank You for removing all condemnation. Help me walk in the Spirit today. Amen.", "theme_flag": "theme-based: Murray, Sparks"}, {"day": 215, "ref": "Romans 8:28", "book": "Romans", "chapter": 8, "verse": 28, "text": "And we know that all things work together for good to them that love God, to them who are the called according to his purpose.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "We know that everything works together under God's own hand for our greatest good. God orders all things in favour of those who are called according to His purpose.", "source": "Darby's Synopsis, Romans, chapter 8 section"}, {"name": "Andrew Murray", "short": "Murray", "comment": "As we get into the mind and plan of God, our faith will grow, and its power will be manifest in ourselves and those for whom we are believing.", "source": "Andrew Murray, quoted at biblestudytools.com"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Loving God will make an unsatisfactory environment a profitable one.", "source": "Watchman Nee, CWWN Vol.18, ch.12 (via livingtohim.com)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "In order to be maintained in strength it is essential that we know that we are in the purpose of God.", "source": "T. Austin-Sparks, Open Windows - A Divine Purpose (via bibleportal.com)"}], "declarations": ["I declare: All things work together for good because I love God.", "I declare: I am called according to God's purpose."], "prayer": "Lord Jesus, work all things for my good today. I trust Your purpose for my life. Amen.", "theme_flag": null}, {"day": 216, "ref": "Romans 8:31", "book": "Romans", "chapter": 8, "verse": 31, "text": "What shall we then say to these things? If God be for us, who can be against us?", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "The result of all for the soul is, that God is for us. Sweet and glorious conclusion, which gives the heart a peace that is ineffable.", "source": "Darby's Synopsis, Romans, chapter 8 section"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Nothing can overcome the all-surpassing love of our beloved Bridegroom for us. We can rest secure in the assurance of His unconditional and unconquerable love.", "source": "Andrew Murray, Teach Me To Pray, Feb. 14 reading (via swordnotes.com)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Our rest lies in looking to the Lord, not to ourselves.", "source": "Watchman Nee, quoted at preach-the-gospel.com"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "He foreknew you; He called you; He predestined you to become like His Son; He justified you; He glorified you.", "source": "T. Austin-Sparks, Following The Lamb (3), Towards the Mark, Vol. 2, No. 4 (Austin-Sparks.Net/mags/ttm02-4.html)"}], "declarations": ["I declare: If God be for me, who can be against me.", "I declare: God is for me in Christ Jesus."], "prayer": "Lord Jesus, when God is for me, none can stand against me. Strengthen my faith today. Amen.", "theme_flag": "theme-based: Nee"}, {"day": 217, "ref": "Romans 8:37", "book": "Romans", "chapter": 8, "verse": 37, "text": "Nay, in all these things we are more than conquerors through him that loved us.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "We are more than conquerors: difficulties are the immediate occasion of the display of His love and faithfulness, making us feel where our portion is, what our strength is.", "source": "Darby's Synopsis, Romans, chapter 8 section"}, {"name": "Andrew Murray", "short": "Murray", "comment": "All depends on our right relationship to Christ, our entire surrender, perfect faith, and unbroken fellowship with him.", "source": "Andrew Murray, The Prayer Life, ch. 8 (swartzentrover.com)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Satan is an absolutely conquered foe to the soul who knows.", "source": "Watchman Nee, More Than Conquerors (via sermonindex.net)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Well, let us sit down in the armchair of His love and be at rest, and then get to work.", "source": "T. Austin-Sparks, Abounding in Love (austin-sparks.net)"}], "declarations": ["I declare: In all things I am more than a conqueror through Christ.", "I declare: Jesus loved me and I overcome by His love."], "prayer": "Lord Jesus, make me more than a conqueror today. Let Your love strengthen me. Amen.", "theme_flag": null}, {"day": 218, "ref": "Romans 10:9", "book": "Romans", "chapter": 10, "verse": 9, "text": "That if thou shalt confess with thy mouth the Lord Jesus, and shalt believe in thine heart that God hath raised him from the dead, thou shalt be saved.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "If any one confessed with his mouth the Lord Jesus, and believed in his heart that God had raised Him from the dead, he should be saved. Precious, simple, and positive assertion!", "source": "Darby's Synopsis, Romans, chapter 10 section"}, {"name": "Andrew Murray", "short": "Murray", "comment": "She did not yet believe everything, but what she believed that she spoke out before the Lord.", "source": "Andrew Murray, Why Do You Not Believe?, ch. 5 (swartzentrover.com)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Not by feeling but by faith do the spiritual live.", "source": "Watchman Nee, quoted at preach-the-gospel.com"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Therefore salvation is in the name of the Lord Jesus.", "source": "T. Austin-Sparks, The Glory of the Name (austin-sparks.net)"}], "declarations": ["I declare: I confess with my mouth the Lord Jesus and I am saved.", "I declare: I believe in my heart that God raised Jesus from the dead."], "prayer": "Lord Jesus, I confess You as Lord. I believe God raised You from the dead. Amen.", "theme_flag": "theme-based: Murray, Nee"}, {"day": 219, "ref": "Romans 10:13", "book": "Romans", "chapter": 10, "verse": 13, "text": "For whosoever shall call upon the name of the Lord shall be saved.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "There is no difference, for the same Lord over all is rich unto all; for every one who calls upon His name shall be saved.", "source": "Darby's Synopsis, Romans, chapter 10 section"}, {"name": "Andrew Murray", "short": "Murray", "comment": "We have more than once seen that God's listening to our voice depends upon our listening to His voice.", "source": "Andrew Murray, quoted at freebaptistchurch.org"}, {"name": "Watchman Nee", "short": "Nee", "comment": "a cry to God from the heart is sufficient.", "source": "Watchman Nee, What Shall This Man Do? (via contendingforthefaith.org)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "It cannot be received in any other way than by calling upon His name.", "source": "T. Austin-Sparks, The Glory of the Name (austin-sparks.net)"}], "declarations": ["I declare: Whosoever shall call upon the name of the Lord shall be saved.", "I declare: I call on Jesus and I am saved."], "prayer": "Lord Jesus, I call upon Your name. Save me today. Amen.", "theme_flag": "theme-based: Murray"}, {"day": 220, "ref": "Romans 11:36", "book": "Romans", "chapter": 11, "verse": 36, "text": "For of him, and through him, and to him, are all things: to whom be glory for ever. Amen.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "All is grace: yet God is ever faithful, and that in spite of man's unfaithfulness. Both the one and the other have to attribute it to the pure mercy of God.", "source": "Darby's Synopsis, Romans, chapter 11 section"}, {"name": "Andrew Murray", "short": "Murray", "comment": "The highest glory of the creature is in being only a vessel, to receive and enjoy and show forth the glory of God.", "source": "Andrew Murray, quoted at woven-life.com"}, {"name": "Watchman Nee", "short": "Nee", "comment": "All is because of Him; nothing is because of me.", "source": "Watchman Nee, quoted at bibleminute.co"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "That everything throughout, at all times, shall express and be subservient to His Son.", "source": "T. Austin-Sparks, The Unchangeable Ground Of Christ, Open Windows (bibleportal.com/devotional/open-windows/the-unchangeable-ground-of-christ-1029)"}], "declarations": ["I declare: Of Him, and through Him, and to Him are all things.", "I declare: To Jesus be glory forever. Amen."], "prayer": "Lord Jesus, all things are from You and for You. To You be glory forever. Amen.", "theme_flag": "theme-based: Darby, Murray"}, {"day": 221, "ref": "Romans 12:1", "book": "Romans", "chapter": 12, "verse": 1, "text": "I beseech you therefore, brethren, by the mercies of God, that ye present your bodies a living sacrifice, holy, acceptable unto God, which is your reasonable service.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "The ground of all christian morality is now laid in this fundamental principle: to present our bodies as a sacrifice, living, holy, acceptable to God, an intelligent service.", "source": "Darby's Synopsis, Romans, chapter 12 section"}, {"name": "Andrew Murray", "short": "Murray", "comment": "O God, I accept Thy demands. I am Thine and all that I have. Absolute surrender is what my soul yields to Thee by divine grace.", "source": "Andrew Murray, Absolute Surrender (bibleportal.com)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "God wants everything whole; He does not want a half offering. He cannot accept anything less than utter consecration.", "source": "Watchman Nee, CW Set 2 Vol. 37, ch.17 (bibleread.online)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "These words bring us to a very definite and precise application of this principle of inwardness.", "source": "T. Austin-Sparks, The Fact of Inwardness (austin-sparks.net)"}], "declarations": ["I declare: I present my body a living sacrifice to God.", "I declare: My reasonable service is to live wholly for Christ."], "prayer": "Lord Jesus, I present myself to You today. Use my life for Your glory. Amen.", "theme_flag": null}, {"day": 222, "ref": "Romans 12:2", "book": "Romans", "chapter": 12, "verse": 2, "text": "And be not conformed to this world: but be ye transformed by the renewing of your mind, that ye may prove what is that good, and acceptable, and perfect, will of God.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "He was not to be conformed to the world. Neither was this to be an outside mechanical nonconformity, but the result of being renewed in mind, so as to seek for and discern the will of God, good and acceptable and perfect.", "source": "Darby's Synopsis, Romans, chapter 12 section"}, {"name": "Andrew Murray", "short": "Murray", "comment": "To live in the will of God is the one and only thing that can make us well-pleasing to Him.", "source": "Andrew Murray, Thy Will Be Done, ch. 14 (swartzentrover.com)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "The God Who can change a sinner into a Christian by giving him His life can equally transform the fleshly Christian into a spiritual one by giving him His life more abundantly.", "source": "Watchman Nee, quoted at static1.squarespace.com"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "There you have the reversing of an order.", "source": "T. Austin-Sparks, The Fact of Inwardness (austin-sparks.net)"}], "declarations": ["I declare: I am transformed by the renewing of my mind.", "I declare: I prove the good and perfect will of God."], "prayer": "Lord Jesus, renew my mind today. Transform me to know Your will. Amen.", "theme_flag": null}, {"day": 223, "ref": "Romans 12:9", "book": "Romans", "chapter": 12, "verse": 9, "text": "Let love be without dissimulation. Abhor that which is evil; cleave to that which is good.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "To leave nothing owing to any one, be it of whatever character it might, excepting love, a debt which never can be liquidated.", "source": "Darby's Synopsis, Romans, chapter 12 section"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Let a man be what he will; you are to love him.", "source": "Andrew Murray, quoted at peopleofthelivinggod.org"}, {"name": "Watchman Nee", "short": "Nee", "comment": "One gains by losing self for others and not by hoarding for oneself.", "source": "Watchman Nee, quoted at preach-the-gospel.com"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "It is going to be the fellowship of unfeigned love, that is, transparent love, the unfeigned love of the brethren (1 Pet. 1:22).", "source": "T. Austin-Sparks, The Building of the New Jerusalem (www.austin-sparks.net/pdf/The Building of the New Jerusalem - T. Austin-Sparks.pdf)"}], "declarations": ["I declare: My love is without dissimulation, sincere and true.", "I declare: I abhor evil and cling to what is good."], "prayer": "Lord Jesus, fill me with sincere love. Help me to hate evil and hold to good. Amen.", "theme_flag": "theme-based: Darby, Murray, Nee, Sparks"}, {"day": 224, "ref": "Romans 12:12", "book": "Romans", "chapter": 12, "verse": 12, "text": "Rejoicing in hope; patient in tribulation; continuing instant in prayer;", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "The christian walk was characterised by devotedness and obedience. It was a life subjected to the will of another, namely, to the will of God.", "source": "Darby's Synopsis, Romans, chapter 12 section"}, {"name": "Andrew Murray", "short": "Murray", "comment": "One of the greatest drawbacks to the life of prayer is the fact that the answer does not come as speedily as we expect.", "source": "Andrew Murray, Persevering Prayer (bibleportal.com)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Our prayers lay the track down which God's power can come.", "source": "Watchman Nee, quoted at lancasterbaptist.org"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Our prayer times give us the great opportunity of getting right into line with the will of God on all matters.", "source": "T. Austin-Sparks, Worshipful Prayer, Open Windows (www.bibleportal.com/devotional/open-windows/worshipful-prayer-1009)"}], "declarations": ["I declare: I rejoice in hope and am patient in tribulation.", "I declare: I continue instant in prayer."], "prayer": "Lord Jesus, give me joy in hope and patience in trouble. Teach me to pray without ceasing. Amen.", "theme_flag": "theme-based: Darby, Nee, Sparks"}, {"day": 225, "ref": "Romans 14:17", "book": "Romans", "chapter": 14, "verse": 17, "text": "For the kingdom of God is not meat and drink; but righteousness, and peace, and joy in the Holy Ghost.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "We ought to bear with weakness of faith in another, and not put a stumbling-block in his way; to shew it by receiving one another, as Christ has received us, to the glory of God.", "source": "Darby's Synopsis, Romans, chapter 14 section"}, {"name": "Andrew Murray", "short": "Murray", "comment": "The Kingdom of God is righteousness; that represents the work of the Father. Then comes the work of the Son: He is our peace, our Shiloh, our rest.", "source": "Andrew Murray, The Master's Indwelling, ch. 10 (gutenberg.org)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "The kingdom of God is about these spiritual things: righteousness, peace, and joy. And all these are in the Holy Spirit.", "source": "Watchman Nee, The Normal Christian Faith (via churchinregina.net)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Christianity is Christ. Christ is Christianity.", "source": "T. Austin-Sparks, Daily Open Windows (via goodreads.com)"}], "declarations": ["I declare: The kingdom of God is righteousness, peace, and joy.", "I declare: I live in the Holy Spirit's righteousness and peace."], "prayer": "Lord Jesus, let Your kingdom rule in my heart with righteousness, peace, and joy. Amen.", "theme_flag": "theme-based: Darby, Sparks"}, {"day": 226, "ref": "Romans 15:13", "book": "Romans", "chapter": 15, "verse": 13, "text": "Now the God of hope fill you with all joy and peace in believing, that ye may abound in hope, through the power of the Holy Ghost.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "In verse 13, he turns affectionately to the Romans to express his desires for them, and his confidence in the blessing they had received from God.", "source": "Darby's Synopsis, Romans, chapter 15 section"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Ask and expect nothing less: for yourself, and all God's children.", "source": "Andrew Murray, The Ministry of Intercession: Concerted Prayer (biblehub.com)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "It is one lived by believing God under any circumstance.", "source": "Watchman Nee, quoted at powerpackedpromises.com"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "A living hope by the resurrection of Jesus Christ from the dead.", "source": "T. Austin-Sparks, A Living Hope, ch. 3, Christ the Living Bread (Austin-Sparks.Net/english/books/003638.html)"}], "declarations": ["I declare: The God of hope fills me with joy and peace.", "I declare: I abound in hope by the power of the Holy Spirit."], "prayer": "Lord Jesus, fill me with joy and peace today. Let me overflow with hope. Amen.", "theme_flag": "theme-based: Nee, Sparks"}, {"day": 227, "ref": "1 Corinthians 2:2", "book": "1 Corinthians", "chapter": 2, "verse": 2, "text": "For I determined not to know any thing among you, save Jesus Christ, and him crucified.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "He would know nothing but Christ, and Christ in His humiliation and abasement. Thus their faith rested, not on the fair words of man, but on the power of God.", "source": "Darby's Synopsis, 1 Corinthians, chapter 2 section"}, {"name": "Andrew Murray", "short": "Murray", "comment": "His whole ministry and manner of life bore the mark of Christ's likeness, crucified through weakness, yet living by the power of God.", "source": "Andrew Murray, Day 21: Jesus Christ and Him Crucified (worthychristianbooks.com)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Christianity begins not with a big DO, but with a big DONE. We rest in Christ's finished work.", "source": "Watchman Nee, quoted at thf.org.ng"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "In many ways the explanation of Christ being the power of God consists in the fact that He is Christ crucified.", "source": "T. Austin-Sparks, Christ the Power of God (via bibleportal.com)"}], "declarations": ["I declare: I know nothing but Jesus Christ and Him crucified.", "I declare: The cross is my wisdom and my power."], "prayer": "Lord Jesus, keep me focused on the cross. Let Christ crucified be my all. Amen.", "theme_flag": "theme-based: Nee"}, {"day": 228, "ref": "1 Corinthians 2:9", "book": "1 Corinthians", "chapter": 2, "verse": 9, "text": "But as it is written, Eye hath not seen, nor ear heard, neither have entered into the heart of man, the things which God hath prepared for them that love him.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "That which had never entered into the heart of man God had revealed by His Spirit, for the Spirit searches all things, even the deep things of God.", "source": "Darby's Synopsis, 1 Corinthians, chapter 2 section"}, {"name": "Andrew Murray", "short": "Murray", "comment": "that our place is to wait upon God, and that what the human heart cannot conceive will be revealed to us.", "source": "Andrew Murray, Waiting on God, Day 23 (bible.prayerrequest.com)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "From the evening I was saved, I began to live a new life, for the life of the eternal God had entered into me.", "source": "Watchman Nee, quoted at wisefamousquotes.com"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "The heavens are opened and we see more and more, and ever more, of what it is to which we are called.", "source": "T. Austin-Sparks, The Inexhaustible Life, Open Windows (bibleportal.com/devotional/open-windows/the-inexhaustible-life-0101)"}], "declarations": ["I declare: God has prepared things for me that eye has not seen.", "I declare: The Spirit reveals God's blessings to me."], "prayer": "Lord Jesus, open my eyes to what You have prepared. Reveal it by Your Spirit. Amen.", "theme_flag": "theme-based: Nee"}, {"day": 229, "ref": "1 Corinthians 6:20", "book": "1 Corinthians", "chapter": 6, "verse": 20, "text": "For ye are bought with a price: therefore glorify God in your body, and in your spirit, which are God’s.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "We are not our own, but were bought with a price, the blood of Christ offered for us. Therefore we ought to glorify God in our bodies, which are His. Our true liberty is to belong to God.", "source": "Darby's Synopsis, 1 Corinthians, chapter 6 section"}, {"name": "Andrew Murray", "short": "Murray", "comment": "We belong to Him who purchased our freedom with His blood.", "source": "Andrew Murray, The Power of the Blood (via goodreads.com)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "How many of us can say, God, I belong to You. I am Your slave?", "source": "Watchman Nee, CW Set1 Vol.17 ch.3 (bibleread.online)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "You belong to the Lord, not to yourself, or to anyone else. That is the meaning of sanctification: Set apart, made wholly unto God.", "source": "T. Austin-Sparks, The Significance of the Person and Ministry of the Apostle Peter (bibleportal.com/sermon/T-Austin-Sparks/the-significance-of-the-person-and-ministry-of-the-apostle-peter)"}], "declarations": ["I declare: I am bought with a price and I glorify God.", "I declare: My body and spirit belong to Jesus."], "prayer": "Lord Jesus, I am Yours. You bought me. Help me glorify You in my body today. Amen.", "theme_flag": null}, {"day": 230, "ref": "1 Corinthians 10:13", "book": "1 Corinthians", "chapter": 10, "verse": 13, "text": "There hath no temptation taken you but such as is common to man: but God is faithful, who will not suffer you to be tempted above that ye are able; but will with the temptation also make a way to escape, that ye may be able to bear it.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Let him that thinketh he standeth take heed lest he fall. This is our responsibility. On the other side we have the faithfulness of God. He does not permit us to be tempted beyond our strength, but provides a way of escape.", "source": "Darby's Synopsis, 1 Corinthians, chapter 10 section"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Faith adheres simply to what God says.", "source": "Andrew Murray, The New Life (via yumpu.com)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "We should remember that God is faithful. If God can fail, then we can fail. But if He is faithful, we should trust Him and should not fail.", "source": "Watchman Nee, CW Set1 Vol.01 ch.13 (ministrysamples.org)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "That is not getting away from it, that is getting on top of it.", "source": "T. Austin-Sparks, Suffering and Glory (Austin-Sparks.net/english/001664.html)"}], "declarations": ["I declare: God is faithful and will make a way of escape.", "I declare: I can bear temptation through Christ's strength."], "prayer": "Lord Jesus, You are faithful. Make a way for me through every temptation. Amen.", "theme_flag": "theme-based: Murray"}, {"day": 231, "ref": "1 Corinthians 13:4", "book": "1 Corinthians", "chapter": 13, "verse": 4, "text": "Charity suffereth long, and is kind; charity envieth not; charity vaunteth not itself, is not puffed up,", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "This love is the opposite of selfishness and of self-seeking, and shuts it out, seeking the good of others, even as God has sought us in grace.", "source": "Darby's Synopsis, 1 Corinthians, chapter 13 section"}, {"name": "Andrew Murray", "short": "Murray", "comment": "It is not mere feeling: faith working by love is what has power in Christ.", "source": "Andrew Murray, The New Life (whatsaiththescripture.com)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Love always hopes for others' good.", "source": "Watchman Nee, CW Set1 Vol.17 ch.9 (bibleread.online)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Oh, God give us more love, as His servants, to bear and forbear, to suffer long, and never to despair.", "source": "T. Austin-Sparks, In His Letter to the Corinthians (sermonindex.net/sermons/mCs_2OskEvGXpxig; also austin-sparks.org/m/Books-001668.html)"}], "declarations": ["I declare: Love suffers long and is kind.", "I declare: I love with the patient love of Christ."], "prayer": "Lord Jesus, teach me to love as You love. Make me patient and kind today. Amen.", "theme_flag": "theme-based: Sparks"}, {"day": 232, "ref": "1 Corinthians 13:7", "book": "1 Corinthians", "chapter": 13, "verse": 7, "text": "Beareth all things, believeth all things, hopeth all things, endureth all things.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "The last four shew its positive energy, which-the source of every kind thought-by the powerful spring of its divine nature, presumes good when it does not see it, and bears with evil when it sees it, covering it by longsuffering and patience; not bringing it to light, but burying it in its own depth-a depth which is unfathomable, because love never changes.", "source": "Darby's Synopsis, 1 Corinthians, chapter 13"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Jesus Himself lives in us and loves in and through us: we must believe in the power of this love in us, and in that faith love as He loved. O, do believe that this is true salvation, to love even as Jesus loves.", "source": "The New Life, ch 16 \"Love\" (on 1 Cor 13:4-7)."}, {"name": "Watchman Nee", "short": "Nee", "comment": "Love always hopes for others' good. Love always has trust in the good aspects of others.", "source": "Set 1 Vol. 17, ch. 9 \"Redeeming the Time,\" bibleread.online"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Love 'believeth all things': it takes a large heart to do that, does it not? It is never ready to believe an unfavourable report, but always ready to believe that there may be something that can be set off against it.", "source": "AWAT Vol. 37 (1959), pdf/searchable/AWAT1959.pdf"}], "declarations": ["I declare: the love of Christ in me bears all things and never gives up.", "I declare: I believe the best, I hope in all things, and I endure to the end."], "prayer": "Lord Jesus, fill my heart with Your unfailing love. Teach me to bear, to believe, to hope, and to endure as You do. Amen.", "theme_flag": null}, {"day": 233, "ref": "1 Corinthians 13:8", "book": "1 Corinthians", "chapter": 13, "verse": 8, "text": "Charity never faileth: but whether there be prophecies, they shall fail; whether there be tongues, they shall cease; whether there be knowledge, it shall vanish away.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Now the divine nature changes not and never ceases; love therefore abides ever.\" + \"Love will not pass away.", "source": "Darby's Synopsis, 1 Corinthians, chapter 13"}, {"name": "Andrew Murray", "short": "Murray", "comment": "The eternal life that works in us is the life of Jesus; it knows no other law than what we see in Him; it works with power in us what it wrought in Him.", "source": "The New Life, ch 16 \"Love\""}, {"name": "Watchman Nee", "short": "Nee", "comment": "If we replace the phrase the fruit of the Spirit with the word love, we will see that 1 Corinthians 13 is actually speaking of the things of the Spirit.", "source": "Set 2 Vol. 41, pg 53, net.churchincalgary.org page_053"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Love, love triumphant, in the presence of the most terribly provoking contradictions, denials. 'Love never faileth.'", "source": "\"The Excellency of the Knowledge of Christ\" (m/Books-003542.html)"}], "declarations": ["I declare: Your love never fails, and it lives in me.", "I declare: prophecies may cease and knowledge may vanish, but Your love in me remains."], "prayer": "Lord Jesus, thank You that Your love never fails. Let that unfailing love flow through me to everyone I meet. Amen.", "theme_flag": "theme-based: Nee"}, {"day": 234, "ref": "1 Corinthians 13:13", "book": "1 Corinthians", "chapter": 13, "verse": 13, "text": "And now abideth faith, hope, charity, these three; but the greatest of these is charity.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Not only shall these pass away, but even now, here below, that which is of the nature of God is more excellent than that which is connected with the capacity of human nature, even though enlightened by God, and having for its object the revealed glory of God.", "source": "Darby's Synopsis, 1 Corinthians, chapter 13"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Let your household, and the Church, and the world, see in you one with whom 'love is greatest;' one in whom the love of God has a full dwelling, a free working.", "source": "The New Life, ch 16 \"Love\" (swartzentrover.com), on 1 Cor 13:13"}, {"name": "Watchman Nee", "short": "Nee", "comment": "The first item of the fruit of the Spirit is love. Without love other items, such as joy, peace, and endurance, are nothing.", "source": "Set 2 Vol. 41, pg 53, net.churchincalgary.org page_053"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Love is the real spirituality, that is spirituality. Love is the most difficult and the greatest of all gifts.", "source": "\"The Increase of God\" (english/002964.html)"}], "declarations": ["I declare: faith, hope, and love abide in me, and love is the greatest.", "I declare: I walk in love, the greatest gift of all."], "prayer": "Lord Jesus, grow faith and hope in me, and let love be greatest in my life. Amen.", "theme_flag": "theme-based: Nee"}, {"day": 235, "ref": "1 Corinthians 15:3", "book": "1 Corinthians", "chapter": 15, "verse": 3, "text": "For I delivered unto you first of all that which I also received, how that Christ died for our sins according to the scriptures;", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "First, he reminds them of that which he had preached among them as the gospel, that Christ died for our sins according to the scriptures, and was raised again according to the scriptures. This then was the means of their salvation.", "source": "1 Cor ch15"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Christ died for us as enemies, when we were disobedient.", "source": "The True Vine, ch 22 \"Ye, Even as I\""}, {"name": "Watchman Nee", "short": "Nee", "comment": "The Lord Jesus has borne them on the Cross for us as our Substitute and has thereby obtained for us forgiveness.", "source": "NCL ch. 2, ccel normal.vi.i.html"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Christ died for our sins according to the Scriptures. It means that it was according to the fixed, eternal will of God.", "source": "\"The Spirit of Faith\" (AWAT 49-1, mags/wat49-1.html)"}], "declarations": ["I declare: Christ died for my sins according to the Scriptures.", "I declare: I am forgiven and cleansed by His death for me."], "prayer": "Lord Jesus, thank You for dying for my sins. I receive Your forgiveness with a grateful heart. Amen.", "theme_flag": "theme-based: Murray"}, {"day": 236, "ref": "1 Corinthians 15:20", "book": "1 Corinthians", "chapter": 15, "verse": 20, "text": "But now is Christ risen from the dead, and become the firstfruits of them that slept.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Thus Christ arose from among all the other dead (for death could not hold Him), and established the glorious principle of this divine and complete deliverance, and He became the first-fruits of them that slept, who, having His life, await the exercise of His power, which will awaken them by virtue of the Spirit that dwells in them.", "source": "Darby's Synopsis, 1 Corinthians, chapter 15"}, {"name": "Andrew Murray", "short": "Murray", "comment": "He that abides in Christ the Risen and Glorified One, becomes in the same way partaker of His resurrection life, and of the glory with which He has now been crowned in heaven.", "source": "Abide in Christ, ch 31 \"The Glorified One\""}, {"name": "Watchman Nee", "short": "Nee", "comment": "Praise the Lord! His resurrection enters into me, imparting to me a new life.", "source": "NCL ch. 5, nee-sec/ix_iii.txt"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "It is the first to show the new life. A very poor type of Christ, the Firstfruits of them that are asleep, awakened; breaking the slumber of death.", "source": "\"Spiritual Death and His Risen Life\" (english/005394.html)"}], "declarations": ["I declare: Christ is risen from the dead, the firstfruits of all who sleep.", "I declare: because He lives, I shall live also."], "prayer": "Lord Jesus, You are risen and I share Your resurrection life. Thank You for the hope of glory. Amen.", "theme_flag": "theme-based: Nee"}, {"day": 237, "ref": "1 Corinthians 15:57", "book": "1 Corinthians", "chapter": 15, "verse": 57, "text": "But thanks be to God, which giveth us the victory through our Lord Jesus Christ.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Death has lost its sting, the grave its victory. All is changed by the grace which, at the end, will bring in this triumph. Instead of fearing death, we render thanks to Him who has given us the victory by Jesus.", "source": "Darby's Synopsis, 1 Corinthians, chapter 15"}, {"name": "Andrew Murray", "short": "Murray", "comment": "The believer who abides in Christ as his full redemption, realizes even now his spiritual victory over death. He has triumphed over death; even His body has entered into the glory.", "source": "Abide in Christ, ch 10 \"As Your Redemption\""}, {"name": "Watchman Nee", "short": "Nee", "comment": "Our victory lies in hiding in Christ, and in counting in simple trust upon His Holy Spirit to overcome in us our fleshly lusts with His own new desires.", "source": "NCL ch. 10, nee-sec/xiv_i.txt"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "He, by dying, destroyed death for ever for all who put their faith in Him. Over death He conquered by His resurrection.", "source": "\"Victory\" (english/004576.html)"}], "declarations": ["I declare: thanks be to God, He gives me the victory through my Lord Jesus Christ.", "I declare: I am more than a conqueror in Christ."], "prayer": "Lord Jesus, thank You for the victory You won for me. I walk in triumph today. Amen.", "theme_flag": "theme-based: Nee"}, {"day": 238, "ref": "1 Corinthians 15:58", "book": "1 Corinthians", "chapter": 15, "verse": 58, "text": "Therefore, my beloved brethren, be ye stedfast, unmoveable, always abounding in the work of the Lord, forasmuch as ye know that your labour is not in vain in the Lord.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Meanwhile we labour in the scene where death exercises its power-where Satan uses it, if God allows him, to stop us in our way. We labour although there are difficulties, with entire confidence, knowing what will be the infallible result.", "source": "same (ch15, victory section)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "\"Wait on the Lord: be strong, and let your heart take courage: yea, wait thou on the Lord.\" One of the chief needs in our waiting upon God, one of the deepest secrets of its blessedness and blessing, is a quiet, confident persuasion that it is not in vain; courage to believe that God will hear and help; we are waiting on a God who never could disappoint His people.", "source": "Waiting on God, Day 8 \"Strong and of Good Courage\""}, {"name": "Watchman Nee", "short": "Nee", "comment": "When you fight to get the victory, then you have lost the battle at the very outset. You are trying to fight into victory, and in doing so are relinquishing to the enemy the very ground that is yours.", "source": "Sit, Walk, Stand, via toliveischrist.blog"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Because of this universal triumph of the One for whom you labour, 'Be steadfast, immovable, always abounding... inasmuch as you know that your labour is not in vain in the Lord.'", "source": "\"Victory\" (english/004576.html)"}], "declarations": ["I declare: I am steadfast and unmoveable, always abounding in the work of the Lord.", "I declare: my labour in the Lord is never in vain."], "prayer": "Lord Jesus, keep me steadfast and faithful in Your work. I know my labour for You is never wasted. Amen.", "theme_flag": "theme-based: Darby, theme-based: Murray, theme-based: Nee"}, {"day": 239, "ref": "2 Corinthians 1:3", "book": "2 Corinthians", "chapter": 1, "verse": 3, "text": "Blessed be God, even the Father of our Lord Jesus Christ, the Father of mercies, and the God of all comfort;", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "His first thought (and it is always so with one who realises his dependence on God, and who abides in his presence) is to bless God, and to acknowledge Him as the source of all consolation.", "source": "2 Cor ch1"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Let Jesus Christ Himself be your chief companion and comforter.", "source": "Abide in Christ, ch 19 \"In Affliction and Trial\""}, {"name": "Watchman Nee", "short": "Nee", "comment": "A person such as Paul is one who can comfort other people because no difficulty can touch him.", "source": "Set 2 Vol. 37, ch. 17 (\"The Cross and the Wine Mingled with Gall\"), pg 34, net.churchincalgary.org"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Has it ever been a person who has never known the need of comfort himself? No, it is the one who, having been in the depths, and having been at the point of extremity, has discovered the comforts of God.", "source": "Spiritual Ministry (pdf)"}], "declarations": ["I declare: my God is the Father of mercies and the God of all comfort.", "I declare: His comfort fills me, and I comfort others."], "prayer": "Lord Jesus, thank You for comforting me in every trouble. Make me a comforter to others as You have comforted me. Amen.", "theme_flag": "theme-based: Murray, theme-based: Nee"}, {"day": 240, "ref": "2 Corinthians 3:17", "book": "2 Corinthians", "chapter": 3, "verse": 17, "text": "Now the Lord is that Spirit: and where the Spirit of the Lord is, there is liberty.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Thus, where the Spirit was, there was liberty; they were no longer under the yoke of the law, of the fear of death, and of condemnation. They were in Christ before God, in peace before Him, according to perfect love and that favour which is better than life.", "source": "2 Cor ch3"}, {"name": "Andrew Murray", "short": "Murray", "comment": "That spirit may be found amidst very great zeal for God's service, and very earnest prayer for His grace; it does not enjoy the rest of faith, and cannot overcome sin, because it does not stand in the liberty with which Christ has made us free, and does not know that where the Spirit of the Lord is, there is liberty.", "source": "The Two Covenants, ch 5 \"The Two Covenants in Christian Experience\""}, {"name": "Watchman Nee", "short": "Nee", "comment": "The Holy Spirit dwells within man to be his life, and He rests upon man to be his power.", "source": "Set 2 Vol. 41, pg 53"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "This being occupied with Christ results, firstly, in the Holy Spirit setting us free. Be occupied with Him, set your mind on Him, dwell in Him, rest in Him, abide in Him, and the Spirit will make you free.", "source": "Spiritual Ministry (pdf)"}], "declarations": ["I declare: where the Spirit of the Lord is, there is liberty, and He is in me.", "I declare: I am free from every yoke, walking in the liberty of the Spirit."], "prayer": "Lord Jesus, thank You for the liberty Your Spirit brings. I refuse every bondage and walk free in You. Amen.", "theme_flag": "theme-based: Nee"}, {"day": 241, "ref": "2 Corinthians 4:18", "book": "2 Corinthians", "chapter": 4, "verse": 18, "text": "While we look not at the things which are seen, but at the things which are not seen: for the things which are seen are temporal; but the things which are not seen are eternal.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "He was not disheartened come what might, in that he looked not at the things that are seen, which are temporal, but at the things that are not seen, which are eternal.", "source": "2 Cor ch4"}, {"name": "Andrew Murray", "short": "Murray", "comment": "And the Spirit of Jesus: to live not for one's self and not for the visible, but for God and the things that are invisible.", "source": "The New Life, ch 40 \"Conformity to the World\""}, {"name": "Watchman Nee", "short": "Nee", "comment": "Now we are considering here the things which, though they are not seen, are eternal and therefore real. Of course we cannot substantiate Divine things with any of our natural senses; but there is one faculty which can substantiate the 'things hoped for', the things of Christ, and that is faith.", "source": "NCL ch. 4, ccel normal.viii.iii"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "It is the eternal which is in view, and this calls for adjustment in many respects of our affairs, so that our lives can be directed towards the permanent glory of God's purpose for us. We shall always be saved by the upward look.", "source": "\"Where Are You Looking?\" (english/000653.html)"}], "declarations": ["I declare: I look not at the seen and temporal, but at the unseen and eternal.", "I declare: my eyes are fixed on eternal things."], "prayer": "Lord Jesus, lift my eyes above what is seen. Teach me to live for the eternal. Amen.", "theme_flag": "theme-based: Murray, theme-based: Nee"}, {"day": 242, "ref": "2 Corinthians 5:7", "book": "2 Corinthians", "chapter": 5, "verse": 7, "text": "(For we walk by faith, not by sight:)", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Christ (who has manifested the victorious power that opened the path of heaven to Him) being our life... we are equally full of confidence... for we walk by faith, not by the sight of these excellent things.", "source": "2 Cor ch5 -- trim: \"Being formed for glory, and Christ being our life... for we walk by faith, not by the sight of these excellent things.\""}, {"name": "Andrew Murray", "short": "Murray", "comment": "Child of God, learn to live by faith. Let it be fixed with you that faith is God's way to a blessed life. Feeling always seeks something in itself; faith keeps itself occupied with what Jesus is.", "source": "The New Life, ch 21 \"The Life of Feeling\" (epigraph 2 Cor 5:7, swartzentrover.com)."}, {"name": "Watchman Nee", "short": "Nee", "comment": "Are you going to believe the tangible facts of the natural realm which are clearly before your eyes, or the intangible facts of the spiritual realm which are neither seen nor scientifically proved?", "source": "NCL ch. 4, nee-sec/viii_iii.txt"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "We 'walk in the spirit,' but 'we walk by faith.' To walk by faith there must, in the very nature of the case, be a stripping off of all that the outer man of the senses clings to, demands, craves for, as a security and an assurance.", "source": "\"The Inner Man of the Heart\" (english/001445.html)"}], "declarations": ["I declare: I walk by faith and not by sight.", "I declare: my faith is fixed on what Jesus is, not on what I feel."], "prayer": "Lord Jesus, I choose to walk by faith today. Keep my eyes on You, not on my feelings or circumstances. Amen.", "theme_flag": "theme-based: Nee"}, {"day": 243, "ref": "2 Corinthians 5:17", "book": "2 Corinthians", "chapter": 5, "verse": 17, "text": "Therefore if any man be in Christ, he is a new creature: old things are passed away; behold, all things are become new.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Therefore if any one is in Christ, he belongs to this new creation, he is of the new creation. He belongs no more at all to the former; the old things have passed away; all things are become new. We live in an order of things, a world, a new creation, entirely of God.", "source": "2 Cor ch5"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Nothing less is necessary than that we should experience that he who is in Christ Jesus is a new creature: old things have passed away; behold, all things are become new.' This is literally true for the man who understands and experiences what it is to be in Jesus Christ.", "source": "The Prayer Life, ch 3 \"How To Be Delivered from Prayerlessness\""}, {"name": "Watchman Nee", "short": "Nee", "comment": "Whenever the new creation is mentioned, it reminds us not to think of the old things but only of Christ.", "source": "Watchman Nee, Questions on the Gospel, Q25 'Concerning the Christian's Nature' (bibleread.online)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "So the Word says here quite clearly that there is a hopelessness about the old, and all the hope lies in the direction of renewal and freshness on the one hand, and of God's living, new deposit on the other hand.", "source": "\"The Essential Newness of the New Creation\" (pdf/articles/The Essential Newness of the New Creation.pdf)"}], "declarations": ["I declare: I am in Christ, a new creature; old things are passed away.", "I declare: behold, all things are become new in my life."], "prayer": "Lord Jesus, thank You for making me new. I leave the old behind and walk in Your newness of life. Amen.", "theme_flag": "theme-based: Nee"}, {"day": 244, "ref": "2 Corinthians 5:21", "book": "2 Corinthians", "chapter": 5, "verse": 21, "text": "For he hath made him to be sin for us, who knew no sin; that we might be made the righteousness of God in him.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "God had made Him who knew no sin to be sin for us, in order that we should be made the righteousness of God in Him. This was the true way to reconcile us, and that entirely, to God, according to the perfection of God fully revealed.", "source": "2 Cor ch5"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Christ is made of God unto us righteousness; of God we are in Him as our righteousness; we are made the righteousness of God in Him.", "source": "Abide in Christ, ch 8 \"As Your Righteousness\""}, {"name": "Watchman Nee", "short": "Nee", "comment": "You realized that the Lord Jesus died as your Substitute and bore your sins upon Himself, and that His Blood was shed to cleanse away your defilement.", "source": "NCL ch. 3, nee-sec/vii_i.txt"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "There is brought into us that transparent, pure, holy, righteous life of the Lord Jesus. It's given!", "source": "\"The Octave of Redemption (Transcript)\" (pdf/The Octave of Redemption (Transcript) - T. Austin-Sparks.pdf)"}], "declarations": ["I declare: I am made the righteousness of God in Christ.", "I declare: He who knew no sin was made sin for me, and I am righteous in Him."], "prayer": "Lord Jesus, thank You for taking my sin and giving me Your righteousness. I stand before God accepted in You. Amen.", "theme_flag": null}, {"day": 245, "ref": "2 Corinthians 9:15", "book": "2 Corinthians", "chapter": 9, "verse": 15, "text": "Thanks be unto God for his unspeakable gift.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Thanks be to God, says the apostle, for His unspeakable gift; for whatsoever may be the fruits of grace, we have the proof and the power in that which God has given.", "source": "2 Cor ch9"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Nothing less than His Son Himself. This is the love of God; not that He gives us something, but that He gives us some one, a living person, not one or another blessing, but Him in whom is all life and blessing, Jesus Himself.", "source": "The New Life, ch 6 \"God's Gift of His Son\" (epigraph 2 Cor 9:15)."}, {"name": "Watchman Nee", "short": "Nee", "comment": "God is in the wholesale business; He is not in the retail business. He only gives us Christ.", "source": "Set 2 Vol. 41, pg 53"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "'God so loved that He gave.' Here is the Gift, the Sent One of God.", "source": "\"The Cross and the Eternal Glory of God, Ch. 1\" (english/books/004346.html)"}], "declarations": ["I declare: thanks be to God for His unspeakable gift, Jesus Christ.", "I declare: I have received the greatest gift, the Son of God Himself."], "prayer": "Lord Jesus, You are God's unspeakable gift to me. Thank You for giving Yourself wholly to me. Amen.", "theme_flag": "theme-based: Nee, theme-based: Sparks"}, {"day": 246, "ref": "2 Corinthians 12:9", "book": "2 Corinthians", "chapter": 12, "verse": 9, "text": "And he said unto me, My grace is sufficient for thee: for my strength is made perfect in weakness. Most gladly therefore will I rather glory in my infirmities, that the power of Christ may rest upon me.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "When the flesh was reduced to its true nothingness as far as good is concerned, and in a manifest way, then Christ could display His strength in it. That strength had its true character. Remark it well: that is always its character-strength made perfect in infirmity.", "source": "2 Cor ch12"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Let us gladly glory and take pleasure in weakness, in all that can humble us and keep us low; the power of Christ will rest upon us.", "source": "Humility, ch 11 \"Humility and Happiness\""}, {"name": "Watchman Nee", "short": "Nee", "comment": "Having at last reached the point of utter despair in ourselves so that we cease even to try, we put our trust in the Lord to manifest His resurrection life in us.", "source": "NCL ch. 9, nee-sec/xiii_iv.txt"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "'When I am weak, then am I strong.' The power of Christ's resurrection was overcoming his weakness.", "source": "\"The On-High Calling, Vol. 2, Ch. 5\" (english/books/000983.html)"}], "declarations": ["I declare: His grace is sufficient for me.", "I declare: His strength is made perfect in my weakness."], "prayer": "Lord Jesus, Your grace is enough for me. I glory in my weakness so Your power may rest on me. Amen.", "theme_flag": "theme-based: Nee"}, {"day": 247, "ref": "Galatians 2:20", "book": "Galatians", "chapter": 2, "verse": 20, "text": "I am crucified with Christ: nevertheless I live; yet not I, but Christ liveth in me: and the life which I now live in the flesh I live by the faith of the Son of God, who loved me, and gave himself for me.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "He was crucified with Him, so that the condemnation of it was gone for Paul. Nevertheless he lived: yet not he, but Christ, in that life in which Christ rose from among the dead, Christ lived in him.", "source": "Gal ch2"}, {"name": "Andrew Murray", "short": "Murray", "comment": "How blessed must be the experience of such a union with the Lord Jesus! To be able to look upon His death as mine, just as really as it was His, and to realize that the power of that death does by faith work daily with a divine energy in mortifying the flesh, and renewing the whole life into the perfect conformity to the resurrection life of Jesus!", "source": "Abide in Christ, ch 11 \"The Crucified One\" (epigraph Gal 2:20)."}, {"name": "Watchman Nee", "short": "Nee", "comment": "God has put us all in Christ, so that when Christ was crucified we were crucified also.", "source": "NCL ch. 3, nee-sec/vii_i.txt"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "The beginning of the Christian life is: Christ liveth in me! It is no longer I, but Christ living in me.", "source": "The Galatians and the Witch's Spell (english/001810.html)"}], "declarations": ["I declare: I am crucified with Christ; nevertheless I live.", "I declare: it is not I who live, but Christ who lives in me."], "prayer": "Lord Jesus, thank You for living Your life in me. I live today by faith in You who loved me and gave Yourself for me. Amen.", "theme_flag": null}, {"day": 248, "ref": "Galatians 3:28", "book": "Galatians", "chapter": 3, "verse": 28, "text": "There is neither Jew nor Greek, there is neither bond nor free, there is neither male nor female: for ye are all one in Christ Jesus.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "They are not before God as Jews or Gentiles, bond or free, male or female; they are before God according to their position in Christ, all one thing in Him, Christ being for all the common and only measure of their relationship with God.", "source": "Gal ch3"}, {"name": "Andrew Murray", "short": "Murray", "comment": "He prays for its being one in Christ, as a witness to the world that Christ, who hath wrought such a wonder as to make love triumph over selfishness and separation, is indeed the Son of God sent from heaven.", "source": "With Christ in the School of Prayer, ch 27 \"Father, I Will\""}, {"name": "Watchman Nee", "short": "Nee", "comment": "That is the great need: to see the Body of Christ as another great Divine fact; to have it break in upon our spirits by heavenly revelation that 'we, who are many, are one body in Christ'.", "source": "NCL \"One Living Sacrifice,\" nee-sec/xv_iv.txt"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "The Church is called: 'the one new man'. Of course, the oneness referred to there in Ephesians is the result of different kinds of people having disappeared.", "source": "\"The Octave of Redemption (Transcript)\" (pdf/The Octave of Redemption (Transcript) - T. Austin-Sparks.pdf)"}], "declarations": ["I declare: I am one with every believer in Christ Jesus.", "I declare: in Christ there is no division; we are all one."], "prayer": "Lord Jesus, thank You for making us one in You. Let Your love bind us together as one body. Amen.", "theme_flag": "theme-based: Murray, theme-based: Nee"}, {"day": 249, "ref": "Galatians 5:1", "book": "Galatians", "chapter": 5, "verse": 1, "text": "Stand fast therefore in the liberty wherewith Christ hath made us free, and be not entangled again with the yoke of bondage.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "It is in this liberty, the liberty of Christ, alluding to the free woman and Jerusalem above, that they were to stand fast, and not put themselves again under the yoke of the law.", "source": "Gal ch5"}, {"name": "Andrew Murray", "short": "Murray", "comment": "With freedom did Christ set us free. Stand fast, therefore, and be not entangled again in a yoke of bondage.", "source": "The Two Covenants, ch 5 \"The Two Covenants in Christian Experience\""}, {"name": "Watchman Nee", "short": "Nee", "comment": "The Law pronounced the death sentence; the sentence was executed, and now by death I have been set free from all its claims.", "source": "NCL ch. 9, nee-sec/xiii_iv.txt"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Let me remind you that the cross of the Lord Jesus has emancipated us fully and wholly from every kind of legalism. Stand fast in that and do not let anybody impose upon you a system of 'shalts' and 'shalt nots', but stand in the victory of Calvary.", "source": "\"Stand, Withstand, Having Done All, Stand\" (mail.austin-sparks.net/english/005382.html)"}], "declarations": ["I declare: I stand fast in the liberty Christ has given me.", "I declare: I refuse every yoke of bondage; I am free indeed."], "prayer": "Lord Jesus, thank You for setting me free. I stand fast in Your liberty and will not be entangled again. Amen.", "theme_flag": "theme-based: Nee"}, {"day": 250, "ref": "Galatians 5:22", "book": "Galatians", "chapter": 5, "verse": 22, "text": "But the fruit of the Spirit is love, joy, peace, longsuffering, gentleness, goodness, faith,", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "The fruits of the Spirit are equally evident in their character, and assuredly against such things there was no law.", "source": "Gal ch5"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Praise God, we can love each other in a divine love, for \"the fruit of the Spirit is love.\" Give yourselves up to love, and the Holy Spirit will come; receive the Spirit, and He will teach you to love more.", "source": "Absolute Surrender, ch 2 \"The Fruit of the Spirit is Love\""}, {"name": "Watchman Nee", "short": "Nee", "comment": "God has not given us separate fruits of the Spirit with one called love, another called joy, and a third called endurance, etc. God has given us the complete Christ.", "source": "Set 2 Vol. 41, pg 53"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "The fruit of the Spirit is love, and love comprehends all the rest, and all the rest are love in expression in different forms.", "source": "Spiritual Maturity (m/Books-001056.html)"}], "declarations": ["I declare: the fruit of the Spirit grows in me: love, joy, and peace.", "I declare: the Holy Spirit produces His fruit in my daily life."], "prayer": "Lord Jesus, let the fruit of Your Spirit ripen in me. I yield to Your Spirit today. Amen.", "theme_flag": null}, {"day": 251, "ref": "Galatians 5:23", "book": "Galatians", "chapter": 5, "verse": 23, "text": "Meekness, temperance: against such there is no law.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "If we walk according to the Spirit, the law will find nothing to condemn in us. And they that are Christ's have crucified the flesh and its lusts.", "source": "Gal ch5"}, {"name": "Andrew Murray", "short": "Murray", "comment": "From that comes all the graces and virtues in which love is manifested-joy, peace, long-suffering, gentleness, goodness-no sharpness or hardness in your tone, no unkindness or selfishness, meekness before God and man.", "source": "Absolute Surrender, ch 2 \"The Fruit of the Spirit is Love\""}, {"name": "Watchman Nee", "short": "Nee", "comment": "When the Holy Spirit is in us, we bear the fruit of the Spirit (Gal. 5:22-23), which fruit is just Christ Himself.", "source": "Set 2 Vol. 41, pg 53"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "This is the outworking of the Holy Spirit. Spiritual maturity comes by the Holy Spirit bearing His fruit in us.", "source": "Spiritual Maturity (m/Books-001056.html)"}], "declarations": ["I declare: meekness and temperance mark my life.", "I declare: against the fruit of the Spirit there is no law; I walk in it."], "prayer": "Lord Jesus, clothe me with meekness and self-control. Let Your gentle Spirit rule my reactions. Amen.", "theme_flag": null}, {"day": 252, "ref": "Galatians 6:9", "book": "Galatians", "chapter": 6, "verse": 9, "text": "And let us not be weary in well doing: for in due season we shall reap, if we faint not.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "But, as Christians, they must have patience in order to reap, and not grow weary of well-doing: the harvest was sure.", "source": "Gal ch6"}, {"name": "Andrew Murray", "short": "Murray", "comment": "But let us hold fast the great confidence, that in due season we shall reap, if we faint not.", "source": "With Christ in the School of Prayer, ch 16 \"Speedily, Though Bearing Long; Or, The Power of Persevering Prayer\""}, {"name": "Watchman Nee", "short": "Nee", "comment": "We should compare with care and compare these things one by one. In this way, we will not be weary and faint in our souls.", "source": "\"Running the Race,\" Set 1 Vol. 17 (nee17/p075.html)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Having put our hand to the plough, no looking back, no half-ploughed field, no breaking off because things are getting monotonous or difficult, but going through with it even though it be in weariness.", "source": "\"Attaining Unto the First Three\" (english/000447.html)"}], "declarations": ["I declare: I will not grow weary in well doing.", "I declare: in due season I shall reap, if I faint not."], "prayer": "Lord Jesus, strengthen me to keep doing good without growing weary. I trust You for the harvest in due season. Amen.", "theme_flag": "theme-based: Nee, theme-based: Sparks"}, {"day": 253, "ref": "Ephesians 1:3", "book": "Ephesians", "chapter": 1, "verse": 3, "text": "Blessed be the God and Father of our Lord Jesus Christ, who hath blessed us with all spiritual blessings in heavenly places in Christ:", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "He has blessed us with all spiritual blessings; not one is lacking. And they are of the highest order; they are not temporal, as was the case with the Jews... These blessings are granted us in the heavenly places; they are granted us in the most excellent way-one which leaves room for no comparison-it is in Christ.", "source": "Eph ch1"}, {"name": "Andrew Murray", "short": "Murray", "comment": "In Christ are hid all the treasures men around us need; in Him all God's children are blessed with all spiritual blessings; He is full of grace and truth.", "source": "The True Vine, ch 15 \"Whatsoever Ye Will\""}, {"name": "Watchman Nee", "short": "Nee", "comment": "Christianity begins not with the big DO, but with the big DONE. We are invited at the very outset to sit down and enjoy what God has done for us; not to set out to try and attain it for ourselves.", "source": "Sit, Walk, Stand, via toliveischrist.blog"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "The Father of our Lord Jesus Christ has blessed us with every spiritual blessing in the heavenlies in Christ. That means that all the resources which are in Christ are available for us.", "source": "\"Christ Our All, Ch. 4\" (english/books/002936.html)"}], "declarations": ["I declare: I am blessed with all spiritual blessings in heavenly places in Christ.", "I declare: every blessing of heaven is mine in Christ Jesus."], "prayer": "Lord Jesus, thank You for blessing me with every spiritual blessing. I receive them all in You. Amen.", "theme_flag": "theme-based: Murray"}, {"day": 254, "ref": "Ephesians 2:8", "book": "Ephesians", "chapter": 2, "verse": 8, "text": "For by grace are ye saved through faith; and that not of yourselves: it is the gift of God:", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "It is by grace we are saved. Now we are not yet in the glory: it is by faith. Would any one say that at least the faith is of man? No, it is not of ourselves in this respect either; all is the gift of God; not of works, in order that no one may boast.", "source": "Eph ch2"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Let us listen to what God's Word says: \"By grace have ye been saved, through faith; not of works, lest any man should glory.\"", "source": "The Two Covenants, ch 14 \"The New Covenant: a Covenant of Grace\""}, {"name": "Watchman Nee", "short": "Nee", "comment": "If at the outset we try to do anything, we get nothing; if we seek to attain something, we miss everything. For Christianity begins not with the big DO, but with the big DONE.", "source": "Sit, Walk, Stand, via toliveischrist.blog"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "The first effect of hearing the voice of the Son of God is the gift of faith. What could not before be contemplated now becomes possible.", "source": "\"The Voice of the Son of God\" (english/000497.html)"}], "declarations": ["I declare: by grace I am saved through faith; it is the gift of God.", "I declare: my salvation is not of myself; it is God's free gift."], "prayer": "Lord Jesus, thank You for saving me by Your grace. I rest in Your finished work, not my own. Amen.", "theme_flag": "theme-based: Nee, theme-based: Sparks"}, {"day": 255, "ref": "Ephesians 2:10", "book": "Ephesians", "chapter": 2, "verse": 10, "text": "For we are his workmanship, created in Christ Jesus unto good works, which God hath before ordained that we should walk in them.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "For we are His workmanship. In how powerful a way the Spirit puts God Himself forward, as the source and operator of the whole, and the sole one! It is a creation... He takes up poor sinners to display His glory in them.", "source": "Eph ch2"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Here surely is the highest: \"You are God's workmanship, created in Christ Jesus unto good works\": grafted by Him into Christ, unto the bringing forth of much fruit.", "source": "Abide in Christ, ch 6 \"My Father Is the Husbandman\""}, {"name": "Watchman Nee", "short": "Nee", "comment": "All who sit can walk, for in the thought of God the one follows the other spontaneously. We sit forever with Christ that we may walk continuously before men.", "source": "Sit, Walk, Stand, via toliveischrist.blog"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "We are in Christ today because God has done it. We are His workmanship, created in Christ Jesus.", "source": "\"The Horizon of Christ, Ch. 1\" (english/books/005298.html)"}], "declarations": ["I declare: I am God's workmanship, created in Christ Jesus for good works.", "I declare: I walk in the good works God prepared for me."], "prayer": "Lord Jesus, You made me for good works. Lead me into everything You prepared for me today. Amen.", "theme_flag": "theme-based: Nee"}, {"day": 256, "ref": "Ephesians 3:16", "book": "Ephesians", "chapter": 3, "verse": 16, "text": "That he would grant you, according to the riches of his glory, to be strengthened with might by his Spirit in the inner man;", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "This fully distinguishes the prayer of chapter 1 and this. There the calling and inheritance were in the sure purpose of God, and his prayer is that they may know them, and the power that brought them there. Here it is what is in us, and he prays that it may exist, and that as present power in the church.", "source": "Darby's Synopsis, Ephesians, chapter 3 (biblestudytools.com/commentaries/john-darbys-synopsis-of-the-new-testament/ephesians/ephesians-3.html)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "And later on, that He would grant them, according to the riches of His glory, to be strengthened with might by the Spirit in the inner man.", "source": "Waiting on God, Day 29 \"For the Promise of the Father\""}, {"name": "Watchman Nee", "short": "Nee", "comment": "God has placed Himself, His Spirit, His life, and His power in us, that is, in our inner man.", "source": "The Breaking of the Outer Man and the Release of the Spirit, p. 8, via newfoundationsinternational.org blog"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "There is a very great deal hanging upon that clause, 'the power that worketh in us'. It is something which is called upon to carry a very great responsibility; but, blessed be God, it is well able to carry it.", "source": "\"The Power That Worketh in Us\" (english/003273.html)"}], "declarations": ["I declare: I am strengthened with might by His Spirit in my inner man.", "I declare: according to the riches of His glory, I am strong within."], "prayer": "Lord Jesus, strengthen me in my inner man by Your Spirit. Fill me with Your might from the riches of Your glory. Amen.", "theme_flag": null}, {"day": 257, "ref": "Ephesians 3:20", "book": "Ephesians", "chapter": 3, "verse": 20, "text": "Now unto him that is able to do exceeding abundantly above all that we ask or think, according to the power that worketh in us,", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comme
