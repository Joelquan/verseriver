nt": "Observe too here, that the apostle does not now ask that God should act by a power, as it is often expressed, which works for us, but by a power that works in us. He is able to do above all that we can ask or think according to His power that works in us.", "source": "Darby's Synopsis, Ephesians, chapter 3 (biblestudytools.com/commentaries/john-darbys-synopsis-of-the-new-testament/ephesians/ephesians-3.html)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "God is able to do for us exceeding abundantly above what we ask or think, and we are in danger of limiting Him, when we confine our desires and prayers to our own thoughts of them.", "source": "Waiting on God, Day 13 \"Waiting on God: For More Than We Know\""}, {"name": "Watchman Nee", "short": "Nee", "comment": "The secret is, in the words of Paul, 'the power that worketh in us' (3:20). In a parallel passage (Col. 1:29) he says: 'I labour also, striving according to his working, which worketh in me mightily.'", "source": "Sit, Walk, Stand, via otakada.org"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "This is the power that worketh in us, which is, as we have seen, power through His Spirit in the inward man; and that is the power and the means by which God reaches His end in us.", "source": "\"The Power That Worketh in Us\" (english/003273.html)"}], "declarations": ["I declare: God is able to do exceeding abundantly above all I ask or think.", "I declare: His power working in me has no limit."], "prayer": "Lord Jesus, I believe You can do far more than I ask or imagine. Work Your mighty power in me. Amen.", "theme_flag": null}, {"day": 258, "ref": "Ephesians 4:32", "book": "Ephesians", "chapter": 4, "verse": 32, "text": "And be ye kind one to another, tenderhearted, forgiving one another, even as God for Christ’s sake hath forgiven you.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "in 'forgiving one another,' we are to be imitators of God, and to walk in love as Christ has loved us, and has given Himself for us. Beautiful picture, precious privilege! May God grant us so to look at Jesus as to have His image stamped upon us, and in some sort to walk like Him.", "source": "Eph ch4"}, {"name": "Andrew Murray", "short": "Murray", "comment": "We pray, ‘Forgive, even as we have forgiven.’ Scripture says, ‘Forgive one another, even as God also in Christ forgave you.’ God’s full and free forgiveness is to be the rule of ours with men.", "source": "With Christ in the School of Prayer, ch 14 \"When Ye Stand Praying, Forgive\""}, {"name": "Watchman Nee", "short": "Nee", "comment": "We should realize that God gives us opportunities to forgive others.", "source": "Set 1 Vol. 17, ch. 9, bibleread.online"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Put on kindness, humility, meekness, longsuffering; forbearing one another, forgiving each other.", "source": "\"God's Supreme Interest in Man, Ch. 3\" (english/books/002928.html, quoting Col 3:12 ASV)"}], "declarations": ["I declare: I am kind and tenderhearted, forgiving as God forgave me in Christ.", "I declare: I release every offense, even as I have been forgiven."], "prayer": "Lord Jesus, as You forgave me, I forgive others. Make me kind and tenderhearted like You. Amen.", "theme_flag": "theme-based: Sparks"}, {"day": 259, "ref": "Ephesians 5:2", "book": "Ephesians", "chapter": 5, "verse": 2, "text": "And walk in love, as Christ also hath loved us, and hath given himself for us an offering and a sacrifice to God for a sweetsmelling savour.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Walk, he says, in love, even as Christ loved us and gave Himself up for us, an offering and a sacrifice to God for a sweet-smelling savour. We see it in Christ. He is this love which comes down in grace.", "source": "Eph ch5"}, {"name": "Andrew Murray", "short": "Murray", "comment": "So great and wonderful was the love of Jesus towards us, that He actually gave Himself for us and to us.", "source": "The New Life, ch 7 \"Jesus' Surrender of Himself\""}, {"name": "Watchman Nee", "short": "Nee", "comment": "Walking is the practical out-working of that heavenly position here on earth.", "source": "Sit, Walk, Stand, via otakada.org"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "The new corporate man is the embodiment of the love of Christ. That is the first thing.", "source": "\"All Things in Christ, Ch. 4\" (english/books/002770.html)"}], "declarations": ["I declare: I walk in love, as Christ loved me and gave Himself for me.", "I declare: my life is a sweet offering to God."], "prayer": "Lord Jesus, You loved me and gave Yourself for me. Teach me to walk in that same love today. Amen.", "theme_flag": "theme-based: Murray, theme-based: Nee"}, {"day": 260, "ref": "Ephesians 5:8", "book": "Ephesians", "chapter": 5, "verse": 8, "text": "For ye were sometimes darkness, but now are ye light in the Lord: walk as children of light:", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "We were darkness; not only in the dark, but darkness in our nature, the opposite of God who is light... We are now partakers of the divine nature; we are light (poor and weak indeed, yet such by nature) in the Lord-looked at as in Christ.", "source": "Eph ch5"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Satan is the prince of the darkness: God is light: Christ is the Light of the world: we are children of the light: let us walk in the light.", "source": "The New Life, ch 32 \"Light and Joyfulness\""}, {"name": "Watchman Nee", "short": "Nee", "comment": "It is when we have reached a position where we would like to follow God fully that we find light to be the most necessary thing in the Christian life.", "source": "nee-sec/xvi_iv.txt \"The Light Of God And Knowledge.\""}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Christians are said to be 'children of the light' (Eph. 5:8). So, everything related to God is light: 'in Him there is no darkness at all'.", "source": "\"The Holy Spirit, the Church, and the Nations, Ch. 5\" (m/Books-001585.html)"}], "declarations": ["I declare: I was darkness, but now I am light in the Lord.", "I declare: I walk as a child of light."], "prayer": "Lord Jesus, You turned my darkness into light. Help me walk as a child of light in all I do. Amen.", "theme_flag": "theme-based: Murray, theme-based: Nee"}, {"day": 261, "ref": "Ephesians 6:10", "book": "Ephesians", "chapter": 6, "verse": 10, "text": "Finally, my brethren, be strong in the Lord, and in the power of his might.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "It is in the intimacy of the counsels and the grace of God that man fortifies himself for the warfare from which he cannot escape, if he would enjoy his christian privileges. Neither the strength nor even the wisdom of man can do anything here.", "source": "Eph ch6"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Our one duty is to be strong in the Lord, and in the power of His might.", "source": "Abide in Christ, ch 28 \"As Your Strength\""}, {"name": "Watchman Nee", "short": "Nee", "comment": "Not until the Lordship of Jesus Christ is a settled thing in our hearts can the Spirit really operate effectively in us.", "source": "NCL ch. 8, nee-sec/xii_vi.txt"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "The Lord must have a fighting spirit in His people and when the spirit of battle goes out of anyone they are done so far as the higher purposes of God are concerned. So you have in the New Testament these numerous exhortations: 'Be strong in the Lord and in the strength of His might.'", "source": "\"Victory Through Faith\" (english/005387.html)"}], "declarations": ["I declare: I am strong in the Lord and in the power of His might.", "I declare: His might, not mine, wins my battles."], "prayer": "Lord Jesus, I put on Your strength today. In the power of Your might I stand firm. Amen.", "theme_flag": "theme-based: Nee"}, {"day": 262, "ref": "Philippians 1:6", "book": "Philippians", "chapter": 1, "verse": 6, "text": "Being confident of this very thing, that he which hath begun a good work in you will perform it until the day of Jesus Christ:", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Truly it was the God of the glad tidings and of love; and this was a security that He who had begun the good work would fulfil it unto the day of Christ.", "source": "Php ch1"}, {"name": "Andrew Murray", "short": "Murray", "comment": "In all his longings and prayers to attain to a deeper and more perfect abiding in Christ, the believer must hold fast his confidence: \"He which hath begun a good work in you, will perform it until the day of Jesus Christ.\"", "source": "Abide in Christ, ch 12 \"God Himself Will Establish You\""}, {"name": "Watchman Nee", "short": "Nee", "comment": "God wants to do all, for He must have all the glory. If we do some of the work, then we will get some of the glory; but God must have it all Himself, so He does all the work from beginning to end.", "source": "NCL ch. 9, ccel normal.xiii.v"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "He started us on that way the day in which we came to the Cross. And 'He Who hath commenced this good work, will perfect it until the day of Christ'.", "source": "\"The Octave of Redemption (Transcript)\" (austin-sparks.net pdf)"}], "declarations": ["I declare: He who began a good work in me will perform it until the day of Jesus Christ.", "I declare: God will finish what He started in my life."], "prayer": "Lord Jesus, thank You for the good work You began in me. I trust You to complete it. Amen.", "theme_flag": "theme-based: Nee"}, {"day": 263, "ref": "Philippians 1:21", "book": "Philippians", "chapter": 1, "verse": 21, "text": "For to me to live is Christ, and to die is gain.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "His life could be expressed in this one word-'Christ.' To live was for him... Christ; to die was gain, for he should be with Christ.", "source": "Php ch1"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Or rather, Christ, who is our life, Himself dwells within us, and by His presence maintains our consciousness that we are in Him.", "source": "Abide in Christ, ch 13 \"Every Moment\""}, {"name": "Watchman Nee", "short": "Nee", "comment": "The life we live is the life of Christ alone. This life is not something which we ourselves have to produce.", "source": "NCL ch. 10, nee-sec/xiv_ii.txt"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Paul lived on Christ: 'For me to live is Christ.' Christ is the object, the dynamic, the motive of my being on this earth, and only Christ!", "source": "The Excellency of the Knowledge of Christ (m/Books-003542.html)"}], "declarations": ["I declare: for me to live is Christ.", "I declare: Christ is my life, and to be with Him is gain."], "prayer": "Lord Jesus, You are my life. Whether I live or die, I am Yours. Amen.", "theme_flag": "theme-based: Murray, theme-based: Nee"}, {"day": 264, "ref": "Philippians 2:5", "book": "Philippians", "chapter": 2, "verse": 5, "text": "Let this mind be in you, which was also in Christ Jesus:", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Now the means of this union, of the maintenance of this love, was found in the abnegation of self, in humility, in the spirit that humbles itself in order to serve. It was this which perfectly displayed itself in Christ.", "source": "Php ch2"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Have the mind in you which was also in Christ Jesus, who emptied Himself, taking the form of a servant, and humbled Himself.", "source": "Humility, ch 6 \"Humility in Daily Life\""}, {"name": "Watchman Nee", "short": "Nee", "comment": "Not only do we have to take the yoke, we also have to learn from the Lord. The Lord's pattern is recorded in Philippians 2:6-8.", "source": "Set 1 Vol. 17 \"Learn from Me,\" nee17/p035.html"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Have this mind in you, which was also in Christ Jesus... What a background that is! If you meditate upon all that follows that phrase concerning the mind of Christ, you will see how far-reaching and deep-reaching this whole matter of fellowship is.", "source": "\"Fellowship, Ch. 2\" (english/books/006386.html)"}], "declarations": ["I declare: I have the mind of Christ.", "I declare: I think as Christ thinks, humble and obedient."], "prayer": "Lord Jesus, form Your mind in me. Let me think Your thoughts and walk Your lowly way. Amen.", "theme_flag": "theme-based: Nee"}, {"day": 265, "ref": "Philippians 2:6", "book": "Philippians", "chapter": 2, "verse": 6, "text": "Who, being in the form of God, thought it not robbery to be equal with God:", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Of Jesus, who could, without exalting Himself, be equal with God, but who emptied Himself, who went down even into death.", "source": "Php ch2"}, {"name": "Andrew Murray", "short": "Murray", "comment": "To realize the glorious Deity of Him whose call sounds forth to longing hearts with such exceeding sweetness, is no small step towards gaining the full privilege to which we are invited.", "source": "Abide in Christ, ch 5 \"As You Came to Him, by Faith\""}, {"name": "Watchman Nee", "short": "Nee", "comment": "Originally, our Lord was equal with God, having the same glory and sharing the same authority. However, He did not uplift Himself; on the contrary, He emptied Himself and took the form of a slave.", "source": "Set 1 Vol. 17 \"Learn from Me,\" nee17/p035.html"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "He would not hold that fulness in a personal way, and so the Word says: 'He emptied Himself.' The Lord Jesus, Who was filled with all the fulness of God, did not grasp it in a personal way, to hold it, but emptied Himself in order to undo the mischief of the fall.", "source": "\"Fellowship, Ch. 2\" (english/books/006386.html)"}], "declarations": ["I declare: Jesus is God, equal with the Father, yet He came for me.", "I declare: I worship Christ, who is God over all."], "prayer": "Lord Jesus, You are God and yet You humbled Yourself for me. I worship You with awe and love. Amen.", "theme_flag": "theme-based: Murray, theme-based: Nee"}, {"day": 266, "ref": "Philippians 2:7", "book": "Philippians", "chapter": 2, "verse": 7, "text": "But made himself of no reputation, and took upon him the form of a servant, and was made in the likeness of men:", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Christ, when He was in the form of God, emptied Himself, through love, of all His outward glory, of the form of God, and took the form of a man.", "source": "Php ch2"}, {"name": "Andrew Murray", "short": "Murray", "comment": "The death to self has no surer death mark than a humility which makes itself of no reputation, which empties out itself, and takes the form of a servant.", "source": "Humility, ch 10 \"Humility and Death to Self\""}, {"name": "Watchman Nee", "short": "Nee", "comment": "Although He had given up His freedom as God, He could still have His freedom as a man... Yet He took the form of a slave and sacrificed even the freedom He had as an ordinary man.", "source": "Set 1 Vol. 17 \"Learn from Me,\" nee17/p035.html"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "He took the form of a bond-slave to undo it; He assumed, therefore, no personal superiority. We are a company of servants, bond-slaves.", "source": "\"Fellowship, Ch. 2\" (english/books/006386.html)"}], "declarations": ["I declare: like Christ, I take the form of a servant.", "I declare: I empty myself of pride and serve others in love."], "prayer": "Lord Jesus, You made Yourself of no reputation for me. Teach me to serve as You served. Amen.", "theme_flag": "theme-based: Nee"}, {"day": 267, "ref": "Philippians 2:8", "book": "Philippians", "chapter": 2, "verse": 8, "text": "And being found in fashion as a man, he humbled himself, and became obedient unto death, even the death of the cross.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "As God, He emptied Himself; as man, He humbled Himself, and became obedient unto death, even to the death of the cross.", "source": "Php ch2"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Here on earth \"He humbled Himself, and became obedient unto death\"; His humility gave His death its value, and so became our redemption.", "source": "Humility, ch 1 \"Humility: the Glory of the Creature\""}, {"name": "Watchman Nee", "short": "Nee", "comment": "The Christian standard does not stop merely at being just but at enduring the unjust. For our sake, He was willing to endure all kinds of unjust treatment.", "source": "Set 1 Vol. 17 \"Learn from Me,\" nee17/p035.html"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Being found in fashion as a man He humbled Himself, becoming obedient. Obedience unto death, yea the death of the cross; there is nothing more stripped of dignity than the Cross.", "source": "\"Fellowship, Ch. 2\" (english/books/006386.html)"}], "declarations": ["I declare: I follow Christ in humble obedience, even to the end.", "I declare: His obedience unto death is my example and my life."], "prayer": "Lord Jesus, You were obedient even to death on the cross. Give me that same obedient heart. Amen.", "theme_flag": "theme-based: Nee"}, {"day": 268, "ref": "Philippians 2:9", "book": "Philippians", "chapter": 2, "verse": 9, "text": "Wherefore God also hath highly exalted him, and given him a name which is above every name:", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "He rejoices in the thought of Christ's exaltation. God has exalted Him to the highest place, and given Him a name which is above every name.", "source": "Php ch2"}, {"name": "Andrew Murray", "short": "Murray", "comment": "He humbled Himself, therefore God highly exalted Him.\" In heaven, where He was with the Father, in His birth, in His life, in His death, in His sitting on the throne, it is all, it is nothing but humility.", "source": "Humility, ch 2 \"Humility: the Secret of Redemption\""}, {"name": "Watchman Nee", "short": "Nee", "comment": "Because He died and resurrected, God the Father gave Him far more surpassing glory.", "source": "Set 1 Vol. 3, The Christian (1), ch. 9, bibleread.online"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Wherefore also God highly exalted him (because of this obedience), and gave unto him the name which is above every name.", "source": "\"The Risen Lord and the Things Which Cannot be Shaken, Ch. 7\" (english/books/002222.html)"}], "declarations": ["I declare: God has highly exalted Jesus and given Him the name above every name.", "I declare: the humbled Christ is now the exalted Lord."], "prayer": "Lord Jesus, You are exalted above every name. I bow before You in worship. Amen.", "theme_flag": "theme-based: Nee"}, {"day": 269, "ref": "Philippians 2:10", "book": "Philippians", "chapter": 2, "verse": 10, "text": "That at the name of Jesus every knee should bow, of things in heaven, and things in earth, and things under the earth;", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "So that everything in heaven and earth, and even in infernal regions, must bow before this exalted man.", "source": "Php ch2"}, {"name": "Andrew Murray", "short": "Murray", "comment": "We would then do all things to the glory of the Father, in the all-powerful name of Jesus, who is our sanctification.", "source": "Abide in Christ, ch 27 \"That You May Not Sin\""}, {"name": "Watchman Nee", "short": "Nee", "comment": "In His glory, He receives the praises of the blessed ones, the lauding of the heavenly hosts, and the worship of the creatures.", "source": "Set 1 Vol. 3, The Christian (1), ch. 9, bibleread.online"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Then there follows the universal acknowledgment of Him in His exaltation: 'That in the name of Jesus every knee should bow, of things in heaven, and things on earth, and things under the earth'.", "source": "\"The Risen Lord and the Things Which Cannot be Shaken, Ch. 7\" (english/books/002222.html)"}], "declarations": ["I declare: at the name of Jesus every knee shall bow.", "I declare: heaven, earth, and all beneath confess His lordship."], "prayer": "Lord Jesus, every knee will bow to You. I bow mine willingly today in love and worship. Amen.", "theme_flag": "theme-based: Murray, theme-based: Nee"}, {"day": 270, "ref": "Philippians 2:11", "book": "Philippians", "chapter": 2, "verse": 11, "text": "And that every tongue should confess that Jesus Christ is Lord, to the glory of God the Father.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "And every tongue confess that Jesus Christ is Lord to the glory of God the Father.", "source": "Php ch2"}, {"name": "Andrew Murray", "short": "Murray", "comment": "We know how Peter knew and confessed Christ as the Son of the living God while the Cross was still an offence (Matt.16:16,17,21,23).", "source": "Abide in Christ, ch 11 \"The Crucified One\""}, {"name": "Watchman Nee", "short": "Nee", "comment": "All the hearts of those who love the Lord should exult, because we delight in seeing our Lord receiving glory and honor.", "source": "Set 1 Vol. 3, The Christian (1), ch. 9, bibleread.online"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "That is universal supremacy. That carries you to the fulness of the times.", "source": "\"The Gospel of God Concerning His Son Jesus Christ Our Lord\" (austin-sparks.net pdf, on Phil. 2:9-11)"}], "declarations": ["I declare: Jesus Christ is Lord, to the glory of God the Father.", "I declare: my tongue confesses what my heart believes: Jesus is Lord."], "prayer": "Lord Jesus, I confess You as Lord of my life. Be glorified in me today. Amen.", "theme_flag": "theme-based: Murray, theme-based: Nee"}, {"day": 271, "ref": "Philippians 3:10", "book": "Philippians", "chapter": 3, "verse": 10, "text": "That I may know him, and the power of his resurrection, and the fellowship of his sufferings, being made conformable unto his death;", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "To know Him and the power of His resurrection... Paul, having seen this perfection in glory, and being united to Christ the source of this power, desired to know the power of His resurrection, that he might follow Him in His sufferings.", "source": "Php ch3"}, {"name": "Andrew Murray", "short": "Murray", "comment": "You shall know Him in the power of His resurrection and the fellowship of His sufferings.", "source": "Abide in Christ, ch 7 \"As Your Wisdom\""}, {"name": "Watchman Nee", "short": "Nee", "comment": "No one can testify for the Lord without knowing Him. The extent of our knowledge of Christ determines the magnitude of the testimony we bear.", "source": "Set 2 Vol. 42, ch. 8 (\"Knowing Christ and the power of his resurrection,\" Scripture Reading: Phil. 3:10), bibleread.online"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Here, after all that, near the end of his life, he is crying passionately: 'That I may know him.' The very least that we can say about this is that the Christ in view was a very great Christ indeed, who outstrips the greatest capacity and comprehension of man.", "source": "\"An Apostle's Supreme Ambition\" (english/000688.html)"}], "declarations": ["I declare: I know Him, and the power of His resurrection.", "I declare: I share the fellowship of His sufferings, made like Him in His death."], "prayer": "Lord Jesus, I want to know You more: Your resurrection power and the fellowship of Your sufferings. Amen.", "theme_flag": null}, {"day": 272, "ref": "Philippians 3:14", "book": "Philippians", "chapter": 3, "verse": 14, "text": "I press toward the mark for the prize of the high calling of God in Christ Jesus.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "He forgot all that was behind him, and pressed on ever towards the goal, keeping it always in sight to obtain the prize of the calling of God, which is found in heaven.", "source": "Php ch3"}, {"name": "Andrew Murray", "short": "Murray", "comment": "This is the high calling of every believer.", "source": "With Christ in the School of Prayer, ch 30 \"An Holy Priesthood; Or, The Ministry of Intercession\""}, {"name": "Watchman Nee", "short": "Nee", "comment": "He told us that he had a mark set before him, and that he was forgetting the things which were behind and pursuing towards the goal that was set before him.", "source": "Set 2 Vol. 42, ch. 4 (\"The foremost condition for spiritual progress\"), bibleread.online"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "I think Paul himself was the embodiment of the spirit of the first three when he said, 'One thing I do, forgetting the things which are behind, and stretching forward to the things which are before, I press on toward the goal unto the prize of the high calling of God in Christ Jesus' (Phil. 3:13-14).", "source": "\"Attaining Unto the First Three\" (english/000447.html)"}], "declarations": ["I declare: I press toward the mark for the prize of the high calling of God in Christ Jesus.", "I declare: forgetting what is behind, I reach forward to what is ahead."], "prayer": "Lord Jesus, I press on toward the prize. Keep my eyes on the high calling You have for me. Amen.", "theme_flag": "theme-based: Murray"}, {"day": 273, "ref": "Philippians 4:4", "book": "Philippians", "chapter": 4, "verse": 4, "text": "Rejoice in the Lord alway: and again I say, Rejoice.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Rejoice in the Lord... he rejoices always in the Lord; in Him is that which nothing can alter... Nothing moreover troubles this joy, because Christ never changes.", "source": "Php ch4"}, {"name": "Andrew Murray", "short": "Murray", "comment": "He that forgets himself to live in the Lord and His will, shall be taught of himself to rejoice in the Lord.", "source": "The New Life, ch 32 \"Light and Joyfulness\""}, {"name": "Watchman Nee", "short": "Nee", "comment": "Let us rejoice that Jesus is on the throne, and let us praise Him that, since He has been glorified, the Spirit has been poured out upon us all.", "source": "nee-sec/xii_iii.txt \"The Diversity Of The Experience.\""}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "When you realise that this is one of the last things from his pen, and that through this short letter the one throbbing note is: 'Rejoice in the Lord,' rejoice, rejoice. You say: There is something behind these words!", "source": "\"The Excellency of the Knowledge of Christ\" (m/Books-003542.html)"}], "declarations": ["I declare: I rejoice in the Lord always.", "I declare: my joy is in Christ, and nothing can take it."], "prayer": "Lord Jesus, You are my joy. I rejoice in You today and always. Amen.", "theme_flag": "theme-based: Nee"}, {"day": 274, "ref": "Philippians 4:6", "book": "Philippians", "chapter": 4, "verse": 6, "text": "Be careful for nothing; but in every thing by prayer and supplication with thanksgiving let your requests be made known unto God.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "In all things therefore, instead of disquieting ourselves and weighing everything in our own hearts, we ought to present our requests to God with prayer, with supplication... so that, even while making our petition to Him, we can already give thanks, because we are sure of the answer of His grace.", "source": "Php ch4"}, {"name": "Andrew Murray", "short": "Murray", "comment": "There is a prayer in which, in everything, we make known our requests with prayer and supplication, and the reward is the sweet peace of God keeping heart and mind.", "source": "With Christ in the School of Prayer, ch 11 \"Believe that Ye Have Received\""}, {"name": "Watchman Nee", "short": "Nee", "comment": "The vast majority are weighed down with many worries. Let us clearly see, though, that the Bible states categorically: 'In nothing be anxious', period!", "source": "Watchman Nee daily devotional on Phil 4:6-7, via raleighacupunctureinc.com"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "When He says, 'In nothing be anxious' (Phil. 4:6), or 'casting all your anxiety upon him,' the Lord does not mean that you are to become careless, indifferent, to put the matter away as though it is nothing to do with you.", "source": "\"Resting in the Lord's Care\" (english/001166.html)"}], "declarations": ["I declare: I am anxious for nothing; in everything I pray with thanksgiving.", "I declare: I make my requests known to God, and He hears me."], "prayer": "Lord Jesus, I bring every care to You with thanksgiving. Thank You for hearing my prayers. Amen.", "theme_flag": null}, {"day": 275, "ref": "Philippians 4:7", "book": "Philippians", "chapter": 4, "verse": 7, "text": "And the peace of God, which passeth all understanding, shall keep your hearts and minds through Christ Jesus.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Having cast our burden on Him whose peace nothing can disturb, His peace keeps our hearts... The constant peace of the God of love, who takes charge of everything and knows all beforehand, quiets our disburdened hearts.", "source": "Php ch4"}, {"name": "Andrew Murray", "short": "Murray", "comment": "It is the peace of God, the great calm of the eternal world, that passeth all understanding, and that keeps the heart and mind.", "source": "Abide in Christ, ch 2 \"And You Shall Find Rest to Your Souls\""}, {"name": "Watchman Nee", "short": "Nee", "comment": "'The peace of God' is not just a certain kind of peace that God bestows upon us. It is God's own peace, the very peace which is inherent in his nature.", "source": "Watchman Nee, \"The Peace of God,\" via sermonindex.net"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "'The peace of God shall garrison your... mind.' Thus, in the matter of the mind an intense warfare is clearly revealed as going on, and cleaving, captivating and defensive forces are needed.", "source": "\"The Cross and the Deliverance of the Mind\" (english/000648.html)"}], "declarations": ["I declare: the peace of God, which passes all understanding, keeps my heart and mind.", "I declare: I rest in His peace through Christ Jesus."], "prayer": "Lord Jesus, Your peace guards my heart and mind. I rest in You, untroubled and unafraid. Amen.", "theme_flag": null}, {"day": 276, "ref": "Philippians 4:13", "book": "Philippians", "chapter": 4, "verse": 13, "text": "I can do all things through Christ which strengtheneth me.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "He could do all things through Him who strengthened him. Sweet and precious experience! It is not 'I can do all things,' but 'I can do all through him who strengtheneth me.' It is a strength which continually flows from a relationship with Christ, a connection with Him maintained in the heart.", "source": "Php ch4"}, {"name": "Andrew Murray", "short": "Murray", "comment": "He will be able to say with Paul: 'I can do all things through Christ which strengtheneth me' (Ph 4.13).", "source": "The Prayer Life, ch 4 \"The Blessing of Victory; The More Abundant Life\""}, {"name": "Watchman Nee", "short": "Nee", "comment": "It is Christ who now fulfills them; it is Christ who works in me what is well-pleasing to God.", "source": "NCL ch. 9, nee-sec/xiii_iv.txt"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "If there is one statement in Scripture that finds us out, it is this one. It was Paul who said it; but I wonder how many of us could say it, with the same positive affirmation?", "source": "\"I Have Learned... I Know... I Can Do... Through Christ\" (english/001266.html)"}], "declarations": ["I declare: I can do all things through Christ who strengthens me.", "I declare: His strength in me is enough for every task."], "prayer": "Lord Jesus, strengthen me for everything You call me to do. In You I can do all things. Amen.", "theme_flag": "theme-based: Nee"}, {"day": 277, "ref": "Philippians 4:19", "book": "Philippians", "chapter": 4, "verse": 19, "text": "But my God shall supply all your need according to his riches in glory by Christ Jesus.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "My God, he says, shall richly supply all your need... He had learnt what his God was by his own experience. My God, he says, He whom I have learnt to know in all the circumstances through which I have passed, shall fill you with all good things. God would do it according to His riches in glory in Christ Jesus.", "source": "Php ch4"}, {"name": "Andrew Murray", "short": "Murray", "comment": "And to know that THE FATHER knows that you need what you ask; this be your liberty to bring every need, in the assurance that your God will supply it according to His riches in Glory in Christ Jesus.", "source": "With Christ in the School of Prayer, ch 3 \"Pray to Thy Father, Which is in Secret\""}, {"name": "Watchman Nee", "short": "Nee", "comment": "He who sees in secret will take note of our needs, and He will meet them, not in stinted measure, but 'according to His riches in glory by Christ Jesus'.", "source": "A Table in the Wilderness, via pilgrimscribblings.com"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "'In Christ Jesus' always means that it is for us. All our needs are met by the riches which God put into Him.", "source": "\"A Contemplation of Zion, Ch. 4\" (m/Books-005233.html, on Phil. 4:19)"}], "declarations": ["I declare: my God shall supply all my need according to His riches in glory by Christ Jesus.", "I declare: I lack nothing; His riches cover every need."], "prayer": "Lord Jesus, thank You for supplying all my needs from Your glorious riches. I trust You completely. Amen.", "theme_flag": null}, {"day": 278, "ref": "Colossians 1:15", "book": "Colossians", "chapter": 1, "verse": 15, "text": "Who is the image of the invisible God, the firstborn of every creature:", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "The Lord Jesus is the image of the invisible God. It is in the Son of His love that we see what God is. This is the first character of His personal glory, the essential centre of all the rest.", "source": "Darby's Synopsis, Colossians 1"}, {"name": "Andrew Murray", "short": "Murray", "comment": "They are the firstborn destined, as having the image of the firstborn One, to be conformed to His likeness. In Christ we see what man was meant to be.", "source": "The Holiest of All, on Colossians 1"}, {"name": "Watchman Nee", "short": "Nee", "comment": "The soul seeks to retain its authority and move independently, while the spirit strives to possess and master everything for the glory of Christ.", "source": "The Spiritual Man"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "The need of the Lord's people is to have a new apprehension of the greatness of their Christ, a new appreciation of the Son of God's love.", "source": "The Centrality and Supremacy of the Lord Jesus Christ, ch. 1 (austin-sparks.net)"}], "declarations": ["I declare: Jesus Christ is the image of the invisible God, and I see God in Him.", "I declare: as the firstborn of all creation, Christ has the first place in my life."], "prayer": "Lord Jesus, You are the image of the invisible God. Show me the Father in You, and give me the first place in my heart as You have in all creation. Amen.", "theme_flag": "theme-based: Nee, theme-based: Sparks"}, {"day": 279, "ref": "Colossians 1:16", "book": "Colossians", "chapter": 1, "verse": 16, "text": "For by him were all things created, that are in heaven, and that are in earth, visible and invisible, whether they be thrones, or dominions, or principalities, or powers: all things were created by him, and for him:", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "It was in the Person of the Son that God acted, when by His power He created all things, whether in heaven or in the earth, visible and invisible. All has been created by Him, the Son, and for Him.", "source": "Darby's Synopsis, Colossians 1"}, {"name": "Andrew Murray", "short": "Murray", "comment": "He is the origin and Efficient Cause of all that exists. All creation finds its reason and its end in the Son.", "source": "The Holiest of All"}, {"name": "Watchman Nee", "short": "Nee", "comment": "God's creating work is actually done by the Lord Jesus.", "source": "Collected Works of Watchman Nee, Set 1 Vol.3, The Christian (1), ch.6 - https://bibleread.online/all-books-by-Watchman-Nee-and-Witness-Lee/book-collected-works-of-watchman-nee-the-set-1-vol-03-the-christian-1-Watchman-Nee-read-online/6/"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "The intention in the heart of God in bringing this universe into existence was that, ultimately, the whole creation should display the glory and supremacy of His Son, Jesus Christ.", "source": "Christ: All in All (austin-sparks.net/english/000617.html)"}], "declarations": ["I declare: all things were created by Christ and for Christ, including me.", "I declare: I live for the glory of the Son who made all things."], "prayer": "Lord Jesus, by You all things were created, in heaven and on earth. Teach me to live for You, for whom all things exist. Amen.", "theme_flag": "theme-based: Murray"}, {"day": 280, "ref": "Colossians 1:17", "book": "Colossians", "chapter": 1, "verse": 17, "text": "And he is before all things, and by him all things consist.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "He is the Firstborn of creation. They were created by Him, they were necessarily then created also for Him. In Him is seen the image of the invisible God; He has created all things, and all is for Him.", "source": "Darby's Synopsis, Colossians 1"}, {"name": "Andrew Murray", "short": "Murray", "comment": "He bears all things; all things consist in Him. The universe holds together because Christ upholds it by His power.", "source": "The Holiest of All, on Colossians 1"}, {"name": "Watchman Nee", "short": "Nee", "comment": "God's Christ is all things. Apart from Christ, God does not have any thing.", "source": "Collected Works of Watchman Nee, Set 3 Vol.56, The Open Door and The Present Testimony, ch.5 - https://bibleread.online/all-books-by-Watchman-Nee-and-Witness-Lee/book-collected-works-of-watchman-nee-the-set-3-vol-56-the-open-door-amp-the-present-testimony-Watchman-Nee-read-online/5/"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "And in Him all things hold together. But for the Lord Jesus Christ, the whole universe would disintegrate, fall apart; it would be without its uniting factor.", "source": "Christ: All in All (austin-sparks.net/english/000617.html)"}], "declarations": ["I declare: Christ is before all things, and by Him all things hold together.", "I declare: my life is held together by Christ alone."], "prayer": "Lord Jesus, You are before all things, and by You all things consist. Hold my life together today; I trust in Your upholding power. Amen.", "theme_flag": "theme-based: Nee"}, {"day": 281, "ref": "Colossians 1:18", "book": "Colossians", "chapter": 1, "verse": 18, "text": "And he is the head of the body, the church: who is the beginning, the firstborn from the dead; that in all things he might have the preeminence.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "He is the Head of the body which is the assembly, the Beginning, the Firstborn from among the dead, that in all things He might have the preeminence.", "source": "Darby's Synopsis, Colossians 1"}, {"name": "Andrew Murray", "short": "Murray", "comment": "The Son was not only begotten of the Father in eternity, but begotten again in the resurrection. He is the firstborn from the dead, Head of the new creation.", "source": "The Holiest of All, on Colossians 1"}, {"name": "Watchman Nee", "short": "Nee", "comment": "From start to finish, he is the One who does it all. Christ must have the preeminence in all things.", "source": "The Normal Christian Life, p.172"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "It is all gathered up, every fragment of it, in this: That in all things he might have the pre-eminence. In ALL things.", "source": "The Centrality and Supremacy of the Lord Jesus Christ, ch. 1 (austin-sparks.net)"}], "declarations": ["I declare: Christ is the Head of the church, and He has the preeminence in all things.", "I declare: I submit to Christ as my Head in everything."], "prayer": "Lord Jesus, Head of the church, have the preeminence in my life. Rule over me as You rule over all things. Amen.", "theme_flag": "theme-based: Nee"}, {"day": 282, "ref": "Colossians 1:19", "book": "Colossians", "chapter": 1, "verse": 19, "text": "For it pleased the Father that in him should all fulness dwell;", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "For all the fullness, namely of the Godhead, was pleased to dwell in Him. What place could He have except that of first in all things.", "source": "Darby's Synopsis, Colossians 1"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Him in whom is all life and blessing. All fullness dwells in Christ, and from Him we receive all we need.", "source": "The New Life, ch. 6"}, {"name": "Watchman Nee", "short": "Nee", "comment": "God, in Christ, has worked to such an extent that we are as complete as Christ.", "source": "Collected Works of Watchman Nee, Set 1 Vol.20, Questions on the Gospel, ch.4 - https://bibleread.online/all-books-by-Watchman-Nee-and-Witness-Lee/book-collected-works-of-watchman-nee-the-set-1-vol-20-questions-on-the-gospel-Watchman-Nee-read-online/4/"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "If there is any barrenness it is not because the Lord is bankrupt. In Him all fullness dwells, and He is enough.", "source": "The Fulness of Christ (austin-sparks.net/m/005144.html)"}], "declarations": ["I declare: it pleased the Father that in Christ all fullness should dwell.", "I declare: I draw from the fullness of Christ for every need."], "prayer": "Lord Jesus, in You all fullness dwells. Fill me from Your fullness, and let me want nothing apart from You. Amen.", "theme_flag": "theme-based: Murray, theme-based: Nee"}, {"day": 283, "ref": "Colossians 1:20", "book": "Colossians", "chapter": 1, "verse": 20, "text": "And, having made peace through the blood of his cross, by him to reconcile all things unto himself; by him, I say, whether they be things in earth, or things in heaven.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Not only was it the good pleasure of the fullness of the Godhead to dwell in Him, but by Him to reconcile all things to itself, having made peace by the blood of the cross.", "source": "Darby's Synopsis, Colossians 1"}, {"name": "Andrew Murray", "short": "Murray", "comment": "He gave Him, in His death on the cross as Surety, to bear our sins and make peace. The blood of Christ is the ground of our reconciliation.", "source": "The New Life, ch. 6"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Lord, I do not know fully what the value of the blood is, but I know that the blood has satisfied Thee; so the blood is enough for me, and it is my only plea.", "source": "The Normal Christian Life"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "The Cross was intended only to make the Lord Jesus all and in all for us. By His blood He reconciles all things to Himself.", "source": "Christ: All in All (austin-sparks.net)"}], "declarations": ["I declare: by the blood of His cross, Christ has made peace and reconciled me to God.", "I declare: I am reconciled to God through Jesus Christ."], "prayer": "Lord Jesus, by the blood of Your cross You have made peace. Thank You for reconciling me to God; keep me in that peace. Amen.", "theme_flag": "theme-based: Murray, theme-based: Sparks"}, {"day": 284, "ref": "Colossians 1:27", "book": "Colossians", "chapter": 1, "verse": 27, "text": "To whom God would make known what is the riches of the glory of this mystery among the Gentiles; which is Christ in you, the hope of glory:", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "It is not they in Christ there, but Christ in them the hope of glory. We have the Person and divine glory of Christ, and our completeness in Him, more insisted on in Colossians.", "source": "Darby's Synopsis, Colossians 1"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Christ the Living One in heaven will live in thee, and enable thee to live that life of trust. Christ in you is the secret of the Christian life.", "source": "The Master's Indwelling"}, {"name": "Watchman Nee", "short": "Nee", "comment": "We all have the same Christ dwelling within, but revelation of some new need will lead us spontaneously to trust Him to live out His life in that particular.", "source": "The Normal Christian Life"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Christ in you the hope of glory: this is heaven. You walk in the presence of the Lord Jesus.", "source": "The Measure of Christ (austin-sparks.net/english/007219.html)"}], "declarations": ["I declare: Christ in me is the hope of glory.", "I declare: the riches of this mystery dwell in me by Christ."], "prayer": "Lord Jesus, You in me are the hope of glory. Live Your life in me today, and manifest Your riches through me. Amen.", "theme_flag": "theme-based: Murray"}, {"day": 285, "ref": "Colossians 2:6", "book": "Colossians", "chapter": 2, "verse": 6, "text": "As ye have therefore received Christ Jesus the Lord, so walk ye in him:", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "There is nothing but conscious union with Christ which can keep us securely there. Ordinances to reach Him can have no place where we are united to Him.", "source": "Darby's Synopsis, Colossians 1"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Abide in Christ: as the branch abides in the vine, so the believer abides in Christ, drawing all life from Him. To walk in Him is to remain in Him.", "source": "Abide in Christ, ch. 5"}, {"name": "Watchman Nee", "short": "Nee", "comment": "We think of the Christian life as a changed life but it is not that. What God offers us is an exchanged life, a substituted life, and Christ is our Substitute within.", "source": "The Normal Christian Life, p.180"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "The Christian life is not by effort, and not by struggle; but from beginning to end and all together a matter of knowing the Lord Jesus within.", "source": "The Measure of Christ (austin-sparks.net/english/007219.html)"}], "declarations": ["I declare: as I received Christ Jesus the Lord, so I walk in Him.", "I declare: my walk is in Christ, rooted and built up in Him."], "prayer": "Lord Jesus, as I received You, so I would walk in You. Keep me abiding in You, rooted and grounded in Your love. Amen.", "theme_flag": "theme-based: Nee, theme-based: Sparks"}, {"day": 286, "ref": "Colossians 2:9", "book": "Colossians", "chapter": 2, "verse": 9, "text": "For in him dwelleth all the fulness of the Godhead bodily.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "For all the fullness of the Godhead dwells bodily in Him. Nevertheless He is a man. The perfect character and living representation of the invisible God have been seen in Him.", "source": "Darby's Synopsis, Colossians 1"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Not simply forgiveness, but Jesus, His own Son. God gives us not only pardon but His Son Himself, in whom all fullness dwells.", "source": "The New Life, ch. 6"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Grace means that God does something for me; law means that I do something for God. In Christ, God has done all.", "source": "The Normal Christian Life, p.155-6"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "God has singled out a Person and gathered into that Person all the Divine perfections. He has put all the fulness of Eternity and the Universe into that Person.", "source": "The Measure of Christ (austin-sparks.net/english/007219.html)"}], "declarations": ["I declare: in Christ dwells all the fullness of the Godhead bodily.", "I declare: I worship Christ as fully God and fully man."], "prayer": "Lord Jesus, in You dwells all the fullness of the Godhead bodily. I worship You as God manifest in flesh, my Lord and my God. Amen.", "theme_flag": "theme-based: Nee, theme-based: Sparks"}, {"day": 287, "ref": "Colossians 2:10", "book": "Colossians", "chapter": 2, "verse": 10, "text": "And ye are complete in him, which is the head of all principality and power:", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "In the second place we are complete in Him; we need nothing out of Christ. We possess in Him perfection and completeness before God. What a truth! What a position!", "source": "Darby's Synopsis, Colossians 2"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Our life is nothing but a continuous blessed apprehension and reception of Him. We are complete because Christ Himself is our completeness.", "source": "The New Life, ch. 8"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Outside of Christ, I am only a sinner, but in Christ, I am saved. Outside of Christ, I am empty; in Christ, I am full. Outside of Christ, I am weak; in Christ, I am strong.", "source": "Secrets to Spiritual Power, p.74"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "We must never think of anything as outside of Christ. HE is Salvation, HE is Sanctification, HE is Redemption, Justification, Peace, Wisdom, Love, Heaven.", "source": "The Measure of Christ (austin-sparks.net/english/007219.html)"}], "declarations": ["I declare: I am complete in Christ, who is the Head of all principality and power.", "I declare: I need nothing outside of Christ."], "prayer": "Lord Jesus, I am complete in You. Keep me from seeking elsewhere what I already have in You, my Head. Amen.", "theme_flag": "theme-based: Sparks"}, {"day": 288, "ref": "Colossians 3:1", "book": "Colossians", "chapter": 3, "verse": 1, "text": "If ye then be risen with Christ, seek those things which are above, where Christ sitteth on the right hand of God.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "The Epistle to the Colossians looks at the Christian as risen with Christ. He has died with Christ and he is risen with Him. A hope is laid up for him in heaven.", "source": "Darby's Synopsis, Colossians 3"}, {"name": "Andrew Murray", "short": "Murray", "comment": "I have been raised together with Christ, and in Him, I live unto God. The risen life is Christ Himself living in me.", "source": "The Inner Life, Day 21"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Sanctification is not a work of our own. Sanctification is accomplished for us by God.", "source": "Sermon: Sanctification, on Colossians 3:1-3"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Get focussed on Him and see everything is HIMSELF. The risen Christ is to be our absorbing occupation.", "source": "The Measure of Christ (austin-sparks.net/english/007219.html)"}], "declarations": ["I declare: I am risen with Christ, and I seek those things which are above.", "I declare: my life is set on Christ at the right hand of God."], "prayer": "Lord Jesus, risen One, lift my heart to where You are. Teach me to seek the things above, where You sit at God's right hand. Amen.", "theme_flag": "theme-based: Sparks"}, {"day": 289, "ref": "Colossians 3:2", "book": "Colossians", "chapter": 3, "verse": 2, "text": "Set your affection on things above, not on things on the earth.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "He is to set his affections on things above, not on things on the earth. He directs the eyes of the Colossians to heaven, in order that they may see Christ there.", "source": "Darby's Synopsis, Colossians 3"}, {"name": "Andrew Murray", "short": "Murray", "comment": "To seek and expect nothing less than grace to live the hidden life of heaven here on earth. Our affections rise where Christ is.", "source": "The Inner Life, Day 21"}, {"name": "Watchman Nee", "short": "Nee", "comment": "If any person desires to think, he must possess memory, imagination and reasoning power; but the Christian has presently lost the use of these.", "source": "Spiritual Authority"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Seek to have your life in God, not in things, not in people, not in places, not in circumstances, but in God.", "source": "T. Austin-Sparks"}], "declarations": ["I declare: I set my affection on things above, not on things on the earth.", "I declare: my heart is fixed on Christ, not on this world."], "prayer": "Lord Jesus, set my affection on things above. Detach my heart from earthly things and fix it on You. Amen.", "theme_flag": "theme-based: Nee, theme-based: Sparks"}, {"day": 290, "ref": "Colossians 3:3", "book": "Colossians", "chapter": 3, "verse": 3, "text": "For ye are dead, and your life is hid with Christ in God.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "We are dead: this is the precious comforting truth with regard to the Christian by virtue of Christ having died for him. He has received the life of Christ, and our life is hid with Christ in God.", "source": "Darby's Synopsis, Colossians 3"}, {"name": "Andrew Murray", "short": "Murray", "comment": "For ye died, and your life is hid with Christ in God. Christ is our life. Our true life is not our own but Christ in us.", "source": "The New Life, ch. 1"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Christ is our life. And it is the Lord who lives out this life in us. Only the Lord is life.", "source": "Christ the Sum of All Spiritual Things, p.20"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Christianity is not a doctrine, not truth as truth, but the knowledge of a PERSON; it is knowing the LORD JESUS. Our life is hid in Him.", "source": "The Measure of Christ (austin-sparks.net/english/007219.html)"}], "declarations": ["I declare: I am dead, and my life is hid with Christ in God.", "I declare: Christ is my life, hidden and secure in God."], "prayer": "Lord Jesus, my life is hid with You in God. Keep me hidden in You, dead to sin and alive to God. Amen.", "theme_flag": "theme-based: Sparks"}, {"day": 291, "ref": "Colossians 3:17", "book": "Colossians", "chapter": 3, "verse": 17, "text": "And what soever ye do in word or deed, do all in the name of the Lord Jesus, giving thanks to God and the Father by him.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "What we say, what we do, is said and done in the name of the Lord Jesus. There is the sense of His presence; the consciousness that everything relates to Him.", "source": "Darby's Synopsis, Colossians 3"}, {"name": "Andrew Murray", "short": "Murray", "comment": "The Name of Christ is the expression of all He has done and all He is and lives to do as our Mediator. To act in His Name is to act in His power.", "source": "With Christ in the School of Prayer, Lesson 24"}, {"name": "Watchman Nee", "short": "Nee", "comment": "There is nothing stereotyped about God's dealings with His children. We must not by our prejudices make watertight compartments for the working of His Spirit.", "source": "The Finest of the Wheat, vol. 1"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "It is CHRIST Himself who IS salvation, HE is sanctification, and HE within as this. All we do is in His Name because He is our life.", "source": "The Measure of Christ (austin-sparks.net/english/007219.html)"}], "declarations": ["I declare: whatever I do in word or deed, I do all in the name of the Lord Jesus.", "I declare: my words and works bear the Name of Christ."], "prayer": "Lord Jesus, I do all in Your Name today. Let my words and deeds honor You, and let thanksgiving fill my heart. Amen.", "theme_flag": "theme-based: Nee, theme-based: Sparks"}, {"day": 292, "ref": "Colossians 3:23", "book": "Colossians", "chapter": 3, "verse": 23, "text": "And what soever ye do, do it heartily, as to the Lord, and not unto men;", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "The Christian walks worthy of the Lord; he knows what becomes Him, and walks accordingly, that he may please Him in all things, bearing fruit in every good work.", "source": "Darby's Synopsis, Colossians 1"}, {"name": "Andrew Murray", "short": "Murray", "comment": "To translate His hidden, heavenly glory into the language of daily life. All our work becomes worship when done for Christ.", "source": "The Inner Life, Day 21"}, {"name": "Watchman Nee", "short": "Nee", "comment": "The Lord wants us to be used, yes; but what He is after is that we pour all we have, ourselves, to Him, and if that be all, that is enough.", "source": "The Normal Christian Life"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "The mark of a life governed by the Holy Spirit is that such a life is continually and ever more and more occupied with Christ.", "source": "The School of Christ, p.5"}], "declarations": ["I declare: whatever I do, I do it heartily, as to the Lord and not unto men.", "I declare: Christ is the Master I serve in all my work."], "prayer": "Lord Jesus, I work for You and not for men. Put Your heart into my hands' work, and accept it as service to You. Amen.", "theme_flag": "theme-based: Murray, theme-based: Nee, theme-based: Sparks"}, {"day": 293, "ref": "1 Thessalonians 4:16", "book": "1 Thessalonians", "chapter": 4, "verse": 16, "text": "For the Lord himself shall descend from heaven with a shout, with the voice of the archangel, and with the trump of God: and the dead in Christ shall rise first:", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "The Lord Himself shall descend from heaven with a shout. The dead in Christ shall rise first; then we which are alive shall be caught up together with them to meet the Lord in the air.", "source": "Darby's Synopsis, 1 Thessalonians 4"}, {"name": "Andrew Murray", "short": "Murray", "comment": "We wait for His coming, when He shall change our vile body. The Lord Himself shall descend, and we shall meet Him.", "source": "Waiting on God, Day 28"}, {"name": "Watchman Nee", "short": "Nee", "comment": "When they are ready, the Lord Himself will come to the air to receive them.", "source": "Collected Works of Watchman Nee, Set 1 Vol.4, The Christian (2), ch.1 - https://bibleread.online/all-books-by-Watchman-Nee-and-Witness-Lee/book-collected-works-of-watchman-nee-the-set-1-vol-04-the-christian-2-Watchman-Nee-read-online/1/"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "At last He is coming again! Why? To finish it all! To complete the redemption of man!", "source": "T. Austin-Sparks, The Octave of Redemption, ch.8 - https://Austin-Sparks.Net/english/books/001616.html"}], "declarations": ["I declare: the Lord Himself shall descend from heaven, and I shall meet Him.", "I declare: I live ready for the coming of Christ."], "prayer": "Lord Jesus, You Yourself shall descend from heaven. Keep me watching and ready for Your shout, for the trumpet of God. Amen.", "theme_flag": "theme-based: Murray"}, {"day": 294, "ref": "1 Thessalonians 4:17", "book": "1 Thessalonians", "chapter": 4, "verse": 17, "text": "Then we which are alive and remain shall be caught up together with them in the clouds, to meet the Lord in the air: and so shall we ever be with the Lord.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "And so shall we ever be with the Lord. Wherefore comfort one another with these words. The coming of Christ is the church's comfort and hope.", "source": "Darby's Synopsis, 1 Thessalonians 4"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Then we shall all meet, caught up to meet Him in the air. His own meeting Him: this is the blessed hope of the church.", "source": "Waiting on God, Day 28"}, {"name": "Watchman Nee", "short": "Nee", "comment": "When the Morning Star arrives, we will be raptured.", "source": "Collected Works of Watchman Nee, Set 1 Vol.4, The Christian (2), ch.1 - https://bibleread.online/all-books-by-Watchman-Nee-and-Witness-Lee/book-collected-works-of-watchman-nee-the-set-1-vol-04-the-christian-2-Watchman-Nee-read-online/1/"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "We which are alive, and remain, shall be caught up. Resurrection life in any case is rapture in its issue. It is victory over death, and victory over death is rapture.", "source": "The Power of His Resurrection, ch. 7 (austin-sparks.net/m/Books-001165.html)"}], "declarations": ["I declare: I shall be caught up to meet the Lord in the air, and so shall I ever be with the Lord.", "I declare: my eternal home is with Christ."], "prayer": "Lord Jesus, I shall be caught up to meet You in the air. Comfort my heart with this hope, and keep me faithful until then. Amen.", "theme_flag": "theme-based: Murray, theme-based: Nee"}, {"day": 295, "ref": "1 Thessalonians 5:16", "book": "1 Thessalonians", "chapter": 5, "verse": 16, "text": "Rejoice evermore.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Rejoice evermore. The apostle would have the Thessalonians maintain, in spite of all trial, the joy which becomes those who know the Lord.", "source": "Darby's Synopsis, 1 Thessalonians 5"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Rejoice evermore. Joy is the fruit of the Spirit and the mark of those who know Christ. In Him we have cause for unceasing joy.", "source": "The New Life, ch. 32"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Negligence in prayer withers the inner man. Nothing can be a substitute for it, not even Christian work.", "source": "The Finest of the Wheat, vol. 2, p.66"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "through this short letter the one throbbing note is: 'Rejoice in the Lord,' rejoice, rejoice.", "source": "T. Austin-Sparks, The Excellency of the Knowledge of Christ - https://austin-sparks.net/m/Books-003542.html"}], "declarations": ["I declare: I rejoice evermore in the Lord.", "I declare: joy in Christ is my strength today."], "prayer": "Lord Jesus, I rejoice evermore in You. Let Your joy be my strength, unbroken by circumstance. Amen.", "theme_flag": "theme-based: Nee, theme-based: Sparks"}, {"day": 296, "ref": "1 Thessalonians 5:17", "book": "1 Thessalonians", "chapter": 5, "verse": 17, "text": "Pray without ceasing.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Pray without ceasing. The life of the Christian is to be one of unbroken dependence on the Lord.", "source": "Darby's Synopsis, 1 Thessalonians 5"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Prayer is the interchange of the life of Christ in us. To pray without ceasing is to live in unbroken fellowship with Him.", "source": "With Christ in the School of Prayer, Lesson 31"}, {"name": "Watchman Nee", "short": "Nee", "comment": "God has a will. Yet He wants man to pray according to His will. When man does this, He will immediately accomplish the work that His will has ordained.", "source": "Sermon: Co-Laboring With God"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "The problem which comes up in prayer is to keep on hammering at the door, to continue knocking.", "source": "T. Austin-Sparks, In Touch with the Throne, ch.4 - https://www.austin-sparks.net/english/books/001709.html"}], "declarations": ["I declare: I pray without ceasing, abiding in fellowship with Christ.", "I declare: my life is a continual conversation with the Lord."], "prayer": "Lord Jesus, teach me to pray without ceasing. Keep me in unbroken fellowship with You through this day. Amen.", "theme_flag": "theme-based: Nee"}, {"day": 297, "ref": "1 Thessalonians 5:18", "book": "1 Thessalonians", "chapter": 5, "verse": 18, "text": "In every thing give thanks: for this is the will of God in Christ Jesus concerning you.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "In everything give thanks: for this is the will of God in Christ Jesus concerning you. The heart that knows Christ finds cause for thanksgiving in all things.", "source": "Darby's Synopsis, 1 Thessalonians 5"}, {"name": "Andrew Murray", "short": "Murray", "comment": "In everything give thanks. Thanksgiving is the language of faith, acknowledging Christ as the Giver of all good.", "source": "With Christ in the School of Prayer, Lesson 31"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Our prayers lay the track down which God's power can come. Like a mighty locomotive, his power is irresistible, but it cannot reach us without rails.", "source": "Watchman Nee"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "By such experiences we have learned to thank the Lord on the spot.", "source": "T. Austin-Sparks, The Living God (1938) - https://Austin-Sparks.Net/english/002994.html"}], "declarations": ["I declare: in everything I give thanks, for this is the will of God in Christ Jesus.", "I declare: thanksgiving is my response to Christ in all things."], "prayer": "Lord Jesus, in everything I give You thanks. Open my eyes to Your goodness in all things, for this is Your will for me. Amen.", "theme_flag": "theme-based: Nee, theme-based: Sparks"}, {"day": 298, "ref": "1 Thessalonians 5:24", "book": "1 Thessalonians", "chapter": 5, "verse": 24, "text": "Faithful is he that calleth you, who also will do it.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Faithful is He that calleth you, who also will do it. It is God Himself who has called, and His faithfulness guarantees He will accomplish all.", "source": "Darby's Synopsis, 1 Thessalonians 5"}, {"name": "Andrew Murray", "short": "Murray", "comment": "When God says that something shall come to pass, this is for faith just as good as if I had seen it. He is faithful, and He will do it.", "source": "The New Life, ch. 4"}, {"name": "Watchman Nee", "short": "Nee", "comment": "The Lord Jesus requires just as much, yea more. But what He requires from us, He Himself carries out in us.", "source": "The Normal Christian Life"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "But, blessed be God, He has got it perfected in His Son, and He is a nail in a sure place and God can hang everything upon Him, and He will not give way.", "source": "T. Austin-Sparks, Faithful and True - https://www.austin-sparks.net/english/005067.html"}], "declarations": ["I declare: faithful is He that called me, who also will do it.", "I declare: God will complete in me what He has begun in Christ."], "prayer": "Lord Jesus, You are faithful who called me, and You will do it. I rest on Your faithfulness to complete Your work in me. Amen.", "theme_flag": "theme-based: Sparks"}, {"day": 299, "ref": "2 Thessalonians 3:3", "book": "2 Thessalonians", "chapter": 3, "verse": 3, "text": "But the Lord is faithful, who shall stablish you, and keep you from evil.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "But the Lord is faithful, who shall stablish you, and keep you from evil. The faithfulness of Christ is the believer's security.", "source": "Darby's Synopsis, 2 Thessalonians 3"}, {"name": "Andrew Murray", "short": "Murray", "comment": "You are safe in the certitude that He in His love takes and holds you fast. The Lord is faithful; He will establish you.", "source": "The New Life, ch. 9"}, {"name": "Watchman Nee", "short": "Nee", "comment": "If we really trust God, we shall expect to bear unaided the spiritual burden. Our faith is not to be in God plus man but in God alone.", "source": "A Table in the Wilderness"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "that living God has you in hand, although you do not know it.", "source": "T. Austin-Sparks, The Living God (1938) - https://Austin-Sparks.Net/english/002994.html"}], "declarations": ["I declare: the Lord is faithful; He will establish me and keep me from evil.", "I declare: I am kept by the faithfulness of Christ."], "prayer": "Lord Jesus, faithful One, establish me and keep me from evil. Guard me by Your power today. Amen.", "theme_flag": "theme-based: Nee, theme-based: Sparks"}, {"day": 300, "ref": "1 Timothy 1:15", "book": "1 Timothy", "chapter": 1, "verse": 15, "text": "This is a faithful saying, and worthy of all acceptation, that Christ Jesus came into the world to save sinners; of whom I am chief.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "This is a faithful saying, and worthy of all acceptation, that Christ Jesus came into the world to save sinners. The gospel rests on the coming of Christ for this very end.", "source": "Darby's Synopsis, 1 Timothy 1"}, {"name": "Andrew Murray", "short": "Murray", "comment": "It is to take away sin that God gave His Son. Christ Jesus came into the world to save sinners: this is the heart of the gospel.", "source": "The New Life, ch. 10"}, {"name": "Watchman Nee", "short": "Nee", "comment": "For I did not come to call the righteous, but sinners. Jesus opened up God's heart to men.", "source": "God is Willing"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "The question which covers and governs all learning is this: Why did the Lord Jesus Christ come into this world?", "source": "T. Austin-Sparks, Discipleship in the School of Christ - https://www.austin-sparks.net/pdf/Discipleship in the School of Christ - T. Austin-Sparks.pdf"}], "declarations": ["I declare: Christ Jesus came into the world to save sinners, of whom I am chief.", "I declare: I am saved by Christ who came for sinners."], "prayer": "Lord Jesus, You came into the world to save sinners. Thank You for saving me; make me a witness of Your saving grace. Amen.", "theme_flag": "theme-based: Murray"}, {"day": 301, "ref": "1 Timothy 2:5", "book": "1 Timothy", "chapter": 2, "verse": 5, "text": "For there is one God, and one mediator between God and men, the man Christ Jesus;", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "For there is one God, and one mediator between God and men, the man Christ Jesus. He who is God has become man to bring together God and men.", "source": "Darby's Synopsis, 1 Timothy 2"}, {"name": "Andrew Murray", "short": "Murray", "comment": "His glory and power as mediator of the new covenant. There is one mediator between God and men, the man Christ Jesus.", "source": "The Holiest of All"}, {"name": "Watchman Nee", "short": "Nee", "comment": "He is the only Mediator between God and man.", "source": "Collected Works of Watchman Nee, Set 1 Vol.20, Questions on the Gospel, ch.27 - https://bibleread.online/all-books-by-Watchman-Nee-and-Witness-Lee/book-questions-on-the-gospel-Watchman-Nee-read-online/27/"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "God has singled out a Person and set Him forth to be seen of all: the MAN CHRIST JESUS. One mediator between God and men.", "source": "The Measure of Christ (austin-sparks.net/english/007219.html)"}], "declarations": ["I declare: there is one mediator between God and men, the man Christ Jesus.", "I declare: I come to God only through Christ."], "prayer": "Lord Jesus, my one Mediator, thank You for standing between God and me. Bring me to the Father by Your own blood. Amen.", "theme_flag": "theme-based: Murray"}, {"day": 302, "ref": "1 Timothy 4:12", "book": "1 Timothy", "chapter": 4, "verse": 12, "text": "Let no man despise thy youth; but be thou an example of the believers, in word, in conversation, in charity, in spirit, in faith, in purity.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Be thou an example of the believers, in word, in conversation, in charity, in spirit, in faith, in purity. The life of Christ in the believer is to be the pattern.", "source": "Darby's Synopsis, 1 Timothy 4"}, {"name": "Andrew Murray", "short": "Murray", "comment": "To the true imitation of Jesus in His example, we must be conformed to His likeness. The believer's life should reflect Christ.", "source": "The New Life, ch. 39"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Revelation is the first step to holiness, and consecration is the second. A day must come when we give up all right to ourselves and submit to the absolute Lordship of Jesus Christ.", "source": "Watchman Nee"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "The Christian is, in the Word of God, looked upon as being a very responsible person.", "source": "T. Austin-Sparks, God's Reactions to Man's Defections, Part 2, ch.7 - https://www.austin-sparks.net/english/books/000861.html"}], "declarations": ["I declare: I am an example to believers in word, in conduct, in love, in faith, in purity.", "I declare: Christ in me is seen by others."], "prayer": "Lord Jesus, make me an example to believers. Let Your life in me be seen in word, in love, in faith, in purity. Amen.", "theme_flag": "theme-based: Murray, theme-based: Nee, theme-based: Sparks"}, {"day": 303, "ref": "2 Timothy 1:7", "book": "2 Timothy", "chapter": 1, "verse": 7, "text": "For God hath not given us the spirit of fear; but of power, and of love, and of a sound mind.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "For God hath not given us the spirit of fear; but of power, and of love, and of a sound mind. The Spirit given is the Spirit of Christ, bold and loving.", "source": "Darby's Synopsis, 2 Timothy 1"}, {"name": "Andrew Murray", "short": "Murray", "comment": "The new life is a life in the power of Christ through the Spirit. Not fear, but power and love and a sound mind.", "source": "The New Life, ch. 20"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Our power is not a thing; it is simply Christ. It is Christ who manifests himself in us.", "source": "Christ the Sum of All Spiritual Things"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "God wants His people to go forward with assurance and confidence, with a firm and steady tread.", "source": "T. Austin-Sparks, Fear - https://Austin-Sparks.net/english/004826.html"}], "declarations": ["I declare: God has not given me the spirit of fear, but of power and of love and of a sound mind.", "I declare: I am bold in Christ, loving and clear-minded."], "prayer": "Lord Jesus, You have not given me fear but power, love, and a sound mind. Fill me with Your bold Spirit today. Amen.", "theme_flag": "theme-based: Murray, theme-based: Sparks"}, {"day": 304, "ref": "2 Timothy 4:7", "book": "2 Timothy", "chapter": 4, "verse": 7, "text": "I have fought a good fight, I have finished my course, I have kept the faith:", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "I have fought a good fight, I have finished my course, I have kept the faith. Paul could look back on a life wholly given to Christ, and forward to the crown.", "source": "Darby's Synopsis, 2 Timothy 4"}, {"name": "Andrew Murray", "short": "Murray", "comment": "I have fought the good fight, I have finished the course. The life hid with Christ ends in glory, the crown of righteousness.", "source": "The New Life, ch. 28"}, {"name": "Watchman Nee", "short": "Nee", "comment": "To be useful in God's hand, a man must be properly adjusted with respect to all three: his position, his life and his warfare.", "source": "Sit, Walk, Stand"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "We are in the same fight, the same contest, the same calling.", "source": "T. Austin-Sparks, God's Reactions to Man's Defections, Part 2, ch.7 - https://www.austin-sparks.net/english/books/000861.html"}], "declarations": ["I declare: I have fought the good fight, I have finished my course, I have kept the faith.", "I declare: I will finish my race in Christ."], "prayer": "Lord Jesus, help me fight the good fight and finish my course. Keep me faithful to the end, as You kept Paul. Amen.", "theme_flag": "theme-based: Nee"}, {"day": 305, "ref": "2 Timothy 4:8", "book": "2 Timothy", "chapter": 4, "verse": 8, "text": "Henceforth there is laid up for me a crown of righteousness, which the Lord, the righteous judge, shall give me at that day: and not to me only, but unto all them also that love his appearing.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Henceforth there is laid up for me a crown of righteousness, which the Lord, the righteous judge, shall give me at that day. Christ Himself rewards those who love His appearing.", "source": "Darby's Synopsis, 2 Timothy 4"}, {"name": "Andrew Murray", "short": "Murray", "comment": "He shall come to be glorified in His saints. The crown of righteousness awaits all who love His appearing.", "source": "Waiting on God, Day 28"}, {"name": "Watchman Nee", "short": "Nee", "comment": "All those who truly love the Lord long for the appearing of the Lord.", "source": "Collected Works of Watchman Nee, Set 1 Vol.4, The Christian (2), ch.1 - https://bibleread.online/all-books-by-Watchman-Nee-and-Witness-Lee/book-collected-works-of-watchman-nee-the-set-1-vol-04-the-christian-2-Watchman-Nee-read-online/1/"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "What is meant by 'crown' is the sealing of a course in triumph, with honour, with exaltation, the crown being the symbol both of victory and victorious honour.", "source": "T. Austin-Sparks, Crowning in Relation to an Ordeal - https://Austin-Sparks.Net/english/000647.html"}], "declarations": ["I declare: there is laid up for me a crown of righteousness from the Lord.", "I declare: I love His appearing and await my reward from Christ."], "prayer": "Lord Jesus, righteous Judge, I love Your appearing. Keep me ready for the crown of righteousness You will give. Amen.", "theme_flag": "theme-based: Murray"}, {"day": 306, "ref": "Titus 2:11", "book": "Titus", "chapter": 2, "verse": 11, "text": "For the grace of God that bringeth salvation hath appeared to all men,", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "For the grace of God that bringeth salvation hath appeared to all men. In Christ, the grace of God has been manifested, bringing salvation within reach of all.", "source": "Darby's Synopsis, Titus 2"}, {"name": "Andrew Murray", "short": "Murray", "comment": "God has given His Son, given Him wholly to become ours. Grace has appeared, bringing salvation to all men in Christ.", "source": "The New Life, ch. 6"}, {"name": "Watchman Nee", "short": "Nee", "comment": "It does not matter what your personal deficiency, God has always one sufficient answer, His Son Jesus Christ, and he is the answer to every need.", "source": "The Normal Christian Life, p.182-3"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Three things in that paragraph: the gift of grace; the goal of grace; the method of grace.", "source": "T. Austin-Sparks, The Grace of God - https://www.austin-sparks.net/english/005346.html"}], "declarations": ["I declare: the grace of God that brings salvation has appeared to all men i
