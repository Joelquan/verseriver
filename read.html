<script>
var DEVOTIONALS = [{"book": "Revelation", "chapter": 3, "day": 1, "declarations": ["I declare: I hear the voice of Christ knocking at the door of my heart today.", "I declare: my door is open. Jesus comes in and sups with me."], "prayer": "Lord Jesus, You stand at my door and knock. Today I open to You. Come in and sup with me. Make Your home in my heart, and let me never shut You out again. Amen.", "ref": "Revelation 3:20", "text": "Behold, I stand at the door, and knock: if any man hear my voice, and open the door, I will come in to him, and will sup with him, and he with me.", "theme_flag": null, "verse": 20, "witnesses": [{"comment": "What it may call itself still is not stated; He is not dealing with it. An open apostasy will come. Its date is not revealed; nor is it revealed as to the rapture. But I gather from 2 Thessalonians ii., that the rapture will be before the apostasy. What we have stated then is that it is after all dealing with the churches by Christ is closed that the subsequent dealings with the world in the Revelation begin. The churches are the things that are ; ‘what follows, the things after these. Christ is not now seen walking in their midst; He is the Lamb in the midst of the throne.", "name": "John Nelson Darby", "short": "Darby", "source": "Darby's Synopsis"}, {"comment": "Or, we may think of it as that other word says: In order to observe the Supper with the soul, He stands at the door and knocks. Wonderful condescension! What is there in the vile sinner that the King of Heaven longs to sit down beside him? In order to hold a feast in my heart, Jesus stands at the door and knocks. Is not this inconceivable love? Is it not unspeakable blessing? He would fain come in Himself. His presence is the special joy of the feast. And He Himself will hand to me and make me partaker of the heavenly food He brings to me.", "name": "Andrew Murray", "short": "Murray", "source": "The Lord's Table"}, {"comment": "He knocks at the door instead of breaking it. To those who do not want Him, He rather stands at the door and waits.", "name": "Watchman Nee", "short": "Nee", "source": "The Christian (3): Meditations on Revelation"}, {"comment": "The Lord is constantly coming to His people. He comes to them every time that there is a living Word from Him.", "name": "T. Austin-Sparks", "short": "Sparks", "source": "The Responsibility of Hearing the Word of the Lord"}]}, {"day": 2, "ref": "Genesis 3:15", "book": "Genesis", "chapter": 3, "verse": 15, "text": "And I will put enmity between thee and the woman, and between thy seed and her seed; it shall bruise thy head, and thou shalt bruise his heel.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "In judging the serpent, we have the promise made to the second Adam, the victorious Man. It is the Seed of the woman who bruises the serpent's head.", "source": "Darby's Synopsis, Genesis 3 (stempublishing)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "For thousands of years there had been a mighty conflict for the possession of mankind, between the Old Serpent, who led man astray, and the seed of the woman. But behold, Jesus is risen from the dead: an apparent victory proved to be the terrible downfall of the prince of darkness.", "source": "The Power of the Blood of Jesus, ch.9: Victory Through the Blood"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Christ is our Advocate, but we, the accused, side with the accuser.", "source": "The Normal Christian Life, 'Overcoming the Accuser'"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "There was nothing neutral about the Lord Jesus Christ.", "source": "The Holy Spirit as the Spirit of Anointing (austin-sparks.net)"}], "declarations": ["I declare: Jesus Christ, the Seed of the woman, has crushed the serpent's head, and I stand in His victory.", "I declare: There is enmity between me and the serpent, and I belong to Christ who bruised him."], "prayer": "Lord Jesus, You are the promised Seed who crushed the serpent's head. I thank You that the victory is already won. Keep me standing in Your triumph today. Amen.", "theme_flag": "theme-based: Nee"}, {"day": 3, "ref": "Genesis 12:3", "book": "Genesis", "chapter": 12, "verse": 3, "text": "And I will bless them that bless thee, and curse him that curseth thee: and in thee shall all families of the earth be blessed.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "The promises are given to him, whether of a numerous posterity, or of the blessing of all the families on the earth in him. He was the seed of promise.", "source": "Darby's Synopsis, Genesis 12"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Israel prays for blessing, that God may be known among all nations.", "source": "The Ministry of Intercession, 'His own elect, that cry to Him day and night' (ccel.org)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "There is absolutely no return regarding grace.", "source": "The Collected Works of Watchman Nee, Set 2 Vol.29: The Gospel of God (2), ch.1 (bibleread.online)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "a great multitude which no man can number out of every tribe and kindred and tongue", "source": "The Cross and the Way of Life, ch.4 'The Cross in Abraham's Life' (austin-sparks.net)"}], "declarations": ["I declare: In Christ, the Seed of Abraham, every family of the earth is blessed, and I am blessed in Him.", "I declare: I carry the blessing of Abraham, and God's blessing flows through me to others."], "prayer": "Lord Jesus, You are the Seed in whom all nations are blessed. Let Your blessing rest on me and flow through me to my family and all I meet. Amen.", "theme_flag": "theme-based: Sparks"}, {"day": 4, "ref": "Genesis 14:18", "book": "Genesis", "chapter": 14, "verse": 18, "text": "And Melchizedek king of Salem brought forth bread and wine: and he was the priest of the most high God.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "The kingly Priest, King of righteousness, and King of peace; that is, Christ, millennial King of the world, blessing victorious Abram.", "source": "Darby's Synopsis, Genesis 13-14"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Glorious food: wonderful heavenly bread: what a heavenly life it imparts to us. It is to bring His own eternal life near to us, that God has given His Son as the food of the soul.", "source": "The Lord's Table, Part 3, ch.1"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Inasmuch as Abraham is lesser than Melchizedek, Levi too is of less account than Melchizedek.", "source": "The Spiritual Man, 'Calvary's Judgment'"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Do you know that the very name 'Christ' means 'Anointed'?", "source": "The Holy Spirit as the Spirit of Anointing (austin-sparks.net)"}], "declarations": ["I declare: Jesus is my High Priest after the order of Melchizedek, King of righteousness and King of peace.", "I declare: Christ feeds me with the bread and wine of His own body and blood, and I am refreshed."], "prayer": "Lord Jesus, my Melchizedek, King of righteousness and King of peace, feed me today with Yourself. Let Your peace rule my heart. Amen.", "theme_flag": "theme-based: Nee"}, {"day": 5, "ref": "Genesis 22:18", "book": "Genesis", "chapter": 22, "verse": 18, "text": "And in thy seed shall all the nations of the earth be blessed; because thou hast obeyed my voice.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "The heir of the promise is sacrificed and raised again in figure, and the promise is confirmed to the seed. This is the confirmation to the one seed, that is Christ.", "source": "Darby's Synopsis, Genesis 22-24"}, {"name": "Andrew Murray", "short": "Murray", "comment": "For verily not of angels doth He take hold, but He taketh hold of the seed of Abraham.", "source": "The Holiest of All (swartzentrover.com)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "God's plan is to gain man.", "source": "The Glorious Church, ch.1 (bibleread.online)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "It is God and everything, or it is nothing.", "source": "The Cross and the Way of Life, ch.4 'A Supreme Test' (austin-sparks.net)"}], "declarations": ["I declare: In Christ, the obedient Seed, all nations are blessed, and His blessing covers me.", "I declare: Like Abraham, I obey God's voice, and blessing follows my obedience."], "prayer": "Lord Jesus, You are the Seed through whom every nation is blessed. Teach me the obedience of Abraham, that blessing may flow through my life. Amen.", "theme_flag": "theme-based: Nee, Sparks"}, {"day": 6, "ref": "Genesis 49:10", "book": "Genesis", "chapter": 49, "verse": 10, "text": "The sceptre shall not depart from Judah, nor a lawgiver from between his feet, until Shiloh come; and unto him shall the gathering of the people be.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "He remains till Shiloh come, to whom the gathering of the peoples belongs.", "source": "Darby's Synopsis, Genesis 48-50"}, {"name": "Andrew Murray", "short": "Murray", "comment": "The words point forward to that wonderful history of redemption which is not yet finished, and to the glorious future in eternity whither it is leading. There is no salvation but God's salvation.", "source": "Waiting on God, ch.2: The Keynote of Life"}, {"name": "Watchman Nee", "short": "Nee", "comment": "God's purpose is for man to rule.", "source": "The Glorious Church, ch.1 'Psalm 8' (bibleread.online)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "The Gathering into One is in Christ.", "source": "In Christ, 'Chapter 1 - The All-Inclusive In' (austin-sparks.net)"}], "declarations": ["I declare: Shiloh has come, and the sceptre rests in the hands of Jesus forever.", "I declare: To Christ the peoples gather, and I gather to Him with joy."], "prayer": "Lord Jesus, Shiloh, the One to whom the gathering of the peoples belongs, I gather to You today. Rule over my life with Your righteous sceptre. Amen.", "theme_flag": "theme-based: Nee"}, {"day": 7, "ref": "Exodus 12:46", "book": "Exodus", "chapter": 12, "verse": 46, "text": "In one house shall it be eaten; thou shalt not carry forth ought of the flesh abroad out of the house; neither shall ye break a bone thereof.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "In the passover was the bitter herbs of judgment of sin in ourselves, and feeding on the slain Lamb, with loins girded and shoes on our feet, to leave the place of sin.", "source": "Darby's Synopsis, Exodus, chapters 5-13"}, {"name": "Andrew Murray", "short": "Murray", "comment": "He gives the greatest and the best He can bestow: yea, all that it is possible for Him to give, the broken body which He first offered to the Father as a sacrifice for sin.", "source": "The Lord's Table, Part 2, ch.1"}, {"name": "Watchman Nee", "short": "Nee", "comment": "He has come to bear our sins.", "source": "The Collected Works of Watchman Nee, Set 2 Vol.28: The Gospel of God (1), ch.2 'God's love, grace, and mercy' (bibleread.online)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Here is God preserving the life.", "source": "The Battle for Life, '8. Levitical Law of Life' (austin-sparks.net)"}], "declarations": ["I declare: Christ my Passover is sacrificed for me, and not a bone of Him was broken.", "I declare: I feed on the slain Lamb, and I will not carry His flesh outside the house of faith."], "prayer": "Lord Jesus, my Passover Lamb, I thank You that none of Your bones were broken. Feed me with Yourself and keep me in the house of Your people. Amen.", "theme_flag": "theme-based: Nee, Sparks"}, {"day": 8, "ref": "Exodus 15:2", "book": "Exodus", "chapter": 15, "verse": 2, "text": "The LORD is my strength and song, and he is become my salvation: he is my God, and I will prepare him an habitation; my father’s God, and I will exalt him.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "They sing the song of triumph. God has led them by His power to His holy habitation. The heart's desire is that He should dwell with us.", "source": "Darby's Synopsis, Exodus 15"}, {"name": "Andrew Murray", "short": "Murray", "comment": "There is nothing can help a man to bear and endure so much as joy. Begin to believe with your whole heart, 'The joy of the Holy Ghost is my portion.'", "source": "The Master's Indwelling, ch.10: Joy in the Holy Ghost"}, {"name": "Watchman Nee", "short": "Nee", "comment": "In some unaccountable way the Lord was with me, and His love triumphed.", "source": "Sit, Walk, Stand, 'The Perfection of the Father'"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "We see fullness, victory, everything that speaks of life at the end.", "source": "The Battle for Life, '6. Job' (austin-sparks.net)"}], "declarations": ["I declare: The LORD is my strength and my song; He is become my salvation.", "I declare: I will sing to the Lord, for He has triumphed gloriously in my life."], "prayer": "Lord Jesus, You are my strength and my song. Put a new song in my mouth today and let my life sing of Your salvation. Amen.", "theme_flag": "theme-based: Murray, Nee, Sparks"}, {"day": 9, "ref": "Leviticus 19:18", "book": "Leviticus", "chapter": 19, "verse": 18, "text": "¶ Thou shalt not avenge, nor bear any grudge against the children of thy people, but thou shalt love thy neighbour as thyself: I am the LORD.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "They were to be holy, for Jehovah was holy... It is here we find the precept to love our neighbour as ourselves.", "source": "Darby's Synopsis, Leviticus 19-20"}, {"name": "Andrew Murray", "short": "Murray", "comment": "The fruit of the Spirit that He brought from heaven out of the heart of the crucified Christ, and that He gives in our heart, is first and foremost, love.", "source": "Absolute Surrender, ch.2 (ccel.org)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "God is too great.", "source": "The Collected Works of Watchman Nee, Set 2 Vol.29: The Gospel of God (2), ch.1 (bibleread.online)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "You will not say to him things that you will say to your loved one.", "source": "The Cross and the Way of Life, ch.4 'Abraham the Friend of God' (austin-sparks.net)"}], "declarations": ["I declare: I will not avenge or bear a grudge; I love my neighbour as myself.", "I declare: The love of Christ in me overcomes every offence and every grudge."], "prayer": "Lord Jesus, teach me to love my neighbour as myself. Take away every grudge from my heart and fill me with Your love. Amen.", "theme_flag": "theme-based: Nee, Sparks"}, {"day": 10, "ref": "Numbers 6:24", "book": "Numbers", "chapter": 6, "verse": 24, "text": "The LORD bless thee, and keep thee:", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "God ends by putting His blessing and His name on the people. The blessing places them under the keeping, the grace, and in the peace of Jehovah.", "source": "Darby's Synopsis, Numbers 6"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Oh, it is because the blessing is so great that our little hearts cannot rise to apprehend it; it is as if we cannot believe that Christ, the Almighty One, will in very deed teach and keep us all the day.", "source": "Abide in Christ, 'And ye shall find Rest to your Souls' (ccel.org)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Reckoning and faith are here practically the same thing.", "source": "The Normal Christian Life, 'The Reckoning of Faith'"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "The Spiritual Blessings are in Christ.", "source": "In Christ, 'Chapter 1 - The All-Inclusive In' (austin-sparks.net)"}], "declarations": ["I declare: The LORD blesses me and keeps me today.", "I declare: I am kept by the blessing of God; no evil can snatch me from His hand."], "prayer": "Lord Jesus, bless me and keep me. Let Your blessing rest on my house and keep us in all our ways. Amen.", "theme_flag": "theme-based: Nee"}, {"day": 11, "ref": "Numbers 6:25", "book": "Numbers", "chapter": 6, "verse": 25, "text": "The LORD make his face shine upon thee, and be gracious unto thee:", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "In making His face to shine upon them, He caused them to enjoy His grace.", "source": "Darby's Synopsis, Numbers 6"}, {"name": "Andrew Murray", "short": "Murray", "comment": "It is God Almighty, God the Faithful and Gracious One, who has undertaken to stablish me in Christ Jesus.", "source": "Abide in Christ, 'God Himself will stablish you in Him' (ccel.org)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "God wants the earth to move heaven.", "source": "The Prayer Ministry of the Church, ch.1 (bibleread.online)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "That is how He proves that He is the good Shepherd.", "source": "Written Not With Ink, ch.9 'The Good Shepherd' (austin-sparks.net)"}], "declarations": ["I declare: The LORD makes His face shine upon me, and He is gracious to me.", "I declare: I walk in the light of God's shining face, and His grace surrounds me."], "prayer": "Lord Jesus, shine Your face upon me and be gracious to me. Let Your favour go before me in all I do today. Amen.", "theme_flag": "theme-based: Nee, Sparks"}, {"day": 12, "ref": "Numbers 6:26", "book": "Numbers", "chapter": 6, "verse": 26, "text": "The LORD lift up his countenance upon thee, and give thee peace.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "In lifting up His countenance upon them, He gave them the assurance of peace.", "source": "Darby's Synopsis, Numbers 6"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Weary soul, since so many years driven to and fro like the panting hart, come and learn this day the lesson that there is a spot where safety and victory, where peace and rest, are always sure, and that that spot is always open to thee, the heart of Jesus.", "source": "Abide in Christ, 'And ye shall find Rest to your Souls' (ccel.org)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "He did not have to do anything.", "source": "The God of Abraham, Isaac, and Jacob, ch.7 (bibleread.online)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Abide in Christ and there is rest, there is peace, there is deliverance.", "source": "The School of Christ, 'Living by the Truth' (austin-sparks.net)"}], "declarations": ["I declare: The LORD lifts up His countenance upon me and gives me peace.", "I declare: I receive the peace of God today, and my heart is at rest."], "prayer": "Lord Jesus, lift up Your countenance upon me and give me peace. Quiet my heart and let Your peace rule in my home. Amen.", "theme_flag": "theme-based: Nee"}, {"day": 13, "ref": "Numbers 24:17", "book": "Numbers", "chapter": 24, "verse": 17, "text": "I shall see him, but not now: I shall behold him, but not nigh: there shall come a Star out of Jacob, and a Sceptre shall rise out of Israel, and shall smite the corners of Moab, and destroy all the children of Sheth.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "In the fourth place is the coming of Christ, the Star of Jacob, who crowns the glory of the people.", "source": "Darby's Synopsis, Numbers 24 (biblehub)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "And the sceptre of uprightness is the sceptre of Thy kingdom.", "source": "The Holiest of All (swartzentrover.com)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Abraham is a standard for us.", "source": "The God of Abraham, Isaac, and Jacob, ch.7 (bibleread.online)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Christ is all the glory, 'the Lamb is all the glory in Immanuel's land'.", "source": "The School of Christ, 'The Governing Law - The Glory of God' (austin-sparks.net)"}], "declarations": ["I declare: The Star out of Jacob has risen; Jesus Christ shines over my life.", "I declare: The Sceptre has risen out of Israel, and Christ reigns forever."], "prayer": "Lord Jesus, Star out of Jacob, shine in my darkness. Reign over my life with Your righteous sceptre. Amen.", "theme_flag": "theme-based: Nee, Sparks"}, {"day": 14, "ref": "Deuteronomy 6:5", "book": "Deuteronomy", "chapter": 6, "verse": 5, "text": "And thou shalt love the LORD thy God with all thine heart, and with all thy soul, and with all thy might.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "He reminds them of their fear in the presence of the Lord engages them, in chapter 6, to love God with all their heart, and exhorts them to remember His words in every way, and to keep them, when they should enjoy the land, having nothing to do with other gods. When they should have cast out their enemies, as Jehovah had spoken, and when their children should ask the meaning of the ordinances, they were to tell them of the deliverances and of the signs wrought in Egypt. God's sovereign grace; faithful obedience the channel of blessing They were to destroy every vestige of false gods, being a people holy to Jehovah.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "The word here does not mean sinful lust, the Spirit of God cannot have sinful lust ; we see here two tendencies, two powers, two worlds that have nohing in common, separated as completely as heaven from earth, — the flesh and the Spirit ; and we are responsible moral beings, having our responsibility through the work of- the Holy Spirit ; responsibility as to which of these two adversaries we will give movement and action in our interior and exterior life. ' I know a position in which no rising from impure feeling can take place in the heart, or take form even as a flash in a second of time.", "source": "The Spirit of Christ, 'The Spirit of Love'"}, {"name": "Watchman Nee", "short": "Nee", "comment": "He never expects repayment; He only gives.", "source": "The Gospel of God (2)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "There ought to be nothing neutral about any Christian.", "source": "The Holy Spirit as the Spirit of Anointing"}], "declarations": ["I declare: I love the LORD my God with all my heart, all my soul, and all my might.", "I declare: My whole heart belongs to God; there is no rival in my love."], "prayer": "Lord Jesus, teach me to love You with all my heart, soul, and might. Take the whole of me and let nothing divide my love. Amen.", "theme_flag": "theme-based: Nee, Sparks"}, {"day": 15, "ref": "Deuteronomy 18:15", "book": "Deuteronomy", "chapter": 18, "verse": 15, "text": "¶ The LORD thy God will raise up unto thee a Prophet from the midst of thee, of thy brethren, like unto me; unto him ye shall hearken;", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "The priests and the whole tribe of Levi have their portion assigned to them. The people are forbidden to do after those abominations, on account of which the nations which inhabited the land were driven out before Israel, inquiring of those who used divination. Jehovah would raise up a prophet like unto Moses, unto whom the people should hearken. These ordinances foresee in the people the lack of the faith needful in order to walk simply with the Lord. Christ is the true and only answer. They were not to fear a prophet who gave a sign which did not come to pass, for Jehovah had not spoken by him.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Before prayer, it is God's word that prepares me for it by revealing what the Father has bid me ask. In prayer, it is God's word strengthens me by giving my faith its warrant and its plea. And after prayer, it is God's word that brings me the answer when I have prayed, for in it the Spirit gives me to hear the Father's voice. Prayer is not monologue but dialogue; God's voice in response to mine in its most essential part. Listening to God's voice is the secret of the assurance that He will listen to mine. Incline thine ear, and hear;' Give ear to me;' Hearken to my voice;' are words which God speaks to man as well as man to God.", "source": "With Christ in the School of Prayer"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Christ is God's Word.", "source": "The Ministry of God's Word, 'Christ as God's Word'"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Take my yoke upon you, and learn of me. (Matt. 11:29)", "source": "The School of Christ"}], "declarations": ["I declare: God has raised up Christ, the Prophet like Moses, and I hearken to Him.", "I declare: I hear the voice of Jesus above every other voice."], "prayer": "Lord Jesus, true Prophet of God, speak to me today. Open my ears to hear Your words and my heart to obey them. Amen.", "theme_flag": "theme-based: Nee, Sparks"}, {"day": 16, "ref": "Deuteronomy 18:18", "book": "Deuteronomy", "chapter": 18, "verse": 18, "text": "I will raise them up a Prophet from among their brethren, like unto thee, and will put my words in his mouth; and he shall speak unto them all that I shall command him.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "The people are under responsibility to walk in obedience, with only God as their king and ruler. In immediate reference, the people are in enjoyment of the promised land under condition of obedience; but feasts, and such like ordinances, look forward to millennial times. At the end the distinction between possessing the land under condition of legal obedience, and by the grace which accomplishes its purpose in spite of failure is definitely brought out. {* After Genesis and the earlier chapters of Exodus, there is very little of which the object is historical in the previous books of Moses.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Say that you too have given yourself to finish the work the Father has given you to do, and to live alone for His glory. And ask then confidently that the Son may be glorified in you. This is praying in the Name, in the very words, in the Spirit of Jesus, in union with Jesus Himself. Such prayer has power. If with Jesus you glorify the Father, the Father will glorify Jesus by doing what you ask in His Name. It is only when your own personal relation on this point, like Christ's, is clear with God, when you are glorifying Him, and seeking all for His glory, that like Christ, you will have power to intercede for those around you.", "source": "With Christ in the School of Prayer"}, {"name": "Watchman Nee", "short": "Nee", "comment": "We serve men with Christ.", "source": "The Ministry of God's Word"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Thank God for the Holy Spirit!", "source": "The Holy Spirit as the Spirit of Anointing"}], "declarations": ["I declare: God has put His words in the mouth of Christ, and I receive them.", "I declare: Jesus speaks only what the Father commands, and His words are life to me."], "prayer": "Lord Jesus, in whom the Father has put His words, speak Your word into my life. Let Your words abide in me and shape all I say and do. Amen.", "theme_flag": "theme-based: Nee, Sparks"}, {"day": 17, "ref": "Deuteronomy 31:6", "book": "Deuteronomy", "chapter": 31, "verse": 6, "text": "Be strong and of a good courage, fear not, nor be afraid of them: for the LORD thy God, he it is that doth go with thee; he will not fail thee, nor forsake thee.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "The feast itself will suffice for the joy of all: \"Thou shalt rejoice in thy feast.\" The Lord recalls the great principle of the three feasts, namely, to appear before Jehovah three times in a year, bringing offerings to Jehovah. The pains taken and instruments used to preserve blessing and maintain relationship with God Verse 18 begins a new subject: the pains taken, and the instruments used, to preserve the blessing and execute the judgments necessary to that effect. The thought is still to maintain the people in relationship with God alone. They were to appoint judges and officers in their gates.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Oh, it is because the blessing is so great that our little hearts cannot rise to apprehend it; it is as if we cannot believe that Christ, the Almighty One, will in very deed teach and keep us all the day, And yet this is just what He has promised, for without this He cannot really give us rest, It is as our heart takes in this truth that, when He says, ‘Abide in me, ‘Learn of me, He really means it, and that it is His own work to keep us abiding when we yield ourselves to Him, that we shall venture to cast ourselves into the arms of His love, and abandon ourselves to His blessed keeping.", "source": "Abide in Christ, 'Every Moment'"}, {"name": "Watchman Nee", "short": "Nee", "comment": "God is forever the God who is.", "source": "Central Messages: Christ Is the Way, the Truth, and the Life"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "He is always the same, absolutely reliable, positive, definite, sure, for He is the God of the 'Amen'.", "source": "God of the Amen"}], "declarations": ["I declare: I am strong and of good courage, for the LORD my God goes with me.", "I declare: God will never fail me nor forsake me; I do not fear."], "prayer": "Lord Jesus, You have promised never to leave me nor forsake me. Make me strong and courageous today, for You go with me. Amen.", "theme_flag": "theme-based: Nee"}, {"day": 18, "ref": "Joshua 1:9", "book": "Joshua", "chapter": 1, "verse": 9, "text": "Have not I commanded thee? Be strong and of a good courage; be not afraid, neither be thou dismayed: for the LORD thy God is with thee whithersoever thou goest.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "With this full encouragement, he who walks by the Spirit is called upon to be strong and of a good courage. For Jehovah thy God is with thee whithersoever thou goest.", "source": "Darby's Synopsis, Joshua 1 (biblehub)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Be of good courage, only believe; fear not to take the irrevocable step, and to say that thou hast once for ever given up self to the death for which it has been crucified in Christ.", "source": "Abide in Christ, 'And not in Self' (ccel.org)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "He is seated on the throne, so we are carried through in His strength.", "source": "Sit, Walk, Stand, 'Walk'"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "He will not let you down.", "source": "God of the Amen (austin-sparks.net)"}], "declarations": ["I declare: I am strong and of good courage; I am not afraid, for the LORD my God is with me.", "I declare: Wherever I go, the presence of God goes with me."], "prayer": "Lord Jesus, You command me to be strong and courageous. Drive out my fear and fill me with the boldness of Your presence. Amen.", "theme_flag": "theme-based: Nee, Sparks"}, {"day": 19, "ref": "1 Samuel 16:7", "book": "1 Samuel", "chapter": 16, "verse": 7, "text": "But the LORD said unto Samuel, Look not on his countenance, or on the height of his stature; because I have refused him: for the Lord seeth not as man seeth; for man looketh on the outward appearance, but the LORD looketh on the heart.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "All glorying in the flesh and its birthright are here set aside; and the youngest, despised and forgotten of all, who kept the sheep, is chosen of God; for Jehovah seeth not as man seeth.", "source": "Darby's Synopsis, 1 Samuel 16 (biblehub)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Just as we judge of a man's physical character, his size and strength and age and habits, by his outward appearance, so the heart gives the real, inward man his character; and 'the hidden man of the heart' is what God looks to.", "source": "The Holiest of All (swartzentrover.com)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "You must never doubt God's feeling toward you simply because you have failed or sinned.", "source": "The Collected Works of Watchman Nee, Set 2 Vol.28: The Gospel of God (1), ch.2 'God's love, grace, and mercy' (bibleread.online)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "In eternity past we were chosen and elected together in Christ.", "source": "In Christ, 'Chapter 1 - The All-Inclusive In' (austin-sparks.net)"}], "declarations": ["I declare: God looks on my heart, not on my outward appearance, and He has chosen me.", "I declare: I do not judge by outward appearance; I see people as God sees them."], "prayer": "Lord Jesus, You look on the heart. Search my heart and make it clean before You. Teach me to value what You value. Amen.", "theme_flag": "theme-based: Nee, Sparks"}, {"day": 20, "ref": "2 Samuel 7:12", "book": "2 Samuel", "chapter": 7, "verse": 12, "text": "¶ And when thy days be fulfilled, and thou shalt sleep with thy fathers, I will set up thy seed after thee, which shall proceed out of thy bowels, and I will establish his kingdom.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "David was more than a type; he was truly the stock of that family from which Christ Himself should spring. This is taught in the beautiful seventh chapter. An elect vessel to maintain the cause of Jehovah's people in suffering, and to re-establish among them the glory of the Lord's name (vers. 8, 9), Jehovah had been with him; and David, most especially honoured in this, was also in his faithfulness a vessel of promise of the future peace and prosperity destined for Israel in the counsels of God. But these were yet future things.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "I have asked those who would join, to begin by giving at least ten minutes a day definitely to this work. It is in doing that we learn to do; it is as we take hold and begin that the help of God's Spirit will come. It is as we daily hear God's call, and at once put it into practice, that the consciousness will begin to live in us, I too am an intercessor; and that we shall feel the need of living in Christ and being full of the Spirit if we are to do this work aright. Nothing will so test and stimulate the Christian life as the honest attempt to be an intercessor.", "source": "The Ministry of Intercession, 'Stir up the gift of God which is in thee'"}, {"name": "Watchman Nee", "short": "Nee", "comment": "The Lord Jesus is that man, and that man is now enthroned! Hallelujah!", "source": "The Glorious Church"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "our presence in this world ought to register something positive for God.", "source": "The Holy Spirit as the Spirit of Anointing"}], "declarations": ["I declare: God has set up the Seed of David, Jesus Christ, and He reigns forever.", "I declare: I belong to the house that God is building; I am part of Christ's eternal kingdom."], "prayer": "Lord Jesus, Seed of David, establish Your kingdom in my life. Build Your house in me and let Your reign never end. Amen.", "theme_flag": "theme-based: Nee, Sparks"}, {"day": 21, "ref": "2 Samuel 7:13", "book": "2 Samuel", "chapter": 7, "verse": 13, "text": "He shall build an house for my name, and I will stablish the throne of his kingdom for ever.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "There was none beside Him, and none upon the earth therefore to be compared to His elect people, whom He went to redeem for a people to Himself, and whom He had now confirmed to Himself, that Israel might be His people for ever, and that He Himself might be their God. The highest kind of prayer is that which does not spring from a sense of need, but from the desires and the intelligence which the revelation of God's purposes produces — purposes which He will fulfil in love to His people and for the glory of Christ. Finally he asks that his house may be the place of God's own blessing.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Collectively and individually we are Christ's house : he that would know the faithfulness of Christ in His house, must yield himself to be His house, must allow Christ as Son over His house to be Master, to have the keys alone, to hold undisturbed possession and rule. Whose house we are. Later on we shall see how the great work of Christ, as the great High Priest over the house of God, is to open the way into the holiest of God's dwelling, His living, loving presence. The word we have here to-day tells us beforehand that the Holiest is not only with God, and that we must enter into it ; it is also with us, and God will come in to us too.", "source": "The Holiest of All"}, {"name": "Watchman Nee", "short": "Nee", "comment": "God gives us our position of rest.", "source": "Sit, Walk, Stand"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "God raised Him from the dead", "source": "The Spiritual Background of the Word of God"}], "declarations": ["I declare: Christ builds the house of God, and the throne of His kingdom is established forever.", "I declare: I am a living stone in the house that Christ is building."], "prayer": "Lord Jesus, Builder of God's house, build me into Your temple. Let Your throne be established in my heart forever. Amen.", "theme_flag": "theme-based: Nee, Sparks"}, {"day": 22, "ref": "2 Samuel 22:31", "book": "2 Samuel", "chapter": 22, "verse": 31, "text": "As for God, his way is perfect; the word of the LORD is tried: he is a buckler to all them that trust in him.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "But what a difference! He declares, it is true, what Christ will be when He reigns; and he does so in language of most attractive beauty, a beauty which ravishes the mind and transports it into the reign of Christ, that blessed \"world to come of which we speak.\" But then this sorrowful thought presents itself — \"my house is not so with God.\" The song of triumph and praise for what God had: the sufferings of Christ In the first of these two songs there is something more of profound interest. David speaks as a prophet; and, as he had done in so many other instances, he personifies the Lord Jesus, the Lord Jesus in connection with Israel.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "You read the Psalms, and you think of the wonderful thoughts in many of the expressions that David uses; as, for instance, when he speaks about God being our God, our Fortress, our Refuge, our strong Tower, our Strength and our Salvation. David had very wonderful views of how the everlasting God is Himself the hiding place of the believing soul, and of how He takes the believer and keeps him in the very hollow of His hand, in the secret of His pavilion, under the shadow of His wings, under His very feathers. And there David lived.", "source": "Absolute Surrender, 'Kept by the Power of God'"}, {"name": "Watchman Nee", "short": "Nee", "comment": "The word that the Lord speaks to us is spirit and life.", "source": "The Ministry of God's Word"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Jesus as Lord, to be that in human lives.", "source": "Men Whose Eyes Have Seen the King"}], "declarations": ["I declare: God's way is perfect, and He is my buckler; I trust in Him.", "I declare: The word of the LORD is tried, and I take refuge behind my Shield."], "prayer": "Lord Jesus, my Buckler, I trust in You. Your way is perfect; hide me behind Your shield today. Amen.", "theme_flag": "theme-based: Nee, Sparks"}, {"day": 23, "ref": "1 Chronicles 16:11", "book": "1 Chronicles", "chapter": 16, "verse": 11, "text": "Seek the LORD and his strength, seek his face continually.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "But all did not apprehend this intervention and these ways of God, so precious to those who understood them; and the condescending mercy of God stooped at Gibeon to the low estate of the people whom He loved, and He still spoke to them after His own heart there, at the altar where this people could draw near to God in an ignorance perhaps which saw no farther; but where, as far as this ignorance allowed, they were faithful to Him who had brought them out of Egypt: there God spoke to them, telling them that His mercy endured for ever. This was in fact a touching proof of it.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "The Lord graciously so ordered it that we were gradually led to the sin of prayerlessness, “as one of the deepest roots of the evil. No one could plead himself free from this. Nothing so reveals the defective spiritual life in minister and congregation as the lack of believing and unceasing prayer. Prayer is in very deed the pulse of the spiritual life. It is the great means of bringing to minister and people the blessing and power of heaven. Persevering and believing prayer means a strong and an abundant life.", "source": "The Prayer Life, 'Prayer in Harmony with the Being of God'"}, {"name": "Watchman Nee", "short": "Nee", "comment": "We need God's revelation before we can know the Lord.", "source": "The Ministry of God's Word"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "The God with whom we have to do is a living God!", "source": "The Living God"}], "declarations": ["I declare: I seek the LORD and His strength; I seek His face continually.", "I declare: My strength is renewed as I seek the face of God."], "prayer": "Lord Jesus, I seek Your face today. Let me find strength in Your presence and never cease seeking You. Amen.", "theme_flag": "theme-based: Darby, Nee, Sparks"}, {"day": 24, "ref": "1 Chronicles 16:34", "book": "1 Chronicles", "chapter": 16, "verse": 34, "text": "O give thanks unto the LORD; for he is good; for his mercy endureth for ever.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "We have then in these two parts the fulfilment, in Israel's joy before Jehovah, of the covenant made with the fathers, following after His mighty works; and the call addressed to the nations to come up to the place of His glory.* We have next this form of words, \"His mercy endures for ever,\" declaring that in spite of all the faults, all the sins, and all the unfaithfulness of Israel, Jehovah's mercy has stood firm. It will be when the Lamb, the true ark of the covenant and the real David, shall be upon Mount Zion, even before He assumes the character of Solomon, that this will be fully demonstrated.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "3. When you have given God His place of honour, glory, and power, take your place of deepest lowliness, and seek to be filled with the Spirit of humility. As a creature it is your blessedness to be nothing that God may be all in you. As a sinner you are not worthy to look up to God; bow in self-abasement. As a saint, let God's love overwhelm you, and bow you still lower down. Sink down before Him in humility, meekness, patience, and surrender to His goodness and mercy. He will exalt you. Oh! Take time, to get very low before God.", "source": "The Deeper Christian Life, 'Daily Fellowship with God'"}, {"name": "Watchman Nee", "short": "Nee", "comment": "God Himself is unchangeable.", "source": "Central Messages: Christ Is the Way, the Truth, and the Life"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "To know Him as the living God is life eternal.", "source": "The Living God"}], "declarations": ["I declare: The LORD is good, and His mercy endures forever over me.", "I declare: No failure of mine can outlast the mercy of God."], "prayer": "Lord Jesus, I thank You that Your mercy endures forever. When I fail, Your mercy meets me again and lifts me up. Amen.", "theme_flag": "theme-based: Nee, Sparks"}, {"day": 25, "ref": "2 Chronicles 7:14", "book": "2 Chronicles", "chapter": 7, "verse": 14, "text": "If my people, which are called by my name, shall humble themselves, and pray, and seek my face, and turn from their wicked ways; then will I hear from heaven, and will forgive their sin, and will heal their land.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "If there was chastening and the people humbled themselves, there was respite: the eyes and the heart of Jehovah should be there perpetually. Then, with respect to Solomon and the seed of David generally, on their faithfulness the blessing of the whole people was to depend. If the house of David should turn away from God, Israel should be rooted out of the land; and the house, which had been sanctified by the worship of Jehovah, should become a by-word among all nations, and a witness to the just judgment of God.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "The meek, who seek nothing in themselves, theirs the earth shall be. The blessings of heaven and earth are for the lowly. For the heavenly and the earthly life, humility is the secret of blessing. 2. _'Learn of Me; for I am meek and lowly of heart, and ye shall find rest for your souls.'_ Jesus offers Himself as Teacher. He tells what the spirit both is, which we shall find Him as Teacher, and which we can learn and receive from Him. Meekness and lowliness the one thing He offers us; in it we shall find perfect rest of soul. Humility is to be a salvation.", "source": "Humility: Humility in the Teaching of Jesus"}, {"name": "Watchman Nee", "short": "Nee", "comment": "The earth controls heaven.", "source": "The Prayer Ministry of the Church"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "But more than that, He is the rewarder of them that diligently seek.", "source": "The Living God"}], "declarations": ["I declare: I humble myself and pray and seek God's face; He hears me and heals my land.", "I declare: When I turn from my wicked ways, God forgives and restores."], "prayer": "Lord Jesus, I humble myself before You and seek Your face. Forgive my sins and heal my land, my home, and my heart. Amen.", "theme_flag": "theme-based: Nee"}, {"day": 26, "ref": "2 Chronicles 20:17", "book": "2 Chronicles", "chapter": 20, "verse": 17, "text": "Ye shall not need to fight in this battle: set yourselves, stand ye still, and see the salvation of the LORD with you, O Judah and Jerusalem: fear not, nor be dismayed; to morrow go out against them: for the LORD will be with you.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Nevertheless, when he had returned to his house, the king sets himself to bring back the people to the fear of Jehovah, and to cause judgment and righteousness to be executed in Israel. But war begins. He could no longer have the unmingled blessing of having to do with God alone without trial. The intervention of the enemy was now needful for his good, according to God's government, although in the trial through which he passes he may have full blessing. His piety was genuine; the trial proves it. He appeals to the relationship of God with Abraham and to His promises to Solomon, when the latter had built the house.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "I do not know if it will be possible for me to put into a few words what are the chief things we need to learn. In a note at the close of the book on Law I have mentioned some. But what I want to say here is this: The great lack of our religion is, we do not know God. The answer to every complaint of feebleness and failure, the message to every congregation or convention seeking instruction on holiness, ought to be simply, What is the matter: Have you not God? If you really believe in God, He will put all right. God is willing and able by PREFACE 13 His Holy Spirit.", "source": "Waiting on God: In Holy Expectancy"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Prayer is a work.", "source": "The Prayer Ministry of the Church"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "The real battle is in the realm of man's spiritual relationship with God.", "source": "The Battle for Life"}], "declarations": ["I declare: The battle is not mine but God's; I stand still and see His salvation.", "I declare: I do not fight in my own strength; the LORD fights for me."], "prayer": "Lord Jesus, the battle I face is Yours, not mine. Teach me to stand still in faith and watch You win the victory. Amen.", "theme_flag": "theme-based: Nee, Sparks"}, {"day": 27, "ref": "Nehemiah 8:10", "book": "Nehemiah", "chapter": 8, "verse": 10, "text": "Then he said unto them, Go your way, eat the fat, and drink the sweet, and send portions unto them for whom nothing is prepared: for this day is holy unto our Lord: neither be ye sorry; for the joy of the LORD is your strength.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "By means of Ezra and Nehemiah, the law resumes its authority, and that at the people's own request, for God had prepared their hearts. Accordingly, God had gathered them together on the first day of the seventh month. It was really the trumpet of God, although the people were unconscious of it, that gathered them to this new moon, which shone again in grace, whatever might be the clouds that veiled its feeble light. The people's hearts were touched by the testimony of the law, and they wept. But Nehemiah and Ezra bade them rejoice, for the day was holy. Doubtless these men of God were right.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "We all know what the power of joy is; we know there is nothing so attractive as joy, there is nothing can help a man to bear and endure so much as joy; we know that the Lord Jesus Himself for the joy that was set before Him endured the cross. One is not living aright if he is living a sighing, trembling, doubting life. Come to-day and believe the joy of the Holy Ghost is meant for you. Does not the Scripture say, \"Whom not having seen we love; in whom, though now ye see Him not, yet believing ye rejoice with joy unspeakable and full of glory.\"", "source": "The Master's Indwelling: Joy in the Holy Ghost"}, {"name": "Watchman Nee", "short": "Nee", "comment": "When the earth works, God works.", "source": "The Prayer Ministry of the Church"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "He is reigning.", "source": "Men Whose Eyes Have Seen the King"}], "declarations": ["I declare: The joy of the LORD is my strength today.", "I declare: I will not mourn; the holy joy of God fills my heart."], "prayer": "Lord Jesus, fill me with Your joy, for Your joy is my strength. Let gladness rise in me and strengthen me for the day. Amen.", "theme_flag": "theme-based: Nee, Sparks"}, {"day": 28, "ref": "Esther 4:14", "book": "Esther", "chapter": 4, "verse": 14, "text": "For if thou altogether holdest thy peace at this time, then shall there enlargement and deliverance arise to the Jews from another place; but thou and thy father’s house shall be destroyed: and who knoweth whether thou art come to the kingdom for such a time as this?", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "God does not shew Himself. But, behind the power and the mistakes of that throne to which the government of the world had fallen, God holds the reins by His providence; He watches over the accomplishment of His purposes and over everything necessary to their fulfilment; and He cares for His people, whatever may be their condition or the power of their enemies. Happy people! (compare, as to Israel, Jer. 31:20). God's government and sovereignty over the dispersed Jews It is to be noticed that faith in the protection of God, and an acknowledgment of it, are to be found even when the dealings of God, with respect to His promises, are not owned.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "As Man, as Mediator, He has access to the counsels of Deity, to the secrets of Providence, in your interest, and on your behalf. If you will but trust Him fully, and abide in Him entirely, you can be confident of having unerring guidance. Yes, abide in Jesus as your wisdom. Seek to maintain the spirit of waiting and dependence, that always seeks to learn, and will not move but as the heavenly light leads on. Withdraw yourself from all needless distraction, close your ears to the voices of the world, and be as a docile learner, ever listen- ing for the heavenly wisdom the Master has to teach.", "source": "Abide in Christ, 'As your Wisdom'"}, {"name": "Watchman Nee", "short": "Nee", "comment": "God wants to use man to deal with His enemy", "source": "The Glorious Church"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "God cannot ultimately be cheated of His purpose; He is the God of the 'Amen'.", "source": "God of the Amen"}], "declarations": ["I declare: God raises up deliverance in His time, and I am placed in His kingdom for such a time as this.", "I declare: I will not hold my peace when God calls me to act."], "prayer": "Lord Jesus, You have brought me to the kingdom for such a time as this. Give me courage to speak and act when You call. Amen.", "theme_flag": "theme-based: Nee"}, {"day": 29, "ref": "Esther 4:16", "book": "Esther", "chapter": 4, "verse": 16, "text": "Go, gather together all the Jews that are present in Shushan, and fast ye for me, and neither eat nor drink three days, night or day: I also and my maidens will fast likewise; and so will I go in unto the king, which is not according to the law: and if I perish, I perish.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "We see then in this history, the secret and providential care that God takes of the Jews, when, although maintaining their position, as Jews, they have entirely fallen from all outward relation to Him, are deprived of all the rights of God's people, and are stripped of the promises, in the fulfilment of which, as offered them by the mercy of God at that time in Jerusalem, they take no interest. Even in this condition God watches over and takes care of them — a people beloved and blessed in spite of all their unfaithfulness; for the gifts and calling of God are without repentance.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "God can only reveal His will in perplexities and special difficulties to a heart that has learned to obey and honor Him loyally in little things and in daily life. That brings me to the third thought--Note the disposition to which the Spirit reveals God's will. What do we read here? There were a number of men ministering to the Lord and fasting, and the Holy Spirit came and spoke to them. Some people understand this passage very much as they would in reference to a missionary committee of our day.", "source": "Absolute Surrender, 'Separated unto the Holy Ghost'"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Once a Christian is saved, there is no possibility for him to perish.", "source": "The Gospel of God (2)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "It will be a crucified church that lives and grows.", "source": "The Cross and the Way of Life"}], "declarations": ["I declare: I humble myself with fasting and prayer, and God hears.", "I declare: Like Esther, I go in to the King with boldness, for He holds out His sceptre to me."], "prayer": "Lord Jesus, my King, I come to You in prayer and fasting. Hear my cry and grant me favour before You. Amen.", "theme_flag": "theme-based: Nee, Sparks"}, {"day": 30, "ref": "Job 19:25", "book": "Job", "chapter": 19, "verse": 25, "text": "For I know that my redeemer liveth, and that he shall stand at the latter day upon the earth:", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Their argument is a false and cold estimate of the exact justice of His government as an adequate manifestation of His relationship with man, though they say many true commonplace things which even the Spirit of God adopts as just. Although Job was not before God in his estimate of himself, he judges rightly in these respects. He shews that although God shews His disapprobation of the wicked, yet the circumstances in which they are often found overthrow the arguments of his friends. We see in Job a heart which, although rebellious, depends upon God, and would rejoice to find Him.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "As it is the parent, so it is the servant of the branches, And Jesus, to whom we owe our life, how completely does He give Him self for us and to us: ‘The glory Thou gavest me, I have given them ;’ ‘He that believeth in me, the works that I do shall he do also; and greater works shall he do.’ All His fulness and all His riches are for thee, O believer; for the vine does not live for itself, keeps nothing for itself, but exists only for the branches. All that Jesus is in heaven, He is for us: He has no interest there separate from ours ; as our representative He stands before the Father, And all the branch possesses belongs to the vine.", "source": "Abide in Christ, 'As your Redemption'"}, {"name": "Watchman Nee", "short": "Nee", "comment": "God is the God of life, and He lives forever.", "source": "Central Messages: Christ Is the Way, the Truth, and the Life"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Because He lives we live.", "source": "The Spiritual Background of the Word of God"}], "declarations": ["I declare: I know that my Redeemer lives, and He shall stand at the latter day upon the earth.", "I declare: My Redeemer is alive today, and He pleads my cause."], "prayer": "Lord Jesus, my living Redeemer, I know You live. Stand for me today and let me feel the power of Your living presence. Amen.", "theme_flag": "theme-based: Darby, Nee"}, {"day": 31, "ref": "Job 19:26", "book": "Job", "chapter": 19, "verse": 26, "text": "And though after my skin worms destroy this body, yet in my flesh shall I see God:", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "But the knowledge of eternal redemption is christian knowledge, or that of the Jews when they look on Him whom they pierced. Till Christ's death, the veil was unrent, the holiest unapproachable. There was knowledge more or less clear of a Redeemer — of a personal Redeemer to come; of God's favour towards those that walked with Him, and the confidence of faith in Him and in His promises. But there was no such knowledge of sin as led, God being revealed, to the consciousness of exclusion from His presence as a present state, nor of such a putting of it away as reconciled us fully and for ever to God by its efficacy, and brought us to Him.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "It becomes to him the servant that removes the last rags of the old carnal vesture, ere he be clothed upon with the new body of glory. It carries the body to the grave, to lie there as the seed whence the new body will arise the worthy companion of the glorified spirit. The resurrection of the body is no longer a barren doctrine, but a living expectation, and even an Incipient experience, because the Spirit of Him that raised Jesus from the dead, dwells in the body as the pledge that even our mortal bodies shall be quickened (Rom. viii. 11-23).", "source": "Abide in Christ, 'As your Redemption'"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Without holiness no one can see the Lord (Heb.12.14).", "source": "The Spiritual Man (2)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Job is brought to great straits, but the life link is never broken, and the end is life triumphant.", "source": "The Battle for Life"}], "declarations": ["I declare: In my flesh I shall see God; my eyes shall behold Him.", "I declare: Death is not the end for me; I shall see my Redeemer face to face."], "prayer": "Lord Jesus, I long to see You. Keep my hope fixed on the day I shall behold You face to face. Amen.", "theme_flag": "theme-based: Darby, Nee, Sparks"}, {"day": 32, "ref": "Job 23:10", "book": "Job", "chapter": 23, "verse": 10, "text": "But he knoweth the way that I take: when he hath tried me, I shall come forth as gold.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "But the knowledge of eternal redemption is christian knowledge, or that of the Jews when they look on Him whom they pierced. Till Christ's death, the veil was unrent, the holiest unapproachable. There was knowledge more or less clear of a Redeemer — of a personal Redeemer to come; of God's favour towards those that walked with Him, and the confidence of faith in Him and in His promises. But there was no such knowledge of sin as led, God being revealed, to the consciousness of exclusion from His presence as a present state, nor of such a putting of it away as reconciled us fully and for ever to God by its efficacy, and brought us to Him.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "O abide in Christ: the power of the flesh will be mortified, the impatience and self-will of the old nature be humbled, to make place for the meekness and gentleness of Christ. A believer may pass through much affliction, and IN AFFLICTION AND TRIAL, 137 yet secure but little blessing from it all. Abiding in Christ is the secret of securing all that the Father meant the chastisement to bring us, Abide in Christ: in Him thou shalt find sure and abundant consolation. With the afflicted, comfort ig often first, and the profit of the affliction second.", "source": "Abide in Christ, 'In Affliction and Trial'"}, {"name": "Watchman Nee", "short": "Nee", "comment": "When mercy extends itself, we are saved.", "source": "The Gospel of God (1)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Christ lives, all is possible.", "source": "The Spiritual Background of the Word of God"}], "declarations": ["I declare: God knows the way I take; when He has tried me, I shall come forth as gold.", "I declare: My trials are refining me, and I will shine brighter through them."], "prayer": "Lord Jesus, You know the way I take. Refine me in the fire of trial until I come forth as gold. Amen.", "theme_flag": "theme-based: Darby, Nee, Sparks"}, {"day": 33, "ref": "Psalms 2:7", "book": "Psalms", "chapter": 2, "verse": 7, "text": "I will declare the decree: the LORD hath said unto me, Thou art my Son; this day have I begotten thee.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "This King, who is He? Jehovah has said to Him, 'Thou art my Son: this day have I begotten thee.' Thus we have Christ born into the earth, owned Son of God by Jehovah.", "source": "Darby's Synopsis, Psalm 2 (biblehub)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "The Father hath given the Son to have life in Himself. Christ received it as His own life, just as God has His life in Himself.", "source": "The Master's Indwelling, ch.6: Christ Our Life"}, {"name": "Watchman Nee", "short": "Nee", "comment": "God loves His only begotten Son.", "source": "The Collected Works of Watchman Nee, Set 2 Vol.28: The Gospel of God (1), ch.2 'God's love, grace, and mercy' (bibleread.online)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "The Son of man who is in heaven (John 3:13).", "source": "In Christ, 'Some Significant Prepositions' (austin-sparks.net)"}], "declarations": ["I declare: Jesus Christ is the Son of God, begotten of the Father.", "I declare: Because He is the Son, I am a son of God through faith in Him."], "prayer": "Lord Jesus, Son of God, I worship You. Thank You for making me a child of God through Your Sonship. Amen.", "theme_flag": "theme-based: Nee, Sparks"}, {"day": 34, "ref": "Psalms 2:12", "book": "Psalms", "chapter": 2, "verse": 12, "text": "Kiss the Son, lest he be angry, and ye perish from the way, when his wrath is kindled but a little. Blessed are all they that put their trust in him.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "The psalm invites the kings and judges to submission and humbly owning the Son, lest they perish if His wrath be kindled but a little. He is Himself to be trusted; and who can claim this but Jehovah?", "source": "Darby's Synopsis, Psalm 2 (biblehub)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "I must have Christ within as the power to trust. Such confidence have we toward God, through Christ: through Christ living in and enabling us to trust God as He trusted Him.", "source": "The Master's Indwelling, ch.6: Christ Our Life"}, {"name": "Watchman Nee", "short": "Nee", "comment": "God is well able to deal with our sins.", "source": "The Normal Christian Life, 'Overcoming the Accuser'"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "We can count on Him.", "source": "God of the Amen (austin-sparks.net)"}], "declarations": ["I declare: I kiss the Son; I bow to Jesus Christ as Lord.", "I declare: Blessed am I, for I put my trust in Him."], "prayer": "Lord Jesus, I kiss the Son and put my trust in You. Keep me from perishing and bless me as I trust in You. Amen.", "theme_flag": "theme-based: Nee"}, {"day": 35, "ref": "Psalms 8:4", "book": "Psalms", "chapter": 8, "verse": 4, "text": "What is man, that thou art mindful of him? and the son of man, that thou visitest him?", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Creation makes man so little in himself. What is he when we consider this vast and shining universe? But glance at Christ, and you see all its glories grow dim before the excellency of Him under whose feet all is put.", "source": "Darby's Synopsis, Psalm 8 (biblehub)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "The Psalm does not speak directly of the Messiah, but of man and his destiny. But it is applied most justly to the Messiah, because in Him the Psalm and man find the fulfilment of what is promised.", "source": "The Holiest of All (swartzentrover.com)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "How God values man! Even He Himself became a man!", "source": "The Glorious Church, ch.1 'God's purpose in creating man' (bibleread.online)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "God's intention to have a Man and His kind in dominion, reigning in glory.", "source": "Men Whose Eyes Have Seen the King, ch.8 (austin-sparks.net)"}], "declarations": ["I declare: Though I am small, God is mindful of me and visits me.", "I declare: In Christ, man finds his true worth and destiny."], "prayer": "Lord Jesus, what am I that You are mindful of me? Thank You for visiting me and crowning my life with Your care. Amen.", "theme_flag": "theme-based: Nee"}, {"day": 36, "ref": "Psalms 8:6", "book": "Psalms", "chapter": 8, "verse": 6, "text": "Thou madest him to have dominion over the works of thy hands; thou hast put all things under his feet:", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "He is set over all the works of His hand; none are excepted. He only is excepted who put all things under Him.", "source": "Darby's Synopsis, Psalm 8 (biblehub)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "The Divine promise given to faith is: 'Sin shall not have dominion over you.'", "source": "Abide in Christ, 'That you may not sin' (ccel.org)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Will He gain a vessel in us?", "source": "The God of Abraham, Isaac, and Jacob, ch.7 (bibleread.online)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "He is Lord of all", "source": "Men Whose Eyes Have Seen the King, ch.8 (austin-sparks.net)"}], "declarations": ["I declare: In Christ, man is restored to dominion over the works of God's hands.", "I declare: All things are put under the feet of Jesus, and I reign with Him."], "prayer": "Lord Jesus, to whom all things are subjected, teach me to rule my life under Your lordship. Amen.", "theme_flag": "theme-based: Nee"}, {"day": 37, "ref": "Psalms 16:10", "book": "Psalms", "chapter": 16, "verse": 10, "text": "For thou wilt not leave my soul in hell; neither wilt thou suffer thine Holy One to see corruption.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Jehovah, whom He trusted, would not leave His soul in Hades, nor suffer His Holy One to see corruption. Jehovah would show Him the path of life through, but beyond, death.", "source": "Darby's Synopsis, Psalm 16 (biblehub)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Hear what the New Testament speaks of it: 'That like as Christ was raised from the dead by the glory of the Father, so we also should walk in newness of life.' It is the Risen One who says to us, Rise and walk: He gives the power of the resurrection life.", "source": "The Ministry of Intercession, 'Wilt Thou be made Whole?' (ccel.org)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Resurrection is God's new starting point.", "source": "The Normal Christian Life, 'Two Creations'"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "He, risen, is our life, even in the midst of death.", "source": "Spiritual Death and His Risen Life (austin-sparks.net)"}], "declarations": ["I declare: God did not leave Christ's soul in hell, and He will not leave mine.", "I declare: Jesus rose without seeing corruption, and His resurrection is my hope."], "prayer": "Lord Jesus, risen Holy One, I thank You that death could not hold You. Raise my hope and keep me in the power of Your resurrection. Amen.", "theme_flag": "theme-based: Nee"}, {"day": 38, "ref": "Psalms 22:1", "book": "Psalms", "chapter": 22, "verse": 1, "text": "To the chief Musician upon Aijeleth Shahar, A Psalm of David. My God, my God, why hast thou forsaken me? why art thou so far from helping me, and from the words of my roaring?", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Here the sufferings of Christ have another and deeper character. Here was a suffering out of the reach of promise: the Righteous One forsaken of God.", "source": "Darby's Synopsis, Psalm 22 (biblehub)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "In the temptation in the wilderness, and on every opportunity that presented itself, till he cried out on the cross in death, 'My God, my God, why hast thou forsaken me?' (Matt. 27:46).", "source": "The Prayer Life, ch.11 (swartzentrover.com)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "The love of God is manifested in the death of Christ.", "source": "The Collected Works of Watchman Nee, Set 2 Vol.28: The Gospel of God (1), ch.2 'God's love, grace, and mercy' (bibleread.online)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "It is the hub of the wheel.", "source": "The Centrality and Universality of the Cross, ch.1 (austin-sparks.net)"}], "declarations": ["I declare: Christ was forsaken for me, so I will never be forsaken.", "I declare: In my darkest hour, God hears me, for Jesus cried in my place."], "prayer": "Lord Jesus, You were forsaken on the cross for me. When I feel forsaken, remind me that You will never leave me. Amen.", "theme_flag": "theme-based: Nee, Sparks"}, {"day": 39, "ref": "Psalms 22:16", "book": "Psalms", "chapter": 22, "verse": 16, "text": "For dogs have compassed me: the assembly of the wicked have inclosed me: they pierced my hands and my feet.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Christ had suffered from man, from men alike heartless and violent: dogs had compassed Him, fat bulls of Bashan closed Him in.", "source": "Darby's Synopsis, Psalm 22 (biblehub)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Gaze, gaze on the Divine form, the eternal glory, the heavenly beauty, the tenderly pleading gentleness of the crucified love, as it stretches out its pierced hands and says, 'Oh, wilt thou not abide with me?'", "source": "Abide in Christ, 'And in His Love' (ccel.org)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "'With Christ' - crucified, quickened, raised, set in the heavenlies.", "source": "Sit, Walk, Stand, 'The Range of His Finished Work'"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "You are not forgotten.", "source": "The Living God (austin-sparks.net)"}], "declarations": ["I declare: His hands and feet were pierced for my transgressions.", "I declare: By His wounds I am healed; the pierced Christ is my Saviour."], "prayer": "Lord Jesus, pierced for me, I thank You for Your wounds. Let the power of Your pierced hands and feet heal and save me today. Amen.", "theme_flag": "theme-based: Nee, Sparks"}, {"day": 40, "ref": "Psalms 22:18", "book": "Psalms", "chapter": 22, "verse": 18, "text": "They part my garments among them, and cast lots upon my vesture.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "A stream of grace flows out for the remnant, then for Israel, for the world, for the generation to come, all from the sure and divinely perfect work of atonement in the death of Christ.", "source": "Darby's Synopsis, Psalm 22 (biblehub)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "He seeks ever to wear this robe of righteousness in the ever renewed faith in this glorious gift of righteousness which has been bestowed upon him.", "source": "Abide in Christ, 'As your Righteousness' (ccel.org)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Who can fathom the physical sufferings of the Lord Jesus on the cross?", "source": "The Spiritual Man, 'Calvary's Judgment'"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "You never get outside the range of the Cross.", "source": "The Centrality and Universality of the Cross, ch.1 (austin-sparks.net)"}], "declarations": ["I declare: They parted His garments, but they could not part me from His love.", "I declare: Christ was stripped for me, that I might be clothed in His righteousness."], "prayer": "Lord Jesus, who was stripped and shamed for me, clothe me in Your righteousness. Let me never forget the price You paid. Amen.", "theme_flag": "theme-based: Darby, Nee, Sparks"}, {"day": 41, "ref": "Psalms 23:1", "book": "Psalms", "chapter": 23, "verse": 1, "text": "A Psalm of David. The LORD is my shepherd; I shall not want.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "The comfort of Psalm 23 is not in what Jehovah gives, but in Himself. For us Christ is the Shepherd.", "source": "Darby's Synopsis, Psalm 23 (biblehub)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Our daily life, our conversation, our very countenance, must testify that we have found life abundantly in our Good Shepherd.", "source": "The Spirit of Christ, Note O (ccel.org)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "once we have been saved before God, we are eternally saved.", "source": "The Collected Works of Watchman Nee, Set 2 Vol.29: The Gospel of God (2), ch.1 (bibleread.online)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "What a great Shepherd He is, to exercise so great power for us!", "source": "Written Not With Ink, ch.9 'The Good Shepherd' (austin-sparks.net)"}], "declarations": ["I declare: The LORD is my Shepherd; I shall not want.", "I declare: My Shepherd provides all I need; I lack nothing."], "prayer": "Lord Jesus, my Shepherd, lead me and feed me today. I shall not want, for You care for me. Amen.", "theme_flag": "theme-based: Nee"}, {"day": 42, "ref": "Psalms 23:4", "book": "Psalms", "chapter": 23, "verse": 4, "text": "Yea, though I walk through the valley of the shadow of death, I will fear no evil: for thou art with me; thy rod and thy staff they comfort me.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Not only sorrow and evil had come in with sin, but death too. Then He comes and leads me through it and comforts me.", "source": "Darby's Synopsis, Psalm 23 (biblehub)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "He will make the valley of Achor, of trouble and shame, of sin confessed and cast out, a door of hope.", "source": "The Ministry of Intercession, 'Restraining Prayer: is it Sin?' (ccel.org)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "He is the God who now is.", "source": "The Collected Works of Watchman Nee, Set 2 Vol.36: Central Messages, ch.9 'Christ is the I am' (bibleread.online)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Because I live, ye shall live also.", "source": "Written Not With Ink, ch.9 'The Good Shepherd' (austin-sparks.net)"}], "declarations": ["I declare: Though I walk through the valley of the shadow of death, I fear no evil, for He is with me.", "I declare: His rod and His staff comfort me in every dark place."], "prayer": "Lord Jesus, walk with me through every valley. When shadows fall, let me feel Your rod and staff comforting me. Amen.", "theme_flag": "theme-based: Nee, Sparks"}, {"day": 43, "ref": "Psalms 27:1", "book": "Psalms", "chapter": 27, "verse": 1, "text": "A Psalm of David. The LORD is my light and my salvation; whom shall I fear? the LORD is the strength of my life; of whom shall
