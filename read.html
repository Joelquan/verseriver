rby", "comment": "Thus, where the Spirit was, there was liberty; they were no longer under the yoke of the law, of the fear of death, and of condemnation. They were in Christ before God, in peace before Him, according to perfect love and that favour which is better than life, even as it shone upon Christ, without a veil, according to the grace which reigns by righteousness. When it is said, “Now the Lord is that spirit,” allusion is made to verse 6: 7-16 is a parenthesis. Christ glorified is the true thought of the Spirit which God had previously hidden under figures.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "The reason is, that there is a secret root of evil which must be removed. That root is the spirit of bondage, the legal spirit of self-effort, which hinders that humble faith that knows that God will work all, and yields to Him to do it. That spirit may be found amidst very great zeal for God's service, and very earnest prayer for His grace; it does not enjoy the rest of faith, and cannot overcome sin, because it does not stand in the liberty with which Christ has made us free, and does not know that where the Spirit of the Lord is, there is liberty.", "source": "The Two Covenants \"The Two Covenants in Christian Experience\""}, {"name": "Watchman Nee", "short": "Nee", "comment": "The Holy Spirit dwells within man to be his life, and He rests upon man to be his power.", "source": "pg 53"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "This being occupied with Christ results, firstly, in the Holy Spirit setting us free. Be occupied with Him, set your mind on Him, dwell in Him, rest in Him, abide in Him, and the Spirit will make you free.", "source": "Spiritual Ministry"}], "declarations": ["I declare: where the Spirit of the Lord is, there is liberty, and He is in me.", "I declare: I am free from every yoke, walking in the liberty of the Spirit."], "prayer": "Lord Jesus, thank You for the liberty Your Spirit brings. I refuse every bondage and walk free in You. Amen.", "theme_flag": "theme-based: Nee"}, {"day": 241, "ref": "2 Corinthians 4:18", "book": "2 Corinthians", "chapter": 4, "verse": 18, "text": "While we look not at the things which are seen, but at the things which are not seen: for the things which are seen are temporal; but the things which are not seen are eternal.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "And therefore it was that he did not allow himself to be discouraged; but on the contrary, if the outward man perished, the inward man was renewed day by day. For the light affliction, which was but for a moment (for such he esteemed it in view of the glory—it was but the temporary affliction of this poor dying body), worked out for him an eternal weight of glory which was beyond all the most exalted expression of human thought or language. And this renewing took place; and he was not disheartened come what might, in that he looked not at the things that are seen, which are temporal, but at the things that are not seen, which are eternal.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "It is a terrible and a very serious thought that one can maintain to all appearance a Christian life and think that one is trusting in Christ, while yet one is living with the world for self and the visible. (Matt. 6:32,33) For this reason the command comes to all Christians with great emphasis: Be conformed, not to this world, but to Jesus. And how can I, for this end, come to be not conformed to the world? Read our text over again with consideration: we read there two things. Observe what goes before. It is those that have presented their bodies to God as a sacrifice on the altar that have it said to them: Be not conformed to the world.", "source": "The New Life \"Conformity to the World\""}, {"name": "Watchman Nee", "short": "Nee", "comment": "Now we are considering here the things which, though they are not seen, are eternal and therefore real. Of course we cannot substantiate Divine things with any of our natural senses; but there is one faculty which can substantiate the 'things hoped for', the things of Christ, and that is faith.", "source": "The Normal Christian Life"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "It is the eternal which is in view, and this calls for adjustment in many respects of our affairs, so that our lives can be directed towards the permanent glory of God's purpose for us. We shall always be saved by the upward look.", "source": "\"Where Are You Looking?\""}], "declarations": ["I declare: I look not at the seen and temporal, but at the unseen and eternal.", "I declare: my eyes are fixed on eternal things."], "prayer": "Lord Jesus, lift my eyes above what is seen. Teach me to live for the eternal. Amen.", "theme_flag": "theme-based: Murray, theme-based: Nee"}, {"day": 242, "ref": "2 Corinthians 5:7", "book": "2 Corinthians", "chapter": 5, "verse": 7, "text": "(For we walk by faith, not by sight:)", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "If our bodies are not yet transformed; and if that which is mortal is not yet swallowed up, we are equally full of confidence, because, being formed for glory, and Christ (who has manifested the victorious power that opened the path of heaven to Him) being our life, if we should leave this tabernacle and be absent from the body before we are clothed upon with the glory, this life remains untouched; it has already in Jesus triumphed over all these effects of the power of death. We should be present with the Lord; for we walk by faith, not by the sight of these excellent things.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Betwixt the life of feeling and the life of faith the Christian has to choose every day. Happy is he who, once for all, has made the firm choice, and every morning renews the choice, not to seek or listen for feeling, but only to walk by faith, according to the will of God. The faith that keeps itself occupied with the word, with what God has said, and, through the word, with God Himself and Jesus His Son, shall taste the blessedness of a life in God above. Feeling seeks and aims at itself; faith honours God, and shall be honoured by Him.", "source": "The New Life \"The Life of Feeling\" ."}, {"name": "Watchman Nee", "short": "Nee", "comment": "Are you going to believe the tangible facts of the natural realm which are clearly before your eyes, or the intangible facts of the spiritual realm which are neither seen nor scientifically proved?", "source": "NCL"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "We 'walk in the spirit,' but 'we walk by faith.' To walk by faith there must, in the very nature of the case, be a stripping off of all that the outer man of the senses clings to, demands, craves for, as a security and an assurance.", "source": "The Inner Man of the Heart"}], "declarations": ["I declare: I walk by faith and not by sight.", "I declare: my faith is fixed on what Jesus is, not on what I feel."], "prayer": "Lord Jesus, I choose to walk by faith today. Keep my eyes on You, not on my feelings or circumstances. Amen.", "theme_flag": "theme-based: Nee"}, {"day": 243, "ref": "2 Corinthians 5:17", "book": "2 Corinthians", "chapter": 5, "verse": 17, "text": "Therefore if any man be in Christ, he is a new creature: old things are passed away; behold, all things are become new.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Christ, so far as in connection with this world below, is dead. He might have been known as the Messiah, living on the earth, and in connection with promises made to men living on the earth in the flesh. The apostle no longer knew Him thus. In fact Christ, as bearing that character, was dead; and now, being risen, He has taken a new and a heavenly character. Therefore if any one is in Christ, he belongs to this new creation, he is of the new creation. He belongs no more at all to the former; the old things have passed away; all things are become new.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "It is an impossibility. Nothing less is necessary than that we should experience that he who “is in Christ Jesus is a new creature: old things have passed away; behold, all things are become new.” This is literally true for the man who understands and experiences what it is to be in Jesus Christ. Our whole relationship to the Lord Jesus must be a new thing. I must believe in His infinite love, which really longs to have communion with me every moment, and to keep me in the enjoy- ment of His fellowship. I must believe in His — Divine power, which has conquered sin, and will truly keep me from it.", "source": "The Prayer Life \"How To Be Delivered from Prayerlessness\""}, {"name": "Watchman Nee", "short": "Nee", "comment": "Whenever the new creation is mentioned, it reminds us not to think of the old things but only of Christ.", "source": "Questions on the Gospel"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "So the Word says here quite clearly that there is a hopelessness about the old, and all the hope lies in the direction of renewal and freshness on the one hand, and of God's living, new deposit on the other hand.", "source": "The Essential Newness of the New Creation"}], "declarations": ["I declare: I am in Christ, a new creature; old things are passed away.", "I declare: behold, all things are become new in my life."], "prayer": "Lord Jesus, thank You for making me new. I leave the old behind and walk in Your newness of life. Amen.", "theme_flag": "theme-based: Nee"}, {"day": 244, "ref": "2 Corinthians 5:21", "book": "2 Corinthians", "chapter": 5, "verse": 21, "text": "For he hath made him to be sin for us, who knew no sin; that we might be made the righteousness of God in him.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "As the result of this third consequence of the incarnation, the apostle assumes the chai-acter of ambassador for Christ; as though God exhorted by his means, he besought men, in the name of Christ, to be reconciled to God. But such an embassy supposed the absence of Christ; His ambassador acted in His stead. It was in fact based upon another truth of immeasurable importance, namely, that God had made Him who knew no sin to be sin for us, in order that we should be made the righteousness of God in Him. This was the true way to reconcile us, and that entirely, to God, according to the perfection of God fully revealed.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "As he looks at the Cross, and Christ suffering there, the Righteous One for the unrighteous, he sees in that atoning death the only but sufficient founda- tion for his faith in God’s pardoning mercy. The substitution, and the curse-bearing, and the atone- ment of Christ dying in the stead of sinners, are what give him peace. And as he understands how the righteousness which Christ brings becomes his very own, and how, in the strength of that, he is counted righteous before God, he feels that he has what he needs to restore him to God’s favour: ‘ Being justified by faith, we have peace with God.’", "source": "Abide in Christ \"As Your Righteousness\""}, {"name": "Watchman Nee", "short": "Nee", "comment": "You realized that the Lord Jesus died as your Substitute and bore your sins upon Himself, and that His Blood was shed to cleanse away your defilement.", "source": "NCL"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "There is brought into us that transparent, pure, holy, righteous life of the Lord Jesus. It's given!", "source": "The Octave of Redemption (Transcript)"}], "declarations": ["I declare: I am made the righteousness of God in Christ.", "I declare: He who knew no sin was made sin for me, and I am righteous in Him."], "prayer": "Lord Jesus, thank You for taking my sin and giving me Your righteousness. I stand before God accepted in You. Amen.", "theme_flag": null}, {"day": 245, "ref": "2 Corinthians 9:15", "book": "2 Corinthians", "chapter": 9, "verse": 15, "text": "Thanks be unto God for his unspeakable gift.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Thanks be to God, says the apostle, for His unspeakable gift; for whatsoever may be the fruits of grace, we have the proof and the power in that which God has given. Here ends the matter of the epistle properly so called. The apostle returns to the subject which pre-occupied him—his connections with the Corinthians, and the truth of his apostleship, which was questioned by those who seduced them, throwing contempt on his person. He was weak, they said, when present, and liis speech contemptible, though bold when absent (his letters being boastful, but his bodily presence contemptible).", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Whether your need be forgiveness or consolation or confirmation, whether you have fallen, or are tempted to fall, into danger, whether you know not what the will of God is in one or another matter, or know that you have not the courage and the strength to do this will, let this always be your first thought, the Father has given me Jesus to care for me. For this purpose, reckon upon this gift of God every day as yours. It has been presented to you in the word. Appropriate the Son in faith on the word. Take Him anew every day. Through faith you have the Son. (John 1:12; 1 John 5:9,13) The love of God has given the Son.", "source": "The New Life \"God's Gift of His Son\" (epigraph 2 Cor 9:15)."}, {"name": "Watchman Nee", "short": "Nee", "comment": "God is in the wholesale business; He is not in the retail business. He only gives us Christ.", "source": "pg 53"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "'God so loved that He gave.' Here is the Gift, the Sent One of God.", "source": "The Cross and the Eternal Glory of God"}], "declarations": ["I declare: thanks be to God for His unspeakable gift, Jesus Christ.", "I declare: I have received the greatest gift, the Son of God Himself."], "prayer": "Lord Jesus, You are God's unspeakable gift to me. Thank You for giving Yourself wholly to me. Amen.", "theme_flag": "theme-based: Nee, theme-based: Sparks"}, {"day": 246, "ref": "2 Corinthians 12:9", "book": "2 Corinthians", "chapter": 12, "verse": 9, "text": "And he said unto me, My grace is sufficient for thee: for my strength is made perfect in weakness. Most gladly therefore will I rather glory in my infirmities, that the power of Christ may rest upon me.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "The power of the Holy Ghost alone was displayed in Him. Paul needed to have the flesh reduced to weakness, in order that there might not be in it the motion of sin which was natural to it. When the flesh was reduced to its true nothingness as far as good is concerned, and in a manifest way, then Christ could display His strength in it. That strength had its true character. Remark it well: that is always its character—strength made perfect in infirmity. The blessed apostle could glory in a man in Christ above, enjoying all this beatitude, these marvellous things which shut out self, so much were they above all we are.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Let us choose to be weak, to be low, to be nothing. Let humility be to us joy and gladness. Let us gladly glory and take pleasure in weakness, in all that can humble us and keep us low; the power of Christ will rest upon us. Christ humbled Himself, therefore God exalted Him. Christ will humble us, and keep us humble; let us heartily consent, let us trustfully and joyfully accept all that humbles; the power of Christ will rest upon us. We shall find that the deepest humility is the secret of the truest happiness, of a joy that nothing can destroy.", "source": "Humility \"Humility and Happiness\""}, {"name": "Watchman Nee", "short": "Nee", "comment": "Having at last reached the point of utter despair in ourselves so that we cease even to try, we put our trust in the Lord to manifest His resurrection life in us.", "source": "NCL"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "'When I am weak, then am I strong.' The power of Christ's resurrection was overcoming his weakness.", "source": "The On-High Calling - Volume 2"}], "declarations": ["I declare: His grace is sufficient for me.", "I declare: His strength is made perfect in my weakness."], "prayer": "Lord Jesus, Your grace is enough for me. I glory in my weakness so Your power may rest on me. Amen.", "theme_flag": "theme-based: Nee"}, {"day": 247, "ref": "Galatians 2:20", "book": "Galatians", "chapter": 2, "verse": 20, "text": "I am crucified with Christ: nevertheless I live; yet not I, but Christ liveth in me: and the life which I now live in the flesh I live by the faith of the Son of God, who loved me, and gave himself for me.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Christ had been crucified—He who could suffer the curse of the law of God, and death, and yet live in the mighty and holy life which nothing could take away; which made it impossible for death to hold Him, although in grace He tasted it. But the apostle (whom this same grace had reached) owning it according to the truth as a poor sinner in subjection to death, and blessing the God who granted him the grace of life and of free acceptance in Christ, had been associated with Christ in God’s counsels in His death (now realised by faith, and become true practically by Christ, who had died and risen again, being his life).", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "To seek life, not in itself, but in God, is the highest honour of the creature. To live in and to himself is the folly and guilt of sinful man; to live to God in Christ, the blessedness of the believer, To deny, to hate, to forsake, to lose his own life, such is the secret of the life of faith. ‘I live, yet nor I, but Christ liveth in me;’ ‘Nor I, but the grace of God which is with me:’ this ig the testimony of each one who has found out what it is to give up his own life, and to receive instead the blessed life of Christ within us. There is no path to true life, to abiding in Christ, than that which our Lord went before us—through death.", "source": "Abide in Christ \"The Crucified One\" (epigraph Gal 2:20)."}, {"name": "Watchman Nee", "short": "Nee", "comment": "God has put us all in Christ, so that when Christ was crucified we were crucified also.", "source": "NCL"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "The beginning of the Christian life is: Christ liveth in me! It is no longer I, but Christ living in me.", "source": "The Galatians and the Witch's Spell"}], "declarations": ["I declare: I am crucified with Christ; nevertheless I live.", "I declare: it is not I who live, but Christ who lives in me."], "prayer": "Lord Jesus, thank You for living Your life in me. I live today by faith in You who loved me and gave Yourself for me. Amen.", "theme_flag": null}, {"day": 248, "ref": "Galatians 3:28", "book": "Galatians", "chapter": 3, "verse": 28, "text": "There is neither Jew nor Greek, there is neither bond nor free, there is neither male nor female: for ye are all one in Christ Jesus.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "He is a son, because all who have been baptised to have part in the privileges that are in Christ have put on Christ. They are not before God as Jews or Gentiles, bond or free, male or female; they are before God according to their position in Christ, all one thing in Him, Christ being for all the common and only measure of their relationship with God. Bat this Christ was, as we have seen, the one Seed of Abraham: and if the Gentiles were in Christ, they entered consequently into this privileged position; they were, in Christ, the seed of Abraham, and heirs according to the promise made to that seed.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "The disciple of Jesus, who has first in his own circle proved the power of prayer, cannot confine himself within its limits: he prays for the Church universal and its different branches. He prays specially for the unity of the Spirit and of love. He prays for its being one in Christ, as a witness to the world that Christ, who hath wrought such a wonder as to make love triumph over selfishness and separation, is indeed the Son of God sent from heaven. Every believer ought to pray much that the unity of the Church, not in external organizations, but in spirit and in truth, may be made manifest.", "source": "With Christ in the School of Prayer \"Father, I Will\""}, {"name": "Watchman Nee", "short": "Nee", "comment": "That is the great need: to see the Body of Christ as another great Divine fact; to have it break in upon our spirits by heavenly revelation that 'we, who are many, are one body in Christ'.", "source": "NCL \"One Living Sacrifice,\""}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "The Church is called: 'the one new man'. Of course, the oneness referred to there in Ephesians is the result of different kinds of people having disappeared.", "source": "The Octave of Redemption (Transcript)"}], "declarations": ["I declare: I am one with every believer in Christ Jesus.", "I declare: in Christ there is no division; we are all one."], "prayer": "Lord Jesus, thank You for making us one in You. Let Your love bind us together as one body. Amen.", "theme_flag": "theme-based: Murray, theme-based: Nee"}, {"day": 249, "ref": "Galatians 5:1", "book": "Galatians", "chapter": 5, "verse": 1, "text": "Stand fast therefore in the liberty wherewith Christ hath made us free, and be not entangled again with the yoke of bondage.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "As to us, we are the children of promise. It is in this liberty, the liberty of Christ, alluding to the free woman and Jerusalem above, that they were to stand fast, and not put themselves again under the yoke of the law. If they took that ground they made themselves responsible to keep it personally and wholly, and Christ was of no effect to them. They could not rest upon the work of Christ for righteousness, and then hold themselves responsible to fulfil righteousness themselves according to the law. The two things contradict each other.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "THE house of Abraham was the Church of God of that age. The division in his house, one son, his own son, but born after the flesh, the other after the promise, was a divinely-ordained manifestation of the division there would be in all ages between the children of the bondwoman, those who served God in the spirit of bondage, and those who were children of the free, and served Him in the Spirit of His Son. The passage teaches us what the whole Epistle confirms: that the Galatians had become entangled with a yoke of bondage, and were not standing fast in the freedom with which Christ makes free indeed.", "source": "The Two Covenants \"The Two Covenants in Christian Experience\""}, {"name": "Watchman Nee", "short": "Nee", "comment": "The Law pronounced the death sentence; the sentence was executed, and now by death I have been set free from all its claims.", "source": "NCL"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Let me remind you that the cross of the Lord Jesus has emancipated us fully and wholly from every kind of legalism. Stand fast in that and do not let anybody impose upon you a system of 'shalts' and 'shalt nots', but stand in the victory of Calvary.", "source": "\"Stand, Withstand, Having Done All, Stand\""}], "declarations": ["I declare: I stand fast in the liberty Christ has given me.", "I declare: I refuse every yoke of bondage; I am free indeed."], "prayer": "Lord Jesus, thank You for setting me free. I stand fast in Your liberty and will not be entangled again. Amen.", "theme_flag": "theme-based: Nee"}, {"day": 250, "ref": "Galatians 5:22", "book": "Galatians", "chapter": 5, "verse": 22, "text": "But the fruit of the Spirit is love, joy, peace, longsuffering, gentleness, goodness, faith,", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Nor is there any difficulty in judging between what is of the flesh and what is of the Spirit; the apostle enumerates the sad fruits of the former, adding the sure testimony that they which do such things shall not inherit the kingdom of God. The fruits of the Spirit are equally evident in their character, and assuredly against such things there was no law. If we walk according to the Spirit, the law will find nothing to condemn in us. And they that are Christ’s have crucified the flesh and its lusts. This is what they are, inasmuch as they are Christians; it is that which distinguishes them.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "You can take a potsherd, one part of a vessel, and dip out a little water into that, but if you want the vessel full, the vessel must be whole. That is literally true of Christ's Church, and if there is one thing we must pray for still, it is this: Lord, melt us together into one by the power of the Holy Spirit; let the Holy Spirit, who at Pentecost made them all of one heart and one soul, do His blessed work among us. Praise God, we can love each other in a divine love, for \"the fruit of the Spirit is love.\" Give yourselves up to love, and the Holy Spirit will come; receive the Spirit, and He will teach you to love more.", "source": "Absolute Surrender \"The Fruit of the Spirit is Love\""}, {"name": "Watchman Nee", "short": "Nee", "comment": "God has not given us separate fruits of the Spirit with one called love, another called joy, and a third called endurance, etc. God has given us the complete Christ.", "source": "pg 53"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "The fruit of the Spirit is love, and love comprehends all the rest, and all the rest are love in expression in different forms.", "source": "Spiritual Maturity"}], "declarations": ["I declare: the fruit of the Spirit grows in me: love, joy, and peace.", "I declare: the Holy Spirit produces His fruit in my daily life."], "prayer": "Lord Jesus, let the fruit of Your Spirit ripen in me. I yield to Your Spirit today. Amen.", "theme_flag": null}, {"day": 251, "ref": "Galatians 5:23", "book": "Galatians", "chapter": 5, "verse": 23, "text": "Meekness, temperance: against such there is no law.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Holiness, true holiness, is accomplished without the law, even as righteousness is not founded on it. Nor is there any difficulty in judging between what is of the flesh and what is of the Spirit; the apostle enumerates the sad fruits of the former, adding the sure testimony that they which do such things shall not inherit the kingdom of God. The fruits of the Spirit are equally evident in their character, and assuredly against such things there was no law. If we walk according to the Spirit, the law will find nothing to condemn in us. And they that are Christ’s have crucified the flesh and its lusts.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "It is in our daily life and conduct that the fruit of the Spirit is love. From that there comes all the graces and virtues in which love is manifested: joy, peace, longsuffering, gentleness, goodness; no sharpness or hardness in your tone, no unkindness or selfishness; meekness before God and man. You see that all these are the gentler virtues. I have often thought as I read those words in Colossians, \"Put on therefore as the elect of God, holy and beloved, bowels of mercies, kindness, humbleness of mind, meekness, longsuffering\" (Col.", "source": "Absolute Surrender \"The Fruit of the Spirit is Love\""}, {"name": "Watchman Nee", "short": "Nee", "comment": "When the Holy Spirit is in us, we bear the fruit of the Spirit (Gal. 5:22-23), which fruit is just Christ Himself.", "source": "pg 53"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "This is the outworking of the Holy Spirit. Spiritual maturity comes by the Holy Spirit bearing His fruit in us.", "source": "Spiritual Maturity"}], "declarations": ["I declare: meekness and temperance mark my life.", "I declare: against the fruit of the Spirit there is no law; I walk in it."], "prayer": "Lord Jesus, clothe me with meekness and self-control. Let Your gentle Spirit rule my reactions. Amen.", "theme_flag": null}, {"day": 252, "ref": "Galatians 6:9", "book": "Galatians", "chapter": 6, "verse": 9, "text": "And let us not be weary in well doing: for in due season we shall reap, if we faint not.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "The effects followed the cause; and they could not mock God by making a profession of grace or Christianity, if they did not ■walk according to its spirit, as led, in a word, by the Holy Ghost, who is its practical power. Of the 0esh they would reap corruption; of the Spirit, life everlasting. But, as Christians, they must have patience in order to reap, and not grow weary of well-doing: the harvest was sure. Let believers, then, do good to all, especially to those of the house of God. Paul had written this letter with his own hand—an unusual thing for him.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "All labour, bodily or mental, needs time and effort: we must give up ourselves to it. Nature discovers her secrets and yields her treasures only to diligent and thoughtful labour. However little we can understand it, in the spiritual husbandry it is the same: the seed we sow in the soil of heaven, the efforts we put forth, and the influence we seek to exert in the world above, need our whole being: we must give ourselves to prayer. But let us hold fast the great confidence, that in due season we shall reap, if we faint not.", "source": "With Christ in the School of Prayer \"Speedily, Though Bearing Long; Or, The Power of Persevering Prayer\""}, {"name": "Watchman Nee", "short": "Nee", "comment": "We should compare with care and compare these things one by one. In this way, we will not be weary and faint in our souls.", "source": "Running the Race"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Having put our hand to the plough, no looking back, no half-ploughed field, no breaking off because things are getting monotonous or difficult, but going through with it even though it be in weariness.", "source": "Attaining unto the First Three"}], "declarations": ["I declare: I will not grow weary in well doing.", "I declare: in due season I shall reap, if I faint not."], "prayer": "Lord Jesus, strengthen me to keep doing good without growing weary. I trust You for the harvest in due season. Amen.", "theme_flag": "theme-based: Nee, theme-based: Sparks"}, {"day": 253, "ref": "Ephesians 1:3", "book": "Ephesians", "chapter": 1, "verse": 3, "text": "Blessed be the God and Father of our Lord Jesus Christ, who hath blessed us with all spiritual blessings in heavenly places in Christ:", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "And they are of the highest order; they are not temporal, as was the case with the Jews. It is in the most exalted capacity of the renewed man that we enjoy these blessings : and they are adapted to that capacity, they are spiritual. They are also in the highest sphere : it is not in Canaan or Emmanuel’s land. These blessings are granted us in the heavenly places; they are granted us in the most excellent way —one which leaves room for no comparison—it is i/n Christ. The God and Father of our Lord Jesus Christ has blessed us with all spiritual blessings in heavenly places in Christ.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "In Christ are hid all the treasures men around us need; in Him all God's children are blessed with all spiritual blessings; He is full of grace and truth. But it needs prayer, much prayer, strong believing prayer, to bring these blessings down. And let us equally remember that we cannot appropriate the promise without a life given up for men. Many try to take the promise, and then look round for what they can ask. This is not the way; but the very opposite. Get the heart burdened with the need of souls, and the command to save them, and the power will come to claim the promise.", "source": "The True Vine \"Whatsoever Ye Will\""}, {"name": "Watchman Nee", "short": "Nee", "comment": "Christianity begins not with the big DO, but with the big DONE. We are invited at the very outset to sit down and enjoy what God has done for us; not to set out to try and attain it for ourselves.", "source": "Sit, Walk, Stand"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "The Father of our Lord Jesus Christ has blessed us with every spiritual blessing in the heavenlies in Christ. That means that all the resources which are in Christ are available for us.", "source": "Christ Our All (1935)"}], "declarations": ["I declare: I am blessed with all spiritual blessings in heavenly places in Christ.", "I declare: every blessing of heaven is mine in Christ Jesus."], "prayer": "Lord Jesus, thank You for blessing me with every spiritual blessing. I receive them all in You. Amen.", "theme_flag": "theme-based: Murray"}, {"day": 254, "ref": "Ephesians 2:8", "book": "Ephesians", "chapter": 2, "verse": 8, "text": "For by grace are ye saved through faith; and that not of yourselves: it is the gift of God:", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "We have no union of Jews and Gentiles in Him as risen and in heavenly places. Indeed in Colossians, Gentiles only are before the mind of the apostle. believe, will bear witness to it. It is by grace we are saved. Now we are not yet in the glory: it is by faith. Would any one say that at least the faith is of man ? No ;* it is not of ourselves in this respect either; all is the gift of God; not of works, in order that no one may boast. For we are His workmanship. In how powerful a way the Spirit puts God Himself forward, as the source and operator of the whole, and the sole one !", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Let us listen to what God's Word says: \"By grace have ye been saved, through faith; not of works, lest any man should glory. For we are His workmanship, created in Christ Jesus for good works, which God afore prepared that we should walk in them.\" Grace stands in contrast to good works of our own not only before conversion, but after conversion too. We are created in Christ Jesus for good works, which God had prepared for us. It is grace alone can work them in us and work them out through us. Not only the commencement but the continuance of the Christian life is the work of grace.", "source": "The Two Covenants \"The New Covenant: a Covenant of Grace\""}, {"name": "Watchman Nee", "short": "Nee", "comment": "If at the outset we try to do anything, we get nothing; if we seek to attain something, we miss everything. For Christianity begins not with the big DO, but with the big DONE.", "source": "Sit, Walk, Stand"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "The first effect of hearing the voice of the Son of God is the gift of faith. What could not before be contemplated now becomes possible.", "source": "\"The Voice of the Son of God\""}], "declarations": ["I declare: by grace I am saved through faith; it is the gift of God.", "I declare: my salvation is not of myself; it is God's free gift."], "prayer": "Lord Jesus, thank You for saving me by Your grace. I rest in Your finished work, not my own. Amen.", "theme_flag": "theme-based: Nee, theme-based: Sparks"}, {"day": 255, "ref": "Ephesians 2:10", "book": "Ephesians", "chapter": 2, "verse": 10, "text": "For we are his workmanship, created in Christ Jesus unto good works, which God hath before ordained that we should walk in them.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Would any one say that at least the faith is of man ? No ;* it is not of ourselves in this respect either; all is the gift of God; not of works, in order that no one may boast. For we are His workmanship. In how powerful a way the Spirit puts God Himself forward, as the source and operator of the whole, and the sole one ! It is a creation, but, as His work, of a result which is in accordance with His own character. Now it is in us that this is done. He takes up poor sinners to display His glory in them. If it is the operation of God, assuredly it will be for good works: He has created us in Christ for them.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "And s0, especially in any work you do for God, abide in Jesus as your wisdom. ‘We are created in Christ Jesus unto good works, which God hath before ordained that we should walk in them ;’ let all fear or doubt lest we should not know exactly what these works are, be put far away: In Christ we are created for them: He will show us what they are, and how to do them. Cultivate the habit of rejoicing in the assurance that the Divine wisdom is guiding you, even where you do not yet see the way. All that you can wish to know is perfectly clear to Him.", "source": "Abide in Christ \"My Father Is the Husbandman\""}, {"name": "Watchman Nee", "short": "Nee", "comment": "All who sit can walk, for in the thought of God the one follows the other spontaneously. We sit forever with Christ that we may walk continuously before men.", "source": "Sit, Walk, Stand"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "We are in Christ today because God has done it. We are His workmanship, created in Christ Jesus.", "source": "The Horizon of Christ"}], "declarations": ["I declare: I am God's workmanship, created in Christ Jesus for good works.", "I declare: I walk in the good works God prepared for me."], "prayer": "Lord Jesus, You made me for good works. Lead me into everything You prepared for me today. Amen.", "theme_flag": "theme-based: Nee"}, {"day": 256, "ref": "Ephesians 3:16", "book": "Ephesians", "chapter": 3, "verse": 16, "text": "That he would grant you, according to the riches of his glory, to be strengthened with might by his Spirit in the inner man;", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "It is more properly divine, though familiar to us, than the glory. It passes knowledge. Observe too here, that the apostle does not now ask that God should act by a power, as it is often expressed, which works for us, but by a power that works in us.* He is able to do above all that we can ask or think according to His power that works in us. What a portion for us! What a place is this which is given us in Christ! But he returns thus to the thesis proposed at the end of chapter ii., God dwelling in the assembly by the Spirit, and Christians, whether Jews or Gentiles, united in one.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "And later on, that He would grant them, according to the riches of His glory, to be strengthened with might by the Spirit in the inner man. The Spirit given at Pentecost was not a something that God failed with in Heaven. and sent away out of Heaven to earth. God does not, cannot, give away anything in that way. When He gives grace, or strength, or life, He gives it by giving Himself to work it—it is all For THE PRoMISE OF THE FATHER 143 inseparable from Himself. Much more so the Holy Spirit. He is God, present and working in us.", "source": "Waiting on God, Day 29 \"For the Promise of the Father\""}, {"name": "Watchman Nee", "short": "Nee", "comment": "God has placed Himself, His Spirit, His life, and His power in us, that is, in our inner man.", "source": "The Breaking of the Outer Man and the Release of the Spirit"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "There is a very great deal hanging upon that clause, 'the power that worketh in us'. It is something which is called upon to carry a very great responsibility; but, blessed be God, it is well able to carry it.", "source": "\"The Power That Worketh in Us\""}], "declarations": ["I declare: I am strengthened with might by His Spirit in my inner man.", "I declare: according to the riches of His glory, I am strong within."], "prayer": "Lord Jesus, strengthen me in my inner man by Your Spirit. Fill me with Your might from the riches of Your glory. Amen.", "theme_flag": null}, {"day": 257, "ref": "Ephesians 3:20", "book": "Ephesians", "chapter": 3, "verse": 20, "text": "Now unto him that is able to do exceeding abundantly above all that we ask or think, according to the power that worketh in us,", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "It is more properly divine, though familiar to us, than the glory. It passes knowledge. Observe too here, that the apostle does not now ask that God should act by a power, as it is often expressed, which works for us, but by a power that works in us.* He is able to do above all that we can ask or think according to His power that works in us. What a portion for us! What a place is this which is given us in Christ! But he returns thus to the thesis proposed at the end of chapter ii., God dwelling in the assembly by the Spirit, and Christians, whether Jews or Gentiles, united in one.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "My hope is in thee. Deliver me from all my transgressions —Psalm 39:7, 8- HERE MAY BE TIMES when we feel as if we knew not what we are waiting for. There may be other times when we think we do know, and when it would be good for us to realize that we do not know what to ask as we ought. God is able to do for us exceeding abundantly above what we ask or think, and we are in danger of limiting Him, when we confine our desires and prayers to our own thoughts of them. It is a great thing at times to say, as our psalm says: “And now, Lord, what wait I for?”", "source": "Waiting on God, Day 13 \"Waiting on God: For More Than We Know\""}, {"name": "Watchman Nee", "short": "Nee", "comment": "The secret is, in the words of Paul, 'the power that worketh in us' (3:20). In a parallel passage (Col. 1:29) he says: 'I labour also, striving according to his working, which worketh in me mightily.'", "source": "Sit, Walk, Stand"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "This is the power that worketh in us, which is, as we have seen, power through His Spirit in the inward man; and that is the power and the means by which God reaches His end in us.", "source": "\"The Power That Worketh in Us\""}], "declarations": ["I declare: God is able to do exceeding abundantly above all I ask or think.", "I declare: His power working in me has no limit."], "prayer": "Lord Jesus, I believe You can do far more than I ask or imagine. Work Your mighty power in me. Amen.", "theme_flag": null}, {"day": 258, "ref": "Ephesians 4:32", "book": "Ephesians", "chapter": 4, "verse": 32, "text": "And be ye kind one to another, tenderhearted, forgiving one another, even as God for Christ’s sake hath forgiven you.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "But it is more than this. A divine principle brings in the desire of doing good to others, to their body and their soul. I need not say how truly we find here the picture of the life of Christ, as in the preceding remarks it was the putting off of the spirit of the ■enemy and of the old man. The spirit of peace and love (and that, in spite of evil in others and the wrongs they may do us) completes the picture, adding -that which will be easily understood after what has been said, that, in “ forgiving one another,” we are to be imitators of God, and to walk in love as Christ has loved us, and has given Himself for us.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "We pray, Forgive, even as we have forgiven.' Scripture says, Forgive one another, even as God also in Christ forgave you.' God's full and free forgiveness is to be the rule of ours with men. Otherwise our reluctant, half-hearted forgiveness, which is not forgiveness at all, will be God's rule with us. Every prayer rests upon our faith in God's pardoning grace. If God dealt with us after our sins, not one prayer could be heard. Pardon opens the door to all God's love and blessing: because God has pardoned all our sin, our prayer can prevail to obtain all we need. The deep sure ground of answer to prayer is God's forgiving love.", "source": "With Christ in the School of Prayer \"When Ye Stand Praying, Forgive\""}, {"name": "Watchman Nee", "short": "Nee", "comment": "We should realize that God gives us opportunities to forgive others.", "source": "Set 1 Vol. 17, ch. 9, bibleread.online"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Put on kindness, humility, meekness, longsuffering; forbearing one another, forgiving each other.", "source": "God's Supreme Interest in Man"}], "declarations": ["I declare: I am kind and tenderhearted, forgiving as God forgave me in Christ.", "I declare: I release every offense, even as I have been forgiven."], "prayer": "Lord Jesus, as You forgave me, I forgive others. Make me kind and tenderhearted like You. Amen.", "theme_flag": "theme-based: Sparks"}, {"day": 259, "ref": "Ephesians 5:2", "book": "Ephesians", "chapter": 5, "verse": 2, "text": "And walk in love, as Christ also hath loved us, and hath given himself for us an offering and a sacrifice to God for a sweetsmelling savour.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Moreover, let us remark here, and it is an important feature in this picture of the fruits of grace and of the new man, that when the grace and love, which come down from God, act in man, they always go up again to God in devotedness. Walk, he says, in love, even as Christ loved us and gave Himself up for us, an offering and a sacrifice to God. for a sweet-smelling savour. We see it in Christ. He is this love which comes down in grace, but this grace, acting in man, living man on earth ; lienee he is to give his body up ns a living eacrifice—alive in Christ, he is to yield his members up wholly to God.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Do you receive this? VII. JESUS' SURRENDER OF HIMSELF Christ also loved the Church, and gave Himself up for it; that He might sanctify it; that He might present the Church to Himself a glorious Church, not having spot or wrinkle; but that it should be holy and without blemish.' -- Eph. 5:24-47 So great and wonderful was the work that Jesus had to do for the sinner, that nothing less was necessary than that He should give Himself to do that work. So great and wonderful was the love of Jesus towards us, that He actually gave Himself for us and to us.", "source": "The New Life \"Jesus' Surrender of Himself\""}, {"name": "Watchman Nee", "short": "Nee", "comment": "Walking is the practical out-working of that heavenly position here on earth.", "source": "Sit, Walk, Stand"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "The new corporate man is the embodiment of the love of Christ. That is the first thing.", "source": "All Things in Christ"}], "declarations": ["I declare: I walk in love, as Christ loved me and gave Himself for me.", "I declare: my life is a sweet offering to God."], "prayer": "Lord Jesus, You loved me and gave Yourself for me. Teach me to walk in that same love today. Amen.", "theme_flag": "theme-based: Murray, theme-based: Nee"}, {"day": 260, "ref": "Ephesians 5:8", "book": "Ephesians", "chapter": 5, "verse": 8, "text": "For ye were sometimes darkness, but now are ye light in the Lord: walk as children of light:", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Now we were that which is contrary to His character, we were darkness; not only in the dark, but darkness in our nature, the opposite of God who is light. No one ray of that which He is was found in our will, our desires, our understanding. We were morally destitute of it. There was the corruptness of the first Adam, but no share in any feature of the divine character. We are now partakers of the divine nature, we have the same desires, we know what it is that He loves, and we love what He loves, we enjoy that which He enjoys, we arc light (poor and weak indeed, yet such by nature) in the Lord —looked at as in Christ.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "4. To thank much for what God is and does, to believe much in what God says and will do, is the way to abiding gladness. 5. The light of the eyes gladdens the heart.' God has not intended that His children should walk in the darkness. Satan is the prince of the darkness: God is light: Christ is the Light of the world: we are children of the light: let us walk in the light. Let us believe in the promise, The Lord shall be to thee an everlasting light. Thy sun shall no more go down, for the Lord shall be to thee an everlasting light, and the days of thy mourning shall be ended.", "source": "The New Life \"Light and Joyfulness\""}, {"name": "Watchman Nee", "short": "Nee", "comment": "It is when we have reached a position where we would like to follow God fully that we find light to be the most necessary thing in the Christian life.", "source": "\"The Light Of God And Knowledge.\""}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Christians are said to be 'children of the light' (Eph. 5:8). So, everything related to God is light: 'in Him there is no darkness at all'.", "source": "The Holy Spirit, the Church, and the Nations"}], "declarations": ["I declare: I was darkness, but now I am light in the Lord.", "I declare: I walk as a child of light."], "prayer": "Lord Jesus, You turned my darkness into light. Help me walk as a child of light in all I do. Amen.", "theme_flag": "theme-based: Murray, theme-based: Nee"}, {"day": 261, "ref": "Ephesians 6:10", "book": "Ephesians", "chapter": 6, "verse": 10, "text": "Finally, my brethren, be strong in the Lord, and in the power of his might.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Although we are in the wilderness, we are also in the heavenly places in Christ. We have crossed the Jordan, we have died and are risen again with Him. We are sitting in the heavenly places in Him, that we may enjoy the things of heaven as the fruit of our own country. But conflict is before us, if we desire to enjoy them practically. The promise is of every blessing, of all the promised land, but wheresoever we shall set our foot on it. (Joshua i.) For this we need the Lord’s strength, and of this the apostle now speaks. “ Be strong,” he says, \" in the Lord.” The enemy is subtle. We have to withstand his stratagems even more than his power.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Our one duty is to be strong in the Lord, and in the power of His might. Let our faith cultivate large and clear apprehensions of the exceeding greatness of God’s power in them that believe, even that power of the risen and exalted Christ by which He triumphed over every enemy (Eph. i. 19-21), Let our faith consent to God’s wonderful and most blessed arrangement : nothing but feebleness in us as our own, all the power in Christ, and yet within our reach as surely as if it were in us. Let our faith daily go out of self and its life into the life of Christ, placing our whole being at His disposal for Him to work in us.", "source": "Abide in Christ \"As Your Strength\""}, {"name": "Watchman Nee", "short": "Nee", "comment": "Not until the Lordship of Jesus Christ is a settled thing in our hearts can the Spirit really operate effectively in us.", "source": "NCL"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "The Lord must have a fighting spirit in His people and when the spirit of battle goes out of anyone they are done so far as the higher purposes of God are concerned. So you have in the New Testament these numerous exhortations: 'Be strong in the Lord and in the strength of His might.'", "source": "\"Victory Through Faith\""}], "declarations": ["I declare: I am strong in the Lord and in the power of His might.", "I declare: His might, not mine, wins my battles."], "prayer": "Lord Jesus, I put on Your strength today. In the power of Your might I stand firm. Amen.", "theme_flag": "theme-based: Nee"}, {"day": 262, "ref": "Philippians 1:6", "book": "Philippians", "chapter": 1, "verse": 6, "text": "Being confident of this very thing, that he which hath begun a good work in you will perform it until the day of Jesus Christ:", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Who had wrought in the Philippians this spirit of love and of devotedness to the interests of the gospel ? Truly it was the God of the glad tidings and of love'; and this was a security that He who had begun the good work would fulfil it unto the day of Christ. Sweet thought!now that we have no longer the apostle, that we have no longer bishops and deacons, as the Philippians had in those days. God cannot be taken from us; the true and living source of all blessing remains to us, unchangeable, and above the infirmities, and even the faults, which deprive Christians of all intermediate resources.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Or rather, would that we understood that it is a Love with a height and a depth and a length and a breadth that passes knowledge! How all thought of sacrifice or surrender would pass away, and our souls be filled with wonder at the unspeakable privilege of being loved with such a love, of being allowed to come and abide in it for ever, And if doubt again suggest the question: But is it possible, can I always abide in His love? listen how that love itself supplies the only means for the abiding in Him: It is faith in that love which will enable us to abide in it.", "source": "Abide in Christ \"God Himself Will Establish You\""}, {"name": "Watchman Nee", "short": "Nee", "comment": "God wants to do all, for He must have all the glory. If we do some of the work, then we will get some of the glory; but God must have it all Himself, so He does all the work from beginning to end.", "source": "The Normal Christian Life"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "He started us on that way the day in which we came to the Cross. And 'He Who hath commenced this good work, will perfect it until the day of Christ'.", "source": "The Octave of Redemption (Transcript)"}], "declarations": ["I declare: He who began a good work in me will perform it until the day of Jesus Christ.", "I declare: God will finish what He started in my life."], "prayer": "Lord Jesus, thank You for the good work You began in me. I trust You to complete it. Amen.", "theme_flag": "theme-based: Nee"}, {"day": 263, "ref": "Philippians 1:21", "book": "Philippians", "chapter": 1, "verse": 21, "text": "For to me to live is Christ, and to die is gain.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Not that he lost his interest in the work, but that Christ alone held the first place; and he saw everything, and even the work, in Christ. What consolation it is, when wo are perhaps conscious that our weakness has been manifested, and that we have failed in acting according to the power ■of God, to feel that He, who alone has a right to be glorified, never fails! Now, since Christ was everything to Paul, it was evident gain to die, for he would be with Him. Nevertheless it was worth while to live (for this is the force of the first part of verse 21), because it was Christ and His service: and he did not know which to choose.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "In work or in rest, the consciousness of life never leaves us. And even so can the mighty power of the Eternal Life maintain within us the consciousness of its presence, Or rather, Christ, who is our life, Himself dwells within us, and by His presence maintains our consciousness that we are in Him, The second objection has reference to our sinful- ness. Christians are so accustomed to look upon sinning daily as something absolutely inevitable, that they regard it as a matter of course that no one can keep up abiding fellowship with the Saviour: we must sometimes be unfaithful and fail.", "source": "Abide in Christ \"Every Moment\""}, {"name": "Watchman Nee", "short": "Nee", "comment": "The life we live is the life of Christ alone. This life is not something which we ourselves have to produce.", "source": "NCL"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Paul lived on Christ: 'For me to live is Christ.' Christ is the object, the dynamic, the motive of my being on this earth, and only Christ!", "source": "The Excellency of the Knowledge of Christ"}], "declarations": ["I declare: for me to live is Christ.", "I declare: Christ is my life, and to be with Him is gain."], "prayer": "Lord Jesus, You are my life. Whether I live or die, I am Yours. Amen.", "theme_flag": "theme-based: Murray, theme-based: Nee"}, {"day": 264, "ref": "Philippians 2:5", "book": "Philippians", "chapter": 2, "verse": 5, "text": "Let this mind be in you, which was also in Christ Jesus:", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "It was love in him which, sensible to their love, thought only of them. How delicate the way in which a kindness, which precluded reproof, made a way for what really was one, and which a heart that added charity to brotherly love could not leave unuttered ! Now the means of this union, of the maintenance of this love, was found in the abnegation of self, in humility, in the spirit that humbles itself in order to serve. It was this which perfectly displayed itself in Christ, in contrast with the first Adam.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Have the mind in you which was also in Christ Jesus, who emptied Himself, taking the form of a servant, and humbled Himself.' And to the Colossians: 'Put on a heart of compassion, kindness, humility, meekness, long-suffering, forebearing _one another_, and forgiving _each other_, even as the Lord forgave you.' It is in our relation to one another, in our treatment of one another, that the true lowliness of mind and the heart of humility are to be seen. Our humility before God has no value, but as it prepares us to reveal the humility of Jesus to our fellow-men. Let us study humility in daily life in the light of these words.", "source": "Humility \"Humility in Daily Life\""}, {"name": "Watchman Nee", "short": "Nee", "comment": "Not only do we have to take the yoke, we also have to learn from the Lord. The Lord's pattern is recorded in Philippians 2:6-8.", "source": "\"Learn from Me,\""}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Have this mind in you, which was also in Christ Jesus... What a background that is! If you meditate upon all that follows that phrase concerning the mind of Christ, you will see how far-reaching and deep-reaching this whole matter of fellowship is.", "source": "Fellowship"}], "declarations": ["I declare: I have the mind of Christ.", "I declare: I think as Christ thinks, humble and obedient."], "prayer": "Lord Jesus, form Your mind in me. Let me think Your thoughts and walk Your lowly way. Amen.", "theme_flag": "theme-based: Nee"}, {"day": 265, "ref": "Philippians 2:6", "book": "Philippians", "chapter": 2, "verse": 6, "text": "Who, being in the form of God, thought it not robbery to be equal with God:", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "How delicate the way in which a kindness, which precluded reproof, made a way for what really was one, and which a heart that added charity to brotherly love could not leave unuttered ! Now the means of this union, of the maintenance of this love, was found in the abnegation of self, in humility, in the spirit that humbles itself in order to serve. It was this which perfectly displayed itself in Christ, in contrast with the first Adam. The latter sought to make himself like God by robbery, when he was in the form of a man, and strove to exalt himself at God’s expense (being at the same time disobedient unto death).", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "“To realize the glorious Deity of Him whose call sounds forth to longing hearts with such exceeding sweetness, is no small step towards gaining the full privilege to which we are invited. But longing is by itself of no use; still less can there be any profit in reading of the blessed results to be gained from a close and personal union with our Lord, if we believe that union to be practically beyond our reach. His words are meant to be a living, an eternal, precious reality. And this they can never become unless we are sure that we may reasonably expect their accom- plishment.", "source": "Abide in Christ \"As You Came to Him, by Faith\""}, {"name": "Watchman Nee", "short": "Nee", "comment": "Originally, our Lord was equal with God, having the same glory and sharing the same authority. However, He did not uplift Himself; on the contrary, He emptied Himself and took the form of a slave.", "source": "\"Learn from Me,\""}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "He would not hold that fulness in a personal way, and so the Word says: 'He emptied Himself.' The Lord Jesus, Who was filled with all the fulness of God, did not grasp it in a personal way, to hold it, but emptied Himself in order to undo the mischief of the fall.", "source": "Fellowship"}], "declarations": ["I declare: Jesus is God, equal with the Father, yet He came for me.", "I declare: I worship Christ, who is God over all."], "prayer": "Lord Jesus, You are God and yet You humbled Yourself for me. I worship You with awe and love. Amen.", "theme_flag": "theme-based: Murray, theme-based: Nee"}, {"day": 266, "ref": "Philippians 2:7", "book": "Philippians", "chapter": 2, "verse": 7, "text": "But made himself of no reputation, and took upon him the form of a servant, and was made in the likeness of men:", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "How delicate the way in which a kindness, which precluded reproof, made a way for what really was one, and which a heart that added charity to brotherly love could not leave unuttered ! Now the means of this union, of the maintenance of this love, was found in the abnegation of self, in humility, in the spirit that humbles itself in order to serve. It was this which perfectly displayed itself in Christ, in contrast with the first Adam. The latter sought to make himself like God by robbery, when he was in the form of a man, and strove to exalt himself at God’s expense (being at the same time disobedient unto death).", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Humble yourself unto the death. It is in the death to self that humility is perfected. Be sure that at the root of all real experience of more grace, of all true advance in consecration, of all actually increasing conformity to the likeness of Jesus, there must be a deadness to self that proves itself to God and men in our dispositions and habits. It is sadly possible to speak of the death-life and the Spirit-walk, while even the tenderest love cannot but see how much there is of self. The death to self has no surer death-mark than a humility which makes itself of no reputation, which empties out itself, and takes the form of a servant.", "source": "Humility \"Humility and Death to Self\""}, {"name": "Watchman Nee", "short": "Nee", "comment": "Although He had given up His freedom as God, He could still have His freedom as a man... Yet He took the form of a slave and sacrificed even the freedom He had as an ordinary man.", "source": "\"Learn from Me,\""}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "He took the form of a bond-slave to undo it; He assumed, therefore, no personal superiority. We are a company of servants, bond-slaves.", "source": "Fellowship"}], "declarations": ["I declare: like Christ, I take the form of a servant.", "I declare: I empty myself of pride and serve others in love."], "prayer": "Lord Jesus, You made Yourself of no reputation for me. Teach me to serve as You served. Amen.", "theme_flag": "theme-based: Nee"}, {"day": 267, "ref": "Philippians 2:8", "book": "Philippians", "chapter": 2, "verse": 8, "text": "And being found in fashion as a man, he humbled himself, and became obedient unto death, even the death of the cross.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "The latter sought to make himself like God by robbery, when he was in the form of a man, and strove to exalt himself at God’s expense (being at the same time disobedient unto death). Christ, on the contrary, when He was in the form of God, emptied Himself, through love, of all His outward glory, of the form of God, and took the form of a man; and, even when He was in the form of a man, still humbled Himself. It was a second thing which He did in humbling Himself. As God, He emptied Himself; as man, He humbled Himself, and became obedient unto death, even to the death of the PllILIPPIAKS. cross.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Hence it follows that nothing can be our redemption, but the restoration of the lost humility, the original and only true relation of the creature to its God. And so Jesus came to bring humility back to earth, to make us partakers of it, and by it to save us. In heaven He humbled Himself to become man. The humility we see in Him possessed Him in heaven; it brought Him, He brought it, from there. Here on earth 'He humbled Himself, and became obedient unto death'; His humility gave His death its value, and so became our redemption.", "source": "Humility \"Humility: the Glory of the Creature\""}, {"name": "Watchman Nee", "short": "Nee", "comment": "The Christian standard does not stop merely at being just but at enduring the unjust. For our sake, He was willing to endure all kinds of unjust treatment.", "source": "\"Learn from Me,\""}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Being found in fashion as a man He humbled Himself, becoming obedient. Obedience unto death, yea the death of the cross; there is nothing more stripped of dignity than the Cross.", "source": "Fellowship"}], "declarations": ["I declare: I follow Christ in humble obedience, even to the end.", "I declare: His obedience unto death is my example and my life."], "prayer": "Lord Jesus, You were obedient even to death on the cross. Give me that same obedient heart. Amen.", "theme_flag": "theme-based: Nee"}, {"day": 268, "ref": "Philippians 2:9", "book": "Philippians", "chapter": 2, "verse": 9, "text": "Wherefore God also hath highly exalted him, and given him a name which is above every name:", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "It is also a perfect love. But this proof is given, this love accomplished, in the fact that He is man. What a place has He acquired for us in Himself! But it is of Him, not of us who are its fruits, that the apostle thinks. He rejoices in the thought of Christ’s exaltation. God has exalted Him to the highest place, and given Him a name which is above every name, so that everything in heaven and earth, and even in infernal regions, must bow before this exalted man, and every tongue confess that Jesus Christ is Lord to the glory of God the Father.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "There can be but one answer: it is His humility. What is the incarnation but His heavenly humility, His emptying Himself and becoming man? What is His life on earth but humility; His taking the form of a servant? And what is His atonement but humility? 'He humbled Himself and became obedient unto death.' And what is His ascension and His glory, but humility exalted to the throne and crowned with glory? 'He humbled Himself, therefore God highly exalted Him.' In heaven, where He was with the Father, in His birth, in His life, in His death, in His sitting on the throne, it is all, it is nothing but humility.", "source": "Humility \"Humility: the Secret of Redemption\""}, {"name": "Watchman Nee", "short": "Nee", "comment": "Because He died and resurrected, God the Father gave Him far more surpassing glory.", "source": "The Christian (1): Meditations on Revelation"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Wherefore also God highly exalted him (because of this obedience), and gave unto him the name which is above every name.", "source": "The Risen Lord and the Things Which Cannot be Shaken"}], "declarations": ["I declare: God has highly exalted Jesus and given Him the name above every name.", "I declare: the humbled Christ is now the exalted Lord."], "prayer": "Lord Jesus, You are exalted above every name. I bow before You in worship. Amen.", "theme_flag": "theme-based: Nee"}, {"day": 269, "ref": "Philippians 2:10", "book": "Philippians", "chapter": 2, "verse": 10, "text": "That at the name of Jesus every knee should bow, of things in heaven, and things in earth, and things under the earth;", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "It is also a perfect love. But this proof is given, this love accomplished, in the fact that He is man. What a place has He acquired for us in Himself! But it is of Him, not of us who are its fruits, that the apostle thinks. He rejoices in the thought of Christ’s exaltation. God has exalted Him to the highest place, and given Him a name which is above every name, so that everything in heaven and earth, and even in infernal regions, must bow before this exalted man, and every tongue confess that Jesus Christ is Lord to the glory of God the Father.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "AS thou rejoicest in thy reconciliation, thou shalt under- stand how it includes all things, and how they too wait the full redemption; ‘for it pleased the Father by Him to reconcile all things unto Himself; by fim, I say, whether they be things on earth or things in heaven.” And abide in Him as thy sanctification ; the experience of His power to make thee holy, spirit and soul and body, will quicken thy faith in a holiness that shall not cease its work until the bells of the horses and every pot in Jeru- salem shall be Holiness to the Lord. Abide in Him as thy redemption, and live, even here, as the heir of the future glory.", "source": "Abide in Christ \"That You May Not Sin\""}, {"name": "Watchman Nee", "short": "Nee", "comment": "In His glory, He receives the praises of the blessed ones, the lauding of the heavenly hosts, and the worship of the creatures.", "source": "The Christian (1): Meditations on Revelation"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Then there follows the universal acknowledgment of Him in His exaltation: 'That in the name of Jesus every knee should bow, of things in heaven, and things on earth, and things under the earth'.", "source": "The Risen Lord and the Things Which Cannot be Shaken"}], "declarations": ["I declare: at the name of Jesus every knee shall bow.", "I declare: heaven, earth, and all beneath confess His lordship."], "prayer": "Lord Jesus, every knee will bow to You. I bow mine willingly today in love and worship. Amen.", "theme_flag": "theme-based: Murray, theme-based: Nee"}, {"day": 270, "ref": "Philippians 2:11", "book": "Philippians", "chapter": 2, "verse": 11, "text": "And that every tongue should confess that Jesus Christ is Lord, to the glory of God the Father.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "It is also a perfect love. But this proof is given, this love accomplished, in the fact that He is man. What a place has He acquired for us in Himself! But it is of Him, not of us who are its fruits, that the apostle thinks. He rejoices in the thought of Christ’s exaltation. God has exalted Him to the highest place, and given Him a name which is above every name, so that everything in heaven and earth, and even in infernal regions, must bow before this exalted man, and every tongue confess that Jesus Christ is Lord to the glory of God the Father.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "And even so will it be with him who abides in Christ’s love. If Christ finds us willing to trust ourselves and our interests to His love, if in that trust we give up all care for our own will and honour, if we make it our glory to exercise and confess absolute dependence on Him in all things, if we are content to have no...2 but in Him, He will do for us what the Father did for Him. He will lay of His glory on us: As the name of our Lord Jesus is glorified in us, we are glorified in Him (2 Thess. i. .12).", "source": "Abide in Christ \"The Crucified One\""}, {"name": "Watchman Nee", "short": "Nee", "comment": "All the hearts of those who love the Lord should exult, because we delight in seeing our Lord receiving glory and honor.", "source": "The Christian (1): Meditations on Revelation"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "That is universal supremacy. That carries you to the fulness of the times.", "source": "The Gospel of God Concerning His Son Jesus Christ Our Lord"}], "declarations": ["I declare: Jesus Christ is Lord, to the glory of God the Father.", "I declare: my tongue confesses what my heart believes: Jesus is Lord."], "prayer": "Lord Jesus, I confess You as Lord of my life. Be glorified in me today. Amen.", "theme_flag": "theme-based: Murray, theme-based: Nee"}, {"day": 271, "ref": "Philippians 3:10", "book": "Philippians", "chapter": 3, "verse": 10, "text": "That I may know him, and the power of his resurrection, and the fellowship of his sufferings, being made conformable unto his death;", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Christ had passed through death in the perfection of that life, the power of which was manifested in resurrection. Paul, having seen this perfection in glory, and being united (weak as he was in himself) to Christ the source of this power, desired to know the power of His resurrection, that he might follow Him in His sufferings. Circumstances held this as a reality before His eyes. His heart only saw, or wished to see, Christ, that he might follow Him there. If death was on the way, he was only so much the more like Christ. He did not mind what it cost, if by any means he might attain. This gave undivided energy of purpose.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "You shall know him in the power of His resurrection and the fellowship of His sufferings, F ollowing Him, you shall not walk in darkness, but have the light of life. It is only when God snines into the heart, and Christ Jesus dwells there, that the light of the knowledge of God in the face of Christ can be seen. Or would you understand His blessed work, as He wrought it on earth, or works it from heaven by His Spirit? Would you know how Christ can become our righteousness, and our sanctification, and re- demption? It is just as bringing, and revealing, and communicating these that He is made unto us wisdom from God.", "source": "Abide in Christ \"As Your Wisdom\""}, {"name": "Watchman Nee", "short": "Nee", "comment": "No one can testify for the Lord without knowing Him. The extent of our knowledge of Christ determines the magnitude of the testimony we bear.", "source": "(\"Knowing Christ and the power of his resurrection,\" Scripture Reading: Phil. 3:10)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Here, after all that, near the end of his life, he is crying passionately: 'That I may know him.' The very least that we can say about this is that the Christ in view was a very great Christ indeed, who outstrips the greatest capacity and comprehension of man.", "source": "\"An Apostle's Supreme Ambition\""}], "declarations": ["I declare: I know Him, and the power of His resurrection.", "I declare: I share the fellowship of His sufferings, made like Him in His death."], "prayer": "Lord Jesus, I want to know You more: Your resurrection power and the fellowship of Your sufferings. Amen.", "theme_flag": null}, {"day": 272, "ref": "Philippians 3:14", "book": "Philippians", "chapter": 3, "verse": 14, "text": "I press toward the mark for the prize of the high calling of God in Christ Jesus.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "If that was his perfection, he could not be yet perfect. He was, as has been said, on the road ; but Christ had apprehended him for it, and he still pressed onward to lay hold of the prize, for the enjoyment of which Christ had laid hold of him. No, he repeats to his brethren, I count not myself to have attained. But one thing at least he could say—he forgot all that was behind him, and pressed on ever towards the goal, keeping it always in sight to obtain the prize of the calling of God, which is found in heaven.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "A priest is thus a man who does not at all live for himself. He lives with God and for God. His work is as God's servant to care for His house, His honour, and His worship, to make known to men His love and His will. He lives with men and for men (Heb. v. 2). His work is to find out their sin and need, and to bring it before God, to offer sacrifice and incense in their name, to obtain forgiveness and blessing for them, and then to come out and bless them in His Name. This is the high calling of every believer. Such honour have all His saints.'", "source": "With Christ in the School of Prayer \"An Holy Priesthood; Or, The Ministry of Intercession\""}, {"name": "Watchman Nee", "short": "Nee", "comment": "He told us that he had a mark set before him, and that he was forgetting the things which were behind and pursuing towards the goal that was set before him.", "source": "(\"The foremost condition for spiritual progress\")"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "I think Paul himself was the embodiment of the spirit of the first three when he said, 'One thing I do, forgetting the things which are behind, and stretching forward to the things which are before, I press on toward the goal unto the prize of the high calling of God in Christ Jesus' (Phil. 3:13-14).", "source": "Attaining unto the First Three"}], "declarations": ["I declare: I press toward the mark for the prize of the high calling of God in Christ Jesus.", "I declare: forgetting what is behind, I reach forward
