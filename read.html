countenance beams with pleasure and approval as the penitent sinner draws near to Him, and He invites him to intimate fellowship.", "source": "The Power of the Blood of Jesus (via goodreads.com/author/quotes/13326.Andrew_Murray)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "The blood of Jesus his Son cleanses us from every sin.", "source": "The Normal Christian Life, ch 1 \"The Blood of Christ\" (bibleportal.com/sermon/Watchman-Nee/the-blood-of-christ)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "As we do so the blood of Jesus Christ His Son cleanseth [Greek: keeps on cleansing] us from all sin.", "source": "T. Austin-Sparks, \"The Throne in Heaven\" (bibleportal.com/sermon/T-Austin-Sparks/the-throne-in-heaven)"}], "declarations": ["I declare: As I walk in the light, the blood of Jesus Christ cleanses me from all sin.", "I declare: I have fellowship with God, and His righteousness meets me as a friend."], "prayer": "Lord Jesus, I walk in Your light. Your blood keeps cleansing me from all sin. Draw me into deeper fellowship with You. Amen.", "theme_flag": null}, {"day": 341, "ref": "1 John 1:9", "book": "1 John", "chapter": 1, "verse": 9, "text": "If we confess our sins, he is faithful and just to forgive us our sins, and to cleanse us from all unrighteousness.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "If, on the other hand, we have even committed sin and all, being judged according to the light, is confessed, He is faithful and just to forgive us, and to cleanse us from all iniquity.", "source": "Darby's Synopsis, 1 John chapter 1 section (local file)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Too often the confession of sin is superficial, and often it is quite neglected. Few Christians realize how necessary it is to be in earnest about the matter, or feel that an honest confession of sin gives power to live the life of victory over sin.", "source": "Andrew Murray, 'Confession of Sin' (sermonindex.net/pdf-text/txt/a/andrew-murray--confession-of-sin.txt)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "In case we fail, we must examine ourselves, confess our sin, and resort to the cleansing of the precious blood.", "source": "Watchman Nee, The Spiritual Man, “Words of Exhortation”"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "He was showing that there is no religious system, there are no religious observances, which can make sin other than it is or get rid of it.", "source": "T. Austin-Sparks, 'Jesus Christ, The Faithful Witness...' (austin-sparks.net/english/006323.html)"}], "declarations": ["I declare: If I confess my sins, He is faithful and just to forgive me.", "I declare: The blood of Jesus cleanses me from all unrighteousness."], "prayer": "Lord Jesus, I confess my sins to You today. Thank You that You are faithful and just to forgive me and cleanse me from all unrighteousness. Amen.", "theme_flag": "theme-based: Sparks"}, {"day": 342, "ref": "1 John 2:1", "book": "1 John", "chapter": 2, "verse": 1, "text": "My little children, these things write I unto you, that ye sin not. And if any man sin, we have an advocate with the Father, Jesus Christ the righteous:", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "We have an Advocate with the Father, One who carries on our cause for us on high. When communion is interrupted, when we have sinned, Christ intercedes for us.", "source": "Darby's Synopsis, 1 John chapter 2 section (local file)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Christ teaches us to pray not only by example, instruction, command, and promises but also by showing us that He is our ever-living intercessor.", "source": "Andrew Murray (attributed; bibleportal.com)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Through the Lord Jesus’ death and by His becoming the propitiation for our sins, He has become our Advocate with the Father.", "source": "Watchman Nee, The Collected Works, Set 3 Vol. 49: Messages for Building Up New Believers (2), ch. 21"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "It is all a matter of righteousness, the righteousness of God, but that righteousness is by faith.", "source": "T. Austin-Sparks, 'Jesus Christ, The Faithful Witness...' (austin-sparks.net/english/006323.html)"}], "declarations": ["I declare: I have an Advocate with the Father, Jesus Christ the righteous.", "I declare: Christ ever lives to intercede for me."], "prayer": "Lord Jesus, thank You for being my Advocate with the Father. When I sin, You intercede for me. I rest in Your righteousness today. Amen.", "theme_flag": "theme-based: Murray, theme-based: Sparks"}, {"day": 343, "ref": "1 John 3:1", "book": "1 John", "chapter": 3, "verse": 1, "text": "Behold, what manner of love the Father hath bestowed upon us, that we should be called the sons of God: therefore the world knoweth us not, because it knew him not.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "If therefore it is really found in any one, he is born of Him, he derives his nature from God in Christ. We may ae it is righteousness as it was manifested in Jesus; for it is because we know that He is righteous, that we know that — “he who doeth righteousness is born of him.” It i , same nature demonstrated by the same fruits, ~ Chap. iii. Now to say that we are born of Him is to ~ say that we are children of God.* What a love is that which the Father has bestowed on us, that we should be called children!+ Therefore the world knows us not, because it knew Him not. The apostle returns here to His appearing, and its effect on us.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Young Christian, God has asked your heart, your love, your whole self. You have given yourself to Him. He has received you, and would have you and your heart entirely for Himself. He will make that heart full of His word. What is in the heart one holds dear, because one thinks continually on that which gives joy. God would have the word in the heart. Where His word is, there is He Himself and His might. He considers Himself bound to fulfill His word; when you have the word, you have God Himself to work in you. (Gen. 21:1; Josh. 23:14) He wills that you should receive and lay up His words in your heart: then will He greatly bless you. (Deut.", "source": "The New Life, ch VIII, 'Children of God'"}, {"name": "Watchman Nee", "short": "Nee", "comment": "For men to become the sons of God is the special kindness of God.", "source": "The Word of the Cross"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "'hath made us accepted in the beloved' (Eph. 1:6. A.V.). 'Us in the beloved'; God giving Himself to us in the same way as He gave Himself to His Son.", "source": "His Great Love"}], "declarations": ["I declare: Behold what manner of love the Father has bestowed on me, that I should be called a child of God.", "I declare: I am a child of God; this is my present sure position."], "prayer": "Father, thank You for the great love You have bestowed on me. I am Your child, born of You. Help me to live as Your beloved today. Amen.", "theme_flag": "theme-based: Sparks"}, {"day": 344, "ref": "1 John 3:16", "book": "1 John", "chapter": 3, "verse": 16, "text": "Hereby perceive we the love of God, because he laid down his life for us: and we ought to lay down our lives for the brethren.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Further, as in the case of righteousness and of purity, we have Christ as the measure of this love. Weknow love by this, that He laid down His life for us; we ought to lay down ours for the brethren. Now, if our brother has need, and we possess this world’s good but do not provide for his necessity, is that the divine love which made Christ lay down His life for us? It is by this real and practical love that we know we are in the truth, and that our heart is confirmed and assured before God. For, if there is nothing on the conscience, we have confidence in His presence; but if our own i i condemn us, God knows yet more.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "And if even for a moment the commandments appear grievous, just remember whose they are. They are the commandments of Him who loves thee. They are all love, they come from His love, they lead to His love. Each new surrender to keep the commandments, each new sacrifice in keeping them, leads to deeper union with the will, the spirit, and the love of the Saviour. The double recompense of reward shall be thine,—a fuller entrance into the mystery of His love,—a fuller conformity to His own blessed life.", "source": "Abide in Christ"}, {"name": "Watchman Nee", "short": "Nee", "comment": "The real loving of the Lord and loving of the brothers comes from not loving the self.", "source": "The Spiritual Man (1)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "It is not our nature to lay down our lives. Remember that that very phrase about laying down the life can equally well be translated 'we ought to lay down our souls for the brethren' (1 John 3:16).", "source": "Followers of the Lamb"}], "declarations": ["I declare: I know love because Christ laid down His life for me.", "I declare: I lay down my life for the brethren in love."], "prayer": "Lord Jesus, thank You for laying down Your life for me. Teach me to love the brethren as You have loved me, laying down my life for them. Amen.", "theme_flag": null}, {"day": 345, "ref": "1 John 4:8", "book": "1 John", "chapter": 4, "verse": 8, "text": "He that loveth not knoweth not God; for God is love.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "The possession of the nature is necessary to the under- ‘standing of what that nature is, and for the knowledge of Him who is its perfection, But it is not to the IV. existence of the nature in us that the Spirit of God directs the thoughts of the believers as their object. God, he has said, is love; and this love has been manifested towards us in that He has given His only Son, that we might believe through Him. ‘The proof is not the life in us, but that God has given His Son in order that we might live.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "It is even so in religion. The mind can form thoughts about God from the Bible, and know all the doctrines of salvation, while the inner life does not know the power of God to save. This is why we read “He that loveth not, knoweth not God; for God is love.” He may know all about God and about love, he may be able to utter beautiful thoughts about it; but unless he loves, he does not know God. Only love can know God. The knowledge of God is life eternal, 62 The Inner Chamber God’s Word is the word of life. Out of the heart are the issues of life. The life may be strong, even where knowledge in the mind is feeble.", "source": "The Inner Life, Day 12"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Who is love? God. Who has loved us? God. What is love? God sending His Son as a propitiation.", "source": "The Christian (5): Notes from My Bible"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "In the Bible gold is always the symbol of the Divine nature, and the supreme thing in that nature is love. It is this same John who says: 'God is love' (1 John 4:8), and everything that is of God is measured according to the standard of Divine love.", "source": "The Holy City, New Jerusalem"}], "declarations": ["I declare: God is love, and I know Him because I love.", "I declare: Everything in my life is measured by the standard of divine love."], "prayer": "Lord Jesus, You are love itself. Teach me to love as You love, that I may truly know God. Let Your love flow through me today. Amen.", "theme_flag": null}, {"day": 346, "ref": "1 John 4:9", "book": "1 John", "chapter": 4, "verse": 9, "text": "In this was manifested the love of God toward us, because that God sent his only begotten Son into the world, that we might live through him.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "God, he has said, is love; and this love has been manifested towards us in that He has given His only Son, that we might live through Him.", "source": "Darby's Synopsis, 1 John chapter 4 section (local file)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "The characteristic of love is that it does not seek its own. Love finds its happiness in giving to others; it sacrifices itself entirely for others.", "source": "Andrew Murray, Daily in His Presence (goodreads.com/author/quotes/13326.Andrew_Murray)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Where is love manifested? In His sending of His Son into the world that we might have life and live through Him.", "source": "Watchman Nee, The Collected Works Set 1, Vol. 07: The Christian (5), ch 28 (bibleread.online)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "that eternal, mighty, mysterious love of God became fully embodied in the person of His Son.", "source": "T. Austin-Sparks, His Great Love, ch 1 (austin-sparks.net/m/Books-001268.html)"}], "declarations": ["I declare: God's love is manifested in sending His Son that I might live through Him.", "I declare: I live through Christ who was sent for me."], "prayer": "Father, thank You for manifesting Your love by sending Your only Son. I live through Him today. Let Your love be perfected in me. Amen.", "theme_flag": "theme-based: Sparks"}, {"day": 347, "ref": "1 John 4:19", "book": "1 John", "chapter": 4, "verse": 19, "text": "We love him, because he first loved us.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Love to * It is striking to see that he does not say, We ought to love Him because He first loved us; but, We love Him. We cannot know and enjoy love to us without loving. The sense of love to us is always love. It is not known and valued without its being there. My sense of love in another is love to him, We ought to love the brethren, because it is not their love to us which is the spring of it, though it may nourish it in this way. But we love God because He first loved us. sinners, communion, perfection before God, give us the © moral and characteristic elements of that love—what it is in our relationship with God.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "As the whole parable refers to the life His disciples should have in Him when ascended to heaven, the joy is that of His resurrection life. This is clear from those other words of His (John xvi. 22): ‘I will see you again, and your heart shall rejoice, and your joy shall no man take from you. It was only with the resurrection and its glory that the power of the never-changing life began, and only in it that the never-ceasing joy could have its rise. With it was fulfilled the word: ‘Therefore thy God hath anointed thee with the oil of gladness above thy fellows. The day of His crowning was the day of the gladness of His heart.", "source": "Abide in Christ, Day 22, 'And In His Love'"}, {"name": "Watchman Nee", "short": "Nee", "comment": "He loves first, and then we can love. Before He has loved, we cannot love.", "source": "The Gospel of God (1)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "'We love, because he first loved us.' That is the whole of John's argument in that letter.", "source": "His Great Love"}], "declarations": ["I declare: I love Him because He first loved me.", "I declare: My love for God is a response to His great love for me."], "prayer": "Lord Jesus, thank You for loving me first. Because You loved me, I can love You in return. Let my love for You grow today. Amen.", "theme_flag": "theme-based: Murray, theme-based: Nee"}, {"day": 348, "ref": "2 John 1:3", "book": "2 John", "chapter": 1, "verse": 3, "text": "Grace be with you, mercy, and peace, from God the Father, and from the Lord Jesus Christ, the Son of the Father, in truth and love.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Accordingly, they both (and the Second especially) lay stress on “ the truth.” The apostle loved this elect lady, “in the truth;” as did also all those who had known the truth, and that for the truth’s sake. He wished her blessing in truth and ~ in love. He rejoiced that he had found some who were her children walking in the truth. He desired there should be mutual love among Christians, but this was love, that they should keep the commandments; for many deceivers were come into the world. Now va soever transgressed, and did not abide in the doctrine of — Christ, had not God.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Just this makes gladness such a mighty element in the Christian character: there is no proof of the reality of God’s love and the blessing He bestows which men so soon feel the force of as when the joy of God overcomes all the trials of life. And for the Christian’s own welfare, joy is no less indispensable: the joy of the Lord is his strength; confidence, and courage, and patience find their inspiration in joy. With a heart full of joy no work can weary, and no burden can depress; God Him- self is strength and song. Let us hear what the Saviour says of the joy of abiding in Him. He promises us Mis own joy: ‘My joy.’", "source": "Abide in Christ"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Praise God, He is the Lawgiver on the Throne, and He is the Lawkeeper in my heart. He who gave the Law, Himself keeps it.", "source": "The Normal Christian Life"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "our very existence in relation to God is a love existence, a love relationship.", "source": "His Great Love"}], "declarations": ["I declare: Grace, mercy, and peace are mine from God the Father and the Lord Jesus Christ.", "I declare: I live in truth and love, kept by His grace."], "prayer": "Lord Jesus, thank You for grace, mercy, and peace from the Father and from You. Keep me in truth and love today. Amen.", "theme_flag": "theme-based: Murray, theme-based: Sparks, theme-based: Nee"}, {"day": 349, "ref": "3 John 1:11", "book": "3 John", "chapter": 1, "verse": 11, "text": "Beloved, follow not that which is evil, but that which is good. He that doeth good is of God: but he that doeth evil hath not seen God.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "The apostle had no greater joy than that of hearing that his children walked in the truth. In receiving those who went forth to preach the truth, they helped the truth itself; they were co-workers with it. Diotrephes would have nothing to do with this: he not only refused to receive these itinerant preachers, but excommunicated those who did _ so. He claimed authority for himself. The apostle would remember it. It was their duty to do good. He that doeth good is of God. He goes so far, with regard to the truth, as to say that the truth itself bore witness to Demetrius.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "With the spiritual eye he sees Christ every moment supplying grace for every breathing and every deepening of the spiritual life. His whole heart says Amen to the word: You can do nothing. And just because he does so, he can also say: \"I can do all things in Christ who strengtheneth me.\" The sense of helplessness, and the abiding to which it compels, leads to true fruitfulness and diligence in good works. Apart from me ye can do nothing.--What a plea and what a call every moment to abide in Christ! We have only to go back to the vine to see how true it is.", "source": "The True Vine, 'You Can Do Nothing'"}, {"name": "Watchman Nee", "short": "Nee", "comment": "However, after we are saved, the Lord will give us a new life, which will spontaneously do good.", "source": "The Christian (4): Gospel Messages"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Get the internal troubles settled, then you can get on with the work.", "source": "The Cross and the City of God"}], "declarations": ["I declare: I follow that which is good, for he that doeth good is of God.", "I declare: My good works flow from abiding in Christ."], "prayer": "Lord Jesus, help me to follow that which is good today. Let my works show that I am Yours. Settle my heart that I may do Your work. Amen.", "theme_flag": "theme-based: Murray, theme-based: Sparks, theme-based: Nee"}, {"day": 350, "ref": "Jude 1:24", "book": "Jude", "chapter": 1, "verse": 24, "text": "Now unto him that is able to keep you from falling, and to present you faultless before the presence of his glory with exceeding joy,", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Unto Him, he says, who is able to keep us from falling, and to present us unspotted before the presence of His glory with exceeding joy. It is important to observe the way in which the Spirit of God speaks, in the Epistles, of a power that can keep us from every fall, and unblamable; so that a thought only of sin is never excusable, It is not that the flesh is ' not in us, but that, with the Holy Ghost acting in the new man, it is never necessary that the flesh should act or influence our life. (Compare 1 Thess. v. 2 are united to Jesus: He represents us before God, He is our righteousness.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Even so now present your members as servants to righteousness unto sanctification.' -- Rom. 6:13,18,19 The word of Micah teaches us that the fruit of the salvation of God is seen chiefly in three things. The new life must be characterized, in my relation to God and His will, by righteousness and doing right; in my relation to my neighbour, by love and beneficence; in relation to myself, by humility and lowliness. For the present, we meditate on righteousness. Scripture teaches us that no man is righteous before God, or has any righteousness that can stand before God; (Ps. 14:3; 143:2; Rom.", "source": "The New Life, 'Stumblings'"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Jude 24 says that God is the One who is able to guard us from stumbling.", "source": "Conferences, Messages, and Fellowship (1): Overcomer Conference in Chuenchow, November 1935"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "All these passages and many others teach us that this work of establishing is a working principle. Today the Lord's people need establishing, for on every hand there is going on a great falling away because of the pressure of the enemy.", "source": "The Cross and the City of God"}], "declarations": ["I declare: Christ is able to keep me from falling.", "I declare: He will present me faultless before His glory with exceeding joy."], "prayer": "Lord Jesus, thank You that You are able to keep me from falling. Present me faultless before Your glory. I trust in Your keeping power today. Amen.", "theme_flag": null}, {"day": 351, "ref": "Jude 1:25", "book": "Jude", "chapter": 1, "verse": 25, "text": "To the only wise God our Saviour, be glory and majesty, dominion and power, both now and ever. Amen.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Unto Him, he says, who is able to keep us from falling, and to present us unspotted before the presence of His glory with exceeding joy. It is important to observe the way in which the Spirit of God speaks, in the Epistles, of a power that can keep us from every fall, and unblamable; so that a thought only of sin is never excusable, It is not that the flesh is ' not in us, but that, with the Holy Ghost acting in the new man, it is never necessary that the flesh should act or influence our life. (Compare 1 Thess. v. 2 are united to Jesus: He represents us before God, He is our righteousness.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "I go unto the Father. And whatsoever ye shall ask in my Name, that will I do, that the Father may be glorified in the Son.'--John xiv. 13. THAT the Father may be glorified in the Son: it is to this end that Jesus on His throne in glory will do all we ask in His Name. Every answer to prayer He gives will have this as its object: when there is no prospect of this object being obtained, He will not answer. It follows as a matter of course that this must be with us, as with Jesus, the essential element in our petitions: the glory of the Father must be the aim and end, the very soul and life of our prayer.", "source": "With Christ in the School of Prayer, Lesson 20, 'That the Father may be glorified'"}, {"name": "Watchman Nee", "short": "Nee", "comment": "All we have to do is praise and rejoice.", "source": "Conferences, Messages, and Fellowship (1): Overcomer Conference in Chuenchow, November 1935"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "The throne is central, and is the manifestation of the might of God in weakness. The 'Little Lamb' in the midst of the throne is greater than all the might of hell and sin.", "source": "The Cross and the City of God"}], "declarations": ["I declare: To the only wise God my Saviour be glory and majesty, dominion and power.", "I declare: Christ on the throne is greater than all the might of hell and sin."], "prayer": "Lord Jesus, to You be glory and majesty, dominion and power, both now and ever. You reign on the throne, greater than all. Amen.", "theme_flag": "theme-based: Murray, theme-based: Sparks, theme-based: Nee"}, {"day": 352, "ref": "Revelation 1:5", "book": "Revelation", "chapter": 1, "verse": 5, "text": "And from Jesus Christ, who is the faithful witness, and the first begotten of the dead, and the prince of the kings of the earth. Unto him that loved us, and washed us from our sins in his own blood,", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "He has made us kings and priests to God and His Father: to Him be glory! He loved us, has cleansed us, and given us a place with Himself.", "source": "Darby's Synopsis (public domain; local text), Revelation ch. 1"}, {"name": "Andrew Murray", "short": "Murray", "comment": "His blood is the sign, the measure, yes, the impartation of His love.", "source": "Andrew Murray, The Power of the Blood of Jesus, ch 10 'Heavenly Joy Through the Blood' (swartzentrover.com)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "The blood of His Son is still continually cleansing us.", "source": "Watchman Nee, The Collected Works, Set 1 Vol. 06: The Christian (4), ch. 11"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "The faithful Martyr, the One Who gave His life for His testimony, Who was faithful unto death in His witness.", "source": "T. Austin-Sparks, 'Jesus Christ, The Faithful Witness...' (austin-sparks.net/english/006323.html)"}], "declarations": ["I declare: Jesus Christ is the faithful witness who loved me and washed me from my sins.", "I declare: His blood is the proof and measure of His love for me."], "prayer": "Lord Jesus, faithful witness, thank You for loving me and washing me from my sins in Your own blood. I trust in Your faithful testimony today. Amen.", "theme_flag": null}, {"day": 353, "ref": "Revelation 1:8", "book": "Revelation", "chapter": 1, "verse": 8, "text": "I am Alpha and Omega, the beginning and the ending, saith the Lord, which is, and which was, and which is to come, the Almighty.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "We find thus in the Revelati God’s whole history of the world, or of what is of in it, from the first decay of the Church to the Dew heavens and new earth. But it was impossible for God to set aside the present expectation of prist, or to justify the Church in its careless but sinful thought, My Lord delayeth His coming. Hence, as always, this history, and especially that of the Church, is given in a way which leaves time out altogether. 1 he moral progress of the Church is given in pictures of the state of existing churches selected for that purpose, beginning with its first decline, and ending with its entire rejection.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "And ask then confidently that the Son may be glorified in you. This is praying in the Name, in the very words, in the Spirit of Jesus, in union with Jesus Himself. Such prayer has power. If with Jesus you glorify the Father, the Father will glorify Jesus by doing what you ask in His Name. It is only when your own personal relation on this point, like Christ's, is clear with God, when you are glorifying Him, and seeking all for His glory, that like Christ, you will have power to intercede for those around you. Our Lord next prays for the circle of His disciples. He speaks of them as those whom the Father has given Him.", "source": "With Christ in the School of Prayer"}, {"name": "Watchman Nee", "short": "Nee", "comment": "The Lord’s name is Alpha and Omega. Alpha refers to the beginning, whereas Omega refers to the end.", "source": "Conferences, Messages, and Fellowship (1): Overcomer Conference in Chuenchow, November 1935"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "When Jesus says: 'I am Alpha and Omega', He is saying: 'I am all you need.'", "source": "The Alpha and the Omega"}], "declarations": ["I declare: Christ is the Alpha and Omega, the Almighty who is to come.", "I declare: Jesus is all I need, from beginning to end."], "prayer": "Lord Jesus, You are the Alpha and Omega, the Almighty. You are all I need. I trust in You from the beginning to the end. Amen.", "theme_flag": "theme-based: Murray"}, {"day": 354, "ref": "Revelation 1:17", "book": "Revelation", "chapter": 1, "verse": 17, "text": "And when I saw him, I fell at his feet as dead. And he laid his right hand upon me, saying unto me, Fear not; I am the first and the last:", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "John (as ever in prophetic vision of Jehovah, for it is not the Spirit of adoption here) falls at His feet as one dead. So Daniel; so in spirit Isaiah (chap. 6); but His power sustains the saint, does not destroy him. He lays His right hand on John himself, declares Himself the first and the last, Jehovah Himself, but withal the same that died in love and has complete power over death and hades; the deliverer from it, not the subjecter to it.", "source": "Darby's Synopsis (public domain; local text), Revelation ch. 1"}, {"name": "Andrew Murray", "short": "Murray", "comment": "It is perfect love, it is to be in this world even as He is, that casts out fear, and gives us boldness in the day of judgment.", "source": "Andrew Murray, Be Perfect, Day 31 'Perfect Love: Casting Out Fear' (biblestudytools.com/classics/murray-be-perfect/perfect-love-casting-out-fear.html)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Oh, how loving this is! Although He is in glory, His love has not diminished.", "source": "Watchman Nee, The Collected Works, Set 1 Vol. 16: Study on Revelation, ch. 2"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "That phrase and designation, 'The first and the last, the beginning and the end', is the thing that will govern our meditation for a little while.", "source": "T. Austin-Sparks, The Throne of God and of the Lamb, ch 1 'Jesus Christ, the First and the Last' (austin-sparks.net/m/Books-006087.html)"}], "declarations": ["I declare: I fear not, for Christ is the first and the last.", "I declare: His perfect love casts out all fear from my heart."], "prayer": "Lord Jesus, when I fall at Your feet, You lay Your right hand on me and say, Fear not. Let Your perfect love cast out my fear today. Amen.", "theme_flag": "theme-based: Murray"}, {"day": 355, "ref": "Revelation 1:18", "book": "Revelation", "chapter": 1, "verse": 18, "text": "I am he that liveth, and was dead; and, behold, I am alive for evermore, Amen; and have the keys of hell and of death.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "He has made us kings and priests to God and His Father: to Him be glory! Such is the saint’s thought when He is spoken of. He loved us, has cleansed us, and given us a place with Himself. This flows out the instant He is named. It is the answer of heart-when he is announced, before ‘ any communications take place. His having done this is not announced ; it is the saint’s own consciousness. As to others, all must be told. The next point, the first announced, is His appearing to the world. No direct communication to the Church for its own sakethe book is not that. Here the Church has that in its own consciousness only, as we have seen. Behold!", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "They did not know that He was alive, and that is the state of very many Christians. They look to the Cross, and they struggle to trust Christ, but they have never yet learned the blessedness of believing that there is a living Christ to do everything for them. Oh! that word of the angel to the women! \"Why seek ye the living among the dead?\" What is the difference between a dead Christ, whom the women went to anoint, and a living Christ? A dead Christ, I must do everything for; a living Christ does everything for me. The disciples began the morning with a sad heart. I fancy very possibly they spent a sleepless night.", "source": "Jesus Himself"}, {"name": "Watchman Nee", "short": "Nee", "comment": "We should know that Christ has resurrected and that His resurrection remains until today.", "source": "The Christian (4): Spiritual Teachings"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "The Lord Jesus here presents Himself as 'the Living One', Who was dead, and is alive again - alive for evermore (Rev. 1:18).", "source": "The Alpha and the Omega"}], "declarations": ["I declare: Christ is the Living One who was dead and is alive for evermore.", "I declare: A living Christ does everything for me."], "prayer": "Lord Jesus, You are the Living One, alive for evermore. You hold the keys of death. I trust in Your living power today. Amen.", "theme_flag": "theme-based: Murray"}, {"day": 356, "ref": "Revelation 2:10", "book": "Revelation", "chapter": 2, "verse": 10, "text": "Fear none of those things which thou shalt suffer: behold, the devil shall cast some of you into prison, that ye may be tried; and ye shall have tribulation ten days: be thou faithful unto death, and I will give thee a crown of life.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Let the saints only be faithful to the extreme point of his power; all beyond was beyond him, was Christ's; and the faithful one would receive from Him the crown of life.", "source": "Darby's Synopsis (public domain; local text), Revelation ch. 2"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Christ in us as our life and our strength. That is the crown of all.", "source": "Andrew Murray, 'Christ Our Life' (via simplykatherine.com)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "As to our attitude, we must be faithful even unto death; as to time, we must be faithful until death.", "source": "Watchman Nee, The Collected Works, Set 3 Vol. 47: The Orthodoxy of the Church, ch. 6 (bibleread.online)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "What is meant by 'crown' is the sealing of a course in triumph, with honour, with exaltation, the crown being the symbol both of victory and victorious honour.", "source": "T. Austin-Sparks, 'Crowning in Relation to an Ordeal' (austin-sparks.net/m/000647.html)"}], "declarations": ["I declare: I will be faithful unto death, and Christ will give me a crown of life.", "I declare: Christ in me is my life and strength, the crown of all."], "prayer": "Lord Jesus, help me to be faithful unto death. I fear none of the things I may suffer, for You will give me the crown of life. Amen.", "theme_flag": "theme-based: Murray, theme-based: Nee"}, {"day": 357, "ref": "Revelation 3:21", "book": "Revelation", "chapter": 3, "verse": 21, "text": "To him that overcometh will I grant to sit with me in my throne, even as I also overcame, and am set down with my Father in his throne.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "We have not Him, bere as Head of the one body, nor even as heavenly Intercessor; nor have we the Christ, of course, i.e., the Jewish character of the Lord. It will be found that these are just the characters of Christ omitted also in the first chapter of John’s Gospel. He sees Him in the wide character in which He is set over all the works of God’s hands, and Heir of all promises and purposes of God to man - according to divine righteousness. He is not the Son of man in service. His garment is down to His feet, - and He has the girdle of divine righteousness about His loins. This is His character. We have then His qualities or attributes.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "All the glorious promises which each of these Epistles contain, down to the last one, with its \"Open the door and I will come in\"; \"He that overcometh shall sit with Me on My throne,\" are dependent on that one word--Repent! And if there is to be a revival, not among the unsaved, but in our churches, to give a holy, spiritual membership, will not that trumpet sound need to be heard--Repent? Was it only in Israel, in the ministry of kings and prophets, that there was so much evil in God's people to be cleansed away? Was it only in the Church of the first century, that Paul and James and our Lord Himself had to speak such sharp words?", "source": "The Ministry of Intercession, 'The Coming Revival'"}, {"name": "Watchman Nee", "short": "Nee", "comment": "If there are those who will be the overcomers, God's purpose is attained and He is satisfied.", "source": "The Glorious Church"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Overcomers are just those among the Lord's people who are living in the good of His resurrection.", "source": "The Throne of God and of the Lamb"}], "declarations": ["I declare: I am an overcomer, and Christ grants me to sit with Him in His throne.", "I declare: I live in the good of His resurrection today."], "prayer": "Lord Jesus, thank You for overcoming and granting me a place with You on Your throne. Make me an overcomer who lives in Your resurrection power. Amen.", "theme_flag": "theme-based: Sparks"}, {"day": 358, "ref": "Revelation 5:5", "book": "Revelation", "chapter": 5, "verse": 5, "text": "And one of the elders saith unto me, Weep not: behold, the Lion of the tribe of Juda, the Root of David, hath prevailed to open the book, and to loose the seven seals thereof.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "The elders explained to the prophet who mourned that the ways of God should be shut up, that the mighty One of Judah, the true source of all promises to David, had prevailed to open it and loose the seals.", "source": "Darby's Synopsis (public domain; local text), Revelation ch. 5"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Through death he has destroyed him that had the power of death, that is the devil.", "source": "Andrew Murray, The Power of the Blood of Jesus, ch 9 'Victory Through the Blood' (articles.ochristian.com/article1829.shtml)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "He warred against Satan in order to gain the victory.", "source": "Watchman Nee, Sit, Walk, Stand, “Stand”"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "It is the Lamb, the Lamb has overcome. Worthy is the Lamb! Why? Because of righteousness.", "source": "T. Austin-Sparks, 'Jesus Christ, The Faithful Witness...' (austin-sparks.net/english/006323.html)"}], "declarations": ["I declare: The Lion of the tribe of Juda has prevailed for me.", "I declare: The Lamb has overcome; worthy is the Lamb."], "prayer": "Lord Jesus, Lion of Judah and Lamb who was slain, You have prevailed. Through Your death You destroyed the devil. I worship You today. Amen.", "theme_flag": "theme-based: Murray, theme-based: Nee"}, {"day": 359, "ref": "Revelation 5:12", "book": "Revelation", "chapter": 5, "verse": 12, "text": "Saying with a loud voice, Worthy is the Lamb that was slain to receive power, and riches, and wisdom, and strength, and honour, and glory, and blessing.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "What seemed His dishonour and rejection on earth was the ground of His worthiness to take the book. He who at all suffering and cost to Himself had glorified all that God was, was able and worthy to unfold what made it good in the way of government.", "source": "Darby's Synopsis (public domain; local text), Revelation ch. 5"}, {"name": "Andrew Murray", "short": "Murray", "comment": "It is as the slain Lamb, that the Lord Jesus is in the midst of the throne, as a Lamb whose blood had been shed. As such, He is the object of the worship of the redeemed.", "source": "Andrew Murray, The Power of the Blood of Jesus, ch 10 (swartzentrover.com)"}, {"name": "Watchman Nee", "short": "Nee", "comment": "At that time we will also praise the Lord forever because of His cross.", "source": "Watchman Nee, The Collected Works, Set 1 Vol. 06: The Christian (4), ch. 11"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "God created, the Lamb redeemed. God gets His place and rights by reason of the blood of the Lamb.", "source": "T. Austin-Sparks, 'The Throne of God and of the Lamb' (austin-sparks.net/m/Books-006087.html)"}], "declarations": ["I declare: Worthy is the Lamb that was slain to receive all power and glory.", "I declare: I worship the Lamb in the midst of the throne."], "prayer": "Lord Jesus, worthy are You, the Lamb that was slain. Receive power and riches and wisdom and strength and honour and glory and blessing. I worship You. Amen.", "theme_flag": null}, {"day": 360, "ref": "Revelation 7:17", "book": "Revelation", "chapter": 7, "verse": 17, "text": "For the Lamb which is in the midst of the throne shall feed them, and shall lead them unto living fountains of waters: and God shall wipe away all tears from their eyes.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "The Lamb, as known in this transitional time, but exalted in the throne, would feed them, and lead them to living fountains of water, It is not, as to us, the promise of a well of water, springing up into everlasting life, and flowing out as a river; but they would be fed, refreshed, and perfectly cared for by the Lamb’s grace, whom they had followed ; and God Himself would wipe all tears from their eyes. They would have the consolations of God, worth all the sorrow they had passed through. But their blessings are consolations, not proper heavenly joy.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "The experiences do not last, and the heart is so changeable. Oh come, my beloved! Follow Christ. Say, \"Jesus, reveal Thyself that we may know Thee Thyself. We ask not only to drink of the living water, we want the fountain. We ask not only to bathe ourselves in the light, we want the Sun of Righteousness within our hearts. We ask not only to know Thee, who hast touched us and warmed our hearts and blessed us, but we want to know that we have the unchangeable Jesus dwelling within our hearts and abiding with us forevermore.\"", "source": "Jesus Himself"}, {"name": "Watchman Nee", "short": "Nee", "comment": "God leads us to His presence, and the Lamb shepherds us.", "source": "General Messages (1)"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "'The Lord is my Shepherd just like that; He is my Shepherd. All that I would do for my natural sheep, He will do for His spiritual sheep.'", "source": "Written Not With Ink"}], "declarations": ["I declare: The Lamb in the midst of the throne feeds me and leads me to living waters.", "I declare: The Lord is my Shepherd; I shall not want."], "prayer": "Lord Jesus, my Shepherd, feed me and lead me unto living fountains of waters. Wipe away my tears. I follow You today. Amen.", "theme_flag": "theme-based: Murray, theme-based: Sparks"}, {"day": 361, "ref": "Revelation 19:16", "book": "Revelation", "chapter": 19, "verse": 16, "text": "And he hath on his vesture and on his thigh a name written, KING OF KINGS, AND LORD OF LORDS.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Judgment refers to these, and to ourselves. XIX. treads the wine-press too.* This is the part that is earthly, as Isaiah lxiii. shews, So He that sits on the cloud thrusts in His sickle on the earth. It was an angel who cast the grapes into the wine-press, and the wine-press was trodden}+—it is not said, as by one sitting on the cloud. The character of the judgment of the beast and the false prophet is heavenly—it is the Word of God, the Lord from heaven; the wine-press, earthly. — He is publicly, officially, and intrinsically King of kings, and Lord of lords.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "There is sometimes a danger of separating them. It is always easier to be engaged with the religion of the past or the future than to be faithful in the religion of today. As we look to what God has done in the past, or will do in time to come, the personal claim of present duty and present submission to His working may be escaped. Waiting on God must ever lead to waiting for Christ as the glorious con- summation of His work; and waiting for Christ, must ever remind us of the duty of waiting upon God as our only proof that the waiting for Christ is in spirit and in truth.", "source": "Waiting on God, Day 28, 'For the Coming of His Son'"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Our Lord is the King of kings, and we are these kings.", "source": "Study on Revelation"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "virtually and ultimately, all this has got to reckon with Him.", "source": "'Jesus Christ, The Faithful Witness...'"}], "declarations": ["I declare: Christ is KING OF KINGS AND LORD OF LORDS.", "I declare: All things must reckon with Him who reigns."], "prayer": "Lord Jesus, King of kings and Lord of lords, I bow before You. All things must reckon with You. Reign in my life today. Amen.", "theme_flag": "theme-based: Murray"}, {"day": 362, "ref": "Revelation 21:4", "book": "Revelation", "chapter": 21, "verse": 4, "text": "And God shall wipe away all tears from their eyes; and there shall be no more death, neither sorrow, nor crying, neither shall there be any more pain: for the former things are passed away.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "The saints had long before passed out of them ; but they subsisted in the wicked. Now these were, consequent on the judgment of the white throne, cast into the lake of fire—the second death. The limits and measure of escape was the book of life. But there was a new heaven and a new earth; but no more sea—no separation, nor part of the world not brought into an ordered earth before God. Here we do not find any mediatorial kingdom. The Lamb is not in the scene, God is all in all. No sorrow or crying more, no earthly people of God distinct from the inhabiters of the earth.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "God is light. God is a sun. Paul says: “God hath shined in our hearts to give the light.” What light? “The light of the glory of God, in the face of Jesus Christ.” Just as the sun shines its beautiful, life-giving light on and into our earth, so God shines into our hearts the light of His glory, of His iove, in Christ His Son. Our heart is meant to have that light fill- ing and gladdening it all the day. It can have it because God is our sun, and it is written, “Thy sun shall no more go down forever.” God’s love shines on us without ceasing. But can we indeed enjoy it all the day? We can. And how can we? Let nature give us the answer.", "source": "Waiting on God, Day 16, 'For His Light in the Heart'"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Therefore, when these things are wiped away, there will no longer be any trace of sin.", "source": "Study on Revelation"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "It is the whole question of Life gaining the mastery, triumphing, overcoming through the blood of the Lamb and issuing in this glorious thing at the end - Life everywhere and death no more.", "source": "The Throne of God and of the Lamb"}], "declarations": ["I declare: There shall be no more death, for Life has gained the mastery through the Lamb.", "I declare: God wipes away my tears; sorrow and pain are passing away."], "prayer": "Lord Jesus, thank You that death is defeated and Life reigns. Wipe away my tears. Let Your life fill my heart today. Amen.", "theme_flag": "theme-based: Murray, theme-based: Sparks"}, {"day": 363, "ref": "Revelation 22:12", "book": "Revelation", "chapter": 22, "verse": 12, "text": "And, behold, I come quickly; and my reward is with me, to give every man according as his work shall be.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "When it closed its testimony, men would remain in the same state for judgment or blessing. And Christ would quickly come, and every man receive as his work was. Verse 7 was a warning, in form of blessing, to those in the circumstances referred to, to keep the sayings of the book, but this verse 12 is the record of Christ’s coming to the general judgment of the quick. Finally, Christ announces Himself, having taken up the word in person in verse 12, as Alpha and Omega, the beginning and the end—God before and after all, and filling duration.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "There is sometimes a danger of separating them. It is always easier to be engaged with the religion of the past or the future than to be faithful in the religion of today. As we look to what God has done in the past, or will do in time to come, the personal claim of present duty and present submission to His working may be escaped. Waiting on God must ever lead to waiting for Christ as the glorious con- summation of His work; and waiting for Christ, must ever remind us of the duty of waiting upon God as our only proof that the waiting for Christ is in spirit and in truth.", "source": "Waiting on God, Day 28, 'For the Coming of His Son'"}, {"name": "Watchman Nee", "short": "Nee", "comment": "The reward will be given according to man’s deeds.", "source": "Study on Revelation"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "It is the battle of righteousness fought through, the course of righteousness completed, the deposit of righteousness preserved intact, and God crowns that at the end; He gives the seal and the mark of approval, the crown of righteousness.", "source": "'Crowning in Relation to an Ordeal'"}], "declarations": ["I declare: Christ comes quickly, and His reward is with Him.", "I declare: I run the race of righteousness, and God will crown me at the end."], "prayer": "Lord Jesus, You come quickly with Your reward. Help me to be faithful, that I may receive the crown of righteousness. Come, Lord Jesus. Amen.", "theme_flag": "theme-based: Sparks"}, {"day": 364, "ref": "Revelation 22:13", "book": "Revelation", "chapter": 22, "verse": 13, "text": "I am Alpha and Omega, the beginning and the end, the first and the last.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "And then, with the salutation of grace, the book closes, leaving the promise and the desire as the last words of Jesus on the heart. Let the reader note here that, in the biegitinixigh and end of the book, before and after the prophetic statements, we have, in a beautiful way, the conscious position of the saints. The first at the opening of the whole book giving the individual conscious blessing, the latter the whole position of the Church, thus distinguishing clearly the saints under the gospel from those whose circumstances are prophetically made known to them in this book.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "“But they that wait on the Lord,” on the Everlasting One, who fainteth not, neither is weary, they “shall renew their strength; they shall mount up with wings as eagles; they shall run, and’—listen now, they shall be strong with the strength of God, even as He shall “not be weary; and they shall walk, and,” even as He, “not faint.” Yes, “they shall mount up with wings as eagles.” You know what eagles’ wings mean. The eagle is the king of birds, it soars the high- est into the Heavens. Believers are to live a heavenly life, in the very presence and love and joy of God. They are to live where God lives; they need God’s strength to rise there.", "source": "Waiting on God, Day 21, 'The Almighty One'"}, {"name": "Watchman Nee", "short": "Nee", "comment": "He is the beginning of everything and the end to everything.", "source": "Conferences, Messages, and Fellowship (1): Overcomer Conference in Chuenchow, November 1935"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "No situation can arise that exhausts Me: in Me all the fullness dwells. I am Alpha and Omega.", "source": "The Alpha and the Omega"}], "declarations": ["I declare: Christ is the Alpha and Omega, the Everlasting One who never faints.", "I declare: In Him all fullness dwells; no situation exhausts Him."], "prayer": "Lord Jesus, You are the Alpha and Omega, the Everlasting One. In You all fullness dwells. I trust in Your unfailing strength today. Amen.", "theme_flag": "theme-based: Murray"}, {"day": 365, "ref": "Revelation 22:20", "book": "Revelation", "chapter": 22, "verse": 20, "text": "He which testifieth these things saith, Surely I come quickly. Amen. Even so, come, Lord Jesus.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "We have not Him, bere as Head of the one body, nor even as heavenly Intercessor; nor have we the Christ, of course, i.e., the Jewish character of the Lord. It will be found that these are just the characters of Christ omitted also in the first chapter of John’s Gospel. He sees Him in the wide character in which He is set over all the works of God’s hands, and Heir of all promises and purposes of God to man - according to divine righteousness. He is not the Son of man in service. His garment is down to His feet, - and He has the girdle of divine righteousness about His loins. This is His character. We have then His qualities or attributes.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "It is in waiting upon God that our eyes are opened to believe in His wise and sovereign will, and to see that the sooner and the more completely we yield absolutely to it, the more surely His blessing can come to us. “Tt is not of him that willeth, nor of him that runneth, but of God that showeth mercy.” We have as little power to increase or strengthen our spiritual life, as we had to originate it. We “were born not of the will of the flesh, nor of the will of man, but of the will of God.” Even so, our willing and running, our desire and ef- fort, avail nought; all is “of God that showeth mercy.”", "source": "Waiting on God, Day 28"}, {"name": "Watchman Nee", "short": "Nee", "comment": "The very last prayer in the Bible is 'Come, Lord Jesus!' This prayer will eventually be answered one day.", "source": "Study on Revelation"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "We can talk about the Lord's coming when we can say our love aboundeth, overfloweth.", "source": "'Abounding in Love'"}], "declarations": ["I declare: Surely Christ comes quickly; even so, come, Lord Jesus.", "I declare: I wait for, long for, and love the appearing of my Lord."], "prayer": "Lord Jesus, surely You come quickly. Even so, come. Let my love abound and overflow as I wait for You. Amen.", "theme_flag": "theme-based: Sparks"}];
var INIT = {day: 1};
try {
  var q = new URLSearchParams(location.search).get("day");
  if (q) { var n = parseInt(q, 10); if (n >= 1 && n <= 365) INIT.day = n; }
  else {
    var now = new Date(), start = new Date(now.getFullYear(), 0, 0);
    INIT.day = Math.min(365, Math.floor((now - start) / 864e5));
  }
} catch (e) {}
function pad(n){ return (n < 10 ? "00" : n < 100 ? "0" : "") + n; }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function initials(name){
  var p = name.replace(/^T\. /,"").split(" ");
  return (p[0][0] + (p[1] ? p[1][0] : "")).toUpperCase();
}
var MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
function dateLabel(day){
  var d = new Date(2025, 0, day);
  var n = d.getDate();
  var sfx = (n % 10 === 1 && n % 100 !== 11) ? "st" : (n % 10 === 2 && n % 100 !== 12) ? "nd" : (n % 10 === 3 && n % 100 !== 13) ? "rd" : "th";
  return MONTHS[d.getMonth()] + " " + n + sfx;
}
function render(day){
  var d = DEVOTIONALS[day - 1];
  document.getElementById("topTitle").textContent = dateLabel(day).toUpperCase();
  document.getElementById("dayline").textContent = dateLabel(day).toUpperCase();
  document.getElementById("dimg").src = "read-images/day-" + pad(day) + ".webp";
  document.getElementById("verse").textContent = "\u201C" + d.text + "\u201D";
  document.getElementById("vref").textContent = d.ref + " (KJV)";
  var ch = "";
  d.witnesses.forEach(function(w){
    var longDM = (w.short === "Darby" || w.short === "Murray") && w.comment.length > 300;
    var tx = esc(w.comment);
    if(longDM){
      var cut = w.comment.lastIndexOf(" ", 260);
      if(cut < 120) cut = 260;
      tx = esc(w.comment.slice(0, cut)) + '<span class="ell">&hellip;</span><span class="more">' + esc(w.comment.slice(cut)) + '</span>';
    }
    ch += '<div class="cmt"><div class="ava">' + esc(initials(w.short === "Sparks" ? "Austin Sparks" : w.name)) + '</div>'
      + '<div class="bub"><div class="nm">' + esc(w.name) + '</div><div class="tx">' + tx + '</div>'
      + (longDM ? '<button class="rmore" type="button">Read more</button>' : '')
      + '<div class="src">' + esc(w.source) + '</div>'
      + '</div></div>';
  });
  document.getElementById("comments").innerHTML = ch;
  var dh = "";
  d.declarations.forEach(function(x){
    dh += '<div class="decl">' + esc(x).replace(/^I declare:/, "<b>I declare:</b>") + '</div>';
  });
  document.getElementById("decls").innerHTML = dh;
  document.getElementById("prayer").textContent = d.prayer;
  try { history.replaceState(null, "", "?day=" + day); } catch (e) {}
  window.scrollTo(0, 0);
  cur = day;
}
var cur = INIT.day;
document.getElementById("prevBtn").addEventListener("click", function(){ render(cur <= 1 ? 365 : cur - 1); });
document.getElementById("nextBtn").addEventListener("click", function(){ render(cur >= 365 ? 1 : cur + 1); });
document.getElementById("shareBtn").addEventListener("click", function(){
  var p = String(cur).padStart(3, "0");
  var u = "https://joelquan.github.io/verseriver/days/day-" + p + ".html";
  var b = document.getElementById("shareBtn");
  function done(){ b.textContent = "Link copied"; setTimeout(function(){ b.textContent = "Share this day"; }, 2000); }
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(u).then(done, function(){ prompt("Copy this link:", u); });
  else prompt("Copy this link:", u);
});
document.getElementById("comments").addEventListener("click", function(e){
  var b = e.target && e.target.closest ? e.target.closest(".rmore") : null;
  if(!b) return;
  var tx = b.parentNode.querySelector(".tx");
  if(!tx) return;
  var open = tx.classList.toggle("open");
  b.textContent = open ? "Read less" : "Read more";
});
render(cur);
</script>
</body>
</html>
