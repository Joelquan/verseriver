 to what is ahead."], "prayer": "Lord Jesus, I press on toward the prize. Keep my eyes on the high calling You have for me. Amen.", "theme_flag": "theme-based: Murray"}, {"day": 273, "ref": "Philippians 4:4", "book": "Philippians", "chapter": 4, "verse": 4, "text": "Rejoice in the Lord alway: and again I say, Rejoice.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "In trouble we shall have the peace of God; in our ordinary life, if it be of this nature, wo shall have the God of peace. Paul was the practical example of this; with regard to their walk, by following him in that which they had leamt and heard from him and seen in him, they should find that God was with them. Nevertheless, although such was his experience, he rejoiced greatly that their loving care of him had flourished again. He could indeed take refuge in God; but it was sweet to him in the Lord to have this testimony on their part. It is evident that he had been in need; but it was the occasion of more entire trust in God.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "3. Understand this saying: He that seeks gladness shall not find it; he that seeks the Lord and His will, shall find gladness unsought.' Think over this. He that seeks gladness as a thing of feeling, seeks himself: he would fain be happy: he will not find it. He that forgets himself to live in the Lord and His will, shall be taught of himself to rejoice in the Lord. It is God, God Himself, who is the God of the gladness of our rejoicing: seek God, and you have gladness. You have then simply to take and enjoy it by faith.", "source": "The New Life \"Light and Joyfulness\""}, {"name": "Watchman Nee", "short": "Nee", "comment": "Let us rejoice that Jesus is on the throne, and let us praise Him that, since He has been glorified, the Spirit has been poured out upon us all.", "source": "\"The Diversity Of The Experience.\""}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "When you realise that this is one of the last things from his pen, and that through this short letter the one throbbing note is: 'Rejoice in the Lord,' rejoice, rejoice. You say: There is something behind these words!", "source": "The Excellency of the Knowledge of Christ"}], "declarations": ["I declare: I rejoice in the Lord always.", "I declare: my joy is in Christ, and nothing can take it."], "prayer": "Lord Jesus, You are my joy. I rejoice in You today and always. Amen.", "theme_flag": "theme-based: Nee"}, {"day": 274, "ref": "Philippians 4:6", "book": "Philippians", "chapter": 4, "verse": 6, "text": "Be careful for nothing; but in every thing by prayer and supplication with thanksgiving let your requests be made known unto God.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "In all things therefore, instead of disquieting ourselves and weighing everything in our own hearts, we ought to present our requests to God with prayer, with supplication, with a heart that makes itself known (for we are human beings) but with the knowledge of the heart of God (for He loves ns perfectly); so that, even while making our petition to Him, we can already give thanks, because we are sure of the answer of His grace, be it what it may; and it is our requests that we are to present to Him. Nor is it a cold commandment to find out His will and then come: we are to go with our requests.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Believe that ye have received.' It is clear that what we are to believe is, that we receive the very things we ask. The Saviour does not hint that because the Father knows what is best He may give us something else. The very mountain faith bids depart is cast into the sea. There is a prayer in which, in everything, we make known our requests with prayer and supplication, and the reward is the sweet peace of God keeping heart and mind. This is the prayer of trust. It has reference to things of which we cannot find out if God is going to give them.", "source": "With Christ in the School of Prayer \"Believe that Ye Have Received\""}, {"name": "Watchman Nee", "short": "Nee", "comment": "The vast majority are weighed down with many worries. Let us clearly see, though, that the Bible states categorically: 'In nothing be anxious', period!", "source": "daily devotional on Phil 4:6-7"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "When He says, 'In nothing be anxious' (Phil. 4:6), or 'casting all your anxiety upon him,' the Lord does not mean that you are to become careless, indifferent, to put the matter away as though it is nothing to do with you.", "source": "\"Resting in the Lord's Care\""}], "declarations": ["I declare: I am anxious for nothing; in everything I pray with thanksgiving.", "I declare: I make my requests known to God, and He hears me."], "prayer": "Lord Jesus, I bring every care to You with thanksgiving. Thank You for hearing my prayers. Amen.", "theme_flag": null}, {"day": 275, "ref": "Philippians 4:7", "book": "Philippians", "chapter": 4, "verse": 7, "text": "And the peace of God, which passeth all understanding, shall keep your hearts and minds through Christ Jesus.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "This is trust; and His peace, the peace of God Himself, shall keep our hearts. It does not say that our hearts shall keep the peace of God; but, having cast our burden on Him whose peace nothing can disturb, His peace keeps our hearts. Our trouble is before Him, and the constant peace of the God of love, who takes charge of everything and knows all beforehand, quiets our disburdened hearts, and imparts to us the peace which is in Himself and which is above all understanding (or at least keeps our hearts by it), even as He Himself is above all the circumstances that can disquiet us, and above the poor human heart that is troubled by them.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Be of good courage, only believe ; fear not to take the irrevocable step, and to say that thou hast once for all given up self to the death for which it has been crucified in Christ (Rom. vi. 6). And trust Jesus the Crucified One to hold self to the cross, and to fill its place in thee with His own blessed resurrection life, In this faith, abide in Christ! Cling to Him; rest on Him; hope on Him Daily renew thy consecration; daily accept afresh thy position as ransomed from thy tyrant, and now in turn made a conqueror.", "source": "Abide in Christ \"And You Shall Find Rest to Your Souls\""}, {"name": "Watchman Nee", "short": "Nee", "comment": "'The peace of God' is not just a certain kind of peace that God bestows upon us. It is God's own peace, the very peace which is inherent in his nature.", "source": "\"The Peace of God,\""}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "'The peace of God shall garrison your... mind.' Thus, in the matter of the mind an intense warfare is clearly revealed as going on, and cleaving, captivating and defensive forces are needed.", "source": "\"The Cross and the Deliverance of the Mind\""}], "declarations": ["I declare: the peace of God, which passes all understanding, keeps my heart and mind.", "I declare: I rest in His peace through Christ Jesus."], "prayer": "Lord Jesus, Your peace guards my heart and mind. I rest in You, untroubled and unafraid. Amen.", "theme_flag": null}, {"day": 276, "ref": "Philippians 4:13", "book": "Philippians", "chapter": 4, "verse": 13, "text": "I can do all things through Christ which strengtheneth me.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "It is not “ I can do all things,\" but “ I can do all through him who strengtheneth me. It is a strength which continually flows from a relationship with Christ, a connection with Him maintained in the heart. Neither is it only “ one can do all things.” This is true; but Paul had learnt it practically. He knew what he could be assured of and reckon on—what ground he stood on. Christ had always been faithful to him, had brought him through so many difficulties and through so many seasons of prosperity, that he had learnt to trust in Him, and not in circumstances. And Christ was the same ever.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "It was a setting forth of how Jesus can keep from sin a man with a sinful nature. The light shone into his heart. He who had always been counted a tender Christian came into touch now with a new experience of what Christ is willing to do for one who gives himself entirely to Him. Listen to what he says on the text: “I can do all things through Christ who strengtheneth me.” “I dare to say that it is possible for those who really are willing to reckon on the power of the Lord, for keeping and victory, to lead a life in which His promises are taken as they stand, and are found to be true.", "source": "The Prayer Life \"The Blessing of Victory; The More Abundant Life\""}, {"name": "Watchman Nee", "short": "Nee", "comment": "It is Christ who now fulfills them; it is Christ who works in me what is well-pleasing to God.", "source": "NCL"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "If there is one statement in Scripture that finds us out, it is this one. It was Paul who said it; but I wonder how many of us could say it, with the same positive affirmation?", "source": "\"I Have Learned... I Know... I Can Do... Through Christ\""}], "declarations": ["I declare: I can do all things through Christ who strengthens me.", "I declare: His strength in me is enough for every task."], "prayer": "Lord Jesus, strengthen me for everything You call me to do. In You I can do all things. Amen.", "theme_flag": "theme-based: Nee"}, {"day": 277, "ref": "Philippians 4:19", "book": "Philippians", "chapter": 4, "verse": 19, "text": "But my God shall supply all your need according to his riches in glory by Christ Jesus.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "His heart rested in God; his assurance with regard to the Philippians expresses it. My God, he says, shall richly supply all your need. He does not express a wish that God may do so. He had leamt what his God was by his own experience. My God, he says, He whom I have learnt to know in all the circumstances through which I have passed, shall fill vou with all good things. And here he returns to His character as he had known Him. God would do it according to His riches in glory in Christ Jesus. There he had learnt to know Him at the beginning; and such he had known Him all along his varied path, so full of trials here and of joys from above.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Dwell much in the inner chamber, with the door shut--shut in from men, shut up with God; it is there the Father waits you, it is there Jesus will teach you to pray. To be alone in secret with THE FATHER: this be your highest joy. To be assured that THE FATHER will openly reward the secret prayer, so that it cannot remain unblessed: this be your strength day by day. And to know that THE FATHER knows that you need what you ask; this be your liberty to bring every need, in the assurance that your God will supply it according to His riches in Glory in Christ Jesus.", "source": "With Christ in the School of Prayer \"Pray to Thy Father, Which is in Secret\""}, {"name": "Watchman Nee", "short": "Nee", "comment": "He who sees in secret will take note of our needs, and He will meet them, not in stinted measure, but 'according to His riches in glory by Christ Jesus'.", "source": "A Table in the Wilderness"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "'In Christ Jesus' always means that it is for us. All our needs are met by the riches which God put into Him.", "source": "A Contemplation of Zion"}], "declarations": ["I declare: my God shall supply all my need according to His riches in glory by Christ Jesus.", "I declare: I lack nothing; His riches cover every need."], "prayer": "Lord Jesus, thank You for supplying all my needs from Your glorious riches. I trust You completely. Amen.", "theme_flag": null}, {"day": 278, "ref": "Colossians 1:15", "book": "Colossians", "chapter": 1, "verse": 15, "text": "Who is the image of the invisible God, the firstborn of every creature:", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "I introduce it here merely that we may understand the circumstances under which the Son takes possession. The Spirit speaks of the One who is man, but the One who is at the same time Creator of all things, the Son of God. They were created by Him, they were necessarily then created also for Him. Thus we have, hitherto, the glory of the person of Christ, and His glory in creation connected with His person. In Him is seen the image of the invisible God. He has created all things: all is for Him ; and He is the firstborn of all that is created. Another category of glory, another supremacy, is now presented.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "The invisible things of Him from the creation of the world are clearly seen, even His eternal power and Godhead, Faith sees His super scription on every part of His handiwork, sees it all pervaded by the living God ; surrounded by the things that perish and pass away, it yet stands in the midst of eternity, it knows itself allied to the unchangeable One. The world, instead of being a hindrance, becomes a help in revealing the everlasting God. And faith finds its life and its delight and its ever- increasing strength in meeting everywhere the God who delights to bear witness of Himself to them that seek after Him. /.", "source": "The Holiest of All, on Colossians 1"}, {"name": "Watchman Nee", "short": "Nee", "comment": "The soul seeks to retain its authority and move independently, while the spirit strives to possess and master everything for the glory of Christ.", "source": "The Spiritual Man"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "The need of the Lord's people is to have a new apprehension of the greatness of their Christ, a new appreciation of the Son of God's love.", "source": "The Centrality and Supremacy of the Lord Jesus Christ"}], "declarations": ["I declare: Jesus Christ is the image of the invisible God, and I see God in Him.", "I declare: as the firstborn of all creation, Christ has the first place in my life."], "prayer": "Lord Jesus, You are the image of the invisible God. Show me the Father in You, and give me the first place in my heart as You have in all creation. Amen.", "theme_flag": "theme-based: Nee, theme-based: Sparks"}, {"day": 279, "ref": "Colossians 1:16", "book": "Colossians", "chapter": 1, "verse": 16, "text": "For by him were all things created, that are in heaven, and that are in earth, visible and invisible, whether they be thrones, or dominions, or principalities, or powers: all things were created by him, and for him:", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "It was in the person of the Son that God acted, when by His power He created all things, whether in heaven or in the earth, visible and invisible. All that is great and exalted is but the work of His hand ; all has been created by Him (the Son) and for Him. Thus, when He takes possession of it, He takes it as His inheritance by right. Wonderful truth, that He who has redeemed us, who made Himself man, one of us, in order to do so, is the Creator! But such is the truth. In connection with this admirable truth, it was a part of God’s counsels that man should have dominion over all the works of His hands.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "To see Him is to know that we have all we can need. Would you, my reader, give more abundant heed to the great salvation? would you experience how completely Jesus is able to save? do you long for just as much of the love and the presence, the holiness and the joy and the power of God in you as there is in Jesus for you? here you have the secret of it all ! Amid all sin and weakness, all darkness and doubt, all failure and perplexity, hold fast this one truth, engage in this one exercise of faith : We see not yet all things subjected to man, but we see Jesus crowned with honour and glory. This gives peace, and victory, and joy unspeakable.", "source": "The Holiest of All"}, {"name": "Watchman Nee", "short": "Nee", "comment": "God's creating work is actually done by the Lord Jesus.", "source": "The Christian (1): Meditations on Genesis"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "The intention in the heart of God in bringing this universe into existence was that, ultimately, the whole creation should display the glory and supremacy of His Son, Jesus Christ.", "source": "Christ - All and in All"}], "declarations": ["I declare: all things were created by Christ and for Christ, including me.", "I declare: I live for the glory of the Son who made all things."], "prayer": "Lord Jesus, by You all things were created, in heaven and on earth. Teach me to live for You, for whom all things exist. Amen.", "theme_flag": "theme-based: Murray"}, {"day": 280, "ref": "Colossians 1:17", "book": "Colossians", "chapter": 1, "verse": 17, "text": "And he is before all things, and by him all things consist.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "He holds all as man, and all by divine power; but in some sort it may be said that one partof His glory depends on His divinity, the other on His victory as man. exclusion of the Father’s power, nor of the operation of the Spirit. They are one, but it is the Son who is here set before us. In John i. it is the Word who creates all things. Here, and in Hebrews i., it is under the name of Son, that He, who is also the Word, is revealed to us. He is the Word of God, the expression of His thought and of His power. It is by Him that God works and reveals Himself. He is also the Son of God; and, in particular, the Son of the Father.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "To see Him is to know that we have all we can need. Would you, my reader, give more abundant heed to the great salvation? would you experience how completely Jesus is able to save? do you long for just as much of the love and the presence, the holiness and the joy and the power of God in you as there is in Jesus for you? here you have the secret of it all ! Amid all sin and weakness, all darkness and doubt, all failure and perplexity, hold fast this one truth, engage in this one exercise of faith : We see not yet all things subjected to man, but we see Jesus crowned with honour and glory. This gives peace, and victory, and joy unspeakable.", "source": "The Holiest of All, on Colossians 1"}, {"name": "Watchman Nee", "short": "Nee", "comment": "God's Christ is all things. Apart from Christ, God does not have any thing.", "source": "The Present Testimony"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "And in Him all things hold together. But for the Lord Jesus Christ, the whole universe would disintegrate, fall apart; it would be without its uniting factor.", "source": "Christ - All and in All"}], "declarations": ["I declare: Christ is before all things, and by Him all things hold together.", "I declare: my life is held together by Christ alone."], "prayer": "Lord Jesus, You are before all things, and by You all things consist. Hold my life together today; I trust in Your upholding power. Amen.", "theme_flag": "theme-based: Nee"}, {"day": 281, "ref": "Colossians 1:18", "book": "Colossians", "chapter": 1, "verse": 18, "text": "And he is the head of the body, the church: who is the beginning, the firstborn from the dead; that in all things he might have the preeminence.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "He is the Head of the body, which is the Church, the Beginning, the Firstborn from among the dead, that in all things He might have the pre-eminence. He is the Firstborn of creation, He is the Firstborn,* according to the power of resurrection, in this new order of things in which man is predestined to an entirely new position, gained by redemption, and in which he participates in the glory of God (as far as that which is created can do so) ; and that by participating in divine life in Jesus Christ, the Son of God, and everlasting life; and, as regards the Church, as members of His body.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "To see Him is to know that we have all we can need. Would you, my reader, give more abundant heed to the great salvation? would you experience how completely Jesus is able to save? do you long for just as much of the love and the presence, the holiness and the joy and the power of God in you as there is in Jesus for you? here you have the secret of it all ! Amid all sin and weakness, all darkness and doubt, all failure and perplexity, hold fast this one truth, engage in this one exercise of faith : We see not yet all things subjected to man, but we see Jesus crowned with honour and glory. This gives peace, and victory, and joy unspeakable.", "source": "The Holiest of All, on Colossians 1"}, {"name": "Watchman Nee", "short": "Nee", "comment": "From start to finish, he is the One who does it all. Christ must have the preeminence in all things.", "source": "The Normal Christian Life"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "It is all gathered up, every fragment of it, in this: That in all things he might have the pre-eminence. In ALL things.", "source": "The Centrality and Supremacy of the Lord Jesus Christ"}], "declarations": ["I declare: Christ is the Head of the church, and He has the preeminence in all things.", "I declare: I submit to Christ as my Head in everything."], "prayer": "Lord Jesus, Head of the church, have the preeminence in my life. Rule over me as You rule over all things. Amen.", "theme_flag": "theme-based: Nee"}, {"day": 282, "ref": "Colossians 1:19", "book": "Colossians", "chapter": 1, "verse": 19, "text": "For it pleased the Father that in him should all fulness dwell;", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "If the Son wrought miracles on earth, He cast out devils by the Spirit; and the Father who dwelt in Him (Christ) did the works. Also, it must be remembered, that that which is said is said, when He was manifested in the flesh, of His complete person, man upon earth. Not that we do not in our minds separate between the divinity and the humanity; but even in separating them we think of the one Person with regard to whom we do so. We say, Christ is God, Christ is man, but it is Christ who is the two. I do not say this theologically, but to draw the reader’s attention to the remarkable expression, “ All the fulness was pleased to dwell in him.”", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Beloved young Christian, learn, I beseech you, to understand the simplicity and the glory of being a true Christian. It is to receive Jesus, to receive Him in all His fulness, to receive Him in all the glorious relations in which the Father gives Him to you. Take Him as your Prophet, as your Wisdom, your Light, your Guide. Take Him as your Priest, who renews you, purifies you, sanctifies you, brings you near to God, takes you and forms you wholly for His service. Take Him as your King who governs you, protects you and blesses you. Take him as your Head, your Exemplar, your Brother, your Life, your All.", "source": "The New Life"}, {"name": "Watchman Nee", "short": "Nee", "comment": "God, in Christ, has worked to such an extent that we are as complete as Christ.", "source": "Questions on the Gospel"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "If there is any barrenness it is not because the Lord is bankrupt. In Him all fullness dwells, and He is enough.", "source": "The Fulness of Christ"}], "declarations": ["I declare: it pleased the Father that in Christ all fullness should dwell.", "I declare: I draw from the fullness of Christ for every need."], "prayer": "Lord Jesus, in You all fullness dwells. Fill me from Your fullness, and let me want nothing apart from You. Amen.", "theme_flag": "theme-based: Murray, theme-based: Nee"}, {"day": 283, "ref": "Colossians 1:20", "book": "Colossians", "chapter": 1, "verse": 20, "text": "And, having made peace through the blood of his cross, by him to reconcile all things unto himself; by him, I say, whether they be things in earth, or things in heaven.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "This is the second part of the glory of Christ. e only was it the good pleasure of the fulness of the Godhead to dwell in Him, but dy Him to reconcile all things to itself, having made peace by the blood of the cross. This reconciliation of things in heaven as well as on the earth is not yet accomplished. Peace is indeed made by the blood, but the power has not yet come in to bring back the whole into actual relationship with God according to the value of that blood. Thus, in Israel, the blood was put upon the mercyseat, and expiation, peace, was made; but besides this everything was sprinkled, and the sins of the people were confessed.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "If ye will obey My voice indeed, ye shall be a peculiar treasure unto Me;' The Lord will surely bless thee, if thou only diligently hearken unto the voice of the Lord thy God.' These are the eternal principles according to which alone man can enjoy God's favour and blessing. We see this in the Lord Jesus. He says: If ye keep My commandments, ye shall abide in My love; even as I have kept my Father's commandments, and abide in His love.' He was in the love of the Father, but could not abide there otherwise than by obedience. And He says that this is equally for us the one way to abide in His love: we must keep His commandments.", "source": "The New Life"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Lord, I do not know fully what the value of the blood is, but I know that the blood has satisfied Thee; so the blood is enough for me, and it is my only plea.", "source": "The Normal Christian Life"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "The Cross was intended only to make the Lord Jesus all and in all for us. By His blood He reconciles all things to Himself.", "source": "Christ: All in All"}], "declarations": ["I declare: by the blood of His cross, Christ has made peace and reconciled me to God.", "I declare: I am reconciled to God through Jesus Christ."], "prayer": "Lord Jesus, by the blood of Your cross You have made peace. Thank You for reconciling me to God; keep me in that peace. Amen.", "theme_flag": "theme-based: Murray, theme-based: Sparks"}, {"day": 284, "ref": "Colossians 1:27", "book": "Colossians", "chapter": 1, "verse": 27, "text": "To whom God would make known what is the riches of the glory of this mystery among the Gentiles; which is Christ in you, the hope of glory:", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "He is the Head of the body, which is the Church, the Beginning, the Firstborn from among the dead, that in all things He might have the pre-eminence. He is the Firstborn of creation, He is the Firstborn,* according to the power of resurrection, in this new order of things in which man is predestined to an entirely new position, gained by redemption, and in which he participates in the glory of God (as far as that which is created can do so) ; and that by participating in divine life in Jesus Christ, the Son of God, and everlasting life; and, as regards the Church, as members of His body.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "I have not a thought; I have not a wish; I would not live a moment except for the glory of God.\" You say at once, \"What Christian can ever attain that?\" Do not ask that question, but ask, \"Has Christ attained it and does Christ promise to live in me?\" Accept Him in His fullness and leave Him to teach you how far He can bring you and what He can work in you. Make no conditions or stipulations about failure, but cast yourself upon, abandon yourself to this Christ who lived that life of utter surrender to God that He might prepare a new nature which He could impart to you and in which He might make you like Himself.", "source": "The Master's Indwelling"}, {"name": "Watchman Nee", "short": "Nee", "comment": "We all have the same Christ dwelling within, but revelation of some new need will lead us spontaneously to trust Him to live out His life in that particular.", "source": "The Normal Christian Life"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Christ in you the hope of glory: this is heaven. You walk in the presence of the Lord Jesus.", "source": "The Measure of Christ"}], "declarations": ["I declare: Christ in me is the hope of glory.", "I declare: the riches of this mystery dwell in me by Christ."], "prayer": "Lord Jesus, You in me are the hope of glory. Live Your life in me today, and manifest Your riches through me. Amen.", "theme_flag": "theme-based: Murray"}, {"day": 285, "ref": "Colossians 2:6", "book": "Colossians", "chapter": 2, "verse": 6, "text": "As ye have therefore received Christ Jesus the Lord, so walk ye in him:", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "He is the Head of the body, which is the Church, the Beginning, the Firstborn from among the dead, that in all things He might have the pre-eminence. He is the Firstborn of creation, He is the Firstborn,* according to the power of resurrection, in this new order of things in which man is predestined to an entirely new position, gained by redemption, and in which he participates in the glory of God (as far as that which is created can do so) ; and that by participating in divine life in Jesus Christ, the Son of God, and everlasting life; and, as regards the Church, as members of His body.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "The old nature of the believer remains evil and sinful to the last; it is only as he daily comes, all empty and helpless, to His Saviour to receive of His life and strength, that he can bring forth the fruits of righteousness to the glory of God. Therefore it is: ‘4s ye have received Christ Jesus the Lord, so walk ye in Him: rooted in Him, and btablished im the faith, abounding therein.” As you came to Jesus, so abide in Him, by faith. And if you would know how faith is to be exercised in thus abiding in Jesus, to be rooted more deeply and firmly in Him, you have only to look back to the time when first you received Him.", "source": "Abide in Christ"}, {"name": "Watchman Nee", "short": "Nee", "comment": "We think of the Christian life as a changed life but it is not that. What God offers us is an exchanged life, a substituted life, and Christ is our Substitute within.", "source": "The Normal Christian Life"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "The Christian life is not by effort, and not by struggle; but from beginning to end and all together a matter of knowing the Lord Jesus within.", "source": "The Measure of Christ"}], "declarations": ["I declare: as I received Christ Jesus the Lord, so I walk in Him.", "I declare: my walk is in Christ, rooted and built up in Him."], "prayer": "Lord Jesus, as I received You, so I would walk in You. Keep me abiding in You, rooted and grounded in Your love. Amen.", "theme_flag": "theme-based: Nee, theme-based: Sparks"}, {"day": 286, "ref": "Colossians 2:9", "book": "Colossians", "chapter": 2, "verse": 9, "text": "For in him dwelleth all the fulness of the Godhead bodily.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "In Him dwelleth all the completeness of the Godhead bodily ; and we are complete in Him. which man, in his ignorance, would incline to bend the knee! We are in Him, in whom the fulness of the Godhead dwells, as to His person ; in Him, who is above all power and principality as to His position and His rights as Christ, man exalted on high. The apostle then enters into some details of application to demonstrate that the faithful have all in Christ, viewed according to the position which He has taken, without having anything to seek elsewhere here below.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "You have thus received the new life from God. You are now as new-born infants: He would teach you in this word what is necessary that you may grow and wax strong. The first point is: you must know that you are God's children. Hear how distinctly Peter says this to those just converted: (1 Pet. 1:23; 2:2,10,25) You have been born again,' you are new-born infants,' you are now converted,' you are now the people of God.' A Christian, however young and weak he is, must know that he is God's child. Then only can he have the courage to believe that he shall make progress, and the boldness to use the food of the children provided in the word.", "source": "The New Life"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Grace means that God does something for me; law means that I do something for God. In Christ, God has done all.", "source": "The Normal Christian Life"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "God has singled out a Person and gathered into that Person all the Divine perfections. He has put all the fulness of Eternity and the Universe into that Person.", "source": "The Measure of Christ"}], "declarations": ["I declare: in Christ dwells all the fullness of the Godhead bodily.", "I declare: I worship Christ as fully God and fully man."], "prayer": "Lord Jesus, in You dwells all the fullness of the Godhead bodily. I worship You as God manifest in flesh, my Lord and my God. Amen.", "theme_flag": "theme-based: Nee, theme-based: Sparks"}, {"day": 287, "ref": "Colossians 2:10", "book": "Colossians", "chapter": 2, "verse": 10, "text": "And ye are complete in him, which is the head of all principality and power:", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "We have also in Him a position above all creation, in the perfection which has placed Christ there. We are completed in Him who is the Head of all principality and of all power. As regards the phraseology, the change of a word, to one not however better in itself, shews the mind of the apostle. In Him dwelleth all the completeness of the Godhead bodily ; and we are complete in Him. which man, in his ignorance, would incline to bend the knee! We are in Him, in whom the fulness of the Godhead dwells, as to His person ; in Him, who is above all power and principality as to His position and His rights as Christ, man exalted on high.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "In the course of my journey, I felt myself pressed to take the pen in hand. Under a vivid impression of the infirmities and the perverted thoughts concerning the New Life, with which, as was manifest to me from conversations I had with them, almost all young Christians have to wrestle, I wished, in some words of instruction and encouragement, to let them see what a glorious life of power and joy is prepared for them in their Lord Jesus, and how simple the way is to enjoy all this blessing. I have confined myself in these reflections to some of the most important topics.", "source": "The New Life"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Outside of Christ, I am only a sinner, but in Christ, I am saved. Outside of Christ, I am empty; in Christ, I am full. Outside of Christ, I am weak; in Christ, I am strong.", "source": "Secrets to Spiritual Power"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "We must never think of anything as outside of Christ. HE is Salvation, HE is Sanctification, HE is Redemption, Justification, Peace, Wisdom, Love, Heaven.", "source": "The Measure of Christ"}], "declarations": ["I declare: I am complete in Christ, who is the Head of all principality and power.", "I declare: I need nothing outside of Christ."], "prayer": "Lord Jesus, I am complete in You. Keep me from seeking elsewhere what I already have in You, my Head. Amen.", "theme_flag": "theme-based: Sparks"}, {"day": 288, "ref": "Colossians 3:1", "book": "Colossians", "chapter": 3, "verse": 1, "text": "If ye then be risen with Christ, seek those things which are above, where Christ sitteth on the right hand of God.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "The Epistle to the Colossians looks at the Christian as risen with Christ, but not, with the Ephesians, as sitting in heavenly places in Christ. A hope is laid up for him in heaven ; he is to set his affection on things above, not on things on the earth. He has died with Christ and he is risen with Him, but not sitting in heavenly places in Him yet. We have in it a proof of that which other epistles demonstrate, namely, the blessed way in _which our God in His grace turns prenrthing to the good of those that love Him.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "It is a greater thing to open the door again, and go out, in an enjoyment of that Presence which nothing can disturb. To some, such a life does not appear needful; the strain is too great; one can be a good Christian without it. To those who seek to be men of one- thing, who feel that if they are to be true and mighty to influence the church and the world around them they must be full of God and His Presence, everything will be subordinate to the one question: How to bear in the earthen vessel the heavenly treasure, the power of Christ resting on us all the day.", "source": "The Inner Life, Day 21"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Sanctification is not a work of our own. Sanctification is accomplished for us by God.", "source": "Sermon: Sanctification, on Colossians 3:1-3"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Get focussed on Him and see everything is HIMSELF. The risen Christ is to be our absorbing occupation.", "source": "The Measure of Christ"}], "declarations": ["I declare: I am risen with Christ, and I seek those things which are above.", "I declare: my life is set on Christ at the right hand of God."], "prayer": "Lord Jesus, risen One, lift my heart to where You are. Teach me to seek the things above, where You sit at God's right hand. Amen.", "theme_flag": "theme-based: Sparks"}, {"day": 289, "ref": "Colossians 3:2", "book": "Colossians", "chapter": 3, "verse": 2, "text": "Set your affection on things above, not on things on the earth.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "The Epistle to the Colossians looks at the Christian as risen with Christ, but not, with the Ephesians, as sitting in heavenly places in Christ. A hope is laid up for him in heaven ; he is to set his affection on things above, not on things on the earth. He has died with Christ and he is risen with Him, but not sitting in heavenly places in Him yet. We have in it a proof of that which other epistles demonstrate, namely, the blessed way in _which our God in His grace turns prenrthing to the good of those that love Him.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "It is a greater thing to open the door again, and go out, in an enjoyment of that Presence which nothing can disturb. To some, such a life does not appear needful; the strain is too great; one can be a good Christian without it. To those who seek to be men of one- thing, who feel that if they are to be true and mighty to influence the church and the world around them they must be full of God and His Presence, everything will be subordinate to the one question: How to bear in the earthen vessel the heavenly treasure, the power of Christ resting on us all the day.", "source": "The Inner Life, Day 21"}, {"name": "Watchman Nee", "short": "Nee", "comment": "If any person desires to think, he must possess memory, imagination and reasoning power; but the Christian has presently lost the use of these.", "source": "Spiritual Authority"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Seek to have your life in God, not in things, not in people, not in places, not in circumstances, but in God.", "source": "T. Austin-Sparks"}], "declarations": ["I declare: I set my affection on things above, not on things on the earth.", "I declare: my heart is fixed on Christ, not on this world."], "prayer": "Lord Jesus, set my affection on things above. Detach my heart from earthly things and fix it on You. Amen.", "theme_flag": "theme-based: Nee, theme-based: Sparks"}, {"day": 290, "ref": "Colossians 3:3", "book": "Colossians", "chapter": 3, "verse": 3, "text": "For ye are dead, and your life is hid with Christ in God.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "We have a life, but it is in Christ; it is hidden with Him in God. It is not yet manifested in its glory, as God will manifest Ill. it before the eyes of all in heaven and earth. It is hidden, but safe in its eternal source. It has the portion of Christ, in whom we possess it. He is hid in God, so also is our life: when Christ shall appear, we shall also appear with Him. It will be remarked, that the apostle does not speak here of our union with Christ, but of our life, of the fact that we are dead, and that our life is hid with Him in God.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Beloved young Christians, if there is one thing about which you must be conscientious, it is this: secret converse with God. Your life is hid with Christ in God. Every day must you in prayer ask from above, and by faith receive in prayer what you need for that day. Every day must personal intercourse with the Father and the Lord Jesus be renewed and strengthened. God is our salvation and our strength: Christ is our life and our holiness: only in personal fellowship with the living God is our blessedness found. Christian, pray much, pray continually, pray without ceasing. When you have no desire to pray, go just then to the inner chamber.", "source": "The New Life"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Christ is our life. And it is the Lord who lives out this life in us. Only the Lord is life.", "source": "Christ the Sum of All Spiritual Things"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Christianity is not a doctrine, not truth as truth, but the knowledge of a PERSON; it is knowing the LORD JESUS. Our life is hid in Him.", "source": "The Measure of Christ"}], "declarations": ["I declare: I am dead, and my life is hid with Christ in God.", "I declare: Christ is my life, hidden and secure in God."], "prayer": "Lord Jesus, my life is hid with You in God. Keep me hidden in You, dead to sin and alive to God. Amen.", "theme_flag": "theme-based: Sparks"}, {"day": 291, "ref": "Colossians 3:17", "book": "Colossians", "chapter": 3, "verse": 17, "text": "And what soever ye do in word or deed, do all in the name of the Lord Jesus, giving thanks to God and the Father by him.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "He is present as that which gives its character to our actions, and which preoccupies the heart in performing them. Everything relates to Him: we do not eat without Him; how can we when He is our very life? we do not drink without Him; what we say, what we do, is said and done in the name of the Lord Jesus. The sense of His presence, the consciousness that everything relates to Him, that we can do nothing—unless carnally—without Him, because the life which we have of Him acts with Him and in Him, does not separate from Him, and has Him for its aim in all things, even as water rises to the height from which it descended.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "And what is it when Jesus gives us power over His Name, the free use of it, with the assurance that whatever we ask in it will be given to us? The ordinary comparison of one person giving another, on some special occasion, the liberty to ask something in his name, comes altogether short here,--Jesus solemnly gives to all His disciples a general and unlimited power of the free use of His Name at all times for all they desire. He could not do this if He did not know that He could trust us with His interests, that His honour would be safe in our hands. The free use of the name of another is always the token of great confidence, of close union.", "source": "With Christ in the School of Prayer, Lesson 24"}, {"name": "Watchman Nee", "short": "Nee", "comment": "There is nothing stereotyped about God's dealings with His children. We must not by our prejudices make watertight compartments for the working of His Spirit.", "source": "The Finest of the Wheat"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "It is CHRIST Himself who IS salvation, HE is sanctification, and HE within as this. All we do is in His Name because He is our life.", "source": "The Measure of Christ"}], "declarations": ["I declare: whatever I do in word or deed, I do all in the name of the Lord Jesus.", "I declare: my words and works bear the Name of Christ."], "prayer": "Lord Jesus, I do all in Your Name today. Let my words and deeds honor You, and let thanksgiving fill my heart. Amen.", "theme_flag": "theme-based: Nee, theme-based: Sparks"}, {"day": 292, "ref": "Colossians 3:23", "book": "Colossians", "chapter": 3, "verse": 23, "text": "And what soever ye do, do it heartily, as to the Lord, and not unto men;", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Thus the Christian walks worthy of the Lord; he knows what became Him, and walks accordingly, that he may please Him in all things, bearing fruit in every good work, and growing by the knowledge of God. Tt was not, then, only the character of life: this life was productive; it bore fruit, and, as life, grew up by increasing knowledge of God. But this connection with God brings in another very precious consideration. Bei. sides the character and the living energy which are in relationship with this knowledge, the strength of God is developed in it also. They draw strength from God. He gives it that they might walk thus.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "The blessing of intercourse with God may easily be lost by entering too deeply into intercourse with men. The spirit of the inner chamber must be carried out into a holy watchfulness throughout the day. We know not at what hour the enemy may come. This continuance of the morning watch may be maintained by a quiet self-restraint, in not giving the reins to nature. It has, in a religious home circle, often sought help, in each one repeating a text at the breakfast table on some fixed subject, giving easy occasion to religious conversation.", "source": "The Inner Life, Day 21"}, {"name": "Watchman Nee", "short": "Nee", "comment": "The Lord wants us to be used, yes; but what He is after is that we pour all we have, ourselves, to Him, and if that be all, that is enough.", "source": "The Normal Christian Life"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "The mark of a life governed by the Holy Spirit is that such a life is continually and ever more and more occupied with Christ.", "source": "The School of Christ"}], "declarations": ["I declare: whatever I do, I do it heartily, as to the Lord and not unto men.", "I declare: Christ is the Master I serve in all my work."], "prayer": "Lord Jesus, I work for You and not for men. Put Your heart into my hands' work, and accept it as service to You. Amen.", "theme_flag": "theme-based: Murray, theme-based: Nee, theme-based: Sparks"}, {"day": 293, "ref": "1 Thessalonians 4:16", "book": "1 Thessalonians", "chapter": 4, "verse": 16, "text": "For the Lord himself shall descend from heaven with a shout, with the voice of the archangel, and with the trump of God: and the dead in Christ shall rise first:", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "God, who fills all things, who is the source of, in whom is centred, all blessing, all good—God, who is all love, who has all power, who embraces everything in His knowledge, because everything (except the forsaking of Himself) is but the fruit of His mind and will—God has revealed Himself in Christ to man, in order that his heart, occupied with Him, with perfect confidence in His goodness, may know Him, may enjoy His presence, and reflect His character. The sin and misery of man have but lent occasion to an infinitely more complete development of what this God is, and of the perfections of His nature, in love, in wisdom, and in power.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Be of good courage, and he shall strengther your heart, all ye that wait on the Lord.” Blessed Father, we humbly beseech Thee, let none that wait on Thee be ashamed; no, not one. Some are weary, and the time of waiting appears long. And some are feeble, and scarcely know how to wait. And some are so entangled in the effort of their prayers and their work, they think that they can find no time to wait continually. Father, teach us all how to wait! Teach us to think of each other, and pray for each other. Teach us to think of Thee, the God of all waiting ones. Father, let none that wait on Thee be ashamed! For Jesus’ sake. Amen.", "source": "Waiting on God, Day 28"}, {"name": "Watchman Nee", "short": "Nee", "comment": "When they are ready, the Lord Himself will come to the air to receive them.", "source": "The Christian (2): Meditations on Revelation"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "At last He is coming again! Why? To finish it all! To complete the redemption of man!", "source": "The Octave of Redemption"}], "declarations": ["I declare: the Lord Himself shall descend from heaven, and I shall meet Him.", "I declare: I live ready for the coming of Christ."], "prayer": "Lord Jesus, You Yourself shall descend from heaven. Keep me watching and ready for Your shout, for the trumpet of God. Amen.", "theme_flag": "theme-based: Murray"}, {"day": 294, "ref": "1 Thessalonians 4:17", "book": "1 Thessalonians", "chapter": 4, "verse": 17, "text": "Then we which are alive and remain shall be caught up together with them in the clouds, to meet the Lord in the air: and so shall we ever be with the Lord.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "IV. ——gather them to Himself. He gives the word. The voice of the archangel passes it on, and the trumpet of God is sounded. The dead in Christ will rise first, that is to say, before the living go up. Then we who shall be alive, and remain, shall go with them, all together, in the clouds, to meet the Lord in the air. So shall we be for ever with the Lord. It was thus that the Lord Himself ascended; for in all things we are to be like Him—an important cireumstance here. Whether transformed, or raised from the dead, we shall all go up in the clouds. It was in the clouds that He ascended, and thus we shall be ever with Him.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Be of good courage, and he shall strengther your heart, all ye that wait on the Lord.” Blessed Father, we humbly beseech Thee, let none that wait on Thee be ashamed; no, not one. Some are weary, and the time of waiting appears long. And some are feeble, and scarcely know how to wait. And some are so entangled in the effort of their prayers and their work, they think that they can find no time to wait continually. Father, teach us all how to wait! Teach us to think of each other, and pray for each other. Teach us to think of Thee, the God of all waiting ones. Father, let none that wait on Thee be ashamed! For Jesus’ sake. Amen.", "source": "Waiting on God, Day 28"}, {"name": "Watchman Nee", "short": "Nee", "comment": "When the Morning Star arrives, we will be raptured.", "source": "The Christian (2): Meditations on Revelation"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "We which are alive, and remain, shall be caught up. Resurrection life in any case is rapture in its issue. It is victory over death, and victory over death is rapture.", "source": "The Power of His Resurrection"}], "declarations": ["I declare: I shall be caught up to meet the Lord in the air, and so shall I ever be with the Lord.", "I declare: my eternal home is with Christ."], "prayer": "Lord Jesus, I shall be caught up to meet You in the air. Comfort my heart with this hope, and keep me faithful until then. Amen.", "theme_flag": "theme-based: Murray, theme-based: Nee"}, {"day": 295, "ref": "1 Thessalonians 5:16", "book": "1 Thessalonians", "chapter": 5, "verse": 16, "text": "Rejoice evermore.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Man has forsaken God, and has lost the power and centre of attraction that kept him in his place, and everything in his own nature in its place. Man cannot recover himself, he cannot direct himself; for, apart from God, there is nothing but self-will that guides man. There are many objects that furnish occasion for the acting of the passions and the will; but there is no object which, as a centre, gives him a regular, constant, and durable moral position in relationship with that object, so that his character should bear its stamp and value.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "I am hopeful that this arrangement will yield a double benefit. Many a one does not know, and had nobody to teach him, how to examine the Scriptures properly. This book may help him in his loneliness. If he will only meditate on one and another point, and then look up the texts that are quoted, he will get into the way of consulting God's word itself on that which he wishes to understand. But it may just as readily be of service in prayer meetings or social gatherings for the study of the word. Let each one read the portion fixed on at home and review those texts that seem to him the most important.", "source": "The New Life"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Negligence in prayer withers the inner man. Nothing can be a substitute for it, not even Christian work.", "source": "The Finest of the Wheat"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "through this short letter the one throbbing note is: 'Rejoice in the Lord,' rejoice, rejoice.", "source": "The Excellency of the Knowledge of Christ"}], "declarations": ["I declare: I rejoice evermore in the Lord.", "I declare: joy in Christ is my strength today."], "prayer": "Lord Jesus, I rejoice evermore in You. Let Your joy be my strength, unbroken by circumstance. Amen.", "theme_flag": "theme-based: Nee, theme-based: Sparks"}, {"day": 296, "ref": "1 Thessalonians 5:17", "book": "1 Thessalonians", "chapter": 5, "verse": 17, "text": "Pray without ceasing.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Now man wills. While he has lost that which formed the sphere of his enjoyment, there is in him an activity which seeks, which is become unable to rest without aiming at something farther; which has already, as which it lacks intelligence to apprehend all that is there, and power to realize even that which it desires. Man, and all that has been his, no longer suffices man as enjoyment. He still needs an object. This object will either be above or below the man. If it be below, he degrades himself below himself; and it is this, indeed, which has taken place.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "A holy covenant had been concluded between the Father and the Son in heaven. The Father had promised Him power over all flesh as the reward of His work: He had done the work, He had glorified the Father, and His one purpose is now still further to glorify Him. With the utmost boldness He asks that the Father may glorify Him, that He may now be and do for His people all He has undertaken. Disciple of Jesus! here you have the first lesson in your work of priestly intercession, to be learned from the example of your great High Priest. To pray in the Name of Jesus is to pray in unity, in sympathy with Him.", "source": "With Christ in the School of Prayer, Lesson 31"}, {"name": "Watchman Nee", "short": "Nee", "comment": "God has a will. Yet He wants man to pray according to His will. When man does this, He will immediately accomplish the work that His will has ordained.", "source": "Sermon: Co-Laboring With God"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "The problem which comes up in prayer is to keep on hammering at the door, to continue knocking.", "source": "In Touch with the Throne"}], "declarations": ["I declare: I pray without ceasing, abiding in fellowship with Christ.", "I declare: my life is a continual conversation with the Lord."], "prayer": "Lord Jesus, teach me to pray without ceasing. Keep me in unbroken fellowship with You through this day. Amen.", "theme_flag": "theme-based: Nee"}, {"day": 297, "ref": "1 Thessalonians 5:18", "book": "1 Thessalonians", "chapter": 5, "verse": 18, "text": "In every thing give thanks: for this is the will of God in Christ Jesus concerning you.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "God, who fills all things, who is the source of, in whom is centred, all blessing, all good—God, who is all love, who has all power, who embraces everything in His knowledge, because everything (except the forsaking of Himself) is but the fruit of His mind and will—God has revealed Himself in Christ to man, in order that his heart, occupied with Him, with perfect confidence in His goodness, may know Him, may enjoy His presence, and reflect His character. The sin and misery of man have but lent occasion to an infinitely more complete development of what this God is, and of the perfections of His nature, in love, in wisdom, and in power.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Say that you too have given yourself to finish the work the Father has given you to do, and to live alone for His glory. And ask then confidently that the Son may be glorified in you. This is praying in the Name, in the very words, in the Spirit of Jesus, in union with Jesus Himself. Such prayer has power. If with Jesus you glorify the Father, the Father will glorify Jesus by doing what you ask in His Name. It is only when your own personal relation on this point, like Christ's, is clear with God, when you are glorifying Him, and seeking all for His glory, that like Christ, you will have power to intercede for those around you.", "source": "With Christ in the School of Prayer, Lesson 31"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Our prayers lay the track down which God's power can come. Like a mighty locomotive, his power is irresistible, but it cannot reach us without rails.", "source": "quoted at"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "By such experiences we have learned to thank the Lord on the spot.", "source": "The Living God (1938)"}], "declarations": ["I declare: in everything I give thanks, for this is the will of God in Christ Jesus.", "I declare: thanksgiving is my response to Christ in all things."], "prayer": "Lord Jesus, in everything I give You thanks. Open my eyes to Your goodness in all things, for this is Your will for me. Amen.", "theme_flag": "theme-based: Nee, theme-based: Sparks"}, {"day": 298, "ref": "1 Thessalonians 5:24", "book": "1 Thessalonians", "chapter": 5, "verse": 24, "text": "Faithful is he that calleth you, who also will do it.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "God, who fills all things, who is the source of, in whom is centred, all blessing, all good—God, who is all love, who has all power, who embraces everything in His knowledge, because everything (except the forsaking of Himself) is but the fruit of His mind and will—God has revealed Himself in Christ to man, in order that his heart, occupied with Him, with perfect confidence in His goodness, may know Him, may enjoy His presence, and reflect His character. The sin and misery of man have but lent occasion to an infinitely more complete development of what this God is, and of the perfections of His nature, in love, in wisdom, and in power.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "The poor child had no pleasant journey: it appeared to her very grievous to be in anxious fear of one who was so prone to take anything wrong amiss. This is the view of the Holy Spirit which many have: a Being whom it is difficult to satisfy, who thinks little of our weakness, and who, even though we take pains, is discontented when our work is not perfect. 2. Another father also brought his daughter to the train to go on a journey, and to be a time from home: but in company with her mother, whom she loved very dearly.", "source": "The New Life"}, {"name": "Watchman Nee", "short": "Nee", "comment": "The Lord Jesus requires just as much, yea more. But what He requires from us, He Himself carries out in us.", "source": "The Normal Christian Life"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "But, blessed be God, He has got it perfected in His Son, and He is a nail in a sure place and God can hang everything upon Him, and He will not give way.", "source": "Faithful and True"}], "declarations": ["I declare: faithful is He that called me, who also will do it.", "I declare: God will complete in me what He has begun in Christ."], "prayer": "Lord Jesus, You are faithful who called me, and You will do it. I rest on Your faithfulness to complete Your work in me. Amen.", "theme_flag": "theme-based: Sparks"}, {"day": 299, "ref": "2 Thessalonians 3:3", "book": "2 Thessalonians", "chapter": 3, "verse": 3, "text": "But the Lord is faithful, who shall stablish you, and keep you from evil.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "The L Jesus was coming, but it was impossible that He should be without His Church in the glory. The King would indeed punish His rebellious subjects; but, before doing so, He would bring to Himself those who had Mae faithful to Him amid the unfaithful, in order to bring them back with Him, and publicly to honour them in the midst of the rebels. But the apostle here speaks only of the rapture itself, and he adjures them by that truth not to allow themselves to be shaken in mind, a s though the day were come.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "That is the language of trustful dedication. It is on the word of the Lord, which calls upon you to surrender yourself, that you have done this. That word is your warrant that He will take and guide and keep you. As surely as you give yourself, does He take you; and what He takes He can keep. Only, we must not take it again out of His hand. Let it remain fixed with you that your surrender is in the highest degree pleasing to Him: be certain of it, your offering is a sweet-smelling savour. Not on what you are, or what you experience or discover in yourselves, do you say this, but on His word.", "source": "The New Life"}, {"name": "Watchman Nee", "short": "Nee", "comment": "If we really trust God, we shall expect to bear unaided the spiritual burden. Our faith is not to be in God plus man but in God alone.", "source": "The Table in the Wilderness"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "that living God has you in hand, although you do not know it.", "source": "The Living God (1938)"}], "declarations": ["I declare: the Lord is faithful; He will establish me and keep me from evil.", "I declare: I am kept by the faithfulness of Christ."], "prayer": "Lord Jesus, faithful One, establish me and keep me from evil. Guard me by Your power today. Amen.", "theme_flag": "theme-based: Nee, theme-based: Sparks"}, {"day": 300, "ref": "1 Timothy 1:15", "book": "1 Timothy", "chapter": 1, "verse": 15, "text": "This is a faithful saying, and worthy of all acceptation, that Christ Jesus came into the world to save sinners; of whom I am chief.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Everywhere here the subject is that which is suitable outwardly to an upright walk, that which is seemly, whether with regard to the position of individuals, or with respect to the world. The apostle speaks of elders; of widows, of that which is becoming for younger widows; of the honour due to faithful elders, those among them esr who were teachers also. There is nothing inward, nothing of the soul’s relationships to God; but everything refers to the public testimony which suited the position of men in this world before God.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "The first is the Word of God as the glorious and sure guide, even for the simplest souls that will only surrender themselves to it. Then, as the chief element in the word, there is the Son, the gift of the Father, to do all for us. Thereupon follows what the Scriptures teach concerning Sin, as the only thing that we have to bring to Jesus, as that which we must give to Him, and from which He will set us free. Further, there is Faith, the great word in which is expressed our inability to bring or to do anything, and that teaches us that all our salvation must be received every day of our life as a gift from above.", "source": "The New Life"}, {"name": "Watchman Nee", "short": "Nee", "comment": "For I did not come to call the righteous, but sinners. Jesus opened up God's heart to men.", "source": "God is Willing"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "The question which covers and governs all learning is this: Why did the Lord Jesus Christ come into this world?", "source": "Discipleship in the School of Christ"}], "declarations": ["I declare: Christ Jesus came into the world to save sinners, of whom I am chief.", "I declare: I am saved by Christ who came for sinners."], "prayer": "Lord Jesus, You came into the world to save sinners. Thank You for saving me; make me a witness of Your saving grace. Amen.", "theme_flag": "theme-based: Murray"}, {"day": 301, "ref": "1 Timothy 2:5", "book": "1 Timothy", "chapter": 2, "verse": 5, "text": "For there is one God, and one mediator between God and men, the man Christ Jesus;", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "There is one God, and one Mediator between God and men, a Man, Christ Jesus. These are the two great. truths which form the basis of all true religion. Judaism had already been thi revelation and testimony in the world of the first ; th was one only God. This remains eternally true, but did not suffice to bring men into relationship with God With regard to men He abode within the veil in the darkness which shrouded His majesty. Christian while fully revealing the one God, presents the second truth: there is one Mediator between God and men. There is one, and there is but one.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "IN these verses we have, in five examples, from the history of Israel on its way from Egypt to Canaan, the truth confirmed anew that in all that God does in redemption, on man's part faith is the beginning and ending. Whether we look at His revelation as a whole, or at its individual parts, everywhere the one thing He asks, the one thing that pleases Him, the one thing that secures His blessing is — faith. In the five times repeated by faith we see that in the greatest variety of circumstances and duties the first of all duties always is — faith in the invisible One.", "source": "The Holiest of All"}, {"name": "Watchman Nee", "short": "Nee", "comment": "He is the only Mediator between God and man.", "source": "Questions on the Gospel"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "God has singled out a Person and set Him forth to be seen of all: the MAN CHRIST JESUS. One mediator between God and men.", "source": "The Measure of Christ"}], "declarations": ["I declare: there is one mediator between God and men, the man Christ Jesus.", "I declare: I come to God only through Christ."], "prayer": "Lord Jesus, my one Mediator, thank You for standing between God and me. Bring me to the Father by Your own blood. Amen.", "theme_flag": "theme-based: Murray"}, {"day": 302, "ref": "1 Timothy 4:12", "book": "1 Timothy", "chapter": 4, "verse": 12, "text": "Let no man despise thy youth; but be thou an example of the believers, in word, in conversation, in charity, in spirit, in faith, in purity.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "These are the cardinal points with regard | to unbelief and faith, the truth and the Spirit; and the word of God is the truth. p in the nature of him in whom all this sin and all this confusion are introduced, the Centre of all blessing, He who is Light itself, He who as the Light puts everything morally in its place, and who, by the fact of His presence, shews that love is above everything, God who is love has been manifest in the flesh. Where sin was, there was love above the sin. Man, who is the slave of evil, sees here in his own nature the source and the power of all good.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "No: we must give time, that it may make an impression and wield its own influence upon us. Read every portion the first time with consideration, to understand the good that is in it, and then see if you receive benefit from the thoughts that are there expressed. Read it the second time to see if it is really in accordance with God's word: take some, if not all, of the texts that are adduced on each point, and ponder them in order to come under the full force of what God has said on the point. Let your God, through His word, teach you what you must think and believe concerning Him and His will.", "source": "The New Life"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Revelation is the first step to holiness, and consecration is the second. A day must come when we give up all right to ourselves and submit to the absolute Lordship of Jesus Christ.", "source": "Watchman Nee"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "The Christian is, in the Word of God, looked upon as being a very responsible person.", "source": "God's Reactions to Man's Defections"}], "declarations": ["I declare: I am an example to believers in word, in conduct, in love, in faith, in purity.", "I declare: Christ in me is seen by others."], "prayer": "Lord Jesus, make me an example to believers. Let Your life in me be seen in word, in love, in faith, in purity. Amen.", "theme_flag": "theme-based: Murray, theme-based: Nee, theme-based: Sparks"}, {"day": 303, "ref": "2 Timothy 1:7", "book": "2 Timothy", "chapter": 1, "verse": 7, "text": "For God hath not given us the spirit of fear; but of power, and of love, and of a sound mind.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "God then has given us the Spirit of power, love, and of a sound mind; the apostle had rece such a position from God, that he had been able to bestow this Spirit on Timothy, who was not to be ashame¢ either of the testimony, which was losing outwardl: onward current in the world, nor of Paul who was: a prisoner. How precious to possess that which is eternal, that which is founded on the power and on the work of God Himself! There were indeed the afflictions of the gospel, they would be endured according to the power of God.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Believe always that the Spirit will make the word in you life and joy, a blessed fellowship with your God. Precious Saviour, Thou hast taught me to believe Thy word, and Thou hast made me by that faith a child of God. Through that word, as the milk of the new-born babes, wilt Thou also feed me. Lord, for this milk shall I be very eager: every day will I long after it. Teach me, through the Holy Spirit and the word, to walk and hold converse every day in living fellowship with the love of the Father. Teach me always to believe that the Spirit has been given me with the word. Amen.", "source": "The New Life"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Our power is not a thing; it is simply Christ. It is Christ who manifests himself in us.", "source": "Christ the Sum of All Spiritual Things"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "God wants His people to go forward with assurance and confidence, with a firm and steady tread.", "source": "Fear"}], "declarations": ["I declare: God has not given me the spirit of fear, but of power and of love and of a sound mind.", "I declare: I am bold in Christ, loving and clear-minded."], "prayer": "Lord Jesus, You have not given me fear but power, love, and a sound mind. Fill me with Your bold Spirit today. Amen.", "theme_flag": "theme-based: Murray, theme-based: Sparks"}, {"day": 304, "ref": "2 Timothy 4:7", "book": "2 Timothy", "chapter": 4, "verse": 7, "text": "I have fought a good fight, I have finished my course, I have kept the faith:", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Meanwhile he was going to be with Him, to have a place in the heavenly kingdom. ‘He salutes the brethren with whom Timothy was connected, and begs him to come before the winter. We also learn here, that the miraculous power granted to the apostles was exercised in the Lord’s service, and not for ‘their private interests, nor as their personal affection Iv, might suggest; for Paul had left Trophimus sick a Miletus. * It is evident that this epistle was written when apostle thought his departure near at hand, and w the faith of Christians had grievously declined, wl was proved by their having forsaken the apostle. faith was sustained by grace.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Then comes the second, the life-long conflict: by the narrow door I come upon the new way. On the new way there are still always enemies. Of this life-long conflict Paul says: I have fought the good fight, I have finished the course, I have kept the faith.' With respect to the continuous conflict, he gives the charge: Fight the good fight of faith.' There is much misunderstanding about this twofold conflict. Many strive all their life against the Lord and His summons, and, because they are not at rest, but feel an inner conflict, they think that this is the conflict of a Christian.", "source": "The New Life"}, {"name": "Watchman Nee", "short": "Nee", "comment": "To be useful in God's hand, a man must be properly adjusted with respect to all three: his position, his life and his warfare.", "source": "Sit, Walk, Stand"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "We are in the same fight, the same contest, the same calling.", "source": "God's Reactions to Man's Defections"}], "declarations": ["I declare: I have fought the good fight, I have finished my course, I have kept the faith.", "I declare: I will finish my race in Christ."], "prayer": "Lord Jesus, help me fight the good fight and finish my course. Keep me faithful to the end, as You kept Paul. Amen.", "theme_flag": "theme-based: Nee"}, {"day": 305, "ref": "2 Timothy 4:8", "book": "2 Timothy", "chapter": 4, "verse": 8, "text": "Henceforth there is laid up for me a crown of righteousness, which the Lord, the righteous judge, shall give me at that day: and not to me only, but unto all them also that love his appearing.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "We see that here also the epistle bears the character of righteousness, grace having had its course. “The Lord,” he says, “reward him according to his deeds.” As for those who had not courage to stand by him, when he had to answer, as a prisoner, he only prays for them. He had not been discouraged. His heart, broken by the unfaithfulness of the Church, was strong in confessing the Lord before the world, and he can testify that, if forsaken by men, the Lord Himself stood with him and strengthened him. That he had to answer before the authorities was but an occasion to proclaim again in public that for which he was made a prisoner.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Be of good courage, and he shall strengther your heart, all ye that wait on the Lord.” Blessed Father, we humbly beseech Thee, let none that wait on Thee be ashamed; no, not one. Some are weary, and the time of waiting appears long. And some are feeble, and scarcely know how to wait. And some are so entangled in the effort of their prayers and their work, they think that they can find no time to wait continually. Father, teach us all how to wait! Teach us to think of each other, and pray for each other. Teach us to think of Thee, the God of all waiting ones. Father, let none that wait on Thee be ashamed! For Jesus’ sake. Amen.", "source": "Waiting on God, Day 28"}, {"name": "Watchman Nee", "short": "Nee", "comment": "All those who truly love the Lord long for the appearing of the Lord.", "source": "The Christian (2): Meditations on Revelation"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "What is meant by 'crown' is the sealing of a course in triumph, with honour, with exaltation, the crown being the symbol both of victory and victorious honour.", "source": "Crowning in Relation to an Ordeal"}], "declarations": ["I declare: there is laid up for me a crown of righteousness from the Lord.", "I declare: I love His appearing and await my reward from Christ."], "prayer": "Lord Jesus, righteous Judge, I love Your appearing. Keep me ready for the crown of righteousness You will give. Amen.", "theme_flag": "theme-based: Murray"}, {"day": 306, "ref": "Titus 2:11", "book": "Titus", "chapter": 2, "verse": 11, "text": "For the grace of God that bringeth salvation hath appeared to all men,", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Renouncing all ungodliness, and all lusts that find their gratification in this world, we are to bridle the will of the flesh in every respect, and to live soberly ; we are to acknowledge the claims of others, and to live righteously ; we are to own the rights of God over our hearts, and to exercise godliness. But our future also is enlightened by grace. It teaches us to wait for the blessed hope, and the appearing of the glory of our great God and Saviour Jesus Christ. Grace has appeared. It teaches us how to walk here below, and to expect the appearing of the glory in the person of Jesus Christ Himself. And our hope is well founded.", "source": "Darby's Synopsis"}, {"name": "Andrew Murray", "short": "Murra
