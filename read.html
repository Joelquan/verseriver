"short": "Nee", "comment": "A new heart also will I give you, and a new spirit will I put within you. Ezek. 36:26.", "source": "Watchman Nee, The Normal Christian Life, chapter: The Believer's Access to God"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "By our new birth from above we become partakers of the life of God.", "source": "T. Austin-Sparks, In Christ, Chapter 3, In the Likeness of His Resurrection"}], "declarations": ["I declare: God has given me a new heart, and His Spirit lives in me.", "I declare: I am cleansed and made new in Christ today."], "prayer": "Lord Jesus, thank You for my new heart. Fill me afresh with Your Spirit today. Amen.", "theme_flag": "theme-based: Sparks"}, {"day": 103, "ref": "Daniel 3:25", "book": "Daniel", "chapter": 3, "verse": 25, "text": "He answered and said, Lo, I see four men loose, walking in the midst of the fire, and they have no hurt; and the form of the fourth is like the Son of God.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "But this is only to manifest more brightly the power and the faithfulness of God, who comes, even into the midst of the fire, to prove the interest He takes in the fidelity of His servants.", "source": "J. N. Darby, Synopsis of the Books of the Bible, Daniel chapter 3 (stempublishing.com)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "God hath spoken in His Son! The living Jesus, come forth from the fiery furnace of God's holiness, from the burning glow of everlasting love, He Himself is the living Word.", "source": "Andrew Murray, The Holiest of All, Chapter 1, The Son In Whom God Hath Spoken"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Shadrach, Meshech and Abednego suffered no harm in the fiery furnace. Dan. 3:16-27.", "source": "Watchman Nee, The Spiritual Man, chapter: Overcoming Death"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Our faith will not take the strain of the requirements of a deep experience of trial and adversity, but if we live by the faith of the Son of God, the issue will be different.", "source": "T. Austin-Sparks, In Christ, chapter: Christ to be Expressed Through Believers"}], "declarations": ["I declare: Jesus stands with me in the fire, and I will not be burned.", "I declare: I live by the faith of the Son of God in every trial."], "prayer": "Lord Jesus, be with me in every fiery trial today. I trust You to bring me through unharmed. Amen.", "theme_flag": "theme-based: Murray, Sparks"}, {"day": 104, "ref": "Daniel 7:13", "book": "Daniel", "chapter": 7, "verse": 13, "text": "I saw in the night visions, and, behold, one like the Son of man came with the clouds of heaven, and came to the Ancient of days, and they brought him near before him.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "One like the Son of man is brought to the Ancient of days, and receives the kingdom and universal dominion, the rule of Jehovah entrusted to man in the Person of Christ.", "source": "J. N. Darby, Synopsis of the Books of the Bible, Daniel chapter 7 (stempublishing.com)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "But when we remember that Jesus became Man, that He might taste death for all men, and that He, a Man upon the throne, now lives as our Surety, our Redeemer, and our Head, it is enough if we see Him crowned with glory and honour.", "source": "Andrew Murray, The Holiest of All, Chapter 12, We See Jesus Crowned With Glory and Honour"}, {"name": "Watchman Nee", "short": "Nee", "comment": "As Son of man He had a will, but He did not do it; He came to do the will of the Father.", "source": "Watchman Nee, The Normal Christian Life, chapter: The Basis of All True Ministry"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "The Son of man who is in heaven. John 3:13.", "source": "T. Austin-Sparks, In Christ, Chapter 4, Ascension and Glory"}], "declarations": ["I declare: Jesus the Son of man reigns, and His kingdom has no end.", "I declare: I submit to Christ my Head, and I do the Father's will."], "prayer": "Lord Jesus, Son of man crowned with glory, I bow to You today. Rule over my life. Amen.", "theme_flag": "theme-based: Murray, Nee, Sparks"}, {"day": 105, "ref": "Daniel 7:14", "book": "Daniel", "chapter": 7, "verse": 14, "text": "And there was given him dominion, and glory, and a kingdom, that all people, nations, and languages, should serve him: his dominion is an everlasting dominion, which shall not pass away, and his kingdom that which shall not be destroyed.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "The earthly people established in the kingdom under the heavens. This was the dominion of the God of heaven which should not pass away.", "source": "J. N. Darby, Synopsis of the Books of the Bible, Daniel chapter 7 (stempublishing.com)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "God is on the throne and Christ in Him: the throne and the kingdom are Christ's too. For ever and ever. Christ is the King eternal. His dominion is an everlasting dominion.", "source": "Andrew Murray, The Holiest of All, Chapter 7, The Son Himself God"}, {"name": "Watchman Nee", "short": "Nee", "comment": "We now seek first the kingdom of God and His righteousness because we believe God will supply our daily need.", "source": "Watchman Nee, The Spiritual Man, chapter: The Soul under the Spirit's Control"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "He came to redeem it, to secure the judicial right to sovereignty in it, and to initiate, continue, and complete the restoration of it to His own dominion.", "source": "T. Austin-Sparks, In Christ, chapter: Christ to be Expressed Through Believers"}], "declarations": ["I declare: The dominion of Christ is everlasting; it will never pass away.", "I declare: I seek first the kingdom of God, and He supplies all I need."], "prayer": "Lord Jesus, eternal King, I put Your kingdom first today. Establish Your rule in my life. Amen.", "theme_flag": "theme-based: Murray, Nee, Sparks"}, {"day": 106, "ref": "Daniel 9:25", "book": "Daniel", "chapter": 9, "verse": 25, "text": "Know therefore and understand, that from the going forth of the commandment to restore and to build Jerusalem unto the Messiah the Prince shall be seven weeks, and threescore and two weeks: the street shall be built again, and the wall, even in troublous times.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "The time should come, decreed of God, to finish the transgression, to make an end of sin, and to put it away; to pardon iniquity and bring in everlasting righteousness.", "source": "J. N. Darby, Synopsis of the Books of the Bible, Daniel chapter 9 (stempublishing.com)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Believer, abide in Christ as your redemption. Let this be the crown of your Christian life.", "source": "Andrew Murray, Abide in Christ, Chapter 10, As Your Redemption"}, {"name": "Watchman Nee", "short": "Nee", "comment": "As we stand steadfastly on the ground of what Christ is, we find all that is true of Him becoming experimentally true in us.", "source": "Watchman Nee, The Normal Christian Life, chapter: Abiding in Him"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Nothing can be added to that, nor can it be shared in its vicarious and redeeming efficacy.", "source": "T. Austin-Sparks, In Christ, Chapter 2, In the Likeness of His Death"}], "declarations": ["I declare: In Christ my transgression is finished and my sin is put away.", "I declare: I abide in Christ my redemption, and I am complete in Him."], "prayer": "Lord Jesus, my Redeemer, I stand on all that You are. Make Your redemption real in me today. Amen.", "theme_flag": "theme-based: Murray, Nee, Sparks"}, {"day": 107, "ref": "Daniel 9:26", "book": "Daniel", "chapter": 9, "verse": 26, "text": "And after threescore and two weeks shall Messiah be cut off, but not for himself: and the people of the prince that shall come shall destroy the city and the sanctuary; and the end thereof shall be with a flood, and unto the end of the war desolations are determined.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "After sixty-nine altogether, the Messiah should be cut off, and should have nothing. He to whom the kingdom and the glory belonged, instead of receiving them, should be cut off and have nothing.", "source": "J. N. Darby, Synopsis of the Books of the Bible, Daniel chapter 9 (stempublishing.com)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "The death of Christ hath wrought with mighty power in heaven and earth and hell. It has satisfied, and delighted God; it has conquered death and sin and hell; it has redeemed and delivered mankind.", "source": "Andrew Murray, The Holiest of All, Chapter 13, Jesus Tasting Death For Every Man"}, {"name": "Watchman Nee", "short": "Nee", "comment": "He knew there was an appointed hour for the Messiah to be cut off; He could not die in advance of God's appointed moment nor could He die at any other place than at Golgotha.", "source": "Watchman Nee, The Spiritual Man, chapter: Death after our Work is Finished"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "The matter which we now have before us is the relationship of the Cross to the manifesting of life.", "source": "T. Austin-Sparks, The Battle for Life, Chapter 3, The Cross in Relation to the Issue of Life"}], "declarations": ["I declare: The Messiah was cut off for me, and by His death I have life.", "I declare: The Cross has conquered sin and death on my behalf."], "prayer": "Lord Jesus, You were cut off that I might live. I thank You for Your finished work today. Amen.", "theme_flag": "theme-based: Murray, Sparks"}, {"day": 108, "ref": "Hosea 6:3", "book": "Hosea", "chapter": 6, "verse": 3, "text": "Then shall we know, if we follow on to know the LORD: his going forth is prepared as the morning; and he shall come unto us as the rain, as the latter and former rain unto the earth.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Hosea 6 calls forth a touching address from the prophet, in which he entreats the people to return to Jehovah. Faith has always this resource, because it sees the hand of God, its God, in the chastisement, and can appeal to the mercy of a well-known God.", "source": "J. N. Darby, Synopsis of the Books of the Bible, Hosea chapter 6 (stempublishing.com)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Abide in Jesus: your life in Him will lead you to that fellowship with God in which the only true knowledge of God is to be had.", "source": "Andrew Murray, Abide in Christ, Day 7"}, {"name": "Watchman Nee", "short": "Nee", "comment": "An awareness of need, drawing them out and on to know the Lord. This is what I feel to be the heart of everything.", "source": "Watchman Nee, The Normal Christian Life, chapter: Fragrance"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "That I may know him, and the power of his resurrection. Phil. 3:10.", "source": "T. Austin-Sparks, In Christ, Chapter 3, In the Likeness of His Resurrection"}], "declarations": ["I declare: I press on to know the Lord, and He will come to me as surely as the morning.", "I declare: My heart is drawn to know Christ more today."], "prayer": "Lord Jesus, I want to know You. Draw me closer and reveal Yourself to me today. Amen.", "theme_flag": "theme-based: Murray, Nee, Sparks"}, {"day": 109, "ref": "Hosea 11:1", "book": "Hosea", "chapter": 11, "verse": 1, "text": "When Israel was a child, then I loved him, and called my son out of Egypt.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "God still remembers His early love for Jacob; He puts them in mind of all His lovingkindness, His goodness, His care for them. However great the sin of Israel, the heart of their God cannot forsake His people.", "source": "J. N. Darby, Synopsis of the Books of the Bible, Hosea chapters 9-11 (stempublishing.com)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "The knowledge of the Fatherhood of God, the revelation of His infinite Fatherliness in our hearts, the faith in the infinite love that gives us His Son and His Spirit to make us children, is indeed the secret of prayer in spirit and truth.", "source": "Andrew Murray, With Christ in the School of Prayer, Fifth Lesson"}, {"name": "Watchman Nee", "short": "Nee", "comment": "The Lord Jesus saves people from sins and sicknesses that they may know the love of the Father.", "source": "Watchman Nee, The Spiritual Man, chapter: Sickness"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "This is my beloved Son in whom I am well pleased. Conformed to the image of his Son.", "source": "T. Austin-Sparks, The School of Christ, Chapter 1"}], "declarations": ["I declare: God loves me with an everlasting love, and He will never forsake me.", "I declare: I am called out as God's beloved child in Christ."], "prayer": "Lord Jesus, thank You for the Father's love that called me out. Let me rest in that love today. Amen.", "theme_flag": "theme-based: Murray, Nee, Sparks"}, {"day": 110, "ref": "Joel 2:13", "book": "Joel", "chapter": 2, "verse": 13, "text": "And rend your heart, and not your garments, and turn unto the LORD your God: for he is gracious and merciful, slow to anger, and of great kindness, and repenteth him of the evil.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Verses 12-14 give us the prophet's testimony, calling them to repentance, in view of the chastisements that were hanging over the people.", "source": "J. N. Darby, Synopsis of the Books of the Bible, Joel chapter 2 (stempublishing.com)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "He must come daily just as he is; the deepest conviction often times comes after conversion.", "source": "Andrew Murray, The New Life, chapter XXII, The Holy Ghost"}, {"name": "Watchman Nee", "short": "Nee", "comment": "May God be gracious to us that we may put no confidence in the flesh.", "source": "Watchman Nee, The Spiritual Man, chapter: Words of Exhortation"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Let us ask our hearts at once, Is this true in our case?", "source": "T. Austin-Sparks, The School of Christ, chapter: The Pre-eminent Mark of a Life Governed by the Spirit"}], "declarations": ["I declare: I rend my heart before God, and He receives me with mercy.", "I declare: God is gracious and merciful to me; I turn to Him fully."], "prayer": "Lord Jesus, I bring You my whole heart today. You are gracious and merciful; receive me. Amen.", "theme_flag": "theme-based: Murray, Nee, Sparks"}, {"day": 111, "ref": "Joel 2:28", "book": "Joel", "chapter": 2, "verse": 28, "text": "¶ And it shall come to pass afterward, that I will pour out my spirit upon all flesh; and your sons and your daughters shall prophesy, your old men shall dream dreams, your young men shall see visions:", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "God would pour out His Spirit upon all flesh.", "source": "J. N. Darby, Synopsis of the Books of the Bible, Joel chapter 2 (stempublishing.com)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "In the words of God's promise, I will pour out my Spirit abundantly; and of His command, Be ye filled with the Spirit, we have the measure of what God is ready to give, and what we may obtain.", "source": "Andrew Murray, With Christ in the School of Prayer, Lesson: How much more the Holy Spirit"}, {"name": "Watchman Nee", "short": "Nee", "comment": "As soon as we see the Lord Jesus on the throne, we know the Holy Spirit has been poured out upon us.", "source": "Watchman Nee, The Normal Christian Life, chapter: Faith Is Again the Key"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "He breathed on them, and saith unto them, Receive ye the Holy Spirit. John 20:22.", "source": "T. Austin-Sparks, In Christ, chapter: In Christ"}], "declarations": ["I declare: The Holy Spirit is poured out on me, and I am filled.", "I declare: I receive the Spirit's fullness for life and witness today."], "prayer": "Lord Jesus, pour out Your Spirit on me afresh today. Fill me to overflow. Amen.", "theme_flag": "theme-based: Nee, Sparks"}, {"day": 112, "ref": "Joel 2:32", "book": "Joel", "chapter": 2, "verse": 32, "text": "And it shall come to pass, that whosoever shall call on the name of the LORD shall be delivered: for in mount Zion and in Jerusalem shall be deliverance, as the LORD hath said, and in the remnant whom the LORD shall call.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Whosoever should call on the name of Jehovah should be saved; for in Mount Zion and in Jerusalem should be deliverance, as Jehovah had said.", "source": "J. N. Darby, Synopsis of the Books of the Bible, Joel chapter 2 (stempublishing.com)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "We cannot but feel how in this sixfold repetition He wants to impress deep on our minds this one truth, that we may and must most confidently expect an answer to our prayer.", "source": "Andrew Murray, With Christ in the School of Prayer, Fifth Lesson, Ask, and it shall be given you"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Hitherto have ye asked nothing in my name: ask, and ye shall receive, that your joy may be made full.", "source": "Watchman Nee, Sit, Walk, Stand, chapter: In His Name"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "I am come a light into the world, that whosoever believeth on me may not abide in the darkness. John 12:46.", "source": "T. Austin-Sparks, The School of Christ, Chapter 5, The Light of Life"}], "declarations": ["I declare: Whoever calls on the name of the Lord shall be saved, and I have called.", "I declare: I ask in Jesus' name, and I receive with full joy."], "prayer": "Lord Jesus, I call on Your name today. Save, deliver, and answer me. Amen.", "theme_flag": "theme-based: Murray, Nee, Sparks"}, {"day": 113, "ref": "Amos 5:24", "book": "Amos", "chapter": 5, "verse": 24, "text": "But let judgment run down as waters, and righteousness as a mighty stream.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Jehovah took no pleasure in their offerings and sacrifices; He could not bear with their solemn feasts; He desired judgment and righteousness.", "source": "J. N. Darby, Synopsis of the Books of the Bible, Amos chapter 5 (stempublishing.com)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Being right with God is followed by doing right.", "source": "Andrew Murray, The New Life, chapter XV, Righteousness"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Neither does the flesh profit the spiritual life nor can it fulfill the righteousness of God.", "source": "Watchman Nee, The Spiritual Man, chapter: God's View of the Flesh"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "The new man, created in righteousness and holiness of truth. Eph. 4:24.", "source": "T. Austin-Sparks, In Christ, chapter: In Christ"}], "declarations": ["I declare: In Christ I am made righteous, and I walk in righteousness today.", "I declare: Right standing with God produces right living in me."], "prayer": "Lord Jesus, make me righteous as You are righteous. Let justice and righteousness flow through my life. Amen.", "theme_flag": "theme-based: Nee, Sparks"}, {"day": 114, "ref": "Obadiah 1:21", "book": "Obadiah", "chapter": 1, "verse": 21, "text": "And saviours shall come up on mount Zion to judge the mount of Esau; and the kingdom shall be the LORD’s.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Deliverance should be on Mount Zion; from thence Mount Esau should be judged, and the kingdom should be Jehovah's.", "source": "J. N. Darby, Synopsis of the Books of the Bible, Obadiah (stempublishing.com)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Who trust the heavenly Father in all earthly need, seeking first the kingdom of God and His righteousness.", "source": "Andrew Murray, With Christ in the School of Prayer, Sixth Lesson"}, {"name": "Watchman Nee", "short": "Nee", "comment": "The kingdom of this world is not the kingdom of God. God had His heart set upon a world system, a universe of His creating, which should be headed up in Christ His Son. Col. 1:16-17.", "source": "Watchman Nee, The Normal Christian Life, chapter: The Divide of the Cross"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "We shall see later that this is related to the inclusive dominion in the universe of the race in Christ, and also to the dethronement of the lord of death. Heb. 2:5-15.", "source": "T. Austin-Sparks, In Christ, Chapter 3, In the Likeness of His Resurrection"}], "declarations": ["I declare: The kingdom shall be the Lord's, and Christ heads up all things.", "I declare: I belong to the kingdom of God, not of this world."], "prayer": "Lord Jesus, establish Your kingdom in my life today. I seek Your rule above all. Amen.", "theme_flag": "theme-based: Murray, Nee, Sparks"}, {"day": 115, "ref": "Jonah 2:9", "book": "Jonah", "chapter": 2, "verse": 9, "text": "But I will sacrifice unto thee with the voice of thanksgiving; I will pay that that I have vowed. Salvation is of the LORD.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Christ, in His infinite grace, came down into this place, being rejected because He was faithful. We most distinctly see the spirit of the remnant of Israel in Jonah's prayer. Verses 7-9 of chapter 2 prove it most clearly.", "source": "J. N. Darby, Synopsis of the Books of the Bible, Jonah chapter 2 (stempublishing.com)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "We learn to look on all nature as part of the Kingdom of Christ, destined, even though it be through a baptism of fire, to partake in His redemption.", "source": "Andrew Murray, Abide in Christ, Chapter 10, As Your Redemption"}, {"name": "Watchman Nee", "short": "Nee", "comment": "And then we shall daily experience the salvation of the Lord.", "source": "Watchman Nee, The Spiritual Man, chapter: A Broken Spirit"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "That is the essence of a life governed by the Holy Spirit, and it is that which will deliver us from death, from stagnation, from coming to a standstill.", "source": "T. Austin-Sparks, The School of Christ, chapter: The Pre-eminent Mark of a Life Governed by the Spirit"}], "declarations": ["I declare: Salvation is of the LORD, and I receive His deliverance today.", "I declare: I will sacrifice with the voice of thanksgiving to my God."], "prayer": "Lord Jesus, my salvation is from You alone. I thank You and I trust You to deliver me. Amen.", "theme_flag": "theme-based: Murray, Nee, Sparks"}, {"day": 116, "ref": "Micah 5:2", "book": "Micah", "chapter": 5, "verse": 2, "text": "But thou, Beth-lehem Ephratah, though thou be little among the thousands of Judah, yet out of thee shall he come forth unto me that is to be ruler in Israel; whose goings forth have been from of old, from everlasting.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "It represents Him as being born at Bethlehem, and at the same time as eternal, and as the true Ruler in Israel.", "source": "J. N. Darby, Synopsis of the Books of the Bible, Micah chapter 5 (stempublishing.com)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "In the New Testament He showed it by the miraculous birth of Jesus Christ: God's mighty power revealing the divine life in the babe of Bethlehem.", "source": "Andrew Murray, The Holiest of All, Chapter 103, Sarah, Faith in the Faithfulness of God"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Our union with the race as the last Adam began historically at Bethlehem and ended at the cross and the tomb.", "source": "Watchman Nee, The Normal Christian Life, chapter: His Death and Resurrection, Representative and Inclusive"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "He Who was born out from God shows what is the necessity for and the nature of being born of the Spirit if the will of God is to be done on the earth as it is done in the heavens.", "source": "T. Austin-Sparks, In Christ, chapter: Christ to be Expressed Through Believers"}], "declarations": ["I declare: Jesus, born at Bethlehem, is the eternal Ruler of my life.", "I declare: The divine life revealed in Christ now lives in me."], "prayer": "Lord Jesus, eternal Ruler born at Bethlehem, I worship You. Rule in my heart today. Amen.", "theme_flag": "theme-based: Murray, Nee, Sparks"}, {"day": 117, "ref": "Micah 6:8", "book": "Micah", "chapter": 6, "verse": 8, "text": "He hath shewed thee, O man, what is good; and what doth the LORD require of thee, but to do justly, and to love mercy, and to walk humbly with thy God?", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "After this He lays before them, in detail, the universal wickedness that reigned among them, contrasting their ceremonies with practical righteousness.", "source": "J. N. Darby, Synopsis of the Books of the Bible, Micah chapter 6 (stempublishing.com)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "The word of Micah teaches us that the fruit of the salvation of God is seen chiefly in three things. The new life must be characterized, in my relation to God and His will, by righteousness and doing right; in my relation to my neighbour, by love and beneficence; in relation to myself, by humility and lowliness.", "source": "Andrew Murray, The New Life, chapter XV, Righteousness"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Oh, we need to be sincere and humble, and to open ourselves before God!", "source": "Watchman Nee, The Normal Christian Life, chapter: The Light of God and Knowledge"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Find the man who is kept humble in this way, and yet triumphant in a way which is not explained on a natural ground, and you will find the man who is a giant in spirit.", "source": "T. Austin-Sparks, The Battle for Life, chapter: Paul's Thorn in the Flesh"}], "declarations": ["I declare: I walk humbly with my God, doing justly and loving mercy.", "I declare: My life shows the fruit of God's salvation today."], "prayer": "Lord Jesus, teach me to walk humbly with You. Make my life just, merciful, and lowly. Amen.", "theme_flag": "theme-based: Nee, Sparks"}, {"day": 118, "ref": "Nahum 1:7", "book": "Nahum", "chapter": 1, "verse": 7, "text": "The LORD is good, a strong hold in the day of trouble; and he knoweth them that trust in him.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "He is good; He is a stronghold in the day of trouble. When the evil and the judgment overflow, He is Himself the sure refuge of all that trust in Him.", "source": "J. N. Darby, Synopsis of the Books of the Bible, Nahum (stempublishing.com)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "The truly waiting ones will all say, The LORD is good unto them that wait for him. If you want to fully know the goodness of God, give yourself more than ever to a life of waiting on Him.", "source": "Andrew Murray, Waiting on God, Day 24, To Know His Goodness"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Then life once again shall flow, stronger than before, breaking through every stronghold of the enemy.", "source": "Watchman Nee, The Spiritual Man, chapter: (6) Ebbing of the Spirit"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "So for all the future of His work He prayed that His disciples might abide in Him.", "source": "T. Austin-Sparks, In Christ, chapter: Christ to be Expressed Through Believers"}], "declarations": ["I declare: The Lord is my stronghold in the day of trouble.", "I declare: God is good to me, and I am safe as I wait on Him."], "prayer": "Lord Jesus, my refuge and stronghold, I hide in You today. You are good to those who trust You. Amen.", "theme_flag": "theme-based: Murray, Nee, Sparks"}, {"day": 119, "ref": "Habakkuk 2:4", "book": "Habakkuk", "chapter": 2, "verse": 4, "text": "Behold, his soul which is lifted up is not upright in him: but the just shall live by his faith.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "The oppressor was not upright, but the portion of the just was to live by faith, and by faith he should live.", "source": "J. N. Darby, Synopsis of the Books of the Bible, Habakkuk chapter 2 (stempublishing.com)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "It says that the righteous shall live by faith: the whole life of the righteous, from moment to moment, shall be by faith.", "source": "Andrew Murray, The New Life, chapter XXVI, The Life of Faith"}, {"name": "Watchman Nee", "short": "Nee", "comment": "We live by faith and not by joy.", "source": "Watchman Nee, The Spiritual Man, chapter: The Life of Faith"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "We receive the benefit of it as a gift by faith and are justified.", "source": "T. Austin-Sparks, In Christ, Chapter 2, In the Likeness of His Death"}], "declarations": ["I declare: The just shall live by faith, and I live by faith today.", "I declare: I walk by faith in Christ, not by what I feel."], "prayer": "Lord Jesus, I choose to live by faith today. Strengthen my trust in You moment by moment. Amen.", "theme_flag": "theme-based: Nee, Sparks"}, {"day": 120, "ref": "Habakkuk 3:18", "book": "Habakkuk", "chapter": 3, "verse": 18, "text": "Yet I will rejoice in the LORD, I will joy in the God of my salvation.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "He concludes his prophecy with the blessed result of all these precious lessons, namely, the expression of perfect confidence in Jehovah. He would rejoice and be glad in Him, if all the blessing should fail.", "source": "J. N. Darby, Synopsis of the Books of the Bible, Habakkuk chapter 3 (stempublishing.com)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Christians, who would walk according to the will of the Lord, hear what His word says: Finally, my brethren, rejoice in the Lord. Rejoice in the Lord always: again, I will say, Rejoice. In the Lord Jesus there is joy unspeakable, and full of glory.", "source": "Andrew Murray, The New Life, chapter XXXII, Light And Joyfulness"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Nothing can save the situation except to rejoice in the Lord, rejoice in what God is and how He is our Savior.", "source": "Watchman Nee, The Spiritual Man, chapter: A Cool Spirit"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "We are looking for it, and we are hastening unto it, and we shall hail it with joy. The cry is in our hearts: Even so, come, Lord Jesus.", "source": "T. Austin-Sparks, The Battle for Life, chapter: Received Up in Glory"}], "declarations": ["I declare: I rejoice in the Lord always, even when blessings fail.", "I declare: My joy is in Christ, and no circumstance can take it."], "prayer": "Lord Jesus, I rejoice in You today. You are my joy and my salvation, whatever I face. Amen.", "theme_flag": "theme-based: Murray, Nee, Sparks"}, {"day": 121, "ref": "Zephaniah 3:14", "book": "Zephaniah", "chapter": 3, "verse": 14, "text": "¶ Sing, O daughter of Zion; shout, O Israel; be glad and rejoice with all the heart, O daughter of Jerusalem.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "The address to the remnant, and their character, are stated with exquisite beauty.", "source": "J. N. Darby, Synopsis of the Books of the Bible, Zephaniah, Conclusion (stempublishing.com)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "I love Thee, O Lord, my strength; I will sing of Thy strength: unto Thee, O my strength, will I sing praises.", "source": "Andrew Murray, The New Life, chapter XX, Power And Weakness"}, {"name": "Watchman Nee", "short": "Nee", "comment": "The note of hallelujah must never be in short supply in the spirit of the believer.", "source": "Watchman Nee, The Spiritual Man, chapter: A Cool Spirit"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "It comes with the power of a revelation, and for a while we rejoice in its light, talk about nothing else, and find that it works.", "source": "T. Austin-Sparks, In Christ, Chapter 3, In the Likeness of His Resurrection"}], "declarations": ["I declare: I sing and rejoice, for my God has taken away my judgments.", "I declare: Hallelujah fills my spirit today; I will praise the Lord."], "prayer": "Lord Jesus, I sing to You with joy today. You have removed my shame and I rejoice in You. Amen.", "theme_flag": "theme-based: Murray, Nee, Sparks"}, {"day": 122, "ref": "Zephaniah 3:17", "book": "Zephaniah", "chapter": 3, "verse": 17, "text": "The LORD thy God in the midst of thee is mighty; he will save, he will rejoice over thee with joy; he will rest in his love, he will joy over thee with singing.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Jehovah's delight in them is stated with exquisite beauty.", "source": "J. N. Darby, Synopsis of the Books of the Bible, Zephaniah, Conclusion (stempublishing.com)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "God delights in nothing but His beloved Son, and can be satisfied with nothing else in those who draw nigh to Him.", "source": "Andrew Murray, The Deeper Christian Life, chapter 1"}, {"name": "Watchman Nee", "short": "Nee", "comment": "He takes no pleasure in transforming us into automata; rather does He delight in having us cooperate with Him.", "source": "Watchman Nee, The Spiritual Man, chapter: Something to Guard against in Spiritual Warfare"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "It pleased God to reveal his Son in me. Gal. 1:16.", "source": "T. Austin-Sparks, The School of Christ, chapter: The Pre-eminent Mark of a Life Governed by the Spirit"}], "declarations": ["I declare: The LORD my God is mighty in my midst, and He rejoices over me.", "I declare: I am God's delight, and He rests in His love for me."], "prayer": "Lord Jesus, mighty in my midst, I rest in Your delight over me today. Quiet me with Your love. Amen.", "theme_flag": "theme-based: Murray, Nee, Sparks"}, {"day": 123, "ref": "Haggai 2:7", "book": "Haggai", "chapter": 2, "verse": 7, "text": "And I will shake all nations, and the desire of all nations shall come: and I will fill this house with glory, saith the LORD of hosts.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "He would shake all things, and the object of desire to all nations should come; and the house which they were now rebuilding should be filled with glory by the Lord.", "source": "J. N. Darby, Synopsis of the Books of the Bible, Haggai (stempublishing.com)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "In Him, the unspeakable gift, all other gifts are treasured up, the gift of wisdom and knowledge too.", "source": "Andrew Murray, Abide in Christ, Day 7"}, {"name": "Watchman Nee", "short": "Nee", "comment": "God's desire is for sons who shall be joint-heirs with Christ in glory.", "source": "Watchman Nee, The Normal Christian Life, chapter: They Are All of One"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "He is quietly, without sound of axe or hammer, putting His elect stones into a spiritual temple, a heavenly house.", "source": "T. Austin-Sparks, In Christ, Chapter 4, Ascension and Glory"}], "declarations": ["I declare: Christ, the desire of all nations, has come, and He fills my life with glory.", "I declare: I am a living stone in God's house, built for His glory."], "prayer": "Lord Jesus, desire of the nations, fill Your house with glory today. Build my life into Your temple. Amen.", "theme_flag": "theme-based: Murray, Nee, Sparks"}, {"day": 124, "ref": "Zechariah 2:10", "book": "Zechariah", "chapter": 2, "verse": 10, "text": "¶ Sing and rejoice, O daughter of Zion: for, lo, I come, and I will dwell in the midst of thee, saith the LORD.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "The daughter of Zion should sing with joy, for Jehovah would dwell in the midst of her.", "source": "J. N. Darby, Synopsis of the Books of the Bible, Zechariah chapter 2 (stempublishing.com)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "With Christ abiding in you, the Holy Spirit sheds abroad the love of God in your heart.", "source": "Andrew Murray, Abide in Christ, Chapter 26"}, {"name": "Watchman Nee", "short": "Nee", "comment": "The Spirit of the enthroned Lord flows into the spirit of the believer, who is on the earth yet not of the world.", "source": "Watchman Nee, The Spiritual Man, chapter: (4) Sinking of the Spirit"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "This is a deliberate course taken by God with us.", "source": "T. Austin-Sparks, In Christ, Chapter 3, In the Likeness of His Resurrection"}], "declarations": ["I declare: The Lord dwells in the midst of me, and I sing with joy.", "I declare: Christ abides in me, and His love fills my heart."], "prayer": "Lord Jesus, dwell in the midst of my life today. I rejoice that You are with me. Amen.", "theme_flag": "theme-based: Murray, Nee, Sparks"}, {"day": 125, "ref": "Zechariah 9:9", "book": "Zechariah", "chapter": 9, "verse": 9, "text": "¶ Rejoice greatly, O daughter of Zion; shout, O daughter of Jerusalem: behold, thy King cometh unto thee: he is just, and having salvation; lowly, and riding upon an ass, and upon a colt the foal of an ass.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "The King of Zion comes unto her. He is just, and brings in Himself power and salvation, lowly and riding upon an ass.", "source": "J. N. Darby, Synopsis of the Books of the Bible, Zechariah chapter 9 (stempublishing.com)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Learn of Me; for I am meek and lowly of heart, and ye shall find rest for your souls. Jesus offers Himself as Teacher.", "source": "Andrew Murray, Humility, Chapter 4, Humility in the Teaching of Jesus"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Take my yoke upon you, and learn from me; for I am gentle and lowly in heart, and you will find rest for your souls. Matt. 11:29.", "source": "Watchman Nee, The Spiritual Man, chapter: God's Aim"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "This does not mean that He emptied Himself of Deity, but of its rights for the time being.", "source": "T. Austin-Sparks, The School of Christ, Chapter 1, A Final Word and Exhortation"}], "declarations": ["I declare: My King comes to me, just and lowly, bringing salvation.", "I declare: I learn from Christ the meek and lowly, and I find rest."], "prayer": "Lord Jesus, lowly King, I welcome You today. Teach me Your meekness and give me rest. Amen.", "theme_flag": "theme-based: Murray, Nee, Sparks"}, {"day": 126, "ref": "Zechariah 11:12", "book": "Zechariah", "chapter": 11, "verse": 12, "text": "And I said unto them, If ye think good, give me my price; and if not, forbear. So they weighed for my price thirty pieces of silver.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Verses 12 and 13 relate the price at which the nation estimated their King and their Saviour.", "source": "J. N. Darby, Synopsis of the Books of the Bible, Zechariah chapter 11 (stempublishing.com)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "It is to take away sin that God gave His Son, that Jesus gave Himself.", "source": "Andrew Murray, The New Life, chapter X"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Jesus poured out His soul to death and committed His spirit, in which was God's life, back into the hands of God.", "source": "Watchman Nee, The Spiritual Man, chapter: The Dividing of Spirit and Soul"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Then we follow Him on into the garden and to the Cross.", "source": "T. Austin-Sparks, The Battle for Life, chapter: The Persistent Assault Upon Life"}], "declarations": ["I declare: My Saviour was valued and sold, yet He gave Himself for me.", "I declare: I am bought with a price; I belong to Christ."], "prayer": "Lord Jesus, You were priced and sold for my sake. I give myself wholly to You today. Amen.", "theme_flag": "theme-based: Murray, Nee, Sparks"}, {"day": 127, "ref": "Zechariah 11:13", "book": "Zechariah", "chapter": 11, "verse": 13, "text": "And the LORD said unto me, Cast it unto the potter: a goodly price that I was prised at of them. And I took the thirty pieces of silver, and cast them to the potter in the house of the LORD.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "The fulfilment of this is known to all. The prophet here performs the thing prophetically, marking that so it was to be according to the counsels of God. We see also that Christ appears here as Jehovah Himself.", "source": "J. N. Darby, Synopsis of the Books of the Bible, Zechariah chapter 11 (stempublishing.com)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "The Cross of Christ does not make God love us; it is the outcome and measure of His love to us.", "source": "Andrew Murray, With Christ in the School of Prayer, Sixth Lesson"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Upon announcing that He would be betrayed and die on the cross, He was again troubled in spirit. John 13:21.", "source": "Watchman Nee, The Spiritual Man, chapter: Calvary's Judgment"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "We can say that God's purpose is that there shall come a time when He has a vessel in which and through which His glory shines forth to this universe.", "source": "T. Austin-Sparks, The School of Christ, chapter: The Purpose of God"}], "declarations": ["I declare: Christ is Jehovah Himself, and all God's counsels stand sure.", "I declare: I am a vessel for God's glory, shaped by His hand."], "prayer": "Lord Jesus, You are Jehovah my God. Shape me as the Potter shapes the clay today. Amen.", "theme_flag": "theme-based: Murray, Nee, Sparks"}, {"day": 128, "ref": "Zechariah 12:10", "book": "Zechariah", "chapter": 12, "verse": 10, "text": "And I will pour upon the house of David, and upon the inhabitants of Jerusalem, the spirit of grace and of supplications: and they shall look upon me whom they have pierced, and they shall mourn for him, as one mourneth for his only son, and shall be in bitterness for him, as one that is in bitterness for his firstborn.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Grace then goes farther, and presents to the people the Messiah whom they had pierced. The Rejected One is the Jehovah that delivers them.", "source": "J. N. Darby, Synopsis of the Books of the Bible, Zechariah chapter 12 (stempublishing.com)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "When you pray, you can reckon upon His leading: The Spirit helpeth our infirmities. He leads us to what we must desire.", "source": "Andrew Murray, The New Life, chapter XXIII"}, {"name": "Watchman Nee", "short": "Nee", "comment": "The prophet Zechariah called attention to him whom they have pierced. Zech. 12:10.", "source": "Watchman Nee, The Spiritual Man, chapter: Calvary's Judgment"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Then in virtue of His precious Blood which is sprinkled all the way from the altar right through to the Most Holy Place, in virtue of that precious Blood there is a way of life.", "source": "T. Austin-Sparks, The School of Christ, chapter: The Altar"}], "declarations": ["I declare: I look on Him whom they pierced, and I receive His grace.", "I declare: The pierced Messiah is my Jehovah who delivers me."], "prayer": "Lord Jesus, pierced for me, I look to You today. Pour out Your Spirit of grace on me. Amen.", "theme_flag": "theme-based: Sparks"}, {"day": 129, "ref": "Zechariah 13:7", "book": "Zechariah", "chapter": 13, "verse": 7, "text": "¶ Awake, O sword, against my shepherd, and against the man that is my fellow, saith the LORD of hosts: smite the shepherd, and the sheep shall be scattered: and I will turn mine hand upon the little ones.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "It is the sword of Jehovah, which awakes against the man who is His companion, His equal. When Christ is looked at in His humiliation as man, He is treated by the Spirit as the equal of Jehovah in His rights.", "source": "J. N. Darby, Synopsis of the Books of the Bible, Zechariah chapter 13 (stempublishing.com)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "In Gal. 2 and 6 of our being crucified with Christ, being crucified to the world, in Phil. 3 of our being made conformable to His death.", "source": "Andrew Murray, The Holiest of All, Chapter 98, Faith, The Sense for the Unseen"}, {"name": "Watchman Nee", "short": "Nee", "comment": "He cried out, My God, my God, why hast thou forsaken me? Matt. 27:46. His spirit was split asunder from God.", "source": "Watchman Nee, The Spiritual Man, chapter: Calvary's Judgment"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "They were intended to break His union with the Father and get Him out into a realm where He could be smitten.", "source": "T. Austin-Sparks, The Battle for Life, chapter: The Persistent Assault Upon Life"}], "declarations": ["I declare: The Shepherd was smitten for me, and I am gathered to Him.", "I declare: I am crucified with Christ, and I live by His life."], "prayer": "Lord Jesus, smitten Shepherd, I thank You for bearing the sword for me. Hold me close today. Amen.", "theme_flag": "theme-based: Murray, Nee, Sparks"}, {"day": 130, "ref": "Malachi 3:1", "book": "Malachi", "chapter": 3, "verse": 1, "text": "Behold, I will send my messenger, and he shall prepare the way before me: and the Lord, whom ye seek, shall suddenly come to his temple, even the messenger of the covenant, whom ye delight in: behold, he shall come, saith the LORD of hosts.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "John the Baptist is announced as His messenger to prepare the way before Him; and then, the Angel of the covenant, whom they so earnestly desired, should come.", "source": "J. N. Darby, Synopsis of the Books of the Bible, Malachi (stempublishing.com)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "That Christ as our Leader and Forerunner has rent asunder the veil, and in the power of His blood has taken possession and secured access into the Holiest of All, does not mean only that we are to enter heaven when we die.", "source": "Andrew Murray, The Holiest of All, Chapter 4, The Son, The Glory of His Work"}, {"name": "Watchman Nee", "short": "Nee", "comment": "The messenger delivers his message out of his spirit, and the hearer receives God's Word with his.", "source": "Watchman Nee, The Spiritual Man, chapter: Spiritual Power"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "In speaking, the messenger can see by the faces before him where repetition or reemphasis or fuller elucidation is called for.", "source": "T. Austin-Sparks, The School of Christ, Preface to the Third and Revised Edition"}], "declarations": ["I declare: The Lord whom I seek comes to His temple; I prepare the way for Him.", "I declare: Christ my Forerunner has opened the way into God's presence."], "prayer": "Lord Jesus, come to Your temple today. Prepare my heart to receive You. Amen.", "theme_flag": "theme-based: Murray, Nee, Sparks"}, {"day": 131, "ref": "Malachi 3:10", "book": "Malachi", "chapter": 3, "verse": 10, "text": "Bring ye all the tithes into the storehouse, that there may be meat in mine house, and prove me now herewith, saith the LORD of hosts, if I will not open you the windows of heaven, and pour you out a blessing, that there shall not be room enough to receive it.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Let Israel then return unto Jehovah, and Jehovah would return unto them. They had but to return and prove the goodness of God.", "source": "J. N. Darby, Synopsis of the Books of the Bible, Malachi (stempublishing.com)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Let your faith receive and hold fast the answer as given: it shall turn out according to your faith.", "source": "Andrew Murray, The New Life, chapter XXXIV, Prayer"}, {"name": "Watchman Nee", "short": "Nee", "comment": "The Lord Jesus was laying down one thing as a basis of all service: that you pour out all you have, your very self, unto Him.", "source": "Watchman Nee, The Normal Christian Life, chapter: Waste"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "The last Adam, a life-giving spirit. 1 Cor. 15:45.", "source": "T. Austin-Sparks, In Christ, chapter: In Christ"}], "declarations": ["I declare: I bring my whole self to God, and He opens heaven over me.", "I declare: I prove God's goodness today, and He pours out blessing."], "prayer": "Lord Jesus, I return to You with all I have. Pour out Your blessing on me today. Amen.", "theme_flag": "theme-based: Nee, Sparks"}, {"day": 132, "ref": "Malachi 4:2", "book": "Malachi", "chapter": 4, "verse": 2, "text": "¶ But unto you that fear my name shall the Sun of righteousness arise with healing in his wings; and ye shall go forth, and grow up as calves of the stall.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "But to those that feared the name of Jehovah, the Sun of Righteousness should rise, a day which God would cause to shine by the presence of His Son, by the reign of His Beloved One on the earth.", "source": "J. N. Darby, Synopsis of the Books of the Bible, Malachi (stempublishing.com)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "The joyful light of the morning awakens the birds to their song and gladdens the watchers who in the darkness have longed for the day.", "source": "Andrew Murray, The New Life, chapter XXXII, Light And Joyfulness"}, {"name": "Watchman Nee", "short": "Nee", "comment": "We are told that in the future kingdom the Lord Jesus is to be the sun of righteousness with healing in its wings. Mal. 4:2.", "source": "Watchman Nee, The Spiritual Man, chapter: The Powers of the Age to Come"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "In him was life; and the life was the light of men. John 1:4.", "source": "T. Austin-Sparks, The School of Christ, Chapter 3, Learning by Revelation"}], "declarations": ["I declare: The Sun of Righteousness has risen on me with healing in His wings.", "I declare: I walk in the light of Christ, and darkness cannot hold me."], "prayer": "Lord Jesus, Sun of Righteousness, rise on me today. Heal me and fill me with Your light. Amen.", "theme_flag": "theme-based: Murray, Sparks"}, {"day": 133, "ref": "Matthew 1:21", "book": "Matthew", "chapter": 1, "verse": 21, "text": "And she shall bring forth a son, and thou shalt call his name JESUS: for he shall save his people from their sins.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "That is to say, the heir of David, Jesus the Saviour of His people, and Emmanuel.", "source": "J. N. Darby, Synopsis of the Books of the Bible, Matthew chapter 1 (/home/hatch/workspace/darby-commentary/text/40-matthew.txt)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Let us hold it fast. Jesus saves through taking away sin.", "source": "Andrew Murray, The New Life, chapter X"}, {"name": "Watchman Nee", "short": "Nee", "comment": "The name of God's Son is Jesus which means he will save his people from their sins. Matt. 1:21.", "source": "Watchman Nee, The Spiritual Man, chapter: Regeneration"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "The power of the saints becomes greater through their growth in grace and in the knowledge of our Lord and Saviour, Jesus Christ.", "source": "T. Austin-Sparks, The Battle for Life, Chapter 7, The Divine Purpose in the Continuation of the Conflict"}], "declarations": ["I declare: Jesus saves me from my sins; His name is my salvation.", "I declare: I grow in the grace and knowledge of my Lord and Saviour today."], "prayer": "Lord Jesus, my Saviour, thank You for saving me from my sins. I trust Your name today. Amen.", "theme_flag": "theme-based: Sparks"}, {"day": 134, "ref": "Matthew 1:23", "book": "Matthew", "chapter": 1, "verse": 23, "text": "Behold, a virgin shall be with child, and shall bring forth a son, and they shall call his name Emmanuel, which being interpreted is, God with us.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Born of a woman, born under the law, heir to all the rights of David according to the flesh, also the Son of God, Jehovah the Saviour, God with His people.", "source": "J. N. Darby, Synopsis of the Books of the Bible, Matthew chapter 1 (/home/hatch/workspace/darby-commentary/text/40-matthew.txt)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "He gave Him, in His birth as man, in order to be for ever one with us.", "source": "Andrew Murray, The New Life, chapter VI, God's Gift Of His Son"}, {"name": "Watchman Nee", "short": "Nee", "comment": "We all have the same Christ dwelling within, but revelation of some new need will lead us spontaneously to trust Him to live out His life in us in that particular.", "source": "Watchman Nee, The Normal Christian Life, chapter: Christ Our Life"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Lo, I am with you always, even unto the consummation of the age.", "source": "T. Austin-Sparks, In Christ, chapter: Christ to be Expressed Through Believers"}], "declarations": ["I declare: Emmanuel, God with us, is with me today and always.", "I declare: Christ dwells in me, and I am never alone."], "prayer": "Lord Jesus, Emmanuel, I thank You that You are with me. Live Your life through me today. Amen.", "theme_flag": "theme-based: Murray, Nee, Sparks"}, {"day": 135, "ref": "Matthew 4:4", "book": "Matthew", "chapter": 4, "verse": 4, "text": "But he answered and said, It is written, Man shall not live by bread alone, but by every word that proceedeth out of the mouth of God.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Man doth not live by bread only, but by every word that proceedeth out of the mouth of God.", "source": "J. N. Darby, Synopsis of the Books of the Bible, Matthew chapter 4 (/home/hatch/workspace/darby-commentary/text/40-matthew.txt)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "The heavenly life must have heavenly food; nothing less than Jesus Himself is the bread of life: He that eateth Me shall live by Me.", "source": "Andrew Murray, The New Life, chapter III, The Lord's Supper"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Man shall not live by bread alone, but by every word that proceeds from the mouth of God. Matt. 4:4.", "source": "Watchman Nee, The Spiritual Man, chapter: God as the Life of the Body"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Jesus therefore said to those Jews that had believed him, If ye abide in my word, then are ye truly my disciples, and ye shall know the truth, and the truth shall make you free.", "source": "T. Austin-Sparks, The School of Christ, Chapter 2, Learning the Truth"}], "declarations": ["I declare: I live by every word from the mouth of God, not by bread alone.", "I declare: Jesus is my bread of life; I feed on Him today."], "prayer": "Lord Jesus, my bread of life, feed me with Your word today. I live by You. Amen.", "theme_flag": "theme-based: Sparks"}, {"day": 136, "ref": "Matthew 5:3", "book": "Matthew", "chapter": 5, "verse": 3, "text": "Blessed are the poor in spirit: for theirs is the kingdom of heaven.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "In examining the beatitudes, we shall find that this portion in general gives the character of Christ Himself.", "source": "J. N. Darby, Synopsis of the Books of the Bible, Matthew chapter 5 (/home/hatch/workspace/darby-commentary/text/40-matthew.txt)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "The poor, who have nothing in themselves, to them the kingdom comes.", "source": "Andrew Murray, Humility, Chapter 4, Humility in the Teaching of Jesus"}, {"name": "Watchman Nee", "short": "Nee", "comment": "The poor in spirit views himself as possessing nothing.", "source": "Watchman Nee, The Spiritual Man, chapter: A Lowly Spirit"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Nicodemus, you have nothing to give, you must be born again; I cannot take you at the point at which you come to Me!", "source": "T. Austin-Sparks, The School of Christ, Chapter 8, The Governing Law, The Glory of God"}], "declarations": ["I declare: I am poor in spirit, and the kingdom of heaven is mine.", "I declare: Having nothing in myself, I receive everything in Christ."], "prayer": "Lord Jesus, I come to You empty today. Fill me with Your kingdom. Amen.", "theme_flag": "theme-based: Sparks"}, {"day": 137, "ref": "Matthew 5:8", "book": "Matthew", "chapter": 5, "verse": 8, "text": "Blessed are the pure in heart: for they shall see God.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "This description, as we have seen, is essentially the character of Christ Himself.", "source": "J. N. Darby, Synopsis of the Books of the Bible, Matthew chapter 5 (/home/hatch/workspace/darby-commentary/text/40-matthew.txt)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Through cleansing we obtain the blessing of a pure heart; a heart in which the Spirit can complete His operations with a view to sanctifying us, and revealing God within us.", "source": "Andrew Murray, The New Life, chapter XIII"}, {"name": "Watchman Nee", "short": "Nee", "comment": "We do not rely upon the soul to execute God's will, rather we perform His will from the soul, that is, with our whole heart.", "source": "Watchman Nee, The Spiritual Man, chapter: The Soul under the Spirit's Control"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "We may think our desire is a perfectly pure and right one, and it may be utterly false; and so with our will, just the same.", "source": "T. Austin-Sparks, The School of Christ, Chapter 2, The Need for a True Foundation"}], "declarations": ["I declare: In Christ I have a pure heart, and I shall see God.", "I declare: I serve God with my whole heart today."], "prayer": "Lord Jesus, purify my heart today. I want to see God and do His will fully. Amen.", "theme_flag": "theme-based: Nee, Sparks"}, {"day": 138, "ref": "Matthew 5:14", "book": "Matthew", "chapter": 5, "verse": 14, "text": "Ye are the light of the world. A city that is set on an hill cannot be hid.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "It was the purpose of God that they should be the light of the world.", "source": "J. N. Darby, Synopsis of the Books of the Bible, Matthew chapter 5 (/home/hatch/workspace/darby-commentary/text/40-matthew.txt)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "It is the light of God's countenance that gives the Christian his gladness: in fellowship with his Lord, he can, and always will, be happy.", "source": "Andrew Murray, The New Life, chapter XXXII, Light And Joyfulness"}, {"name": "Watchman Nee", "short": "Nee", "comment": "The more he communes the brighter the heavenly light shines.", "source": "Watchman Nee, The Spiritual Man, chapter: When Christians Become affectionately attached to"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "I am the light of the world: he that followeth me shall not walk in the darkness, but shall have the light of life. John 8:12.", "source": "T. Austin-Sparks, The School of Christ, Chapter 5, The Light of Life"}], "declarations": ["I declare: I am the light of the world in Christ, and I shine today.", "I declare: The light of Christ in me drives out all darkness."], "prayer": "Lord Jesus, Light of the world, shine through me today. Let Your light be seen in my life. Amen.", "theme_flag": "theme-based: Murray, Nee, Sparks"}, {"day": 139, "ref": "Matthew 5:16", "book": "Matthew", "chapter": 5, "verse": 16, "text": "Let your light so shine before men, that they may see your good works, and glorify your Father which is in heaven.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "A candle is not lighted in order to be hidden.", "source": "J. N. Darby, Synopsis of the Books of the Bible, Matthew chapter 5 (/home/hatch/workspace/darby-commentary/text/40-matthew.txt)"}, {"name": "Andrew Murray", "short": "Murray", "comment": "To children, who let your light shine before men, so that they may glorify your Father in heaven.", "source": "Andrew Murray, With Christ in the School of Prayer, Sixth Lesson"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Light has one law: It shines wherever it is admitted. That is the only requirement.", "source": "Watchman Nee, The Normal Christian Life, chapter: The Light of God and Knowledge"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "As the light burns, it is a constant declaration of victory, and that, a victory over death, which would seek to smother the flame.", "source": "T. Austin-Sparks, The Battle for Life, chapter: The Undying Flame"}], "declarations": ["I declare: I let my light shine before men, and my Father is glorified.", "I declare: My good works point the world to God today."], "prayer": "Lord Jesus, let Your light burn bright in me today. May all I do bring glory to the Father. Amen.", "theme_flag": "theme-based: Darby, Murray, Nee, Sparks"}, {"day": 140, "ref": "Matthew 6:9", "book": "Matthew", "chapter": 6, "verse": 9, "text": "After this manner therefore pray ye: Our Father which art in heaven, Hallowed be thy name.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Jesus puts His disciples in connection with His Father, as their Father. He reveals to them the Father's name, in order that they may be in relation with Him, and that they may act in accordance with that which He is.", "source": "Darby's Synopsis, Matthew 6"}, {"name": "Andrew Murray", "short": "Murray", "comment": "In condescension to our weakness, our heavenly Teacher has given us the very words we are to take with us as we draw near to our Father. We have in them a form of prayer in which there breathe the freshness and fulness of the Eternal Life.", "source": "With Christ in the School of Prayer"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Christians have a basic right while living on earth today, the right to receive answers to prayers.", "source": "CW Vol.48 ch.10 'Prayer'"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Do you want to know Him as Father? The Lord Jesus carried in His heart a great longing for the glory He once had with the Father.", "source": "Open Windows, Feb 9 (The Alpha and the Omega)"}], "declarations": ["I declare: My Father in heaven hears me when I pray.", "I declare: I come to my Father with confidence and reverence."], "prayer": "Lord Jesus, teach me to pray as You taught Your disciples. Let me know the Father as You know Him, and draw near with a true heart.", "theme_flag": "theme-based: Sparks"}, {"day": 141, "ref": "Matthew 6:21", "book": "Matthew", "chapter": 6, "verse": 21, "text": "For where your treasure is, there will your heart be also.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "They were to be a divine savour where God was known and was dealing, and would be a spectacle to the whole world. Their confession was to be so open that the world should refer their works to the Father.", "source": "Darby's Synopsis, Matthew 6"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Abiding in Him, you have Christ the wisdom of God leading your whole spiritual life. In Him you are, and in Him the wisdom is; dwelling in Him, you dwell in the very fountain of all light.", "source": "Abide in Christ"}, {"name": "Watchman Nee", "short": "Nee", "comment": "The heart always follows the treasure. We cannot change this.", "source": "CW Set 3 Vol.50 ch.53"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "In Christ are all the treasures of wisdom and knowledge hidden.", "source": "Open Windows, Jun 10 (On Knowing the Lord)"}], "declarations": ["I declare: My heart follows my treasure, and my treasure is Christ.", "I declare: I lay up treasure in heaven where nothing can corrupt."], "prayer": "Lord Jesus, You are my treasure. Turn my heart fully toward You, and let nothing on earth rival Your place in me.", "theme_flag": "theme-based: Murray, Sparks"}, {"day": 142, "ref": "Matthew 6:33", "book": "Matthew", "chapter": 6, "verse": 33, "text": "But seek ye first the kingdom of God, and his righteousness; and all these things shall be added unto you.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Jesus appears before them invested with this power. The Lord had announced the coming kingdom, and with the present power of goodness, having overcome the adversary; and then shews what were the true characters according to which it would be set up, and who could enter, and how.", "source": "Darby's Synopsis, Matthew 5-7"}, {"name": "Andrew Murray", "short": "Murray", "comment": "As he looks at the Cross, and Christ suffering there, the Righteous One for the unrighteous, he sees in that atoning death the only but sufficient foundation for his faith. The righteousness which Christ brings becomes his very own.", "source": "Abide in Christ"}, {"name": "Watchman Nee", "short": "Nee", "comment": "The present spiritual condition of the believers enables them to reign in the future.", "source": "CW Vol.15 ch.7"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Have you got a heart for the Kingdom of God? Really, is this a heart matter?", "source": "Open Windows, Dec 9 (That They May All Be One, Meeting 6)"}], "declarations": ["I declare: I seek first the kingdom of God and His righteousness.", "I declare: All I need is added unto me as I seek Him first."], "prayer": "Lord Jesus, be my first pursuit. Teach me to seek Your kingdom above all else, trusting You for every need.", "theme_flag": "theme-based: Murray, Sparks"}, {"day": 143, "ref": "Matthew 7:7", "book": "Matthew", "chapter": 7, "verse": 7, "text": "¶ Ask, and it shall be given you; seek, and ye shall find; knock, and it shall be opened unto you:", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "The confidence in God which became them. The energy that should characterise them, in order that they might enter into the kingdom.", "source": "Darby's Synopsis, Matthew 7"}, {"name": "Andrew Murray", "short": "Murray", "comment": "God hears prayer. This simplest view of prayer is taken throughout Scripture. Ask and it shall be given, Jesus says.", "source": "With Christ in the School of Prayer"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Prayer is not only for spiritual cultivation but even more for receiving answers from God.", "source": "CW Vol.48 ch.10 'Prayer'"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Our prayer life has got to be on a heavenly basis.", "source": "Open Windows, Sep 21 (The Altar of Incense)"}], "declarations": ["I declare: I ask and it shall be given me.", "I declare: I seek and I find, I knock and the door is opened."], "prayer": "Lord Jesus, You bid me ask. Give me boldness to come, and faith to receive what I ask according to Your will.", "theme_flag": "theme-based: Sparks"}, {"day": 144, "ref": "Matthew 9:13", "book": "Matthew", "chapter": 9, "verse": 13, "text": "But go ye and learn what that meaneth, I will have mercy, and not sacrifice: for I am not come to call the righteous, but sinners to repentance.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "The Lord declares the mind of God on this subject, and His own mission. He came to call sinners; He would have mercy. It was God in grace, and not man with his pretended righteousness counting on his merits.", "source": "Darby's Synopsis, Matthew 9"}, {"name": "Andrew Murray", "short": "Murray", "comment": "We need this power, not only for work, but for our daily life. What are we to expect when the Holy Spirit is duly acknowledged and received?", "source": "The Deeper Christian Life"}, {"name": "Watchman Nee", "short": "Nee", "comment": "Christ came to earth to bear the judgment of our sins and suffer their consequences in order that we may be forgiven.", "source": "CW Vol.27 ch.9 'Forgiveness of sins'"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "We may speak and act wrongly, but for every Christian there is a refuge, a mercy seat.", "source": "Open Windows, Jul 5 (The On-High Calling, Ch.5)"}], "declarations": ["I declare: Christ came to call sinners, not the righteous.", "I declare: I receive His mercy, and I show mercy."], "prayer": "Lord Jesus, You came for sinners like me. Let Your mercy flow through me to others who need it.", "theme_flag": "theme-based: Murray, Sparks"}, {"day": 145, "ref": "Matthew 10:32", "book": "Matthew", "chapter": 10, "verse": 32, "text": "Whosoever therefore shall confess me before men, him will I confess also before my Father which is in heaven.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Christ was to be more precious than father or mother, and even than a man's own life. He who would save his life at the expense of his testimony to Christ should lose it; he who would lose it for the sake of Christ should gain it.", "source": "Darby's Synopsis, Matthew 10"}, {"name": "Andrew Murray", "short": "Murray", "comment": "How can we glorify God? Simply by allowing His glory to shine out through us, by yielding ourselves to Him, that His glory may manifest itself in us and through us to the world.", "source": "The True Vine"}, {"name": "Watchman Nee", "short": "Nee", "comment": "As true Christians, they have life in Christ, and they have a testimony before men.", "source": "Sit, Walk, Stand ('Redeeming the Time')"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "By that inflammation and ache the Holy Spirit is giving a positive witness against this thing.", "source": "Open Windows, Oct 6 (The Cup and The Fire, Ch.3)"}], "declarations": ["I declare: I confess Christ before men without shame.", "I declare: He will confess me before His Father in heaven."], "prayer": "Lord Jesus, give me courage to own You openly. Let my life confess You before all men.", "theme_flag": "theme-based: Murray, Nee, Sparks"}, {"day": 146, "ref": "Matthew 11:28", "book": "Matthew", "chapter": 11, "verse": 28, "text": "¶ Come unto me, all ye that labour and are heavy laden, and I will give you rest.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "In the midst of a world of evil Jesus remained the sole revealer of the Father, the source of all good. He calls all those who are weary and heavy laden. He knew, and He alone could heal them.", "source": "Darby's Synopsis, Matthew 11"}, {"name": "Andrew Murray", "short": "Murray", "comment": "It is to you who have heard and hearkened to the call, Come unto me, that this new invitation comes, Abide in me. The message comes from the same loving Saviour.", "source": "Abide in Christ"}, {"name": "Watchman Nee", "short": "Nee", "comment": "The Lord Jesus asks us not to work but to come and rest.", "source": "CW Vol.17 ch.11 'The two rests'"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Jesus has appropriated the Sabbath to Himself. It is no longer a day of the week, it is a Divine Person.", "source": "Open Windows, Mar 22 (Discipleship In The School Of Christ, Ch.5)"}], "declarations": ["I declare: I come to Christ, and He gives me rest.", "I declare: My heavy burdens are lifted by Him."], "prayer": "Lord Jesus, I am weary and heavy laden. I come to You now, and receive Your rest for my soul.", "theme_flag": null}, {"day": 147, "ref": "Matthew 11:29", "book": "Matthew", "chapter": 11, "verse": 29, "text": "Take my yoke upon you, and learn of me; for I am meek and lowly in heart: and ye shall find rest unto your souls.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Christ had just manifested the most entire submission to His Father, and had found therein perfect rest to His soul. For He was meek and lowly in heart, content to be in the lowest place at the will of His God.", "source": "Darby's Synopsis, Matthew 11"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Let us listen to His teaching. There we shall hear how He speaks of humility, and how far He expects men, and specially His disciples, to be humble as He was.", "source": "Humility"}, {"name": "Watchman Nee", "short": "Nee", "comment": "If we would be like our Lord who accepts all kinds of restriction without any struggling, we would have rest.", "source": "CW Vol.17 ch.11 'The two rests'"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "The impulsive, hot, fiery Moses has to become the quiet, patient, meek Moses.", "source": "Open Windows, Jan 24 (The Cross and the Way of Life, Ch.7)"}], "declarations": ["I declare: I take His yoke upon me and learn of Him.", "I declare: He is meek and lowly in heart, and I find rest."], "prayer": "Lord Jesus, meek and lowly in heart, teach me Your gentleness. Let me learn of You and find rest unto my soul.", "theme_flag": "theme-based: Sparks"}, {"day": 148, "ref": "Matthew 11:30", "book": "Matthew", "chapter": 11, "verse": 30, "text": "For my yoke is easy, and my burden is light.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Take my yoke upon you, and learn of me, that is to say, the yoke of entire submission to His Father's will. In fact nothing can overthrow one who is there. It is the place of perfect rest to the heart.", "source": "Darby's Synopsis, Matthew 11"}, {"name": "Andrew Murray", "short": "Murray", "comment": "They did not know how entire the consecration was that Jesus claims, how He claims the undivided allegiance of the whole heart and life.", "source": "Abide in Christ"}, {"name": "Watchman Nee", "short": "Nee", "comment": "He knows how to apportion His yoke; He knows our strength. We can be at rest.", "source": "CW Vol.17 ch.11 'The two rests'"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "Remember that you are in the Land; you are in Christ; you have Him as your Rest.", "source": "Open Windows, Jan 2 (The Essential Newness of the New Creation, Ch.4)"}], "declarations": ["I declare: His yoke is easy and His burden is light.", "I declare: I walk with Him in perfect rest."], "prayer": "Lord Jesus, Your yoke is easy. I lay down my striving and walk with You in lightness of heart.", "theme_flag": "theme-based: Murray, Sparks"}, {"day": 149, "ref": "Matthew 16:24", "book": "Matthew", "chapter": 16, "verse": 24, "text": "¶ Then said Jesus unto his disciples, If any man will come after me, let him deny himself, and take up his cross, and follow me.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "The Lord teaches His disciples that the only path, the appointed and necessary path, is the cross; if any one would follow Him, that is the path He took. What would it profit a man to save his life and lose all, to gain the world and lose his soul?", "source": "Darby's Synopsis, Matthew 16"}, {"name": "Andrew Murray", "short": "Murray", "comment": "He had left his boats and his nets, but not his old self. If any man will come after me, let him deny himself, and take up his cross, and follow me.", "source": "Absolute Surrender"}, {"name": "Watchman Nee", "short": "Nee", "comment": "He must be willing to be conformed to the Lord's death.", "source": "CW Vol.01 ch.7 'The soul-life'"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "As for me, may I never boast about anything except the cross of our Lord Jesus Christ.", "source": "Open Windows, Jan 11 (The Altar Governs Everything)"}], "declarations": ["I declare: I deny myself, take up my cross, and follow Him.", "I declare: I lose my life for His sake and find it."], "prayer": "Lord Jesus, I choose the path of the cross. Let self be denied, and let me follow You wholly.", "theme_flag": "theme-based: Sparks"}, {"day": 150, "ref": "Matthew 18:20", "book": "Matthew", "chapter": 18, "verse": 20, "text": "For where two or three are gathered together in my name, there am I in the midst of them.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "Two or three really gathered together in the name of Jesus act with His authority, and enjoy His privileges with the Father, for Jesus Himself is there in their midst.", "source": "Darby's Synopsis, Matthew 18"}, {"name": "Andrew Murray", "short": "Murray", "comment": "God seeks intercessors. From time to time He sought and found and honoured intercessors, for whose sake He spared or blessed His people.", "source": "The Ministry of Intercession"}, {"name": "Watchman Nee", "short": "Nee", "comment": "The basic requirement for brothers and sisters to pray together is to be in one accord.", "source": "CW Vol.48 ch.13 'Various kinds of meetings'"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "The thing that God is doing in this dispensation is the formation of a spiritual and heavenly Israel.", "source": "Open Windows, Jun 5 (The On-High Calling, Ch.1)"}], "declarations": ["I declare: Where two or three gather in His name, He is there.", "I declare: I meet Him in the midst of His people."], "prayer": "Lord Jesus, You are in our midst. Meet us as we gather in Your name, and make Your presence known.", "theme_flag": "theme-based: Murray, Sparks"}, {"day": 151, "ref": "Matthew 19:14", "book": "Matthew", "chapter": 19, "verse": 14, "text": "But Jesus said, Suffer little children, and forbid them not, to come unto me: for of such is the kingdom of heaven.", "witnesses": [{"name": "John Nelson Darby", "short": "Darby", "comment": "He then renews His instruction with respect to children, while testifying His affection for them. According to the glory of the world, a child had no value. It is of value in the Lord's eyes.", "source": "Darby's Synopsis, Matthew 19"}, {"name": "Andrew Murray", "short": "Murray", "comment": "Believer, thou wouldest abide in Christ: only believe. Believe always; believe now. Bow even now before thy Lord, and say to Him in childlike faith that thou wilt this day abide in Him.", "source": "Abide in Christ"}, {"name": "Watchman Nee", "short": "Nee", "comment": "The Son of God had become sin and had borne the judgment.", "source": "CW Vol.28 ch.6 'The work of Christ - redemption'"}, {"name": "T. Austin-Sparks", "short": "Sparks", "comment": "God stands by His children and only works with them on the basis of an inward relationship.", "source": "Open Windows, Mar 14 (Christ Our All, Ch.9)"}], "declarations": ["I declare: Of such is the kingdom of heaven.", "I declare: I come to Him with childlike faith."], "prayer": "Lord Jesus, receive me as a little child. Give me a simple, trusting heart toward You.", "theme_flag": "theme-based: Murray, Sparks"}, {"day": 152, "ref": "Matthew 22:37", "book": "Matthew", "chapter": 22, "verse": 37, "text": "Jes
