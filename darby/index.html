<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Listening Shelf</title>
<style>
:root{--bg:#0d1a33;--panel:#12233f;--ink:#e9e2d2;--muted:#8fa0c2;--gold:#d4a017;--line:#2a3d66;}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,'Times New Roman',serif;}
header{background:linear-gradient(160deg,#132a52,#0d1a33);border-bottom:2px solid var(--gold);padding:34px 22px;text-align:center;}
.series{color:var(--muted);letter-spacing:.35em;font-size:12px;text-transform:uppercase;}
h1{font-size:30px;margin:10px 0 4px;color:var(--gold);font-weight:normal;letter-spacing:.02em;}
.tag{color:var(--muted);font-style:italic;font-size:14px;}
.gbtn{background:transparent;color:var(--gold);border:1px solid var(--gold);border-radius:10px;padding:12px 24px;font-size:16px;cursor:pointer;font-family:inherit;margin-top:16px;}
.shelf{max-width:1000px;margin:0 auto;padding:26px 22px 0;}
.shelf h2{color:var(--gold);font-weight:normal;font-size:21px;border-bottom:1px solid var(--line);padding-bottom:8px;margin:26px 0 4px;}
.shelf .abio{color:var(--muted);font-size:13px;font-style:italic;margin:0 0 12px;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin:14px 0 10px;}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;cursor:pointer;transition:border-color .2s;}
.card:hover{border-color:var(--gold);}
.card .t{font-size:16px;line-height:1.35;}
.card .m{color:var(--muted);font-size:12px;margin-top:8px;font-style:italic;}
#reader{display:none;max-width:760px;margin:0 auto;padding:20px 22px 120px;}
.bar{position:sticky;top:0;background:rgba(13,26,51,.97);padding:10px 0;display:flex;gap:8px;flex-wrap:wrap;z-index:10;border-bottom:1px solid var(--line);}
.bar button{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px 14px;font-size:15px;cursor:pointer;font-family:inherit;}
.bar button:hover{border-color:var(--gold);color:var(--gold);}
.rtitle{font-size:24px;color:var(--gold);margin:18px 0 2px;font-weight:normal;}
.rauthor{color:var(--muted);font-style:italic;font-size:14px;margin-bottom:16px;}
h3.sec{color:var(--gold);font-size:19px;margin:26px 0 10px;font-weight:normal;border-bottom:1px solid var(--line);padding-bottom:6px;}
p.body{font-size:17px;line-height:1.75;margin:0 0 14px;text-align:left;}
#listenbar{position:fixed;left:0;right:0;bottom:0;background:rgba(13,26,51,.97);border-top:1px solid var(--line);padding:10px 14px;display:flex;gap:10px;align-items:center;z-index:20;}
#listenbar button{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:9px 14px;font-size:15px;cursor:pointer;font-family:inherit;}
#listenbar select{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 6px;font-size:13px;max-width:130px;font-family:inherit;}
#llabel{flex:1;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pdnote{max-width:1000px;margin:0 auto;padding:0 22px 30px;color:var(--muted);font-size:12px;font-style:italic;}
.acard{display:flex;gap:18px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;margin:0 0 14px;cursor:pointer;}
.acard:hover{border-color:var(--gold);}
.mono{width:64px;height:64px;border-radius:50%;background:linear-gradient(140deg,#e0b32a,#8a6410);color:#0d1a33;font-size:22px;display:flex;align-items:center;justify-content:center;flex:none;font-family:Georgia,serif;}
.acard .an{font-size:20px;}
.acard .ad{color:var(--muted);font-size:13px;margin-top:2px;letter-spacing:.06em;}
.acard .as{color:var(--muted);font-size:13px;font-style:italic;margin-top:6px;}
.acard .chev{margin-left:auto;color:var(--gold);font-size:24px;flex:none;}
.abio{font-size:15px;line-height:1.7;max-width:660px;font-style:italic;color:var(--ink);margin:6px 0 18px;}
.astat{color:var(--muted);font-size:13px;letter-spacing:.08em;text-transform:uppercase;margin:18px 0 10px;}
.wrow{display:flex;gap:14px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:0 0 10px;cursor:pointer;}
.wrow:hover{border-color:var(--gold);}
.wrow .wt{font-size:16px;flex:1;}
.wrow .wm{color:var(--muted);font-size:12px;font-style:italic;white-space:nowrap;}
.backlink{background:none;border:none;color:var(--gold);font-size:15px;cursor:pointer;font-family:inherit;padding:0;margin-bottom:14px;}
@media print{header,.shelf,#listenbar,.bar,.pdnote{display:none !important;}#reader{display:block !important;}}
</style></head>
<body>
<header>
  <div class="series">The Old Saints Library</div>
  <h1>The Listening Shelf</h1>

  <div class="rauthor" id="rauthor"></div>
  <div id="rbody"></div>
</div>

  <div id="llabel"></div>
  <select id="lvoice" onchange="setVoice()" title="Voice"></select>
  <button id="lrate" onclick="cycleRate()">1x</button>
  <button onclick="listenStop()">&#9632;</button>
</div>

    '<div style="color:var(--muted);font-size:13px;letter-spacing:.06em;">' + esc(a.dates) + '</div>' +
    '<div class="abio">' + esc(a.bio) + '</div>' +
    '<div><button class="gbtn" style="margin:0;" onclick="listenAuthor(' + vi + ',' + ai + ')">&#9654; Listen to all of ' + esc(a.name) + '</button></div>' +
    '<div class="astat">' + a.titles.length + ' works &middot; ' + hours(a.words) + '</div>';
  v.innerHTML = htm;
  a.titles.forEach(function(t, ti){
    var bi = a.start + ti, b = BOOKS[bi];
    var r = document.createElement('div'); r.className = 'wrow';
    r.innerHTML = '<div class="wt">' + esc(b.title) + '</div>' +
      '<div class="wm">' + words(b.words) + ' words</div>' +
      '<div style="color:var(--gold)">&#8250;</div>';
    r.onclick = (function(i){ return function(){ openBook(i); }; })(bi);
    v.appendChild(r);
  });
  window.scrollTo(0, 0);
}
function locate(i){
  for(var vi=0; vi<VEINS.length; vi++){
    var vn = VEINS[vi];
    for(var ai=0; ai<vn.authors.length; ai++){
      var a = vn.authors[ai];
      if(i >= a.start && i < a.start + a.titles.length) return {v:vi, a:ai};
    }
  }
  return {v:0, a:0};
}
function backFromReader(){ showAuthor(curV, curA); }
function openBook(i){
  cur = i;
  var b = BOOKS[i];
  var loc = locate(i); curV = loc.v; curA = loc.a;
  hideShelves();
  document.querySelector('.pdnote').style.display = 'none';
  var r = document.getElementById('reader'); r.style.display = 'block';
  document.getElementById('rtitle').textContent = b.title;
  document.getElementById('rauthor').textContent = b.author + (b.year ? ' (' + b.year + ')' : '');
  var pdfbtn = document.getElementById('pdfbtn');
  if(b.pdf){ pdfbtn.style.display = ''; pdfbtn.onclick = function(){ window.open(b.pdf, '_blank'); }; }
  else { pdfbtn.style.display = 'none'; }
  var body = document.getElementById('rbody'); body.innerHTML = '';
  body.innerHTML = '<p class="body" style="color:var(--muted);">Loading text...</p>';
  getBlocks(i, function(blocks){
    if(cur !== i) return;
    body.innerHTML = '';
    blocks.forEach(function(bl){
      var el = document.createElement(bl[0] === 'h' ? 'h3' : 'p');
      if(bl[0] === 'h') el.className = 'sec'; else el.className = 'body';
      el.textContent = bl[1];
      body.appendChild(el);
    });
    window.scrollTo(0, 0);
  });
  updateListenUI();
}
function stepBook(d){ openBook((cur + d + BOOKS.length) % BOOKS.length); }
showVeins();
// ---- Book texts load on demand (keeps the app shell small) ----
var BLOCKCACHE = {};
function getBlocks(i, cb){
  var b = BOOKS[i];
  if(b.blocks){ cb(b.blocks); return; }
  if(BLOCKCACHE[i]){ cb(BLOCKCACHE[i]); return; }
  fetch('data/book-' + i + '.json').then(function(r){ return r.json(); }).then(function(bl){
    BLOCKCACHE[i] = bl; cb(bl);
  }).catch(function(){ cb([]); });
}
// ---- Listen engine: continuous play across the whole shelf ----
var synth = ('speechSynthesis' in window) ? window.speechSynthesis : null;
var L = {book:-1, chunks:[], ci:0, playing:false, rate:1, tok:0, end:0};
var wakeLock = null;
function lockScreen(){
  try{
    if('wakeLock' in navigator && navigator.wakeLock.request){
      navigator.wakeLock.request('screen').then(function(l){ wakeLock = l; }).catch(function(){});
    }
  }catch(e){}
}
function unlockScreen(){ try{ if(wakeLock){ wakeLock.release(); wakeLock = null; } }catch(e){} }
document.addEventListener('visibilitychange', function(){
  if(document.visibilityState === 'visible' && L.playing) lockScreen();
});
function keepAwake(){
  try{
    if(L.ac) return;
    var AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    var ctx = new AC();
    var src = ctx.createBufferSource();
    src.buffer = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
    var g = ctx.createGain(); g.gain.value = 0;
    src.connect(g); g.connect(ctx.destination);
    src.loop = true; src.start();
    L.ac = ctx;
  }catch(e){}
}
function buildChunksFrom(blocks){
  var out = [], sec = '';
  blocks.forEach(function(bl){
    if(bl[0] === 'h'){ sec = bl[1]; out.push({t: bl[1], sec: sec}); return; }
    var parts = bl[1].match(/[^.!?;]+[.!?;]+|[^.!?;]*$/g) || [bl[1]];
    var buf = '';
    parts.forEach(function(p){
      if((buf + p).length > 240){ out.push({t: buf, sec: sec}); buf = p; }
      else buf += p;
    });
    if(buf.trim()) out.push({t: buf, sec: sec});
  });
  return out;
}
function saveListen(){ try{ var o = {book:L.book, ci:L.ci, mode:L.mode || 'tts'}; if(o.mode === 'audio'){ o.apart = L.apart || 0; try{ o.atime = audioEl().currentTime || 0; }catch(e){ o.atime = 0; } } localStorage.setItem('shelf-listen', JSON.stringify(o)); }catch(e){} }
function loadListen(){ try{ return JSON.parse(localStorage.getItem('shelf-listen') || '{}'); }catch(e){ return {}; } }
// ---- Real-audio engine (pre-generated narration); TTS is the fallback ----
var AU = {el:null, lastSave:0};
function audioEl(){
  if(!AU.el){
    var el = new Audio();
    el.preload = 'auto';
    el.onended = audioEnded;
    el.ontimeupdate = function(){
      if(L.mode === 'audio' && L.playing){
        var now = Date.now();
        if(now - AU.lastSave > 8000){ AU.lastSave = now; saveListen(); updateListenUI(); }
      }
    };
    el.onerror = function(){ audioEnded(); };
    AU.el = el;
  }
  return AU.el;
}
function fmtTime(s){
  if(!isFinite(s) || s < 0) return '';
  s = Math.floor(s);
  var h = Math.floor(s/3600), m = Math.floor((s%3600)/60), sec = s%60;
  function p(n){ return (n<10?'0':'')+n; }
  return (h ? h+':' : '') + p(m) + ':' + p(sec);
}
function startAudio(bi, part, time, end){
  var b = BOOKS[bi];
  if(!b.audio || !b.audio.length){ startTTS(bi, 0, end); return; }
  keepAwake(); lockScreen();
  L.tok++;
  try{ synth.cancel(); }catch(e){}
  var el = audioEl();
  try{ el.pause(); }catch(e){}
  L.mode = 'audio'; L.book = bi; L.apart = part || 0;
  L.end = end || BOOKS.length; L.playing = true;
  el.playbackRate = L.rate;
  el.src = b.audio[L.apart];
  if(cur !== bi) openBook(bi);
  el.onloadedmetadata = function(){ try{ if(time) el.currentTime = time; }catch(e){} };
  el.play().then(function(){ updateListenUI(); }).catch(function(){ L.playing = false; updateListenUI(); });
  updateListenUI();
}
function audioEnded(){
  if(!L.playing || L.mode !== 'audio') return;
  var b = BOOKS[L.book];
  if(L.apart < b.audio.length - 1){ startAudio(L.book, L.apart + 1, 0, L.end); return; }
  if(L.book < L.end - 1){ startListen(L.book + 1, 0, L.end); return; }
  listenStop();
}
function speakChunk(){
  if(!L.playing || L.mode === 'audio') return;
  var my = L.tok;
  if(L.ci >= L.chunks.length){
    if(L.book < L.end - 1){ startListen(L.book + 1, 0, L.end); return; }
    listenStop(); return;
  }
  var c = L.chunks[L.ci];
  var u = new SpeechSynthesisUtterance(c.t);
  u.rate = L.rate;
  try{
    var want = null;
    try{ want = localStorage.getItem('shelf-voice'); }catch(e){}
    var vs = synth.getVoices();
    var v = null;
    if(want) v = vs.filter(function(x){ return x.name === want; })[0];
    if(!v) v = vs.filter(function(x){ return x.lang && x.lang.toLowerCase().indexOf('en') === 0; })[0];
    if(v) u.voice = v;
  }catch(e){}
  u.onend = function(){ if(my !== L.tok) return; L.ci++; saveListen(); speakChunk(); updateListenUI(); };
  u.onerror = function(){ if(my !== L.tok) return; L.ci++; speakChunk(); };
  try{ synth.speak(u); }catch(e){ L.ci++; speakChunk(); }
  updateListenUI();
}
function startListen(bi, ci, end){
  var b = BOOKS[bi];
  if(b.audio && b.audio.length){ startAudio(bi, 0, 0, end); return; }
  startTTS(bi, ci, end);
}
function startTTS(bi, ci, end){
  if(!synth){ alert('Sorry, this device cannot read aloud.'); return; }
  keepAwake(); lockScreen();
  L.tok++;
  var my = L.tok;
  try{ synth.cancel(); }catch(e){}
  try{ audioEl().pause(); }catch(e){}
  L.mode = 'tts';
  L.book = bi; L.ci = ci || 0;
  L.end = end || BOOKS.length; L.playing = true; L.chunks = [];
  if(cur !== bi) openBook(bi);
  updateListenUI();
  getBlocks(bi, function(blocks){
    if(my !== L.tok || !L.playing || L.mode !== 'tts') return;
    L.chunks = buildChunksFrom(blocks);
    if(L.ci >= L.chunks.length) L.ci = 0;
    speakChunk();
  });
}
function listenToggle(){
  if(L.playing){
    L.playing = false; L.tok++;
    if(L.mode === 'audio'){ try{ audioEl().pause(); }catch(e){} }
    else { try{ synth.cancel(); }catch(e){} }
    unlockScreen(); saveListen(); updateListenUI(); return;
  }
  var bi = (cur >= 0) ? cur : 0;
  var s = loadListen();
  if(typeof s.book === 'number' && s.book >= 0 && s.book < BOOKS.length){ bi = s.book; }
  var b = BOOKS[bi];
  if(b.audio && b.audio.length){
    if(L.mode === 'audio' && L.book === bi && L.apart < b.audio.length){
      L.playing = true; lockScreen();
      audioEl().play().catch(function(){});
      updateListenUI(); return;
    }
    var part = 0, time = 0;
    if(s.mode === 'audio' && s.book === bi){ part = s.apart || 0; time = s.atime || 0; }
    if(part >= b.audio.length) part = 0;
    startAudio(bi, part, time, BOOKS.length); return;
  }
  if(!synth){ alert('Sorry, this device cannot read aloud.'); return; }
  var ci = s.ci || 0;
  if(L.mode !== 'audio' && L.book === bi && L.chunks.length && L.ci < L.chunks.length){
    L.playing = true; L.mode = 'tts'; lockScreen(); speakChunk(); return;
  }
  startTTS(bi, ci, BOOKS.length);
}
function listenAll(){
  var bi = 0, s = loadListen();
  if(typeof s.book === 'number' && s.book >= 0 && s.book < BOOKS.length){ bi = s.book; }
  var b = BOOKS[bi];
  if(b.audio && b.audio.length && s.mode === 'audio' && s.book === bi){
    startAudio(bi, s.apart || 0, s.atime || 0, BOOKS.length); return;
  }
  startListen(bi, s.ci || 0, BOOKS.length);
}
function listenAuthor(vi, ai){
  var a = VEINS[vi].authors[ai];
  startListen(a.start, 0, a.start + a.titles.length);
}
function listenVein(vi){
  var vn = VEINS[vi];
  startListen(vn.start, 0, vn.end);
}
function listenStop(){
  L.playing = false; L.tok++;
  try{ if(synth) synth.cancel(); }catch(e){}
  try{ if(AU.el) AU.el.pause(); }catch(e){}
  unlockScreen();
  L.ci = 0;
  document.getElementById('listenbar').style.display = 'none';
  updateListenUI();
}
function cycleRate(){
  var rs = [1, 1.25, 1.5, 1.75, 2, 2.5, 3, 0.75];
  L.rate = rs[(rs.indexOf(L.rate) + 1) % rs.length];
  document.getElementById('lrate').textContent = L.rate + 'x';
  if(L.mode === 'audio'){ try{ audioEl().playbackRate = L.rate; }catch(e){} return; }
  if(L.playing){ L.tok++; try{ synth.cancel(); }catch(e){} speakChunk(); }
}
function populateVoices(){
  if(!synth) return;
  var sel = document.getElementById('lvoice');
  var vs = synth.getVoices().filter(function(x){ return x.lang && x.lang.toLowerCase().indexOf('en') === 0; });
  if(!vs.length) return;
  var want = null;
  try{ want = localStorage.getItem('shelf-voice'); }catch(e){}
  sel.innerHTML = '';
  vs.forEach(function(v){
    var o = document.createElement('option');
    o.value = v.name; o.textContent = v.name;
    if(v.name === want) o.selected = true;
    sel.appendChild(o);
  });
}
function setVoice(){
  var sel = document.getElementById('lvoice');
  try{ localStorage.setItem('shelf-voice', sel.value); }catch(e){}
  if(L.playing){ L.tok++; try{ synth.cancel(); }catch(e){} speakChunk(); }
}
if(synth){
  populateVoices();
  if(typeof speechSynthesis.onvoiceschanged !== 'undefined') speechSynthesis.onvoiceschanged = populateVoices;
}
function updateListenUI(){
  var bar = document.getElementById('listenbar');
  var btn = document.getElementById('listenbtn');
  var active = L.playing || L.chunks.length || L.mode === 'audio';
  if(active){
    bar.style.display = 'flex';
    var b = BOOKS[L.book] || {title:'', author:''};
    if(L.mode === 'audio' && b.audio){
      var n = b.audio.length, t = '', d = '';
      try{ t = fmtTime(audioEl().currentTime); d = fmtTime(audioEl().duration); }catch(e){}
      document.getElementById('llabel').textContent =
        b.title + ' - Part ' + ((L.apart || 0) + 1) + '/' + n + (t ? '  ' + t + (d ? ' / ' + d : '') : '');
    } else {
      var c = L.chunks[Math.min(L.ci, L.chunks.length - 1)] || {sec:''};
      var pct = L.chunks.length ? Math.round(100 * L.ci / L.chunks.length) : 0;
      document.getElementById('llabel').textContent = b.author + ' - ' + b.title + (c.sec ? ' - ' + c.sec : '') + '  ' + pct + '%';
    }
    document.getElementById('lplay').innerHTML = L.playing ? '&#10074;&#10074;' : '&#9654;';
  } else {
    bar.style.display = 'none';
  }
  if(btn) btn.innerHTML = L.playing ? '&#10074;&#10074; Pause' : '&#9654; Listen';
}
</script></body></html>
